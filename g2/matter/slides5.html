= 바닷물을 마실 물로? | 생각 열기
* 🌊 바닷물 :: 짜서 그대로 마실 수 없다
* 🏝️ 무인도 :: 냄비, 비닐, 컵만 있다
* ☀️ 햇볕 :: 하루 종일 뜨겁다
? 무인도에서 바닷물로 마실 물을 얻으려면 어떻게 해야 할까? :: 바닷물을 데워 물만 증발시키고, 수증기를 비닐에서 식혀(액화) 모으면 된다 — 끓는점 차이를 이용한 증류의 원리.

## 끓는점 차이 | 증류

= 증류
! 끓는점이 낮은 물질이 먼저 끓어 나오고, 이를 ==냉각==해 모은다
- 이용하는 차이: **끓는점**
+ 물(100 °C)과 에탄올(78 °C) → 에탄올이 먼저 나온다.
+ 예: 바닷물 → 식수, 원유 분리, 소주 만들기
>+ 원유를 증류탑에서 가열하면 끓는점에 따라 LPG, 휘발유, 등유, 경유, 중유로 나뉜다.

= 시뮬레이션: 혼합물의 분리 | 실험실
@ sim.html#sep | 네 가지 분리 방법을 차례로 실행하며 어떤 특성의 차이를 이용하는지 정리하자.
% 증류 → 분별 깔때기 → 재결정 순서로 학습지 표를 채움. 크로마토그래피는 2022 개정 교육과정에서 빠졌으므로 다루지 않는다.

= 물과 에탄올 혼합물의 가열 곡선 (예)
C 두 번의 완만한 구간: A 에탄올, B 물 | 가열 시간 (분) | 온도 (°C) | 혼합물:0,20 3,76 5,80 7,86 9,96 11,100 14,100
~ A 구간(약 78 °C 부근)에서는 주로 에탄올, B 구간(100 °C)에서는 물이 끓어 나온다

## 밀도 · 용해도 | 나머지 두 방법

= 세 가지 분리 방법
| 방법 | 이용하는 차이 | 원리 | 예 |
|+ 증류 | 끓는점 | 낮은 것부터 끓어 나옴 | 바닷물 → 식수 |
|+ 분별 깔때기 | 밀도 | 섞이지 않는 액체, 밀도 큰 것이 아래층 | 물과 식용유 |
|+ 재결정 | 용해도 | 식히면 용해도 차가 큰 물질만 결정으로 | 질산 칼륨 정제 |

= 고체 혼합물의 밀도 차 | 사례
* 🌾 키질 :: 가벼운 쭉정이는 날아가고 무거운 곡식은 남는다
* 🥚 소금물 달걀 :: 신선한 달걀은 가라앉고 오래된 달걀은 뜬다
* 🌱 볍씨 고르기 :: 소금물에 담가 뜨는 쭉정이를 걸러 낸다
* 🛢️ 기름 유출 :: 물 위에 뜬 기름을 흡착포로 걷어 낸다
* 🥇 사금 채취 :: 무거운 금은 접시 바닥에 남는다
* 🧲 쇳가루 :: 자석으로 분리 (자성의 차이)

= 재결정
- 온도에 따라 용해도가 크게 변하는 물질을 뜨거운 물에 녹인 뒤 **식힌다**.
+ 용해도가 줄어든 만큼 그 물질만 **결정**으로 나온다.
+ 조금 섞인 불순물은 양이 적어 용액에 **녹아 있다**.
>+ 활용: 천일염을 녹여 깨끗한 소금 얻기, 질산 칼륨 정제

= 예제 1 · 재결정 | 적용
- 60 °C 물 100 g에 질산 칼륨 110 g과 염화 나트륨 10 g이 녹아 있다. 20 °C로 식히면? (20 °C 용해도: 질산 칼륨 31.6 g, 염화 나트륨 36.0 g)
^+ 질산 칼륨 → 110 − 31.6 = **78.4 g** 석출
^+ 염화 나트륨 → 10 g < 36.0 g → 모두 **녹아 있음**
^+ 거르면 순수한 질산 칼륨 **78.4 g**을 얻는다

= 예제 2 · 알맞은 분리 방법 고르기 | 적용
| 혼합물 | 이용할 특성 차이 | 분리 방법 |
|+ 물과 에탄올 | [[끓는점]] | [[증류]] |
|+ 물과 식용유 | [[밀도]] | [[분별 깔때기]] |
|+ 질산 칼륨에 섞인 소량의 염화 나트륨 | [[용해도]] | [[재결정]] |
|+ 볍씨와 쭉정이 | [[밀도]] | 소금물에 담그기 |

= 예제 3 · 분리 과정 설계 | 적용
- 모래, 소금, 쇳가루가 섞인 혼합물에서 세 물질을 모두 얻자.
^+ ① **자석**으로 쇳가루를 분리한다
^+ ② 남은 혼합물을 **물**에 넣어 소금을 녹인다
^+ ③ **거름** 장치로 걸러 거름종이에 남은 모래를 얻는다
^+ ④ 거른 소금물을 **증발**시켜 소금을 얻는다

= 확인 문제 1
Q 바닷물에서 마실 물을 얻는 방법과 이용하는 특성은?
o 분별 깔때기, 밀도
o* 증류, 끓는점
o 재결정, 용해도
o 거름, 알갱이의 크기
:: 물을 끓여 수증기를 냉각해 모은다.

= 확인 문제 2
Q 물과 식용유의 혼합물을 분리하는 방법은?
o 증류
o* 분별 깔때기
o 재결정
o 거름
:: 섞이지 않는 두 액체를 밀도 차로 분리한다.

= 확인 문제 3
Q 원유를 가열하여 휘발유, 등유, 경유 등으로 분리할 때 이용하는 특성은?
o 밀도
o 용해도
o* 끓는점
o 자성
:: 원유 증류탑은 끓는점 차이를 이용한다.

= 확인 문제 4
Q 재결정으로 순수한 물질을 얻을 수 있는 까닭으로 옳은 것은?
o 끓는점이 낮은 물질이 먼저 끓어 나오기 때문
o 밀도가 큰 물질이 아래로 가라앉기 때문
o* 용액을 식힐 때 온도에 따른 용해도 변화가 큰 물질만 결정으로 나오기 때문
o 자석에 붙는 물질만 분리되기 때문
:: 소량의 불순물은 식혀도 용액에 녹아 있다.

= 서술형 도전 | 생각 넓히기
? 신선한 달걀은 소금물에 가라앉고 오래된 달걀은 뜬다. 이 방법이 이용하는 특성과 원리를 쓰시오. :: 밀도 차이. 오래된 달걀은 속의 수분이 빠지고 공기주머니가 커져 밀도가 작아지므로 소금물보다 밀도가 작아 뜬다.
? 처음의 무인도에서 냄비·비닐·컵으로 마실 물을 얻는 장치를 설계하고, 증류의 원리로 설명하시오. :: 냄비에 바닷물을 담고 가운데 빈 컵을 둔 뒤 비닐로 덮고 가운데에 돌을 올린다. 햇볕에 물이 증발하고, 수증기가 비닐에서 식어 액화한 물방울이 돌 아래로 모여 컵에 떨어진다. 소금은 끓는점이 높아 냄비에 남는다.

= 오늘 배운 내용 정리
- 끓는점 차이 → [[증류]] (바닷물 → 식수, 원유 분리)
- 밀도 차이 → [[분별 깔때기]], 키질, 소금물 달걀
- 용해도 차이 → [[재결정]]
- 혼합물은 성분 물질의 [[특성 차이]]를 이용해 분리한다.

= 나가기 전 한 문제 | 형성평가
? 소주를 만들 때 발효한 술을 증류하면 알코올 농도가 높아지는 까닭을 끓는점으로 쓰시오. :: 에탄올(78 °C)이 물(100 °C)보다 끓는점이 낮아 먼저 끓어 나오므로, 처음 모은 액체에는 에탄올이 많이 들어 있기 때문이다.
