# 물질의 특성과 밀도 | 양이 달라도 변하지 않는 값 | 중학교 과학 2 · 08 물질의 특성 · 1차시 | 2022 개정 교육과정 [9과08-01]

= 오늘의 학습 목표 | 1차시
^ **물질의 특성**의 뜻을 알고 예를 들 수 있다.
^ 질량과 부피를 측정하여 **밀도**를 구할 수 있다.
^ 밀도로 물질을 **구별**하고 뜨고 가라앉는 현상을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 물질의 특성 8분 → 밀도 측정·그래프 15분 → 예제·문항 12분 → 정리 5분

= 진짜 금관일까? | 생각 열기
* 👑 왕관 :: 왕이 금 덩어리를 주고 만든 금관
* 🤔 의심 :: 은을 섞어 금을 빼돌리지 않았을까?
* 🛁 아르키메데스 :: 목욕탕에서 넘치는 물을 보고 "유레카!"
? 금관을 부수지 않고 순수한 금인지 알아내려면 무엇을 재야 할까? :: 질량과 부피를 재서 밀도를 구한다. 금의 밀도와 다르면 다른 금속이 섞인 것이다.
% 넘친 물의 부피 = 왕관의 부피라는 아이디어가 오늘 측정 방법과 같음

= 중1에서 배운 것 | 복습
| 질문 | 답 |
| 질량의 단위와 측정 도구 | [[g, kg / 저울]] |
| 고체 → 액체 변화 | [[융해]] |
| 상태가 변해도 변하지 않는 것 | [[질량]] |
? 같은 물질이면 양이 달라도 같은 값을 갖는 성질이 있을까? :: 있다 — 오늘 배울 '물질의 특성'

## 물질의 특성 | 그 물질만의 고유한 성질

= 물질의 특성이란?
! 다른 물질과 구별되는 그 물질만의 ==고유한== 성질
- 물질의 **양에 관계없이** 일정하다.
| 물질의 특성 O | 물질의 특성 X |
|+ 밀도, 용해도, 녹는점, 끓는점, 색, 냄새, 맛 | 질량, 부피, 길이, 온도 |
>+ 양에 따라 달라지는 값은 물질을 구별하는 데 쓸 수 없다.

## 밀도 | 질량 ÷ 부피

= 밀도
! 밀도 = 질량 ÷ 부피
- 단위: **g/cm³** 또는 **g/mL** (1 cm³ = 1 mL)
+ 같은 부피일 때 질량이 큰 물질일수록 밀도가 크다.
+ 밀도가 큰 물질은 밀도가 작은 물질 **아래로 가라앉는다**.
>+ 기체의 밀도는 온도와 압력에 따라 크게 달라진다.

= 고체의 부피 재기
^+ 눈금실린더에 물 **30 mL**를 넣는다
^+ 시료를 실에 매달아 천천히 넣는다
^+ 늘어난 눈금을 읽는다 → 예: 38 mL
^+ 시료의 부피 = 38 − 30 = **8 cm³**
>+ 아르키메데스의 방법과 같다 — 모양이 불규칙해도 잴 수 있다!

= 시뮬레이션: 밀도 | 실험실
@ sim.html#dens | 같은 물질을 크기별로 측정하고, 다른 물질과 밀도를 비교하자.
% 알루미늄 작게·크게를 먼저 → '크기가 달라도 같은 값' 확인 후 철·구리로

= 측정 결과
| 시료 | 질량 (g) | 부피 (cm³) | 밀도 (g/cm³) |
|+ 알루미늄 (작게) | 10.8 | 4 | 10.8 ÷ 4 = 2.70 |
|+ 알루미늄 (크게) | 32.4 | 12 | 32.4 ÷ 12 = 2.70 |
|+ 철 (중간) | 63.0 | 8 | 63.0 ÷ 8 ≈ 7.87 |
|+ 구리 (중간) | 71.7 | 8 | 71.7 ÷ 8 ≈ 8.96 |
>+ 같은 물질은 크기가 달라도 밀도가 ==같다==.

= 부피-질량 그래프
C 기울기가 클수록 밀도가 크다 | 부피 (cm³) | 질량 (g) | 구리:0,0 4,35.85 8,71.7 | 철:0,0 4,31.5 8,63 | 알루미늄:0,0 4,10.8 8,21.6 12,32.4
~ 원점을 지나는 직선, 기울기 = 질량 ÷ 부피 = 밀도

= 뜨고 가라앉기 | 사례
* 🧊 얼음 :: 0.92 g/cm³ < 물 1.0 → 뜬다
* 🛢️ 기름 유출 :: 기름이 물보다 가벼워 바다 위에 퍼진다
* 🥚 달걀 신선도 :: 신선한 달걀은 가라앉고 오래된 달걀은 뜬다
* 🎈 헬륨 풍선 :: 헬륨이 공기보다 밀도가 작아 떠오른다
* 🍹 층층 음료 :: 시럽 1.3 > 물 1.0 > 식용유 0.9
* 🪨 금 채취 :: 무거운 금가루가 냄비 바닥에 남는다

= 예제 1 · 금속 알아내기 | 적용
- 질량 54 g, 부피 20 cm³인 금속이 있다. (알루미늄 2.7, 철 7.9, 구리 9.0, 금 19.3 g/cm³)
^+ 밀도 = 54 ÷ 20 = **2.7 g/cm³**
^+ 표에서 2.7 → **알루미늄**
>+ 질량이나 부피 하나만으로는 알 수 없고, 둘을 나눈 **밀도**로 구별한다.

= 예제 2 · 질량 구하기 | 적용
- 구리(8.96 g/cm³)로 만든 부피 5 cm³인 열쇠의 질량은?
^+ 질량 = 밀도 × 부피
^+ = 8.96 × 5 = **44.8 g**
^+ 같은 부피의 알루미늄 열쇠라면 2.7 × 5 = **13.5 g**

= 예제 3 · 금관 판별 | 적용
- 질량 965 g인 왕관을 물에 넣었더니 물이 60 mL 넘쳤다. (금 19.3 g/cm³)
^+ 부피 = **60 cm³**
^+ 밀도 = 965 ÷ 60 ≈ **16.1 g/cm³**
^+ 금(19.3)보다 작다 → 밀도가 작은 금속이 **섞였다**
>+ 순금이라면 965 g의 부피는 965 ÷ 19.3 = 50 cm³였어야 한다.

= 확인 문제 1
Q 물질의 특성끼리 고른 것은?
o 질량, 밀도
o* 밀도, 끓는점
o 부피, 녹는점
o 온도, 용해도
:: 질량·부피·온도는 양이나 조건에 따라 달라진다.

= 확인 문제 2
Q 질량 79 g, 부피 10 cm³인 금속의 밀도는?
o 0.79 g/cm³
o 79 g/cm³
o* 7.9 g/cm³
o 790 g/cm³
:: 79 ÷ 10 = 7.9 g/cm³ (철)

= 확인 문제 3
Q 물, 식용유, 시럽을 한 컵에 넣었을 때 맨 아래층은? (시럽 1.3, 물 1.0, 식용유 0.9 g/cm³)
o 식용유
o 물
o* 시럽
o 세 액체가 고르게 섞인다
:: 밀도가 가장 큰 시럽이 가장 아래에 있다.

= 확인 문제 4
Q 같은 알루미늄으로 만든 작은 공과 큰 공에 대한 설명으로 옳은 것은?
o 큰 공의 밀도가 더 크다.
o 작은 공의 밀도가 더 크다.
o* 두 공의 밀도는 같다.
o 질량이 같다.
:: 밀도는 물질의 특성이므로 양에 관계없이 같다.

= 서술형 도전 | 생각 넓히기
? 얼음이 물에 뜨는 까닭을 밀도로 설명하시오. :: 얼음(약 0.92 g/cm³)의 밀도가 물(1.0 g/cm³)보다 작기 때문이다.
? 헬륨 풍선은 떠오르고 입으로 분 풍선은 떨어진다. 두 풍선 속 기체를 공기와 밀도로 비교하여 설명하시오. :: 헬륨은 공기보다 밀도가 작아 떠오른다. 입으로 분 풍선 속 공기는 주변 공기와 밀도가 비슷하거나 조금 크고, 풍선 고무의 무게까지 더해져 떨어진다.

= 오늘 배운 내용 정리
- 다른 물질과 구별되는 고유한 성질 = [[물질의 특성]], 양에 관계없이 일정
- 밀도 = [[질량]] ÷ [[부피]], 단위 g/cm³
- 같은 물질은 크기가 달라도 밀도가 [[같다]].
- 부피-질량 그래프의 [[기울기]] = 밀도
- 밀도가 큰 물질은 밀도가 작은 물질 [[아래]]로 가라앉는다.

= 나가기 전 한 문제 | 형성평가
? 처음의 금관 문제에서, 질량과 부피를 각각 어떻게 재고 어떻게 판별하는지 순서대로 쓰시오. :: 저울로 질량을 재고, 물이 가득 찬 그릇에 넣어 넘친 물의 부피로 왕관의 부피를 잰다. 질량 ÷ 부피로 밀도를 구해 금의 밀도(19.3 g/cm³)와 같으면 순금, 다르면 다른 금속이 섞인 것이다.
