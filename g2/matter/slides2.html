# 용해도 | 얼마나 녹을 수 있을까? | 중학교 과학 2 · 08 물질의 특성 · 2차시 | 2022 개정 교육과정 [9과08-01]

= 오늘의 학습 목표 | 2차시
^ 용해와 관련된 용어(**용매·용질·용액·포화 용액**)를 구별할 수 있다.
^ **용해도**의 뜻을 알고 용해도 곡선을 해석할 수 있다.
^ 용해도를 이용해 **석출량**과 더 녹일 수 있는 양을 계산할 수 있다.
% 흐름: 생각 열기 5분 → 용해와 용해도 10분 → 용해도 곡선 10분 → 계산 예제 10분 → 문항·정리 10분

= 녹지 않고 가라앉은 설탕 | 생각 열기
* 🧊 아이스티 :: 차가운 물에 설탕을 넣었더니 바닥에 쌓인다
* ☕ 따뜻한 차 :: 같은 양의 설탕이 다 녹는다
* 🥤 탄산음료 :: 미지근해지면 김이 빠진다
? 녹을 수 있는 양에는 한계가 있을까? 온도에 따라 달라질까? :: 일정한 양의 용매에 녹을 수 있는 양에는 한계가 있고, 그 한계(용해도)는 온도에 따라 달라진다.

| 질문 | 답 |
| 밀도 | [[질량 ÷ 부피]] |
| 질량 27 g, 부피 10 cm³ | [[2.7 g/cm³]] |
? 밀도가 물질의 특성인 까닭은? :: 물질의 종류마다 다르고 양에 관계없이 일정하기 때문

## 용해와 포화 | 녹이는 것과 녹는 것

= 용해에 쓰이는 말
| 용어 | 뜻 | 소금물에서 |
|+ 용해 | 한 물질이 다른 물질에 녹아 고르게 섞이는 현상 | 소금이 물에 녹음 |
|+ 용매 | 녹이는 물질 | 물 |
|+ 용질 | 녹는 물질 | 소금 |
|+ 용액 | 용매와 용질이 섞인 물질 | 소금물 |
>+ 용액의 질량 = 용매의 질량 + 용질의 질량

= 포화 용액과 불포화 용액
| 구분 | 뜻 |
|+ 포화 용액 | 용질이 최대로 녹아 더 이상 녹지 않는 용액 |
|+ 불포화 용액 | 용질을 더 녹일 수 있는 용액 |
! 용해도 = 일정한 온도에서 용매 100 g에 최대로 녹을 수 있는 용질의 g 수
>+ 용해도는 용질의 ==종류==와 ==온도==에 따라 다르다 → 물질의 특성

## 용해도 곡선 | 온도에 따른 변화

= 시뮬레이션: 용해도 | 실험실
@ sim.html#sol | 물의 온도를 바꾸며 질산 칼륨과 염화 나트륨이 최대로 녹는 양을 확인하자.
% 0 → 80 °C로 올리며 두 물질의 '녹는 양'이 어떻게 다른지 먼저 예측

= 물 100 g에 녹는 최대량 (g)
| 온도 (°C) | 0 | 20 | 40 | 60 | 80 |
|+ 질산 칼륨 | 13.3 | 31.6 | 63.9 | 110 | 169 |
|+ 염화 나트륨 | 35.7 | 36.0 | 36.6 | 37.3 | 38.4 |
>+ 질산 칼륨은 온도에 따라 크게, 염화 나트륨은 거의 변하지 않는다.

= 용해도 곡선
C 물 100 g에 대한 용해도 | 온도 (°C) | 용해도 (g/물 100 g) | 질산 칼륨:0,13.3 20,31.6 40,63.9 60,110 80,169 | 염화 나트륨:0,35.7 20,36 40,36.6 60,37.3 80,38.4
~ 곡선 위의 점 = 포화 용액, 곡선 아래 = 불포화 용액

= 고체와 기체의 용해도
| | 고체 | 기체 |
| 온도가 높을수록 | 대체로 **커진다** | **작아진다** |
| 압력이 높을수록 | 거의 변화 없음 | **커진다** |
>+ 탄산음료는 높은 압력으로 이산화 탄소를 녹여 차갑게 보관한다.

= 생활 속 용해도 | 사례
* 🥤 탄산음료 뚜껑 :: 열면 압력 감소 → 기체 용해도 감소 → 거품
* 🐟 여름 양식장 :: 수온 상승 → 산소 용해도 감소 → 물고기가 수면으로
* 🍯 꿀의 결정 :: 추워지면 용해도가 줄어 당이 결정으로
* 🧂 염전 :: 물을 증발시켜 녹아 있던 소금을 얻는다
* 🫖 뜨거운 차의 설탕 :: 온도가 높아 더 많이 녹는다
* 💎 결정 만들기 :: 포화 용액을 천천히 식혀 큰 결정

## 석출 계산 | 식히면 얼마나 나올까?

= 예제 1 · 냉각하면 석출되는 양 | 적용
- 60 °C 물 100 g에 질산 칼륨 110 g을 녹인 포화 용액을 20 °C로 식혔다.
^+ 60 °C 용해도 **110 g** → 모두 녹아 있음
^+ 20 °C 용해도 **31.6 g** → 이만큼만 녹아 있을 수 있음
^+ 석출량 = 110 − 31.6 = **78.4 g**
>+ 용해도 차이만큼 결정으로 나온다 — 재결정의 원리!

= 예제 2 · 포화일까 불포화일까? | 적용
- 40 °C 물 100 g에 질산 칼륨 50 g을 녹였다.
^+ 40 °C 용해도 **63.9 g**
^+ 50 g < 63.9 g → **불포화 용액**
^+ 더 녹일 수 있는 양 = 63.9 − 50 = **13.9 g**

= 예제 3 · 물의 양이 다를 때 | 적용
- 80 °C 물 50 g에 질산 칼륨을 최대로 녹인 뒤 40 °C로 식혔다.
^+ 80 °C, 물 50 g → 169 × 50/100 = **84.5 g** 녹음
^+ 40 °C, 물 50 g → 63.9 × 50/100 = **31.95 g**만 녹을 수 있음
^+ 석출량 = 84.5 − 31.95 = **52.55 g**
>+ 용해도는 물 100 g 기준 — 물의 양에 비례해서 바꾼다.

= 확인 문제 1
Q 소금물에서 용매와 용질을 바르게 짝 지은 것은?
o 용매: 소금, 용질: 물
o* 용매: 물, 용질: 소금
o 용매: 소금물, 용질: 소금
o 용매: 물, 용질: 소금물
:: 녹이는 물질이 용매, 녹는 물질이 용질이다.

= 확인 문제 2
Q 20 °C 물 200 g에 녹을 수 있는 염화 나트륨의 최대 양은? (20 °C 용해도 36.0)
o 36.0 g
o* 72.0 g
o 18.0 g
o 236 g
:: 물이 2배 → 36.0 × 2 = 72.0 g

= 확인 문제 3
Q 온도를 낮출 때 석출되는 양이 가장 많은 물질은?
o* 질산 칼륨
o 염화 나트륨
o 두 물질이 같다
o 둘 다 석출되지 않는다
:: 온도에 따른 용해도 변화가 큰 물질일수록 많이 석출된다.

= 확인 문제 4
Q 기체의 용해도를 크게 하는 조건은?
o 온도를 높이고 압력을 낮춘다.
o 온도를 높이고 압력을 높인다.
o* 온도를 낮추고 압력을 높인다.
o 온도를 낮추고 압력을 낮춘다.
:: 기체는 낮은 온도, 높은 압력에서 잘 녹는다.

= 서술형 도전 | 생각 넓히기
? 탄산음료의 뚜껑을 따면 거품이 생기고, 미지근해지면 김이 빠진다. 기체의 용해도와 관련지어 설명하시오. :: 뚜껑을 따면 압력이 낮아져 이산화 탄소의 용해도가 줄어 기체가 빠져나오고, 온도가 높아지면 기체의 용해도가 작아져 더 많이 빠져나간다.
? 여름철 양식장 물고기가 수면 가까이 올라와 입을 뻐끔거리는 까닭을 용해도로 설명하시오. :: 수온이 높아지면 물에 녹는 산소의 용해도가 작아져 물속 산소가 부족해지므로, 산소가 비교적 많은 수면 근처로 올라온다.

= 오늘 배운 내용 정리
- 녹이는 물질 = [[용매]], 녹는 물질 = [[용질]], 섞인 물질 = [[용액]]
- 용질이 최대로 녹아 더 녹지 않는 용액 = [[포화 용액]]
- 일정한 온도에서 용매 100 g에 최대로 녹는 용질의 g 수 = [[용해도]]
- 고체의 용해도는 대체로 온도가 높을수록 [[크다]].
- 기체의 용해도는 온도가 [[낮을수록]], 압력이 [[높을수록]] 크다.

= 나가기 전 한 문제 | 형성평가
? 60 °C 물 100 g에 질산 칼륨 63.9 g을 녹인 용액을 40 °C로 식히면 결정이 생길까? 까닭을 용해도로 쓰시오. :: 생기지 않는다. 40 °C에서 질산 칼륨의 용해도가 63.9 g이므로 63.9 g이 모두 녹아 있을 수 있다(포화 용액이 될 뿐 석출되지 않는다).
