## 순물질과 혼합물 | 한 가지냐, 여러 가지냐

= 순물질과 혼합물
| 구분 | 순물질 | 혼합물 |
|+ 뜻 | 한 가지 물질로만 이루어짐 | 두 가지 이상의 순물질이 섞임 |
|+ 특성 | 녹는점·끓는점·밀도가 **일정** | 성분 비율에 따라 **달라진다** |
|+ 예 | 물, 산소, 금, 염화 나트륨 | 소금물, 공기, 우유, 흙탕물, 합금 |

= 혼합물의 종류
* 🥛 불균일 혼합물 :: 성분이 고르지 않게 섞임 — 흙탕물, 우유, 김밥
* 🧂 균일 혼합물 :: 성분이 고르게 섞임 — 소금물, 공기, 식초
* 💍 합금 :: 금속끼리 섞인 균일 혼합물 — 18K 금, 청동, 땜납
>+ 투명하다고 순물질인 것은 아니다! 소금물도 투명한 혼합물이다.

## 끓을 때, 얼 때 | 그래프로 구별하기

= 시뮬레이션: 순물질과 혼합물 | 실험실
@ sim.html#mix | 순수한 물과 소금물을 가열하고 냉각하며 온도 변화를 비교하자.
% '가열' 후 '냉각' 순서로. 두 그래프의 수평 구간 유무를 강조

= 물과 소금물 가열 곡선
C 순수한 물은 100 °C에서 수평, 소금물은 계속 오른다 | 가열 시간 (초) | 온도 (°C) | 소금물:0,20 5,60 10.25,102 15,104.3 20,106.7 | 순수한 물:0,20 5,60 10,100 15,100 20,100
~ 소금물은 물이 증발할수록 진해져 끓는 온도가 계속 높아진다

= 비교 정리
| | 순수한 물 | 소금물 |
|+ 끓기 시작하는 온도 | 100 °C | 100 °C보다 **높다** |
|+ 끓는 동안 온도 | **일정** | 조금씩 **올라간다** |
|+ 얼기 시작하는 온도 | 0 °C | 0 °C보다 **낮다** |
|+ 어는 동안 온도 | **일정** | 조금씩 **내려간다** |
>+ 혼합물은 순수한 용매보다 끓는점이 ==높고==, 어는점이 ==낮다==.

= 생활 속 혼합물의 특성 | 사례
* 🧂 제설제 :: 눈과 섞여 어는점이 낮아짐
* 🌊 바닷물 :: 약 −2 °C에서 언다
* 🚗 부동액 :: 냉각수에 섞어 겨울에도 얼지 않게
* 🔧 땜납 :: 납·주석보다 낮은 온도에서 녹는다
* 🍦 아이스크림 만들기 :: 얼음에 소금을 뿌려 0 °C보다 차갑게
* 🍜 라면 국물 :: 맹물보다 조금 높은 온도에서 끓는다

= 예제 1 · 분류하기 | 적용
- ㄱ. 공기 ㄴ. 증류수 ㄷ. 철 ㄹ. 바닷물 ㅁ. 탄산음료 ㅂ. 산소 ㅅ. 18K 금반지 ㅇ. 이산화 탄소
^+ 한 가지 물질 → 순물질: **ㄴ, ㄷ, ㅂ, ㅇ**
^+ 여러 물질이 섞임 → 혼합물: **ㄱ, ㄹ, ㅁ, ㅅ**
>+ 18K 금 = 금 18 : 다른 금속 6 (24분의 18 = 75 %가 금)

= 예제 2 · 그래프로 판별 | 적용
- 어떤 액체를 가열했더니 98 °C에서 끓기 시작해 온도가 계속 올라 104 °C가 되었다.
^+ 끓는 동안 온도가 **일정하지 않다**
^+ → **혼합물**
^+ 순물질이라면 → 끓는 동안 한 온도에서 **수평**
>+ 끓는점이 100 °C가 아닌 순물질도 있으므로 '온도가 일정한가'로 판단한다.

= 예제 3 · 얼마나 쉽게 얼까? | 적용
- 시뮬레이션에서 순수한 물은 0 °C, 소금물은 −2 °C에서 얼기 시작했다. 바깥 기온이 −1 °C이다.
^+ 순수한 물 → 기온(−1 °C) < 어는점(0 °C) → **언다**
^+ 소금물 → 기온(−1 °C) > 어는점(−2 °C) → **얼지 않는다**
>+ 그래서 제설제를 뿌린 도로는 영하에서도 덜 언다.

= 확인 문제 1
Q 순물질의 특징으로 옳은 것은?
o 성분 비율에 따라 끓는점이 달라진다.
o* 끓는 동안 온도가 일정하다.
o 두 가지 이상의 물질이 섞여 있다.
o 어는점이 항상 0 °C이다.
:: 순물질은 녹는점·끓는점·밀도가 일정하다.

= 확인 문제 2
Q 다음 중 혼합물은?
o 증류수
o 산소
o* 공기
o 이산화 탄소
:: 공기는 질소, 산소 등이 섞인 균일 혼합물이다.

= 확인 문제 3
Q 소금물을 가열할 때의 설명으로 옳은 것은?
o 100 °C에서 끓고 온도가 일정하다.
o 100 °C보다 낮은 온도에서 끓는다.
o* 100 °C보다 높은 온도에서 끓기 시작하고 온도가 조금씩 올라간다.
o 끓지 않는다.
:: 혼합물은 순수한 용매보다 끓는점이 높고 끓는 동안 온도가 변한다.

= 확인 문제 4
Q 겨울철 자동차 냉각수에 부동액을 섞는 까닭은?
o 끓는점을 낮추기 위해
o* 어는점을 낮추어 얼지 않게 하기 위해
o 밀도를 작게 하기 위해
o 순물질로 만들기 위해
:: 혼합물이 되면 어는점이 낮아진다.

= 서술형 도전 | 생각 넓히기
? 겨울철 눈이 내린 도로에 염화 칼슘을 뿌리는 까닭을 혼합물의 특성으로 설명하시오. :: 염화 칼슘이 눈(물)과 섞여 혼합물이 되면 어는점이 0 °C보다 낮아져 영하에서도 잘 얼지 않기 때문이다.
? '순수한 생수'라고 광고하는 물은 과학적으로 순물질일까? 성분표(칼슘, 마그네슘 등)를 근거로 판단하시오. :: 순물질이 아니다. 생수에는 물 외에 칼슘, 마그네슘 등 여러 물질이 녹아 있으므로 혼합물이다.

= 오늘 배운 내용 정리
- 한 가지 물질로만 이루어진 물질 = [[순물질]], 특성이 [[일정]]하다.
- 두 가지 이상의 순물질이 섞인 물질 = [[혼합물]]
- 성분이 고르게 섞임 = [[균일]] 혼합물, 고르지 않음 = 불균일 혼합물
- 혼합물은 순수한 용매보다 끓는점이 [[높고]], 어는점이 [[낮다]].
- 순물질은 끓거나 어는 동안 온도가 [[일정]], 혼합물은 계속 변한다.

= 나가기 전 한 문제 | 형성평가
? 처음의 눈 온 도로에서, 기온이 −5 °C일 때 제설제를 뿌렸는데도 다시 얼었다면 그 까닭을 추론하시오. :: 녹은 물의 양에 비해 제설제가 적어 혼합물의 어는점이 −5 °C보다 높았기 때문이다. 제설제를 더 많이 뿌리면 어는점이 더 낮아진다.
