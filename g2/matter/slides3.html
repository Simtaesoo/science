# 녹는점과 끓는점 | 상태가 변하는 온도 | 중학교 과학 2 · 08 물질의 특성 · 3차시 | 2022 개정 교육과정 [9과08-01]

= 오늘의 학습 목표 | 3차시
^ **녹는점·어는점·끓는점**의 뜻을 설명할 수 있다.
^ 녹는점과 끓는점이 양에 관계없는 **물질의 특성**임을 그래프로 설명할 수 있다.
^ **외부 압력**에 따라 끓는점이 달라지는 현상을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 녹는점 10분 → 끓는점·압력 12분 → 예제·문항 13분 → 정리 5분

= 한라산 정상에서 라면을 끓이면? | 생각 열기
* 🏔️ 한라산 정상 :: 물이 100 °C보다 낮은 온도에서 끓는다
* 🍜 라면 :: 끓는데도 면이 잘 익지 않는다
* 🍚 압력솥 :: 밥이 더 빨리, 더 잘 익는다
? 물은 언제나 100 °C에서 끓을까? :: 아니다. 외부 압력이 낮으면 끓는점이 낮아지고, 압력이 높으면 끓는점이 높아진다.

? 얼음이 녹는 동안 온도가 0 °C로 일정한 까닭은? :: 흡수한 열이 입자 배열을 바꾸는 데 쓰이기 때문

## 녹는점과 어는점 | 고체 ⇄ 액체

= 녹는점과 어는점
! 녹는점 = 고체가 녹는 동안 일정하게 유지되는 온도
- 어는점 = 액체가 어는 동안 일정하게 유지되는 온도
+ 같은 물질의 녹는점과 어는점은 **같다**. (물: 0 °C)
>+ 물질마다 다르고, ==양에 관계없이 일정==하다 → 물질의 특성

= 시뮬레이션: 녹는점·끓는점 | 실험실
@ sim.html#mp | 팔미트산을 [적게], [많게] 두 번 가열하고, 끓는점에서는 물과 에탄올을 비교하자.
% 두 그래프의 '수평 구간 높이'가 같음을 강조 — 다른 것은 걸린 시간뿐

= 양이 다른 팔미트산의 가열 곡선
C 양이 달라도 녹는점은 63 °C로 같다 | 가열 시간 (분) | 온도 (°C) | 적게 (A):0,20 2,63 6,63 8,80 | 많게 (B):0,20 4,63 12,63 16,80
~ 양이 많으면 녹는점에 도달하고 다 녹는 데 걸리는 시간만 길어진다

## 끓는점 | 액체 → 기체

= 끓는점
! 끓는점 = 액체가 끓는 동안 일정하게 유지되는 온도
| 물질 | 끓는점 (1기압) |
|+ 물 | 100 °C |
|+ 에탄올 | 78 °C |
|+ 아세톤 | 56 °C |
>+ 끓는점도 물질마다 다르고 양에 관계없이 일정하다.

= 압력과 끓는점
| 장소·도구 | 외부 압력 | 물의 끓는점 (대략) |
|+ 에베레스트 정상 | 약 0.3기압 | 약 70 °C |
|+ 한라산 정상 | 약 0.8기압 | 약 93 °C |
|+ 해수면 | 1기압 | 100 °C |
|+ 압력솥 안 | 약 2기압 | 약 120 °C |
>+ 외부 압력이 ==높을수록== 끓는점이 높다.

= 상태 판단하기
| 물질 | 녹는점 (°C) | 끓는점 (°C) | 25 °C에서 상태 |
|+ A | −114 | 78 | [[액체]] |
|+ B | 63 | 351 | [[고체]] |
|+ C | −183 | −162 | [[기체]] |
- 25 °C가 녹는점보다 낮으면 고체, 녹는점과 끓는점 사이면 액체, 끓는점보다 높으면 기체

= 생활 속 녹는점과 끓는점 | 사례
* 🔌 퓨즈 :: 녹는점이 낮은 금속 — 큰 전류에 먼저 녹아 회로를 끊는다
* 🔧 텅스텐 필라멘트 :: 녹는점 약 3400 °C — 높은 온도에도 녹지 않는다
* 🍚 압력솥 :: 끓는점을 높여 빨리 익힌다
* 🏔️ 높은 산의 밥 :: 끓는점이 낮아 설익는다
* 🕯️ 양초 :: 녹는점이 낮아 쉽게 녹고 굳는다
* 🧯 소화기 속 이산화 탄소 :: 끓는점이 매우 낮아 상온에서 기체

= 예제 1 · 그래프 해석 | 적용
- 팔미트산 A, B의 가열 곡선이 둘 다 63 °C에서 수평이었다. A는 4분, B는 8분 동안 수평.
^+ 녹는점 → 둘 다 **63 °C** → 같은 물질
^+ 수평 구간이 긴 쪽 → 다 녹이는 데 열이 더 필요 → **B의 양이 많다**
^+ 양에 따라 달라진 것 → **녹는 데 걸린 시간**

= 예제 2 · 액체 구별하기 | 적용
- 투명한 액체 X, Y를 가열했더니 X는 78 °C, Y는 100 °C에서 끓는 동안 온도가 일정했다.
^+ 끓는점 78 °C → **에탄올**
^+ 끓는점 100 °C → **물**
>+ 냄새를 맡거나 맛을 보지 않고도 온도계만으로 구별할 수 있다!

= 예제 3 · 온도 구간과 상태 | 적용
- 물질 A(녹는점 −114 °C, 끓는점 78 °C)를 −150 °C에서 100 °C까지 가열한다.
^+ −150 → −114 °C: **고체**
^+ −114 °C: 융해 (고체 + 액체), −114 → 78 °C: **액체**
^+ 78 °C: 기화 (액체 + 기체), 78 → 100 °C: **기체**

= 확인 문제 1
Q 녹는점과 끓는점에 대한 설명으로 옳은 것은?
o 물질의 양이 많을수록 녹는점이 높다.
o* 같은 물질의 녹는점과 어는점은 같다.
o 모든 물질의 끓는점은 100 °C이다.
o 끓는점은 압력과 관계없다.
:: 녹는점·끓는점은 양에 관계없이 일정하고, 끓는점은 압력에 따라 변한다.

= 확인 문제 2
Q 높은 산에서 밥을 지으면 쌀이 설익는 까닭은?
o 공기 중 산소가 많아서
o* 기압이 낮아 물의 끓는점이 낮아져서
o 기압이 높아 물의 끓는점이 높아져서
o 물의 양이 줄어서
:: 낮은 온도에서 물이 끓어 쌀이 충분히 익지 않는다.

= 확인 문제 3
Q 녹는점 63 °C, 끓는점 351 °C인 물질의 25 °C에서 상태는?
o* 고체
o 액체
o 기체
o 고체와 액체
:: 25 °C는 녹는점보다 낮으므로 고체이다.

= 확인 문제 4
Q 같은 물질 50 g과 200 g을 같은 세기로 가열할 때 다른 것은?
o 녹는점
o 끓는점
o 밀도
o* 끓는점에 도달하는 데 걸리는 시간
:: 물질의 특성은 같고, 양이 많으면 시간만 오래 걸린다.

= 서술형 도전 | 생각 넓히기
? 퓨즈를 녹는점이 낮은 금속으로 만드는 까닭을 설명하시오. :: 큰 전류가 흐르면 열이 많이 발생하는데, 녹는점이 낮은 퓨즈가 먼저 녹아 끊어지면서 회로를 끊어 화재와 기기 고장을 막는다.
? 압력솥으로 밥을 지으면 빨리 익는 까닭을 끓는점과 관련지어 쓰시오. :: 압력솥 안은 외부 압력이 높아 물의 끓는점이 100 °C보다 높아지므로(약 120 °C), 더 높은 온도에서 쌀이 익기 때문이다.

= 오늘 배운 내용 정리
- 고체가 녹는 동안 일정한 온도 = [[녹는점]], 같은 물질의 녹는점 = [[어는점]]
- 액체가 끓는 동안 일정한 온도 = [[끓는점]]
- 녹는점·끓는점은 물질의 양에 [[관계없이]] 일정하다.
- 양이 많으면 도달하는 데 걸리는 [[시간]]만 길어진다.
- 외부 압력이 높을수록 끓는점이 [[높다]].
