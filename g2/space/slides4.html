## 팽창하는 우주 | 풍선 위의 은하

= 시뮬레이션: 팽창하는 우주 | 실험실
@ sim.html#expand | [풍선 불기]를 눌러 풍선을 크게 하고, 기준 은하 A에서 다른 은하까지의 거리 변화를 표에 기록하자.
% 기준 은하를 A가 아닌 다른 은하로 바꿔도 모두 멀어지는지 확인 → '중심 없음'

= 풍선 모형 결과 | 기준 은하 A에서의 거리
| 은하 | 처음 (cm) | 나중 (cm) | 늘어난 거리 (cm) |
|+ D | 2.0 | 5.4 | 3.4 |
|+ B | 2.4 | 6.6 | 4.2 |
|+ E | 2.6 | 7.2 | 4.5 |
|+ C | 3.7 | 10.2 | 6.4 |
|+ F | 4.2 | 11.4 | 7.2 |

= 그래프로 보면
C 처음에 멀리 있던 은하일수록 더 많이 멀어진다 | 처음 거리 (cm) | 늘어난 거리 (cm) | 늘어난 거리:0,0 2,3.4 2.4,4.2 2.6,4.5 3.7,6.4 4.2,7.2
~ 원점을 지나는 직선 — 늘어난 거리는 처음 거리에 비례 (모든 거리가 약 2.7배로)

= 모형과 실제 우주
| 모형 | 풍선 표면 | 은하 스티커 | 풍선이 커지는 것 |
|+ 실제 우주 | 우주 (공간) | 은하 | 우주 팽창 |
>+ 은하는 서로 멀어지고, 멀리 있는 은하일수록 ==더 빨리== 멀어진다.
>+ 어느 은하에서 보아도 다른 은하들이 멀어지므로 팽창의 ==중심은 없다==.

= 대폭발 우주론 (빅뱅)
! 우주는 매우 작고 뜨거운 한 점에서 대폭발로 시작되어 계속 ==팽창==하고 있다
- 시간을 거꾸로 돌리면 → 은하들이 점점 가까워져 → 한 점으로 모인다
+ 우주의 나이: 약 **138억 년**
>+ 우주가 팽창한다는 관측 결과가 대폭발 우주론의 중요한 증거이다.

## 우주 탐사 | 우주로 나아간 인류

= 시뮬레이션: 우주 탐사 연표 | 실험실
@ sim.html#explore | 연도를 바꾸며 우주 탐사의 주요 사건을 찾아 표를 완성하자.

= 우주 탐사의 역사
| 연도 | 탐사 | 성과 |
|+ 1957 | 스푸트니크 1호 | 최초의 인공위성 |
|+ 1969 | 아폴로 11호 | 인류 최초 달 착륙 |
|+ 1977 | 보이저 1·2호 | 외행성 탐사, 태양계 바깥으로 |
|+ 1990 | 허블 우주 망원경 | 대기 밖에서 먼 우주 관측 |
|+ 2022 | 누리호, 다누리 | 우리 기술 발사체 발사 성공, 달 궤도선 발사 |

= 우주 탐사와 우리 생활 | 사례
* 📍 GPS :: 위성 항법으로 길 찾기
* 🌦️ 일기 예보 :: 기상 위성 영상
* 📡 방송·통신 :: 통신 위성으로 전 세계 생중계
* 🛏️ 메모리폼 :: 우주인 좌석 충격 흡수 기술에서
* 🌡️ 적외선 체온계 :: 별의 온도를 재던 기술에서
* 🛰️ 우주 쓰레기 :: 수명이 다한 위성 조각 — 충돌 위험

= 예제 1 · 늘어난 비율 | 적용
- 은하 D: 2.0 → 5.4 cm, 은하 F: 4.2 → 11.4 cm
^+ D가 늘어난 비율 = 5.4 ÷ 2.0 = **2.7배**
^+ F가 늘어난 비율 = 11.4 ÷ 4.2 ≈ **2.7배**
^+ 같은 비율로 커졌으므로 처음 거리가 먼 F가 **더 많이**(7.2 cm) 멀어졌다

= 예제 2 · 멀어지는 빠르기 | 적용
- 풍선을 부는 데 2초가 걸렸다. 은하 D와 F가 A에서 멀어진 빠르기는?
^+ D: 3.4 ÷ 2 = **1.7 cm/s**
^+ F: 7.2 ÷ 2 = **3.6 cm/s**
^+ 처음 거리가 약 2배인 F가 약 **2배 빠르게** 멀어진다

= 예제 3 · 보이저 1호 | 적용
- 보이저 1호가 1초에 약 17 km씩 날아간다면 1년 동안 이동하는 거리는?
^+ 1년 ≈ **3150만 초**
^+ 17 × 31 500 000 ≈ **5억 3500만 km**
^+ 가장 가까운 별(약 4.2광년 ≈ 40조 km)까지는 → 약 **7만 5천 년**!

= 확인 문제 1
Q 풍선 모형에서 풍선 표면이 나타내는 것은?
o 은하
o* 우주 공간
o 별
o 태양계
:: 은하 스티커는 은하, 풍선이 커지는 것은 우주 팽창이다.

= 확인 문제 2
Q 우주 팽창에 대한 설명으로 옳은 것은?
o 우리은하가 팽창의 중심이다.
o 가까운 은하일수록 더 빨리 멀어진다.
o* 멀리 있는 은하일수록 더 빨리 멀어진다.
o 은하들은 서로 가까워지고 있다.
:: 팽창의 중심은 없고, 먼 은하일수록 빨리 멀어진다.

= 확인 문제 3
Q 인류가 처음으로 달에 착륙한 탐사는?
o 스푸트니크 1호
o* 아폴로 11호
o 보이저 1호
o 허블 우주 망원경
:: 1969년 아폴로 11호

= 확인 문제 4
Q 우주 탐사로 생긴 문제점으로 알맞은 것은?
o GPS 사용
o 일기 예보의 정확도 향상
o* 우주 쓰레기 증가
o 메모리폼 개발
:: 나머지는 우주 기술이 생활에 쓰인 예이다.

= 서술형 도전 | 생각 넓히기
? 풍선 위 어느 은하에서 보아도 다른 은하들이 멀어진다. 이것으로 알 수 있는 우주 팽창의 특징을 쓰시오. :: 우주 공간 전체가 고르게 팽창하므로 팽창의 중심이 없다. 어느 은하에서 보아도 다른 은하들이 멀어진다.
? '우주 탐사에 많은 돈을 쓰는 것이 필요한가?'에 대한 나의 의견을 근거를 들어 쓰시오. :: (예시) 필요하다. 우주 탐사로 얻은 기술이 GPS, 일기 예보, 의료 기기 등 생활을 편리하게 하고 우주와 지구에 대한 이해를 넓혀 준다. 다만 우주 쓰레기 문제를 해결하기 위한 국제 협력도 함께 이루어져야 한다.
% 찬반 토의 — 근거를 사실(자료)과 의견으로 구분하게 하기
