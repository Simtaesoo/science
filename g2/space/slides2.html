# 별의 밝기와 등급, 색과 표면 온도 | 보이는 밝기와 실제 밝기 | 중학교 과학 2 · 15 별과 우주 · 2차시 | 2022 개정 교육과정 [9과15-02]

= 오늘의 학습 목표 | 2차시
^ 별의 밝기가 **거리의 제곱에 반비례**함을 설명할 수 있다.
^ **겉보기 등급**과 **절대 등급**을 구별하고 별의 밝기를 비교할 수 있다.
^ 별의 **색**으로 **표면 온도**를 비교할 수 있다.
% 흐름: 생각 열기 5분 → 거리와 밝기 10분 → 등급 12분 → 색과 온도 8분 → 문항·관측소 게임 10분

= 가로등과 촛불 | 생각 열기
* 💡 멀리 있는 가로등 :: 작은 점처럼 희미하다
* 🕯️ 눈앞의 촛불 :: 가로등보다 밝아 보인다
* ⭐ 밤하늘 :: 밝게 보이는 별이 정말 밝은 별일까?
? 보이는 밝기만으로 실제 밝기를 비교할 수 있을까? :: 없다. 보이는 밝기는 거리에 따라 달라지므로, 같은 거리(10 pc)에 놓고 비교한 절대 등급이 필요하다.

? 연주 시차가 클수록 별은? :: 가깝다

## 거리와 밝기 | 거리의 제곱에 반비례

= 시뮬레이션: 밝기·등급·색 | 실험실
@ sim.html#mag | 관측 거리를 1배, 2배, 3배로 바꾸며 빛이 비추는 넓이와 보이는 밝기를 기록하자.
% 빛이 퍼지는 사각뿔 모양을 손전등으로 함께 보여 주면 좋음

= 거리와 밝기의 관계
| 별까지의 거리 | 1배 | 2배 | 3배 |
|+ 빛이 비추는 넓이 | 1배 | 4배 | 9배 |
|+ 보이는 밝기 | 1 | 1/4 | 1/9 |
>+ 별의 밝기는 ==거리의 제곱==에 반비례한다.

= 그래프로 보면
C 거리가 멀어지면 밝기는 빠르게 줄어든다 | 거리 (배) | 보이는 밝기 (상대값) | 밝기:1,1 2,0.25 3,0.111 4,0.0625 5,0.04
~ 거리가 5배가 되면 밝기는 1/25

## 별의 등급 | 숫자가 작을수록 밝다

= 별의 등급
! 등급의 숫자가 ==작을수록== 밝은 별 (0등급, −1등급도 있다)
| 등급 차이 | 밝기 차이 |
|+ 1등급 | 약 2.5배 |
|+ 2등급 | 약 2.5 × 2.5 ≈ 6.3배 |
|+ 5등급 | 약 100배 |
~ 1등급인 별은 6등급인 별보다 약 100배 밝다

= 겉보기 등급과 절대 등급
| 등급 | 뜻 |
|+ 겉보기 등급 | 우리 눈에 보이는 밝기 |
|+ 절대 등급 | 모든 별이 **10 pc**에 있다고 가정한 밝기 → **실제** 밝기 |
>+ 겉보기 등급 < 절대 등급 (더 밝게 보임) → 10 pc보다 ==가까이== 있는 별

= 별의 등급 비교
| 별 | 겉보기 등급 | 절대 등급 | 10 pc보다 |
|+ 태양 | −26.7 | +4.8 | 가깝다 |
|+ 시리우스 | −1.5 | +1.4 | 가깝다 |
|+ 리겔 | +0.1 | −7.0 | 멀다 |
|+ 북극성 | +2.0 | −3.6 | 멀다 |

## 별의 색과 표면 온도 | 파랄수록 뜨겁다

= 별의 색과 표면 온도
| 별 | 색 | 표면 온도 순위 (높은 순) |
|+ 스피카 | 청색 | 1 |
|+ 리겔 | 청백색 | 2 |
|+ 시리우스 | 백색 | 3 |
|+ 태양 | 노란색 | 4 |
|+ 베텔게우스 | 적색 | 5 |
>+ 청색 → 청백색 → 백색 → 황백색 → 황색 → 주황색 → 적색 순으로 표면 온도가 ==낮아진다==.

= 생활 속 색과 온도 | 사례
* 🔥 가스레인지 :: 뜨거운 불꽃은 파랗게
* ⚒️ 대장간의 쇠 :: 붉은색 → 노란색 → 흰색으로 달궈진다
* 💡 백열전구 :: 노르스름한 빛
* 🌌 오리온자리 :: 붉은 베텔게우스와 청백색 리겔이 한 별자리에
* 🔭 우리 반 관측 :: 맨눈으로도 별의 색 차이를 볼 수 있다
* 🌡️ 적외선 체온계 :: 물체가 내는 빛으로 온도를 잰다

= 예제 1 · 거리와 밝기 | 적용
- 어떤 별까지의 거리가 지금의 3배가 된다면?
^+ 빛이 비추는 넓이 → 3 × 3 = **9배**
^+ 보이는 밝기 → **1/9**
^+ 등급 숫자 → **커진다** (어두워지므로)

= 예제 2 · 등급 차이로 밝기 비교 | 적용
- 3등급인 별 A와 8등급인 별 B
^+ 등급 차이 = 8 − 3 = **5등급**
^+ 5등급 차이 → 약 **100배**
^+ A가 B보다 약 100배 **밝게 보인다**

= 예제 3 · 실제로 가장 밝은 별 | 적용
- 태양, 시리우스, 리겔, 북극성 중
^+ 맨눈으로 가장 밝게 보이는 별 → 겉보기 등급이 가장 작은 **태양** (−26.7)
^+ 실제로 가장 밝은 별 → 절대 등급이 가장 작은 **리겔** (−7.0)
^+ 태양과 리겔의 절대 등급 차이 = 4.8 − (−7.0) = **11.8등급** → 리겔이 훨씬 밝다

= 확인 문제 1
Q 별까지의 거리가 2배가 되면 보이는 밝기는?
o 2배
o 1/2
o* 1/4
o 4배
:: 밝기는 거리의 제곱에 반비례한다.

= 확인 문제 2
Q 별의 실제 밝기를 비교할 수 있는 등급은?
o 겉보기 등급
o* 절대 등급
o 1등급
o 6등급
:: 모든 별을 10 pc에 놓았다고 가정한 밝기이다.

= 확인 문제 3
Q 다음 중 표면 온도가 가장 높은 별의 색은?
o 적색
o 노란색
o 백색
o* 청색
:: 청색 별이 가장 뜨겁다.

= 확인 문제 4
Q 겉보기 등급 +2.0, 절대 등급 −3.6인 북극성에 대한 설명으로 옳은 것은?
o 10 pc보다 가까이 있다.
o* 10 pc보다 멀리 있다.
o 태양보다 실제로 어둡다.
o 겉보기 등급이 절대 등급보다 작다.
:: 10 pc에 놓으면 더 밝아지므로 지금은 10 pc보다 멀다.

= 서술형 도전 | 생각 넓히기
? 오리온자리의 베텔게우스는 붉은색, 리겔은 청백색이다. 두 별의 표면 온도를 비교하고, 쇠를 가열할 때의 색 변화와 관련지어 설명하시오. :: 리겔의 표면 온도가 더 높다. 쇠를 가열하면 붉은색에서 점점 노랗고 하얗게 변하고, 가스레인지의 뜨거운 불꽃은 파랗게 보이듯 온도가 높을수록 파란빛을 띤다.
? 처음의 '밝게 보이는 별이 정말 밝은 별일까?'에 대해 태양을 예로 들어 답하시오. :: 아니다. 태양은 겉보기 등급이 −26.7로 가장 밝게 보이지만, 아주 가까이 있기 때문이며 절대 등급은 +4.8로 리겔(−7.0)보다 훨씬 어둡다.

- 별의 밝기는 거리의 [[제곱]]에 반비례한다.
- 등급의 숫자가 [[작을수록]] 밝은 별, 5등급 차이 = 약 [[100]]배
