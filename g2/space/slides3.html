= 우주에서 쓰는 우리 집 주소 | 생각 열기
* 🏠 우리 집 :: ○○시 ○○구 ○○동

* 🌌 태양계 :: 우리은하의 나선팔 위, 중심에서 약 3만 광년
? 우리은하는 어떤 모양이고, 태양계는 그 안의 어디쯤에 있을까? :: 위에서 보면 막대 모양 중심부와 나선팔, 옆에서 보면 볼록한 원반이다. 태양계는 중심에서 약 3만 광년 떨어진 나선팔에 있다.

## 우리은하 | 수천억 개 별의 도시

= 시뮬레이션: 우리은하 | 실험실
@ sim.html#galaxy | [위에서 본 모습]과 [옆에서 본 모습]을 비교하고, 태양계의 위치를 찾아 그려 보자.
% 학습지에 위·옆 모습을 직접 그리고 태양계 위치를 ★로 표시

= 우리은하의 모양
| | 위에서 본 모습 | 옆에서 본 모습 |
|+ 모양 | 막대 모양 중심부 + 나선팔 | 가운데가 볼록한 납작한 원반 |
|+ 둘레 | — | 헤일로와 구상 성단 |
|+ 태양계 | 중심에서 약 3만 광년 떨어진 나선팔 | 원반 위 |
>+ 우리은하의 지름: 약 ==10만 광년==

= 은하수
! 우리은하의 원반 쪽을 볼 때 수많은 별이 ==띠 모양==으로 보이는 것
- 태양계가 납작한 원반 **안**에 있기 때문에 원반 방향으로 별이 많이 겹쳐 보인다.
+ 우리나라에서는 **여름철**에 은하 중심 방향(궁수자리 쪽)이 보여 더 밝고 두껍다.
>+ 겨울 은하수는 은하 바깥 방향이라 상대적으로 희미하다.

## 성단과 성운 | 별의 무리와 가스 구름

= 성단
| | 산개 성단 | 구상 성단 |
|+ 별의 모임 | 수십 ~ 수만 개가 엉성하게 | 수만 ~ 수십만 개가 공 모양으로 빽빽이 |
|+ 별의 나이·색 | 젊고, 푸른 별이 많음 | 늙고, 붉은 별이 많음 |
|+ 주로 있는 곳 | 나선팔 (원반) | 헤일로, 중심부 |

= 성운
! 별과 별 사이의 가스나 티끌(성간 물질)이 모여 구름처럼 보이는 것
| 종류 | 보이는 원리 | 주로 보이는 색 |
|+ 방출 성운 | 뜨거운 별의 에너지를 받아 스스로 빛을 냄 | 붉은색 |
|+ 반사 성운 | 가까운 별의 빛을 반사함 | 파란색 |
|+ 암흑 성운 | 뒤쪽 별빛을 가림 | 어둡게 보임 |

= 우리은하 밖으로 | 외부 은하
- 우주에는 우리은하 밖에도 수많은 **외부 은하**가 있다.
+ 안드로메다은하: 약 **250만 광년** 거리, 맨눈으로 보이는 가장 먼 천체
+ 대마젤란은하: 남반구에서 보이는 우리은하의 이웃
>+ 관측 가능한 우주에는 은하가 ==수천억 개== 이상 있다고 추정한다.

= 밤하늘의 천체 | 사례
* ✨ 플레이아데스 성단 (좀생이별) :: 산개 성단 — 맨눈으로 6~7개
* 🌐 M13 :: 헤라클레스자리의 구상 성단
* 🌫️ 오리온 대성운 :: 방출 성운 — 별이 태어나는 곳
* 🐴 말머리 성운 :: 암흑 성운 — 뒤의 빛을 가림
* 🌀 안드로메다은하 :: 가장 가까운 큰 외부 은하
* 🥛 은하수 :: 여름밤 남쪽 하늘의 우유 빛 띠

= 예제 1 · 은하의 크기 | 적용
- 우리은하의 지름은 약 10만 광년이다.
^+ 빛이 은하를 가로지르는 데 → **약 10만 년**
^+ 태양계에서 은하 중심까지 3만 광년 → 지금 보는 중심부의 빛은 **3만 년 전**에 출발
^+ 1광년 ≈ 9조 5천억 km → 10만 광년 ≈ **95경 km** (9.5 × 10¹⁷ km)

= 예제 2 · 별을 세어 보면 | 적용
- 우리은하에는 별이 약 1000억 개 있다고 한다. 1초에 한 개씩 쉬지 않고 센다면?
^+ 1년 ≈ 365 × 24 × 3600 = **약 3150만 초**
^+ 1000억 ÷ 3150만 ≈ **3200년**
^+ 수천억 개라면 → 1만 년이 넘게 걸린다!

= 예제 3 · 성단 판별 | 적용
- 어떤 성단이 수십만 개의 붉은 별로 빽빽한 공 모양이고, 은하 원반 바깥(헤일로)에 있다.
^+ 별의 수와 모양 → 많고 **공 모양**
^+ 별의 색 → **붉은 별** (늙은 별)
^+ 위치 → 헤일로 → **구상 성단**

= 확인 문제 1
Q 태양계의 위치로 옳은 것은?
o 우리은하의 중심
o* 우리은하 중심에서 약 3만 광년 떨어진 나선팔
o 우리은하의 헤일로
o 우리은하 바깥
:: 태양계는 원반 위 나선팔에 있다.

= 확인 문제 2
Q 우리나라에서 은하수가 여름철에 더 밝고 두껍게 보이는 까닭은?
o 여름에 별이 더 많이 생기기 때문
o* 여름밤에 은하 중심 방향(궁수자리 쪽)을 보기 때문
o 여름에 지구가 은하 중심에 가까워지기 때문
o 여름에 공기가 맑기 때문
:: 은하 중심 쪽에 별이 가장 많다.

= 확인 문제 3
Q 산개 성단의 특징으로 옳은 것은?
o 늙은 붉은 별이 많다.
o 공 모양으로 빽빽하다.
o* 젊은 푸른 별이 많고 나선팔에 주로 있다.
o 헤일로에 주로 있다.
:: 나머지는 구상 성단의 특징이다.

= 확인 문제 4
Q 가까운 별의 빛을 반사하여 파랗게 보이는 성운은?
o 방출 성운
o* 반사 성운
o 암흑 성운
o 구상 성단
:: 방출 성운은 붉게, 암흑 성운은 어둡게 보인다.

= 서술형 도전 | 생각 넓히기
? 은하수가 띠 모양으로 보이는 까닭을 우리은하의 모양과 태양계의 위치로 설명하시오. :: 우리은하는 납작한 원반 모양이고 태양계가 원반 안에 있으므로, 원반 방향을 보면 별이 많이 겹쳐 띠 모양으로 보인다.
? 나선팔에 젊은 별이 많은 까닭을 성운과 관련지어 추리하시오. :: 나선팔에는 별의 재료가 되는 가스와 티끌(성운)이 많아, 이들이 모여 새로운 별이 계속 태어나기 때문이다.

= 오늘 배운 내용 정리
- 우리은하: 위에서 보면 막대 모양 중심부와 [[나선팔]], 옆에서 보면 볼록한 [[원반]]
- 지름 약 [[10만]] 광년, 태양계는 중심에서 약 [[3만]] 광년
- 원반 쪽 별이 띠 모양으로 보이는 것 = [[은하수]]
- 젊고 푸른 별의 엉성한 무리 = [[산개 성단]], 늙고 붉은 별의 빽빽한 공 = [[구상 성단]]
- 성간 물질이 구름처럼 보이는 것 = [[성운]] (방출·반사·암흑)
