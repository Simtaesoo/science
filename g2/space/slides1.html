= 오늘의 학습 목표 | 1차시
^ **시차**의 뜻을 알고 거리와 시차의 관계를 설명할 수 있다.

^ 연주 시차로 별까지의 **거리**(pc, 광년)를 구하고 비교할 수 있다.
% 흐름: 생각 열기 5분 → 손가락 시차 체험 7분 → 연주 시차 시뮬레이션 13분 → 계산 예제 12분 → 문항·정리 8분

* 👍 팔을 뻗어 엄지를 세운다
* 👁️ 왼쪽 눈, 오른쪽 눈을 번갈아 감는다

? 엄지를 눈 가까이 가져오면 움직이는 정도가 어떻게 달라질까? :: 더 크게 움직인다 — 물체가 가까울수록 시차가 크다.
% 학생 모두 직접 해 보기 — 칠판의 글자를 배경으로

| 질문 | 답 |
| 지구가 태양 둘레를 1년에 한 바퀴 도는 운동 | [[공전]] |

## 시차 | 보는 위치가 다르면

= 시차
! 관측자의 위치가 달라짐에 따라 물체의 방향이 달라져 보이는 각
| 엄지의 위치 | 배경에 대해 움직이는 정도 |
|+ 팔을 쭉 뻗었을 때 (멀리) | 작게 움직인다 |
|+ 눈 가까이 했을 때 | 크게 움직인다 |
>+ 물체가 ==가까울수록== 시차가 크다.

## 연주 시차 | 지구가 움직이며 별을 본다

= 연주 시차
! 6개월 간격으로 별을 관측하여 생긴 시차의 ==1/2==
- 지구가 태양 주위를 **공전**하므로 6개월 사이에 관측 위치가 크게 바뀐다.
+ 가까운 별은 먼 배경 별에 대해 위치가 달라져 보인다.
+ 단위: 초(″) — 1° = 60′ = **3600″**
>+ 연주 시차는 ==지구가 공전한다는 증거==이다.

= 시뮬레이션: 연주 시차 | 실험실
@ sim.html#parallax | 별까지의 거리를 바꾸며, 지구가 공전할 때 망원경 시야 속 별이 움직이는 폭과 연주 시차를 기록하자.
% 거리를 2배, 4배로 바꿀 때 연주 시차가 1/2, 1/4이 되는 규칙을 학생이 먼저 찾게 하기

= 거리와 연주 시차
| 별까지 거리 (pc) | 1 | 2 | 4 | 5 |
|+ 연주 시차 (″) | 1 | 0.5 | 0.25 | 0.2 |
>+ 거리와 연주 시차는 ==반비례== → 거리 (pc) = 1 ÷ 연주 시차 (″)
~ 1 pc (파섹): 연주 시차가 1″인 별까지의 거리 ≈ 3.26광년

= 그래프로 보면
C 별까지의 거리가 멀수록 연주 시차가 작다 | 별까지의 거리 (pc) | 연주 시차 (″) | 연주 시차:1,1 2,0.5 4,0.25 5,0.2 8,0.125 10,0.1
~ 10 pc만 되어도 0.1″ — 아주 먼 별은 연주 시차를 재기 어렵다

= 거리의 단위
| 단위 | 뜻 | 크기 |
|+ 광년 | 빛이 1년 동안 이동하는 거리 | 약 9조 5천억 km |
|+ 파섹 (pc) | 연주 시차가 1″인 별까지의 거리 | 약 3.26광년 |
>+ 빛은 1초에 약 30만 km — 지구를 7바퀴 반 도는 빠르기!

= 가까운 별들 | 사례
* ⭐ 프록시마 센타우리 :: 연주 시차 0.77″ — 태양 다음으로 가까운 별
* ✨ 시리우스 :: 0.38″ — 밤하늘에서 가장 밝은 별
* 🌟 알타이르 (견우성) :: 0.19″
* 💫 베가 (직녀성) :: 0.13″
* 🔭 가이아 위성 :: 별 10억 개 이상의 연주 시차를 측정
* 🌍 지구 대기 :: 흔들림 때문에 우주 망원경이 더 정밀

= 예제 1 · 거리 구하기 | 적용
- 연주 시차가 0.38″인 시리우스까지의 거리는?
^+ 거리 (pc) = 1 ÷ 0.38 ≈ **2.6 pc**
^+ 광년으로 = 2.6 × 3.26 ≈ **8.6광년**
^+ 지금 보는 시리우스의 빛은 약 **8.6년 전**에 출발한 빛이다

= 예제 2 · 거리 비교 | 적용
| 별 | 연주 시차 | 거리 (pc) | 가까운 순 |
|+ 프록시마 센타우리 | 0.77″ | [[약 1.3]] | 1 |
|+ 시리우스 | 0.38″ | [[약 2.6]] | 2 |
|+ 알타이르 | 0.19″ | [[약 5.3]] | 3 |
|+ 베가 | 0.13″ | [[약 7.7]] | 4 |
>+ 연주 시차가 ==클수록== 가까운 별이다.

= 예제 3 · 몇 배 멀까? | 적용
- 연주 시차가 0.5″인 별 A와 0.1″인 별 B
^+ A까지 = 1 ÷ 0.5 = **2 pc**
^+ B까지 = 1 ÷ 0.1 = **10 pc**
^+ B는 A보다 **5배** 멀다 (연주 시차가 1/5이므로)

= 확인 문제 1
Q 시차에 대한 설명으로 옳은 것은?
o 물체가 멀수록 시차가 크다.
o* 물체가 가까울수록 시차가 크다.
o 시차는 거리와 관계없다.
o 관측 위치가 같아도 시차가 생긴다.
:: 엄지를 눈 가까이 하면 더 크게 움직인다.

= 확인 문제 2
Q 연주 시차가 생기는 까닭은?
o 지구가 자전하기 때문
o* 지구가 태양 주위를 공전하기 때문
o 별이 스스로 움직이기 때문
o 달이 지구 주위를 돌기 때문
:: 6개월 간격으로 관측 위치가 크게 달라진다.

= 확인 문제 3
Q 연주 시차가 0.25″인 별까지의 거리는?
o 0.25 pc
o 2.5 pc
o* 4 pc
o 25 pc
:: 1 ÷ 0.25 = 4 pc

= 확인 문제 4
Q 시리우스(0.38″)와 베가(0.13″) 중 더 가까운 별과 까닭은?
o* 시리우스, 연주 시차가 더 크기 때문
o 베가, 연주 시차가 더 작기 때문
o 시리우스, 더 밝기 때문
o 두 별의 거리는 같다
:: 가까울수록 연주 시차가 크다. 밝기만으로는 거리를 알 수 없다.

= 서술형 도전 | 생각 넓히기
? 아주 멀리 있는 별까지의 거리는 연주 시차로 구하기 어렵다. 그 까닭과, 지구보다 공전 궤도가 큰 화성에서 관측하면 유리한 점을 쓰시오. :: 별이 멀면 연주 시차가 너무 작아 정확히 측정하기 어렵다. 화성은 공전 궤도가 커서 관측 위치 사이의 거리가 멀어지므로 같은 별의 시차가 더 크게 나타나 측정이 유리하다.
? 연주 시차가 지구가 공전한다는 증거가 되는 까닭을 쓰시오. :: 지구가 움직이지 않는다면 1년 동안 관측 위치가 같아 가까운 별의 위치가 배경 별에 대해 바뀌지 않을 것이다. 실제로는 1년 주기로 위치가 바뀌어 보이므로 지구가 공전한다.

= 오늘 배운 내용 정리
- 관측 위치에 따라 물체의 방향이 달라져 보이는 각 = [[시차]]
- 6개월 간격으로 관측한 시차의 1/2 = [[연주 시차]]
- 별까지의 거리와 연주 시차는 [[반비례]]한다.
- 연주 시차 1″인 별까지의 거리 = 1 [[pc]] ≈ 3.26 [[광년]]
- 연주 시차는 지구가 [[공전]]한다는 증거이다.

= 나가기 전 한 문제 | 형성평가
? 연주 시차가 0.2″인 별까지의 거리를 pc와 광년으로 구하시오. :: 1 ÷ 0.2 = 5 pc, 5 × 3.26 = 16.3광년
