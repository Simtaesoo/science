* 🎯 몇 년 뒤 :: 예측한 성질과 꼭 닮은 갈륨, 저마늄이 발견!
? 발견되지 않은 원소의 성질을 어떻게 미리 알 수 있었을까? :: 같은 세로줄 원소들은 성질이 비슷하다는 규칙성이 있어서, 위아래 원소를 보고 빈칸 원소의 성질을 짐작했다.

## 주기율표의 구조 | 족과 주기

= 주기율표
! 원소를 ==원자 번호== 순서로 배열하고, 성질이 비슷한 원소가 같은 세로줄에 오도록 만든 표
| 구분 | 뜻 | 개수 |
|+ 족 | 세로줄 | 1 ~ 18족 |
|+ 주기 | 가로줄 | 1 ~ 7주기 |
>+ 같은 ==족== 원소는 화학적 성질이 비슷하다.

= 1 ~ 20번 원소 | 주기율표 앞부분
| 주기＼족 | 1 | 2 | 13 | 14 | 15 | 16 | 17 | 18 |
| 1 | H | | | | | | | He |
| 2 | Li | Be | B | C | N | O | F | Ne |
| 3 | Na | Mg | Al | Si | P | S | Cl | Ar |
| 4 | K | Ca | | | | | | |
~ 3 ~ 12족(전이 원소)은 4주기부터 나타난다

= 시뮬레이션: 주기율표 | 실험실
@ sim.html#table | 주기율표에서 원소를 눌러 확인하고, 학습지의 빈칸에 원소 기호를 채우자. 1족과 18족 원소를 물에 넣어 보자!
% 1족 원소를 물에 넣는 장면 — 실제로는 매우 위험하므로 영상·시뮬레이션으로만

## 같은 족, 비슷한 성질 | 1족과 18족

= 같은 족 원소의 성질
| 족 | 원소 | 물에 넣었을 때 | 알게 된 점 |
|+ 1족 | 리튬, 나트륨, 칼륨 | 수소 기체를 내며 반응 (칼륨이 가장 격렬) | 성질이 비슷하다 |
|+ 18족 | 헬륨, 네온, 아르곤 | 반응하지 않음 | 매우 안정하다 |
>+ 1족(수소 제외) = 알칼리 금속, 18족 = 비활성 기체

= 금속과 비금속
| 구분 | 위치 | 성질 | 예 |
|+ 금속 | 주기율표의 왼쪽·가운데 | 광택, 전기·열이 잘 통함 | Na, Mg, Fe, Cu |
|+ 비금속 | 주기율표의 오른쪽 | 광택이 없고 전기가 잘 안 통함 (흑연 제외) | C, N, O, Cl |
~ 수소(H)는 1족에 있지만 비금속이다

= 생활 속 원소 | 사례
* 💡 아르곤 (18족) :: 전구 속 — 필라멘트와 반응하지 않음
* 🎈 헬륨 (18족) :: 풍선, 비행선 — 가볍고 타지 않음
* 🌃 네온 (18족) :: 붉은빛 간판
* 🔋 리튬 (1족) :: 휴대 전화 배터리
* 🧂 나트륨 (1족) :: 소금 속 Na — 원소 상태는 석유 속에 보관
* 🦷 플루오린 (17족) :: 충치 예방 치약

= 예제 1 · 위치 찾기 | 적용
- 원자 번호 12인 마그네슘(Mg)의 주기와 족은?
^+ 1주기 2개(H, He), 2주기 8개(Li ~ Ne) → 10번까지
^+ 11번 Na부터 **3주기** → 12번은 3주기의 두 번째
^+ 마그네슘 = **3주기 2족**

= 예제 2 · 비슷한 원소 고르기 | 적용
- 리튬(Li), 탄소(C), 칼륨(K), 네온(Ne) 중 성질이 가장 비슷한 두 원소는?
^+ 족 확인 → Li **1족**, C 14족, K **1족**, Ne 18족
^+ 같은 족 → **리튬과 칼륨**
^+ 둘 다 물과 반응해 **수소 기체**를 낸다

= 예제 3 · 빈칸 원소 예측 | 적용
- 4주기 18족 원소 크립톤(Kr)은 처음 보는 원소다. 전구 속에 넣어도 될까?
^+ 크립톤의 위치 → **18족** (헬륨, 네온, 아르곤과 같은 족)
^+ 같은 족 → 성질이 **비슷하다** → 다른 물질과 거의 **반응하지 않는다**
^+ 전구 속 필라멘트와 반응하지 않으므로 **넣어도 된다** (실제로 크립톤 전구가 있다)
>+ 멘델레예프가 빈칸 원소를 예측한 방법과 같다!
% 2022 개정 [9과11-03]은 같은 족의 성질 비교를 1족(물과의 반응)과 18족(안정성) 중심으로 다룬다. 다른 족의 반응성·주기성은 고등학교 내용이다.

= 확인 문제 1
Q 주기율표의 세로줄을 무엇이라고 할까?
o 주기
o* 족
o 원자 번호
o 원소 기호
:: 세로줄은 족, 가로줄은 주기이다.

= 확인 문제 2
Q 같은 족 원소에 대한 설명으로 옳은 것은?
o 원자 번호가 같다.
o* 화학적 성질이 비슷하다.
o 질량이 같다.
o 모두 기체이다.
:: 같은 족 원소는 성질이 비슷하다.

= 확인 문제 3
Q 전구 속을 아르곤으로 채우는 까닭은?
o 아르곤이 빛을 내기 때문에
o* 아르곤이 매우 안정하여 필라멘트와 반응하지 않기 때문에
o 아르곤이 물과 잘 반응하기 때문에
o 아르곤이 전기를 잘 통하기 때문에
:: 18족 원소는 매우 안정하다.

= 확인 문제 4
Q 원자 번호 19인 칼륨(K)의 위치는?
o 3주기 1족
o* 4주기 1족
o 4주기 2족
o 3주기 18족
:: 18번 Ar까지가 3주기, 19번 K부터 4주기 1족

= 서술형 도전 | 생각 넓히기
? 나트륨을 석유 속에 넣어 보관하는 까닭을 쓰시오. :: 나트륨은 공기 중의 산소, 물과 쉽게 반응하므로 이를 막기 위해서이다.
? 멘델레예프가 주기율표의 빈칸에 들어갈 원소의 성질을 예측할 수 있었던 까닭을 쓰시오. :: 같은 족 원소는 성질이 비슷하다는 규칙성이 있어서, 빈칸의 위아래 원소 성질을 보고 그 원소의 성질을 짐작할 수 있었기 때문이다.

= 오늘 배운 내용 정리
- 원소를 [[원자 번호]] 순서로 배열하고 성질이 비슷한 원소를 같은 세로줄에 놓은 표 = 주기율표
- 세로줄 = [[족]] (1 ~ 18), 가로줄 = [[주기]] (1 ~ 7)
- 같은 족 원소는 화학적 성질이 [[비슷]]하다.
- 1족(수소 제외)은 물과 반응하여 [[수소]] 기체를 낸다.
- 18족 원소는 매우 [[안정]]하여 거의 반응하지 않는다.

= 나가기 전 한 문제 | 형성평가
? 헬륨 대신 수소로 풍선을 채우면 더 가볍지만 위험하다. 18족과 수소의 성질을 비교하여 그 까닭을 쓰시오. :: 헬륨은 18족 원소로 매우 안정해 타지 않지만, 수소는 산소와 잘 반응하여 불이 붙으면 폭발할 수 있기 때문이다.
