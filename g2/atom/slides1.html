## 원소와 화합물 | 더 이상 나눌 수 없는 성분

= 원소와 화합물
| 구분 | 뜻 | 예 |
|+ 원소 | 더 이상 다른 물질로 **분해되지 않는** 물질의 기본 성분 | 수소, 산소, 철, 금 |
|+ 화합물 | 두 가지 이상의 원소가 **결합**하여 만들어진 물질 | 물, 이산화 탄소, 염화 나트륨 |
>+ 지금까지 알려진 원소는 약 ==118가지== — 이들의 결합으로 수많은 물질이 만들어진다.

= 시뮬레이션: 물의 전기 분해 | 실험실
@ sim.html#comp | [물의 전기 분해]에서 전원을 켜고 각 극에서 생기는 기체와 부피를 비교하자.
% 실제 실험은 수산화 나트륨을 조금 넣어 전류가 잘 흐르게 함 — 보안경 착용

= 전기 분해 결과
| | (−)극 | (+)극 |
|+ 발생한 기체 | 수소 | 산소 |
|+ 부피비 | 2 | 1 |
|+ 확인 방법 | 성냥불 → '퍽' 소리 | 꺼져 가는 불씨 → 다시 타오름 |
>+ 물은 수소와 산소로 분해된다 → 물은 ==화합물==

## 원소 기호와 화학식 | 물질을 기호로

= 원소 기호
- 알파벳 **대문자** 하나, 또는 대문자 뒤에 **소문자**를 붙여 쓴다.
| 원소 | 수소 | 산소 | 탄소 | 질소 | 나트륨 | 염소 | 철 | 구리 |
|+ 기호 | H | O | C | N | Na | Cl | Fe | Cu |
>+ Co(코발트)와 CO(일산화 탄소)는 다르다! 대소문자에 주의.

= 화학식
! 원소 기호와 숫자로 물질을 이루는 원자의 종류와 수를 나타낸 식
- 원자 수는 원소 기호 **오른쪽 아래**에 쓰고, 1은 생략한다.
+ 앞에 붙은 큰 숫자 = 분자의 **개수**
>+ 3CO₂ = 이산화 탄소 분자 3개 → 탄소 원자 3개, 산소 원자 6개

= 분자 만들기 결과
| 물질 | 화학식 | 원자의 종류와 수 | 원소 / 화합물 |
|+ 물 | H₂O | 수소 2, 산소 1 | 화합물 |
|+ 이산화 탄소 | CO₂ | 탄소 1, 산소 2 | 화합물 |
|+ 암모니아 | NH₃ | 질소 1, 수소 3 | 화합물 |
|+ 메테인 | CH₄ | 탄소 1, 수소 4 | 화합물 |
|+ 산소 | O₂ | 산소 2 | 원소 |

= 생활 속 원소와 화합물 | 사례
* 💍 금반지 :: 금(Au) — 원소
* 🎈 헬륨 풍선 :: 헬륨(He) — 원소
* 💧 물 :: H₂O — 화합물
* 🧂 소금 :: 염화 나트륨(NaCl) — 화합물
* 🔥 가스레인지 연료 :: 메테인(CH₄) — 화합물
* 🩹 과산화 수소수 :: H₂O₂ — 물과 원소는 같지만 다른 물질

= 예제 1 · 원자 수 세기 | 적용
- 2H₂O와 C₆H₁₂O₆(포도당)에 들어 있는 원자의 수를 세자.
^+ 2H₂O → 분자 2개 × (H 2 + O 1) → H **4**, O **2**, 모두 **6개**
^+ C₆H₁₂O₆ → C 6 + H 12 + O 6 = **24개**
^+ 3NH₃ → N **3**, H **9** → 모두 **12개**

= 예제 2 · 전기 분해 부피 | 적용
- 물을 전기 분해했더니 (−)극에서 기체가 30 mL 모였다.
^+ (−)극 기체 → **수소**
^+ 수소 : 산소 = 2 : 1 → 산소 = 30 ÷ 2 = **15 mL**
^+ 산소는 (+)극에서, 꺼져 가는 불씨로 확인

= 예제 3 · 원소일까 화합물일까? | 적용
- ㄱ. 금 ㄴ. 물 ㄷ. 염화 나트륨 ㄹ. 질소 ㅁ. 이산화 탄소 ㅂ. 헬륨
^+ 원소 기호 하나로 표현 → 원소: **ㄱ(Au), ㄹ(N₂), ㅂ(He)**
^+ 두 가지 이상의 원소 → 화합물: **ㄴ(H₂O), ㄷ(NaCl), ㅁ(CO₂)**
>+ O₂, N₂처럼 원자가 두 개여도 한 가지 원소로만 되어 있으면 원소이다.

= 확인 문제 1
Q 원소에 대한 설명으로 옳은 것은?
o 두 가지 이상의 물질이 섞인 것
o* 더 이상 다른 물질로 분해되지 않는 기본 성분
o 두 가지 이상의 원소가 결합한 물질
o 물은 원소이다.
:: 물은 수소와 산소로 분해되므로 화합물이다.

= 확인 문제 2
Q 물을 전기 분해할 때 (+)극에서 발생하는 기체와 확인 방법은?
o 수소, 성냥불을 대면 '퍽' 소리
o* 산소, 꺼져 가는 불씨가 다시 타오름
o 수소, 꺼져 가는 불씨가 다시 타오름
o 산소, 석회수가 뿌옇게 흐려짐
:: (+)극 산소, (−)극 수소, 부피비 1 : 2

= 확인 문제 3
Q 염소의 원소 기호로 옳은 것은?
o C
o CL
o* Cl
o Ch
:: 두 글자일 때 두 번째 글자는 소문자로 쓴다.

= 확인 문제 4
Q 4CH₄에 들어 있는 수소 원자의 수는?
o 4개
o 8개
o* 16개
o 20개
:: 분자 4개 × 수소 4개 = 16개

= 서술형 도전 | 생각 넓히기
? 라부아지에가 물을 분해하는 실험을 한 뒤 '물은 원소'라는 생각이 바뀐 까닭을 쓰시오. :: 물이 수소와 산소로 분해된다는 것이 실험으로 확인되어, 물은 더 이상 원소가 아니라 두 원소로 이루어진 화합물임을 알게 되었기 때문이다.
? H₂O와 H₂O₂는 같은 원소로 이루어져 있다. 두 물질이 같은 물질인지 판단하고 까닭을 쓰시오. :: 다른 물질이다. 구성 원소는 같지만 분자를 이루는 원자의 수가 달라 성질이 다르다.
