* 🔋 소금물 :: 순수한 물과 달리 전류가 잘 흐른다
? 이온이란 무엇이고, 왜 소금물에서는 전류가 흐를까? :: 이온은 원자가 전자를 잃거나 얻어 전하를 띤 입자이다. 소금물 속 이온이 전하를 운반한다.

## 분자 | 물질의 성질을 나타내는 입자

= 분자
! 원자가 결합하여 독립된 입자로 존재하며 물질의 성질을 나타내는 가장 작은 입자
- 예: 물 H₂O, 산소 O₂, 이산화 탄소 CO₂
+ 물 분자를 쪼개면 수소 원자와 산소 원자 → 더 이상 '물'의 성질이 없다.
>+ 원자 = 물질을 이루는 기본 입자, 분자 = 물질의 ==성질==을 나타내는 입자

## 이온 | 전자를 잃거나 얻으면

= 이온
! 원자가 전자를 잃거나 얻어 ==전하==를 띠게 된 입자
| 종류 | 만들어지는 과정 | 예 |
|+ 양이온 | 전자를 **잃어** (+)전하 | Na⁺, Mg²⁺, K⁺, Ca²⁺ |
|+ 음이온 | 전자를 **얻어** (−)전하 | Cl⁻, O²⁻, F⁻ |
>+ 이온이 되어도 ==양성자 수==는 변하지 않는다 — 전자 수만 변한다.

= 시뮬레이션: 이온 만들기 | 실험실
@ sim.html#ion | 원소를 골라 전자를 잃거나 얻게 하여 이온을 만들고 기호로 나타내자.

= 이온 만들기 결과
| 원자 | 전자의 변화 | 이온 기호 | 이온 이름 |
|+ Na | 1개 잃음 | Na⁺ | 나트륨 이온 |
|+ Mg | 2개 잃음 | Mg²⁺ | 마그네슘 이온 |
|+ Cl | 1개 얻음 | Cl⁻ | 염화 이온 |
|+ O | 2개 얻음 | O²⁻ | 산화 이온 |
~ 기호 오른쪽 위에 잃거나 얻은 전자의 수와 전하의 종류를 쓴다 (1은 생략)

= 이온의 이동 실험
^+ 질산 칼륨 수용액을 적신 거름종이 가운데에 황산 구리(Ⅱ) 수용액(파랑)과 과망가니즈산 칼륨 수용액(보라)을 떨어뜨린다
^+ 전원을 연결한다
| 색 | 이온 | 이동 방향 |
|+ 파란색 | Cu²⁺ | (−)극 |
|+ 보라색 | MnO₄⁻ | (+)극 |
>+ 양이온은 (−)극으로, 음이온은 (+)극으로 → 이온은 ==전하==를 띤다!

= 생활 속 이온 | 사례
* 🥤 이온 음료 :: Na⁺, K⁺, Mg²⁺, Cl⁻ — 땀으로 잃은 이온 보충
* 🧂 소금물 :: Na⁺과 Cl⁻이 있어 전류가 흐른다
* 🦴 우유 :: 칼슘 이온(Ca²⁺) — 뼈와 이
* 🔋 배터리 :: 리튬 이온(Li⁺)이 이동하며 충전·방전
* 💧 수돗물 :: 미량의 Ca²⁺, Mg²⁺ — 물때의 원인
* 🧠 신경 :: Na⁺, K⁺의 이동으로 신호 전달

= 예제 1 · 이온의 입자 수 | 적용
- 칼슘 원자(양성자 20개)가 칼슘 이온(Ca²⁺)이 되었다.
^+ 양성자 수 → 변하지 않음 → **20개**
^+ 전자 수 → 2개 잃음 → 20 − 2 = **18개**
^+ 전하 → (+20) + (−18) = **+2**

= 예제 2 · 이온 기호 쓰기 | 적용
- 산소 원자(양성자 8, 전자 8)가 전자 2개를 얻었다.
^+ 전자 수 → 8 + 2 = **10개**
^+ 전하 → (+8) + (−10) = **−2**
^+ 이온 기호 → **O²⁻**, 이름 → **산화 이온**

= 예제 3 · 소금물에 전류가 흐르는 까닭 | 적용
^+ 소금(NaCl)이 물에 녹으면 → **Na⁺**과 **Cl⁻**로 나뉜다
^+ 전원을 연결하면 → Na⁺은 (−)극으로, Cl⁻은 (+)극으로 **이동**
^+ 전하를 띤 입자가 이동 → **전류가 흐른다**
>+ 순수한 물에는 이온이 거의 없어 전류가 거의 흐르지 않는다.

= 확인 문제 1
Q 물질의 성질을 나타내는 가장 작은 입자는?
o 원자
o* 분자
o 전자
o 원자핵
:: 분자를 쪼개면 원래 물질의 성질이 사라진다.

= 확인 문제 2
Q 원자가 전자를 잃어 만들어지는 입자는?
o 음이온
o* 양이온
o 분자
o 중성자
:: 전자를 잃으면 (+)전하를 띤 양이온이 된다.

= 확인 문제 3
Q 이온에 대한 설명으로 옳은 것끼리 고른 것은?
o 이온이 될 때 양성자 수가 변한다, 이온은 전하를 띠지 않는다
o* 금속 원소는 주로 양이온이 된다, 음이온은 원자가 전자를 얻어 만들어진다
o 음이온은 전자를 잃어 만들어진다, 양이온은 (+)극으로 이동한다
o 이온은 전하를 띠지 않는다, 금속은 음이온이 된다
:: 이온이 되어도 양성자 수는 그대로이고 전자 수만 변한다.

= 확인 문제 4
Q 이온의 이동 실험에서 파란색 구리 이온(Cu²⁺)이 이동하는 쪽은?
o (+)극
o* (−)극
o 이동하지 않는다
o 양쪽으로 퍼진다
:: 양이온은 (−)극 쪽으로 끌려간다.

= 서술형 도전 | 생각 넓히기
? 순수한 물은 전류가 거의 흐르지 않지만 소금물은 잘 흐른다. 이온의 성질로 설명하시오. :: 소금이 물에 녹으면 Na⁺과 Cl⁻ 이온으로 나뉘고, 전하를 띤 이온들이 각각 반대 극으로 이동하면서 전류가 흐르기 때문이다.
? 이온 음료에 들어 있는 이온의 예를 두 가지 쓰고, 운동 후에 이온 음료를 마시는 까닭을 추론하시오. :: 나트륨 이온(Na⁺), 칼륨 이온(K⁺) 등. 땀을 흘리면 물과 함께 몸속 이온이 빠져나가므로 이를 보충하기 위해서이다.

- 전자를 잃으면 [[양이온]], 얻으면 [[음이온]]
- 이온이 되어도 [[양성자]] 수는 변하지 않는다.
- 양이온은 [[(−)극]]으로, 음이온은 (+)극으로 이동한다.
