# 원자의 구조 | 양성자, 중성자, 전자 | 중학교 과학 2 · 11 물질의 구성 · 2차시 | 2022 개정 교육과정 [9과11-02]

= 오늘의 학습 목표 | 2차시
^ 원자가 **원자핵(양성자·중성자)과 전자**로 이루어져 있음을 설명할 수 있다.
^ 원자가 전기적으로 **중성**인 까닭을 말할 수 있다.
^ **양성자 수**(원자 번호)로 원소의 종류를 판단할 수 있다.
% 흐름: 생각 열기 5분 → 원자의 구조 12분 → 원자 만들기 시뮬레이션 12분 → 문항 10분 → 원자 모형 변천 6분

= 축구장만 한 원자 | 생각 열기
* 🏟️ 원자를 축구장만 하게 키우면 :: 지름 약 100 m
* ⚽ 원자핵 :: 경기장 한가운데의 작은 구슬
* 🌫️ 나머지 :: 대부분 텅 빈 공간에 전자가 움직인다
? 원자 속은 꽉 차 있을까, 비어 있을까? :: 원자 속은 대부분 빈 공간이고, 질량의 대부분은 아주 작은 원자핵에 모여 있다.

= 지난 시간 복습 | 1차시
| 질문 | 답 |
| 물의 구성 원소 | [[수소, 산소]] |
| H₂O 분자 1개의 원자 수 | [[3개]] |

? 원소마다 원자가 다른 까닭은 무엇일까? :: 원자를 이루는 입자의 수가 다르기 때문 — 오늘 확인!

## 원자의 구조 | 원자핵과 전자

= 원자를 이루는 입자
| 입자 | 위치 | 전하 |
|+ 양성자 | 원자핵 | (+) |
|+ 중성자 | 원자핵 | 없음 |
|+ 전자 | 원자핵 주위 | (−) |
>+ 원자 = 원자핵(양성자 + 중성자) + 전자

= 원자는 중성
! 양성자 수 = 전자 수 → 원자는 전기적으로 ==중성==
- 양성자 하나의 (+)전하와 전자 하나의 (−)전하는 크기가 같다.
+ 예: 탄소 원자 → 양성자 6개(+6), 전자 6개(−6) → 합 **0**
>+ 원자 번호 = 양성자 수 = 중성 원자의 전자 수

= 시뮬레이션: 원자 만들기 | 실험실
@ sim.html#atom | 양성자, 중성자, 전자 수를 바꾸며 원소의 이름과 전하가 어떻게 변하는지 기록하자.
% 중성자만 바꾸기 → 양성자 바꾸기 → 전자만 바꾸기 순서로 차이를 발견하게 하기

= 시뮬레이션 결과
| 양성자 | 중성자 | 전자 | 원소 | 전체 전하 |
|+ 6 | 6 | 6 | 탄소 | 0 (중성) |
|+ 6 | 8 | 6 | 탄소 | 0 (중성) |
|+ 8 | 8 | 8 | 산소 | 0 (중성) |
|+ 11 | 12 | 10 | 나트륨 | +1 |
>+ 중성자 수를 바꾸어도 원소는 그대로, ==양성자 수==를 바꾸면 다른 원소!

= 원소와 원자 번호
| 원자 번호 | 1 | 2 | 3 | 6 | 7 | 8 | 11 |
| 원소 | 수소 | 헬륨 | 리튬 | 탄소 | 질소 | 산소 | 나트륨 |
| 양성자 수 | 1 | 2 | 3 | 6 | 7 | 8 | 11 |
| 전자 수 (중성) | 1 | 2 | 3 | 6 | 7 | 8 | 11 |

## 원자 모형의 변천 | 생각이 발전해 온 길

= 원자 모형의 변천
| 과학자 | 원자 모형의 특징 |
|+ 돌턴 | 더 이상 쪼갤 수 없는 단단한 공 |
|+ 톰슨 | (+)전하를 띤 공에 전자가 박혀 있음 |
|+ 러더퍼드 | 가운데 작은 원자핵, 주위에 전자 |
>+ 새로운 실험 결과가 나오면 모형은 ==수정==된다 — 과학의 본성!
% 러더퍼드의 금박 실험: 대부분 통과, 극소수만 튕김 → 원자 속은 대부분 빈 공간

= 원자에 대한 놀라운 사실 | 사례
* 🔬 크기 :: 원자 1억 개를 나란히 놓아야 약 1 cm
* ⚖️ 질량 :: 원자 질량의 대부분은 원자핵에
* 🌫️ 빈 공간 :: 원자 속은 대부분 비어 있다
* ⚡ 전자 :: 양성자보다 훨씬 가볍다 (약 1/1840)
* ☢️ 탄소-14 :: 중성자 수만 다른 탄소 — 연대 측정에 이용
* 🌟 원소 :: 양성자 수가 곧 원소의 '주민 번호'

= 예제 1 · 원자 구성 입자 | 적용
- 원자 번호 7인 질소 원자(중성자 7개)의 구성을 쓰자.
^+ 양성자 수 = 원자 번호 = **7**
^+ 전자 수 = 양성자 수 = **7** (중성 원자)
^+ 원자핵 속 입자 수 = 양성자 7 + 중성자 7 = **14개**

= 예제 2 · 원소 알아내기 | 적용
- 양성자 3, 중성자 4, 전자 3인 원자 모형이 있다.
^+ 원소 결정 → **양성자 수** 3
^+ 원자 번호 3 → **리튬**
^+ 전하 → 양성자 3 = 전자 3 → **중성**

= 예제 3 · 원자 속은 얼마나 비었을까? | 적용
- 원자의 지름은 약 1/10 000 000 000 m, 원자핵의 지름은 그 약 1/100 000이다.
^+ 원자를 축구장(지름 100 m)으로 키우면 → 원자핵 = 100 ÷ 100 000 = **0.001 m = 1 mm**
^+ 모래알만 한 원자핵이 경기장 한가운데에!
>+ 원자 속은 거의 다 ==빈 공간==이다.

= 확인 문제 1
Q 원자핵을 이루는 입자끼리 짝 지은 것은?
o 양성자, 전자
o* 양성자, 중성자
o 중성자, 전자
o 전자만
:: 전자는 원자핵 주위를 움직인다.

= 확인 문제 2
Q 원자에 대한 설명으로 옳지 **않은** 것은?
o 원자핵은 원자의 중심에 있다.
o 양성자는 (+)전하를 띤다.
o* 원자는 양성자 수가 전자 수보다 많아 (+)전하를 띤다.
o 원소의 종류는 양성자 수로 결정된다.
:: 원자는 양성자 수와 전자 수가 같아 중성이다.

= 확인 문제 3
Q 원자 번호가 8인 원자의 양성자 수와 원소 이름은?
o 6, 탄소
o 7, 질소
o* 8, 산소
o 11, 나트륨
:: 원자 번호 = 양성자 수

= 확인 문제 4
Q 탄소 원자에서 중성자 수만 6개 → 8개로 바꾸면?
o 산소가 된다.
o (+)전하를 띤다.
o* 여전히 탄소이다.
o 전자가 2개 늘어난다.
:: 원소의 종류는 양성자 수로 결정된다.

= 서술형 도전 | 생각 넓히기
? 원자를 축구장만 하게 키우면 원자핵은 작은 구슬 정도라고 한다. 이것으로 알 수 있는 원자의 특징을 쓰시오. :: 원자 속은 대부분 빈 공간이고, 원자핵은 원자에 비해 매우 작다.
? 돌턴의 '쪼갤 수 없는 공' 모형이 톰슨의 모형으로 바뀐 까닭을 추론하시오. :: 원자보다 작은 (−)전하 입자인 전자가 발견되어, 원자가 더 작은 입자로 이루어져 있다는 것을 알게 되었기 때문이다.

= 오늘 배운 내용 정리
- 원자 = [[원자핵]](양성자 + 중성자) + [[전자]]
- 양성자는 [[(+)]]전하, 전자는 (−)전하, 중성자는 전하가 없다.
- 양성자 수 = 전자 수 → 원자는 전기적으로 [[중성]]
- 원소의 종류는 [[양성자 수]] (= 원자 번호)로 결정된다.
- 원자 속은 대부분 [[빈 공간]]이다.

= 나가기 전 한 문제 | 형성평가
? 양성자 11개, 중성자 12개, 전자 11개인 원자의 원소 이름과 전하를 쓰고, 전자 1개를 잃으면 어떻게 되는지 예측하시오. :: 나트륨, 중성. 전자 1개를 잃으면 양성자(+11)가 전자(−10)보다 많아져 +1 전하를 띤다(4차시 이온과 연결).
