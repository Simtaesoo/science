## 빛의 합성 | 빨강 · 초록 · 파랑

= 빛의 삼원색
! 빨강 · 초록 · 파랑
- 이 세 빛을 여러 비율로 합성하면 거의 **모든 색**을 만들 수 있다.
+ 세 빛을 모두 같은 밝기로 합성하면 → **흰색**
>+ 물감(섞을수록 어두워짐)과 달리 빛은 합칠수록 ==밝아진다==.

= 시뮬레이션: 빛의 합성과 색 | 실험실
@ sim.html#color | 빨강·초록·파랑 빛을 켜고 끄며 합성된 색을 확인하자.
% 두 빛씩 켜서 노랑·자홍·청록을 확인한 뒤 세 빛 모두 → 흰색

= 합성된 빛의 색
| 합성한 빛 | 보이는 색 |
|+ 빨강 + 초록 | **노랑** |
|+ 빨강 + 파랑 | **자홍** |
|+ 초록 + 파랑 | **청록** |
|+ 빨강 + 초록 + 파랑 | **흰색** |

= 영상 장치의 원리
- 화면은 아주 작은 점(**화소**)으로 이루어져 있다.
+ 화소마다 빨강·초록·파랑 빛을 내는 작은 부분이 있다.
+ 세 빛의 **밝기**를 조절하여 여러 가지 색을 나타낸다.
>+ 너무 작아서 눈이 각각 구별하지 못하고 ==합성된 색==으로 본다.

## 물체의 색 | 반사하는 빛의 색

= 물체의 색
! 물체의 색 = 물체가 ==반사==하는 빛의 색
- 나머지 빛은 **흡수**한다.
| 물체 | 반사하는 빛 | 흰빛 아래 | 빨간빛 아래 | 초록빛 아래 |
|+ 빨간 사과 | 빨강 | 빨간색 | 빨간색 | 검은색 |
|+ 노란 바나나 | 빨강, 초록 | 노란색 | 빨간색 | 초록색 |
|+ 흰 종이 | 모든 빛 | 흰색 | 빨간색 | 초록색 |

= 생활 속 빛과 색 | 사례
* 📺 TV·모니터 :: 빛의 삼원색 화소로 모든 색
* 🎭 무대 조명 :: 조명 색에 따라 의상 색이 달라 보인다
* 🍎 과일 가게 빨간 조명 :: 사과가 더 붉고 신선해 보인다
* 👕 여름 흰 옷 :: 빛을 대부분 반사해 덜 뜨겁다
* 🖤 검은 아스팔트 :: 빛을 대부분 흡수해 뜨겁다
* 🌈 LED 조명 :: 세 빛을 조절해 원하는 색

= 예제 1 · 화면의 색 | 적용
- 화면을 돋보기로 보았더니 초록과 파랑 화소만 켜져 있었다.
^+ 켜진 빛 → **초록 + 파랑**
^+ 합성된 색 → **청록**
^+ 빨강 화소까지 같은 밝기로 켜지면 → **흰색**

= 예제 2 · 화소와 색의 수 | 적용
- 한 화면이 가로 1920개 × 세로 1080개의 화소로 되어 있고, 각 화소의 빨강·초록·파랑이 256단계 밝기를 낸다.
^+ 화소 수 = 1920 × 1080 = **2 073 600개**
^+ 빛을 내는 작은 부분 = 2 073 600 × 3 = **6 220 800개**
^+ 나타낼 수 있는 색 = 256 × 256 × 256 = **16 777 216가지** (약 1677만 색)

= 예제 3 · 조명 아래의 색 | 적용
- 무대 조명으로 초록빛만 비춘다. 빨간 옷, 노란 모자, 흰 장갑은?
^+ 빨간 옷 → 빨간빛만 반사 → 반사할 빛 없음 → **검은색**
^+ 노란 모자 → 빨강·초록 반사 → 초록 반사 → **초록색**
^+ 흰 장갑 → 모든 빛 반사 → 초록 반사 → **초록색**

= 확인 문제 1
Q 빛의 삼원색은?
o 빨강, 노랑, 파랑
o* 빨강, 초록, 파랑
o 자홍, 노랑, 청록
o 빨강, 초록, 노랑
:: 빛의 삼원색은 빨강, 초록, 파랑이다.

= 확인 문제 2
Q 빨간빛과 파란빛을 합성했을 때 보이는 색은?
o 노랑
o 청록
o* 자홍
o 흰색
:: 빨강 + 파랑 = 자홍

= 확인 문제 3
Q 흰빛 아래에서 노랗게 보이는 바나나를 빨간빛 아래에 두면?
o 노란색
o* 빨간색
o 초록색
o 검은색
:: 바나나는 빨강·초록을 반사하는데 빨간빛만 있으므로 빨간색으로 보인다.

= 확인 문제 4
Q 물체가 검은색으로 보이는 까닭은?
o 모든 빛을 반사하기 때문
o* 모든 빛을 흡수하기 때문
o 빨간빛만 반사하기 때문
o 스스로 검은빛을 내기 때문
:: 반사하는 빛이 없으면 검은색으로 보인다.

= 서술형 도전 | 생각 넓히기
? 여름에 흰 옷을 입으면 검은 옷보다 시원한 까닭을 빛의 반사와 흡수로 설명하시오. :: 흰 옷은 대부분의 빛을 반사하고, 검은 옷은 대부분의 빛을 흡수하여 더 뜨거워지기 때문이다.
? 과일 가게에서 빨간 조명을 비추면 사과가 더 신선해 보인다. 원리와 소비자가 주의할 점을 쓰시오. :: 사과가 반사하는 빨간빛이 강해져 색이 선명해 보인다. 조명 때문에 실제보다 좋아 보일 수 있으므로 자연광에서 확인해야 한다.

= 오늘 배운 내용 정리
- 빛의 삼원색 = 빨강, [[초록]], 파랑 → 모두 합성하면 [[흰색]]
- 빨강 + 초록 = [[노랑]], 빨강 + 파랑 = [[자홍]], 초록 + 파랑 = [[청록]]
- 영상 장치는 화소마다 세 빛의 [[밝기]]를 조절해 색을 나타낸다.
- 물체의 색 = 물체가 [[반사]]하는 빛의 색
- 모든 빛을 흡수하면 [[검은색]]으로 보인다.

= 나가기 전 한 문제 | 형성평가
? 처음의 노란 화면에서 빨간 화소만 끄면 화면은 무슨 색으로 보일지 쓰고 까닭을 쓰시오. :: 초록색. 초록 화소만 켜져 있어 합성될 다른 빛이 없기 때문이다.
