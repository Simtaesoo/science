## 평면거울의 상 | 거울 뒤의 또 다른 나

= 상이 생기는 원리
^+ 물체에서 나온 빛이 거울에서 **반사 법칙**에 따라 반사된다
^+ 반사된 빛이 눈에 들어온다
^+ 눈은 빛이 **곧게** 왔다고 생각 → 반사된 빛의 **연장선**이 만나는 거울 뒤쪽에 물체가 있는 것처럼 본다
>+ 이렇게 보이는 물체의 모습 = ==상==

= 평면거울의 상의 특징
| 특징 | 내용 |
|+ 크기 | 물체와 **같다** |
|+ 거리 | 거울 ~ 물체 = 거울 ~ **상** |
|+ 방향 | **바로 선** 상, **좌우**가 바뀐다 |
|+ 위치 | 거울 **뒤쪽** (빛이 실제로 가지 않는 곳) |

## 거울과 렌즈 | 볼록과 오목

= 시뮬레이션: 거울과 렌즈 | 실험실
@ sim.html#image | 기구를 바꾸고, 물체를 가까이(30) 놓을 때와 멀리(90) 놓을 때 상의 모양을 비교하자.
% 볼록 거울 → 오목 거울 → 볼록 렌즈 → 오목 렌즈 순서로 표 채우기

= 거울과 렌즈의 상
| 기구 | 모양 | 물체가 가까울 때 | 물체가 멀 때 |
|+ 볼록 거울 | 바깥으로 볼록 | 작고 바로 선 상 | 작고 바로 선 상 |
|+ 오목 거울 | 안으로 오목 | 크고 바로 선 상 | 거꾸로 선 상 |
|+ 볼록 렌즈 | 가운데가 두꺼움 | 크고 바로 선 상 | 거꾸로 선 상 |
|+ 오목 렌즈 | 가운데가 얇음 | 작고 바로 선 상 | 작고 바로 선 상 |

= 짝으로 기억하기
| 항상 작고 바로 선 상 | 가까우면 크고 바로, 멀면 거꾸로 |
| 볼록 거울, 오목 렌즈 | 오목 거울, 볼록 렌즈 |
| 빛을 **퍼지게** 한다 | 빛을 **모은다** |
>+ 거울과 렌즈는 볼록·오목이 ==서로 반대==로 짝을 이룬다.

= 생활 속 거울과 렌즈 | 사례
* 🚗 자동차 측면 거울 :: 볼록 거울 — 넓은 범위
* 🛣️ 굽은 길 반사경 :: 볼록 거울 — 사각지대 확인
* 🦷 치과 거울 :: 오목 거울 — 이를 크게
* 🔦 손전등 반사판 :: 오목 거울 — 빛을 모아 멀리
* 🔍 돋보기 :: 볼록 렌즈 — 가까운 물체를 크게
* 👓 근시 안경 :: 오목 렌즈 — 빛을 퍼지게

= 예제 1 · 거울 앞으로 다가가기 | 적용
- 거울 앞 1 m에 선 사람이 거울 쪽으로 0.5 m 다가갔다.
^+ 거울까지 거리 = 1 − 0.5 = **0.5 m**
^+ 거울에서 상까지 거리 = **0.5 m**
^+ 사람과 상 사이 거리 = 0.5 + 0.5 = **1 m** (처음 2 m에서 1 m 줄었다)
>+ 내가 0.5 m 다가가면 상과의 거리는 그 2배인 1 m가 줄어든다.

= 예제 2 · 전신 거울의 최소 길이 | 적용
- 키 160 cm인 학생이 평면거울로 온몸을 보려고 한다. (거울과의 거리는 상관없다)
^+ 눈에서 정수리, 눈에서 발끝까지의 빛이 거울에서 반사된다
^+ 반사 법칙 → 거울에서 반사되는 지점은 각각의 **중간 높이**
^+ 거울의 최소 길이 = 160 ÷ 2 = **80 cm**
% 그림으로 반사 지점이 '중간'에 오는 까닭을 반사 법칙으로 보여 주기

= 예제 3 · 구급차 글자 | 적용
^+ 앞차 운전자는 **평면거울**(백미러)로 뒤를 본다
^+ 평면거울의 상은 **좌우가 바뀐다**
^+ 처음부터 좌우를 바꿔 쓰면 → 거울에서 한 번 더 바뀌어 **바르게** 읽힌다

= 확인 문제 1
Q 평면거울의 상에 대한 설명으로 옳지 **않은** 것은?
o 상의 크기는 물체와 같다.
o 거울에서 상까지의 거리는 거울에서 물체까지의 거리와 같다.
o 좌우가 바뀌어 보인다.
o* 상은 거울 앞쪽에 생긴다.
:: 상은 거울 뒤쪽에 있는 것처럼 보인다.

= 확인 문제 2
Q 자동차 측면 거울에 쓰이는 거울과 그 까닭은?
o 오목 거울, 상이 크게 보여서
o* 볼록 거울, 넓은 범위를 볼 수 있어서
o 평면거울, 상의 크기가 같아서
o 볼록 거울, 상이 거꾸로 보여서
:: 볼록 거울은 상이 작지만 넓은 범위가 보인다.

= 확인 문제 3
Q 물체와의 거리에 관계없이 항상 작고 바로 선 상을 만드는 것끼리 고른 것은?
o 볼록 거울, 볼록 렌즈
o 오목 거울, 오목 렌즈
o* 볼록 거울, 오목 렌즈
o 오목 거울, 볼록 렌즈
:: 빛을 퍼지게 하는 볼록 거울과 오목 렌즈

= 확인 문제 4
Q 거울 앞 2 m에 서 있던 사람이 1.5 m 뒤로 물러났다. 사람과 상 사이의 거리는?
o 3.5 m
o 4 m
o* 7 m
o 5.5 m
:: 거울까지 3.5 m, 상까지 3.5 m → 7 m

= 서술형 도전 | 생각 넓히기
? 도로 굽은 길에 설치한 반사경으로 볼록 거울을 쓰는 까닭을 쓰시오. :: 볼록 거울은 상이 작게 보이는 대신 넓은 범위를 볼 수 있어 반대편에서 오는 차를 확인할 수 있기 때문이다.
? 거울 두 개로 담장 너머를 볼 수 있는 잠망경을 설계하시오. :: 긴 통의 위와 아래에 평면거울 두 개를 서로 나란하게 45° 기울여 놓는다. 위쪽 거울에서 반사된 빛이 아래쪽 거울에서 다시 반사되어 눈에 들어온다.

= 오늘 배운 내용 정리
- 평면거울의 상: 크기가 [[같고]], 거울 뒤 [[같은 거리]]에 생기며 [[좌우]]가 바뀐다.
- 볼록 거울·오목 렌즈 → 항상 [[작고 바로 선]] 상
- 오목 거울·볼록 렌즈 → 가까우면 크고 바로 선 상, 멀면 [[거꾸로 선]] 상
- 자동차 측면 거울 = [[볼록 거울]], 돋보기 = [[볼록 렌즈]], 근시 안경 = 오목 렌즈

= 나가기 전 한 문제 | 형성평가
? 숟가락의 안쪽(오목)과 바깥쪽(볼록)에 얼굴을 멀리서 비추면 각각 어떤 상이 보일지 쓰시오. :: 안쪽(오목 거울)에서는 거꾸로 선 상, 바깥쪽(볼록 거울)에서는 작고 바로 선 상이 보인다.
