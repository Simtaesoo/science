# 빛의 반사와 굴절 | 우리는 어떻게 물체를 볼까? | 중학교 과학 2 · 10 빛과 파동 · 1차시 | 2022 개정 교육과정 [9과10-01]

= 오늘의 학습 목표 | 1차시
^ 광원과 광원이 아닌 물체를 보는 **과정**을 빛의 경로로 표현할 수 있다.
^ **반사 법칙**(입사각 = 반사각)을 설명할 수 있다.
^ 빛의 **굴절** 방향을 설명하고 생활 속 현상에 적용할 수 있다.
% 흐름: 생각 열기 5분 → 물체를 보는 과정 8분 → 반사 10분 → 굴절 12분 → 문항·퍼즐 10분

= 컵 속 빨대가 부러졌다? | 생각 열기
* 🥤 물컵 속 빨대 :: 수면에서 꺾여 보인다
* 🏊 수영장 :: 바닥이 실제보다 얕아 보인다
* 🌑 캄캄한 방 :: 눈을 크게 떠도 사과가 보이지 않는다
? 빛이 없으면 왜 물체가 보이지 않고, 물속 물체는 왜 꺾여 보일까? :: 물체에서 반사된 빛이 눈에 들어와야 보이고, 빛이 물에서 공기로 나올 때 꺾이기(굴절) 때문이다.

| 질문 | 답 |
| 열이 물질 없이 전달되는 방식 | [[복사]] |

## 물체를 보는 과정 | 빛이 눈에 들어와야

= 광원과 물체
| 보는 것 | 빛의 경로 |
|+ 광원 (스스로 빛을 냄: 태양, 전등) | 광원 → 눈 |
|+ 광원이 아닌 물체 (사과, 책) | 광원 → 물체에서 **반사** → 눈 |
>+ 캄캄한 방에서 사과가 보이지 않는 까닭 → 반사할 빛이 없다!
% 눈에서 빛이 나간다는 오개념 확인 — 화살표 방향을 꼭 눈 쪽으로

## 빛의 반사 | 되돌아 나오는 빛

= 반사 법칙
! 입사각 = 반사각
- **빛의 반사**: 빛이 물체 표면에서 되돌아 나오는 현상
+ **법선**: 반사면에 수직인 선
+ 입사각: 입사 광선과 법선 사이의 각, 반사각: 반사 광선과 법선 사이의 각
>+ 매끄러운 면 → ==정반사==, 울퉁불퉁한 면 → ==난반사==

= 정반사와 난반사
| | 정반사 | 난반사 |
| 표면 | 매끄럽다 | 울퉁불퉁하다 |
| 반사된 빛 | 한 방향으로 나란히 | 여러 방향으로 퍼짐 |
| 예 | 거울, 잔잔한 호수 | 종이, 옷, 칠판 |
>+ 난반사에서도 각각의 빛은 반사 법칙을 지킨다. 표면의 법선 방향이 제각각일 뿐!

## 빛의 굴절 | 경계에서 꺾이는 빛

= 빛의 굴절
! 빛이 서로 다른 물질의 경계면을 지날 때 진행 방향이 꺾이는 현상
- 공기 → 물: 빛이 **법선 쪽으로** 꺾인다 (입사각 > 굴절각)
+ 물 → 공기: 법선에서 **멀어지는 쪽**으로 꺾인다
+ 수직으로 들어가면 꺾이지 않는다.

= 시뮬레이션: 반사와 굴절 | 실험실
@ sim.html#refl | 입사각을 바꾸며 반사각과 굴절각(물, 유리)을 측정하자.
% 입사각 20°, 40°, 60°에서 측정 → 표 정리

= 측정 결과
| 입사각 | 20° | 40° | 60° |
|+ 반사각 | 20° | 40° | 60° |
|+ 굴절각 (물) | 약 15° | 약 29° | 약 41° |
|+ 굴절각 (유리) | 약 13° | 약 25° | 약 35° |
>+ 반사각은 항상 입사각과 ==같다==. 물보다 ==유리==에서 빛이 더 많이 꺾인다.

= 그래프로 보면
C 입사각과 굴절각 (공기 → 물질) | 입사각 (°) | 각 (°) | 반사각:0,0 20,20 40,40 60,60 | 굴절각 (물):0,0 20,14.9 40,28.9 60,40.6 | 굴절각 (유리):0,0 20,13.2 40,25.4 60,35.3
~ 굴절각은 언제나 입사각보다 작고, 유리가 물보다 더 작다

= 생활 속 반사와 굴절 | 사례
* 🥤 꺾여 보이는 빨대 :: 물에서 공기로 나오는 빛의 굴절
* 🏊 얕아 보이는 수영장 :: 바닥이 실제보다 위에 있는 것처럼
* 🌈 무지개 :: 물방울 속에서 빛이 굴절·반사
* 🪞 거울 :: 정반사로 모습이 비친다
* 📄 흰 종이 :: 난반사로 어느 방향에서도 보인다
* 🏜️ 신기루 :: 뜨거운 공기층에서 빛이 휘어진다

= 예제 1 · 반사각 구하기 | 적용
- 거울에 빛을 입사각 30°로 비추었다.
^+ 반사 법칙 → 반사각 = **30°**
^+ 입사 광선과 반사 광선이 이루는 각 = 30 + 30 = **60°**
^+ 거울 면과 반사 광선이 이루는 각 = 90 − 30 = **60°**
>+ 입사각은 '거울 면'이 아니라 '법선'에서 잰다는 점에 주의!

= 예제 2 · 빛의 경로 그리기 | 적용
- 전등 빛을 받은 사과를 보는 과정을 화살표로 나타내자.
^+ 출발 → **전등** (광원)
^+ 사과 표면에서 **반사**
^+ 반사된 빛이 **눈**으로 → 전등 → 사과 → 눈
>+ 화살표가 눈에서 사과로 가면 틀린 답!

= 예제 3 · 꺾여 보이는 빨대 | 적용
^+ 물속 빨대에서 반사된 빛이 물 → 공기로 나온다
^+ 경계면에서 법선에서 **멀어지는** 쪽으로 꺾인다
^+ 눈은 빛이 **곧게** 왔다고 생각 → 빨대가 실제보다 **위쪽**에 있는 것처럼 보인다
>+ 그래서 물속 빨대가 수면에서 꺾여 보인다.

= 확인 문제 1
Q 광원이 아닌 물체를 보는 과정으로 옳은 것은?
o 눈 → 물체
o 물체 → 광원 → 눈
o* 광원 → 물체 → 눈
o 눈 → 광원 → 물체
:: 광원의 빛이 물체에서 반사되어 눈에 들어온다.

= 확인 문제 2
Q 거울에 입사각 50°로 빛을 비출 때 반사각은?
o 40°
o* 50°
o 90°
o 100°
:: 입사각 = 반사각

= 확인 문제 3
Q 흰 종이에 빛을 비추면 어느 방향에서도 종이가 보이는 까닭은?
o 종이가 빛을 흡수하기 때문
o* 종이 표면에서 난반사가 일어나 빛이 여러 방향으로 퍼지기 때문
o 종이가 스스로 빛을 내기 때문
o 빛이 종이를 통과하기 때문
:: 울퉁불퉁한 표면에서 난반사가 일어난다.

= 확인 문제 4
Q 빛이 공기에서 유리로 비스듬히 들어갈 때의 설명으로 옳은 것은?
o 굴절각이 입사각보다 크다.
o* 빛이 법선 쪽으로 꺾인다.
o 빛이 꺾이지 않는다.
o 빛이 모두 반사된다.
:: 공기 → 유리, 물: 입사각 > 굴절각

= 서술형 도전 | 생각 넓히기
? 수영장 바닥이 실제보다 얕아 보이는 까닭을 빛의 경로로 설명하시오. :: 바닥에서 반사된 빛이 물에서 공기로 나오며 굴절되는데, 눈은 빛이 곧게 왔다고 생각하므로 바닥이 실제보다 위쪽에 있는 것처럼 보이기 때문이다.
? 비 온 뒤 젖은 아스팔트는 거울처럼 번쩍여 운전자가 눈부시고, 마른 아스팔트는 그렇지 않다. 그 까닭을 반사의 종류로 설명하시오. :: 젖은 도로는 물이 틈을 메워 표면이 매끄러워져 정반사가 일어나 빛이 한 방향으로 강하게 반사되고, 마른 도로는 울퉁불퉁해 난반사가 일어나 빛이 여러 방향으로 퍼지기 때문이다.

= 오늘 배운 내용 정리
- 광원이 아닌 물체는 광원의 빛이 물체에서 [[반사]]되어 눈에 들어와야 보인다.
- 반사 법칙: 입사각 = [[반사각]]
- 매끄러운 면 → [[정반사]], 울퉁불퉁한 면 → [[난반사]]
- 서로 다른 물질의 경계에서 빛이 꺾이는 현상 = [[굴절]]
- 공기 → 물: 빛이 [[법선]] 쪽으로 꺾인다.
