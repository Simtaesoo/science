## 파동 | 퍼져 나가는 진동

= 파동과 매질
! 파동 = 한 곳에서 생긴 진동이 주위로 퍼져 나가는 현상
- **매질**: 파동을 전달하는 물질 (물결파 → 물, 소리 → 공기)
+ 매질은 **제자리에서 진동**할 뿐 이동하지 않는다.
+ 파동을 따라 이동하는 것은 ==에너지==이다.
>+ 물결 위 나뭇잎은 위아래로 흔들릴 뿐 물결을 따라 떠내려가지 않는다.

= 파동의 요소
| 요소 | 뜻 |
|+ 마루 · 골 | 가장 높은 곳 · 가장 낮은 곳 |
|+ 진폭 | 진동 중심에서 마루(최고점)까지의 거리 |
|+ 파장 | 마루에서 다음 마루까지의 거리 |
|+ 진동수 | 1초 동안 진동한 횟수 (단위 **Hz**) |
>+ 440 Hz = 1초에 440번 진동 — 피아노의 '라' 음

= 진폭과 진동수 비교
C 같은 시간 동안의 두 소리의 파형 | 시간 (초) | 변위 | 높은 소리 (진동수 큼):0,0 0.0625,0.71 0.125,1 0.1875,0.71 0.25,0 0.3125,-0.71 0.375,-1 0.4375,-0.71 0.5,-0 0.5625,0.71 0.625,1 0.6875,0.71 0.75,0 0.8125,-0.71 0.875,-1 0.9375,-0.71 1,-0 | 큰 소리 (진폭 큼):0,0 0.0625,0.77 0.125,1.41 0.1875,1.85 0.25,2 0.3125,1.85 0.375,1.41 0.4375,0.77 0.5,0 0.5625,-0.77 0.625,-1.41 0.6875,-1.85 0.75,-2 0.8125,-1.85 0.875,-1.41 0.9375,-0.77 1,-0
~ 큰 소리는 위아래로 크게(진폭), 높은 소리는 촘촘하게(진동수가 크고 파장이 짧게)

## 소리 | 공기의 진동

= 시뮬레이션: 파동과 소리 | 실험실
@ sim.html#wave | [소리 듣기]를 누르고 진폭, 진동수, 파형을 하나씩 바꾸며 들리는 소리와 파형을 비교하자.
% 소리가 나므로 볼륨 주의. 진동수는 220 → 880 Hz로 올리며 '높아진다' 확인

= 소리의 3요소
| 바꾼 것 | 파형의 변화 | 들리는 소리 | 소리의 요소 |
|+ 진폭 ↑ | 위아래로 커짐 | 소리가 커짐 | **세기** |
|+ 진동수 ↑ | 촘촘해짐 | 높은 소리 | **높낮이** |
|+ 파형 | 모양이 달라짐 | 다른 악기 소리 | **맵시** |
|+ 유리종 속 공기 ↓ | 진폭이 작아짐 | 소리가 작아짐 | **매질** 필요 |

= 생활 속 파동과 소리 | 사례
* 🎸 기타 줄 :: 줄을 짧게 누르면 진동수가 커져 높은 소리
* 🔊 볼륨 버튼 :: 진폭을 바꿔 소리의 세기를 조절
* 🎹 피아노와 바이올린 :: 같은 '라'라도 파형이 달라 맵시가 다르다
* 🚂 선로에 귀 대기 :: 고체에서 소리가 더 빨리 전달
* 🌌 우주 :: 매질이 없어 소리가 전달되지 않는다
* 🎧 소음 제거 이어폰 :: 반대 모양 파동으로 소음을 줄인다

= 예제 1 · 진동수 구하기 | 적용
- 소리굽쇠가 2초 동안 880번 진동했다.
^+ 진동수 = 진동 횟수 ÷ 시간
^+ = 880 ÷ 2 = **440 Hz**
^+ 한 번 진동하는 데 걸리는 시간 = 1 ÷ 440 ≈ **0.0023초**

= 예제 2 · 메아리로 거리 재기 | 적용
- 산을 향해 소리치고 2초 뒤 메아리를 들었다. (공기 중 소리의 빠르기 340 m/s)
^+ 소리가 이동한 거리 = 340 × 2 = **680 m** (왕복)
^+ 산까지의 거리 = 680 ÷ 2 = **340 m**
>+ 번개가 친 뒤 3초 뒤에 천둥을 들으면 → 340 × 3 = **1020 m** 떨어진 곳 (빛은 거의 바로 도착)

= 예제 3 · 파형 비교 | 적용
- (가) 진폭 1칸·파장 4칸 (나) 진폭 2칸·파장 4칸 (다) 진폭 1칸·파장 2칸
^+ 가장 큰 소리 → 진폭이 가장 큰 **(나)**
^+ 가장 높은 소리 → 진동수가 가장 큰(파장이 짧은) **(다)**
^+ (가)와 (나)의 높낮이 → 파장이 같으므로 **같다**

= 확인 문제 1
Q 파동이 전달될 때 매질에 대한 설명으로 옳은 것은?
o 매질이 파동을 따라 멀리 이동한다.
o* 매질은 제자리에서 진동하고 에너지가 전달된다.
o 모든 파동은 매질이 없어야 전달된다.
o 매질은 진동하지 않는다.
:: 파도타기에서 관중은 제자리에 있다.

= 확인 문제 2
Q 소리의 높낮이와 관계있는 것은?
o 진폭
o* 진동수
o 파형
o 매질의 종류
:: 진동수가 클수록 높은 소리이다.

= 확인 문제 3
Q 같은 '도' 음을 피아노와 바이올린으로 연주하면 다르게 들리는 까닭은?
o 진폭이 다르기 때문
o 진동수가 다르기 때문
o* 파형이 다르기 때문
o 매질이 없기 때문
:: 높낮이(진동수)는 같지만 맵시(파형)가 다르다.

= 확인 문제 4
Q 1초에 220번 진동하는 소리의 진동수는?
o 0.22 Hz
o* 220 Hz
o 440 Hz
o 2200 Hz
:: 진동수는 1초 동안의 진동 횟수이다.

= 서술형 도전 | 생각 넓히기
? 기차 선로에 귀를 대면 멀리서 오는 기차 소리를 공기 중보다 먼저 들을 수 있다. 이것으로 알 수 있는 사실을 쓰시오. :: 소리는 고체(선로)를 통해서도 전달되며, 공기보다 고체에서 더 빠르게 전달된다.
? 방음벽과 소음 제거 이어폰은 서로 다른 원리를 쓴다. 각각의 원리를 쓰시오. :: 방음벽은 소리를 반사하거나 흡수하여 전달을 막고, 소음 제거 이어폰은 소음과 반대 모양의 파동을 만들어 겹치게 하여 소음을 줄인다.

= 오늘 배운 내용 정리
- 진동이 주위로 퍼져 나가는 현상 = [[파동]], 파동을 전달하는 물질 = [[매질]]
- 파동을 따라 매질은 이동하지 않고 [[에너지]]가 전달된다.
- 1초 동안 진동한 횟수 = [[진동수]], 단위 Hz
- 소리의 세기 ↔ [[진폭]], 높낮이 ↔ [[진동수]], 맵시 ↔ [[파형]]
- 소리는 매질이 없는 [[진공]]에서 전달되지 않는다.

= 나가기 전 한 문제 | 형성평가
