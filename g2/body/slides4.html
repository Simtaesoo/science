# 배설 | 노폐물을 걸러 내는 콩팥 | 중학교 과학 2 · 13 동물과 에너지 · 4차시 | 2022 개정 교육과정 [9과13-04]

= 오늘의 학습 목표 | 4차시
^ 영양소의 세포 호흡 결과 생기는 **노폐물**과 그 배설 경로를 설명할 수 있다.
^ **배설계**의 구조와 **네프론**의 구성을 말할 수 있다.
^ **여과·재흡수·분비**로 오줌이 만들어지는 과정을 설명하고 자료를 해석할 수 있다.
% 흐름: 생각 열기 5분 → 노폐물 8분 → 배설계·네프론 7분 → 오줌 생성 시뮬레이션 12분 → 자료 해석·문항 13분

= 하루 180 L를 걸러 1.5 L만 | 생각 열기
* 🫘 콩팥 두 개 :: 주먹만 한 크기
* 🚰 하루에 거르는 양 :: 약 180 L (큰 물통 9개!)
* 🚽 하루 오줌의 양 :: 약 1.5 L
? 걸러 낸 180 L 중 나머지는 어디로 갔을까? :: 대부분 다시 혈액으로 흡수(재흡수)되고, 노폐물이 농축된 일부만 오줌이 된다.

= 지난 시간 복습 | 2·3차시
| 질문 | 답 |
| 물질 교환이 일어나는 혈관 | [[모세 혈관]] |
| 이산화 탄소가 몸 밖으로 나가는 기관 | [[폐]] |
| 기체 교환의 원리 | [[확산]] |
? 세포 호흡으로 생기는 노폐물은? :: 이산화 탄소, 물, (단백질의 경우) 암모니아

## 노폐물과 배설 | 무엇을, 어디로?

= 노폐물의 생성
| 영양소 | 세포 호흡 결과 생기는 노폐물 | 몸 밖으로 나가는 방법 |
|+ 탄수화물, 지방 | 이산화 탄소, 물 | CO₂: 폐 / 물: 폐, 콩팥, 땀 |
|+ 단백질 | 이산화 탄소, 물, 암모니아 | 암모니아 → 간에서 요소 → 콩팥에서 오줌으로 |
>+ ==배설==: 세포 호흡 결과 생긴 노폐물을 몸 밖으로 내보내는 과정

= 배설계와 네프론
^+ 배설계: **콩팥** → 오줌관 → **방광** → 요도
^+ 오줌을 만드는 단위 = **네프론**
^+ 네프론 = **사구체** + **보먼주머니** + **세뇨관**
>+ 콩팥 하나에 네프론이 약 100만 개 있다.

## 오줌의 생성 | 여과 · 재흡수 · 분비

= 시뮬레이션: 오줌이 만들어지는 과정 | 실험실
@ sim.html#excr | 네프론을 따라 이동하는 입자 중 어떤 것이 사라지고(재흡수) 어떤 것이 끝까지 남는지 관찰하자.
% 혈구·단백질은 '여과되지 않음', 포도당은 '모두 재흡수', 요소는 '끝까지 남음'을 색으로 구분

= 세 과정
| 과정 | 물질의 이동 | 이동하는 물질 |
|+ 여과 | 사구체 → 보먼주머니 | 물, 포도당, 아미노산, 무기염류, 요소 (혈구·단백질은 X) |
|+ 재흡수 | 세뇨관 → 모세 혈관 | 포도당·아미노산 전부, 물·무기염류의 대부분 |
|+ 분비 | 모세 혈관 → 세뇨관 | 혈액에 남은 노폐물 일부 |
>+ 사구체 → 보먼주머니 → 세뇨관 → 콩팥 깔때기 → 오줌관 → 방광 → 요도

= 자료 해석 | 성분 (g/100 mL)
| 성분 | 혈장 | 여과액 (보먼주머니) | 오줌 |
|+ 단백질 | 8 | 0 | 0 |
|+ 포도당 | 0.1 | 0.1 | 0 |
|+ 요소 | 0.03 | 0.03 | 2 |
|+ 무기염류 | 0.9 | 0.9 | 1.5 |

= 생활 속 배설 | 사례
* 💧 물을 많이 마신 날 :: 물의 재흡수가 줄어 오줌이 묽고 많다
* 🏃 땀을 많이 흘린 날 :: 물을 많이 재흡수해 오줌이 진하다
* 🩺 소변 검사 :: 포도당·단백질이 나오면 이상 신호
* 🏥 인공 신장기 :: 콩팥 대신 혈액을 걸러 준다
* 🥩 단백질을 많이 먹으면 :: 요소가 많이 생겨 콩팥이 일을 더 한다
* 🐟 물고기 :: 암모니아를 물로 바로 내보낸다

= 예제 1 · 단백질과 포도당 | 적용
^+ 단백질: 혈장 8 → 여과액 **0** → 크기가 커서 사구체에서 **여과되지 않는다**
^+ 포도당: 여과액 0.1 → 오줌 **0** → 세뇨관에서 **모두 재흡수**된다
^+ 무기염류: 오줌에 남음 → 일부만 재흡수되어 **양을 조절**한다

= 예제 2 · 요소의 농축 | 적용
- 요소: 여과액 0.03 g/100 mL → 오줌 2 g/100 mL
^+ 농축된 정도 = 2 ÷ 0.03 ≈ **67배**
^+ 까닭: 세뇨관에서 물이 **대부분 재흡수**되어 요소가 진해졌다
^+ 분비로 요소가 **더해지기도** 한다

= 예제 3 · 재흡수되는 물의 비율 | 적용
- 하루 여과량 약 180 L, 오줌 약 1.5 L
^+ 재흡수된 양 = 180 − 1.5 = **178.5 L**
^+ 재흡수 비율 = 178.5 ÷ 180 × 100 ≈ **99.2 %**
^+ 하루에 여과되는 포도당 = 0.1 g/100 mL × 180 000 mL = **180 g** → 모두 재흡수!

= 확인 문제 1
Q 단백질이 세포 호흡에 쓰일 때 생기는 노폐물 중 간에서 요소로 바뀌는 것은?
o 이산화 탄소
o 물
o* 암모니아
o 포도당
:: 독성이 강한 암모니아가 간에서 요소로 바뀐다.

= 확인 문제 2
Q 네프론을 이루는 구조가 **아닌** 것은?
o 사구체
o 보먼주머니
o 세뇨관
o* 방광
:: 방광은 오줌을 잠시 저장하는 기관이다.

= 확인 문제 3
Q 사구체에서 보먼주머니로 여과되지 **않는** 것은?
o 물
o 포도당
o 요소
o* 단백질
:: 혈구와 단백질은 크기가 커서 여과되지 않는다.

= 확인 문제 4
Q 정상인의 오줌에서 검출되지 않는 물질은?
o 물
o 요소
o 무기염류
o* 포도당
:: 여과된 포도당은 세뇨관에서 모두 재흡수된다.

= 서술형 도전 | 생각 넓히기
? 혈액 속 포도당 농도가 지나치게 높으면 오줌에 포도당이 섞여 나올 수 있다. 그 까닭을 재흡수와 관련지어 쓰시오. :: 여과되는 포도당이 너무 많으면 세뇨관에서 모두 재흡수하지 못하고 남은 포도당이 오줌으로 나오기 때문이다.
? 콩팥이 제 기능을 하지 못하는 사람이 쓰는 인공 신장기가 해야 할 일 두 가지를 오줌 생성 과정과 관련지어 쓰시오. :: 혈액에서 요소 같은 노폐물을 걸러 내야 하고(여과), 포도당처럼 몸에 필요한 물질은 혈액에 남겨 두어야 한다(재흡수의 역할).

= 오늘 배운 내용 정리
- 세포 호흡 결과 생긴 노폐물을 몸 밖으로 내보내는 과정 = [[배설]]
- 암모니아는 간에서 [[요소]]로 바뀌어 콩팥에서 오줌으로 나간다.
- 네프론 = 사구체 + [[보먼주머니]] + 세뇨관
- 사구체 → 보먼주머니 = [[여과]], 세뇨관 → 모세 혈관 = [[재흡수]], 모세 혈관 → 세뇨관 = [[분비]]
- 포도당은 [[모두]] 재흡수되어 오줌에 없다.

= 나가기 전 한 문제 | 형성평가
? 처음의 '180 L를 걸러 1.5 L만'에서, 콩팥이 굳이 많이 걸렀다가 다시 흡수하는 방식의 장점을 추론하시오. :: 혈액 속 물질을 크기로 한꺼번에 걸러 낸 뒤 필요한 것만 골라 다시 흡수하므로, 노폐물을 빠짐없이 내보내면서 몸에 필요한 물질과 물의 양을 정밀하게 조절할 수 있다.
