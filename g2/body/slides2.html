## 심장과 혈관 | 펌프와 길

= 심장의 구조
- 심장은 2개의 **심방**과 2개의 **심실**로 되어 있다.
+ 심방: 혈액을 **받아들인다** / 심실: 혈액을 **내보낸다**
+ **판막**: 심방과 심실 사이, 심실과 동맥 사이 → 혈액이 거꾸로 흐르는 것을 막는다
>+ 근육이 가장 두꺼운 곳 = 온몸으로 혈액을 내보내는 ==좌심실==

= 세 가지 혈관
| | 동맥 | 정맥 | 모세 혈관 |
|+ 혈액의 방향 | 심장 → 온몸 | 온몸 → 심장 | 동맥과 정맥 연결 |
|+ 혈관 벽 | 두껍고 탄력 있음 | 동맥보다 얇음 | 한 층의 세포로 매우 얇음 |
|+ 혈압 | 가장 높음 | 가장 낮음 | 중간 |
|+ 특징 | 맥박이 나타남 | 판막이 있음 | 혈류가 가장 느려 물질 교환 |

= 혈액의 구성
| 성분 | 하는 일 |
|+ 혈장 | 영양소, 노폐물, 이산화 탄소 운반 |
|+ 적혈구 | 헤모글로빈으로 산소 운반 |
|+ 백혈구 | 세균을 잡아먹는 식균 작용 |
|+ 혈소판 | 혈액 응고 (상처의 피를 멈춤) |

## 순환 경로 | 두 개의 고리

= 시뮬레이션: 혈액의 길 | 실험실
@ sim.html#circ | [온몸 순환]과 [폐순환]을 하나씩 켜고, 혈구가 지나가는 순서와 혈액 색(동맥혈·정맥혈)을 관찰하자.
% 혈액 색이 바뀌는 곳(모세 혈관)에서 멈추고 '여기서 무엇이 교환되었나?' 질문

= 온몸 순환과 폐순환
| 순환 | 경로 |
|+ 온몸 순환 | 좌심실 → 대동맥 → 온몸의 모세 혈관 → 대정맥 → 우심방 |
|+ 폐순환 | 우심실 → 폐동맥 → 폐의 모세 혈관 → 폐정맥 → 좌심방 |
>+ 산소가 많은 혈액 = ==동맥혈==, 산소가 적은 혈액 = ==정맥혈==
~ 주의! 폐정맥에는 동맥혈, 폐동맥에는 정맥혈이 흐른다

= 순환의 의미
| 순환 | 하는 일 |
|+ 온몸 순환 | 조직 세포에 산소와 영양소를 주고, 이산화 탄소와 노폐물을 받아 온다 |
|+ 폐순환 | 폐에서 이산화 탄소를 내보내고 산소를 받아 온다 |

= 운동과 심장 박동
C 운동이 강할수록 심장 박동이 빨라진다 | 운동 강도 | 심장 박동 (회/분) | 심장 박동:0,70 50,115 100,160
~ 세포가 더 많은 에너지를 쓰므로 산소와 영양소를 빨리 공급해야 한다

= 생활 속 순환 | 사례
* 🩺 맥박 :: 손목의 동맥에서 심장 박동을 느낀다
* 🩸 헌혈 :: 팔의 정맥에서 피를 뽑는다 — 혈압이 낮아 안전
* 🦵 다리 정맥의 판막 :: 중력을 이기고 혈액을 심장으로
* 🩹 딱지 :: 혈소판이 혈액을 굳힌다
* 🏔️ 고산 훈련 :: 적혈구가 늘어 산소 운반 능력 향상
* 🏃 운동 후 빨개진 얼굴 :: 피부 혈관으로 혈액이 많이 흘러 열을 내보낸다

= 예제 1 · 하루의 심장 박동 | 적용
- 심장이 1분에 70번 뛴다면 하루 동안 몇 번 뛸까?
^+ 1시간 = 70 × 60 = **4200번**
^+ 하루 = 4200 × 24 = **100 800번**
^+ 약 **10만 번**!

= 예제 2 · 1분 동안 내보내는 혈액 | 적용
- 한 번 뛸 때 좌심실이 약 70 mL의 혈액을 내보낸다. (1분에 70번)
^+ 1분 = 70 × 70 = **4900 mL ≈ 4.9 L**
^+ 사람 몸의 혈액은 약 5 L → 약 **1분**이면 온몸을 한 바퀴!
^+ 운동으로 박동이 160회가 되면 → 70 × 160 = **11 200 mL ≈ 11 L** (한 번에 내보내는 양이 같다고 할 때)

= 예제 3 · 포도당의 여행 | 적용
- 소장에서 흡수된 포도당이 다리 근육 세포에 도착하기까지
^+ 소장 모세 혈관 → 정맥 → **우심방 → 우심실**
^+ → 폐순환(폐동맥 → 폐 → 폐정맥) → **좌심방 → 좌심실**
^+ → **대동맥** → 다리 동맥 → 다리의 **모세 혈관** → 근육 세포
>+ 심장을 두 번 지난다! (간을 거치는 길은 고등학교에서)

= 확인 문제 1
Q 심장에서 근육이 가장 두꺼운 곳은?
o 우심방
o 좌심방
o 우심실
o* 좌심실
:: 온몸으로 혈액을 내보내야 하므로 가장 강하게 수축한다.

= 확인 문제 2
Q 동맥혈이 흐르는 혈관끼리 고른 것은?
o 대정맥, 폐동맥
o* 대동맥, 폐정맥
o 대동맥, 폐동맥
o 대정맥, 폐정맥
:: 폐에서 산소를 받은 혈액이 폐정맥 → 좌심방 → 좌심실 → 대동맥으로 간다.

= 확인 문제 3
Q 산소를 운반하는 혈액 성분은?
o 혈장
o* 적혈구
o 백혈구
o 혈소판
:: 적혈구 속 헤모글로빈이 산소와 결합한다.

= 확인 문제 4
Q 폐순환의 경로로 옳은 것은?
o 좌심실 → 대동맥 → 폐 → 대정맥 → 우심방
o* 우심실 → 폐동맥 → 폐의 모세 혈관 → 폐정맥 → 좌심방
o 우심방 → 폐정맥 → 폐 → 폐동맥 → 좌심실
o 좌심방 → 폐동맥 → 폐 → 폐정맥 → 우심실
:: 폐순환은 우심실에서 시작해 좌심방으로 돌아온다.

= 서술형 도전 | 생각 넓히기
? 모세 혈관에서 물질 교환이 잘 일어나는 까닭을 두 가지 쓰시오. :: 혈관 벽이 한 층의 세포로 매우 얇고, 혈액이 흐르는 속도가 가장 느리며, 온몸에 그물처럼 퍼져 있어 총 단면적이 넓기 때문이다.
? 판막이 제대로 닫히지 않으면 혈액 순환에 어떤 문제가 생길지 예상하시오. :: 혈액이 거꾸로 흘러 한 번 박동할 때 내보내는 혈액의 양이 줄어든다. 몸에 산소와 영양소가 충분히 공급되지 못하고, 심장은 더 자주·세게 뛰어야 한다.

= 오늘 배운 내용 정리
- 심방은 혈액을 [[받아들이고]], 심실은 [[내보낸다]]. 판막은 역류를 막는다.
- 동맥: 심장 → 온몸, 정맥: 온몸 → 심장, [[모세 혈관]]: 물질 교환
- 산소 운반 = [[적혈구]], 혈액 응고 = [[혈소판]]
- 온몸 순환: [[좌심실]] → 대동맥 → 온몸 → 대정맥 → 우심방
- 폐순환: 우심실 → 폐동맥 → 폐 → [[폐정맥]] → 좌심방

= 나가기 전 한 문제 | 형성평가
? 운동을 하면 심장 박동이 빨라지는 까닭을 '세포'와 '산소'를 넣어 쓰시오. :: 운동할 때 근육 세포가 더 많은 에너지를 써야 하므로, 세포 호흡에 필요한 산소와 영양소를 빨리 공급하기 위해 심장이 더 빨리 뛴다.
