## 세포 호흡 | 모든 일의 목적

= 세포 호흡
! 영양소 + 산소 → 이산화 탄소 + 물 + 에너지
- 조직 세포에서 영양소가 **산소**와 반응하여 생명 활동에 필요한 **에너지**를 얻는 과정
+ 얻은 에너지 → 근육 운동, 체온 유지, 생장, 두뇌 활동
>+ 소화·순환·호흡·배설은 모두 세포 호흡을 ==돕기 위해== 협력한다.

= 시뮬레이션: 기관계 지도 | 실험실
@ sim.html#all | 운동 강도를 높이며 각 기관계 사이를 오가는 물질의 흐름이 어떻게 달라지는지 관찰하자.
% 화살표 ①~⑥이 굵어지는 순간을 짚으며 물질 이름을 학생이 말하게 하기

= 기관계 사이의 물질 흐름
| 번호 | 경로 | 이동하는 물질 |
|+ ① | 소화계 → 순환계 | 영양소 (포도당, 아미노산 등) |
|+ ② | 호흡계 → 순환계 | 산소 |
|+ ③ | 순환계 → 호흡계 | 이산화 탄소 |
|+ ④ | 순환계 → 조직 세포 | 영양소, 산소 |
|+ ⑤ | 조직 세포 → 순환계 | 이산화 탄소, 요소 등 노폐물 |
|+ ⑥ | 순환계 → 배설계 | 요소 등 노폐물 |

## 운동할 때 몸의 변화 | 모두가 바빠진다

= 달리기를 할 때
| 기관계 | 변화 | 까닭 |
|+ 호흡계 | 호흡이 빠르고 깊어짐 | 산소를 더 흡수하고 CO₂를 빨리 내보내려고 |
|+ 순환계 | 심장 박동이 빨라짐 | 산소와 영양소를 근육에 빨리 운반하려고 |
|+ 조직 세포 | 세포 호흡이 활발해짐 | 근육 운동에 필요한 에너지를 더 얻으려고 |
|+ 피부·배설 | 땀이 많이 남 | 세포 호흡으로 생긴 열을 내보내 체온 유지 |

= 생활 속 기관계의 협력 | 사례
* 🍙 식사 후 졸림 :: 소화를 위해 혈액이 소화 기관으로 몰린다
* 🏊 수영 :: 호흡을 참으면 금방 힘들다 — 산소 공급 중요
* 🥶 추운 날 떨림 :: 근육이 떨며 세포 호흡으로 열을 낸다
* 🩸 빈혈 :: 적혈구가 부족하면 쉽게 피곤
* 🚰 운동 후 물 :: 땀으로 잃은 물을 보충
* 🧠 시험 공부 :: 뇌도 세포 호흡으로 에너지를 쓴다

= 예제 1 · 밥의 여행 | 적용
- 밥 속 녹말이 다리 근육 세포에서 에너지로 쓰이기까지
^+ **소화**: 입과 소장에서 녹말 → 포도당
^+ **흡수·순환**: 융털의 모세 혈관 → 혈액을 따라 근육 세포로
^+ **세포 호흡**: 포도당 + 산소(호흡계에서 공급) → 에너지
^+ **배설**: 생긴 이산화 탄소는 폐로, 물은 폐·콩팥·땀으로

= 예제 2 · 운동하면 얼마나 늘까? | 적용
| | 쉴 때 | 달리기 |
| 1분 호흡 횟수 × 1회 공기 | 15 × 0.5 L | 40 × 1.5 L |
| 1분 심장 박동 × 1회 혈액 | 70 × 70 mL | 160 × 100 mL |
^+ 1분 공기: 7.5 L → **60 L** (8배)
^+ 1분 혈액: 4.9 L → **16 L** (약 3.3배)
% 운동 시 값은 수업용 대략값

= 예제 3 · 에너지 계산 | 적용
- 탄수화물 1 g은 약 4 kcal의 에너지를 낸다. 밥 한 공기에 탄수화물이 약 65 g 들어 있다.
^+ 밥 한 공기의 에너지 ≈ 65 × 4 = **260 kcal**
^+ 빠르게 걷기가 1분에 약 5 kcal를 쓴다면 → 260 ÷ 5 = **52분**
>+ 먹은 에너지와 쓴 에너지의 균형이 건강의 기본!

= 확인 문제 1
Q 세포 호흡에 대한 설명으로 옳은 것은?
o 폐에서만 일어난다.
o* 조직 세포에서 영양소가 산소와 반응하여 에너지를 얻는 과정이다.
o 이산화 탄소를 흡수한다.
o 에너지를 저장하는 과정이다.
:: 세포 호흡은 모든 살아 있는 세포에서 일어나며 에너지를 얻는다.

= 확인 문제 2
Q 조직 세포에서 순환계로 이동하는 물질은?
o 포도당, 산소
o* 이산화 탄소, 요소
o 아미노산, 산소
o 산소, 물
:: 세포 호흡으로 생긴 노폐물이 혈액으로 나온다.

= 확인 문제 3
Q 달리기를 할 때 땀이 많이 나는 까닭은?
o 소화가 빨라지기 때문
o 산소를 흡수하기 위해
o* 세포 호흡으로 생긴 열을 내보내 체온을 유지하기 위해
o 요소를 모두 땀으로 내보내기 위해
:: 땀이 증발하며 열을 빼앗는다(중1 상태 변화와 열에너지).

= 확인 문제 4
Q 순환계가 하는 일로 가장 알맞은 것은?
o 영양소를 분해한다.
o* 영양소, 산소, 노폐물을 운반한다.
o 노폐물을 걸러 낸다.
o 산소를 흡수한다.
:: 순환계는 다른 기관계를 이어 주는 운반 담당이다.

= 서술형 도전 | 생각 넓히기
? 소화계, 순환계, 호흡계, 배설계 중 하나라도 기능을 하지 못하면 세포 호흡이 어려워지는 까닭을 쓰시오. :: 세포 호흡에 필요한 영양소와 산소를 공급하고 생긴 노폐물을 내보내는 일을 네 기관계가 나누어 맡아 서로 협력하기 때문이다.
? 추운 날 몸이 덜덜 떨리는 현상을 세포 호흡과 관련지어 설명하시오. :: 근육이 빠르게 수축과 이완을 반복하면 세포 호흡이 활발해져 열이 많이 발생하므로 체온을 유지하는 데 도움이 된다.

- 세포 호흡: 영양소 + [[산소]] → 이산화 탄소 + 물 + [[에너지]]
- 소화계 → 순환계: [[영양소]], 호흡계 → 순환계: [[산소]]

- 운동하면 호흡과 [[심장 박동]]이 빨라지고 땀이 난다.
- 네 기관계는 [[세포 호흡]]을 위해 협력한다.
