## 영양소 | 무엇을 먹고 있을까?

= 영양소의 종류
| 구분 | 영양소 | 하는 일 |
|+ 3대 영양소 (에너지원) | 탄수화물, 단백질, 지방 | 에너지를 내고 몸을 구성 |
|+ 부영양소 | 물, 무기염류, 바이타민 | 에너지원은 아니지만 몸의 기능 조절 |

= 영양소 검출 반응
| 검출할 영양소 | 검출 용액 | 색 변화 |
|+ 녹말 | 아이오딘-아이오딘화 칼륨 용액 | 청람색 |
|+ 포도당 (당) | 베네딕트 용액 (가열) | 황적색 |
|+ 단백질 | 뷰렛 용액 | 보라색 |
|+ 지방 | 수단 Ⅲ 용액 | 선홍색 |
% 베네딕트 반응은 가열 필요 — 물중탕 안전 지도

## 소화 | 크고 복잡한 영양소를 작게

= 시뮬레이션: 소화관 여행 | 실험실
@ sim.html#dig | 음식을 녹말·단백질·지방으로 바꿔 가며 [먹기]를 누르고, 기관마다 어떤 효소가 작용하는지 기록하자.
% 녹말 → 단백질 → 지방 순서로. 각 기관에서 '무엇이 남았나'를 기록

= 소화 기관과 소화 효소
| 기관 (소화액) | 소화 효소 | 작용 |
|+ 입 (침) | 아밀레이스 | 녹말 → 엿당 |
|+ 위 (위액) | 펩신 | 단백질 → 더 작은 단백질 조각 |
|+ 소장 (이자액) | 아밀레이스, 트립신, 라이페이스 | 녹말, 단백질, 지방을 분해 |
|+ 소장 (쓸개즙) | 효소 없음 | 지방을 작은 알갱이로 만들어 소화를 돕는다 |
|+ 소장 (소장 효소) | 탄수화물·단백질 분해 효소 | 엿당 → 포도당, 단백질 조각 → 아미노산 |

= 최종 소화 산물
| 영양소 | 최종 소화 산물 |
|+ 녹말 (탄수화물) | 포도당 |
|+ 단백질 | 아미노산 |
|+ 지방 | 지방산, 모노글리세리드 |
>+ 세 영양소가 모두 최종 분해되는 기관은 ==소장==이다.
~ 쓸개즙은 간에서 만들어져 쓸개에 저장된다

= 침의 소화 작용 실험
| 시험관 | 아이오딘 반응 | 베네딕트 반응 | 해석 |
|+ A (녹말 + 증류수) | 청람색 (+) | 변화 없음 (−) | 녹말이 그대로 |
|+ B (녹말 + 침) | 변화 없음 (−) | 황적색 (+) | 녹말이 당으로 분해 |
>+ 35 ~ 40 °C에 두는 까닭: ==체온==과 비슷할 때 효소가 잘 작용한다. A는 대조군.

## 흡수 | 소장의 융털

= 융털과 흡수
- 소장 안쪽 벽에는 주름이 많고, 주름 표면에 **융털**이 있다 → 표면적이 넓다.
| 영양소 | 흡수되는 곳 |
|+ 포도당, 아미노산 (수용성) | 융털의 **모세 혈관** |
|+ 지방산, 모노글리세리드 (지용성) | 융털의 **암죽관** |
>+ 대장에서는 주로 ==물==이 흡수되고, 찌꺼기는 항문으로 나간다.

= 생활 속 소화 | 사례
* 🍚 오래 씹기 :: 아밀레이스가 녹말을 엿당으로
* 🥩 위의 염산 :: 펩신이 잘 작용하게 하고 살균
* 🧈 기름진 음식 :: 쓸개즙이 지방을 작은 알갱이로
* 💊 소화제 :: 소화 효소를 보충해 소화를 돕는다
* 🥛 우유를 마시면 배가 아픈 사람 :: 젖당을 분해하는 효소가 부족
* 🌾 식이 섬유 :: 소화되지 않고 대장 운동을 돕는다

= 예제 1 · 실험 해석 | 적용
- 시험관 B(녹말 + 침)에서 아이오딘 반응은 (−), 베네딕트 반응은 (+)였다.
^+ 아이오딘 (−) → 녹말이 **없어졌다**
^+ 베네딕트 (+) → **당**이 생겼다
^+ 결론: 침 속 아밀레이스가 녹말을 **엿당**으로 분해했다

= 예제 2 · 융털 모형의 표면적 | 적용
- 가로·세로 10 cm인 평평한 판에, 단면이 가로·세로 0.5 cm이고 높이 1 cm인 기둥(융털 모형) 100개를 세웠다.
^+ 평평한 판의 넓이 = 10 × 10 = **100 cm²** (기둥 윗면이 바닥을 가린 만큼 다시 채워짐)
^+ 기둥 하나의 옆면 = 4 × 0.5 × 1 = **2 cm²** → 100개 = **200 cm²**
^+ 전체 표면적 = 100 + 200 = **300 cm²** → 평평할 때의 **3배**
>+ 실제 소장은 주름 + 융털 + 더 작은 돌기로 표면적이 훨씬 더 넓다.

= 예제 3 · 효소를 찾아라 | 적용
- 어떤 소화액을 녹말, 단백질, 지방에 각각 넣었더니 세 가지가 모두 분해되었다.
^+ 녹말만 → 침, 단백질만 → 위액
^+ 셋 다 분해 → 아밀레이스·트립신·라이페이스가 모두 있는 소화액
^+ 정답: **이자액**

= 확인 문제 1
Q 단백질 검출에 쓰는 용액과 색 변화는?
o 베네딕트 용액, 황적색
o* 뷰렛 용액, 보라색
o 수단 Ⅲ 용액, 선홍색
o 아이오딘 용액, 청람색
:: 뷰렛 용액은 단백질과 반응해 보라색이 된다.

= 확인 문제 2
Q 위에서 작용하는 소화 효소와 분해하는 영양소는?
o 아밀레이스, 녹말
o* 펩신, 단백질
o 라이페이스, 지방
o 트립신, 녹말
:: 펩신은 염산이 있는 산성 환경에서 단백질을 분해한다.

= 확인 문제 3
Q 쓸개즙에 대한 설명으로 옳은 것은?
o 이자에서 만들어진다.
o 지방 분해 효소가 들어 있다.
o* 효소는 없지만 지방을 작은 알갱이로 만들어 소화를 돕는다.
o 위에서 분비된다.
:: 쓸개즙은 간에서 만들어져 쓸개에 저장된다.

= 확인 문제 4
Q 포도당과 아미노산이 흡수되는 곳은?
o 융털의 암죽관
o* 융털의 모세 혈관
o 대장
o 위
:: 수용성 영양소는 모세 혈관, 지용성 영양소는 암죽관으로 흡수된다.

= 서술형 도전 | 생각 넓히기
? 위에서 펩신이 잘 작용할 수 있게 하는 위액 속 물질과 그 물질의 다른 역할을 쓰시오. :: 염산. 위 속을 산성으로 만들어 펩신이 잘 작용하게 하고, 음식물 속 세균을 죽이는 살균 작용도 한다.
? 융털 구조가 영양소 흡수에 유리한 까닭을 쓰시오. :: 표면적이 넓어져 영양소와 닿는 면적이 커지므로 흡수가 효율적으로 일어난다.

= 오늘 배운 내용 정리
- 3대 영양소: [[탄수화물]], 단백질, 지방
- 침의 [[아밀레이스]]: 녹말 → 엿당, 위액의 [[펩신]]: 단백질 분해
- 세 영양소가 모두 최종 분해되는 기관 = [[소장]]
- 최종 산물: 녹말 → [[포도당]], 단백질 → [[아미노산]], 지방 → 지방산·모노글리세리드
- 수용성 영양소 → 융털의 [[모세 혈관]], 지용성 → [[암죽관]]
