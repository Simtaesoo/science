= 오늘의 학습 목표 | 3차시
^ **호흡계**의 구조와 공기의 이동 경로를 설명할 수 있다.

= 폐에는 근육이 없다? | 생각 열기
* 🫁 폐 :: 스스로 움직이는 근육이 없다
* 🎈 그런데 :: 숨을 쉴 때마다 부풀었다 줄어든다
* 😮 딸꾹질 :: 갑자기 '딸꾹' 하고 공기가 들어온다
? 근육도 없는 폐가 어떻게 부풀고 줄어들까? :: 갈비뼈와 가로막이 움직여 흉강의 부피와 압력이 바뀌면, 공기가 압력이 높은 곳에서 낮은 곳으로 드나든다.

## 호흡계 | 공기의 길

= 공기의 이동 경로
^+ **코** — 털과 끈끈한 액체가 먼지·세균을 거르고, 공기를 따뜻하고 축축하게
^+ **기관** → **기관지** — 공기가 지나가는 관
^+ **폐** 속의 **폐포** — 공기와 혈액 사이의 기체 교환
>+ 폐는 수많은 폐포로 이루어져 공기와 닿는 ==표면적==이 매우 넓다.

= 기체 교환 | 확산
! 기체는 농도가 높은 곳에서 낮은 곳으로 이동한다 (==확산==)
| 장소 | 산소 | 이산화 탄소 |
|+ 폐포 ↔ 모세 혈관 | 폐포 → 모세 혈관 | 모세 혈관 → 폐포 |
|+ 모세 혈관 ↔ 조직 세포 | 모세 혈관 → 조직 세포 | 조직 세포 → 모세 혈관 |
% 중1 확산 개념과 연결 — 에너지를 쓰지 않고 저절로

## 호흡 운동 | 갈비뼈와 가로막

= 시뮬레이션: 호흡 운동 모형 | 실험실
@ sim.html#breath | [고무 막 당기기]를 눌러 고무 막을 당기고 놓으며, 고무풍선의 크기 변화를 관찰하자.
% 실제 페트병 모형을 함께 보여 주면 이해가 빠름

= 모형과 우리 몸
| 모형 | Y자 관 | 고무풍선 | 페트병 속 공간 | 고무 막 |
| 우리 몸 | 기관, 기관지 | 폐 | 흉강 | 가로막 |
~ 고무 막을 당기고 놓으면
| 고무 막을 | 병 속 부피 | 병 속 압력 | 고무풍선 | 해당하는 호흡 |
|+ 아래로 당길 때 | 커짐 | 낮아짐 | 부풀어 오름 | 들숨 |
|+ 놓을 때 | 작아짐 | 높아짐 | 오그라듦 | 날숨 |
~ 한계: 이 모형으로는 갈비뼈의 움직임을 나타낼 수 없다

= 들숨과 날숨
| 구분 | 갈비뼈 | 가로막 | 흉강 부피 | 폐 속 압력 | 공기 이동 |
|+ 들숨 | 올라감 | 내려감 | 커짐 | 대기압보다 낮아짐 | 밖 → 폐 |
|+ 날숨 | 내려감 | 올라감 | 작아짐 | 대기압보다 높아짐 | 폐 → 밖 |
>+ 공기는 압력이 ==높은 곳==에서 ==낮은 곳==으로 이동한다.

= 폐 속 압력의 변화
C 폐 속 압력 − 대기압 (0보다 낮으면 들숨) | 시간 (초) | 압력 차 (상대값) | 폐 속 압력:0,-0 0.5,-0.71 1,-1 1.5,-0.71 2,-0 2.5,0.71 3,1 3.5,0.71 4,0 4.5,-0.71 5,-1 5.5,-0.71 6,-0 6.5,0.71 7,1 7.5,0.71 8,0
~ 들숨 구간: 0 ~ 2초, 4 ~ 6초 (폐 속 압력 < 대기압)

= 생활 속 호흡 | 사례
* 😮 딸꾹질 :: 가로막이 갑자기 수축 → 공기가 확 들어옴
* 🏃 달리기 :: 호흡이 빠르고 깊어진다
* 🤧 코로 숨쉬기 :: 먼지를 거르고 공기를 데운다
* 🎺 관악기 연주 :: 가로막을 조절해 날숨을 길게
* 🏔️ 높은 산 :: 공기가 희박해 숨이 가쁘다
* 🚭 흡연 :: 폐포가 손상되어 기체 교환 면적이 줄어든다

= 예제 1 · 1분 동안의 공기 | 적용
- 1분에 15번 숨을 쉬고, 한 번에 0.5 L의 공기가 드나든다.
^+ 1분 = 15 × 0.5 = **7.5 L**
^+ 1시간 = 7.5 × 60 = **450 L**
^+ 하루 = 450 × 24 = **10 800 L** — 약 1만 L!

= 예제 2 · 몸에 남는 산소 | 적용
- 들이마신 공기의 산소는 약 21 %, 내쉰 공기의 산소는 약 16 %이다. 한 번에 500 mL를 마신다면?
^+ 들이마신 산소 = 500 × 0.21 = **105 mL**
^+ 내쉰 산소 = 500 × 0.16 = **80 mL**
^+ 몸에 흡수된 산소 = 105 − 80 = **25 mL** (한 번 숨 쉴 때)

= 예제 3 · 그래프 해석 | 적용
- 폐 속 압력 그래프에서 2 ~ 4초 구간을 해석하자.
^+ 폐 속 압력 > 대기압 → 공기가 **폐 → 밖**
^+ 해당 호흡 → **날숨**
^+ 갈비뼈 **내려감**, 가로막 **올라감**, 흉강 부피 **작아짐**

= 확인 문제 1
Q 공기의 이동 경로로 옳은 것은?
o 코 → 기관지 → 기관 → 폐포
o* 코 → 기관 → 기관지 → 폐포
o 코 → 폐포 → 기관 → 기관지
o 입 → 식도 → 폐포
:: 기관이 갈라져 기관지가 된다.

= 확인 문제 2
Q 들숨이 일어날 때의 설명으로 옳은 것은?
o 갈비뼈가 내려가고 가로막이 올라간다.
o* 흉강의 부피가 커지고 폐 속 압력이 대기압보다 낮아진다.
o 폐 속 압력이 대기압보다 높아진다.
o 폐의 근육이 수축한다.
:: 폐에는 근육이 없다. 흉강이 커져 압력이 낮아지면 공기가 들어온다.

= 확인 문제 3
Q 폐포에서 모세 혈관으로 이동하는 기체와 그 원리는?
o 이산화 탄소, 확산
o* 산소, 확산
o 산소, 근육의 힘
o 질소, 확산
:: 폐포의 산소 농도가 높아 모세 혈관으로 확산한다.

= 확인 문제 4
Q 호흡 운동 모형에서 고무 막에 해당하는 몸의 구조는?
o 폐
o 기관
o 흉강
o* 가로막
:: 고무풍선은 폐, 페트병 속 공간은 흉강, Y자 관은 기관과 기관지

= 서술형 도전 | 생각 넓히기
? 들이마신 공기와 내쉰 공기를 비교할 때 내쉰 공기에 더 많은 기체 두 가지를 쓰고, 그 까닭을 쓰시오. :: 이산화 탄소, 수증기. 세포 호흡으로 생긴 이산화 탄소와 물이 폐를 통해 나가기 때문이다.
? 딸꾹질은 가로막이 갑자기 수축하면서 일어난다. 이때 공기가 움직이는 방향을 호흡 운동 원리로 설명하시오. :: 가로막이 갑자기 내려가 흉강 부피가 커지고 폐 속 압력이 낮아지므로 공기가 갑자기 폐 안으로 들어온다(이때 성대가 닫혀 소리가 난다).

= 오늘 배운 내용 정리
- 공기의 길: 코 → [[기관]] → 기관지 → [[폐포]]
- 기체 교환은 농도 차에 의한 [[확산]]으로 일어난다.
- 폐는 근육이 없어 [[갈비뼈]]와 [[가로막]]의 움직임으로 호흡한다.
- 들숨: 흉강 부피 [[증가]] → 폐 속 압력 [[감소]] → 공기가 들어옴
- 날숨: 흉강 부피 감소 → 폐 속 압력 증가 → 공기가 나감
