## 광물 | 암석을 이루는 알갱이

= 광물과 조암 광물
! 광물 = 암석을 이루는 작은 알갱이
- **조암 광물**: 암석을 이루는 주된 광물
+ 석영, 장석, 흑운모, 각섬석, 휘석, 감람석 등
+ 화강암을 자세히 보면 → 흰색(석영·장석), 검은색(흑운모) 알갱이
>+ 지금까지 알려진 광물은 수천 가지지만, 암석을 이루는 것은 ==몇 가지==뿐!

= 광물을 구별하는 특성
| 특성 | 방법 |
|+ 색 | 겉보기 색 — 불순물에 따라 달라지기도 한다 |
|+ 조흔색 | **조흔판**에 긁었을 때 가루의 색 |
|+ 굳기 | 두 광물을 서로 긁어 **흠집이 생기는 쪽이 무르다** |
|+ 염산 반응 | 방해석은 묽은 염산과 반응해 **거품**(이산화 탄소) |
|+ 자성 | 자철석은 **자석에 붙는다** |

= 시뮬레이션: 광물 감정 | 실험실
@ sim.html#mineral | 광물마다 다섯 가지 검사를 하고 결과를 학습지 표에 기록하자.
% 염산은 실제 실험에서 보안경·장갑 착용, 소량만 사용

= 감정 결과
| 광물 | 색 | 조흔색 | 굳기 비교 | 염산 | 자성 |
|+ 석영 | 무색·흰색 | 흰색 | 방해석을 긁음 | × | × |
|+ 방해석 | 무색·흰색 | 흰색 | 석영에 긁힘 | 거품 | × |
|+ 자철석 | 검은색 | 검은색 | — | × | ○ |
|+ 황철석 | 노란색 | 검은색 | — | × | × |
|+ 금 | 노란색 | 노란색 | — | × | × |

= 비슷한 광물 구별하기
| 비슷한 짝 | 구별하는 특성 |
|+ 석영 ↔ 방해석 | 굳기 (석영이 더 단단), 염산 반응 (방해석만 거품) |
|+ 황철석 ↔ 금 | 조흔색 (황철석 검은색, 금 노란색) |
|+ 자철석 ↔ 다른 검은 광물 | 자성 (자철석만 자석에 붙음) |
>+ 한 가지 특성으로 안 되면 ==여러 특성==을 함께 확인한다.

= 생활 속 광물과 암석 | 사례
* 🪟 석영 :: 유리, 반도체(규소)의 원료
* 🏛️ 화강암 :: 건축 자재, 비석, 계단
* 🏗️ 석회암 :: 시멘트의 원료
* 🔩 자철석 :: 철의 원료
* 📱 스마트폰 :: 금, 구리, 리튬 등 수십 가지 광물 자원
* 💎 보석 :: 다이아몬드, 루비 — 단단하고 아름다운 광물

= 예제 1 · 두 광물 구별 | 적용
- 겉보기 색이 비슷한 두 광물 A, B: A는 묽은 염산에 거품이 생기고, B는 A를 긁었을 때 흠집을 냈다.
^+ 염산에 거품 → A = **방해석**
^+ A에 흠집을 낼 만큼 단단 → B = **석영**
^+ 굳기: 석영 > 방해석

= 예제 2 · 굳기 순서 정하기 | 적용
- 광물 P, Q, R을 서로 긁었다: P는 Q에 흠집을 냄, R은 P에 흠집을 냄
^+ P > Q (P가 더 단단)
^+ R > P (R이 더 단단)
^+ 굳기 순서: **R > P > Q**
>+ 긁는 쪽이 단단하고, 흠집이 나는 쪽이 무르다.

= 예제 3 · 바보의 금 판별 | 적용
- 노란 광물 X를 조흔판에 긁었더니 검은색 가루가 나왔고, 자석에 붙지 않았다.
^+ 겉보기 색 노란색 → 금 또는 황철석
^+ 조흔색 **검은색** → 금이 아니다
^+ 자성 없음 → **황철석**

= 확인 문제 1
Q 광물을 조흔판에 긁었을 때 나타나는 가루의 색은?
o 겉보기 색
o* 조흔색
o 굳기
o 광택
:: 조흔색은 같은 광물이면 대체로 일정하다.

= 확인 문제 2
Q 묽은 염산과 반응하여 거품이 생기는 광물은?
o 석영
o* 방해석
o 자철석
o 황철석
:: 방해석은 염산과 반응해 이산화 탄소 기체가 발생한다.

= 확인 문제 3
Q 금과 황철석을 구별하는 가장 좋은 방법은?
o 겉보기 색 비교
o 자석에 대 보기
o* 조흔색 비교
o 염산 떨어뜨리기
:: 금은 노란색, 황철석은 검은색 조흔색을 나타낸다.

= 확인 문제 4
Q 자석에 붙는 광물은?
o 석영
o 방해석
o* 자철석
o 금
:: 자철석은 자성이 있어 철의 원료가 된다.

= 서술형 도전 | 생각 넓히기
? 겉보기 색보다 조흔색이 광물 구별에 더 도움이 되는 까닭을 쓰시오. :: 겉보기 색은 불순물 등에 따라 달라질 수 있지만, 조흔색은 같은 광물이면 대체로 일정하기 때문이다.
? 광물 자원은 한정되어 있다. 스마트폰과 관련해 우리가 할 수 있는 일을 두 가지 쓰시오. :: 휴대 전화를 오래 사용한다. 폐휴대 전화를 수거함에 넣어 금속 자원을 재활용(도시 광산)한다.
