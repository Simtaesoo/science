? 직접 가 보지 못했는데 지구 속이 층으로 되어 있다는 것을 어떻게 알았을까? :: 지진파가 지구 내부를 지나며 빨라지거나 느려지고 꺾이는 모습을 분석해서 알아냈다.

## 지구계 | 서로 영향을 주고받는 하나의 계

= 지구계의 구성 요소
| 구성 요소 | 포함하는 것 |
|+ 지권 | 암석, 토양, 지구 내부 |
|+ 수권 | 바다, 호수, 빙하, 지하수 |
|+ 기권 | 대기 |
|+ 생물권 | 모든 생물 |
|+ 외권 | 기권 바깥 우주 |
>+ ==지구계==: 이 요소들이 서로 영향을 주고받는 하나의 계

= 상호 작용의 예 | 사례
* 🌋 화산 폭발 :: 화산재가 대기로 — 지권 → 기권
* 🌿 광합성 :: 식물이 산소를 내보냄 — 생물권 → 기권
* 🌊 파도 :: 해안의 암석을 깎음 — 수권 → 지권
* ☄️ 운석 충돌 :: 우주에서 땅으로 — 외권 → 지권
* 🌧️ 비 :: 대기의 수증기가 바다로 — 기권 → 수권
* 🪱 지렁이 :: 흙을 부드럽게 — 생물권 → 지권

## 지권의 층상 구조 | 껍질부터 중심까지

= 시뮬레이션: 지구계와 층상 구조 | 실험실
@ sim.html#layer | 단면도의 각 층을 눌러 이름, 깊이, 상태를 기록하자.
% 층을 누를 때마다 '고체일까 액체일까?' 먼저 예측 → 외핵만 액체임을 강조

= 네 개의 층
| 층 | 깊이 | 상태 | 특징 |
|+ 지각 | 지표 ~ 약 35 km (대륙) | 고체 | 가장 얇은 겉껍질 |
|+ 맨틀 | ~ 2900 km | 고체 (유동성) | 지구 부피의 약 80 % |
|+ 외핵 | 2900 ~ 5100 km | **액체** | 철·니켈 |
|+ 내핵 | 5100 ~ 6400 km | 고체 | 철·니켈, 가장 뜨겁다 |
~ 지각 두께: 대륙 지각 약 35 km, 해양 지각 약 5 km

= 반지름 6400 km를 100으로 놓으면
| 층 | 두께 (km) | 반지름에서 차지하는 비율 |
|+ 지각 | 약 35 | 약 0.5 |
|+ 맨틀 | 약 2865 | 약 44.8 |
|+ 외핵 | 2200 | 약 34.4 |
|+ 내핵 | 1300 | 약 20.3 |
>+ 지각은 100 중 0.5 — 연필 선 하나 굵기에 불과하다.

= 지구 내부를 알아내는 방법
* 📈 지진파 분석 :: 층의 경계에서 빠르기와 방향이 바뀐다
* 🕳️ 시추 :: 직접 파서 확인 — 지각의 일부만 가능
* 🌋 화산 분출물 :: 깊은 곳의 물질이 올라온다
* ☄️ 운석 연구 :: 지구와 같은 시기에 만들어진 물질
* 🧲 지구 자기장 :: 액체 외핵의 움직임과 관련
- 모둠별로 하나를 골라 **방법 → 알아낸 사실 → 참고 자료** 순서로 조사하자.

= 예제 1 · 상호 작용 찾기 | 적용
- 다음 현상에서 영향을 주는 요소 → 받는 요소를 쓰자.
^+ 화산이 폭발하여 화산재가 대기 중으로 퍼졌다 → **지권 → 기권**
^+ 식물이 광합성을 하여 산소를 내보낸다 → **생물권 → 기권**
^+ 파도가 해안의 암석을 깎는다 → **수권 → 지권**

= 예제 2 · 지각은 얼마나 얇을까? | 적용
- 지구를 반지름 4 cm인 사과로 줄이면 대륙 지각(35 km)의 두께는?
^+ 비율 = 35 ÷ 6400 ≈ **0.0055** (약 0.55 %)
^+ 사과 반지름 40 mm × 0.0055 ≈ **0.22 mm**
^+ 사과 껍질 두께 정도!
>+ 우리가 사는 땅은 지구 전체에 비해 아주 얇은 껍질이다.

= 예제 3 · 층의 두께 계산 | 적용
- 맨틀(지각 ~ 2900 km), 외핵(2900 ~ 5100 km), 내핵(5100 ~ 6400 km)
^+ 맨틀 두께 ≈ 2900 − 35 = **2865 km**
^+ 외핵 두께 = 5100 − 2900 = **2200 km**
^+ 내핵 반지름 = 6400 − 5100 = **1300 km**
>+ 두께는 맨틀이 가장 두껍고, 부피도 맨틀이 약 80 %로 가장 크다.

= 확인 문제 1
Q 지구계의 구성 요소 중 바다, 호수, 빙하, 지하수를 포함하는 것은?
o 지권
o* 수권
o 기권
o 외권
:: 물이 있는 곳은 수권이다.

= 확인 문제 2
Q 지권의 층 중 액체 상태인 층은?
o 지각
o 맨틀
o* 외핵
o 내핵
:: 외핵만 액체 상태이다.

= 확인 문제 3
Q 지구 부피의 약 80 %를 차지하는 층은?
o 지각
o* 맨틀
o 외핵
o 내핵
:: 맨틀은 두께가 약 2900 km에 이르는 가장 큰 층이다.

= 확인 문제 4
Q 지구 내부 구조를 알아내는 데 가장 많이 쓰이는 방법은?
o 깊이 파서 직접 관찰한다.
o* 지진파가 지구 내부를 지나는 모습을 분석한다.
o 인공위성으로 사진을 찍는다.
o 바닷물의 염분을 측정한다.
:: 직접 판 깊이는 약 12 km로 지각도 다 뚫지 못했다.

= 서술형 도전 | 생각 넓히기
? 사과를 지구라고 할 때 사과 껍질은 지구의 어느 층에 해당하는지 쓰고 까닭을 쓰시오. :: 지각. 지구 전체 크기에 비해 지각이 매우 얇은 것처럼 사과 껍질도 매우 얇기 때문이다.
? 해양 지각과 대륙 지각의 두께를 비교하고, 시추로 맨틀에 도달하려면 어디를 파는 것이 유리할지 쓰시오. :: 해양 지각(약 5 km)이 대륙 지각(약 35 km)보다 얇으므로, 바다 밑 해양 지각을 파는 것이 유리하다.

= 오늘 배운 내용 정리
- 지구계: 지권, [[수권]], [[기권]], 생물권, 외권
- 지권의 층: [[지각]] → 맨틀 → [[외핵]] → 내핵
- 액체 상태인 층 = [[외핵]], 부피가 가장 큰 층 = [[맨틀]]
- 지구의 반지름 약 [[6400]] km, 대륙 지각 약 35 km
- 지구 내부 구조는 주로 [[지진파]] 분석으로 알아낸다.

= 나가기 전 한 문제 | 형성평가
