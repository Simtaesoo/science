# 암석의 분류와 순환 | 암석도 변한다 | 중학교 과학 2 · 09 지권의 변화 · 3차시 | 2022 개정 교육과정 [9과09-03]

= 오늘의 학습 목표 | 3차시
^ 암석을 생성 과정에 따라 **화성암·퇴적암·변성암**으로 분류할 수 있다.
^ 화성암의 **결정 크기**를 식는 속도로 설명할 수 있다.
^ **암석의 순환** 과정을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 세 가지 암석 15분 → 암석의 순환 10분 → 문항 10분 → 정리 5분

= 돌하르방과 불국사 | 생각 열기
* 🗿 제주 돌하르방 :: 구멍이 숭숭, 검은색 돌
* 🏯 불국사 석가탑 :: 흰 바탕에 검은 점이 박힌 돌
* 🏛️ 대리석 계단 :: 매끈하고 무늬가 있는 돌
? 세 돌은 모두 같은 방법으로 만들어졌을까? :: 다르다. 돌하르방(현무암)과 석가탑(화강암)은 마그마가 굳은 화성암, 대리석은 석회암이 열과 압력을 받아 변한 변성암이다.

= 지난 시간 복습 | 2차시
| 질문 | 답 |
| 암석을 이루는 주된 광물 | [[조암 광물]] |
| 염산에 거품이 생기는 광물 | [[방해석]] |
| 금과 황철석을 구별하는 특성 | [[조흔색]] |
? 화강암 속 흰 알갱이와 검은 알갱이는? :: 흰색은 석영·장석, 검은색은 흑운모

## 세 가지 암석 | 만들어진 방법으로 나누기

= 화성암
! 마그마가 식어서 굳은 암석
| 식는 곳 | 식는 속도 | 결정 | 어두운 암석 | 밝은 암석 |
|+ 지표 근처 (화산암) | **빨리** | 작다 | 현무암 | 유문암 |
|+ 지하 깊은 곳 (심성암) | **천천히** | 크다 | 반려암 | 화강암 |
>+ 천천히 식을수록 결정이 자랄 시간이 많아 ==결정이 크다==.

= 퇴적암
! 퇴적물이 쌓여 다져지고 굳어진 암석
| 퇴적물 | 암석 |
|+ 진흙 | 이암 |
|+ 모래 | 사암 |
|+ 자갈 | 역암 |
|+ 석회질 물질 (조개껍데기 등) | 석회암 |
>+ 층층이 쌓인 ==층리==와 ==화석==이 나타나기도 한다.

= 변성암
! 암석이 높은 열과 압력을 받아 성질이 변한 암석
| 원래 암석 | 변성암 |
|+ 이암 | 편암 → 편마암 |
|+ 석회암 | 대리암 |
|+ 사암 | 규암 |
>+ 압력 때문에 줄무늬(==엽리==)가 나타나기도 한다.

## 암석의 순환 | 끝없이 바뀌는 암석

= 시뮬레이션: 암석의 순환 | 실험실
@ sim.html#rock | 화강암에서 출발하여 여러 과정을 거쳐 다시 화성암이 될 때까지의 경로를 기록하자.
% 모둠마다 다른 경로(화성암 → 변성암 → 마그마 등)를 찾게 하면 '순환은 한 방향만이 아니다'를 발견

= 암석의 순환 과정
| 과정 | 변화 |
|+ (가) 풍화·침식·퇴적, 다짐·굳어짐 | 암석 → **퇴적암** |
|+ (나) 열과 압력 (변성 작용) | 암석 → **변성암** |
|+ (다) 녹음 (용융) | 암석 → **마그마** |
|+ (라) 식어서 굳음 | 마그마 → **화성암** |
>+ 암석이 오랜 시간에 걸쳐 다른 암석으로 계속 변하는 과정 = ==암석의 순환==

= 우리 주변의 암석 | 사례
* 🗿 현무암 :: 제주도 돌하르방, 돌담 — 구멍이 많다
* 🏯 화강암 :: 석가탑, 건물 외벽 — 결정이 크고 밝다
* 🏛️ 대리암 :: 건물 바닥·조각상 — 석회암이 변성
* 🪨 편마암 :: 줄무늬가 뚜렷 — 우리나라에 많이 분포
* 🐚 석회암 :: 강원도 석회 동굴, 시멘트 원료
* 🏖️ 사암 :: 모래가 굳은 암석, 거친 촉감

= 예제 1 · 결정 크기 해석 | 적용
- 화강암과 현무암은 둘 다 화성암인데 결정 크기가 다르다.
^+ 화강암 → 지하 깊은 곳에서 **천천히** 식음 → 결정이 **크다**
^+ 현무암 → 지표 근처에서 **빨리** 식음 → 결정이 **작다**
^+ 색 → 화강암은 밝고, 현무암은 어둡다

= 예제 2 · 퇴적에 걸리는 시간 | 적용
- 호수 바닥에 퇴적물이 1년에 0.5 mm씩 쌓인다. 두께 2 m의 지층이 되려면?
^+ 2 m = **2000 mm**
^+ 2000 ÷ 0.5 = **4000년**
^+ 이 퇴적물이 다져지고 굳어 퇴적암이 되려면 훨씬 더 오랜 시간이 필요하다
>+ 암석의 순환은 수천 ~ 수억 년에 걸쳐 일어난다.

= 예제 3 · 경로 따라가기 | 적용
- 석회암이 지하 깊은 곳에서 높은 열과 압력을 받은 뒤, 더 깊이 들어가 녹았다가 지표 근처에서 굳었다.
^+ 석회암 → 열과 압력 → **대리암** (변성암)
^+ 대리암 → 녹음 → **마그마**
^+ 마그마 → 지표 근처에서 빨리 식음 → **화산암** (예: 현무암)

= 확인 문제 1
Q 마그마가 지하 깊은 곳에서 천천히 식어 만들어진 밝은색 암석은?
o 현무암
o 유문암
o 반려암
o* 화강암
:: 심성암 중 밝은 것은 화강암, 어두운 것은 반려암이다.

= 확인 문제 2
Q 층리와 화석이 나타날 수 있는 암석은?
o 화성암
o* 퇴적암
o 변성암
o 마그마
:: 퇴적물이 층층이 쌓일 때 생물의 유해도 함께 묻힌다.

= 확인 문제 3
Q 석회암이 변성 작용을 받아 만들어지는 암석은?
o 편마암
o 규암
o* 대리암
o 편암
:: 석회암 → 대리암, 사암 → 규암, 이암 → 편암 → 편마암

= 확인 문제 4
Q 암석의 순환에서 마그마가 만들어지는 과정은?
o 풍화·침식
o 다짐·굳어짐
o* 녹음 (용융)
o 식어서 굳음
:: 암석이 높은 온도에서 녹으면 마그마가 된다.

= 서술형 도전 | 생각 넓히기
? 제주도의 돌하르방은 구멍이 많고 어두운색인 암석으로 만들었다. 암석의 이름과 생성 장소를 쓰고, 구멍이 생긴 까닭을 추리하시오. :: 현무암. 마그마가 지표 근처에서 빨리 식어 만들어졌다. 용암 속 기체가 빠져나가며 구멍이 생겼다.
? 퇴적암에서 화석이 발견되는 까닭을 쓰시오. :: 생물의 유해나 흔적이 퇴적물과 함께 쌓인 뒤 다져지고 굳어져 남기 때문이다.

= 우리 학교 암석 탐정 | 적용 미션
| 찾은 곳 | 특징 (색, 알갱이 크기, 줄무늬) | 추리한 암석 |
| 예: 정문 기둥 | 밝은색, 알갱이가 크다 | 화강암 |
| 예: 화단 경계석 | 어두운색, 구멍이 많다 | 현무암 |
- 쉬는 시간에 건물 외벽, 계단, 비석을 관찰하고 사진으로 기록해 오자.
% 학습지 3차시 뒷면 '생각 넓히기' 활동

= 오늘 배운 내용 정리
- 마그마가 식어서 굳은 암석 = [[화성암]] — 빨리 식으면 결정이 [[작다]].
- 퇴적물이 쌓여 굳은 암석 = [[퇴적암]] — 층리와 화석
- 열과 압력으로 성질이 변한 암석 = [[변성암]] — 석회암 → [[대리암]]
- 암석이 계속 다른 암석으로 변하는 과정 = [[암석의 순환]]
