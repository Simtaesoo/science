## 대륙 이동설 | 베게너의 생각

= 대륙 이동설
! 과거에 하나로 붙어 있던 초대륙 ==판게아==가 갈라지고 이동하여 현재의 대륙 분포가 되었다
- 1912년 독일의 과학자 **베게너**가 주장했다.
+ 판게아는 약 **2억 년 전**부터 갈라지기 시작했다.
>+ 처음에는 대륙을 움직이는 ==힘(원동력)==을 설명하지 못해 받아들여지지 않았다.

= 대륙 이동의 증거
| 증거 | 내용 |
|+ ① 해안선 | 남아메리카 동해안과 아프리카 서해안의 모양이 비슷하다 |
|+ ② 화석 | 멀리 떨어진 대륙에서 같은 고생물 화석이 발견된다 |
|+ ③ 빙하 흔적 | 지금은 따뜻한 여러 대륙의 빙하 흔적이 이어진다 |
|+ ④ 지질 구조 | 대륙을 붙이면 산맥과 지층이 연속된다 |

= 시뮬레이션: 판의 경계 | 실험실
@ sim.html#plate | [대륙 이동설]에서 시간을 바꿔 보고, [판의 경계]에서 지진·화산 분포를 판의 경계와 비교하자.
% 시간을 거꾸로 돌려 판게아로 돌아가는 장면 → 지진·화산 지도 겹쳐 보기 순서

## 판과 판의 경계 | 지진과 화산은 어디에?

= 판
! 판 = 지각과 맨틀 윗부분을 포함하는 단단한 암석층의 조각
- 지구 표면은 **10여 개**의 판으로 나뉘어 있다.
+ 판은 맨틀 위에서 1년에 **수 cm**씩 움직인다 (손톱이 자라는 빠르기).
+ 판과 판이 만나는 곳 = **판의 경계**
>+ 지진과 화산 활동은 판의 경계를 따라 ==띠 모양==으로 분포한다.

= 관찰 결과 정리
| 질문 | 답 |
|+ 지진과 화산이 많은 지역은? | 태평양 둘레, 대서양 한가운데, 지중해 ~ 히말라야 |
|+ 이 지역들의 공통점은? | 판의 경계와 일치한다 |
|+ 한국과 일본의 차이는? | 일본은 판의 경계에 가깝고, 한국은 판의 안쪽에 있다 |
>+ 태평양 주변의 화산대·지진대 = ==불의 고리== (환태평양 화산대)

= 지진과 화산이 잦은 곳 | 사례
* 🌋 일본 :: 여러 판의 경계 가까이 — 화산과 지진이 잦다
* 🌏 인도네시아 :: 판의 경계 위 — 화산이 매우 많다
* 🏔️ 칠레 :: 태평양 둘레, 판의 경계 — 큰 지진
* 🧊 아이슬란드 :: 대서양 한가운데 판의 경계 위의 섬 — 화산 활동
* 🏛️ 이탈리아 :: 지중해의 판의 경계 — 베수비오 화산
* 🏠 한반도 :: 판의 안쪽이지만 지진이 전혀 없지는 않다
% 2022 개정 [9과09-05]는 지진대·화산대가 판의 경계와 일치함을 다룬다. 경계의 종류(수렴·발산·보존)와 그곳의 지형은 고등학교 지구과학에서 배운다.

= 예제 1 · 대서양은 언제 생겼을까? | 적용
- 남아메리카와 아프리카 사이 거리 약 5000 km, 해마다 약 2.5 cm씩 멀어진다고 하자.
^+ 5000 km = 5000 × 100 000 cm = **5억 cm**
^+ 걸린 시간 = 5억 ÷ 2.5 = **2억 년**
^+ 판게아가 갈라지기 시작한 시기(약 2억 년 전)와 **맞는다**!

= 예제 2 · 우리 생애 동안 | 적용
- 판이 1년에 약 3 cm씩 움직인다면 100년 동안 얼마나 움직일까?
^+ 3 cm × 100 = **300 cm = 3 m**
^+ 1만 년이면 → 300 m, 100만 년이면 → **30 km**
>+ 한 사람의 일생에서는 느껴지지 않지만 지질 시대에는 대륙을 옮긴다.

= 예제 3 · 지도 해석 | 적용
- 지진 발생 지점을 지도에 찍었더니 태평양 둘레를 따라 고리 모양이 되었다.
^+ 지진이 띠 모양으로 모인 곳 → **판의 경계**
^+ 태평양 주변의 고리 → **불의 고리** (환태평양 화산대·지진대)
^+ 화산 분포도 → 거의 **같은 곳**에 나타난다

= 확인 문제 1
Q 대륙 이동설의 증거가 **아닌** 것은?
o 남아메리카와 아프리카의 해안선 모양이 비슷하다.
o 멀리 떨어진 대륙에서 같은 고생물 화석이 발견된다.
o 열대 지방 대륙에서 과거 빙하의 흔적이 발견된다.
o* 바닷물의 염분이 대양마다 조금씩 다르다.
:: 염분 차이는 대륙 이동과 관계없다.

= 확인 문제 2
Q 판에 대한 설명으로 옳은 것은?
o 지각만으로 이루어진다.
o* 지각과 맨틀 윗부분을 포함하는 단단한 암석층의 조각이다.
o 지구 표면은 하나의 판으로 되어 있다.
o 판은 움직이지 않는다.
:: 지구 표면은 10여 개의 판으로 나뉘어 천천히 움직인다.

= 확인 문제 3
Q 지진과 화산 활동이 주로 일어나는 곳은?
o 대륙의 한가운데
o* 판의 경계
o 적도 부근
o 극지방
:: 판과 판이 만나는 경계를 따라 띠 모양으로 분포한다.

= 확인 문제 4
Q 베게너의 대륙 이동설이 처음에 받아들여지지 않은 까닭은?
o 증거가 하나도 없었기 때문
o* 대륙을 움직이게 하는 힘을 설명하지 못했기 때문
o 대륙이 실제로 움직이지 않았기 때문
o 화석이 발견되지 않았기 때문
:: 원동력 문제는 이후 맨틀 대류와 판 구조론으로 설명되었다.

= 서술형 도전 | 생각 넓히기
? 지진과 화산이 판의 경계에서 주로 일어나는 까닭을 쓰시오. :: 판과 판이 만나는 경계에서는 판이 서로 움직이며 힘이 쌓이고 마그마가 만들어지기 쉬워 지각 변동이 활발하기 때문이다.
? 우리나라가 일본보다 지진이 적은 까닭을 판의 경계와 관련지어 쓰시오. :: 일본은 여러 판이 만나는 경계 가까이에 있지만, 우리나라는 판의 안쪽에 있어 지각 변동이 상대적으로 적기 때문이다.

= 안전 미션 · 지진이 났을 때 | 적용
^ 흔들릴 때 → **책상 아래**로 들어가 머리를 보호한다
^ 흔들림이 멈추면 → 승강기 대신 **계단**으로, 운동장 등 넓은 곳으로 대피한다
^ 대피할 때 → 건물, 담장, **유리창**에서 떨어진다
% 학교 지진 대피 경로를 실제로 확인하고 짧게 모의 훈련
