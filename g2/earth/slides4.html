## 풍화 | 암석이 부서지고 변한다

= 풍화란?
! 암석이 오랜 시간에 걸쳐 잘게 부서지거나 ==성분이 변하는== 현상
| 원인 | 작용 |
|+ 물이 얼고 녹음 | 틈의 물이 얼면 부피가 커져 틈을 넓힌다 (얼음 쐐기) |
|+ 식물 뿌리 | 틈에서 뿌리가 자라며 틈을 넓힌다 |
|+ 빗물·지하수 | 이산화 탄소가 녹은 물이 석회암 등을 **녹인다** |
|+ 기온 변화 | 팽창과 수축이 반복되며 표면이 갈라진다 |

= 풍화가 잘 일어나는 조건
- 암석의 **표면적이 넓을수록** — 물·공기와 닿는 면이 많다
+ **기온 변화가 클수록** — 얼고 녹기가 자주 반복된다
+ 물이 **많을수록** — 얼음 쐐기, 녹이는 작용이 활발하다
>+ 같은 부피라도 잘게 쪼개진 암석이 더 빨리 풍화된다.
% 중1 '물은 얼면 부피가 약 9 % 커진다'와 연결

= 부서지는 풍화, 녹는 풍화
| | 잘게 부서짐 | 성분이 변함 |
| 무엇이 바뀌나 | 크기와 모양 | 암석을 이루는 물질 |
| 예 | 얼음 쐐기, 식물 뿌리, 기온 변화 | 석회암이 녹음, 철 성분이 녹슮 |
| 결과 | 암석 조각, 모래 | 석회 동굴, 붉은 흙 |
>+ 실제로는 두 가지가 ==함께== 일어나며 서로 돕는다 — 부서질수록 녹기 쉽다.

## 토양의 생성 | 수백 년에 1 cm

= 시뮬레이션: 풍화와 토양 | 실험실
@ sim.html#weather | 풍화의 원인을 바꾸며 시간 막대를 움직여 암석과 토양 단면의 변화를 관찰하자.
% 시간 막대를 천천히 움직이며 C층 → B층 → A층이 생기는 순서를 강조

= 토양 단면의 층
| 층 | 이름 | 특징 |
|+ ㄱ (맨 위) | A층 (표토) | 생물이 썩은 물질이 많아 검은색 |
|+ ㄴ | B층 (심토) | A층에서 녹아 내려온 물질이 쌓임 |
|+ ㄷ | C층 | 모암이 풍화된 암석 조각 |
|+ ㄹ (맨 아래) | 모암 | 풍화되지 않은 암석 |
>+ 만들어지는 순서: 모암 → ==C층== → B층 → ==A층==

= 생활 속 풍화 | 사례
* 🕳️ 포트홀 :: 도로 틈의 물이 얼고 녹기를 반복
* 🌳 바위를 가른 나무 :: 뿌리가 자라며 틈을 넓힘
* 🦇 석회 동굴 :: 지하수가 석회암을 녹임 (강원도 고수동굴 등)
* 🗿 오래된 석탑 :: 표면이 닳고 이끼가 낀다
* 🧱 시멘트 담장 :: 금이 가고 부스러진다
* 🌾 비옥한 토양 :: 풍화된 흙 + 썩은 생물 → 농사

= 예제 1 · 잘게 쪼개면 표면적은? | 적용
- 한 변 1 cm인 정육면체 암석을 한 변 0.5 cm인 조각 8개로 쪼갰다.
^+ 처음 겉넓이 = 1 × 1 × 6 = **6 cm²**
^+ 조각 하나 = 0.5 × 0.5 × 6 = 1.5 cm² → 8개 = **12 cm²**
^+ 부피는 같은데 겉넓이는 **2배** → 풍화가 더 잘 일어난다
>+ 한 변 1 mm 조각 1000개로 쪼개면 60 cm² — 10배!

= 예제 2 · 토양이 생기는 시간 | 적용
- 토양 1 cm가 만들어지는 데 약 200년이 걸린다고 하자.
^+ 농사에 쓰는 표토 20 cm → 20 × 200 = **4000년**
^+ 큰비로 표토 1 cm가 쓸려 가면 → 되찾는 데 약 **200년**
>+ 토양은 사람의 일생으로는 되돌릴 수 없는 소중한 자원 → ==보전==해야 한다.

= 예제 3 · 원인 찾기 | 적용
| 현상 | 풍화의 원인 |
|+ 추운 지방 도로에 봄마다 포트홀 | [[물이 얼고 녹음 (얼음 쐐기)]] |
|+ 석회암 지대의 동굴 | [[지하수가 석회암을 녹임]] |
|+ 바위틈에서 자란 소나무 | [[식물 뿌리가 틈을 넓힘]] |
|+ 사막의 바위 표면이 벗겨짐 | [[큰 기온 변화]] |

= 확인 문제 1
Q 풍화에 대한 설명으로 옳은 것은?
o 암석이 녹아 마그마가 되는 현상
o* 암석이 오랜 시간에 걸쳐 부서지거나 성분이 변하는 현상
o 퇴적물이 다져지고 굳는 현상
o 암석이 열과 압력으로 변하는 현상
:: 풍화는 지표에서 일어나는 부서짐과 변화이다.

= 확인 문제 2
Q 석회 동굴이 만들어지는 풍화 작용은?
o 얼음 쐐기 작용
o 식물 뿌리의 작용
o* 이산화 탄소가 녹은 지하수가 석회암을 녹이는 작용
o 바람의 작용
:: 성분이 변하는 풍화의 예이다.

= 확인 문제 3
Q 토양 단면에서 생물이 썩은 물질이 많아 검은색을 띠는 층은?
o* A층 (표토)
o B층 (심토)
o C층
o 모암
:: 가장 위층인 A층에 썩은 생물 물질이 많다.

= 확인 문제 4
Q 토양이 만들어지는 순서로 옳은 것은?
o A층 → B층 → C층 → 모암
o* 모암 → C층 → B층 → A층
o 모암 → A층 → B층 → C층
o C층 → 모암 → B층 → A층
:: 모암이 풍화되어 C층이 생기고, 위로 갈수록 오래 풍화된 층이다.

= 서술형 도전 | 생각 넓히기
? 같은 부피의 암석을 통째로 둘 때와 잘게 부숴 둘 때 중 풍화가 더 잘 일어나는 쪽과 까닭을 쓰시오. :: 잘게 부숴 둘 때. 물이나 공기와 닿는 표면적이 넓어지기 때문이다.
? 산에 나무를 심고 비탈에 풀을 심는 것이 토양 보전에 도움이 되는 까닭을 쓰시오. :: 식물의 뿌리가 흙을 붙잡아 빗물에 토양이 쓸려 내려가는 것(침식)을 막아 주기 때문이다.

= 오늘 배운 내용 정리
- 암석이 부서지거나 성분이 변하는 현상 = [[풍화]]
- 원인: 물이 [[얼고 녹음]], 식물 뿌리, 빗물·지하수, 기온 변화
- 풍화는 표면적이 [[넓을수록]], 기온 변화가 클수록 잘 일어난다.
- 토양 생성 순서: 모암 → [[C층]] → B층 → [[A층]]
- 토양은 만들어지는 데 매우 오래 걸리므로 [[보전]]해야 한다.

= 나가기 전 한 문제 | 형성평가
? 처음의 포트홀이 겨울을 지나면서 많이 생기는 까닭을 풍화와 관련지어 쓰시오. :: 도로 틈에 스며든 물이 얼었다 녹기를 반복하면서 얼 때 부피가 커져 틈을 점점 넓히기 때문이다.
