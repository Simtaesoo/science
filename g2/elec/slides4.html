# 전류의 자기 작용과 전동기 | 전기로 자석을, 자석으로 회전을 | 중학교 과학 2 · 14 전기와 자기 · 4차시 | 2022 개정 교육과정 [9과14-04]

= 오늘의 학습 목표 | 4차시
^ **자기장**의 뜻을 알고 자기력선으로 나타낼 수 있다.
^ 전류가 흐르는 **직선 도선과 코일** 주위의 자기장 방향을 찾을 수 있다.
^ 자기장 속에서 전류가 받는 **힘**을 이용한 **전동기**의 원리를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 자기장 7분 → 전류가 만드는 자기장 13분 → 전동기 12분 → 문항·정리 8분

= 고철 더미를 들어 올리는 크레인 | 생각 열기
* 🏗️ 크레인 :: 커다란 원판이 고철을 '착' 붙여 들어 올린다
* 🔌 스위치를 끄면 :: 고철이 우수수 떨어진다
* 🧲 영구 자석이라면? :: 고철을 떼어 내기 어렵다
? 전기를 켜고 끄는 것만으로 어떻게 자석이 되었다 말았다 할까? :: 코일에 전류가 흐르면 자기장이 생겨 자석이 된다 — 전자석.

## 자기장 | 자기력이 작용하는 공간

= 자기장과 자기력선
! 자기장 = 자석이나 전류 주위에 자기력이 작용하는 공간
- 자기장의 방향 = 나침반 자침의 **N극**이 가리키는 방향
+ 자기력선은 자석의 **N극에서 나와 S극으로** 들어간다.
+ 자기력선이 **촘촘할수록** 자기장이 세다.

## 전류가 만드는 자기장 | 외르스테드의 발견

= 시뮬레이션: 전류와 자기장 | 실험실
@ sim.html#field | 직선 도선과 코일에서 전류의 세기와 방향을 바꾸며 나침반 바늘이 가리키는 방향을 관찰하자.
% 1820년 외르스테드: 전류를 흘리자 옆의 나침반이 움직였다 — 전기와 자기의 연결

= 직선 도선과 코일
| | 직선 도선 | 코일 |
|+ 자기장의 모양 | 도선을 중심으로 한 동심원 | 막대자석과 비슷 (내부는 나란함) |
|+ 방향 찾기 (오른손) | 엄지: 전류 → 네 손가락: 자기장 | 네 손가락: 전류 → 엄지: 코일 내부 자기장 (N극 쪽) |
|+ 자기장을 세게 | 전류를 세게, 도선에 가까울수록 | 전류를 세게, 코일을 많이 감기 |
>+ 전류의 방향을 바꾸면 자기장의 방향도 ==반대==가 된다.

= 전자석
! 코일 속에 철심을 넣어 전류가 흐를 때만 자석이 되게 한 것
- 전류를 켜고 끄면 자석을 **켜고 끌** 수 있다.
+ 전류의 세기, 감은 수로 **세기를 조절**할 수 있다.
+ 전류 방향을 바꾸면 **극을 바꿀** 수 있다.
>+ 이용: 고철 운반 기중기, 자기 부상 열차, 초인종, 스피커

## 전동기 | 자기장 속 전류가 받는 힘

= 시뮬레이션: 전동기 | 실험실
@ sim.html#motor | 전류 방향, 자석의 극, 전류 세기를 하나씩 바꾸며 도선이 받는 힘을 관찰하자. [정류자 사용]도 꺼 보자!
% 오른손 방향 찾기: 네 손가락 = 자기장, 엄지 = 전류, 손바닥이 미는 방향 = 힘

= 자기장 속 도선이 받는 힘
| 바꾼 조건 | 힘의 방향 | 힘의 크기 |
|+ 처음 (⊙ 전류, 왼쪽 N극) | 위쪽 | — |
|+ 전류 방향만 반대로 | 아래쪽 (반대) | 같음 |
|+ 자석의 극만 반대로 | 아래쪽 (반대) | 같음 |
|+ 전류 방향과 자석의 극을 모두 반대로 | 위쪽 (처음과 같음) | 같음 |
|+ 전류를 더 세게 | 위쪽 | 커짐 |

= 전동기의 원리
^+ 자기장 속 코일에 전류가 흐르면 코일 **양쪽 변**이 **반대 방향**의 힘을 받는다
^+ 두 힘이 코일을 **회전**시킨다
^+ **정류자**: 코일이 반 바퀴 돌 때마다 전류의 방향을 바꾸어 한 방향으로 **계속** 회전하게 한다
>+ 에너지 전환: ==전기 에너지 → 운동 에너지==

= 생활 속 전자석과 전동기 | 사례
* 🏗️ 고철 크레인 :: 전자석 — 켜면 붙고 끄면 떨어진다
* 🚄 자기 부상 열차 :: 전자석의 힘으로 떠서 달린다
* 🔔 초인종 :: 전자석이 망치를 끌어당겨 '딩동'
* 🌀 선풍기·세탁기 :: 전동기로 회전
* 🚗 전기 자동차 :: 강력한 전동기로 바퀴를 돌린다
* 🚁 드론 :: 작은 전동기 4개로 프로펠러 회전

= 예제 1 · 나침반 방향 | 적용
- 종이 면에서 나오는 전류(⊙) 주위에 나침반 4개를 놓았다.
^+ 오른손 엄지 → 종이에서 나오는 방향
^+ 네 손가락이 감는 방향 → **시계 반대 방향**
^+ N극 방향: 위쪽 **←**, 오른쪽 **↑**, 아래쪽 **→**, 왼쪽 **↓**

= 예제 2 · 힘의 방향 바꾸기 | 적용
- 처음에 도선이 위쪽으로 힘을 받았다. 다음 경우 힘의 방향은?
^+ 전류만 반대 → **아래쪽**
^+ 자석의 극만 반대 → **아래쪽**
^+ 둘 다 반대 → **위쪽** (반대를 두 번 하면 처음과 같다)

= 예제 3 · 전자석의 세기 | 적용
- 감은 수 100회, 전류 0.5 A인 전자석이 클립 6개를 들어 올렸다. 다른 조건은 같고 감은 수만 200회로 하면?
^+ 감은 수 2배 → 자기장이 **세진다**
^+ 들어 올리는 클립 수가 **늘어난다** (약 2배 정도 기대)
^+ 전류를 1 A로 올려도 → **세진다**
>+ 한 번에 하나만 바꿔야 어떤 조건의 효과인지 알 수 있다 (변인 통제)!

= 확인 문제 1
Q 자기장의 방향은?
o 나침반 자침의 S극이 가리키는 방향
o* 나침반 자침의 N극이 가리키는 방향
o 항상 북쪽
o 전류의 방향
:: 자기력선은 N극에서 나와 S극으로 들어간다.

= 확인 문제 2
Q 코일이 만드는 자기장을 세게 하는 방법이 **아닌** 것은?
o 전류를 세게 한다.
o 코일을 많이 감는다.
o 코일 속에 철심을 넣는다.
o* 전류의 방향을 바꾼다.
:: 전류 방향을 바꾸면 세기가 아니라 방향이 바뀐다.

= 확인 문제 3
Q 전동기에서 정류자가 하는 일은?
o 전류를 세게 한다.
o* 코일이 반 바퀴 돌 때마다 전류의 방향을 바꾸어 한 방향으로 계속 돌게 한다.
o 자석의 극을 바꾼다.
o 코일의 회전을 멈춘다.
:: 정류자가 없으면 반 바퀴쯤에서 되돌아간다.

= 확인 문제 4
Q 전동기의 에너지 전환으로 옳은 것은?
o 운동 에너지 → 전기 에너지
o* 전기 에너지 → 운동 에너지
o 빛에너지 → 전기 에너지
o 열에너지 → 운동 에너지
:: 전동기는 전기로 회전 운동을 만든다.

= 서술형 도전 | 생각 넓히기
? 시뮬레이션에서 [정류자 사용]을 끄면 코일은 어떻게 움직이는지와 그 까닭을 쓰시오. :: 반 바퀴쯤 돌다가 되돌아가며 흔들리다 멈춘다. 반 바퀴가 지나면 코일이 받는 힘이 반대 방향으로 돌리게 작용하기 때문이다.
? 처음의 고철 크레인에 영구 자석 대신 전자석을 쓰는 까닭을 두 가지 쓰시오. :: 전류를 끊으면 자석의 성질이 사라져 고철을 원하는 곳에 내려놓을 수 있고, 전류의 세기로 자석의 세기를 조절할 수 있기 때문이다.

= 오늘 배운 내용 정리
- 자석이나 전류 주위에 자기력이 작용하는 공간 = [[자기장]]
- 직선 도선 주위의 자기장은 도선을 중심으로 한 [[동심원]] 모양
- 코일 속에 철심을 넣어 전류가 흐를 때만 자석이 되게 한 것 = [[전자석]]
- 자기장 속 코일에 전류가 흐르면 힘을 받아 회전 = [[전동기]]
- 반 바퀴마다 전류 방향을 바꾸는 장치 = [[정류자]]

= 나가기 전 한 문제 | 형성평가
? 전동기를 더 빨리 돌게 하는 방법을 두 가지 쓰시오. :: 전류를 세게 한다, 더 센 자석을 쓴다, 코일을 많이 감는다 (중 두 가지)
