## 전류 · 전압 · 저항 | 물 흐름으로 이해하기

= 세 가지 양
| | 뜻 | 단위 | 물 흐름 모형 |
|+ 전류 | 전하의 흐름 | A (암페어) | 물의 흐름 |
|+ 전압 | 전류를 흐르게 하는 능력 | V (볼트) | 물의 높이 차 (펌프) |
|+ 저항 | 전류의 흐름을 방해하는 정도 | Ω (옴) | 좁은 물길, 물레방아 |
~ 1 A = 1000 mA

= 전류의 방향과 측정
- 전류의 방향: 전지의 **(+)극** → 전기 기구 → **(−)극**
+ 전자의 이동 방향: 전류와 **반대**
+ **전류계**는 회로에 **직렬**로, **전압계**는 측정하려는 부분에 **병렬**로
>+ 값을 모를 때는 가장 큰 값의 (−)단자에 먼저 연결한다.

## 옴의 법칙 | 실험으로 찾기

= 시뮬레이션: 전압·전류·저항 | 실험실
@ sim.html#ohm | 저항을 10 Ω으로 고정하고 전압을 1 V씩 바꾸며 [측정값 기록]을 누르자. 20 Ω, 30 Ω에서도 반복하자.
% 한 번에 하나만 바꾸기 — 저항 고정(전압-전류), 전압 고정(저항-전류)

= 측정 결과 | 전류 (mA)
| 전압 (V) | 10 Ω | 20 Ω | 30 Ω |
|+ 1.0 | 100 | 50 | 33 |
|+ 2.0 | 200 | 100 | 67 |
|+ 3.0 | 300 | 150 | 100 |
|+ 4.0 | 400 | 200 | 133 |

= 전압-전류 그래프
C 원점을 지나는 직선 — 기울기가 클수록 저항이 작다 | 전압 (V) | 전류 (mA) | 10 Ω:0,0 1,100 2,200 3,300 4,400 | 20 Ω:0,0 1,50 2,100 3,150 4,200 | 30 Ω:0,0 1,33 2,67 3,100 4,133
~ 저항이 일정하면 전류는 전압에 비례, 전압이 일정하면 저항이 클수록 전류가 작다

= 옴의 법칙
! 전류 (I) = 전압 (V) ÷ 저항 (R)
- 전류는 전압에 **비례**하고, 저항에 **반비례**한다.
+ 바꿔 쓰면 → 전압 = 전류 × 저항, 저항 = 전압 ÷ 전류
>+ 전선의 저항은 길이가 ==길수록==, 굵기가 ==가늘수록== 크다.

= 생활 속 전압·전류·저항 | 사례
* 🔋 건전지 1.5 V :: 직렬로 2개 → 3 V
* 🏠 가정용 콘센트 :: 220 V
* 🔌 굵은 전선 :: 에어컨처럼 전류가 큰 기구에 사용 — 저항이 작다
* 🔥 니크롬선 :: 저항이 커서 열이 많이 난다 (전기난로)
* 🎛️ 조광기 :: 저항을 바꿔 전등 밝기 조절
* ⚡ 감전 :: 젖은 손은 저항이 작아 전류가 많이 흐른다

= 예제 1 · 전류 구하기 | 적용
- 저항 20 Ω인 니크롬선에 6 V의 전압을 걸었다.
^+ I = V ÷ R
^+ = 6 ÷ 20 = **0.3 A**
^+ = **300 mA**

= 예제 2 · 저항 구하기 | 적용
- 어떤 전구에 3 V를 걸었더니 0.5 A가 흘렀다.
^+ R = V ÷ I
^+ = 3 ÷ 0.5 = **6 Ω**
^+ 같은 전구에 1.5 V를 걸면 → 1.5 ÷ 6 = **0.25 A** (전압이 절반 → 전류도 절반)

= 예제 3 · 그래프에서 저항 읽기 | 적용
- 어떤 저항의 전압-전류 그래프가 (4 V, 200 mA)를 지난다.
^+ 200 mA = **0.2 A**
^+ R = 4 ÷ 0.2 = **20 Ω**
^+ 이 저항에 10 V를 걸면 → 10 ÷ 20 = **0.5 A**

= 확인 문제 1
Q 전류계와 전압계의 연결 방법으로 옳은 것은?
o 전류계 병렬, 전압계 직렬
o* 전류계 직렬, 전압계 병렬
o 둘 다 직렬
o 둘 다 병렬
:: 전류계는 회로에 직렬, 전압계는 측정하려는 부분에 병렬로 연결한다.

= 확인 문제 2
Q 저항 30 Ω에 9 V를 걸 때 흐르는 전류는?
o 0.1 A
o* 0.3 A
o 3 A
o 270 A
:: 9 ÷ 30 = 0.3 A

= 확인 문제 3
Q 저항이 일정할 때 전압을 3배로 하면 전류는?
o 1/3배
o 그대로
o* 3배
o 9배
:: 전류는 전압에 비례한다.

= 확인 문제 4
Q 같은 물질로 만든 전선 중 저항이 가장 큰 것은?
o 짧고 굵은 전선
o 짧고 가는 전선
o 길고 굵은 전선
o* 길고 가는 전선
:: 길수록, 가늘수록 저항이 크다.

= 서술형 도전 | 생각 넓히기
? 물 흐름 모형에서 '물레방아'는 전기 회로의 무엇과 비슷한지 쓰고, 모형의 좋은 점과 한계를 한 가지씩 쓰시오. :: 물레방아는 전류가 흐를 때 에너지를 쓰는 전구(저항)와 비슷하다. 좋은 점: 보이지 않는 전류를 물의 흐름으로 이해할 수 있다. 한계: 전선이 끊어져도 전하가 물처럼 새어 나오지 않는다.
? 처음의 손전등에서 건전지를 1개 → 2개(직렬)로 늘리면 전구가 밝아지는 까닭을 옴의 법칙으로 쓰시오. :: 전압이 1.5 V → 3 V로 2배가 되고 전구의 저항은 거의 같으므로, 전류가 약 2배로 커져 더 밝아진다.

= 오늘 배운 내용 정리
- 전하의 흐름 = [[전류]] (A), 전류를 흐르게 하는 능력 = [[전압]] (V), 방해하는 정도 = [[저항]] (Ω)
- 전류계는 [[직렬]], 전압계는 [[병렬]]로 연결한다.
- 옴의 법칙: 전류 = [[전압]] ÷ 저항
- 저항이 일정하면 전류는 전압에 [[비례]]한다.
- 전선이 길수록, 가늘수록 저항이 [[크다]].

= 나가기 전 한 문제 | 형성평가
? 12 V 전원에 연결한 전기 기구에 0.4 A가 흘렀다. 이 기구의 저항을 구하고, 전압을 6 V로 낮추면 전류가 얼마가 되는지 쓰시오. :: 저항 = 12 ÷ 0.4 = 30 Ω. 6 V일 때 전류 = 6 ÷ 30 = 0.2 A
