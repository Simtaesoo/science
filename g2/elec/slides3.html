## 직렬과 병렬 | 한 줄로, 나란히

= 시뮬레이션: 전구 두 개 연결하기 | 실험실
@ sim.html#circuit | 같은 전구 두 개를 직렬과 병렬로 연결하고, [전구 B 빼기]를 켜고 끄며 밝기와 측정값을 비교하자.
% 3 V 전원, 10 Ω 전구 2개. 전구 1개만 연결했을 때(300 mA)를 기준으로 비교

= 측정 결과 | 3 V 전원, 10 Ω 전구 2개
| | 직렬연결 | 병렬연결 |
|+ 전구 A에 걸리는 전압 | 1.5 V | 3.0 V |
|+ 전구 A에 흐르는 전류 | 150 mA | 300 mA |
|+ 전체 전류 | 150 mA | 600 mA |
|+ 전구 1개일 때와 밝기 비교 | 더 어둡다 | 같다 |
|+ 전구 B를 빼면 전구 A는? | 꺼진다 | 그대로 켜져 있다 |

= 직렬연결과 병렬연결
| 직렬연결 | 병렬연결 |
|+ 각 저항에 흐르는 **전류가 같다** | 각 저항에 걸리는 **전압이 같다** (전원 전압) |
|+ 전체 전압이 각 저항에 **나누어** 걸린다 | 전체 전류가 각 저항에 **나뉘어** 흐른다 |
|+ 많이 연결할수록 전체 전류가 **작아진다** | 많이 연결할수록 전체 전류가 **커진다** |
|+ 예: 퓨즈, 장식용 전구 | 예: 가정의 전기 기구, 멀티탭 |

## 소비 전력 | 1초에 쓰는 전기 에너지

= 소비 전력
! 소비 전력 = 전기 기구가 1초 동안 사용하는 ==전기 에너지==의 양
- 단위: **W** (와트) — 1 W = 1초에 1 J
+ 전기 기구는 전기 에너지를 **빛, 열, 소리, 운동 에너지**로 전환한다.
+ 소비 전력이 클수록 같은 시간에 더 많은 전기 에너지를 쓴다.

= 가정의 전기 기구
| 전기 기구 | 소비 전력 | 주로 전환되는 에너지 |
|+ 전등 | 20 W | 빛에너지 |
|+ 선풍기 | 50 W | 운동 에너지 |
|+ 텔레비전 | 120 W | 빛에너지, 소리 에너지 |
|+ 헤어드라이어 | 1500 W | 열에너지, 운동 에너지 |
|+ 전기 주전자 | 1800 W | 열에너지 |
>+ 소비 전력이 특히 큰 기구는 주로 ==열에너지==를 만든다.

= 생활 속 연결과 전력 | 사례
* 🏠 가정의 콘센트 :: 병렬 — 모든 기구에 220 V
* 🔌 멀티탭 과부하 :: 병렬로 많이 꽂으면 전체 전류 증가 → 과열
* 🧯 퓨즈·차단기 :: 직렬로 연결 — 큰 전류가 흐르면 회로를 끊는다
* 💡 LED 전구 :: 백열전구보다 소비 전력이 훨씬 작다
* 🏷️ 에너지 소비 효율 등급 :: 같은 일을 적은 에너지로
* 🔋 보조 배터리 :: 저장한 전기 에너지를 다른 기기에

= 예제 1 · 직렬에서 전압 나누기 | 적용
- 6 V 전원에 10 Ω 저항 두 개를 직렬로 연결했다.
^+ 전체 저항 = 10 + 10 = **20 Ω**
^+ 전체 전류 = 6 ÷ 20 = **0.3 A** (두 저항에 똑같이)
^+ 저항 하나에 걸리는 전압 = 0.3 × 10 = **3 V** (6 V를 반씩)

= 예제 2 · 병렬에서 전류 나누기 | 적용
- 6 V 전원에 10 Ω 저항 두 개를 병렬로 연결했다.
^+ 각 저항의 전압 = **6 V**
^+ 각 저항의 전류 = 6 ÷ 10 = **0.6 A**
^+ 전체 전류 = 0.6 + 0.6 = **1.2 A** — 직렬의 4배!

= 예제 3 · 소비 전력과 에너지 | 적용
- 1500 W 헤어드라이어를 1분 동안 썼다. 20 W 전등은 얼마 동안 켤 수 있는 에너지일까?
^+ 헤어드라이어 1분 = 1500 × 60 = **90 000 J**
^+ 전등이 1초에 20 J → 90 000 ÷ 20 = **4500초**
^+ = **75분** — 헤어드라이어 1분 = 전등 1시간 15분!

= 확인 문제 1
Q 직렬연결에 대한 설명으로 옳은 것은?
o 각 저항에 걸리는 전압이 같다.
o* 각 저항에 흐르는 전류가 같다.
o 저항을 많이 연결할수록 전체 전류가 커진다.
o 하나를 빼도 나머지는 켜져 있다.
:: 직렬은 전류가 한 길로만 흐른다.

= 확인 문제 2
Q 가정의 전기 기구를 병렬로 연결하는 까닭은?
o 전체 전류를 줄이기 위해
o* 모든 기구에 같은 전압이 걸리고, 하나를 꺼도 다른 기구가 작동하게 하기 위해
o 전압을 나누어 쓰기 위해
o 소비 전력을 줄이기 위해
:: 병렬은 각 기구에 전원 전압이 그대로 걸린다.

= 확인 문제 3
Q '220 V - 1500 W' 헤어드라이어의 뜻은?
o 1초에 220 J 사용
o* 220 V에 연결하면 1초에 1500 J의 전기 에너지를 사용
o 1500 V에 연결해야 한다
o 220초 동안 1500 J 사용
:: 소비 전력 1500 W = 1초에 1500 J

= 확인 문제 4
Q 3 V 전원에 10 Ω 전구 두 개를 병렬로 연결할 때 전체 전류는?
o 150 mA
o 300 mA
o* 600 mA
o 1200 mA
:: 각 전구 300 mA × 2 = 600 mA

= 서술형 도전 | 생각 넓히기
? 멀티탭에 전기 주전자와 헤어드라이어를 함께 꽂아 쓰면 위험한 까닭을 쓰시오. :: 멀티탭은 병렬연결이라 기구를 많이 켤수록 멀티탭 전선에 흐르는 전체 전류가 커진다. 소비 전력이 큰 기구를 함께 쓰면 허용 전류를 넘어 전선이 뜨거워져 화재가 날 수 있다.
? 백열전구(60 W)와 LED 전구(8 W)는 밝기가 비슷하다. 어느 쪽이 효율적인지, 백열전구의 나머지 에너지는 어디로 가는지 쓰시오. :: LED 전구가 같은 밝기를 내면서 전기 에너지를 훨씬 적게 쓰므로 효율적이다. 백열전구는 전기 에너지의 대부분이 빛이 아닌 열에너지로 전환된다.

= 오늘 배운 내용 정리
- 직렬연결: 각 저항의 [[전류]]가 같고, 전압이 나누어 걸린다.
- 병렬연결: 각 저항의 [[전압]]이 같고, 전류가 나뉘어 흐른다.
- 가정의 전기 기구는 [[병렬]]로 연결되어 있다.
- 전기 기구가 1초 동안 쓰는 전기 에너지 = [[소비 전력]], 단위 [[W]]
- 소비 전력이 큰 기구는 주로 [[열에너지]]를 만든다.

? 처음의 장식 전구가 하나만 나가도 전부 꺼진 까닭과, 이를 고치려면 어떻게 연결해야 하는지 쓰시오. :: 직렬연결이라 전류가 흐르는 길이 하나뿐이어서 한 전구가 끊어지면 회로 전체가 끊어진다. 전구를 병렬로 연결하면 하나가 나가도 나머지는 켜져 있다.
