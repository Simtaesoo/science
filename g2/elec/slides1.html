# 마찰 전기와 정전기 유도 | 전자가 움직이면 생기는 일 | 중학교 과학 2 · 14 전기와 자기 · 1차시 | 2022 개정 교육과정 [9과14-01]

= 오늘의 학습 목표 | 1차시
^ **마찰 전기**가 생기는 까닭을 원자 모형(전자의 이동)으로 설명할 수 있다.
^ 같은 전하와 다른 전하 사이의 **전기력**을 설명할 수 있다.
^ **정전기 유도**를 설명하고 검전기의 원리에 적용할 수 있다.
% 흐름: 생각 열기 5분 → 마찰 전기 12분 → 정전기 유도·검전기 15분 → 문항 8분 → 정리 5분

= 겨울철 문고리의 '찌릿' | 생각 열기
* 🚪 문고리 :: 손을 대는 순간 '찌릿!'
* 👕 스웨터 :: 벗을 때 '타닥' 소리와 함께 머리카락이 선다
* 🎈 풍선 :: 머리에 문지르면 벽에 붙는다
? 이런 일은 왜 겨울에, 그리고 문지른 뒤에 잘 일어날까? :: 문지를 때 전자가 한 물체에서 다른 물체로 이동해 전기를 띠게 되고(마찰 전기), 건조한 겨울에는 그 전기가 잘 빠져나가지 않기 때문이다.

= 지난 단원 복습 | 11 물질의 구성
| 질문 | 답 |
| 원자핵의 전하 | [[(+)]] |
| 전자의 전하 | [[(−)]] |
| 원자의 전체 전하 | [[중성]] |
? 원자가 전자를 잃으면? :: (+)전하를 띤다 — 오늘은 물체 전체로 확장!

## 마찰 전기 | 이동하는 것은 전자

= 마찰 전기
! 두 물체를 마찰할 때 ==전자==가 한 물체에서 다른 물체로 이동하여 생기는 전기
- 원자핵은 **이동하지 않는다**.
+ 전자를 **잃은** 물체 → (+)전하
+ 전자를 **얻은** 물체 → (−)전하
>+ 전하가 새로 생기는 것이 아니라 ==이동==하는 것이다.

= 시뮬레이션: 털가죽과 플라스틱 막대 | 실험실
@ sim.html#static | [문지르기]를 세 번 누르고, 두 물체의 (+)와 (−) 개수를 세어 보자.
% 문지르기 전후 '전체 전하의 합'이 같은지 꼭 확인

= 문지르기 전과 후
| 물체 | (+)전하 수 | (−)전하 수 | 띠는 전하 |
|+ 털가죽 (문지르기 전) | 8 | 8 | 중성 |
|+ 털가죽 (3번 문지른 뒤) | 8 | 5 | (+)전하 |
|+ 플라스틱 막대 (3번 문지른 뒤) | 8 | 11 | (−)전하 |
>+ 털가죽이 잃은 전자 3개 = 막대가 얻은 전자 3개 → 전체 전하의 합은 ==변하지 않는다==.

= 대전열
! (+) 털가죽 – 유리 – 명주 – 나무 – 고무 – 플라스틱 (−)
- 두 물체를 문지르면 왼쪽(+)에 있는 물체가 전자를 **잃고**, 오른쪽(−)에 있는 물체가 전자를 **얻는다**.
+ 유리 막대 + 명주 헝겊 → 유리 (+), 명주 (−)
>+ 같은 명주라도 털가죽과 문지르면 (−), 고무와 문지르면 (+)!

= 전기력
| 두 전하 | 전기력 |
|+ 같은 종류 (+와 +, −와 −) | 서로 **밀어낸다** |
|+ 다른 종류 (+와 −) | 서로 **끌어당긴다** |

## 정전기 유도 | 가까이만 해도

= 정전기 유도
! 대전체를 금속에 가까이 하면 금속 속 ==전자==가 끌려오거나 밀려나는 현상
- 대전체와 **가까운 쪽** → 대전체와 **다른** 종류의 전하
+ 대전체와 **먼 쪽** → 대전체와 **같은** 종류의 전하
>+ 닿지 않아도 전하의 분포가 바뀐다!

= 검전기
| 가까이 한 것 | 전자의 이동 | 금속판 | 금속박 | 금속박 모양 |
|+ (−) 대전체 | 금속판 → 금속박 | (+) | (−) | 벌어짐 |
|+ (+) 대전체 | 금속박 → 금속판 | (−) | (+) | 벌어짐 |
|+ 대전 안 된 물체 | 없음 | 중성 | 중성 | 그대로 |
~ 금속박이 벌어지면 대전된 것, 많이 대전될수록 많이 벌어진다

= 생활 속 정전기 | 사례
* 🚪 문고리 감전 :: 몸에 쌓인 전하가 한꺼번에 이동
* 👕 달라붙는 옷 :: 서로 다른 전하를 띤 옷감이 끌어당김
* 🖨️ 복사기 :: 정전기로 토너 가루를 종이에 붙인다
* 🌬️ 공기 청정기 필터 :: 정전기로 먼지를 붙잡는다
* 🧹 정전기 먼지떨이 :: 문지르면 먼지가 달라붙는다
* ⛽ 주유소 방지 패드 :: 몸의 전하를 미리 빼낸다

= 예제 1 · 전하의 수 | 적용
- 처음 중성인 유리 막대((+) 10, (−) 10)를 명주로 문질렀더니 전자 4개가 이동했다.
^+ 대전열에서 유리가 명주보다 (+) 쪽 → 유리가 전자를 **잃는다**
^+ 유리 막대: (+) 10, (−) 6 → **(+)전하**
^+ 명주: 전자 4개를 **얻어** (−)전하 — 두 물체 전하의 합은 그대로 0

= 예제 2 · 풍선이 벽에 붙는 까닭 | 적용
^+ 머리카락과 문지른 풍선 → (−)전하
^+ 벽에 가까이 → 벽 표면의 전하가 재배치되어 풍선 쪽이 **(+)**
^+ 다른 종류의 전하 → **끌어당기는** 전기력 → 벽에 붙는다

= 예제 3 · 검전기 해석 | 적용
- (−) 대전체를 검전기 금속판에 가까이 했다.
^+ 금속판의 전자가 밀려나 **금속박**으로 이동
^+ 금속판 → **(+)**, 금속박 → **(−)**
^+ 두 금속박이 같은 (−)전하 → 서로 **밀어내** 벌어진다

= 확인 문제 1
Q 마찰 전기가 생길 때 이동하는 것은?
o 원자핵
o 양성자
o* 전자
o 원자 전체
:: 원자핵은 무거워 움직이지 않고 전자만 이동한다.

= 확인 문제 2
Q 털가죽으로 플라스틱 막대를 문지르면?
o 털가죽 (−), 막대 (+)
o* 털가죽 (+), 막대 (−)
o 둘 다 (+)
o 둘 다 중성
:: 대전열에서 털가죽이 (+) 쪽 끝, 플라스틱이 (−) 쪽 끝이다.

= 확인 문제 3
Q (+) 대전체를 검전기에 가까이 할 때 금속박의 전하와 모양은?
o (−), 오므라듦
o* (+), 벌어짐
o (−), 벌어짐
o 중성, 변화 없음
:: 금속박의 전자가 금속판으로 끌려가 금속박은 (+)가 되어 벌어진다.

= 확인 문제 4
Q 정전기를 이용한 예가 **아닌** 것은?
o 복사기
o 공기 청정기 필터
o 정전기 먼지떨이
o* 전기 주전자
:: 전기 주전자는 전류의 열 작용을 이용한다.

= 서술형 도전 | 생각 넓히기
? (−)로 대전된 풍선을 벽에 대면 붙는 까닭을 정전기 유도로 설명하시오. :: 풍선의 (−)전하 때문에 벽의 풍선 쪽 표면이 (+)전하를 띠게 되어(정전기 유도), 풍선과 벽 사이에 끌어당기는 전기력이 작용하기 때문이다.
? 겨울철에 정전기가 더 잘 생기는 까닭을 추리하시오. :: 겨울에는 공기가 건조해 몸이나 옷에 쌓인 전하가 공기 중 수증기를 통해 빠져나가지 못하고 많이 쌓이기 때문이다.

= 오늘 배운 내용 정리
- 마찰할 때 [[전자]]가 이동하여 생기는 전기 = 마찰 전기
- 전자를 잃으면 [[(+)]]전하, 얻으면 (−)전하
- 같은 종류의 전하는 [[밀어내고]], 다른 종류는 [[끌어당긴다]].
- 대전체를 가까이 하면 금속 속 전자가 이동 = [[정전기 유도]]
- 대전체와 가까운 쪽은 [[다른]] 종류, 먼 쪽은 같은 종류의 전하

= 나가기 전 한 문제 | 형성평가
? 처음의 문고리 '찌릿'을 전자의 이동으로 한 문장으로 설명하시오. :: 카펫이나 옷과의 마찰로 몸에 쌓인 전하가, 금속 문고리에 손을 대는 순간 전자의 이동으로 한꺼번에 흐르면서 찌릿함을 느낀다.
