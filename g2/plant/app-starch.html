<script>

const {S, sfx, toast} = app, D = Draw;
const STEPS = {
  foil: [

STEPS.vari = STEPS.foil.filter(s => s.k !== 'foil').map(s => s.k === 'cut' ? Object.assign({}, s, {t: '무늬 잎을 따기'}) : s);
STEPS.vari[0] = Object.assign({}, STEPS.vari[0]);
const RESULT_Q = {foil: ['결과를 보고 알 수 있는 것은?', ['빛을 받은 부분에서만 녹말이 만들어졌다', '포일로 가린 부분에서 녹말이 더 많이 만들어졌다', '잎의 모든 부분에서 녹말이 똑같이 만들어졌다'], 0],
  vari: ['결과를 보고 알 수 있는 것은?', ['엽록체가 있는 초록 부분에서만 녹말이 만들어졌다', '흰 부분에서 녹말이 더 많이 만들어졌다', '빛이 없어도 녹말이 만들어진다'], 0]};

function render(){
  ui.steps.innerHTML = '<ol style="margin:0;padding-left:20px;line-height:1.75;font-size:14.5px">' + steps.map((s, i) => `<li style="opacity:${i < si ? .55 : 1};${i === si ? 'color:var(--yellow);font-weight:700' : ''}">${i < si ? '✔ ' : ''}${s.t}</li>`).join('') + '</ol>';

function ask(q0, after){ const ord = q0[1].map((_, i) => i).sort(() => Math.random() - .5), q = [q0[0], ord.map(i => q0[1][i]), ord.indexOf(q0[2])]; quiz = q; ui.q.innerHTML = `<p style="margin-bottom:8px">${q[0]}</p>` + q[1].map((c, i) => `<button class="tool" style="width:100%;margin:4px 0;text-align:left" data-i="${i}" type="button">${c}</button>`).join('');

function complete(){ const s = steps[si]; si++; sfx.ok(); render(); if (s.q) ask(s.q, () => {}); if (si >= steps.length) setTimeout(() => ask(RESULT_Q[app.opts.exp], finish), 2200); }

/* 도구 위치 (현재 상태에 따라) */
function toolPos(k){ if (k === 'plant') return leaf.sun > 0 ? at('window').map((v, i) => i ? v + S.h * .42 : v + S.w * .08) : at('plant'); if (k === 'leaf') return [S.w * .32, S.h * .45]; if (k === 'leaf2') return [S.w * .42, S.h * .55]; return at(k); }

function hit(p, q, r){ return Math.hypot(p[0] - q[0], p[1] - q[1]) < r; }

app.pointer({
  down(x, y){ if (quiz || done) return; const s = steps[si]; const cands = ['box', 'foil', 'scissors', 'plant', 'leaf', 'leaf2', 'tube', 'dropper', 'burner'].filter(toolVisible);
    for (const k of cands) { const p = toolPos(k); if (hit([x, y], p, S.w * .055)) { if (s && k !== s.tool && !(k === 'burner')) { sfx.bad(); toast('지금은 다른 도구가 필요해요', 'bad'); mistakes++; return; } if (k === 'burner') { sfx.bad(); toast('알코올램프로 에탄올을 직접 가열하면 불이 붙을 수 있어요!', 'bad'); mistakes++; return; } drag = {k, x, y}; sfx.click(); return; } } },
  move(x, y, isDown){ if (drag) { drag.x = x; drag.y = y; } },
  up(x, y){ if (!drag) return; const s = steps[si]; const z = zonePos(s.zone);
    if (s.danger && hit([x, y], at(s.danger), S.w * .07)) { sfx.bad(); toast('직접 가열은 위험해요! 물중탕을 하세요', 'bad'); mistakes++; drag = null; return; }
    if (hit([x, y], z, S.w * .09)) { act(s.k); } else { sfx.whoosh(); }
    drag = null; }
});
function act(k){
  if (k === 'dark') { leaf.dark = true; anim.dark = performance.now(); toast('하룻밤이 지났어요 🌙'); complete(); }
  else if (k === 'foil') { leaf.foil = true; complete(); }
  else if (k === 'sun') { leaf.sun = .001; anim.sunT = performance.now(); }
  else if (k === 'cut') { leaf.picked = true; sfx.pop(); complete(); }
  else if (k === 'eth') { leaf.inTube = true; sfx.bubble(); complete(); }
  else if (k === 'bath') { leaf.bathing = performance.now(); }
  else if (k === 'rinse') { leaf.rinsed = true; sfx.drip(); complete(); }
  else if (k === 'iodine') { leaf.iodineT = performance.now(); for (let i = 0; i < 4; i++) setTimeout(() => sfx.drip(), i * 180); complete(); }
}
app.step = dt => {
  if (leaf.sun > 0 && leaf.sun < 1) { leaf.sun = Math.min(1, (performance.now() - anim.sunT) / 2600); if (leaf.sun >= 1) { toast('4시간이 지났어요 ☀️'); complete(); } }
  if (leaf.bathing && leaf.bath < 1) { leaf.bath = Math.min(1, (performance.now() - leaf.bathing) / 3200); if (Math.random() < .2) sfx.bubble(); if (leaf.bath >= 1) { toast('잎의 초록색이 빠졌어요'); complete(); } }
  if (leaf.iodineT) leaf.iodine = Math.min(1, (performance.now() - leaf.iodineT) / 2000);
};

/* ---------- 그리기 ---------- */
function leafPath(g, x, y, s, a){ const c = Math.cos(a), n = Math.sin(a), T = (px, py) => [x + px * c - py * n, y + px * n + py * c];
  g.beginPath(); g.moveTo(...T(0, 0)); g.bezierCurveTo(...T(s * .35, -s * .35), ...T(s * .85, -s * .3), ...T(s, 0)); g.bezierCurveTo(...T(s * .85, s * .3), ...T(s * .35, s * .35), ...T(0, 0)); g.closePath(); }
function drawLeaf(g, x, y, s, ang, mode){ // mode: 'live' 살아 있는 잎 | 'bleach' 탈색 | 'iodine' 아이오딘 반응
  const vari = leaf.vari, T = leaf.bath, I = leaf.iodine;
  const base = mode === 'live' ? '#4fa44a' : mode === 'bleach' ? `rgb(${D.lerp(79, 236, T) | 0},${D.lerp(164, 230, T) | 0},${D.lerp(74, 190, T) | 0})` : '#ece5bd';

  if (mode === 'iodine' && I > 0) { g.globalAlpha = I; g.fillStyle = '#2d2b52'; leafPath(g, x, y, s, ang); g.fill();
    g.fillStyle = g.strokeStyle = '#b5752e';
    if (vari) { g.lineWidth = s * .2; leafPath(g, x, y, s, ang); g.stroke(); }
    else { g.save(); g.translate(x, y); g.rotate(ang); g.fillRect(s * .38, -s, s * .26, s * 2); g.restore(); }
    g.globalAlpha = 1; }
  g.restore();
  g.save(); g.translate(x, y); g.rotate(ang); g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, 0); g.lineTo(s, 0); for (let k = 1; k < 5; k++) { g.moveTo(s * k / 5, 0); g.lineTo(s * (k / 5 + .1), -s * .12); g.moveTo(s * k / 5, 0); g.lineTo(s * (k / 5 + .1), s * .12); } g.stroke();
  if (leaf.foil && mode === 'live' && !leaf.picked && s > 0) { g.fillStyle = '#cfd5dc'; g.fillRect(s * .38, -s * .32, s * .26, s * .64); g.strokeStyle = '#9aa3ad'; g.lineWidth = 1; g.strokeRect(s * .38, -s * .32, s * .26, s * .64); for (let k = 0; k < 5; k++) { g.strokeStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.moveTo(s * .4, -s * .28 + k * s * .12); g.lineTo(s * .62, -s * .22 + k * s * .12); g.stroke(); } }
  g.restore(); }
function glowRing(g, p, r, t){ g.strokeStyle = `rgba(246,211,101,${.5 + .4 * Math.sin(t * 5)})`; g.lineWidth = 3; g.setLineDash([6, 5]); g.beginPath(); g.arc(p[0], p[1], r, 0, 7); g.stroke(); g.setLineDash([]); }
app.draw = (g, W, H) => {
  const t = performance.now() / 1000, s = steps ? steps[si] : null, u = Math.min(W, H);
  // 벽과 실험대
  g.fillStyle = '#e9e2d1'; g.fillRect(0, 0, W, H * .58); g.fillStyle = '#c99c66'; g.fillRect(0, H * .58, W, H * .42); g.fillStyle = '#b8895a'; g.fillRect(0, H * .58, W, 8);
  for (let i = 0; i < 6; i++) { g.strokeStyle = 'rgba(120,80,40,.15)'; g.beginPath(); g.moveTo(0, H * .64 + i * H * .06); g.lineTo(W, H * .62 + i * H * .065); g.stroke(); }
  // 창문 + 햇빛
  const wp = at('window'), ww = W * .2, wh = H * .3; g.fillStyle = '#bfe3f7'; g.fillRect(wp[0] - ww / 2 + W * .08, wp[1] - wh / 2, ww, wh); g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(wp[0] - ww / 2 + W * .08, wp[1] - wh / 2, ww, wh); g.beginPath(); g.moveTo(wp[0] + W * .08, wp[1] - wh / 2); g.lineTo(wp[0] + W * .08, wp[1] + wh / 2); g.stroke();
  g.fillStyle = '#ffd04d'; g.beginPath(); g.arc(wp[0] + W * .12, wp[1] - wh * .2, u * .035, 0, 7); g.fill();

  // 화분
  if (!(drag && drag.k === 'plant')) drawPlant(g, ...toolPos('plant'), u, t);
  // 어둠 상자 효과
  if (anim.dark && performance.now() - anim.dark < 1400) { const k = 1 - Math.abs((performance.now() - anim.dark) / 700 - 1); g.fillStyle = `rgba(10,15,30,${.85 * k})`; g.fillRect(0, 0, W, H); D.text(g, '🌙 하룻밤…', W / 2, H / 2, {size: 30, display: true, color: '#fff'}); }

  const kp = at('beaker'), bw = u * .14, bh = u * .16; g.fillStyle = 'rgba(120,180,230,.35)'; g.fillRect(kp[0] - bw / 2, kp[1] - bh * .35, bw, bh * .75); g.strokeStyle = '#6d8796'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(kp[0] - bw / 2, kp[1] - bh * .7); g.lineTo(kp[0] - bw / 2, kp[1] + bh * .4); g.lineTo(kp[0] + bw / 2, kp[1] + bh * .4); g.lineTo(kp[0] + bw / 2, kp[1] - bh * .7); g.stroke();

  D.text(g, '뜨거운 물', kp[0], kp[1] + bh * .55, {size: 12, color: '#5a4630'});
  // 시험관 (에탄올)
  const tubeIn = leaf.bathing && !(drag && drag.k === 'tube'), tp = tubeIn ? [kp[0], kp[1] - bh * .1] : at('tube');
  if (!(drag && drag.k === 'tube')) drawTube(g, tp[0], tp[1], u);
  // 페트리 접시
  const dp = at('dish'); g.fillStyle = 'rgba(230,240,245,.8)'; g.beginPath(); g.ellipse(dp[0], dp[1], u * .17, u * .07, 0, 0, 7); g.fill(); g.strokeStyle = '#9fb3bf'; g.lineWidth = 2; g.stroke(); D.text(g, '페트리 접시', dp[0], dp[1] + u * .1, {size: 12, color: '#5a4630'});
  if (leaf.rinsed) drawLeaf(g, dp[0] - u * .14, dp[1], u * .28, 0, leaf.iodine > 0 ? 'iodine' : 'bleach');
  if (leaf.iodineT) for (let i = 0; i < 6; i++) { const ph = ((performance.now() - leaf.iodineT) / 400 - i * .3); if (ph > 0 && ph < 1) { g.fillStyle = '#8a5a20'; g.beginPath(); g.arc(dp[0] - u * .05 + i * u * .02, dp[1] - u * .15 + ph * u * .14, 3, 0, 7); g.fill(); } }
  // 도구들

  if (s && !quiz && !drag) { glowRing(g, toolPos(s.tool), u * .06, t); }
  if (s && drag) { const zp = zonePos(s.zone); glowRing(g, zp, u * .08, t); D.text(g, '여기에 놓기', zp[0], zp[1] - u * .11, {size: 14, display: true, color: '#7a5a10', stroke: '#fff', strokeW: 4}); }
  if (drag) { if (drag.k === 'plant') drawPlant(g, drag.x, drag.y, u, t); else if (drag.k === 'leaf') drawLeaf(g, drag.x - u * .08, drag.y, u * .16, -.2, 'live'); else if (drag.k === 'leaf2') drawLeaf(g, drag.x - u * .08, drag.y, u * .16, -.2, 'bleach'); else if (drag.k === 'tube') drawTube(g, drag.x, drag.y, u); else drawTool(g, drag.k, drag.x, drag.y, u); }
  // 결과 라벨
  if (leaf.iodine >= 1) { D.text(g, leaf.vari ? '초록이던 부분: 청람색 · 흰 부분: 변화 없음(갈색)' : '빛 받은 부분: 청람색 · 가린 부분: 변화 없음(갈색)', W / 2, H * .08, {size: Math.max(13, u * .03), display: true, color: '#2d2b52', stroke: '#fff', strokeW: 5}); }
};
function drawPlant(g, x, y, u, t){ g.fillStyle = '#b5683e'; g.beginPath(); g.moveTo(x - u * .07, y); g.lineTo(x + u * .07, y); g.lineTo(x + u * .055, y + u * .1); g.lineTo(x - u * .055, y + u * .1); g.closePath(); g.fill(); g.fillStyle = '#9a5532'; g.fillRect(x - u * .075, y - 4, u * .15, 10);
  g.strokeStyle = '#3d7a37'; g.lineWidth = 4; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 5, y - u * .15, x + 2, y - u * .26); g.stroke();
  const sway = Math.sin(t * 1.5) * .04;
  if (!leaf.picked) drawLeaf(g, x + 2, y - u * .2, u * .2, -.35 + sway, 'live');
  const f0 = leaf.foil; leaf.foil = false; drawLeaf(g, x, y - u * .14, u * .13, Math.PI + .4 - sway, 'live'); drawLeaf(g, x + 2, y - u * .26, u * .11, -1.4 + sway, 'live'); leaf.foil = f0;
  if (leaf.dark && !leaf.sun && !leaf.foil && steps && steps[si] && steps[si].k === 'foil') {} }
function drawTube(g, x, y, u){ const w = u * .035, h = u * .18; g.save(); g.translate(x, y); g.fillStyle = `rgba(${D.lerp(240, 120, leaf.bath)},${D.lerp(240, 190, leaf.bath)},${D.lerp(220, 100, leaf.bath)},.75)`; g.fillRect(-w / 2, -h * .1, w, h * .6); g.strokeStyle = '#7f8f99'; g.lineWidth = 2; g.beginPath(); g.moveTo(-w / 2, -h * .5); g.lineTo(-w / 2, h * .4); g.arc(0, h * .4, w / 2, Math.PI, 0, true); g.lineTo(w / 2, -h * .5); g.stroke();
  if (leaf.inTube && !leaf.rinsed && leaf.bath < 1) { g.fillStyle = `rgb(${D.lerp(79, 236, leaf.bath)},${D.lerp(164, 230, leaf.bath)},${D.lerp(74, 190, leaf.bath)})`; g.beginPath(); g.ellipse(0, h * .15, w * .3, h * .25, 0, 0, 7); g.fill(); }
  g.restore(); D.text(g, '에탄올', x, y + h * .65, {size: 12, color: '#5a4630'}); }
function drawTool(g, k, x, y, u){ const r = u * .06;
  g.save(); g.translate(x, y);
  if (k === 'box') { g.fillStyle = '#3a3346'; D.rr(g, -r * 1.2, -r, r * 2.4, r * 2, 6); g.fill(); D.text(g, '🌙', 0, 0, {size: r}); D.text(g, '어둠 상자', 0, r * 1.5, {size: 12, color: '#5a4630'}); }
  if (k === 'foil') { g.fillStyle = '#d4d9df'; g.beginPath(); g.moveTo(-r, -r * .8); g.lineTo(r, -r); g.lineTo(r * .9, r * .8); g.lineTo(-r * .9, r); g.closePath(); g.fill(); g.strokeStyle = '#9aa3ad'; g.stroke(); D.text(g, '알루미늄 포일', 0, r * 1.5, {size: 12, color: '#5a4630'}); }
  if (k === 'scissors') { D.text(g, '✂️', 0, 0, {size: r * 1.6}); D.text(g, '가위', 0, r * 1.5, {size: 12, color: '#5a4630'}); }
  if (k === 'dropper') { g.fillStyle = '#7a4a1e'; D.rr(g, -r * .5, -r * .3, r, r * 1.2, 4); g.fill(); g.fillStyle = '#222'; g.fillRect(-r * .2, -r, r * .4, r * .7); D.text(g, '아이오딘 용액', 0, r * 1.5, {size: 12, color: '#5a4630'}); }
  g.restore(); }
