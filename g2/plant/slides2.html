## 식물의 호흡 | 양분에서 에너지를 꺼내다

= 호흡이란?
! 포도당 + 산소 → 이산화 탄소 + 물 + 에너지
- 세포에서 양분을 **산소**로 분해하여 생명 활동에 필요한 **에너지**를 얻는 과정
+ 식물도 동물처럼 **모든 살아 있는 세포**에서 호흡한다.
+ 호흡은 낮과 밤 **항상** 일어난다.

= 광합성과 호흡 비교
| | 광합성 | 호흡 |
|+ 일어나는 곳 | 엽록체가 있는 세포 | 모든 살아 있는 세포 |
|+ 일어나는 시간 | 빛이 있을 때 | 항상 (낮과 밤) |
|+ 흡수하는 기체 | 이산화 탄소 | 산소 |
|+ 내보내는 기체 | 산소 | 이산화 탄소 |
|+ 에너지 | 빛에너지를 양분에 **저장** | 양분 속 에너지를 **꺼내 씀** |

## 물질과 에너지의 흐름 | 서로 반대 방향의 순환

= 광합성과 호흡의 관계
^+ 광합성: 이산화 탄소 + 물 → 포도당 + 산소 (**빛에너지 저장**)
^+ 호흡: 포도당 + 산소 → 이산화 탄소 + 물 (**에너지 방출**)
^+ 한 과정의 산물이 다른 과정의 **재료**가 된다
>+ 식물이 자라려면 광합성으로 만든 양분이 호흡으로 쓰는 양보다 ==많아야== 한다.

= 생활 속 광합성과 호흡 | 사례
* 🌙 밤의 화분 :: 호흡만 하여 이산화 탄소를 내보낸다
* 🌲 숲 속 아침 공기 :: 낮 동안의 광합성으로 산소가 많다
* 🥬 채소 냉장 보관 :: 온도를 낮춰 호흡을 줄여 신선하게
* 🌾 볍씨 저장 :: 건조·저온으로 호흡을 줄인다
* 🍃 그늘의 식물 :: 광합성량이 적어 잘 자라지 못한다
* 🐟 어항 :: 수초와 물고기가 기체를 주고받는다

= 예제 1 · 하루의 양분 계산 | 적용
- 어떤 식물이 낮 12시간 동안 시간당 30만큼 광합성, 하루 24시간 내내 시간당 10만큼 호흡한다.
^+ 하루 광합성량 = 30 × 12 = **360**
^+ 하루 호흡량 = 10 × 24 = **240**
^+ 남는 양분 = 360 − 240 = **120** → 저장·생장에 쓰여 **자란다**

= 예제 2 · 그늘에서는? | 적용
- 같은 식물을 그늘로 옮겼더니 광합성이 시간당 15로 줄었다.
^+ 하루 광합성량 = 15 × 12 = **180**
^+ 하루 호흡량 = 10 × 24 = **240** (그대로)
^+ 180 − 240 = **−60** → 저장 양분을 꺼내 써야 해서 **잘 자라지 못한다**

= 예제 3 · BTB 색 예측 | 적용
- 초록색 BTB 용액에 검정말을 넣고 시험관을 은박지로 완전히 감쌌다.
^+ 빛이 없다 → 광합성 **안 함**
^+ 호흡만 한다 → 이산화 탄소 **증가**
^+ BTB 색 → 초록 → **노랑**

= 확인 문제 1
Q 식물의 호흡에 대한 설명으로 옳은 것은?
o 낮에만 일어난다.
o 엽록체에서만 일어난다.
o* 모든 살아 있는 세포에서 항상 일어난다.
o 이산화 탄소를 흡수하고 산소를 내보낸다.
:: 호흡은 산소를 흡수하고 이산화 탄소를 내보낸다.

= 확인 문제 2
Q BTB 용액은 이산화 탄소가 많아지면 어떤 색이 되는가?
o 파란색
o 초록색
o* 노란색
o 무색
:: 이산화 탄소가 줄면 파랑, 늘면 노랑

= 확인 문제 3
Q 맑은 날 낮 12시에 식물이 내보내는 기체와 그 까닭은?
o* 산소, 광합성량이 호흡량보다 많아서
o 이산화 탄소, 호흡만 해서
o 산소, 호흡을 하지 않아서
o 이산화 탄소, 광합성량이 더 많아서
:: 낮에도 호흡은 하지만 광합성량이 더 많다.

= 확인 문제 4
Q 광합성과 호흡에서 에너지의 출입으로 옳은 것은?
o 광합성은 에너지를 방출한다.
o* 광합성은 빛에너지를 양분에 저장하고, 호흡은 양분 속 에너지를 꺼내 쓴다.
o 호흡은 빛에너지를 흡수한다.
o 두 과정 모두 에너지를 저장한다.
:: 광합성은 저장, 호흡은 방출이다.

= 서술형 도전 | 생각 넓히기
? 밤에 침실에 화분을 많이 두지 말라는 말이 생긴 까닭을 식물의 기체 교환으로 설명하시오. :: 밤에는 식물이 광합성을 하지 않고 호흡만 하여 산소를 흡수하고 이산화 탄소를 내보내기 때문이다. (실제 영향은 매우 작다.)
? 빛이 매우 약한 숲 바닥의 식물은 잘 자라지 못한다. 광합성량과 호흡량을 비교하여 설명하시오. :: 빛이 약하면 광합성량이 호흡량보다 많지 않아, 쓰고 남아 저장되는 양분이 적어 자라는 데 쓸 양분이 부족하기 때문이다.

= 오늘 배운 내용 정리
- 호흡: 포도당 + [[산소]] → 이산화 탄소 + 물 + [[에너지]]
- 호흡은 모든 살아 있는 세포에서 [[항상]] 일어난다.
- 광합성은 빛에너지를 양분에 [[저장]], 호흡은 양분 속 에너지를 [[꺼내 씀]]
- 낮: 광합성량 > 호흡량 → [[산소]]를 내보냄, 밤: 호흡만 → [[이산화 탄소]]를 내보냄
- BTB 용액: 이산화 탄소가 늘면 [[노랑]], 줄면 파랑

= 나가기 전 한 문제 | 형성평가
? 아침에 광합성량과 호흡량이 같은 순간, 식물 바깥에서 측정한 산소와 이산화 탄소의 출입은 어떻게 보일지 쓰고 까닭을 쓰시오. :: 기체 출입이 없는 것처럼 보인다. 광합성으로 만든 산소를 호흡에 모두 쓰고, 호흡으로 나온 이산화 탄소를 광합성에 모두 쓰기 때문이다.
