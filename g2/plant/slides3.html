## 녹말 검출 | 빛을 받은 곳에만

= 시뮬레이션: 잎의 녹말 검출 | 실험실
@ sim.html#store | 잎의 일부를 알루미늄 포일로 가린 뒤 빛을 비추고, 아이오딘-아이오딘화 칼륨 용액으로 녹말을 검출하자.
% 실험 순서: 어둠에 하루 두기(녹말 없애기) → 일부 가리고 빛 → 에탄올 물중탕 → 아이오딘 용액

= 실험 과정
^+ 식물을 하루 동안 **어둠**에 두어 잎의 녹말을 없앤다
^+ 잎의 일부를 **알루미늄 포일**로 가리고 빛을 비춘다
^+ 잎을 따서 **에탄올**에 넣고 물중탕 → 엽록소를 녹여 색을 뺀다
^+ **아이오딘-아이오딘화 칼륨 용액**을 떨어뜨린다
% 에탄올은 불이 잘 붙으므로 직접 가열하지 않고 물중탕

= 실험 결과
| | 빛을 받은 부분 | 포일로 가린 부분 |
|+ 아이오딘 반응 색 | **청람색** | 변화 없음 |
|+ 알 수 있는 것 | 광합성이 일어나 녹말이 생김 | 빛이 없어 녹말이 생기지 않음 |
>+ 빛을 받아 광합성이 일어난 곳에서만 ==녹말==이 만들어진다.

## 이동과 저장 | 포도당 → 녹말 → 설탕 → 녹말

= 광합성 산물의 여행
^+ 잎: 포도당 → 곧 **녹말**로 바뀌어 잠시 저장
^+ 주로 밤: 녹말 → 물에 잘 녹는 **설탕**으로 바뀜
^+ 설탕이 **체관**을 따라 이동
^+ 뿌리·줄기·열매·씨에 **녹말, 단백질, 지방** 등으로 저장
>+ 양분은 ==호흡==의 에너지원이 되거나 몸의 구성 성분이 되어 생장에 쓰인다.

= 저장 기관
| 저장 기관 | 예 | 주로 저장하는 물질 |
|+ 뿌리 | 고구마, 무 | 녹말 |
|+ 줄기 | 감자 | 녹말 |
|+ 씨 | 콩 / 땅콩 | 단백질 / 지방 |
|+ 열매 | 사과, 포도 | 포도당, 과당 |

= 물관과 체관
| | 물관 | 체관 |
| 이동하는 것 | 물과 무기 양분 | 광합성 산물 (설탕) |
| 방향 | 뿌리 → 잎 (위로) | 잎 → 온몸 (위아래로) |
>+ 고구마의 단맛, 사과의 단맛 모두 ==잎==에서 온 것이다.

= 광합성 산물과 우리 | 사례
* 🍚 쌀 :: 벼의 씨에 저장된 녹말
* 🥜 땅콩버터 :: 땅콩 씨에 저장된 지방
* 🫘 두부 :: 콩 씨에 저장된 단백질
* 🍯 메이플 시럽 :: 단풍나무 수액 속 설탕
* 🍠 군고구마 :: 뿌리의 녹말이 열로 단맛 나는 당으로
* 🐄 우유·고기 :: 풀을 먹은 소 — 결국 광합성 산물

= 예제 1 · 녹말 검출 해석 | 적용
- 잎 가운데를 포일로 가리고 빛을 비춘 뒤 아이오딘 용액을 떨어뜨렸다.
^+ 가장자리(빛 받음) → **청람색** → 녹말 있음
^+ 가운데(가림) → **변화 없음** → 녹말 없음
^+ 결론: 광합성에는 **빛**이 필요하다

= 예제 2 · 양분의 누적 | 적용
- 감자 잎 하나가 하루에 녹말 0.2 g을 만들어 그중 절반을 덩이줄기로 보낸다. 잎이 20장이면 30일 동안 저장되는 양은?
^+ 잎 하나 하루 이동량 = 0.2 ÷ 2 = **0.1 g**
^+ 20장 하루 = 0.1 × 20 = **2 g**
^+ 30일 = 2 × 30 = **60 g**
>+ 나머지 절반은 잎과 줄기의 호흡·생장에 쓰였다.

= 예제 3 · 왜 설탕으로 바꿀까? | 적용
^+ 녹말 → 물에 잘 **녹지 않는다** → 체관으로 이동하기 어렵다
^+ 설탕 → 물에 잘 **녹는다** → 체관을 따라 이동하기 쉽다
^+ 도착하면 다시 **녹말**로 → 부피가 작고 안정해 저장하기 좋다

= 확인 문제 1
Q 아이오딘-아이오딘화 칼륨 용액과 반응하여 청람색을 나타내는 물질은?
o 포도당
o* 녹말
o 단백질
o 지방
:: 녹말 검출 반응이다.

= 확인 문제 2
Q 잎을 에탄올에 넣고 물중탕하는 까닭은?
o 녹말을 만들기 위해
o* 엽록소를 녹여 내어 색 변화를 잘 보기 위해
o 잎을 부드럽게 해 먹기 위해
o 산소를 발생시키기 위해
:: 초록색이 빠져야 청람색 변화가 잘 보인다.

= 확인 문제 3
Q 광합성 산물이 이동하는 형태와 통로는?
o 녹말, 물관
o* 설탕, 체관
o 포도당, 물관
o 녹말, 체관
:: 물에 잘 녹는 설탕으로 바뀌어 체관을 따라 이동한다.

= 확인 문제 4
Q 콩에 주로 저장되는 물질은?
o 녹말
o 포도당
o* 단백질
o 지방
:: 콩은 단백질, 땅콩은 지방을 많이 저장한다.

= 서술형 도전 | 생각 넓히기
? 잎에서 만든 녹말이 설탕으로 바뀌어 이동하는 까닭을 쓰시오. :: 녹말은 물에 잘 녹지 않지만 설탕은 물에 잘 녹아 체관을 따라 이동하기 쉽기 때문이다.
? 우리가 먹는 쌀의 에너지는 처음에 어디에서 온 것인지 쓰시오. :: 태양의 빛에너지 — 벼가 광합성으로 빛에너지를 양분 속에 저장한 것이다.

= 오늘 배운 내용 정리
- 녹말 + 아이오딘-아이오딘화 칼륨 용액 → [[청람색]]
- 빛을 받은 부분에서만 [[녹말]]이 만들어진다.
- 포도당 → 녹말(잎) → [[설탕]] → [[체관]]으로 이동
- 저장: 고구마 뿌리·감자 줄기 → 녹말, 콩 → [[단백질]], 땅콩 → 지방
- 광합성 산물은 식물과 동물 모두의 [[에너지원]]이 된다.

= 나가기 전 한 문제 | 형성평가
? 처음의 고구마 녹말이 만들어지기까지 '빛 → 잎 → 체관 → 뿌리'의 순서로 물질의 변화를 한 문장으로 쓰시오. :: 잎이 빛에너지로 광합성을 해 포도당을 만들고, 이것이 녹말로 저장되었다가 설탕으로 바뀌어 체관을 따라 뿌리로 이동한 뒤 다시 녹말로 저장된다.
