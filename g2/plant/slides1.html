## 광합성 | 빛으로 양분을 만든다

= 광합성이란?
! 이산화 탄소 + 물 ─(빛에너지, 엽록체)→ 포도당 + 산소
- 식물이 **빛에너지**를 이용하여 양분(포도당)을 만드는 과정
+ 일어나는 곳: 잎의 세포 속 **엽록체**
+ 이산화 탄소는 잎의 **기공**으로, 물은 **뿌리**에서 흡수해 물관으로 이동
>+ 빛에너지가 양분 속의 ==화학 에너지==로 저장된다.

= 재료와 산물
| 구분 | 물질 | 들어오고 나가는 길 |
|+ 재료 | 이산화 탄소 | 잎의 기공으로 들어옴 |
|+ 재료 | 물 | 뿌리 → 물관 → 잎 |
|+ 산물 | 포도당 | 녹말로 바뀌어 잎에 저장 (3차시) |
|+ 산물 | 산소 | 기공으로 나감 |

## 환경 요인 | 빛, 이산화 탄소, 온도

= 시뮬레이션: 광합성과 환경 요인 | 실험실
@ sim.html#photo | 검정말을 넣은 비커에 빛을 비추고, 1분 동안 발생하는 기포 수로 광합성량을 비교하자.
% 빛의 세기만 바꾸고 나머지는 같게 — 1학년 변인 통제와 연결

= 실험 설계
| 항목 | 내용 |
|+ 가설 | 빛이 셀수록 광합성량(기포 수)이 많아질 것이다 |
|+ 조작 변인 | 빛의 세기 |
|+ 통제 변인 | 이산화 탄소 농도(탄산수소 나트륨 양), 온도, 검정말의 양 |
|+ 종속 변인 | 1분 동안 발생한 기포 수 |
~ 탄산수소 나트륨은 물에 이산화 탄소를 공급한다

= 빛의 세기와 기포 수
C 빛이 세질수록 늘다가 어느 이상에서는 일정 | 빛의 세기 | 1분 동안 기포 수 | 기포 수:0,0 20,7 40,13 60,19 80,19
~ 60 이후에는 빛을 더 세게 해도 늘지 않는다 → 다른 요인(이산화 탄소)이 부족

= 세 가지 환경 요인
| 요인 | 광합성량의 변화 |
|+ 빛의 세기 | 셀수록 증가하다가 어느 이상에서 일정 |
|+ 이산화 탄소 농도 | 높을수록 증가하다가 어느 이상에서 일정 |
|+ 온도 | 적당할 때(약 30 ~ 35 °C) 가장 많고, 너무 높으면 **감소** |
>+ 빛이 충분할 때 광합성량이 멈췄다면 → 이산화 탄소를 더 넣으면 ==다시 늘어난다==.

= 생활 속 광합성 | 사례
* 🏡 비닐하우스 :: 온도를 유지하고 이산화 탄소를 공급
* 💡 식물 공장 :: LED 조명으로 빛의 세기와 시간을 조절
* 🌳 도시 숲 :: 광합성으로 이산화 탄소를 흡수하고 산소 공급
* 🐠 수족관 수초 :: 조명을 켜면 기포가 올라온다
* 🌾 여름 한낮 :: 너무 더우면 기공을 닫아 광합성이 줄기도
* 🌍 지구의 산소 :: 식물과 바다의 조류가 광합성으로 만든다

= 예제 1 · 평균 기포 수 | 적용
- 빛의 세기 40에서 1분 동안 기포 수를 세 번 측정했더니 12, 14, 13개였다.
^+ 합 = 12 + 14 + 13 = **39개**
^+ 평균 = 39 ÷ 3 = **13개**
^+ 여러 번 측정해 평균을 내면 우연한 오차가 줄어든다

= 예제 2 · 그래프 해석 | 적용
- 빛의 세기가 20 → 40으로 2배가 되면 기포 수는? 60 → 80이면?
^+ 20 → 40: 7 → 13개, 약 **6개 증가**
^+ 60 → 80: 19 → 19개, **변화 없음**
^+ 까닭: 빛은 충분하고 **이산화 탄소**가 부족해 광합성량이 더 늘지 못한다

= 예제 3 · 이산화 탄소 실험 설계 | 적용
- 탐구 문제: 이산화 탄소 농도가 높을수록 광합성량이 많아질까?
^+ 조작 변인 → 탄산수소 나트륨의 **양** (0 g, 1 g, 2 g)
^+ 통제 변인 → **빛의 세기**, 온도, 검정말의 양, 물의 양
^+ 종속 변인 → 1분 동안 발생한 **기포 수**
% 학습지 1차시 뒷면 3번 — 모둠별로 온도 또는 이산화 탄소 중 하나 선택

= 확인 문제 1
Q 광합성의 산물끼리 짝 지은 것은?
o 이산화 탄소, 물
o* 포도당, 산소
o 포도당, 이산화 탄소
o 산소, 물
:: 재료는 이산화 탄소와 물, 산물은 포도당과 산소이다.

= 확인 문제 2
Q 광합성이 일어나는 곳은?
o 핵
o 마이토콘드리아
o* 엽록체
o 세포막
:: 엽록체에 있는 엽록소가 빛을 흡수한다.

= 확인 문제 3
Q 검정말 실험에서 기포가 산소인지 확인하는 방법은?
o 석회수에 통과시킨다.
o* 꺼져 가는 불씨를 넣는다.
o 성냥불을 대어 '퍽' 소리를 듣는다.
o 냄새를 맡는다.
:: 산소는 꺼져 가는 불씨를 다시 타오르게 한다.

= 확인 문제 4
Q 빛이 충분한데도 광합성량이 더 늘지 않을 때 광합성량을 늘리는 방법은?
o 빛을 더 세게 한다.
o* 이산화 탄소를 더 공급한다.
o 온도를 60 °C로 높인다.
o 검정말을 어둠에 둔다.
:: 부족한 다른 요인을 늘려야 한다. 온도가 너무 높으면 오히려 줄어든다.

= 서술형 도전 | 생각 넓히기
? 온도가 너무 높으면 광합성량이 줄어드는 까닭을 추론하시오. :: 광합성은 여러 단계의 화학 반응으로 일어나는데, 온도가 너무 높으면 반응을 돕는 물질이 제 기능을 못 하고, 식물이 물을 잃지 않으려 기공을 닫아 이산화 탄소가 잘 들어오지 못하기 때문이다.
? 겨울철 비닐하우스에서 난방과 함께 이산화 탄소를 공급하는 까닭을 광합성의 환경 요인으로 설명하시오. :: 겨울에는 온도가 낮아 광합성량이 적으므로 난방으로 적당한 온도를 유지하고, 밀폐된 하우스 안의 부족한 이산화 탄소를 공급하여 광합성량을 늘리기 위해서이다.

= 오늘 배운 내용 정리
- 광합성: 이산화 탄소 + [[물]] → [[포도당]] + 산소 (빛에너지, 엽록체)
- 이산화 탄소는 잎의 [[기공]]으로, 물은 뿌리에서 [[물관]]으로 이동한다.
- 광합성량에 영향을 주는 요인: [[빛의 세기]], 이산화 탄소 농도, [[온도]]
- 빛이 세질수록 광합성량은 늘다가 어느 이상에서 [[일정]]해진다.
- 온도가 너무 높으면 광합성량이 [[줄어든다]].

= 나가기 전 한 문제 | 형성평가
? 처음의 겨울 딸기 비닐하우스에서, 밤에 조명을 켜고 이산화 탄소를 넣는 까닭을 각각 쓰시오. :: 조명은 빛을 공급해 광합성 시간을 늘리고, 이산화 탄소는 광합성의 재료를 늘려 빛이 충분할 때 광합성량이 더 많아지게 하기 위해서이다.
