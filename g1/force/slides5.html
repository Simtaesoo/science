# 힘의 평형과 장치 설계 | 떠 있는 잠수정 만들기 | 중학교 과학 1 · 05 힘의 작용 · 5차시 | 2022 개정 교육과정 [9과05-04]

= 오늘의 학습 목표 | 5차시
^ 여러 사례에서 작용하는 힘을 찾고 **힘의 평형**을 설명할 수 있다.
^ 중력과 부력의 관계로 잠수정이 **뜨고 가라앉고 머무는** 원리를 설명할 수 있다.
^ 힘의 특징을 이용한 **장치를 설계**하고 개선할 수 있다.
% 흐름: 생각 열기 5분 → 평형 사례 10분 → 잠수정 설계 15분 → 문항 7분 → 계란 낙하 설계 8분

= 잠수함은 어떻게 원하는 깊이에 멈출까? | 생각 열기
* 🚢 수면 :: 떠 있다
* ⬇️ 잠수 :: 탱크에 바닷물을 넣으면 가라앉는다
* ⏸️ 목표 깊이 :: 물을 조절해 그 깊이에 멈춘다
? 탱크의 물로 무엇을 조절하는 것일까? :: 잠수함의 무게(중력). 부력과 같아지게 하면 힘의 평형으로 그 깊이에 머문다.

= 이 단원에서 배운 힘 | 복습
| 힘 | 방향 | 크기에 영향 |
| 중력 | 지구 중심 | 질량 |
| 탄성력 | 변형과 반대 | 변형시킨 힘 |
| 마찰력 | 운동과 반대 | 거칠기, 무게 |
| 부력 | 위쪽 | 잠긴 부피 |
? 알짜힘이 0이면? :: 정지한 물체는 계속 정지, 움직이는 물체는 같은 속력·방향으로 계속 움직인다.

## 사례 속 힘의 평형 | 위아래 힘이 같으면

= 힘의 평형 사례
| 사례 | 아래로 작용하는 힘 | 위로 작용하는 힘 |
|+ 천장에 매달린 전등 | 중력 | 줄이 당기는 힘 |
|+ 바닥에 놓인 가방 | 중력 | 바닥이 떠받치는 힘 |
|+ 물에 떠 있는 오리배 | 중력 | 부력 |
|+ 일정한 속력으로 내려오는 낙하산 | 중력 | 공기 저항 |
>+ 네 사례 모두 위·아래 힘의 크기가 같아 ==알짜힘이 0==이다.

= 정지와 등속 운동
! 알짜힘이 0 → 정지하거나 일정한 속력으로 곧게 운동
- 정지해 있다고 힘이 없는 것이 아니다 — **힘들이 평형**을 이룬 것!
+ 낙하산: 처음에는 빨라지다가, 공기 저항이 중력과 같아지면 **일정한 속력**
>+ '움직이는데 알짜힘이 0일 수 있다'는 것이 핵심!
% 낙하산 사례로 1차시 엘리베이터 문제와 연결

## 잠수정 설계 | 중력과 부력의 줄다리기

= 잠수정의 원리 | 물에 완전히 잠긴 잠수정의 부력 10 N
| 물탱크의 물 | 중력 (N) | 부력 (N) | 두 힘의 관계 | 잠수정 |
|+ 20 % | 8.8 | 10 | 중력 < 부력 | 떠오른다 |
|+ 50 % | 10 | 10 | 중력 = 부력 | 머무른다 |
|+ 80 % | 11.2 | 10 | 중력 > 부력 | 가라앉는다 |
~ 시뮬레이션: 빈 잠수정 8 N + 물탱크의 물(가득 차면 4 N)

= 그래프로 보면
C 물탱크의 물과 두 힘 | 물탱크의 물 (%) | 힘 (N) | 중력:0,8 20,8.8 50,10 80,11.2 100,12 | 부력:0,10 100,10
~ 두 선이 만나는 50 %에서 힘의 평형 → 그 깊이에 머무른다

= 시뮬레이션: 잠수정 | 실험실
@ sim.html#design | 물탱크의 물을 조절해 잠수정을 목표 깊이에 머무르게 하자. 떠오를 때, 가라앉을 때, 머무를 때의 힘을 기록!
% 바로 50 %로 맞추면 움직이지 않음 → '먼저 가라앉히고 목표 근처에서 50 %로' 전략을 스스로 찾게 하기

= 성공 전략
^+ 물을 50 %보다 **많이** 넣어 가라앉힌다 (중력 > 부력)
^+ 목표 깊이에 가까워지면 물을 줄여 **50 %**로 맞춘다
^+ 중력 = 부력 → 알짜힘 0 → 그 깊이에 **머무른다**
>+ 실제 잠수함과 물고기의 부레도 같은 원리!

= 힘을 이용한 장치 | 사례
* 🐟 물고기의 부레 :: 공기양으로 부력을 조절
* 🪂 낙하산 :: 넓게 펴서 공기 저항을 키운다
* 🚲 자전거 브레이크 :: 마찰력으로 멈춘다
* 🛏️ 에어백·매트 :: 탄성력으로 충격을 줄인다
* 🛟 구명조끼 :: 부피를 키워 부력을 크게
* 🎢 롤러코스터 제동 장치 :: 마찰력으로 안전하게 정지

= 예제 1 · 평형 확인 | 적용
- 무게 30 N인 전등이 천장에 줄로 매달려 정지해 있다.
^+ 정지 → 알짜힘 = **0**
^+ 아래로 중력 30 N → 위로 줄이 당기는 힘 = **30 N**
^+ 두 힘: 크기 같음, 방향 반대, 같은 직선 위 → **힘의 평형**

= 예제 2 · 잠수정 계산 | 적용
- 잠수정(부력 10 N)의 물탱크를 30 %로 했다. (중력 = 8 + 4 × 물의 비율)
^+ 중력 = 8 + 4 × 0.3 = **9.2 N**
^+ 알짜힘 = 10 − 9.2 = **0.8 N, 위쪽**
^+ 잠수정은 **떠오른다** → 머무르려면 물을 **50 %**로 늘린다

= 예제 3 · 낙하산의 속력 | 적용
- 무게 700 N인 사람이 낙하산을 펴고 내려온다.
^+ 처음: 공기 저항 < 700 N → 알짜힘 아래 → **빨라진다**
^+ 속력이 커질수록 공기 저항이 커진다
^+ 공기 저항 = **700 N**이 되면 → 알짜힘 0 → **일정한 속력**으로 내려온다

= 확인 문제 1
Q 물에 떠서 정지해 있는 오리배에 작용하는 두 힘의 관계로 옳은 것은?
o 중력 > 부력
o 중력 < 부력
o* 중력 = 부력
o 부력만 작용한다.
:: 정지해 있으므로 두 힘이 평형을 이룬다.

= 확인 문제 2
Q 잠수정이 가라앉는 경우는?
o* 중력이 부력보다 클 때
o 중력이 부력보다 작을 때
o 중력과 부력이 같을 때
o 부력이 0일 때만
:: 알짜힘이 아래쪽이면 가라앉는다.

= 확인 문제 3
Q 일정한 속력으로 내려오는 낙하산에 대한 설명으로 옳은 것은?
o 중력이 작용하지 않는다.
o 공기 저항이 중력보다 크다.
o* 알짜힘이 0이다.
o 속력이 점점 빨라진다.
:: 일정한 속력의 직선 운동 → 운동 상태가 변하지 않음 → 알짜힘 0

= 확인 문제 4
Q 잠수정(부력 10 N, 중력 = 8 + 4 × 물의 비율)의 물탱크가 비어 있을 때 알짜힘은?
o 0 N
o 2 N, 아래쪽
o* 2 N, 위쪽
o 10 N, 위쪽
:: 중력 8 N, 부력 10 N → 10 − 8 = 2 N, 위쪽 → 떠오른다

= 서술형 도전 | 생각 넓히기
? 바닥에 정지해 있는 가방에는 힘이 작용하지 않는다는 친구의 말을 바로잡으시오. :: 가방에는 아래로 중력, 위로 바닥이 떠받치는 힘이 작용한다. 두 힘의 크기가 같고 방향이 반대여서 알짜힘이 0이므로 정지해 있는 것이다.
? 물고기가 부레의 공기를 늘리면 떠오르는 까닭을 부력과 중력으로 설명하시오. :: 부레에 공기가 늘면 몸의 부피가 커져 잠긴 부피가 늘어나 부력이 커진다. 부력이 중력보다 커지면 알짜힘이 위쪽이 되어 떠오른다.

= 설계 과제 · 계란 낙하 보호 장치 | 적용 미션
* 🥚 목표 :: 2층 높이에서 떨어뜨려도 계란이 깨지지 않게
* 🧰 재료 :: 종이, 빨대, 고무줄, 비닐봉지, 테이프 (모둠 동일)
* 🪂 이용할 힘 :: 공기 저항(비닐 낙하산), 탄성력(고무줄 완충)
- 설계도에 작용하는 힘을 **화살표**로 그리고, 시험 → 평가 → 개선!
% 학습지 5차시 뒷면 3·4번. 안전: 낙하 지점 아래 출입 통제

= 오늘 배운 내용 정리
- 정지하거나 일정한 속력으로 곧게 움직이는 물체는 알짜힘이 [[0]]인 힘의 평형 상태
- 바닥에 놓인 물체: 중력 = 바닥이 [[떠받치는 힘]]
- 잠수정: 중력 > 부력이면 [[가라앉고]], 중력 < 부력이면 [[떠오른다]].
- 잠수정이 일정한 깊이에 머무르려면 중력 = [[부력]]
- 장치를 설계할 때는 필요한 힘을 정하고 그 힘을 [[크게]] 하거나 작게 하는 방법을 찾는다.

= 나가기 전 한 문제 | 형성평가
? 처음의 잠수함이 목표 깊이에 멈추기까지 탱크의 물을 어떻게 조절해야 하는지 중력과 부력을 넣어 순서대로 쓰시오. :: 탱크에 물을 넣어 중력을 부력보다 크게 해 가라앉힌 뒤, 목표 깊이 근처에서 물을 빼 중력과 부력을 같게(알짜힘 0) 하면 그 깊이에 머무른다.
