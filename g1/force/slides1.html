= 줄다리기 결승전 | 생각 열기
* 🔴 청팀 :: 온 힘을 다해 왼쪽으로 당긴다
* 🔵 백팀 :: 온 힘을 다해 오른쪽으로 당긴다
* 🪢 줄 :: 1분째 꼼짝도 하지 않는다
? 양 팀 모두 힘을 주고 있는데 줄은 왜 움직이지 않을까? :: 두 팀이 당기는 힘의 크기가 같고 방향이 반대여서, 합한 힘(알짜힘)이 0이기 때문이다.
% 오늘의 키워드 '알짜힘 = 0'을 칠판에 미리 적어 두기

= 초등학교에서 배운 것 | 복습

| 무게 | 용수철저울로 잰다 |

| 물체의 운동 | 빠르기 = 이동 거리 ÷ 걸린 시간 |
? 과학에서 '힘을 받았다'는 것은 무엇으로 알 수 있을까? :: 물체의 모양이 변하거나, 빠르기·방향(운동 상태)이 변한다.

## 힘의 표현 | 크기 · 방향 · 작용점

= 힘이란?
! 힘 = 물체의 ==모양==이나 ==운동 상태==를 변하게 하는 원인
- 단위: **N** (뉴턴)
+ 모양 변화: 찰흙을 누르면 납작해진다, 용수철을 당기면 늘어난다
+ 운동 상태 변화: 공을 차면 날아간다, 브레이크를 밟으면 멈춘다
>+ 지구에서 질량 100 g인 물체를 들 때 약 **1 N**의 힘이 든다.

= 힘의 세 요소
| 요소 | 화살표에서 |
|+ 힘의 크기 | 화살표의 **길이** |
|+ 힘의 방향 | 화살표의 **방향** |
|+ 힘의 작용점 | 화살표의 **시작점** |
>+ 같은 크기의 힘이라도 방향이나 작용점이 다르면 효과가 다르다.
? 문 손잡이를 경첩 쪽에 달면? :: 같은 힘으로 밀어도 문이 잘 열리지 않는다 — 작용점이 중요!

= 화살표로 그리기 | 모눈 한 칸 = 10 N
| 힘 | 화살표 |
| 오른쪽으로 40 N | → 4칸 |
| 왼쪽으로 20 N | ← 2칸 |
| 위로 30 N | ↑ 3칸 |
- 먼저 **기준(한 칸 = 몇 N)**을 정하고, 작용점에서 시작해 그린다.
% 학습지 1차시 뒷면 4번 — 모눈에 직접 그리게 하기

## 합력과 힘의 평형 | 여러 힘을 하나로

= 두 힘의 합력
| 두 힘의 방향 | 합력의 크기 | 합력의 방향 |
|+ 같은 방향 | 두 힘의 **합** | 두 힘의 방향 |
|+ 반대 방향 | 두 힘의 **차** | **큰** 힘의 방향 |
>+ **알짜힘**: 물체에 작용하는 모든 힘의 합력

= 시뮬레이션: 힘의 표현과 평형 | 실험실
@ sim.html#bal | 두 힘의 크기와 방향을 바꾸며 알짜힘과 상자의 움직임을 기록하자.
% 30 N·20 N 같은 방향 → 반대 방향 → 25 N·25 N 반대 방향 순서로

= 시뮬레이션 결과 정리
| 두 힘의 방향 | 힘 ① | 힘 ② | 알짜힘 | 상자 |
|+ 같은 방향 | 30 N | 20 N | 50 N, 오른쪽 | 움직임 |
|+ 반대 방향 | 30 N | 20 N | 10 N, ①의 방향 | 움직임 |
|+ 반대 방향 | 25 N | 25 N | 0 N | 정지 (평형) |

= 힘의 평형
! 알짜힘 = 0 인 상태
^+ 두 힘의 크기가 **같고**
^+ 방향이 **반대**이며
^+ **같은 직선** 위에 있을 때
>+ 알짜힘이 0이면 정지한 물체는 ==계속 정지==해 있다.

= 생활 속 힘의 평형 | 사례
* 🪢 줄다리기 :: 두 팀의 힘이 같으면 줄이 멈춘다
* 📚 책상 위 책 :: 중력 = 책상이 떠받치는 힘
* 💡 천장 전등 :: 중력 = 줄이 당기는 힘
* 🚣 물에 뜬 배 :: 중력 = 부력
* 🧗 매달린 사람 :: 중력 = 손이 잡는 힘
* 🛗 일정한 속력의 엘리베이터 :: 위로 당기는 힘 = 중력

= 예제 1 · 같은 방향의 합력 | 적용
- 친구와 함께 상자를 오른쪽으로 밀었다. 나는 30 N, 친구는 20 N.
^+ 두 힘의 방향 → **같다**
^+ 합력의 크기 = 30 + 20 = **50 N**
^+ 합력의 방향 → **오른쪽**

= 예제 2 · 반대 방향의 합력 | 적용
- 상자에 오른쪽으로 40 N, 왼쪽으로 20 N의 힘이 작용한다.
^+ 두 힘의 방향 → **반대**
^+ 합력의 크기 = 40 − 20 = **20 N**
^+ 합력의 방향 → 큰 힘의 방향인 **오른쪽**
>+ 모눈(한 칸 = 10 N)으로 그리면 오른쪽 4칸, 왼쪽 2칸 → 남는 것 오른쪽 2칸!

= 예제 3 · 평형이 되려면? | 적용
- 상자에 오른쪽으로 35 N, 왼쪽으로 15 N이 작용한다. 힘을 하나 더해 평형을 만들자.
^+ 지금 알짜힘 = 35 − 15 = **20 N, 오른쪽**
^+ 알짜힘을 0으로 → 크기가 같고 방향이 반대인 힘
^+ 더할 힘 = **왼쪽으로 20 N** (같은 직선 위)

= 확인 문제 1
Q 힘의 세 요소가 **아닌** 것은?
o 힘의 크기
o 힘의 방향
o 힘의 작용점
o* 힘을 준 시간
:: 힘의 세 요소는 크기·방향·작용점이다.

= 확인 문제 2
Q 왼쪽으로 50 N, 오른쪽으로 80 N이 작용할 때 알짜힘은?
o 130 N, 오른쪽
o* 30 N, 오른쪽
o 30 N, 왼쪽
o 0 N
:: 반대 방향 → 차: 80 − 50 = 30 N, 큰 힘의 방향(오른쪽)

= 확인 문제 3
Q 줄다리기에서 줄이 움직이지 않을 때에 대한 설명으로 옳은 것은?
o 양쪽 모두 힘을 주지 않고 있다.
o 한쪽 팀의 힘이 더 크다.
o* 두 팀이 당기는 힘의 크기가 같고 방향이 반대이다.
o 두 팀이 같은 방향으로 당기고 있다.
:: 힘의 평형 상태이다.

= 확인 문제 4
Q 한 칸이 10 N인 모눈에서 6칸 길이의 화살표가 나타내는 힘의 크기는?
o 6 N
o 16 N
o* 60 N
o 600 N
:: 6 × 10 = 60 N

= 서술형 도전 | 생각 넓히기
? 책상 위에 정지해 있는 책에 작용하는 두 힘의 이름을 쓰고, 그 관계를 설명하시오. :: 아래로 작용하는 중력과 위로 책상이 떠받치는 힘. 두 힘은 크기가 같고 방향이 반대이며 같은 직선 위에 있어 힘의 평형을 이룬다.
? 엘리베이터가 일정한 속력으로 올라가고 있다. 줄이 당기는 힘과 중력의 크기를 비교하고 까닭을 쓰시오. :: 크기가 같다. 속력과 방향이 변하지 않아 운동 상태가 변하지 않으므로 알짜힘이 0인 힘의 평형 상태이다.

- 같은 방향 두 힘의 합력 = 두 힘의 [[합]], 반대 방향 = 두 힘의 [[차]]

- 알짜힘이 0인 상태 = [[힘의 평형]]

= 나가기 전 한 문제 | 형성평가
? 줄다리기에서 청팀이 400 N, 백팀이 380 N으로 당긴다. 알짜힘의 크기와 방향을 쓰고, 줄이 멈추려면 어떻게 되어야 하는지 쓰시오. :: 알짜힘 20 N, 청팀 쪽. 백팀이 20 N 더 세게 당겨 두 힘의 크기가 같아지면(400 N) 알짜힘이 0이 되어 멈춘다.
