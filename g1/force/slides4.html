# 알짜힘과 운동 상태의 변화 | 속력이 변할까, 방향이 변할까? | 중학교 과학 1 · 05 힘의 작용 · 4차시 | 2022 개정 교육과정 [9과05-03]

= 오늘의 학습 목표 | 4차시
^ **운동 상태**를 속력과 운동 방향으로 나타낼 수 있다.
^ 알짜힘의 **방향**에 따라 운동 상태가 어떻게 변하는지 설명할 수 있다.
^ 생활 속 운동을 **속력·방향의 변화**에 따라 분류할 수 있다.
% 흐름: 생각 열기 5분 → 운동 상태 8분 → 시뮬레이션 15분 → 문항 10분 → 골프 게임 7분

= 컬링 스톤의 여행 | 생각 열기
* 🥌 던진 직후 :: 스톤이 미끄러지기 시작한다
* 🧹 빗질 :: 얼음을 문질러 마찰을 줄이면 더 멀리 간다
* 🎯 끝 :: 결국 천천히 멈춘다
? 스톤은 왜 멈출까? 마찰이 전혀 없는 얼음이라면 어떻게 될까? :: 운동 반대 방향의 마찰력(알짜힘) 때문에 멈춘다. 마찰이 없으면 같은 속력으로 같은 방향으로 계속 움직인다.

= 지난 시간 복습 | 3차시
| 힘 | 방향 |
| 마찰력 | [[운동 방향과 반대]] |
| 부력 | [[위쪽]] |
| 중력 | [[지구 중심 방향]] |
? 알짜힘이 0이면 정지한 물체는? :: 계속 정지해 있다 (힘의 평형)

## 운동 상태 | 속력과 방향

= 운동 상태란?
! 운동 상태 = ==속력== + ==운동 방향==
- 둘 중 **하나만** 바뀌어도 운동 상태가 변한 것이다.
+ 속력만 변함: 출발하는 자동차, 멈추는 자전거
+ 방향만 변함: 일정한 빠르기로 도는 회전목마
+ 둘 다 변함: 비스듬히 던진 공

= 알짜힘이 0일 때
! 운동 상태가 ==변하지 않는다==
- 정지한 물체 → 계속 **정지**
+ 움직이는 물체 → **같은 속력**으로 **같은 방향**으로 계속 움직인다
>+ 굴러가던 공이 멈추는 것은 '힘이 없어서'가 아니라 **마찰력이 작용해서**!
% 아리스토텔레스식 오개념(움직이려면 계속 힘이 필요) 짚기

## 알짜힘의 방향과 운동 | 같은 쪽, 반대쪽, 옆쪽

= 시뮬레이션: 알짜힘과 운동 | 실험실
@ sim.html#net | 얼음판 위 퍽에 작용하는 힘의 방향을 바꾸며 퍽이 움직인 자취를 관찰하자.
% '작용하지 않음 → 같은 방향 → 반대 → 수직 → 비스듬히' 순서로 자취를 학습지에 그리기

= 관찰 결과 정리
| 알짜힘의 방향 | 속력 | 운동 방향 | 자취 |
|+ 작용하지 않음 | 일정 | 일정 | 직선 |
|+ 운동 방향과 같음 | 빨라짐 | 일정 | 직선 |
|+ 운동 방향과 반대 | 느려짐 | 일정 | 직선 (멈춤) |
|+ 운동 방향과 수직 | 일정 | 계속 변함 | 원 |
|+ 비스듬히 | 변함 | 변함 | 곡선 (포물선) |

= 속력의 변화를 그래프로 | 예: 처음 속력 2 m/s인 퍽
C 알짜힘의 방향에 따른 속력 변화 (예) | 시간 (초) | 속력 (m/s) | 같은 방향:0,2 1,3 2,4 3,5 4,6 | 힘 없음:0,2 4,2 | 반대 방향:0,2 1,1.5 2,1 3,0.5 4,0
~ 같은 방향이면 증가, 반대 방향이면 감소, 힘이 없으면 일정

= 생활 속 운동 분류 | 사례
* 🚲 브레이크 밟은 자전거 :: 속력만 변함 (느려짐)
* 🍎 떨어지는 사과 :: 속력만 변함 (빨라짐)
* 🎠 회전목마 :: 방향만 변함
* 🛰️ 인공위성 :: 방향만 변함
* 🏐 비스듬히 던진 공 :: 속력과 방향 모두 변함
* ⚽ 골대에 맞고 튕긴 공 :: 속력과 방향 모두 변함

= 예제 1 · 사례 분류하기 | 적용
- ㄱ. 브레이크로 멈추는 자전거 ㄴ. 일정한 빠르기로 도는 회전목마 ㄷ. 비스듬히 던진 공 ㄹ. 떨어지며 빨라지는 사과 ㅁ. 골대에 맞고 튕긴 공 ㅂ. 지구 주위를 도는 인공위성
^+ 속력만 변함 → **ㄱ, ㄹ**
^+ 운동 방향만 변함 → **ㄴ, ㅂ**
^+ 속력과 방향 모두 변함 → **ㄷ, ㅁ**

= 예제 2 · 알짜힘 구하고 운동 예측 | 적용
- 오른쪽으로 움직이는 수레에 오른쪽 15 N, 왼쪽 25 N의 힘이 작용한다.
^+ 알짜힘 = 25 − 15 = **10 N, 왼쪽**
^+ 운동 방향(오른쪽)과 **반대**
^+ 수레의 속력이 **점점 느려진다** (방향은 그대로, 결국 멈춘 뒤 왼쪽으로)

= 예제 3 · 돌리는 공 | 적용
- 실에 매단 공을 머리 위에서 일정한 빠르기로 돌리고 있다.
^+ 속력 → **일정**
^+ 운동 방향 → **계속 바뀐다**
^+ 실이 당기는 힘 → 운동 방향과 **수직** → 운동 상태가 **변하고 있다**
>+ 실을 놓으면? 알짜힘이 0 → 놓는 순간의 방향으로 ==곧게== 날아간다.

= 확인 문제 1
Q 마찰이 없는 수평면에서 움직이던 물체에 아무 힘도 작용하지 않으면?
o 점점 느려지다 멈춘다.
o* 같은 속력으로 같은 방향으로 계속 움직인다.
o 점점 빨라진다.
o 원을 그리며 돈다.
:: 알짜힘이 0이면 운동 상태가 변하지 않는다.

= 확인 문제 2
Q 운동 방향과 같은 방향으로 알짜힘이 작용하면?
o* 속력이 빨라진다.
o 속력이 느려진다.
o 운동 방향만 변한다.
o 아무 변화가 없다.
:: 같은 방향이면 빨라지고, 반대 방향이면 느려진다.

= 확인 문제 3
Q 속력은 변하지 않고 운동 방향만 변하는 예는?
o 출발하는 버스
o 떨어지는 공
o* 일정한 빠르기로 도는 대관람차
o 브레이크를 밟은 자동차
:: 알짜힘이 운동 방향과 수직으로 작용하는 경우이다.

= 확인 문제 4
Q 평평한 바닥에서 굴린 공이 점점 느려지다 멈추는 까닭은?
o 공에 작용하는 힘이 없어서
o* 운동 방향과 반대로 마찰력이 작용해서
o 공의 질량이 줄어들어서
o 중력이 운동 방향으로 작용해서
:: 마찰력이 운동 반대 방향의 알짜힘으로 작용한다.

= 서술형 도전 | 생각 넓히기
? 눈 덮인 커브 길에서 자동차가 바깥으로 미끄러지기 쉬운 까닭을 '마찰력'과 '운동 방향'을 넣어 설명하시오. :: 커브를 돌 때는 바퀴와 도로 사이의 마찰력이 운동 방향을 바꾸는 알짜힘 역할을 한다. 눈길에서는 마찰력이 작아 방향을 충분히 바꾸지 못하므로 자동차가 원래 운동 방향(바깥쪽)으로 계속 나아간다.
? 처음의 컬링에서 선수들이 얼음을 빗질하면 스톤이 더 멀리 가는 까닭을 '알짜힘'을 넣어 쓰시오. :: 빗질로 얼음 표면을 매끄럽게 해 마찰력을 줄이면, 운동 반대 방향의 알짜힘이 작아져 속력이 천천히 줄어들므로 더 멀리 간다.

= 오늘 배운 내용 정리
- 운동 상태는 [[속력]]과 [[운동 방향]]으로 나타낸다.
- 알짜힘이 0이면 운동 상태가 [[변하지 않는다]].
- 알짜힘이 운동 방향과 같으면 [[빨라지고]], 반대이면 [[느려진다]].
- 알짜힘이 운동 방향과 수직이면 속력은 일정하고 [[방향]]만 변한다.
- 비스듬히 작용하면 속력과 방향이 [[모두]] 변한다.

= 나가기 전 한 문제 | 형성평가
? 놀이 기구 자이로드롭이 떨어질 때와 바닥 근처에서 멈출 때, 알짜힘의 방향과 속력 변화를 각각 쓰시오. :: 떨어질 때: 알짜힘이 아래(운동 방향과 같음) → 빨라진다. 멈출 때: 제동 장치의 힘이 커져 알짜힘이 위(운동 방향과 반대) → 느려진다.
