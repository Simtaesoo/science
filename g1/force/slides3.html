# 마찰력과 부력 | 움직임을 방해하는 힘, 떠받치는 힘 | 중학교 과학 1 · 05 힘의 작용 · 3차시 | 2022 개정 교육과정 [9과05-02]

= 오늘의 학습 목표 | 3차시
^ **마찰력**의 방향과 크기에 영향을 주는 조건을 설명할 수 있다.
^ **부력**의 방향을 알고 크기를 측정값으로 구할 수 있다.
^ 생활 속에서 마찰력과 부력을 **크게 하거나 작게** 하는 예를 찾을 수 있다.
% 흐름: 생각 열기 5분 → 마찰력 15분 → 부력 12분 → 문항 8분 → 정리 5분

= 빙판길과 수영장 | 생각 열기
* 🧊 빙판길 :: 운동화를 신어도 미끄러진다
* 🏖️ 모래 뿌린 길 :: 같은 운동화인데 덜 미끄럽다
* 🏊 수영장 :: 친구를 물속에서는 쉽게 들어 올린다
? 미끄러짐을 막는 힘과 물속에서 몸을 떠받치는 힘은 무엇일까? :: 접촉면에서 운동을 방해하는 마찰력, 물이 위로 밀어 올리는 부력

## 마찰력 | 움직임을 방해하는 힘

= 마찰력이란?
! 두 물체의 ==접촉면==에서 물체의 운동을 방해하는 힘
- 방향: 물체가 움직이거나 **움직이려는 방향과 반대**
+ 접촉면이 **거칠수록** 크다.
+ 물체의 **무게가 클수록** 크다.
+ 접촉면의 **넓이와는 관계가 거의 없다**.

= 시뮬레이션: 마찰력 | 실험실
@ sim.html#kinds | '마찰력'을 고르고 당기는 힘을 0부터 천천히 늘리며 나무 도막이 움직이기 시작하는 순간의 힘을 측정하자.
% 접촉면(유리·나무·사포) → 도막 개수(1개·2개) 순서로 한 번에 한 조건만 바꾸기

= 실험 결과 | 나무 도막 1개의 무게 6 N
| 조건 | 유리 · 1개 | 나무 · 1개 | 사포 · 1개 | 나무 · 2개 |
|+ 움직이기 시작한 힘 | 약 0.9 N | 약 2.1 N | 약 4.2 N | 약 4.2 N |
>+ 유리 → 나무 → 사포: 접촉면이 ==거칠수록== 마찰력이 크다.
>+ 나무 1개 → 2개: 무게가 2배 → 마찰력도 2.1 → 4.2 N, ==2배==!

= 마찰력 크게, 작게 | 사례
* 👟 운동화 바닥 무늬 :: 크게 — 미끄러지지 않게
* ⛓️ 눈길 체인 :: 크게 — 바퀴가 헛돌지 않게
* 🪜 미끄럼 방지 계단 :: 크게 — 넘어지지 않게
* 🛢️ 기계의 윤활유 :: 작게 — 부품이 잘 돌게
* ⛸️ 스케이트 날 :: 작게 — 얼음 위를 미끄러지듯
* 🎳 볼링 레인 왁스 :: 작게 — 공이 멀리 굴러가게

## 부력 | 위로 밀어 올리는 힘

= 부력이란?
! 액체나 기체가 그 속의 물체를 ==위쪽==으로 밀어 올리는 힘
- 부력의 크기 = **공기 중에서의 무게 − 액체 속에서의 무게**
+ 물체가 액체에 **잠긴 부피**가 클수록 부력이 크다.
>+ 예: 배가 물에 뜬다, 헬륨 풍선이 떠오른다, 구명조끼

= 시뮬레이션: 부력 | 실험실
@ sim.html#kinds | '부력'을 고르고 무게 10 N인 물체를 물에 조금씩 담그며 저울 눈금을 기록하자. 소금물로도 해 보자!

= 부력 측정 결과 | 무게 10 N인 물체
| 잠긴 정도 | 0 % | 50 % | 100 % |
|+ 물에서 저울 눈금 | 10 N | 8 N | 6 N |
|+ 부력 (물) | 0 N | 2 N | 4 N |
|+ 진한 소금물에서 저울 눈금 | 10 N | 7.6 N | 5.2 N |
|+ 부력 (소금물) | 0 N | 2.4 N | 4.8 N |

= 그래프로 보면
C 잠긴 정도와 부력 | 잠긴 정도 (%) | 부력 (N) | 진한 소금물:0,0 50,2.4 100,4.8 | 물:0,0 50,2 100,4
~ 잠긴 부피가 클수록, 액체가 진할수록(밀도가 클수록) 부력이 크다

= 생활 속 부력 | 사례
* 🚢 거대한 배 :: 속이 비어 많이 잠기므로 큰 부력
* 🎈 헬륨 풍선 :: 공기의 부력으로 떠오른다
* 🦺 구명조끼 :: 부피를 키워 부력을 크게
* 🐟 물고기 부레 :: 공기양을 조절해 뜨고 가라앉는다
* 🌊 사해 :: 소금기가 매우 진해 사람이 쉽게 뜬다
* 🎐 열기구 :: 데운 공기로 떠오른다

= 예제 1 · 마찰력의 방향 | 적용
- 상자가 오른쪽으로 미끄러지고 있다. 마찰력의 방향은?
^+ 마찰력 → 운동을 **방해**하는 방향
^+ 운동 방향 → 오른쪽
^+ 마찰력 → **왼쪽** (접촉면을 따라)
>+ 정지한 상자를 오른쪽으로 밀 때도 '움직이려는 방향'의 반대인 왼쪽!

= 예제 2 · 무게와 마찰력 | 적용
- 사포 위의 나무 도막 1개를 움직이려면 4.2 N이 필요했다. 3개를 쌓으면?
^+ 무게 → **3배**
^+ 마찰력도 무게에 비례 → **3배**
^+ 4.2 × 3 = **12.6 N**

= 예제 3 · 부력 구하기 | 적용
- 무게가 15 N인 돌을 용수철저울에 매달아 물에 완전히 넣었더니 눈금이 9 N이었다.
^+ 부력 = 공기 중 무게 − 물속 무게
^+ = 15 − 9 = **6 N**
^+ 방향 → **위쪽**
>+ 돌은 가라앉는다 — 중력 15 N > 부력 6 N

= 확인 문제 1
Q 마찰력에 대한 설명으로 옳지 **않은** 것은?
o 운동을 방해하는 방향으로 작용한다.
o 접촉면이 거칠수록 크다.
o 물체의 무게가 클수록 크다.
o* 접촉면이 넓을수록 매우 커진다.
:: 마찰력은 접촉면의 넓이와 거의 관계가 없다.

= 확인 문제 2
Q 마찰력을 크게 하여 이용하는 예끼리 고른 것은?
o 자전거 체인에 기름 바르기, 스케이트 날
o* 등산화 바닥의 깊은 홈, 빙판길에 모래 뿌리기
o 볼링 레인 왁스, 윤활유
o 수영장 미끄럼틀에 물 흘리기, 스케이트 날
:: 홈과 모래는 접촉면을 거칠게 만든다.

= 확인 문제 3
Q 무게 20 N인 물체를 물에 완전히 넣었더니 저울 눈금이 12 N이었다. 부력은?
o 32 N
o* 8 N
o 12 N
o 20 N
:: 20 − 12 = 8 N, 위쪽

= 확인 문제 4
Q 같은 물체를 물과 진한 소금물에 각각 완전히 담갔을 때에 대한 설명으로 옳은 것은?
o 물에서 부력이 더 크다.
o* 소금물에서 부력이 더 크다.
o 부력은 같다.
o 소금물에서는 부력이 없다.
:: 시뮬레이션에서 물 4 N, 진한 소금물 4.8 N — 소금물에서 저울 눈금이 더 작다.

= 서술형 도전 | 생각 넓히기
? 무거운 쇠로 만든 배가 물에 뜰 수 있는 까닭을 부력과 중력을 이용해 설명하시오. :: 배는 속이 비어 있어 물에 잠기는 부피가 크므로 큰 부력을 받는다. 배의 무게(중력)와 같은 크기의 부력을 받을 만큼 잠기면 두 힘이 평형을 이루어 뜬다.
? 마찰력이 전혀 없는 세상이라면 생활에서 어떤 일이 생길지 두 가지 쓰시오. :: 걸으려 해도 발이 미끄러져 앞으로 나아갈 수 없다. 연필로 글씨를 쓸 수 없고, 매듭이 풀리며, 자동차가 출발하거나 멈출 수 없다.

= 오늘 배운 내용 정리
- 접촉면에서 운동을 방해하는 힘 = [[마찰력]], 운동(하려는) 방향과 [[반대]]
- 마찰력은 접촉면이 [[거칠수록]], 무게가 [[클수록]] 크다.
- 액체나 기체가 물체를 위로 밀어 올리는 힘 = [[부력]]
- 부력 = 공기 중 무게 − [[액체 속 무게]]
- 잠긴 [[부피]]가 클수록 부력이 크다.

= 나가기 전 한 문제 | 형성평가
? 처음 장면에서 빙판길에 모래를 뿌리면 덜 미끄러운 까닭과, 물속에서 친구를 쉽게 들어 올리는 까닭을 각각 쓰시오. :: 모래가 접촉면을 거칠게 하여 마찰력이 커지기 때문이다. 물이 친구를 위로 밀어 올리는 부력이 작용해 들어야 할 힘이 줄어들기 때문이다.
