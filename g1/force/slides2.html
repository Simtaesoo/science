^ **중력**의 방향과 크기를 설명하고 **질량과 무게**를 구별할 수 있다.

= 달에 간 우주인 | 생각 열기
* 🧑‍🚀 지구에서 :: 우주복까지 입으면 걷기도 힘들다
* 🌕 달에서 :: 같은 우주복을 입고 껑충껑충 뛴다
* ⚖️ 저울 :: 달에서 체중계에 올라가면 숫자가 확 줄어든다
? 달에 가면 우주인의 '몸'이 가벼워진 것일까? :: 몸을 이루는 양(질량)은 그대로이고, 달이 당기는 힘(무게)만 약 1/6로 줄었다.

| 질문 | 답 |

## 중력 | 지구가 당기는 힘

= 중력이란?
! 중력 = 지구가 물체를 당기는 힘
- 방향: **지구 중심** 방향 (연직 아래)
+ 크기: 물체의 질량이 클수록 크다.
+ 지구 반대편에서도 물체는 '지구 중심'을 향해 떨어진다.
>+ 물체에 작용하는 중력의 크기를 ==무게==라고 한다.

= 질량과 무게
| | 질량 | 무게 |
|+ 뜻 | 물체가 가진 고유한 양 | 물체에 작용하는 중력의 크기 |
|+ 단위 | kg, g | N |
|+ 측정 도구 | 윗접시저울, 양팔저울 | 용수철저울, 체중계 |
|+ 장소에 따라 | 변하지 않는다 | 달라진다 |

= 지구와 달에서의 무게 | 시뮬레이션에서 쓰는 값
| 장소 | 질량 1 kg의 무게 | 질량 3 kg의 무게 |
|+ 지구 | 9.8 N | 9.8 × 3 = **29.4 N** |
|+ 달 | 1.6 N | 1.6 × 3 = **4.8 N** |
>+ 달의 중력은 지구의 약 ==1/6== (1.6 ÷ 9.8 ≈ 0.16)

= 시뮬레이션: 중력 | 실험실
@ sim.html#kinds | '중력'을 고르고 질량 3 kg인 물체의 무게를 지구와 달에서 측정하자. 양팔저울은 어떻게 될까?
% 양팔저울은 달에서도 균형 — 질량은 그대로임을 보여 주는 장면에서 멈추기

## 탄성력 | 원래대로 돌아가려는 힘

= 탄성력이란?
! 탄성력 = 변형된 물체가 원래 모양으로 ==되돌아가려는== 힘
- 방향: 물체를 변형시킨 힘과 **반대** 방향
+ 크기: 물체를 변형시킨 힘의 크기와 **같다**
+ 용수철을 아래로 당기면 → 탄성력은 **위로**
>+ 예: 트램펄린, 활, 장대높이뛰기, 용수철저울

= 시뮬레이션: 탄성력 | 실험실
@ sim.html#kinds | '탄성력'을 고르고 1 N짜리 추를 1개씩 늘리며 용수철이 늘어난 길이를 기록하자.

= 추의 무게와 늘어난 길이
C 용수철이 늘어난 길이는 추의 무게에 비례 | 추의 무게 (N) | 늘어난 길이 (cm) | 늘어난 길이:0,0 1,2 2,4 3,6 4,8 5,10
~ 1 N마다 2 cm씩 — 무게가 2배, 3배가 되면 늘어난 길이도 2배, 3배

= 용수철저울의 원리
^+ 물체를 매달면 용수철이 늘어난다
^+ 늘어난 길이는 **무게에 비례**한다
^+ 그래서 늘어난 길이에 눈금을 매기면 → 무게를 **N**으로 읽을 수 있다
>+ 정지했을 때 탄성력(위) = 무게(아래) → 힘의 평형!

= 생활 속 중력과 탄성력 | 사례
* 💧 폭포 :: 물이 아래로 떨어진다 — 중력
* 🏀 농구 슛 :: 던진 공이 곡선을 그리며 내려온다 — 중력
* 🤸 트램펄린 :: 눌린 그물이 몸을 튕겨 올린다 — 탄성력
* 🏹 양궁 :: 휜 활이 화살을 밀어낸다 — 탄성력
* 🛏️ 매트리스 :: 용수철이 몸을 떠받친다 — 탄성력
* 🖊️ 볼펜 :: 누른 용수철이 심을 밀어 올린다 — 탄성력

= 예제 1 · 달에서의 질량과 무게 | 적용
- 지구에서 질량이 60 kg인 우주인이 달에 갔다. (1 kg의 무게: 지구 9.8 N, 달 1.6 N)
^+ 지구에서의 무게 = 60 × 9.8 = **588 N**
^+ 달에서의 질량 → 변하지 않는다 → **60 kg**
^+ 달에서의 무게 = 60 × 1.6 = **96 N** (지구의 약 1/6)

= 예제 2 · 용수철 비례 | 적용
- 어떤 용수철에 2 N짜리 추를 매달았더니 3 cm 늘어났다. 6 N이면?
^+ 힘이 6 ÷ 2 = **3배**
^+ 늘어난 길이도 **3배**
^+ 3 × 3 = **9 cm**
>+ 비례 관계는 '몇 배인지'부터 찾으면 쉽다.

= 예제 3 · 무게 거꾸로 구하기 | 적용
- 시뮬레이션의 용수철(1 N에 2 cm)에 어떤 물체를 매달았더니 7 cm 늘어났다.
^+ 2 cm → 1 N이므로 1 cm → **0.5 N**
^+ 7 cm → 7 × 0.5 = **3.5 N**
^+ 지구에서 이 물체의 질량 = 3.5 ÷ 9.8 ≈ **0.36 kg** (약 360 g)

= 확인 문제 1
Q 질량과 무게에 대한 설명으로 옳은 것은?
o 질량은 장소에 따라 달라진다.
o* 무게는 물체에 작용하는 중력의 크기이다.
o 무게의 단위는 kg이다.
o 질량은 용수철저울로 측정한다.
:: 질량(kg)은 변하지 않고 양팔저울로, 무게(N)는 장소에 따라 달라지고 용수철저울로 잰다.

= 확인 문제 2
Q 질량 5 kg인 물체의 지구에서의 무게는? (1 kg의 무게 9.8 N)
o 5 N
o 9.8 N
o* 49 N
o 98 N
:: 5 × 9.8 = 49 N

= 확인 문제 3
Q 탄성력을 이용한 예가 **아닌** 것은?
o 트램펄린
o* 자동차 바퀴의 체인
o 양궁의 활
o 침대 매트리스의 용수철
:: 바퀴의 체인은 눈길에서 마찰력을 크게 하기 위한 것이다.

= 확인 문제 4
Q 용수철을 손으로 오른쪽으로 당기고 있을 때 탄성력의 방향은?
o 오른쪽
o* 왼쪽
o 위쪽
o 아래쪽
:: 탄성력은 변형시킨 힘과 반대 방향으로 작용한다.

= 서술형 도전 | 생각 넓히기
? 사과가 나무에서 떨어지는 방향과 지구 반대편 나라에서 사과가 떨어지는 방향을 비교하여 설명하시오. :: 두 곳 모두 지구 중심을 향해 떨어진다. 중력의 방향이 지구 중심 방향이기 때문이다.
? 우주 정거장에서는 체중계로 몸무게를 잴 수 없어 용수철에 매달린 의자를 흔들어 질량을 잰다. 체중계를 쓸 수 없는 까닭을 '무게'와 '질량'을 구별하여 쓰시오. :: 우주 정거장에서도 지구의 중력(무게)은 작용하지만, 사람과 체중계가 함께 지구 쪽으로 떨어지며 돌고 있어 사람이 체중계를 누르지 못한다. 그래서 체중계 눈금이 0을 가리킨다. 질량은 어디서나 그대로이므로 용수철의 흔들림으로 잴 수 있다.
% 오개념 주의: '우주 정거장에는 중력이 없다'가 아니다. 정거장 높이(약 400 km)에서도 중력은 지표의 약 90 %이다. 체중계 눈금이 0인 것은 함께 떨어지기 때문이다.

= 오늘 배운 내용 정리
- 지구가 물체를 당기는 힘 = [[중력]], 방향은 [[지구 중심]] 방향
- 물체에 작용하는 중력의 크기 = [[무게]] (단위 N), 고유한 양 = [[질량]] (단위 kg)
- 달에서 무게는 지구의 약 [[1/6]], 질량은 [[변하지 않는다]].
- 변형된 물체가 되돌아가려는 힘 = [[탄성력]], 변형시킨 힘과 [[반대]] 방향
- 용수철이 늘어난 길이는 작용한 힘에 [[비례]]한다.

= 나가기 전 한 문제 | 형성평가
? 지구에서 2 kg인 물체를 달에 가져갔다. 달에서의 질량과 무게를 쓰시오. (1 kg의 무게: 달 1.6 N) :: 질량 2 kg (변하지 않음), 무게 2 × 1.6 = 3.2 N
