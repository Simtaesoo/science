## 비열 | 천천히 데워지고 천천히 식는 물질

= 비열이란?
! 어떤 물질 1 g의 온도를 1 °C 높이는 데 필요한 열의 양
- 물질의 종류에 따라 **다르다** → 물질의 특성
+ 비열이 **큰** 물질 → 같은 열을 받아도 온도가 **천천히** 변한다
+ 비열이 **작은** 물질 → 온도가 **빠르게** 변한다
>+ 비열이 큰 물질은 ==천천히 데워지고 천천히 식는다==.

= 물질별 비열 비교 | 시뮬레이션에서 쓰는 값
| 물질 | 비열 (J/(g·°C)) | 온도 변화 |
|+ 물 | 4.2 | 가장 느리다 |
|+ 식용유 | 2.0 | 물보다 빠르다 |
|+ 모래 | 0.8 | 빠르다 |
|+ 철 | 0.45 | 매우 빠르다 |
>+ 물은 비열이 매우 크다 — 물 > 식용유 > 모래 > 철
% 단위는 '1 g을 1 °C 올리는 데 드는 열(J)'이라는 뜻만 짚기

= 시뮬레이션: 물과 식용유 가열 | 실험실
@ sim.html#cap | 질량이 같은 물과 식용유를 같은 세기로 가열하며 10초마다 온도를 기록하자. 가열을 끄고 식는 빠르기도 비교!
% '비열' 탭이 기본. 기록 후 열팽창 탭은 뒤에서 사용

= 실험 결과 | 같은 질량, 같은 세기로 가열
| 시간 (초) | 0 | 10 | 20 | 30 |
|+ 물 (°C) | 20 | 34 | 49 | 63 |
|+ 식용유 (°C) | 20 | 50 | 80 | 110 |
>+ 10초마다 물은 약 **14 °C**, 식용유는 **30 °C** 오른다 → 식용유가 약 2배 빠르다.
~ 같은 열을 받아도 식용유의 온도가 더 빨리 오른다 → 식용유의 비열이 물보다 작다
% 2022 개정 [9과03-03]: 비열은 계산식(Q = cmΔT) 없이, 물질마다 온도 변화의 빠르기가 다르다는 수준에서 다룬다.

= 그래프로 보면
C 가열 시간과 온도 | 가열 시간 (초) | 온도 (°C) | 식용유:0,20 10,50 20,80 30,110 | 물:0,20 10,34.3 20,48.6 30,62.9
~ 기울기가 클수록 온도가 빠르게 오른다 → 비열이 작다

= 비열과 생활 | 사례
* 🌬️ 해풍과 육풍 :: 낮에는 육지가 빨리 데워져 바다 → 육지로 바람
* 🏝️ 해안 지역 :: 내륙보다 하루 기온 차가 작다
* 🫖 찜질팩 :: 비열이 큰 물을 넣어 오래 따뜻하다
* 🚗 자동차 냉각수 :: 비열이 큰 물로 엔진의 열을 흡수
* 🍳 프라이팬 :: 비열이 작은 금속이라 빨리 달궈진다
* 🏜️ 사막 :: 모래·바위뿐이라 낮엔 뜨겁고 밤엔 춥다

## 열팽창 | 입자 사이가 멀어진다

= 열팽창이란?
! 물체가 열을 받아 길이나 부피가 늘어나는 현상
- 입자 모형: 온도가 높아지면 입자 운동이 활발해져 ==입자 사이의 거리==가 멀어진다.
+ 입자의 **크기나 개수**가 늘어나는 것이 아니다!
+ 열팽창 정도도 물질마다 다르다: **알루미늄 > 구리 > 철 > 유리**

= 1 m 막대를 20 °C → 100 °C로 | 시뮬레이션의 열팽창 값
C 온도와 늘어난 길이 (1 m 막대) | 온도 (°C) | 늘어난 길이 (mm) | 알루미늄:20,0 60,0.92 100,1.84 | 구리:20,0 60,0.68 100,1.36 | 철:20,0 60,0.48 100,0.96 | 유리:20,0 60,0.36 100,0.72
~ 80 °C 올리면 알루미늄 1.84 mm, 철 0.96 mm — 작지만 긴 다리·철로에서는 큰 차이

= 바이메탈
! 열팽창 정도가 다른 두 금속을 붙인 것
- 가열하면 **많이 늘어나는 금속 쪽이 바깥쪽**이 되도록 휜다.
+ 위: 알루미늄, 아래: 철 → 가열하면 알루미늄이 더 늘어나 **아래로** 휜다.
>+ 다리미, 화재경보기, 전기 주전자의 온도 조절에 쓰인다.

= 열팽창을 고려하거나 이용한 예 | 사례
* 🛤️ 철로 이음매 :: 여름에 늘어날 틈을 둔다
* 🌉 다리의 신축 이음 :: 다리 끝의 톱니 모양 틈
* ⚡ 여름 전깃줄 :: 겨울에 줄어들 것을 대비해 느슨하게
* 🫙 유리병 금속 뚜껑 :: 뜨거운 물에 담그면 뚜껑이 더 늘어나 잘 열린다
* 🌡️ 알코올 온도계 :: 액체의 열팽창으로 온도를 잰다
* 🦷 충치 치료 재료 :: 이와 열팽창 정도가 비슷한 물질 사용

= 예제 1 · 모래와 물 | 적용
- 같은 질량의 모래와 물이 같은 양의 열을 받았다. 어느 쪽 온도가 더 많이 오를까?
^+ 비열 → 물이 모래보다 **크다**
^+ 같은 열을 받으면 비열이 **작은** 물질의 온도가 더 많이 변한다
^+ **모래**의 온도가 더 많이 오른다
>+ 한낮 모래사장이 뜨겁고 바닷물이 미지근한 까닭!

= 예제 2 · 철로의 틈 | 적용
- 철 레일 이음매의 틈은 겨울과 한여름 중 언제 더 좁아질까?
^+ 한여름 → 온도가 높아 입자 운동이 **활발**해진다
^+ 입자 사이의 거리가 멀어져 레일이 **늘어난다** → 틈이 **좁아진다**
^+ 이음매에 틈이 없다면 → 레일이 서로 밀어 **휘어진다**
>+ 그래서 레일 이음매에 여름에 늘어날 만큼 틈을 둔다.

= 예제 3 · 해풍과 육풍 | 적용
^+ 낮: 비열이 작은 **육지**가 빨리 데워진다
^+ 육지 위 공기가 데워져 **위로** 올라간다 → 바다의 공기가 그 자리로 이동
^+ 낮에는 바다 → 육지로 부는 **해풍**, 밤에는 반대로 **육풍**
>+ 비열의 차이가 대류를 만든다!

= 확인 문제 1
Q 비열에 대한 설명으로 옳은 것은?
o 모든 물질의 비열은 같다.
o* 비열이 큰 물질은 천천히 데워지고 천천히 식는다.
o 비열이 작은 물질은 온도가 천천히 변한다.
o 비열은 물질의 양에 따라 달라진다.
:: 비열은 물질의 종류에 따라 다른 특성이고, 클수록 온도가 천천히 변한다.

= 확인 문제 2
Q 물, 식용유, 모래, 철 중 비열이 가장 큰 것은?
o* 물
o 식용유
o 모래
o 철
:: 물 4.2 > 식용유 2.0 > 모래 0.8 > 철 0.45

= 확인 문제 3
Q 철로의 레일 이음매 사이에 틈을 두는 까닭은?
o 겨울에 레일이 늘어나 휘는 것을 막기 위해
o* 여름에 레일이 열팽창하여 휘는 것을 막기 위해
o 기차 바퀴와 레일 사이의 전도를 막기 위해
o 레일의 비열을 크게 하기 위해
:: 여름에 온도가 올라가면 레일이 늘어나므로 그만큼 틈을 둔다.

= 확인 문제 4
Q 위는 알루미늄, 아래는 철인 바이메탈을 가열하면?
o 위로 휜다
o* 아래로 휜다
o 휘지 않는다
o 길이가 줄어든다
:: 더 많이 늘어나는 알루미늄이 바깥쪽이 되도록 → 아래로 휜다.

= 서술형 도전 | 생각 넓히기
? 같은 세기의 햇빛을 받은 한낮에 모래사장은 뜨겁고 바닷물은 미지근하다. 그 까닭을 '비열'을 넣어 쓰시오. :: 물은 모래보다 비열이 커서 같은 열을 받아도 온도가 천천히 오르기 때문이다.
? 충치를 메우는 재료가 이와 열팽창 정도가 크게 다르면 어떤 문제가 생길지 설명하시오. :: 뜨겁거나 찬 음식을 먹을 때 이와 재료가 늘어나고 줄어드는 정도가 달라 틈이 생기거나 금이 가서 재료가 빠지거나 이가 손상될 수 있다.

= 오늘 배운 내용 정리
- 물질 1 g의 온도를 1 °C 높이는 데 필요한 열의 양 = [[비열]]
- 비열이 큰 물질은 [[천천히]] 데워지고 천천히 식는다. 물은 비열이 매우 [[크다]].
- 열을 받아 길이나 부피가 늘어나는 현상 = [[열팽창]]
- 열팽창 → 입자 사이의 [[거리]]가 멀어진다.
- 열팽창 정도가 다른 두 금속을 붙인 것 = [[바이메탈]]

= 나가기 전 한 문제 | 형성평가
? 해안 지역이 내륙 지역보다 하루 기온 차가 작은 까닭을 '비열'을 넣어 쓰시오. :: 비열이 큰 바닷물이 낮에는 천천히 데워지고 밤에는 천천히 식어, 주변 공기의 온도 변화를 줄여 주기 때문이다.
