# 온도와 열평형 | 뜨거운 것과 차가운 것이 만나면 | 중학교 과학 1 · 03 열 · 1차시 | 2022 개정 교육과정 [9과03-01]

= 오늘의 학습 목표 | 1차시
^ **온도**를 입자 운동으로 설명할 수 있다.
^ **열**이 온도가 높은 곳에서 낮은 곳으로 이동함을 설명할 수 있다.
^ **열평형** 과정을 그래프와 입자 모형으로 해석할 수 있다.
% 흐름: 생각 열기 5분 → 온도와 열 10분 → 열평형·시뮬레이션 15분 → 문항 10분 → 정리 5분

= 수박을 계곡물에 담가 두면? | 생각 열기
* 🍉 수박 :: 햇볕에 데워져 미지근하다
* 🏞️ 계곡물 :: 차갑다
* ⏳ 한참 뒤 :: 수박이 시원해졌다!
? 수박의 '따뜻함'은 어디로 갔을까? 계곡물은 더 따뜻해졌을까? :: 수박에서 계곡물로 열이 이동했다. 계곡물은 아주 많아서 온도가 거의 오르지 않는다.
% '차가움이 수박으로 들어갔다'는 오개념이 나오면 표시해 두었다가 열의 방향에서 바로잡기

= 초등학교에서 배운 것 | 복습
| 배운 내용 | 기억해 볼 점 |
| 온도계 | 물체의 차갑고 뜨거운 정도를 잰다 |
| 단위 | °C (섭씨도) |
| 뜨거운 물 + 찬물 | 시간이 지나면 미지근해진다 |
? 물체를 이루는 아주 작은 알갱이를 무엇이라고 할까? :: 입자 — 오늘은 입자의 움직임으로 온도를 설명한다.

## 온도와 열 | 입자의 움직임으로 보기

= 온도란?
! 물체의 차갑고 뜨거운 정도를 숫자로 나타낸 것
- 입자의 관점: ==입자 운동이 활발한 정도==
+ 온도가 높다 → 입자가 **활발하게** 움직인다
+ 온도가 낮다 → 입자가 **둔하게** 움직인다
>+ 단위: **°C** (섭씨도), **K** (켈빈) — 0 °C = 273 K
% K는 소개 수준. 0 °C = 273 K, 100 °C = 373 K 정도만

= 열이란?
! 열 = 온도가 높은 물체에서 낮은 물체로 이동하는 에너지
- 열은 언제나 **높은 온도 → 낮은 온도**로 이동한다.
+ '차가움'이 이동하는 것이 아니다!
+ 얼음을 쥐면 손이 차가운 까닭 → 손의 열이 얼음으로 **빠져나가서**
>+ 열을 얻으면 입자 운동이 ==활발해지고==, 열을 잃으면 ==둔해진다==.

= 입자 모형으로 보면
| | 온도가 낮은 물체 | 온도가 높은 물체 |
| 입자의 움직임 | 작게 흔들림 | 크게 흔들림 |
| 입자 운동 | 둔하다 | 활발하다 |
>+ 두 물체가 닿으면 활발한 입자가 둔한 입자를 '흔들어' 운동을 전해 준다 → 이것이 **열의 이동**

## 열평형 | 온도가 같아질 때까지

= 열평형이란?
! 온도가 다른 두 물체가 닿아 온도가 ==같아진== 상태
^+ 뜨거운 물체 → 열을 **잃는다** → 온도가 내려간다
^+ 차가운 물체 → 열을 **얻는다** → 온도가 올라간다
^+ 두 온도가 같아지면 → 열이 더 이상 한쪽으로 이동하지 않아 **온도 변화가 멈춘다**

= 시뮬레이션: 열평형 | 실험실
@ sim.html#eq | A(90 °C)와 B(10 °C)를 맞닿게 하고 온도 변화를 관찰하자. 이어서 B의 양을 3배로 바꾸어 다시!
% B의 양을 바꾸기 전에 '열평형 온도가 50 °C보다 높을까, 낮을까?' 예측 받기

= 시간-온도 그래프 | A 90 °C, B 10 °C, 양이 같을 때
C 두 그래프가 만나는 온도가 열평형 온도 | 시간 (초) | 온도 (°C) | A (뜨거운 물):0,90 5,66.3 10,56.6 15,52.7 20,51.1 30,50.2 | B (찬물):0,10 5,33.7 10,43.4 15,47.3 20,48.9 30,49.8
~ 처음에는 빨리 변하고, 온도 차가 줄수록 천천히 변한다

= 양이 다르면? | A 90 °C · B 10 °C
| B의 양 | 열평형 온도 | A의 온도 변화 | B의 온도 변화 |
|+ A와 같게 | 약 50 °C | 40 °C 내림 | 40 °C 오름 |
|+ A의 3배 | 약 30 °C | 60 °C 내림 | 20 °C 오름 |
>+ 열평형 온도는 처음 두 온도 ==사이==에 있고, 양이 많은 쪽의 처음 온도에 ==더 가깝다==.

= 생활 속 열평형 | 사례
* 🌡️ 체온계 :: 겨드랑이에 넣고 기다려야 체온과 같아진다
* 🍉 계곡물 수박 :: 수박의 열이 물로 이동
* 🧊 냉장고 :: 음식의 열이 차가운 냉장고 안 공기로
* 🥄 국 속 숟가락 :: 국의 열이 숟가락으로 → 숟가락이 뜨거워짐
* 🍼 분유 식히기 :: 젖병을 찬물에 담근다
* 🐟 생선 보관 :: 얼음 위에 올려 신선하게

= 예제 1 · 열평형 온도 구하기 | 같은 물질일 때
- 90 °C 물 100 g과 10 °C 물 300 g을 섞었다. (열은 밖으로 빠져나가지 않음)
^+ 같은 물질이면 → 뜨거운 물이 잃은 열 = 찬물이 얻은 열
^+ 100 × (90 − T) = 300 × (T − 10) → 9000 − 100T = 300T − 3000
^+ 400T = 12000 → **T = 30 °C**
>+ 양이 3배인 찬물은 20 °C만 오르고, 뜨거운 물은 60 °C 내려갔다.
% 중1 수준에서는 '같은 물질일 때'에 한해 양 × 온도 변화가 같다는 아이디어로만 다룸

= 예제 2 · 그래프 읽기 | 적용
- 뜨거운 물이 든 컵을 찬물이 든 수조에 넣었다. 그래프 (가)는 내려가고 (나)는 올라가다 시각 t에서 만났다.
^+ 뜨거운 물 → 온도가 내려가는 **(가)**
^+ 열평형에 도달한 시각 → 두 그래프가 만나는 **t**
^+ t 이후 → 두 물의 온도가 같아 **변하지 않는다**

= 예제 3 · 입자 운동의 변화 | 적용
- 뜨거운 국에 차가운 금속 숟가락을 담가 두었다.
^+ 열의 이동 방향 → **국 → 숟가락**
^+ 숟가락 → 열을 얻어 입자 운동이 **활발해진다**
^+ 국 → 열을 잃어 입자 운동이 **둔해진다**
>+ 두 온도가 같아지면 더 변하지 않는다 — 열평형!

= 확인 문제 1
Q 온도를 입자의 관점에서 바르게 설명한 것은?
o 입자의 크기
o 입자의 개수
o* 입자 운동이 활발한 정도
o 입자의 색깔
:: 온도가 높을수록 입자의 운동이 활발하다.

= 확인 문제 2
Q 열평형을 이용한 예가 **아닌** 것은?
o 수박을 차가운 계곡물에 담가 시원하게 한다.
o 체온계를 겨드랑이에 넣고 잠시 기다린다.
o 냉장고에 음식을 넣어 차갑게 보관한다.
o* 겨울철 손을 비벼 따뜻하게 한다.
:: 손을 비비는 것은 마찰로 열이 생기는 경우로, 두 물체의 온도가 같아지는 열평형과 관계없다.

= 확인 문제 3
Q 80 °C 물 200 g과 20 °C 물 200 g을 섞었을 때 열평형 온도는? (열 손실 없음)
o 40 °C
o* 50 °C
o 60 °C
o 100 °C
:: 양이 같으므로 두 온도의 한가운데: (80 + 20) ÷ 2 = 50 °C

= 확인 문제 4
Q 얼음을 손에 쥐었을 때 손이 차가워지는 까닭은?
o 얼음의 차가움이 손으로 이동하기 때문
o* 손의 열이 얼음으로 이동하기 때문
o 얼음의 입자 운동이 더 활발하기 때문
o 손과 얼음 사이에 열이 이동하지 않기 때문
:: 열은 온도가 높은 손에서 낮은 얼음으로 이동한다.

= 서술형 도전 | 생각 넓히기
? 체온계를 몸에 대자마자 숫자를 읽으면 실제 체온보다 낮게 나온다. 열평형과 관련지어 체온을 정확히 재는 방법을 설명하시오. :: 몸과 체온계 사이에 열이 이동해 둘의 온도가 같아질(열평형) 때까지 기다린 뒤 읽어야 한다. 그때 체온계의 온도가 체온과 같다.
? 70 °C 물 100 g을 10 °C 물에 섞었더니 열평형 온도가 30 °C였다. 찬물은 몇 g이었을까? (열 손실 없음) :: 뜨거운 물이 40 °C 내려갔고 찬물은 20 °C 올라갔다. 100 × 40 = m × 20 → m = 200 g

= 오늘 배운 내용 정리
- 온도는 입자 운동이 [[활발한 정도]]를 나타낸다.
- 열은 온도가 [[높은]] 물체에서 [[낮은]] 물체로 이동한다.
- 열을 얻으면 입자 운동이 [[활발해지고]], 잃으면 둔해진다.
- 두 물체의 온도가 같아져 더 변하지 않는 상태 = [[열평형]]
- 열평형 온도는 양이 [[많은]] 쪽의 처음 온도에 더 가깝다.

= 나가기 전 한 문제 | 형성평가
? 처음의 계곡물 수박에서, 열의 이동 방향과 수박·계곡물의 입자 운동 변화를 한 문장으로 쓰시오. :: 열이 수박에서 계곡물로 이동하여 수박의 입자 운동은 둔해지고(온도 하강) 계곡물의 입자 운동은 활발해진다(온도 조금 상승).
