# 열의 이동 | 전도 · 대류 · 복사 | 중학교 과학 1 · 03 열 · 2차시 | 2022 개정 교육과정 [9과03-02]

= 오늘의 학습 목표 | 2차시
^ 열의 세 가지 이동 방식 **전도·대류·복사**를 구별할 수 있다.
^ 각 방식을 **입자 모형이나 비유**로 표현할 수 있다.
^ 생활 속 **단열**의 원리를 열의 이동 방식으로 설명할 수 있다.
% 흐름: 생각 열기 5분 → 전도·대류·복사 15분 → 시뮬레이션 8분 → 문항 10분 → 단열 하우스 7분

= 캠핑장의 세 가지 따뜻함 | 생각 열기
* 🍳 프라이팬 손잡이 :: 불에서 멀리 있는데도 뜨거워진다
* 🍲 냄비 속 물 :: 아래만 데우는데 위까지 골고루 뜨거워진다
* 🔥 모닥불 앞 :: 닿지 않았는데 얼굴이 뜨겁다
? 세 경우 모두 열이 이동했다. 이동하는 방법도 같을까? :: 다르다. 손잡이는 전도, 냄비 물은 대류, 모닥불은 복사로 열이 이동한다.

= 지난 시간 복습 | 1차시
? 열은 어느 방향으로 이동할까? :: 온도가 높은 물체 → 낮은 물체
? 열을 얻은 물체의 입자 운동은? :: 활발해진다
| A 90 °C, B 10 °C (양이 같음) | 열평형 온도 [[약 50 °C]] |

## 세 가지 열의 이동 | 전하고, 옮기고, 날아가고

= 전도
! 이웃한 입자로 입자의 운동이 ==차례로 전달==되어 열이 이동
- 주로 **고체**에서 일어난다.
+ 입자는 제자리에서 흔들리며 옆 입자에 운동을 전한다.
+ 금속은 전도가 빠르고, 나무·유리·공기는 전도가 느리다.
>+ 예: 뜨거운 국에 담근 숟가락이 뜨거워진다.

= 대류
! 데워진 입자가 ==직접 이동==하며 열을 옮김
- **액체나 기체**에서 일어난다.
+ 데워진 물·공기는 위로 올라가고, 차가운 것은 아래로 내려온다.
+ 이 흐름이 반복되며 전체가 골고루 데워진다.
>+ 예: 주전자의 물이 골고루 데워진다, 난로를 켜면 방 전체가 따뜻해진다.

= 복사
! 물질의 도움 없이 열이 ==직접== 전달
- 입자가 없는 **우주 공간**에서도 일어난다.
+ 검은색 물체는 복사열을 잘 흡수하고, 흰색·은색은 잘 반사한다.
+ 열을 내는 물체에 가까울수록 더 많이 받는다.
>+ 예: 태양열이 우주를 지나 지구에 온다, 난로 앞이 따뜻하다.

= 한눈에 비교
| 방식 | 일어나는 곳 | 입자는? | 예 |
|+ 전도 | 주로 고체 | 제자리에서 운동을 **전달** | 숟가락, 프라이팬 손잡이 |
|+ 대류 | 액체·기체 | 직접 **이동** | 주전자 물, 방 공기 |
|+ 복사 | 물질 없이도 | 필요 **없음** | 햇빛, 모닥불 |

= 비유로 표현하기 | 교실 앞의 공을 뒤로 보내는 방법
* 🤝 (가) 옆 친구에게 차례로 건넨다 :: → 전도
* 🚶 (나) 공을 든 친구가 직접 걸어간다 :: → 대류
* 🏀 (다) 공을 던져 바로 보낸다 :: → 복사
- 나만의 비유를 하나 만들어 보자!
% 모둠 활동: 몸으로 세 방식을 표현해 보는 30초 연극

## 실험으로 확인하기 | 막대 · 물 · 캔

= 시뮬레이션: 열의 이동 | 실험실
@ sim.html#move | [전도] 촛농이 떨어지는 순서 · [대류] 가열 위치에 따른 물의 움직임 · [복사] 캔 색깔에 따른 온도 변화
% 교육과정 탐구 활동: 열화상 카메라(또는 스마트폰 열화상 앱)로 여러 금속 막대의 전도를 비교하는 실제 활동을 시뮬레이션과 함께 하면 좋다 — 디지털 탐구 도구 활용
% 세 실험을 모둠별로 나누어 맡고 결과를 공유하면 시간 절약

= 실험 결과 정리
| 실험 | 결과 |
|+ 전도 | 촛농이 빨리 떨어진 순서: **구리 > 알루미늄 > 철 > 유리** |
|+ 대류 (아래 가열) | 데워진 물이 **위로**, 차가운 물이 **아래로** → 순환 |
|+ 대류 (위 가열) | 물이 거의 움직이지 않아 아래쪽이 잘 데워지지 않음 |
|+ 복사 | **검은색** 캔이 더 빨리 데워짐, 전등에 **가까울수록** 빨리 |

= 단열 | 열의 이동을 막는다
! 단열 = 열의 이동을 막는 것
| 보온병의 구조 | 막는 열의 이동 |
|+ 마개 | 대류 (공기의 이동) |
|+ 두 벽 사이의 진공 | 전도와 대류 |
|+ 은도금한 벽 | 복사 |
>+ 전도·대류·복사를 ==모두== 줄여야 효과적인 단열!

= 생활 속 열의 이동 | 사례
* 🔥 난로는 아래, 에어컨은 위 :: 대류를 이용해 방 전체를 데우거나 식힌다
* 🍳 나무 손잡이 :: 전도가 느린 물질로 손을 보호
* 🚗 햇볕 속 자동차 :: 복사로 차 안이 뜨거워진다
* 🌊 해풍과 육풍 :: 바닷가 공기의 대류
* 🪟 이중창 :: 공기층이 전도를 줄인다
* 🧥 오리털 점퍼 :: 털 사이 공기가 열의 이동을 막는다

= 예제 1 · 사례 분류하기 | 적용
- ㄱ. 난로는 방 아래쪽에 둔다 ㄴ. 프라이팬 손잡이를 나무로 만든다 ㄷ. 햇볕 받은 자동차 안이 뜨겁다 ㄹ. 바닷가에서 낮과 밤에 바람 방향이 바뀐다 ㅁ. 숯불 앞에서 고기를 굽는다 ㅂ. 뜨거운 냄비를 맨손으로 잡으면 뜨겁다
^+ 고체를 통해 전달 → 전도: **ㄴ, ㅂ**
^+ 공기·물이 직접 이동 → 대류: **ㄱ, ㄹ**
^+ 닿지 않고 직접 → 복사: **ㄷ, ㅁ**

= 예제 2 · 난방기와 냉방기의 위치 | 적용
- 난로는 아래에, 에어컨은 위에 두는 까닭을 설명해 보자.
^+ 난로 → 데워진 공기는 **위로** 올라가고 찬 공기가 내려와 다시 데워진다
^+ 에어컨 → 차가운 공기는 **아래로** 내려가고 따뜻한 공기가 올라와 다시 식는다
^+ 둘 다 → 방 전체에 **대류**가 일어나 골고루 바뀐다
>+ 반대로 두면 대류가 잘 일어나지 않아 방의 한쪽만 따뜻하거나 시원하다.

= 예제 3 · 어떤 컵이 오래 따뜻할까? | 적용
| 컵 | 재질 | 뚜껑 | 겉 색 |
| A | 금속 한 겹 | 없음 | 검은색 |
| B | 이중벽(사이 진공) | 있음 | 은색 |
^+ 전도 → B는 진공이라 전도가 거의 없다
^+ 대류 → B는 뚜껑이 있어 김(공기)이 빠져나가지 않는다
^+ 복사 → B는 은색이라 열을 덜 내보낸다
!+ B가 오래 따뜻하다 — 세 가지를 모두 막았다

= 확인 문제 1
Q 입자가 직접 이동하며 열을 옮기는 방식은?
o 전도
o* 대류
o 복사
o 열평형
:: 대류는 액체나 기체에서 데워진 입자가 직접 이동한다.

= 확인 문제 2
Q 태양의 열이 우주 공간을 지나 지구에 전달되는 방식은?
o 전도
o 대류
o* 복사
o 증발
:: 우주 공간에는 열을 전할 물질이 거의 없으므로 복사로 전달된다.

= 확인 문제 3
Q 네 막대 끝을 가열했을 때 촛농이 가장 먼저 떨어지는 막대는?
o* 구리
o 알루미늄
o 철
o 유리
:: 전도가 빠른 순서는 구리 > 알루미늄 > 철 > 유리이다.

= 확인 문제 4
Q 보온병의 은도금한 벽이 주로 막는 열의 이동은?
o 전도
o 대류
o* 복사
o 전도와 대류
:: 은색 면은 복사열을 반사한다. 진공은 전도와 대류를, 마개는 대류를 막는다.

= 서술형 도전 | 생각 넓히기
? 이중창은 유리 두 장 사이에 공기층을 둔다. 공기층이 열의 이동을 줄이는 까닭을 쓰고, 공기층을 너무 두껍게 하면 생길 수 있는 문제를 쓰시오. :: 공기는 전도가 잘 일어나지 않아 열의 전도를 줄인다. 너무 두꺼우면 공기층 안에서 공기가 순환하는 대류가 일어나 오히려 열이 잘 이동할 수 있다.
? 냄비로 물을 끓일 때 불을 냄비 아래에서 가열하는 까닭을 열의 이동 방식으로 설명하시오. :: 아래의 데워진 물이 위로 올라가고 차가운 물이 내려오는 대류가 일어나 물 전체가 골고루 데워지기 때문이다.
