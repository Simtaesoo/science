# 과학적 탐구 방법 | 한 번에 한 가지만 바꿔라 | 중학교 과학 1 · 01 과학과 인류의 지속가능한 삶 · 1차시 | 2022 개정 교육과정 [9과01-01]

= 오늘의 학습 목표 | 1차시
^ 과학적 탐구 과정의 **단계**를 순서대로 말할 수 있다.
^ 실험에서 **조작 변인·통제 변인·종속 변인**을 구별할 수 있다.
^ 일상의 문제를 **변인 통제**를 이용한 탐구로 설계할 수 있다.
% 흐름: 생각 열기 5분 → 탐구 과정 10분 → 변인 통제·시뮬레이션 15분 → 문항 10분 → 탐구 계획 5분

= 어떤 라면이 더 빨리 익을까? | 생각 열기
* 🍜 형의 방법 :: 센 불, 물 500 mL, 면을 쪼개서 넣음
* 🍜 나의 방법 :: 약한 불, 물 550 mL, 면을 통째로 넣음
* ⏱️ 결과 :: 형의 라면이 2분 빨리 익었다
? "센 불이 더 빠르다"고 결론 내릴 수 있을까? :: 없다. 불 세기·물의 양·면 모양이 **동시에** 달라서 무엇 때문에 빨라졌는지 알 수 없다.
% 학생들이 '불 때문'이라고 답하면 '면을 쪼갠 건 상관없을까?'로 되묻기

= 초등학교에서 배운 탐구 | 복습
| 탐구 기능 | 하는 일 | 예 |
| 관찰 | 감각이나 도구로 특징을 알아냄 | 돋보기로 잎 보기 |
| 측정 | 도구로 양을 재어 수로 나타냄 | 초시계로 시간 재기 |
| 분류 | 기준을 정해 무리 짓기 | 뜨는 것·가라앉는 것 |
| 추리 | 관찰·경험으로 설명하기 | 발자국으로 동물 짐작 |
? 오늘 배울 '탐구'가 이것들과 다른 점은? :: 관찰·측정을 **계획에 따라 묶어** 하나의 질문에 답하는 과정이라는 점

## 과학적 탐구 과정 | 질문에서 결론까지

= 탐구는 이렇게 진행된다
^+ **문제 인식** — 궁금한 점을 탐구할 수 있는 질문으로 만든다
^+ **가설 설정** — 질문에 대한 잠정적인 답을 세운다
^+ **탐구 설계** — 무엇을 바꾸고, 무엇을 같게 하고, 무엇을 잴지 정한다
^+ **탐구 수행** — 계획대로 실험하고 측정한다
^+ **자료 해석** — 표·그래프로 정리해 규칙을 찾는다
^+ **결론 도출** — 가설이 맞는지 판단한다. 틀리면 가설을 고쳐 다시!
% 결론이 가설과 다르다고 실패가 아님을 강조 — 과학은 고쳐 가며 발전

= 가설이란?
! 가설 = 탐구 문제에 대한 잠정적인 답
- 실험으로 **확인할 수 있어야** 한다.
- "~할수록 ~할 것이다" 꼴로 쓰면 무엇을 바꾸고 잴지 분명해진다.
>+ 예: ==실이 길수록 진자가 천천히 왕복할 것이다.==
? 좋은 가설일까? "진자는 신기하게 움직일 것이다." :: 아니다. '신기하게'는 측정할 수 없어 실험으로 확인할 수 없다.

## 변인 통제 | 확인하려는 것만 다르게

= 변인의 세 종류
| 변인 | 뜻 | 진자 실험에서 |
|+ 조작 변인 | 일부러 **바꾸는** 조건 | 실의 길이 |
|+ 통제 변인 | **같게** 유지하는 조건 | 추의 질량, 처음 각도 |
|+ 종속 변인 | **측정하는** 결과 | 10번 왕복하는 시간 |
>+ **변인 통제**: 확인하려는 조건 하나만 다르게 하고 나머지는 모두 같게 하는 것
% '조작 = 내가 손대는 것, 종속 = 그에 따라 달라지는 것'으로 기억시키기

= 왜 10번 왕복 시간을 잴까?
- 한 번 왕복은 약 1초 — 초시계를 누르는 반응 시간 오차가 크다.
+ 10번 왕복 시간을 재고 10으로 나누면 오차가 **1/10**로 줄어든다.
+ 같은 조건으로 **여러 번 측정해 평균**을 내면 더 믿을 만하다.
>+ 정확한 측정도 과학적 탐구의 중요한 부분!

= 시뮬레이션으로 탐구하기 | 실험실
@ sim.html#inq | 실 길이·추 질량·처음 각도 중 하나만 바꾸며 10번 왕복 시간을 기록해 보자.
% 모둠마다 조작 변인을 다르게 배정(길이/질량/각도) → 결과를 칠판에 모아 비교

= 진자 실험 결과 | 추 질량·처음 각도는 같게
| 실 길이 (cm) | 20 | 40 | 60 | 80 |
|+ 10번 왕복 (초) | 약 9.0 | 약 12.7 | 약 15.5 | 약 18.0 |
|+ 한 번 왕복 (초) | 약 0.90 | 약 1.27 | 약 1.55 | 약 1.80 |
>+ 실이 길수록 왕복 시간이 길다 → 가설이 **맞았다**!
~ 길이 20 cm → 80 cm(4배)일 때 시간 9.0 초 → 18.0 초(2배)

= 그래프로 정리하기 | 자료 해석
C 실 길이와 10번 왕복 시간 | 실의 길이 (cm) | 10번 왕복 시간 (초) | 실 길이 바꿈:20,9 40,12.7 60,15.5 80,18
~ 점점 완만하게 증가 — 길이가 늘수록 시간도 늘지만 정비례는 아니다

= 다른 조건을 바꾸면? | 실 길이 40 cm로 같게
| 조작 변인 | 바꾼 값 | 10번 왕복 시간 |
| 추의 질량 | 50 g → 100 g → 200 g | 약 12.7 초로 거의 같음 |
| 처음 각도 | 5° → 10° → 15° | 약 12.7 초로 거의 같음 |
>+ 결론: 진자의 주기는 ==실의 길이==에 따라 달라지고, 추의 질량과 (작은) 각도에는 거의 영향을 받지 않는다.
% 측정값이 약간씩 다른 것은 측정 오차 — 시뮬레이션도 ±1 % 오차를 넣어 둠

= 생활 속 변인 통제 | 사례
* 🌱 식물 키우기 :: 햇빛만 다르게, 물·흙·화분은 같게
* 🧊 얼음 녹이기 :: 컵 재질만 다르게, 얼음 크기·처음 온도는 같게
* 🧴 손 세정제 비교 :: 세정제 종류만 다르게, 양·문지르는 시간은 같게
* 🍞 빵 곰팡이 :: 보관 온도만 다르게, 빵 종류·습기는 같게
* ✈️ 종이비행기 :: 날개 모양만 다르게, 종이·던지는 힘은 같게
* 💊 신약 시험 :: 약만 다르게, 나이·생활 습관이 비슷한 두 집단 비교

= 예제 1 · 변인 찾기 | 적용
- "물의 온도가 높을수록 설탕이 빨리 녹을 것이다."를 확인하려고 한다.
^+ 일부러 바꾸는 것 → 조작 변인: **물의 온도**
^+ 같게 하는 것 → 통제 변인: **물의 양, 설탕의 양, 젓는 방법**
^+ 측정하는 것 → 종속 변인: **설탕이 다 녹는 데 걸린 시간**
>+ 가설 문장 속 "~할수록"이 조작 변인, "~할 것이다"가 종속 변인!

= 예제 2 · 잘못된 설계 고치기 | 적용
| 비커 | 물의 온도 | 물의 양 | 설탕 양 | 젓기 |
| A | 20 °C | 100 mL | 5 g | 젓지 않음 |
| B | 60 °C | 100 mL | 5 g | 유리 막대로 저음 |
^+ 다른 조건 찾기 → 온도뿐 아니라 **젓기**도 다르다
^+ 고치기 → 두 비커 모두 젓지 않거나, ==똑같이== 젓는다

= 예제 3 · 결과 해석하기 | 적용
- 실 길이 20 cm일 때 10번 왕복 9.0 초였다. 80 cm일 때는?
^+ 표에서 80 cm → 약 **18.0 초**
^+ 길이 4배(20 → 80 cm) → 시간 **2배**(9.0 → 18.0 초)
^+ 길이를 다시 4배(320 cm)로 하면 → 시간도 다시 2배 → 약 **36 초**
>+ 자료에서 찾은 규칙으로 **새로운 상황을 예측**하는 것이 자료 해석의 힘!
% 3단계는 중1 수준에서 '예측'의 맛보기 — 정확한 값은 요구하지 않음

= 확인 문제 1
Q 과학적 탐구 과정의 순서로 옳은 것은?
o 가설 설정 → 문제 인식 → 탐구 설계 → 결론 도출
o* 문제 인식 → 가설 설정 → 탐구 설계 → 탐구 수행 → 자료 해석 → 결론 도출
o 탐구 수행 → 가설 설정 → 자료 해석 → 결론 도출
o 문제 인식 → 결론 도출 → 가설 설정 → 탐구 수행
:: 질문을 만들고(문제 인식), 답을 예상하고(가설), 계획해서 실험한 뒤 자료로 판단한다.

= 확인 문제 2
Q 진자의 주기와 추의 질량의 관계를 알아보는 실험에서 조작 변인은?
o 실의 길이
o* 추의 질량
o 처음 각도
o 10번 왕복하는 시간
:: 일부러 바꾸는 조건이 조작 변인이다. 실 길이와 각도는 통제 변인, 왕복 시간은 종속 변인.

= 확인 문제 3
Q 다음 중 실험으로 확인할 수 있는 가설은?
o 우주는 아름다울 것이다.
o 이 꽃은 예쁘게 자랄 것이다.
o* 햇빛을 많이 받을수록 콩나물이 빨리 자랄 것이다.
o 진자는 재미있게 흔들릴 것이다.
:: '햇빛의 양'은 바꿀 수 있고 '자라는 길이'는 잴 수 있다. '아름답다·예쁘다'는 측정 기준이 없다.

= 확인 문제 4
Q 한 번 왕복 시간 대신 10번 왕복 시간을 재는 까닭은?
o 진자가 10번 흔들리면 멈추기 때문
o* 초시계를 누르는 반응 시간에 의한 오차를 줄이기 위해
o 10번째 왕복이 가장 빠르기 때문
o 실 길이를 바꾸지 않기 위해
:: 오차는 거의 그대로인데 잰 시간이 10배 길어져서 상대적인 오차가 줄어든다.

= 확인 문제 5
Q 컵 재질에 따라 음료가 차갑게 유지되는 시간을 비교할 때 같게 할 조건이 **아닌** 것은?
o 음료의 양
o 처음 온도
o* 컵의 재질
o 놓아두는 장소
:: 컵의 재질은 일부러 바꾸는 조작 변인이다.

= 서술형 도전 | 생각 넓히기
? 민수는 거실 화분(물 매일)과 베란다 화분(물 이틀에 한 번)을 비교해 "햇빛이 많으면 잘 자란다"고 결론 내렸다. 문제점과 고칠 방법을 쓰시오. :: 햇빛과 물 주는 횟수가 동시에 달라 원인을 알 수 없다. 물 주는 횟수·양, 흙, 화분 크기를 같게 하고 햇빛만 다르게 해야 한다.
? 같은 조건으로 실험을 한 번만 하지 않고 여러 번 반복하는 까닭은? :: 측정할 때마다 생기는 우연한 오차를 줄이고, 결과가 다시 나오는지(재현성) 확인하기 위해서이다.

= 나의 탐구 계획서 | 적용 미션
* ☂️ 문제 A :: 같은 우산인데 왜 어떤 친구는 가방이 덜 젖을까?
* 🪴 문제 B :: 교실 화분의 식물이 잘 자라는 위치는?
* 🥤 문제 C :: 어떤 컵에 담은 음료가 가장 오래 차가울까?
- 하나를 골라 **가설 · 조작 변인 · 통제 변인 · 종속 변인(측정 방법)**을 쓰자.
% 학습지 1차시 뒷면 4번 활용 — 모둠 1분 발표, 서로 '같게 할 조건'을 더 찾아 주기

= 오늘 배운 내용 정리
- 탐구 과정: 문제 인식 → [[가설 설정]] → 탐구 설계 → 탐구 수행 → [[자료 해석]] → 결론 도출
- 가설은 탐구 문제에 대한 [[잠정적인 답]]이다.
- 일부러 바꾸는 조건 = [[조작 변인]], 같게 하는 조건 = [[통제 변인]], 측정하는 결과 = [[종속 변인]]
- 확인하려는 것만 다르게 하고 나머지는 같게 하는 것 = [[변인 통제]]
- 진자의 주기는 [[실의 길이]]에 따라 달라진다.

= 나가기 전 한 문제 | 형성평가
? 처음의 라면 대결을 공정한 실험으로 바꾸어 "센 불이 더 빨리 익힌다"를 확인하려면 어떻게 해야 할까? :: 불 세기만 다르게 하고 물의 양(예: 둘 다 500 mL), 면 모양(둘 다 통째로), 냄비 종류는 같게 한 뒤 면이 익는 시간을 잰다.
