## 과학이 바꾼 문명 | 발견 → 기술 → 생활

= 과학과 기술은 어떻게 다를까?
| 구분 | 과학 | 기술 |
| 목적 | 자연의 원리를 **밝힘** | 원리를 **활용**해 문제를 해결 |
| 예 | 전자기 유도 발견 | 발전기 |
>+ 과학 원리의 발견은 새로운 ==기술==을 낳고, 기술은 다시 ==사회와 문화==를 바꾼다.
>+ 거꾸로, 새로운 기술(현미경·망원경)이 새로운 과학 발견을 이끌기도 한다.

= 과학 발견과 기술 연표 ① | 1590 ~ 1876
|+ 1590 | 현미경 발명 | 세포·미생물 관찰 → 생명 과학·의학 발전 |
|+ 1687 | 뉴턴의 운동 법칙 | 운동 예측 → 기계·건축·우주 탐사의 바탕 |
|+ 1769 | 증기 기관 개량 | 공장과 기차 → 산업 혁명 |
|+ 1831 | 전자기 유도 발견 | 발전기 → 전기를 쓰는 생활 |
|+ 1876 | 전화 발명 | 멀리 있는 사람과 목소리로 소통 |

|+ 1928 | 페니실린 발견 | 항생제 → 세균 감염 치료, 수명 연장 |

= 과학은 다른 분야와 영향을 주고받는다
* 🎨 예술 :: 컴퓨터 그래픽 기술 → 애니메이션과 디지털 미술
* 🔢 수학 :: 수학 → 암호 기술, 인공지능의 계산
* 🛠️ 공학 :: 과학 원리 → 다리·건물·로봇 설계
* 🎵 음악 :: 소리의 과학 → 악기 개량, 디지털 음원
> 과학·기술·공학·예술·수학은 서로 도우며 함께 발전한다.

## 인공지능과 미래 사회 | 데이터에서 규칙을 찾는다

= 인공지능은 어떻게 배울까?
! 많은 데이터에서 ==규칙==을 찾아 새로운 대상을 판단한다
- 사람이 규칙을 하나하나 알려 주지 않는다.
+ 예: 사과·귤 사진 수천 장 → 크기·색의 특징을 스스로 찾음
+ 처음 보는 과일 → 학습한 데이터와 비교해 판단
>+ 그래서 인공지능의 판단은 **학습한 데이터**에 따라 달라진다.

= 가까운 이웃 3개에게 물어보기 | 시뮬레이션의 판단 방법
^+ 새 과일의 크기·붉은 정도를 점으로 찍는다
^+ 이미 아는 과일 중 **가장 가까운 3개**를 찾는다
^+ 3개 중 더 많은 쪽(2개 이상)으로 판단한다
| 가까운 3개 | 판단 |
|+ 사과 3, 귤 0 | 사과 |
|+ 사과 2, 귤 1 | 사과 |
|+ 사과 1, 귤 2 | 귤 |

= 생활 속 첨단 과학기술 | 사례
* 🚗 자율 주행 자동차 :: 카메라·센서 데이터로 길과 사람을 판단
* 🩺 로봇 수술 :: 사람 손보다 작고 정밀한 움직임
* 🌾 스마트 농장 :: 온도·습도 센서로 자동 물 주기
* 🖨️ 3D 프린팅 :: 의수·의족, 집까지 층층이 쌓아 만든다
* 🗣️ 통번역 인공지능 :: 다른 언어로 실시간 대화
* 🧬 맞춤 의약품 :: 유전 정보에 맞춘 치료

= 편리함 뒤의 새로운 문제
| 기술 | 좋아질 점 | 생각해야 할 문제 |
|+ 인공지능 | 빠르고 정확한 판단 | 판단의 **책임**은 누구에게? |
|+ 자율 주행 | 교통사고 감소 | 사고 시 책임, 운전 일자리 |
|+ 빅데이터 | 맞춤 서비스 | **개인 정보** 보호 |
|+ 로봇·자동화 | 위험한 일 대신 | **일자리 변화** |
>+ 첨단 기술은 장점과 문제를 함께 생각하며 ==책임 있게== 써야 한다.

= 예제 1 · 연표 해석 | 적용
- 1947년 트랜지스터 발명이 우리 생활까지 이어진 과정을 정리하자.
^+ 과학: 반도체의 성질을 연구 → **트랜지스터** 발명
^+ 기술: 전자 기기가 작고 싸짐 → **컴퓨터·휴대 전화**
^+ 생활: 언제 어디서나 정보 검색·소통 → **정보화 사회**
>+ 발견 → 기술 → 생활의 세 단계로 정리하면 어떤 사례든 설명할 수 있다!

= 예제 2 · 인공지능의 판단 | 적용
- 새 과일 X에서 가까운 순서: 귤, 사과, 사과, 귤, 귤
^+ 가장 가까운 3개만 본다 → 귤, 사과, 사과
^+ 사과 2개, 귤 1개 → 인공지능은 **사과**로 판단
^+ 가까운 5개를 보면? 귤 3, 사과 2 → **귤**로 판단
>+ 같은 데이터라도 판단 방법(몇 개를 볼지)에 따라 결과가 달라질 수 있다.

= 예제 3 · 치우친 데이터 | 적용
- 어떤 인공지능이 빨간 사과 사진 1000장, 초록 사과 사진 10장으로 배웠다.
^+ 초록 사과를 보여 주면? → 데이터가 적어 **귤 등으로 잘못 판단**할 수 있다
^+ 원인 → 학습 데이터가 한쪽으로 **치우쳤다**
^+ 해결 → 초록 사과 등 다양한 데이터를 **고르게** 추가한다
>+ 인공지능의 판단은 학습한 데이터만큼만 정확하다.

= 확인 문제 1
Q 과학과 기술에 대한 설명으로 옳은 것은?
o 과학과 기술은 서로 관련이 없다.
o* 과학 원리의 발견이 새로운 기술로 이어진다.
o 기술은 사회와 문화를 바꾸지 못한다.
o 과학은 예술·수학과 영향을 주고받지 않는다.
:: 전자기 유도 → 발전기처럼 과학의 발견이 기술을 낳고, 기술은 생활과 문화를 바꾼다.

= 확인 문제 2
Q 세균 감염을 치료하는 항생제의 시작이 된 과학 발견은?
o 전자기 유도 발견
o DNA 구조 발견
o* 페니실린 발견
o 트랜지스터 발명
:: 1928년 페니실린 발견으로 항생제가 등장해 많은 생명을 구했다.

= 확인 문제 3
Q 인공지능이 학습하고 판단하는 원리로 옳은 것은?
o 사람이 모든 규칙을 직접 입력해야만 판단한다.
o* 많은 데이터에서 규칙을 찾아 새로운 대상을 판단한다.
o 데이터가 적을수록 더 정확해진다.
o 한 번 학습하면 판단이 절대 틀리지 않는다.
:: 데이터에서 규칙을 찾기 때문에 데이터가 정확하고 고르게 있어야 판단도 정확하다.

= 확인 문제 4
Q 가까운 3개를 보는 인공지능에서, 새 점과 가장 가까운 데이터가 순서대로 '귤, 귤, 사과, 사과'일 때 판단은?
o 사과
o* 귤
o 판단할 수 없다
o 사과와 귤 반반
:: 가장 가까운 3개는 귤, 귤, 사과 → 귤 2개로 더 많으므로 귤로 판단한다.

= 서술형 도전 | 생각 넓히기
? 자율 주행 자동차가 널리 쓰일 때 좋아질 점과 생길 수 있는 문제를 하나씩 쓰고, 문제의 해결 방안을 제안하시오. :: 좋은 점: 졸음·음주 운전 사고가 줄고 이동이 어려운 사람도 이동할 수 있다. 문제: 사고가 났을 때 책임이 누구에게 있는지 불분명하다. 해결: 사고 책임 기준을 법으로 정하고 주행 기록을 남기게 한다.
? "인공지능은 사람보다 똑똑하니 판단을 모두 맡기면 된다."는 주장에 대한 생각을 근거와 함께 쓰시오. :: 맡길 수 없다. 인공지능의 판단은 학습 데이터에 따라 틀리거나 치우칠 수 있고, 판단의 결과에 대한 책임은 사람이 져야 하므로 사람이 확인하고 결정해야 한다.

= 오늘 배운 내용 정리
- 과학 원리의 발견은 새로운 [[기술]]을 낳고, 기술은 [[사회와 문화]]를 바꾼다.
- 전자기 유도 → [[발전기]], 페니실린 → [[항생제]], 트랜지스터 → 컴퓨터·휴대 전화
- 인공지능은 많은 [[데이터]]에서 규칙을 찾아 판단한다.
- 데이터가 [[치우치면]] 인공지능의 판단도 틀릴 수 있다.
- 첨단 기술은 개인 정보, 일자리, 판단의 [[책임]] 같은 문제도 함께 생각해야 한다.
