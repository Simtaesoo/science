= 오늘의 학습 목표 | 3차시
^ **지속가능한 발전**과 **탄소 발자국**의 뜻을 설명할 수 있다.
^ 생활 속 탄소 배출량을 **계산**하고 줄이는 방법의 효과를 비교할 수 있다.
^ 지속가능한 삶을 위한 과학기술의 역할을 토의하고 **실천 계획**을 세울 수 있다.
% 흐름: 생각 열기 5분 → 개념 8분 → 탄소 발자국 계산 15분 → 문항 7분 → 토의·게임 10분

= 발자국은 모래에만 남을까? | 생각 열기
* 🚗 등굣길 :: 차를 타면 휘발유가 타며 이산화 탄소가 나온다
* 🍔 점심 :: 고기를 기르고 옮기는 데도 에너지가 든다
* 🥤 음료 :: 일회용 컵을 만들고 버리는 데도 배출
* 🚿 샤워 :: 물을 데우는 에너지도 배출
? 눈에 보이지 않지만 우리가 날마다 남기는 '발자국'은? :: 활동마다 배출되는 이산화 탄소 — 탄소 발자국
% 학생에게 오늘 아침부터 지금까지 한 일을 3가지 적게 한 뒤 시작

= 지난 시간 복습 | 2차시
? 과학 발견이 생활을 바꾸는 순서는? :: 과학 발견 → 기술 → 생활(사회와 문화)의 변화
? 첨단 기술을 쓸 때 함께 생각해야 할 문제의 예는? :: 개인 정보 보호, 일자리 변화, 판단의 책임
> 오늘은 과학기술이 만든 문제와, 그 문제를 해결하는 과학기술을 함께 살펴본다.

## 지속가능한 삶 | 미래 세대의 몫을 남기는 삶

= 지속가능한 발전이란?
! 미래 세대가 쓸 자원과 환경을 해치지 않으면서 현재 세대의 필요를 채우는 발전
- 화석 연료·물·숲은 한 번 다 쓰면 되돌리기 어렵다.
+ 지금의 편리함만 좇으면 기후 변화, 자원 고갈이 미래 세대의 짐이 된다.
>+ 환경 · 경제 · 사회가 ==함께== 지속될 수 있어야 한다.

= 탄소 발자국
! 활동이나 제품의 전 과정에서 배출되는 이산화 탄소(온실 기체)의 양
- 단위: **kg CO₂** (이산화 탄소 몇 kg에 해당하는지)
+ 이산화 탄소 같은 온실 기체가 늘면 지구의 평균 기온이 올라간다.
+ 제품은 만들고 → 옮기고 → 쓰고 → 버리는 **모든 과정**을 더한다.
% 수치는 시뮬레이션과 같은 '수업용 대략값'임을 안내

= 생활 속 배출 계수 | 시뮬레이션에서 쓰는 값
| 활동 | 단위 | 배출량 (kg CO₂) |
| 승용차 이용 | 1 km | 0.21 |
| 버스·지하철 이용 | 1 km (1인) | 0.06 |
| 전기 사용 | 1 kWh | 0.46 |
| 소고기 반찬 / 돼지·닭고기 / 채소 위주 | 1번 | 3.0 / 1.0 / 0.4 |
| 일회용 컵·용기 | 1개 | 0.05 |
| 따뜻한 물 샤워 | 1분 | 0.07 |
~ 수업용 대략적인 값. 실제 값은 연료·발전 방식에 따라 다르다.

## 탄소 발자국 계산 | 숫자로 보는 나의 하루

= 민지의 하루 | 배출량 = 양 × 배출 계수
| 활동 | 양 | 계산 | 배출량 (kg) |
|+ 승용차 | 10 km | 10 × 0.21 | 2.1 |
|+ 버스 | 5 km | 5 × 0.06 | 0.3 |
|+ 전기 | 6 kWh | 6 × 0.46 | 2.76 |
|+ 소고기·돼지고기·채소 | 각 1번 | 3.0 + 1.0 + 0.4 | 4.4 |
|+ 일회용 컵 · 샤워 | 2개 · 10분 | 0.1 + 0.7 | 0.8 |
!+ 하루 합계 ≈ 10.4 kg CO₂

= 1년으로 늘려 보면
^+ 하루 10.36 kg × 365일 ≈ **3781 kg** (약 3.8 톤)
^+ 30년생 소나무 한 그루가 1년에 흡수하는 이산화 탄소 ≈ **6.6 kg**
^+ 3781 ÷ 6.6 ≈ **573그루**가 1년 내내 흡수해야 한다
>+ 작은 습관도 365일, 30명이 모이면 큰 차이가 된다!

= 시뮬레이션: 나의 탄소 발자국 | 실험실
@ sim.html#carbon | 나의 하루를 입력하고, 실천 방법을 골라 막대가 얼마나 줄어드는지 확인하자.
% 기본값이 민지의 하루와 같음(10.4 kg) — 각자 값으로 바꾸고 '가장 많이 배출한 항목'을 학습지에 적게 하기

= 실천하면 얼마나 줄까? | 민지의 하루 기준
| 실천 | 바뀌는 것 | 하루에 줄어드는 양 |
|+ 가까운 거리는 걸어가기 | 승용차 10 → 5 km | 1.05 kg |
|+ 텀블러 쓰기 | 일회용 컵 2 → 0개 | 0.1 kg |
|+ 안 쓰는 전등·플러그 끄기 | 전기 20 % 절약 | 0.55 kg |
|+ 소고기 반찬 → 채소 | 3.0 → 0.4 | 2.6 kg |
|+ 샤워 5분 줄이기 | 10 → 5분 | 0.35 kg |
>+ 모두 실천하면 10.36 → **약 5.7 kg** — 거의 절반!

= 과학기술의 역할 | 사례
* ☀️ 신재생 에너지 :: 태양광·풍력으로 화석 연료 없이 전기 생산
* 🔋 에너지 효율 :: LED 전등, 고효율 가전으로 같은 일에 적은 에너지
* 🏭 탄소 포집 :: 공장 굴뚝의 이산화 탄소를 모아 저장
* 🛰️ 기후 관측 :: 인공위성으로 기온·해수면 변화를 측정하고 예측
* 🚌 친환경 교통 :: 전기·수소 버스, 회생 제동
* ♻️ 자원 순환 :: 폐플라스틱을 다시 원료로

= 예제 1 · 등굣길 비교 | 적용
- 학교까지 10 km를 승용차 대신 버스로 가면 하루에 얼마나 줄까?
^+ 승용차: 10 × 0.21 = **2.1 kg**
^+ 버스: 10 × 0.06 = **0.6 kg**
^+ 줄어든 양: 2.1 − 0.6 = **1.5 kg** → 1년(365일) 1.5 × 365 = **547.5 kg**
>+ 소나무 약 83그루(547.5 ÷ 6.6)가 1년 동안 흡수하는 양!

= 예제 2 · 우리 반 텀블러 | 적용
- 한 사람이 하루에 일회용 컵 2개를 텀블러로 바꾼다. 우리 반 30명이 1년 동안 하면?
^+ 한 사람 하루: 2 × 0.05 = **0.1 kg**
^+ 한 사람 1년: 0.1 × 365 = **36.5 kg**
^+ 30명 1년: 36.5 × 30 = **1095 kg** (약 1.1 톤)
>+ 혼자서는 작아 보여도 함께하면 1톤이 넘는다.

= 예제 3 · 가장 효과가 큰 실천 | 적용
- 민지의 실천 5가지 중 하루에 가장 많이 줄이는 것은?
^+ 걸어가기 1.05 · 텀블러 0.1 · 전등 끄기 0.55 · 고기 반찬 줄이기 2.6 · 샤워 0.35 (kg)
^+ 가장 큰 것 → **소고기 반찬을 채소로** (2.6 kg)
^+ 모두 합치면 4.65 kg → 30명이 1년 하면 4.65 × 365 × 30 ≈ **50 900 kg**
>+ 배출 계수가 큰 항목부터 줄이는 것이 효과적이다.

= 확인 문제 1
Q 지속가능한 발전에 대한 설명으로 옳은 것은?
o 현재 세대의 편리함을 가장 먼저 생각한다.
o* 미래 세대가 쓸 자원과 환경을 해치지 않으면서 현재의 필요를 채운다.
o 경제 발전을 멈추고 환경만 보호한다.
o 자원을 최대한 빨리 개발한다.
:: 환경·경제·사회가 함께 이어질 수 있도록 미래 세대의 몫을 남기는 발전이다.

= 확인 문제 2
Q 승용차로 20 km를 이동할 때 배출되는 이산화 탄소는? (1 km당 0.21 kg)
o 0.21 kg
o 2.1 kg
o* 4.2 kg
o 21 kg
:: 20 × 0.21 = 4.2 kg

= 확인 문제 3
Q 배출량 3781 kg을 1년 동안 흡수하려면 소나무가 약 몇 그루 필요할까? (한 그루 1년 6.6 kg)
o 약 57그루
o* 약 573그루
o 약 3781그루
o 약 24 955그루
:: 3781 ÷ 6.6 ≈ 573그루

= 확인 문제 4
Q 탄소 배출을 줄이는 과학기술의 예로 알맞지 **않은** 것은?
o 태양광 발전
o LED 전등
o 탄소 포집 기술
o* 석탄 화력 발전소를 더 짓기
:: 석탄을 태우면 이산화 탄소가 많이 배출된다.

= 서술형 도전 | 과학 쟁점 토의
? 전기 자동차는 정말 친환경일까? 찬성·반대 근거를 하나씩 들고 나의 의견을 쓰시오. :: 찬성: 달릴 때 배기가스가 없고, 신재생 에너지로 만든 전기를 쓰면 배출이 크게 준다. 반대: 배터리를 만들 때 자원과 에너지가 많이 들고, 화석 연료로 만든 전기를 쓰면 탄소가 배출된다. 의견: 전기를 신재생 에너지로 만들고 배터리를 재활용할 때 더 친환경적이다.
? "과학기술이 환경 문제를 만들었으니 과학기술을 줄여야 한다."는 주장에 대한 생각을 쓰시오. :: 과학기술이 환경 문제의 원인이 되기도 했지만, 문제를 측정하고 신재생 에너지·효율 높은 기술로 해결하는 것도 과학기술이다. 줄이기보다 책임 있게 활용해야 한다.
% 찬반 모둠 토의 4분 → 대표 발표. '근거'에 숫자나 자료가 들어갔는지 확인

= 지속가능한 삶을 위한 실천 계획
| 수준 | 실천 방법 (예) |
| 나 | 텀블러 쓰기, 가까운 거리 걷기, 고기 반찬 한 번 줄이기 |
| 우리 반·학교 | 빈 교실 전등 끄기 당번, 급식 잔반 줄이기 |
| 사회에 제안 | 자전거 도로 확대, 학교 옥상 태양광 |
- 실천 기간과 **확인 방법**(체크표, 사진, 전기 요금)까지 정하자.

= 오늘 배운 내용 정리
- 미래 세대의 자원과 환경을 해치지 않고 현재의 필요를 채우는 발전 = [[지속가능한 발전]]
- 활동·제품의 전 과정에서 배출되는 이산화 탄소의 양 = [[탄소 발자국]]
- 배출량 = 활동의 양 × [[배출 계수]]
- 배출 계수가 [[큰]] 항목부터 줄이면 효과적이다.
- 신재생 에너지, 에너지 효율, 탄소 포집 → 지속가능한 삶을 돕는 [[과학기술]]

= 나가기 전 한 문제 | 형성평가
