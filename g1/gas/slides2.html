# 압력과 부피의 관계 | 누르면 왜 줄어들까? | 중학교 과학 1 · 06 기체의 성질 · 2차시 | 2022 개정 교육과정 [9과06-02]

= 오늘의 학습 목표 | 2차시
^ 실험 결과로부터 기체의 **압력과 부피의 관계**를 찾을 수 있다.
^ 압력과 부피의 관계를 **그래프**로 나타내고 해석할 수 있다.
^ 압력과 부피의 관계를 **입자 모형**으로 설명할 수 있다.
% 흐름: 생각 열기 5분 → 시뮬레이션 측정 12분 → 그래프·입자 모형 13분 → 문항 10분 → 정리 5분

= 산 정상의 과자 봉지 | 생각 열기
* 🏞️ 산 아래 :: 과자 봉지가 평범하다
* ⛰️ 산 정상 :: 봉지가 빵빵하게 부풀었다
* 🤿 바닷속 :: 잠수부의 공기 방울이 올라갈수록 커진다
? 봉지 속 공기의 양은 그대로인데 왜 부풀었을까? :: 높은 곳은 바깥 공기의 압력이 낮아 봉지 속 공기를 덜 누르므로 부피가 커진다.

= 지난 시간 복습 | 1차시
? 기체의 압력이 생기는 까닭은? :: 운동하는 기체 입자가 용기 벽에 충돌하기 때문
? 입자 수가 많아지면 압력은? :: 충돌 횟수가 늘어 커진다
| 같은 힘, 면적이 좁을수록 | 압력이 [[크다]] |

## 압력과 부피 | 실험으로 찾기

= 시뮬레이션: 압력과 부피 | 실험실
@ sim.html#pv | 온도를 25 °C로 둔 채 추를 1개부터 4개까지 올리며 부피를 측정하자. 추 1개는 1기압. 피스톤이 멈춘 뒤 눈금을 읽는다.
% 변인 통제 확인: 조작 변인 = 압력(추), 통제 변인 = 온도·입자 수, 종속 변인 = 부피

= 측정 결과 | 온도 25 °C
| 압력 (기압) | 1 | 2 | 3 | 4 |
|+ 부피 (mL) | 120 | 60 | 40 | 30 |
>+ 추를 늘려 압력을 높일수록 부피가 ==작아진다== (120 mL → 30 mL).
>+ 온도가 일정할 때 압력이 커지면 부피는 작아진다.

= 그래프로 나타내기
C 압력과 부피 (온도 일정) | 압력 (기압) | 부피 (mL) | 부피:1,120 2,60 3,40 4,30
~ 한쪽이 커질 때 다른 쪽이 작아지는 곡선 — 압력이 커질수록 부피가 줄어드는 정도는 작아진다

= 규칙 찾기 | 그래프가 말해 주는 것
| 압력이 높아질 때 | 부피의 변화 |
|+ 1 → 2기압 | 크게 줄어든다 (120 → 60 mL) |
|+ 2 → 3기압 | 덜 줄어든다 (60 → 40 mL) |
|+ 3 → 4기압 | 더 조금 줄어든다 (40 → 30 mL) |
>+ 온도가 일정할 때 압력이 커지면 부피는 ==작아지고==, 압력이 커질수록 줄어드는 정도는 작아진다.
% 2022 개정 [9과06-02] 적용 시 고려 사항: 수식을 이용한 양적 관계 계산은 고등학교 '물질과 에너지'에서 다루므로, 중학교에서는 실험 결과의 경향과 입자 모형 해석에 주안점을 둔다. '압력 × 부피 = 일정' 같은 식 계산은 하지 않는다.

## 입자 모형으로 해석하기 | 무엇이 변하고 무엇이 그대로일까?

= 압력이 커질 때 입자는?
| 압력이 커질 때 | 변화 |
|+ 입자의 수 | 변하지 않는다 |
|+ 입자의 크기 | 변하지 않는다 |
|+ 입자 사이의 거리 | **가까워진다** |
|+ 벽에 충돌하는 횟수 | **많아진다** |

= 피스톤이 멈추는 까닭
^+ 바깥에서 누르는 압력이 커진다
^+ 입자 사이의 거리가 가까워지며 **부피가 줄어든다**
^+ 일정한 면적에 부딪히는 횟수가 늘어 **기체의 압력도 커진다**
^+ 기체의 압력 = 바깥 압력이 되는 곳에서 피스톤이 **멈춘다**

= 생활 속 압력과 부피 | 사례
* ⛰️ 산 위 과자 봉지 :: 바깥 압력 감소 → 부피 증가
* 🫧 잠수부의 공기 방울 :: 올라갈수록 물의 압력 감소 → 커짐
* ✈️ 비행기 안 생수병 :: 높이 오르면 부풀고 착륙하면 찌그러짐
* 👟 에어 운동화 :: 누르면 공기가 압축되며 충격 흡수
* 💉 주사기 :: 입구를 막고 누르면 부피가 줄어든다
* 🎈 기상 관측 풍선 :: 높이 올라갈수록 커지다 터진다

= 예제 1 · 두 주사기 비교 | 적용
- 공기의 양과 온도가 같은 주사기 두 개의 입구를 막고, (가)는 세게, (나)는 약하게 피스톤을 눌렀다.
^+ 바깥에서 누르는 압력 → **(가)가 더 크다**
^+ 부피 → **(가)가 더 작다** — 입자 사이의 거리가 더 가깝다
^+ 일정한 면적에 충돌하는 횟수 → **(가)가 더 많다** → 기체의 압력도 더 크다

= 예제 2 · 그래프 거꾸로 읽기 | 적용
- 피스톤 위의 추를 4개에서 1개로 줄였다. (온도 일정)
^+ 바깥에서 누르는 압력 → **작아진다**
^+ 입자가 피스톤을 밀어 올리며 입자 사이의 거리가 **멀어진다**
^+ 부피 → 그래프를 따라 **커진다** — 기체의 압력과 바깥 압력이 같아지는 곳에서 멈춘다

= 예제 3 · 질량은 어떻게 될까? | 적용
- 주사기 입구를 막고 피스톤을 눌러 부피를 절반으로 줄였다.
^+ 입자의 **수** → 변하지 않는다
^+ 입자의 **크기** → 변하지 않는다
^+ 그러므로 질량은 **변하지 않는다** — 입자 사이의 거리만 가까워졌다

= 확인 문제 1
Q 온도가 일정할 때 기체에 가하는 압력을 2배로 하면 부피는?
o 커진다
o* 작아진다
o 변하지 않는다
o 처음에는 커지다가 작아진다
:: 시뮬레이션에서 1기압 120 mL → 2기압 60 mL로 작아졌다.

= 확인 문제 2
Q 압력과 부피의 관계로 설명할 수 있는 현상끼리 고른 것은?
o 여름철 자동차 타이어가 팽팽해진다, 찌그러진 탁구공이 뜨거운 물에서 펴진다
o* 높은 산에서 과자 봉지가 부푼다, 잠수부의 공기 방울이 올라갈수록 커진다
o 열기구가 떠오른다, 냉동실의 페트병이 찌그러진다
o 추운 날 풍선이 쪼그라든다, 동전이 병 위에서 들썩인다
:: 나머지는 온도와 부피의 관계이다.

= 확인 문제 3
Q 피스톤 위의 추를 늘려 기체의 부피가 줄었을 때 옳지 **않은** 것은?
o 입자 사이의 거리가 가까워진다.
o 일정한 면적에 충돌하는 횟수가 많아진다.
o* 입자 한 개의 크기가 작아진다.
o 입자의 수는 변하지 않는다.
:: 입자의 크기는 변하지 않는다.

= 확인 문제 4
Q 입구를 막은 주사기의 피스톤을 눌러 부피를 줄였다. 변하지 **않는** 것은?
o 기체의 부피
o 입자 사이의 거리
o 일정한 면적에 충돌하는 횟수
o* 기체의 질량
:: 입자의 수와 크기가 그대로이므로 질량은 변하지 않는다.

= 서술형 도전 | 생각 넓히기
? 비행기가 높이 올라가면 빈 생수병이 부풀고, 착륙하면 찌그러진다. 바깥 압력 변화와 연결해 설명하시오. :: 높은 곳에서는 기내 압력이 낮아져 병 속 공기의 부피가 커지고, 착륙하면 바깥 압력이 다시 커져 병 속 공기의 부피가 줄어들기 때문이다.
? 잠수부가 내뱉은 공기 방울이 수면으로 올라갈수록 커지는 까닭을 입자 모형으로 쓰시오. :: 수면에 가까워질수록 물의 압력이 작아져 공기 방울을 덜 누르므로, 방울 속 입자 사이의 거리가 멀어져 부피가 커진다. 입자의 수는 그대로이다.

= 오늘 배운 내용 정리
- 온도가 일정할 때 기체에 가하는 압력이 커지면 부피는 [[작아진다]].
- 압력과 부피의 그래프는 압력이 커질수록 부피가 줄어드는 [[곡선]] 모양이다.
- 압력이 커지면 일정한 면적에 충돌하는 횟수가 [[많아진다]].
- 부피가 줄어도 입자의 [[수]]와 크기는 변하지 않는다.
- 입자 사이의 [[거리]]만 가까워진다.

= 나가기 전 한 문제 | 형성평가
? 처음의 과자 봉지가 산 정상에서 부푼 까닭을 '바깥 압력', '입자 사이의 거리'를 넣어 쓰시오. :: 산 정상은 바깥 압력이 낮아 봉지 속 공기를 덜 누르므로, 봉지 속 입자 사이의 거리가 멀어져 부피가 커졌다.
