## 압력과 부피 | 실험으로 찾기

= 시뮬레이션: 압력과 부피 | 실험실
@ sim.html#pv | 온도를 25 °C로 둔 채 추를 1개부터 4개까지 올리며 부피를 측정하자. 추 1개는 1기압. 피스톤이 멈춘 뒤 눈금을 읽는다.
% 변인 통제 확인: 조작 변인 = 압력(추), 통제 변인 = 온도·입자 수, 종속 변인 = 부피

= 측정 결과 | 온도 25 °C
| 압력 (기압) | 1 | 2 | 3 | 4 |
|+ 부피 (mL) | 120 | 60 | 40 | 30 |
>+ 압력이 2배 → 부피 ==½배==, 압력이 4배 → 부피 ==¼배==
>+ 온도가 일정할 때 압력이 커지면 부피는 작아진다.

= 그래프로 나타내기
C 압력과 부피 (온도 일정) | 압력 (기압) | 부피 (mL) | 부피:1,120 2,60 3,40 4,30
~ 한쪽이 커질 때 다른 쪽이 작아지는 곡선 — 압력이 커질수록 부피가 줄어드는 정도는 작아진다

= 규칙 찾기 | 압력 × 부피
| 압력 (기압) | 부피 (mL) | 압력 × 부피 |
|+ 1 | 120 | 120 |
|+ 2 | 60 | 120 |
|+ 3 | 40 | 120 |
|+ 4 | 30 | 120 |
>+ 압력과 부피를 곱하면 늘 ==120==으로 일정하다!
% 반비례 관계 맛보기 — 중1 수학의 반비례와 연결 가능

## 입자 모형으로 해석하기 | 무엇이 변하고 무엇이 그대로일까?

= 압력이 커질 때 입자는?
| 압력이 커질 때 | 변화 |
|+ 입자의 수 | 변하지 않는다 |
|+ 입자의 크기 | 변하지 않는다 |
|+ 입자 사이의 거리 | **가까워진다** |
|+ 벽에 충돌하는 횟수 | **많아진다** |

= 피스톤이 멈추는 까닭
^+ 바깥에서 누르는 압력이 커진다
^+ 입자 사이의 거리가 가까워지며 **부피가 줄어든다**
^+ 일정한 면적에 부딪히는 횟수가 늘어 **기체의 압력도 커진다**
^+ 기체의 압력 = 바깥 압력이 되는 곳에서 피스톤이 **멈춘다**

= 생활 속 압력과 부피 | 사례
* ⛰️ 산 위 과자 봉지 :: 바깥 압력 감소 → 부피 증가
* 🫧 잠수부의 공기 방울 :: 올라갈수록 물의 압력 감소 → 커짐
* ✈️ 비행기 안 생수병 :: 높이 오르면 부풀고 착륙하면 찌그러짐
* 👟 에어 운동화 :: 누르면 공기가 압축되며 충격 흡수
* 💉 주사기 :: 입구를 막고 누르면 부피가 줄어든다
* 🎈 기상 관측 풍선 :: 높이 올라갈수록 커지다 터진다

= 예제 1 · 부피 예측 | 적용
- 1기압에서 부피 120 mL인 기체에 압력을 6기압으로 높이면? (온도 일정)
^+ 압력이 1 → 6기압, **6배**
^+ 부피는 **1/6배**
^+ 120 ÷ 6 = **20 mL** (확인: 6 × 20 = 120)

= 예제 2 · 거꾸로 생각하기 | 적용
- 4기압에서 30 mL인 기체의 압력을 줄여 부피를 90 mL로 만들려면? (온도 일정)
^+ 부피 30 → 90 mL, **3배**
^+ 압력은 **1/3배**
^+ 4 ÷ 3 ≈ **1.3기압** (확인: 1.3 × 90 ≈ 120)

= 예제 3 · 질량은 어떻게 될까? | 적용
- 주사기 입구를 막고 피스톤을 눌러 부피를 절반으로 줄였다.
^+ 입자의 **수** → 변하지 않는다
^+ 입자의 **크기** → 변하지 않는다
^+ 그러므로 질량은 **변하지 않는다** — 입자 사이의 거리만 가까워졌다

= 확인 문제 1
Q 온도가 일정할 때 기체에 가하는 압력을 2배로 하면 부피는?
o 2배가 된다
o* 처음의 ½배가 된다
o 변하지 않는다
o 4배가 된다
:: 1기압 120 mL → 2기압 60 mL

= 확인 문제 2
Q 압력과 부피의 관계로 설명할 수 있는 현상끼리 고른 것은?
o 여름철 자동차 타이어가 팽팽해진다, 찌그러진 탁구공이 뜨거운 물에서 펴진다
o* 높은 산에서 과자 봉지가 부푼다, 잠수부의 공기 방울이 올라갈수록 커진다
o 열기구가 떠오른다, 냉동실의 페트병이 찌그러진다
o 추운 날 풍선이 쪼그라든다, 동전이 병 위에서 들썩인다
:: 나머지는 온도와 부피의 관계이다.

= 확인 문제 3
Q 피스톤 위의 추를 늘려 기체의 부피가 줄었을 때 옳지 **않은** 것은?
o 입자 사이의 거리가 가까워진다.
o 일정한 면적에 충돌하는 횟수가 많아진다.
o* 입자 한 개의 크기가 작아진다.
o 입자의 수는 변하지 않는다.
:: 입자의 크기는 변하지 않는다.

= 확인 문제 4
Q 1기압에서 120 mL인 기체가 3기압이 되었을 때 부피는? (온도 일정)
o 360 mL
o 60 mL
o* 40 mL
o 30 mL
:: 압력 3배 → 부피 1/3배: 120 ÷ 3 = 40 mL

= 서술형 도전 | 생각 넓히기
? 비행기가 높이 올라가면 빈 생수병이 부풀고, 착륙하면 찌그러진다. 바깥 압력 변화와 연결해 설명하시오. :: 높은 곳에서는 기내 압력이 낮아져 병 속 공기의 부피가 커지고, 착륙하면 바깥 압력이 다시 커져 병 속 공기의 부피가 줄어들기 때문이다.
? 잠수부가 내뱉은 공기 방울이 수면으로 올라갈수록 커지는 까닭을 입자 모형으로 쓰시오. :: 수면에 가까워질수록 물의 압력이 작아져 공기 방울을 덜 누르므로, 방울 속 입자 사이의 거리가 멀어져 부피가 커진다. 입자의 수는 그대로이다.

= 오늘 배운 내용 정리
- 온도가 일정할 때 기체에 가하는 압력이 커지면 부피는 [[작아진다]].
- 압력이 2배가 되면 부피는 [[½]]배가 된다.
- 압력 × 부피 = [[일정]] (예: 1기압 × 120 mL = 120)
- 부피가 줄어도 입자의 [[수]]와 크기는 변하지 않는다.
- 입자 사이의 [[거리]]만 가까워진다.

= 나가기 전 한 문제 | 형성평가
? 처음의 과자 봉지가 산 정상에서 부푼 까닭을 '바깥 압력', '입자 사이의 거리'를 넣어 쓰시오. :: 산 정상은 바깥 압력이 낮아 봉지 속 공기를 덜 누르므로, 봉지 속 입자 사이의 거리가 멀어져 부피가 커졌다.
