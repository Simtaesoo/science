# 압력과 기체의 압력 | 입자는 왜 벽을 밀까? | 중학교 과학 1 · 06 기체의 성질 · 1차시 | 2022 개정 교육과정 [9과06-01]

= 오늘의 학습 목표 | 1차시
^ **압력**의 뜻을 알고 힘과 면적에 따라 압력이 어떻게 달라지는지 설명할 수 있다.
^ **기체의 압력**이 생기는 까닭을 입자의 운동으로 설명할 수 있다.
^ 입자 수와 온도에 따라 기체의 압력이 어떻게 변하는지 **추론**할 수 있다.
% 흐름: 생각 열기 5분 → 압력 10분 → 기체의 압력 10분 → 시뮬레이션 10분 → 문항·정리 10분

= 풍선은 왜 둥글게 부풀까? | 생각 열기
* 🎈 풍선 :: 입으로 불면 사방으로 둥글게 부푼다
* 🚲 자전거 타이어 :: 공기를 넣을수록 단단해진다
* 🥾 눈밭 :: 운동화는 푹 빠지는데 설피를 신으면 덜 빠진다
? 공기는 보이지도 않는데 어떻게 풍선을 사방으로 밀어낼까? :: 공기 입자가 끊임없이 움직이며 풍선 안쪽 벽에 부딪혀 모든 방향으로 미는 힘, 즉 기체의 압력이 생긴다.

= 지난 시간까지 배운 것 | 복습
| 질문 | 답 |
| 확산과 증발이 알려 주는 것 | [[입자는 스스로 운동한다]] |
| 기체의 입자 사이 거리 | [[매우 멀다]] |
| 힘의 단위 | [[N (뉴턴)]] |
? 온도가 높아지면 입자의 운동은? :: 더 활발해진다

## 압력 | 힘이 얼마나 좁은 곳에 모이는가

= 압력이란?
! 압력 = 일정한 ==면적==에 수직으로 작용하는 ==힘==의 크기
- 같은 힘이면 면적이 **좁을수록** 압력이 크다.
+ 같은 면적이면 힘이 **클수록** 압력이 크다.
>+ 같은 벽돌이라도 ==세웠을 때== 스펀지가 더 깊이 들어간다.

= 벽돌과 스펀지 | 무게 20 N인 벽돌
| 놓는 방법 | 닿는 면적 | 1 m²당 받는 힘 |
|+ 눕혔을 때 | 0.02 m² | 20 ÷ 0.02 = **1000 N** |
|+ 세웠을 때 | 0.005 m² | 20 ÷ 0.005 = **4000 N** |
>+ 면적이 1/4이 되면 압력은 ==4배==!
% 수식(압력 = 힘 ÷ 면적)은 '1 m²당 받는 힘'으로 의미만 짚기

= 생활 속 압력 | 사례
* 🥾 설피 :: 면적을 넓혀 압력을 줄인다 — 눈에 덜 빠짐
* 🎒 넓은 가방끈 :: 어깨가 받는 압력을 줄인다
* 🚜 무한궤도 :: 넓은 면으로 무른 땅을 지난다
* 🔪 칼날 :: 좁은 면적으로 압력을 키운다 — 잘 잘림
* 📌 압정 끝 :: 뾰족하게 해 작은 힘으로도 꽂힌다
* 👠 뾰족한 굽 :: 바닥에 자국이 잘 남는다

## 기체의 압력 | 입자의 충돌

= 기체의 압력은 어떻게 생길까?
! 운동하는 기체 입자가 용기 벽에 ==충돌==하여 생긴다
- 입자가 벽에 부딪힐 때 벽을 **민다**.
+ 입자는 **모든 방향**으로 움직이므로 기체의 압력은 모든 방향으로 작용한다.
+ 일정한 면적에 충돌하는 **횟수가 많을수록**, **세게** 부딪힐수록 압력이 크다.

= 시뮬레이션: 압력과 입자 충돌 | 실험실
@ sim.html#p | 뚜껑이 고정된 용기에서 입자 수와 온도를 바꾸며 압력계 값을 기록하자.
% 한 번에 한 가지만 바꾸기: ① 온도 25 °C 고정, 입자 수 30 → 120 ② 입자 수 60 고정, 온도 0 → 100 °C

= 시뮬레이션 결과 | 부피 일정
| 조건 | 바꾼 것 | 압력 |
|+ 온도 25 °C 고정 | 입자 30개 → 120개 | 약 0.5 → 약 2.0 기압 |
|+ 입자 60개 고정 | 0 °C → 100 °C | 약 0.9 → 약 1.3 기압 |
>+ 입자 수가 많아지면 ==충돌 횟수==가 늘어 압력이 커진다.
>+ 온도가 높아지면 입자가 ==더 빠르게== 움직여 압력이 커진다.

= 입자 수와 압력 | 온도 25 °C
C 입자 수가 2배, 4배가 되면 압력도 2배, 4배 | 입자 수 (개) | 압력 (기압) | 압력:30,0.5 60,1 90,1.5 120,2
~ 같은 부피 안에 입자가 많을수록 벽에 부딪히는 횟수가 많다

= 생활 속 기체의 압력 | 사례
* 🚲 타이어에 공기 넣기 :: 입자 수 증가 → 압력 증가 → 단단
* 🎈 풍선 :: 모든 방향으로 미는 압력 → 둥근 모양
* 🥫 스프레이 캔 :: 높은 압력의 기체가 내용물을 밀어냄
* 🏀 농구공 :: 공기를 넣어야 잘 튄다
* ☀️ 여름 타이어 :: 온도가 올라 압력이 커진다
* 🫙 진공 포장 :: 안쪽 기체가 적어 바깥 공기가 눌러 붙인다

= 예제 1 · 면적과 압력 | 적용
- 몸무게 500 N인 사람이 운동화(바닥 면적 0.05 m²)와 설피(0.25 m²)를 신고 눈 위에 섰다.
^+ 운동화: 500 ÷ 0.05 = **10 000 N** (1 m²당)
^+ 설피: 500 ÷ 0.25 = **2000 N** (1 m²당)
^+ 면적 5배 → 압력 **1/5** → 설피가 덜 빠진다

= 예제 2 · 어느 용기의 압력이 클까? | 적용
- 크기와 온도가 같은 두 용기: (가) 입자 6개, (나) 입자 12개
^+ 같은 것 → 크기(부피), 온도
^+ 다른 것 → 입자 수: (나)가 2배
^+ (나)의 압력이 더 크다 → 일정한 면적에 **충돌하는 횟수**가 더 많다

= 예제 3 · 온도와 압력 | 적용
- 뚜껑이 고정된 용기(입자 60개)를 0 °C에서 100 °C로 데웠다.
^+ 입자 수, 부피 → **그대로**
^+ 온도 상승 → 입자의 운동이 **빨라진다** → 더 자주, 더 세게 충돌
^+ 압력 약 0.9 → 약 **1.3 기압**으로 커진다

= 확인 문제 1
Q 같은 힘이 작용할 때 압력이 가장 큰 경우는?
o 넓은 면으로 누를 때
o* 좁은 면으로 누를 때
o 면적과 관계없이 같다
o 힘이 약할 때
:: 같은 힘이면 면적이 좁을수록 압력이 크다.

= 확인 문제 2
Q 기체의 압력에 대한 설명으로 옳은 것은?
o 아래쪽으로만 작용한다.
o 입자는 벽에 부딪힐 때만 움직인다.
o 용기를 차갑게 하면 압력이 커진다.
o* 입자가 벽에 충돌하는 횟수가 많을수록 압력이 크다.
:: 기체의 압력은 모든 방향으로 작용하고, 온도가 높을수록 크다.

= 확인 문제 3
Q 압력을 줄이기 위해 면적을 넓힌 예는?
o 칼날
o 압정 끝
o* 넓은 가방끈
o 못 끝
:: 나머지는 면적을 좁혀 압력을 키운 예이다.

= 확인 문제 4
Q 부피와 온도가 일정할 때 입자 수가 30개 → 90개가 되면 압력은? (30개일 때 0.5기압)
o 0.5기압
o 1.0기압
o* 1.5기압
o 4.5기압
:: 입자 수 3배 → 압력 3배: 0.5 × 3 = 1.5기압

= 서술형 도전 | 생각 넓히기
? 뾰족한 굽의 구두가 납작한 운동화보다 바닥에 자국을 더 잘 남기는 까닭을 '면적'과 '압력'을 넣어 쓰시오. :: 같은 몸무게(힘)가 더 좁은 면적에 작용하므로 바닥이 받는 압력이 크기 때문이다.
? 자전거 타이어에 공기를 더 넣으면 단단해지는 까닭을 입자의 수와 충돌 횟수로 설명하시오. :: 타이어 속 기체 입자 수가 많아져 타이어 안쪽 벽에 충돌하는 횟수가 늘어나고, 기체의 압력이 커져 타이어를 더 세게 밀기 때문이다.

= 오늘 배운 내용 정리
- 일정한 면적에 수직으로 작용하는 힘의 크기 = [[압력]]
- 같은 힘이면 면적이 [[좁을수록]] 압력이 크다.
- 기체의 압력은 입자가 용기 벽에 [[충돌]]하여 생긴다.
- 기체의 압력은 [[모든 방향]]으로 작용한다.
- 입자 수가 [[많을수록]], 온도가 [[높을수록]] 기체의 압력이 크다.

= 나가기 전 한 문제 | 형성평가
? 처음의 풍선이 한쪽만이 아니라 사방으로 둥글게 부푸는 까닭을 입자의 운동으로 쓰시오. :: 풍선 속 기체 입자가 모든 방향으로 움직이며 풍선 안쪽 벽 곳곳에 충돌하므로, 기체의 압력이 모든 방향으로 작용하기 때문이다.
