# 온도와 부피의 관계 | 데우면 왜 커질까? | 중학교 과학 1 · 06 기체의 성질 · 3차시 | 2022 개정 교육과정 [9과06-03]

= 오늘의 학습 목표 | 3차시
^ 실험 결과로부터 기체의 **온도와 부피의 관계**를 찾을 수 있다.
^ 온도와 부피의 관계를 **그래프**로 나타내고 해석할 수 있다.
^ 온도와 부피의 관계를 **입자 모형**으로 설명하고 생활 속 예를 분류할 수 있다.
% 흐름: 생각 열기 5분 → 측정·그래프 13분 → 입자 모형 10분 → 문항 10분 → 풍선 동굴 게임 7분

= 달각거리는 동전 | 생각 열기
* 🫙 빈 유리병 :: 입구에 물을 묻힌 동전을 올린다
* 🙌 두 손 :: 병을 감싸 쥐고 기다린다
* 🪙 잠시 뒤 :: 동전이 '달각' 하고 들썩인다!
? 아무도 건드리지 않았는데 동전은 왜 들썩였을까? :: 손의 열로 병 속 공기의 온도가 높아져 부피가 커지려 하며 동전을 밀어 올렸다.
% 실제 시연하면 효과가 큼 — 병을 냉장고에 두었다가 쓰면 더 잘 됨

= 지난 시간 복습 | 2차시
? 온도가 일정할 때 압력을 높이면 부피는? :: 작아진다 — 입자 사이의 거리가 가까워진다
? 압력이 커질 때 변하지 않는 것은? :: 입자의 수와 크기 (질량도 그대로)

## 온도와 부피 | 실험으로 찾기

= 시뮬레이션: 온도와 부피 | 실험실
@ sim.html#tv | 추 1개(1기압)를 그대로 두고 온도를 0 °C에서 100 °C까지 바꾸며 부피를 측정하자.
% 이번에는 압력이 통제 변인 — 지난 시간과 무엇이 바뀌었는지 먼저 묻기

= 측정 결과 | 압력 1기압
| 온도 (°C) | 0 | 20 | 40 | 60 | 80 | 100 |
|+ 부피 (mL) | 110 | 118 | 126 | 134 | 142 | 150 |
>+ 온도가 높아질수록 부피가 ==일정하게== 늘어난다.
>+ 압력이 일정할 때 온도가 높아지면 부피가 커진다.

= 그래프로 나타내기
C 온도와 부피 (압력 일정) | 온도 (°C) | 부피 (mL) | 부피:0,110 20,118 40,126 60,134 80,142 100,150
~ 점들이 직선 위에 놓인다 — 온도가 높아질수록 부피가 고르게 커진다
% 2022 개정 [9과06-03]: 실험 결과의 경향을 입자 모형으로 해석하는 데 주안점. 기울기를 이용한 부피 계산·외삽은 하지 않는다.

= 두 관계 비교
| | 압력과 부피 | 온도와 부피 |
| 일정하게 둔 것 | 온도 | 압력 |
| 관계 | 압력 ↑ → 부피 ↓ | 온도 ↑ → 부피 ↑ |
| 그래프 모양 | 곡선 | 직선 |

## 입자 모형으로 해석하기 | 더 빠르게, 더 세게

= 온도가 높아질 때 입자는?
| 온도가 높아질 때 | 변화 |
|+ 입자의 운동 속력 | **빨라진다** |
|+ 입자 사이의 거리 | **멀어진다** |
|+ 입자의 수 | 변하지 않는다 |
|+ 입자의 크기 | 변하지 않는다 |

= 피스톤이 올라가는 까닭
^+ 온도가 높아지면 입자의 운동이 **활발**해진다
^+ 입자가 피스톤에 **더 세게, 더 자주** 부딪힌다
^+ 피스톤이 밀려 올라가 입자 사이의 거리가 **멀어진다** → 부피 증가
>+ 반대로 온도가 낮아지면 부피는 ==작아진다==.

= 생활 속 온도와 부피 | 사례
* 🎈 열기구 :: 공기를 데우면 풍선이 부푼다
* 🏓 찌그러진 탁구공 :: 뜨거운 물에 넣으면 펴진다
* 🧊 냉동실 페트병 :: 빈 병이 찌그러진다
* ❄️ 추운 날 풍선 :: 밖에 두면 쪼그라든다
* 🚗 여름철 타이어 :: 공기를 조금 덜 넣는다
* 🍞 빵 반죽 :: 오븐 속에서 기체가 커져 부푼다

= 예제 1 · 찌그러진 탁구공 | 적용
- 찌그러진 탁구공을 뜨거운 물에 넣었더니 펴졌다.
^+ 공 속 공기의 온도 → **높아진다**
^+ 입자의 운동이 **활발해져** 공 안쪽 벽에 더 세게, 더 자주 부딪힌다
^+ 입자 사이의 거리가 멀어지며 부피가 **커져** 찌그러진 곳을 밀어낸다

= 예제 2 · 식히면? | 적용
- 빈 페트병의 뚜껑을 닫아 냉동실에 넣었더니 찌그러졌다.
^+ 병 속 공기의 온도 → **낮아진다**
^+ 입자의 운동이 **둔해지고** 입자 사이의 거리가 가까워진다
^+ 부피가 **작아져** 바깥 공기에 눌려 찌그러진다
>+ 입자의 수와 크기는 그대로 — 질량도 변하지 않는다.

= 예제 3 · 현상 분류하기 | 적용
- ㄱ. 열기구를 데우면 부푼다 ㄴ. 높은 산에서 과자 봉지가 부푼다 ㄷ. 냉동실 빈 페트병이 찌그러진다 ㄹ. 바닷속 공기 방울이 올라갈수록 커진다 ㅁ. 추운 날 풍선이 쪼그라든다
^+ 바깥 압력이 변함 → 압력과 부피: **ㄴ, ㄹ**
^+ 온도가 변함 → 온도와 부피: **ㄱ, ㄷ, ㅁ**

= 확인 문제 1
Q 압력이 일정할 때 기체의 온도를 높이면?
o* 부피가 커진다.
o 부피가 작아진다.
o 부피가 변하지 않는다.
o 입자의 수가 늘어난다.
:: 입자의 운동이 활발해져 입자 사이의 거리가 멀어진다.

= 확인 문제 2
Q 압력이 일정할 때 기체의 온도를 높였다. 변하지 **않는** 것끼리 고른 것은?
o 기체의 부피, 입자의 수
o* 입자의 수, 입자의 크기
o 입자의 크기, 입자의 운동 속력
o 기체의 부피, 입자의 운동 속력
:: 부피와 운동 속력은 커지고, 입자의 수와 크기는 그대로이다.

= 확인 문제 3
Q 온도와 부피의 관계로 설명할 수 있는 현상은?
o 높은 산에서 과자 봉지가 부푼다.
o 잠수부의 공기 방울이 올라갈수록 커진다.
o* 찌그러진 탁구공이 뜨거운 물에서 펴진다.
o 주사기를 누르면 부피가 줄어든다.
:: 나머지는 압력과 부피의 관계이다.

= 확인 문제 4
Q 압력이 일정할 때 기체의 온도와 부피의 관계를 나타낸 그래프로 옳은 것은?
o* 온도가 높아질수록 부피가 고르게 커지는 직선
o 온도가 높아질수록 부피가 작아지는 곡선
o 온도와 관계없이 부피가 일정한 수평선
o 온도가 높아질수록 부피가 작아지는 직선
:: 시뮬레이션에서 0 °C 110 mL → 100 °C 150 mL로, 점들이 오른쪽 위로 올라가는 직선 위에 놓였다.

= 서술형 도전 | 생각 넓히기
? 주사기에 공기를 넣고 입구를 막은 뒤 얼음물에 넣었다. 피스톤이 움직이는 방향과 까닭을 입자 모형으로 쓰시오. :: 안쪽으로 들어간다. 온도가 낮아져 입자의 운동이 둔해지고 입자 사이의 거리가 가까워져 부피가 줄어들기 때문이다.
? 여름철 뜨거운 도로를 달릴 자동차 타이어에 공기를 겨울보다 조금 덜 넣는 까닭을 쓰시오. :: 타이어 속 공기의 온도가 높아지면 입자의 운동이 활발해져 압력과 부피가 커지므로, 너무 많이 넣으면 타이어가 지나치게 팽팽해져 터질 위험이 있기 때문이다.
