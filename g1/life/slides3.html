* 🐞 무당벌레 A :: 점이 2개

* 🐞 무당벌레 C :: 점이 거의 없고 검은 바탕에 빨간 점
? 셋은 모두 같은 종(무당벌레)이다. 그런데 왜 다를까? :: 같은 종이라도 개체마다 형질이 조금씩 다르다 — 이것을 **변이**라고 한다.

## 생물다양성 | 다양함의 세 가지 얼굴

= 생물다양성이란?
! 일정한 지역에 사는 생물의 다양한 정도
| 구분 | 뜻 |
|+ 생태계 다양성 | 숲, 갯벌, 사막, 바다 등 **생태계**의 다양한 정도 |
|+ 종 다양성 | 한 지역에 사는 **생물 종**의 다양한 정도 |
|+ 유전적 다양성 | **같은 종 안에서** 유전자가 다양한 정도 |

= 생물다양성의 예 | 사례
* 🌲 숲·갯벌·사막 :: 서로 다른 생태계 → 생태계 다양성
* 🦋 한 숲의 나비 50종 :: 여러 종이 함께 산다 → 종 다양성
* 🐕 개의 품종 :: 진돗개·푸들·치와와 → 유전적 다양성
* 🍎 사과의 품종 :: 부사·홍옥·아오리 → 유전적 다양성
* 🐦 갈라파고스 핀치 :: 섬마다 먹이가 달라 부리 모양이 다양
* 🌾 토종 벼 :: 지역마다 다른 품종이 전해 내려옴

= 종 다양성 비교하기
| 지역 | 사는 나무 | 종의 수 |
| (가) | 소나무 100그루 | 1종 |
| (나) | 소나무 30, 참나무 30, 단풍나무 40그루 | 3종 |
>+ 나무 수는 100그루로 같지만 ==(나)==가 종 다양성이 높다.
? (나)의 숲에 소나무만 걸리는 병이 돌면? :: 소나무 30그루가 피해를 입어도 참나무·단풍나무 70그루가 남는다. (가)는 100그루 모두 위험하다.

## 변이와 생물다양성 | 환경에 맞는 변이가 살아남는다

= 변이란?
! 같은 종의 개체 사이에서 나타나는 형질의 차이
- 예: 무당벌레의 등 무늬, 사람의 눈 색깔·키, 나방의 날개 색
+ 사람과 고양이의 털 차이 → 서로 **다른 종**이므로 변이가 아니다.
>+ 변이는 ==같은 종 안에서== 나타나는 차이!

= 시뮬레이션: 나무껍질 색과 나방 | 실험실
@ sim.html#vary | 어두운 나무껍질 숲에서 5세대 진행 → 밝은 숲에서 처음부터 다시 5세대. 나방 색 분포를 비교하자.
% 새는 나무껍질과 색이 다른 나방을 더 잘 찾아 잡아먹는다는 설정을 먼저 안내

= 나방 색 변화를 계산해 보면 | 어두운 숲, 처음 어두운 나방 40 · 밝은 나방 40
^+ 새에게 잡아먹히는 비율: 밝은 나방 **50 %**, 어두운 나방 **10 %**
^+ 살아남은 나방: 어두운 40 × 0.9 = **36**, 밝은 40 × 0.5 = **20**
^+ 다음 세대 80마리도 같은 비율로 → 어두운 80 × 36/56 ≈ **51**, 밝은 ≈ **29**
>+ 한 세대 만에 어두운 나방의 비율이 50 % → 약 64 %로!

= 세대가 거듭되면 | 같은 규칙으로 계속 계산
C 어두운 숲에서 나방 색의 비율 변화 | 세대 | 비율 (%) | 어두운 나방:0,50 1,64.3 2,76.4 3,85.4 4,91.3 5,95 | 밝은 나방:0,50 1,35.7 2,23.6 3,14.6 4,8.7 5,5
~ 5세대 뒤 어두운 나방이 약 95 % — 환경에 잘 맞는 변이가 늘어난다

= 변이가 생물다양성을 만든다
^+ 같은 종에도 여러 **변이**가 있다
^+ 환경에 잘 맞는 변이를 가진 개체가 **더 많이 살아남아** 자손을 남긴다
^+ 환경이 다른 곳에서 오랜 세월 반복되면 서로 다른 특징을 가진 무리가 생긴다
>+ 그 결과 ==생물다양성이 커진다==. 변이는 생물다양성의 바탕!

= 갈라파고스 핀치의 부리 | 사례
* 🌰 단단한 씨앗을 먹는 섬 :: 굵고 짧은 부리
* 🐛 곤충을 먹는 섬 :: 가늘고 긴 부리
* 🌵 선인장을 먹는 섬 :: 길고 뾰족한 부리
- 처음 섬에 온 핀치 무리에도 부리 모양의 **변이**가 있었다.
- 섬마다 먹이에 맞는 부리를 가진 핀치가 더 많이 살아남았다.

= 예제 1 · 변이 골라내기 | 적용
- ① 같은 종인 무당벌레의 등 무늬가 다르다 ② 사람과 고양이의 털 모양이 다르다 ③ 같은 반 친구들의 키가 다르다 ④ 개구리와 두꺼비의 피부가 다르다
^+ 같은 종 안의 차이인가? ① 무당벌레끼리 ✔ ③ 사람끼리 ✔
^+ ②, ④는 **서로 다른 종** 사이의 차이
!+ 변이: ①, ③

= 예제 2 · 밝은 숲이라면? | 적용
- 밝은 나무껍질 숲, 처음 밝은 40 · 어두운 40. 이번엔 어두운 나방이 50 %, 밝은 나방이 10 % 잡아먹힌다.
^+ 살아남은 나방: 밝은 40 × 0.9 = **36**, 어두운 40 × 0.5 = **20**
^+ 다음 세대 80마리: 밝은 ≈ **51**, 어두운 ≈ **29**
>+ 환경이 바뀌면 살아남기 유리한 변이도 바뀐다!

= 예제 3 · 변이가 없다면? | 적용
- 처음부터 모든 나방이 밝은 색이었는데, 숲의 나무껍질이 어두워졌다.
^+ 모든 나방이 눈에 잘 띈다 → 대부분 **잡아먹힌다**
^+ 환경에 맞는 변이를 가진 개체가 **없다**
^+ 무리 전체가 사라질 수도 있다
>+ 변이가 있어야 환경 변화에 ==적응==할 수 있다.

= 확인 문제 1
Q 같은 종 안에서 유전자가 다양한 정도를 무엇이라고 할까?
o 생태계 다양성
o 종 다양성
o* 유전적 다양성
o 변이
:: 같은 종 안의 유전자의 다양함은 유전적 다양성이다.

= 확인 문제 2
Q 변이의 예로 옳은 것은?
o 사자와 호랑이의 무늬가 다르다.
o* 같은 품종 강아지들의 털 색이 조금씩 다르다.
o 소나무와 참나무의 잎 모양이 다르다.
o 고래와 상어의 크기가 다르다.
:: 변이는 같은 종의 개체 사이에서 나타나는 차이이다.

= 확인 문제 3
Q 어두운 숲에서 세대가 거듭될수록 어두운 나방이 많아지는 까닭은?
o 밝은 나방이 스스로 색을 바꾸기 때문
o* 어두운 나방이 새의 눈에 덜 띄어 더 많이 살아남아 자손을 남기기 때문
o 새가 어두운 나방만 좋아하기 때문
o 나무껍질 색이 나방에게 옮겨지기 때문
:: 환경에 잘 맞는 변이를 가진 개체가 더 많이 살아남아 자손을 남긴다.

= 확인 문제 4
Q 바나나는 대부분 유전적으로 거의 같은 품종을 재배한다. 이때 가장 걱정되는 점은?
o 맛이 너무 다양해진다.
o* 치명적인 병이 퍼지면 대부분이 한꺼번에 피해를 입는다.
o 종 다양성이 지나치게 높아진다.
o 생태계 다양성이 높아진다.
:: 유전적 다양성이 낮으면 병에 견디는 변이를 가진 개체가 거의 없다.

= 서술형 도전 | 생각 넓히기
? 생물다양성의 세 가지 의미를 쓰고, 각각의 예를 하나씩 드시오. :: 생태계 다양성(숲·갯벌·사막), 종 다양성(한 숲에 사는 여러 종의 나비), 유전적 다양성(개의 여러 품종, 사람의 다양한 눈 색).
? 변이가 생물다양성을 크게 만드는 과정을 '환경'을 넣어 설명하시오. :: 같은 종 안에 여러 변이가 있고, 환경에 잘 맞는 변이를 가진 개체가 더 많이 살아남아 자손을 남긴다. 환경이 서로 다른 곳에서 이 과정이 오래 반복되면 서로 다른 특징을 가진 생물이 생겨 생물다양성이 커진다.

= 오늘 배운 내용 정리
- 생물다양성 = [[생태계]] 다양성 + [[종]] 다양성 + [[유전적]] 다양성
- 같은 종의 개체 사이에서 나타나는 형질의 차이 = [[변이]]
- 환경에 잘 맞는 변이를 가진 개체가 더 많이 [[살아남아]] 자손을 남긴다.
- 변이는 생물다양성의 [[바탕]]이 된다.

= 나가기 전 한 문제 | 형성평가
? 처음의 무당벌레 세 마리처럼 등 무늬가 다양한 것이 무당벌레 무리 전체에 유리한 까닭을 쓰시오. :: 환경이 변하거나 새로운 천적·병이 나타나도 그 환경에 맞는 변이를 가진 개체가 살아남을 수 있어 무리가 유지될 수 있다.
