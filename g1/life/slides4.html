## 종과 분류 체계 | 분류의 기본 단위

= 종이란?
! 자연 상태에서 짝짓기를 하여 ==생식 능력이 있는 자손==을 낳을 수 있는 생물 무리
- 종은 생물 분류의 **기본 단위**이다.
+ 진돗개 × 푸들 → 강아지도 새끼를 낳을 수 있다 → **같은 종**(개)
+ 말 × 당나귀 → 노새는 생식 능력이 **없다** → 말과 당나귀는 **다른 종**
% 생김새가 달라도 같은 종일 수 있고(개의 품종), 비슷해도 다른 종일 수 있음(말·당나귀)

= 분류 단계
! 종 < 속 < 과 < 목 < 강 < 문 < 계
| 단계 | 호랑이 | 고양이 |
|+ 계 | 동물계 | 동물계 |
|+ 강 | 포유강 | 포유강 |
|+ 과 | 고양이과 | 고양이과 |
|+ 속 | 표범속 | 고양이속 |
>+ 같은 단계에 속할수록 ==공통점이 많다== — 호랑이와 고양이는 '과'까지 같다.

= 분류 단계 외우기
* 🔤 순서 :: 종 → 속 → 과 → 목 → 강 → 문 → 계
* 💡 기억법 :: "종속과목 강문계" — 작은 것에서 큰 것으로
* 🏠 주소처럼 :: 계(나라) → 문(도) → 강(시) → … → 종(집)
% 주소 비유는 큰 것 → 작은 것 순서이므로 방향을 헷갈리지 않게 안내

## 5계 분류 | 핵막 · 세포벽 · 광합성

= 5계를 나누는 기준
| 계 | 핵막 | 세포벽 | 광합성 | 예 |
|+ 원핵생물계 | 없다 | 있다 | 일부 | 대장균, 젖산균, 남세균 |
|+ 원생생물계 | 있다 | 일부 | 일부 | 짚신벌레, 아메바, 미역 |
|+ 균계 | 있다 | 있다 | 하지 않음 | 버섯, 곰팡이, 효모 |
|+ 식물계 | 있다 | 있다 | 한다 | 소나무, 고사리, 이끼 |
|+ 동물계 | 있다 | 없다 | 하지 않음 | 고양이, 나비, 해파리 |

= 각 계의 특징 | 사례
* 🦠 원핵생물계 :: 핵막이 없어 유전 물질이 세포질에 퍼져 있다
* 🌊 원생생물계 :: 핵막은 있지만 조직이 발달하지 않음 — 미역·다시마도 여기!
* 🍄 균계 :: 균사로 되어 있고 광합성을 못해 다른 생물에서 양분을 얻는다
* 🌳 식물계 :: 다세포, 엽록체로 광합성
* 🐈 동물계 :: 다세포, 세포벽이 없고 먹이를 먹는다
% 미역은 식물, 버섯은 식물, 해파리는 식물이 아닌가? — 흔한 오개념 세 가지를 꼭 짚기

= 분류 열쇠로 나누기
^+ 핵막이 있는가? 아니요 → **원핵생물계**
^+ 예 → 광합성을 하는 다세포인가? 예 → **식물계**
^+ 아니요 → 균사로 되어 있고 세포벽이 있는가? 예 → **균계**
^+ 아니요 → 다세포이고 세포벽이 없는가? 예 → **동물계**
^+ 그 밖의 생물 → **원생생물계**

= 예제 1 · 같은 종일까? | 적용
- 호랑이와 사자 사이에서 태어난 라이거는 대부분 자손을 낳지 못한다.
^+ 종의 조건 → 생식 능력이 있는 자손
^+ 라이거 → 생식 능력이 **없다**
^+ 결론: 호랑이와 사자는 **다른 종**
>+ '새끼가 태어나는가'가 아니라 '그 새끼가 다시 새끼를 낳을 수 있는가'가 기준!

= 예제 2 · 분류 단계로 가까운 정도 비교 | 적용
| 단계 | 개 | 늑대 | 고양이 |
| 과 | 개과 | 개과 | 고양이과 |
| 속 | 개속 | 개속 | 고양이속 |
^+ 개와 늑대 → **속**까지 같다
^+ 개와 고양이 → **목**(식육목)까지만 같다
!+ 개는 고양이보다 늑대와 더 가깝다

= 예제 3 · 버섯은 왜 균계일까? | 적용
- 버섯은 예전에 식물로 여겨졌다.
^+ 엽록체가 있는가? → **없다** → 광합성을 못한다
^+ 양분은? → 죽은 생물·다른 생물에서 **흡수**
^+ 몸의 구조 → 가는 실 같은 **균사**로 되어 있다
!+ 버섯은 식물계가 아닌 균계

= 확인 문제 1
Q 생물 분류의 기본 단위는?
o 계
o 문
o 과
o* 종
:: 종은 생식 능력이 있는 자손을 낳을 수 있는 무리로, 분류의 기본 단위이다.

= 확인 문제 2
Q 분류 단계를 작은 것부터 순서대로 나열한 것은?
o* 종 < 속 < 과 < 목 < 강 < 문 < 계
o 종 < 과 < 속 < 목 < 강 < 문 < 계
o 계 < 문 < 강 < 목 < 과 < 속 < 종
o 종 < 속 < 목 < 과 < 문 < 강 < 계
:: 기억법 '종속과목 강문계'.

= 확인 문제 3
Q 핵막이 없는 생물이 속하는 계는?
o* 원핵생물계
o 원생생물계
o 균계
o 동물계
:: 대장균·젖산균·남세균은 핵막이 없는 원핵생물이다.

= 확인 문제 4
Q 다음 중 원생생물계에 속하는 것은?
o 버섯
o 고사리
o* 미역
o 해파리
:: 미역은 광합성을 하지만 조직이 발달하지 않아 원생생물계. 버섯은 균계, 고사리는 식물계, 해파리는 동물계.

= 확인 문제 5
Q 효모와 푸른곰팡이가 속하는 계의 특징으로 옳은 것은?
o 핵막이 없다.
o 광합성을 한다.
o* 세포벽이 있고 광합성을 하지 않는다.
o 세포벽이 없다.
:: 효모·곰팡이는 균계 — 핵막과 세포벽이 있고 광합성을 하지 않는다.

= 서술형 도전 | 생각 넓히기
? 해파리는 바다를 떠다니고 투명해서 식물이나 원생생물로 착각하기 쉽다. 해파리가 동물계에 속하는 까닭을 쓰시오. :: 해파리는 여러 세포로 된 다세포 생물이고, 세포벽이 없으며 광합성을 하지 않고 먹이를 잡아먹어 양분을 얻기 때문이다.
? 진돗개와 푸들은 생김새가 매우 다르지만 같은 종이다. 그 까닭을 종의 뜻을 이용해 쓰시오. :: 둘이 짝짓기를 해서 낳은 새끼가 자라서 다시 생식 능력이 있는 자손을 낳을 수 있기 때문이다.

= 나가기 전 한 문제 | 형성평가
? 남세균은 광합성을 하지만 식물계가 아니다. 그 까닭을 분류 기준을 들어 쓰시오. :: 남세균은 핵막이 없는 원핵생물이므로 원핵생물계에 속한다. 식물계는 핵막이 있는 다세포 생물이다.
