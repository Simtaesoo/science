= 하천에 놓아준 거북 한 마리 | 생각 열기
* 🐢 붉은귀거북 :: 애완용으로 들여와 하천에 버려졌다
* 🐟 토종 물고기 :: 알과 어린 물고기가 먹이가 된다
* 🌿 수초 :: 먹이와 숨을 곳이 줄어든다
? 좋은 마음으로 놓아준 것인데 왜 문제가 될까? :: 원래 살지 않던 외래종이 되어 토종 생물을 잡아먹고 서식지를 빼앗아 생물다양성을 줄인다.
% 붉은귀거북은 생태계 교란 생물로 지정되어 있음

## 생물다양성은 왜 중요할까? | 우리 삶과 이어진 다양성

= 생물다양성이 중요한 까닭
| 까닭 | 설명 |
|+ 생태계 안정 | 먹이 관계가 복잡할수록 한 종이 줄어도 다른 먹이가 있어 **안정** |
|+ 생물 자원 | 식량, 의약품, 옷감, 목재를 생물에게서 얻는다 |
|+ 생태계 서비스 | 맑은 공기와 물, 휴식·여가 공간 제공 |
>+ 생물다양성이 줄면 결국 ==사람의 삶==도 위협받는다.

= 생물에게서 얻은 선물 | 사례
* 🌿 버드나무 껍질 :: 해열·진통제 아스피린의 실마리
* 🍞 푸른곰팡이 :: 항생제 페니실린
* 🐛 누에 :: 비단 옷감
* 🌾 야생 벼 :: 병에 강한 품종을 만드는 유전자
* 🦀 투구게의 피 :: 의약품·주사기 오염 검사
* 🐝 꿀벌 :: 농작물의 꽃가루받이

= 먹이 그물과 생태계 안정
- 먹이 관계가 **단순한** 생태계: 토끼만 먹는 여우 → 토끼가 줄면 여우도 위험
+ 먹이 관계가 **복잡한** 생태계: 토끼·들쥐·새를 먹는 여우 → 다른 먹이로 버틴다
>+ 종이 다양할수록 먹이 그물이 복잡해져 생태계가 ==안정==된다.
% 칠판에 단순/복잡한 먹이 그물을 그려 한 종을 지워 보는 활동

## 생물다양성을 위협하는 것 | 원인을 알아야 지킬 수 있다

= 위협 요인 네 가지
| 요인 | 예 |
|+ 서식지 파괴 | 숲을 없애고 도로·건물을 짓는다, 갯벌을 매립한다 |
|+ 외래종 | 황소개구리, 큰입배스가 토종 생물을 잡아먹는다 |
|+ 남획 | 지나치게 많이 잡아 멸종 위기에 처한다 |
|+ 환경 오염·기후 변화 | 물과 흙이 오염되고 서식 환경이 바뀐다 |

= 시뮬레이션: 다양성 보전 | 실험실
@ sim.html#protect | 위협 요인을 하나씩 켜서 종 수 변화를 보고, 보전 노력을 함께 켜서 효과를 비교하자.
% 각 조건마다 '처음으로'를 누르고 30초 뒤 종 수를 기록 — 학습지 3번 표

= 30초 뒤 남은 종 수 | 처음 40종에서 시작
| 조건 | 30초 뒤 남은 종 수 (약) |
|+ 서식지 파괴만 | 14종 |
|+ 서식지 파괴 + 보호 구역 + 생태 통로 | 37종 |
|+ 외래종만 | 25종 |
|+ 외래종 + 외래종 관리 | 38종 |
>+ 위협 요인에 ==맞는== 보전 방법을 쓸 때 피해가 크게 줄어든다.
~ 시뮬레이션의 대략적인 값 — 실행할 때마다 조금씩 다를 수 있다

= 보전 방법 | 개인 · 사회 · 국가
| 수준 | 보전 방법 |
|+ 개인 | 일회용품 줄이기, 외래 생물을 자연에 버리지 않기, 정해진 길로만 다니기 |
|+ 사회 | 보호 구역 지정, 생태 통로 설치, 하천 복원 |
|+ 국가·국제 | 멸종 위기종 지정, 종자 은행, 국제 협약 |
>+ 개인·사회·국가가 ==함께== 노력해야 지속가능하다.

= 우리나라의 보전 노력 | 사례
* 🦌 생태 통로 :: 도로로 나뉜 산을 연결해 동물이 지나다니게
* 🌱 종자 은행 :: 다양한 식물의 씨앗을 보관해 미래에 대비
* 🦅 멸종 위기종 복원 :: 반달가슴곰, 황새, 여우를 다시 자연으로
* 🏞️ 국립 공원 :: 생태계를 보호 구역으로 지정
* 🚫 생태계 교란 생물 :: 황소개구리·붉은귀거북 지정과 관리

= 예제 1 · 줄어든 비율 계산 | 적용
- 처음 40종이 살던 곳에서 서식지 파괴 후 14종이 남았다.
^+ 줄어든 종 수 = 40 − 14 = **26종**
^+ 줄어든 비율 = 26 ÷ 40 × 100 = **65 %**
^+ 보호 구역과 생태 통로를 쓰면 37종 → 줄어든 비율 3 ÷ 40 × 100 = **7.5 %**
>+ 보전 방법으로 피해를 65 % → 7.5 %로 크게 줄였다!

= 예제 2 · 알맞은 보전 방법 고르기 | 적용
| 문제 | 원인 | 알맞은 방법 |
|+ 도로 때문에 고라니가 차에 치인다 | 서식지 분리 | [[생태 통로]] |
|+ 하천에 큰입배스가 늘었다 | 외래종 | [[외래종 관리·포획]] |
|+ 희귀한 난초를 몰래 캐 간다 | 남획 | [[보호 구역, 채취 금지]] |
>+ 원인을 먼저 찾아야 효과적인 방법을 고를 수 있다.

= 예제 3 · 먹이 그물 추론 | 적용
- 어느 숲에서 여우가 토끼·들쥐·꿩을 먹는다. 병으로 토끼가 크게 줄었다.
^+ 여우의 먹이 → 들쥐·꿩이 남아 있다
^+ 여우 → 다른 먹이를 먹고 **살아남는다**
^+ 만약 여우가 토끼만 먹었다면 → 여우도 **크게 줄었을 것**
>+ 종이 다양할수록 생태계는 변화에 잘 버틴다.

= 확인 문제 1
Q 생태 통로를 설치하는 까닭으로 옳은 것은?
o 외래종이 들어오지 못하게 막기 위해
o* 도로로 나뉜 서식지를 연결해 동물이 이동할 수 있게 하기 위해
o 동물을 한곳에 모아 기르기 위해
o 사냥을 쉽게 하기 위해
:: 생태 통로는 끊어진 서식지를 이어 준다.

= 확인 문제 2
Q 생물다양성을 위협하는 요인과 예가 바르게 짝 지어지지 **않은** 것은?
o 서식지 파괴 — 갯벌 매립
o 외래종 — 황소개구리
o 남획 — 멸종 위기종을 지나치게 잡기
o* 환경 오염 — 생태 통로 설치
:: 생태 통로 설치는 위협 요인이 아니라 보전 방법이다.

= 확인 문제 3
Q 푸른곰팡이에서 얻은 의약품은?
o 아스피린
o* 페니실린
o 백신
o 비타민
:: 푸른곰팡이 → 페니실린, 버드나무 → 아스피린.

= 확인 문제 4
Q 생물다양성 보전을 위해 개인이 할 수 있는 일로 알맞은 것은?
o 멸종 위기종을 법으로 지정한다.
o 국제 협약을 맺는다.
o* 키우던 외래 생물을 자연에 버리지 않는다.
o 국립 공원을 새로 지정한다.
:: 나머지는 국가·국제 수준의 노력이다.

= 서술형 도전 | 생각 넓히기
? 키우던 거북을 하천에 놓아주면 안 되는 까닭을 '외래종'을 넣어 쓰시오. :: 외래종이 되어 토종 생물을 잡아먹거나 서식지를 빼앗아 생물다양성을 줄일 수 있기 때문이다.
? 생물다양성이 높은 생태계가 더 안정한 까닭을 '먹이 그물'을 넣어 설명하시오. :: 종이 다양하면 먹이 그물이 복잡해져 한 종이 줄어도 다른 먹이로 대신할 수 있으므로, 생태계 전체가 크게 흔들리지 않는다.

= 우리 학교 생물다양성 실천 계획 | 적용 미션
| 항목 | 예 |
| 조사한 문제 | 학교 화단에 풀이 사라지고 곤충이 줄었다 |
| 원인 (위협 요인) | 화단을 밟고 다님, 쓰레기 |
| 나의 실천 | 정해진 길로 다니기, 쓰레기 줍기 |
| 우리 반 실천 | 화단에 토종 식물 심기, 곤충 호텔 만들기 |
- **실천 기간과 확인 방법**(사진, 관찰 기록)까지 정해 발표하자.

- 생물다양성이 높을수록 먹이 그물이 복잡해 생태계가 [[안정]]된다.
- 위협 요인: 서식지 파괴, [[외래종]], [[남획]], 환경 오염·기후 변화
- 도로로 나뉜 서식지를 잇는 시설 = [[생태 통로]]
- 다양한 식물의 씨앗을 보관 = [[종자 은행]]
- 보전은 개인·사회·[[국가]]가 함께 노력해야 한다.
