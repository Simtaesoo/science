# 생물의 구성 단계 | 세포에서 개체까지 | 중학교 과학 1 · 02 생물의 구성과 다양성 · 2차시 | 2022 개정 교육과정 [9과02-02]

= 오늘의 학습 목표 | 2차시
^ 세포 → 조직 → 기관 → 개체로 이어지는 **유기적 구성 단계**를 설명할 수 있다.
^ 동물과 식물의 구성 단계를 **비교·분석**할 수 있다.
^ 주어진 예를 구성 단계 순서대로 **배열**할 수 있다.
% 흐름: 생각 열기 5분 → 구성 단계 12분 → 동식물 비교 10분 → 문항 10분 → 모형 만들기 8분

= 레고 블록으로 도시 만들기 | 생각 열기
* 🧱 블록 하나 :: 가장 작은 단위
* 🧱 벽 :: 같은 블록을 이어 붙임
* 🏠 집 :: 벽·지붕·창문이 모여 쓰임이 생김
* 🏙️ 마을 → 도시 :: 집과 도로가 모여 하나의 도시
? 우리 몸도 이렇게 '작은 것 → 큰 것'으로 짜여 있을까? :: 그렇다. 세포 → 조직 → 기관 → 기관계 → 개체의 단계로 짜여 있다.

= 지난 시간 복습 | 1차시
| 질문 | 답 |
| 생물을 이루는 기본 단위는? | [[세포]] |
| 에너지를 만드는 구조는? | [[마이토콘드리아]] |
| 식물 세포에만 있는 구조는? | [[세포벽, 엽록체]] |
? 근육 세포와 신경 세포의 모양이 다른 까닭은? :: 하는 일이 다르기 때문 — 모양은 기능과 관련 있다.

## 유기적 구성 단계 | 작은 것이 모여 큰 일을

= 구성 단계 다섯 가지
| 단계 | 뜻 |
|+ 세포 | 생물을 이루는 기본 단위 |
|+ 조직 | 모양과 기능이 비슷한 **세포의 모임** |
|+ 조직계 | 여러 조직이 모여 일정한 기능을 하는 단계 (식물에만) |
|+ 기관 | 여러 조직(조직계)이 모여 **특정 기능**을 하는 단계 |
|+ 기관계 | 관련된 기능을 하는 **기관의 모임** (동물에만) |
|+ 개체 | 독립하여 생명 활동을 하는 하나의 생물 |

= '유기적'이란?
! 각 부분이 서로 긴밀하게 연결되어 하나의 전체로 작용하는 것
- 위 하나만 있어서는 소화가 끝나지 않는다.
+ 입 → 식도 → 위 → 작은창자 → 큰창자가 **함께 일해야** 소화가 된다.
+ 소화계는 다시 순환계·호흡계와 협력해 몸 전체를 살린다.
>+ 생물은 각 단계가 협력하는 ==유기적 구성==을 가진다.

= 동물: 사람의 예
^+ **세포** — 근육 세포
^+ **조직** — 근육 조직 (근육 세포의 모임)
^+ **기관** — 위, 심장 (여러 조직이 모임)
^+ **기관계** — 소화계, 순환계 (관련된 기관의 모임)
^+ **개체** — 사람
% 사람의 기관계: 소화계, 순환계, 호흡계, 배설계, 신경계 등

= 식물: 장미의 예
^+ **세포** — 표피 세포
^+ **조직** — 표피 조직 (비슷한 세포의 모임)
^+ **조직계** — 표피 조직계 (여러 조직이 모임)
^+ **기관** — 잎, 뿌리
^+ **개체** — 장미
> 식물의 기관 — 영양 기관: **뿌리, 줄기, 잎** / 생식 기관: **꽃, 열매**

= 동물과 식물 한눈에 비교
| 구분 | 1 | 2 | 3 | 4 | 5 | 6 |
| 동물 | 세포 | 조직 | — | 기관 | 기관계 | 개체 |
| 식물 | 세포 | 조직 | 조직계 | 기관 | — | 개체 |
>+ 동물에만 있는 단계 = ==기관계== / 식물에만 있는 단계 = ==조직계==
? 식물은 왜 기관계가 없을까? :: 스스로 광합성으로 양분을 만들고 이동하지 않아, 먹이를 찾고 소화하고 움직이는 여러 기관이 함께 일하는 기관계가 필요하지 않다.

= 시뮬레이션: 구성 단계 막대 | 실험실
@ sim.html#level | 구성 단계 막대를 움직이며 동물(사람)과 식물(장미)이 어떻게 짜여 있는지 비교하자.
% 막대를 같은 위치에 두고 동물·식물 화면을 번갈아 보여 주면 '빠진 단계'가 잘 드러남

## 배열하고 분석하기 | 어느 단계일까?

= 사람의 기관계 | 사례
* 🍽️ 소화계 :: 입, 식도, 위, 작은창자, 큰창자, 간, 이자
* ❤️ 순환계 :: 심장, 혈관 — 물질 운반
* 🫁 호흡계 :: 코, 기관, 폐 — 기체 교환
* 🚽 배설계 :: 콩팥, 방광 — 노폐물 내보냄
* 🧠 신경계 :: 뇌, 척수, 신경 — 자극 전달과 반응
* 🦴 운동계 :: 뼈, 근육 — 몸을 지탱하고 움직임

= 예제 1 · 동물 구성 단계 배열 | 적용
- ㄱ. 심장 ㄴ. 심장 근육 세포 ㄷ. 순환계 ㄹ. 심장 근육 조직 ㅁ. 사람
^+ 가장 작은 단위: 세포 → **ㄴ**
^+ 세포의 모임: 조직 → **ㄹ**
^+ 조직이 모인 기관 → **ㄱ**, 기관의 모임 → **ㄷ**, 하나의 생물 → **ㅁ**
!+ ㄴ → ㄹ → ㄱ → ㄷ → ㅁ

= 예제 2 · 식물 구성 단계 배열 | 적용
- ㄱ. 잎 ㄴ. 공변세포 ㄷ. 표피 조직 ㄹ. 표피 조직계 ㅁ. 해바라기
^+ 세포 → **ㄴ** (공변세포)
^+ 조직 → **ㄷ**, 조직계 → **ㄹ**
^+ 기관 → **ㄱ** (잎), 개체 → **ㅁ**
!+ ㄴ → ㄷ → ㄹ → ㄱ → ㅁ
>+ 식물에는 '기관계'가 없으니 기관 다음이 바로 개체!

= 예제 3 · 단계 골라내기 | 적용
- 뼈 세포, 작은창자, 줄기, 신경계 중 '기관'을 모두 고르자.
^+ 뼈 세포 → **세포**
^+ 작은창자 → 소화계를 이루는 **기관** ✔
^+ 줄기 → 식물의 영양 **기관** ✔
^+ 신경계 → 기관이 모인 **기관계**
!+ 기관: 작은창자, 줄기

= 확인 문제 1
Q 모양과 기능이 비슷한 세포의 모임을 무엇이라고 할까?
o 기관
o* 조직
o 기관계
o 개체
:: 비슷한 세포가 모이면 조직, 여러 조직이 모이면 기관이다.

= 확인 문제 2
Q 동물에는 없고 식물에만 있는 구성 단계는?
o 조직
o 기관
o 기관계
o* 조직계
:: 조직계는 식물에만, 기관계는 동물에만 있다.

= 확인 문제 3
Q 다음 중 기관계에 해당하는 것은?
o 위
o 근육 조직
o* 호흡계
o 뿌리
:: 위·뿌리는 기관, 근육 조직은 조직이다. 호흡계는 코·기관·폐가 모인 기관계이다.

= 확인 문제 4
Q 식물의 생식 기관으로 옳은 것은?
o 뿌리, 줄기
o 잎, 줄기
o* 꽃, 열매
o 뿌리, 잎
:: 뿌리·줄기·잎은 영양 기관, 꽃·열매는 생식 기관이다.

= 서술형 도전 | 생각 넓히기
? 소화계를 이루는 기관을 세 가지 이상 쓰고, 이 기관들이 '유기적'으로 일한다는 뜻을 설명하시오. :: 입, 식도, 위, 작은창자, 큰창자 등. 음식물이 차례로 지나가며 각 기관이 맡은 일을 이어서 해야 소화와 흡수가 완성되므로, 서로 긴밀하게 연결되어 하나의 기능을 한다.
? 식물의 구성 단계가 동물보다 단순한 까닭을 생활 방식과 관련지어 쓰시오. :: 식물은 스스로 광합성으로 양분을 만들고 이동하지 않으므로, 먹이를 찾고 소화하고 움직이기 위해 여러 기관이 함께 일하는 기관계가 필요하지 않다.

= 모형 만들기 · 학교도 하나의 개체? | 적용 미션
| 단계 | 학교에 비유하면 (예) |
| 세포 | 학생 한 명 |
| 조직 | 한 반 |
| 기관 | 한 학년 |
| 기관계 | 학생회, 교무부 등 |
| 개체 | 학교 |
- 모둠별로 **다른 비유**(병원, 도시, 축구팀)를 만들고 그렇게 정한 까닭을 발표하자.
% 비유의 한계(학생은 세포처럼 분열하지 않음)도 함께 짚어 주면 좋음

= 오늘 배운 내용 정리
- 모양과 기능이 비슷한 세포의 모임 = [[조직]]
- 여러 조직이 모여 특정 기능을 하는 단계 = [[기관]]
- 동물: 세포 → 조직 → 기관 → [[기관계]] → 개체
- 식물: 세포 → 조직 → [[조직계]] → 기관 → 개체
- 각 단계가 긴밀하게 협력하는 구성 = [[유기적]] 구성

= 나가기 전 한 문제 | 형성평가
? '위 근육 세포, 소화계, 위, 사람, 위 근육 조직'을 작은 단계부터 순서대로 쓰시오. :: 위 근육 세포 → 위 근육 조직 → 위 → 소화계 → 사람
