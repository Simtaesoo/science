## 세포의 구조 | 작은 방 안의 일꾼들

= 세포란?
! 생물을 이루는 기본 단위 = 생명 활동이 일어나는 기본 단위
- 모든 생물은 **하나 이상의 세포**로 이루어져 있다.
+ 짚신벌레·대장균 → 세포 하나로 된 생물
+ 사람 → 수십조 개의 세포로 된 생물
>+ 세포 안에는 서로 다른 일을 하는 여러 구조가 있다.

= 세포를 이루는 구조
| 구조 | 하는 일 |
|+ 핵 | 유전 물질(DNA)이 있어 생명 활동을 **조절** |
|+ 세포막 | 세포를 둘러싸고 물질의 **출입을 조절** |
|+ 마이토콘드리아 | 양분을 분해해 생명 활동에 필요한 **에너지**를 만든다 |
|+ 세포질 | 세포막 안쪽에서 핵을 뺀 부분, 여러 소기관이 있다 |
|+ 세포벽 | 세포막 바깥에서 세포를 **보호**하고 모양 유지 |
|+ 엽록체 | 빛을 받아 **광합성** |

= 세포를 학교에 비유하면?
* 🏫 핵 :: 교무실 — 학교 생활 전체를 조절
* 🚪 세포막 :: 교문 — 드나드는 사람을 확인
* ⚡ 마이토콘드리아 :: 급식실·전기실 — 활동할 에너지 공급
* 🧱 세포벽 :: 담장 — 학교를 보호하고 모양 유지
* ☀️ 엽록체 :: 학교 텃밭 — 햇빛으로 먹을 것을 만든다
% 학생들이 자기만의 비유를 만들어 보게 하면 기억에 오래 남음

= 동물 세포와 식물 세포 비교
| 구조 | 동물 세포 | 식물 세포 |
| 핵 · 세포막 · 마이토콘드리아 | ○ | ○ |
|+ 세포벽 | × | ○ |
|+ 엽록체 | × | ○ |
>+ 식물 세포에만 있는 것: ==세포벽, 엽록체== → 모양이 일정하고 광합성을 한다.

## 세포의 모양과 기능 | 하는 일에 맞는 모양

= 여러 가지 세포 | 사례
* 🔴 적혈구 :: 가운데가 오목한 원반 모양 → 산소 운반
* ⚡ 신경 세포 :: 길게 뻗은 가지 → 먼 곳까지 신호 전달
* 💪 근육 세포 :: 길쭉한 모양 → 늘어나고 줄어들어 몸을 움직임
* 🧱 상피 세포 :: 납작하고 빽빽 → 몸 표면을 덮어 보호
* 🍃 공변세포 :: 둘이 짝을 지어 → 기공을 열고 닫음
* 🌱 뿌리털 세포 :: 가늘고 긴 털 → 흙과 닿는 면적이 넓어 물 흡수

= 모양이 기능을 말해 준다
! 세포의 모양과 크기는 그 세포가 하는 ==일==과 관련 있다
- 뿌리털: 털처럼 길어지면 물과 닿는 **표면적이 넓어진다**.
+ 신경 세포: 발끝 신호를 척수까지 → 1 m 가까이 길어지기도 한다.
+ 근육 세포: 많이 움직이므로 **마이토콘드리아가 많다**.
% '모양 → 기능' 추론이 성취기준의 핵심 — 예제 3과 서술형에서 다시 확인

= 시뮬레이션: 여러 가지 세포 | 실험실
@ sim.html#cell | '여러 가지 세포'를 눌러 모양의 특징과 하는 일을 학습지 표에 연결해 보자.

= 세포 관찰 실험 | 탐구
^ 입안 상피 세포: 면봉으로 볼 안쪽을 긁어 받침유리에 문지르고 **메틸렌 블루** 용액을 떨어뜨린다
^ 양파 표피 세포: 안쪽 표피를 얇게 벗겨 **아세트산 카민** 용액을 떨어뜨린다
^ 덮개유리를 기포가 생기지 않게 비스듬히 덮고 **저배율부터** 관찰한다
> 염색약은 ==핵==을 잘 보이게 한다.
% 면봉은 한 번만 사용, 메틸렌 블루는 옷에 묻으면 잘 지워지지 않음 안내

= 예제 1 · 구조 판별 | 적용
- 현미경으로 본 세포에 세포벽과 엽록체가 있었다.
^+ 세포벽 → 식물 세포에만 있다
^+ 엽록체 → 식물 세포에만 있다
^+ 결론: **식물 세포** (예: 잎의 세포)
>+ 양파 표피 세포는 식물 세포지만 땅속에서 빛을 못 받아 엽록체가 거의 없다!

= 예제 2 · 현미경 배율 계산 | 적용
- 접안렌즈 10×, 대물렌즈 10×로 크기 약 0.05 mm인 입안 상피 세포를 보았다.
^+ 배율 = 10 × 10 = **100배**
^+ 보이는 크기 = 0.05 mm × 100 = **5 mm**
^+ 대물렌즈를 40×로 바꾸면 배율 400배 → 0.05 × 400 = **20 mm**
>+ 배율이 커지면 크게 보이지만 보이는 범위는 좁아진다 → 저배율로 찾고 고배율로 자세히!

= 예제 3 · 모양으로 기능 추론 | 적용
- 근육 세포에는 다른 세포보다 마이토콘드리아가 많다. 왜일까?
^+ 근육 세포가 하는 일 → 늘어나고 줄어들며 **몸을 움직인다**
^+ 움직이려면 → **많은 에너지**가 필요하다
^+ 에너지를 만드는 곳 → **마이토콘드리아**가 많다
>+ '하는 일 → 필요한 것 → 구조'의 순서로 추론하자.

= 확인 문제 1
Q 세포에서 생명 활동에 필요한 에너지를 만드는 곳은?
o 핵
o 세포막
o* 마이토콘드리아
o 세포벽
:: 마이토콘드리아는 양분을 분해해 에너지를 만든다.

= 확인 문제 2
Q 식물 세포에만 있는 구조끼리 짝 지은 것은?
o 핵, 세포막
o* 세포벽, 엽록체
o 세포막, 마이토콘드리아
o 핵, 엽록체
:: 핵·세포막·마이토콘드리아는 동물 세포와 식물 세포에 공통으로 있다.

= 확인 문제 3
Q 세포의 모양과 기능을 바르게 짝 지은 것은?
o 적혈구 — 길게 뻗은 가지로 신호 전달
o* 뿌리털 세포 — 가늘고 긴 털 모양으로 물 흡수
o 신경 세포 — 오목한 원반 모양으로 산소 운반
o 공변세포 — 납작하게 붙어 몸 표면 보호
:: 적혈구는 산소 운반, 신경 세포는 신호 전달, 공변세포는 기공을 열고 닫는다.

= 확인 문제 4
Q 접안렌즈 15×, 대물렌즈 10×인 현미경의 배율은?
o 25배
o 100배
o* 150배
o 1500배
:: 배율은 곱한다: 15 × 10 = 150배

= 서술형 도전 | 생각 넓히기
? 세포막이 없다면 세포에 어떤 일이 생길지 '물질의 출입'을 넣어 쓰시오. :: 필요한 물질은 들어오고 노폐물은 나가도록 조절하지 못해 세포 안의 상태를 유지할 수 없고, 세포가 살아갈 수 없다.
? 식물 세포에는 세포벽이 있어 모양이 일정하다. 동물 세포에 세포벽이 없는 것이 동물에게 유리한 점을 추론하시오. :: 세포 모양이 자유롭게 바뀔 수 있어 근육 세포가 늘어나고 줄어드는 등 몸을 움직이기 쉽다.

- 물질의 출입 조절 = [[세포막]]
