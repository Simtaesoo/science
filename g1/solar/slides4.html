# 달의 위상과 일식·월식 | 모양이 바뀌는 달 | 중학교 과학 1 · 07 태양계 · 4차시 | 2022 개정 교육과정 [9과07-04]

= 오늘의 학습 목표 | 4차시
^ 달의 **위상**이 변하는 까닭을 태양·지구·달의 위치로 설명할 수 있다.
^ 음력 날짜에 따른 **달의 이름과 모양**을 말할 수 있다.
^ **일식과 월식**이 일어나는 배열과 차이점을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 위상 변화 15분 → 일식·월식 10분 → 문항 8분 → 달 모양 탐정 7분

= 추석 보름달과 그믐 | 생각 열기
* 🌕 추석 (음력 8월 15일) :: 밤새 둥근 보름달
* 🌘 그믐 (음력 27일 무렵) :: 새벽에 눈썹 같은 달
* 🌑 음력 1일 :: 달이 보이지 않는다
? 달은 스스로 모양이 바뀌는 걸까? :: 아니다. 달은 햇빛을 반사할 뿐이고, 지구 둘레를 공전하면서 우리가 보는 밝은 부분의 모양이 달라진다.

= 지난 시간 복습 | 3차시
| 운동 | 방향 | 빠르기 |
| 일주 운동 (자전) | [[동 → 서]] | 1시간에 15° |
| 연주 운동 (공전) | [[서 → 동]] | 하루에 약 1° |
? 저녁 7시에 동쪽에 뜬 별은 몇 시간 뒤 남쪽에 올까? :: 동 → 남은 90° → 90 ÷ 15 = 6시간 뒤 (새벽 1시)

## 달의 위상 | 햇빛을 반사하는 달

= 위상이 변하는 까닭
! 달은 스스로 빛을 내지 못하고 ==햇빛==을 반사한다
- 달은 항상 **태양을 향한 쪽 절반**이 밝다.
+ 달이 지구 둘레를 **공전**하면서 태양·지구·달의 위치가 달라진다.
+ 그래서 지구에서 보이는 밝은 부분의 모양이 약 **29.5일**을 주기로 변한다.

= 시뮬레이션: 달의 위상과 식 | 실험실
@ sim.html#moon | 음력 날짜를 바꾸며 달의 위치와 지구에서 보이는 모양을 기록하자.
% 공 하나와 손전등으로 교실 모형 실험을 곁들이면 효과적

= 음력 날짜와 달의 모양
| 음력 날짜 | 1일 | 3일 | 7~8일 | 15일 | 22~23일 | 27일 |
|+ 달의 이름 | 삭 | 초승달 | 상현달 | 망 (보름달) | 하현달 | 그믐달 |
|+ 밝은 쪽 | 보이지 않음 | 오른쪽 가는 부분 | 오른쪽 반 | 전체 | 왼쪽 반 | 왼쪽 가는 부분 |
>+ 차오를 때는 ==오른쪽==부터, 기울 때는 ==왼쪽==이 남는다 (북반구 기준).

= 밝게 보이는 부분의 변화
C 삭에서 지난 날에 따라 밝게 보이는 부분의 비율 | 삭에서 지난 날 (일) | 밝은 부분 (%) | 밝은 부분:0,0 3.7,15 7.4,50 11.1,85 14.75,100 18.4,85 22.1,50 25.8,15 29.5,0
~ 약 7.4일마다 0 → 50 → 100 → 50 → 0 %, 한 주기 약 29.5일

## 일식과 월식 | 그림자 놀이

= 일식과 월식 비교
| | 일식 | 월식 |
|+ 뜻 | 달이 **태양**을 가림 | 달이 **지구의 그림자** 속에 들어감 |
|+ 배열 | 태양 - 달 - 지구 | 태양 - 지구 - 달 |
|+ 달의 위상 | 삭 | 망 |
|+ 관측 범위 | 달의 그림자가 닿는 좁은 지역 | 달이 떠 있는 밤인 모든 지역 |

= 왜 매달 일어나지 않을까?
- 삭은 매달 오는데 일식은 몇 년에 한 번만 볼 수 있다.
+ 달의 공전 궤도가 지구의 공전 궤도에 대해 약 **5° 기울어져** 있다.
+ 그래서 대부분의 삭과 망에서는 세 천체가 **정확히 한 줄**이 되지 않는다.
>+ 개기 월식 때 달은 어둡고 ==붉은색==으로 보인다.

= 생활 속 달 | 사례
* 🎑 추석·정월 대보름 :: 음력 15일 → 보름달
* 🌊 밀물과 썰물 :: 주로 달의 인력 때문
* 🌒 초승달 :: 해 진 직후 서쪽 하늘에 잠깐
* 🌗 하현달 :: 한밤중에 떠서 아침 남쪽 하늘에
* 🌑 개기 일식 :: 낮에 하늘이 어두워지고 코로나가 보인다
* 🔴 개기 월식 :: 붉은 달 (블러드문)

= 예제 1 · 날짜로 모양 찾기 | 적용
- 오늘이 음력 3일이다. 일주일 뒤 달의 이름과 모양은?
^+ 3 + 7 = 음력 **10일**
^+ 상현달(7~8일)과 망(15일) 사이
^+ 오른쪽 반보다 **더 많이** 밝은 달 (밝은 부분 약 70~80 %)

= 예제 2 · 상현달은 언제, 어디서? | 적용
- 음력 7~8일 무렵 해가 진 직후 달을 찾아보자.
^+ 달의 이름 → **상현달**
^+ 위치 → 해 진 직후 **남쪽 하늘**
^+ 밝은 쪽 → **오른쪽 반**
>+ 한밤중에는 서쪽 하늘로 지기 시작한다.

= 예제 3 · 일식일까 월식일까? | 적용
- 어떤 날 밤, 둥근 달이 서서히 어두워지며 붉은색으로 변했다.
^+ 밤에 관측 → 달이 떠 있는 **밤**
^+ 둥근 달 → 위상은 **망**
^+ 지구의 그림자 속으로 → **월식** (배열: 태양 - 지구 - 달)

= 확인 문제 1
Q 달의 위상이 변하는 까닭은?
o 달이 스스로 빛을 내는 양이 변해서
o* 달이 지구 둘레를 공전하며 태양·지구·달의 위치가 달라져서
o 지구의 그림자가 달을 가려서
o 달의 크기가 변해서
:: 지구의 그림자 때문에 위상이 변하는 것이 아니다 — 흔한 오개념!

= 확인 문제 2
Q 음력 22~23일 무렵 보이는 달은?
o 초승달
o 상현달
o 보름달
o* 하현달
:: 하현달은 왼쪽 반이 밝다.

= 확인 문제 3
Q 일식이 일어날 때 달의 위상과 배열은?
o* 삭, 태양 - 달 - 지구
o 망, 태양 - 지구 - 달
o 상현, 태양 - 달 - 지구
o 망, 태양 - 달 - 지구
:: 일식은 달이 태양을 가리는 현상이다.

= 확인 문제 4
Q 일식과 월식이 매달 일어나지 않는 까닭은?
o 달이 지구 둘레를 돌지 않기 때문
o* 달의 공전 궤도가 지구의 공전 궤도에 대해 약 5° 기울어져 있기 때문
o 달이 너무 작기 때문
o 태양이 자전하기 때문
:: 대부분의 삭·망에서 세 천체가 정확히 한 줄이 되지 않는다.

= 서술형 도전 | 생각 넓히기
? 일식은 일부 지역에서만 볼 수 있지만 월식은 밤인 지역이면 어디서나 볼 수 있다. 그 까닭을 쓰시오. :: 일식은 작은 달의 그림자가 지구의 좁은 지역에만 생기기 때문이고, 월식은 달 자체가 지구의 그림자에 들어가므로 달이 보이는 모든 지역에서 볼 수 있다.
? 지구에서 보름달이 뜬 날 달에 있는 우주인이 지구를 본다면 어떤 모양일지 설명하시오. :: 지구도 햇빛을 반사하므로 위상이 변한다. 지구에서 보름달일 때 달에서 보면 지구의 어두운 면이 달을 향하므로 지구는 거의 보이지 않는다(삭과 같은 모양).

= 오늘 배운 내용 정리
- 달은 스스로 빛을 내지 못하고 [[햇빛]]을 반사한다.
- 달이 지구 둘레를 [[공전]]하며 위상이 약 [[29.5]]일 주기로 변한다.
- 삭 → 초승달 → [[상현달]] → 망 → [[하현달]] → 그믐달 → 삭
- 일식은 [[삭]]일 때 (태양 - 달 - 지구), 월식은 [[망]]일 때 (태양 - 지구 - 달)
- 개기 월식 때 달은 어둡고 [[붉은색]]으로 보인다.

= 나가기 전 한 문제 | 형성평가
? 추석 밤에 개기 일식이 일어날 수 없는 까닭을 달의 위상으로 쓰시오. :: 추석(음력 15일)의 달은 망(보름달)이다. 일식은 달이 태양과 지구 사이에 오는 삭일 때만 일어날 수 있다.
