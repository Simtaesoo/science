# 지구의 자전과 공전 | 일주 운동과 연주 운동 | 중학교 과학 1 · 07 태양계 · 3차시 | 2022 개정 교육과정 [9과07-03]

= 오늘의 학습 목표 | 3차시
^ 지구의 **자전**으로 나타나는 천체의 **일주 운동**을 설명할 수 있다.
^ 방향별 하늘에서 별이 움직이는 모습을 **그릴** 수 있다.
^ 지구의 **공전**으로 나타나는 **연주 운동**과 계절별 별자리 변화를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 자전·일주 운동 15분 → 공전·연주 운동 12분 → 문항 8분 → 정리 5분

= 밤하늘 사진의 동그라미 | 생각 열기
* 📷 카메라 :: 북쪽 하늘을 향해 몇 시간 동안 셔터를 열어 두었다
* ⭕ 사진 :: 별들이 한 점을 중심으로 동그란 줄무늬를 그렸다
* ⭐ 가운데 :: 거의 움직이지 않은 별 하나
? 별이 정말로 하늘에서 원을 그리며 돈 것일까? :: 아니다. 지구가 자전하기 때문에 별이 도는 것처럼 보인다. 가운데 별은 자전축 방향에 있는 북극성이다.

| 흑점이 이동하는 까닭 | [[태양의 자전]] |

## 자전과 일주 운동 | 하루에 한 바퀴

= 지구의 자전과 일주 운동
| | 지구의 자전 | 일주 운동 |
| 뜻 | 지구가 자전축을 중심으로 도는 운동 | 천체가 도는 것처럼 **보이는** 운동 |
| 방향 | **서 → 동** | **동 → 서** |
| 주기 | 하루에 한 바퀴 | 하루에 한 바퀴 |
| 빠르기 | 360° ÷ 24시간 | 1시간에 **15°** |
>+ 달리는 버스 안에서 바깥 나무가 뒤로 가는 것처럼 보이는 것과 같다!

= 시뮬레이션: 자전과 공전 | 실험실
@ sim.html#rot | 바라보는 방향을 북·동·남·서로 바꾸며 별이 움직이는 모습을 화살표로 그려 보자.
% 방향별 자취를 학습지 표에 그린 뒤, 학생 몸을 돌려(자전) 교실 벽이 반대로 도는 체험

= 방향별 별의 일주 운동
| 바라보는 방향 | 별이 움직이는 모습 |
|+ 북쪽 하늘 | 북극성을 중심으로 **시계 반대 방향** |
|+ 동쪽 하늘 | 오른쪽 위로 **비스듬히 떠오른다** |
|+ 남쪽 하늘 | 왼쪽 → 오른쪽 (**동 → 서**) |
|+ 서쪽 하늘 | 오른쪽 아래로 **비스듬히 진다** |

## 공전과 연주 운동 | 1년에 한 바퀴

= 지구의 공전과 연주 운동
| | 지구의 공전 | 연주 운동 |
| 뜻 | 지구가 태양을 중심으로 도는 운동 | 태양이 별자리 사이를 이동하는 것처럼 **보이는** 운동 |
| 방향 | 서 → 동 | 서 → 동 |
| 주기 | 1년에 한 바퀴 | 1년에 한 바퀴 |
| 빠르기 | 360° ÷ 365일 | 하루에 약 **1°** |

= 계절에 따라 보이는 별자리
| 월 | 태양이 지나는 별자리 | 한밤중 남쪽 하늘 |
|+ 3월 | 물병자리 | 사자자리 |
|+ 9월 | 사자자리 | 물병자리 |
|+ 12월 | 전갈자리 | 황소자리 |
>+ 태양이 있는 쪽 별자리는 낮에 떠 있어 ==볼 수 없고==, 반대쪽 별자리가 한밤중에 보인다.
~ 황도 12궁: 태양이 지나가는 길(황도)에 있는 12개의 별자리

= 자전과 공전 한눈에 | 사례
* 🌅 해돋이·해넘이 :: 자전 → 태양의 일주 운동
* 🌙 달이 지는 것 :: 자전 → 달의 일주 운동
* 🌀 별의 원형 자취 사진 :: 자전 → 별의 일주 운동
* 🌌 겨울의 오리온자리 :: 공전 → 계절별 별자리 변화
* ♈ 생일 별자리 :: 공전 → 태양이 그 별자리 쪽에 있는 때
* 📅 1년 = 365일 :: 공전 주기

= 예제 1 · 별의 이동 각도 | 적용
- 저녁 8시에 남쪽 하늘에 보이던 별이 밤 11시에는?
^+ 지난 시간 = 11 − 8 = **3시간**
^+ 1시간에 15° → 3 × 15 = **45°**
^+ 방향 → 일주 운동은 동 → 서이므로 **서쪽으로 약 45°**

= 예제 2 · 별 자취 사진 | 적용
- 북쪽 하늘 사진에서 별의 자취가 중심각 60°인 호를 그렸다.
^+ 중심에 있는 별 → **북극성**
^+ 별이 도는 방향 → **시계 반대 방향**
^+ 촬영 시간 = 60 ÷ 15 = **4시간**

= 예제 3 · 한 달 뒤 같은 시각 | 적용
- 오늘 밤 9시 남쪽 하늘에 있던 별자리는 30일 뒤 밤 9시에 어디에 있을까?
^+ 공전 때문에 별자리는 하루에 약 1°씩 서쪽으로 밀린다
^+ 30일 → 약 **30°** 서쪽으로
^+ 30° ÷ 15°/시간 = **2시간** → 30일 뒤에는 저녁 7시에 남쪽에 온다
>+ 별자리는 매일 약 4분씩 일찍 뜬다 (1° ÷ 15° × 60분 = 4분)

= 확인 문제 1
Q 일주 운동의 방향과 까닭으로 옳은 것은?
o 서 → 동, 지구의 공전
o* 동 → 서, 지구의 자전
o 동 → 서, 지구의 공전
o 서 → 동, 지구의 자전
:: 지구가 서 → 동으로 자전하므로 천체는 동 → 서로 도는 것처럼 보인다.

= 확인 문제 2
Q 일주 운동에서 천체가 1시간 동안 움직이는 각도는?
o 1°
o 4°
o* 15°
o 30°
:: 360° ÷ 24시간 = 15°

= 확인 문제 3
Q 북쪽 하늘의 별이 움직이는 모습으로 옳은 것은?
o 왼쪽에서 오른쪽으로 곧게
o* 북극성을 중심으로 시계 반대 방향으로
o 북극성을 중심으로 시계 방향으로
o 아래에서 위로 곧게
:: 북쪽 하늘의 별은 북극성을 중심으로 시계 반대 방향으로 돈다.

= 확인 문제 4
Q 계절마다 한밤중에 보이는 별자리가 달라지는 까닭은?
o 지구가 자전하기 때문
o* 지구가 태양 둘레를 공전하기 때문
o 별자리가 스스로 움직이기 때문
o 달이 지구 둘레를 공전하기 때문
:: 공전에 따라 한밤중에 바라보는 방향(태양 반대쪽)이 달라진다.

= 서술형 도전 | 생각 넓히기
? 지구가 지금과 반대로 동쪽에서 서쪽으로 자전한다면 해와 별은 어느 쪽에서 떠서 어느 쪽으로 질지 설명하시오. :: 일주 운동의 방향도 반대가 되어 서쪽에서 떠서 동쪽으로 지는 것처럼 보일 것이다.
? 9월 생일인 친구가 생일 밤에 자신의 별자리(사자자리)를 볼 수 없는 까닭을 쓰시오. :: 9월에는 태양이 사자자리 쪽에 있어 사자자리가 낮 동안 태양과 함께 떠 있으므로, 밝은 햇빛 때문에 볼 수 없다.

= 오늘 배운 내용 정리
- 지구가 하루에 한 바퀴 서 → 동으로 도는 운동 = [[자전]]
- 자전 때문에 천체가 동 → 서로 도는 것처럼 보이는 운동 = [[일주 운동]], 1시간에 [[15°]]
- 북쪽 하늘의 별은 [[북극성]]을 중심으로 시계 반대 방향으로 돈다.
- 공전 때문에 태양이 별자리 사이를 하루 약 [[1°]]씩 서 → 동으로 이동 = [[연주 운동]]
- 한밤중에는 태양 [[반대쪽]] 별자리가 보인다.

= 나가기 전 한 문제 | 형성평가
? 처음의 북쪽 하늘 사진에서 별의 자취가 반원(180°)을 그렸다면 몇 시간 동안 찍은 것인지 쓰고, 별이 실제로 움직이지 않았는데 자취가 생긴 까닭을 쓰시오. :: 180 ÷ 15 = 12시간. 지구가 자전하여 카메라가 함께 돌았기 때문에 별이 북극성 둘레를 도는 것처럼 찍혔다.
