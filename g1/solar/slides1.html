## 태양계를 이루는 천체 | 태양부터 혜성까지

= 태양계의 가족들
| 천체 | 특징 |
|+ 태양 | 중심에서 스스로 빛을 내는 유일한 천체 |
|+ 행성 | 태양 둘레를 공전하는 8개의 큰 천체 |
|+ 왜소행성 | 행성보다 작고 둥글지만 행성이 아닌 천체 (명왕성) |
|+ 소행성 | 주로 화성과 목성 사이에 많은 작은 천체 |
|+ 위성 | 행성 둘레를 공전하는 천체 (달) |
|+ 혜성 | 얼음과 먼지, 태양에 가까워지면 꼬리가 생김 |

= 여덟 행성 | 태양에서 가까운 순서
* 🌑 수성 :: 가장 작고 태양에 가장 가깝다
* 🟡 금성 :: 두꺼운 이산화 탄소 대기, 가장 뜨겁다
* 🌍 지구 :: 액체 상태의 물과 생명체
* 🔴 화성 :: 붉은 흙(산화 철), 극관
* 🟠 목성 :: 가장 크다, 대적점
* 🪐 토성 :: 뚜렷한 고리, 밀도가 가장 작다
* 🟢 천왕성 :: 자전축이 거의 누워 있다
* 🔵 해왕성 :: 가장 멀다, 푸른색

## 행성 자료 분석 | 두 무리로 묶어 보자

= 행성 자료
| 행성 | 반지름 (지구 = 1) | 평균 밀도 (g/cm³) |
| 수성 | 0.38 | 5.4 |
| 금성 | 0.95 | 5.2 |
| 지구 | 1.00 | 5.5 |
| 화성 | 0.53 | 3.9 |
| 목성 | 11.2 | 1.3 |
| 토성 | 9.45 | 0.7 |
| 천왕성 | 4.0 | 1.3 |
| 해왕성 | 3.9 | 1.6 |

= 두 무리로 묶으면
| | (가) 반지름 작고 밀도 큼 | (나) 반지름 크고 밀도 작음 |
| 행성 | 수성, 금성, 지구, 화성 | 목성, 토성, 천왕성, 해왕성 |
| 반지름 | 지구의 1배 이하 | 지구의 약 4 ~ 11배 |
| 밀도 | 3.9 ~ 5.5 g/cm³ | 0.7 ~ 1.6 g/cm³ |
>+ (가) = ==지구형 행성==, (나) = ==목성형 행성==

= 지구형 행성과 목성형 행성
| 구분 | 지구형 행성 | 목성형 행성 |
|+ 크기 · 질량 | 작다 | 크다 |
|+ 평균 밀도 | 크다 | 작다 |
|+ 표면 | 단단한 암석 | 주로 기체, 단단한 표면 없음 |
|+ 고리 | 없다 | 있다 |
|+ 위성 수 | 없거나 적다 | 많다 |

= 작은 천체들 | 사례
* ☄️ 혜성 :: 얼음 + 먼지, 태양 반대쪽으로 꼬리
* 🪨 소행성 :: 암석, 화성과 목성 사이 소행성대
* 🌠 유성 :: 우주 먼지가 대기와 부딪혀 빛나는 별똥별
* 🌑 왜소행성 :: 명왕성, 세레스 — 둥글지만 행성은 아님
* 🌙 위성 :: 달, 목성의 위성 이오·유로파

= 예제 1 · 크기 비교 | 적용
- 목성의 반지름은 지구의 약 11.2배이다.
^+ 지름도 → 약 **11.2배**
^+ 부피는 반지름을 세 번 곱한 만큼: 11.2 × 11.2 × 11.2 ≈ **1405배**
^+ 목성 속에 지구가 약 **1400개** 들어갈 수 있다
>+ 그런데 밀도는 지구의 약 1/4 (1.3 ÷ 5.5 ≈ 0.24) — 가벼운 기체로 되어 있다!

= 예제 2 · 새 천체 분류 | 적용
- 새로 발견한 행성: 반지름 지구의 6배, 평균 밀도 1.2 g/cm³, 위성 여러 개
^+ 반지름 → **크다** (목성형: 약 4 ~ 11배)
^+ 밀도 → **작다** (목성형: 0.7 ~ 1.6)
^+ 위성 → **많다**
!+ 목성형 행성

= 예제 3 · 토성은 물에 뜰까? | 적용
- 물의 밀도는 1 g/cm³, 토성의 평균 밀도는 0.7 g/cm³
^+ 밀도가 물보다 **작다** → 물보다 가볍다
^+ 토성을 담을 거대한 바다가 있다면 → **뜬다** (상상 실험)
^+ 까닭: 수소·헬륨 같은 **가벼운 기체**가 주성분
% 2학년 밀도 단원 예고 — 깊이 들어가지 않기

= 확인 문제 1
Q 태양계에서 스스로 빛을 내는 천체는?
o 지구
o 달
o* 태양
o 혜성
:: 태양은 태양계에서 스스로 빛을 내는 유일한 천체이다.

= 확인 문제 2
Q 소행성이 주로 분포하는 곳은?
o 수성과 금성 사이
o 지구와 화성 사이
o* 화성과 목성 사이
o 해왕성 바깥
:: 화성과 목성 사이에 소행성대가 있다.

= 확인 문제 3
Q 목성형 행성의 특징으로 옳은 것은?
o 평균 밀도가 크다.
o 단단한 암석 표면이 있다.
o* 고리가 있고 위성이 많다.
o 크기와 질량이 작다.
:: 목성형 행성은 크고, 밀도가 작으며, 고리와 많은 위성이 있다.

= 확인 문제 4
Q 다음 중 지구형 행성끼리 묶은 것은?
o 목성, 토성
o* 수성, 화성
o 천왕성, 해왕성
o 지구, 목성
:: 지구형: 수성, 금성, 지구, 화성

= 서술형 도전 | 생각 넓히기
? 토성은 목성 다음으로 크지만 평균 밀도는 행성 중 가장 작다. 그 까닭을 이루는 물질과 관련지어 쓰시오. :: 토성은 주로 수소, 헬륨 같은 가벼운 기체로 이루어져 있어 크기에 비해 질량이 작으므로 밀도가 작다.
? 소행성과 혜성의 공통점과 차이점을 한 가지씩 쓰시오. :: 공통점: 태양 둘레를 공전하는 작은 천체이다. 차이점: 혜성은 얼음과 먼지로 이루어져 태양에 가까워지면 꼬리가 생기지만, 소행성은 암석으로 되어 있고 꼬리가 없다.

- 수성·금성·지구·화성 = [[지구형 행성]] — 작고 밀도가 크다
- 목성·토성·천왕성·해왕성 = [[목성형 행성]] — 크고 밀도가 작으며 고리가 있다

= 나가기 전 한 문제 | 형성평가
? 명왕성이 지구형 행성과 목성형 행성 어디에도 속하지 않고 왜소행성으로 분류되는 까닭을 오늘 배운 천체의 뜻으로 쓰시오. :: 명왕성은 둥근 모양이지만 행성보다 훨씬 작고, 비슷한 크기의 천체들과 함께 공전하여 행성의 기준을 만족하지 못하기 때문에 왜소행성으로 분류한다.
