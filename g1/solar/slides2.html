## 태양의 표면과 대기 | 눈에 보이는 곳, 숨어 있는 곳

= 태양의 표면: 광구
| 이름 | 특징 |
|+ 광구 | 눈에 보이는 태양의 표면, **쌀알 무늬** |
|+ 흑점 | 주변보다 **온도가 낮아** 어둡게 보이는 부분 |
>+ 흑점은 구멍이 아니다! 광구(약 5500 °C)보다 1000 °C 이상 낮아 상대적으로 어둡게 보인다.
% 온도 값은 대략값으로 소개

= 태양의 대기
| 이름 | 특징 |
|+ 채층 | 광구 바로 위의 얇은 **붉은색** 대기층 |
|+ 코로나 | 가장 바깥의 **진주색** 대기층 |
|+ 홍염 | 채층에서 솟아오르는 **불꽃 모양** 기체 |
|+ 플레어 | 흑점 부근에서 일어나는 **폭발** |
>+ 채층과 코로나는 평소 밝은 광구 때문에 보기 어렵고, ==개기 일식== 때 잘 보인다.

= 시뮬레이션: 태양 활동 | 실험실

% 흑점이 같은 방향으로 함께 움직이는 장면에서 '무엇이 돌고 있을까?' 질문

## 흑점이 알려 주는 것 | 자전과 11년 주기

= 관측 결과 정리
| 관찰 내용 | 결과 | 알게 된 점 |
|+ 날짜에 따른 흑점의 위치 | 동쪽 → 서쪽으로 이동 | 태양이 **자전**한다 |
|+ 흑점 수가 가장 많았던 해 | 약 2014년, 2025년 무렵 | 약 **11년 주기**로 변한다 |
>+ 흑점 수가 많을 때 = 태양 활동이 ==활발한== 때 → 홍염·플레어가 자주, 코로나가 커진다

= 태양 활동이 지구에 미치는 영향 | 사례
* 🌌 오로라 :: 더 자주, 더 낮은 위도에서도
* 🧲 자기 폭풍 :: 지구 자기장이 크게 흔들린다
* 📻 무선 통신 장애 :: 단파 통신이 끊긴다
* 🛰️ 인공위성 고장 :: 전자 장비가 손상된다
* 📍 GPS 오류 :: 위치 정보에 오차
* ⚡ 대규모 정전 :: 송전 시설에 강한 전류가 흐른다

= 흑점 관측은 안전하게!
- 맨눈이나 일반 망원경으로 태양을 **직접 보면 안 된다** — 망막이 손상된다.
+ **태양 필터**를 단 망원경을 쓴다.
+ 망원경으로 태양 상을 **흰 종이에 비추어** 관측한다.
>+ 선글라스나 검은 비닐로는 막을 수 없다!

= 예제 1 · 다음 극대기 | 적용
- 흑점 수가 약 2014년과 2025년 무렵에 가장 많았다.
^+ 두 극대기 사이 → 2025 − 2014 = **11년**
^+ 다음 극대기 → 2025 + 11 = **2036년 무렵**
^+ 그 사이 2030년 무렵 → 흑점이 **적은** 극소기
>+ 실제 주기는 9 ~ 14년으로 조금씩 달라 '약 11년'이라고 말한다.

= 예제 2 · 흑점의 이동 | 적용
- 태양 원판 한가운데 있던 흑점이 약 7일 뒤 서쪽 가장자리에 보였다.
^+ 원판 가운데 → 가장자리: 태양 둘레의 **1/4** 만큼 돌았다
^+ 7일 × 4 = **28일**
^+ 태양(적도 부근)은 약 한 달에 **한 바퀴** 자전한다
% 실제 적도 부근 자전 주기 약 25~27일 — 어림 계산임을 안내

= 예제 3 · 태양 입자의 도착 시간 | 적용
- 플레어와 함께 튀어나온 입자가 초속 1000 km로 날아온다. 태양~지구 1억 5천만 km.
^+ 걸리는 시간 = 150 000 000 ÷ 1000 = **150 000초**
^+ 150 000 ÷ 3600 ≈ **42시간** (약 1.7일)
^+ 빛은 초속 30만 km → 150 000 000 ÷ 300 000 = **500초** (약 8분 20초)
>+ 빛은 8분 만에 오지만 입자는 이틀 가까이 걸려 → 미리 대비할 시간이 있다!

= 확인 문제 1
Q 흑점이 주변보다 어둡게 보이는 까닭은?
o 흑점에 구멍이 뚫려 있기 때문
o* 주변보다 온도가 낮기 때문
o 달이 태양을 가리기 때문
o 지구의 구름이 가리기 때문
:: 흑점은 광구보다 온도가 낮아 상대적으로 어둡다.

= 확인 문제 2
Q 흑점이 동쪽에서 서쪽으로 이동하는 것으로 알 수 있는 사실은?
o 지구가 공전한다.
o* 태양이 자전한다.
o 흑점 수가 11년 주기로 변한다.
o 태양이 점점 식고 있다.
:: 흑점이 함께 같은 방향으로 움직이는 것은 태양이 돌고 있기 때문이다.

= 확인 문제 3
Q 태양 활동이 활발할 때 지구에 나타날 수 있는 현상이 **아닌** 것은?
o 오로라가 자주 나타난다.
o 자기 폭풍이 일어난다.
o* 밀물과 썰물이 생긴다.
o GPS 위치 정보에 오차가 생긴다.
:: 밀물과 썰물은 주로 달의 인력 때문이다.

= 확인 문제 4
Q 개기 일식 때 잘 관측할 수 있는 태양의 대기층은?
o 광구, 흑점
o* 채층, 코로나
o 흑점, 쌀알 무늬
o 광구, 쌀알 무늬
:: 평소에는 밝은 광구에 가려 보이지 않던 대기층이 드러난다.

= 서술형 도전 | 생각 넓히기
? "흑점 수가 크게 늘어 평소보다 남쪽에서도 오로라가 관측되었고, 항공사는 극지방 항로를 일부 바꾸었다." 이 뉴스에서 예상되는 다른 영향 두 가지와 까닭을 쓰시오. :: ① 단파 무선 통신이 끊긴다 — 태양에서 오는 강한 에너지와 입자가 지구 대기 상층을 교란하기 때문. ② 인공위성이 고장 난다 — 많은 입자가 위성의 전자 장비에 영향을 주기 때문.
? 흑점을 관측할 때 태양을 직접 보면 안 되는 까닭과 안전한 관측 방법을 쓰시오. :: 강한 햇빛이 눈의 망막을 손상시킬 수 있기 때문이다. 태양 필터를 쓰거나 망원경으로 태양 상을 흰 종이에 비추어 관측한다.

= 오늘 배운 내용 정리
- 눈에 보이는 태양의 표면 = [[광구]], 쌀알 무늬가 있다.
- 주변보다 온도가 낮아 어둡게 보이는 부분 = [[흑점]]
- 채층에서 솟아오르는 불꽃 모양 = [[홍염]], 가장 바깥 대기 = [[코로나]]
- 흑점의 이동 → 태양의 [[자전]], 흑점 수는 약 [[11]]년 주기
- 태양 활동이 활발하면 오로라, 자기 폭풍, [[통신 장애]] 등이 생긴다.

= 나가기 전 한 문제 | 형성평가
? 처음의 '한국에서도 오로라' 뉴스가 나온 해의 흑점 수는 많았을지 적었을지 쓰고, 근거를 한 문장으로 쓰시오. :: 많았다. 흑점 수가 많을 때 태양 활동이 활발해 지구로 오는 입자가 많아지고, 오로라가 평소보다 낮은 위도에서도 나타나기 때문이다.
