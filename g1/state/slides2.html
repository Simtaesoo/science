## 세 가지 상태 | 고체 · 액체 · 기체

= 입자 모형으로 비교하기
| | 고체 | 액체 | 기체 |
|+ 입자 사이 거리 | 매우 가깝다 | 가깝다 | 매우 멀다 |
|+ 입자 배열 | 규칙적 | 불규칙적 | 매우 불규칙적 |
|+ 입자 운동 | 제자리에서 진동 | 자리를 바꾸며 움직임 | 매우 활발 |
|+ 모양 | 일정 | 변함 | 변함 |
|+ 부피 | 일정 | 일정 | 변함 |

= 교실로 비유하면
* 🪑 고체 :: 수업 시간 — 모두 자기 자리에 앉아 몸만 들썩
* 🚶 액체 :: 쉬는 시간 교실 — 자리를 바꾸며 돌아다니지만 교실 안
* 🏃 기체 :: 운동장 — 사방으로 멀리 뛰어다닌다
>+ 고체 → 액체 → 기체로 갈수록 입자 사이가 ==멀어지고== 운동이 ==활발해진다==.

## 상태 변화 | 여섯 가지 이름

= 상태 변화의 종류
| 변화 | 이름 | 예 |
|+ 고체 → 액체 | **융해** | 초콜릿이 손에서 녹는다 |
|+ 액체 → 고체 | **응고** | 촛농이 굳는다 |
|+ 액체 → 기체 | **기화** | 젖은 머리카락이 마른다 |
|+ 기체 → 액체 | **액화** | 찬 컵 표면에 물방울이 맺힌다 |
|+ 고체 → 기체 | **승화** | 옷장 속 나프탈렌이 작아진다 |
|+ 기체 → 고체 | **승화** | 겨울 유리창에 성에가 낀다 |

= 기화의 두 가지: 증발과 끓음
| | 증발 | 끓음 |
| 일어나는 곳 | 액체 **표면** | 액체 **표면과 내부** |
| 온도 | 끓는점보다 낮아도 | **끓는점**에서 |
>+ 증발과 끓음 모두 액체 → 기체, 즉 ==기화==이다.

= 상태가 변하면 무엇이 변할까?
| 변하지 않는 것 | 변하는 것 |
|+ 입자의 **수** → 질량 | 입자 사이의 **거리** → 부피 |
|+ 입자의 **종류** → 성질 | 입자의 **배열** |
|+ 입자의 **크기** | 입자의 **운동** |
>+ 상태가 변해도 ==질량==은 변하지 않고, ==부피==는 변한다.

= 물은 예외!
- 대부분의 물질: 응고하면 입자 사이가 가까워져 부피가 **줄어든다**.
+ 물: 얼 때 입자가 빈 공간이 많은 배열을 이루어 부피가 **커진다**.
+ 그래서 얼음은 물에 **뜬다**.
>+ 겨울에 수도관이 터지는 까닭도 물이 얼며 부피가 커지기 때문!

= 생활 속 상태 변화 | 사례
* 🍫 초콜릿 :: 손에서 녹는다 — 융해
* 🕯️ 촛농 :: 흘러내리다 굳는다 — 응고
* 🥤 찬 컵의 물방울 :: 공기 중 수증기가 — 액화
* ❄️ 성에 :: 수증기가 바로 얼음으로 — 승화
* 🧊 드라이아이스 :: 고체가 바로 기체로 — 승화
* 👓 안경 김 :: 따뜻한 실내에 들어오면 — 액화

= 예제 1 · 이름 붙이기 | 적용
| 현상 | 상태 변화 | 이름 |
|+ 차가운 컵 표면에 물방울 | 기체 → 액체 | [[액화]] |
|+ 초콜릿을 쥐면 녹음 | 고체 → 액체 | [[융해]] |
|+ 겨울 유리창의 성에 | 기체 → 고체 | [[승화]] |
|+ 나프탈렌이 작아짐 | 고체 → 기체 | [[승화]] |
|+ 젖은 머리카락이 마름 | 액체 → 기체 | [[기화]] |

= 예제 2 · 질량과 부피 | 적용
- 물 100 g(부피 100 mL)을 얼렸더니 부피가 약 109 mL가 되었다.
^+ 질량 → 입자의 수가 그대로 → **100 g**
^+ 부피 → 100 mL → 109 mL, 약 **9 %** 커졌다
^+ 얼음을 다시 녹이면 → **100 g, 100 mL**의 물
>+ 상태 변화는 입자의 배열만 바뀌는 것이라 되돌릴 수 있다.

= 예제 3 · 입자 모형 해석 | 적용
- 그림에서 입자들이 가깝게 모여 있다가 멀리 흩어졌다.
^+ 입자 사이가 멀어짐 → 액체 → **기체** → 이름: **기화**
^+ 변하는 것 → 입자 사이의 거리(부피), 입자의 운동
^+ 변하지 않는 것 → 입자의 수(질량), 종류(성질), 크기
>+ 입자 모형을 그릴 때 입자의 **개수와 크기**를 바꾸지 않도록 주의!

= 확인 문제 1
Q 입자 배열이 규칙적이고 제자리에서 진동하는 상태는?
o* 고체
o 액체
o 기체
o 모두 같다
:: 고체는 입자가 규칙적으로 배열되어 제자리에서 진동한다.

= 확인 문제 2
Q 모양은 변하지만 부피는 일정한 상태는?
o 고체
o* 액체
o 기체
o 고체와 기체
:: 액체는 그릇에 따라 모양이 바뀌지만 부피는 일정하다.

= 확인 문제 3
Q 겨울철 유리창에 성에가 끼는 상태 변화는?
o 융해
o 응고
o 액화
o* 승화
:: 공기 중 수증기(기체)가 바로 얼음(고체)이 되는 승화이다.

= 확인 문제 4
Q 상태가 변할 때 변하지 **않는** 것은?
o 부피
o 입자 사이의 거리
o 입자의 배열
o* 질량
:: 입자의 수와 종류가 변하지 않으므로 질량은 일정하다.

= 서술형 도전 | 생각 넓히기
? 물을 가득 채운 유리병을 냉동실에 넣어 두면 병이 깨지기도 한다. 다른 물질과 다른 물의 특징을 들어 까닭을 쓰시오. :: 대부분의 물질은 응고할 때 부피가 줄지만, 물은 얼 때 입자가 빈 공간이 많은 배열을 이루어 부피가 커지므로 병을 밀어 깨뜨린다.
? 아세톤 10 g이 든 비닐 주머니를 뜨거운 물에 넣었더니 주머니가 크게 부풀었다. 아세톤의 질량과 부피 변화를 입자로 설명하시오. :: 아세톤이 기화하여 입자 사이의 거리가 멀어져 부피가 커졌다. 입자의 수는 그대로이므로 질량은 10 g으로 변하지 않는다.
% 아세톤 시연은 환기·화기 주의 — 영상으로 대체 가능

= 오늘 배운 내용 정리
- 고체 → 액체 → 기체로 갈수록 입자 사이가 [[멀어지고]] 운동이 활발해진다.
- 고체 → 액체 [[융해]], 액체 → 고체 [[응고]], 액체 → 기체 [[기화]], 기체 → 액체 [[액화]]
- 고체 → 기체, 기체 → 고체 = [[승화]]
- 상태가 변해도 [[질량]]은 변하지 않고, [[부피]]는 변한다.
- 물은 얼 때 부피가 [[커진다]].
