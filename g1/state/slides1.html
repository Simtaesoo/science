# 확산과 증발 | 입자는 스스로 움직인다 | 중학교 과학 1 · 04 물질의 상태 변화 · 1차시 | 2022 개정 교육과정 [9과04-01]

= 오늘의 학습 목표 | 1차시
^ **확산** 현상을 관찰하고 입자의 운동으로 설명할 수 있다.
^ **증발** 현상을 관찰하고 입자의 운동으로 설명할 수 있다.
^ 확산과 증발을 근거로 **입자가 스스로 운동함**을 추론할 수 있다.
% 흐름: 생각 열기 5분 → 확산 12분 → 증발 12분 → 문항 10분 → 정리 6분

= 교실 문을 열었더니 | 생각 열기
* 🍞 빵 냄새 :: 복도 끝 매점의 빵 냄새가 교실까지
* 👕 체육복 :: 아침에 젖어 있던 체육복이 오후엔 말랐다
* 🫖 티백 :: 젓지 않았는데 물 색이 점점 진해진다
? 아무도 옮기거나 섞지 않았는데 어떻게 이런 일이 일어날까? :: 물질을 이루는 아주 작은 입자들이 스스로 끊임없이 움직이기 때문이다.
% 오늘의 핵심 질문: '입자가 움직인다는 증거는?'을 칠판에 적어 두기

= 지난 단원 복습 | 03 열
? 입자의 관점에서 온도란? :: 입자 운동이 활발한 정도
? 온도가 높아지면 입자의 운동은? :: 더 활발해진다
> 오늘은 입자의 '운동' 그 자체를 보여 주는 두 현상을 살펴본다.

## 확산 | 저절로 퍼져 나간다

= 확산이란?
! 입자가 스스로 운동하여 다른 물질 속으로 퍼져 나가는 현상
- **모든 방향**으로 일어난다.
+ 누가 섞지 않아도 **저절로** 일어난다.
+ 액체보다 **기체**에서 더 빠르다.
+ 온도가 **높을수록** 빠르다.
>+ 예: 향수 냄새가 방 안에 퍼진다, 물에 떨어뜨린 잉크가 퍼진다.

= 잉크 한 방울의 하루
| 시간 | 모습 |
|+ 처음 | 떨어뜨린 곳에만 진하게 모여 있다 |
|+ 몇 분 뒤 | 주위로 구름처럼 퍼져 나간다 |
|+ 하루 뒤 | 물 전체가 고르게 같은 색이 된다 |
>+ 잉크 입자와 물 입자가 모두 ==스스로 움직여== 서로 섞였다.

= 시뮬레이션: 확산 | 실험실
@ sim.html#diff | 칸막이를 열고 섞인 정도가 80 %가 될 때까지 걸린 시간을 10 °C와 80 °C에서 비교하자.
% 확산 탭에서 온도만 바꾸는 것 — 1단원 변인 통제와 연결(조작 변인: 온도)

= 확산이 빨라지는 조건
| 조건 | 더 빠른 쪽 | 까닭 |
|+ 온도 | 높을 때 (80 °C) | 입자 운동이 더 활발 |
|+ 상태 | 기체 속 | 입자 사이가 멀어 방해를 덜 받음 |
>+ 시뮬레이션 결과: 80 °C에서 80 %까지 걸린 시간이 10 °C보다 ==더 짧다==.

## 증발 | 표면에서 날아간다

= 증발이란?
! 액체 ==표면==에서 입자가 스스로 운동하여 기체가 되어 날아가는 현상
- 끓는 온도보다 **낮은 온도**에서도 일어난다.
+ 표면의 입자 중 특히 빠르게 움직이는 입자가 날아간다.
>+ 예: 젖은 빨래가 마른다, 어항의 물이 줄어든다, 염전에서 소금을 얻는다.

= 증발이 잘 일어나는 조건
* 🌡️ 온도가 높을수록 :: 입자 운동이 활발
* 🌬️ 바람이 불수록 :: 날아간 입자를 치워 준다
* 💧 습도가 낮을수록 :: 공기 중 수증기가 적다
* 📐 표면적이 넓을수록 :: 날아갈 수 있는 입자가 많다
% 빨래를 '펴서' 너는 까닭 = 표면적. 학생 경험과 연결

= 시뮬레이션: 증발 | 실험실
@ sim.html#diff | 증발 탭에서 25 °C와 70 °C일 때 물 입자가 절반 남을 때까지 걸린 시간을 비교하자.

= 확산과 증발의 공통점
| | 확산 | 증발 |
| 일어나는 곳 | 물질 속 모든 방향 | 액체 표면 |
| 빨라지는 조건 | 온도가 높을수록 | 온도가 높을수록 |
>+ 두 현상 모두 물질을 이루는 입자가 ==스스로 끊임없이 운동==한다는 증거!

= 생활 속 확산과 증발 | 사례
* 🌸 꽃향기 :: 멀리서도 향기를 맡는다 (확산)
* 🔥 가스 냄새 :: 일부러 섞은 냄새 물질이 퍼져 누출을 알린다 (확산)
* 🦟 모기향 :: 연기가 방 전체로 퍼진다 (확산)
* 🧂 염전 :: 바닷물을 증발시켜 소금을 얻는다 (증발)
* 🏺 옹기 물항아리 :: 표면의 물이 증발하며 물을 시원하게 (증발)
* 🖐️ 손 소독제 :: 알코올이 금방 사라진다 (증발)

= 예제 1 · 현상 구분하기 | 적용
- ㄱ. 빵 굽는 냄새가 거리까지 퍼진다 ㄴ. 비가 그친 뒤 웅덩이 물이 줄어든다 ㄷ. 손등에 바른 알코올이 금방 사라진다 ㄹ. 티백을 넣은 물의 색이 진해진다
^+ 다른 물질 속으로 퍼짐 → 확산: **ㄱ, ㄹ**
^+ 액체 표면에서 기체로 날아감 → 증발: **ㄴ, ㄷ**
>+ '퍼진다' → 확산, '사라진다·마른다·줄어든다' → 증발

= 예제 2 · 찬물과 뜨거운 물 | 적용
- 같은 양의 잉크를 찬물과 뜨거운 물에 동시에 떨어뜨렸다.
^+ 비교할 조건 → 물의 **온도**
^+ 온도가 높을수록 → 입자 운동이 **활발**
^+ 결론: **뜨거운 물**에서 더 빨리 퍼진다
>+ 확산의 빠르기로 입자 운동의 활발한 정도를 비교할 수 있다.

= 예제 3 · 빨래 빨리 말리기 | 적용
| 방법 | 증발이 잘 되는 까닭 |
|+ 햇볕 드는 곳에 넌다 | 온도가 높다 |
|+ 바람 통하는 곳에 넌다 | 바람이 수증기를 치운다 |
|+ 맑고 건조한 날 넌다 | 습도가 낮다 |
|+ 펴서 넌다 | 표면적이 넓다 |
>+ 빨래를 접어 겹쳐 널면? → 표면적이 좁아져 ==느리게== 마른다.

= 확인 문제 1
Q 확산에 대한 설명으로 옳지 **않은** 것은?
o 입자가 스스로 운동하여 일어난다.
o 모든 방향으로 일어난다.
o* 누가 섞어 주어야만 일어난다.
o 온도가 높을수록 빠르다.
:: 확산은 누가 섞지 않아도 저절로 일어난다.

= 확인 문제 2
Q 다음 중 증발의 예는?
o 향수 냄새가 퍼진다.
o* 어항의 물이 조금씩 줄어든다.
o 물에 잉크가 퍼진다.
o 꽃향기를 멀리서 맡는다.
:: 나머지는 확산이다.

= 확인 문제 3
Q 젖은 빨래를 빨리 말리는 방법으로 옳지 **않은** 것은?
o 햇볕이 잘 드는 곳에 넌다.
o 바람이 잘 통하는 곳에 넌다.
o* 빨래를 접어서 겹쳐 넌다.
o 습도가 낮은 날에 넌다.
:: 겹치면 표면적이 좁아져 증발이 느려진다.

= 확인 문제 4
Q 확산과 증발이 공통으로 알려 주는 사실은?
o 입자는 움직이지 않는다.
o* 물질을 이루는 입자는 스스로 끊임없이 운동한다.
o 입자의 크기는 온도에 따라 커진다.
o 증발은 끓는점에서만 일어난다.
:: 두 현상 모두 입자의 운동에 대한 증거이다.

= 서술형 도전 | 생각 넓히기
? 도시가스는 원래 냄새가 없지만 일부러 냄새 나는 물질을 섞는다. 이 방법이 효과적인 까닭을 '확산'을 넣어 쓰시오. :: 새어 나온 가스와 냄새 물질의 입자가 확산하여 공기 중으로 빠르게 퍼지므로, 떨어진 곳에서도 냄새로 가스가 새는 것을 알아챌 수 있다.
? 물이 끓는 온도(100 °C)보다 낮은 상온에서도 빨래가 마르는 까닭을 입자의 운동으로 설명하시오. :: 액체 표면의 입자 가운데 운동이 활발한 입자는 끓는 온도보다 낮아도 표면을 벗어나 기체로 날아가기(증발) 때문이다.

= 오늘 배운 내용 정리
- 입자가 스스로 운동하여 다른 물질 속으로 퍼지는 현상 = [[확산]]
- 액체 표면에서 입자가 기체가 되어 날아가는 현상 = [[증발]]
- 확산과 증발은 온도가 [[높을수록]] 빠르다.
- 증발은 바람이 불수록, 습도가 [[낮을수록]], 표면적이 [[넓을수록]] 잘 일어난다.
- 두 현상은 입자가 스스로 끊임없이 [[운동]]한다는 증거이다.

= 나가기 전 한 문제 | 형성평가
? 처음의 세 장면(빵 냄새, 체육복, 티백)을 확산과 증발로 나누고, 공통으로 알 수 있는 사실을 쓰시오. :: 빵 냄새·티백 — 확산, 체육복이 마름 — 증발. 물질을 이루는 입자가 스스로 끊임없이 운동한다.
