# 상태 변화와 열에너지 | 왜 온도가 멈출까? | 중학교 과학 1 · 04 물질의 상태 변화 · 3차시 | 2022 개정 교육과정 [9과04-04]

= 오늘의 학습 목표 | 3차시
^ **가열 곡선**에서 온도가 일정한 구간의 의미를 설명할 수 있다.
^ 상태 변화에서 열에너지를 **흡수·방출**하는 경우를 구별할 수 있다.
^ 상태 변화와 열에너지의 관계를 **생활 속 현상**에 적용할 수 있다.
% 흐름: 생각 열기 5분 → 가열 곡선 15분 → 흡수·방출 10분 → 문항 10분 → 정리 5분

= 얼음물의 온도계 | 생각 열기
* 🧊 얼음물 컵 :: 온도계를 꽂았더니 0 °C
* 🔥 10분 동안 가열 :: 얼음이 점점 녹는다
* 🌡️ 온도계 :: 얼음이 다 녹을 때까지 계속 0 °C!
? 열을 계속 가했는데 온도는 왜 오르지 않았을까? 그 열은 어디에 쓰였을까? :: 얼음 입자의 규칙적인 배열을 무너뜨려 액체로 바꾸는 데 쓰였다.
% 학생 예상을 받은 뒤 시뮬레이션으로 확인

= 지난 시간 복습 | 2차시
| 변화 | 이름 |
| 고체 → 액체 | [[융해]] |
| 액체 → 기체 | [[기화]] |
| 기체 → 액체 | [[액화]] |
| 액체 → 고체 | [[응고]] |
? 상태가 변해도 변하지 않는 것은? :: 질량 (입자의 수와 종류)

## 가열 곡선 | 온도가 멈추는 구간

= 시뮬레이션: 가열 · 냉각 곡선 | 실험실
@ sim.html#curve | −20 °C 얼음을 가열하며 그래프를 관찰하고, 온도가 일정한 구간에서 입자 모형이 어떻게 변하는지 살펴보자.
% 일정한 구간에 들어설 때 일시정지 → '지금 입자는 무엇을 하고 있나?' 질문

= 물의 가열 곡선 | 얼음 10 g, −20 °C에서 120 °C까지
C 가한 열에너지와 온도 | 가한 열에너지 (kJ) | 온도 (°C) | 물 10 g:0,-20 0.42,0 3.76,0 7.96,100 30.56,100 30.96,120
~ 0 °C와 100 °C에서 그래프가 수평 — 열을 계속 가해도 온도가 일정하다

= 구간별로 읽기
| 구간 | 상태 | 온도 | 가한 열 (얼음 10 g) |
|+ A | 고체 | 올라간다 | 0.42 kJ |
|+ B | 고체 + 액체 (융해) | 0 °C 일정 | 3.34 kJ |
|+ C | 액체 | 올라간다 | 4.2 kJ |
|+ D | 액체 + 기체 (기화) | 100 °C 일정 | 22.6 kJ |
|+ E | 기체 | 올라간다 | 0.4 kJ |
~ 시뮬레이션에서 쓰는 값. D 구간이 B 구간보다 훨씬 길다

= 온도가 일정한 까닭
! 흡수한 열에너지가 입자의 ==배열을 바꾸는 데== 쓰인다
- B 구간(융해): 규칙적인 배열을 **무너뜨리는** 데 쓰인다.
+ D 구간(기화): 입자 사이를 **멀리 떼어 놓는** 데 쓰인다.
+ 그래서 입자의 운동(온도)을 높이는 데 쓰이지 않는다.
>+ 녹는점 0 °C, 끓는점 100 °C — 상태 변화 동안 온도는 ==일정==하다.

## 열에너지의 출입 | 흡수하면 시원, 방출하면 따뜻

= 흡수와 방출
| 열에너지를 흡수 | 열에너지를 방출 |
|+ 융해 (고체 → 액체) | 응고 (액체 → 고체) |
|+ 기화 (액체 → 기체) | 액화 (기체 → 액체) |
|+ 승화 (고체 → 기체) | 승화 (기체 → 고체) |
|+ 주위의 온도가 **낮아진다** | 주위의 온도가 **높아진다** |
>+ 입자 사이가 멀어지면 흡수, 가까워지면 방출!

= 생활 속 열에너지 출입 | 사례
* 💦 마당에 물 뿌리기 :: 물이 기화하며 흡수 → 시원
* 🏃 땀이 마를 때 :: 땀이 기화하며 흡수 → 몸이 식는다
* 🧊 드라이아이스 :: 승화하며 흡수 → 음식을 차갑게
* 🛖 이글루 안 물 뿌리기 :: 물이 응고하며 방출 → 따뜻
* ♨️ 수증기 화상 :: 수증기가 액화하며 방출 → 끓는 물보다 심한 화상
* 🍊 과수원 물 뿌리기 :: 서리 내릴 때 물이 얼며 방출 → 냉해 방지

= 에어컨과 냉장고의 원리
^+ 실내기: 냉매가 **기화** → 실내 공기의 열에너지를 **흡수** → 실내가 시원
^+ 냉매가 관을 따라 실외기로 이동
^+ 실외기: 냉매가 **액화** → 열에너지를 **방출** → 실외기 주변이 더움
>+ 냉장고도 같은 원리 — 냉장고 뒤쪽이 따뜻한 까닭!

= 예제 1 · 구간 읽기 | 적용
- 가열 곡선의 B 구간(0 °C, 일정)에 대해 답해 보자.
^+ 물질의 상태 → **고체와 액체가 함께** 있다
^+ 일어나는 상태 변화 → **융해**
^+ 가한 열의 쓰임 → 입자의 **배열을 무너뜨림** (온도를 높이지 않음)

= 예제 2 · 녹이기와 끓이기 비교 | 적용
- 얼음 10 g: 녹이는 데 3.34 kJ, 0 °C 물 → 100 °C 4.2 kJ, 모두 끓이는 데 22.6 kJ
^+ 끓이기 ÷ 녹이기 = 22.6 ÷ 3.34 ≈ **6.8배**
^+ 1초에 100 J씩 가하면 녹는 데 3340 ÷ 100 = **33.4초**
^+ 끓어 없어지는 데 22 600 ÷ 100 = **226초** (약 3분 46초)
>+ 물을 완전히 끓여 없애려면 얼음을 녹일 때보다 훨씬 많은 열이 필요하다.

= 예제 3 · 흡수일까 방출일까? | 적용
- ㄱ. 마당에 물을 뿌리면 시원 ㄴ. 이글루 안에 물을 뿌리면 따뜻 ㄷ. 드라이아이스로 차갑게 ㄹ. 수증기 화상 ㅁ. 땀이 마르며 몸이 식음 ㅂ. 서리 내릴 때 과일에 물 뿌리기
^+ 주위가 시원해짐 → 흡수: **ㄱ, ㄷ, ㅁ**
^+ 주위가 따뜻해짐 → 방출: **ㄴ, ㄹ, ㅂ**

= 확인 문제 1
Q 얼음물 컵의 온도가 얼음이 다 녹을 때까지 0 °C로 일정한 까닭은?
o 얼음이 주위로 열에너지를 내보내기 때문
o* 흡수한 열에너지가 입자의 배열을 바꾸는 데 쓰이기 때문
o 얼음이 녹는 동안 열에너지를 흡수하지 않기 때문
o 물 입자의 크기가 커지는 데 쓰이기 때문
:: 상태 변화 동안 흡수한 열은 입자 배열을 바꾸는 데 쓰인다.

= 확인 문제 2
Q 열에너지를 흡수하는 상태 변화끼리 짝 지은 것은?
o 응고, 액화
o* 융해, 기화
o 액화, 승화(기체 → 고체)
o 응고, 기화
:: 융해·기화·승화(고체 → 기체)는 흡수, 응고·액화·승화(기체 → 고체)는 방출.

= 확인 문제 3
Q 같은 온도인 끓는 물보다 수증기에 데면 더 심하게 화상을 입는 까닭은?
o 수증기의 온도가 훨씬 높아서
o* 수증기가 피부에서 액화하며 열에너지를 방출해서
o 수증기가 피부에서 기화해서
o 수증기의 질량이 더 커서
:: 액화할 때 많은 열에너지를 방출한다.

= 확인 문제 4
Q 가열 곡선에서 물이 끓는 구간(D)이 얼음이 녹는 구간(B)보다 긴 까닭은?
o 끓는점이 녹는점보다 높아서
o* 기화에 필요한 열에너지가 융해보다 훨씬 많아서
o 물이 끓을 때 질량이 늘어나서
o 가열기의 세기가 약해져서
:: 얼음 10 g 기준 기화 22.6 kJ, 융해 3.34 kJ — 약 6.8배

= 서술형 도전 | 생각 넓히기
? 에어컨 실내는 시원해지고 실외기 주변에서는 더운 바람이 나오는 까닭을 열에너지의 출입으로 설명하시오. :: 실내기에서 냉매가 기화하며 실내 공기의 열에너지를 흡수하므로 실내가 시원해지고, 실외기에서 냉매가 액화하며 열에너지를 방출하므로 주변이 더워진다.
? 운동 후 땀이 마르면 몸이 시원해지는 까닭과, 습한 날 더 덥게 느끼는 까닭을 함께 쓰시오. :: 땀이 기화하며 몸의 열에너지를 흡수하기 때문이다. 습한 날에는 증발이 잘 일어나지 않아 열을 덜 빼앗기므로 더 덥게 느낀다.

= 오늘 배운 내용 정리
- 상태 변화가 일어나는 동안에는 열을 가해도 온도가 [[일정]]하다.
- 이때 흡수한 열에너지는 입자의 [[배열]]을 바꾸는 데 쓰인다.
- 융해·기화·승화(고체 → 기체)는 열에너지를 [[흡수]] → 주위가 시원해진다.
- 응고·액화·승화(기체 → 고체)는 열에너지를 [[방출]] → 주위가 따뜻해진다.
- 물이 끓는 데 필요한 열은 얼음이 녹는 데보다 훨씬 [[많다]].

= 나가기 전 한 문제 | 형성평가
? 처음의 얼음물 컵을 가열한 10분 동안, 가한 열에너지는 어디에 쓰였는지 입자 모형으로 쓰시오. :: 얼음 입자의 규칙적인 배열을 무너뜨려 액체(물)로 바꾸는 데 쓰였다. 그래서 얼음이 다 녹을 때까지 온도가 0 °C로 일정했다.
