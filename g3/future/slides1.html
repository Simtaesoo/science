= 과학기술은 융합으로 발전한다
! 과학기술은 여러 분야의 과학 개념이 융합되어 발전한다.
- 전기 자동차 = ==물리==(전동기·에너지) + ==화학==(배터리) + ==지구과학==(기후변화)
- 과학기술은 삶을 편리하게 하지만 사회·윤리·환경 문제를 일으킬 수도 있다.
>+ 그래서 개발과 이용에 **책임**과 **사회적 합의**가 필요하다.

## 계산으로 보는 미래 기술 | 배운 것으로 따져 보기

= 예제 1 · 전기 자동차의 효율 | 19단원 연결
- 1000 kg 자동차를 20 m/s로 달리게 하려면 운동 에너지가 필요하다. 연료(전기)의 에너지 중 운동 에너지로 바뀌는 비율이 전기 자동차 80 %, 내연 기관 자동차 25 %라고 하자. (예시 값)
^+ 필요한 운동 에너지 = ½ × 1000 × 20² = **200 000 J**
^+ 전기 자동차: 200 000 ÷ 0.8 = **250 000 J** 필요
^+ 내연 기관: 200 000 ÷ 0.25 = **800 000 J** 필요
>+ 같은 운동을 하는 데 필요한 에너지가 3배 넘게 차이 난다 → 에너지 효율이 중요한 까닭

= 예제 2 · 태양광 패널 하나의 발전량 | 중2 전기 연결
- 넓이 1 m²의 패널에 햇빛이 1000 W로 들어오고, 패널 효율이 20 %이다. 햇빛이 5시간 비치면? (예시 값)
^+ 전력 = 1000 × 0.2 = **200 W**
^+ 전력량 = 200 W × 5 h = **1000 Wh = 1 kWh**
>+ 흐린 날이나 밤에는 발전량이 줄어든다 → **발전량 변동** 문제, 저장 장치(배터리)가 필요

= 예제 3 · 자율 주행과 반응 시간 | 20단원 연결
- 20 m/s로 달리다 장애물을 발견했다. 사람의 반응 시간 0.7 s, 자율 주행 시스템의 반응 시간 0.1 s라고 하자. (예시 값)
^+ 사람: 20 × 0.7 = **14 m** 이동 후 브레이크
^+ 자율 주행: 20 × 0.1 = **2 m** 이동 후 브레이크
^+ 반응하는 동안 이동하는 거리가 **12 m** 줄어든다.
>+ 그렇다면 자율 주행 자동차가 사고를 내면 책임은 누구에게? → 토론 주제

= 확인 문제 1
Q 전기 자동차와 관련된 중학교 과학 개념으로 가장 거리가 먼 것은?
o 전동기의 원리 (전기와 자기)
o 배터리의 화학 반응
o 운동 에너지
o* 해수의 층상 구조
:: 전기 자동차는 전동기, 배터리, 에너지 전환과 관련이 깊다.

## 과학기술과 사회 | 균형 있게 판단하기

= 과학기술 토론 | 주제 고르기
* 🚗 자율 주행 :: 자율 주행 자동차 사고의 책임은 누구에게 있을까?
* 🧬 유전자 가위 :: 사람의 유전자를 고쳐도 될까?
* 🎨 인공지능 그림 :: 인공지능이 그린 그림의 주인은 누구일까?
> 나의 입장 → **과학적 근거** → 예상되는 반론 → 반론에 대한 답
% 모둠별로 주제 하나를 골라 찬반 근거를 정리. 근거는 반드시 과학적 사실이나 자료로

= 과학적 정보 판단하기
+ 정보의 **출처**가 공식 기관이나 전문가인가?
+ 근거가 되는 **자료나 연구**가 제시되어 있는가?
+ 다른 믿을 만한 출처에서도 **같은 내용**을 확인할 수 있는가?
+ 과장되거나 감정을 자극하는 **표현**은 없는가?
>+ "100 % 효과", "의사들이 숨기는 비밀" 같은 표현은 의심부터!

= 예제 4 · 이 기사는 믿을 만할까? | 적용
- "이 팔찌를 차면 전자파가 100 % 차단되어 집중력이 2배 오른다!" (출처: 판매 업체 블로그)
^+ 출처: 판매 업체 → 이해관계가 있다 ✘
^+ 근거: 실험 자료나 연구가 없다 ✘
^+ 표현: '100 %', '2배' — 과장된 표현 ✘
^+ 결론: **믿기 어렵다.** 공식 기관이나 연구 결과를 찾아 확인해야 한다.

= 생활 속 미래 기술 | 사례
* 🏥 AI 의료 영상 :: 엑스선·CT 사진에서 질병의 흔적을 찾아 의사를 돕는다
* 🌾 스마트 농장 :: 센서로 온도·습도를 재어 작물을 기른다
* 🔋 배터리 재활용 :: 폐배터리에서 금속을 다시 뽑아 쓴다
* 🛰️ 위성 관측 :: 태풍·산불·해수면을 우주에서 감시한다
* 🧪 mRNA 백신 :: 유전 정보를 이용해 빠르게 백신을 만든다
* 🏠 스마트 홈 :: 에너지 사용을 자동으로 줄인다

= 확인 문제 2
Q 과학기술에 대한 태도로 가장 알맞은 것은?
o 새로운 기술은 무조건 받아들인다
o 문제가 생길 수 있으므로 모든 기술 개발을 멈춘다
o* 좋은 점과 문제점을 함께 따져 책임 있게 이용한다
o 과학자만 판단하면 되므로 관심을 갖지 않는다
:: 과학기술의 영향을 균형 있게 평가하고 사회적 합의를 거쳐 이용해야 한다.

= 확인 문제 3
Q 태양광 패널의 전력이 200 W일 때, 3시간 동안 생산한 전력량은?

= 확인 문제 4
Q 믿을 만한 과학 정보를 판단하는 기준으로 알맞지 않은 것은?
o 출처가 공식 기관이나 전문가인지 확인한다
o 근거 자료가 있는지 확인한다
o 다른 출처에서도 확인되는지 살핀다
o* 조회 수와 '좋아요'가 많으면 믿는다
:: 많이 퍼진 정보라고 해서 사실인 것은 아니다.

= 서술형 도전 | 생각 넓히기
? 내가 고른 미래 기술 하나에 쓰인 과학 원리를 두 가지 쓰고, 좋은 점과 생각해 볼 문제를 한 가지씩 쓰시오. :: (예시) 전기 자동차 — 원리: 전동기(전류가 흐르는 코일이 자기장에서 힘을 받음), 배터리의 화학 반응 / 좋은 점: 배출 가스 감소 / 문제: 배터리 자원 채굴과 폐배터리 처리
? 자율 주행 자동차 사고의 책임에 대한 나의 입장을 과학적 근거를 들어 쓰시오. :: (예시) 제조사에 책임이 크다 — 반응 시간·센서 성능 등 시스템이 판단을 대신하므로, 시스템 오류로 인한 사고는 설계·검증을 맡은 제조사가 책임져야 한다. (반대 입장도 근거가 타당하면 인정)
% 서술형 2는 입장보다 '근거의 과학성'으로 평가
