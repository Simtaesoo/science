# 나의 진로 설계 | 흥미, 적성, 가치관으로 그리는 지도 | 중학교 과학 3 · 23 과학과 나의 미래 · 3차시 | 2022 개정 교육과정 [9과23-02]

= 오늘의 학습 목표 | 3차시
^ 나의 **흥미·적성·가치관**과 역량을 탐색할 수 있다.

* 🔬 중1 :: 현미경으로 처음 세포를 보았다
* ⚡ 중2 :: 전기 회로를 직접 꾸며 보았다
* 🎢 중3 :: 롤러코스터를 설계해 역학적 에너지를 계산했다
* 🧭 지금 :: 과학과 함께 어떤 미래를 그릴까?
? 3년 동안 과학 시간에 가장 기억에 남는 순간은? :: (자유 발표) 기억에 남는 순간에는 나의 **흥미**와 **강점**이 숨어 있다 — 오늘은 그것을 진로로 연결해 본다.

= 지난 시간 복습 | 2차시
- 과학 관련 직업은 과학자뿐 아니라 [[다양한 분야]]에 있다.
- 필요한 역량: 탐구 능력, 창의적 사고, [[협업·소통]], 디지털 활용

? 지난 시간에 조사한 직업에 필요한 역량 중, 나에게 이미 있는 것은? :: (자유 발표) 오늘은 그 역량을 점수로 나타내 보자.

## 나를 알아보기 | 흥미, 적성, 가치관

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#plan | 여섯 가지 역량을 스스로 평가하여 막대를 움직이고, 나의 강점과 키우고 싶은 역량을 확인하자.
% 정답이 없는 활동임을 강조하고, 솔직하게 평가하도록 안내

= 진로를 정하는 세 가지 기준
| 기준 | 질문 | 예 |
|+ 흥미 | 무엇을 할 때 즐거운가? | 실험, 관찰, 만들기, 설명하기 |
|+ 적성 | 무엇을 잘하는가? | 계산, 그림, 글쓰기, 손재주 |
|+ 가치관 | 무엇을 중요하게 여기는가? | 사람 돕기, 환경 보호, 새로운 발견 |
>+ 세 가지가 **겹치는 곳**에 나에게 맞는 진로가 있을 가능성이 크다.

= 예제 1 · 역량 점수 분석 | 적용
| 역량 | 탐구심 | 창의성 | 협업 | 끈기 | 수리·논리 | 소통 |
| 점수 | 80 | 60 | 70 | 50 | 90 | 60 |
^+ 합 = 80 + 60 + 70 + 50 + 90 + 60 = **410**
^+ 평균 = 410 ÷ 6 ≈ **68.3**
^+ 강점: **수리·논리(90)**, 탐구심(80) / 키우고 싶은 역량: **끈기(50)**
>+ 강점은 살리고, 약한 역량은 구체적인 활동으로 키운다 (예: 끈기 → 장기 탐구 과제 완성하기).

= 예제 2 · 흥미·적성·가치관 연결 | 적용
- 민지: 흥미 — 바다 생물 관찰 / 적성 — 꼼꼼한 기록 / 가치관 — 환경 보호
^+ 관련 단원: 수권과 해수의 순환, 생물의 다양성
^+ 세 가지가 겹치는 직업 예: **해양 생태 연구원**, 해양 환경 감시원
^+ 다음 단계: 고등학교에서 관련 선택 과목, 바다 생태 탐구 보고서

= 확인 문제 1
Q 진로를 탐색할 때 '가치관'에 해당하는 질문은?
o 나는 무엇을 할 때 즐거운가?
o 나는 무엇을 잘하는가?
o* 나는 무엇을 중요하게 여기는가?
o 어떤 직업이 돈을 많이 버는가?
:: 가치관은 내가 중요하게 여기는 것(사람 돕기, 환경 보호 등)이다.

## 진로 로드맵 | 지금부터 10년 뒤까지

= 진로 로드맵 그리기
| 시기 | 목표 | 구체적인 활동 (예) |
|+ 중학교 3학년 | 관심 분야 찾기 | 과학 동아리, 관련 책 읽기, 진로 체험 |
|+ 고등학교 | 관련 역량 기르기 | 관련 선택 과목 이수, 탐구 보고서 작성 |
|+ 대학교·직업 훈련 | 전문 지식 쌓기 | 관련 학과 진학, 자격증, 연구 참여 |
|+ 10년 뒤의 나 | 꿈꾸는 모습 | 어떤 일을 하며 누구에게 도움이 될까? |

= 예제 3 · 로드맵을 구체적으로 | 적용
- 목표: "기상 예보관이 되고 싶다"
^+ 중3: 날씨와 기후변화 단원 복습, 기상청 누리집에서 일기도 읽어 보기
^+ 고등학교: 지구과학·수학·정보 관련 과목 이수, 기상 자료 분석 탐구
^+ 대학교: 대기과학 관련 학과, 기상 관련 자격 준비
>+ '열심히 한다'보다 **무엇을, 언제** 할지 쓰는 것이 좋은 로드맵이다.

= 생활 속 진로 탐색 방법 | 사례
* 💻 커리어넷 :: 진로 심리 검사와 직업 정보를 무료로 확인
* 🏫 진로 체험 :: 연구소·대학·기업 견학과 직업인 특강
* 📚 독서 :: 과학자의 전기와 교양 과학책 읽기
* 🔬 과학 동아리 :: 관심 주제로 직접 탐구해 보기
* 🎤 인터뷰 :: 주변의 과학 관련 직업인에게 직접 묻기
* 🗂️ 포트폴리오 :: 탐구 보고서와 활동 기록을 모아 두기

= 확인 문제 2
Q 좋은 진로 로드맵의 특징으로 가장 알맞은 것은?
o 직업 이름만 적는다
o* 시기별로 구체적인 활동을 적는다
o 한 번 정하면 절대 바꾸지 않는다
o 다른 사람의 로드맵을 그대로 따라 한다
:: 시기별로 무엇을 할지 구체적으로 적고, 필요하면 수정해 나간다.

= 확인 문제 3
Q 역량 점수가 탐구심 70, 창의성 80, 협업 90, 끈기 60, 수리·논리 50, 소통 90일 때 평균은?
o 65
o* 73.3
o 80
o 90
:: (70 + 80 + 90 + 60 + 50 + 90) ÷ 6 = 440 ÷ 6 ≈ 73.3

= 확인 문제 4
Q 진로를 탐색하는 방법으로 알맞지 않은 것은?
o 진로 심리 검사를 해 본다
o 관심 분야의 직업인을 인터뷰한다
o 과학 동아리에서 탐구 활동을 한다
o* 친구가 고른 직업을 그대로 고른다
:: 진로는 나의 흥미·적성·가치관을 바탕으로 스스로 탐색해야 한다.

= 서술형 도전 | 생각 넓히기
? 중학교 과학에서 가장 흥미로웠던 단원과 그 까닭을 쓰고, 그 단원과 관련된 직업을 하나 쓰시오. :: (예시) 생식과 유전 — 가계도로 유전 형질을 추리하는 것이 퍼즐 같아 재미있었다. 관련 직업: 유전 상담사, 생명공학 연구원
? 나의 강점 역량과 키우고 싶은 역량을 하나씩 쓰고, 키우기 위한 구체적인 활동을 쓰시오. :: (예시) 강점: 탐구심 / 키우고 싶은 역량: 소통 → 모둠 탐구 결과를 매달 한 번 반 친구들 앞에서 발표하기
% 정답이 없는 문항 — 구체성과 자기 성찰이 드러나면 인정

= 미래의 나에게 보내는 편지 | 활동
- 과학을 배우며 **달라진 생각**은?
- 앞으로 과학과 함께 **이루고 싶은 꿈**은?
- 10년 뒤의 나에게 **해 주고 싶은 말**은?
> 편지는 봉투에 넣어 보관했다가 고등학교 졸업 때 열어 보자.
% 편지는 공개 발표를 강요하지 않는다. 희망자만 한 문장 공유
