<script>
const app = AppKit({
  id: 'match', title: '미래 기술 카드 짝', unit: '중3 · 23 과학기술과 인류 문명', back: '../../index.html#g3', sim: 'sim.html#tech',
  lead: '뒤집힌 카드 속에는 <b>미래 기술</b>과 그 기술을 가능하게 한 <b>과학 원리</b>가 숨어 있어요. 짝을 찾아 기술과 원리를 연결하세요! 모둠 대결도 OK.',
  howto: ['카드를 2장 뒤집어요. <b>기술 카드(파랑)</b>와 그 <b>원리 카드(노랑)</b>가 짝이면 가져가요.', '짝을 맞히면 한 번 더! 틀리면 다음 모둠 차례예요.', '짝을 맞힐 때 나오는 설명을 함께 읽어 보세요. 중학교에서 배운 개념이 숨어 있어요.'],
  options: [{key: 'n', label: '카드', choices: [[6, '12장'], [8, '16장'], [10, '20장']], def: 8}, {key: 'players', label: '인원', choices: [[1, '1명'], [2, '2모둠'], [3, '3모둠'], [4, '4모둠']], def: 2}],
  recap: '과학 원리가 기술로 이어지고, 기술은 새로운 과학 탐구를 가능하게 합니다. 태양 전지(빛 → 전기), 무선 충전(전자기 유도), 연료 전지(화학 반응 → 전기)처럼 <b>에너지 전환</b>을 이용한 기술이 많아요. 동시에 개인 정보, 일자리, 생명 윤리 같은 <b>사회적 쟁점</b>도 생기므로 과학기술을 책임 있게 활용하는 태도가 필요해요.',
  startLabel: '카드 섞기'
});
const {S, sfx, toast} = app, D = Draw;
const PAIRS = [['☀️', '태양 전지', '빛에너지 → 전기 에너지', '반도체가 빛을 받으면 전자가 움직여 전류가 흘러요.'], ['🚄', '자기 부상 열차', '자석의 척력으로 띄우기', '전자석으로 같은 극끼리 밀어내 열차를 띄워 마찰을 줄여요.'], ['🔋', '무선 충전', '전자기 유도', '코일 속 자기장이 변하면 다른 코일에 전류가 유도돼요.'], ['🚗', '회생 제동 자동차', '운동 에너지 → 전기 에너지 회수', '브레이크를 밟을 때 발전기를 돌려 에너지를 저장해요.'],
  ['🛰️', 'GPS', '신호 도달 시간으로 거리 계산', '여러 위성까지의 거리(속력 × 시간)로 위치를 찾아요.'], ['🖨️', '3D 프린터', '얇은 층을 차례로 쌓기', '재료를 한 층씩 녹여 쌓아 입체를 만들어요.'], ['✂️', '유전자 가위', 'DNA의 특정 부위 자르기', '원하는 염기 서열을 찾아 잘라 유전자를 고쳐요.'], ['🤖', '인공지능', '데이터로 패턴 학습', '많은 예시 데이터에서 규칙을 스스로 찾아내요.'],
  ['🚁', '드론', '작용 반작용으로 양력 얻기', '프로펠러가 공기를 아래로 밀면 공기가 드론을 위로 밀어요.'], ['💧', '수소 연료 전지', '수소 + 산소 → 물 + 전기', '연소 대신 화학 반응으로 전기를 얻고 물만 배출해요.'], ['🌱', '스마트 팜', '센서로 환경 측정·자동 조절', '온도·습도·빛을 측정해 식물에 알맞게 조절해요.'], ['💡', 'LED 조명', '반도체에서 빛 방출', '전자가 이동하며 에너지를 빛으로 내보내 효율이 높아요.'],
  ['📷', '열화상 카메라', '적외선 감지', '온도가 높은 물체일수록 적외선을 많이 내보내요.'], ['🚰', '역삼투 정수기', '반투과성 막', '압력을 가해 물 분자만 막을 통과시켜요.'], ['📎', '형상 기억 합금', '온도에 따라 원래 모양 회복', '가열하면 원자 배열이 되돌아가 처음 모양이 돼요.'], ['💉', 'mRNA 백신', '면역 반응 유도', '항원 정보를 전달해 몸이 항체를 미리 만들게 해요.']];
let cards, open, busy, found, ui = {};
app.onStart = o => { const pick = PAIRS.slice().sort(() => Math.random() - .5).slice(0, o.n); cards = []; pick.forEach((p, i) => { cards.push({id: i, side: 't', p, up: 0, gone: false, flip: 0}); cards.push({id: i, side: 'p', p, up: 0, gone: false, flip: 0}); }); cards.sort(() => Math.random() - .5); open = []; busy = false; found = 0;
  ui.i = app.panel('찾은 짝'); ui.i.innerHTML = '<p class="note-c">아직 없어요.</p>'; app.setLevel(0, o.n); app.startTimer(); };
function grid(){ const W = S.w, H = S.h, n = cards.length, cols = n <= 12 ? 4 : n <= 16 ? 4 : 5, rows = Math.ceil(n / cols), gap = 10, cw = (W - gap * (cols + 1)) / cols, ch = (H - gap * (rows + 1)) / rows; return cards.map((c, i) => ({c, x: gap + (i % cols) * (cw + gap), y: gap + Math.floor(i / cols) * (ch + gap), w: cw, h: ch})); }
app.pointer({tap(x, y){ if (busy || !cards) return; const r = grid().find(r => x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h); if (!r || r.c.gone || r.c.up) return; r.c.up = 1; open.push(r.c); sfx.click();
  if (open.length === 2) { busy = true; const [a, b] = open; if (a.id === b.id && a.side !== b.side) { setTimeout(() => { a.gone = b.gone = true; found++; app.addScore(100); sfx.ok(); app.confetti(30); toast(`${a.p[1]} ↔ ${a.p[2]}`, 'good'); app.setLevel(found - 1, cards.length / 2);
      if (found === 1) ui.i.innerHTML = ''; ui.i.insertAdjacentHTML('afterbegin', `<p style="margin-bottom:6px">${a.p[0]} <b>${a.p[1]}</b> — ${a.p[2]}<br><span class="note-c">${a.p[3]}</span></p>`); open = []; busy = false;
      if (found === cards.length / 2) setTimeout(() => app.finish({stars: app.multi ? 3 : app.elapsed() < cards.length * 6 ? 3 : app.elapsed() < cards.length * 10 ? 2 : 1, summary: app.multi ? '모둠별 점수입니다.' : `${Math.round(app.elapsed())}초 만에 모든 짝을 찾았어요!`, best: app.multi ? null : Math.round(app.elapsed()) + '초', bestValue: Math.round(app.elapsed())}), 900); }, 500); }
    else setTimeout(() => { sfx.bad(); a.up = b.up = 0; open = []; busy = false; app.nextTurn(); }, 1100); } }});
app.draw = (g, W, H) => { if (!cards) return; const t = performance.now() / 1000;
  g.fillStyle = '#1b2a3a'; g.fillRect(0, 0, W, H); for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.arc((i * 131) % W, (i * 71) % H, 1.5, 0, 7); g.fill(); }
  grid().forEach(r => { const c = r.c; c.flip = D.lerp(c.flip, c.up || c.gone ? 1 : 0, .2); if (c.gone && c.flip > .98) { g.globalAlpha = .18; } const sx = Math.abs(Math.cos(c.flip * Math.PI)), front = c.flip > .5;
    g.save(); g.translate(r.x + r.w / 2, r.y + r.h / 2); g.scale(Math.max(.02, sx), 1);
    if (!front) { const gr = g.createLinearGradient(-r.w / 2, -r.h / 2, r.w / 2, r.h / 2); gr.addColorStop(0, '#3d6a8a'); gr.addColorStop(1, '#2a4a66'); g.fillStyle = gr; D.rr(g, -r.w / 2, -r.h / 2, r.w, r.h, 12); g.fill(); g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 2; g.stroke(); D.text(g, '?', 0, 0, {size: Math.min(r.w, r.h) * .4, display: true, color: 'rgba(255,255,255,.5)'}); }
    else { const tech = c.side === 't'; g.fillStyle = tech ? '#dcecff' : '#fff3c4'; D.rr(g, -r.w / 2, -r.h / 2, r.w, r.h, 12); g.fill(); g.strokeStyle = tech ? '#4a7fd6' : '#d0a020'; g.lineWidth = 3; g.stroke();
      D.text(g, tech ? '기술' : '원리', -r.w / 2 + 10, -r.h / 2 + 12, {size: 10, weight: 700, color: tech ? '#4a7fd6' : '#a07a10', align: 'left'});
      if (tech) { D.text(g, c.p[0], 0, -r.h * .1, {size: Math.min(r.w, r.h) * .32}); D.text(g, c.p[1], 0, r.h * .3, {size: Math.min(15, r.w / 7), weight: 700, color: '#1d3a58'}); }
      else { const words = c.p[2].split(' '), lines = []; let cur = ''; g.font = `700 ${Math.min(14, r.w / 8)}px 'IBM Plex Sans KR',sans-serif`; words.forEach(w => { if (g.measureText(cur + ' ' + w).width > r.w - 16 && cur) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }); lines.push(cur);
        lines.forEach((l, i) => D.text(g, l, 0, (i - (lines.length - 1) / 2) * 18, {size: Math.min(14, r.w / 8), weight: 700, color: '#5a4310'})); } }
    g.restore(); g.globalAlpha = 1; });
};
</script>
