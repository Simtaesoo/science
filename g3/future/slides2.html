## 직업 체험 | 그 직업인처럼 풀어 보기

= 예제 1 · 기상 예보관이 되어 보기 | 17단원
- 기온 25 ℃, 수증기량 10.0 g/kg이다. 상대 습도는? (25 ℃ 포화 수증기량 20.0 g/kg)
^+ 상대 습도 = 10.0 ÷ 20.0 × 100 = **50 %**
^+ 밤에 기온이 내려가면? 수증기량이 그대로여도 상대 습도는 **높아진다.**
>+ 예보관은 이런 계산을 수많은 관측소 자료로 동시에 한다 → **데이터 분석 능력**이 중요

= 예제 2 · 지진 연구원이 되어 보기 | 22단원
- 관측소 세 곳의 PS시가 3초, 9초, 15초였다. 진앙에서 가장 먼 관측소는?
^+ 진앙에서 멀수록 PS시가 **길다**
^+ PS시 15초인 관측소가 **가장 멀다**
^+ 가까운 관측소가 P파를 먼저 감지해 먼 도시에 **조기 경보**를 보낸다.
>+ 지진 연구원 = 지구과학 + 물리 + 데이터 분석의 **융합**

= 예제 3 · 유전 상담사가 되어 보기 | 21단원
- 정상인 부부가 모두 보인자(Tt)인 열성 유전병이 있다. 자녀가 이 병을 가질 확률은?
^+ Tt × Tt → TT : Tt : tt = 1 : 2 : 1
^+ 병을 가질 확률(tt) = **1/4 = 25 %**
>+ 유전 상담사는 확률을 정확히 계산할 뿐 아니라, 가족이 이해할 수 있게 **소통**하는 역량도 필요하다.

## 필요한 역량과 연구 윤리 | 과학자의 자세

= 과학 관련 직업인에게 필요한 역량
| 역량 | 뜻 | 과학 시간에 길러 본 경험 (예) |
|+ 탐구 능력 | 문제를 발견하고 가설을 세워 실험으로 확인 | 우무 조각 실험, 반응 시간 측정 |
|+ 창의적 사고 | 새로운 방법이나 아이디어를 떠올림 | 롤러코스터 설계 |
|+ 협업·소통 | 함께 연구하고 결과를 설명 | 모둠 실험, 발표 |
|+ 디지털 활용 | 데이터를 수집·분석하고 도구를 활용 | 시뮬레이션, 그래프 그리기 |

= 연구 윤리
- 데이터를 ==조작·위조==하지 않기
- 다른 사람의 연구를 ==표절==하지 않기
- 생명과 안전을 **존중**하기
- 결과를 **정직하게** 발표하기
>+ 과학은 '믿을 수 있는 결과'가 쌓여 발전한다 — 정직하지 않은 결과 하나가 많은 사람을 위험에 빠뜨릴 수 있다.

= 예제 4 · 결과가 가설과 다르다면? | 적용
- 모둠 실험에서 측정값 하나가 다른 값들과 크게 달랐다. (9.8, 9.7, 9.9, 7.2, 9.8)
^+ 결과를 지우거나 고치지 **않고** 그대로 기록한다.
^+ 실험 과정에 **오류**(측정 실수, 장치 문제)가 없었는지 확인한다.
^+ **반복 실험**을 하거나, 필요하면 가설을 수정한다.
^+ 보고서에 그 값과 처리 이유를 **밝힌다.**

= 생활 속 과학 직업 이야기 | 사례
* 🎙️ 과학 커뮤니케이터 :: 어려운 과학을 쉽게 전하는 직업
* 🧑‍🚒 소방관 :: 연소의 조건과 유해 기체의 성질을 현장에서 쓴다
* 👩‍🍳 식품 연구원 :: 화학 반응과 미생물로 새 식품을 개발한다
* 🎮 게임 개발자 :: 물리 엔진으로 중력과 충돌을 계산한다
* 🌳 환경 컨설턴트 :: 기업의 온실 기체 배출을 측정하고 줄이는 방법을 제안
* 🛰️ 위성 데이터 분석가 :: 위성 사진으로 산불·홍수를 감시

= 확인 문제 2
Q 과학 연구에서 지켜야 할 연구 윤리가 아닌 것은?
o 데이터를 조작하지 않는다
o 다른 사람의 연구를 표절하지 않는다
o 결과를 정직하게 발표한다
o* 가설과 다른 결과는 지운다
:: 가설과 다른 결과도 그대로 기록하고 원인을 확인해야 한다.

= 확인 문제 3
Q 모둠 실험에서 결과를 정리해 다른 사람에게 설명하는 활동으로 기를 수 있는 역량은?
o 끈기
o* 협업·소통
o 암기력
o 손재주
:: 함께 연구하고 결과를 설명하는 것은 협업·소통 역량이다.

= 확인 문제 4
Q 지진 조기 경보에 대한 설명으로 옳은 것은?
o S파가 P파보다 먼저 도착하는 것을 이용한다
o 진앙에서 가까울수록 대비할 시간이 길다
o* 빠른 P파를 먼저 감지해 큰 흔들림(S파)이 오기 전에 알린다
o PS시는 진앙 거리와 관계없다
:: P파가 먼저 도착하고, 진앙에서 멀수록 PS시가 길어 대비할 시간이 늘어난다.

= 서술형 도전 | 생각 넓히기
? 실험 결과가 가설과 다르게 나왔을 때 과학자가 해야 할 올바른 행동을 쓰시오. :: 결과를 있는 그대로 기록하고, 실험 과정에 오류가 없었는지 확인한 뒤 반복 실험을 하거나 가설을 수정한다. 결과를 바꾸거나 숨기지 않는다.
? 10년 뒤 새로 생길 것 같은 과학 관련 직업을 상상하여 이름을 붙이고, 하는 일과 필요한 과학 지식을 쓰시오. :: (예시) 폐배터리 자원 순환 전문가 — 다 쓴 배터리에서 금속을 안전하게 분리해 재활용한다. 필요한 지식: 화학 반응, 물질의 성질, 전기
