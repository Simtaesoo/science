= 계절마다 날씨가 다른 까닭은? | 생각 열기
* 🥶 겨울 :: 매섭게 춥고 건조하다
* 🌸 봄 :: 맑고 건조하며 황사가 온다
* ☔ 초여름 :: 장마가 시작된다
* 🥵 한여름 :: 무덥고 습하며 열대야가 이어진다
? 겨울 공기와 여름 공기는 '어디에서 왔는지'가 다르다. 어디일까? :: 겨울에는 차갑고 건조한 **대륙(시베리아)**에서, 여름에는 덥고 습한 **바다(북태평양)**에서 공기 덩어리가 온다.

- 바람은 [[고기압]]에서 [[저기압]]으로 분다.

- 고기압 중심: [[하강]] 기류 → 맑음
? 찬 공기와 따뜻한 공기가 만나면 어느 공기가 위로 갈까? :: 따뜻한 공기는 가벼워(밀도가 작아) **위로** 올라가고, 찬 공기는 아래로 파고든다. — 오늘의 핵심!

## 기단 | 성질이 비슷한 거대한 공기 덩어리

= 기단이란?
! 기단: 기온과 습도 등의 성질이 비슷한 큰 공기 덩어리
- 넓은 대륙이나 바다 위에 오래 머물며 그곳의 성질을 닮는다.
||
| 발원지 | 성질 |
|+ 대륙 | [[건조]] |
|+ 바다 | [[다습]] |
|+ 고위도 | [[한랭]] |
|+ 저위도 | [[고온·온난]] |

= 우리나라에 영향을 주는 기단 | 개념 정리
| 기단 | 성질 | 계절 | 날씨 |
|+ 시베리아 기단 | 한랭 건조 | 겨울 | 한파, 건조 |
|+ 양쯔강 기단 | 온난 건조 | 봄, 가을 | 맑고 건조, 황사 |
|+ 오호츠크해 기단 | 한랭 다습 | 초여름 | 높새바람, 장마 전선 |
|+ 북태평양 기단 | 고온 다습 | 여름 | 무더위, 열대야 |
% 지도에 네 기단의 위치를 표시하고 '대륙/바다, 북/남'으로 성질을 맞혀 보게 하기

= 예제 1 · 기단의 성질 추리하기 | 적용
- 발원지만 보고 기단의 성질을 맞혀 보자.
^+ 시베리아: 고위도 + 대륙 → **한랭 건조**
^+ 북태평양: 저위도 + 바다 → **고온 다습**
^+ 오호츠크해: 고위도 + 바다 → **한랭 다습**
>+ 기단이 이동하면 지나는 곳의 영향으로 성질이 조금씩 **변한다** (예: 시베리아 기단이 서해를 지나며 수증기를 얻어 눈구름).

= 확인 문제 1
Q 우리나라 여름철 무더위와 열대야를 일으키는 기단의 성질은?
o 한랭 건조
o 온난 건조
o 한랭 다습
o* 고온 다습
:: 여름에는 저위도 바다에서 발원한 북태평양 기단(고온 다습)의 영향을 받는다.

## 전선 | 두 기단이 만나는 경계

= 전선면과 전선
- 성질이 다른 두 기단이 만나면 쉽게 섞이지 않고 경계면이 생긴다.
- **전선면**: 두 기단의 경계면 / **전선**: 전선면이 지표와 만나는 선
- 따뜻한 공기가 전선면을 따라 ==상승== → 단열 팽창 → 구름·비
>+ 전선 부근에서는 날씨 변화가 크다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#front | 한랭 전선과 온난 전선을 [전선 이동]으로 관측 지점을 통과시키고, 구름·강수·기온 변화를 비교하자.
% 관측 지점의 기온 그래프가 전선 통과 후 어느 쪽으로 바뀌는지 꼭 확인

= 한랭 전선과 온난 전선 | 개념 정리
| 구분 | 한랭 전선 | 온난 전선 |
|+ 생성 | 찬 공기가 따뜻한 공기 밑으로 파고듦 | 따뜻한 공기가 찬 공기 위로 올라감 |
|+ 전선면 기울기 | 급함 | 완만함 |
|+ 구름 / 강수 | 적운형, 좁은 지역 소나기 | 층운형, 넓은 지역 지속적인 비 |
|+ 이동 속도 | 빠름 | 느림 |
|+ 통과 후 기온 | 낮아짐 | 높아짐 |
|+ 일기도 기호 | ▲▲▲ (파란색) | ●●● (빨간색) |

= 예제 2 · 한랭 전선 통과 기록 | 자료 해석
| 시각 | 9시 | 12시 | 15시 | 18시 |
| 기온 (℃) | 23 | 24 | 17 | 16 |
| 날씨 | 흐림 | 소나기 | 갬 | 맑음 |
^+ 12시에 **소나기** → 적운형 구름 → 한랭 전선의 특징
^+ 12시 → 15시 기온이 24 → 17 ℃, **7 ℃ 하강**
^+ 결론: **한랭 전선**이 **12시~15시 사이**에 통과했다.

= 예제 3 · 온난 전선 통과 기록 | 자료 해석
C 어느 지역의 기온 변화 (예시 자료) | 시각 (시) | 기온 (℃) | 기온:3,11 6,12 9,13 12,19 15,20 18,19
||
- 날씨: 3시 흐림 → 6시 비 → 9시 비 → 12시 갬 → 15시 맑음
+ 오랫동안 [[지속적인 비]] → 층운형 구름
+ 9시 → 12시 기온이 13 → 19 ℃, [[6 ℃ 상승]] → [[온난 전선]] 통과

= 생활 속 기단과 전선 | 사례
* 🌧️ 장마 :: 오호츠크해·북태평양 기단 사이에 장마 전선이 머문다
* 🍃 높새바람 :: 오호츠크해 기단이 산맥을 넘어 영서 지방이 고온 건조
* ❄️ 서해안 폭설 :: 시베리아 기단이 서해에서 수증기를 얻어 눈구름
* 🌫️ 황사 :: 봄철 건조한 바람이 흙먼지를 실어 온다
* ⛈️ 소나기 뒤 선선함 :: 한랭 전선이 지나간 뒤 기온이 내려간다
* 🔥 열대야 :: 북태평양 기단이 강하면 밤에도 25 ℃ 이상

= 확인 문제 2
Q 한랭 전선에 대한 설명으로 옳은 것은?
o 전선면의 기울기가 완만하다
o 넓은 지역에 지속적인 비가 내린다
o* 통과한 후 기온이 낮아진다
o 일기도 기호는 빨간색 반원이다
:: 찬 공기가 파고들어 전선면이 급하고, 좁은 지역에 소나기가 내린 뒤 찬 공기 영역에 들어가 기온이 낮아진다.

= 확인 문제 3
Q 온난 전선이 다가올 때 관측 지점에서 나타나는 날씨로 옳은 것은?
o 적운형 구름에서 소나기가 짧게 내린다
o* 층운형 구름이 넓게 퍼지고 비가 오래 내린다
o 기온이 갑자기 크게 낮아진다
o 맑은 날씨가 계속된다
:: 따뜻한 공기가 완만한 전선면을 타고 올라가 넓은 층운형 구름을 만든다.

= 확인 문제 4
Q 다음 중 기단과 날씨를 잘못 짝지은 것은?
o 시베리아 기단 — 겨울 한파
o 북태평양 기단 — 여름 무더위
o* 양쯔강 기단 — 장마 전선 형성
o 오호츠크해 기단 — 높새바람
:: 장마 전선은 오호츠크해 기단과 북태평양 기단이 만나 생긴다. 양쯔강 기단은 봄·가을의 맑고 건조한 날씨를 가져온다.

= 서술형 도전 | 생각 넓히기
? 기온이 23 → 24 → 17 → 16 ℃로 변하고 12시에 소나기가 내렸다. 통과한 전선의 종류와 시각, 근거를 쓰시오. :: 한랭 전선, 12시~15시 사이. 소나기가 내린 뒤 기온이 크게 낮아지고 날씨가 개었기 때문이다.
? 지구 온난화로 북태평양 기단의 세력이 강해지면 우리나라 여름 날씨는 어떻게 달라질지 예상하시오. :: 무더위와 열대야가 길어지고 여름이 일찍 시작해 늦게 끝나며, 수증기가 많아 집중 호우가 잦아질 수 있다.

- 성질이 비슷한 큰 공기 덩어리 → [[기단]] (대륙: 건조, 바다: 다습)
- 겨울 [[시베리아]], 여름 [[북태평양]], 초여름 [[오호츠크해]], 봄·가을 [[양쯔강]] 기단

= 나가기 전 한 문제 | 형성평가
? 한랭 전선과 온난 전선에서 비가 내리는 모습이 다른 까닭을 '전선면의 기울기'를 넣어 한 문장으로 쓰시오. :: 한랭 전선은 전선면이 급해 공기가 강하게 상승하므로 적운형 구름에서 좁은 지역에 소나기가, 온난 전선은 전선면이 완만해 공기가 천천히 넓게 상승하므로 층운형 구름에서 넓은 지역에 지속적인 비가 내린다.
