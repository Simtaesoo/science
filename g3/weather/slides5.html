= 공기가 우리를 누르고 있다? | 생각 열기
* 🥤 빨대 :: 빨대로 빨면 음료가 올라온다
* 🍪 과자 봉지 :: 높은 산에 오르면 빵빵하게 부푼다
* 🧲 흡착판 :: 벽에 붙인 흡착판이 잘 떨어지지 않는다
* 🏖️ 바닷가 바람 :: 낮에는 바다에서, 밤에는 육지에서 바람이 분다
? 빨대로 음료를 '빨아올리는' 힘의 정체는? :: 빨대 속 공기를 빼면 빨대 안의 기압이 낮아지고, 컵 표면을 누르는 바깥 **기압**이 음료를 밀어 올린다.

= 지난 시간 복습 | 4차시
- 공기가 상승 → 기압 [[낮아짐]] → [[단열 팽창]] → 기온 하강 → 구름
- 공기가 하강 → [[단열 압축]] → 기온 상승 → 구름 소멸
? 높이 올라갈수록 기압이 낮아지는 까닭은? :: 위에 쌓인 공기의 양이 줄어들기 때문이다. — 오늘은 이 기압을 숫자로 재 본다.

## 기압 | 공기가 누르는 힘

= 기압이란?
! 기압: 공기가 단위 넓이에 작용하는 힘
- 공기 분자의 운동 때문에 ==모든 방향으로== 작용한다.
- 단위: hPa(헥토파스칼)
>+ 높이 올라갈수록 위에 있는 공기의 양이 줄어 기압이 **낮아진다.**

= 토리첼리의 실험 | 기압 재기
^+ 1 m 유리관에 수은을 가득 채워 수은 그릇에 거꾸로 세운다.
^+ 수은이 내려오다가 높이 **76 cm**에서 멈춘다.
^+ 수은 기둥이 누르는 압력 = 수은 면을 누르는 기압
! 1기압 = 수은 기둥 76 cm의 압력 ≈ 1013 hPa
~ 유리관을 기울여도 수직 높이는 76 cm로 같다.

= 예제 1 · 물로 재면? | 적용
- 수은은 물보다 약 13.6배 무겁다(밀도가 크다). 수은 대신 물로 토리첼리 실험을 하면 물기둥의 높이는?
^+ 같은 압력을 내려면 물기둥은 13.6배 높아야 한다.
^+ 76 cm × 13.6 = 1033.6 cm ≈ **10.3 m**
>+ 그래서 펌프로 물을 빨아올릴 수 있는 높이도 약 10 m가 한계!

= 예제 2 · 손바닥 위의 공기 | 적용
- 1기압 ≈ 101 300 N/m²이다. 넓이 1 cm²(= 0.0001 m²)를 누르는 힘은?
^+ 101 300 × 0.0001 ≈ **10.1 N**
^+ 질량 약 1 kg인 물체의 무게(9.8 N)와 비슷하다.
>+ 손톱만 한 넓이를 1 kg짜리 물체가 누르는 셈 — 몸 안에서도 같은 크기로 밀어내므로 느끼지 못한다.

## 바람 | 고기압에서 저기압으로

= 바람이 부는 까닭
! 바람: 기압 차에 의해 공기가 고기압에서 저기압으로 이동하는 것
- 기압 차가 클수록 바람이 ==강하다.==
- 지표가 고르게 가열되지 않아 기압 차가 생긴다.
>+ 따뜻한 곳: 공기 상승 → 저기압 / 차가운 곳: 공기 하강 → 고기압

= 고기압과 저기압 비교 | 개념 정리
| 구분 | 고기압 | 저기압 |
|+ 중심 기압 | 주위보다 높음 | 주위보다 낮음 |
|+ 바람 (북반구) | 시계 방향으로 불어 나감 | 시계 반대 방향으로 불어 들어옴 |
|+ 중심의 기류 | 하강 기류 | 상승 기류 |
|+ 날씨 | 구름이 사라져 맑음 | 구름이 생겨 흐리거나 비 |

= 예제 3 · 어디서 더 센 바람이? | 적용
| 지역 | 기압 (hPa) | 지역 | 기압 (hPa) |
| A | 1020 | B | 1008 |
| C | 1012 | D | 1010 |
^+ A → B 방향으로 바람, 기압 차 **12 hPa**
^+ C → D 방향으로 바람, 기압 차 **2 hPa**
>+ 기압 차가 큰 **A → B** 사이의 바람이 더 강하다.

= 확인 문제 1
Q 1기압의 크기와 같지 않은 것은?
o 수은 기둥 76 cm의 압력
o 약 1013 hPa
o* 수은 기둥 100 cm의 압력
o 물기둥 약 10 m의 압력
:: 1기압 = 수은 76 cm ≈ 1013 hPa ≈ 물기둥 약 10.3 m

= 확인 문제 2
Q 저기압에 대한 설명으로 옳은 것은?
o 중심에서 하강 기류가 나타난다
o* 중심에서 상승 기류가 나타나 구름이 생기기 쉽다
o 바람이 중심에서 바깥으로 불어 나간다
o 날씨가 대체로 맑다
:: 저기압 중심으로 공기가 모여 상승하므로 단열 팽창 → 구름 → 흐리거나 비

## 해륙풍과 계절풍 | 육지와 바다의 온도 차

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#wind | 기압 차를 바꾸며 바람의 세기를 관찰하고, [해륙풍]에서 시각을 낮 ↔ 밤으로 바꾸어 바람의 방향을 확인하자.
% 육지는 비열이 작아 빨리 데워지고 빨리 식는다는 점을 먼저 상기

= 해안의 하루 기온 | 자료 해석
C 해안 지역 육지와 바다의 기온 (예시 자료) | 시각 (시) | 기온 (℃) | 육지:0,18 6,16 10,24 14,30 24,18 | 바다:0,21 6,20 10,21 14,22 18,22 24,21
+ 낮: 육지가 더 따뜻 → 육지 위 [[저기압]] → 바다에서 육지로 [[해풍]]
+ 밤: 바다가 더 따뜻 → 바다 위 [[저기압]] → 육지에서 바다로 [[육풍]]

= 해륙풍과 계절풍 비교
| 구분 | 낮 · 여름 | 밤 · 겨울 |
|+ 더 따뜻한 곳 | 육지(대륙) | 바다(해양) |
|+ 저기압이 되는 곳 | 육지(대륙) | 바다(해양) |
|+ 해륙풍 (하루 주기) | 해풍: 바다 → 육지 | 육풍: 육지 → 바다 |
|+ 계절풍 (1년 주기) | 남동 계절풍 | 북서 계절풍 |
>+ 까닭: 육지는 바다보다 **비열이 작아** 빨리 데워지고 빨리 식는다.

## 대기 대순환 | 지구 전체를 도는 바람

= 지구 규모의 바람은 왜 불까?
- 적도 지방은 태양 에너지를 ==많이== 받고, 극지방은 ==적게== 받는다.
- 이 에너지 차이로 지구 전체 규모로 공기가 순환한다 → **대기 대순환**
>+ 대기 대순환은 저위도의 남는 에너지를 고위도로 운반한다 (해류와 함께).

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#wind | [대기 대순환]을 눌러 위도대마다 부는 바람의 방향을 확인하자.

= 북반구의 대기 대순환 | 개념 정리
| 위도 | 지표 부근의 바람 | 부는 방향 |
|+ 0° ~ 30° | **무역풍** | 동쪽 → 서쪽 |
|+ 30° ~ 60° | **편서풍** | 서쪽 → 동쪽 |
|+ 60° ~ 90° | **극동풍** | 동쪽 → 서쪽 |
>+ 우리나라(북위 약 33° ~ 43°)는 **편서풍대**에 있다.
% 2022 개정 [9과17] 적용 시 고려 사항: 대기 대순환은 북반구를 중심으로 다루며, 바람이 휘는 원인(전향력)은 다루지 않는다.

= 예제 4 · 편서풍과 우리 생활 | 적용
^+ 우리나라의 날씨는 대체로 **서쪽에서 동쪽**으로 변한다 → 일기 예보는 서쪽(중국)의 날씨를 살핀다
^+ 봄철 황사가 **서쪽**의 사막에서 날아온다
^+ 비행기는 서쪽으로 갈 때보다 **동쪽**으로 갈 때 시간이 덜 걸리기도 한다 (뒤바람)
^+ 태풍은 저위도에서 무역풍을 따라 **북서쪽**으로 오다가, 중위도에서 편서풍을 만나 **북동쪽**으로 방향을 바꾼다

= 생활 속 기압과 바람 | 사례
* 🍪 과자 봉지 :: 높은 산에서 바깥 기압이 낮아져 봉지 속 공기가 팽창
* 👂 귀 먹먹함 :: 비행기 이착륙 때 귀 안팎의 기압 차
* 🏖️ 해수욕장 :: 낮에는 바다에서 시원한 해풍이 분다
* 🎐 겨울 북서풍 :: 시베리아 쪽 차가운 대륙에서 바람이 불어온다
* 🍲 압력솥 :: 기압을 높여 물이 더 높은 온도에서 끓는다
* 🪁 연날리기 :: 바닷가에서는 낮과 밤에 연이 나는 방향이 반대

= 확인 문제 3
Q 맑은 날 낮에 해안에서 부는 바람에 대한 설명으로 옳은 것은?
o 바다 위가 저기압이 된다
o* 바다에서 육지로 해풍이 분다
o 육지에서 바다로 육풍이 분다
o 육지 위에서 하강 기류가 생긴다
:: 낮에는 육지가 빨리 데워져 상승 기류 → 저기압. 바다(고기압)에서 육지(저기압)로 해풍이 분다.

= 확인 문제 4
Q 우리나라 겨울철 계절풍의 방향과 까닭으로 옳은 것은?
o 남동풍 — 대륙이 바다보다 따뜻해서
o* 북서풍 — 대륙이 바다보다 차가워서
o 남동풍 — 바다가 대륙보다 차가워서
o 북서풍 — 바다가 대륙보다 차가워서
:: 겨울에는 대륙이 빨리 식어 고기압, 바다가 상대적으로 따뜻해 저기압 → 대륙에서 바다로 북서 계절풍

= 확인 문제 5
Q 북반구 위도 30° ~ 60°의 지표 부근에서 부는 바람은?
o 무역풍 — 동쪽에서 서쪽으로
o* 편서풍 — 서쪽에서 동쪽으로
o 극동풍 — 동쪽에서 서쪽으로
o 계절풍 — 여름과 겨울에 방향이 바뀜
:: 우리나라가 있는 중위도에는 편서풍이 분다. 그래서 날씨가 대체로 서쪽에서 동쪽으로 변한다.

= 서술형 도전 | 생각 넓히기
? 높은 산에 올라가면 과자 봉지가 부풀어 오르는 까닭을 쓰시오. :: 높이 올라갈수록 바깥 기압이 낮아져 봉지 속 공기가 팽창하기 때문이다.
? 낮에 해풍이 부는 과정을 '비열, 기온, 기압, 공기의 이동'을 넣어 순서대로 쓰시오. :: 육지는 바다보다 비열이 작아 낮에 빨리 데워진다 → 육지 위 공기가 상승하여 저기압이 된다 → 상대적으로 고기압인 바다에서 육지로 공기가 이동한다(해풍).

= 오늘 배운 내용 정리
- 공기가 단위 넓이에 작용하는 힘 → [[기압]], 1기압 = 수은 [[76 cm]] ≈ 1013 hPa
- 높이 올라갈수록 기압은 [[낮아진다]].
- 바람은 [[고기압]]에서 [[저기압]]으로 분다. 기압 차가 클수록 강하다.
- 낮: 바다 → 육지 [[해풍]] / 밤: 육지 → 바다 [[육풍]]
- 우리나라 여름 [[남동]] 계절풍, 겨울 [[북서]] 계절풍
- 북반구 대기 대순환: 0°~30° [[무역풍]], 30°~60° [[편서풍]], 60°~90° 극동풍

= 나가기 전 한 문제 | 형성평가
? 밤에 해안에서 육풍이 부는 까닭을 한 문장으로 쓰시오. :: 밤에는 비열이 작은 육지가 바다보다 빨리 식어 바다 위가 상대적으로 저기압이 되므로, 육지(고기압)에서 바다(저기압)로 바람이 분다.
