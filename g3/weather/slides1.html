= 오늘의 학습 목표 | 1차시
^ **기권**의 범위와 공기의 분포를 말할 수 있다.

^ 대류권·성층권·중간권·열권의 **특징**을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 기권과 기온 분포 10분 → 층별 특징 15분 → 문항·정리 15분

= 높이 올라갈수록 따뜻해질까, 추워질까? | 생각 열기
* 🏔️ 높은 산 꼭대기 :: 한여름에도 눈이 남아 있는 산이 있다
* ✈️ 여객기 창밖 :: 기내 화면의 바깥 기온은 약 −50 ℃
* 🎈 기상 관측 기구 :: 수십 km까지 올라가며 기온을 잰다
* 🌌 오로라 :: 100 km 이상 높은 곳에서 빛난다
? 높이 올라갈수록 태양에 가까워지는데 왜 산꼭대기는 더 추울까? :: 대류권의 공기는 태양이 아니라 태양 에너지를 받아 데워진 **지표**가 데운다. 지표에서 멀어질수록 기온이 낮아진다.
% 학생 예상을 칠판에 적어 두고, 성층권에서 다시 '반전'되는 장면에서 확인

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 대류 | 액체·기체에서 데워진 물질이 직접 올라가며 열을 전달 |
| 기압 | 공기가 일정한 넓이에 작용하는 힘 (높을수록 낮아짐) |
| 자외선 | 생물에 해로운 빛, 오존이 흡수한다 |
? 방 안에서 난로는 아래에, 에어컨은 위에 다는 까닭은? :: 따뜻한 공기는 위로, 찬 공기는 아래로 움직이는 **대류**가 일어나 방 전체가 고르게 데워지거나 식기 때문이다.

## 기권 | 지구를 둘러싼 공기의 층

= 기권이란?
! 기권: 지표에서 높이 약 1000 km까지의 대기층
- 질소(약 78 %), 산소(약 21 %), 그 밖의 기체로 이루어져 있다.
- 공기는 중력 때문에 ==지표 가까이에 대부분 모여 있다.==
+ 전체 공기의 약 **75 %**가 가장 아래층(대류권)에 있다.
>+ 높이 올라갈수록 공기가 희박해져 **기압이 낮아진다.**

= 높이에 따른 기온 측정값 | 기상 관측 기구
| 높이 (km) | 0 | 10 | 30 | 50 | 80 | 100 |
| 기온 (℃) | 15 | −50 | 약 −39 | 약 −3 | 약 −90 | 약 50 |
+ 0 → 10 km: 기온이 [[낮아진다]]
+ 10 → 50 km: 기온이 [[높아진다]]
+ 50 → 80 km: 기온이 [[낮아진다]]
+ 80 km 이상: 기온이 [[높아진다]]
>+ 기온이 '낮아짐 ↔ 높아짐'으로 바뀌는 곳을 경계로 **4개 층**으로 나눈다.

= 그래프로 보면 | 높이에 따른 기온 분포
C 높이에 따른 기온 (관측 예) | 높이 (km) | 기온 (℃) | 기온:0,15 10,-50 30,-39 50,-3 80,-90 100,50
~ 기울기가 바뀌는 지점(약 11 km, 50 km, 80 km)이 층의 경계이다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#layer | 기구의 높이를 바꾸며 기온을 읽고, 기온이 높아지는 층과 낮아지는 층을 찾자.
% 학생이 높이를 부르면 교사가 기구를 옮기는 방식으로 진행. 경계 높이 3곳을 함께 찾기

## 4개의 층 | 대류권 · 성층권 · 중간권 · 열권

= 기권의 층상 구조 한눈에 | 개념 정리
| 층 | 높이 | 기온 변화 | 특징 |
|+ 대류권 | 0~약 11 km | 낮아짐 | 대류 ○, 기상 현상 ○ |
|+ 성층권 | 약 11~50 km | 높아짐 | 오존층, 대류 ×, 안정 |
|+ 중간권 | 약 50~80 km | 낮아짐 | 대류 ○, 기상 현상 ×, 유성 |
|+ 열권 | 약 80 km 이상 | 높아짐 | 공기 희박, 오로라, 일교차 큼 |
% 표를 하나씩 띄우며 '기온 변화 → 대류 여부'를 연결해서 말하게 하기

= 대류권 | 우리가 사는 층
- 지표가 태양 에너지를 흡수해 공기를 아래에서 데운다 → 위로 갈수록 기온 ↓
- 아래가 따뜻하고 위가 차가워 ==대류가 일어난다.==
- 수증기가 있어 구름·비·눈 등 **기상 현상**이 나타난다.
>+ 기온은 높이 1 km마다 평균 약 **6.5 ℃**씩 낮아진다. (15 ℃ → −50 ℃, 10 km)

= 성층권 | 오존층이 있는 층
- 높이 약 20~30 km에 **오존층**이 있다.
- 오존이 태양의 ==자외선을 흡수==하여 위로 갈수록 기온 ↑
- 위가 따뜻하고 아래가 차가워 대류가 일어나지 않는다 → **안정**
>+ 오존층은 생물에 해로운 자외선을 막아 주는 '지구의 선크림'

= 중간권과 열권 | 높은 하늘
- **중간권**: 위로 갈수록 기온 ↓ → 대류는 있지만 수증기가 거의 없어 기상 현상 ×
-- 유성이 주로 나타나는 층
- **열권**: 태양 에너지를 직접 흡수해 기온 ↑, 공기가 매우 희박
-- 오로라가 나타나고 낮과 밤의 기온 차가 매우 크다.
-- 인공위성·국제 우주 정거장이 도는 높이

= 기권 속 생활 사례 | 사례
* ✈️ 여객기 :: 대류권 위쪽~성층권 아래쪽을 날아 기상 현상을 피한다
* 🌩️ 적란운 :: 대류권 꼭대기에서 더 못 올라가 모루 모양으로 퍼진다
* 🧴 자외선 차단제 :: 오존층이 줄면 지표에 닿는 자외선이 늘어난다
* ☄️ 별똥별 :: 중간권에서 공기와 부딪혀 타며 빛난다
* 🌈 오로라 :: 열권에서 태양에서 온 입자가 공기와 만나 빛을 낸다
* 🛰️ 국제 우주 정거장 :: 약 400 km 높이, 열권에서 지구를 돈다

= 확인 문제 1
Q 높이 올라갈수록 기온이 높아지는 층끼리 짝지은 것은?
o 대류권, 중간권
o* 성층권, 열권
o 대류권, 성층권
o 중간권, 열권
:: 성층권(오존층이 자외선 흡수)과 열권(태양 에너지 직접 흡수)은 위로 갈수록 기온이 높아진다.

## 계산과 적용 | 숫자로 확인하기

= 예제 1 · 산 정상의 기온 | 적용
- 지표 기온이 20 ℃일 때 높이 2 km인 산 정상의 기온은? (대류권 기온 감소율 6.5 ℃/km)
^+ 낮아지는 기온 = 6.5 × 2 = **13 ℃**
^+ 정상 기온 = 20 − 13 = **7 ℃**
>+ 같은 날에도 산 정상은 지표보다 훨씬 춥다 — 등산할 때 겉옷을 챙기는 까닭!

= 예제 2 · 비행기 밖의 기온 | 적용
- 지표 기온 15 ℃, 비행기가 높이 10 km를 난다. 바깥 기온은?
^+ 낮아지는 기온 = 6.5 × 10 = 65 ℃
^+ 바깥 기온 = 15 − 65 = **−50 ℃**
>+ 관측값 표의 10 km, −50 ℃와 같다!

= 예제 3 · 어느 층일까? | 적용
| 관측 높이 | 위로 갈 때 기온 | 층 |
|+ 5 km | 낮아짐, 구름 있음 | [[대류권]] |
|+ 25 km | 높아짐, 오존 많음 | [[성층권]] |
|+ 70 km | 낮아짐, 유성 | [[중간권]] |
|+ 300 km | 높아짐, 오로라 | [[열권]] |

= 확인 문제 2
Q 지표 기온이 25 ℃일 때, 높이 4 km에서의 기온은? (대류권 기온 감소율 6.5 ℃/km)
o 21 ℃
o* −1 ℃
o 6.5 ℃
o −26 ℃
:: 6.5 × 4 = 26 ℃ 낮아지므로 25 − 26 = −1 ℃

= 확인 문제 3
Q 대류는 일어나지만 기상 현상이 나타나지 않는 층과 그 까닭은?
o 성층권 — 오존이 많아서
o 열권 — 공기가 희박해서
o* 중간권 — 수증기가 거의 없어서
o 대류권 — 기온이 낮아서
:: 중간권은 아래가 따뜻해 대류가 일어나지만 수증기가 거의 없어 구름·비가 생기지 않는다.

= 확인 문제 4
Q 기권에 대한 설명으로 옳지 않은 것은?
o 공기의 대부분은 대류권에 있다
o 높이 올라갈수록 기압이 낮아진다
o* 성층권은 대류가 활발하여 불안정하다
o 열권은 낮과 밤의 기온 차가 크다
:: 성층권은 위가 따뜻하고 아래가 차가워 대류가 일어나지 않는 안정한 층이다.

= 서술형 도전 | 생각 넓히기
? 장거리 여객기가 대류권 위쪽~성층권 아래쪽 높이로 나는 까닭을 쓰시오. :: 이 높이에는 구름·비 같은 기상 현상이 거의 없고 대기가 안정하여 비행이 안전하며, 공기가 희박해 공기 저항도 작기 때문이다.
? 지구에 대기가 없다면 어떤 일이 생길지 두 가지 쓰시오. :: 낮과 밤의 기온 차가 매우 커진다, 자외선이 그대로 들어와 생물이 살기 어렵다, 유성체가 타지 않고 떨어진다, 기상 현상이 없다 등

= 오늘 배운 내용 정리
- 기권은 높이에 따른 [[기온 분포]]를 기준으로 4개 층으로 나눈다.
- [[대류권]]: 기온 ↓, 대류 ○, 기상 현상 ○, 공기의 약 75 %
- [[성층권]]: 기온 ↑, [[오존층]]이 자외선 흡수, 대류 × (안정)
- [[중간권]]: 기온 ↓, 대류 ○, 기상 현상 ×, 유성
- [[열권]]: 기온 ↑, 공기 희박, 오로라, 일교차 큼

= 나가기 전 한 문제 | 형성평가
? 성층권에서 높이 올라갈수록 기온이 높아지는 까닭과, 그 결과 성층권이 어떤 성질을 갖는지 한 문장으로 쓰시오. :: 오존층이 태양의 자외선을 흡수하여 위쪽이 더 따뜻하므로 대류가 일어나지 않아 대기가 안정하다.
