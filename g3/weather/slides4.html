# 구름의 생성과 강수 | 공기가 올라가면 구름이 된다 | 중학교 과학 3 · 17 날씨와 기후변화 · 4차시 | 2022 개정 교육과정 [9과17-03]

= 오늘의 학습 목표 | 4차시
^ **단열 팽창**으로 공기의 온도가 낮아지는 까닭을 설명할 수 있다.
^ 공기가 상승하여 **구름이 생성**되는 과정을 순서대로 설명할 수 있다.
^ 구름이 생기는 경우와 구름의 모양에 따른 **강수**의 특징을 비교할 수 있다.
% 흐름: 생각 열기 5분 → 페트병 실험 10분 → 상승 공기(시뮬레이션) 10분 → 구름 높이 비교 10분 → 문항 10분

= 구름은 왜 높은 하늘에만 생길까? | 생각 열기
* ☁️ 뭉게구름 :: 맑은 여름날 오후에 쑥쑥 자라 오른다
* ⛰️ 산 중턱의 구름 :: 산을 타고 오르는 공기에 구름이 걸린다
* 🍾 탄산음료 뚜껑 :: 뚜껑을 따는 순간 병 입구에 하얀 김이 생긴다
* 🌀 저기압 :: 저기압이 다가오면 하늘이 흐려진다
? 이 장면들의 공통점은 무엇일까? :: 모두 공기가 **팽창하며 식는** 상황이다. 식은 공기가 이슬점에 이르면 수증기가 응결해 구름(김)이 된다.

= 지난 시간 복습 | 3차시
| 기온 (℃) | 10 | 15 | 20 | 25 |
| 포화 수증기량 (g/kg) | 7.6 | 10.6 | 14.7 | 20.0 |
? 기온 25 ℃, 수증기량 10.6 g/kg인 공기의 이슬점은? :: 15 ℃ — 공기가 15 ℃까지 식으면 응결이 시작된다.
? 하늘 높이 있는 공기는 어떻게 이슬점까지 식을까? :: 오늘의 열쇠: **단열 팽창**

## 단열 팽창 | 부풀면 식는다

= 단열 팽창과 단열 압축
- **단열**: 바깥과 열을 주고받지 않음
! 공기가 팽창하면 기온 ↓ (단열 팽창) / 압축되면 기온 ↑ (단열 압축)
- 공기가 상승하면 주위 기압이 낮아져 ==부피가 팽창==한다.
>+ 팽창하는 데 자기 에너지를 쓰므로 공기 덩어리의 **온도가 낮아진다.**

= 페트병 속 구름 만들기 | 모형 실험
- 페트병에 물을 조금 넣고 향 연기를 넣은 뒤, 간이 가압 장치로 공기를 넣었다가 마개를 연다.
| 구분 | 공기를 넣을 때 (압축) | 마개를 열 때 (팽창) |
|+ 페트병 속 온도 | [[높아짐]] | [[낮아짐]] |
|+ 페트병 속 모습 | 맑아짐 | [[뿌옇게 흐려짐]] |
>+ 향 연기: 수증기가 응결할 때 중심이 되는 **응결핵**

= 구름이 생성되는 과정
^+ 공기 상승
^+ 주위 기압이 낮아짐 → 부피 팽창 (단열 팽창)
^+ 기온 하강 → 이슬점 도달
^+ 수증기 응결 → **구름 생성**
% 학생들이 순서 카드를 섞어 놓고 배열하게 해도 좋다

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#cloud | 지표 기온 27 ℃, 이슬점 19 ℃로 두고 [공기 상승시키기]를 눌러 공기 덩어리의 기온·이슬점 변화를 관찰하자.
% 기온이 낮아지다 이슬점에 도달하는 높이에서 구름이 생기기 시작함을 강조

## 구름 밑면의 높이 | 기온과 이슬점이 만나는 곳

= 상승하는 공기의 기온과 이슬점 | 모형
- 공기가 상승하면 기온이 **빠르게** 낮아지고, 이슬점은 **조금씩** 낮아진다.
- 기온이 이슬점까지 내려가는 높이에서 ==응결이 시작==된다.
||
C 지표 27 ℃, 이슬점 19 ℃인 공기의 상승 | 높이 (km) | 온도 (℃) | 기온:0,27 0.25,24.5 0.5,22 0.75,19.5 1,17 | 이슬점:0,19 0.25,18.5 0.5,18 1,17
>+ 두 선이 만나는 1 km(1000 m)에서 응결 시작 → **구름 밑면**

= 예제 1 · 세 공기 비교 | 시뮬레이션 기록
| 지표 기온 (℃) | 지표 이슬점 (℃) | 기온과 이슬점의 차이 | 구름이 생기기 시작한 높이 |
|+ 30 | 26 | 작다 | [[가장 낮다]] |
|+ 27 | 19 | 중간 | [[중간]] |
|+ 27 | 11 | 크다 | [[가장 높다]] |
>+ 기온과 이슬점의 차이가 클수록(건조할수록) 더 높이 올라가야 구름이 생긴다.
% 2022 개정 [9과17]은 구름 생성과 강수를 정성적으로 다룬다. 기온·이슬점 감률(10·2 ℃/km)을 이용한 구름 밑면 높이 계산은 다루지 않는다.

= 예제 2 · 습한 날과 건조한 날 | 적용
- 장마철처럼 습한 날과 맑고 건조한 날, 구름이 더 낮게 깔리는 날은?
^+ 습한 날 → 이슬점이 기온에 **가깝다**
^+ 조금만 올라가도 이슬점에 도달 → 구름이 **낮게** 생긴다
^+ 건조한 날 → 구름이 생기더라도 **높은 곳**에 생긴다

= 확인 문제 1
Q 지표의 기온이 같을 때, 구름이 가장 낮은 곳에서 생기기 시작하는 공기는?
o* 이슬점이 기온에 가장 가까운 공기
o 이슬점이 기온보다 가장 많이 낮은 공기
o 수증기량이 가장 적은 공기
o 하강하는 공기
:: 기온과 이슬점의 차이가 작을수록 조금만 상승해도 응결이 일어난다.

= 확인 문제 2
Q 공기가 상승하여 구름이 생성되는 과정을 바르게 나열한 것은?
o 기온 하강 → 팽창 → 기압 하강 → 응결
o* 기압 하강 → 팽창 → 기온 하강 → 응결
o 팽창 → 응결 → 기압 하강 → 기온 하강
o 응결 → 기온 하강 → 팽창 → 기압 하강
:: 상승 → 주위 기압 하강 → 단열 팽창 → 기온 하강 → 이슬점 도달 → 응결

## 구름이 생기는 경우와 강수 | 공기를 들어 올리는 힘

= 공기가 상승하는 네 가지 경우 | 사례
* ☀️ 지표의 일부가 강하게 가열 :: 여름철 오후의 소나기구름
* ⛰️ 산의 경사면을 따라 상승 :: 산 중턱의 구름, 바람받이 쪽 비
* 🌬️ 찬 공기와 따뜻한 공기가 만남 :: 전선 부근의 구름
* 🌀 저기압 중심으로 모여듦 :: 저기압의 흐린 날씨, 비
% 4가지 경우를 학생이 직접 그림으로 그려 보게 하면 이해가 빠르다

= 구름의 모양과 강수
| 구분 | 적운형 구름 | 층운형 구름 |
|+ 상승 기류 | 강함 | 약함 |
|+ 모양 | 위로 솟음 | 옆으로 퍼짐 |
|+ 강수 | 소나기 (좁은 지역) | 지속적인 비 (넓은 지역) |
>+ **강수**: 구름 속 작은 물방울·얼음 알갱이가 합쳐지거나 커져 무거워지면 비·눈이 되어 떨어진다.

= 확인 문제 3
Q 다음 중 구름이 생기기 어려운 경우는?
o 공기가 산의 경사면을 따라 올라갈 때
o 지표가 강하게 가열될 때
o* 고기압 중심에서 공기가 내려올 때
o 찬 공기가 따뜻한 공기를 밀어 올릴 때
:: 공기가 하강하면 단열 압축으로 기온이 올라가 구름이 사라진다.

= 확인 문제 4
Q 페트병 구름 실험에서 마개를 열 때 일어나는 일로 옳은 것은?
o 공기가 압축되어 온도가 올라간다
o* 공기가 팽창하여 온도가 내려가 응결이 일어난다
o 수증기량이 늘어나 흐려진다
o 향 연기가 타면서 흐려진다
:: 단열 팽창으로 온도가 이슬점 아래로 내려가 수증기가 응결핵(향 연기) 주위에 응결한다.

= 서술형 도전 | 생각 넓히기
? 공기 덩어리가 상승할 때 기온과 이슬점 중 무엇이 더 빨리 낮아지며, 그 결과 어떤 일이 일어나는지 쓰시오. :: 기온이 이슬점보다 빨리 낮아진다. 그래서 어느 높이에서 기온과 이슬점이 같아져 응결이 일어나고 구름이 생긴다.
? 높은 산을 넘은 공기가 반대쪽으로 내려오면 고온 건조해진다(높새바람). 그 까닭을 쓰시오. :: 산을 오르며 구름이 생기고 비가 내려 수증기를 잃는다. 산을 내려올 때는 단열 압축으로 기온이 오르므로 처음보다 덥고 건조한 공기가 된다.

= 오늘 배운 내용 정리
- 공기가 팽창하면 기온 ↓ → [[단열 팽창]]
- 공기 상승 → 기압 ↓ → 팽창 → 기온 ↓ → [[이슬점]] 도달 → [[응결]] → 구름
- 상승하는 공기는 기온이 이슬점보다 [[빨리]] 낮아진다.
- 기온과 이슬점의 차이가 클수록 구름이 [[높은]] 곳에서 생긴다.
- 상승 기류가 강하면 [[적운형]] 구름 → 소나기, 약하면 [[층운형]] 구름 → 지속적인 비

= 나가기 전 한 문제 | 형성평가
? 지표 기온 32 ℃, 이슬점 16 ℃인 공기가 상승할 때 구름이 생기기 시작하는 높이와 그 높이의 기온을 구하시오. :: 차이 16 ℃ ÷ 8 = 2 km → 2000 m, 기온 = 32 − 10 × 2 = 12 ℃ (이슬점 16 − 2 × 2 = 12 ℃와 같다)
