# 포화 수증기량과 상대 습도 | 공기는 수증기를 얼마나 담을까 | 중학교 과학 3 · 17 날씨와 기후변화 · 3차시 | 2022 개정 교육과정 [9과17-03]

= 오늘의 학습 목표 | 3차시
^ **포화 수증기량**과 기온의 관계를 설명할 수 있다.
^ **이슬점**의 뜻을 알고, 공기가 냉각될 때 응결량을 구할 수 있다.
^ **상대 습도**를 계산하고, 하루 동안의 변화를 해석할 수 있다.
% 흐름: 생각 열기 5분 → 포화·이슬점 10분 → 시뮬레이션 5분 → 상대 습도 계산 15분 → 문항 10분

= 차가운 컵 표면에 왜 물방울이 맺힐까? | 생각 열기
* 🥤 얼음물 컵 :: 컵 바깥쪽에 물방울이 송골송골
* 👓 안경 :: 겨울에 실내로 들어오면 김이 서린다
* 🌫️ 새벽 안개 :: 맑은 날 새벽 강가에 안개가 낀다
* 🌿 아침 이슬 :: 풀잎에 맺힌 물방울
? 컵 바깥의 물방울은 컵 속 물이 스며 나온 것일까? :: 아니다. 컵 주변 **공기 속 수증기**가 차가운 컵에 닿아 식으면서 물로 응결한 것이다.
% 컵에 색소를 탄 물을 넣어도 바깥 물방울은 무색 — 증거로 제시

= 지난 시간 복습 | 2차시
- 흡수 = 방출 → [[복사 평형]]
- 온실 기체가 지구 복사를 흡수·재방출 → [[온실 효과]]
- 대표적인 온실 기체: [[수증기]], 이산화 탄소, 메테인
? 수증기도 온실 기체다. 오늘은 공기 속 수증기를 '얼마나' 담을 수 있는지 알아본다. :: 공기가 담을 수 있는 수증기의 양은 **기온**에 따라 달라진다.

## 포화와 이슬점 | 공기가 가득 찼다!

= 포화 상태와 포화 수증기량
- **포화 상태**: 공기가 수증기를 최대로 포함하고 있는 상태
! 포화 수증기량: 포화 상태의 공기 1 kg 속 수증기량 (g/kg)
- 기온이 높을수록 포화 수증기량이 ==많아진다.==
>+ 따뜻한 공기는 '큰 그릇', 차가운 공기는 '작은 그릇'

= 기온과 포화 수증기량 | 자료
| 기온 (℃) | 0 | 5 | 10 | 15 | 20 | 25 | 30 |
| 포화 수증기량 (g/kg) | 3.8 | 5.4 | 7.6 | 10.6 | 14.7 | 20.0 | 27.2 |
C 포화 수증기량 곡선 | 기온 (℃) | 포화 수증기량 (g/kg) | 포화 수증기량:0,3.8 5,5.4 10,7.6 15,10.6 20,14.7 25,20 30,27.2
% 곡선 위의 공기는 포화, 곡선 아래의 공기는 불포화 상태임을 짚기

= 이슬점과 응결
- 공기를 식히면 포화 수증기량이 줄어든다 → 언젠가 포화 상태
! 이슬점: 공기가 냉각되어 포화에 도달하여 응결이 시작되는 온도
- 실제 수증기량이 많을수록 이슬점이 ==높다.==
>+ 이슬점보다 더 식으면: 응결량 = 실제 수증기량 − 그 기온의 포화 수증기량

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#humid | 기온 25 ℃, 수증기량 10.6 g/kg인 공기를 [공기 냉각하기]로 식히며 상대 습도와 응결을 관찰하자.
% 25 → 20 → 15 → 10 ℃에서 멈추고 상대 습도·응결량을 받아 적게 하기 (다음 슬라이드 표)

= 공기를 식혔을 때 | 25 ℃, 수증기 10.6 g/kg
| 기온 (℃) | 25 | 20 | 15 | 10 |
|+ 상대 습도 (%) | 53 | 72 | 100 | 100 |
|+ 응결량 (g/kg) | 0 | 0 | 0 | 3.0 |
+ 이 공기의 이슬점은 [[15 ℃]]
+ 10 ℃에서 응결량 = 10.6 − 7.6 = [[3.0 g/kg]]
>+ 수증기량이 그대로여도 기온이 내려가면 상대 습도는 **높아진다.**

## 상대 습도 | 얼마나 가득 찼을까

= 상대 습도 구하기
! 상대 습도 (%) = 실제 수증기량 ÷ 현재 기온의 포화 수증기량 × 100
- 일기 예보의 '습도'는 상대 습도이다.
- 포화 상태 → 상대 습도 **100 %**
>+ 같은 수증기량이라도 기온이 높으면 상대 습도는 **낮다.**

= 예제 1 · 상대 습도와 이슬점 | 적용
- 기온 20 ℃인 공기 1 kg 속에 수증기 7.6 g이 들어 있다.
^+ 20 ℃의 포화 수증기량 = 14.7 g/kg
^+ 상대 습도 = 7.6 ÷ 14.7 × 100 ≈ **52 %**
^+ 7.6 g/kg이 포화 수증기량인 기온 → 이슬점 **10 ℃**

= 예제 2 · 응결량 구하기 | 적용
- 기온 30 ℃, 수증기량 14.7 g/kg인 공기 **2 kg**을 10 ℃로 냉각했다.
^+ 이슬점 = **20 ℃** (14.7 g/kg이 포화 수증기량인 기온)
^+ 공기 1 kg당 응결량 = 14.7 − 7.6 = 7.1 g
^+ 2 kg → 7.1 × 2 = **14.2 g**
>+ 공기의 질량을 꼭 곱하자!

= 예제 3 · 실제 수증기량 거꾸로 구하기 | 적용
- 기온 25 ℃, 상대 습도 50 %인 공기의 실제 수증기량은?
^+ 25 ℃의 포화 수증기량 = 20.0 g/kg
^+ 실제 수증기량 = 20.0 × 0.5 = **10.0 g/kg**
>+ 같은 공기가 30 ℃가 되면? 10.0 ÷ 27.2 × 100 ≈ **37 %**로 낮아진다.

= 맑은 날 하루의 변화 | 자료 해석
C 맑은 날 기온과 상대 습도 (예시 자료) | 시각 (시) | 값 | 기온 (℃):0,16 6,14 10,20 14,26 18,22 24,17 | 상대 습도 (%):0,85 6,95 10,68 14,45 18,58 24,82
+ 기온이 가장 높은 오후 2시 무렵 → 상대 습도는 [[가장 낮다]]
+ 까닭: 수증기량은 거의 일정한데 기온 ↑ → 포화 수증기량 ↑

= 생활 속 습도 | 사례
* 🧺 빨래 :: 습도가 낮은 맑은 날 오후에 잘 마른다
* 🌫️ 안개 :: 새벽에 기온이 이슬점 아래로 내려가 지표 근처에서 응결
* 💨 가습기 :: 겨울철 실내는 기온이 높아 상대 습도가 낮아지기 쉽다
* 🚗 자동차 김 서림 :: 차가운 유리에 닿은 실내 공기가 이슬점 아래로 식는다
* 🥶 서리 :: 이슬점이 0 ℃ 아래이면 수증기가 바로 얼음으로
* 🍞 제습기 :: 공기를 차갑게 식혀 수증기를 물로 응결시켜 모은다

= 확인 문제 1
Q 기온 30 ℃인 공기 1 kg에 수증기가 13.6 g 들어 있다. 상대 습도는? (30 ℃ 포화 수증기량 27.2 g/kg)
o 27 %
o* 50 %
o 136 %
o 200 %
:: 13.6 ÷ 27.2 × 100 = 50 %

= 확인 문제 2
Q 다음 공기 중 이슬점이 가장 높은 것은?
o 30 ℃, 상대 습도 20 %
o 10 ℃, 상대 습도 100 %
o 20 ℃, 상대 습도 50 %
o* 25 ℃, 상대 습도 50 %
:: 이슬점은 실제 수증기량이 많을수록 높다. 실제 수증기량: 5.44 / 7.6 / 7.35 / 10.0 g/kg → 25 ℃, 50 % 공기가 가장 많다.

= 확인 문제 3
Q 기온 20 ℃, 이슬점 10 ℃인 공기 1 kg을 5 ℃로 냉각할 때 응결량은?
o 9.3 g
o 7.6 g
o* 2.2 g
o 0 g
:: 실제 수증기량 = 10 ℃의 포화 수증기량 7.6 g/kg → 7.6 − 5.4 = 2.2 g

= 확인 문제 4
Q 수증기량이 일정할 때 상대 습도가 높아지는 경우는?
o 기온이 올라갈 때
o* 기온이 내려갈 때
o 바람이 불 때
o 기압이 낮아질 때
:: 기온이 내려가면 포화 수증기량이 줄어 분모가 작아지므로 상대 습도가 높아진다.

= 서술형 도전 | 생각 넓히기
? 맑은 날 새벽에 풀잎에 이슬이 맺히고 안개가 끼는 까닭을 이슬점을 이용해 설명하시오. :: 밤사이 지표가 냉각되어 지표 근처 공기의 기온이 이슬점 이하로 내려가면 수증기가 응결하여 풀잎에는 이슬, 공기 중에는 안개가 된다.
? 겨울에 난방을 하면 '건조하다'고 느끼는 까닭을 포화 수증기량으로 설명하시오. :: 실내 공기의 수증기량은 그대로인데 기온이 높아져 포화 수증기량이 커지므로 상대 습도가 낮아진다.

= 오늘 배운 내용 정리
- 기온이 높을수록 [[포화 수증기량]]이 많다.
- 공기가 냉각되어 응결이 시작되는 온도 → [[이슬점]]
- 응결량 = 실제 수증기량 − [[냉각된 기온의 포화 수증기량]]
- 상대 습도 = 실제 수증기량 ÷ [[현재 기온의 포화 수증기량]] × 100
- 맑은 날 기온이 가장 높을 때 상대 습도는 [[가장 낮다]].

= 나가기 전 한 문제 | 형성평가
