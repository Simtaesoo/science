<script>
const app = AppKit({

const {S, sfx, toast} = app, D = Draw;
const SAT = [[0, 3.8], [5, 5.4], [10, 7.6], [15, 10.6], [20, 14.7], [25, 20.0], [30, 27.1], [35, 36.1]];

const M = () => { const W = S.w, H = S.h, r = Math.min(W, H) * .42; return {cx: W / 2, cy: H / 2, r}; };

app.pointer({down(x, y){ if (!R || R.t !== 'wind' || locked) return; const m = M(), sx = m.cx + R.px * m.r, sy = m.cy + R.py * m.r; if (Math.hypot(x - sx, y - sy) < 50) drag = {x0: sx, y0: sy, x, y}; },
  move(x, y){ if (drag) { drag.x = x; drag.y = y; } },

app.draw = (g, W, H) => { if (!R) return; const t = performance.now() / 1000, m = M();
  g.fillStyle = '#e4eef6'; g.fillRect(0, 0, W, H);
  if (R.t === 'wind') { isobars(g, m, R.hi, t); D.text(g, R.hi ? 'H' : 'L', m.cx, m.cy, {size: 40, display: true, color: R.hi ? '#2f5fd0' : '#d0533f'}); D.text(g, R.hi ? '고기압' : '저기압', m.cx, m.cy + 30, {size: 13, color: '#334'});
    const sx = m.cx + R.px * m.r, sy = m.cy + R.py * m.r; D.glow(g, sx, sy, 26, '246,211,101', .8); g.fillStyle = '#e0a400'; g.beginPath(); g.arc(sx, sy, 7, 0, 7); g.fill();
    if (drag) D.arrow(g, drag.x0, drag.y0, drag.x, drag.y, '#2b2a26', 4); if (R.user) D.arrow(g, sx, sy, sx + R.user[0], sy + R.user[1], locked && !R.wrong ? '#2e7d4f' : '#d0533f', 4);
    if (locked) { const [wx, wy] = windVec(); D.arrow(g, sx, sy, sx + wx * 70, sy + wy * 70, '#2e7d4f', 5); for (let k = 0; k < 8; k++) { const a = k / 8 * 6.28, px = Math.cos(a) * .6, py = Math.sin(a) * .6, Rb = R; const sv = {px: R.px, py: R.py}; R.px = px; R.py = py; const [vx, vy] = windVec(); R.px = sv.px; R.py = sv.py; const bx = m.cx + px * m.r, by = m.cy + py * m.r; D.arrow(g, bx, by, bx + vx * 34, by + vy * 34, 'rgba(46,125,79,.5)', 2.5); } }
    D.text(g, '북반구 · 위가 북쪽', 14, 18, {size: 12, color: '#556', align: 'left'}); }
  if (R.t === 'front') { const p = ((performance.now() - R.born) / 1000 * .02) % .2, lx = W * (.38 + p), ly = H * .32;
    korea(g, W * .5, H * .3, H * .8); D.text(g, '한반도', W * .5 + H * .1, H * .3 + H * .3, {size: 13, color: '#5b7a48', weight: 700});
    // 저기압 + 전선
    for (let k = 1; k <= 3; k++) { g.strokeStyle = 'rgba(60,70,90,.35)'; g.beginPath(); g.ellipse(lx, ly, k * 40, k * 30, 0, 0, 7); g.stroke(); } D.text(g, 'L', lx, ly, {size: 34, display: true, color: '#d0533f'});
    const warm = t2 => [lx + t2 * W * .32, ly + t2 * H * .2 + Math.sin(t2 * 3) * 10], cold = t2 => [lx - t2 * W * .12, ly + t2 * H * .5];
    g.lineWidth = 4; g.strokeStyle = '#d0533f'; g.beginPath(); for (let i = 0; i <= 20; i++) g.lineTo(...warm(i / 20)); g.stroke(); for (let i = 1; i < 6; i++) { const [x, y] = warm(i / 6); g.fillStyle = '#d0533f'; g.beginPath(); g.arc(x, y, 8, Math.PI * 1.15, Math.PI * 2.15); g.fill(); }
    g.strokeStyle = '#2f5fd0'; g.beginPath(); for (let i = 0; i <= 20; i++) g.lineTo(...cold(i / 20)); g.stroke(); for (let i = 1; i < 6; i++) { const [x, y] = cold(i / 6); g.fillStyle = '#2f5fd0'; g.beginPath(); g.moveTo(x - 7, y - 4); g.lineTo(x + 7, y + 4); g.lineTo(x + 9, y - 10); g.fill(); }
    // 도시
    const [wx, wy] = warm(.6), [cxx, cyy] = cold(.6), pos = {ahead: [wx + 70, wy + 30], warm: [(wx + cxx) / 2 + 20, (wy + cyy) / 2 + 20], behind: [cxx - 60, cyy - 10]}[R.zone];

    for (let i = 0; i < 4; i++) { const [x, y] = cold(.2 + i * .18); g.fillStyle = 'rgba(90,100,130,.5)'; g.beginPath(); g.arc(x + 18, y - 10, 16, 0, 7); g.fill(); }

  if (R.t === 'hum') { const gx = W * .12, gy = H * .88, gw = W * .8, gh = H * .74, X = T => gx + T / 35 * gw, Y = q => gy - q / 40 * gh;
    g.strokeStyle = '#333'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(gx, gy - gh); g.lineTo(gx, gy); g.lineTo(gx + gw, gy); g.stroke();
    for (let T = 0; T <= 35; T += 5) { D.text(g, T, X(T), gy + 14, {size: 11, color: '#333'}); g.strokeStyle = '#d6e0ea'; g.beginPath(); g.moveTo(X(T), gy); g.lineTo(X(T), gy - gh); g.stroke(); } for (let q = 0; q <= 40; q += 10) D.text(g, q, gx - 14, Y(q), {size: 11, color: '#333'});

    g.strokeStyle = '#2f5fd0'; g.lineWidth = 3; g.beginPath(); for (let T = 0; T <= 35; T += .5) g.lineTo(X(T), Y(sat(T))); g.stroke(); D.text(g, '포화 수증기량 곡선', X(29), Y(sat(31)) - 18, {size: 12, color: '#2f5fd0', weight: 700});

    if (locked) { g.setLineDash([5, 4]); g.strokeStyle = '#d0533f'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(R.T), Y(R.q)); g.lineTo(X(R.dew), Y(R.q)); g.moveTo(X(R.T), Y(R.q)); g.lineTo(X(R.T), Y(sat(R.T))); g.stroke(); g.setLineDash([]); D.text(g, `이슬점 ${R.dew} ℃`, X(R.dew), Y(R.q) + 16, {size: 12, weight: 700, color: '#d0533f'}); } }
};
