## 복사 평형 | 들어온 만큼 나간다

= 복사와 복사 평형
- **복사**: 물체가 열을 빛(전자기파)의 형태로 직접 내보내는 것
- 모든 물체는 온도에 따라 복사 에너지를 방출한다.
! 복사 평형: 흡수하는 복사 에너지 = 방출하는 복사 에너지
>+ 복사 평형을 이루면 물체의 온도가 **일정하게** 유지된다.

= 컵 실험으로 보는 복사 평형 | 탐구
C 적외선 전등을 비춘 검은 알루미늄 컵의 온도 (예시 자료) | 시간 (분) | 온도 (℃) | 컵 온도:0,20 2,26 4,30 6,32 8,33 10,33 12,33
||
+ 처음: 흡수 > 방출 → 온도 상승
+ 8분 이후: 흡수 = 방출 → 온도 [[일정]] (복사 평형)

= 지구의 복사 평형 | 에너지 장부
| 태양 복사 에너지 100 | 비율 |
|+ 대기·구름·지표가 반사 | 30 |
|+ 대기와 지표가 흡수 | 70 |
|+ 지구가 우주로 방출 (지구 복사) | [[70]] |
>+ 흡수한 70 = 방출한 70 → 지구도 **복사 평형**을 이루어 평균 기온이 일정하다.

= 확인 문제 1
Q 복사 평형 상태인 물체에 대한 설명으로 옳은 것은?
o 복사 에너지를 흡수하지 않는다
o 복사 에너지를 방출하지 않는다
o* 흡수량과 방출량이 같아 온도가 일정하다
o 온도가 계속 올라간다
:: 흡수와 방출이 모두 일어나지만 그 양이 같아 온도가 변하지 않는다.

## 온실 효과 | 대기는 지구의 이불

= 온실 효과란?
- 대기가 없을 때 지구 평균 기온: 약 **−18 ℃**
- 실제 지구 평균 기온: 약 **15 ℃**
! 온실 효과: 온실 기체가 지구 복사를 흡수했다가 지표로 다시 방출하여 기온을 높게 유지하는 현상
- 온실 기체: ==수증기, 이산화 탄소, 메테인== 등
>+ 온실 효과가 있어도 지구는 복사 평형을 이룬다 — 다만 **더 높은 온도**에서!

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#green | [대기가 없다면]을 켜고 끄며, 온실 기체 양을 바꾸며 지구 평균 기온이 어떻게 달라지는지 기록하자.
% 대기 없음(−18 ℃) → 현재(15 ℃) → 온실 기체 증가 순서로 보여 주기

= 예제 1 · 온실 효과의 크기 | 적용
- 대기가 없을 때 −18 ℃, 실제 15 ℃이다. 온실 효과로 높아진 기온은?
^+ 15 − (−18) = **33 ℃**
>+ 온실 효과가 없다면 지구는 바다까지 꽁꽁 언 행성이었을 것이다. 온실 효과 자체는 **생명에 꼭 필요한** 현상!

= 예제 2 · 반사가 줄어들면? | 적용
- 태양 복사 100 중 반사량이 30에서 25로 줄었다. (빙하가 녹아 어두운 바다가 드러남)
^+ 흡수량 = 100 − 25 = **75** (5 증가)
^+ 처음에는 흡수 75 > 방출 70 → 지구 기온 **상승**
^+ 기온이 올라 방출이 75가 되면 다시 복사 평형
>+ 새 평형 온도는 처음보다 **높다** — 얼음이 녹을수록 더 따뜻해지는 악순환

## 지구 온난화 | 온실 효과가 너무 강해지면

= 이산화 탄소 농도의 변화 | 마우나로아 관측소
C 대기 중 이산화 탄소 농도 (연평균) | 연도 | 농도 (ppm) | 이산화 탄소:1960,317 2020,414
||
+ 60년 동안 약 **97 ppm** 증가
+ 주된 원인: [[화석 연료]]의 사용, [[삼림 파괴]]
>+ **지구 온난화**: 온실 기체 증가 → 온실 효과 강화 → 지구 평균 기온 상승

= 예제 3 · 얼마나 늘었나? | 자료 해석
- 1960년 317 ppm → 2020년 414 ppm
^+ 증가량 = 414 − 317 = **97 ppm**
^+ 증가율 = 97 ÷ 317 × 100 ≈ **31 %**
^+ 1년 평균 = 97 ÷ 60 ≈ **1.6 ppm**씩 증가
>+ 60년 만에 약 3분의 1이 늘었다.

= 지구 온난화의 영향 | 사례
* 🧊 빙하 감소 :: 극지방·고산 빙하가 녹는다
* 🌊 해수면 상승 :: 녹은 물과 바닷물의 부피 팽창으로 해안 침수
* 🔥 이상 기후 :: 폭염·가뭄·홍수·집중 호우가 잦아진다
* 🐟 생태계 변화 :: 서식지가 북쪽·높은 곳으로 이동, 우리 바다 어종 변화
* 🍎 농업 변화 :: 사과 재배지가 북쪽으로 이동, 아열대 작물 재배
* 🦟 질병 :: 모기 등 매개 생물의 활동 지역이 넓어진다

= 어떻게 대응할까? | 실천
| 개인 | 사회·국가 |
|+ 대중교통·자전거 이용 | 신재생 에너지 개발 |
|+ 에너지 절약, 대기 전력 차단 | 탄소 배출 규제 |
|+ 일회용품 줄이기, 재활용 | 국제 협약(파리 협정) 참여 |
|+ 지역 농산물 이용 | 숲 가꾸기 |

= 확인 문제 2
Q 대기가 없을 때보다 지구의 평균 기온을 높게 유지시키는 현상은?
o 복사 평형
o* 온실 효과
o 대류
o 단열 팽창
:: 온실 기체가 지구 복사를 흡수·재방출하여 기온을 약 33 ℃ 높게 유지한다.

= 확인 문제 3
Q 지구의 복사 평형에 대한 설명으로 옳은 것은?
o 지구는 태양 복사 에너지를 모두 흡수한다
o 온실 효과가 있으면 복사 평형이 깨진 채로 유지된다
o* 지구가 흡수하는 에너지와 방출하는 에너지는 같다
o 지구는 에너지를 방출하지 않는다
:: 지구는 흡수한 만큼(70) 방출하여 복사 평형을 이룬다. 온실 효과가 있어도 더 높은 온도에서 평형을 이룬다.

= 확인 문제 4
Q 지구 온난화를 줄이는 방법으로 알맞지 않은 것은?
o 신재생 에너지 사용 늘리기
o 숲 가꾸기
o* 화석 연료 발전소 늘리기
o 대중교통 이용하기
:: 화석 연료를 태우면 이산화 탄소가 늘어 온실 효과가 강해진다.

= 서술형 도전 | 생각 넓히기
? 북극의 얼음이 녹으면 지구 온난화가 더 빨라질 수 있는 까닭을 반사율로 설명하시오. :: 얼음은 햇빛을 많이 반사하지만 바다는 많이 흡수한다. 얼음이 녹아 바다가 드러나면 흡수하는 에너지가 늘어 기온이 더 오르고 얼음이 더 녹는 악순환이 일어난다.
? '온실 효과는 나쁜 것이다'라는 친구의 말을 바로잡아 쓰시오. :: 온실 효과가 없으면 지구 평균 기온이 약 −18 ℃로 생물이 살기 어렵다. 문제는 온실 효과 자체가 아니라 온실 기체 증가로 온실 효과가 **강해지는** 지구 온난화이다.

= 오늘 배운 내용 정리
- 흡수하는 복사 에너지 = 방출하는 복사 에너지 → [[복사 평형]] → 온도 일정
- 지구는 태양 복사 100 중 30을 반사, 70을 흡수하고 [[70]]을 방출한다.
- [[온실 기체]]가 지구 복사를 흡수·재방출 → [[온실 효과]] (−18 ℃ → 15 ℃)
- 온실 기체 증가 → 온실 효과 강화 → [[지구 온난화]]
- 원인: 화석 연료 사용, 삼림 파괴 / 영향: 해수면 상승, 이상 기후

= 나가기 전 한 문제 | 형성평가
? 온실 효과와 지구 온난화의 차이를 한 문장으로 쓰시오. :: 온실 효과는 대기가 지구 복사를 붙잡아 기온을 알맞게 유지하는 자연 현상이고, 지구 온난화는 온실 기체가 늘어 그 효과가 강해져 평균 기온이 높아지는 현상이다.
