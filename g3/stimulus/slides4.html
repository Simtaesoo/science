# 자극에서 반응까지 | 의식적 반응과 무조건 반사 | 중학교 과학 3 · 20 자극과 반응 · 4차시 | 2022 개정 교육과정 [9과20]

= 오늘의 학습 목표 | 4차시
^ 자극이 전달되어 반응이 일어나는 **경로**를 설명할 수 있다.
^ **반응 시간**을 측정하고 자의 낙하 거리로 계산할 수 있다.
^ **의식적 반응**과 **무조건 반사**를 비교하고 예를 분류할 수 있다.
% 흐름: 생각 열기 5분 → 반응 시간 측정(시뮬레이션·자 잡기) 15분 → 무조건 반사 10분 → 분류·문항 15분

= 생각보다 손이 먼저 나간다? | 생각 열기
* 🔥 뜨거운 냄비 :: '뜨겁다'고 느끼기 전에 손을 뗀다
* ⚾ 날아오는 공 :: 공을 보고 판단해서 잡는다
* 🤧 재채기 :: 참으려 해도 저절로 나온다
* 🦵 무릎 반사 :: 병원에서 무릎을 톡 치면 다리가 올라간다
? 뜨거운 냄비에서 손을 뗄 때와 공을 잡을 때, 어느 쪽이 더 빠를까? 왜? :: 손을 떼는 쪽이 빠르다. **대뇌를 거치지 않고** 척수에서 바로 명령이 나가기 때문이다.

= 지난 시간 복습 | 3차시
- 감각 뉴런 → [[연합 뉴런]] → 운동 뉴런
- 의식적인 판단: [[대뇌]] / 무릎 반사의 중추: [[척수]]
- 재채기·기침의 중추: [[연수]] / 동공 크기 조절: [[중간뇌]]
? 오늘은 이 중추들이 '반응'에서 어떻게 일하는지, 직접 반응 시간을 재 보며 확인하자. :: 경로가 짧을수록 반응이 빠르다!

## 반응 시간 재기 | 나는 얼마나 빠를까

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#react | 화면이 초록색으로 바뀌면 바로 누르는 반응 시간을 5회 측정하고 평균을 구하자.
% 반응 경로를 함께 말하게 하기: 눈 → 감각 신경 → 대뇌 → 척수 → 운동 신경 → 손가락 근육

= 의식적 반응의 경로
^+ 자극(초록 화면) → **눈**
^+ → **감각 신경** → **대뇌**(판단: '눌러!')
^+ → **척수** → **운동 신경** → **손가락 근육**(반응)
>+ 대뇌에서 판단하는 과정이 있어 비교적 **느리다.**

= 예제 1 · 평균 반응 시간 | 적용
| 회차 | 1 | 2 | 3 | 4 | 5 |
| 반응 시간 (ms) | 250 | 230 | 240 | 220 | 210 |
^+ 합 = 250 + 230 + 240 + 220 + 210 = **1150 ms**
^+ 평균 = 1150 ÷ 5 = **230 ms** = 0.23 s
>+ 측정할수록 짧아진다 → 반복하면 대뇌의 판단과 명령이 빨라진다.

= 자 떨어뜨려 잡기 | 실험
- 짝이 자를 놓으면 바로 잡고, 자가 떨어진 거리를 잰다.
- 자는 **자유 낙하**한다 → 19단원에서 배운 9.8을 이용!
! 반응 시간 t = √(2 × 떨어진 거리(m) ÷ 9.8)
| 떨어진 거리 | 4.9 cm | 19.6 cm | 44.1 cm |
|+ 반응 시간 | [[0.1 s]] | [[0.2 s]] | [[0.3 s]] |

= 예제 2 · 자 잡기로 반응 시간 구하기 | 적용
- 자가 19.6 cm 떨어진 뒤에 잡았다.
^+ 19.6 cm = 0.196 m
^+ 2 × 0.196 ÷ 9.8 = 0.04
^+ t = √0.04 = **0.2 s** (200 ms)
>+ 떨어진 거리가 4배가 되면 반응 시간은 2배 — 거리는 시간의 제곱에 비례

= 예제 3 · 운전 중 반응 거리 | 적용
- 72 km/h로 달리던 운전자가 위험을 보고 브레이크를 밟기까지 0.7 s가 걸렸다.
^+ 72 km/h = **20 m/s**
^+ 반응하는 동안 이동 거리 = 20 × 0.7 = **14 m**
>+ 브레이크를 밟기 '전에' 이미 14 m! 운전 중 스마트폰이 위험한 까닭

## 무조건 반사 | 대뇌를 거치지 않는 빠른 반응

= 의식적 반응과 무조건 반사 | 비교
| 구분 | 의식적 반응 | 무조건 반사 |
|+ 중추 | 대뇌 | 척수, 연수, 중간뇌 |
|+ 반응 속도 | 비교적 느림 | 매우 빠름 |
|+ 예 | 공을 보고 잡기, 신호등 보고 건너기 | 무릎 반사, 재채기, 동공 반사 |
|+ 의의 | 상황을 판단하여 적절히 행동 | 위험으로부터 몸을 빠르게 보호 |

= 무릎 반사의 경로 | 경로 그리기
^+ 고무망치로 무릎을 친다 (자극)
^+ → **감각 신경** → **척수**
^+ → **운동 신경** → **다리 근육** (다리가 올라감)
>+ 대뇌를 거치지 않는다 → 망치를 친 사실은 반응이 일어난 **뒤에** 대뇌로 전달되어 느낀다.

= 반사의 중추별 예 | 사례
* 🔥 뜨거운 것에서 손 떼기 :: 척수 반사
* 🦵 무릎 반사 :: 척수 반사
* 🤧 재채기·기침 :: 연수 반사
* 🥱 하품·침 분비 :: 연수 반사
* 🔦 동공 반사 :: 밝은 빛에 동공이 작아짐 — 중간뇌 반사
* 🍋 레몬을 보고 침 :: 경험으로 생긴 반응 — 대뇌가 관여

= 예제 4 · 분류하기 | 적용
| 반응 | 중추 |
|+ 날아오는 공을 피했다 | [[대뇌]] |
|+ 레몬을 보니 침이 고였다 | [[대뇌]] (경험) |
|+ 뜨거운 냄비에 닿자 손을 뗐다 | [[척수]] |
|+ 밝은 곳에서 동공이 작아졌다 | [[중간뇌]] |
|+ 먼지가 들어가 재채기를 했다 | [[연수]] |

= 확인 문제 1
Q 자가 4.9 cm 떨어진 뒤 잡았다. 반응 시간은?
o 0.01 s
o* 0.1 s
o 0.2 s
o 0.49 s
:: t = √(2 × 0.049 ÷ 9.8) = √0.01 = 0.1 s

= 확인 문제 2
Q 무조건 반사에 해당하지 않는 것은?
o 무릎 반사
o 재채기
o* 신호등을 보고 길을 건넌다
o 밝은 곳에서 동공이 작아진다
:: 신호등을 보고 판단하여 건너는 것은 대뇌가 중추인 의식적 반응이다.

= 확인 문제 3
Q 뜨거운 물체에 손이 닿아 손을 떼는 반응의 경로로 옳은 것은?
o 감각 신경 → 대뇌 → 운동 신경
o* 감각 신경 → 척수 → 운동 신경
o 운동 신경 → 척수 → 감각 신경
o 감각 신경 → 연수 → 대뇌
:: 척수 반사로, 대뇌를 거치지 않아 매우 빠르다.

= 확인 문제 4
Q 무조건 반사의 의의로 가장 알맞은 것은?
o 상황을 판단하여 가장 좋은 행동을 고른다
o 기억을 오래 저장한다
o* 위험으로부터 몸을 빠르게 보호한다
o 학습을 통해 새로운 행동을 익힌다
:: 판단 과정 없이 빠르게 일어나 위험에서 몸을 보호한다.

= 서술형 도전 | 생각 넓히기
? 자 잡기를 연습할수록 떨어진 거리가 줄어드는 까닭을 쓰시오. :: 반복할수록 대뇌의 판단과 명령이 빨라져 반응 시간이 짧아지기 때문이다.
? 날아오는 공을 잡는 반응과 뜨거운 냄비에서 손을 떼는 반응의 경로를 각각 쓰고, 어느 쪽이 더 빠른지 까닭과 함께 쓰시오. :: 공 잡기: 눈 → 감각 신경 → 대뇌 → 척수 → 운동 신경 → 팔 근육 / 손 떼기: 피부 → 감각 신경 → 척수 → 운동 신경 → 팔 근육. 손 떼기는 대뇌를 거치지 않아 경로가 짧으므로 더 빠르다.

= 적용 미션 · 반응 속도 아케이드 | 게임
@ app-reaction.html | 자 잡기와 판단 반응에 도전하자. 자 잡기 결과(cm)를 반응 시간(ms)으로 바꿔 모둠 기록을 비교하자.
% 모둠 대결 3분: 판단 반응(색 구별)은 단순 반응보다 왜 느린지 함께 이유 찾기

= 오늘 배운 내용 정리
- 의식적 반응: 감각 기관 → 감각 신경 → [[대뇌]] → 척수 → 운동 신경 → 근육
- 자 잡기 반응 시간 t = √(2 × 떨어진 거리 ÷ [[9.8]])
- 대뇌를 거치지 않는 빠른 반응 → [[무조건 반사]]
- 무릎 반사·손 떼기: [[척수]] / 재채기·기침: [[연수]] / 동공 반사: [[중간뇌]]

= 나가기 전 한 문제 | 형성평가
? 무조건 반사가 의식적 반응보다 빠른 까닭을 '경로'를 넣어 한 문장으로 쓰시오. :: 무조건 반사는 대뇌를 거치지 않고 척수·연수·중간뇌에서 바로 명령을 내려 자극이 전달되는 경로가 짧기 때문이다.
