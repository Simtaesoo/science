* 🍚 점심 식사 :: 밥을 먹어 포도당이 쏟아져 들어와도 혈당량은 곧 돌아온다

## 호르몬 | 혈액을 타고 가는 신호

= 호르몬의 특성
! 호르몬: 내분비샘에서 만들어져 혈액을 따라 이동하며 특정 기관에만 작용하는 물질
- ==적은 양==으로 큰 효과를 낸다.
- 특정 기관(표적 기관)에만 작용한다.
>+ 너무 많거나 적게 분비되면 **과다증·결핍증**이 나타난다.

= 주요 내분비샘과 호르몬 | 개념 정리
| 내분비샘 | 호르몬 | 기능 |
|+ 뇌하수체 | 생장 호르몬 | 몸의 생장 촉진 (과다: 거인증, 결핍: 소인증) |
|+ 갑상샘 | 티록신 | 세포 호흡 촉진 |
|+ 이자 | 인슐린, 글루카곤 | 혈당량 조절 |
|+ 부신 | 아드레날린 | 심장 박동 촉진, 혈당량 높임 |

= 확인 문제 1
Q 호르몬에 대한 설명으로 옳지 않은 것은?
o 내분비샘에서 만들어진다
o 혈액을 따라 이동한다
o* 많은 양이 있어야 효과가 나타난다
o 특정 기관에만 작용한다
:: 호르몬은 적은 양으로도 큰 효과를 낸다.

## 혈당량 조절 | 인슐린과 글루카곤

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#homeo | [식사하기]와 [운동하기]를 누르고 혈당량의 변화와 분비되는 호르몬을 관찰하자. 인슐린이 부족할 때와 비교하자.
% 정상 → 인슐린 부족 순서로 식사 버튼을 눌러 그래프 차이를 비교

= 인슐린과 글루카곤 | 비교
| 구분 | 혈당량이 높을 때 (식사 후) | 혈당량이 낮을 때 (운동, 공복) |
|+ 분비되는 호르몬 | [[인슐린]] | [[글루카곤]] |
|+ 간에서의 작용 | 포도당 → 글리코젠으로 저장 | 글리코젠 → 포도당으로 분해 |
|+ 결과 | 혈당량 낮아짐 | 혈당량 높아짐 |
>+ 두 호르몬이 서로 **반대로** 작용하여 혈당량을 일정하게 유지한다.

= 식사 후 혈당량 변화 | 자료 해석
C 식사 후 혈당량 변화 (예시 자료) | 식사 후 시간 (분) | 혈당량 (mg/dL) | 정상:0,90 30,140 60,150 90,120 120,100 180,90 | 인슐린 부족:0,130 30,200 60,230 90,220 120,210 180,190
+ 정상: 식사 후 올라갔다가 [[인슐린]]의 작용으로 2시간쯤 뒤 원래대로
+ 인슐린 부족: 혈당량이 [[높게]] 유지된다 → 당뇨병

= 예제 1 · 식사 후의 혈당량 조절 | 적용
- 점심 식사 후 혈당량이 높아졌다.
^+ 이자에서 **인슐린** 분비 증가
^+ 간에서 포도당 → **글리코젠**으로 저장, 세포의 포도당 흡수 촉진
^+ 혈당량이 **낮아져** 원래 수준으로 돌아온다.

= 예제 2 · 운동 중의 혈당량 조절 | 적용
- 오래 달리기를 하여 혈당량이 낮아졌다.
^+ 이자에서 **글루카곤** 분비 증가
^+ 간에서 글리코젠 → **포도당**으로 분해하여 혈액으로 내보냄
^+ 혈당량이 **높아져** 원래 수준으로 돌아온다.

## 체온 조절 | 신경과 호르몬의 협동

= 체온 조절 | 중추: 간뇌
| 구분 | 더울 때 | 추울 때 |
|+ 피부 근처 혈관 | 확장 → 열 방출 증가 | 수축 → 열 방출 감소 |
|+ 땀 분비 | 증가 | 감소 |
|+ 근육 | - | 떨림 → 열 발생 |
|+ 물질대사 | 감소 | 증가 (티록신 분비 증가) |

= 신경과 호르몬 | 비교
| 구분 | 신경 | 호르몬 |
|+ 전달 방법 | 뉴런 | 혈액 |
|+ 전달 속도 | 빠름 | 비교적 느림 |
|+ 효과의 지속 | 짧음 | 오래 지속 |
|+ 작용 범위 | 좁음 (연결된 곳) | 넓음 (혈액이 닿는 곳의 특정 기관) |

= 예제 3 · 추운 날 운동장에서 | 적용
- 추운 겨울날 얇은 옷을 입고 운동장에 나갔다.
^+ 간뇌가 체온 저하를 감지
^+ 피부 근처 혈관 **수축**, 땀 분비 **감소** → 열 방출 줄이기
^+ 근육 **떨림**, 티록신 분비 증가로 물질대사 **증가** → 열 발생 늘리기

= 생활 속 항상성 | 사례
* 💉 당뇨병 :: 인슐린이 부족하거나 잘 작용하지 않아 혈당량이 높다
* 😱 놀랐을 때 :: 아드레날린으로 심장이 빨리 뛰고 혈당량이 오른다
* 🥶 소름·떨림 :: 추울 때 근육이 떨려 열을 만든다
* 🥵 얼굴 빨개짐 :: 더울 때 피부 혈관이 확장되어 열을 내보낸다
* 📏 성장기 :: 생장 호르몬이 키 성장을 돕는다 — 충분한 잠이 중요
* 🍬 저혈당 :: 공복 운동 뒤 어지러울 때 단 음식을 먹는다

= 확인 문제 2
Q 식사 후 혈당량이 높아졌을 때 분비되는 호르몬과 그 작용은?
o 글루카곤 — 글리코젠을 포도당으로 분해
o* 인슐린 — 포도당을 글리코젠으로 저장
o 티록신 — 세포 호흡 억제
o 아드레날린 — 혈당량을 낮춤
:: 인슐린은 간에서 포도당을 글리코젠으로 저장하게 하여 혈당량을 낮춘다.

= 확인 문제 3
Q 더울 때 일어나는 체온 조절 작용으로 옳은 것은?
o 피부 근처 혈관이 수축한다
o 근육이 떨린다
o* 땀 분비가 증가한다
o 물질대사가 증가한다
:: 더울 때는 피부 혈관이 확장되고 땀 분비가 늘어 열 방출이 증가한다.

= 확인 문제 4
Q 신경과 비교한 호르몬의 특징으로 옳은 것은?
o 전달 속도가 빠르다
o* 효과가 오래 지속된다
o 뉴런을 통해 전달된다
o 작용 범위가 좁다
:: 호르몬은 혈액을 통해 비교적 느리게 전달되지만 효과가 오래 지속되고 작용 범위가 넓다.

= 서술형 도전 | 생각 넓히기
? 당뇨병 환자의 오줌에 포도당이 섞여 나오는 까닭을 호르몬과 관련지어 쓰시오. :: 인슐린이 부족하거나 제대로 작용하지 않아 혈당량이 높게 유지되므로, 콩팥에서 포도당이 모두 재흡수되지 못해 오줌으로 나온다.
? 추울 때 몸이 떨리는 것이 체온 유지에 도움이 되는 까닭을 쓰시오. :: 근육이 떨리며 수축과 이완을 반복하면 열이 발생하여 체온이 떨어지는 것을 막는다.

= 오늘 배운 내용 정리
- 내분비샘에서 만들어져 혈액으로 이동, 특정 기관에 작용 → [[호르몬]]
- 혈당량 ↑ → [[인슐린]] → 포도당을 글리코젠으로 저장 → 혈당량 ↓
- 혈당량 ↓ → [[글루카곤]] → 글리코젠을 포도당으로 분해 → 혈당량 ↑
- 체온 조절의 중추 → [[간뇌]]
- 신경: 빠르고 짧게 / 호르몬: 느리지만 [[오래 지속]]

= 나가기 전 한 문제 | 형성평가
? 아침을 거르고 체육 수업을 한 학생의 혈당량이 낮아졌을 때, 분비되는 호르몬과 간에서 일어나는 일을 쓰시오. :: 이자에서 글루카곤이 분비되어 간에 저장된 글리코젠을 포도당으로 분해해 혈액으로 내보내므로 혈당량이 높아진다.
