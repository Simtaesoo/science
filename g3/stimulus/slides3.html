# 뉴런과 신경계 | 몸속 정보 통신망 | 중학교 과학 3 · 20 자극과 반응 · 3차시 | 2022 개정 교육과정 [9과20]

= 오늘의 학습 목표 | 3차시
^ **뉴런**의 구조와 자극이 전달되는 방향을 설명할 수 있다.
^ **중추 신경계**(뇌·척수)의 각 부분의 기능을 설명할 수 있다.
^ **말초 신경계**와 자율 신경의 작용을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 뉴런(시뮬레이션) 10분 → 중추 신경계 12분 → 말초·자율 신경 8분 → 문항 10분

= 발가락을 찧으면 왜 '조금 뒤에' 아플까? | 생각 열기
* 🦶 발가락 :: 문턱에 찧고 아주 잠깐 뒤에 통증이 몰려온다
* 📞 전화 :: 멀리 있는 사람과도 신호로 연결된다
* 😰 발표 직전 :: 심장이 두근두근, 입이 바짝
* 🍺 음주 :: 비틀비틀 균형을 잡지 못한다
? 발가락에서 생긴 자극은 어디까지, 무엇을 타고 갈까? :: 신경 세포(**뉴런**)를 따라 척수를 거쳐 **뇌**까지 전달된다. 거리가 있으니 아주 짧은 시간이 걸린다.

= 지난 시간 복습 | 2차시
| 감각 기관 | 자극 | 감각 세포 |
| 눈 | 빛 | 시각 세포 |
| 귀 | 소리 | 청각 세포 |
| 코 | 기체 화학 물질 | 후각 세포 |
| 혀 | 액체 화학 물질 | 맛세포 |
? 감각 세포가 받아들인 자극은 어디로 전달될까? :: 감각 신경을 따라 **대뇌**로 전달되어 감각을 느낀다. — 그 '전선'이 오늘의 신경계!

## 뉴런 | 신경계의 기본 단위

= 뉴런의 구조
! 뉴런: 신경계를 구성하는 기본 단위
| 구조 | 하는 일 |
|+ 가지 돌기 | 다른 뉴런이나 감각 기관에서 자극을 받아들임 |
|+ 신경 세포체 | 핵이 있고 뉴런의 생명 활동 담당 |
|+ 축삭 돌기 | 자극을 다른 뉴런이나 기관으로 전달 |
>+ 전달 방향: 가지 돌기 → 신경 세포체 → 축삭 돌기 → 다음 뉴런의 가지 돌기

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#nerve | [신호 보내기]로 자극이 전달되는 방향을 확인하고, [뇌와 척수]에서 각 부분의 기능을 살펴보자.
% 신호가 거꾸로는 가지 않는다는 점(한 방향 전달)을 강조

= 뉴런의 종류 | 신호의 릴레이
^+ **감각 뉴런**: 감각 기관 → 중추 신경계
^+ **연합 뉴런**: 뇌·척수에서 정보를 판단하고 명령을 내림
^+ **운동 뉴런**: 중추 신경계 → 근육 (반응)
>+ 감각 뉴런 → 연합 뉴런 → 운동 뉴런 순서로 이어진다.

= 예제 1 · 신호는 얼마나 빠를까? | 적용
- 감각 뉴런의 전달 속력이 약 60 m/s일 때, 발끝에서 척수까지 약 1.2 m를 가는 데 걸리는 시간은?
^+ 시간 = 거리 ÷ 속력
^+ 1.2 ÷ 60 = **0.02 s** = **20 ms**
>+ 아주 빠르지만 0은 아니다 — 발가락을 찧고 **잠깐 뒤에** 아픈 까닭
~ 속력은 시뮬레이션 모형의 대략값 (감각 뉴런 약 60 m/s, 운동 뉴런 약 100 m/s)

## 중추 신경계 | 뇌와 척수

= 뇌와 척수의 기능 | 개념 정리
| 구분 | 기능 |
|+ 대뇌 | 감각·기억·판단·추리 등 정신 활동, 의식적 행동 조절 |
|+ 소뇌 | 근육 운동 조절, 몸의 자세와 균형 유지 |
|+ 간뇌 | 체온·혈당량·체액 농도 조절 (항상성) |
|+ 중간뇌 | 눈의 움직임과 동공 크기 조절 |
|+ 연수 | 심장 박동·호흡·소화 운동 조절, 기침·재채기·하품 중추 |
|+ 척수 | 뇌와 몸 사이 신호 전달 통로, 무릎 반사 중추 |

= 예제 2 · 어느 부분이 일할까? | 적용
| 상황 | 중추 |
|+ 수학 문제를 풀었다 | [[대뇌]] |
|+ 외발자전거에서 균형을 잡았다 | [[소뇌]] |
|+ 더운 날 체온이 일정하게 유지되었다 | [[간뇌]] |
|+ 자는 동안에도 숨을 쉬었다 | [[연수]] |
|+ 밝은 빛에 동공이 작아졌다 | [[중간뇌]] |

= 확인 문제 1
Q 몸의 자세와 균형을 유지하는 뇌의 부분은?
o 대뇌
o* 소뇌
o 간뇌
o 연수
:: 소뇌는 근육 운동을 조절하고 몸의 균형을 유지한다.

## 말초 신경계 | 몸 구석구석 연결

= 말초 신경계와 자율 신경
- 말초 신경계: 중추 신경계와 몸의 각 부분을 연결 → ==감각 신경, 운동 신경, 자율 신경==
! 자율 신경: 대뇌의 명령 없이 내장 기관의 운동을 조절
- **교감 신경**과 **부교감 신경**은 서로 ==반대로== 작용한다.

= 교감 신경과 부교감 신경 | 비교
| 구분 | 동공 | 심장 박동 | 호흡 | 소화 운동 |
|+ 교감 신경 (긴장할 때) | 커짐 | 빨라짐 | 빨라짐 | 억제 |
|+ 부교감 신경 (편안할 때) | 작아짐 | 느려짐 | 느려짐 | 촉진 |
>+ 위급할 때는 교감 신경, 쉬고 먹을 때는 부교감 신경!

= 예제 3 · 발표 직전의 몸 | 적용
- 발표를 앞두고 긴장하자 심장이 두근거리고 입이 말랐다.
^+ 긴장 → **교감 신경** 작용
^+ 심장 박동이 **빨라진다.**
^+ 소화 기관의 활동(침 분비 등)이 **억제** → 입이 마른다.

= 생활 속 신경계 | 사례
* 🍺 음주 :: 소뇌 기능이 떨어져 비틀거린다
* 🦺 척수 손상 :: 뇌와 몸 사이 신호가 끊겨 감각·운동이 어려워진다
* 😱 놀람 :: 교감 신경으로 동공이 커지고 심장이 빨리 뛴다
* 🍽️ 식후 졸음 :: 부교감 신경이 소화를 촉진하며 몸이 편안해진다
* 🧠 뇌졸중 :: 대뇌 일부가 손상되면 말하기·움직임에 장애
* 🪖 헬멧 :: 뇌와 척수는 머리뼈·척추뼈가 보호하지만 충격엔 약하다

= 확인 문제 2
Q 뉴런에서 자극이 전달되는 방향으로 옳은 것은?
o 축삭 돌기 → 신경 세포체 → 가지 돌기
o* 가지 돌기 → 신경 세포체 → 축삭 돌기
o 신경 세포체 → 가지 돌기 → 축삭 돌기
o 축삭 돌기 → 가지 돌기 → 신경 세포체
:: 가지 돌기에서 받아들인 자극은 신경 세포체를 거쳐 축삭 돌기 끝으로 전달된다.

= 확인 문제 3
Q 심장 박동, 호흡 운동을 조절하고 재채기의 중추인 곳은?
o 대뇌
o 소뇌
o* 연수
o 척수
:: 연수는 생명 유지에 중요한 심장 박동·호흡 운동을 조절한다.

= 확인 문제 4
Q 교감 신경이 작용할 때 나타나는 변화로 옳지 않은 것은?
o 동공이 커진다
o 심장 박동이 빨라진다
o 호흡이 빨라진다
o* 소화 운동이 촉진된다
:: 교감 신경은 소화 운동을 억제한다. 소화를 촉진하는 것은 부교감 신경이다.

= 서술형 도전 | 생각 넓히기
? 척수를 다치면 다리를 움직이지 못하거나 감각을 느끼지 못할 수 있는 까닭을 쓰시오. :: 척수는 뇌와 몸 사이에 신호를 전달하는 통로이므로, 다치면 뇌의 명령과 감각 정보가 전달되지 못하기 때문이다.
? 위급한 상황에서 교감 신경이 작용하는 것이 생존에 어떤 도움이 되는지 쓰시오. :: 심장 박동과 호흡이 빨라져 근육에 산소와 영양소가 많이 공급되고, 동공이 커져 주변을 잘 볼 수 있으므로 빠르게 도망치거나 맞서는 데 유리하다.

- 감각 뉴런 → [[연합 뉴런]] → 운동 뉴런
- 중추 신경계: 뇌([[대뇌]]·소뇌·간뇌·중간뇌·연수)와 [[척수]]
- 대뇌의 명령 없이 내장 기관을 조절 → [[자율 신경]]
- 긴장: [[교감]] 신경 / 편안: [[부교감]] 신경

= 나가기 전 한 문제 | 형성평가
? 술을 많이 마신 사람이 비틀거리는 까닭을 뇌의 부분과 기능을 넣어 한 문장으로 쓰시오. :: 알코올이 근육 운동을 조절하고 몸의 균형을 유지하는 소뇌의 기능을 떨어뜨리기 때문이다.
