# 귀, 코, 혀, 피부 | 소리, 냄새, 맛, 촉감을 느끼는 원리 | 중학교 과학 3 · 20 자극과 반응 · 2차시 | 2022 개정 교육과정 [9과20]

= 오늘의 학습 목표 | 2차시
^ 귀의 구조를 알고 **소리를 듣는 과정**과 **평형 감각**을 설명할 수 있다.
^ 코와 혀가 받아들이는 **자극**과 감각 세포를 비교할 수 있다.
^ **피부 감각점**의 종류와 분포를 실험으로 확인할 수 있다.
% 흐름: 생각 열기 5분 → 귀(시뮬레이션) 12분 → 코·혀 8분 → 피부 감각점 실험 10분 → 문항 10분

= 감기에 걸리면 왜 음식 맛이 없을까? | 생각 열기
* 🤧 코감기 :: 코가 막히면 좋아하는 음식도 맛이 밍밍
* ✈️ 비행기 이륙 :: 귀가 먹먹해진다
* 🎠 회전목마 :: 내리고 나서도 빙글빙글 도는 느낌
* 🌶️ 매운 떡볶이 :: 혀가 '아프다'
? 코를 막고 사과와 양파를 먹으면 구별할 수 있을까? :: 구별하기 어렵다. 음식의 맛은 **미각과 후각**을 함께 느끼는 것이기 때문이다.
% 시간이 되면 코 막고 젤리 맛 맞히기 활동

= 지난 시간 복습 | 1차시
- 빛 → 각막 → 수정체 → 유리체 → [[망막]] → 시각 신경 → [[대뇌]]
- 가까운 곳을 볼 때 섬모체 [[수축]], 수정체 [[두꺼워짐]]
? 눈이 받아들이는 자극은 빛이다. 귀, 코, 혀, 피부는 각각 어떤 자극을 받아들일까? :: 귀 – 소리(진동)·회전·기울어짐, 코 – 기체 화학 물질, 혀 – 액체 화학 물질, 피부 – 접촉·압력·통증·온도

## 귀 | 소리와 균형

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#sense | [자극 주기]로 소리가 전달되는 경로를 따라가고, 코·혀·피부도 차례로 관찰하자.
% 소리 경로를 학생이 소리 내어 따라 읽게 하기

= 소리를 듣는 과정
^+ 소리 → **귓바퀴** → **외이도**
^+ → **고막**(진동) → **귓속뼈**(진동 증폭)
^+ → **달팽이관**(청각 세포) → **청각 신경** → **대뇌**
>+ 고막은 소리에 따라 떨리는 얇은 막, 귓속뼈는 그 진동을 크게 만든다.

= 귀의 구조와 기능
| 구조 | 기능 |
|+ 귓속뼈 | 고막의 진동을 크게 하여 달팽이관으로 전달 |
|+ 달팽이관 | 청각 세포가 있어 소리 자극을 받아들임 |
|+ 반고리관 | 몸의 **회전** 감지 |
|+ 전정 기관 | 몸의 **기울어짐** 감지 |
|+ 귀인두관 | 고막 안팎의 **압력**을 같게 조절 |

= 예제 1 · 비행기 속 먹먹한 귀 | 적용
- 비행기가 이륙할 때 귀가 먹먹해지는 까닭과 해결 방법은?
^+ 높이 올라가면 바깥 기압이 **낮아진다.**
^+ 고막 안쪽과 바깥쪽의 **압력 차** → 고막이 밀려 먹먹함
^+ 침을 삼키거나 하품 → **귀인두관**이 열려 압력이 같아진다.

= 확인 문제 1
Q 몸이 회전하는 것을 느끼는 귀의 구조는?
o 달팽이관
o* 반고리관
o 귓속뼈
o 귀인두관
:: 반고리관은 회전, 전정 기관은 기울어짐을 감지한다.

## 코와 혀 | 화학 물질을 느끼는 감각

= 코와 혀 비교 | 개념 정리
| 구분 | 코 (후각) | 혀 (미각) |
|+ 받아들이는 자극 | 기체 상태의 화학 물질 | 액체 상태의 화학 물질 |
|+ 감각 세포 | 후각 상피의 후각 세포 | 맛봉오리의 맛세포 |
|+ 특징 | 매우 예민하지만 쉽게 피로해짐 | 기본 맛 5가지 |
>+ 기본 맛: 단맛, 짠맛, 신맛, 쓴맛, 감칠맛 / **매운맛**은 맛이 아니라 **통각**(피부 감각)!

= 예제 2 · 코를 막고 먹으면 | 적용
- 코를 막고 음식을 먹으면 맛을 잘 느끼지 못하는 까닭은?
^+ 혀는 기본 맛 5가지만 구별한다.
^+ 음식의 다양한 '맛'은 음식에서 나온 기체를 **후각**으로 함께 느낀 것
^+ 코를 막으면 후각 정보가 빠져 맛이 단순해진다.

## 피부 | 몸 전체를 덮은 감각 기관

= 피부 감각점
- 감각점: **통점, 압점, 촉점, 냉점, 온점**
- 가장 많은 감각점: ==통점== / 가장 적은 감각점: ==온점==
>+ 감각점이 많이 분포한 곳일수록 감각이 **예민하다.**
~ 통점이 가장 많은 까닭: 통증은 몸에 위험을 알리는 중요한 신호이기 때문

= 두 점을 구별하는 최소 거리 | 실험
- 눈을 감은 짝의 피부를 이쑤시개 두 개로 동시에 살짝 누르고, 두 점으로 느끼는 최소 간격을 잰다.
| 부위 | 손가락 끝 | 손바닥 | 팔 | 등 |
|+ 최소 거리 (mm) | 약 3 | 약 10 | 약 38 | 약 45 |
+ 가장 예민한 곳: [[손가락 끝]] → 감각점이 가장 [[촘촘하다]]
% 실험 시 이쑤시개 끝으로 세게 누르지 않도록 안전 지도

= 예제 3 · 몇 배나 예민할까? | 자료 해석
- 손가락 끝은 약 3 mm, 등은 약 45 mm 떨어져야 두 점으로 느낀다.
^+ 45 ÷ 3 = **15배**
^+ 손가락 끝은 등보다 약 15배 가까운 두 점도 구별한다.
>+ 점자를 손가락 끝으로 읽는 까닭!

= 생활 속 감각 기관 | 사례
* ⠿ 점자 :: 감각점이 촘촘한 손가락 끝으로 읽는다
* 🎢 멀미 :: 반고리관·전정 기관 정보와 눈의 정보가 어긋날 때
* 👃 향수 :: 처음엔 강하지만 금세 냄새를 못 느낀다 (후각 피로)
* 🌶️ 매운맛 :: 통점이 자극되는 통각이다
* 🎧 이어폰 소음 :: 큰 소리를 오래 들으면 달팽이관 청각 세포가 손상된다
* 🧊 손 담그기 :: 찬물 → 미지근한 물에 넣으면 따뜻하게 느껴진다

= 확인 문제 2
Q 감각 기관과 받아들이는 자극을 바르게 짝지은 것은?
o 코 — 액체 상태의 화학 물질
o* 혀 — 액체 상태의 화학 물질
o 귀 — 빛
o 피부 — 기체 상태의 화학 물질
:: 혀는 액체 상태, 코는 기체 상태의 화학 물질을 받아들인다.

= 확인 문제 3
Q 피부 감각점에 대한 설명으로 옳은 것은?
o 온점이 가장 많다
o* 감각점이 많은 곳일수록 예민하다
o 몸의 모든 부위에 감각점이 같은 수만큼 있다
o 매운맛은 맛세포가 느낀다
:: 통점이 가장 많고 온점이 가장 적으며, 감각점이 촘촘한 곳이 예민하다.

= 확인 문제 4
Q 소리를 듣는 과정에서 진동을 크게 하는 구조는?
o 고막
o* 귓속뼈
o 달팽이관
o 청각 신경
:: 고막의 진동이 귓속뼈에서 커져 달팽이관으로 전달된다.

= 서술형 도전 | 생각 넓히기
? 제자리에서 빙글빙글 돈 뒤 멈추면 어지러운 까닭을 관련된 구조와 함께 쓰시오. :: 반고리관 속 림프가 계속 움직여, 몸이 멈췄는데도 여전히 회전하는 것처럼 느끼기 때문이다.
? 가스 누출을 알기 쉽도록 냄새 없는 도시가스에 일부러 냄새 물질을 넣는다. 후각의 특징과 관련지어 그 까닭을 쓰시오. :: 후각은 매우 예민하여 아주 적은 양의 기체도 느낄 수 있으므로, 냄새 물질을 넣으면 가스가 새는 것을 빨리 알아챌 수 있다.

= 오늘 배운 내용 정리
- 소리 → 귓바퀴 → 외이도 → [[고막]] → [[귓속뼈]] → [[달팽이관]] → 청각 신경 → 대뇌
- 회전 감지 [[반고리관]], 기울어짐 감지 [[전정 기관]], 압력 조절 [[귀인두관]]
- 코: [[기체]] 상태 화학 물질 / 혀: [[액체]] 상태 화학 물질
- 피부 감각점 중 가장 많은 것 [[통점]], 가장 적은 것 [[온점]]

= 나가기 전 한 문제 | 형성평가
? 매운 음식을 먹고 '맵다'고 느끼는 것은 미각일까? 까닭과 함께 쓰시오. :: 미각이 아니다. 매운맛은 기본 맛에 들어가지 않으며, 통점이 자극되어 느끼는 통각(피부 감각)이다.
