# 눈의 구조와 조절 작용 | 빛이 상이 되기까지 | 중학교 과학 3 · 20 자극과 반응 · 1차시 | 2022 개정 교육과정 [9과20]

= 오늘의 학습 목표 | 1차시
^ 눈의 각 **구조와 기능**을 설명할 수 있다.
^ 빛이 들어와 **물체를 보는 과정**을 순서대로 말할 수 있다.
^ 거리와 밝기에 따른 눈의 **조절 작용**을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 눈의 구조(시뮬레이션) 12분 → 보는 과정·맹점 8분 → 조절 작용 10분 → 문항 10분

= 눈은 카메라를 닮았다? | 생각 열기
* 📷 카메라 렌즈 :: 빛을 모아 상을 만든다
* 🔆 조리개 :: 들어오는 빛의 양을 조절한다
* 🖼️ 이미지 센서 :: 상이 맺혀 사진이 된다
* 🎯 초점 맞추기 :: 가까운 것과 먼 것을 또렷하게
? 우리 눈에서 렌즈, 조리개, 이미지 센서 역할을 하는 곳은 어디일까? :: 렌즈 – **수정체**, 조리개 – **홍채(동공)**, 이미지 센서 – **망막** — 오늘 하나씩 확인해 보자.
% 카메라를 직접 보여 주거나 스마트폰 카메라의 초점 맞추기를 시연

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 볼록 렌즈 | 빛을 굴절시켜 한 점에 모은다 |
| 빛의 굴절 | 빛이 다른 물질로 들어갈 때 꺾이는 현상 |
| 세포 → 조직 → 기관 | 눈은 여러 조직이 모인 감각 기관 |
? 볼록 렌즈가 두꺼울수록 빛을 더 많이 꺾을까, 적게 꺾을까? :: 두꺼울수록 빛을 **더 많이** 꺾는다 — 눈이 가까운 곳을 볼 때 이 원리를 쓴다.

## 눈의 구조 | 빛을 받아들이는 감각 기관

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#eye | 눈의 각 부분 이름을 확인하고, 물체 거리와 밝기를 바꾸며 수정체와 동공의 변화를 관찰하자.
% 거리 슬라이더 → 수정체 두께, 밝기 슬라이더 → 동공 크기 순서로 관찰

= 눈의 구조와 기능 ① | 빛이 지나는 길
| 구조 | 기능 |
|+ 각막 | 홍채 바깥을 싸는 투명한 막 |
|+ 홍채 | 동공의 크기를 조절 |
|+ 수정체 | 빛을 굴절시켜 망막에 상이 맺히게 함 |
|+ 섬모체 | 수정체의 두께를 조절 |
|+ 유리체 | 눈 속을 채우는 투명한 물질, 형태 유지 |

= 눈의 구조와 기능 ② | 상이 맺히고 전달되는 곳
| 구조 | 기능 |
|+ 망막 | 상이 맺히는 곳, 시각 세포가 분포 |
|+ 맥락막 | 검은색 색소가 있어 눈 속을 어둡게 함 |
|+ 공막 | 눈의 가장 바깥, 눈을 보호 |
|+ 맹점 | 시각 신경이 나가는 곳, 시각 세포가 없음 |
|+ 시각 신경 | 시각 세포의 자극을 대뇌로 전달 |

= 물체를 보는 과정
^+ 빛 → **각막** → **수정체** → **유리체**
^+ → **망막**의 시각 세포가 자극을 받아들임
^+ → **시각 신경** → **대뇌**에서 '보인다'고 느낀다
>+ 우리가 '본다'고 느끼는 곳은 눈이 아니라 **대뇌**이다.

= 맹점 찾기 | 탐구
! ✚                    ●
- 왼쪽 눈을 가리고 오른쪽 눈으로 ✚를 바라보며 화면(종이)에 천천히 다가간다.
- 어느 순간 ●가 ==사라진다!==
? ●가 보이지 않는 까닭은? :: ●의 상이 시각 세포가 없는 **맹점**에 맺혔기 때문이다.
% 화면에서 하기 어려우면 학습지 1차시 뒷면의 그림으로 진행

= 확인 문제 1
Q 상이 맺히고 시각 세포가 분포하는 눈의 구조는?
o 각막
o 수정체
o* 망막
o 홍채
:: 망막에 상이 맺히면 시각 세포가 자극을 받아 시각 신경으로 전달한다.

## 눈의 조절 작용 | 거리와 밝기에 맞추기

= 거리에 따른 조절 | 섬모체와 수정체
| 상황 | 섬모체 | 수정체 |
|+ 가까운 곳을 볼 때 | [[수축]] | [[두꺼워짐]] |
|+ 먼 곳을 볼 때 | [[이완]] | [[얇아짐]] |
>+ 수정체가 두꺼우면 빛을 많이 꺾어 가까운 물체의 상도 망막에 정확히 맺힌다.

= 밝기에 따른 조절 | 홍채와 동공
| 상황 | 홍채 | 동공 | 들어오는 빛 |
|+ 밝은 곳 | [[확장]] | [[작아짐]] | 줄어듦 |
|+ 어두운 곳 | [[수축]] | [[커짐]] | 늘어남 |
>+ 동공은 '구멍'일 뿐 — 크기를 바꾸는 것은 **홍채**이다.

= 예제 1 · 책 보다가 창밖 보기 | 적용
- 책을 보다가 창밖의 먼 산을 바라보았다.
^+ 가까운 곳 → 먼 곳으로 시선 이동
^+ 섬모체가 **이완**한다.
^+ 수정체가 **얇아진다** → 먼 산의 상이 망막에 맺힘

= 예제 2 · 영화관에 들어가면 | 적용
- 밝은 로비에서 어두운 상영관에 들어갔다.
^+ 처음엔 아무것도 안 보인다 → 들어오는 빛이 부족
^+ 홍채가 **수축** → 동공이 **커진다**
^+ 눈에 들어오는 빛의 양이 늘어 점점 보이기 시작한다.

= 예제 3 · 스마트폰과 눈의 피로 | 적용
- 스마트폰을 오랫동안 가까이 보면 눈이 피로한 까닭은?
^+ 가까운 곳을 보는 동안 섬모체가 **계속 수축**
^+ 수정체를 두껍게 유지하느라 섬모체 근육이 쉬지 못한다.
^+ 대책: 가끔 **먼 곳**을 보아 섬모체를 이완시킨다.

= 생활 속 눈의 조절 | 사례
* 📱 먼 곳 보기 :: 20분마다 먼 곳을 보아 섬모체를 쉬게
* 🔦 눈에 손전등 :: 빛을 비추면 동공이 바로 작아진다
* 🕶️ 선글라스 :: 강한 빛을 줄여 눈을 보호한다
* 👓 돋보기 :: 나이 들면 수정체 조절이 어려워 가까운 글씨가 흐리다
* 🌃 밤길 운전 :: 동공이 커져 있어 맞은편 불빛이 더 눈부시다
* 🐱 고양이 눈 :: 밤에 동공이 아주 크게 열린다

= 확인 문제 2
Q 먼 곳을 보다가 가까운 곳을 볼 때 일어나는 변화는?
o 섬모체 이완, 수정체 얇아짐
o* 섬모체 수축, 수정체 두꺼워짐
o 홍채 확장, 동공 작아짐
o 홍채 수축, 동공 커짐
:: 가까운 곳을 볼 때는 섬모체가 수축하여 수정체가 두꺼워진다.

= 확인 문제 3
Q 어두운 곳에 들어갔을 때의 변화로 옳은 것은?
o 홍채가 확장하여 동공이 작아진다
o* 홍채가 수축하여 동공이 커진다
o 수정체가 두꺼워진다
o 맹점이 커진다
:: 어두운 곳에서는 홍채가 수축하여 동공이 커지고 들어오는 빛의 양이 늘어난다.

= 확인 문제 4
Q 빛이 들어와 물체를 보기까지의 경로로 옳은 것은?
o 수정체 → 각막 → 망막 → 유리체 → 대뇌
o* 각막 → 수정체 → 유리체 → 망막 → 시각 신경 → 대뇌
o 각막 → 망막 → 수정체 → 시각 신경 → 대뇌
o 홍채 → 맥락막 → 공막 → 시각 신경 → 대뇌
:: 빛 → 각막 → 수정체 → 유리체 → 망막(시각 세포) → 시각 신경 → 대뇌

= 서술형 도전 | 생각 넓히기
? 카메라의 렌즈, 조리개, 이미지 센서에 해당하는 눈의 구조를 짝지어 쓰시오. :: 렌즈 – 수정체, 조리개 – 홍채(동공), 이미지 센서(필름) – 망막
? 맹점에 상이 맺히면 물체가 보이지 않는 까닭을 쓰시오. :: 맹점은 시각 신경이 눈 밖으로 나가는 곳이라 시각 세포가 없어 빛 자극을 받아들이지 못하기 때문이다.

= 오늘 배운 내용 정리
- 빛 → 각막 → [[수정체]] → 유리체 → [[망막]] → [[시각 신경]] → 대뇌
- 시각 세포가 없어 상이 맺혀도 보이지 않는 곳 → [[맹점]]
- 가까운 곳: 섬모체 [[수축]], 수정체 [[두꺼워짐]]
- 먼 곳: 섬모체 이완, 수정체 얇아짐
- 어두운 곳: 홍채 [[수축]], 동공 [[커짐]]

= 나가기 전 한 문제 | 형성평가
? 밝은 운동장에서 공을 보다가 어두운 실내에 들어와 가까운 책을 볼 때, 홍채·동공·섬모체·수정체의 변화를 모두 쓰시오. :: 홍채 수축 → 동공 커짐(어두운 곳), 섬모체 수축 → 수정체 두꺼워짐(가까운 곳)
