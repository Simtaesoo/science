= 상처는 어떻게 아물까? | 생각 열기
* 🩹 무릎 상처 :: 며칠 뒤 새살이 돋는다
* 🦎 도마뱀 :: 잘린 꼬리가 다시 자란다
* 🌱 양파 뿌리 :: 물에 담가 두면 하루가 다르게 길어진다
* 🦠 아메바 :: 둘로 나뉘어 개체 수를 늘린다
? 새로 생긴 세포는 원래 세포와 유전 정보가 같아야 할까? :: 같아야 한다. 그래야 피부는 피부, 뿌리는 뿌리로 똑같이 일할 수 있다 — 그래서 **염색체를 똑같이 나누는** 체세포 분열이 일어난다.

? 두 염색 분체의 유전 정보가 같다는 것은 오늘 어떤 의미가 있을까? :: 염색 분체가 하나씩 나뉘어 들어가면 두 딸세포는 **같은 유전 정보**를 갖게 된다.

## 체세포 분열 과정 | 핵분열 + 세포질 분열

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#mitosis | [자동 진행]으로 각 단계를 관찰하고, 동물 세포와 식물 세포의 세포질 분열을 비교하자.
% 각 단계에서 멈추고 '염색체가 어디에, 어떤 모양으로 있는지' 묻기

= 체세포 분열의 단계 | 개념 정리
| 단계 | 특징 |
|+ 간기 | 핵막이 뚜렷, 염색체가 보이지 않음, DNA 복제 |
|+ 전기 | 염색체가 나타나고 핵막이 사라짐, 방추사 형성 |
|+ 중기 | 염색체가 세포 중앙에 배열 → 관찰에 가장 좋음 |
|+ 후기 | 염색 분체가 분리되어 양쪽 끝으로 이동 |
|+ 말기 | 핵막이 나타나 두 개의 핵 형성, 세포질 분열 시작 |
% 암기 요령: 간 → 전 → 중 → 후 → 말

= 세포질 분열 | 동물 vs 식물
| 구분 | 동물 세포 | 식물 세포 |
|+ 세포질 분열 | 세포막이 **바깥에서 안으로** 잘록해짐 | 세포판이 **안에서 바깥으로** 만들어짐 |
>+ 식물 세포는 단단한 **세포벽**이 있어 바깥에서 조일 수 없다 → 안쪽에 칸막이(세포판)를 만든다.

= 체세포 분열의 결과
! 딸세포 2개, 딸세포의 염색체 수 = 어버이 세포와 같다
- 체세포 분열의 의의: ==생장, 재생, 단세포 생물의 번식==
>+ 염색체 수가 4개인 세포 → 체세포 분열 → 염색체 4개인 딸세포 **2개**

= 예제 1 · 세포 수 늘리기 | 적용
- 세포 1개가 체세포 분열을 5번 연속하면 세포는 몇 개가 될까?
^+ 1회 분열마다 세포 수 **2배**
^+ 1 → 2 → 4 → 8 → 16 → **32개**
^+ 각 세포의 염색체 수는 처음 세포와 **같다.**
||
C 체세포 분열 횟수와 세포 수 | 분열 횟수 | 세포 수 | 세포 수:0,1 1,2 2,4 3,8 4,16 5,32

= 확인 문제 1
Q 염색체가 세포 중앙에 배열되어 관찰하기 가장 좋은 시기는?
o 간기
o 전기
o* 중기
o 후기
:: 중기에는 염색체가 가장 굵고 짧아진 상태로 세포 중앙에 늘어서 관찰하기 좋다.

## 양파 뿌리 끝 관찰 | 실험

= 실험 과정과 까닭
| 과정 | 하는 까닭 |
|+ 고정 (에탄올 + 아세트산) | 세포 분열을 멈추고 살아 있을 때 모습으로 유지 |
|+ 해리 (묽은 염산) | 조직을 연하게 하여 세포가 잘 분리되게 함 |
|+ 염색 (아세트산 카민) | 핵과 염색체를 붉게 염색 |
|+ 분리 (덮개 유리로 누름) | 세포를 한 층으로 펴서 겹치지 않게 함 |
>+ 순서: 고정 → 해리 → 염색 → 분리 (**고해염분**)

= 예제 2 · 관찰 결과 해석 | 자료 해석
- 양파 뿌리 끝 세포 100개를 관찰하여 단계별로 세었다. (예시 자료)
| 단계 | 간기 | 전기 | 중기 | 후기 | 말기 |
| 세포 수 | 80 | 10 | 4 | 3 | 3 |
^+ 간기의 세포가 **80 %**로 가장 많다.
^+ 까닭: 세포 주기 중 **간기가 가장 길기** 때문
^+ 세포 주기가 20시간이라면 간기는 약 20 × 0.8 = **16시간**

= 예제 3 · 왜 뿌리 '끝'일까? | 적용
- 양파 뿌리의 끝부분을 관찰 재료로 쓰는 까닭은?
^+ 뿌리 끝에는 **생장점**이 있다.
^+ 생장점에서는 체세포 분열이 **활발하게** 일어난다.
^+ 그래서 분열 중인 세포를 많이 관찰할 수 있다.

= 생활 속 체세포 분열 | 사례
* 🩹 상처 재생 :: 주변 세포가 분열하여 상처를 메운다
* 🦎 도마뱀 꼬리 :: 체세포 분열로 새 꼬리가 재생된다
* 🌿 꺾꽂이 :: 줄기 세포가 분열하여 새 뿌리를 낸다
* 🦠 아메바·짚신벌레 :: 체세포 분열로 번식한다
* 🧑 성장기 :: 뼈 끝의 성장판에서 세포 분열이 활발하다
* ⚠️ 암 :: 조절을 벗어나 세포가 끝없이 분열하는 병

= 확인 문제 2
Q 염색 분체가 분리되어 세포의 양쪽 끝으로 이동하는 시기는?
o 전기
o 중기
o* 후기
o 말기
:: 후기에 방추사가 염색 분체를 끌어당겨 양쪽으로 분리한다.

= 확인 문제 3
Q 체세포 분열에 대한 설명으로 옳지 않은 것은?
o 딸세포는 2개 만들어진다
o 딸세포의 염색체 수는 어버이 세포와 같다
o 생장과 재생이 일어날 때 일어난다
o* 딸세포의 염색체 수는 어버이 세포의 절반이다
:: 체세포 분열에서는 염색체 수가 변하지 않는다. 절반이 되는 것은 감수 분열이다.

= 확인 문제 4
Q 양파 뿌리 끝 세포 관찰 실험에서 아세트산 카민 용액을 사용하는 까닭은?
o 세포 분열을 멈추게 하려고
o 조직을 연하게 하려고
o* 핵과 염색체를 붉게 염색하려고
o 세포를 한 층으로 펴려고
:: 아세트산 카민 용액은 핵과 염색체를 붉게 물들여 잘 보이게 한다.

= 서술형 도전 | 생각 넓히기
? 도마뱀이 꼬리를 자르고 달아난 뒤 새 꼬리가 자라는 것은 어떤 세포 분열 덕분인지, 새 꼬리 세포의 염색체 수는 어떠할지 쓰시오. :: 체세포 분열(재생). 체세포 분열은 염색체 수가 변하지 않으므로 원래 몸의 세포와 염색체 수가 같다.
? 식물 세포의 세포질 분열이 동물 세포와 다른 까닭을 세포 구조와 관련지어 쓰시오. :: 식물 세포는 단단한 세포벽이 있어 바깥에서 잘록해질 수 없으므로, 안쪽에서 바깥으로 세포판을 만들어 세포질을 나눈다.

= 오늘 배운 내용 정리
- 체세포 분열: 간기 → [[전기]] → [[중기]] → [[후기]] → 말기
- DNA 복제는 [[간기]], 염색체 관찰은 [[중기]]가 가장 좋다.
- 동물 세포: 세포막이 바깥에서 안으로 / 식물 세포: [[세포판]]이 안에서 바깥으로
- 결과: 딸세포 [[2]]개, 염색체 수 [[변화 없음]]
- 실험 순서: 고정 → [[해리]] → 염색 → 분리
