## ABO식 혈액형 | 대립유전자가 세 가지

= ABO식 혈액형의 유전
- 대립유전자 **A, B, O** 세 가지가 관여한다.
- A와 B는 O에 대해 ==우성==, A와 B 사이에는 ==우열이 없다.==
| 표현형 | A형 | B형 | AB형 | O형 |
|+ 유전자형 | AA, AO | BB, BO | AB | OO |

= 예제 2 · 혈액형 확률 | 적용
- A형(AO)인 아버지와 B형(BO)인 어머니 사이의 자녀
| | B | O |
|+ A | AB | AO |
|+ O | BO | OO |
^+ AB형 : A형 : B형 : O형 = **1 : 1 : 1 : 1**
^+ 각각 **25 %** — 네 가지 혈액형이 모두 나올 수 있다!

## 적록 색맹 | X 염색체를 따라가는 유전

= 적록 색맹 (반성 유전)
- 색맹 유전자는 ==X 염색체==에 있고 정상에 대해 ==열성==이다.
- 남자(XY)는 색맹 유전자가 **하나만** 있어도 색맹 → 여자보다 색맹이 **많다.**
- 아들의 X 염색체는 항상 ==어머니==에게서 온다.
>+ X' = 색맹 유전자를 가진 X 염색체, XX' = 보인자(정상이지만 색맹 유전자를 가진 여자)

= 적록 색맹 부모 조합 | 정리
| 부모 | 아들이 색맹일 확률 | 딸이 색맹일 확률 |
|+ 정상 아버지(XY) × 보인자 어머니(XX') | 50 % | 0 % (보인자 50 %) |
|+ 색맹 아버지(X'Y) × 정상 어머니(XX) | 0 % | 0 % (모두 보인자) |
|+ 색맹 아버지(X'Y) × 보인자 어머니(XX') | 50 % | 50 % |

= 예제 3 · 보인자 어머니 | 적용
- 정상 아버지(XY)와 보인자 어머니(XX') 사이의 자녀
| | X | Y |
|+ X | XX | XY |
|+ X' | XX' | X'Y |
^+ 아들: XY(정상) : X'Y(색맹) → 색맹일 확률 **50 %**
^+ 딸: XX(정상) : XX'(보인자) → 색맹 **0 %**, 보인자 **50 %**

= 생활 속 사람의 유전 | 사례
* 🚦 신호등 디자인 :: 색맹인 사람도 구별하도록 위치·모양을 함께 쓴다
* 🩸 수혈 :: 혈액형을 확인하여 맞는 혈액을 수혈한다
* 👯 쌍둥이 연구 :: 일란성 쌍둥이로 유전과 환경의 영향을 비교
* 🧬 유전 상담 :: 가계도로 유전병이 나타날 확률을 알려 준다
* 👑 왕가의 유전병 :: 가계도로 X 염색체 유전병의 전달을 추적
* 🧪 미맹 검사 :: PTC 용액의 쓴맛을 느끼는지로 확인

= 확인 문제 2
Q AB형인 아버지와 O형인 어머니 사이에서 태어날 수 없는 자녀의 혈액형은?
o A형
o B형
o* O형
o 모두 태어날 수 있다
:: AB × OO → AO(A형), BO(B형)만 가능하다. AB형과 O형은 태어날 수 없다.

= 확인 문제 3
Q 적록 색맹에 대한 설명으로 옳은 것은?
o 색맹 유전자는 Y 염색체에 있다
o 여자가 남자보다 색맹이 많다
o* 아들의 색맹 유전자는 어머니에게서 온다
o 색맹 유전자는 정상에 대해 우성이다
:: 아들은 아버지에게서 Y, 어머니에게서 X를 받으므로 색맹 유전자는 어머니에게서 온다.

= 확인 문제 4
Q 색맹인 아버지(X'Y)와 정상인 어머니(XX) 사이에서 태어난 딸에 대한 설명으로 옳은 것은?
o 모두 색맹이다
o* 모두 보인자이다
o 50 %가 색맹이다
o 모두 정상(보인자 아님)이다
:: 딸은 아버지에게서 X'를, 어머니에게서 X를 받아 모두 XX'(보인자)이다.

= 확인 문제 5
Q 미맹이 아닌 부모 사이에서 미맹인 자녀가 태어났다. 이 부모의 다음 자녀가 미맹일 확률은?
o 0 %
o* 25 %
o 50 %
o 75 %
:: 부모는 모두 Tt → tt일 확률 1/4 = 25 %

= 서술형 도전 | 생각 넓히기
? 남자가 여자보다 적록 색맹이 많이 나타나는 까닭을 성염색체와 관련지어 쓰시오. :: 색맹 유전자는 X 염색체에 있는 열성 유전자이다. 남자(XY)는 X 염색체가 하나라 색맹 유전자가 하나만 있어도 색맹이 되지만, 여자(XX)는 두 X 염색체 모두에 색맹 유전자가 있어야 색맹이 되기 때문이다.
? 유전 정보를 분석하는 기술이 발달하면서 생기는 좋은 점과 걱정되는 점을 한 가지씩 쓰시오. :: (예시) 좋은 점: 유전병을 미리 알고 예방·치료할 수 있다. 걱정되는 점: 유전 정보가 유출되어 취업이나 보험에서 차별받을 수 있다.
