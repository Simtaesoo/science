## 감수 분열 과정 | 두 번 연속 나누기

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#meiosis | [자동 진행]으로 감수 분열을 관찰하고, 염색체 수가 줄어드는 단계를 찾자.
% 1분열 후기에서 멈추고 '무엇이 나뉘는가? 상동 염색체? 염색 분체?'를 묻기

= 감수 분열 단계 | 체세포 염색체 4개인 모형
| 단계 | 일어나는 일 | 세포 1개의 염색체 수 |
|+ 감수 1분열 전기 | 상동 염색체끼리 짝 → 2가 염색체 형성 | 4 |
|+ 감수 1분열 후기 | 상동 염색체가 분리되어 양쪽으로 이동 | 4 → 2 |
|+ 감수 2분열 후기 | 염색 분체가 분리 (체세포 분열과 비슷) | 2 → 2 |
|+ 결과 | 생식세포 4개 | 2 (절반) |
>+ 염색체 수는 **감수 1분열**에서 절반으로 줄어든다.

= 2가 염색체
! 2가 염색체: 상동 염색체끼리 짝을 지은 것
- 감수 1분열 전기에 형성된다 (체세포 분열에서는 형성되지 않음).
- 감수 1분열 후기에 상동 염색체가 ==서로 떨어져== 다른 세포로 간다.
>+ 그래서 생식세포에는 상동 염색체 중 **하나씩**만 들어간다.

= 체세포 분열과 감수 분열 | 비교
| 구분 | 체세포 분열 | 감수 분열 |
|+ 분열 횟수 | 1회 | 연속 2회 |
|+ 딸세포 수 | 2개 | 4개 |
|+ 염색체 수 변화 | 변화 없음 | 절반으로 줄어듦 |
|+ 2가 염색체 | 형성 안 함 | 형성함 |
|+ 일어나는 곳 | 몸 전체 (생장점 등) | 정소, 난소 (식물: 꽃밥, 밑씨) |

= 확인 문제 1
Q 감수 분열에서 염색체 수가 절반으로 줄어드는 시기는?
o 간기
o* 감수 1분열
o 감수 2분열
o 수정할 때
:: 감수 1분열 후기에 상동 염색체가 분리되어 염색체 수가 절반이 된다.

## 감수 분열의 의의 | 세대를 넘어 일정하게

= 감수 분열의 의의
+ 감수 분열로 염색체 수가 체세포의 **절반**인 생식세포가 만들어진다.
+ 생식세포가 **수정**하면 자손의 염색체 수는 어버이와 **같아진다.**
!+ 23 (정자) + 23 (난자) = 46 (수정란)
>+ 세대가 거듭되어도 염색체 수가 **일정하게** 유지된다.

= 예제 1 · 생식세포의 염색체 수 | 적용
| 생물 | 체세포 | 생식세포 |
|+ 사람 | 46 | [[23]] |
|+ 벼 | 24 | [[12]] |
|+ 개 | 78 | [[39]] |
|+ 초파리 | 8 | [[4]] |
~ 생식세포 = 체세포 ÷ 2, 수정란 = 생식세포 × 2

= 예제 2 · 감수 분열이 없다면? | 적용
- 생식세포를 체세포 분열로 만든다면 사람의 염색체 수는 어떻게 될까?
^+ 정자 46 + 난자 46 → 자녀 **92**
^+ 그 자녀의 자녀 → **184**
^+ 세대마다 **2배**씩 늘어 종의 특징이 유지되지 않는다.
||
C 감수 분열이 없다면 세대에 따른 염색체 수 | 세대 | 염색체 수 | 염색체 수:1,46 2,92 3,184 4,368

= 예제 3 · 세포 수 비교 | 적용
- 염색체가 6개인 세포 1개가 각각 체세포 분열(1회)과 감수 분열을 했다.
^+ 체세포 분열 → 딸세포 **2개**, 각 **6개**
^+ 감수 분열 → 생식세포 **4개**, 각 **3개**

= 생활 속 감수 분열 | 사례
* 🌸 꽃가루 :: 꽃밥에서 감수 분열로 만들어진다
* 🥚 달걀 노른자 :: 감수 분열로 만들어진 난세포가 양분을 저장한 것
* 👫 형제자매 :: 같은 부모여도 생식세포 조합이 달라 생김새가 다르다
* 🍉 씨 없는 수박 :: 염색체 수가 홀수 배라 감수 분열이 제대로 안 된다
* 🧬 염색체 이상 :: 감수 분열 중 염색체가 잘못 나뉘면 생길 수 있다

= 확인 문제 2
Q 체세포 분열과 감수 분열을 비교한 것으로 옳은 것은?
o 두 분열 모두 딸세포가 4개 생긴다
o 두 분열 모두 2가 염색체가 형성된다
o* 감수 분열은 연속 2회 분열한다
o 체세포 분열은 정소와 난소에서만 일어난다
:: 감수 분열은 연속 2회 분열하여 4개의 생식세포를 만든다.

= 확인 문제 3
Q 체세포의 염색체가 24개인 벼의 꽃가루와 잎 세포의 염색체 수를 바르게 짝지은 것은?
o 꽃가루 24, 잎 세포 12
o* 꽃가루 12, 잎 세포 24
o 꽃가루 12, 잎 세포 12
o 꽃가루 48, 잎 세포 24
:: 꽃가루는 감수 분열로 만들어진 생식세포(12개), 잎 세포는 체세포(24개)이다.

= 확인 문제 4
Q 감수 분열이 일어나는 곳이 아닌 것은?
o 정소
o 난소
o 꽃밥
o* 양파 뿌리 끝
:: 양파 뿌리 끝(생장점)에서는 체세포 분열이 일어난다.

= 서술형 도전 | 생각 넓히기
? 감수 분열이 일어나지 않고 체세포 분열로 생식세포를 만든다면 어떤 문제가 생길지 쓰시오. :: 생식세포의 염색체 수가 체세포와 같아, 수정할 때마다 자손의 염색체 수가 2배씩 늘어나 종의 특징이 유지되지 않는다.
? 같은 부모에게서 태어난 형제자매의 생김새가 서로 다른 까닭을 감수 분열과 관련지어 쓰시오. :: 감수 분열 때 상동 염색체가 무작위로 나뉘어 들어가 생식세포마다 염색체 조합이 다르므로, 수정으로 만들어진 자녀의 유전 정보도 서로 다르다.
