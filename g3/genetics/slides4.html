# 사람의 발생 | 수정란에서 아기까지 | 중학교 과학 3 · 21 생식과 유전 · 4차시 | 2022 개정 교육과정 [9과21]

= 오늘의 학습 목표 | 4차시
^ 사람의 **생식세포**(정자와 난자)의 특징을 비교할 수 있다.
^ **수정**에서 **착상**까지의 과정과 **난할**의 특징을 설명할 수 있다.
^ 발생 과정을 통해 **생명의 소중함**을 이야기할 수 있다.
% 흐름: 생각 열기 5분 → 생식세포 8분 → 수정·난할·착상(시뮬레이션) 15분 → 태반 7분 → 문항 10분

= 우리는 모두 세포 하나에서 시작했다 | 생각 열기
* 🔬 수정란 :: 지름 약 0.1 mm, 겨우 보일까 말까
* 👶 갓난아기 :: 수조 개의 세포로 이루어진 몸
* 🫀 약 4주 :: 심장이 뛰기 시작한다
* 📅 약 266일 :: 수정 후 출산까지
? 세포 하나가 어떻게 근육, 신경, 피부 같은 서로 다른 세포가 될까? :: 수정란이 **체세포 분열**을 거듭해 세포 수를 늘리고, 세포들이 각자 다른 모양과 기능을 갖게 되며 조직과 기관이 만들어진다 — 이 과정이 **발생**이다.

= 지난 시간 복습 | 3차시
- 생식세포를 만드는 분열 → [[감수 분열]]
- 사람의 정자와 난자의 염색체 수 → [[23]]개
- 정자 + 난자 → 수정란의 염색체 수 [[46]]개
? 감수 분열로 만들어진 정자와 난자는 어디서, 어떻게 만날까? :: 여성의 **수란관**에서 만나 수정한다 — 오늘 그 이후의 여정을 따라가 보자.

## 생식세포와 수정 | 정자와 난자

= 정자와 난자 | 비교
| 구분 | 정자 | 난자 |
|+ 만들어지는 곳 | 정소 | 난소 |
|+ 크기 | 매우 작음 | 매우 큼 (양분 저장) |
|+ 운동성 | 꼬리가 있어 스스로 움직임 | 스스로 움직이지 못함 |
|+ 염색체 수 (사람) | 23개 | 23개 |
>+ 난자가 큰 까닭: 발생 초기에 필요한 **양분**을 저장하고 있기 때문

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#develop | [자동 진행]으로 수정부터 착상까지 수정란의 위치와 세포 수 변화를 관찰하자.
% 수란관 → 자궁으로 이동하는 동안 세포 수가 늘어나는 것을 함께 세기

= 발생 과정
^+ **배란** → 수란관에서 **수정**
^+ → **난할**하며 수란관을 따라 이동 → **포배**
^+ → **착상**: 수정 후 약 1주일, 자궁 안쪽 벽에 파묻힘
^+ → **태반** 형성 → **기관** 형성 → **출산** (수정 후 약 266일)

## 난할 | 커지지 않고 나뉘기만

= 난할이란?
! 난할: 수정란의 초기 세포 분열 (체세포 분열)
| 난할 횟수 | 0 | 1 | 2 | 3 | 4 |
|+ 세포 수 | 1 | 2 | 4 | 8 | 16 |
- 세포가 자라지 않고 분열 → 세포 하나의 크기는 ==작아진다.==
>+ 배아 전체의 크기는 수정란과 **비슷하다.**

= 난할의 특징 | 그래프
C 세포 수 | 난할 횟수 | 세포 수 (개) | 세포 수:0,1 1,2 2,4 3,8 4,16
||
C 세포 1개의 크기 (수정란 = 100) | 난할 횟수 | 상대적 크기 | 세포 1개의 크기:0,100 1,50 2,25 3,12.5 4,6.25
+ 세포 수는 [[2배]]씩 늘고, 세포 1개의 크기는 [[절반]]씩 줄어든다.
+ 세포 수 × 세포 1개 크기 = 약 100으로 전체 크기는 [[거의 일정]]

= 예제 1 · 난할 계산 | 적용
- 수정란이 난할을 7번 하면 세포는 몇 개가 될까?
^+ 1회마다 2배 → 2를 7번 곱한다.
^+ 2 × 2 × 2 × 2 × 2 × 2 × 2 = **128개**
^+ 이때 세포 1개의 크기는 수정란의 약 **1/128**

= 예제 2 · 일란성 쌍둥이 | 적용
- 일란성 쌍둥이는 수정란 하나가 난할 초기에 둘로 나뉘어 각각 발생한 것이다.
^+ 난할은 **체세포 분열** → 나뉜 세포의 유전 정보는 **같다**
^+ 그래서 일란성 쌍둥이는 성별과 유전 형질이 **같다**
^+ 이란성 쌍둥이는 서로 다른 두 수정란 → 유전 정보가 **다르다**

## 태반 | 엄마와 아기를 잇는 다리

= 태반의 역할
- 태반에서 모체의 혈액과 태아의 혈액이 ==직접 섞이지 않고== 물질 교환이 일어난다.
| 방향 | 이동하는 물질 |
|+ 모체 → 태아 | 산소, 영양소 |
|+ 태아 → 모체 | 이산화 탄소, 노폐물 |
>+ 임신 중 흡연·음주가 위험한 까닭: 해로운 물질이 **태반을 통해** 태아에게 전달된다.
% 2022 개정 [9과21]은 사람의 발생을 초기 난할 중심으로 다룬다. 태반은 생명 존중의 맥락에서 간단히 소개하고 평가하지 않는다.

= 생활 속 발생 이야기 | 사례
* 🤰 산모 수첩 :: 주수에 따라 태아의 기관이 만들어지는 시기를 확인
* 🚭 임신 중 금연 :: 니코틴 등이 태반을 통해 태아에게 간다
* 👯 일란성 쌍둥이 :: 수정란 하나가 초기에 둘로 나뉘어 각각 발생
* 🔊 초음파 검사 :: 태아의 심장 박동과 발달 상태를 확인
* 💊 약 복용 주의 :: 기관 형성 시기에는 약 성분이 영향을 줄 수 있다
* 🥚 달걀 :: 난할 초기 모습은 개구리·성게 알로 관찰하기도 한다

= 확인 문제 1
Q 정자와 난자를 비교한 것으로 옳지 않은 것은?
o 정자는 정소에서 만들어진다
o 난자는 정자보다 크다
o* 난자는 꼬리가 있어 스스로 움직인다
o 사람의 정자와 난자는 염색체가 23개씩이다
:: 꼬리가 있어 스스로 움직이는 것은 정자이다.

= 확인 문제 2
Q 난할에 대한 설명으로 옳은 것은?
o 감수 분열이다
o 세포 하나의 크기가 점점 커진다
o* 세포 수는 늘지만 세포 하나의 크기는 작아진다
o 배아 전체의 크기가 2배씩 커진다
:: 난할은 세포가 자랄 시간 없이 빠르게 반복되는 체세포 분열이다.

= 확인 문제 3
Q 수정이 일어나는 곳과 착상이 일어나는 곳을 바르게 짝지은 것은?
o 난소 — 수란관
o* 수란관 — 자궁 안쪽 벽
o 자궁 — 난소
o 질 — 자궁
:: 수란관에서 수정한 뒤 난할하며 이동하여 약 1주일 뒤 자궁 안쪽 벽에 착상한다.

= 확인 문제 4
Q 수정란이 난할을 4번 했을 때의 세포 수와 세포 1개의 크기를 바르게 짝지은 것은?
o 8개 — 수정란보다 크다
o* 16개 — 수정란보다 작다
o 16개 — 수정란과 같다
o 32개 — 수정란보다 작다
:: 난할 1회마다 세포 수는 2배가 되고, 세포가 자라지 않으므로 세포 1개의 크기는 작아진다.

= 서술형 도전 | 생각 넓히기
? 수정란이 착상하기 전까지의 이동 경로를 쓰시오. :: 수란관에서 수정 → 난할하며 수란관을 따라 이동 → 자궁에 도착하여 안쪽 벽에 착상
? 하나의 수정란에서 시작한 세포들이 근육, 신경, 피부처럼 서로 다른 세포가 된다. 발생 과정을 배우며 느낀 점을 생명의 소중함과 관련지어 쓰시오. :: (예시) 세포 하나에서 시작해 수많은 분열과 변화를 거쳐 한 사람이 된다는 것이 놀랍고, 그 과정을 거쳐 태어난 나와 다른 사람의 생명이 모두 소중하다고 느꼈다.

= 오늘 배운 내용 정리
- 정자: [[정소]], 작고 운동성 있음 / 난자: [[난소]], 크고 양분 저장
- 수정은 [[수란관]], 착상은 수정 후 약 1주일 [[자궁]] 안쪽 벽
- 수정란의 초기 세포 분열 → [[난할]]: 세포 수 ↑, 세포 1개 크기 ↓
- 착상 뒤 태아는 태반을 통해 모체로부터 산소·영양소를 받으며 자라 출산에 이른다.

= 나가기 전 한 문제 | 형성평가
? 난할이 진행될수록 세포 하나의 크기가 작아지는 까닭을 한 문장으로 쓰시오. :: 세포가 자라는 시간 없이 체세포 분열을 빠르게 반복하므로, 전체 크기는 비슷한 채 세포 수만 늘어나기 때문이다.
