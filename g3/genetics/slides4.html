# 수정란의 발생 | 난할로 시작하는 한 사람 | 중학교 과학 3 · 21 생식과 유전 · 4차시 | 2022 개정 교육과정 [9과21-03]

= 오늘의 학습 목표 | 4차시
^ 사람의 **생식세포**(정자와 난자)의 특징을 비교할 수 있다.
^ **수정**으로 수정란이 만들어지고, **난할**로 세포 수가 늘어나는 특징을 설명할 수 있다.
^ 난할 과정을 **모형**으로 표현하고 생명의 소중함을 이야기할 수 있다.
% 흐름: 생각 열기 5분 → 생식세포·수정 8분 → 난할(시뮬레이션) 15분 → 난할 모형 표현 7분 → 문항 10분
% 2022 개정 [9과21-03] 성취기준 해설: 발생 과정은 수정란의 초기 발생에서 난할만을 간단하게 다룬다. 착상·태반·기관 형성은 다루지 않으며 평가하지 않는다.

= 우리는 모두 세포 하나에서 시작했다 | 생각 열기
* 🔬 수정란 :: 지름 약 0.1 mm, 겨우 보일까 말까
* 👶 갓난아기 :: 수조 개의 세포로 이루어진 몸
* 🫀 약 4주 :: 심장이 뛰기 시작한다
* 📅 약 266일 :: 수정 후 출산까지
? 세포 하나가 어떻게 근육, 신경, 피부 같은 서로 다른 세포가 될까? :: 수정란이 **체세포 분열**을 거듭해 세포 수를 늘리고, 세포들이 각자 다른 모양과 기능을 갖게 되며 조직과 기관이 만들어진다 — 이 과정이 **발생**이다.

= 지난 시간 복습 | 3차시
- 생식세포를 만드는 분열 → [[감수 분열]]
- 사람의 정자와 난자의 염색체 수 → [[23]]개
- 정자 + 난자 → 수정란의 염색체 수 [[46]]개
? 감수 분열로 만들어진 정자와 난자는 어디서, 어떻게 만날까? :: 여성의 **수란관**에서 만나 수정한다 — 오늘 그 이후의 여정을 따라가 보자.

## 생식세포와 수정 | 정자와 난자

= 정자와 난자 | 비교
| 구분 | 정자 | 난자 |
|+ 만들어지는 곳 | 정소 | 난소 |
|+ 크기 | 매우 작음 | 매우 큼 (양분 저장) |
|+ 운동성 | 꼬리가 있어 스스로 움직임 | 스스로 움직이지 못함 |
|+ 염색체 수 (사람) | 23개 | 23개 |
>+ 난자가 큰 까닭: 발생 초기에 필요한 **양분**을 저장하고 있기 때문

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#develop | [자동 진행]으로 수정 뒤 난할이 일어나는 동안 세포 수와 세포 1개의 크기 변화를 관찰하자.
% 난할 1회마다 세포 수가 2배가 되는 것을 함께 세기. 자궁에 도착한 이후의 과정은 평가하지 않는다.

= 수정과 발생
^+ 수란관에서 정자와 난자가 만나 **수정** → **수정란**(염색체 46개)
^+ 수정란은 곧바로 **난할**을 시작해 세포 수를 늘린다.
^+ 세포 수가 늘어난 뒤 세포들이 서로 다른 모양과 기능을 갖게 되어 개체가 만들어진다 → **발생**
~ 중학교에서는 발생의 첫 단계인 **난할**을 중심으로 공부한다.

## 난할 | 커지지 않고 나뉘기만

= 난할이란?
! 난할: 수정란의 초기 세포 분열 (체세포 분열)
| 난할 횟수 | 0 | 1 | 2 | 3 | 4 |
|+ 세포 수 | 1 | 2 | 4 | 8 | 16 |
- 세포가 자라지 않고 분열 → 세포 하나의 크기는 ==작아진다.==
>+ 배아 전체의 크기는 수정란과 **비슷하다.**

= 난할의 특징 | 그래프
C 세포 수 | 난할 횟수 | 세포 수 (개) | 세포 수:0,1 1,2 2,4 3,8 4,16
||
C 세포 1개의 크기 (수정란 = 100) | 난할 횟수 | 상대적 크기 | 세포 1개의 크기:0,100 1,50 2,25 3,12.5 4,6.25
+ 세포 수는 [[2배]]씩 늘고, 세포 1개의 크기는 [[절반]]씩 줄어든다.
+ 세포 수 × 세포 1개 크기 = 약 100으로 전체 크기는 [[거의 일정]]

= 예제 1 · 난할 계산 | 적용
- 수정란이 난할을 7번 하면 세포는 몇 개가 될까?
^+ 1회마다 2배 → 2를 7번 곱한다.
^+ 2 × 2 × 2 × 2 × 2 × 2 × 2 = **128개**
^+ 이때 세포 1개의 크기는 수정란의 약 **1/128**

= 예제 2 · 일란성 쌍둥이 | 적용
- 일란성 쌍둥이는 수정란 하나가 난할 초기에 둘로 나뉘어 각각 발생한 것이다.
^+ 난할은 **체세포 분열** → 나뉜 세포의 유전 정보는 **같다**
^+ 그래서 일란성 쌍둥이는 성별과 유전 형질이 **같다**
^+ 이란성 쌍둥이는 서로 다른 두 수정란 → 유전 정보가 **다르다**

## 난할 모형 | 모형으로 표현하기

= 난할 모형 만들기 | 모둠 활동
^ 같은 크기의 점토 덩어리 1개를 수정란으로 정한다.
^ 덩어리를 똑같이 2개, 4개, 8개로 나누며 각 단계를 사진이나 그림으로 남긴다.
^ 나눌 때마다 덩어리를 **더 보태지 않는다** → 전체 크기는 그대로, 한 조각은 작아진다.
>+ 모형에서 '점토를 보태지 않는 것'이 난할의 어떤 특징을 나타내는지 설명해 보자.
% 점토 대신 종이 원판을 접어 자르거나 디지털 그리기 도구를 써도 된다. 모형의 한계(실제 세포는 공처럼 모여 있음)도 함께 이야기한다.

= 생활 속 발생 이야기 | 사례
* 👯 일란성 쌍둥이 :: 수정란 하나가 난할 초기에 둘로 나뉘어 각각 발생
* 🐸 개구리 알 :: 난할이 진행되며 알 표면이 점점 잘게 나뉘는 모습을 관찰할 수 있다
* 🌊 성게 알 :: 투명해서 난할 과정을 현미경으로 관찰하기 좋다
* 🔬 생명의 시작 :: 우리 몸의 수조 개 세포는 모두 수정란 하나에서 시작했다

= 확인 문제 1
Q 정자와 난자를 비교한 것으로 옳지 않은 것은?
o 정자는 정소에서 만들어진다
o 난자는 정자보다 크다
o* 난자는 꼬리가 있어 스스로 움직인다
o 사람의 정자와 난자는 염색체가 23개씩이다
:: 꼬리가 있어 스스로 움직이는 것은 정자이다.

= 확인 문제 2
Q 난할에 대한 설명으로 옳은 것은?
o 감수 분열이다
o 세포 하나의 크기가 점점 커진다
o* 세포 수는 늘지만 세포 하나의 크기는 작아진다
o 배아 전체의 크기가 2배씩 커진다
:: 난할은 세포가 자랄 시간 없이 빠르게 반복되는 체세포 분열이다.

= 확인 문제 3
Q 점토 1덩어리를 수정란으로 하여 난할 모형을 만들 때, 실제 난할의 특징을 가장 잘 나타낸 방법은?
o 나눌 때마다 점토를 더 보태어 조각 크기를 그대로 유지한다
o* 점토를 보태지 않고 똑같이 2개, 4개, 8개로 나눈다
o 점토 덩어리를 점점 크게 뭉친다
o 조각마다 크기를 다르게 나눈다
:: 난할은 세포가 자라지 않고 분열하므로 전체 크기는 비슷하고 세포 1개의 크기만 작아진다.

= 확인 문제 4
Q 수정란이 난할을 4번 했을 때의 세포 수와 세포 1개의 크기를 바르게 짝지은 것은?
o 8개 — 수정란보다 크다
o* 16개 — 수정란보다 작다
o 16개 — 수정란과 같다
o 32개 — 수정란보다 작다
:: 난할 1회마다 세포 수는 2배가 되고, 세포가 자라지 않으므로 세포 1개의 크기는 작아진다.

= 서술형 도전 | 생각 넓히기
? 난할 모형에서 점토를 더 보태지 않고 나누기만 하는 까닭을 난할의 특징과 관련지어 쓰시오. :: 난할은 세포가 자라는 시간 없이 체세포 분열을 반복하므로, 전체 크기는 거의 변하지 않고 세포 1개의 크기만 작아지기 때문이다.
? 하나의 수정란에서 시작한 세포들이 근육, 신경, 피부처럼 서로 다른 세포가 된다. 발생 과정을 배우며 느낀 점을 생명의 소중함과 관련지어 쓰시오. :: (예시) 세포 하나에서 시작해 수많은 분열과 변화를 거쳐 한 사람이 된다는 것이 놀랍고, 그 과정을 거쳐 태어난 나와 다른 사람의 생명이 모두 소중하다고 느꼈다.

= 오늘 배운 내용 정리
- 정자: [[정소]], 작고 운동성 있음 / 난자: [[난소]], 크고 양분 저장
- 정자와 난자가 [[수란관]]에서 만나 수정 → 수정란
- 수정란의 초기 세포 분열 → [[난할]]: 세포 수 ↑, 세포 1개 크기 ↓
- 수정란 1개 → 난할 → 세포 수가 늘고 서로 다른 세포가 되어 개체로 [[발생]]

= 나가기 전 한 문제 | 형성평가
? 난할이 진행될수록 세포 하나의 크기가 작아지는 까닭을 한 문장으로 쓰시오. :: 세포가 자라는 시간 없이 체세포 분열을 빠르게 반복하므로, 전체 크기는 비슷한 채 세포 수만 늘어나기 때문이다.
