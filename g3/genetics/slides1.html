# 세포 분열은 왜 필요할까 | 크기 대신 수를 늘리는 세포 | 중학교 과학 3 · 21 생식과 유전 · 1차시 | 2022 개정 교육과정 [9과21-01]

= 오늘의 학습 목표 | 1차시
^ 모형 실험으로 **세포 분열의 필요성**을 설명할 수 있다.

= 코끼리 세포는 생쥐 세포보다 클까? | 생각 열기
* 🐘 코끼리 :: 몸무게 수 톤
* 🐭 생쥐 :: 몸무게 수십 그램
* 👶 아기 → 어른 :: 키가 3배 넘게 자란다
* 🌱 새싹 → 나무 :: 몇 cm에서 수십 m로
? 코끼리가 생쥐보다 훨씬 큰 까닭은 세포가 커서일까, 많아서일까? :: 세포 하나의 크기는 비슷하다. 코끼리는 **세포의 수**가 훨씬 많다. 생물이 자라는 것은 세포가 **분열**하여 수가 늘기 때문이다.

| 개념 | 내용 |
| 세포막 | 세포 안팎으로 물질이 드나드는 통로 |
| 핵 | 유전 물질이 있어 생명 활동을 조절 |

? 세포는 필요한 양분과 산소를 어디를 통해 받아들일까? :: **세포막**(세포의 겉면)을 통해서 — 그래서 '겉넓이'가 중요하다!

## 세포 분열의 필요성 | 우무 조각 모형 실험

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#size | 한 변이 1~4 cm인 우무 조각을 색소 용액에 담갔을 때, 표면적/부피와 색소가 스며든 비율을 비교하자.
% 우무 조각 = 세포, 색소 = 세포로 들어오는 물질이라는 대응을 먼저 확인

= 우무 조각의 표면적과 부피 | 실험 기록
| 한 변 (cm) | 표면적 (cm²) | 부피 (cm³) | 표면적/부피 |
|+ 1 | 6 | 1 | 6 |
|+ 2 | 24 | 8 | 3 |
|+ 3 | 54 | 27 | 2 |
|+ 4 | 96 | 64 | 1.5 |
>+ 우무 조각이 클수록 표면적/부피가 **작아지고**, 색소가 중심까지 스며들기 **어렵다.**

= 그래프로 보면
C 한 변의 길이와 표면적/부피 | 한 변 (cm) | 표면적/부피 | 표면적/부피:1,6 2,3 3,2 4,1.5
~ 크기가 커질수록 부피에 비해 '물질이 드나드는 문'이 상대적으로 좁아진다.

= 세포 분열이 필요한 까닭
+ 세포가 커지면 부피에 비해 표면적이 **작아진다.**
+ 세포막을 통한 **물질 교환**이 어려워진다.
+ 그래서 세포는 일정한 크기가 되면 **분열**한다.
>+ 생물이 자라는 것은 세포의 크기가 아니라 **세포의 수**가 늘어나기 때문이다.

= 예제 1 · 표면적/부피 구하기 | 적용
- 한 변이 5 cm인 정육면체 우무 조각의 표면적/부피는?
^+ 표면적 = 5 × 5 × 6 = **150 cm²**
^+ 부피 = 5 × 5 × 5 = **125 cm³**
^+ 표면적/부피 = 150 ÷ 125 = **1.2**
>+ 한 변이 a이면 표면적/부피 = 6 ÷ a — 크기에 반비례!

= 예제 2 · 잘라서 나누면? | 적용
- 한 변이 2 cm인 우무 조각을 한 변 1 cm인 조각 8개로 잘랐다.
^+ 자르기 전 표면적 = **24 cm²**
^+ 자른 후 표면적 = 6 × 8 = **48 cm²** (부피는 8 cm³ 그대로)
^+ 표면적/부피: 3 → **6**으로 2배
>+ 같은 부피라도 여러 개로 나누면 물질 교환에 유리 = 세포 **분열**의 효과

= 확인 문제 1
Q 우무 조각 실험에서 알 수 있는 사실로 옳은 것은?
o 크기가 클수록 표면적/부피가 커진다
o* 크기가 클수록 색소가 중심까지 스며들기 어렵다
o 크기와 색소 침투는 관계가 없다
o 작은 조각일수록 부피에 비해 표면적이 작다
:: 클수록 표면적/부피가 작아져 물질이 중심까지 이동하기 어렵다.

## 염색체 | 유전 정보를 담은 구조물

= 염색체와 유전자
! 염색체: 세포가 분열할 때 핵 속에 나타나는 막대 모양 구조물 (DNA + 단백질)
- **유전자**: DNA에서 유전 정보를 저장하고 있는 특정 부위
- 분열 직전 염색체는 두 가닥의 ==염색 분체==로 이루어진다.
>+ 두 염색 분체의 유전 정보는 **같다** (DNA가 복제되어 만들어졌기 때문).

= 상동 염색체와 사람의 염색체
- **상동 염색체**: 모양과 크기가 같은 한 쌍의 염색체 — 하나는 ==아버지==, 하나는 ==어머니==에게서
! 사람의 체세포 염색체 46개 = 상염색체 44개(22쌍) + 성염색체 2개
| 구분 | 성염색체 |
|+ 남자 | [[XY]] |
|+ 여자 | [[XX]] |

= 생물마다 다른 염색체 수 | 자료
| 생물 | 사람 | 침팬지 | 감자 | 개 | 벼 | 초파리 |
| 체세포 염색체 수 | 46 | 48 | 48 | 78 | 24 | 8 |
+ 침팬지와 감자는 48개로 같지만 [[같은 종이 아니다.]]
+ 개(78)가 사람(46)보다 많다 → 염색체 수와 생물의 복잡한 정도는 [[관계없다.]]

= 생활 속 세포 분열과 염색체 | 사례
* 🩹 상처 회복 :: 주변 세포가 분열하여 상처를 메운다
* 💇 머리카락 :: 두피 세포가 계속 분열하여 자란다
* 🦎 도마뱀 꼬리 :: 세포 분열로 새 꼬리가 재생된다
* 🧬 유전자 검사 :: 염색체 속 DNA를 분석해 질병 위험을 알아본다
* 👨‍👩‍👧 닮은 가족 :: 부모에게서 염색체를 절반씩 물려받는다
* 🍌 씨 없는 바나나 :: 염색체 수가 달라 씨를 제대로 만들지 못한다

= 확인 문제 2
Q 염색체를 구성하는 물질로 옳은 것은?
o 지방과 단백질
o* DNA와 단백질
o 녹말과 DNA
o 물과 무기 염류
:: 염색체는 DNA와 단백질로 이루어져 있다.

= 확인 문제 3
Q 사람의 체세포 염색체에 대한 설명으로 옳지 않은 것은?
o 46개이다
o 상염색체는 22쌍이다
o 여자의 성염색체는 XX이다
o* 상동 염색체는 모두 아버지에게서 물려받는다
:: 상동 염색체는 하나는 아버지, 하나는 어머니에게서 물려받는다.

= 확인 문제 4
Q 한 변이 4 cm인 우무 조각의 표면적/부피는?
o 4
o 6
o 3
o* 1.5
:: 표면적 96 cm² ÷ 부피 64 cm³ = 1.5

= 서술형 도전 | 생각 넓히기
? 코끼리의 몸이 생쥐보다 큰 까닭을 세포와 관련지어 쓰시오. :: 세포 하나의 크기는 비슷하지만 코끼리는 세포 분열로 만들어진 세포의 수가 훨씬 많기 때문이다.
? 남자의 체세포에 있는 X 염색체와 Y 염색체는 각각 누구에게서 물려받은 것인지 쓰시오. :: X 염색체는 어머니, Y 염색체는 아버지에게서 물려받는다. (어머니는 X만 가지고 있으므로)

= 오늘 배운 내용 정리
- 세포가 커지면 부피에 비해 [[표면적]]이 작아져 물질 교환이 어렵다 → 세포 [[분열]]
- 생물이 자라는 것은 세포의 [[수]]가 늘어나기 때문
- 염색체 = [[DNA]] + 단백질, 유전 정보가 있는 부위 → [[유전자]]
- 모양과 크기가 같은 한 쌍 → [[상동 염색체]]
- 사람 체세포: 상염색체 44개 + 성염색체 2개 = [[46]]개

= 나가기 전 한 문제 | 형성평가
? 세포가 일정한 크기 이상 커지지 않고 분열하는 까닭을 '표면적'과 '부피'를 넣어 한 문장으로 쓰시오. :: 세포가 커지면 부피에 비해 표면적이 작아져 세포막을 통한 물질 교환이 어려워지므로, 일정한 크기가 되면 분열한다.
