^ 유전 **용어**(대립 형질, 순종·잡종, 유전자형·표현형)를 구별할 수 있다.

= 사라졌던 형질이 다시 나타난다? | 생각 열기
* 🟢 둥근 완두 × 주름진 완두 :: 자손이 모두 둥글다
* 🔄 그 자손끼리 교배 :: 주름진 완두가 다시 나타난다!
* 👴 할아버지 닮은 손자 :: 부모에게 없던 특징이 손자에게
* 🌿 멘델 :: 약 150년 전 수도원 정원에서 완두 수만 개를 셌다
? 잡종 1대에서 사라졌던 주름진 모양이 잡종 2대에서 다시 나타난 까닭은? :: 사라진 것이 아니라 **숨어 있었다.** 주름진 유전자가 둥근 유전자에 가려져 있다가 다시 짝을 이루었기 때문 — 오늘의 핵심!

= 지난 시간 복습 | 3·4차시
- 생식세포를 만들 때 상동 염색체가 [[분리]]되어 하나씩 들어간다.
- 정자와 난자가 만나 [[수정란]] → 상동 염색체가 다시 쌍을 이룬다.
? 상동 염색체 한 쌍의 같은 위치에 있는 유전자도 한 쌍일까? :: 그렇다. 하나는 아버지, 하나는 어머니에게서 온 **유전자 한 쌍**이 형질을 결정한다.

## 유전 용어 | 기호로 읽는 유전

= 유전 용어 정리
| 용어 | 뜻 |
|+ 형질 / 대립 형질 | 생물의 모양·성질 / 뚜렷하게 구별되는 형질 (둥근–주름진) |
|+ 순종 / 잡종 | 같은 유전자로만 구성 (RR, rr) / 다른 유전자로 구성 (Rr) |
|+ 유전자형 / 표현형 | 유전자 구성을 기호로 (Rr) / 겉으로 드러나는 형질 (둥근 모양) |
>+ 대문자(R) = 우성 유전자, 소문자(r) = 열성 유전자

= 멘델이 완두를 고른 까닭
* 🟢 대립 형질이 뚜렷 :: 둥근–주름진, 노란색–초록색처럼 구별이 쉽다
* ⏱️ 한 세대가 짧다 :: 여러 세대를 빨리 관찰할 수 있다
* 🔢 자손의 수가 많다 :: 통계적으로 비율을 얻기 좋다
* 🌸 수분 조절이 쉽다 :: 자가 수분과 타가 수분을 마음대로

## 한 쌍의 대립 형질 | 우열의 원리와 분리의 법칙

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#mendel | 어버이의 유전자형을 바꾸어 교배하고, 자손의 유전자형과 표현형 비를 확인하자. [자손 100개 얻기]도 해 보자.
% 100개를 여러 번 뽑으면 3 : 1에 '가까워질 뿐' 정확히 75 : 25는 아니라는 점(확률)을 짚기

= 교배 결과 정리 | 시뮬레이션 기록
| 교배 | 자손의 유전자형 비 | 표현형 비 (둥근 : 주름진) |
|+ RR × rr | Rr 모두 | 1 : 0 (모두 둥근) |
|+ Rr × Rr | RR : Rr : rr = 1 : 2 : 1 | [[3 : 1]] |
|+ Rr × rr | Rr : rr = 1 : 1 | [[1 : 1]] |

= 우열의 원리와 분리의 법칙
- **우열의 원리**: 대립 형질이 다른 순종끼리 교배하면 잡종 1대에서 ==우성 형질만== 나타난다.
- **분리의 법칙**: 생식세포가 만들어질 때 쌍을 이루던 유전자가 ==분리==되어 서로 다른 생식세포로 들어간다.
| Rr × Rr | R | r |
|+ R | RR | Rr |
|+ r | Rr | rr |
~ 둥근(RR, Rr, Rr) 3 : 주름진(rr) 1

= 예제 1 · 잡종 2대의 수 | 적용
- 잡종 1대(Rr)를 자가 수분하여 잡종 2대 완두 800개를 얻었다.
^+ 둥근 : 주름진 = 3 : 1
^+ 주름진 완두 = 800 × 1/4 = **200개**
^+ 둥근 완두 중 순종(RR) = 800 × 1/4 = **200개**, 잡종(Rr) = 800 × 2/4 = **400개**

= 예제 2 · 멘델의 실제 자료 | 자료 해석
- 멘델의 잡종 2대: 둥근 완두 5474개, 주름진 완두 1850개
^+ 5474 ÷ 1850 ≈ **2.96**
^+ 둥근 : 주름진 ≈ **3 : 1**
>+ 자손의 수가 많을수록 이론값에 가까워진다 — 완두를 고른 까닭!

= 예제 3 · 검정 교배 | 적용
- 둥근 완두의 유전자형이 RR인지 Rr인지 알아내려면?
^+ 열성 순종인 **주름진 완두(rr)**와 교배한다. (검정 교배)
^+ 자손이 **모두 둥글면** → RR
^+ 둥근 : 주름진 = **1 : 1** → Rr

## 두 쌍의 대립 형질 | 독립의 법칙

= RrYy × RrYy | 두 쌍의 교배
| | RY | Ry | rY | ry |
|+ RY | RRYY | RRYy | RrYY | RrYy |
|+ Ry | RRYy | RRyy | RrYy | Rryy |
|+ rY | RrYY | RrYy | rrYY | rrYy |
|+ ry | RrYy | Rryy | rrYy | rryy |
~ R: 둥근, r: 주름진, Y: 노란색, y: 초록색

= 독립의 법칙
! 둥글고 노란색 : 둥글고 초록색 : 주름지고 노란색 : 주름지고 초록색 = 9 : 3 : 3 : 1
- 모양만 보면 둥근 : 주름진 = ==3 : 1==, 색만 보면 노란색 : 초록색 = ==3 : 1==
>+ **독립의 법칙**: 두 쌍 이상의 대립 형질은 서로 영향을 주지 않고 독립적으로 유전된다.

= 예제 4 · 9 : 3 : 3 : 1 계산 | 적용
- RrYy를 자가 수분하여 완두 1600개를 얻었다.
^+ 둥글고 노란색 = 1600 × 9/16 = **900개**
^+ 둥글고 초록색 = 주름지고 노란색 = 1600 × 3/16 = **300개**씩
^+ 주름지고 초록색 = 1600 × 1/16 = **100개**

= 확인 문제 1
Q 둥근 완두(RR)와 주름진 완두(rr)를 교배한 잡종 1대의 표현형은?
o 모두 주름진다
o* 모두 둥글다
o 둥근 : 주름진 = 3 : 1
o 둥근 : 주름진 = 1 : 1
:: 우열의 원리 — 잡종 1대(Rr)에서는 우성 형질(둥근)만 나타난다.

= 확인 문제 2
Q Rr × rr 교배에서 주름진 완두가 나올 확률은?
o 0 %
o 25 %
o* 50 %
o 75 %
:: Rr : rr = 1 : 1이므로 주름진(rr)은 50 %

= 확인 문제 3
Q RrYy × RrYy에서 주름지고 초록색인 완두의 비율은?
o 9/16
o 3/16
o* 1/16
o 1/4
:: 주름진(1/4) × 초록색(1/4) = 1/16

= 확인 문제 4
Q 잡종 2대에서 둥근 완두 600개가 나왔다면 주름진 완두는 이론상 몇 개인가?
o 100개
o* 200개
o 300개
o 600개
:: 둥근 : 주름진 = 3 : 1 → 600 ÷ 3 = 200개

= 서술형 도전 | 생각 넓히기
? 둥근 완두의 유전자형을 알아내는 방법과 결과 판단 기준을 쓰시오. :: 주름진 완두(rr)와 검정 교배한다. 자손이 모두 둥글면 RR, 둥근 것과 주름진 것이 1 : 1로 나오면 Rr이다.
? 잡종 1대에서 나타나지 않던 주름진 형질이 잡종 2대에서 나타나는 까닭을 '분리의 법칙'을 넣어 쓰시오. :: 잡종 1대(Rr)가 생식세포를 만들 때 R와 r가 분리되어 각각 다른 생식세포로 들어가고, r를 가진 생식세포끼리 수정하면 rr이 되어 주름진 형질이 나타난다.

= 오늘 배운 내용 정리
- 같은 유전자로만 구성 → [[순종]], 서로 다른 유전자 → [[잡종]]
- 순종끼리 교배하면 잡종 1대에 우성만 → [[우열의 원리]]
- 생식세포를 만들 때 유전자 쌍이 나뉨 → [[분리의 법칙]] (잡종 2대 3 : 1)
- 두 형질이 서로 영향 없이 유전 → [[독립의 법칙]] (9 : 3 : 3 : 1)
- 우성 개체의 유전자형 확인 → 열성 순종과 [[검정 교배]]

= 나가기 전 한 문제 | 형성평가
? Rr × Rr 교배로 얻은 자손 400개 중 유전자형이 Rr인 것은 이론상 몇 개이며, 표현형은 무엇인지 쓰시오. :: RR : Rr : rr = 1 : 2 : 1 → 400 × 2/4 = 200개, 표현형은 둥근 모양
