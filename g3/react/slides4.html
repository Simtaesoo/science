## 구리의 연소 | 질량비 찾기

= 시뮬레이션: 일정 성분비 | 실험실

% 결합한 산소 = 산화 구리 − 구리 (질량 보존 법칙 활용)

|+ 1 | 1.25 | 0.25 |

## 일정 성분비 법칙 | 왜 일정할까?

= 일정 성분비 법칙
! 화합물을 이루는 성분 원소 사이에는 일정한 ==질량비==가 성립한다
- 까닭: 원자가 항상 **일정한 개수비**로 결합하고, 원자마다 **질량이 정해져** 있기 때문
+ 혼합물은 섞는 비율이 일정하지 않으므로 이 법칙이 성립하지 **않는다**.
>+ CuO: 구리 원자와 산소 원자가 1 : 1, 질량비 4 : 1 → 구리 원자 1개가 산소 원자의 ==4배== 무겁다

= 여러 화합물의 질량비
| 화합물 | 성분 원소의 질량비 |
|+ 물 (H₂O) | 수소 : 산소 = 1 : 8 |
|+ 이산화 탄소 (CO₂) | 탄소 : 산소 = 3 : 8 |
|+ 암모니아 (NH₃) | 질소 : 수소 = 14 : 3 |
|+ 산화 마그네슘 (MgO) | 마그네슘 : 산소 = 3 : 2 |
|+ 산화 구리(Ⅱ) (CuO) | 구리 : 산소 = 4 : 1 |

= 생활 속 일정 성분비 | 사례
* 💧 물 :: 어디서 얻어도 수소 : 산소 = 1 : 8
* 🔥 연료 공급 :: 완전 연소에 필요한 산소의 양을 계산
* 💊 약 제조 :: 성분의 비율을 정확히 지켜야 같은 약
* 🧱 시멘트·비료 공장 :: 원료를 낭비 없이 넣는 비율 계산
* 🥤 설탕물 :: 혼합물 — 일정 성분비 법칙 X
* 🌫️ 공기 :: 혼합물 — 장소에 따라 성분비가 조금씩 다르다

= 예제 1 · 물의 분해 | 적용
- 물 18 g을 분해하면 수소와 산소가 각각 몇 g 생길까? (수소 : 산소 = 1 : 8)
^+ 전체 비 = 1 + 8 = **9**
^+ 수소 = 18 × 1/9 = **2 g**
^+ 산소 = 18 × 8/9 = **16 g** (확인: 2 + 16 = 18)

= 예제 2 · 마그네슘 연소 | 적용
- 마그네슘 6 g을 완전히 연소시킨다. (마그네슘 : 산소 = 3 : 2)
^+ 6 = 3 × **2** → 산소 = 2 × 2 = **4 g**
^+ 산화 마그네슘 = 6 + 4 = **10 g**
^+ 비로 확인: Mg : O : MgO = 3 : 2 : 5 = 6 : 4 : 10 ✔

= 예제 3 · 남는 물질 찾기 | 적용
- 구리 8 g과 산소 1 g을 반응시켰다. (구리 : 산소 = 4 : 1)
^+ 산소 1 g과 반응하는 구리 = **4 g**
^+ 생성되는 산화 구리(Ⅱ) = 4 + 1 = **5 g**
^+ 남는 물질 = 구리 8 − 4 = **4 g**
>+ 부족한 쪽(산소)이 다 쓰이면 반응이 멈춘다.

= 남는 물질 연습
| 구리 (g) | 산소 (g) | 산화 구리(Ⅱ) (g) | 남는 물질 |
|+ 4 | 1 | [[5]] | [[없음]] |
|+ 8 | 1 | [[5]] | [[구리 4 g]] |
|+ 4 | 2 | [[5]] | [[산소 1 g]] |
|+ 6 | 1.5 | [[7.5]] | [[없음]] |

= 확인 문제 1
Q 일정 성분비 법칙이 성립하는 까닭은?
o 원자의 크기가 모두 같기 때문
o* 원자가 일정한 개수비로 결합하고 원자마다 질량이 정해져 있기 때문
o 반응 후 질량이 늘어나기 때문
o 혼합물이기 때문
:: 개수비와 원자의 질량이 일정하므로 질량비도 일정하다.

= 확인 문제 2
Q 일정 성분비 법칙이 성립하지 **않는** 물질은?
o 물
o 이산화 탄소
o 산화 구리(Ⅱ)
o* 설탕물
:: 설탕물은 혼합물이다.

= 확인 문제 3
Q 구리 12 g을 완전히 연소시킬 때 생기는 산화 구리(Ⅱ)의 질량은? (구리 : 산소 = 4 : 1)
o 3 g
o 12 g
o* 15 g
o 16 g
:: 산소 3 g이 결합 → 12 + 3 = 15 g

= 확인 문제 4
Q 탄소 6 g이 완전히 연소할 때 필요한 산소의 질량은? (탄소 : 산소 = 3 : 8)
o 8 g
o* 16 g
o 22 g
o 3 g
:: 6 = 3 × 2 → 산소 8 × 2 = 16 g (이산화 탄소 22 g 생성)

= 서술형 도전 | 생각 넓히기
? 구리 원자 1개의 질량이 산소 원자 1개의 4배라는 것을 일정 성분비 법칙과 CuO를 이용하여 설명하시오. :: CuO에서 구리 원자와 산소 원자는 1 : 1로 결합한다. 그런데 질량비가 4 : 1이므로 구리 원자 1개의 질량이 산소 원자 1개의 4배이다.
? 설탕물은 일정 성분비 법칙이 성립하지 않는다. 그 까닭을 쓰시오. :: 설탕물은 혼합물이어서 설탕과 물을 섞는 비율을 마음대로 바꿀 수 있기 때문이다.

= 오늘 배운 내용 정리
- 화합물을 이루는 성분 원소 사이에 일정한 질량비 = [[일정 성분비 법칙]]
- 구리 : 산소 : 산화 구리(Ⅱ) = [[4 : 1 : 5]]
- 물: 수소 : 산소 = [[1 : 8]], 산화 마그네슘: 마그네슘 : 산소 = 3 : 2
- 까닭: 원자가 일정한 [[개수비]]로 결합하고 원자의 질량이 정해져 있다.
- [[혼합물]]에서는 성립하지 않는다.
