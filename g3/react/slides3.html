## 질량 보존 법칙 | 원자는 사라지지 않는다

= 질량 보존 법칙
! 화학 반응에서 반응물의 전체 질량 = 생성물의 전체 질량
- 까닭: 원자의 **배열**만 달라지고, 원자의 **종류와 개수**는 변하지 않는다.
+ 물리 변화에서도 성립한다.
>+ 18세기 ==라부아지에==가 밀폐된 용기에서 실험하여 발견했다.

= 생활 속 질량 보존 | 사례
* 🕯️ 양초가 짧아짐 :: 이산화 탄소와 수증기가 날아갔다
* 🔩 녹슨 못 :: 산소와 결합해 더 무거워진다
* 🥤 탄산음료 뚜껑을 열면 :: 이산화 탄소가 빠져 가벼워진다
* 🍞 빵 반죽 :: 발효 중 생긴 기체가 일부 빠져나간다
* 🔥 장작불 :: 재는 가볍지만 날아간 기체까지 합하면 그대로
* 🧪 침전 반응 :: 앙금이 생겨도 전체 질량은 같다

= 예제 1 · 닫힌 용기 | 적용
- 탄산 칼슘 10 g과 묽은 염산 50 g을 닫힌 용기에서 반응시켰다.
^+ 닫힌 용기 → 기체가 빠져나가지 **못한다**
^+ 반응 후 전체 질량 = 10 + 50 = **60 g**
^+ 뚜껑을 열면 이산화 탄소가 빠져나가 → 60 g보다 **작아진다**

= 예제 2 · 나무의 연소 | 적용
- 나무 20 g을 태웠더니 재 1 g이 남았다. 반응한 산소가 30 g이라면?
^+ 반응물 전체 = 나무 20 + 산소 30 = **50 g**
^+ 생성물 전체 = 재 1 + (이산화 탄소 + 수증기)
^+ 이산화 탄소 + 수증기 = 50 − 1 = **49 g**

= 예제 3 · 결합한 산소 | 적용
- 마그네슘 3 g을 공기 중에서 태웠더니 산화 마그네슘 5 g이 생겼다.
^+ 마그네슘 + 산소 = 산화 마그네슘
^+ 3 + 산소 = 5
^+ 결합한 산소 = 5 − 3 = **2 g**

= 확인 문제 1
Q 질량 보존 법칙이 성립하는 까닭은?
o 원자의 배열이 변하지 않기 때문
o* 원자의 종류와 개수가 변하지 않기 때문
o 분자의 종류가 변하지 않기 때문
o 반응 후 기체가 생기지 않기 때문
:: 원자는 재배열될 뿐 새로 생기거나 없어지지 않는다.

= 확인 문제 2
Q 열린 용기에서 탄산 칼슘과 묽은 염산을 반응시키면 질량은?
o 늘어난다.
o* 줄어든다.
o 변하지 않는다.
o 처음에 늘었다가 줄어든다.
:: 생성된 이산화 탄소가 빠져나간다.

= 확인 문제 3
Q 강철솜을 공기 중에서 태우면 질량이 늘어나는 까닭은?
o 철 원자가 새로 생기기 때문
o* 철이 공기 중의 산소와 결합하기 때문
o 열 때문에 무거워지기 때문
o 기체가 빠져나가기 때문
:: 결합한 산소의 질량만큼 늘어난다.

= 확인 문제 4
Q 구리 8 g이 산소와 결합하여 산화 구리(Ⅱ) 10 g이 되었다. 결합한 산소의 질량은?
o 1 g
o* 2 g
o 8 g
o 18 g
:: 10 − 8 = 2 g

= 확인 문제 5
Q 강철솜을 열린 공기 중에서 가열하였다. 가열 후 저울의 눈금 변화와 그 까닭으로 옳은 것은?
o 감소 — 강철솜이 타서 없어졌다
o* 증가 — 공기 중의 산소가 결합하였다
o 변화 없음 — 질량 보존 법칙 때문이다
o 감소 — 이산화 탄소가 날아갔다
:: 철이 산소와 결합하여 산화 철이 되므로, 결합한 산소의 질량만큼 무거워진다. (철 + 산소 전체로 보면 질량은 보존된다)

= 서술형 도전 | 생각 넓히기
? 닫힌 용기 속에서 탄산 칼슘과 염산이 반응할 때 질량이 변하지 않는 까닭을 원자의 관점에서 설명하시오. :: 반응 전후 원자의 배열만 바뀌고 원자의 종류와 개수는 그대로이며, 생성된 이산화 탄소도 용기 밖으로 나가지 못하므로 전체 질량이 같다.
? 라부아지에 이전 사람들이 '물질이 타면 가벼워진다'고 생각한 까닭을 추리하시오. :: 열린 공간에서 나무 등을 태우면 생성된 기체가 날아가 재만 남아 가벼워진 것처럼 보였기 때문이다. 기체도 질량이 있다는 것을 고려하지 못했다.

- 까닭: 원자의 [[종류]]와 [[개수]]가 변하지 않는다.
- 열린 용기에서 기체가 생기면 질량이 [[줄어]] 보인다.
- 열린 곳에서 금속이 연소하면 [[산소]]와 결합해 질량이 늘어난다.
- 닫힌 용기에서는 언제나 질량이 [[같다]].
