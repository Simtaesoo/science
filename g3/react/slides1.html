# 물리 변화와 화학 변화 | 원자는 그대로, 배열은 다르게 | 중학교 과학 3 · 16 화학 반응의 규칙성 · 1차시 | 2022 개정 교육과정 [9과16-01]

= 오늘의 학습 목표 | 1차시
^ **물리 변화**와 **화학 변화**를 구별할 수 있다.
^ 두 변화에서 분자와 원자가 어떻게 달라지는지 **입자 모형**으로 설명할 수 있다.
^ 화학 변화가 일어났다는 **증거**를 찾을 수 있다.
% 흐름: 생각 열기 5분 → 두 변화 10분 → 입자 모형 시뮬레이션 12분 → 증거·분류 10분 → 문항·정리 8분

= 촛불 하나에 두 가지 변화 | 생각 열기
* 🕯️ 촛농 :: 녹아서 흘러내리다 다시 굳는다
* 🔥 심지 근처 :: 초가 타면서 빛과 열을 낸다
* 💨 불을 끄면 :: 초의 길이가 줄어 있다
? 촛농이 녹는 것과 초가 타는 것은 같은 종류의 변화일까? :: 다르다. 녹는 것은 상태만 바뀌는 물리 변화, 타는 것은 이산화 탄소와 물이라는 새 물질이 생기는 화학 변화이다.

| 질문 | 답 |
| 고체 → 액체 | [[융해]] |
| 물의 화학식 | [[H₂O]] |

? 상태가 변할 때 변하지 않는 것은? :: 입자의 종류와 수(질량)

## 물리 변화와 화학 변화 | 성질이 바뀌는가?

= 두 가지 변화
| 구분 | 물리 변화 | 화학 변화 |
|+ 뜻 | 성질은 그대로, 모양이나 상태만 변함 | 성질이 전혀 다른 새로운 물질로 변함 |
|+ 분자 | 배열만 달라지고 분자 자체는 그대로 | 원자의 배열이 달라져 새로운 분자 |
|+ 원자의 종류와 개수 | 변하지 않는다 | 변하지 않는다 |

= 시뮬레이션: 입자 모형으로 비교하기 | 실험실
@ sim.html#change | 네 가지 변화를 차례로 골라 [변화시키기]를 누르고, 분자와 원자의 변화를 기록하자.
% 원자 수를 직접 세게 하기 — '원자는 그대로'를 학생 스스로 확인

= 시뮬레이션 결과
| 변화 | 분자의 종류 | 원자의 배열 | 원자 수 | 종류 |
|+ 얼음이 녹음 | 그대로 | 그대로 | 그대로 | 물리 변화 |
|+ 설탕이 물에 녹음 | 그대로 | 그대로 | 그대로 | 물리 변화 |
|+ 수소의 연소 | 바뀜 (물 생성) | 바뀜 | 그대로 | 화학 변화 |
|+ 과산화 수소 분해 | 바뀜 (물, 산소) | 바뀜 | 그대로 | 화학 변화 |

= 화학 변화의 증거
* 💡 빛이나 열 :: 연소할 때
* 🫧 기체 발생 :: 달걀 껍데기 + 식초 → 거품
* 🌫️ 앙금 생성 :: 석회수 + 이산화 탄소 → 뿌옇게
* 🎨 색·맛·냄새 변화 :: 사과 단면이 갈색으로, 과일이 익음
>+ 이런 증거가 보이면 ==새로운 물질==이 생겼다고 판단할 수 있다.

## 입자 모형으로 보기 | 원자의 재배열

= 수소의 연소를 모형으로
^+ 반응 전: 수소 분자(●●) **2개**, 산소 분자(○○) **1개**
^+ 원자가 떨어졌다가 **새롭게 결합**한다
^+ 반응 후: 물 분자(●○●) **2개**
>+ 수소 원자 4개, 산소 원자 2개 — 반응 전후 원자의 ==종류와 개수==는 같다!

= 생활 속 두 가지 변화 | 사례
* 📄 종이 접기 :: 물리 변화
* 🔩 철이 녹슨다 :: 화학 변화 — 산화 철 생성
* 🧊 드라이아이스가 작아진다 :: 물리 변화 (승화)
* 🥬 김치가 시어진다 :: 화학 변화 — 발효
* 🌸 향수 냄새가 퍼진다 :: 물리 변화 (확산)
* 🍡 마시멜로를 구우면 갈색 :: 화학 변화

= 예제 1 · 분류하기 | 적용
- ㄱ. 종이를 접는다 ㄴ. 철이 녹슨다 ㄷ. 드라이아이스가 작아진다 ㄹ. 김치가 시어진다 ㅁ. 향수 냄새가 퍼진다 ㅂ. 가스레인지 불을 켠다 ㅅ. 유리컵이 깨진다 ㅇ. 마시멜로를 구운다
^+ 새로운 물질이 생기지 않음 → 물리 변화: **ㄱ, ㄷ, ㅁ, ㅅ**
^+ 새로운 물질이 생김 → 화학 변화: **ㄴ, ㄹ, ㅂ, ㅇ**

= 예제 2 · 원자 세기 | 적용
- 과산화 수소 분자 2개(2H₂O₂)가 분해되어 물 분자 2개와 산소 분자 1개가 되었다.
^+ 반응 전: H **4개**, O **4개**
^+ 반응 후: 물 2개 → H 4, O 2 / 산소 1개 → O 2 → H **4개**, O **4개**
^+ 원자의 종류와 개수가 **같다**

= 예제 3 · 증거로 판단 | 적용
- 투명한 석회수에 날숨을 불어 넣었더니 뿌옇게 흐려졌다.
^+ 뿌옇게 → **앙금**(물에 녹지 않는 고체)이 생겼다
^+ 새로운 물질 생성 → **화학 변화**
^+ 날숨 속 **이산화 탄소**와 석회수가 반응했다

= 확인 문제 1
Q 화학 변화의 예는?
o 얼음이 녹는다.
o 설탕이 물에 녹는다.
o* 철이 녹슨다.
o 유리컵이 깨진다.
:: 철이 산소와 결합해 새로운 물질(산화 철)이 된다.

= 확인 문제 2
Q 물리 변화와 화학 변화에서 모두 변하지 않는 것은?
o 분자의 종류
o 원자의 배열
o* 원자의 종류와 개수
o 물질의 성질
:: 원자는 새로 생기거나 없어지지 않는다.

= 확인 문제 3
Q 화학 변화가 일어났다는 증거가 **아닌** 것은?
o 기체가 발생한다.
o 앙금이 생긴다.
o 빛과 열이 난다.
o* 모양이 바뀐다.
:: 모양만 바뀌는 것은 물리 변화이다.

= 확인 문제 4
Q 수소 분자 2개와 산소 분자 1개가 반응할 때 생기는 물 분자는?
o 1개
o* 2개
o 3개
o 4개
:: 수소 원자 4개와 산소 원자 2개로 물 분자 2개가 만들어진다.

= 서술형 도전 | 생각 넓히기
? 양초가 탈 때 촛농이 녹아 흘러내리는 현상과 심지 근처에서 초가 타는 현상은 각각 어떤 변화인지 까닭과 함께 쓰시오. :: 촛농이 녹는 것은 상태만 변하므로 물리 변화이고, 초가 타는 것은 이산화 탄소와 물이라는 새로운 물질이 생기므로 화학 변화이다.
? 설탕을 물에 녹이는 것과 설탕을 가열해 캐러멜을 만드는 것을 입자 모형으로 비교하시오. :: 설탕이 물에 녹을 때는 설탕 분자가 물 분자 사이로 흩어질 뿐 분자 자체는 그대로(물리 변화)이고, 캐러멜을 만들 때는 설탕 분자의 원자 배열이 바뀌어 새로운 물질이 생긴다(화학 변화).

= 오늘 배운 내용 정리
- 성질은 그대로, 모양이나 상태만 변함 = [[물리 변화]]
- 성질이 다른 새로운 물질로 변함 = [[화학 변화]]
- 화학 변화에서는 [[원자의 배열]]이 달라져 새로운 분자가 생긴다.
- 두 변화 모두 원자의 [[종류]]와 [[개수]]는 변하지 않는다.
- 화학 변화의 증거: 빛·열, [[기체]] 발생, 앙금 생성, 색·맛·냄새 변화

= 나가기 전 한 문제 | 형성평가
? 달걀 껍데기에 식초를 떨어뜨렸더니 거품이 생겼다. 어떤 변화인지 쓰고, 입자 모형으로 무엇이 바뀌었는지 쓰시오. :: 화학 변화. 기체(이산화 탄소)라는 새로운 물질이 생겼으며, 원자의 배열이 바뀌어 새로운 분자가 만들어졌다(원자의 종류와 개수는 그대로).
