^ 기체 반응 실험 결과에서 반응하는 기체와 생성되는 기체의 **부피비**를 찾을 수 있다.
^ **기체 반응 법칙**을 입자 모형으로 설명할 수 있다.
^ 부피비가 화학 반응식의 **계수비**와 같음을 이용해 생성되는 기체와 남는 기체의 부피를 구할 수 있다.

= 1 + 1은 언제나 2일까? | 생각 열기
* 🧪 물 50 mL + 에탄올 50 mL :: 섞으면 100 mL보다 조금 적다
* 🎈 수소 2 L + 산소 1 L :: 반응하면 수증기는 몇 L일까?
* ⚖️ 질량은? :: 질량 보존 법칙 — 반응 전후 질량은 같다
? 기체끼리 반응할 때 부피도 보존될까? :: 그렇지 않다. 질량은 보존되지만 부피는 줄어들 수도 있다. 대신 부피 사이에 **간단한 정수비**가 성립한다 — 오늘의 핵심!

? 질량 말고 '부피'로 반응을 보면 어떤 규칙이 있을까? :: 기체끼리의 반응에서는 부피 사이에도 규칙이 있다.

## 수증기 생성 실험 | 부피 사이의 규칙 찾기

= 시뮬레이션: 기체 반응 | 실험실
@ sim.html#gas | [수증기 생성]에서 수소와 산소의 부피를 바꾸어 반응시키고, 생성된 수증기와 남은 기체의 부피를 기록하자.
% 산소 10 mL에 수소를 10 → 20 → 30 mL로 늘려 가며 기록하게 하기

= 실험 결과 | 같은 온도·압력 (100 ℃ 이상)
| 수소 (mL) | 산소 (mL) | 생성된 수증기 (mL) | 남은 기체 |
|+ 10 | 10 | 10 | 산소 5 mL |
|+ 20 | 10 | 20 | 없음 |
|+ 30 | 10 | 20 | 수소 10 mL |
|+ 40 | 20 | 40 | 없음 |
>+ 수소 : 산소 : 수증기 = ==2 : 1 : 2== (반응한 부피끼리)
~ 수증기가 기체 상태로 있도록 100 ℃ 이상에서 비교한다고 가정한다.

= 그래프로 보면
C 반응한 수소의 부피에 비례한다 | 반응한 수소의 부피 (mL) | 부피 (mL) | 생성된 수증기:0,0 10,10 20,20 40,40 | 반응한 산소:0,0 10,5 20,10 40,20
~ 원점을 지나는 직선 — 부피비가 일정하다

## 기체 반응 법칙 | 왜 간단한 정수비일까?

= 기체 반응 법칙
! 같은 온도와 압력에서 기체끼리 반응할 때, 반응하는 기체와 생성되는 기체의 부피 사이에는 간단한 ==정수비==가 성립한다
- 1808년 게이뤼삭이 여러 기체 반응 실험에서 발견했다.
+ 생각의 열쇠: 같은 온도·압력에서 같은 부피 속에는 기체 **분자 수가 같다** (아보가드로의 생각)
>+ 그래서 기체의 부피비 = 분자 수의 비 = 화학 반응식의 ==계수비==

= 입자 모형으로 보기
| | 수소 | 산소 | 수증기 |
| 부피 | 2부피 | 1부피 | 2부피 |
| 분자 모형 | H₂ H₂ | O₂ | H₂O H₂O |
| 반응식 | **2**H₂ | + O₂ | → **2**H₂O |
+ 산소 분자 1개가 나뉘어 물 분자 **2개**에 들어간다 → 산소를 원자 하나(O)로 생각하면 설명이 안 된다
>+ 기체 반응 법칙은 기체가 **분자**로 이루어져 있다는 생각을 뒷받침했다.

= 여러 기체 반응의 부피비
| 반응 | 화학 반응식 | 부피비 | 전체 부피 |
|+ 수소 + 염소 → 염화 수소 | H₂ + Cl₂ → 2HCl | 1 : 1 : 2 | 2 → 2 |
|+ 질소 + 수소 → 암모니아 | N₂ + 3H₂ → 2NH₃ | 1 : 3 : 2 | 4 → 2 |
|+ 수소 + 산소 → 수증기 | 2H₂ + O₂ → 2H₂O | 2 : 1 : 2 | 3 → 2 |
>+ 전체 부피는 줄어들 수 있지만, 원자의 종류와 개수가 그대로이므로 **질량은 보존**된다.

= 확인 문제 1
Q 기체 반응 법칙에 대한 설명으로 옳은 것은?
o 반응 전후 기체의 전체 부피는 항상 같다
o* 같은 온도·압력에서 반응하는 기체와 생성되는 기체의 부피 사이에 간단한 정수비가 성립한다
o 기체의 부피비는 질량비와 항상 같다
o 고체와 액체가 반응할 때에도 부피비가 일정하다
:: 기체끼리의 반응에서 부피비는 계수비와 같다. 전체 부피는 줄어들 수 있고, 부피비와 질량비는 다르다.

## 계산과 적용 | 계수비 = 부피비

= 예제 1 · 암모니아 만들기 | 적용
- 질소 20 mL와 수소 60 mL를 반응시켰다. (N₂ + 3H₂ → 2NH₃)
^+ 부피비 질소 : 수소 : 암모니아 = **1 : 3 : 2**
^+ 질소 20 mL와 반응하는 수소 = 20 × 3 = **60 mL** → 남는 기체 없음
^+ 생성되는 암모니아 = 20 × 2 = **40 mL**
>+ 반응 전 80 mL → 반응 후 40 mL: 부피는 절반, 질량은 그대로!

= 예제 2 · 남는 기체 찾기 | 적용
- 수소 50 mL와 산소 30 mL를 반응시켰다. (2H₂ + O₂ → 2H₂O, 100 ℃ 이상)
^+ 수소 50 mL와 반응하는 산소 = 50 ÷ 2 = **25 mL** → 산소는 30 mL 있으므로 충분
^+ 생성되는 수증기 = **50 mL**
^+ 남는 기체 = 산소 30 − 25 = **5 mL**
% 한쪽 기체를 기준으로 다른 쪽이 충분한지 먼저 따져 보게 한다.

= 예제 3 · 질량비와 부피비는 다르다 | 적용
- 수소와 산소가 반응하여 물이 될 때
^+ 부피비 수소 : 산소 = **2 : 1**
^+ 질량비 수소 : 산소 = **1 : 8** (4차시 일정 성분비)
^+ 산소 분자 1개가 수소 분자 1개보다 훨씬 **무겁기** 때문
>+ 부피비는 분자 수의 비, 질량비는 분자 수 × 분자 하나의 질량의 비!

= 확인 문제 2
Q 수소 30 mL와 염소 20 mL를 반응시켰다. 생성된 염화 수소와 남은 기체는? (H₂ + Cl₂ → 2HCl)
o 염화 수소 50 mL, 남은 기체 없음
o 염화 수소 60 mL, 남은 기체 없음
o* 염화 수소 40 mL, 수소 10 mL 남음
o 염화 수소 20 mL, 염소 10 mL 남음
:: 수소 : 염소 = 1 : 1로 20 mL씩 반응 → 염화 수소 40 mL, 수소 10 mL가 남는다.

= 확인 문제 3
Q 질소 10 mL를 모두 암모니아로 바꾸는 데 필요한 수소와 생성되는 암모니아의 부피는?
o 수소 10 mL, 암모니아 20 mL
o* 수소 30 mL, 암모니아 20 mL
o 수소 30 mL, 암모니아 40 mL
o 수소 20 mL, 암모니아 30 mL
:: 질소 : 수소 : 암모니아 = 1 : 3 : 2

= 서술형 도전 | 생각 넓히기
? 수소 2부피와 산소 1부피가 반응하여 수증기 2부피가 생긴다. 반응 후 부피가 줄었는데도 질량 보존 법칙이 성립하는 까닭을 쓰시오. :: 반응 전후 원자의 종류와 개수가 변하지 않기 때문이다. 원자들이 다시 배열되어 분자 수가 줄어 부피가 줄었을 뿐, 전체 질량은 같다.
? 같은 온도·압력에서 같은 부피 속 기체 분자 수가 같다는 생각을 이용하여, 기체의 부피비가 계수비와 같은 까닭을 설명하시오. :: 같은 부피에 같은 수의 분자가 들어 있으므로, 부피비는 분자 수의 비와 같다. 화학 반응식의 계수비는 분자 수의 비이므로 부피비와 계수비가 같다.

= 오늘 배운 내용 정리
- 같은 온도·압력에서 기체 반응의 부피 사이에 간단한 정수비 → [[기체 반응 법칙]]
- 수소 : 산소 : 수증기 = [[2 : 1 : 2]], 질소 : 수소 : 암모니아 = [[1 : 3 : 2]]
- 기체의 부피비 = 분자 수의 비 = 화학 반응식의 [[계수비]]
- 전체 부피는 줄어들 수 있지만 [[질량]]은 보존된다

= 나가기 전 한 문제 | 형성평가
? 수소 40 mL와 산소 40 mL를 100 ℃ 이상에서 반응시켰다. 생성된 수증기와 남은 기체의 부피를 쓰시오. :: 수소 40 mL와 산소 20 mL가 반응 → 수증기 40 mL 생성, 산소 20 mL가 남는다.
