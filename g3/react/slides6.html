## 온도 변화 관찰 | 주위가 뜨거워지나, 차가워지나

= 시뮬레이션: 에너지 출입 | 실험실
@ sim.html#energy | 네 가지 반응을 하나씩 [반응 시작]하고, 온도 변화와 에너지 출입 방향을 기록하자.
% 수산화 바륨 + 염화 암모늄은 실제로 비커 아래 젖은 나무판이 얼어붙을 정도 — 영상 활용

= 관찰 결과
| 반응 | 주위 온도 | 에너지 출입 | 종류 |
|+ 손난로 (철 + 산소) | 높아짐 | 방출 | 발열 반응 |
|+ 메테인 연소 | 높아짐 | 방출 | 발열 반응 |
|+ 수산화 바륨 + 염화 암모늄 | 낮아짐 | 흡수 | 흡열 반응 |
|+ 탄산수소 나트륨 분해 | 계속 가열해야 반응 | 흡수 | 흡열 반응 |

= 발열 반응과 흡열 반응
| | 발열 반응 | 흡열 반응 |
|+ 에너지 | 주위로 **방출** | 주위에서 **흡수** |
|+ 주위 온도 | **높아진다** | **낮아진다** |
|+ 예 | 연소, 손난로, 산화 칼슘 + 물 | 탄산수소 나트륨 분해, 광합성 |

= 온도 변화 그래프 (예)
C 발열 반응은 오르고 흡열 반응은 내려간다 | 시간 (분) | 온도 (°C) | 손난로 (발열):0,20 1,32 2,42 3,48 4,52 5,54 | 수산화 바륨 + 염화 암모늄 (흡열):0,20 1,8 2,1 3,-3 4,-5 5,-6
~ 반응이 진행되는 동안 주위 온도가 계속 변한다 (수업용 예시값)

## 생활 속 에너지 출입 | 데우고, 식히고, 굽고

= 생활 속 이용
| 예 | 이용하는 반응 | 발열 / 흡열 |
|+ 발열 도시락 | 산화 칼슘과 물의 반응 | 발열 |
|+ 냉찜질 팩 | 질산 암모늄이 물에 녹을 때(용해) 열 흡수 | 흡수 (화학 반응은 아님) |
|+ 빵 굽기 (베이킹파우더) | 탄산수소 나트륨의 열분해 | 흡열 |
|+ 가스레인지 | 연료의 연소 | 발열 |
|+ 식물의 광합성 | 빛에너지를 흡수하여 양분 생성 | 흡열 |

= 더 많은 사례 | 사례
* 🧤 손난로 :: 철 가루가 산소와 반응 (산화) — 발열
* 🔥 캠핑 화로 :: 숯의 연소 — 발열
* 🍞 카스텔라 :: 베이킹파우더가 열을 흡수해 이산화 탄소 → 부풂
* 🌿 광합성 :: 빛에너지 흡수 — 흡열
* 🏃 세포 호흡 :: 포도당 + 산소 → 에너지 방출 — 발열
* 🧊 즉석 냉각 팩 :: 물에 녹을 때 열 흡수 — 용해는 새 물질이 생기지 않는 **물리 변화**

= 예제 1 · 온도 변화로 에너지 출입 판단하기 | 적용
- 두 반응 용기를 물이 든 비커에 넣었다. (가)의 물은 20 °C → 32 °C, (나)의 물은 20 °C → 12 °C가 되었다.
^+ (가) 주위(물)의 온도가 **올라감** → 반응이 에너지를 **방출** → 발열 반응
^+ (나) 주위(물)의 온도가 **내려감** → 반응이 에너지를 **흡수** → 흡열 반응
^+ 온도 변화가 클수록 → 출입한 에너지가 **많다**
% 2022 개정 [9과16]은 에너지 출입을 정성적으로 다룬다. 물의 비열(4.2 J/g·°C)로 열량을 계산하지 않는다.

= 예제 2 · 냉찜질 팩은 화학 반응일까? | 적용
- 냉찜질 팩은 질산 암모늄이 물에 녹으면서 차가워진다.
^+ 녹은 뒤 물을 증발시키면 → 질산 암모늄이 **다시 나온다**
^+ 새로운 물질이 생기지 않음 → 용해는 **물리 변화**
^+ 화학 반응은 아니지만 → 주위에서 열을 **흡수**하는 과정
>+ 화학 반응뿐 아니라 용해·상태 변화에서도 에너지가 출입한다.

= 예제 3 · 손난로의 조건 | 적용
- 손난로는 비닐 포장을 뜯지 않으면 따뜻해지지 않는다.
^+ 손난로의 반응 → 철 + **산소** → 산화 철 + 열
^+ 포장 속 → 산소가 **들어가지 못한다**
^+ 포장을 뜯고 흔들면 → 산소와 잘 닿아 **빨리** 반응 → 따뜻해진다

= 확인 문제 1
Q 발열 반응에 대한 설명으로 옳은 것은?
o 에너지를 흡수한다.
o* 주위의 온도가 높아진다.
o 계속 가열해야 반응이 일어난다.
o 광합성이 대표적인 예이다.
:: 발열 반응은 에너지를 방출해 주위가 따뜻해진다.

= 확인 문제 2
Q 흡열 반응의 예는?
o 메테인 연소
o 손난로
o 산화 칼슘과 물의 반응
o* 탄산수소 나트륨의 열분해
:: 계속 열을 공급해야 반응이 일어난다.

= 확인 문제 3
Q 냉찜질 팩이 차가워지는 까닭은?
o 열을 방출하기 때문
o* 질산 암모늄이 물에 녹으면서(용해) 주위의 열을 흡수하기 때문
o 얼음이 들어 있기 때문
o 산소와 반응하기 때문
:: 용해는 새 물질이 생기지 않아 화학 반응은 아니지만, 이때 주위의 열을 흡수한다.

= 확인 문제 4
Q 식물의 광합성을 에너지 출입으로 분류하면?
o 발열 반응
o* 흡열 반응
o 에너지 출입이 없다
o 물리 변화
:: 빛에너지를 흡수하여 양분에 저장한다.

= 서술형 도전 | 생각 넓히기
? 손난로는 사용하기 전 비닐 포장을 뜯지 않으면 따뜻해지지 않는다. 그 까닭을 쓰시오. :: 철 가루가 공기 중의 산소와 반응해야 열이 나는데, 포장 속에는 산소가 들어가지 못하기 때문이다.
? 베이킹파우더를 넣은 빵 반죽이 오븐에서 부풀어 오르는 까닭을 에너지 출입과 관련지어 쓰시오. :: 탄산수소 나트륨이 오븐의 열을 흡수하여 분해되는 흡열 반응이 일어나고, 이때 생긴 이산화 탄소 기체가 반죽을 부풀린다.

= 설계 미션 · 우리 반 손난로 / 냉찜질 팩 | 적용
| 설계 항목 | 예 (발열 도시락) |
| 제품과 반응 | 산화 칼슘 + 물 → 발열 |
| 재료와 구조 | 아래 칸: 산화 칼슘, 물 주머니 / 위 칸: 음식 |
| 사용 방법 | 끈을 당겨 물 주머니를 터뜨린다 |
| 안전 주의 사항 | 뜨거운 수증기에 데지 않게, 밀폐된 곳에서 사용 금지 |

= 오늘 배운 내용 정리
- 화학 반응이 일어날 때 에너지를 방출 = [[발열 반응]] → 주위 온도 상승
- 화학 반응이 일어날 때 에너지를 흡수 = [[흡열 반응]] → 주위 온도 하강
- 연소, 손난로, 산화 칼슘 + 물 → [[발열]]
- 탄산수소 나트륨 분해, 광합성 → [[흡열]] (냉찜질 팩의 용해도 열을 흡수하지만 화학 반응은 아니다)
- 손난로가 따뜻해지려면 [[산소]]가 필요하다.

= 나가기 전 한 문제 | 형성평가
? 손난로와 냉찜질 팩이 따뜻해지거나 차가워지는 까닭을 에너지의 이동 방향으로 설명하시오. :: 손난로는 철과 산소의 발열 반응으로 반응에서 주위(손)로 에너지가 이동해 따뜻해진다. 냉찜질 팩은 질산 암모늄이 물에 녹을 때(화학 반응이 아닌 용해) 주위(피부)에서 에너지를 흡수해 차가워진다.
