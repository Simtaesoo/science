## 화학 반응식 만들기 | 세 단계

= 화학 반응식 만드는 순서
^+ 반응물과 생성물을 쓰고 화살표로 연결: **수소 + 산소 → 물**
^+ 물질을 **화학식**으로: **H₂ + O₂ → H₂O**
^+ 양쪽 원자의 종류와 개수가 같도록 **계수**를 맞춘다 (1은 생략): **2H₂ + O₂ → 2H₂O**
>+ 계수를 맞출 때 화학식의 ==아래 첨자==는 바꾸면 안 된다 — 다른 물질이 된다!

= 시뮬레이션: 계수 맞추기 | 실험실
@ sim.html#eq | 반응을 하나씩 골라 계수를 조절하고, 원자 수가 양쪽에서 같아지는 순간을 찾자.
% 원자 수 표를 보며 '가장 복잡한 분자부터, 한 번만 나오는 원소부터' 맞추는 요령 안내

= 완성한 화학 반응식
| 반응 | 화학 반응식 |
|+ 수소 + 산소 → 물 | 2H₂ + O₂ → 2H₂O |
|+ 메테인 + 산소 → 이산화 탄소 + 물 | CH₄ + 2O₂ → CO₂ + 2H₂O |
|+ 질소 + 수소 → 암모니아 | N₂ + 3H₂ → 2NH₃ |
|+ 구리 + 산소 → 산화 구리(Ⅱ) | 2Cu + O₂ → 2CuO |

= 원자 수 확인 | CH₄ + 2O₂ → CO₂ + 2H₂O
| | C | H | O |
|+ 반응 전 | 1 | 4 | 2 × 2 = 4 |
|+ 반응 후 | 1 | 2 × 2 = 4 | 2 + 2 = 4 |
>+ 양쪽의 원자 수가 ==모두 같다== → 완성!

## 화학 반응식 읽기 | 계수비 = 분자 수의 비

= 2H₂ + O₂ → 2H₂O 에서 알 수 있는 것
| 알 수 있는 것 | 내용 |
|+ 반응물과 생성물 | 반응물: 수소, 산소 / 생성물: 물 |
|+ 분자 수의 비 (계수비) | 수소 : 산소 : 물 = 2 : 1 : 2 |
|+ 원자의 종류와 개수 | 반응 전후 수소 원자 4개, 산소 원자 2개로 같다 |
>+ 수소 분자 10개가 모두 반응하려면 산소 분자 ==5개==, 물 분자 ==10개== 생성

= 생활 속 화학 반응식 | 사례
* 🔥 가스레인지 :: CH₄ + 2O₂ → CO₂ + 2H₂O
* 🌾 비료 공장 :: N₂ + 3H₂ → 2NH₃ (공기 중 질소로 비료를)
* 🚀 수소 로켓·수소차 :: 2H₂ + O₂ → 2H₂O — 물만 나온다
* 🪙 구리 동전이 거뭇해짐 :: 2Cu + O₂ → 2CuO
* 🩹 과산화 수소 소독약 거품 :: 2H₂O₂ → 2H₂O + O₂
* 🌿 광합성 :: 이산화 탄소 + 물 → 포도당 + 산소

= 예제 1 · 계수 맞추기 | 적용
- ( )H₂O₂ → ( )H₂O + O₂
^+ O를 먼저: 오른쪽 O = 1 + 2 = 3 → 홀수라 맞지 않음 → H₂O₂에 **2**
^+ 왼쪽 H 4, O 4 → 오른쪽 H₂O에 **2** → H 4, O 2 + 2 = 4
!+ 2H₂O₂ → 2H₂O + O₂

= 예제 2 · 마그네슘의 연소 | 적용
- ( )Mg + O₂ → ( )MgO
^+ O: 왼쪽 2개 → MgO에 **2** → 2MgO
^+ Mg: 오른쪽 2개 → Mg에 **2**
!+ 2Mg + O₂ → 2MgO

= 예제 3 · 분자 수 계산 | 적용
- N₂ + 3H₂ → 2NH₃ 에서 수소 분자 12개가 모두 반응하면?
^+ 계수비 N₂ : H₂ : NH₃ = **1 : 3 : 2**
^+ 수소 12개 = 3 × **4** → 질소 분자 1 × 4 = **4개** 필요
^+ 암모니아 2 × 4 = **8개** 생성

= 확인 문제 1
Q 화학 반응식에서 계수를 맞추는 까닭은?
o 분자의 크기를 같게 하려고
o* 반응 전후 원자의 종류와 개수가 같도록 하려고
o 생성물의 성질을 바꾸려고
o 화학식의 아래 첨자를 맞추려고
:: 화학 반응에서 원자는 생기거나 없어지지 않는다.

= 확인 문제 2
Q C + O₂ → ( )CO₂ 에서 빈칸의 계수는?
o* 1 (생략)
o 2
o 3
o 4
:: C 1, O 2 — 이미 맞아 있다.

= 확인 문제 3
Q 2C + O₂ → 2CO 에서 탄소 원자 10개가 모두 반응할 때 필요한 산소 분자의 수는?
o 2개
o* 5개
o 10개
o 20개
:: C : O₂ = 2 : 1 → 10 : 5

= 확인 문제 4
Q H₂ + O₂ → H₂O의 계수를 맞추려고 H₂O를 H₂O₂로 바꾸었다. 무엇이 잘못일까?
o 계수를 바꾸면 안 된다.
o* 아래 첨자를 바꾸면 다른 물질(과산화 수소)이 된다.
o 생성물을 반응물 쪽에 써야 한다.
o 잘못된 것이 없다.
:: 계수만 바꾸어 2H₂ + O₂ → 2H₂O로 맞춰야 한다.

= 서술형 도전 | 생각 넓히기
? 친구가 수소의 연소를 'H₂ + O → H₂O'로 썼다. 원자 수는 맞는데 무엇이 잘못되었는지 설명하시오. :: 산소는 산소 원자 2개로 된 분자(O₂) 상태로 존재하므로 O가 아닌 O₂로 써야 한다. 그러므로 2H₂ + O₂ → 2H₂O로 계수를 맞춰야 한다.
? 메테인 분자 3개가 완전히 연소할 때 필요한 산소 분자와 생기는 이산화 탄소, 물 분자의 수를 구하시오. :: CH₄ + 2O₂ → CO₂ + 2H₂O에서 계수비 1 : 2 : 1 : 2 → 산소 6개, 이산화 탄소 3개, 물 6개
