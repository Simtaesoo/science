# 수권의 분포와 수자원 | 지구의 물은 어디에 있을까 | 중학교 과학 3 · 18 수권과 해수의 순환 · 1차시 | 2022 개정 교육과정 [9과18]

= 오늘의 학습 목표 | 1차시
^ **수권**을 구성하는 물의 종류와 분포를 비율로 나타낼 수 있다.
^ 수자원으로서 **지하수**의 가치를 설명할 수 있다.
^ **수자원 관리**의 필요성을 알고 실천 방법을 제안할 수 있다.
% 흐름: 생각 열기 5분 → 물 100 L 시뮬레이션 10분 → 수자원·지하수 10분 → 계산·문항 15분 → 정리 5분

= 지구는 '물의 행성'인데 왜 물이 부족할까? | 생각 열기
* 🌏 지구 표면 :: 약 70 %가 바다로 덮여 있다
* 🚰 물 부족 :: 세계 곳곳에서 마실 물이 모자란다
* 🏜️ 가뭄 :: 우리나라도 봄철 가뭄으로 제한 급수를 한다
* 🧊 남극 :: 거대한 얼음덩어리도 물이다
? 바닷물을 그냥 마시거나 농사에 쓸 수 없는 까닭은? :: 바닷물은 염류가 녹아 있어 짜다. 생활과 농업에는 염류가 거의 없는 **담수**가 필요하다.
% '지구의 물 전체를 큰 물통 하나로 줄이면 우리가 쓰는 물은 얼마일까?' 예상치를 받아 두기

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 물의 상태 | 고체(얼음) · 액체(물) · 기체(수증기) |
| 물의 순환 | 증발 → 응결(구름) → 강수 → 흐름 → 다시 증발 |
| 지권 · 수권 · 기권 | 지구계를 이루는 구성 요소 |
? 비로 내린 물은 어디로 갈까? :: 일부는 하천을 따라 바다로, 일부는 땅속으로 스며들어 **지하수**가 되고, 일부는 증발한다.

## 수권의 분포 | 지구의 물 100 L

= 수권이란?
! 수권: 지구에 있는 물 전체
- **해수**: 바다에 있는 짠물
- **담수**: 염류가 거의 없는 물 → ==빙하, 지하수, 호수와 하천==
>+ 수권은 지권·기권·생물권과 끊임없이 물질과 에너지를 주고받는다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#water | 지구의 물 전체를 100 L로 줄여 각 물의 양을 기록하고, [담수만 확대]로 담수의 구성을 확인하자.
% 호수와 하천의 물이 10 mL(한 숟가락도 안 됨)라는 점에서 반응이 크다

= 수권의 구성 | 비율
| 구분 | 비율 (%) | 100 L라면 |
|+ 해수 | 97.47 | 약 97.5 L |
|+ 빙하 | 1.76 | 약 1.8 L |
|+ 지하수 | 0.76 | 약 0.8 L |
|+ 호수와 하천 | 0.01 | 약 10 mL |
>+ 담수(2.53 %)는 **빙하 > 지하수 > 호수와 하천** 순으로 많다.

= 예제 1 · 담수만 놓고 보면 | 적용
- 담수 전체 = 1.76 + 0.76 + 0.01 = **2.53 %**
^+ 담수 중 빙하 = 1.76 ÷ 2.53 × 100 ≈ **70 %**
^+ 담수 중 지하수 = 0.76 ÷ 2.53 × 100 ≈ **30 %**
^+ 담수 중 호수와 하천 = 0.01 ÷ 2.53 × 100 ≈ **0.4 %**
>+ 우리가 쉽게 쓰는 호수·하천의 물은 담수 중에서도 아주 일부!

= 예제 2 · 생수병으로 줄여 보기 | 적용
- 지구의 물 전체를 2 L 생수병 하나라고 하자.
^+ 해수 = 2 L × 0.9747 ≈ **1.95 L**
^+ 지하수 = 2000 mL × 0.0076 ≈ **15 mL**
^+ 호수와 하천 = 2000 mL × 0.0001 = **0.2 mL** (물 몇 방울)

= 확인 문제 1
Q 수권에서 담수 중 가장 많은 양을 차지하는 것은?
o 호수와 하천
o 지하수
o* 빙하
o 수증기
:: 담수는 빙하(약 70 %) > 지하수(약 30 %) > 호수와 하천 순으로 많다.

## 수자원 | 우리가 쓰는 물

= 수자원과 이용
! 수자원: 인간이 생활하는 데 이용하는 물
- 주로 ==호수와 하천의 물==과 ==지하수==를 이용한다.
| 용도 | 이용 |
|+ 생활용수 | 마시기, 씻기, 요리 |
|+ 농업용수 | 농작물 재배, 가축 사육 |
|+ 공업용수 | 제품 생산, 냉각 |
|+ 유지용수 | 하천의 기능 유지 |

= 지하수의 가치
+ 빙하 다음으로 많은 담수이다.
+ 땅속에 있어 호수·하천보다 **오염되기 어렵다.**
+ 비교적 쉽게 개발할 수 있고, **가뭄 때에도** 이용할 수 있다.
>+ 하지만 한번 오염되면 정화가 매우 어렵고, 너무 많이 퍼 올리면 **지반 침하**가 일어날 수 있다.

= 물을 확보하고 지키는 방법 | 사례
* 🌊 해수 담수화 :: 바닷물에서 염류를 걸러 담수를 만든다
* 🕳️ 지하수 개발 :: 관정을 파서 지하수를 끌어 올린다
* 🌧️ 빗물 저장 :: 학교·건물 옥상의 빗물을 모아 화단·청소에 사용
* 🏞️ 댐 건설 :: 비가 많이 올 때 물을 모았다가 가뭄 때 사용
* ♻️ 중수도 :: 한 번 쓴 물을 처리해 화장실 등에 다시 사용
* 🚿 절수 기기 :: 절수형 변기·샤워기로 사용량 줄이기

= 예제 3 · 양치 컵의 효과 | 적용
- 1분에 6 L가 나오는 수도를 틀어 놓고 3분 동안 양치를 했다. 양치 컵(200 mL)으로 3컵만 쓰면 얼마나 아낄까? (가정)
^+ 틀어 놓을 때 = 6 × 3 = **18 L**
^+ 컵 사용 = 0.2 × 3 = **0.6 L**
^+ 절약량 = 18 − 0.6 = **17.4 L** (하루 2번이면 약 35 L)

= 확인 문제 2
Q 지하수가 수자원으로서 가치가 높은 까닭으로 옳지 않은 것은?
o 빙하 다음으로 양이 많은 담수이다
o 호수나 하천보다 오염되기 어렵다
o 가뭄 때에도 이용할 수 있다
o* 아무리 많이 퍼 올려도 문제가 없다
:: 지하수를 지나치게 퍼 올리면 지하수가 고갈되거나 지반 침하가 일어날 수 있다.

= 확인 문제 3
Q 지구의 물 전체를 100 L라고 할 때 호수와 하천의 물은 약 얼마인가?
o 1 L
o 100 mL
o* 10 mL
o 1 mL
:: 0.01 %이므로 100 L × 0.0001 = 0.01 L = 10 mL

= 확인 문제 4
Q 새로운 수자원을 확보하는 방법이 아닌 것은?
o 해수 담수화
o 빗물 저장 시설
o 하수 재처리
o* 하천에 폐수 흘려보내기
:: 폐수는 수자원을 오염시켜 쓸 수 있는 물을 줄인다.

= 서술형 도전 | 생각 넓히기
? 지구 표면의 약 70 %가 바다인데도 물이 부족하다고 하는 까닭을 쓰시오. :: 물 대부분이 짠 해수이고, 담수도 대부분 빙하와 지하수로 존재해 바로 쓸 수 있는 물은 매우 적다. 또 인구 증가와 산업 발달로 물 사용량이 늘고, 오염된 물은 쓸 수 없다.
? 우리 학교에서 물을 아끼거나 다시 쓸 수 있는 방법을 하나 제안하고 효과를 예상하시오. :: (예) 옥상 빗물을 모아 화단과 운동장 물 뿌리기에 사용 → 수돗물 사용량이 줄고 빗물이 한꺼번에 하수도로 흘러드는 것도 줄일 수 있다.

= 오늘 배운 내용 정리
- 지구에 있는 물 전체 → [[수권]]
- 해수 약 [[97.5]] %, 담수 약 2.5 %
- 담수: [[빙하]] > [[지하수]] > 호수와 하천
- 인간이 이용하는 물 → [[수자원]] (호수·하천의 물, 지하수)
- 지하수는 오염되기 어렵고 가뭄 때도 쓸 수 있어 가치가 높다.

= 나가기 전 한 문제 | 형성평가
? 수자원을 늘리는 방법과 아끼는 방법을 하나씩 쓰시오. :: 늘리는 방법: 해수 담수화, 빗물 저장, 지하수 개발, 하수 재처리 등 / 아끼는 방법: 양치 컵 사용, 절수형 기기, 빨래 모아서 하기 등
