## 해류 | 바다 속의 강

= 해류란?
! 해류: 일정한 방향으로 지속적으로 흐르는 바닷물의 흐름
- 표층 해류는 주로 오랫동안 일정한 방향으로 부는 ==바람==에 의해 생긴다.
| 구분 | 흐름 | 수온 |
|+ 난류 | 저위도 → 고위도 | 주변보다 따뜻함 |
|+ 한류 | 고위도 → 저위도 | 주변보다 차가움 |
>+ 같은 위도라도 난류가 흐르는 곳은 따뜻하고, 한류가 흐르는 곳은 차갑다.

= 지구를 도는 큰 바람 | 대기 대순환 복습 (17단원)
| 위도 (북반구) | 지표 부근의 바람 | 부는 방향 |
|+ 0° ~ 30° | **무역풍** | 동쪽 → 서쪽 |
|+ 30° ~ 60° | **편서풍** | 서쪽 → 동쪽 |
|+ 60° ~ 90° | 극동풍 | 동쪽 → 서쪽 |
>+ 이 바람들이 일 년 내내 바다 표면을 밀어 큰 해류를 만든다.

## 북태평양의 표층 순환 | 시계 방향으로 도는 바다

= 북태평양의 해류 | 개념 정리
| 해류 | 흐르는 방향 | 까닭 | 성질 |
|+ 북적도 해류 | 동 → 서 | 무역풍 | 따뜻함 |
|+ 쿠로시오 해류 | 남 → 북 (아시아 쪽) | 대륙에 막혀 북쪽으로 | [[난류]] |
|+ 북태평양 해류 | 서 → 동 | 편서풍 | 비교적 따뜻함 |
|+ 캘리포니아 해류 | 북 → 남 (북아메리카 쪽) | 대륙에 막혀 남쪽으로 | [[한류]] |
>+ 네 해류가 이어져 **시계 방향**으로 도는 커다란 고리 → **아열대 순환**

= 순환 따라가기
^+ 적도 부근 무역풍 → **북적도 해류**가 서쪽으로
^+ 아시아 대륙에 막혀 북쪽으로 → 따뜻한 **쿠로시오 해류**
^+ 중위도 편서풍 → **북태평양 해류**가 동쪽으로
^+ 북아메리카 대륙에 막혀 남쪽으로 → 차가운 **캘리포니아 해류** → 다시 북적도 해류
% 칠판에 태평양 윤곽을 그리고 학생이 화살표를 이어 그리게 하면 좋다

= 확인 문제 1
Q 북태평양 해류를 동쪽으로 흐르게 하는 바람은?
o 무역풍
o* 편서풍
o 극동풍
o 계절풍
:: 중위도(30° ~ 60°)에서 서쪽에서 동쪽으로 부는 편서풍이 북태평양 해류를 만든다.

## 해류는 열을 나른다 | 같은 위도, 다른 바다

= 해류의 역할
- 난류는 저위도의 남는 열을 ==고위도로== 운반한다.
- 한류는 고위도의 찬 바닷물을 ==저위도로== 운반한다.
>+ 해류는 대기와 함께 지구의 **열 균형**을 돕는다.

= 예제 1 · 같은 위도, 다른 수온 | 자료 해석
| 지점 (북위 약 35°) | 일본 남쪽 바다 | 미국 캘리포니아 앞바다 |
| 여름 표층 수온 (대략) | 약 27 ℃ | 약 18 ℃ |
^+ 일본 남쪽 → 따뜻한 **쿠로시오 해류**(난류)가 흐른다
^+ 캘리포니아 앞바다 → 차가운 **캘리포니아 해류**(한류)가 흐른다
^+ 같은 위도라도 해류에 따라 수온이 **크게 다르다**
~ 대략적인 값 — 해마다, 위치마다 다르다

= 예제 2 · 바다 쓰레기는 어디로? | 적용
- 일본 동쪽 바다에 떠내려간 플라스틱 병은 해류를 따라 어디로 갈까?
^+ 일본 동쪽 → **북태평양 해류**를 타고 동쪽으로
^+ 북아메리카 앞바다 → **캘리포니아 해류**를 타고 남쪽으로
^+ 순환의 가운데는 흐름이 약해 → 쓰레기가 **모인다** (태평양 쓰레기 섬)

= 생활 속 해류 | 사례
* 🌏 우리나라 바다 :: 쿠로시오 해류에서 갈라진 난류가 남해·동해로 들어와 바다를 데운다
* 🐟 어장 :: 난류와 한류가 만나는 곳은 영양 염류와 플랑크톤이 많아 좋은 어장
* 🗑️ 해양 쓰레기 :: 해류를 따라 이웃 나라 해안까지 이동
* 🌡️ 기후 :: 난류가 지나는 해안은 같은 위도의 다른 곳보다 겨울이 덜 춥다
* 🐢 바다거북 :: 해류를 타고 먼 거리를 이동한다
* 🛢️ 기름 유출 :: 해류를 보고 기름이 퍼질 방향을 예측해 방제

= 확인 문제 2
Q 북태평양 표층 순환에 대한 설명으로 옳지 않은 것은?
o 북적도 해류는 무역풍에 의해 서쪽으로 흐른다
o 쿠로시오 해류는 난류이다
o* 캘리포니아 해류는 저위도에서 고위도로 흐르는 난류이다
o 네 해류가 이어져 시계 방향으로 돈다
:: 캘리포니아 해류는 고위도에서 저위도로 흐르는 한류이다.

= 확인 문제 3
Q 난류에 대한 설명으로 옳은 것은?
o* 저위도에서 고위도로 흐르며 주변보다 따뜻하다
o 고위도에서 저위도로 흐르며 주변보다 따뜻하다
o 저위도에서 고위도로 흐르며 주변보다 차갑다
o 바람과 관계없이 흐른다
:: 난류는 저위도의 따뜻한 물을 고위도로 운반한다.

= 서술형 도전 | 생각 넓히기
? 북태평양의 표층 해류가 시계 방향으로 순환하는 까닭을 대기 대순환의 바람과 관련지어 쓰시오. :: 저위도에서는 무역풍이 바닷물을 서쪽으로, 중위도에서는 편서풍이 동쪽으로 밀고, 서쪽과 동쪽은 대륙에 막혀 각각 북쪽과 남쪽으로 흐르므로 시계 방향으로 순환한다.
? 같은 위도인데 일본 남쪽 바다가 캘리포니아 앞바다보다 따뜻한 까닭을 쓰시오. :: 일본 남쪽에는 저위도의 열을 실어 오는 난류(쿠로시오 해류)가, 캘리포니아 앞바다에는 고위도의 찬물을 실어 오는 한류(캘리포니아 해류)가 흐르기 때문이다.

= 오늘 배운 내용 정리
- 일정한 방향으로 지속적으로 흐르는 바닷물 → [[해류]] (주원인: 바람)
- 저위도 → 고위도 [[난류]], 고위도 → 저위도 [[한류]]
- 무역풍 → [[북적도]] 해류, 편서풍 → [[북태평양]] 해류
- 아시아 쪽 [[쿠로시오]] 해류(난류), 북아메리카 쪽 [[캘리포니아]] 해류(한류)
- 북태평양 표층 해류는 [[시계]] 방향으로 순환한다

= 나가기 전 한 문제 | 형성평가
? 무역풍이 지금보다 약해진다면 북적도 해류는 어떻게 될지 예상하고 그 까닭을 쓰시오. :: 북적도 해류가 약해진다. 북적도 해류는 무역풍이 바닷물을 서쪽으로 밀어서 생기기 때문이다.
