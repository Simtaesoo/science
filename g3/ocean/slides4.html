## 해류 | 바다 속의 강

= 해류란?
! 해류: 일정한 방향으로 지속적으로 흐르는 바닷물의 흐름
- 주로 지속적으로 부는 ==바람==에 의해 생긴다.
| 구분 | 흐름 | 수온 |
|+ 난류 | 저위도 → 고위도 | 주변보다 따뜻함 |
|+ 한류 | 고위도 → 저위도 | 주변보다 차가움 |
>+ 해류는 저위도의 남는 열을 고위도로 운반해 **지구의 열 균형**을 돕는다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#current | 난류와 한류를 하나씩 켜 보며 해류의 이름과 흐르는 방향을 확인하고, 계절에 따라 조경 수역의 위치를 비교하자.
% 지도 위 화살표를 빨강(난류)·파랑(한류)으로 학습지에 따라 그리게 하기

= 우리나라 주변의 해류 | 개념 정리
| 해류 | 종류 | 흐르는 곳 |
|+ 쿠로시오 해류 | 난류 | 우리나라 주변 난류의 근원 (일본 남쪽) |
|+ 쓰시마 난류 | 난류 | 대한 해협을 지나 동해로 |
|+ 동한 난류 | 난류 | 동해안을 따라 북쪽으로 |
|+ 황해 난류 | 난류 | 황해로 북쪽 |
|+ 북한 한류 | 한류 | 동해안을 따라 남쪽으로 |
|+ 리만 한류 | 한류 | 연해주 연안을 따라 남쪽으로 |

= 확인 문제 1
Q 우리나라 동해안을 따라 남쪽으로 흐르는 해류는?
o 동한 난류
o 황해 난류
o* 북한 한류
o 쿠로시오 해류
:: 북한 한류는 고위도에서 저위도로, 동해안을 따라 남쪽으로 흐르는 차가운 해류이다.

## 조경 수역 | 좋은 어장의 비밀

= 조경 수역
! 조경 수역: 난류와 한류가 만나는 곳
- 우리나라: ==동한 난류==와 ==북한 한류==가 동해에서 만난다.
- 영양 염류와 플랑크톤이 풍부 → 난류성·한류성 어종이 모두 모이는 **좋은 어장**
| 난류성 어종 | 한류성 어종 |
|+ 고등어, 오징어, 꽁치 | 명태, 대구, 연어 |

= 조경 수역의 계절 이동
| 계절 | 강해지는 해류 | 조경 수역 위치 |
|+ 여름 | 난류 | [[북쪽]]으로 이동 |
|+ 겨울 | 한류 | [[남쪽]]으로 이동 |
>+ 그래서 오징어잡이 배도 계절에 따라 어장을 옮긴다.

= 예제 1 · 수온으로 해류 판단 | 자료 해석
- 같은 위도 동해의 두 지점 A, B에서 같은 날 표층 수온을 쟀다.
| 지점 | A | B |
| 표층 수온 (℃) | 18 | 6 |
^+ A: 같은 위도의 주변보다 따뜻함 → **난류(동한 난류)** 영향
^+ B: 주변보다 차가움 → **한류(북한 한류)** 영향
^+ A와 B 사이 수온이 급하게 변하는 곳 → **조경 수역**

= 예제 2 · 어떤 물고기가 잡힐까? | 적용
| 어종 | 좋아하는 수온 (℃) | 구분 |
| 명태 | 2~8 | 한류성 |
| 대구 | 3~10 | 한류성 |
| 오징어 | 12~20 | 난류성 |
| 고등어 | 15~22 | 난류성 |
^+ 수온 18 ℃ 해역 → **오징어, 고등어**
^+ 수온 5 ℃ 해역 → **명태, 대구**

= 예제 3 · 겨울철 동해안과 서해안 | 적용
- 같은 위도인 강릉(동해안)과 인천(서해안)의 겨울 기온을 비교하면?
^+ 동해안을 따라 따뜻한 **동한 난류**가 흐른다.
^+ 태백산맥이 차가운 **북서풍**을 막아 준다.
^+ 결과: 같은 위도에서 동해안이 서해안보다 겨울 기온이 조금 **높다.**

= 생활 속 해류 | 사례
* 🦑 오징어 어장 :: 여름에는 북쪽, 겨울에는 남쪽으로 어장이 이동
* 🐟 명태 :: 동해 수온이 올라 우리 바다에서 거의 잡히지 않게 되었다
* 🗑️ 해양 쓰레기 :: 해류를 따라 이웃 나라 해안까지 이동
* 🌡️ 기후 :: 해류가 지나는 해안 지방은 기온의 연교차가 작아진다
* 🐢 바다거북 :: 해류를 타고 먼 거리를 이동한다
* 🛢️ 기름 유출 :: 해류를 보고 기름이 퍼질 방향을 예측해 방제

= 확인 문제 2
Q 조경 수역에 대한 설명으로 옳지 않은 것은?
o 난류와 한류가 만나는 곳이다
o 영양 염류와 플랑크톤이 풍부하다
o* 우리나라는 황해에 조경 수역이 형성된다
o 여름에는 북쪽으로 이동한다
:: 우리나라 조경 수역은 동한 난류와 북한 한류가 만나는 동해에 형성된다.

= 확인 문제 3
Q 겨울에 우리나라 조경 수역이 남쪽으로 이동하는 까닭은?
o 난류가 강해지기 때문
o* 한류가 강해지기 때문
o 바람이 멈추기 때문
o 염분이 낮아지기 때문
:: 겨울에는 한류의 세력이 강해져 난류를 남쪽으로 밀어낸다.

= 확인 문제 4
Q 난류에 대한 설명으로 옳은 것은?
o* 저위도에서 고위도로 흐르며 주변보다 따뜻하다
o 고위도에서 저위도로 흐르며 주변보다 따뜻하다
o 저위도에서 고위도로 흐르며 주변보다 차갑다
o 바람과 관계없이 흐른다
:: 난류는 저위도의 따뜻한 물을 고위도로 운반한다.

= 서술형 도전 | 생각 넓히기
? 조경 수역이 좋은 어장이 되는 까닭을 두 가지 쓰시오. :: 영양 염류와 플랑크톤이 풍부하여 먹이가 많고, 난류성 어종과 한류성 어종이 모두 모이기 때문이다.
? 지구 온난화로 동해 수온이 계속 오르면 우리 바다의 어종은 어떻게 달라질지 예상하시오. :: 난류의 세력이 강해져 조경 수역이 북쪽으로 올라가고, 명태 같은 한류성 어종은 줄고 오징어·고등어 같은 난류성 어종이나 아열대 어종이 늘어날 것이다.
