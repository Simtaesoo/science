# 해류와 우리 바다의 변화 | 따뜻해지는 바다, 달라지는 밥상 | 중학교 과학 3 · 18 수권과 해수의 순환 · 5차시 | 2022 개정 교육과정 [9과18-02] [9과18-03]

= 오늘의 학습 목표 | 5차시
^ 해류가 우리나라 주변 바다의 **수온**에 주는 영향을 자료로 해석할 수 있다.
^ 바다의 **수온 상승**이 생태계와 생활에 주는 영향을 설명할 수 있다.
^ 수권 단원에서 배운 내용을 **종합**하여 문제를 해결할 수 있다.
% 흐름: 생각 열기 5분 → 우리 바다의 해류(시뮬레이션) 10분 → 수온 상승 자료 15분 → 단원 종합 문항 15분
% 2022 개정 [9과18]은 해류를 북태평양 아열대 순환 중심으로 다룬다. 우리나라 주변 해류의 이름(동한 난류·북한 한류 등)은 외우게 하지 않고, 수온 지도를 읽는 적용 활동으로만 쓴다. 조석은 2022 개정에서 빠졌다.

= 동해의 명태는 어디로 갔을까? | 생각 열기
* 🐟 명태 :: 1980년대에는 한 해 수만 톤이 잡혔지만 지금은 거의 잡히지 않는다
* 🦑 오징어 :: 잡히는 곳이 점점 북쪽으로 옮겨 가고 있다
* 🐠 아열대 물고기 :: 제주 바다에서 열대·아열대 어종이 자주 보인다
* 🪸 갯녹음 :: 바닷속 바위가 하얗게 변하고 해조류가 사라진다
? 무엇이 우리 바다의 생물을 바꾸고 있을까? :: 바다의 **수온**이 오르고 있다. 수온은 해류와 기후변화의 영향을 받는다.

= 지난 시간 복습 | 4차시
- 무역풍 → [[북적도]] 해류, 편서풍 → [[북태평양]] 해류
- 아시아 쪽으로 북상하는 따뜻한 해류 → [[쿠로시오]] 해류
? 쿠로시오 해류는 우리나라 바다와 관계가 있을까? :: 있다. 쿠로시오 해류에서 갈라진 따뜻한 물이 남해와 동해로 들어온다.

## 우리 바다와 해류 | 따뜻한 물과 차가운 물

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#korea | 난류와 한류를 하나씩 켜 보고, 계절을 바꾸며 따뜻한 물과 차가운 물이 만나는 곳의 위치를 비교하자.
% 해류의 이름보다 '어느 쪽에서 오는 물인지, 따뜻한지 차가운지'를 말하게 하기

= 우리나라 주변 바다의 해류 | 자료 해석
- 남쪽에서: 쿠로시오 해류에서 갈라진 ==따뜻한 물(난류)==이 남해·동해·황해로 들어온다.
- 북쪽에서: 연해주 쪽에서 ==차가운 물(한류)==이 동해안을 따라 내려온다.
- 동해에서 난류와 한류가 만나는 곳은 영양 염류와 플랑크톤이 많아 **좋은 어장**이 된다.
>+ 여름에는 난류가 강해 만나는 곳이 **북쪽**으로, 겨울에는 한류가 강해 **남쪽**으로 옮겨 간다.

= 예제 1 · 수온으로 해류 판단 | 자료 해석
- 같은 위도 동해의 두 지점 A, B에서 같은 날 표층 수온을 쟀다.
| 지점 | A | B |
| 표층 수온 (℃) | 18 | 6 |
^+ A: 같은 위도의 주변보다 따뜻함 → **난류**의 영향
^+ B: 주변보다 차가움 → **한류**의 영향
^+ A와 B 사이 수온이 급하게 변하는 곳 → 난류와 한류가 **만나는 곳**

= 예제 2 · 어떤 물고기가 잡힐까? | 적용
| 어종 | 좋아하는 수온 (℃) | 구분 |
| 명태 | 2~8 | 한류성 |
| 대구 | 3~10 | 한류성 |
| 오징어 | 12~20 | 난류성 |
| 고등어 | 15~22 | 난류성 |
^+ 수온 18 ℃ 해역 → **오징어, 고등어**
^+ 수온 5 ℃ 해역 → **명태, 대구**

## 따뜻해지는 바다 | 수온 상승의 영향

= 우리 바다의 표층 수온 변화 | 자료 해석
C 우리나라 주변 바다의 연평균 표층 수온 (경향을 나타낸 예시) | 연도 | 수온 (℃) | 표층 수온:1970,16.1 1980,16.3 1990,16.6 2000,16.9 2010,17.2 2020,17.5
~ 국립수산과학원 발표: 1968년부터 2020년대까지 약 1.4 ℃ 상승 — 세계 평균보다 빠르다 (그래프는 경향을 보여 주는 예시값)
>+ 수온이 오르면 차가운 물을 좋아하는 생물은 **북쪽**이나 **깊은 곳**으로 옮겨 간다.

= 수온 상승이 바꾸는 것들 | 사례
* 🐟 어종 변화 :: 명태 같은 한류성 어종 감소, 난류성·아열대 어종 증가
* 🦑 어장 이동 :: 오징어 어장이 북쪽으로 이동
* 🪸 갯녹음 :: 해조류 숲이 사라지고 바위가 하얗게 변함
* 🌀 태풍 :: 따뜻한 바다는 태풍에 더 많은 에너지를 공급할 수 있다
* 🦠 적조·해파리 :: 따뜻한 바다에서 더 자주 나타남
* 🏝️ 해수면 :: 바닷물이 따뜻해지면 부피가 늘어 해수면이 오른다

= 예제 3 · 명태가 사라진 까닭 | 적용
- 명태는 2~8 ℃의 차가운 물을 좋아한다.
^+ 동해의 수온이 **올라감** → 명태가 살기 알맞은 차가운 물이 **줄어듦**
^+ 명태는 더 **북쪽**의 차가운 바다로 이동
^+ 어린 명태까지 많이 잡은 **남획**도 함께 원인으로 꼽힌다
>+ 과학적 원인은 하나가 아닐 수 있다 — 자료를 함께 보고 판단하자.

= 확인 문제 1
Q 같은 위도의 동해에서 주변보다 수온이 높은 해역에 대한 설명으로 옳은 것은?
o* 난류의 영향을 받는다
o 한류의 영향을 받는다
o 명태가 많이 잡힌다
o 염분이 매우 낮다
:: 난류는 저위도의 따뜻한 물을 운반하므로 주변보다 수온이 높다.

= 확인 문제 2
Q 우리나라 바다의 수온이 계속 오를 때 예상되는 변화로 옳지 않은 것은?
o 한류성 어종이 줄어든다
o 난류성 어종이 잡히는 곳이 북쪽으로 넓어진다
o* 명태가 다시 많이 잡히게 된다
o 아열대 어종이 더 자주 나타난다
:: 명태는 한류성 어종이므로 수온이 오르면 더 줄어든다.

= 확인 문제 3 · 단원 종합
Q 수권과 해수에 대한 설명으로 옳지 않은 것은?
o 담수 중 가장 많은 것은 빙하이다
o 수온 약층은 매우 안정하다
o 큰 강물이 흘러드는 곳은 염분이 낮다
o* 북태평양의 표층 해류는 시계 반대 방향으로 순환한다
:: 무역풍과 편서풍에 의해 북태평양 표층 해류는 시계 방향으로 순환한다.

= 확인 문제 4 · 단원 종합
Q 여름 동해 바다에서 혼합층이 겨울보다 얇은 까닭으로 옳은 것은?
o 여름에 바람이 더 강하기 때문
o* 여름에는 바람이 약하고 표층이 강하게 가열되기 때문
o 여름에 염분이 높아지기 때문
o 여름에 심해층이 사라지기 때문
:: 바람이 약하면 섞이는 깊이가 얕고, 표층만 따뜻해져 수온 약층이 뚜렷해진다.

= 서술형 도전 | 생각 넓히기
? 우리 바다의 수온 상승이 우리 식탁에 줄 수 있는 영향을 두 가지 쓰시오. :: (예시) 명태 같은 한류성 생선이 줄어 수입에 의존하게 된다, 난류성·아열대 어종이 더 많이 잡힌다, 양식하는 해산물의 종류가 바뀐다 등
? 바다의 수온 상승을 늦추기 위해 우리가 할 수 있는 일을 과학적 근거와 함께 쓰시오. :: (예시) 에너지를 아껴 온실 기체 배출을 줄인다 — 온실 기체가 늘면 지구의 기온과 바다의 수온이 함께 오르기 때문이다.

= 오늘 배운 내용 정리
- 우리 바다에는 남쪽에서 [[난류]], 북쪽에서 [[한류]]가 흘러든다
- 난류와 한류가 만나는 곳 → 영양 염류·플랑크톤이 많은 [[좋은 어장]]
- 우리 바다의 표층 수온은 [[높아지는]] 추세이다
- 수온 상승 → 한류성 어종 [[감소]], 난류성·아열대 어종 증가

= 나가기 전 한 문제 | 형성평가
? 오징어가 잡히는 곳이 점점 북쪽으로 옮겨 가는 까닭을 수온과 관련지어 쓰시오. :: 바다의 수온이 오르면서 오징어가 좋아하는 수온(약 12~20 ℃)의 바다가 북쪽으로 옮겨 가기 때문이다.
