# 조석 | 바닷물이 들어오고 나가는 리듬 | 중학교 과학 3 · 18 수권과 해수의 순환 · 5차시 | 2022 개정 교육과정 [9과18]

= 오늘의 학습 목표 | 5차시
^ **조석**, 밀물과 썰물, 만조와 간조의 뜻을 구별할 수 있다.
^ 조석 자료에서 **만조·간조 시각**과 **조차**를 구할 수 있다.
^ 조석 현상을 **생활에 이용**하는 예를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 용어 10분 → 해수면 그래프(시뮬레이션) 10분 → 시각 계산 10분 → 이용·문항 10분

= 바닷길이 열렸다 닫혔다? | 생각 열기
* 🚶 진도 바닷길 :: 바다 한가운데로 걸어갈 수 있는 길이 드러난다
* 🦀 갯벌 체험 :: 몇 시간 뒤면 같은 곳이 바다로 덮인다
* ⛵ 항구 :: 물이 빠지면 배가 갯바닥에 얹혀 있다
* 🏝️ 제부도 :: 하루 두 번 섬으로 가는 길이 열린다
? 바닷물은 왜 하루에 두 번씩 들어오고 나갈까? :: 주로 **달의 인력**(과 태양의 인력)이 지구의 바닷물을 끌어당겨 해수면이 주기적으로 높아지고 낮아진다.
% 원인(기조력)은 깊이 다루지 않고 '주로 달과 태양의 인력' 정도로 소개

= 지난 시간 복습 | 4차시
- 저위도 → 고위도: [[난류]] / 고위도 → 저위도: [[한류]]
- 동해의 조경 수역: [[동한 난류]] + [[북한 한류]]
? 해류는 바닷물이 '한 방향으로' 흐르는 것이다. 오늘의 조석은 무엇이 다를까? :: 조석은 해수면이 **주기적으로 오르내리며** 바닷물이 들어왔다 나갔다 하는 현상이다.

## 조석 | 밀물과 썰물

= 조석과 관련된 용어 | 개념 정리
| 용어 | 뜻 |
|+ 조석 | 해수면의 높이가 주기적으로 높아지고 낮아지는 현상 |
|+ 밀물 / 썰물 | 바닷물이 육지 쪽으로 들어옴 / 바다 쪽으로 빠져나감 |
|+ 만조 / 간조 | 해수면이 가장 높을 때 / 가장 낮을 때 |
|+ 조차 | 만조와 간조 때 해수면의 높이 차 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#tide | 시각을 바꾸며 만조와 간조 시각을 찾고, 서해안과 동해안의 조차를 비교하자.
% 만조 → 간조 → 만조 시각을 차례로 받아 적게 하고 간격을 계산하게 하기

= 하루 동안의 해수면 높이 | 서해안 모형
C 서해안 해수면 높이 (모형) | 시각 (시) | 해수면 높이 (m) | 해수면:0,4.2 3,7.5 6,4.2 9.2,0.5 12,3.4 15.4,7.5 18,4.9 21.6,0.5 24,2.7
+ 만조: 3시 무렵, 15시 25분 무렵 / 간조: 9시 10분 무렵, 21시 35분 무렵
+ 조차 = 7.5 − 0.5 = [[7 m]]

= 조석의 주기
! 만조 → 다음 만조: 약 12시간 25분
- 만조와 간조는 하루에 대략 ==두 번씩== 나타난다.
- 만조에서 간조까지는 그 절반인 약 **6시간 12분**
>+ 하루(24시간)보다 조금 길어서 만조 시각이 날마다 약 **50분씩 늦어진다.**

= 예제 1 · 다음 만조와 간조 | 적용
- 오늘 오전 6시에 만조였다.
^+ 간조 = 6시 + 6시간 12분 = **12시 12분** 무렵
^+ 다음 만조 = 6시 + 12시간 25분 = **18시 25분** 무렵
^+ 그다음 간조 = 18시 25분 + 6시간 12분 = **0시 37분** 무렵 (다음 날)

= 예제 2 · 조차 구하기 | 적용
| 지역 | 만조 해수면 (m) | 간조 해수면 (m) |
| 인천 (서해안) | 8.5 | 1.2 |
| 속초 (동해안) | 0.5 | 0.2 |
^+ 인천 조차 = 8.5 − 1.2 = **7.3 m**
^+ 속초 조차 = 0.5 − 0.2 = **0.3 m**
>+ 서해안은 조차가 **크고**, 동해안은 조차가 매우 **작다.**
~ 표의 해수면 값은 계산 연습을 위한 예시 자료

= 서해안에 갯벌이 넓은 까닭
+ 조차가 **크다** → 간조 때 넓은 바닥이 드러난다.
+ 해안의 경사가 **완만하다.**
+ 큰 강이 실어 오는 **고운 퇴적물**이 많다.
>+ 갯벌은 생물의 서식지이자 오염 물질을 정화하는 '바다의 콩팥'

= 확인 문제 1
Q 해수면이 가장 낮아졌을 때를 무엇이라고 하는가?
o 만조
o* 간조
o 밀물
o 조차
:: 해수면이 가장 높을 때는 만조, 가장 낮을 때는 간조이다.

## 조석의 이용 | 시간표를 알면 바다가 보인다

= 조석을 이용하는 생활 | 사례
* 🦪 갯벌 체험 :: 간조 때 드러난 갯벌에서 조개를 캔다
* 🚶 바닷길 체험 :: 진도·제부도 등에서 간조 때 바닷길이 드러난다
* ⚡ 조력 발전 :: 시화호 — 밀물과 썰물의 해수면 높이 차를 이용
* 🎣 낚시·출항 :: 만조·간조 시각을 보고 배를 띄운다
* 🧂 염전 :: 만조 때 바닷물을 저수지에 끌어들인다
* 🚨 안전 :: 갯벌에 들어갈 때 밀물 시각을 꼭 확인한다

= 예제 3 · 갯벌 체험 계획 | 적용
- 오늘 간조가 13시이다. 간조 앞뒤 2시간 동안만 갯벌에 들어갈 수 있다면?
^+ 들어갈 수 있는 시간 = 11시 ~ **15시**
^+ 15시 이후 밀물이 빠르게 들어온다 → **15시 전에** 반드시 나와야 한다.
^+ 다음 만조 ≈ 13시 + 6시간 12분 = **19시 12분** 무렵
% 실제 갯벌 사고는 대부분 밀물 시각을 놓쳐서 일어난다는 점을 강조

= 확인 문제 2
Q 오늘 오전 4시에 만조였다면, 오늘 오후의 만조 시각은 대략 언제인가?
o 10시 12분 무렵
o 16시 무렵
o* 16시 25분 무렵
o 22시 37분 무렵
:: 만조 간격은 약 12시간 25분 → 4시 + 12시간 25분 = 16시 25분

= 확인 문제 3
Q 어느 날 만조 때 해수면이 6.8 m, 간조 때 0.6 m였다. 조차는?
o 7.4 m
o* 6.2 m
o 3.4 m
o 0.6 m
:: 조차 = 만조 해수면 − 간조 해수면 = 6.8 − 0.6 = 6.2 m

= 확인 문제 4
Q 조석을 이용하는 예로 알맞지 않은 것은?
o 조력 발전
o 바닷길 체험
o 갯벌에서 조개 캐기
o* 해수 담수화로 식수 만들기
:: 해수 담수화는 바닷물의 염류를 걸러 내는 기술로, 조석과는 관계가 없다.

= 확인 문제 5 · 단원 종합
Q 수권과 해수에 대한 설명으로 옳지 않은 것은?
o 담수 중 가장 많은 것은 빙하이다
o 수온 약층은 매우 안정하다
o 염분이 달라도 염류 사이의 비율은 일정하다
o* 우리나라 조경 수역은 겨울에 북쪽으로 이동한다
:: 겨울에는 한류가 강해져 조경 수역이 남쪽으로 이동한다.

= 서술형 도전 | 생각 넓히기
? 서해안에 갯벌이 넓게 발달한 까닭을 두 가지 쓰시오. :: 조차가 크다, 해안의 경사가 완만하다, 큰 강이 실어 오는 고운 퇴적물이 많다 중 두 가지
? 조력 발전소를 동해안보다 서해안에 짓는 까닭을 조차와 관련지어 쓰시오. :: 조력 발전은 밀물과 썰물 때 해수면의 높이 차를 이용하는데, 서해안은 조차가 커서 더 많은 전기를 얻을 수 있기 때문이다.

= 오늘 배운 내용 정리
- 해수면이 주기적으로 높아지고 낮아지는 현상 → [[조석]]
- 해수면이 가장 높을 때 [[만조]], 가장 낮을 때 [[간조]]
- 만조와 간조의 해수면 높이 차 → [[조차]] (서해안이 [[크다]])
- 만조에서 다음 만조까지 약 [[12시간 25분]]
- 이용: 갯벌 체험, 바닷길, [[조력 발전]], 출항·낚시
