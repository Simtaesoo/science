# 염분과 염분비 일정 법칙 | 바닷물은 왜 짤까 | 중학교 과학 3 · 18 수권과 해수의 순환 · 3차시 | 2022 개정 교육과정 [9과18]

= 오늘의 학습 목표 | 3차시
^ **염류**와 **염분**의 뜻을 알고 염분을 계산할 수 있다.
^ 장소에 따라 염분이 달라지는 **까닭**을 설명할 수 있다.
^ **염분비 일정 법칙**을 이용하여 염류의 양을 구할 수 있다.
% 흐름: 생각 열기 5분 → 염류·염분 10분 → 장소별 염분(시뮬레이션) 10분 → 염분비 일정 법칙·계산 15분 → 정리 5분

= 바닷물은 왜 짜고, 왜 쓴맛도 날까? | 생각 열기
* 🧂 천일염 :: 바닷물을 햇볕에 증발시켜 소금을 얻는다
* 🍵 간수 :: 소금에서 빠져나오는 쓴 물, 두부를 굳힌다
* 🏊 사해 :: 사람이 저절로 둥둥 뜨는 아주 짠 호수
* 🏞️ 강 하구 :: 강물과 바닷물이 만나는 곳은 덜 짜다
? 바다마다 짠 정도가 같을까? :: 다르다. 증발, 강수, 강물 유입, 빙하 등에 따라 **염분**이 달라진다. 하지만 놀랍게도 '어떤 비율'은 같다 — 오늘의 핵심!

= 지난 시간 복습 | 2차시
| 층 | 수온 | 특징 |
| 혼합층 | 일정 | 바람이 섞음 |
| 수온 약층 | 급감 | 매우 안정 |
| 심해층 | 낮고 일정 | 계절 변화 없음 |
? 해수의 층은 수온으로 나누었다. 오늘은 해수의 또 다른 성질을 알아보자. :: 해수에 녹아 있는 물질 — **염류**와 **염분**

## 염류와 염분 | 해수에 녹아 있는 것

= 염류와 염분
- **염류**: 해수에 녹아 있는 여러 가지 물질
! 염분: 해수 1 kg에 녹아 있는 염류의 총량을 g 수로 나타낸 것 (단위 psu)
- 전 세계 해수의 평균 염분: 약 ==35 psu==
>+ 염분 35 psu → 해수 1 kg 속에 염류 **35 g**

= 염류의 구성 | 염분 35 psu 해수 1 kg
| 염류 | 구성비 (%) | 맛 |
|+ 염화 나트륨 | 77.7 | 짠맛 |
|+ 염화 마그네슘 | 10.9 | 쓴맛 |
|+ 황산 마그네슘 | 4.7 | |
|+ 황산 칼슘 | 3.6 | |
|+ 황산 칼륨 | 2.5 | |
|+ 기타 | 0.6 | |

= 예제 1 · 염분 구하기 | 적용
- 해수 2 kg에 염류가 64 g 녹아 있다. 이 해수의 염분은?
^+ 해수 1 kg 속 염류 = 64 ÷ 2 = 32 g
^+ 염분 = **32 psu**
>+ 해수의 양이 1 kg이 아니면 **1 kg당**으로 바꾸어야 한다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#salt | 장소를 바꾸며 염분과 염류의 구성비를 기록하자. 염분이 달라도 바뀌지 않는 값은 무엇일까?
% 염분 숫자는 바뀌는데 원그래프 비율은 그대로라는 점에 주목하게 하기

## 염분이 달라지는 까닭 | 물이 늘거나 줄거나

= 장소에 따른 염분 | 시뮬레이션 기록
| 장소 | 염분 (psu) | 까닭 | 염화 나트륨 구성비 |
|+ 중위도 해역 | 37 | 증발량 > 강수량 | 77.7 % |
|+ 적도 해역 | 34.5 | 강수량이 많음 | 77.7 % |
|+ 큰 강 하구 | 30 | 강물(담수) 유입 | 77.7 % |
|+ 빙하가 녹는 곳 | 33 | 녹은 담수가 섞임 | 77.7 % |

= 염분을 바꾸는 요인 | 개념 정리
| 염분이 높아지는 경우 | 염분이 낮아지는 경우 |
|+ 증발량 > 강수량 | 강수량 > 증발량 |
|+ 해수가 얼 때 | 강물이 흘러들 때 |
| | 빙하가 녹을 때 |
>+ 염류의 양이 아니라 **물의 양**이 변해서 염분이 달라진다.
- 황해는 큰 강물이 많이 흘러들어 동해보다 염분이 ==낮다.==
- 우리나라는 강수량이 많은 ==여름철==에 염분이 낮다.

= 확인 문제 1
Q 해수 3 kg에 염류가 99 g 녹아 있다. 이 해수의 염분은?
o 99 psu
o* 33 psu
o 35 psu
o 297 psu
:: 99 g ÷ 3 kg = 33 g/kg → 33 psu

## 염분비 일정 법칙 | 비율은 어디서나 같다

= 염분비 일정 법칙
! 염분은 장소마다 달라도, 염류 사이의 비율은 항상 일정하다.
- 염화 나트륨은 어느 바다에서나 전체 염류의 약 ==77.7 %==
- 까닭: 해수가 오랜 시간 동안 **해류 등에 의해 골고루 섞였기** 때문
>+ 물이 늘거나 줄어도 녹아 있는 염류 '전체'가 함께 묽어지거나 진해질 뿐이다.

= 예제 2 · 구성비로 구하기 | 적용
- 염분 35 psu인 해수 1 kg에 녹아 있는 염화 마그네슘의 양은? (구성비 10.9 %)
^+ 염류 총량 = **35 g**
^+ 염화 마그네슘 = 35 × 0.109 ≈ **3.8 g**

= 예제 3 · 염분비 일정 법칙 활용 | 적용
- 염분 30 psu 해수 1 kg 속 염화 나트륨이 23.3 g이었다. 염분 35 psu 해수 1 kg 속 염화 나트륨은?
^+ 염류 사이의 비율이 일정 → 염화 나트륨도 염분에 비례
^+ 23.3 × 35 ÷ 30 ≈ **27.2 g**
^+ 검산: 35 × 0.777 ≈ 27.2 g ✔
>+ 염분이 몇 배가 되면 각 염류의 양도 같은 배수로 변한다.

= 생활 속 염분 | 사례
* 🧂 염전 :: 증발이 잘 되는 맑고 바람 부는 날 소금이 잘 만들어진다
* 🏊 사해 :: 사막 기후로 증발이 많고 바다로 빠져나가지 못해 매우 짜다
* 🧊 해빙 :: 바닷물이 얼면 얼음에서 염류가 빠져 주변 바다가 더 짜진다
* 🏞️ 한강 하구 :: 강물이 섞여 바닷물보다 덜 짜다
* 🍵 두부 :: 염화 마그네슘이 든 간수로 두유를 굳힌다

= 확인 문제 2
Q 다음 중 해수의 염분을 높이는 요인은?
o 강수량이 증발량보다 많을 때
o 큰 강물이 흘러들 때
o 빙하가 녹을 때
o* 증발량이 강수량보다 많을 때
:: 증발로 물만 빠져나가면 염류의 양은 그대로이므로 염분이 높아진다.

= 확인 문제 3
Q 염분비 일정 법칙이 성립하는 까닭은?
o 바다마다 염분이 같아서
o 염류가 증발하기 때문에
o* 해수가 오랜 시간 해류 등에 의해 골고루 섞였기 때문에
o 강물에 염류가 전혀 없어서
:: 오랜 세월 해수가 섞이며 염류의 구성비가 어디서나 같아졌다.

= 확인 문제 4
Q 염분 40 psu인 해수 1 kg 속 염화 나트륨의 양은 약 얼마인가? (구성비 77.7 %)
o 27.2 g
o* 31.1 g
o 40.0 g
o 77.7 g
:: 40 × 0.777 = 31.08 ≈ 31.1 g

= 서술형 도전 | 생각 넓히기
? 우리나라 황해의 염분이 동해보다 낮은 까닭을 쓰시오. :: 황해에는 큰 강물(담수)이 많이 흘러들어 해수가 묽어지기 때문이다.
? 사해의 염분이 매우 높은 까닭을 지역의 기후와 관련지어 추리하시오. :: 건조한 사막 기후여서 강수량이 적고 증발량이 매우 많으며, 물이 빠져나갈 바다와 연결되지 않아 염류가 계속 쌓이기 때문이다.

= 오늘 배운 내용 정리
- 해수에 녹아 있는 물질 → [[염류]] (가장 많은 것: [[염화 나트륨]])
- 해수 1 kg 속 염류의 총량(g) → [[염분]], 평균 약 [[35]] psu
- 증발 > 강수, 해수 결빙 → 염분 [[높아짐]] / 강수, 강물, 빙하 → [[낮아짐]]
- 염분이 달라도 염류 사이의 비율은 일정 → [[염분비 일정 법칙]]

= 나가기 전 한 문제 | 형성평가
? 염분이 30 psu인 바다와 36 psu인 바다에서 염화 나트륨이 전체 염류에서 차지하는 비율을 비교하고, 그 까닭을 쓰시오. :: 두 바다 모두 약 77.7 %로 같다. 염분은 달라도 해수가 골고루 섞여 염류 사이의 비율은 일정하기 때문이다(염분비 일정 법칙).
