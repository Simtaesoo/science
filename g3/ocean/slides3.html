# 해수의 염분 | 바닷물은 왜 짤까 | 중학교 과학 3 · 18 수권과 해수의 순환 · 3차시 | 2022 개정 교육과정 [9과18]

= 오늘의 학습 목표 | 3차시
^ **염류**와 **염분**의 뜻을 알고 염분을 계산할 수 있다.
^ 장소에 따라 염분이 달라지는 **까닭**을 설명할 수 있다.
^ 우리나라 주변 바다의 **염분 분포**를 자료로 해석할 수 있다.
% 흐름: 생각 열기 5분 → 염류·염분 10분 → 장소별 염분(시뮬레이션) 10분 → 우리나라 바다의 염분 15분 → 정리 5분
% 2022 개정 [9과18]에서 염분비 일정 법칙은 빠졌다. 염류의 구성비 계산은 하지 않는다.

= 바닷물은 왜 짜고, 왜 쓴맛도 날까? | 생각 열기
* 🧂 천일염 :: 바닷물을 햇볕에 증발시켜 소금을 얻는다
* 🍵 간수 :: 소금에서 빠져나오는 쓴 물, 두부를 굳힌다
* 🏊 사해 :: 사람이 저절로 둥둥 뜨는 아주 짠 호수
* 🏞️ 강 하구 :: 강물과 바닷물이 만나는 곳은 덜 짜다
? 바다마다 짠 정도가 같을까? :: 다르다. 증발, 강수, 강물 유입, 빙하 등에 따라 **염분**이 달라진다. 왜 그런지 알아보자 — 오늘의 핵심!

= 지난 시간 복습 | 2차시
| 층 | 수온 | 특징 |
| 혼합층 | 일정 | 바람이 섞음 |
| 수온 약층 | 급감 | 매우 안정 |
| 심해층 | 낮고 일정 | 계절 변화 없음 |
? 해수의 층은 수온으로 나누었다. 오늘은 해수의 또 다른 성질을 알아보자. :: 해수에 녹아 있는 물질 — **염류**와 **염분**

## 염류와 염분 | 해수에 녹아 있는 것

= 염류와 염분
- **염류**: 해수에 녹아 있는 여러 가지 물질
! 염분: 해수 1 kg에 녹아 있는 염류의 총량을 g 수로 나타낸 것 (단위 psu)
- 전 세계 해수의 평균 염분: 약 ==35 psu==
>+ 염분 35 psu → 해수 1 kg 속에 염류 **35 g**

= 해수에 녹아 있는 염류
* 🧂 염화 나트륨 :: 가장 많다 — 바닷물의 **짠맛**
* 🍵 염화 마그네슘 :: 두 번째로 많다 — **쓴맛**, 간수의 성분
* 🪨 그 밖의 염류 :: 황산 마그네슘, 황산 칼슘, 황산 칼륨 등

= 예제 1 · 염분 구하기 | 적용
- 해수 2 kg에 염류가 64 g 녹아 있다. 이 해수의 염분은?
^+ 해수 1 kg 속 염류 = 64 ÷ 2 = 32 g
^+ 염분 = **32 psu**
>+ 해수의 양이 1 kg이 아니면 **1 kg당**으로 바꾸어야 한다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#salt | 장소를 바꾸며 염분을 기록하자. 염분이 높은 곳과 낮은 곳의 공통점은 무엇일까?
% 증발·강수·강물·빙하 중 무엇이 작용하는지 말하게 하기

## 염분이 달라지는 까닭 | 물이 늘거나 줄거나

= 장소에 따른 염분 | 시뮬레이션 기록
| 장소 | 염분 (psu) | 까닭 |
|+ 중위도 해역 | 37 | 증발량 > 강수량 |
|+ 적도 해역 | 34.5 | 강수량이 많음 |
|+ 큰 강 하구 | 30 | 강물(담수) 유입 |
|+ 빙하가 녹는 곳 | 33 | 녹은 담수가 섞임 |

= 염분을 바꾸는 요인 | 개념 정리
| 염분이 높아지는 경우 | 염분이 낮아지는 경우 |
|+ 증발량 > 강수량 | 강수량 > 증발량 |
|+ 해수가 얼 때 | 강물이 흘러들 때 |
| | 빙하가 녹을 때 |
>+ 염류의 양이 아니라 **물의 양**이 변해서 염분이 달라진다.
- 황해는 큰 강물이 많이 흘러들어 동해보다 염분이 ==낮다.==
- 우리나라는 강수량이 많은 ==여름철==에 염분이 낮다.

= 확인 문제 1
Q 해수 3 kg에 염류가 99 g 녹아 있다. 이 해수의 염분은?
o 99 psu
o* 33 psu
o 35 psu
o 297 psu
:: 99 g ÷ 3 kg = 33 g/kg → 33 psu

## 우리나라 바다의 염분 | 장소와 계절에 따라

= 우리나라 주변 바다의 표층 염분 | 자료 해석
| 바다 | 표층 염분 | 까닭 |
|+ 동해 | 비교적 높다 (약 34 psu) | 흘러드는 큰 강이 적다 |
|+ 남해 | 중간 | 난류의 영향, 섬진강·낙동강 유입 |
|+ 황해 | 낮다 (약 31~33 psu) | 큰 강물(담수)이 많이 흘러든다 |
~ 대략적인 값 — 해마다, 위치마다 조금씩 다르다
% 우리나라 바다는 세계 평균(약 35 psu)보다 염분이 조금 낮다.

= 예제 2 · 여름과 겨울의 염분 | 적용
- 황해 연안의 표층 염분을 여름과 겨울에 측정했다. 어느 계절에 더 낮을까?
^+ 우리나라는 **여름**에 비가 많이 온다 (장마)
^+ 강물도 늘어나 바다로 담수가 많이 흘러든다
^+ 그래서 표층 염분은 **여름**에 더 **낮다**
>+ 염류의 양이 아니라 **물의 양**이 변해서 염분이 달라진다.

= 예제 3 · 염분 자료로 장소 추리하기 | 적용
| 지점 | A | B | C |
| 표층 염분 (psu) | 37 | 35 | 30 |
^+ A → 증발이 많은 **중위도 대양** 한가운데
^+ B → 세계 평균에 가까운 바다
^+ C → 큰 강물이 흘러드는 **강 하구** 근처

= 생활 속 염분 | 사례
* 🧂 염전 :: 증발이 잘 되는 맑고 바람 부는 날 소금이 잘 만들어진다
* 🏊 사해 :: 사막 기후로 증발이 많고 바다로 빠져나가지 못해 매우 짜다
* 🧊 해빙 :: 바닷물이 얼면 얼음에서 염류가 빠져 주변 바다가 더 짜진다
* 🏞️ 한강 하구 :: 강물이 섞여 바닷물보다 덜 짜다
* 🍵 두부 :: 염화 마그네슘이 든 간수로 두유를 굳힌다

= 확인 문제 2
Q 다음 중 해수의 염분을 높이는 요인은?
o 강수량이 증발량보다 많을 때
o 큰 강물이 흘러들 때
o 빙하가 녹을 때
o* 증발량이 강수량보다 많을 때
:: 증발로 물만 빠져나가면 염류의 양은 그대로이므로 염분이 높아진다.

= 확인 문제 3
Q 우리나라 주변 바다 가운데 표층 염분이 가장 낮은 곳과 그 까닭을 바르게 짝지은 것은?
o 동해 — 증발량이 많아서
o* 황해 — 큰 강물이 많이 흘러들어서
o 동해 — 강수량이 많아서
o 황해 — 바닷물이 얼어서
:: 황해에는 큰 강물(담수)이 많이 흘러들어 해수가 묽어진다.

= 확인 문제 4
Q 해수 1 kg에 염류가 33 g 녹아 있다. 이 해수에 대한 설명으로 옳은 것은?
o 염분은 35 psu이다
o* 염분은 33 psu이고 세계 평균보다 조금 낮다
o 녹아 있는 염류는 모두 염화 나트륨이다
o 이 해수를 증발시키면 염류도 함께 증발한다
:: 염분 = 해수 1 kg 속 염류의 g 수. 염류는 증발하지 않고 남는다.

= 서술형 도전 | 생각 넓히기
? 우리나라 황해의 염분이 동해보다 낮은 까닭을 쓰시오. :: 황해에는 큰 강물(담수)이 많이 흘러들어 해수가 묽어지기 때문이다.
? 사해의 염분이 매우 높은 까닭을 지역의 기후와 관련지어 추리하시오. :: 건조한 사막 기후여서 강수량이 적고 증발량이 매우 많으며, 물이 빠져나갈 바다와 연결되지 않아 염류가 계속 쌓이기 때문이다.

= 오늘 배운 내용 정리
- 해수에 녹아 있는 물질 → [[염류]] (가장 많은 것: [[염화 나트륨]])
- 해수 1 kg 속 염류의 총량(g) → [[염분]], 평균 약 [[35]] psu
- 증발 > 강수, 해수 결빙 → 염분 [[높아짐]] / 강수, 강물, 빙하 → [[낮아짐]]
- 우리나라는 큰 강물이 흘러드는 [[황해]]의 염분이 낮고, 비가 많은 [[여름]]에 염분이 낮다.

= 나가기 전 한 문제 | 형성평가
? 장마철에 한강 하구 근처 바다의 표층 염분은 어떻게 변할지 쓰고, 그 까닭을 설명하시오. :: 낮아진다. 비가 많이 오고 강물(담수)이 많이 흘러들어 염류의 양은 그대로인데 물의 양이 늘어나기 때문이다.
