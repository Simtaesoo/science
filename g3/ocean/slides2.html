^ 깊이에 따른 **수온 분포**를 기준으로 해수를 3개 층으로 구분할 수 있다.

^ **우리나라 바다의 계절별** 수온 분포를 해석하고, 바람과 위도에 따른 차이를 비교할 수 있다.

= 여름 바다, 깊이 잠수하면? | 생각 열기
* 🏊 해수욕 :: 여름 바다 표면은 미지근하다
* 🤿 스쿠버 다이빙 :: 조금만 깊이 내려가도 갑자기 차가워지는 층이 있다
* 🐋 심해 :: 깊은 바다는 일 년 내내 차갑고 어둡다
* 🌬️ 태풍 뒤 :: 태풍이 지나가면 바다 표면 수온이 내려가기도 한다
? 바다 표면을 데우는 에너지는 어디에서 올까? :: **태양 에너지**. 햇빛은 표면 가까이에서 대부분 흡수되므로 표면이 가장 따뜻하다.

= 지난 시간 복습 | 1차시
- 수권: 해수 약 [[97.5]] %, 담수 약 2.5 %
- 담수: [[빙하]] > [[지하수]] > 호수와 하천
? 지구의 물 대부분을 차지하는 해수 — 깊이에 따라 성질이 같을까? :: 깊이에 따라 **수온**이 크게 다르다. 기권을 기온으로 나누었듯, 해수는 수온으로 층을 나눈다.

## 수조 속 바다 | 모형 실험

= 수조 속 층상 구조 | 모형 실험
- 수조에 물을 담고 적외선등을 비춘 뒤 깊이별 수온을 측정한다. 그다음 선풍기로 바람을 일으키며 다시 측정한다.
| 조건 | 깊이에 따른 수온 변화 |
|+ 적외선등만 | 표면 수온이 가장 높고 깊어질수록 [[낮아짐]] |
|+ 적외선등 + 바람 | 표면 부근에 수온이 [[일정한 층]]이 생김 |
>+ 적외선등 = 태양, 선풍기 = 바람 → 바람이 표층의 물을 **섞는다.**

= 해수의 층상 구조 | 개념 정리
| 층 | 특징 |
|+ 혼합층 | 바람에 의해 섞여 수온이 일정, 바람이 강할수록 두꺼움 |
|+ 수온 약층 | 깊어질수록 수온이 급격히 낮아짐, 매우 안정 |
|+ 심해층 | 수온이 낮고 일정 (약 4 ℃ 이하), 계절 변화 거의 없음 |
% 기권의 '기온 기준 4개 층'과 같은 방식임을 연결

= 깊이에 따른 수온 | 그래프
C 깊이에 따른 수온 (시뮬레이션 모형) | 깊이 (m) | 수온 (℃) | 저위도:0,27 70,27 220,15.5 370,10.7 670,4 1000,3.6 2000,2.2 | 고위도:0,3 1500,2 2000,2
+ 저위도: 0~70 m 일정 → 혼합층 / 70~670 m 급감 → 수온 약층 / 그 아래 → 심해층
+ 고위도: 표층과 깊은 곳의 수온 차가 작아 층 구분이 어렵다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#layer | 위도와 바람 세기를 바꾸며 깊이에 따른 수온 분포와 혼합층 두께를 관찰하자.
% 바람 0 → 100으로 올리며 혼합층 두께 변화를 먼저, 그다음 위도 버튼 비교

## 세 층의 비밀 | 왜 그렇게 될까

= 수온 약층은 왜 안정할까?
- 위: 따뜻하고 ==가벼운== 물 / 아래: 차갑고 ==무거운== 물
- 무거운 물이 아래에 있으므로 위아래로 섞이는 대류가 일어나기 어렵다.
>+ 수온 약층은 혼합층과 심해층 사이의 **물질과 에너지 교환을 막는** 칸막이 역할
~ 기권의 성층권이 안정한 까닭(위가 따뜻함)과 비교해 보자.

= 위도에 따른 차이 | 비교
| 구분 | 저위도 | 중위도 | 고위도 |
|+ 표층 수온 | 가장 높음 | 중간 | 가장 낮음 |
|+ 혼합층 | 얇은 편 (바람 약함) | 두꺼운 편 (바람 강함) | 층 구분 어려움 |
|+ 층상 구조 | 뚜렷함 | 뚜렷함 | 거의 나타나지 않음 |
>+ 표층 수온은 **태양 에너지**, 혼합층 두께는 **바람**이 결정한다.

= 우리 바다의 여름과 겨울 | 계절별 수온 분포
C 동해의 깊이에 따른 수온 (모식 자료) | 깊이 (m) | 수온 (℃) | 여름 (8월):0,25 20,24 50,14 100,6 200,2 300,1 | 겨울 (2월):0,10 50,10 100,9.5 150,7 200,3 300,1
||
| 구분 | 여름 | 겨울 |
|+ 표층 수온 | 높다 | 낮다 |
|+ 바람 | 약하다 | 강하다 (북서 계절풍) |
|+ 혼합층 | [[얇다]] | [[두껍다]] |
|+ 수온 약층 | 뚜렷하다 | 약하다 |
>+ 깊은 곳의 수온은 계절이 바뀌어도 거의 변하지 않는다.
% 시뮬레이션 [우리 바다 여름]/[우리 바다 겨울] 버튼으로 같은 비교를 할 수 있다. 값은 경향을 보여 주는 모식 자료이다.

= 예제 1 · 수온 자료로 층 나누기 | 적용
| 깊이 (m) | 0 | 50 | 100 | 200 | 400 | 800 | 1500 |
| 수온 (℃) | 20 | 20 | 20 | 12 | 7 | 4 | 3 |
^+ 0~100 m: 수온 일정 → **혼합층**
^+ 100~800 m: 20 → 4 ℃로 급감 → **수온 약층**
^+ 800 m 아래: 낮고 거의 일정 → **심해층**

= 예제 2 · 바람이 강해지면 | 적용
- 같은 해역에 강한 바람이 며칠 동안 불었다.
^+ 표층의 물이 더 깊은 곳까지 섞인다.
^+ 혼합층이 **두꺼워진다** (수온이 일정한 구간이 깊어진다).
^+ 깊은 곳의 찬물이 섞여 올라오면 표층 수온이 조금 **낮아질** 수 있다.
>+ 태풍이 지나간 뒤 바다 표면 수온이 내려가는 까닭!

= 예제 3 · 위아래 수온 차 | 적용
- 저위도 표층 27 ℃, 깊이 2000 m 약 2 ℃ / 고위도 표층 3 ℃, 깊이 2000 m 약 2 ℃
^+ 저위도 수온 차 = 27 − 2 = **25 ℃** → 층상 구조 뚜렷
^+ 고위도 수온 차 = 3 − 2 = **1 ℃** → 층 구분 어려움
>+ 심해층 수온은 위도와 관계없이 **거의 같다.**

= 생활 속 층상 구조 | 사례
* 🌀 태풍 :: 강한 바람이 혼합층을 두껍게 하고 찬물을 끌어 올린다
* 🐟 어장 :: 물고기는 좋아하는 수온의 깊이에서 무리 지어 산다
* 🛰️ 해양 관측 부이 :: 깊이별 수온을 재어 기후 변화를 감시한다
* 🧊 극지방 바다 :: 표층과 심층의 수온이 비슷해 층이 거의 없다
* 🌡️ 수온 약층과 영양 :: 약층이 깊은 곳 영양 염류의 상승을 막는다

= 확인 문제 1
Q 깊어질수록 수온이 급격히 낮아지는 층은?
o 혼합층
o* 수온 약층
o 심해층
o 대류권
:: 수온 약층은 혼합층과 심해층 사이에서 수온이 급격히 변하는 층이다.

= 확인 문제 2
Q 혼합층이 가장 두껍게 나타나는 조건은?
o 바람이 약한 저위도
o* 바람이 강한 중위도
o 바람이 없는 호수
o 심해층이 얇은 곳
:: 혼합층의 두께는 바람이 강할수록 두껍다. 중위도는 바람이 강한 편이다.

= 확인 문제 3
Q 고위도 해역에서 층상 구조가 잘 나타나지 않는 까닭은?
o 바람이 전혀 불지 않아서
o 심해층이 없어서
o* 표층 수온이 낮아 깊은 곳과의 수온 차가 거의 없어서
o 염분이 매우 높아서
:: 표층과 심층의 수온이 모두 낮아 구분되는 층이 생기지 않는다.

= 확인 문제 4
Q 해수의 층상 구조에 대한 설명으로 옳은 것은?
o 심해층은 계절에 따라 수온이 크게 변한다
o* 수온 약층은 위아래 물의 섞임을 막는다
o 혼합층은 바람이 약할수록 두껍다
o 깊이에 따른 염분을 기준으로 나눈다
:: 수온 약층은 위가 따뜻하고 가벼워 대류가 일어나지 않으므로 물질과 에너지 교환을 막는다.

= 서술형 도전 | 생각 넓히기
? 수온 약층이 매우 안정한 까닭을 밀도와 관련지어 설명하시오. :: 위쪽에 따뜻하고 가벼운(밀도가 작은) 물, 아래쪽에 차갑고 무거운(밀도가 큰) 물이 있어 위아래로 섞이는 대류가 일어나기 어렵기 때문이다.
? 수조 실험에서 적외선등과 선풍기는 실제 바다에서 각각 무엇에 해당하는지 쓰고, 선풍기를 켰을 때 생긴 층의 이름을 쓰시오. :: 적외선등 = 태양 에너지, 선풍기 = 바람. 바람에 섞여 수온이 일정해진 층은 혼합층이다.

= 오늘 배운 내용 정리
- 해수는 깊이에 따른 [[수온 분포]]로 3개 층으로 나눈다.
- [[혼합층]]: 바람에 섞여 수온 일정, 바람이 강할수록 두꺼움
- [[수온 약층]]: 수온 급감, 매우 안정 → 물질·에너지 교환 차단
- [[심해층]]: 수온이 낮고 일정, 계절 변화 거의 없음
- 표층 수온은 [[저위도]]에서 가장 높고, 고위도는 층상 구조가 거의 없다.
- 우리 바다는 여름에 혼합층이 [[얇고]] 수온 약층이 뚜렷, 겨울에 혼합층이 두껍다.

= 나가기 전 한 문제 | 형성평가
? 바람이 강해지면 혼합층과 수온 약층이 각각 어떻게 변할지 한 문장으로 쓰시오. :: 바람이 표층의 물을 더 깊이까지 섞어 혼합층이 두꺼워지고, 수온 약층은 그만큼 더 깊은 곳에서 시작된다.
