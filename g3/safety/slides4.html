# 감염병과 안전 | 곡선을 평평하게 | 중학교 과학 3 · 22 재해·재난과 안전 · 4차시 | 2022 개정 교육과정 [9과22]

= 오늘의 학습 목표 | 4차시
^ **감염병**의 뜻과 **전파 경로**를 말할 수 있다.
^ 모형으로 감염병이 **확산되는 원리**와 예방 수칙의 효과를 설명할 수 있다.
^ 예방 수칙의 **과학적 근거**를 설명하고 정보를 비판적으로 판단할 수 있다.
% 흐름: 생각 열기 5분 → 전파 경로 5분 → 확산 계산 10분 → 확산 모형(시뮬레이션) 12분 → 예방 수칙 8분 → 문항 5분

= 한 명이 두 명에게, 두 명이 네 명에게 | 생각 열기
* 🤧 재채기 :: 침방울(비말)이 수 m까지 튄다
* 🤝 악수 :: 손에 묻은 병원체가 옮겨 간다
* 🦟 모기 :: 병원체를 옮기는 매개체가 된다
* 🏥 병원 :: 환자가 한꺼번에 몰리면 병상이 모자란다
? 감염자가 1명에서 시작해 한 사람이 2명씩 옮긴다면, 10단계 뒤 새 감염자는 몇 명일까? :: 2를 10번 곱한 **1024명**. 작은 차이가 반복되면 엄청나게 커진다 — 그래서 '한 사람이 옮기는 수'를 줄이는 것이 핵심!

= 지난 시간 복습 | 1차시
- 사람의 활동이나 사회 시스템이 원인 → [[사회 재난]]
- 감염병: 병원체의 전파 → 대규모 감염, 사회 활동 위축
? 감염병이 '재난'이 되는 까닭은? :: 환자가 짧은 시간에 한꺼번에 늘면 **의료 체계**가 감당하지 못해 피해가 커지기 때문이다.

## 감염병과 전파 | 병원체는 어떻게 퍼질까

= 감염병과 전파 경로
! 감염병: 세균, 바이러스 등 병원체가 침입하여 생기고 다른 사람에게 전파되는 병
| 전파 경로 | 예 |
|+ 비말(침방울) | 기침, 재채기, 대화 |
|+ 접촉 | 손, 문손잡이, 공용 물건 |
|+ 공기 | 아주 작은 입자로 공기 중에 떠다님 |
|+ 매개체 | 모기, 진드기 등 |
|+ 오염된 물이나 음식 | 식중독, 수인성 감염병 |

= 예제 1 · 단계별 확산 | 적용
- 감염자 1명에서 시작해 한 사람이 단계마다 새로 옮기는 사람 수가 다를 때 (예시 모형)
| 단계 | 0 | 1 | 2 | 3 | 4 | 5 |
|+ 2명씩 옮김 | 1 | 2 | 4 | 8 | 16 | [[32]] |
|+ 1명씩 옮김 | 1 | 1 | 1 | 1 | 1 | [[1]] |
>+ 예방 수칙으로 옮기는 수를 2명 → 1명 아래로 줄이면 확산이 **멈추기** 시작한다.

= 예제 2 · 옮기는 수를 줄이면 | 적용
- 한 사람이 3명에게 옮기던 감염병이 마스크와 거리 두기로 1.5명으로 줄었다. 4단계 뒤 새 감염자 수는? (감염자 16명에서 시작)
^+ 대책 전: 16 × 3 × 3 × 3 × 3 = **1296명**
^+ 대책 후: 16 × 1.5 × 1.5 × 1.5 × 1.5 = **81명**
^+ 약 **16배** 차이!

## 확산 모형 | 곡선을 평평하게

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#epi | 조건을 하나씩 바꾸고 [다시 시작]을 눌러, 최대 감염자 수와 감염이 끝나는 시간을 비교하자.
% 대책 없음 → 마스크 70 % → 거리 두기 60 % → 예방 접종 60 % → 모두, 순서로 기록

= 곡선을 평평하게 | 그래프 해석
C 시간에 따른 감염자 수 (예시 모형) | 시간 (주) | 감염자 수 (명) | 대책 없음:0,10 2,120 4,600 6,900 8,450 10,120 12,30 | 예방 수칙:0,10 2,40 4,110 6,190 8,230 10,200 12,150
+ 예방 수칙을 지키면 최대 감염자 수가 [[줄어]] 곡선이 평평해진다.
+ 환자가 한꺼번에 몰리지 않아 [[의료 체계]]가 감당할 수 있다.

= 예방 수칙의 과학적 근거 | 개념 정리
| 예방 수칙 | 과학적 근거 |
|+ 비누로 손 씻기 | 비누가 병원체의 막을 파괴하고 병원체를 씻어 냄 |
|+ 마스크 착용 | 비말이 퍼지거나 들어오는 것을 막음 |
|+ 기침 예절 | 옷소매로 가려 비말 확산 차단 |
|+ 거리 두기 | 접촉 기회를 줄여 전파 속도 감소 |
|+ 예방 접종 | 항체를 미리 만들어 감염되지 않거나 가볍게 앓음 |
|+ 환기 | 공기 중 병원체 농도를 낮춤 |

= 집단 면역
- 예방 접종을 한 사람이 많아지면 병원체가 옮겨 갈 ==길이 끊긴다.==
- 그래서 접종을 받지 못한 사람(아기, 환자)도 **보호**받는다.
>+ 예방 접종은 나를 지키는 동시에 **공동체**를 지키는 일

= 예제 3 · 집단 면역 계산 | 적용
- 한 사람이 4명을 만나 옮길 수 있는데, 그중 75 %가 면역을 가지고 있다.
^+ 실제로 옮길 수 있는 사람 = 4 × (1 − 0.75) = **1명**
^+ 면역 비율이 75 %보다 높아지면 1명보다 적어져 확산이 **줄어든다.**

= 생활 속 감염병 예방 | 사례
* 🧼 30초 손 씻기 :: 손가락 사이, 손톱 밑까지 비누로
* 😷 마스크 :: 코와 입을 완전히 덮어 비말 차단
* 💪 기침 예절 :: 손이 아닌 옷소매로 가리기
* 💉 예방 접종 :: 독감 예방 접종으로 나와 가족 보호
* 🪟 환기 :: 교실 창문을 주기적으로 열기
* 📰 정보 확인 :: 질병관리청 등 공식 기관의 정보를 확인

= 확인 문제 1
Q 감염병 예방 수칙과 과학적 근거를 바르게 짝지은 것은?
o 환기 — 항체를 만든다
o* 손 씻기 — 비누가 병원체의 막을 파괴한다
o 예방 접종 — 비말을 막는다
o 마스크 — 공기 중 병원체 농도를 높인다
:: 비누는 병원체의 막을 파괴하고 씻어 낸다.

= 확인 문제 2
Q '곡선을 평평하게' 만드는 것의 의미로 가장 알맞은 것은?
o 감염병이 바로 사라진다
o* 최대 감염자 수를 줄여 의료 체계가 감당할 수 있게 한다
o 감염 기간을 무조건 짧게 한다
o 감염자 수를 늘려 빨리 끝낸다
:: 환자가 한꺼번에 몰리지 않게 하여 치료가 가능한 상태를 유지한다.

= 확인 문제 3
Q 한 사람이 2명씩 옮기는 감염병이 1명에서 시작했을 때, 6단계 뒤 새 감염자 수는?
o 12명
o 32명
o* 64명
o 128명
:: 2를 6번 곱하면 64명

= 확인 문제 4
Q 예방 접종률이 높아지면 접종을 받지 않은 사람도 감염될 가능성이 줄어드는 까닭은?
o 병원체가 모두 죽기 때문
o* 면역을 가진 사람이 많아 전파 경로가 끊기기 때문
o 접종하지 않은 사람도 항체가 생기기 때문
o 감염병의 증상이 사라지기 때문
:: 집단 면역 — 병원체가 옮겨 갈 사람이 줄어 전체 확산이 줄어든다.

= 서술형 도전 | 생각 넓히기
? 예방 접종률이 높아지면 접종을 받지 않은 사람도 보호받는 까닭을 쓰시오. :: 면역을 가진 사람이 많아지면 병원체가 전파될 수 있는 경로가 끊겨 전체 확산이 줄어들기 때문이다(집단 면역).
? 감염병 상황에서 가짜 뉴스가 퍼지면 생길 수 있는 문제와, 과학적으로 정보를 판단하는 방법을 쓰시오. :: 잘못된 예방법을 믿어 감염이 늘거나 불안이 커질 수 있다. 출처(질병관리청 등 공식 기관)를 확인하고, 근거가 되는 연구나 자료가 있는지, 여러 출처에서 확인되는지 살펴본다.
