## 태풍 | 열대의 거대한 저기압

= 태풍이란?
! 태풍: 열대 해상에서 발생한 저기압 중 중심 최대 풍속이 17 m/s 이상인 것
- 에너지원: 수증기가 ==응결할 때 방출하는 열==
- 육지에 상륙하거나 찬 바다로 가면 ==약해진다.==
- **태풍의 눈**: 중심부, 바람이 약하고 맑음 (하강 기류)
>+ 북반구 태풍은 **시계 반대 방향**으로 바람이 불어 들어간다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#storm | [태풍 이동]을 누르고, 태풍 경로 왼쪽의 A와 오른쪽의 B 지점의 풍속 변화를 비교하자.
% A, B 풍속 최댓값을 각각 받아 적게 하고 차이를 계산

= 위험 반원과 안전 반원
| 구분 | A (진행 방향 왼쪽) | B (진행 방향 오른쪽) |
|+ 최대 풍속 | [[약함]] | [[강함]] |
|+ 까닭 | 바람 방향과 이동 방향이 반대 | 바람 방향과 이동 방향이 같아 더해짐 |
|+ 이름 | 안전(가항) 반원 | 위험 반원 |

= 예제 1 · 풍속 더하기 | 적용
- 태풍 자체의 바람이 30 m/s이고, 태풍이 북쪽으로 10 m/s로 이동한다.
^+ 오른쪽(위험 반원): 30 + 10 = **40 m/s**
^+ 왼쪽(안전 반원): 30 − 10 = **20 m/s**
^+ 오른쪽 풍속이 왼쪽의 **2배**!
>+ '안전 반원'도 20 m/s — 태풍 기준(17 m/s)을 넘는다. 이름만 안전할 뿐!

= 예제 2 · 서울과 강릉 | 적용
- 태풍이 우리나라 서해를 따라 북상한다.
^+ 진행 방향(북쪽)의 오른쪽 = **동쪽**
^+ 강릉은 태풍 경로의 오른쪽 → **위험 반원**
^+ 서울보다 강릉에서 바람이 더 강할 것으로 예상된다.

= 확인 문제 1
Q 태풍의 에너지원으로 옳은 것은?
o 지구 내부의 열
o* 수증기가 응결할 때 방출하는 열
o 바닷물의 염분
o 달의 인력
:: 따뜻한 바다에서 공급된 수증기가 응결하며 내놓는 열이 태풍의 에너지원이다.

## 기상 재해 대처 | 과학으로 지키는 안전

= 기상 재해별 대처 | 개념 정리
| 재해 | 대처 방법 | 과학적 까닭 |
|+ 태풍 | 외출 자제, 창문 고정, 해안 접근 금지 | 강풍에 날아온 물체, 해일 위험 |
|+ 집중 호우 | 지하 공간·하천 주변 피하기, 높은 곳 대피 | 물은 낮은 곳으로 흐르고 빠르게 불어남 |
|+ 폭염 | 한낮 야외 활동 자제, 물 자주 마시기 | 땀 증발로 체온 조절 → 수분 보충 필요 |
|+ 한파 | 보온, 수도관 동파 예방 | 물이 얼면 부피가 늘어나 관이 터짐 |

= 도시가 더 빨리 잠기는 까닭
+ 도시는 아스팔트·콘크리트로 덮여 빗물이 땅에 **스며들지 못한다.**
+ 빗물이 빠르게 흘러 낮은 곳(지하 차도, 반지하)에 **모인다.**
+ 해결: **투수성 포장**, 빗물 저류 시설, 옥상 정원, 배수 시설 확충
>+ 집중 호우 때 지하 공간은 몇 분 만에 잠길 수 있다 — 물이 차기 전에 **바로 밖으로!**

= 예제 3 · 빗물은 얼마나? | 적용
- 넓이 10 000 m²인 운동장에 1시간 동안 50 mm의 비가 내렸다. 내린 빗물의 부피는?
^+ 50 mm = **0.05 m**
^+ 부피 = 10 000 × 0.05 = **500 m³** (= 500 톤)
^+ 땅에 스며들지 못하면 이 물이 모두 낮은 곳으로 흘러간다.

= 생활 속 태풍·호우 대비 | 사례
* 🪟 창문 테이프? :: 효과가 작다 — 창틀을 단단히 고정하는 것이 중요
* 🚗 지하 주차장 :: 호우 경보 때 차량을 미리 옮긴다
* 🌊 해안가 :: 태풍 때 파도 구경은 매우 위험하다
* 🥵 무더위 쉼터 :: 폭염 특보 때 시원한 곳에서 쉰다
* 🚰 수도관 감싸기 :: 한파 때 보온재로 동파를 막는다
* 🛰️ 기상 위성 :: 태풍의 위치와 경로를 계속 추적한다

= 확인 문제 2
Q 태풍의 위험 반원에 대한 설명으로 옳은 것은?
o 진행 방향의 왼쪽이다
o* 태풍의 바람 방향과 이동 방향이 같아 풍속이 강하다
o 바람이 전혀 불지 않는다
o 태풍의 눈과 같은 곳이다
:: 북반구에서는 진행 방향 오른쪽이 위험 반원으로, 바람과 이동 방향이 더해진다.

= 확인 문제 3
Q 태풍이 육지에 상륙하면 약해지는 까닭으로 옳은 것은?
o 육지가 바다보다 따뜻해서
o* 수증기 공급이 줄고 지표면과의 마찰이 커져서
o 태풍의 눈이 커져서
o 바람의 방향이 바뀌어서
:: 에너지원인 수증기가 줄고 지표면과의 마찰로 에너지를 잃는다.

= 확인 문제 4
Q 집중 호우 때 대처 방법으로 옳지 않은 것은?
o 하천 주변을 피한다
o 높은 곳으로 대피한다
o* 지하 공간으로 피신한다
o 기상 특보를 확인한다
:: 물은 낮은 곳으로 모이므로 지하 공간은 매우 위험하다.

= 서술형 도전 | 생각 넓히기
? 태풍이 우리나라 서해로 북상할 때, 서울과 강릉 중 바람이 더 강할 것으로 예상되는 곳과 그 까닭을 쓰시오. :: 강릉. 태풍 진행 방향의 오른쪽(위험 반원)에 있어 태풍의 바람과 이동 방향이 더해지기 때문이다.
? 도시에서 집중 호우가 내리면 농촌보다 침수가 더 빨리 일어나는 까닭과 해결 방안을 쓰시오. :: 아스팔트와 콘크리트로 덮여 빗물이 땅에 스며들지 못하고 빠르게 흘러 모이기 때문이다. 투수성 포장, 빗물 저류 시설, 옥상 정원, 배수 시설 확충 등으로 해결할 수 있다.
