# 화학 사고와 화재 안전 | 바람과 밀도를 읽어라 | 중학교 과학 3 · 22 재해·재난과 안전 · 5차시 | 2022 개정 교육과정 [9과22]

= 오늘의 학습 목표 | 5차시
^ 유해 기체가 유출되었을 때 **기체의 밀도와 바람**을 고려해 대피 방향을 정할 수 있다.
^ **연소의 세 가지 조건**으로 소화 방법과 화재 대피 요령을 설명할 수 있다.
^ 우리 가족의 **재난 대응 계획**을 세울 수 있다.
% 흐름: 생각 열기 5분 → 유해 기체(시뮬레이션) 12분 → 화재 안전 10분 → 문항 8분 → 대응 계획·미션 10분

= 위로 피할까, 아래로 피할까? | 생각 열기
* 🏭 공장 사고 :: "염소 기체가 누출되었습니다"
* 🚛 탱크로리 전복 :: "암모니아가 새고 있습니다"
* 🔥 아파트 화재 :: 복도에 연기가 가득 찼다
* 🧯 소화기 :: 사용법을 알고 있나요?
? 공기보다 무거운 기체가 새어 나왔다면 높은 곳과 낮은 곳 중 어디로 피해야 할까? :: **높은 곳**. 무거운 기체는 낮은 곳에 고인다. 반대로 가벼운 기체는 위로 퍼진다 — 기체의 **밀도**를 알면 대피 방향이 보인다!

= 지난 시간 복습 | 4차시 · 이전 학년
- 감염병 확산을 늦추려면 한 사람이 옮기는 수를 [[줄인다]].
- 기체는 [[확산]]하여 퍼지고, 밀도가 큰 기체는 아래로 가라앉는다.
- 물질이 산소와 빠르게 반응하며 빛과 열을 내는 것 → [[연소]]
? 바람이 불면 유출된 기체는 어느 쪽으로 퍼질까? :: 바람이 **불어 가는 방향**으로 퍼진다. 그쪽을 피해야 한다.

## 화학 물질 유출 | 밀도와 바람

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#chem | 기체의 종류와 바람 방향을 바꾸어 [유출 발생]을 누르고, 안전한 대피 방향과 높이를 찾자.
% 염소 → 암모니아 순서로, 바람 방향도 바꿔 가며 '어디로, 얼마나 높이'를 기록

= 유해 기체 유출 시 대피 | 개념 정리
| 유출된 기체 | 퍼지는 모습 | 대피할 곳 |
|+ 공기보다 무거운 기체 (염소 등) | 낮은 곳에 고임 | [[높은 곳]] (건물 위층) |
|+ 공기보다 가벼운 기체 (암모니아 등) | 위로 퍼짐 | [[낮은 곳, 실내]] (창문 닫기) |
>+ 공통: 바람이 **불어 가는 방향**을 피해, 바람이 불어오는 쪽이나 **바람 방향의 옆**으로 대피, 젖은 수건으로 코와 입을 가린다.

= 예제 1 · 대피 방향 정하기 | 적용
- 우리 학교 서쪽 공장에서 염소 기체가 새어 나왔다. 바람은 서쪽에서 동쪽으로 분다.
^+ 기체는 바람을 타고 **동쪽**(학교 쪽)으로 퍼진다.
^+ 동쪽으로 도망치면 기체와 같은 방향 → ✘
^+ 바람 방향의 옆인 **남쪽이나 북쪽**으로 대피
^+ 염소는 공기보다 무거우므로 실내라면 **위층**으로

= 예제 2 · 얼마나 무거울까? | 자료 해석
| 기체 | 같은 부피의 질량 (공기 = 1) | 퍼지는 모습 |
|+ 염소 | 약 2.5 | [[아래에 고임]] |
|+ 이산화 탄소 | 약 1.5 | [[아래에 고임]] |
|+ 암모니아 | 약 0.6 | [[위로 퍼짐]] |
|+ 수소 | 약 0.07 | [[위로 퍼짐]] |
~ 공기보다 무거우면(1보다 크면) 낮은 곳, 가벼우면 높은 곳에 모인다.

= 확인 문제 1
Q 염소 기체가 유출되었을 때 대피 방법으로 옳은 것은?
o 지하실로 대피한다
o* 바람 방향의 옆으로 이동하고 건물 위층으로 대피한다
o 바람이 불어 가는 방향으로 빨리 뛴다
o 창문을 모두 열어 둔다
:: 염소는 공기보다 무거워 낮은 곳에 고이므로 높은 곳, 바람 방향의 옆으로 피한다.

## 화재 안전 | 연소의 세 조건

= 연소의 세 가지 조건
! 탈 물질 + 산소 + 발화점 이상의 온도
- 하나라도 없애면 불이 ==꺼진다.==
| 소화 방법 | 없애는 연소 조건 |
|+ 모래나 담요로 덮기 | [[산소]] |
|+ 물 뿌리기 | [[발화점 이상의 온도]] |
|+ 가스 밸브 잠그기 | [[탈 물질]] |

= 화재 시 대피 요령
+ 연기는 뜨거워 **위로** 올라간다 → **낮은 자세**로 대피
+ 젖은 수건으로 코와 입을 가린다 (유독 가스 흡입 줄이기)
+ **승강기는 이용하지 않는다** (정전·연기 유입 위험) → 계단으로
+ 문을 열기 전 손잡이가 뜨거운지 확인한다.
>+ 화재 사망의 상당수는 불이 아니라 **연기(유독 가스)** 때문이다.

= 예제 3 · 어떤 조건을 없앴을까? | 적용
| 상황 | 없앤 연소 조건 |
|+ 알코올램프 뚜껑을 덮었다 | [[산소]] |
|+ 산불 확산을 막으려 나무를 미리 베었다 | [[탈 물질]] |
|+ 촛불을 입으로 불어 껐다 | [[발화점 이상의 온도]] |
|+ 기름 화재에 젖은 담요를 덮었다 | [[산소]] |
% 기름 화재에 물을 부으면 기름이 튀어 불이 번진다는 점을 반드시 강조

= 생활 속 화학·화재 안전 | 사례
* 🧯 소화기 :: 안전핀 뽑기 → 노즐 향하기 → 손잡이 누르기
* 🚨 화재경보기 :: 연기를 감지해 일찍 알린다
* 🧪 세제 섞지 않기 :: 락스와 산성 세제를 섞으면 유독한 염소 기체가 생긴다
* 🍳 기름 화재 :: 물 대신 뚜껑·젖은 수건으로 산소 차단
* 🚪 방화문 :: 항상 닫아 두어야 연기 확산을 막는다
* 📱 재난 안전 문자 :: 화학 사고 때 실내 대피·창문 닫기 안내

= 확인 문제 2
Q 모래를 덮어 불을 끄는 것은 어떤 연소 조건을 없앤 것인가?
o 탈 물질
o* 산소
o 발화점 이상의 온도
o 바람
:: 모래가 불을 덮어 산소 공급을 막는다.

= 확인 문제 3
Q 화재 시 대피 방법으로 옳지 않은 것은?
o 젖은 수건으로 코와 입을 가린다
o 낮은 자세로 이동한다
o* 빠르게 승강기를 타고 내려간다
o 계단을 이용한다
:: 승강기는 정전되거나 연기가 들어올 수 있어 매우 위험하다.

= 확인 문제 4
Q 공기보다 가벼운 암모니아가 유출되었을 때의 대처로 옳은 것은?
o 건물 옥상으로 올라간다
o* 실내로 들어가 창문을 닫는다
o 바람이 불어 가는 방향으로 이동한다
o 젖은 수건을 쓰지 않는다
:: 가벼운 기체는 위로 퍼지므로 실내·낮은 곳에서 창문을 닫고, 바람 방향을 피한다.

= 서술형 도전 | 생각 넓히기
? 화재 때 낮은 자세로 대피해야 하는 까닭을 기체의 성질과 관련지어 쓰시오. :: 연기와 유독 가스는 뜨거워 밀도가 작으므로 위로 올라간다. 바닥 가까이에 비교적 깨끗한 공기가 남아 있어 낮은 자세가 안전하다.
? 유해 기체가 유출되었을 때 바람이 불어 가는 방향으로 도망치면 안 되는 까닭을 쓰시오. :: 유출된 기체가 바람을 타고 같은 방향으로 퍼지므로, 계속 기체 속에 머물게 되기 때문이다. 바람 방향의 옆이나 바람이 불어오는 쪽으로 피해야 한다.

= 우리 가족 재난 대응 계획 | 프로젝트
| 항목 | 내용 |
|+ 대비할 재해·재난 | 예: 지진, 화재, 태풍, 화학 사고 |
|+ 관련 과학 원리 | 예: PS시, 연소 조건, 위험 반원, 기체 밀도 |
|+ 대피 장소와 경로 | 집에서 가장 가까운 대피소, 두 가지 경로 |
|+ 비상용품 | 물, 비상식량, 손전등, 구급약, 보조 배터리 |
|+ 정보를 얻을 곳 | 재난 안전 문자, 국민재난안전포털, 기상청, 질병관리청 |

- 공기보다 무거운 기체(염소) → [[높은 곳]]으로, 가벼운 기체(암모니아) → 실내·낮은 곳
