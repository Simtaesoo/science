# 지진과 안전 | P파가 먼저, S파가 나중에 | 중학교 과학 3 · 22 재해·재난과 안전 · 2차시 | 2022 개정 교육과정 [9과22]

= 오늘의 학습 목표 | 2차시
^ 지진의 **규모**와 **진도**를 구별할 수 있다.
^ **P파와 S파**의 도착 시간 차(PS시)로 진앙 거리와 대비 시간을 구할 수 있다.
^ **내진·면진 설계**와 지진 행동 요령을 과학 원리와 연결할 수 있다.
% 흐름: 생각 열기 5분 → 규모·진도 5분 → 지진파(시뮬레이션) 15분 → 내진 설계·행동 요령 10분 → 문항·미션 10분

= 흔들림보다 먼저 울린 경보 | 생각 열기
* 📱 긴급 재난 문자 :: 흔들리기 몇 초 전에 휴대전화가 울렸다
* 🏢 고층 건물 :: 크게 흔들렸지만 무너지지 않았다
* 🏚️ 오래된 건물 :: 벽에 금이 가고 무너졌다
* 🌊 해안 :: 지진 뒤 바닷물이 밀려왔다 (지진 해일)
? 지진이 났는데 어떻게 흔들리기 '전에' 경보를 보낼 수 있을까? :: 지진파 중 빠르지만 약한 **P파**를 먼저 감지하고, 큰 흔들림을 주는 **S파**가 오기 전에 알리기 때문이다.

= 지난 시간 복습 | 1차시
- 자연 현상이 원인 → [[자연재해]], 사람의 활동이 원인 → [[사회 재난]]
- 지진, 화산 → 자연재해 중 [[지질]] 재해
? 지진은 예측이 어려운 재해다. 그렇다면 무엇이 중요할까? :: **평소의 대비**(내진 설계, 대피 훈련)와 몇 초라도 빨리 알리는 **조기 경보**

## 규모와 진도 | 지진의 크기 두 가지

= 규모와 진도
| 구분 | 규모 | 진도 |
|+ 뜻 | 지진이 발생할 때 방출된 에너지의 양 | 어떤 지역에서 사람이 느끼는 정도·피해 정도 |
|+ 값의 개수 | 하나의 지진에 하나 | 지역마다 다름 |
>+ 같은 지진이라도 진앙에서 멀수록, 지반이 단단할수록, 건물이 튼튼할수록 **진도가 작다.**

## 지진파 | P파와 S파

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#quake | 진앙 거리와 건물 종류를 바꾸어 [지진 발생]을 누르고, PS시와 건물의 흔들림을 비교하자.
% 진앙 거리 40 → 80 → 160 km 순서로 PS시를 기록하게 하기

= 지진파의 도착 시간 | 시뮬레이션 기록
| 진앙 거리 | P파 도착 | S파 도착 | PS시 |
|+ 40 km | 6.7초 | 11.4초 | 4.8초 |
|+ 80 km | 13.3초 | 22.9초 | 9.5초 |
|+ 160 km | 26.7초 | 45.7초 | 19.0초 |
>+ 진앙에서 멀수록 PS시가 **길다** → 조기 경보로 대비할 시간이 **많다.**

= 그래프로 보면 | 주시 곡선
C 진앙 거리에 따른 지진파 도착 시간 | 진앙 거리 (km) | 도착 시간 (초) | P파:0,0 40,6.7 80,13.3 160,26.7 | S파:0,0 40,11.4 80,22.9 160,45.7
~ 두 직선 사이의 세로 간격 = PS시, 거리에 비례하여 벌어진다.

= 예제 1 · PS시로 거리 구하기 | 적용
- 어느 관측소에서 PS시가 5초였다. 진앙까지의 거리는? (PS시 1초 ≈ 8 km)
^+ 거리 ≈ 8 × 5 = **약 40 km**
^+ 표에서 40 km일 때 PS시 4.8초와 거의 같다 ✔
>+ 관측소 세 곳의 거리를 알면 원을 그려 **진앙의 위치**를 찾을 수 있다.

= 예제 2 · 조기 경보로 번 시간 | 적용
- 진앙 근처 관측소가 P파를 감지해 지진 발생 10초 뒤 경보를 보냈다. 진앙에서 160 km 떨어진 도시는 몇 초의 여유가 있을까?
^+ 도시에 S파 도착 = **45.7초**
^+ 여유 시간 = 45.7 − 10 = **약 36초**
>+ 36초면 탁자 아래로 들어가고, 가스 불을 끄고, 승강기를 멈출 수 있다!

= 확인 문제 1
Q 지진파에 대한 설명으로 옳은 것은?
o S파가 P파보다 먼저 도착한다
o* 진앙에서 멀수록 PS시가 길다
o 진도는 하나의 지진에 하나의 값만 있다
o PS시는 진앙 거리와 관계없다
:: P파가 먼저 도착하고, 두 파의 도착 시간 차(PS시)는 진앙 거리에 비례한다.

## 지진에 대비하기 | 건물과 행동

= 내진 설계와 면진 설계
| 구분 | 내진 설계 | 면진 설계 |
|+ 원리 | 보강재로 건물을 튼튼하게 하여 흔들림을 견딤 | 고무 받침 등으로 땅의 흔들림이 건물에 덜 전달되게 함 |
|+ 비유 | 단단한 몸으로 버티기 | 무릎을 굽혀 충격 흡수하기 |
% 시뮬레이션에서 일반·내진·면진 건물을 같은 지진으로 비교한 결과를 다시 짚기

= 지진 행동 요령 | 과학적 까닭
| 상황 | 행동 요령 | 까닭 |
|+ 건물 안에서 흔들릴 때 | 탁자 아래로 들어가 머리 보호 | 떨어지는 물건으로부터 보호 |
|+ 흔들림이 멈췄을 때 | 전기·가스 차단, 문 열어 출구 확보, 계단으로 | 화재 예방, 승강기는 정전 위험 |
|+ 밖에 있을 때 | 넓은 공터로 이동 | 건물·유리·간판 낙하 위험 |
|+ 해안가에 있을 때 | 즉시 높은 곳으로 | 지진 해일 |

= 화산 재해
- 화산 분출물: ==용암, 화산재, 화산 가스==
- 화산재가 퍼지면 마스크와 고글을 쓰고 **실내**에 머무르며 창문을 닫는다.
>+ 화산재는 매우 작고 날카로운 암석 조각 → 호흡기와 눈, 비행기 엔진에 해롭다.

= 생활 속 지진 대비 | 사례
* 📱 지진 조기 경보 :: P파를 감지해 S파 전에 문자를 보낸다
* 🏫 학교 내진 보강 :: 기둥과 벽에 보강재를 덧댄다
* 🧱 면진 받침 :: 병원·중요 시설 아래에 고무 받침을 넣는다
* 🛗 승강기 :: 지진을 감지하면 가까운 층에 멈춘다
* 🎒 생존 가방 :: 물, 손전등, 호루라기, 구급약
* 🗾 대피 훈련 :: 정기적인 훈련으로 몸이 먼저 움직이게

= 확인 문제 2
Q PS시가 10초인 관측소에서 진앙까지의 거리는 약 얼마인가? (PS시 1초 ≈ 8 km)
o 10 km
o 40 km
o* 80 km
o 160 km
:: 8 × 10 = 약 80 km (표: 80 km에서 PS시 9.5초)

= 확인 문제 3
Q 지진으로 건물 안에서 흔들릴 때 가장 먼저 할 행동은?
o 승강기를 타고 빠르게 내려간다
o 창문 옆에 서서 밖을 살핀다
o* 탁자 아래로 들어가 머리를 보호한다
o 바로 계단으로 뛰어 내려간다
:: 흔들리는 동안에는 떨어지는 물건으로부터 몸을 보호하고, 흔들림이 멈춘 뒤 계단으로 대피한다.

= 확인 문제 4
Q 규모와 진도에 대한 설명으로 옳은 것은?
o 진도는 지진의 에너지 양이다
o* 같은 지진이라도 지역마다 진도가 다를 수 있다
o 규모는 지역마다 다르다
o 진앙에서 멀수록 진도가 크다
:: 규모는 하나의 값, 진도는 거리·지반·건물에 따라 지역마다 다르다.

= 서술형 도전 | 생각 넓히기
? 같은 지진이라도 지역마다 진도가 다른 까닭을 두 가지 쓰시오. :: 진앙으로부터의 거리가 다르다, 땅의 성질(지반)이 다르다, 건물의 구조가 다르다 중 두 가지
? 진앙에서 먼 지역일수록 지진 조기 경보가 더 효과적인 까닭을 PS시로 설명하시오. :: 진앙에서 멀수록 P파와 S파의 도착 시간 차(PS시)가 길어, 경보를 받은 뒤 큰 흔들림(S파)이 오기까지 대비할 시간이 더 많기 때문이다.
