## 재해·재난의 분류 | 자연재해와 사회 재난

= 재해·재난이란?
! 재해·재난: 국민의 생명·신체·재산과 국가에 피해를 주거나 줄 수 있는 것
| 분류 | 원인 | 예 |
|+ 자연재해 (기상) | 대기의 현상 | 태풍, 홍수, 폭염, 한파 |
|+ 자연재해 (지질) | 지구 내부 에너지 | 지진, 화산 |
|+ 사회 재난 | 사람의 활동·사회 시스템 | 감염병, 화학 물질 유출, 화재, 교통사고 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#types | 목록에서 재해·재난을 하나씩 골라 원인, 피해, 대처 방법을 정리하자.

= 재해·재난 카드 정리 | 원인과 피해
| 종류 | 분류 | 원인 | 피해 |
|+ 지진 | 자연 (지질) | 지구 내부 에너지 방출 | 건물 붕괴, 지진 해일, 산사태 |
|+ 화산 | 자연 (지질) | 마그마 분출 | 용암, 화산재, 항공 운항 차질 |
|+ 태풍 | 자연 (기상) | 열대 해상의 저기압 발달 | 강풍, 호우, 해일 |
|+ 폭염 | 자연 (기상) | 고온 다습한 공기 정체 | 온열 질환, 농작물 피해 |
|+ 감염병 | 사회 | 병원체의 전파 | 대규모 감염, 사회 활동 위축 |
|+ 화학 물질 유출 | 사회 | 공장·운송 중 누출 | 호흡기 손상, 환경 오염 |

= 확인 문제 1
Q 다음 중 사회 재난에 해당하는 것은?
o 태풍
o 지진
o 폭염
o* 화학 물질 유출
:: 화학 물질 유출은 사람의 활동(공장, 운송)에서 비롯된 사회 재난이다.

| 사례 | 분류 |
|+ 여름철 기온이 35 ℃ 넘게 며칠 계속되었다 | [[자연재해 (기상)]] |
|+ 땅이 갈라지고 건물이 흔들렸다 | [[자연재해 (지질)]] |
|+ 공장에서 유독 가스가 새어 나왔다 | [[사회 재난]] |
|+ 새로운 바이러스가 전 세계로 퍼졌다 | [[사회 재난]] |
|+ 화산재가 날려 비행기가 결항되었다 | [[자연재해 (지질)]] |

## 예측과 대비 | 언제 오는지 알 수 있을까

= 예측 가능성에 따른 대비
| 구분 | 예측이 어려운 재해 | 예측할 수 있는 재해 |
|+ 예 | 지진 | 태풍, 폭염, 한파 |
|+ 대비의 핵심 | 평소에 미리 대비 | 예보에 따라 미리 행동 |
|+ 방법 | 내진 설계, 대피 훈련, 비상용품 | 대피, 시설 점검, 외출 자제 |
>+ 예측할 수 없다면 **평소 준비**가, 예측할 수 있다면 **정보를 따르는 행동**이 생명을 지킨다.

= 예제 2 · 태풍은 며칠 전에 알 수 있다 | 적용
- 태풍이 하루에 약 480 km씩(시속 20 km) 다가온다. 1200 km 떨어져 있다면 언제쯤 도착할까?
^+ 1200 ÷ 480 = **2.5일**
^+ 약 2~3일의 여유 → 창문 고정, 배수구 점검, 대피 계획
>+ 이동 속력이 바뀔 수 있으므로 **최신 예보**를 계속 확인해야 한다.

= 예제 3 · 지구 온난화와 기상 재해 | 적용
- 지구 평균 기온이 오르면 기상 재해는 어떻게 될까?
^+ 폭염 일수가 **늘어난다.**
^+ 해수 온도 ↑ → 태풍의 에너지원(수증기) ↑ → **강한 태풍**
^+ 대기 중 수증기 ↑ → **집중 호우** 증가

= 생활 속 재해·재난 대비 | 사례
* 📱 재난 안전 문자 :: 지역별로 위험 정보를 바로 받는다
* 🎒 비상용품 가방 :: 물, 비상식량, 손전등, 구급약, 보조 배터리
* 🏫 대피 훈련 :: 학교에서 지진·화재 대피 경로를 연습한다
* 🗺️ 국민재난안전포털 :: 대피소 위치와 행동 요령을 확인
* 🏗️ 내진 설계 :: 지진에 견디도록 건물을 짓는다
* 🌡️ 무더위 쉼터 :: 폭염 때 누구나 쉴 수 있는 시원한 공간

= 확인 문제 2
Q 자연재해 중 지질 재해에 해당하는 것끼리 짝지은 것은?
o 태풍, 홍수
o* 지진, 화산
o 폭염, 한파
o 감염병, 화재
:: 지진과 화산은 지구 내부 에너지로 생기는 지질 재해이다.

= 확인 문제 3
Q 예측이 어려운 재해에 대비하는 방법으로 가장 알맞은 것은?
o 예보가 나올 때까지 기다린다
o* 평소에 내진 설계와 대피 훈련을 해 둔다
o 재해가 일어난 뒤에 계획을 세운다
o 대비할 방법이 없으므로 아무것도 하지 않는다
:: 지진처럼 예측이 어려운 재해는 평소의 대비가 가장 중요하다.

= 확인 문제 4
Q 지구 온난화로 늘어날 수 있는 재해가 아닌 것은?
o 폭염
o 집중 호우
o 강한 태풍
o* 화산 분출
:: 화산 분출은 지구 내부 에너지(마그마)로 일어나며 기후 변화와 직접 관련이 적다.

= 서술형 도전 | 생각 넓히기
? 자연재해와 사회 재난의 차이를 한 문장으로 쓰시오. :: 자연재해는 자연 현상이 원인이고, 사회 재난은 사람의 활동이나 사회 시스템이 원인이다.
? 지진처럼 예측하기 어려운 재해와 태풍처럼 예측할 수 있는 재해는 대비 방법이 어떻게 달라야 하는지 쓰시오. :: 예측이 어려운 재해는 평소에 내진 설계, 대피 훈련 등으로 미리 대비해야 하고, 예측 가능한 재해는 예보에 따라 미리 대피하거나 시설을 점검해야 한다.
