# 위치 에너지와 운동 에너지 | 일을 할 수 있는 능력 | 중학교 과학 3 · 19 운동과 에너지 · 4차시 | 2022 개정 교육과정 [9과19-03]

= 오늘의 학습 목표 | 4차시
^ **에너지**의 뜻과 일과의 관계를 설명할 수 있다.
^ **위치 에너지**의 크기가 질량과 높이에 비례함을 실험으로 찾을 수 있다.
^ **운동 에너지**의 크기가 질량과 속력의 제곱에 비례함을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 에너지와 일 5분 → 위치 에너지(말뚝 박기) 12분 → 운동 에너지(나무 도막) 12분 → 문항 10분

= 무엇이 말뚝을 더 깊이 박을까? | 생각 열기
* 🔨 망치질 :: 망치를 높이 들어 내리칠수록 못이 깊이 박힌다
* 🏗️ 항타기 :: 무거운 추를 높이 올렸다 떨어뜨려 말뚝을 박는다
* 🎳 볼링 :: 공이 빠를수록 핀이 멀리 날아간다
* 🚗 충돌 실험 :: 빠른 차일수록 크게 찌그러진다
? 높이 있는 추와 빠르게 움직이는 공의 공통점은? :: 둘 다 다른 물체에 **일을 할 수 있다** — 즉 **에너지**를 가지고 있다.

= 지난 시간 복습 | 3차시
- 일 = 힘 × [[힘의 방향으로 이동한 거리]] (단위 J)
- 중력에 대해 한 일 = 9.8 × 질량 × [[높이]]
? 질량 2 kg인 상자를 1 m 들어 올리는 데 한 일은? :: 9.8 × 2 × 1 = **19.6 J** — 이 일은 어디로 갔을까? 오늘의 답: 상자의 **위치 에너지**로 저장된다.

## 에너지와 위치 에너지 | 높이에 저장된 에너지

= 에너지와 일
! 에너지: 일을 할 수 있는 능력 (단위 J, 일과 같다)
- 물체를 들어 올리면 중력에 대해 한 일만큼 ==위치 에너지==가 증가한다.
- 물체를 밀어 움직이면 물체에 한 일만큼 ==운동 에너지==가 증가한다.
>+ 일 ⇄ 에너지: 일을 하면 에너지가 옮겨 가고, 에너지가 있으면 일을 할 수 있다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#energy | 추의 질량과 높이를 하나씩 바꾸어 떨어뜨리고 말뚝이 박힌 깊이를 비교하자. 수레의 질량·속력을 바꾸어 나무 도막이 밀려난 거리도 비교하자.
% 변인 통제: 질량을 바꿀 때 높이는 고정, 높이를 바꿀 때 질량은 고정

= 추로 말뚝 박기 | 실험 기록
| 질량 | 높이 | 위치 에너지 |
|+ 1 kg | 0.6 m | 5.9 J |
|+ 2 kg | 0.6 m | 11.8 J |
|+ 4 kg | 0.6 m | 23.5 J |
|+ 2 kg | 1.0 m | 19.6 J |
+ 질량 2배 → 위치 에너지 [[2배]], 높이가 커지면 위치 에너지도 [[커진다]]

= 중력에 의한 위치 에너지
! 위치 에너지 = 9.8 × 질량 × 높이
- 기준면으로부터 어떤 높이에 있는 물체가 가지는 에너지
- **질량**과 **높이**에 각각 ==비례==한다.
>+ 높이는 **기준면**에서 잰다 → 기준면을 바꾸면 위치 에너지도 달라진다.

= 예제 1 · 선반 위의 화분 | 적용
- 질량 3 kg인 화분이 바닥에서 2 m 높이 선반 위에 있다.
^+ 바닥 기준 위치 에너지 = 9.8 × 3 × 2 = **58.8 J**
- 높이 0.8 m인 책상 면을 기준면으로 하면?
^+ 기준면으로부터의 높이 = 2 − 0.8 = 1.2 m
^+ 9.8 × 3 × 1.2 = **35.28 J** (약 35.3 J)

= 확인 문제 1
Q 질량 5 kg인 물체가 지면에서 10 m 높이에 있다. 지면 기준 위치 에너지는?
o 50 J
o 98 J
o* 490 J
o 4900 J
:: 9.8 × 5 × 10 = 490 J

## 운동 에너지 | 움직임에 담긴 에너지

= 수레로 나무 도막 밀기 | 실험 기록
| 질량 | 속력 | 운동 에너지 |
|+ 2 kg | 1 m/s | 1 J |
|+ 2 kg | 2 m/s | 4 J |
|+ 2 kg | 4 m/s | 16 J |
|+ 4 kg | 2 m/s | 8 J |
+ 질량 2배 → [[2배]] / 속력 2배 → [[4배]] / 속력 4배 → [[16배]]

= 운동 에너지
! 운동 에너지 = ½ × 질량 × 속력²
- 운동하는 물체가 가지는 에너지
- **질량**에 비례하고, **속력의 제곱**에 비례한다.
||
C 질량 2 kg인 수레의 속력과 운동 에너지 | 속력 (m/s) | 운동 에너지 (J) | 운동 에너지:0,0 1,1 2,4 3,9 4,16

= 예제 2 · 자동차의 운동 에너지 | 적용
- 질량 1000 kg인 자동차가 10 m/s와 20 m/s로 달릴 때의 운동 에너지는?
^+ 10 m/s: ½ × 1000 × 10² = **50 000 J**
^+ 20 m/s: ½ × 1000 × 20² = **200 000 J**
>+ 속력 2배 → 운동 에너지 **4배**! 과속이 위험한 까닭

= 예제 3 · 한 일이 운동 에너지로 | 적용
- 마찰이 없는 바닥에 정지해 있던 질량 2 kg인 수레를 20 N의 힘으로 5 m 밀었다.
^+ 수레에 한 일 = 20 × 5 = **100 J**
^+ 한 일만큼 운동 에너지 증가 → ½ × 2 × v² = 100
^+ v² = 100 → **v = 10 m/s**

= 생활 속 위치 에너지와 운동 에너지 | 사례
* 💧 댐 :: 높은 곳에 모인 물의 위치 에너지로 발전
* 🔨 항타기 :: 높이 올린 추의 위치 에너지로 말뚝을 박는다
* 🚗 제동 거리 :: 속력 2배 → 운동 에너지 4배 → 제동 거리 약 4배
* 🌬️ 풍력 발전 :: 움직이는 공기의 운동 에너지로 날개를 돌린다
* 🎯 활쏘기 :: 화살의 운동 에너지가 과녁에 일을 한다
* ☄️ 운석 :: 매우 빠른 속력 때문에 큰 운동 에너지로 충돌 구덩이를 만든다

= 확인 문제 2
Q 질량 0.5 kg인 공이 4 m/s로 움직일 때 운동 에너지는?
o 1 J
o 2 J
o* 4 J
o 8 J
:: ½ × 0.5 × 4² = 4 J

= 확인 문제 3
Q 물체의 속력이 3배가 되면 운동 에너지는 몇 배가 되는가?
o 3배
o 6배
o* 9배
o 27배
:: 운동 에너지는 속력의 제곱에 비례 → 3² = 9배

= 확인 문제 4
Q 위치 에너지와 운동 에너지에 대한 설명으로 옳지 않은 것은?
o 위치 에너지는 질량과 높이에 비례한다
o 운동 에너지는 질량에 비례한다
o 에너지의 단위는 일과 같은 J이다
o* 위치 에너지는 기준면과 관계없이 항상 같다
:: 위치 에너지는 기준면으로부터의 높이로 구하므로 기준면에 따라 달라진다.

= 서술형 도전 | 생각 넓히기
? 자동차의 속력이 2배가 되면 제동 거리가 약 4배로 늘어난다. 운동 에너지와 관련지어 과속이 위험한 까닭을 쓰시오. :: 속력이 2배가 되면 운동 에너지는 4배가 되어, 멈추기 위해 브레이크가 해야 할 일도 4배가 된다. 그래서 멈추는 거리가 크게 늘고 충돌할 때 피해도 훨씬 커진다.
? 같은 선반 위의 화분이라도 기준면을 어디로 정하느냐에 따라 위치 에너지가 달라지는 까닭을 쓰시오. :: 위치 에너지는 기준면으로부터의 높이에 비례하므로, 기준면이 달라지면 높이가 달라지기 때문이다.

= 오늘 배운 내용 정리
- 일을 할 수 있는 능력 → [[에너지]] (단위 J)
- 위치 에너지 = 9.8 × [[질량]] × [[높이]]
- 운동 에너지 = ½ × 질량 × [[속력²]]
- 속력 2배 → 운동 에너지 [[4배]]
- 물체에 한 일만큼 물체의 [[에너지]]가 증가한다.

= 나가기 전 한 문제 | 형성평가
? 질량 2 kg인 공이 높이 5 m에 정지해 있을 때의 위치 에너지와, 같은 공이 10 m/s로 움직일 때의 운동 에너지를 각각 구하시오. :: 위치 에너지 = 9.8 × 2 × 5 = 98 J, 운동 에너지 = ½ × 2 × 10² = 100 J
