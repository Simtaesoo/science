# 일 | 과학에서 말하는 '일' | 중학교 과학 3 · 19 운동과 에너지 · 3차시 | 2022 개정 교육과정 [9과19]

= 오늘의 학습 목표 | 3차시
^ 과학에서 말하는 **일**의 뜻을 설명할 수 있다.
^ 힘과 이동 거리로 **일의 양**을 구할 수 있다.
^ **중력에 대해 한 일**과 일을 하지 않은 경우를 구별할 수 있다.
% 흐름: 생각 열기 5분 → 일의 뜻·단위 10분 → 시뮬레이션 10분 → 일이 0인 경우 5분 → 예제·문항 15분

= 이것도 '일'일까? | 생각 열기
* 📚 공부 :: 3시간 동안 열심히 문제를 풀었다
* 🧱 벽 밀기 :: 땀이 나도록 벽을 밀었지만 꿈쩍도 안 했다
* 🎒 가방 들기 :: 무거운 가방을 들고 가만히 서 있었다
* 📦 상자 끌기 :: 상자를 끌어 3 m 옮겼다
? 넷 중 과학에서 말하는 '일'을 한 것은? :: **상자 끌기**뿐! 과학에서의 일은 '힘을 주어 그 방향으로 물체를 이동시킨 것'이다.
% 학생 투표 → 오늘 수업 후 다시 투표해 결과 비교

= 지난 시간 복습 | 2차시
- 자유 낙하: 속력이 1초에 [[9.8]] m/s씩 증가
- 중력의 크기 = 9.8 × [[질량]]
? 질량 2 kg인 상자에 작용하는 중력은? :: 9.8 × 2 = **19.6 N** — 오늘 이 상자를 들어 올리는 '일'을 계산한다.

## 과학에서의 일 | 힘 × 이동 거리

= 일이란?
! 일 (J) = 힘 (N) × 힘의 방향으로 이동한 거리 (m)
- 물체에 ==힘==을 작용하여 그 ==힘의 방향==으로 물체를 이동시키는 것
- 단위: **J(줄)**
>+ 1 J: 1 N의 힘으로 물체를 힘의 방향으로 **1 m** 이동시킬 때 한 일

= 중력에 대해 한 일
- 물체를 일정한 속력으로 들어 올리려면 중력(9.8 × 질량)만큼의 힘이 필요하다.
! 중력에 대해 한 일 = 9.8 × 질량 × 높이
>+ 2 kg 상자를 2 m 들어 올리면: 9.8 × 2 × 2 = **39.2 J**
~ 무게 × 높이로 기억하자.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#work | 세 가지 경우를 [시작]하고, 한 일과 힘–이동 거리 그래프의 넓이를 비교하자.
% 세 번째 경우(들고 수평으로 걷기)에서 그래프 넓이가 0이 되는 장면을 강조

= 세 가지 경우 비교 | 시뮬레이션 기록
| 경우 | 힘 | 힘의 방향으로 이동한 거리 | 한 일 |
|+ 20 N으로 상자를 3 m 끌기 | 20 N | 3 m | [[60 J]] |
|+ 2 kg 상자를 2 m 들어 올리기 | 19.6 N | 2 m | [[39.2 J]] |
|+ 2 kg 상자를 들고 수평으로 3 m 걷기 | 19.6 N (위쪽) | 0 m | [[0 J]] |

= 힘–이동 거리 그래프 | 그래프 해석
C 20 N으로 상자를 3 m 끌 때 | 이동 거리 (m) | 힘 (N) | 힘:0,20 1,20 2,20 3,20
+ 그래프 아래 **넓이** = 20 N × 3 m = **60 J**
>+ 힘–이동 거리 그래프 아래의 넓이 = **한 일의 양**

## 일을 하지 않은 경우 | 힘들어도 일은 0

= 과학에서 일이 0인 경우
| 예 | 일이 0인 까닭 |
|+ 벽을 힘껏 밀었지만 움직이지 않음 | 이동 거리가 0 |
|+ 무거운 가방을 들고 가만히 서 있음 | 이동 거리가 0 |
|+ 가방을 들고 복도를 걸어감 | 힘의 방향과 이동 방향이 수직 |
|+ 마찰 없는 얼음판 위를 미끄러져 감 | 운동 방향으로 작용한 힘이 0 |

= 예제 1 · 수레 밀기 | 적용
- 50 N의 힘으로 수레를 밀어 4 m 이동시켰다. 한 일은?
^+ 일 = 힘 × 이동 거리
^+ 50 × 4 = **200 J**

= 예제 2 · 들어 올리기 | 적용
- 질량 10 kg인 물체를 1.5 m 높이까지 천천히 들어 올렸다. 중력에 대해 한 일은?
^+ 필요한 힘 = 9.8 × 10 = 98 N
^+ 일 = 98 × 1.5 = **147 J**

= 예제 3 · 계단 오르고 복도 걷기 | 적용
- 무게 98 N인 물체를 들고 계단 3 m 높이를 올라간 뒤 복도를 10 m 걸어갔다.
^+ 계단: 98 × 3 = **294 J**
^+ 복도: 힘(위쪽) ⊥ 이동(수평) → **0 J**
^+ 한 일의 총합 = **294 J**
>+ 10 m를 더 걸었어도 물체에 한 일은 늘지 않는다!

= 예제 4 · 힘 거꾸로 구하기 | 적용
- 상자를 밀어 4 m 이동시켰더니 한 일이 100 J이었다. 상자를 민 힘은?
^+ 힘 = 일 ÷ 이동 거리
^+ 100 ÷ 4 = **25 N**

= 생활 속 일 | 사례
* 🏋️ 역도 :: 바벨을 들어 올리는 순간은 일, 들고 버티는 동안은 일 0
* 🛒 카트 밀기 :: 미는 방향으로 이동 → 일을 한다
* 🏗️ 크레인 :: 무거운 자재를 높이 들어 올려 중력에 대해 일을 한다
* 🛗 엘리베이터 :: 사람을 들어 올리며 전동기가 일을 한다
* 🧗 암벽 등반 :: 자기 몸을 높이 들어 올리는 일
* 🛷 썰매 끌기 :: 끄는 방향으로 이동한 거리만큼 일

= 확인 문제 1
Q 30 N의 힘으로 물체를 힘의 방향으로 5 m 이동시켰을 때 한 일은?
o 6 J
o 35 J
o* 150 J
o 300 J
:: 30 × 5 = 150 J

= 확인 문제 2
Q 질량 5 kg인 물체를 2 m 높이로 천천히 들어 올릴 때 중력에 대해 한 일은?
o 10 J
o 49 J
o* 98 J
o 490 J
:: 9.8 × 5 × 2 = 98 J

= 확인 문제 3
Q 과학에서 일을 한 경우는?
o 벽을 힘껏 밀었지만 움직이지 않았다
o 무거운 가방을 들고 서 있었다
o 가방을 들고 복도를 걸어갔다
o* 책을 바닥에서 책상 위로 들어 올렸다
:: 책에 위쪽으로 힘을 주어 힘의 방향(위)으로 이동시켰으므로 일을 했다.

= 확인 문제 4
Q 힘–이동 거리 그래프에서 그래프 아래의 넓이가 뜻하는 것은?
o 속력
o 힘
o* 한 일의 양
o 질량
:: 넓이 = 힘 × 이동 거리 = 일

= 서술형 도전 | 생각 넓히기
? 가방을 들고 가만히 서 있으면 팔이 아프다. 과학에서는 일을 하지 않았는데도 힘든 까닭을 쓰시오. :: 가방에는 일을 하지 않았지만, 가방을 버티기 위해 근육이 계속 수축과 이완을 반복하며 몸속 에너지를 소비하기 때문이다.
? 같은 2 kg 상자를 1 m 들어 올린 경우와, 바닥에서 20 N의 힘으로 2 m 끈 경우 중 어느 쪽이 일을 더 많이 했는지 계산하여 비교하시오. :: 들어 올리기: 9.8 × 2 × 1 = 19.6 J, 끌기: 20 × 2 = 40 J → 끈 경우가 더 많은 일을 했다.

= 오늘 배운 내용 정리
- 일 = [[힘]] × 힘의 방향으로 [[이동한 거리]] (단위 [[J]])
- 중력에 대해 한 일 = 9.8 × 질량 × [[높이]]
- 힘–이동 거리 그래프 아래 넓이 = [[한 일의 양]]
- 이동 거리가 0이거나 힘과 이동 방향이 [[수직]]이면 일은 0

= 나가기 전 한 문제 | 형성평가
? 생각 열기의 네 가지(공부, 벽 밀기, 가방 들고 서 있기, 상자 끌기) 중 과학에서 일을 한 것을 고르고, 나머지가 일이 아닌 까닭을 쓰시오. :: 상자 끌기만 일이다. 공부는 물체를 힘의 방향으로 이동시키지 않았고, 벽 밀기와 가방 들고 서 있기는 이동 거리가 0이기 때문이다.
