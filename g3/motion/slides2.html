# 자유 낙하 운동 | 떨어지는 물체는 점점 빨라진다 | 중학교 과학 3 · 19 운동과 에너지 · 2차시 | 2022 개정 교육과정 [9과19]

= 오늘의 학습 목표 | 2차시
^ **자유 낙하 운동**에서 속력이 일정하게 증가함을 설명할 수 있다.
^ 물체에 작용하는 **중력의 크기**를 구할 수 있다.
^ 공기 저항이 없으면 **질량과 관계없이** 같은 운동을 함을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 자유 낙하(시뮬레이션) 10분 → 속력·중력 계산 15분 → 쇠공과 깃털 5분 → 문항 10분

= 무거운 것이 먼저 떨어질까? | 생각 열기
* 🎳 볼링공과 탁구공 :: 같은 높이에서 동시에 놓으면?
* 🪶 깃털 :: 천천히 하늘하늘 떨어진다
* 🪂 낙하산 :: 펼치면 천천히 내려온다
* 🌙 달의 실험 :: 우주인이 망치와 깃털을 동시에 떨어뜨렸다
? 볼링공과 탁구공을 같은 높이에서 동시에 놓으면 어느 것이 먼저 땅에 닿을까? :: 거의 **동시에** 닿는다. 공기 저항이 작으면 질량과 관계없이 같은 빠르기로 떨어진다.
% 실제로 두 공(무거운 공·가벼운 공)을 떨어뜨려 보여 주면 효과가 크다

= 지난 시간 복습 | 1차시
- 속력 = [[이동 거리]] ÷ [[걸린 시간]]
- 속력이 일정한 운동 → [[등속 운동]]
- 시간–속력 그래프 아래 넓이 = [[이동 거리]]
? 다중 섬광 사진에서 물체 사이 간격이 점점 넓어진다면? :: 같은 시간 동안 더 많이 이동한다 → 속력이 **증가**하는 운동이다. 오늘 배울 자유 낙하가 그렇다!

## 자유 낙하 운동 | 중력만 받아 떨어지기

= 자유 낙하 운동이란?
! 자유 낙하 운동: 정지해 있던 물체가 중력만 받아 떨어지는 운동
- 운동 방향 = 중력 방향(아래) → 속력이 ==계속 증가==
- 다중 섬광 사진에서 물체 사이 간격이 ==점점 넓어진다.==
>+ 운동 방향으로 일정한 크기의 힘(중력)을 계속 받기 때문

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#fall | [진공 속]을 켜고 쇠공을 떨어뜨려 0.2초 간격 위치와 속력 변화를 관찰하자. 질량을 바꾸어도 같은지 확인하자.
% 질량 1 kg ↔ 10 kg을 바꿔도 그래프가 겹치는 장면을 꼭 보여 주기

= 속력의 변화 | 시뮬레이션 기록
C 자유 낙하하는 물체의 시간–속력 | 시간 (s) | 속력 (m/s) | 속력:0,0 0.5,4.9 1,9.8 1.5,14.7 2,19.6
||
| 시간 (s) | 속력 (m/s) |
| 0 | 0 |
| 0.5 | 4.9 |
| 1 | 9.8 |
| 1.5 | 14.7 |
| 2 | 19.6 |
>+ 속력이 1초에 **9.8 m/s**씩 일정하게 증가한다.

= 중력 가속도 상수 9.8
! 1초마다 속력 증가량 = 9.8 m/s
- 9.8을 **중력 가속도 상수**라고 한다.
- t초 뒤 속력 = ==9.8 × t== (정지 상태에서 떨어뜨릴 때)
- 물체에 작용하는 **중력의 크기 = 9.8 × 질량** (단위 N)
>+ 질량 1 kg인 물체가 받는 중력 = **9.8 N**

= 예제 1 · 3초 뒤의 속력 | 적용
- 높은 곳에서 가만히 떨어뜨린 공의 3초 뒤 속력은? (공기 저항 무시)
^+ 1초마다 9.8 m/s씩 증가
^+ 9.8 × 3 = **29.4 m/s**
>+ 29.4 m/s × 3.6 ≈ 106 km/h — 고속도로 자동차만큼 빠르다!

= 예제 2 · 중력의 크기 | 적용
- 질량 2 kg인 물체와 10 kg인 물체에 작용하는 중력의 크기는?
^+ 2 kg: 9.8 × 2 = **19.6 N**
^+ 10 kg: 9.8 × 10 = **98 N**
>+ 무거운 물체가 중력을 5배 더 받지만, 떨어지는 속력의 변화는 **똑같이** 9.8 m/s씩!

= 예제 3 · 떨어진 거리 | 그래프 넓이
- 정지 상태에서 2초 동안 자유 낙하한 거리는?
^+ 시간–속력 그래프는 원점에서 시작하는 직선 → 넓이는 **삼각형**
^+ 넓이 = ½ × 2 s × 19.6 m/s = **19.6 m**
^+ 1초 동안은 ½ × 1 × 9.8 = **4.9 m** → 시간이 2배면 거리는 **4배**
>+ 같은 시간 간격마다 떨어지는 거리가 늘어난다 — 섬광 사진 간격이 넓어지는 까닭

## 질량과 공기 저항 | 쇠공과 깃털

= 쇠공과 깃털 | 비교
| 구분 | 공기 중 | 진공 속 |
|+ 먼저 떨어지는 것 | 쇠공 | [[동시에 떨어짐]] |
|+ 까닭 | 깃털은 공기 저항을 크게 받음 | 공기 저항이 없어 질량과 관계없이 같은 운동 |
>+ 공기 저항이 없으면 모든 물체는 질량과 관계없이 속력이 1초에 9.8 m/s씩 증가한다.

= 무거운데 왜 똑같이 떨어질까?
+ 질량이 큰 물체는 중력을 **크게** 받는다.
+ 하지만 질량이 큰 물체는 그만큼 운동 상태를 **바꾸기도 어렵다.**
+ 두 효과가 상쇄되어 속력이 증가하는 정도(9.8 m/s씩)는 **같다.**
~ 볼링공을 밀 때와 탁구공을 밀 때를 떠올려 보자 — 같은 힘이면 무거운 공은 덜 빨라진다.

= 생활 속 자유 낙하 | 사례
* 🎢 자이로드롭 :: 꼭대기에서 떨어지는 동안 자유 낙하에 가깝다
* 🪂 스카이다이빙 :: 처음엔 빨라지다가 공기 저항이 커져 일정한 속력이 된다
* 🍎 뉴턴의 사과 :: 떨어지는 사과에서 중력을 생각해 냈다
* 🌧️ 빗방울 :: 공기 저항 때문에 아주 빨라지지 않는다 (다행!)
* 🌙 달의 망치와 깃털 :: 공기가 없어 동시에 떨어졌다
* 🏗️ 공사장 안전모 :: 떨어지는 물체는 아래로 갈수록 빨라져 위험하다

= 확인 문제 1
Q 자유 낙하하는 물체의 속력 변화에 대한 설명으로 옳은 것은? (공기 저항 무시)
o 일정하다
o* 1초에 9.8 m/s씩 증가한다
o 1초에 9.8 m/s씩 감소한다
o 질량이 클수록 빨리 증가한다
:: 중력만 받으므로 질량과 관계없이 속력이 1초에 9.8 m/s씩 증가한다.

= 확인 문제 2
Q 질량 5 kg인 물체에 작용하는 중력의 크기는?
o 5 N
o 9.8 N
o* 49 N
o 98 N
:: 9.8 × 5 = 49 N

= 확인 문제 3
Q 정지 상태에서 떨어뜨린 물체의 속력이 39.2 m/s가 되는 데 걸린 시간은? (공기 저항 무시)
o 2초
o 3초
o* 4초
o 5초
:: 39.2 ÷ 9.8 = 4초

= 확인 문제 4
Q 진공 속에서 쇠공과 깃털을 같은 높이에서 동시에 놓았을 때의 결과는?
o 쇠공이 먼저 떨어진다
o 깃털이 먼저 떨어진다
o* 동시에 떨어진다
o 깃털은 떠 있는다
:: 공기 저항이 없으므로 질량과 관계없이 같은 운동을 한다.

= 서술형 도전 | 생각 넓히기
? 자유 낙하하는 물체의 다중 섬광 사진에서 물체 사이의 간격은 어떻게 변하는지, 그 까닭과 함께 쓰시오. :: 점점 넓어진다. 속력이 증가하여 같은 시간 동안 이동하는 거리가 늘어나기 때문이다.
? 달의 중력은 지구의 약 1/6이다. 달에서 물체를 떨어뜨리면 지구와 무엇이 다른지 쓰시오. :: 달에는 공기가 거의 없어 망치와 깃털이 동시에 떨어지고, 속력이 1초에 약 1.6 m/s씩만 증가하여 지구보다 천천히 빨라진다.

= 오늘 배운 내용 정리
- 정지한 물체가 중력만 받아 떨어지는 운동 → [[자유 낙하 운동]]
- 속력이 1초에 [[9.8]] m/s씩 일정하게 증가한다.
- 중력의 크기 = 9.8 × [[질량]]
- 공기 저항이 없으면 [[질량]]과 관계없이 같은 운동
- 시간–속력 그래프 아래 넓이 = [[떨어진 거리]]

= 나가기 전 한 문제 | 형성평가
