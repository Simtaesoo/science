= 지난 시간 복습 | 4차시
| 에너지 | 뜻 | 식 |
| 위치 에너지 | 높은 곳에 있는 물체가 가진 에너지 | 9.8 × m × h |

## 역학적 에너지 전환 | 위치 에너지 ⇄ 운동 에너지

= 역학적 에너지란?
! 역학적 에너지 = 위치 에너지 + 운동 에너지
- 물체가 올라가면 ==운동 에너지 → 위치 에너지==
- 물체가 떨어지면 ==위치 에너지 → 운동 에너지==
> 에너지가 한 형태에서 다른 형태로 바뀌는 것을 **에너지 전환**이라고 한다.

= 떨어지는 공의 에너지 장부 | 질량 1 kg, 높이 10 m에서 가만히 놓았다
| 높이 (m) | 위치 에너지 (J) | 운동 에너지 (J) | 합 (J) |
|+ 10 | 98 | 0 | 98 |
|+ 7.5 | 73.5 | 24.5 | 98 |
|+ 5 | 49 | 49 | 98 |
|+ 2.5 | 24.5 | 73.5 | 98 |
|+ 0 | 0 | 98 | 98 |
>+ 위치 에너지가 줄어든 만큼 운동 에너지가 늘어난다. 합은 언제나 **98 J**!

= 그래프로 보면 | 높이에 따른 에너지 (1 kg, 10 m)
C 높이가 낮아질수록 위치 에너지는 줄고 운동 에너지는 는다 | 높이 (m) | 에너지 (J) | 위치 에너지:0,0 2.5,24.5 5,49 7.5,73.5 10,98 | 운동 에너지:10,0 7.5,24.5 5,49 2.5,73.5 0,98 | 역학적 에너지:0,98 10,98
~ 두 직선은 높이 5 m에서 만난다 — 이 높이에서 위치 에너지 = 운동 에너지

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#mech | 진자 · 자유 낙하 · 위로 던지기를 바꿔 가며 막대 합이 일정한지 확인하자.
% 마찰 끔 → 켬 순서로 보여 주고, 열 막대가 생기는 순간을 강조

= 생활 속 에너지 전환 | 사례
* 🎢 롤러코스터 :: 내려갈 때 위치 → 운동, 올라갈 때 운동 → 위치
* 🕰️ 시계추 :: 가장 낮은 곳에서 가장 빠르고, 양 끝에서 잠시 멈춘다
* ⛷️ 스키 점프 :: 활강로를 내려오며 얻은 운동 에너지로 멀리 난다
* 🏀 위로 던진 공 :: 올라가며 느려지고 최고점에서 순간 정지
* 🤸 트램펄린 :: 위치·운동·탄성 에너지가 번갈아 전환
* 💧 수력 발전 :: 댐의 물: 위치 → 운동 → 전기 에너지

= 확인 문제 1
Q 진자가 가장 빠르게 움직이는 곳은?
o 가장 높은 양 끝
o* 가장 낮은 지점
o 높이의 절반 지점
o 어디서나 같다
:: 가장 낮은 지점에서 위치 에너지가 가장 작으므로, 그만큼 운동 에너지가 가장 크다.

## 역학적 에너지 보존 | 마찰이 없다면 합은 일정하다

= 역학적 에너지 보존 법칙
! 위치 에너지 + 운동 에너지 = 일정
- 공기 저항과 마찰이 없을 때 성립한다.
+ 두 지점 1, 2에서
!+ 9.8mh₁ + ½mv₁² = 9.8mh₂ + ½mv₂²
>+ 감소한 위치 에너지 = 증가한 운동 에너지

= 예제 1 · 바닥에서의 속력 | 적용
- 질량 2 kg인 공을 높이 10 m에서 가만히 떨어뜨렸다. (공기 저항 무시)
^+ 처음 역학적 에너지 = 9.8 × 2 × 10 = **196 J**
^+ 바닥 직전: 위치 에너지 0 → 운동 에너지 = **196 J**
^+ ½ × 2 × v² = 196 → v² = 196 → **v = 14 m/s**
>+ 질량이 달라도 바닥 속력은 같다! v² = 2 × 9.8 × h (질량 m이 양변에서 지워진다)

= 예제 2 · 중간 지점의 속력 | 적용
- 같은 공(2 kg, 10 m)이 높이 5 m를 지날 때 속력은?
^+ 위치 에너지 = 9.8 × 2 × 5 = 98 J
^+ 운동 에너지 = 196 − 98 = 98 J
^+ ½ × 2 × v² = 98 → v = √98 ≈ **9.9 m/s**
>+ 높이가 절반이라고 속력이 절반(7 m/s)인 것은 아니다 — 절반이 되는 것은 **에너지**!

= 예제 3 · 위로 던진 공 | 적용
- 공을 14 m/s로 똑바로 위로 던졌다. 최고 높이는? (공기 저항 무시)
^+ 최고점에서 속력 0 → 운동 에너지가 모두 위치 에너지로
^+ ½ × m × 14² = 9.8 × m × h
^+ 98 = 9.8 × h → **h = 10 m**
>+ 예제 1을 거꾸로 돌린 것! 10 m에서 떨어지면 14 m/s, 14 m/s로 던지면 10 m.

= 예제 4 · 롤러코스터 에너지 장부 | 열차 500 kg, A에서 정지 출발, 마찰 무시
| 지점 | 높이 | 위치 에너지 | 운동 에너지 |
| A (출발) | 40 m | 196 000 J | 0 J |
|+ B (골짜기) | 10 m | 49 000 J | [[147 000 J]] |
|+ C (둘째 언덕) | 25 m | 122 500 J | [[73 500 J]] |
? 둘째 언덕을 45 m로 만들면 어떻게 될까? :: 처음 높이 40 m보다 높으므로 넘지 못하고 되돌아온다. (마찰이 없어도 처음 높이까지만 올라갈 수 있다)

= 확인 문제 2
Q 높이 20 m에서 가만히 떨어뜨린 물체가 바닥에 닿기 직전의 속력은? (공기 저항 무시)
o 14 m/s
o* 약 19.8 m/s
o 20 m/s
o 196 m/s
:: v² = 2 × 9.8 × 20 = 392 → v ≈ 19.8 m/s. 질량은 몰라도 된다!

= 확인 문제 3
Q 질량 1 kg인 물체가 높이 5 m에서 3 m까지 미끄러져 내려왔다. 증가한 운동 에너지는? (마찰 무시)
o* 19.6 J
o 29.4 J
o 49 J
o 2 J
:: 감소한 위치 에너지 = 9.8 × 1 × (5 − 3) = 19.6 J만큼 운동 에너지가 증가한다.

## 마찰이 있다면? | 사라진 에너지를 찾아라

= 튀어 오르는 공은 왜 점점 낮아질까?
C 공 튀기기 (튈 때마다 높이의 약 70 %만 회복) | 튄 횟수 | 최고 높이 (m) | 최고 높이:0,1 1,0.7 2,0.49 3,0.34 4,0.24 5,0.17
+ 충돌·공기 저항 때문에 역학적 에너지가 조금씩 줄어든다.
+ 줄어든 에너지는 **열에너지, 소리 에너지** 등으로 전환된다.
>+ 역학적 에너지는 줄어도 **전체 에너지는 보존**된다.

= 마찰이 있을 때의 에너지 | 사례
* 🚲 자전거 브레이크 :: 운동 에너지 → 마찰열 (브레이크가 뜨거워짐)
* 🛝 미끄럼틀 :: 내려오면 엉덩이가 따뜻 → 일부가 열로
* ☄️ 유성 :: 대기와의 마찰로 운동 에너지가 빛·열로
* 🚗 회생 제동 :: 전기차는 줄어드는 운동 에너지를 전기로 되돌려 충전

= 확인 문제 4
Q 높이 5 m 미끄럼틀을 질량 20 kg인 어린이가 내려와 바닥에서 속력이 7 m/s였다. 열 등으로 전환된 에너지는?
o 0 J
o* 490 J
o 980 J
o 1470 J
:: 처음 위치 에너지 9.8 × 20 × 5 = 980 J − 바닥 운동 에너지 ½ × 20 × 7² = 490 J → 490 J이 열·소리 에너지로 전환

= 확인 문제 5 · 그래프 해석
Q 마찰이 없는 진자 운동에 대한 설명으로 옳은 것은?
o 위치 에너지와 운동 에너지가 동시에 최대가 된다
o* 위치 에너지가 최대일 때 운동 에너지는 최소이다
o 역학적 에너지가 점점 줄어든다
o 운동 에너지는 항상 일정하다
:: 둘의 합이 일정하므로 한쪽이 최대일 때 다른 쪽은 최소이다.

= 서술형 도전 | 생각 넓히기
? 자이로드롭은 약 70 m 높이에서 떨어진다. 마찰이 없다면 바닥에서의 속력은? 실제로는 어떻게 멈출까? :: v² = 2 × 9.8 × 70 → v ≈ 37 m/s(약 133 km/h). 바닥 근처의 자석 제동 장치가 운동 에너지를 열에너지로 바꾸어 멈춘다.
? 높이 10 m에서 떨어진 공이 다시 6 m까지 튀어 올랐다. 처음 역학적 에너지의 몇 %가 다른 에너지로 바뀌었나? :: 위치 에너지는 높이에 비례 → 6/10만 남음 → 40 %가 열·소리 에너지로 전환

= 오늘 배운 내용 정리
- 역학적 에너지 = [[위치 에너지]] + [[운동 에너지]]
- 높은 곳에서 떨어지면 위치 에너지가 [[운동 에너지]]로 전환된다.
- 마찰이 없으면 역학적 에너지는 [[보존]]된다 (일정하다).
- 바닥 속력 v² = 2 × 9.8 × [[h]] → 질량과 [[무관]]하다.
- 마찰이 있으면 일부가 [[열에너지]]로 → 그래도 전체 에너지는 보존

= 나가기 전 한 문제 | 형성평가
? 롤러코스터의 첫 언덕을 가장 높게 만드는 까닭을 '역학적 에너지 보존'을 넣어 한 문장으로 쓰시오. :: 역학적 에너지가 보존되어도 처음 높이보다 높이 올라갈 수 없고, 실제로는 마찰로 에너지가 줄어들기 때문에 이후 언덕은 첫 언덕보다 낮아야 한다.
