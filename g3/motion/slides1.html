# 속력과 등속 운동 | 일정한 빠르기로 움직이기 | 중학교 과학 3 · 19 운동과 에너지 · 1차시 | 2022 개정 교육과정 [9과19-01]

= 오늘의 학습 목표 | 1차시
^ **속력**을 구하고 단위를 바꿀 수 있다.
^ **등속 운동**의 뜻을 알고 다중 섬광 사진으로 설명할 수 있다.
^ 등속 운동을 **그래프**로 나타내고 기울기와 넓이를 해석할 수 있다.
% 흐름: 생각 열기 5분 → 속력·단위 10분 → 등속 운동(시뮬레이션) 10분 → 그래프 해석 10분 → 문항 10분

= 누가 더 빠를까? | 생각 열기
* 🏃 100 m 달리기 :: 기록이 짧을수록 빠르다
* 🚄 KTX :: 시속 300 km로 달린다
* 🐆 치타 :: 순간적으로 시속 100 km 이상
* 🚶 무빙워크 :: 가만히 서 있어도 일정한 빠르기로 움직인다
? '100 m를 12초'인 친구와 '200 m를 25초'인 친구 중 누가 더 빠를까? :: 같은 시간(1초) 동안 간 거리로 비교한다. 100 ÷ 12 ≈ 8.3 m/s, 200 ÷ 25 = 8 m/s → **100 m 친구**가 조금 더 빠르다.
% 거리와 시간이 모두 다를 때는 '단위 시간당 거리'로 맞춰야 한다는 점을 끌어내기

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 힘 | 물체의 모양이나 운동 상태를 바꾸는 원인 (단위 N) |
| 중력 | 지구가 물체를 당기는 힘 |
| 운동 상태 | 빠르기와 운동 방향 |
? 정지해 있던 수레를 밀면 무엇이 변할까? :: 수레의 **운동 상태**(빠르기·방향)가 변한다. 오늘은 그 '빠르기'를 숫자로 나타내 본다.

## 속력 | 빠르기를 숫자로

= 속력이란?
! 속력 = 이동 거리 ÷ 걸린 시간
- 물체의 빠르기 = ==단위 시간 동안 이동한 거리==
- 단위: **m/s**(초속), **km/h**(시속)
- **평균 속력**: 전체 이동 거리 ÷ 걸린 전체 시간
>+ 36 km/h = 36 000 m ÷ 3600 s = **10 m/s**

= 단위 바꾸기 | km/h ⇄ m/s
| km/h | 계산 | m/s |
|+ 36 | 36 000 ÷ 3600 | 10 |
|+ 72 | 72 000 ÷ 3600 | 20 |
|+ 54 | 54 000 ÷ 3600 | [[15]] |
|+ 108 | 108 000 ÷ 3600 | [[30]] |
>+ 요령: km/h ÷ **3.6** = m/s, m/s × **3.6** = km/h

= 예제 1 · 속력 구하기 | 적용
- 100 m를 20초에 달린 학생의 평균 속력은?
^+ 100 m ÷ 20 s = **5 m/s**
- 집에서 3 km 떨어진 도서관까지 자전거로 15분 만에 갔다. 평균 속력은 몇 km/h?
^+ 15분 = 0.25 h
^+ 3 km ÷ 0.25 h = **12 km/h**

## 등속 운동 | 속력이 변하지 않는 운동

= 등속 운동
! 등속 운동: 속력이 일정한 운동
- 다중 섬광 사진에서 물체 사이의 간격이 ==일정하다.==
| 시간 (s) | 0 | 1 | 2 | 3 | 4 |
|+ 이동 거리 (m) | 0 | 1.5 | 3.0 | 4.5 | 6.0 |
|+ 속력 (m/s) | 1.5 | 1.5 | 1.5 | 1.5 | 1.5 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#uniform | 속력 1.5 m/s로 수레를 출발시키고, 0.5초 간격 위치와 그래프를 관찰하자. 속력을 바꾸면 그래프의 무엇이 달라질까?
% 속력 1.5 → 3 m/s로 바꾸어 거리–시간 그래프 기울기가 2배가 되는 것을 보여 주기

= 등속 운동의 그래프 | 그래프 해석
C 시간–이동 거리 (속력 1.5 m/s) | 시간 (s) | 이동 거리 (m) | 이동 거리:0,0 1,1.5 2,3 3,4.5 4,6
||
C 시간–속력 (속력 1.5 m/s) | 시간 (s) | 속력 (m/s) | 속력:0,1.5 1,1.5 2,1.5 3,1.5 4,1.5
+ 거리 그래프: 원점을 지나는 직선, **기울기 = 속력**
+ 속력 그래프: 시간축에 나란한 직선, **넓이 = 이동 거리**

= 예제 2 · 그래프 넓이로 거리 구하기 | 적용
- 시간–속력 그래프가 속력 1.5 m/s에서 4초 동안 수평이다. 이동 거리는?
^+ 그래프 아래 넓이 = 가로 × 세로
^+ 4 s × 1.5 m/s = **6 m**
>+ 표의 4초 때 이동 거리 6.0 m와 같다 ✔

= 예제 3 · 누가 더 빠를까? | 그래프 해석
- A는 5초에 20 m, B는 5초에 10 m를 등속으로 이동했다.
^+ A의 속력 = 20 ÷ 5 = **4 m/s**
^+ B의 속력 = 10 ÷ 5 = **2 m/s**
^+ 거리–시간 그래프에서 기울기가 큰 **A가 더 빠르다.**
||
C 두 물체의 시간–이동 거리 | 시간 (s) | 이동 거리 (m) | A:0,0 1,4 2,8 3,12 4,16 5,20 | B:0,0 5,10

= 예제 4 · 이동 거리 구하기 | 적용
- 72 km/h로 등속 운동하는 자동차가 30초 동안 이동한 거리는?
^+ 72 km/h ÷ 3.6 = **20 m/s**
^+ 이동 거리 = 속력 × 시간 = 20 × 30 = **600 m**
>+ 단위를 먼저 맞추는 것이 핵심! (km/h와 초를 그대로 곱하면 틀린다)

= 생활 속 속력과 등속 운동 | 사례
* 🚶 무빙워크 :: 일정한 속력으로 움직여 등속 운동에 가깝다
* 🛗 에스컬레이터 :: 출발·정지 순간을 빼면 거의 등속
* 📦 컨베이어 벨트 :: 공장에서 물건을 일정한 빠르기로 옮긴다
* 🚗 크루즈 컨트롤 :: 고속도로에서 설정한 속력을 유지한다
* 📸 구간 단속 :: 두 지점 사이의 평균 속력으로 과속을 잡는다
* ⚡ 번개와 천둥 :: 소리 속력 약 340 m/s로 거리를 짐작한다

= 확인 문제 1
Q 54 km/h는 몇 m/s인가?
o 5.4 m/s
o* 15 m/s
o 54 m/s
o 194.4 m/s
:: 54 000 m ÷ 3600 s = 15 m/s (54 ÷ 3.6 = 15)

= 확인 문제 2
Q 10 m/s로 등속 운동하는 물체가 2분 동안 이동한 거리는?
o 20 m
o 200 m
o* 1200 m
o 12 000 m
:: 2분 = 120 s → 10 × 120 = 1200 m

= 확인 문제 3
Q 등속 운동하는 물체에 대한 설명으로 옳지 않은 것은?
o 다중 섬광 사진에서 물체 사이 간격이 일정하다
o 시간–속력 그래프는 시간축에 나란하다
o* 시간–이동 거리 그래프는 시간축에 나란하다
o 시간–이동 거리 그래프의 기울기는 속력이다
:: 등속 운동의 시간–이동 거리 그래프는 원점을 지나는 기울어진 직선이다. 시간축에 나란하면 정지한 물체이다.

= 확인 문제 4
Q 번개가 친 뒤 3초 후에 천둥소리를 들었다. 번개가 친 곳까지의 거리는? (소리의 속력 340 m/s)
o 113 m
o 340 m
o* 1020 m
o 3400 m
:: 340 × 3 = 1020 m (빛은 거의 즉시 도착한다고 본다)

= 서술형 도전 | 생각 넓히기
? 할머니 댁까지 60 km를 갈 때 1시간, 올 때 2시간 걸렸다. 왕복 평균 속력이 45 km/h가 아닌 까닭과 바른 값을 쓰시오. :: 평균 속력은 전체 이동 거리 ÷ 전체 시간이므로 120 km ÷ 3 h = 40 km/h이다. 갈 때(60 km/h)와 올 때(30 km/h) 속력의 평균을 내면 안 된다.
? 생활 속에서 등속 운동에 가까운 예를 하나 쓰고, 완전한 등속 운동이 되기 어려운 까닭을 쓰시오. :: 무빙워크·에스컬레이터·컨베이어 벨트 등. 마찰력이나 공기 저항이 작용하고 출발·정지할 때 속력이 변하기 때문이다.

= 오늘 배운 내용 정리
- 속력 = [[이동 거리]] ÷ [[걸린 시간]] (m/s, km/h)
- 36 km/h = [[10]] m/s (km/h ÷ 3.6 = m/s)
- 속력이 일정한 운동 → [[등속 운동]]
- 시간–이동 거리 그래프의 기울기 = [[속력]]
- 시간–속력 그래프 아래 넓이 = [[이동 거리]]

= 나가기 전 한 문제 | 형성평가
? 36 km/h로 등속 운동하는 자전거가 5분 동안 이동한 거리를 구하시오. :: 36 km/h = 10 m/s, 5분 = 300 s → 10 × 300 = 3000 m (= 3 km)
