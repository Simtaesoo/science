* 📸 플래시 충전 :: 다시 터뜨리려면 몇 초 기다려야 한다

## 충전과 방전 | 전압과 전류의 시간 변화

= 충전 과정
| 시점 | 축전기 전압 | 저항 전압 | 전류 |
|+ 스위치를 닫는 순간 | 0 | ε | [[ε/R]] (최대) |
|+ 충전 중 | 증가 | 감소 | [[감소]] |
|+ 충전 완료 | [[ε]] | 0 | [[0]] |
>+ 키르히호프 법칙: ε = V저항 + V축전기 = IR + Q/C

= 충전·방전의 식
! 충전 V(t) = ε(1 − e^(−t/RC))
! 방전 V(t) = V₀e^(−t/RC)
- 전류는 충전·방전 모두 처음에 가장 크고 ==지수적으로 감소==
- 방전 전류의 방향은 충전 전류와 [[반대]]

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#rc | R = 5 kΩ, C = 400 μF, 전원 12 V에서 충전 → 방전을 실행하고 전압·전류 그래프를 관찰하자. R과 C를 바꾸어 빠르기도 비교하자.
% τ = 2 s이므로 5τ = 10 s면 거의 충전 완료 — 초시계로 함께 세기

| 시간 | 0 | τ | 2τ | 3τ | 5τ |
|+ 충전 전압 (V) | 0 | 7.59 | [[10.38]] | [[11.40]] | 11.92 |
|+ 방전 전압 (V) | 12 | 4.41 | [[1.62]] | [[0.60]] | 0.08 |
- 시간 상수 τ = [[2.00]] s, 충전 시작 전류 = [[2.40]] mA

C 충전·방전 곡선 (ε = 12 V) | 시간 (s) | 축전기 전압 (V) | 충전:0,0 1,4.72 2,7.59 3,9.32 4,10.38 6,11.4 8,11.78 10,11.92 | 방전:0,12 1,7.28 2,4.41 3,2.68 4,1.62 6,0.6 8,0.22 10,0.08

## 시간 상수 | 얼마나 빨리 충전될까

= 시간 상수
! τ = RC (단위: 초)
| τ만큼 지났을 때 | 값 |
|+ 충전 | 최종값의 약 [[63 %]] |
|+ 방전 | 처음 값의 약 [[37 %]] |
|+ 5τ 뒤 | 거의 완료 (99 % 이상) |
- R이나 C가 클수록 τ가 커져 충전·방전이 ==느리다.==

= 예제 1 · 시간 상수 | 적용
- R = 10 kΩ, C = 100 μF
^+ τ = RC = 10⁴ × 10⁻⁴ = **1 s**
^+ 저항만 2배 → τ = **2 s**
^+ 1 s 뒤 충전 전압은 최종값의 약 **63 %**

= 예제 2 · 충전 시작 전류 | 적용
- 12 V 전원, R = 5 kΩ, C = 400 μF, 처음에 축전기가 비어 있다.
^+ 스위치를 닫는 순간 축전기 전압 0 → 저항 전압 **12 V**
^+ I₀ = ε/R = 12 ÷ 5000 = **2.4 × 10⁻³ A** (2.4 mA)
^+ τ = 5000 × 400 × 10⁻⁶ = **2 s**

= 예제 3 · 방전 | 적용
- 12 V로 충전된 축전기(τ = 2 s)를 저항으로 방전시킨다.
^+ 2 s(τ) 뒤: 12 × 0.37 ≈ **4.4 V**
^+ 4 s(2τ) 뒤: 12 × 0.37² ≈ **1.6 V**
^+ 남은 에너지: (1.6/12)² ≈ 1.8 % → 대부분 **저항에서 열**로 소모

= 확인 문제 1
Q 충전이 시작되는 순간 RC 회로에 흐르는 전류는?
o 0이다
o* ε/R로 가장 크다
o 시간에 따라 증가한다
o ε/C이다
:: 처음에는 축전기 전압이 0이므로 전원 전압이 모두 저항에 걸린다.

= 확인 문제 2
Q R = 2 kΩ, C = 500 μF인 회로의 시간 상수는?
o 0.1 s
o* 1 s
o 10 s
o 1000 s
:: 2000 × 500 × 10⁻⁶ = 1 s

= 확인 문제 3
Q 충전이 끝난 뒤 회로에 전류가 흐르지 않는 까닭은?
o 저항이 무한대가 되어서
o* 축전기 전압이 전원 전압과 같아져서
o 전원이 꺼져서
o 축전기가 방전되어서
:: 저항 양단 전압이 0 → 전류 0

= 확인 문제 4
Q 방전 중 τ만큼 시간이 지났을 때 축전기 전압은 처음 값의 약 몇 %인가?
o 63 %
o 50 %
o* 37 %
o 0 %
:: e⁻¹ ≈ 0.37

= 확인 문제 5
Q 충전·방전을 느리게 하려면?
o R과 C를 모두 줄인다
o* R이나 C를 키운다
o 전원 전압을 높인다
o 전원 전압을 낮춘다
:: τ = RC가 커지면 느려진다. 전원 전압은 τ와 관계없다.

= 생활 속 RC 회로 | 사례
* 🌧️ 간헐 와이퍼 :: RC 충전 시간으로 작동 간격 조절
* 🚗 실내등 페이드 :: 방전 곡선을 따라 서서히 어두워짐
* 📸 플래시 :: 충전 대기 시간 = 시간 상수의 몇 배
* ❤️ 심장 박동기 :: RC 타이머로 일정한 박동 신호
* 🎛️ 터치 센서 :: 손가락에 따른 충전 시간 변화 측정
* 🔊 음향 필터 :: 특정 진동수의 신호를 걸러 낸다

= 서술형 도전 | 생각 넓히기
? 충전 중인 축전기의 전압–시간 그래프와 전류–시간 그래프의 모양을 비교하여 설명하시오. :: 전압은 0에서 시작해 점점 느리게 증가하며 전원 전압에 가까워지고, 전류는 최댓값 ε/R에서 시작해 지수적으로 감소하여 0에 가까워진다.
? 간헐 와이퍼의 작동 간격을 길게 하려면 RC 회로에서 무엇을 바꾸면 되는지 제안하시오. :: 축전기가 일정 전압까지 충전될 때마다 와이퍼가 한 번 움직이도록 하면, 저항이나 전기 용량을 키워 시간 상수 RC를 크게 할수록 충전 시간이 길어져 간격이 길어진다.
