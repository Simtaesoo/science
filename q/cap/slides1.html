# 축전기의 전기 용량 | 전하를 담는 그릇 | 고등학교 전자기와 양자 · 03 회로 소자와 에너지 · 심화 | 2022 개정 교육과정 [교육과정 밖 심화]

= 오늘의 학습 목표 | 심화
^ **전기 용량**의 뜻을 알고 Q = CV로 전하량을 구할 수 있다.
^ 평행판 축전기의 전기 용량을 결정하는 **요인**(넓이, 간격, 유전체)을 설명할 수 있다.
^ 축전기에 **저장된 에너지**를 구할 수 있다.
% 흐름: 생각 열기 5분 → 전기 용량 8분 → 간격과 전기 용량(시뮬레이션) 12분 → 유전체·에너지 10분 → 계산·문항 10분
% [교육과정 확인] 2022 개정 '전자기와 양자' [12전자01-06]은 저항·축전기·인덕터를 활용하는 장치를 에너지 관점에서 정성적으로 설명하는 수준이다. 이 차시의 전기 용량(C = εA/d), 유전체, 에너지(½CV²) 계산은 교육과정 밖 심화 내용으로, 선택적으로 활용하고 평가에 넣지 않는다.

= 순간적으로 번쩍! | 생각 열기
* 📸 카메라 플래시 :: 건전지로는 낼 수 없는 강한 빛을 순간적으로
* ❤️ 심장 제세동기 :: 큰 전류를 한순간에 흘려보낸다
* 📱 터치스크린 :: 손가락이 닿은 위치를 알아챈다
* 🔌 전자 기판 :: 작은 원통·납작한 부품이 가득
? 플래시는 어떻게 짧은 순간에 큰 에너지를 낼까? :: **축전기**에 전하를 모아 두었다가 한꺼번에 내보내기 때문이다.

= 지난 시간 복습 | 01 전기장과 전위
- 균일한 전기장 E = [[V/d]]
- 전기력이 하는 일 W = [[qΔV]]
- 평행판 사이 전기장은 [[균일]]하다.
? 평행판에 전지를 연결하면 두 판에는 무엇이 쌓일까? :: 한 판에는 +Q, 다른 판에는 −Q — 크기가 같고 부호가 반대인 전하

## 전기 용량 | 얼마나 담을 수 있나

= 전기 용량
! Q = CV
- 저장되는 전하량은 전압에 ==비례==
- C: 전기 용량, 단위 [[F (패럿)]] = C/V
- 1 μF = 10⁻⁶ F, 1 pF = 10⁻¹² F
>+ 같은 전압에서 C가 클수록 전하를 **많이** 담는다.

= 평행판 축전기
! C = κε₀A / d
| 요인 | 전기 용량 |
|+ 극판 넓이 A | [[비례]] |
|+ 극판 간격 d | [[반비례]] |
|+ 유전체 (유전율 κ) | [[κ배]] |
~ ε₀ = 8.85 × 10⁻¹² F/m (진공의 유전율), 공기 κ ≈ 1, 종이 κ ≈ 3.7

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#cap | 극판 넓이 0.02 m², 공기, 전압 6 V에서 간격을 바꾸며 C와 Q를 기록하자. 종이를 넣거나 전지를 떼어 낸 뒤 간격도 바꿔 보자.
% '전지 연결 → V 일정', '전지 분리 → Q 일정'을 판서로 구분

= 간격과 전기 용량 | 시뮬레이션 기록 (A = 0.02 m², 6 V)
| 간격 (mm) | 1 | 2 | 3 | 4 |
|+ C (pF) | 177.0 | [[88.5]] | [[59.0]] | [[44.2]] |
|+ Q (nC) | 1.06 | [[0.53]] | 0.35 | 0.27 |
||
C 간격에 따른 전기 용량 | 간격 (mm) | 전기 용량 (pF) | 전기 용량:1,177 1.5,118 2,88.5 3,59 4,44.2
- 간격 2배 → C [[1/2]]배

## 유전체와 에너지 | 더 많이, 그리고 저장

= 유전체
- 극판 사이에 절연체(유전체)를 넣으면 ==유전 분극==이 일어난다.
- 분극된 전하가 판 사이 전기장을 약하게 → 같은 전하에서 전압이 낮아짐 → C가 [[κ배]]
| 2 mm, 6 V | 공기 | 종이 (κ = 3.7) |
|+ C (pF) | 88.5 | [[327.5]] |
|+ Q (nC) | 0.53 | [[1.96]] |

= 저장된 에너지
! U = ½QV = ½CV² = Q²/2C
- Q–V 그래프 아래 ==넓이== = 저장된 에너지
- 전지에 연결된 상태: [[V]] 일정
- 전지를 떼어 낸 상태: [[Q]] 일정
>+ 전지를 떼고 간격을 2 mm → 4 mm로 넓히면 C가 1/2 → V = Q/C는 **12 V**로 2배

= 예제 1 · 전하량과 에너지 | 적용
- 전기 용량 100 μF인 축전기에 10 V를 걸었다.
^+ Q = CV = 100 × 10⁻⁶ × 10 = **1 × 10⁻³ C**
^+ U = ½CV² = ½ × 100 × 10⁻⁶ × 10² = **5 × 10⁻³ J**

= 예제 2 · 전지에 연결한 채 간격 2배 | 적용
- 전지에 연결된 축전기의 극판 간격을 2배로 넓힌다. (V 일정)
^+ C = κε₀A/d → **1/2배**
^+ Q = CV → **1/2배**
^+ U = ½CV² → **1/2배**

= 예제 3 · 평행판 축전기 계산 | 적용
- 넓이 0.02 m², 간격 1 mm, 공기, 6 V
^+ C = 8.85 × 10⁻¹² × 0.02 ÷ 0.001 = **1.77 × 10⁻¹⁰ F** (177 pF)
^+ Q = 177 × 10⁻¹² × 6 ≈ **1.06 × 10⁻⁹ C** (1.06 nC)
^+ U = ½ × 1.06 × 10⁻⁹ × 6 ≈ **3.2 × 10⁻⁹ J**

= 확인 문제 1
Q 평행판 축전기의 전기 용량을 크게 하는 방법은?
o 극판 간격을 넓힌다
o* 극판 넓이를 넓힌다
o 전압을 낮춘다
o 유전체를 빼낸다
:: C = κε₀A/d → A에 비례

= 확인 문제 2
Q 전기 용량 2 μF인 축전기에 5 V를 걸 때 저장되는 전하량은?
o 0.4 μC
o 2.5 μC
o* 10 μC
o 25 μC
:: Q = CV = 2 × 5 = 10 μC

= 확인 문제 3
Q 충전 후 전지를 떼어 낸 축전기의 간격을 넓힐 때 변하지 않는 것은?
o 전기 용량
o 전압
o* 전하량
o 저장된 에너지
:: 전하가 빠져나갈 길이 없어 Q 일정

= 확인 문제 4
Q 전기 용량 10 μF인 축전기에 20 V를 걸었을 때 저장된 에너지는?
o 1 × 10⁻⁴ J
o* 2 × 10⁻³ J
o 4 × 10⁻³ J
o 2 × 10⁻⁴ J
:: ½ × 10 × 10⁻⁶ × 400 = 2 × 10⁻³ J

= 확인 문제 5
Q 극판 사이에 유전체를 넣으면 전기 용량이 커지는 까닭은?
o 극판 넓이가 커져서
o* 유전 분극으로 판 사이 전기장이 약해져서
o 극판 간격이 넓어져서
o 전지의 전압이 커져서
:: 같은 전하에서 전압이 낮아지므로 C = Q/V가 커진다.

= 생활 속 축전기 | 사례
* 📸 카메라 플래시 :: 축전기에 모은 에너지로 순간 발광
* ❤️ 자동 심장 충격기 :: 수백 J의 에너지를 순간 방전
* 📱 정전식 터치스크린 :: 손가락이 바꾸는 전기 용량 감지
* ⌨️ 키보드 :: 누르면 간격이 바뀌어 전기 용량 변화
* 🚌 슈퍼커패시터 버스 :: 정류장에서 빠르게 충전
* 🎤 콘덴서 마이크 :: 소리로 진동판 간격이 바뀌며 신호 발생

= 서술형 도전 | 생각 넓히기
? 스마트폰 정전식 터치스크린이 손가락을 알아차리는 원리를 전기 용량과 연결해 설명하시오. :: 화면 아래 전극들이 축전기를 이루는데, 도체인 손가락이 다가오면 전극 사이의 전기 용량이 변한다. 이 변화가 생긴 위치를 감지해 터치 위치를 알아낸다.
? 축전기와 전지가 에너지를 저장하는 방식과 장단점을 비교하시오. :: 축전기는 전하를 전기장 형태로 저장해 매우 빠르게 충·방전할 수 있지만 저장 용량이 작다. 전지는 화학 에너지로 저장해 용량이 크지만 큰 전류를 순간적으로 내기 어렵고 충전이 느리다.

= 오늘 배운 내용 정리
- Q = [[CV]], 전기 용량 단위 [[F]]
- 평행판: C = [[κε₀A/d]] (넓이 비례, 간격 반비례)
- 유전체 → [[유전 분극]] → C가 κ배
- 저장된 에너지 U = [[½CV²]] = Q–V 그래프 아래 넓이
- 전지 연결: [[V]] 일정, 전지 분리: [[Q]] 일정

= 나가기 전 한 문제 | 형성평가
? 충전 후 전지를 떼어 낸 축전기(공기, 6 V)의 극판 간격을 2배로 넓혔다. C, Q, V는 각각 몇 배가 되는지 쓰시오. :: C: 1/2배, Q: 그대로(1배), V = Q/C: 2배 (6 V → 12 V)
