= 오늘의 학습 목표 | 2차시
^ 양자 상태의 **중첩**과 **측정**에 의한 확률적 상태 변화를 설명할 수 있다.
^ **양자 컴퓨터**, **양자 암호 통신** 등 양자 기술의 기본 아이디어를 설명할 수 있다.
^ 양자 기술이 일상생활과 미래 사회에 미칠 **영향**을 토의할 수 있다.
% 흐름: 생각 열기 5분 → 중첩 10분 → 측정 8분 → 큐비트·양자 컴퓨터 8분 → 양자 암호 통신 7분 → 사회적 영향 토의 7분
% 2022 개정 [12전자03-02] 해설: 양자 기술은 물리적 원리보다는 사회에 미치는 영향을 중심으로 다룬다. 중첩과 측정은 편광된 광자 등 예로 정성적으로 다루고 수식(상태 벡터)은 쓰지 않는다.

= 동전을 던지는 것과 무엇이 다를까? | 생각 열기
* 🪙 던져진 동전 :: 사실은 이미 앞면 또는 뒷면 — 우리가 모를 뿐
* ⚛️ 양자 상태 :: 측정 전에는 두 상태가 '함께' 존재한다고 해야 실험 결과가 설명된다
* 💻 양자 컴퓨터 :: 기존 컴퓨터로 매우 오래 걸리는 일부 계산을 빠르게 할 수 있을 것으로 기대
* 🔐 양자 암호 :: 엿들으면 반드시 흔적이 남는 통신
? 지난 시간 전자는 측정 전에 '어느 슬릿을 지났을까?' :: 한쪽으로 정해져 있었다고 보면 간섭무늬를 설명할 수 없다. 두 경로가 **중첩**된 상태로 지났다고 보아야 한다.

= 지난 시간 복습 | 1차시
- 단일 전자도 많이 모이면 [[간섭무늬]]를 만든다.
- 도착 위치는 [[확률]] 파동으로 정해진다.
- 어느 슬릿을 지났는지 측정하면 간섭무늬가 [[사라진다]].

## 중첩과 측정 | 측정이 상태를 바꾼다

= 양자 중첩
- 양자 상태는 서로 다른 상태(예: 경로 A와 경로 B, 0과 1)가 **동시에 겹친** 상태로 있을 수 있다 → **중첩**
- 중첩된 상태는 각 상태가 나올 **확률**을 함께 담고 있다.
>+ 동전과 다른 점: 측정 전 결과가 '이미 정해져 있는데 모르는 것'이 아니다 — 간섭이 그 증거

= 측정에 의한 상태 변화
^+ 중첩 상태를 측정하면 결과는 가능한 상태 중 **하나**로만 나온다.
^+ 어느 결과가 나올지는 **확률**로만 알 수 있다.
^+ 측정 직후 상태는 측정된 그 상태로 **바뀐다** → 중첩이 사라진다.
>+ 측정은 단순히 '보는 것'이 아니라 양자 상태를 **바꾸는** 작용이다.

= 예제 1 · 편광된 광자로 생각하기 | 적용
- 대각선(45°) 방향으로 편광된 광자를 세로 편광판에 보낸다.
^+ 대각선 편광은 세로와 가로 편광이 **같은 비율로 중첩**된 상태로 볼 수 있다.
^+ 광자 하나는 통과하거나 흡수되거나 둘 중 하나 — 통과할 확률 **50 %**
^+ 통과한 광자는 이제 **세로 편광** 상태로 바뀌어 있다.
>+ 광자를 많이 보내면 약 절반이 통과 — 빛의 세기로는 '절반으로 줄었다'고 관측된다.

## 양자 기술 | 중첩과 측정을 이용하다

= 큐비트와 양자 컴퓨터
| 구분 | 비트 (기존 컴퓨터) | 큐비트 (양자 컴퓨터) |
|+ 상태 | 0 또는 1 | 0과 1의 [[중첩]] |
|+ 여러 개일 때 | 한 번에 하나의 조합 | 여러 조합을 중첩하여 함께 다룸 |
|+ 잘하는 일 | 대부분의 일상 계산 | 특정 문제(분자 시뮬레이션, 일부 최적화·소인수분해 등) |
|+ 어려운 점 | – | 중첩이 외부 영향으로 쉽게 깨짐, 오류 보정 필요 |
>+ 양자 컴퓨터가 모든 계산을 빠르게 하는 것은 아니다 — 잘하는 문제가 따로 있다.

= 양자 암호 통신
^+ 보내는 쪽이 광자의 편광 상태에 암호 열쇠 정보를 싣는다.
^+ 도청자가 중간에서 광자를 **측정**하면 상태가 바뀐다.
^+ 받는 쪽과 보내는 쪽이 일부를 비교하면 오류가 늘어난 것으로 **도청을 알아챈다.**
>+ '측정하면 상태가 바뀐다'는 성질이 오히려 **보안**의 바탕이 된다.

= 양자 기술과 사회 | 토의 자료
* 💊 신약·신소재 :: 분자의 성질을 정확히 계산해 개발 기간 단축 기대
* 🏦 금융·보안 :: 현재 암호 체계가 위협받을 수 있어 새로운 암호로 전환 준비
* 🌍 기후·에너지 :: 배터리·촉매 소재 설계에 활용 기대
* 🛰️ 양자 센서 :: 아주 작은 자기장·중력 변화 측정 (의료, 자원 탐사)
* ⚖️ 과제 :: 막대한 개발 비용, 기술 격차, 보안 위험, 과장된 기대
% 토의: '양자 기술이 내 생활을 어떻게 바꿀까?'를 기대와 우려로 나누어 정리하게 한다. 원리 설명보다 사회적 영향에 초점.

= 확인 문제 1
Q 양자 중첩에 대한 설명으로 옳은 것은?
o 측정 전에도 결과가 하나로 정해져 있다
o* 측정 전에는 여러 상태가 확률과 함께 겹쳐 있다
o 측정하면 항상 같은 결과가 나온다
o 거시 세계의 동전 던지기와 똑같다
:: 중첩 상태는 측정 전 여러 상태를 함께 담고 있다.

= 확인 문제 2
Q 양자 암호 통신에서 도청을 알아챌 수 있는 까닭은?
o 도청자가 광자를 늘리기 때문
o* 도청자가 측정하면 양자 상태가 바뀌어 오류가 생기기 때문
o 광자가 소리를 내기 때문
o 빛의 속력이 변하기 때문
:: 측정이 상태를 바꾸는 성질을 이용한다.

= 확인 문제 3
Q 큐비트와 비트의 차이로 옳은 것은?
o 큐비트는 0만 나타낸다
o 비트는 0과 1의 중첩을 나타낸다
o* 큐비트는 0과 1의 중첩 상태를 가질 수 있다
o 둘은 완전히 같다
:: 큐비트는 중첩을 이용해 여러 조합을 함께 다룰 수 있다.

= 서술형 도전 | 생각 넓히기
? 양자 컴퓨터가 상용화되면 사회에 미칠 수 있는 긍정적 영향과 우려를 하나씩 쓰시오. :: 긍정: 신약·신소재 개발에 필요한 분자 계산을 빠르게 하여 개발 기간을 줄일 수 있다. 우려: 현재 널리 쓰는 일부 암호가 풀릴 수 있어 개인 정보와 금융 보안이 위협받을 수 있다.
? 측정이 양자 상태를 바꾼다는 성질이 양자 암호 통신에서 어떻게 장점이 되는지 쓰시오. :: 누군가 중간에서 광자를 측정하면 상태가 바뀌어 받는 쪽 결과에 오류가 생기므로, 도청 사실을 반드시 알아챌 수 있다.

= 오늘 배운 내용 정리
- 중첩: 측정 전 여러 상태가 [[확률]]과 함께 겹친 상태
- 측정: 결과는 하나, 확률적 — 측정 후 상태가 [[바뀐다]]
- 큐비트: 0과 1의 중첩 → 양자 컴퓨터(특정 문제에 강함)
- 양자 암호 통신: 측정하면 흔적이 남아 [[도청]]을 알아챔
- 양자 기술은 기대와 함께 보안·격차 등 사회적 과제도 함께

= 나가기 전 한 문제 | 형성평가
? 대각선으로 편광된 광자 100개를 세로 편광판에 보냈을 때 통과하는 광자 수를 예상하고, 통과한 광자의 편광 상태를 쓰시오. :: 약 50개가 통과한다(확률 50 %). 통과한 광자는 모두 세로 편광 상태가 된다.
