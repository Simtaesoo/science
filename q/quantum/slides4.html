# 단일 양자의 이중 슬릿 실험 | 하나씩 보냈는데 무늬가 생긴다 | 고등학교 전자기와 양자 · 06 양자와 미시 세계 · 1차시 | 2022 개정 교육과정 [12전자03-01]

= 오늘의 학습 목표 | 1차시
^ 광자나 전자를 **하나씩** 보내는 이중 슬릿 실험의 결과를 설명할 수 있다.
^ 결과를 **입자–파동 이중성**과 **확률 파동의 간섭**으로 해석할 수 있다.
^ 드브로이 관계식으로 전자도 파동성을 가짐을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 고전적 예상 7분 → 단일 양자 실험(모의실험) 15분 → 확률 파동 해석 10분 → 측정하면? 8분
% 2022 개정 [12전자03-01] 해설: 드브로이 관계식을 바탕으로 단일 전자나 광자 수준의 이중 슬릿 실험에서 나타나는 입자–파동 이중성의 기묘함을 정성적으로 다룬다. 탐구 활동: 전자의 이중 슬릿 실험에 대한 컴퓨터 모의실험. 이 차시는 '양자와 미시 세계' 영역의 첫 차시로 운영한다.

= 전자 하나는 어느 슬릿을 지났을까? | 생각 열기
* 🎾 테니스공 :: 두 틈 중 하나를 지나 벽에 두 줄로 쌓인다
* 🌊 물결 :: 두 틈을 지난 물결이 간섭해 여러 줄 무늬를 만든다
* ⚛️ 전자 하나 :: 스크린에 '점' 하나로 도착한다
* 🧩 수만 개의 전자 :: 점들이 모여 간섭무늬가 나타난다
? 전자를 하나씩 보냈는데도 간섭무늬가 생긴다면 전자는 입자일까, 파동일까? :: 도착할 때는 **입자**처럼 한 점에, 모이면 **파동**처럼 간섭무늬를 만든다 — 둘 중 하나로만 설명할 수 없다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학, 빛의 간섭
- 이중 슬릿을 지난 빛이 만드는 밝고 어두운 무늬 → [[간섭]]무늬 (파동성의 증거)
- 광전 효과 → 빛의 [[입자성]]의 증거
- 드브로이 파장 λ = [[h/p]] — 운동량이 작을수록 파장이 길다
? 물질파가 있다면 전자도 간섭무늬를 만들까? :: 그렇다. 전자선을 이중 슬릿에 보내면 빛과 같은 간섭무늬가 생긴다.

## 하나씩 보내기 | 기묘한 실험

= 단일 양자 이중 슬릿 실험
^+ 전자(또는 광자)를 한 번에 **하나씩만** 보내도록 아주 약하게 쏜다.
^+ 처음 몇 개: 스크린 여기저기에 **점**이 찍힌다 — 어디에 올지 예측할 수 없다.
^+ 수백 개: 점들이 몰리는 곳과 비는 곳이 보이기 시작한다.
^+ 수만 개: 이중 슬릿의 **간섭무늬**가 뚜렷하게 나타난다.
>+ 전자는 혼자 지나갔는데도 **두 슬릿을 모두 지난 파동처럼** 간섭한다.
% 컴퓨터 모의실험(전자 이중 슬릿 시뮬레이터)으로 전자 수를 10 → 100 → 10000개로 늘리며 무늬가 나타나는 과정을 관찰하게 한다.

= 그래프로 보면 | 무늬가 나타나는 과정
C 스크린 위치별 도착한 전자 수 (모의실험 예시, 전자 1만 개) | 스크린 위치 | 도착한 전자 수 | 전자 수:-4,30 -3,10 -2,260 -1,40 0,900 1,40 2,260 3,10 4,30
~ 도착하는 곳의 분포가 간섭무늬와 같은 모양 — 밝은 무늬 = 전자가 많이 도착하는 곳

## 확률 파동 | 어디에 도착할 확률

= 확률 파동으로 해석하기
- 전자 하나가 어디에 도착할지는 정해져 있지 않고 **확률**로만 알 수 있다.
- 그 확률을 정하는 것이 전자의 **파동(확률 파동)**이다.
- 두 슬릿을 지난 확률 파동이 **간섭**하여, 확률이 큰 곳과 0인 곳이 생긴다.
- 전자는 도착할 때 한 점에서 **입자로 검출**된다.
>+ 입자–파동 이중성: 전파될 때는 파동처럼, 검출될 때는 입자처럼

= 어느 슬릿을 지났는지 확인하면?
^+ 슬릿 옆에 검출기를 두어 전자가 **어느 쪽**을 지났는지 측정한다.
^+ 그러면 간섭무늬가 **사라지고** 두 줄 무늬만 남는다.
^+ 경로를 알아내는 '측정'이 전자의 상태를 바꾼다.
>+ 일상의 물체에서는 볼 수 없는 미시 세계의 **기묘함** — 다음 시간의 '중첩과 측정'으로 이어진다.

= 예제 1 · 야구공도 간섭할까? | 적용
- 드브로이 파장 λ = h/p (h ≈ 6.6 × 10⁻³⁴ J·s)
^+ 질량 0.15 kg 야구공이 40 m/s로 날아가면 p = 6 kg·m/s → λ ≈ **1 × 10⁻³⁴ m** — 측정 불가능하게 짧다.
^+ 전자는 질량이 매우 작아 λ가 원자 크기 정도(약 10⁻¹⁰ m) → 결정 속 원자 배열에서 간섭·회절이 관측된다.
>+ 파동성은 모든 물질에 있지만 **미시 세계**에서만 두드러진다.

= 확인 문제 1
Q 전자를 하나씩 이중 슬릿에 보낼 때 관찰되는 현상으로 옳은 것은?
o 전자 하나가 스크린 전체에 퍼진 무늬를 만든다
o* 전자는 한 점씩 도착하지만 많이 모이면 간섭무늬가 나타난다
o 항상 두 줄 무늬만 생긴다
o 전자가 스크린에 도착하지 않는다
:: 도착은 입자처럼, 분포는 파동의 간섭처럼 나타난다.

= 확인 문제 2
Q 간섭무늬에서 어두운 곳에 대한 설명으로 옳은 것은?
o 전자가 가장 많이 도착하는 곳이다
o* 확률 파동이 상쇄 간섭하여 전자가 도착할 확률이 거의 0인 곳이다
o 전자가 멈추는 곳이다
o 슬릿 바로 뒤이다
:: 확률 파동의 상쇄 간섭으로 도착 확률이 매우 작다.

= 확인 문제 3
Q 슬릿 옆에서 전자가 어느 슬릿을 지나는지 측정하면 일어나는 일은?
o 간섭무늬가 더 뚜렷해진다
o* 간섭무늬가 사라진다
o 전자가 두 개로 나뉜다
o 전자의 질량이 커진다
:: 경로를 측정하면 두 경로의 확률 파동이 간섭하지 못한다.

= 서술형 도전 | 생각 넓히기
? 단일 전자 이중 슬릿 실험 결과를 '입자'와 '파동' 두 낱말을 모두 사용하여 설명하시오. :: 전자는 스크린에 도착할 때 한 점으로 검출되는 입자처럼 행동하지만, 어디에 도착할지는 두 슬릿을 지난 확률 파동의 간섭으로 정해지므로 많이 모이면 파동의 간섭무늬가 나타난다.
? 일상생활의 공이 간섭무늬를 만들지 않는 까닭을 드브로이 파장으로 설명하시오. :: 질량이 큰 물체는 운동량이 커서 드브로이 파장이 극히 짧으므로 간섭·회절 효과를 관측할 수 없다.

= 오늘 배운 내용 정리
- 단일 양자도 많이 모이면 [[간섭무늬]]를 만든다
- 도착은 [[입자]]처럼 한 점, 분포는 파동처럼 → 입자–파동 이중성
- 도착 위치는 [[확률]] 파동의 간섭으로 정해진다
- 경로를 측정하면 간섭무늬가 사라진다
- 드브로이 파장 λ = h/p — 미시 세계에서만 두드러짐

= 나가기 전 한 문제 | 형성평가
? 단일 광자 이중 슬릿 실험에서 처음 10개의 광자로는 무늬를 알 수 없지만 1만 개가 모이면 무늬가 보이는 까닭을 쓰시오. :: 각 광자의 도착 위치는 확률로만 정해져 몇 개로는 무작위처럼 보이지만, 많이 모이면 확률 분포(간섭무늬 모양)가 드러나기 때문이다.
