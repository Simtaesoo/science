# 상자 속 입자와 에너지 양자화 | 에너지는 왜 띄엄띄엄할까 | 고등학교 전자기와 양자 · 05 양자 현상 · 1차시 | 2022 개정 교육과정 [전자기와 양자 Ⅱ]

= 오늘의 학습 목표 | 1차시
^ 상자에 갇힌 입자의 물질파가 **정상파**를 이룸을 설명할 수 있다.
^ 정상파 조건으로부터 **에너지 양자화** Eₙ = n²h²/8mL²을 설명할 수 있다.
^ **파동 함수**와 확률 밀도 |ψ|²의 의미를 해석할 수 있다.
% 흐름: 생각 열기 5분 → 정상파와 양자화 10분 → 에너지 준위(시뮬레이션) 12분 → 파동 함수 8분 → 계산·문항 10분

= 크기에 따라 색이 바뀐다? | 생각 열기
* 📺 퀀텀닷 TV :: 같은 물질인데 알갱이 크기에 따라 색이 다르다
* 🎸 기타 줄 :: 정해진 진동수의 음만 난다
* 🌈 수소 스펙트럼 :: 띄엄띄엄한 선 몇 개만 보인다
* 🔬 나노 입자 :: 금 나노 입자는 붉은색을 띤다
? 기타 줄에서 정해진 음만 나는 것과 원자의 에너지가 띄엄띄엄한 것은 어떤 관련이 있을까? :: 둘 다 갇힌 파동이 **정상파**를 이룰 때 특정 파장만 허용되기 때문이다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 물질파 | λ = h/p = h/mv (물리학) |
| 줄의 정상파 | 양끝 마디 → λₙ = 2L/n (역학과 에너지) |
| 운동 에너지 | E = ½mv² = p²/2m |
? 전자의 속력이 2배가 되면 물질파 파장은? :: λ ∝ 1/v → **1/2배**

## 에너지 양자화 | 갇힌 물질파는 정상파

= 상자 속 입자의 정상파
- 길이 L인 상자에 갇힌 입자 → 물질파의 양 끝이 [[마디]]
! λₙ = 2L / n (n = 1, 2, 3, …)
- 운동량 p = h/λₙ = nh/2L → 허용되는 운동량이 ==띄엄띄엄==
>+ 기타 줄의 정상파와 똑같은 조건!

= 에너지 양자화
! Eₙ = p²/2m = n²h² / 8mL²
- 에너지가 불연속적 → [[양자화]]
- n = 1 (바닥상태)에도 에너지가 0이 아니다 → [[영점 에너지]]
- 에너지 ∝ n², 상자가 작을수록 에너지 간격이 [[크다]] (E ∝ 1/L²)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#box | 상자 길이 0.50 nm에서 양자수를 바꾸며 에너지, 파장, 확률 밀도 모양을 기록하자. 상자 길이도 바꿔 보자.
% n = 2의 한가운데 |ψ|² = 0 → '입자가 어떻게 한쪽에서 다른 쪽으로 가나?' 질문 유도

= 에너지 준위 | 시뮬레이션 기록 (L = 0.50 nm, 전자)
| 양자수 n | 1 | 2 | 3 | 4 |
|+ 에너지 (eV) | 1.50 | [[6.02]] | [[13.54]] | [[24.06]] |
|+ 파장 (nm) | 1.00 | 0.50 | [[0.33]] | 0.25 |
|+ 확률 밀도 봉우리 수 | 1 | 2 | [[3]] | 4 |
- 에너지 비 1 : 4 : 9 : 16 → [[n²]]에 비례

= 상자 크기와 에너지 | 그래프
C 양자수에 따른 전자의 에너지 | 양자수 n | 에너지 (eV) | L = 0.5 nm:1,1.5 2,6.02 3,13.54 4,24.06 | L = 1.0 nm:1,0.38 2,1.5 3,3.39 4,6.02
||
- 상자 길이 2배 → 에너지 [[1/4]]배
- 작은 상자일수록 에너지 간격이 ==크다==
~ E₁ = 0.376/L² eV (L은 nm 단위, 전자)

## 파동 함수 | 입자를 발견할 확률

= 파동 함수와 확률
- 파동 함수 ψ: 입자의 물질파를 나타내는 함수
- |ψ|²: 그 위치에서 입자를 [[발견할 확률]]에 비례
| 상태 | 확률 밀도 모양 | 한가운데에서 발견 확률 |
|+ n = 1 | 봉우리 1개 | [[가장 크다]] |
|+ n = 2 | 봉우리 2개 | [[0]] |
>+ 양자 세계에서는 입자의 위치를 **확률**로만 말할 수 있다.

= 예제 1 · 바닥상태 에너지 | 적용
- 길이 0.5 nm 상자 속 전자 (h = 6.63 × 10⁻³⁴ J·s, m = 9.11 × 10⁻³¹ kg)
^+ E₁ = h²/8mL² = (6.63 × 10⁻³⁴)² ÷ (8 × 9.11 × 10⁻³¹ × (5 × 10⁻¹⁰)²)
^+ ≈ 2.4 × 10⁻¹⁹ J ≈ **1.50 eV**
^+ E₂ = 4 × 1.50 = **6.02 eV**

= 예제 2 · 전이와 광자 | 적용
- 전자가 n = 2에서 n = 1로 전이 (hc ≈ 1240 eV·nm)
^+ ΔE = 6.02 − 1.50 = **4.52 eV**
^+ λ = hc ÷ ΔE = 1240 ÷ 4.52 ≈ **275 nm** (자외선)

= 예제 3 · 상자가 커지면 | 적용
- 상자 길이를 1.0 nm로 늘리면
^+ E₁ = 1.50 ÷ 2² ≈ **0.38 eV** (1/4배)
^+ n = 2 → 1 전이: ΔE = 1.50 − 0.38 = **1.12 eV** → λ ≈ 1240 ÷ 1.12 ≈ **1100 nm** (적외선)
>+ 상자가 클수록 방출하는 빛의 파장이 **길어진다** → 퀀텀닷 색의 원리

= 확인 문제 1
Q 상자 속 입자의 에너지가 양자화되는 까닭은?
o 입자의 질량이 작아서
o* 물질파가 정상파 조건을 만족해야 해서
o 상자가 단단해서
o 빛을 흡수해서
:: 허용되는 파장이 2L/n뿐이므로 에너지도 띄엄띄엄하다.

= 확인 문제 2
Q n = 3 상태의 에너지는 바닥상태의 몇 배인가?
o 3배
o 6배
o* 9배
o 27배
:: Eₙ ∝ n²

= 확인 문제 3
Q 상자 길이를 절반으로 줄이면 바닥상태 에너지는?
o 1/2배
o 2배
o* 4배
o 1/4배
:: E ∝ 1/L²

= 확인 문제 4
Q n = 2 상태에서 상자 한가운데에서 입자를 발견할 확률은?
o 가장 크다
o 1/2이다
o* 0이다
o 1이다
:: 한가운데가 |ψ|²의 마디

= 확인 문제 5
Q 바닥상태(n = 1)의 에너지에 대한 설명으로 옳은 것은?
o 0이다
o* 0이 아닌 최솟값을 가진다
o 음수이다
o 상자 크기와 관계없다
:: 영점 에너지 — 갇힌 입자는 완전히 멈출 수 없다.

= 생활 속 에너지 양자화 | 사례
* 📺 퀀텀닷 디스플레이 :: 알갱이 크기로 색을 조절
* 🌈 원자 스펙트럼 :: 띄엄띄엄한 에너지 준위 사이의 전이
* 💡 LED :: 반도체 에너지 간격이 빛의 색을 결정
* 🔴 레이저 :: 특정 에너지 준위 사이의 전이로 단색광
* 🧪 형광 물질 :: 흡수와 방출의 에너지 차이
* 🧬 나노 의학 :: 퀀텀닷으로 암세포 표지

= 서술형 도전 | 생각 넓히기
? 퀀텀닷 디스플레이에서 작은 양자점은 파란빛, 큰 양자점은 빨간빛을 내는 까닭을 쓰시오. :: 양자점이 작을수록 전자가 갇힌 공간이 작아 에너지 간격이 커지므로, 방출하는 광자의 에너지가 커져 파장이 짧은 파란빛을 낸다.
? 질량 0.1 kg인 공을 1 m 상자에 넣으면 에너지 양자화가 느껴질지 Eₙ ∝ 1/(mL²)로 추론하시오. :: 질량과 상자 크기가 전자의 경우보다 엄청나게 커서 에너지 간격이 상상할 수 없이 작다(약 10⁻⁶⁶ J 수준). 에너지가 사실상 연속적으로 보이므로 양자화를 느낄 수 없다.

= 오늘 배운 내용 정리
- 상자 속 물질파: 양 끝이 [[마디]]인 정상파, λₙ = 2L/n
- 에너지 Eₙ = [[n²h²/8mL²]] → 양자화
- 바닥상태도 0이 아님 → [[영점 에너지]]
- 상자가 작을수록 에너지 간격이 [[크다]].
- |ψ|²: 입자를 [[발견할 확률]]

= 나가기 전 한 문제 | 형성평가
? 길이 0.5 nm 상자 속 전자가 n = 3에서 n = 1로 전이할 때 방출하는 광자의 에너지와 파장을 구하시오. (hc ≈ 1240 eV·nm) :: ΔE = 13.54 − 1.50 = 12.04 eV, λ = 1240 ÷ 12.04 ≈ 103 nm (자외선)
