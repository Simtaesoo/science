# 불확정성 원리 | 정확히 알 수 없다는 것의 의미 | 고등학교 전자기와 양자 · 06 양자와 미시 세계 · 4차시 | 2022 개정 교육과정 [12전자03-04]

= 오늘의 학습 목표 | 4차시
^ 위치와 운동량의 **불확정성 관계** Δx·Δp ≥ ħ/2를 설명할 수 있다.
^ 단일 슬릿을 지나는 전자의 **퍼짐**으로 불확정성 원리를 설명할 수 있다.
^ 불확정성이 **미시 세계**에서만 두드러지는 까닭을 계산으로 보일 수 있다.
% 흐름: 생각 열기 5분 → 불확정성 관계 10분 → 슬릿 폭과 퍼짐(시뮬레이션) 12분 → 미시·거시 비교 8분 → 문항 10분
% [교육과정 확인] [12전자03-04]: 현대의 원자 모형을 불확정성 원리와 확률을 기반으로 설명하고 보어 모형과 비교한다. 오비탈은 다루지 않는다. 불확정성 관계의 수치 계산은 '미시 세계에서만 두드러진다'는 경향 확인 수준으로만 쓴다.

= 더 정확히 겨눌수록 더 퍼진다? | 생각 열기
* 🎯 좁은 틈으로 쏜 전자 :: 틈을 좁힐수록 스크린에 더 넓게 퍼진다
* 📸 흔들린 사진 :: 위치와 움직임을 동시에 또렷하게 찍기 어렵다
* ⚛️ 원자 속 전자 :: 정확한 궤도 대신 '전자 구름'
* ⚾ 야구공 :: 위치도 속도도 아주 정확하게 잴 수 있다
? 전자를 좁은 틈으로 더 정확하게 '조준'할수록 왜 더 넓게 퍼질까? :: 위치를 좁게 제한할수록 운동량이 **불확실**해지기 때문이다 — **불확정성 원리**

= 지난 시간 복습 | 1·2차시
- 상자 속 입자의 바닥상태 에너지는 0이 [[아니다]] (영점 에너지)
- 터널링은 [[확률적]]인 현상

? 단일 슬릿의 폭을 좁히면 가운데 밝은 무늬는? :: **넓어진다** — 전자의 물질파도 똑같다.

## 불확정성 원리 | 위치와 운동량은 동시에 정확할 수 없다

= 불확정성 관계
! Δx · Δp ≥ ħ / 2
- ħ = h/2π ≈ 1.055 × 10⁻³⁴ J·s
- 위치를 정확히 알수록(Δx 작음) 운동량은 ==불확실==해진다 (Δp 큼).
- 하이젠베르크, 1927년
>+ 측정 장치의 한계가 아니라 물질의 **파동성**에서 비롯되는 자연의 본질

= 단일 슬릿과 불확정성
| 슬릿 폭 | 위치 불확정성 Δx | 옆 방향 운동량 Δp | 스크린 무늬 |
|+ 넓다 | [[크다]] | 작다 | 좁게 퍼짐 |
|+ 좁다 | 작다 | [[크다]] | [[넓게]] 퍼짐 |
>+ 파동의 **회절**과 같은 현상을 입자의 언어로 표현한 것

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#uncert | 슬릿 폭을 바꾸며 전자가 퍼지는 정도와 운동량 불확정성, 속도 불확정성을 기록하자.
% 슬릿 폭 → 퍼짐 관계를 먼저 예측시키고(대부분 '좁을수록 덜 퍼진다'고 답함) 결과와 비교

= 슬릿 폭과 퍼짐 | 시뮬레이션 기록 (전자)
| 슬릿 폭 Δx (nm) | 0.5 | 1 | 2 | 5 |
|+ Δp 최소 (× 10⁻²⁶ kg·m/s) | 10.55 | [[5.27]] | [[2.64]] | 1.05 |
|+ Δv (km/s) | 115.8 | [[57.9]] | 29.0 | [[11.6]] |
|+ 무늬 퍼짐 | 가장 넓다 | 점점 | 좁아진다 | 가장 좁다 |
- 슬릿 폭 2배 → Δp [[1/2]]배

= 슬릿 폭과 속도 불확정성 | 그래프
C 슬릿 폭에 따른 전자의 속도 불확정성 | 슬릿 폭 (nm) | Δv (km/s) | 속도 불확정성:0.5,115.8 1,57.9 2,29 3,19.3 4,14.5 5,11.6
||
- Δp = ħ/(2Δx) → Δx에 [[반비례]]
- Δv = Δp / m → 질량이 [[작을수록]] 크다
~ 전자 질량 9.11 × 10⁻³¹ kg

## 미시 세계와 거시 세계 | 왜 일상에서는 느낄 수 없을까

= 예제 1 · 원자 속 전자 | 적용
- 원자 크기(Δx = 0.1 nm)에 갇힌 전자
^+ Δp = ħ/(2Δx) = 1.055 × 10⁻³⁴ ÷ (2 × 10⁻¹⁰) ≈ **5.3 × 10⁻²⁵ kg·m/s**
^+ Δv = Δp/m = 5.3 × 10⁻²⁵ ÷ 9.11 × 10⁻³¹ ≈ **5.8 × 10⁵ m/s**
^+ 빛의 속력의 약 0.2 % → 전자의 궤도를 정확히 그릴 수 **없다** → 전자 구름

= 예제 2 · 야구공 | 적용
- 질량 0.15 kg인 야구공의 위치를 1 mm 정확도로 안다.
^+ Δv = ħ/(2mΔx) = 1.055 × 10⁻³⁴ ÷ (2 × 0.15 × 10⁻³)
^+ ≈ **3.5 × 10⁻³¹ m/s**
^+ 너무 작아 일상에서는 불확정성을 **전혀 느낄 수 없다.**

= 예제 3 · 영점 에너지와 불확정성 | 적용
- 길이 L인 상자에 갇힌 전자 (1차시)
^+ 위치 불확정성 Δx는 많아야 **L 정도**
^+ Δp ≥ ħ/(2L) → 운동량이 0으로 **확정될 수 없다.**
^+ 운동 에너지도 0이 될 수 없다 → **영점 에너지**

= 확인 문제 1
Q 불확정성 원리에 대한 설명으로 옳은 것은?
o 측정 장치가 좋아지면 사라진다
o* 위치와 운동량을 동시에 정확히 알 수 없다
o 거시 물체에서 더 크게 나타난다
o 운동량만 불확실하다
:: 자연의 본질적 성질로, 장치의 성능과 관계없다.

= 확인 문제 2
Q 전자의 위치 불확정성을 1/3로 줄이면 운동량 불확정성의 최솟값은?
o 1/3배
o* 3배
o 9배
o 그대로
:: Δp ∝ 1/Δx

= 확인 문제 3
Q 슬릿을 좁히면 전자가 스크린에 더 넓게 퍼지는 까닭은?
o 전자가 슬릿에 부딪혀서
o* 위치 불확정성이 작아져 옆 방향 운동량 불확정성이 커져서
o 전자의 속력이 빨라져서
o 전자의 질량이 줄어서
:: 불확정성 원리(= 물질파의 회절)

= 확인 문제 4
Q 같은 Δx일 때 속도 불확정성이 가장 큰 입자는?
o 야구공
o 양성자
o* 전자
o 원자핵
:: Δv = ħ/(2mΔx) → 질량이 가장 작은 전자

= 확인 문제 5
Q 일상에서 불확정성 원리를 느낄 수 없는 까닭은?
o 일상의 물체는 파동성이 없어서
o* 질량이 커서 속도 불확정성이 너무 작아서
o 일상의 물체는 정지해 있어서
o 빛이 너무 밝아서
:: 야구공의 Δv ≈ 10⁻³¹ m/s 수준

= 생활 속 불확정성 원리 | 사례
* ⚛️ 전자 구름 :: 원자 속 전자의 위치를 확률로 표현
* 🧊 절대 영도의 헬륨 :: 영점 운동 때문에 보통 압력에서 얼지 않는다
* 🔬 전자 현미경의 한계 :: 너무 작게 모으면 빔이 퍼진다
* 💡 레이저 :: 아주 짧은 펄스일수록 진동수 폭이 넓어진다
* 🔐 양자 암호 :: 측정하면 상태가 바뀌어 도청이 드러난다
* 💻 양자 컴퓨터 :: 확률적 양자 상태를 계산에 이용

= 서술형 도전 | 생각 넓히기
? 슬릿을 좁히면 전자를 더 정확히 '조준'하는 것 같은데 오히려 더 넓게 퍼지는 까닭을 쓰시오. :: 슬릿이 좁아 위치 불확정성이 작아지면 불확정성 원리에 따라 옆 방향 운동량의 불확정성이 커져 전자가 더 다양한 방향으로 진행하기 때문이다(파동의 회절과 같은 현상).
? 상자 속 전자의 에너지가 0이 될 수 없는 까닭(영점 에너지)을 불확정성 원리로 설명하시오. :: 전자가 길이 L인 상자에 갇혀 있으면 위치 불확정성이 L 정도로 제한되므로 운동량 불확정성이 0이 될 수 없다. 운동량이 0으로 확정될 수 없으므로 운동 에너지도 0이 될 수 없다.

= 오늘 배운 내용 정리
- 불확정성 관계: Δx · Δp ≥ [[ħ/2]]
- 위치가 정확할수록 운동량은 [[불확실]]
- 측정의 한계가 아니라 [[파동성]]에서 비롯된 본질
- 슬릿이 좁을수록 전자가 [[넓게]] 퍼진다.
- 질량이 큰 물체는 불확정성을 [[느낄 수 없다]].

= 나가기 전 한 문제 | 형성평가
? 1 nm 슬릿을 지나는 전자의 최소 운동량 불확정성과 속도 불확정성을 구하시오. (ħ = 1.055 × 10⁻³⁴ J·s, m = 9.11 × 10⁻³¹ kg) :: Δp = 1.055 × 10⁻³⁴ ÷ (2 × 10⁻⁹) ≈ 5.3 × 10⁻²⁶ kg·m/s, Δv ≈ 5.3 × 10⁻²⁶ ÷ 9.11 × 10⁻³¹ ≈ 5.8 × 10⁴ m/s (약 58 km/s)
