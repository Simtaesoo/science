# 별의 핵융합과 스펙트럼 | 별빛 속 양자의 흔적 | 고등학교 전자기와 양자 · 06 양자와 미시 세계 · 5차시 | 2022 개정 교육과정 [12전자03-05]

= 오늘의 학습 목표 | 5차시
^ 별 중심에서 **핵융합**이 일어날 수 있는 까닭을 터널 효과와 관련지어 설명할 수 있다.
^ 별에서 에너지가 생성되어 **빛**으로 방출되는 원리를 설명할 수 있다.
^ 별빛의 **스펙트럼**에 나타난 선으로 별의 구성 원소를 추리할 수 있다.
% 흐름: 생각 열기 5분 → 핵융합과 터널 효과 10분 → 에너지가 빛이 되기까지 8분 → 선 스펙트럼과 에너지 준위 10분 → 별의 원소 추리 12분
% 2022 개정 [12전자03-05]: 별에서 핵융합에 의해 에너지가 생성되고 빛이 방출되는 원리를 알고, 별빛의 스펙트럼에 기반하여 별의 구성 원소를 추리한다. 탐구 활동: 스펙트럼 관찰을 통해 에너지 준위 확인하기. 터널 효과(3차시)와 원자 모형(4차시) 다음에 운영한다.

= 태양 중심은 핵융합하기에 '너무 차갑다'? | 생각 열기
* ☀️ 태양 중심 :: 약 1500만 K
* ⚡ 양성자 두 개 :: 둘 다 (+)라 서로 강하게 밀어낸다
* 🧮 고전 역학의 계산 :: 이 온도로는 전기적 반발을 넘기에 에너지가 부족하다
* 🌟 그런데 :: 태양은 46억 년째 핵융합으로 빛나고 있다
? 에너지가 부족한데도 핵융합이 일어나는 까닭은? :: 양성자가 전기적 반발이라는 **에너지 장벽을 터널 효과로 통과**할 확률이 있기 때문이다.

= 지난 시간 복습 | 3·4차시
- 고전적으로 넘을 수 없는 장벽을 확률적으로 통과하는 현상 → [[터널 효과]]
- 원자 속 전자는 [[불연속적]]인 에너지 준위를 가진다.
- 전자가 높은 준위에서 낮은 준위로 전이하면 준위 차이만큼의 에너지를 가진 [[광자]]를 방출한다.

## 별의 에너지 | 터널 효과가 켠 불

= 별 중심의 핵융합과 터널 효과
^+ 수소 원자핵(양성자)끼리 매우 가까워져야 핵력으로 결합(융합)할 수 있다.
^+ 그 전에 (+)전하끼리의 **전기적 반발**이라는 높은 에너지 장벽이 있다.
^+ 별 중심의 양성자 대부분은 장벽을 넘을 에너지가 없지만, **터널 효과**로 통과할 확률이 있다.
^+ 별 중심에는 양성자가 엄청나게 많아, 작은 확률로도 꾸준히 핵융합이 일어난다.
>+ 수소 원자핵 4개 → 헬륨 원자핵 1개 + 에너지 (줄어든 질량이 에너지로)
>+ 터널 확률이 작기 때문에 오히려 태양은 연료를 천천히 쓰며 **오래** 빛난다.

= 에너지가 별빛이 되기까지
^+ 핵융합으로 생긴 에너지가 중심부의 물질을 매우 뜨겁게 한다.
^+ 에너지가 바깥층으로 전달되어(복사·대류) 표면에서 **빛**으로 방출된다.
^+ 뜨거운 표면은 여러 파장이 섞인 **연속 스펙트럼**의 빛을 낸다.
^+ 그 빛이 별의 대기를 지날 때 대기 원소가 **특정 파장만 흡수** → 흡수선

## 별빛의 스펙트럼 | 원소의 지문

= 선 스펙트럼과 에너지 준위
- 원소마다 에너지 준위의 간격이 **다르다** → 흡수·방출하는 빛의 파장이 원소마다 고유하다.
- 방출 스펙트럼: 뜨거운 기체가 특정 파장의 빛만 낸다 (밝은 선)
- 흡수 스펙트럼: 연속 스펙트럼 중 특정 파장이 빠진다 (어두운 선)
>+ 같은 원소의 방출선과 흡수선은 **같은 파장**에 나타난다.
% 탐구 활동: 분광기(또는 회절 격자 안경)로 수소·헬륨·네온 방전관의 선 스펙트럼을 관찰하고, 원소마다 선의 위치가 다름을 확인한다.

= 예제 1 · 수소의 흡수선 | 적용
- 수소 원자의 에너지 준위: n = 2 → −3.4 eV, n = 3 → −1.51 eV
^+ n = 2 → 3 전이에 필요한 에너지 = 3.4 − 1.51 = **1.89 eV**
^+ 이 에너지의 광자는 파장 약 **656 nm**의 빨간빛
^+ 별빛 스펙트럼의 656 nm에 흡수선이 있으면 별의 대기에 **수소**가 있다는 증거

= 예제 2 · 별의 구성 원소 추리 | 자료 해석
| 원소 | 실험실에서 측정한 주요 선의 파장 (nm) |
| 수소 | 656, 486, 434 |
| 헬륨 | 588, 447 |
| 나트륨 | 589 (두 줄이 매우 가까움) |
| 칼슘 | 397, 393 |
- 어떤 별의 흡수선: 656, 486, 434, 393, 397 nm
^+ 656·486·434 → **수소**
^+ 393·397 → **칼슘**
^+ 헬륨(447 nm)의 선은 보이지 않는다 → 이 별의 대기 온도에서는 헬륨선이 약하거나 거의 없다.
>+ 흡수선이 있다는 것은 그 원소가 있다는 증거이고, 선의 세기에는 온도 등 다른 조건도 영향을 준다.

= 확인 문제 1
Q 별 중심의 온도가 고전적으로 계산한 값보다 낮은데도 핵융합이 일어나는 까닭은?
o 양성자끼리 서로 끌어당기기 때문
o* 양성자가 전기적 반발 장벽을 터널 효과로 통과할 확률이 있기 때문
o 별 중심에 산소가 많기 때문
o 빛의 압력 때문
:: 터널 효과로 일부 양성자가 장벽을 통과한다.

= 확인 문제 2
Q 별빛의 흡수 스펙트럼으로 별의 구성 원소를 알 수 있는 까닭은?
o 모든 원소가 같은 파장의 빛을 흡수하므로
o* 원소마다 에너지 준위 간격이 달라 흡수하는 파장이 고유하므로
o 별빛은 한 가지 색이므로
o 흡수선의 개수가 별까지의 거리를 알려 주므로
:: 원소마다 고유한 위치에 선이 나타나 '지문' 역할을 한다.

= 확인 문제 3
Q 수소 원자의 전자가 n = 3에서 n = 2로 전이할 때 일어나는 일은?
o 1.89 eV의 광자를 흡수한다
o* 1.89 eV의 광자를 방출한다
o 13.6 eV의 광자를 방출한다
o 아무 일도 일어나지 않는다
:: 높은 준위에서 낮은 준위로 전이하면 준위 차이만큼의 에너지를 가진 광자를 방출한다.

= 서술형 도전 | 생각 넓히기
? 터널 효과가 없다면 태양은 어떻게 되었을지 추론하시오. :: 중심 온도에서 양성자가 전기적 반발을 넘지 못해 핵융합이 거의 일어나지 않으므로, 태양은 지금처럼 빛나지 못했을 것이다(훨씬 더 높은 온도까지 수축해야 했을 것이다).
? 실험실의 수소 방출선과 별빛의 수소 흡수선이 같은 파장에 나타나는 까닭을 에너지 준위로 설명하시오. :: 방출은 전자가 높은 준위에서 낮은 준위로, 흡수는 낮은 준위에서 높은 준위로 전이하는 것으로, 같은 두 준위 사이의 에너지 차이가 같으므로 같은 파장의 빛이 관여한다.

= 오늘 배운 내용 정리
- 별 중심 핵융합: 전기적 반발 장벽을 [[터널 효과]]로 통과 → 수소가 헬륨으로
- 줄어든 질량이 에너지로 → 바깥층으로 전달 → 표면에서 빛으로 방출
- 원소마다 에너지 준위 간격이 달라 [[선 스펙트럼]]이 고유하다
- 별빛의 흡수선 = 별 대기 원소의 지문

= 나가기 전 한 문제 | 형성평가
? 어떤 별의 스펙트럼에서 588 nm와 447 nm에 흡수선이 뚜렷했다. 예제 2의 표를 이용해 이 별의 대기에 있는 원소를 추리하고, 근거를 쓰시오. :: 헬륨. 실험실에서 측정한 헬륨의 주요 선(588, 447 nm)과 같은 파장에 흡수선이 나타났기 때문이다.
