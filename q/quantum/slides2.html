# 양자 터널링 | 벽을 통과하는 전자 | 고등학교 전자기와 양자 · 05 양자 현상 · 2차시 | 2022 개정 교육과정 [전자기와 양자 Ⅱ]

= 오늘의 학습 목표 | 2차시
^ 고전 역학과 양자 역학에서 **에너지 장벽**을 만난 입자의 운동을 비교할 수 있다.
^ **양자 터널링**을 파동 함수로 설명하고 투과 확률에 영향을 주는 요인을 찾을 수 있다.
^ 주사 터널링 현미경, 플래시 메모리, 핵융합 등 **활용 예**를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 고전 vs 양자 8분 → 두께와 투과 확률(시뮬레이션) 14분 → 활용 8분 → 문항 10분

= 공이 언덕을 뚫고 지나간다? | 생각 열기
* ⚽ 언덕 앞의 공 :: 힘이 부족하면 넘지 못하고 굴러 내려온다
* 💾 USB 메모리 :: 전원 없이도 데이터를 기억한다
* 🔬 원자 사진 :: 원자 하나하나의 모습을 찍는다
* ☀️ 태양 :: 온도가 '모자란데도' 핵융합이 일어난다
? 언덕을 넘을 에너지가 부족한 공이 언덕 반대편에 나타날 수 있을까? :: 공은 불가능하지만, 전자처럼 파동성이 큰 입자는 일정한 **확률**로 장벽을 통과한다 — **양자 터널링**

= 지난 시간 복습 | 1차시
- 상자 속 물질파는 [[정상파]] → 에너지 양자화
- |ψ|²: 입자를 [[발견할 확률]]
- 상자가 작을수록 에너지 간격이 [[크다]].
? 파동은 벽을 만나면 완전히 튕겨 나오기만 할까? :: 빛도 얇은 틈을 사이에 두면 일부가 건너편으로 **스며든다** — 물질파도 마찬가지다.

## 장벽을 만난 입자 | 고전 vs 양자

= 고전 역학과 양자 역학
| 구분 | 운동 에너지 < 장벽 높이일 때 |
|+ 고전 역학 | 장벽을 [[넘을 수 없다]] → 반드시 되돌아온다 |
|+ 양자 역학 | 파동 함수가 장벽 속으로 스며들어 [[지수적으로]] 감소 |
|+ | 장벽이 얇으면 반대편에도 파동 함수가 남는다 → [[확률]]적으로 통과 |

= 양자 터널링
! 입자가 자신보다 높은 장벽을 확률적으로 통과하는 현상
| 투과 확률이 커지는 조건 | |
|+ 장벽이 | [[얇을수록]] |
|+ 장벽이 | [[낮을수록]] |
|+ 입자의 질량이 | [[작을수록]] |
>+ 장벽을 통과해도 입자의 에너지는 **줄지 않는다.**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#tunnel | 전자 에너지 5 eV, 장벽 8 eV에서 두께를 바꾸며 투과 확률을 기록하고, 전자 100개를 쏘아 통과 수를 세자.
% 모둠마다 통과 수가 다르게 나오는 것을 칠판에 모아 '확률적'임을 확인

= 두께와 투과 확률 | 시뮬레이션 기록 (5 eV 전자, 8 eV 장벽)
| 두께 (nm) | 0.1 | 0.2 | 0.3 | 0.5 |
|+ 투과 확률 (%) | 47.97 | [[10.25]] | [[1.81]] | [[0.05]] |
|+ 100개 중 통과 수 | 약 48 | 약 10 | 약 2 | 거의 0 |
- 통과 수가 실험할 때마다 다른 까닭: 터널링은 [[확률적]]인 현상

= 두께와 투과 확률 | 그래프
C 장벽 두께에 따른 투과 확률 | 두께 (nm) | 투과 확률 (%) | 투과 확률:0,100 0.05,81.7 0.1,48 0.2,10.25 0.3,1.81 0.4,0.31 0.5,0.05
||
- 두께 0.1 nm 늘 때마다 약 [[1/5 ~ 1/6]]로 감소
- 두께에 대해 ==지수적으로== 감소
~ 원자 하나 크기(약 0.1 nm)의 차이가 결과를 크게 바꾼다.

= 예제 1 · 감소 비율 | 적용
- 탐구 결과에서 두께가 0.1 nm씩 늘 때 투과 확률의 변화
^+ 0.1 → 0.2 nm: 47.97 → 10.25 (약 **1/4.7**)
^+ 0.2 → 0.3 nm: 10.25 → 1.81 (약 **1/5.7**)
^+ 일정한 비율로 계속 줄어든다 → **지수적 감소**

= 예제 2 · 전자 대신 양성자 | 적용
- 같은 조건에서 양성자를 보낸다.
^+ 양성자 질량은 전자의 약 **1800배**
^+ 장벽 속에서 파동 함수가 훨씬 빨리 감소
^+ 투과 확률이 **극히 작아진다** → 무거운 입자일수록 터널링이 어렵다.

= 예제 3 · 1만 개의 전자 | 적용
- 두께 0.3 nm 장벽(투과 확률 1.81 %)에 전자 10000개를 쏜다.
^+ 통과하는 전자 수의 기댓값 = 10000 × 0.0181 ≈ **181개**
^+ 실제로는 매번 조금씩 다르다 (확률적)
^+ 두께 0.5 nm라면 약 **5개**만 통과

## 터널링의 활용 | 양자 기술

= 터널링의 활용
| 활용 | 원리 |
|+ 주사 터널링 현미경(STM) | 탐침–표면 사이 터널링 전류가 [[거리]]에 매우 민감 |
|+ 플래시 메모리 | 얇은 절연막을 터널링시켜 전자를 [[가두거나]] 빼냄 |
|+ 태양의 핵융합 | 전기적 반발 장벽을 [[터널링]]으로 통과 |
|+ 알파 붕괴 | 원자핵 속 알파 입자가 장벽을 빠져나옴 |

= 확인 문제 1
Q 고전 역학에서 운동 에너지가 장벽보다 작은 입자는?
o 장벽을 통과한다
o* 장벽을 넘지 못하고 되돌아온다
o 장벽 속에 멈춘다
o 에너지가 늘어난다
:: 고전적으로는 넘을 수 없다.

= 확인 문제 2
Q 투과 확률을 크게 하는 방법은?
o 장벽을 두껍게 한다
o 장벽을 높인다
o* 장벽을 얇게 한다
o 입자의 질량을 키운다
:: 얇고 낮은 장벽, 가벼운 입자일수록 잘 통과한다.

= 확인 문제 3
Q 장벽 속에서 파동 함수의 크기는 어떻게 변하는가?
o 일정하다
o 커진다
o* 지수적으로 감소한다
o 0이 되었다가 다시 커진다
:: 장벽 속에서 지수적으로 감소한다.

= 확인 문제 4
Q 주사 터널링 현미경이 원자 크기의 높낮이를 잴 수 있는 까닭은?
o 빛의 회절을 이용해서
o* 터널링 전류가 탐침과 표면 사이 거리에 매우 민감해서
o 전자가 무거워서
o 탐침이 표면에 닿아서
:: 거리 변화에 따라 전류가 지수적으로 변한다.

= 확인 문제 5
Q 전자 100개를 투과 확률 10 %인 장벽에 쏘았을 때 옳은 것은?
o 정확히 10개가 통과한다
o* 약 10개가 통과하지만 매번 조금씩 다르다
o 모두 통과한다
o 하나도 통과하지 못한다
:: 터널링은 확률적인 현상이다.

= 생활 속 양자 터널링 | 사례
* 🔬 주사 터널링 현미경 :: 원자 배열을 직접 관찰 (1986 노벨상)
* 💾 플래시 메모리·SSD :: 터널링으로 데이터 쓰기·지우기
* ☀️ 태양 :: 수소 핵융합으로 빛과 열을 낸다
* ☢️ 알파 붕괴 :: 방사성 원소의 붕괴
* 💻 미세 반도체 :: 너무 얇은 절연막에서 누설 전류 문제
* 🧬 효소 반응 :: 생체 속 양성자·전자 터널링

= 서술형 도전 | 생각 넓히기
? 주사 터널링 현미경(STM)이 원자 크기의 높낮이를 측정하는 원리를 설명하시오. :: 탐침과 시료 표면 사이 진공 틈이 장벽 역할을 하고, 터널링 전류는 틈의 거리에 매우 민감하게(지수적으로) 변한다. 전류 변화를 측정해 원자 수준의 높낮이를 알아낸다.
? 태양 중심의 온도만으로는 부족한데도 핵융합이 일어나는 까닭을 터널링으로 설명하시오. :: 원자핵 사이의 전기적 반발이 만든 에너지 장벽을 고전적으로는 넘을 수 없지만, 양자 터널링으로 일정 확률로 통과해 서로 가까워져 핵융합이 일어난다. 태양에는 원자핵이 매우 많아 충분한 반응이 일어난다.

= 오늘 배운 내용 정리
- 고전: 에너지가 부족하면 장벽을 [[넘을 수 없다]].
- 양자: 파동 함수가 장벽 속에서 [[지수적으로]] 감소, 얇으면 반대편에 남음
- 확률적으로 통과 → [[양자 터널링]]
- 장벽이 [[얇을수록]], 낮을수록, 질량이 작을수록 잘 통과
- 활용: [[STM]], 플래시 메모리, 핵융합

= 나가기 전 한 문제 | 형성평가
? 투과 확률 1.81 %인 장벽에 전자 5000개를 쏘았을 때 통과하는 전자 수를 어림하고, 장벽을 더 두껍게 하면 어떻게 되는지 쓰시오. :: 5000 × 0.0181 ≈ 90개. 장벽이 두꺼워지면 투과 확률이 지수적으로 줄어 통과 수가 크게 감소한다.
