# 자기장 속 전하의 운동 | 로런츠 힘과 질량 분석기 | 고등학교 전자기와 양자 · 02 자기장과 전자기 유도 · 2차시 | 2022 개정 교육과정 [12전자01-04]

= 오늘의 학습 목표 | 2차시
^ 자기장 속에서 운동하는 전하가 받는 **로런츠 힘**을 구할 수 있다.
^ 로런츠 힘에 의한 **등속 원운동**의 반지름과 주기를 구할 수 있다.
^ **질량 분석기**로 입자를 구별하는 원리를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 로런츠 힘 8분 → 원운동의 반지름·주기 8분 → 질량 분석기 게임(시뮬레이션) 14분 → 계산·문항 10분

= 오로라는 왜 극지방에서만? | 생각 열기
* 🌌 오로라 :: 북극·남극 가까운 하늘에서 춤추는 빛
* ☀️ 태양풍 :: 태양에서 쏟아지는 대전 입자
* 🧲 지구 자기장 :: 생명체를 지키는 보이지 않는 방패
* 🔬 질량 분석기 :: 원자 하나의 질량을 구별한다
? 태양풍의 대전 입자가 지구 자기장을 만나면 어떻게 움직일까? :: 자기장으로부터 **로런츠 힘**을 받아 자기력선을 감으며 나선 운동하고, 자기력선이 모이는 **극지방**으로 들어와 오로라를 만든다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 전류가 받는 자기력 | F = BIL (물리학) |
| 등속 원운동 | 구심력 F = mv²/r (역학과 에너지) |
| 전기장 속 전하 | F = qE (01 전기장과 전위) |
? 전류는 무엇의 흐름일까? :: 전하의 흐름 — 그러니 자기장 속에서 **움직이는 전하 하나**도 힘을 받는다.

## 로런츠 힘 | 움직이는 전하가 받는 자기력

= 로런츠 힘
! F = qvB
- 자기장 B에 ==수직==으로 속력 v로 움직이는 전하 q가 받는 힘
- 방향: 속도와 자기장 모두에 [[수직]] (오른손 법칙)
- 음전하는 양전하와 [[반대]] 방향으로 힘을 받는다.
>+ 정지한 전하는 자기력을 받지 **않는다** (v = 0 → F = 0).

= 로런츠 힘은 일을 하지 않는다
- 힘이 항상 속도에 수직 → 이동 방향의 힘 성분이 0 → 일 = [[0]]
- 그래서 [[속력]]은 변하지 않고 **방향만** 바뀐다.
>+ 로런츠 힘이 **구심력** → 자기장 속 전하는 등속 원운동

= 원운동의 반지름과 주기
! qvB = mv²/r → r = mv / qB
! T = 2πm / qB
| 바꾸는 것 | 반지름 r | 주기 T |
|+ 속력 2배 | [[2배]] | [[변화 없음]] |
|+ 자기장 2배 | [[1/2배]] | 1/2배 |
|+ 질량 2배 | 2배 | 2배 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#lorentz | 속력 2.0 × 10⁶ m/s, 자기장 200 mT에서 입자별 도착 지점을 기록한 뒤 검출기 맞히기에 도전하자.
% 게임 규칙: 검출기 위치 d를 보고 B = 2mv/(qd)로 먼저 계산 → 입력 → 확인

= 질량 분석기 | 시뮬레이션 기록 (2 × 10⁶ m/s, 200 mT)
| 입자 | 양성자 | 중수소 핵 | 알파 입자 | 반양성자 |
|+ m/q (u/e) | 1 | 2 | 2 | 1 (음전하) |
|+ 도착 지점 2r (cm) | 20.8 | [[41.5]] | [[41.5]] | [[20.8]] (반대쪽) |
- 중수소 핵과 알파 입자는 m/q가 같아 [[같은 지점]]에 도착한다.

= 자기장과 도착 지점 | 그래프
C 자기장에 따른 도착 지점 (2 × 10⁶ m/s) | 자기장 (mT) | 도착 지점 2r (cm) | 양성자:100,41.5 150,27.7 200,20.8 300,13.8 400,10.4 | 중수소 핵:100,83 150,55.3 200,41.5 300,27.7 400,20.8
||
- 자기장 2배 → 반지름 [[1/2]]배 (r ∝ 1/B)
- 같은 자기장에서 반지름은 [[m/q]]에 비례
~ 질량 1 u = 1.66 × 10⁻²⁷ kg, e = 1.6 × 10⁻¹⁹ C

= 예제 1 · 양성자의 궤도 | 적용
- 양성자(m = 1.66 × 10⁻²⁷ kg, q = 1.6 × 10⁻¹⁹ C), v = 2 × 10⁶ m/s, B = 0.2 T
^+ r = mv/qB = 1.66 × 10⁻²⁷ × 2 × 10⁶ ÷ (1.6 × 10⁻¹⁹ × 0.2)
^+ ≈ **0.104 m** → 도착 지점 2r ≈ **20.8 cm**
^+ T = 2πm/qB ≈ **3.3 × 10⁻⁷ s**

= 예제 2 · 검출기 맞히기 | 적용
- 같은 양성자를 지름 30 cm 지점의 검출기에 넣으려면?
^+ d = 2r = 2mv/qB → B = 2mv/(qd)
^+ B = 2 × 1.66 × 10⁻²⁷ × 2 × 10⁶ ÷ (1.6 × 10⁻¹⁹ × 0.3)
^+ ≈ **0.138 T** = **138 mT**

= 예제 3 · 속력을 2배로 | 적용
- 같은 자기장에서 양성자의 속력을 2배로 하면?
^+ 반지름 r ∝ v → **2배**
^+ 주기 T = 2πm/qB → **변하지 않는다**
>+ 빠른 입자는 큰 원을, 느린 입자는 작은 원을 **같은 시간**에 돈다 → **사이클로트론**의 원리

= 확인 문제 1
Q 자기장 속에서 운동하는 전하가 받는 로런츠 힘에 대한 설명으로 옳은 것은?
o 전하의 속력을 증가시킨다
o* 속도에 항상 수직이다
o 정지한 전하도 받는다
o 자기장과 같은 방향이다
:: 속도에 수직이므로 일을 하지 않고 방향만 바꾼다.

= 확인 문제 2
Q 자기장의 세기를 2배로 하면 전하의 원운동 반지름은?
o 2배
o* 1/2배
o 4배
o 그대로
:: r = mv/qB

= 확인 문제 3
Q 같은 속력으로 자기장에 들어온 양성자와 반양성자의 운동으로 옳은 것은?
o 같은 방향으로 휜다
o* 같은 반지름으로 반대 방향으로 휜다
o 반양성자는 휘지 않는다
o 반양성자의 반지름이 2배이다
:: 질량·전하량 크기는 같고 부호만 반대

= 확인 문제 4
Q 자기장 속 전하의 원운동 주기와 관계없는 것은?
o 질량
o 전하량
o 자기장의 세기
o* 속력
:: T = 2πm/qB

= 확인 문제 5
Q 질량 분석기에서 같은 지점에 도착하는 두 입자의 공통점은? (속력이 같을 때)
o 질량이 같다
o 전하량이 같다
o* 질량 ÷ 전하량이 같다
o 운동 에너지가 같다
:: r = mv/qB → m/q가 같으면 반지름이 같다.

= 생활 속 로런츠 힘 | 사례
* 🌌 오로라 :: 대전 입자가 자기력선을 따라 극지방으로
* 🔬 질량 분석기 :: 동위 원소 구별, 도핑 검사, 연대 측정
* ⚛️ 사이클로트론 :: 입자를 가속해 암 치료용 방사성 동위 원소 생산
* 🏥 양성자 치료기 :: 자기장으로 양성자 빔의 방향 조절
* 📺 브라운관 TV :: 자기장으로 전자 빔을 휘어 화면에 그림
* 🔭 거품 상자 :: 휘는 궤적으로 새로운 입자 발견

= 서술형 도전 | 생각 넓히기
? 중수소 핵과 알파 입자가 같은 속력으로 질량 분석기에 들어오면 같은 지점에 도착하는 까닭을 쓰시오. :: r = mv/qB에서 m/q가 두 입자 모두 2 u/e로 같기 때문이다.
? 극지방에서만 오로라가 잘 보이는 까닭을 로런츠 힘으로 설명하시오. :: 대전 입자는 자기력선에 수직한 방향으로는 휘어져 돌기 때문에 자기력선을 따라 나선 운동하며 이동한다. 자기력선이 모이는 극지방으로 입자가 들어와 대기 분자와 충돌하며 빛(오로라)을 낸다.

= 오늘 배운 내용 정리
- 로런츠 힘 F = [[qvB]], 속도에 항상 [[수직]]
- 일을 하지 않아 [[속력]]은 변하지 않는다.
- 원운동 반지름 r = [[mv/qB]]
- 주기 T = [[2πm/qB]] → 속력과 무관
- 질량 분석기: 반지름이 [[m/q]]에 비례

= 나가기 전 한 문제 | 형성평가
