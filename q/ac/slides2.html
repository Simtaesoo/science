# 교류 회로와 에너지 | 저항·코일·축전기는 에너지를 어떻게 다룰까 | 고등학교 전자기와 양자 · 03 자기장과 교류 · 2차시 | 2022 개정 교육과정 [전자기와 양자 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ **교류**의 실횻값과 교류 회로에서 소비되는 **전력**을 설명할 수 있다.
^ 저항·코일·축전기가 교류 회로에서 **에너지를 어떻게 다루는지**(소비·저장·방출) 비교할 수 있다.
^ 진동수에 따라 코일과 축전기가 전류를 방해하는 정도가 달라짐을 **활용 예**와 연결할 수 있다.
% 흐름: 생각 열기 5분 → 교류·실횻값 8분 → 세 소자와 에너지 10분 → 진동수와 전류(시뮬레이션) 12분 → 활용·문항 10분
% 2022 개정 '전자기와 양자' 적용 시 고려 사항: RLC 회로는 전기 진동(공명) 개념 없이 에너지 측면에서만 다룬다. 공명 진동수 f₀ = 1/(2π√LC), 임피던스 식을 이용한 계산은 하지 않는다.

= 콘센트의 전기는 왜 교류일까? | 생각 열기
* 🔌 콘센트 :: 220 V, 60 Hz — 1초에 60번 방향이 바뀐다
* 🔊 스피커 :: 고음은 작은 스피커, 저음은 큰 스피커로 나뉘어 간다
* 💡 형광등 안정기 :: 코일이 전류가 갑자기 커지는 것을 막는다
* 📷 카메라 플래시 :: 축전기에 모아 둔 에너지를 한꺼번에 쓴다
? 교류 회로에서 코일과 축전기는 저항처럼 에너지를 '써 버릴까'? :: 아니다. 저항은 전기 에너지를 **열**로 바꾸지만, 코일과 축전기는 에너지를 잠시 **저장했다가 다시 내보낸다**.

= 이전에 배운 내용 떠올리기 | 복습
- 축전기: 두 판 사이 [[전기장]]에 에너지를 저장 (02 축전기와 회로)
- 전자기 유도: 자기 선속이 [[변할]] 때 유도 기전력 (물리학)
? 코일에 흐르는 전류가 갑자기 변하면 코일은 어떻게 반응할까? :: 자체 유도로 전류의 **변화를 방해**하는 기전력이 생긴다.

## 교류와 전력 | 방향이 바뀌는 전류

= 교류
- 전압과 전류의 크기와 방향이 ==주기적으로== 바뀌는 전류
- 우리나라 가정용: 실횻값 **220 V**, 진동수 **60 Hz**
! 실횻값 = 최댓값 ÷ √2
- 실횻값: 같은 저항에서 같은 열을 내는 직류의 값
~ 220 V 교류의 최댓값은 약 220 × 1.41 ≈ [[311 V]]

= 세 소자와 에너지 | 개념 정리
| 소자 | 에너지를 다루는 방식 | 진동수가 높을수록 |
|+ 저항 R | 전기 에너지를 **열**로 전환 (소비) | 전류 방해 정도 [[변화 없음]] |
|+ 코일 L | **자기장**에 에너지를 저장했다가 되돌려 줌 | 전류를 [[더 방해]] |
|+ 축전기 C | **전기장**에 에너지를 저장했다가 되돌려 줌 | 전류를 [[덜 방해]] |
>+ 한 주기 동안 평균하면 전기 에너지를 실제로 **소비**하는 것은 저항뿐이다.
~ 코일·축전기가 교류를 방해하는 정도를 리액턴스라고 한다 (단위 Ω).

= 왜 진동수에 따라 다를까?
^+ 코일: 전류가 **빨리** 변할수록 자체 유도 기전력이 커져 변화를 더 강하게 **방해**
^+ 축전기: 진동수가 높으면 판이 가득 차기 전에 방향이 바뀌어 전하가 계속 **드나든다** → 전류가 잘 흐른다
^+ 직류(진동수 0): 코일은 그냥 도선처럼, 축전기는 충전이 끝나면 전류가 **끊긴다**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#rlc | 진동수를 낮은 쪽에서 높은 쪽으로 바꾸며 코일과 축전기가 전류를 방해하는 정도(X_L, X_C)의 변화를 기록하자.
% 공명 곡선의 봉우리를 계산하게 하지 않는다. 진동수에 따라 X_L은 커지고 X_C는 작아지는 경향만 확인한다.

= 진동수에 따른 변화 | 시뮬레이션 기록
| 진동수 (Hz) | 20 | 50 | 300 | 800 |
|+ 코일 X_L (Ω) | 12.6 | 31.4 | 188.5 | 502.7 |
|+ 축전기 X_C (Ω) | 795.8 | 318.3 | 53.1 | 19.9 |
- 진동수가 높아지면 X_L은 [[커지고]], X_C는 [[작아진다]].

## 활용 | 진동수로 신호 나누기

= 예제 1 · 스피커 크로스오버 | 적용
- 앰프에서 나온 신호를 고음용 트위터와 저음용 우퍼로 나누려고 한다.
^+ 트위터 앞 → **축전기**: 높은 진동수(고음)는 잘 통과, 낮은 진동수는 막음
^+ 우퍼 앞 → **코일**: 낮은 진동수(저음)는 잘 통과, 높은 진동수는 막음
>+ 소자가 진동수에 따라 전류를 방해하는 정도가 다르다는 성질을 이용한다.

= 예제 2 · 저항과 축전기의 에너지 | 적용
- 같은 교류 전원에 전구(저항)만 연결한 회로와 축전기만 연결한 회로를 비교했다.
^+ 전구 → 전기 에너지가 빛과 **열**로 바뀌어 회로 밖으로 나간다
^+ 축전기 → 반 주기 동안 에너지를 **저장**, 다음 반 주기에 전원으로 **되돌려 준다**
^+ 한 주기 평균 소비 전력 → 전구는 **있음**, 축전기만 있는 회로는 거의 **0**

= 예제 3 · 실횻값과 소비 전력 | 적용
- 실횻값 220 V 교류에 저항 44 Ω인 전열기를 연결했다.
^+ 전류의 실횻값 = 220 ÷ 44 = **5 A**
^+ 소비 전력 = 220 × 5 = **1100 W**
>+ 교류에서도 저항이 소비하는 전력은 실횻값으로 직류처럼 계산한다.

= 확인 문제 1
Q 진동수가 높아질 때 코일이 전류를 방해하는 정도는?
o 작아진다
o* 커진다
o 변하지 않는다
o 0이 된다
:: 전류가 빨리 변할수록 자체 유도 기전력이 커서 더 방해한다.

= 확인 문제 2
Q 교류 회로에서 한 주기 동안 평균적으로 전기 에너지를 소비하는 소자는?
o 코일
o 축전기
o* 저항
o 셋 모두
:: 코일과 축전기는 에너지를 저장했다가 되돌려 주고, 저항만 열로 소비한다.

= 확인 문제 3
Q 축전기에 대한 설명으로 옳은 것은?
o 진동수가 높을수록 전류를 더 방해한다
o* 전기장에 에너지를 저장했다가 되돌려 준다
o 직류를 계속 잘 흐르게 한다
o 자기장에 에너지를 저장한다
:: 축전기는 진동수가 높을수록 전류를 덜 방해하고, 직류는 충전이 끝나면 흐르지 않는다.

= 확인 문제 4
Q 스피커 회로에서 고음용 트위터 앞에 연결하기 알맞은 소자는?
o 코일
o* 축전기
o 큰 저항
o 전지
:: 축전기는 높은 진동수를 잘 통과시키고 낮은 진동수를 막는다.

= 확인 문제 5
Q 실횻값 220 V 교류 전압의 최댓값은 약 얼마인가?
o 156 V
o 220 V
o* 311 V
o 440 V
:: 220 × √2 ≈ 311 V

= 생활 속 교류 회로 | 사례
* 🔊 스피커 크로스오버 :: 코일·축전기로 고음·저음 분리
* 🔌 전원 장치 :: 축전기가 전압의 출렁임을 매끄럽게 한다
* 💡 안정기 :: 코일이 갑작스러운 전류 변화를 막는다
* 📷 카메라 플래시 :: 축전기에 저장한 에너지를 순간 방출
* 🍳 인덕션 :: 높은 진동수의 교류로 냄비에 유도 전류
* 📻 라디오 :: 코일과 축전기로 원하는 진동수의 신호를 골라낸다

= 서술형 도전 | 생각 넓히기
? 스피커 회로에서 트위터 앞에는 축전기를, 우퍼 앞에는 코일을 연결하는 까닭을 쓰시오. :: 축전기는 진동수가 높을수록 전류를 덜 방해해 고음 신호를 잘 통과시키므로 트위터 앞에, 코일은 진동수가 낮을수록 전류를 덜 방해해 저음 신호를 잘 통과시키므로 우퍼 앞에 연결한다.
? 교류 회로에서 코일과 축전기만 있으면 한 주기 동안 평균 소비 전력이 거의 0인 까닭을 에너지로 설명하시오. :: 코일은 자기장에, 축전기는 전기장에 에너지를 반 주기 동안 저장했다가 다음 반 주기에 전원으로 되돌려 주므로 열 등으로 소비되는 에너지가 거의 없다.

= 오늘 배운 내용 정리
- 교류 실횻값 = 최댓값 ÷ [[√2]]
- 저항: 전기 에너지를 [[열]]로 소비
- 코일: [[자기장]]에 저장·방출, 진동수가 높을수록 전류를 더 방해
- 축전기: [[전기장]]에 저장·방출, 진동수가 높을수록 전류를 덜 방해

= 나가기 전 한 문제 | 형성평가
? 실횻값 220 V 교류에 55 Ω 전열기를 연결했을 때 전류의 실횻값과 소비 전력을 구하고, 같은 전원에 축전기만 연결하면 소비 전력이 어떻게 되는지 쓰시오. :: I = 220 ÷ 55 = 4 A, P = 220 × 4 = 880 W. 축전기만 연결하면 에너지를 저장했다 되돌려 주므로 평균 소비 전력은 거의 0이다.
