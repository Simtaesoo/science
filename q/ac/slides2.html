# 교류와 RLC 회로의 공명 | 라디오는 어떻게 방송을 고를까 | 고등학교 전자기와 양자 · 03 자기장과 교류 · 2차시 | 2022 개정 교육과정 [전자기와 양자 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ 교류 회로에서 코일과 축전기의 역할을 **리액턴스**로 설명할 수 있다.
^ 직렬 RLC 회로의 **임피던스**와 전류를 구할 수 있다.
^ **공명 진동수**를 구하고 라디오, 무선 충전 등의 활용을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 교류·리액턴스 10분 → 공명 곡선(시뮬레이션) 12분 → 라디오 맞추기 8분 → 계산·문항 10분

= 수많은 방송 중 하나만? | 생각 열기
* 📻 라디오 :: 다이얼을 돌리면 한 방송만 또렷하게
* 📱 무선 충전 :: 패드 위에 놓기만 하면 충전
* 🔊 스피커 :: 고음은 작은 스피커, 저음은 큰 스피커로
* 🏷️ 도난 방지 태그 :: 문을 지나면 삐 소리
? 공중에 수많은 전파가 섞여 있는데 라디오는 어떻게 원하는 방송만 골라낼까? :: 회로의 **공명 진동수**를 방송국의 진동수에 맞추면 그 신호만 큰 전류를 만든다.

= 이전에 배운 내용 떠올리기 | 복습
- 축전기: 전하를 저장, 시간 상수 τ = [[RC]] (02 축전기와 회로)
- 전자기 유도: 자기 선속이 [[변할]] 때 유도 기전력 (물리학)
- 단진동의 [[공명]]: 고유 진동수와 같은 진동을 받으면 진폭이 커진다 (역학과 에너지)
? 코일에 흐르는 전류가 갑자기 변하면 코일은 어떻게 반응할까? :: 자체 유도로 전류의 **변화를 방해**하는 기전력이 생긴다.

## 교류와 리액턴스 | 진동수에 따라 달라지는 방해

= 교류
- 전압과 전류의 크기와 방향이 ==주기적으로== 바뀌는 전류
- 우리나라 가정용: 실횻값 **220 V**, 진동수 **60 Hz**
! 실횻값 = 최댓값 ÷ √2
~ 220 V 교류의 최댓값은 약 220 × 1.41 ≈ [[311 V]]

= 리액턴스
| 소자 | 리액턴스 | 진동수가 높을수록 | 위상 |
|+ 저항 R | R (일정) | 그대로 | 전압과 같다 |
|+ 코일 L | X_L = [[2πfL]] | 전류를 [[더 방해]] | 전류가 [[늦다]] |
|+ 축전기 C | X_C = [[1/2πfC]] | 전류를 [[덜 방해]] | 전류가 [[앞선다]] |

= 임피던스와 공명
! Z = √(R² + (X_L − X_C)²)
- 전류 I = V / Z
- X_L = X_C일 때 Z = [[R]]로 최소 → 전류 ==최대== → **공명**
! 공명 진동수 f₀ = 1 / (2π√LC)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#rlc | R = 20 Ω, L = 100 mH, C = 10 μF에서 진동수를 바꾸며 X_L, X_C, 전류를 기록하자. [방송국 맞추기]에도 도전하자.
% 방송국 맞추기: C = 1/(4π²f²L)로 먼저 계산하게 하기

= 진동수와 전류 | 시뮬레이션 기록 (전원 10 V)
| 진동수 (Hz) | 20 | 50 | 159 | 300 | 800 |
|+ X_L (Ω) | 12.6 | 31.4 | [[99.9]] | 188.5 | 502.7 |
|+ X_C (Ω) | 795.8 | 318.3 | [[100.1]] | 53.1 | 19.9 |
|+ 전류 (mA) | 13 | 35 | [[500]] | 73 | 21 |
- 159 Hz에서 X_L ≈ X_C → 전류 [[최대]]

= 공명 곡선 | 그래프
C 진동수에 따른 전류 (R = 20 Ω, L = 100 mH, C = 10 μF) | 진동수 (Hz) | 전류 (mA) | 전류:20,13 50,35 100,102 130,220 145,366 159,500 175,362 200,199 250,105 300,73 500,35 800,21
||
- 공명 진동수 f₀ = 1 ÷ (2π√(0.1 × 10⁻⁵)) ≈ [[159]] Hz
- 저항이 작을수록 봉우리가 ==뾰족== → 방송을 더 잘 골라낸다.

## 공명의 활용 | 원하는 진동수만 골라내기

= 예제 1 · 라디오 맞추기 | 적용
- 300 Hz 방송국을 L = 100 mH로 받으려면 C는?
^+ f₀ = 1/(2π√LC) → C = 1 ÷ (4π²f²L)
^+ C = 1 ÷ (39.5 × 300² × 0.1) ≈ **2.8 × 10⁻⁶ F** (2.8 μF)
>+ 실제 라디오는 가변 축전기로 C를 바꿔 방송을 고른다.

= 예제 2 · 공명 진동수 | 적용
- L = 1 mH, C = 1 nF인 회로 (π ≈ 3.14)
^+ √LC = √(10⁻³ × 10⁻⁹) = **10⁻⁶**
^+ f₀ = 1 ÷ (2π × 10⁻⁶) ≈ **1.59 × 10⁵ Hz** (약 159 kHz)

= 예제 3 · 공명 상태의 전류 | 적용
- 공명 상태, 전원 전압 10 V, 저항 20 Ω
^+ Z = R = 20 Ω → I = 10 ÷ 20 = **0.5 A**
^+ 코일과 축전기 전압은 크기가 **같고** 위상이 **반대** → 서로 상쇄
^+ 50 Hz에서는 Z ≈ 288 Ω → I ≈ **35 mA**로 크게 줄어든다.

= 확인 문제 1
Q 진동수가 높아질 때 코일의 유도 리액턴스는?
o 작아진다
o* 커진다
o 변하지 않는다
o 0이 된다
:: X_L = 2πfL ∝ f

= 확인 문제 2
Q 직렬 RLC 회로가 공명할 때 옳은 것은?
o 임피던스가 최대이다
o* 임피던스가 R과 같고 전류가 최대이다
o 전류가 0이다
o X_L이 X_C의 2배이다
:: X_L = X_C → Z = R

= 확인 문제 3
Q L을 4배로 하면 공명 진동수는?
o 4배
o 2배
o* 1/2배
o 1/4배
:: f₀ ∝ 1/√L

= 확인 문제 4
Q 스피커 회로에서 고음용 트위터 앞에 연결하기 알맞은 소자는?
o 코일
o* 축전기
o 큰 저항
o 전지
:: 축전기는 높은 진동수를 잘 통과시키고 낮은 진동수를 막는다.

= 확인 문제 5
Q 실횻값 220 V 교류 전압의 최댓값은 약 얼마인가?
o 156 V
o 220 V
o* 311 V
o 440 V
:: 220 × √2 ≈ 311 V

= 생활 속 교류와 공명 | 사례
* 📻 라디오·TV 튜너 :: 공명 진동수를 방송 주파수에 맞춘다
* 📱 무선 충전 :: 패드와 휴대 전화 코일의 공명
* 🔊 스피커 크로스오버 :: 코일·축전기로 고음·저음 분리
* 🏷️ 도난 방지 태그 :: 태그 속 LC 회로가 특정 진동수에 공명
* 🍳 인덕션 :: 고주파 교류로 냄비에 유도 전류
* 🩻 MRI :: 원자핵의 공명 진동수를 이용

= 서술형 도전 | 생각 넓히기
? 스피커 회로에서 트위터 앞에는 축전기를, 우퍼 앞에는 코일을 연결하는 까닭을 리액턴스로 설명하시오. :: 축전기는 진동수가 높을수록 X_C가 작아 고음 신호를 잘 통과시키므로 트위터 앞에, 코일은 진동수가 낮을수록 X_L이 작아 저음 신호를 잘 통과시키므로 우퍼 앞에 연결한다.
? 무선 충전기가 패드와 스마트폰 코일의 공명 진동수를 같게 맞추는 까닭을 추론하시오. :: 공명 진동수에서 임피던스가 최소가 되어 같은 전압으로 큰 전류(에너지)를 전달할 수 있고, 다른 진동수의 물체에는 에너지가 잘 전달되지 않아 효율이 높다.

= 오늘 배운 내용 정리
- 교류 실횻값 = 최댓값 ÷ [[√2]]
- X_L = [[2πfL]], X_C = [[1/2πfC]]
- 임피던스 Z = √(R² + (X_L − X_C)²)
- 공명: X_L = X_C, Z = [[R]], 전류 최대
- 공명 진동수 f₀ = [[1/(2π√LC)]]

= 나가기 전 한 문제 | 형성평가
? L = 100 mH, C = 10 μF인 회로의 공명 진동수를 구하고, C를 1/4로 줄이면 공명 진동수가 어떻게 되는지 쓰시오. :: f₀ = 1 ÷ (2π × 10⁻³) ≈ 159 Hz, C를 1/4로 → f₀ ∝ 1/√C → 2배(약 318 Hz)
