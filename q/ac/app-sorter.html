<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>입자 분류기와 라디오 · 고3 전자기와 양자 자기장과 교류</title>
<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/app.js"></script>
<script src="../../assets/hskit.js"></script>
</head>
<body>
<script>
const app = AppKit({
  id: 'qsorter', title: '입자 분류기와 라디오', unit: '고3 · 전자기와 양자 · 48 자기장과 교류', back: '../../index.html#eq', sim: 'sim.html#lorentz', dark: true,
  lead: '연구소의 <b>입자 분류기</b>를 운전하세요. 속도 선택기로 원하는 속력의 이온만 통과시키고, 자기장으로 휘게 해 검출기에 정확히 보내야 해요. 마지막엔 <b>RLC 공명</b>으로 라디오 방송도 잡아 보세요!',
  howto: ['<b>속도 선택기</b>: 전기력 qE와 자기력 qvB가 같으면 휘지 않고 통과 → v = E/B.', '<b>질량 분석기</b>: 반지름 r = mv/qB인 반원을 그리고 지름 2r 지점에 떨어져요.', '라디오 단계: 공명 진동수 f₀ = 1/(2π√LC)를 방송 진동수에 맞추세요.'],
  recap: '자기장 B 속에서 속도 v로 움직이는 전하 q는 속도에 수직인 <b>로런츠 힘</b> F = qvB를 받아 등속 원운동한다: r = mv/qB. <b>속도 선택기</b>는 전기장과 자기장을 수직으로 걸어 qE = qvB인 속력 v = E/B의 입자만 곧게 통과시킨다. 같은 속력이면 반지름은 m/q에 비례하므로 <b>질량 분석기</b>로 동위 원소를 구별할 수 있다. <b>RLC 회로</b>는 X_L = X_C가 되는 공명 진동수 f₀ = 1/(2π√LC)에서 전류가 최대가 되어 원하는 방송만 골라낸다.',
  startLabel: '분류기 가동'
});
const {S, sfx, toast} = app, D = Draw;
const U = 1.66e-27, E = 1.6e-19;
const LV = [
  {t: 'ms', ion: '양성자', m: 1, q: 1, v: 2e6, d: 30, why: 'B = 2mv/(qd) = 2 × 1.66 × 10⁻²⁷ × 2 × 10⁶ ÷ (1.6 × 10⁻¹⁹ × 0.30) ≈ 138 mT.'},
  {t: 'vs', Ef: 3e5, v: 1.5e6, why: 'v = E/B → B = 3 × 10⁵ ÷ 1.5 × 10⁶ = 0.2 T. 이보다 빠른 입자는 자기력이, 느린 입자는 전기력이 더 커서 휘어져요.'},
  {t: 'both', ion: '중수소 핵', m: 2, q: 1, Ef: 4e5, v: 2e6, d: 52, why: '선택기 B₁ = 4 × 10⁵ ÷ 2 × 10⁶ = 0.2 T, 분석기 B₂ = 2 × 2 × 1.66 × 10⁻²⁷ × 2 × 10⁶ ÷ (1.6 × 10⁻¹⁹ × 0.52) ≈ 160 mT.'},
  {t: 'ms', ion: '탄소-14 이온 (¹⁴C⁺)', m: 14, q: 1, v: 2e5, d: 20, other: [12, '탄소-12'], why: 'B = 2 × 14 × 1.66 × 10⁻²⁷ × 2 × 10⁵ ÷ (1.6 × 10⁻¹⁹ × 0.20) ≈ 290 mT. 같은 자기장에서 탄소-12는 약 17 cm에 떨어져 분리돼요 → 방사성 탄소 연대 측정!'},
  {t: 'rlc', f: 1e6, L: 1e-4, why: 'C = 1/(4π²f²L) = 1 ÷ (39.5 × 10¹² × 10⁻⁴) ≈ 253 pF. 공명 진동수에서만 전류가 크게 흘러 그 방송이 들려요.'}];
let ui = {}, B1, B2, Cc, shot = null;
const rOf = (L, B) => L.m * U * L.v / (L.q * E * B);
const k = HS(app, {levels: LV, load(L){ shot = null; [B1, B2, Cc].forEach(s => s.wrap.style.display = 'none');
  if (L.t === 'ms') { B2.wrap.style.display = ''; B2.set(100); k.mission(ui.g, `<b>${L.ion}</b> (속력 ${(L.v / 1e6).toFixed(1)} × 10⁶ m/s)를 입구에서 <b>${L.d} cm</b> 떨어진 검출기에 보내세요. (±0.5 cm)`); }
  else if (L.t === 'vs') { B1.wrap.style.display = ''; B1.set(100); k.mission(ui.g, `여러 속력의 이온이 섞여 있어요. 전기장 ${(L.Ef / 1e5).toFixed(0)} × 10⁵ V/m인 속도 선택기로 <b>${(L.v / 1e6).toFixed(1)} × 10⁶ m/s</b>의 이온만 통과시키세요.`); }
  else if (L.t === 'both') { B1.wrap.style.display = B2.wrap.style.display = ''; B1.set(100); B2.set(100); k.mission(ui.g, `선택기(전기장 ${(L.Ef / 1e5).toFixed(0)} × 10⁵ V/m)로 <b>${(L.v / 1e6).toFixed(0)} × 10⁶ m/s</b>의 <b>${L.ion}</b>만 골라 <b>${L.d} cm</b> 검출기에 보내세요.`); }
  else { Cc.wrap.style.display = ''; Cc.set(100); k.mission(ui.g, `코일 L = 0.1 mH인 라디오로 <b>1 MHz</b> 방송을 잡으세요. (±2 %)`); } info(); }});
function info(){ const L = k.L(); shot = null; let h = '';
  if (L.t === 'ms' || L.t === 'both') h += `<p>반지름 r = <b>${(rOf(L, B2.v / 1000) * 100).toFixed(1)} cm</b> → 도착 <b>${(2 * rOf(L, B2.v / 1000) * 100).toFixed(1)} cm</b></p>`;
  if (L.t === 'vs' || L.t === 'both') h += `<p>통과 속력 E/B = <b>${(L.Ef / (B1.v / 1000) / 1e6).toFixed(2)} × 10⁶ m/s</b></p>`;
  if (L.t === 'rlc') h += `<p>공명 진동수 <b>${(1 / (2 * Math.PI * Math.sqrt(L.L * Cc.v * 1e-12)) / 1e6).toFixed(3)} MHz</b></p>`; ui.r.innerHTML = h; }
app.onStart = () => { ui.g = app.panel('운전 과제'); ui.c = app.panel('조절');
  B1 = k.slider(ui.c, {label: '선택기 B₁', min: 50, max: 500, step: 1, val: 100, fmt: v => v + ' mT', on: info});
  B2 = k.slider(ui.c, {label: '분석기 B₂', min: 50, max: 500, step: 1, val: 100, fmt: v => v + ' mT', on: info});
  Cc = k.slider(ui.c, {label: '가변 축전기 C', min: 100, max: 500, step: 1, val: 100, fmt: v => v + ' pF', on: info});
  ui.r = document.createElement('div'); ui.r.style.marginTop = '6px'; ui.c.appendChild(ui.r);
  ui.b = app.panel(''); k.btn(ui.b, '⚛️ 발사 / 확인', () => { const L = k.L(); shot = {t: 0}; sfx.zap();
    if (L.t === 'rlc') { const f = 1 / (2 * Math.PI * Math.sqrt(L.L * Cc.v * 1e-12)); if (Math.abs(f - L.f) / L.f > .02) return k.fail(`${(f / 1e6).toFixed(3)} MHz — 지지직… 방송이 안 잡혀요`); return k.win(ui.g, L.why, `${Cc.v} pF`); }
    if (L.t !== 'ms' && Math.abs(L.Ef / (B1.v / 1000) - L.v) / L.v > .02) return k.fail('원하는 이온이 선택기에서 휘어져 막혔어요');
    if (L.t === 'vs') return k.win(ui.g, L.why, `B₁ = ${B1.v} mT`);
    const x = 2 * rOf(L, B2.v / 1000) * 100; if (Math.abs(x - L.d) > .5) return k.fail(`${x.toFixed(1)} cm에 떨어졌어요 — 검출기는 ${L.d} cm`); k.win(ui.g, L.why, `B₂ = ${B2.v} mT`); });
  k.begin(); };
app.step = dt => { if (shot) shot.t += dt; };
k.draw((g, W, H) => { const L = k.L(), t = performance.now() / 1000; g.fillStyle = '#0d1520'; g.fillRect(0, 0, W, H);
  if (L.t === 'rlc') { const f0 = 1 / (2 * Math.PI * Math.sqrt(L.L * Cc.v * 1e-12)) / 1e6, A = k.axes(g, {x: 56, y: 30, w: W - 80, h: H - 80}, [.6, 1.6, .2], [0, 1, .25], '진동수 (MHz)', '수신 세기', {bg: 'rgba(255,255,255,.04)'}), P = [];
    for (let f = .6; f <= 1.6; f += .005) { const x = (f / f0 - f0 / f) * 25; P.push([A.X(f), A.Y(1 / Math.sqrt(1 + x * x))]); } k.line(g, P, '#f6d365', 3);
    [[.8, 'KBS'], [1, '목표 방송'], [1.3, 'EBS']].forEach(([f, n]) => { g.strokeStyle = f === 1 ? '#9be3b5' : 'rgba(255,255,255,.35)'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(A.X(f), A.Y(0)); g.lineTo(A.X(f), A.Y(1)); g.stroke(); g.setLineDash([]); D.text(g, n, A.X(f), A.Y(1) - 10, {size: 11.5, color: '#e8eef6', weight: 700}); });
    D.text(g, `📻 ${f0.toFixed(3)} MHz`, W - 20, 20, {size: 15, weight: 700, color: '#f6d365', align: 'right'}); return; }
  const sel = L.t !== 'ms', y0 = H * .32, sx0 = 30, sx1 = sel ? W * .38 : W * .12, ex = sx1 + 24, sc = (W - ex - 30) / 60;
  D.text(g, '이온원', sx0 + 6, y0 - 22, {size: 11, color: '#b8c4d0'}); g.fillStyle = '#8ea3bd'; g.fillRect(sx0 - 10, y0 - 10, 20, 20);
  if (sel) { g.fillStyle = '#8ecdf2'; g.fillRect(sx0 + 30, y0 - 46, sx1 - sx0 - 30, 6); g.fillStyle = '#f28c7a'; g.fillRect(sx0 + 30, y0 + 40, sx1 - sx0 - 30, 6); D.text(g, '－', sx0 + 40, y0 - 56, {size: 12, color: '#8ecdf2'}); D.text(g, '＋', sx0 + 40, y0 + 58, {size: 12, color: '#f28c7a'});
    for (let x = sx0 + 50; x < sx1; x += 26) for (let y = y0 - 28; y <= y0 + 28; y += 28) { g.fillStyle = 'rgba(200,220,255,.5)'; g.beginPath(); g.arc(x, y, 2.5, 0, 7); g.fill(); } D.text(g, '속도 선택기 (B₁ ⊙)', (sx0 + sx1) / 2 + 15, y0 + 70, {size: 11.5, color: '#b8c4d0'}); }
  g.fillStyle = '#556'; g.fillRect(ex - 6, y0 - 40, 6, 34); g.fillRect(ex - 6, y0 + 6, 6, 34);
  g.fillStyle = 'rgba(120,160,230,.08)'; g.fillRect(ex, y0, W - ex - 10, H - y0 - 10); for (let x = ex + 16; x < W - 16; x += 30) for (let y = y0 + 20; y < H - 16; y += 30) D.text(g, '⊙', x, y, {size: 12, color: 'rgba(200,220,255,.35)'});
  D.text(g, 'B₂ ⊙ (지면에서 나오는 방향)', W - 20, H - 20, {size: 11.5, color: '#b8c4d0', align: 'right'});
  g.strokeStyle = '#9aa'; g.lineWidth = 3; g.beginPath(); g.moveTo(ex, y0); g.lineTo(W - 20, y0); g.stroke(); for (let c = 0; c <= 60; c += 10) D.text(g, c + ' cm', ex + c * sc, y0 - 12, {size: 10, color: '#b8c4d0'});
  if (L.d) { g.fillStyle = '#9be3b5'; g.fillRect(ex + (L.d - .5) * sc, y0 - 6, sc, 8); D.text(g, '검출기', ex + L.d * sc, y0 - 26, {size: 11.5, color: '#9be3b5', weight: 700}); }
  if (!shot) return; const p = Math.min(1, shot.t / 1.6), vok = L.t === 'ms' || Math.abs(L.Ef / (B1.v / 1000) - L.v) / L.v <= .02;
  [[L.v, '#f6d365', true]].concat(sel ? [[L.v * 1.3, '#f28c7a', false], [L.v * .75, '#8ecdf2', false]] : []).forEach(([v, col, main]) => { const pass = main ? vok : false, a = Math.min(1, p * 3);
    g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(sx0, y0); if (sel && !pass) { const dir = v > L.v ? 1 : -1, bend = (L.Ef / (B1.v / 1000) > v ? -1 : 1) * (main ? 1 : dir * (L.Ef / (B1.v / 1000) > v ? -1 : 1)); const xe = sx0 + (sx1 - sx0) * a; g.quadraticCurveTo((sx0 + xe) / 2, y0, xe, y0 - 40 * a * (v > L.Ef / (B1.v / 1000) ? 1 : -1) * -1); g.stroke(); return; }
    g.lineTo(sel ? sx1 : sx0, y0); g.lineTo(ex, y0); g.stroke(); if (p < .33 || !main) return;
    const r = (L.t === 'vs' ? 20 : rOf(L, B2.v / 1000) * 100) * sc, ang = Math.min(Math.PI, (p - .33) / .67 * Math.PI); g.beginPath(); g.arc(ex + r, y0, r, Math.PI, Math.PI - ang, true); g.stroke(); if (ang >= Math.PI) { g.fillStyle = col; g.beginPath(); g.arc(ex + 2 * r, y0, 5, 0, 7); g.fill(); } });
  if (L.other && p > .33) { const r = L.other[0] * U * L.v / (E * B2.v / 1000) * 100 * sc, ang = Math.min(Math.PI, (p - .33) / .67 * Math.PI); g.strokeStyle = 'rgba(142,205,242,.8)'; g.setLineDash([4, 3]); g.beginPath(); g.arc(ex + r, y0, r, Math.PI, Math.PI - ang, true); g.stroke(); g.setLineDash([]); if (ang >= Math.PI) D.text(g, L.other[1], ex + 2 * r, y0 + 14, {size: 11, color: '#8ecdf2'}); }
});
</script>
