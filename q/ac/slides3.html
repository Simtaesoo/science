^ 직선 도선, 원형 도선, 솔레노이드 주위 **자기장의 방향**을 오른손 법칙으로 찾을 수 있다.
^ 주어진 **자기력선** 그림을 해석하여 자기장의 세기와 방향을 추리할 수 있다.
^ 자기장의 세기가 전류의 세기, 도선으로부터의 거리, 감은 수에 따라 달라짐을 설명할 수 있다.

% 2022 개정 [12전자01-03] 해설: 자기력선을 그리는 방법 대신 이미 그려진 그림을 해석하여 자기장에 대한 정보를 추리하는 방식으로 다룬다. 이 차시는 로런츠 힘 앞에 운영한다.

= 전류가 흐르면 나침반이 돈다 | 생각 열기
* 🧭 외르스테드의 실험 :: 전류가 흐르는 도선 옆 나침반 바늘이 돌아갔다
* 🧲 전자석 :: 전류를 흘리면 철을 끌어당기고, 끊으면 놓는다
* 🏥 MRI :: 커다란 코일에 큰 전류를 흘려 강한 자기장을 만든다
* 🔔 초인종 :: 전자석이 망치를 끌어당겨 종을 친다
? 전류와 자기장은 어떤 관계일까? :: **움직이는 전하(전류)**가 주위에 자기장을 만든다. 자기장은 전기장처럼 상호작용을 전달하는 '장'이다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학
- 자석 주위에서 자기력이 작용하는 공간 → [[자기장]]
- 자기장의 방향: 나침반 [[N극]]이 가리키는 방향
- 직선 전류 주위 자기장의 방향 → 오른손 [[엄지]]를 전류 방향, 감아쥔 네 손가락 방향
? 물리학에서는 자기장을 정성적으로 다루었다. 이번에는? :: 자기력선 그림을 해석해 세기와 방향을 추리하고, 여러 전류가 만드는 자기장을 합성한다.

## 자기력선 읽기 | 그림 속 정보

= 자기력선의 성질
- 자기력선 위 한 점의 **접선 방향** = 그 점의 자기장 방향
- 자기력선이 **촘촘할수록** 자기장이 세다.
- 자기력선은 서로 **교차하지 않는다.**
- 자석 밖에서는 N극 → S극, 끊어지지 않는 **닫힌 곡선**을 이룬다.
>+ 그림에서 '방향은 접선, 세기는 밀도'를 읽는다.

## 여러 모양의 전류 | 직선, 원형, 솔레노이드

= 전류 모양에 따른 자기장
| 도선 | 자기력선 모양 | 세기를 키우려면 |
|+ 직선 도선 | 도선을 중심으로 한 [[동심원]] | 전류를 세게, 도선에 가까이 (거리에 반비례) |
|+ 원형 도선 | 중심에서 도선 면에 수직인 방향으로 모임 | 전류를 세게, 반지름을 작게 |
|+ 솔레노이드 | 내부는 축에 나란하고 [[균일]], 외부는 막대자석과 비슷 | 전류를 세게, 단위 길이당 감은 수를 많이, 철심 |
% 정량식(B = k I/r 등)은 비례 관계 확인 수준으로만 쓰고, 그림 해석 중심으로 다룬다.

= 예제 1 · 자기력선 그림 해석 | 자료 해석
- 종이면에 수직으로 놓인 직선 도선 주위의 자기력선이 시계 반대 방향 동심원으로 그려져 있다.
^+ 오른손 엄지를 세웠을 때 네 손가락이 시계 반대 방향 → 전류는 종이면에서 **나오는** 방향
^+ 도선에서 가까운 원일수록 간격이 **촘촘** → 자기장이 **세다**
^+ 도선에서 거리가 2배인 곳의 자기장 세기는 **1/2배**

= 예제 2 · 두 직선 도선 사이 | 적용
- 나란한 두 직선 도선에 같은 방향으로 같은 세기의 전류가 흐른다.
^+ 두 도선 한가운데에서 각 전류가 만드는 자기장은 크기가 같고 방향이 **반대** → 합성 자기장 **0**
^+ 두 도선은 서로 **끌어당긴다** (같은 방향 전류 사이 인력)
^+ 전류가 반대 방향이면 한가운데의 자기장은 **두 배**, 두 도선은 서로 **밀어낸다**

= 솔레노이드와 전자석 | 활용
* 🧲 전자석 기중기 :: 철심을 넣은 솔레노이드로 고철을 들어 올린다
* 🏥 MRI :: 초전도 솔레노이드로 균일하고 강한 자기장
* 🚪 전자 도어록 :: 전류로 걸쇠를 당겨 문을 연다
* 🚄 자기 부상 열차 :: 전자석의 인력과 척력으로 열차를 띄운다
* 🔊 스피커 :: 코일이 만든 자기장과 영구 자석의 상호작용

= 확인 문제 1
Q 자기력선 그림에서 알 수 있는 것으로 옳지 않은 것은?
o 자기력선이 촘촘한 곳일수록 자기장이 세다
o 자기력선 위 한 점의 접선 방향이 자기장의 방향이다
o* 자기력선은 서로 교차할 수 있다
o 자석 밖에서 자기력선은 N극에서 나와 S극으로 들어간다
:: 한 점의 자기장 방향은 하나뿐이므로 자기력선은 교차하지 않는다.

= 확인 문제 2
Q 직선 도선에 흐르는 전류를 2배로 하고 도선으로부터의 거리도 2배인 곳의 자기장 세기는 처음의 몇 배인가?
o 1/4배
o 1/2배
o* 1배
o 4배
:: 자기장은 전류에 비례하고 거리에 반비례하므로 2 × 1/2 = 1배

= 확인 문제 3
Q 솔레노이드 내부의 자기장을 세게 하는 방법이 아닌 것은?
o 전류를 세게 한다
o 단위 길이당 감은 수를 늘린다
o 철심을 넣는다
o* 솔레노이드의 지름만 크게 한다
:: 솔레노이드 내부 자기장은 전류와 단위 길이당 감은 수에 비례하며, 지름과는 거의 관계없다.

= 서술형 도전 | 생각 넓히기
? 나란한 두 전선에 같은 방향으로 전류가 흐를 때 두 전선이 서로 끌어당기는 까닭을 자기장으로 설명하시오. :: 한 전선의 전류가 만든 자기장 속에 다른 전선의 전류가 놓이므로 힘(로런츠 힘)을 받는다. 같은 방향 전류일 때 그 힘의 방향이 서로를 향하므로 끌어당긴다.
? MRI에 솔레노이드를 쓰는 까닭을 자기장의 모양과 관련지어 쓰시오. :: 솔레노이드 내부에는 축에 나란하고 균일한 자기장이 생기므로, 몸 전체에 고르고 강한 자기장을 걸 수 있기 때문이다.

= 오늘 배운 내용 정리
- 자기력선: 접선 방향 = 자기장 방향, [[밀도]] = 세기, 교차하지 않음
- 직선 전류: 동심원, 세기는 전류에 비례·거리에 [[반비례]]
- 원형 전류: 중심에서 면에 수직 / 솔레노이드: 내부 [[균일]]
- 같은 방향 전류 사이 인력, 반대 방향 전류 사이 척력

= 나가기 전 한 문제 | 형성평가
? 종이면 위 직선 도선에 위쪽으로 전류가 흐를 때, 도선의 오른쪽 점에서 자기장의 방향을 쓰시오. :: 오른손 엄지를 위로 하면 네 손가락이 도선 오른쪽에서 종이면으로 들어가는 방향을 가리킨다 → 종이면에 들어가는 방향
