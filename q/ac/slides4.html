# 전자기 유도와 변압기·인덕터 | 변하는 자기 선속이 만드는 전류 | 고등학교 전자기와 양자 · 02 자기장과 전자기 유도 · 3차시 | 2022 개정 교육과정 [12전자01-05]

= 오늘의 학습 목표 | 3차시
^ **자기 선속**의 변화로 전자기 유도를 설명하고 유도 기전력의 크기를 구할 수 있다.
^ **렌츠 법칙**으로 유도 전류의 방향을 찾을 수 있다.
^ **변압기**와 **인덕터** 등 전자기 유도를 활용한 기술의 원리를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 자기 선속과 패러데이 법칙 12분 → 렌츠 법칙·자기 브레이크 10분 → 변압기 8분 → 인덕터 7분 → 문항 3분
% 2022 개정 [12전자01-05]: 자기선속의 변화로 전자기 유도를 이해하고, 변압기·인덕터 등 활용 기술을 설명한다. 탐구 활동: 도체판과 자석을 이용하여 자기 브레이크 탐색하기

= 자석이 구리관 속에서 천천히 떨어진다 | 생각 열기
* 🧲 구리관과 자석 :: 구리는 자석에 붙지 않는데 자석이 천천히 떨어진다
* 🎢 자이로드롭 :: 꼭대기에서 떨어진 뒤 부드럽게 멈춘다
* 🔌 휴대 전화 충전기 :: 220 V를 5 V 정도로 낮춘다
* 🍳 인덕션 :: 불꽃 없이 냄비 바닥만 뜨거워진다
? 구리관 속 자석은 왜 천천히 떨어질까? :: 떨어지는 자석이 구리관 속 **자기 선속을 변화**시켜 유도 전류가 흐르고, 그 유도 전류가 자석의 운동을 **방해**하기 때문이다.

= 지난 시간 복습 | 1·2차시
- 전류는 주위에 [[자기장]]을 만든다.
- 자기장 속에서 움직이는 전하는 [[로런츠 힘]]을 받는다.
? 반대로, 자기장이 전류를 만들 수도 있을까? :: 자기장이 '변하면' 전류가 유도된다 — 전자기 유도

## 자기 선속과 패러데이 법칙 | 변화가 핵심

= 자기 선속
! 자기 선속 Φ = BA (면에 수직인 자기장 B × 면적 A), 단위 Wb
- 자기장이 세지거나, 면적이 늘어나거나, 코일의 방향이 바뀌면 자기 선속이 **변한다.**
>+ 자기 선속이 크다고 전류가 흐르는 것이 아니라 **변할 때만** 유도 기전력이 생긴다.

= 패러데이 법칙
! 유도 기전력 V = −N ΔΦ/Δt (N: 코일의 감은 수)
- 감은 수가 많을수록, 자기 선속이 **빠르게** 변할수록 유도 기전력이 크다.
- (−) 부호: 유도 전류는 자기 선속의 변화를 **방해**하는 방향 → 렌츠 법칙

= 예제 1 · 유도 기전력 구하기 | 적용
- 감은 수 100회, 면적 0.02 m²인 코일을 지나는 자기장이 0.1 s 동안 0.5 T에서 0으로 줄었다.
^+ ΔΦ = ΔB × A = 0.5 × 0.02 = **0.01 Wb**
^+ V = N × ΔΦ/Δt = 100 × 0.01 ÷ 0.1 = **10 V**
^+ 같은 변화가 0.05 s 동안 일어나면 유도 기전력은 **20 V** (빠를수록 크다)

## 렌츠 법칙 | 변화를 방해한다

= 렌츠 법칙과 자기 브레이크
- 자석의 N극이 코일에 다가오면 → 코일은 다가오는 쪽이 **N극**이 되도록 전류가 흘러 자석을 밀어낸다.
- N극이 멀어지면 → 다가오는 쪽이 **S극**이 되어 자석을 끌어당긴다.
>+ 어느 경우든 자석의 운동을 **방해** → 운동 에너지가 전기 에너지(열)로 바뀐다 → **자기 브레이크**
% 탐구 활동: 알루미늄판 위로 네오디뮴 자석을 미끄러뜨리거나, 알루미늄판을 진자처럼 흔들며 자석 사이를 지나게 해 감속을 관찰한다. 판에 홈을 내면 감속이 줄어드는 까닭(맴돌이 전류 경로 차단)도 토의한다.

## 변압기와 인덕터 | 전자기 유도의 기술

= 변압기
^+ 철심에 1차 코일과 2차 코일을 감는다.
^+ 1차 코일의 **교류**가 철심 속 자기 선속을 계속 변화시킨다.
^+ 같은 자기 선속의 변화가 2차 코일에 유도 기전력을 만든다.
>+ 전압의 비 = 감은 수의 비: V₁ : V₂ = N₁ : N₂ (손실이 없을 때 전력은 같다: V₁I₁ = V₂I₂)
>+ 직류는 자기 선속이 변하지 않아 변압할 수 없다.

= 예제 2 · 휴대 전화 충전기 | 적용
- 220 V를 11 V로 낮추는 변압기의 1차 코일 감은 수가 1000회이다.
^+ N₂ = 1000 × 11 ÷ 220 = **50회**
^+ 2차 코일 전류가 2 A면 1차 코일 전류 = 11 × 2 ÷ 220 = **0.1 A** (손실 무시)

= 인덕터 | 전류의 변화를 방해하는 코일
- 코일 자신의 전류가 변하면 자기 선속이 변해 **스스로 유도 기전력**이 생긴다 → **자체 유도**
- 이 기전력은 전류의 변화를 **방해**한다 → 전류가 갑자기 변하지 못하게 한다.
- 이런 성질을 이용하는 코일 → **인덕터**
| 활용 | 원리 |
|+ 전원 회로의 잡음 제거 | 빠르게 변하는 전류(잡음)를 방해 |
|+ 형광등 안정기·점화 장치 | 전류를 갑자기 끊을 때 큰 유도 기전력 |
|+ 무선 충전·교통 카드 | 두 코일 사이의 상호 유도 |

= 확인 문제 1
Q 코일에 유도 기전력이 생기지 않는 경우는?
o 코일 속으로 자석을 넣는다
o 코일 속의 자석을 빼낸다
o* 코일 속에 자석을 넣고 함께 정지해 있다
o 코일 옆 전자석의 전류를 줄인다
:: 자기 선속이 변하지 않으면 유도 기전력이 생기지 않는다.

= 확인 문제 2
Q 감은 수 200회인 코일의 자기 선속이 0.2 s 동안 0.04 Wb 증가했다. 유도 기전력의 크기는?
o 0.04 V
o 8 V
o* 40 V
o 400 V
:: V = 200 × 0.04 ÷ 0.2 = 40 V

= 확인 문제 3
Q 1차 코일 500회, 2차 코일 100회인 변압기의 1차 코일에 220 V 교류를 걸면 2차 전압은?
o 1100 V
o* 44 V
o 22 V
o 0 V
:: V₂ = 220 × 100 ÷ 500 = 44 V

= 서술형 도전 | 생각 넓히기
? 구리관 속을 떨어지는 자석이 천천히 떨어지는 까닭을 렌츠 법칙과 에너지 전환으로 설명하시오. :: 자석이 떨어지며 구리관의 자기 선속이 변해 유도 전류가 흐르고, 렌츠 법칙에 따라 그 전류가 자석의 운동을 방해하는 자기력을 만든다. 자석의 역학적 에너지 일부가 구리관의 전기 에너지를 거쳐 열로 바뀐다.
? 변압기를 직류 전원에 연결하면 작동하지 않는 까닭을 쓰시오. :: 직류는 일정한 전류라 철심 속 자기 선속이 변하지 않으므로 2차 코일에 유도 기전력이 생기지 않기 때문이다.

= 오늘 배운 내용 정리
- 자기 선속 Φ = [[BA]], 변할 때만 유도 기전력
- 패러데이 법칙: V = −N ΔΦ/Δt — 빠르게 변할수록 크다
- 렌츠 법칙: 유도 전류는 변화를 [[방해]]하는 방향 → 자기 브레이크
- 변압기: V₁ : V₂ = [[N₁ : N₂]], 교류에서만 작동
- 인덕터: 자체 유도로 전류의 [[변화]]를 방해

= 나가기 전 한 문제 | 형성평가
? 자이로드롭이 떨어질 때 레일의 자석과 좌석의 금속판으로 부드럽게 멈추는 원리를 쓰시오. :: 금속판이 자석 사이를 지나며 자기 선속이 변해 금속판에 유도 전류(맴돌이 전류)가 흐르고, 렌츠 법칙에 따라 이 전류가 운동을 방해하는 힘을 받아 감속된다.
