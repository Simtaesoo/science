# 광전 효과와 빛 센서 기술 | 빛을 전기 신호로 | 고등학교 전자기와 양자 · 05 광학 기기와 빛의 활용 · 2차시 | 2022 개정 교육과정 [12전자02-04]

= 오늘의 학습 목표 | 2차시
^ **광전 효과**에서 빛과 물질이 **광자** 단위로 상호작용하는 방식을 설명할 수 있다.
^ 광전 효과와 관련된 **디지털 영상 정보, 광센서, 태양 전지** 기술의 원리를 조사할 수 있다.
% 흐름: 생각 열기 5분 → 광전 효과 복습·심화 12분 → 이미지 센서 10분 → 광센서·태양 전지 10분 → 조사 활동 8분
% 2022 개정 [12전자02-04]: 광전효과에서 빛과 물질이 상호작용하는 방식을 알고, 디지털 영상 정보·광센서·태양 전지 등 관련 기술을 조사한다. 적용 시 고려 사항: 빛과 물질의 기본 상호작용인 흡수와 방출을 이해하게 한다.

= 사진 한 장은 어떻게 숫자가 될까? | 생각 열기
* 📷 이미지 센서 :: 수천만 개의 작은 빛 감지 칸(화소)
* 🚪 자동문 :: 사람이 다가오면 빛 센서가 감지한다
* ☀️ 태양 전지 :: 햇빛으로 전기를 만든다
* 🌃 가로등 :: 어두워지면 저절로 켜진다
? 빛이 어떻게 전기 신호가 될까? :: 빛의 **광자**가 물질 속 전자에 에너지를 주어 전자를 움직이게 하면 전류(전기 신호)가 생긴다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학
- 금속에 빛을 비출 때 전자가 튀어나오는 현상 → [[광전 효과]]
- 광자 1개의 에너지 E = hf → 진동수가 [[클수록]] 크다
- 문턱 진동수보다 작은 빛은 아무리 세게 비춰도 전자가 [[나오지 않는다]]
- 빛의 세기를 키우면 광자 [[수]]가 늘어 광전자 수가 늘어난다

## 빛과 물질의 상호작용 | 광자 하나, 전자 하나

= 광전 효과로 본 상호작용
^+ 빛은 에너지 hf를 가진 **광자**의 흐름이다.
^+ 광자 하나가 전자 하나에게 에너지를 **한꺼번에** 준다 (흡수).
^+ 그 에너지가 전자를 떼어 내는 데 필요한 에너지(일함수)보다 크면 전자가 튀어나온다.
>+ 빛의 '세기'는 광자의 수, '색(진동수)'은 광자 하나의 에너지를 결정한다.
>+ 반도체에서는 전자가 밖으로 튀어나오지 않고 물질 속에서 **움직일 수 있게 되는** 방식으로 같은 원리가 쓰인다(내부 광전 효과).

## 디지털 영상 정보 | 이미지 센서

= 이미지 센서의 원리
^+ 이미지 센서는 수많은 **화소(광다이오드)**가 바둑판처럼 배열되어 있다.
^+ 각 화소에 들어온 광자가 전자를 만들고, **밝을수록(광자가 많을수록)** 전자가 많이 모인다.
^+ 화소마다 모인 전하량을 읽어 **숫자(디지털 정보)**로 바꾼다.
^+ 화소 위의 빨강·초록·파랑 **색 필터**로 색 정보를 얻는다.
>+ 빛의 양 → 전하량 → 숫자: 사진 한 장 = 수천만 개의 숫자

= 예제 1 · 어두운 곳에서 사진이 거친 까닭 | 적용
^+ 어두우면 각 화소에 들어오는 **광자 수가 적다.**
^+ 광자는 띄엄띄엄 도착하므로 화소마다 받은 광자 수가 들쭉날쭉하다.
^+ 그 차이가 **잡음(노이즈)**으로 나타나 사진이 거칠어진다.
>+ 노출 시간을 늘리거나 화소를 크게 하면 광자를 더 모아 잡음이 줄어든다.

## 광센서와 태양 전지 | 생활 속 광전 효과

= 광전 효과를 이용한 기술 | 사례
| 기술 | 원리 | 쓰임 |
|+ 광다이오드·광센서 | 빛을 받으면 전류가 흐름 | 자동문, 리모컨 수신부, 광통신 수신기 |
|+ 조도 센서 | 빛의 양에 따라 전류(저항) 변화 | 화면 밝기 자동 조절, 가로등 |
|+ 태양 전지 | 빛이 만든 전자가 p–n 접합에서 한 방향으로 흘러 전력 생산 | 태양광 발전, 계산기 |
|+ 광전자 증배관 | 광전자 하나를 수백만 개로 증폭 | 아주 약한 빛 검출(우주선, 의료 영상) |
|+ 이미지 센서 | 화소별 전하량을 숫자로 | 카메라, 내시경, 블랙박스 |

= 예제 2 · 태양 전지는 어떤 빛에서도 작동할까? | 적용
^+ 반도체마다 전자를 움직이게 하는 데 필요한 **최소 에너지**가 있다.
^+ 광자 하나의 에너지(hf)가 그보다 작은 빛(진동수가 낮은 적외선 일부)은 아무리 많아도 전류를 만들지 못한다.
^+ 그보다 큰 에너지의 광자는 전류를 만들고, 남는 에너지는 열이 된다.
>+ 광전 효과의 '문턱'과 같은 원리 — 태양 전지 효율의 한계 중 하나

= 조사 활동 | 우리 주변의 빛 센서
^ 모둠별로 광전 효과를 이용한 기기 하나를 고른다 (카메라, 자동문, 화재 감지기, 의료 영상 장비 등).
^ '빛 → 전자 → 신호 → 정보 또는 에너지'의 흐름으로 작동 원리를 정리한다.
^ 그 기술이 없을 때와 비교해 생활의 변화를 발표한다.

= 확인 문제 1
Q 광전 효과에서 빛의 세기를 2배로 하면 일어나는 변화는? (진동수는 문턱 진동수보다 큼)
o 광전자의 최대 운동 에너지가 2배가 된다
o* 튀어나오는 광전자의 수가 많아진다
o 문턱 진동수가 낮아진다
o 광전자가 튀어나오지 않는다
:: 세기는 광자의 수를 늘리므로 광전자 수가 늘어난다.

= 확인 문제 2
Q 디지털카메라의 이미지 센서가 화소의 밝기를 기록하는 방식으로 옳은 것은?
o 화소의 온도를 잰다
o* 화소에 들어온 광자가 만든 전하의 양을 숫자로 바꾼다
o 빛의 속력을 잰다
o 빛을 소리로 바꾼다
:: 밝을수록 광자가 많아 더 많은 전하가 모인다.

= 확인 문제 3
Q 광전 효과를 이용한 장치가 아닌 것은?
o 태양 전지
o 자동문 센서
o 이미지 센서
o* 전기 다리미
:: 전기 다리미는 전류의 열작용을 이용한다.

= 서술형 도전 | 생각 넓히기
? 빨간빛으로는 광전자가 나오지 않는 금속에 아주 센 빨간빛을 오래 비추어도 광전자가 나오지 않는 까닭을 광자로 설명하시오. :: 광자 하나가 전자 하나에게 에너지를 한꺼번에 주는데, 빨간빛 광자 하나의 에너지가 전자를 떼어 내는 데 필요한 에너지보다 작기 때문이다. 광자 수가 많아도 소용이 없다.
? 스마트폰 화면 밝기가 주변 밝기에 따라 자동으로 바뀌는 원리를 쓰시오. :: 조도 센서가 주변 빛을 받아 광자 수에 따라 달라지는 전기 신호를 만들고, 이 신호에 맞춰 화면 밝기를 조절한다.

= 오늘 배운 내용 정리
- 광자 하나가 전자 하나에 에너지 [[hf]]를 한꺼번에 준다
- 세기 = 광자의 [[수]], 진동수 = 광자 하나의 에너지
- 이미지 센서: 빛의 양 → 전하량 → [[숫자]](디지털 영상 정보)
- 광센서·조도 센서·태양 전지·광전자 증배관 — 빛과 물질의 상호작용 활용

= 나가기 전 한 문제 | 형성평가
? 사진 한 장이 만들어지기까지 '빛 → 전자 → 숫자'의 과정을 이미지 센서를 예로 세 문장으로 쓰시오. :: 렌즈가 모은 빛의 광자가 각 화소의 광다이오드에 흡수된다. 광자가 전자를 만들어 밝은 화소일수록 많은 전하가 모인다. 화소마다 모인 전하량을 읽어 숫자로 바꾸면 디지털 영상이 된다.
