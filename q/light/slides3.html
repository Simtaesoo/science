# 레이저와 광통신 | 똑같은 빛을 모아 증폭하다 | 고등학교 전자기와 양자 · 05 광학 기기와 빛의 활용 · 3차시 | 2022 개정 교육과정 [12전자02-05]

= 오늘의 학습 목표 | 3차시
^ 레이저 빛의 **특징**(단색성, 직진성, 결맞음, 높은 세기)을 설명할 수 있다.
^ **자발 방출**과 **유도 방출**을 비교하고, 레이저에서 빛이 **증폭**되는 원리를 설명할 수 있다.
^ 레이저가 **디지털 광통신** 등 여러 영역에서 활용됨을 조사하여 현대 문명에서의 중요성을 인식할 수 있다.
% 흐름: 생각 열기 5분 → 레이저 빛의 특징 8분 → 흡수·자발 방출·유도 방출 12분 → 증폭의 원리 8분 → 광통신과 활용 12분
% 2022 개정 [12전자02-05]: 레이저의 특징과 빛이 증폭되는 원리를 알고, 디지털 광통신 등 여러 영역에서의 활용을 조사한다. 레이저는 눈에 직접 비추지 않도록 안전 교육을 먼저 한다.

= 레이저 포인터는 왜 멀리까지 한 점일까? | 생각 열기
* 🔦 손전등 :: 멀어질수록 빛이 넓게 퍼진다
* 🔴 레이저 포인터 :: 칠판 끝까지 작은 점 그대로
* 🌐 인터넷 :: 바다 밑 광섬유 속 레이저 빛이 대륙을 잇는다
* 👁️ 시력 교정 수술 :: 레이저로 각막을 정밀하게 다듬는다
? 손전등 빛과 레이저 빛은 무엇이 다를까? :: 레이저 빛은 파장이 **하나**이고, 파동의 **위상이 맞춰져** 있으며, 거의 **퍼지지 않고** 나아간다.
% 안전: 레이저 포인터를 사람이나 동물의 눈, 운전자, 항공기 쪽으로 절대 비추지 않는다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학, 2차시
- 원자 속 전자는 [[불연속적]]인 에너지 준위를 가진다.
- 전자가 높은 준위에서 낮은 준위로 전이하면 그 차이만큼의 에너지를 가진 [[광자]]를 방출한다.
- 광자를 흡수하면 전자가 [[높은]] 준위로 올라간다.
? 원자 하나가 빛을 내면 레이저가 될까? :: 아니다. 수많은 원자가 **같은 빛을 같은 위상으로** 내도록 해야 한다 — 유도 방출

## 레이저 빛의 특징 | 단색·직진·결맞음

= 레이저 빛의 특징
| 특징 | 뜻 | 쓰임 |
|+ 단색성 | 파장이 거의 [[하나]] | 정밀 측정, 분광 분석 |
|+ 직진성 | 거의 퍼지지 않고 곧게 나아감 | 거리 측정, 레이저 수준기 |
|+ 결맞음 | 파동의 위상이 [[맞춰져]] 있음 | 간섭 이용(홀로그램) |
|+ 높은 세기 | 좁은 곳에 에너지가 모임 | 절단·용접, 수술 |

## 빛의 흡수와 방출 | 세 가지 과정

= 흡수, 자발 방출, 유도 방출
| 과정 | 일어나는 일 | 나오는 빛 |
|+ 흡수 | 광자를 흡수해 전자가 높은 준위로 | – |
|+ 자발 방출 | 들뜬 전자가 저절로 낮은 준위로 | 방향·위상이 제각각인 빛 (전구, LED) |
|+ 유도 방출 | 들뜬 전자에 같은 에너지의 광자가 다가오면 전자가 낮은 준위로 | 들어온 광자와 [[똑같은]] 광자 (방향·파장·위상 같음) |
>+ 유도 방출: 광자 1개가 들어가 **똑같은 광자 2개**가 나온다 → 빛의 증폭

= 레이저에서 빛이 증폭되는 원리
^+ 외부 에너지(전기, 빛)로 들뜬 상태의 원자를 바닥 상태보다 **많게** 만든다 → 밀도 반전
^+ 광자 하나가 유도 방출을 일으켜 똑같은 광자가 **2개, 4개, 8개…**로 늘어난다.
^+ 양 끝의 **거울** 사이를 오가며 같은 방향의 빛만 계속 증폭된다.
^+ 한쪽 거울이 빛을 조금 통과시켜 **레이저 빛**이 나온다.
>+ LASER = Light Amplification by Stimulated Emission of Radiation (유도 방출에 의한 빛의 증폭)

= 예제 1 · 증폭 계산 | 적용
- 레이저 매질 안에서 광자 1개가 왕복할 때마다 유도 방출로 광자 수가 2배가 된다고 하자.
^+ 10번 왕복 후 광자 수 = 2¹⁰ = **1024개**
^+ 20번 왕복 후 = 2²⁰ ≈ **100만 개**
>+ 실제로는 손실과 출력이 있어 일정한 세기에서 균형을 이룬다.

## 레이저의 활용 | 디지털 광통신부터 의료까지

= 디지털 광통신
^+ 전기 신호(0과 1)에 따라 레이저를 **켜고 끄거나 세기를 바꾼다.**
^+ 빛이 **광섬유** 속을 전반사하며 멀리 전달된다.
^+ 받는 쪽에서 광다이오드가 빛을 다시 **전기 신호**로 바꾼다.
>+ 단색성 덕분에 퍼짐이 적고, 파장이 다른 레이저 여러 개를 한 광섬유에 실어 엄청난 양의 정보를 보낸다.

= 레이저의 활용 | 사례
* 🌐 광통신 :: 인터넷, 해저 케이블
* 🏥 의료 :: 시력 교정, 피부 치료, 정밀 수술
* 🏭 산업 :: 금속 절단·용접, 반도체 미세 가공
* 🛒 바코드 스캐너 :: 반사된 빛의 패턴으로 정보 읽기
* 📏 거리 측정 :: 라이다(자율 주행차), 달까지 거리 측정
* 🖼️ 홀로그램 :: 결맞은 빛의 간섭으로 입체 영상 기록

= 확인 문제 1
Q 유도 방출에 대한 설명으로 옳은 것은?
o 들뜬 전자가 저절로 아무 방향으로 빛을 낸다
o* 들어온 광자와 파장·방향·위상이 같은 광자가 방출된다
o 광자를 흡수해 전자가 높은 준위로 올라간다
o 빛의 진동수가 2배가 된다
:: 유도 방출로 똑같은 광자가 생겨 빛이 증폭된다.

= 확인 문제 2
Q 레이저 빛의 특징이 아닌 것은?
o 단색성
o 직진성
o 결맞음
o* 여러 파장이 고르게 섞여 있음
:: 여러 파장이 섞인 빛은 백열전구나 햇빛의 특징이다.

= 확인 문제 3
Q 디지털 광통신에서 레이저가 하는 역할은?
o 광섬유를 데운다
o* 전기 신호(0과 1)를 빛의 켜짐·꺼짐 등으로 바꾸어 실어 보낸다
o 소리를 직접 전달한다
o 광섬유 속에서 빛을 흡수한다
:: 빛 신호는 광섬유를 따라 전달되고 받는 쪽에서 다시 전기 신호가 된다.

= 서술형 도전 | 생각 넓히기
? 레이저를 만들려면 들뜬 상태의 원자가 바닥 상태보다 많아야 하는 까닭을 쓰시오. :: 바닥 상태 원자가 더 많으면 광자가 유도 방출보다 흡수를 더 많이 일으켜 빛이 줄어든다. 들뜬 원자가 더 많아야 유도 방출이 우세해 빛이 증폭된다.
? 광통신이 구리 전선을 이용한 통신보다 유리한 점 두 가지를 쓰시오. :: 신호의 손실과 외부 전자기 잡음이 적어 멀리 보낼 수 있고, 여러 파장을 한꺼번에 실어 훨씬 많은 정보를 빠르게 보낼 수 있다.

= 오늘 배운 내용 정리
- 레이저 빛: 단색성, 직진성, [[결맞음]], 높은 세기
- 흡수 / 자발 방출(제각각) / [[유도 방출]](똑같은 광자)
- 밀도 반전 + 유도 방출 + 거울 사이 왕복 → 빛의 [[증폭]]
- 디지털 광통신: 전기 신호 → 레이저 빛 → 광섬유(전반사) → 광다이오드

= 나가기 전 한 문제 | 형성평가
? LED와 레이저 다이오드 모두 빨간빛을 낸다. 두 빛이 어떻게 다른지 빛을 내는 과정과 빛의 특징으로 비교하시오. :: LED는 주로 자발 방출로 방향과 위상이 제각각인 빛이 넓게 퍼지고, 레이저 다이오드는 유도 방출로 증폭되어 파장·방향·위상이 같은 빛이 좁게 곧게 나아간다.
