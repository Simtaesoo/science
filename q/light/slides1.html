^ 렌즈, 거울, 프리즘이 빛의 **굴절·반사**로 상을 만드는 원리를 설명할 수 있다.
^ **카메라, 망원경, 현미경**에서 렌즈와 거울이 하는 역할을 설명할 수 있다.
^ 상이 흐려지는 **수차**가 생기는 까닭과 줄이는 방법을 정성적으로 설명할 수 있다.

% 2022 개정 [12전자02-02] 해설: 카메라, 망원경, 현미경 등의 광학 기기는 정성적 원리 위주로 다루며, 렌즈·거울·프리즘이 어떻게 활용되는지 설명한다. 수차는 '구면 수차', '색수차' 같은 용어를 도입하지 않고 정성적으로 다룬다.

= 우주를 보는 눈, 세포를 보는 눈 | 생각 열기
* 🔭 제임스 웹 우주 망원경 :: 지름 6.5 m의 거대한 거울로 먼 은하의 빛을 모은다
* 🔬 광학 현미경 :: 렌즈 두 개로 세포를 크게 본다
* 📷 스마트폰 카메라 :: 얇은 몸체 속에 렌즈 여러 장이 겹쳐 있다
* 🌈 프리즘 :: 햇빛을 무지개색으로 나눈다
? 망원경과 현미경은 모두 '크게 보이게' 하는데 무엇이 다를까? :: 망원경은 **멀리 있는** 물체의 빛을 많이 모아 보고, 현미경은 **가까이 있는 작은** 물체를 크게 확대한다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학
- 볼록 렌즈: 물체가 멀면 거꾸로 선 [[작은 실상]], 초점 안쪽이면 바로 선 큰 허상
- 광선 추적: 광축에 나란한 빛 → [[초점]]을 지남
- 오목 거울은 빛을 [[모으고]], 볼록 거울은 퍼뜨린다
? 렌즈 하나만으로 아주 먼 별이나 아주 작은 세포를 보기 어려운 까닭은? :: 상이 너무 작거나 어두워서 — 렌즈와 거울을 **조합**해야 한다.

## 렌즈와 거울로 상 만들기 | 굴절과 반사

= 광학 기기의 기본 부품
| 부품 | 원리 | 역할 |
|+ 볼록 렌즈 | [[굴절]]로 빛을 모은다 | 실상 만들기, 확대 |
|+ 오목 렌즈 | 굴절로 빛을 퍼뜨린다 | 상의 크기·위치 조절, 근시 교정 |
|+ 오목 거울 | [[반사]]로 빛을 모은다 | 대형 망원경의 주경, 손전등 반사경 |
|+ 프리즘 | 굴절·전반사 | 빛의 경로 꺾기(쌍안경), 색 나누기(분광기) |

## 카메라 | 작은 실상을 센서에

= 카메라의 원리
^+ 렌즈가 먼 물체의 빛을 모아 이미지 센서에 **거꾸로 선 작은 실상**을 맺는다.
^+ 물체가 가까워지면 상이 렌즈에서 **멀어진다** → 렌즈를 앞뒤로 움직여 **초점을 맞춘다.**
^+ 조리개는 들어오는 빛의 양을, 셔터는 빛을 받는 시간을 조절한다.
>+ 스마트폰 카메라는 여러 장의 렌즈를 겹쳐 얇으면서도 선명한 상을 만든다.

## 망원경과 현미경 | 두 단계로 키우기

= 망원경
- **대물렌즈(또는 오목 거울)**: 먼 물체의 빛을 모아 초점 근처에 실상을 만든다.
- **접안렌즈**: 그 실상을 돋보기처럼 확대해 본다.
- 대물렌즈·거울이 **클수록** 빛을 많이 모아 어두운 천체를 보고, 더 세밀하게 구별한다.
>+ 큰 망원경은 대부분 **거울**(반사 망원경)을 쓴다 — 큰 렌즈는 무겁고 휘어지며 색이 번지기 쉽다.

= 현미경
- **대물렌즈**: 초점 거리가 짧아 가까운 작은 물체의 **확대된 실상**을 만든다.
- **접안렌즈**: 그 실상을 한 번 더 확대한 **허상**을 본다.
- 전체 배율 = 대물렌즈 배율 × 접안렌즈 배율
>+ 망원경은 '빛 모으기', 현미경은 '확대하기'가 핵심

= 예제 1 · 배율 계산 | 적용
- 대물렌즈 40배, 접안렌즈 10배인 현미경으로 지름 0.02 mm 세포를 본다.
^+ 전체 배율 = 40 × 10 = **400배**
^+ 보이는 크기 = 0.02 × 400 = **8 mm**

## 수차 | 상이 흐려지는 까닭

= 수차란?
- 이상적인 렌즈는 한 점의 빛을 정확히 한 점에 모아야 한다.
- 실제 렌즈는 ① **가장자리**를 지난 빛과 가운데를 지난 빛이 서로 다른 곳에 모이고, ② **색(파장)**마다 굴절 정도가 달라 서로 다른 곳에 모인다.
- 그 결과 상이 **흐려지거나 가장자리에 색 번짐**이 생긴다 → **수차**
| 줄이는 방법 | 원리 |
|+ 여러 장의 렌즈 조합 | 서로 반대로 생기는 오차를 상쇄 |
|+ 렌즈 대신 거울 사용 | 반사는 색에 따라 꺾이는 정도가 다르지 않다 |
|+ 렌즈 면의 모양 다듬기, 조리개 조이기 | 가장자리 빛의 영향을 줄인다 |

= 확인 문제 1
Q 카메라에서 가까운 물체에 초점을 맞추려면 렌즈를 어떻게 해야 하는가?
o 센서 쪽으로 가까이 한다
o* 센서에서 멀어지게 한다
o 렌즈를 오목 렌즈로 바꾼다
o 조리개를 닫는다
:: 물체가 가까워지면 실상이 렌즈에서 멀리 맺히므로 렌즈와 센서 사이를 넓혀야 한다.

= 확인 문제 2
Q 대형 천체 망원경이 주로 거울을 쓰는 까닭으로 옳지 않은 것은?
o 큰 렌즈는 무겁고 자기 무게로 휘기 쉽다
o 렌즈는 색에 따라 굴절 정도가 달라 색 번짐이 생긴다
o 거울은 뒷면을 받쳐 크게 만들기 쉽다
o* 거울은 빛을 굴절시켜 더 밝게 만든다
:: 거울은 굴절이 아니라 반사로 빛을 모은다.

= 확인 문제 3
Q 대물렌즈 10배, 접안렌즈 15배인 현미경의 전체 배율은?
o 25배
o* 150배
o 1.5배
o 10배
:: 10 × 15 = 150배

= 서술형 도전 | 생각 넓히기
? 망원경의 대물렌즈(주경)가 클수록 좋은 까닭 두 가지를 쓰시오. :: 빛을 더 많이 모아 어두운 천체를 볼 수 있고, 가까이 붙은 두 천체를 더 잘 구별할 수 있다.
? 값싼 돋보기로 본 물체의 가장자리에 무지개색 번짐이 생기는 까닭과 줄이는 방법을 쓰시오. :: 색(파장)마다 굴절 정도가 달라 서로 다른 위치에 상이 맺히기 때문이다. 성질이 다른 렌즈를 겹쳐 쓰거나 거울을 쓰면 줄일 수 있다.

= 오늘 배운 내용 정리
- 볼록·오목 렌즈는 [[굴절]], 오목 거울은 반사로 상을 만든다
- 카메라: 작은 실상을 센서에, 렌즈를 움직여 초점 조절
- 망원경: 빛 모으기 + 확대 / 현미경: 대물렌즈·접안렌즈로 두 번 확대 (배율 = [[곱]])
- 수차: 가장자리 빛과 색에 따라 모이는 곳이 달라 상이 흐려짐 → 렌즈 조합·거울로 줄임

= 나가기 전 한 문제 | 형성평가
? 반사 망원경이 굴절 망원경보다 색 번짐이 적은 까닭을 쓰시오. :: 반사 망원경은 거울로 빛을 반사시켜 모으는데, 반사는 색(파장)에 관계없이 같은 각으로 일어나므로 색에 따라 모이는 위치가 달라지지 않는다.
