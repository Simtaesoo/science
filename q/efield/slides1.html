# 전기장과 전기력선 | 보이지 않는 힘의 지도 | 고등학교 전자기와 양자 · 01 전기장과 전위 · 1차시 | 2022 개정 교육과정 [전자기와 양자 Ⅰ]

= 오늘의 학습 목표 | 1차시
^ **전기장**의 뜻을 알고 E = F/q로 전기장의 세기를 구할 수 있다.
^ 점전하가 만드는 전기장 E = kQ/r²을 계산할 수 있다.
^ **전기력선**으로 여러 전하 주위의 전기장을 표현할 수 있다.
% 흐름: 생각 열기 5분 → 전기장 10분 → 전기력선 그리기(시뮬레이션) 12분 → 계산 10분 → 문항 8분

= 닿지 않았는데 힘이 작용한다? | 생각 열기
* 🎈 문지른 풍선 :: 머리카락이 닿기도 전에 끌려 올라간다
* 🧲 자석 :: 떨어져 있어도 클립을 당긴다
* 🌍 중력 :: 지구는 닿지 않은 달을 당긴다
* ⚡ 번개 :: 구름과 땅 사이의 강한 전기 작용
? 떨어져 있는 전하끼리 어떻게 힘을 주고받을까? :: 전하가 주위 공간에 **전기장**을 만들고, 그 안에 놓인 다른 전하가 전기장으로부터 힘을 받는다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 전하 | 같은 종류는 밀고, 다른 종류는 당긴다 |
| 쿨롱 법칙 | F = kq₁q₂/r², k = 9 × 10⁹ N·m²/C² (물리학) |
| 중력장 | 질량 주위에서 중력이 작용하는 공간 g = F/m |
? 두 전하 사이의 거리가 2배가 되면 전기력은? :: 거리의 제곱에 반비례 → **1/4배**

## 전기장 | 전하가 만드는 힘의 공간

= 전기장
! E = F / q (단위 N/C)
- 전기장: 다른 전하에 전기력이 작용하는 ==공간==
- 방향: 그 점에 놓인 [[(+)전하]]가 받는 힘의 방향
- (−)전하는 전기장과 [[반대]] 방향으로 힘을 받는다.
>+ 중력장 g = F/m과 같은 구조 — 전기장은 '단위 양전하가 받는 힘'

= 점전하의 전기장
! E = kQ / r²
- 거리의 ==제곱에 반비례==
- 여러 전하가 만드는 전기장 = 각 전기장의 [[벡터 합]]
| 거리 (m) | 0.1 | 0.2 | 0.3 |
|+ +2 nC의 전기장 (N/C) | 1800 | [[450]] | [[200]] |

= 전기력선의 성질
| 성질 | 내용 |
|+ 시작과 끝 | (+)전하에서 나와 [[(−)전하]]로 들어간다 |
|+ 교차 | 서로 [[교차하지 않는다]] |
|+ 밀도 | 촘촘할수록 전기장이 [[세다]] |
|+ 방향 | 한 점에서의 접선 방향 = 전기장 방향 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#field | [쌍극자], [같은 전하], [평행판]을 차례로 눌러 전기력선의 모양을 그리고 특징을 적자.
% 시험 전하를 여러 곳에 놓아 힘의 방향이 전기력선의 접선 방향임을 확인

= 전기력선 그리기 | 시뮬레이션 기록
| 배치 | 전기력선 모양 |
|+ 쌍극자 (+, −) | (+)에서 (−)로 이어지는 [[곡선]] |
|+ 같은 전하 (+, +) | 서로 밀어내며 가운데에 전기장 [[0]]인 점 |
|+ 평행판 | 판 사이에 나란하고 같은 간격 → [[균일한]] 전기장 |

= 거리와 전기장 | 그래프
C +2 nC 점전하의 전기장 | 거리 (m) | 전기장 (N/C) | 전기장:0.05,7200 0.075,3200 0.1,1800 0.15,800 0.2,450 0.3,200
||
- 거리 2배 → 전기장 [[1/4]]배
- 거리 1/2배 → 전기장 [[4]]배
~ k = 9 × 10⁹ N·m²/C², 1 nC = 10⁻⁹ C

= 예제 1 · 점전하의 전기장 | 적용
- +2 nC 점전하에서 0.1 m 떨어진 곳
^+ E = 9 × 10⁹ × 2 × 10⁻⁹ ÷ 0.1²
^+ = 18 ÷ 0.01 = **1800 N/C** (전하에서 멀어지는 방향)
^+ 0.2 m에서는 1800 ÷ 4 = **450 N/C**

= 예제 2 · 전기장 속 전하가 받는 힘 | 적용
- 전기장 세기 3000 N/C인 곳에 −2 μC 전하를 놓았다.
^+ F = qE = 2 × 10⁻⁶ × 3000 = **6 × 10⁻³ N**
^+ (−)전하 → 방향은 전기장과 **반대**

= 예제 3 · 두 양전하 사이 | 적용
- 크기가 같은 두 양전하 사이의 한가운데
^+ 두 전하가 만드는 전기장의 크기는 **같다.**
^+ 방향은 서로 **반대** → 벡터 합 = **0**
>+ 같은 전하 사이에는 전기장이 0인 점이 생긴다.

= 확인 문제 1
Q 전기장의 방향에 대한 설명으로 옳은 것은?
o (−)전하가 받는 힘의 방향
o* (+)전하가 받는 힘의 방향
o 항상 전하를 향하는 방향
o 전기력선에 수직인 방향
:: 전기장의 방향은 양전하가 받는 힘의 방향으로 정한다.

= 확인 문제 2
Q 점전하로부터 거리가 3배가 되면 전기장의 세기는?
o 3배
o 1/3배
o* 1/9배
o 9배
:: E ∝ 1/r²

= 확인 문제 3
Q 전기력선에 대한 설명으로 옳지 않은 것은?
o (+)전하에서 나와 (−)전하로 들어간다
o* 서로 교차할 수 있다
o 촘촘할수록 전기장이 세다
o 접선 방향이 전기장 방향이다
:: 한 점의 전기장 방향은 하나뿐이므로 전기력선은 교차하지 않는다.

= 확인 문제 4
Q 전기장 500 N/C인 곳에서 4 μC 전하가 받는 힘의 크기는?
o 2 × 10⁻⁴ N
o* 2 × 10⁻³ N
o 1.25 × 10⁻⁸ N
o 125 N
:: F = 4 × 10⁻⁶ × 500 = 2 × 10⁻³ N

= 확인 문제 5
Q 평행판 사이의 전기장에 대한 설명으로 옳은 것은?
o 가운데가 가장 세다
o (+)판에 가까울수록 세다
o* 세기와 방향이 어디서나 같다
o 전기장이 0이다
:: 전기력선이 나란하고 같은 간격 → 균일한 전기장

= 생활 속 전기장 | 사례
* 🚗 번개 속 자동차 :: 금속 차체 내부의 전기장은 0 (정전기 차폐)
* 🖨️ 레이저 프린터 :: 대전된 드럼이 토너 가루를 끌어당긴다
* 🏭 전기 집진기 :: 대전된 먼지를 전기장으로 모은다
* 🎨 정전 도장 :: 대전된 페인트가 차체에 고르게 붙는다
* 🦈 상어 :: 먹이의 약한 전기장을 감지
* 📱 터치스크린 :: 손가락이 바꾸는 전기장을 감지

= 서술형 도전 | 생각 넓히기
? 전기력선 그림에서 A 지점의 전기력선이 B 지점보다 촘촘하다. 두 지점에 같은 전하를 놓으면 어느 쪽에서 힘이 더 큰지 까닭과 함께 쓰시오. :: A. 전기력선이 촘촘할수록 전기장이 세므로 F = qE가 크다.
? 번개가 칠 때 차 안에 있으면 안전한 까닭을 전기장으로 설명하시오. :: 도체 속 자유 전자가 재배치되어 금속 껍질 내부의 전기장을 0으로 만든다(정전기 차폐). 전류는 금속 표면을 따라 흐르므로 내부의 사람은 보호된다.

% 놓은 전하 주변의 전기장 화살표를 보고 힘의 방향을 먼저 예측하게 하기

= 오늘 배운 내용 정리
- 전기장 E = [[F/q]], 방향은 [[(+)전하]]가 받는 힘의 방향
- 점전하의 전기장 E = [[kQ/r²]]
- 전기력선: (+)에서 나와 (−)로, 교차하지 않음, 촘촘할수록 [[세다]]
- 여러 전하의 전기장 = [[벡터 합]]
- 평행판 사이: [[균일한]] 전기장

= 나가기 전 한 문제 | 형성평가
? +4 nC 점전하로부터 0.2 m 떨어진 곳의 전기장의 세기와, 그곳에 놓은 +1 nC 전하가 받는 힘을 구하시오. :: E = 9 × 10⁹ × 4 × 10⁻⁹ ÷ 0.04 = 900 N/C, F = 10⁻⁹ × 900 = 9 × 10⁻⁷ N (전하에서 멀어지는 방향)
