# 전위와 등전위선 | 전기의 높이 | 고등학교 전자기와 양자 · 01 전기장과 전위 · 2차시 | 2022 개정 교육과정 [전자기와 양자 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ **전위**와 **전위차**의 뜻을 설명하고 점전하의 전위를 구할 수 있다.
^ 전하를 옮길 때 **전기력이 하는 일** W = qΔV를 구할 수 있다.
^ **등전위선**과 전기력선의 관계, 균일한 전기장 E = V/d를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 전위 10분 → 전위 지도(시뮬레이션) 12분 → 일·균일 전기장 10분 → 문항 8분

= 전기에도 높이가 있다? | 생각 열기
* 🏔️ 등고선 지도 :: 선이 촘촘하면 가파른 비탈
* 💧 물의 흐름 :: 높은 곳에서 낮은 곳으로 흐른다
* 🔋 건전지 1.5 V :: '전압'은 무엇의 차이일까?
* 🐦 전깃줄 위의 새 :: 고압선에 앉아도 감전되지 않는다
? 물이 높이 차이로 흐르듯, 전하는 무엇의 차이로 움직일까? :: **전위**(전기적 높이)의 차이, 즉 **전위차(전압)** 때문에 움직인다.

= 지난 시간 복습 | 1차시
- 전기장 E = [[F/q]]
- 점전하의 전기장 E = [[kQ/r²]]
- 전기력선은 촘촘할수록 전기장이 [[세다]].
? 중력장에서 물체를 높은 곳으로 올리면 무엇이 커질까? :: **중력 퍼텐셜 에너지** — 전기장에서도 같은 생각을 한다.

## 전위 | 단위 양전하의 퍼텐셜 에너지

= 전위와 전위차
! V = Eₚ / q (단위 V = J/C)
- 전위: 단위 양전하가 갖는 ==전기 퍼텐셜 에너지==
- 전위차(전압): 두 점 사이의 전위의 차이
! 점전하의 전위 V = kQ / r
~ 무한히 먼 곳의 전위를 0으로 정한다. 거리에 [[반비례]] (전기장은 제곱에 반비례)

= 전기력이 하는 일
! W = qΔV
- 양전하는 전위가 ==높은== 곳에서 ==낮은== 곳으로 힘을 받는다.
- 전기장은 전위가 높은 곳 → 낮은 곳을 향한다.
>+ 중력에서 W = mgΔh와 같은 구조 — q는 m, ΔV는 gΔh

= 등전위선
| 성질 | 내용 |
|+ 뜻 | 전위가 [[같은]] 점을 이은 선 |
|+ 전기력선과의 관계 | 항상 [[수직]] |
|+ 등전위선을 따라 전하를 옮길 때 | 전기력이 하는 일 [[0]] |
|+ 촘촘한 곳 | 전위가 급하게 변함 → 전기장이 [[세다]] |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#pot | 쌍극자에서 측정점 P를 옮겨 가며 전위를 측정하고, 등전위선 모양을 관찰하자.
% 한가운데 '전위 0, 전기장 ≠ 0'을 반드시 확인 — 학생들이 가장 많이 혼동

= 전위 지도 읽기 | 시뮬레이션 기록 (쌍극자)
| P의 위치 | A(+) 가까이 | 두 전하 한가운데 | B(−) 가까이 |
|+ 전위 | + (높다) | [[0]] | [[− (낮다)]] |
|+ 전기장 | 세다 | [[0이 아니다]] (A→B) | 세다 |
- 한가운데에서 전위는 0이지만 전기장은 0이 ==아니다== → 전위와 전기장은 다른 물리량

= 거리와 전위 | 그래프
C +2 nC 점전하의 전위 | 거리 (m) | 전위 (V) | 전위:0.05,360 0.075,240 0.1,180 0.15,120 0.2,90 0.3,60
||
- 거리 2배 → 전위 [[1/2]]배
- 같은 거리의 점을 이으면 → 동심원 모양의 [[등전위선]]

## 균일한 전기장 | 평행판 사이

= 균일한 전기장과 전위차
! E = V / d
- 평행판 사이: 전기장이 균일 → 전위가 거리에 따라 ==일정하게== 변한다.
- 단위: N/C = [[V/m]]
>+ 판 간격 d를 줄이면 같은 전압에서 전기장이 **세진다.**

= 예제 1 · 점전하의 전위 | 적용
- +2 nC 점전하로부터 0.1 m, 0.2 m인 곳의 전위
^+ V = 9 × 10⁹ × 2 × 10⁻⁹ ÷ 0.1 = **180 V**
^+ 0.2 m에서 V = 18 ÷ 0.2 = **90 V**

= 예제 2 · 전기력이 하는 일 | 적용
- +2 nC의 다른 전하를 0.1 m 지점에서 0.2 m 지점으로 옮긴다.
^+ ΔV = 180 − 90 = **90 V** (높은 곳 → 낮은 곳)
^+ W = qΔV = 2 × 10⁻⁹ × 90 = **1.8 × 10⁻⁷ J**
^+ 전기력이 **양의 일** → 전하의 운동 에너지 증가

= 예제 3 · 평행판 속 전자 | 적용
- 간격 2 cm인 평행판에 100 V를 걸었다. (전자 전하량 1.6 × 10⁻¹⁹ C)
^+ E = 100 ÷ 0.02 = **5000 V/m**
^+ F = eE = 1.6 × 10⁻¹⁹ × 5000 = **8 × 10⁻¹⁶ N** ((+)판 쪽으로)
^+ (−)판에서 (+)판까지 가속되면 얻는 에너지 eV = **1.6 × 10⁻¹⁷ J**

= 확인 문제 1
Q 전위의 단위로 옳은 것은?
o N/C
o* J/C
o C/J
o N·m
:: V = J/C

= 확인 문제 2
Q 등전위선과 전기력선의 관계는?
o 나란하다
o* 항상 수직이다
o 45°를 이룬다
o 관계없다
:: 등전위선을 따라 움직이면 일이 0 → 전기장과 수직

= 확인 문제 3
Q 크기가 같은 (+), (−)전하 한가운데에서 옳은 것은?
o 전위와 전기장 모두 0
o* 전위는 0, 전기장은 0이 아니다
o 전위는 0이 아니고, 전기장은 0
o 전위와 전기장 모두 0이 아니다
:: 전위는 스칼라 합(+V − V = 0), 전기장은 벡터 합(같은 방향)

= 확인 문제 4
Q 전위차 50 V인 두 점 사이에서 2 C의 전하를 옮길 때 전기력이 하는 일의 크기는?
o 25 J
o* 100 J
o 52 J
o 0.04 J
:: W = qΔV = 2 × 50

= 확인 문제 5
Q 간격 5 mm인 평행판에 10 V를 걸었을 때 판 사이 전기장의 세기는?
o 50 V/m
o 0.5 V/m
o* 2000 V/m
o 200 V/m
:: E = 10 ÷ 0.005 = 2000 V/m

= 생활 속 전위 | 사례
* 🐦 전깃줄 위의 새 :: 두 발의 전위가 같아 전류가 흐르지 않는다
* 🔋 건전지 :: 두 극 사이의 전위차 1.5 V
* 📺 전자총 :: 전위차로 전자를 가속
* 🫀 심전도 :: 몸 표면의 전위차 변화로 심장 활동 측정
* ⚡ 피뢰침 :: 뾰족한 끝에 전기장이 집중
* 🧠 뇌파 측정 :: 두피의 미세한 전위차 기록

= 서술형 도전 | 생각 넓히기
? 고압선에 앉은 새가 감전되지 않는 까닭을 전위로 설명하시오. :: 새의 두 발이 같은 전선 위에 있어 두 발 사이의 전위차가 거의 0이므로 새의 몸을 통해 전류가 흐르지 않는다.
? 등전위선 지도와 산의 등고선 지도에서 '선이 촘촘한 곳'이 뜻하는 바를 비교하시오. :: 등고선이 촘촘하면 경사가 가팔라 공이 세게 굴러 내려가고, 등전위선이 촘촘하면 전위가 급하게 변해 전기장이 세다. 공이 높은 곳에서 낮은 곳으로 가듯 양전하는 높은 전위에서 낮은 전위로 힘을 받는다.

= 오늘 배운 내용 정리
- 전위: 단위 양전하의 전기 퍼텐셜 에너지, 단위 [[V = J/C]]
- 점전하의 전위 V = [[kQ/r]]
- 전기력이 하는 일 W = [[qΔV]]
- 등전위선은 전기력선과 [[수직]]
- 균일한 전기장 E = [[V/d]]

= 나가기 전 한 문제 | 형성평가
? 간격 1 cm인 평행판에 200 V를 걸었다. 판 사이 전기장의 세기와, +2 μC 전하를 (+)판에서 (−)판까지 옮길 때 전기력이 하는 일을 구하시오. :: E = 200 ÷ 0.01 = 20000 V/m, W = 2 × 10⁻⁶ × 200 = 4 × 10⁻⁴ J
