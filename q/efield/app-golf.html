<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전하 골프 · 고3 전자기와 양자 전기장과 전위</title>
<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/app.js"></script>
<script src="../../assets/hskit.js"></script>
</head>
<body>
<script>
const app = AppKit({
  id: 'qgolf', title: '전하 골프', unit: '고3 · 전자기와 양자 · 46 전기장과 전위', back: '../../index.html#eq', sim: 'sim.html#field', dark: true,
  lead: '(+)전하 공을 홀에 넣는 골프! 공은 항상 오른쪽으로 출발해요. 판 위에 <b>고정 전하</b>를 놓아 만든 <b>전기장</b>으로 공의 길을 휘게 하세요.',
  howto: ['판을 누르면 그 자리에 <b>(+)전하</b>가 놓여요. 다시 누르면 (−)로, 한 번 더 누르면 사라져요.', '화살표는 그 자리의 <b>전기장</b>(공이 받는 힘의 방향)이에요. 놓을 수 있는 전하 수가 정해져 있어요.', '<b>[샷!]</b>을 누르면 공이 출발. 벽이나 판 밖으로 나가면 실패예요.'],
  recap: '<b>전기장</b> E = F/q는 (+)전하가 받는 힘의 방향을 가리키고, 점전하 Q가 만드는 전기장의 세기는 E = kQ/r²로 거리의 제곱에 반비례한다. 여러 전하가 있으면 각 전하가 만드는 전기장의 <b>벡터 합</b>이 그 점의 전기장이다. (+)전하 공은 (+)고정 전하에서 멀어지고 (−)고정 전하 쪽으로 끌려간다. 전기장 속에서 전하는 전위가 높은 곳에서 낮은 곳으로 힘을 받으며, 전기력이 한 일만큼 운동 에너지가 변한다.',
  startLabel: '1번 홀로'
});
const {S, sfx, toast} = app, D = Draw;
const K = 1.2, START = [1, 3], V0 = [2, 0];
const LV = [
  {h: [9, 5.2], n: 1, w: [], why: '공의 길 위쪽에 (−)전하를 두거나 아래쪽에 (+)전하를 두면 전기력이 공을 위로 휘게 해요.'},
  {h: [9, 3], n: 2, w: [[4.8, 1.8, 5.2, 4.2]], why: '첫 전하로 공을 벽 위나 아래로 돌리고, 두 번째 전하로 다시 홀 쪽으로 끌어왔어요. 두 전하의 전기장이 벡터로 더해져요.'},
  {h: [2, 5.3], n: 2, w: [[0, 4.4, 4, 4.6]], why: '공을 크게 돌려 되돌아오게 했어요! 전기력은 가까울수록 훨씬 세다(1/r²)는 점을 이용했나요?'},
  {h: [8.5, .8], n: 2, w: [[6, 0, 6.3, 2.5]], why: '장애물 너머 아래쪽 홀 — 강하게 끌어당겼다가 놓아주는 전하 배치가 필요했어요.'},
  {t: 'quiz', q: '(+)전하 공이 (−)고정 전하에서 0.5 m 떨어져 있을 때 받는 힘은 1 m 떨어져 있을 때의 몇 배인가?', ch: ['1/2배', '2배', '4배', '1/4배'], a: 2, why: 'F = kQq/r² → 거리가 1/2이면 힘은 4배.'}];
let ui = {}, ch = [], ball = null, tr = [];
const k = HS(app, {levels: LV, load(L){ ch = []; ball = null; tr = []; const q = L.t === 'quiz'; ui.b.parentElement.style.display = q ? 'none' : ''; ui.q.parentElement.style.display = q ? '' : 'none';
  if (q) { k.mission(ui.g, '캐디의 질문'); app.quiz(ui.q, L.q, L.ch, L.a, {explain: L.why, onWrong: () => { k.fails++; app.addScore(-10); }, onRight: () => k.win(ui.g, '')}); return; }
  k.mission(ui.g, `<b>${k.lv + 1}번 홀</b> · 놓을 수 있는 전하 <b>${L.n}개</b>`); inv(); }});
function inv(){ const L = k.L(); ui.i.innerHTML = `남은 전하 <b>${L.n - ch.length}</b>개 · 놓은 전하 ${ch.map(c => c[2] > 0 ? '⊕' : '⊖').join(' ') || '없음'}`; }
function field(x, y){ let ax = 0, ay = 0; for (const c of ch) { const dx = x - c[0], dy = y - c[1], r2 = dx * dx + dy * dy + .05, r3 = r2 * Math.sqrt(r2); ax += K * c[2] * dx / r3; ay += K * c[2] * dy / r3; } return [ax, ay]; }
app.onStart = () => { ui.g = app.panel('코스'); ui.q = app.panel(''); ui.b = app.panel(''); ui.i = document.createElement('p'); ui.i.className = 'note-c'; ui.b.appendChild(ui.i);
  k.btn(ui.b, '⛳ 샷!', () => { if (ball && !ball.end) return; ball = {x: START[0], y: START[1], vx: V0[0], vy: V0[1], t: 0}; tr = []; sfx.whoosh(); });
  k.btn(ui.b, '🧹 전하 모두 치우기', () => { ch = []; ball = null; tr = []; inv(); }, 'big alt');
  k.begin(); };
function geo(){ const sc = Math.min((S.w - 20) / 10, (S.h - 20) / 6), ox = (S.w - sc * 10) / 2, oy = (S.h - sc * 6) / 2; return {sc, X: x => ox + x * sc, Y: y => oy + (6 - y) * sc, ix: px => (px - ox) / sc, iy: py => 6 - (py - oy) / sc}; }
app.pointer({tap(px, py){ const L = k.L(); if (!L || L.t || k.done || (ball && !ball.end)) return; const G = geo(), x = Math.round(G.ix(px) * 2) / 2, y = Math.round(G.iy(py) * 2) / 2; if (x <= 0 || x >= 10 || y <= 0 || y >= 6) return;
  const j = ch.findIndex(c => c[0] === x && c[1] === y); if (j >= 0) { if (ch[j][2] > 0) ch[j][2] = -1; else ch.splice(j, 1); } else { if (ch.length >= L.n) return toast('전하를 더 놓을 수 없어요', 'bad'); ch.push([x, y, 1]); } ball = null; tr = []; sfx.click(); inv(); }});
app.step = dt => { const L = k.L(); if (!ball || ball.end || !L || L.t) return;
  for (let i = 0; i < 40; i++) { const h = Math.min(dt, .05) * 1.4 / 40, [ax, ay] = field(ball.x, ball.y); ball.vx += ax * h; ball.vy += ay * h; ball.x += ball.vx * h; ball.y += ball.vy * h; ball.t += h;
    let res = null; if (Math.hypot(ball.x - L.h[0], ball.y - L.h[1]) < .35) res = 'win'; else if (ball.x < 0 || ball.x > 10 || ball.y < 0 || ball.y > 6) res = '판 밖으로 나갔어요'; else if (L.w.some(w => ball.x > w[0] && ball.x < w[2] && ball.y > w[1] && ball.y < w[3])) res = '벽에 부딪혔어요'; else if (ch.some(c => Math.hypot(ball.x - c[0], ball.y - c[1]) < .26)) res = '고정 전하에 부딪혔어요'; else if (ball.t > 15) res = '시간 초과 — 공이 맴돌아요';
    if (res) { ball.end = true; if (res === 'win') k.win(ui.g, L.why, `전하 ${ch.length}개`); else k.fail(res); break; } }
  tr.push([ball.x, ball.y]); };
k.draw((g, W, H) => { const L = k.L(), G = geo(), t = performance.now() / 1000; g.fillStyle = '#0f2a22'; g.fillRect(0, 0, W, H);
  if (L.t) { D.text(g, '⛳ ⊕ ⊖', W / 2, H / 2, {size: Math.min(W, H) * .14, color: '#e8eef6'}); return; }
  g.fillStyle = '#1f5a3e'; g.fillRect(G.X(0), G.Y(6), G.sc * 10, G.sc * 6);
  for (let x = .5; x < 10; x += .5) for (let y = .5; y < 6; y += .5) { const [fx, fy] = field(x, y), m = Math.hypot(fx, fy); g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(G.X(x) - 1, G.Y(y) - 1, 2, 2);
    if (ch.length && x % 1 === 0 && y % 1 === 0 && m > .02) { const l = Math.min(.42, .15 + m * .5) * G.sc; D.arrow(g, G.X(x), G.Y(y), G.X(x) + fx / m * l, G.Y(y) - fy / m * l, `rgba(246,211,101,${Math.min(.85, .25 + m)})`, 1.5); } }
  L.w.forEach(w => { g.fillStyle = '#8a7a5a'; g.fillRect(G.X(w[0]), G.Y(w[3]), (w[2] - w[0]) * G.sc, (w[3] - w[1]) * G.sc); });
  g.fillStyle = '#0a0a0a'; g.beginPath(); g.arc(G.X(L.h[0]), G.Y(L.h[1]), .35 * G.sc, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.moveTo(G.X(L.h[0]), G.Y(L.h[1])); g.lineTo(G.X(L.h[0]), G.Y(L.h[1]) - 40); g.stroke(); g.fillStyle = '#d0533f'; g.beginPath(); g.moveTo(G.X(L.h[0]), G.Y(L.h[1]) - 40); g.lineTo(G.X(L.h[0]) + 18, G.Y(L.h[1]) - 34); g.lineTo(G.X(L.h[0]), G.Y(L.h[1]) - 28); g.fill();
  ch.forEach(c => { g.fillStyle = c[2] > 0 ? '#e65a4a' : '#3f7fe0'; g.beginPath(); g.arc(G.X(c[0]), G.Y(c[1]), .24 * G.sc, 0, 7); g.fill(); D.text(g, c[2] > 0 ? '+' : '−', G.X(c[0]), G.Y(c[1]), {size: .3 * G.sc, weight: 700, color: '#fff'}); });
  if (tr.length > 1) k.line(g, tr.map(([x, y]) => [G.X(x), G.Y(y)]), 'rgba(255,255,255,.6)', 2);
  const b = ball || {x: START[0], y: START[1]}; g.fillStyle = '#fff'; g.beginPath(); g.arc(G.X(b.x), G.Y(b.y), .16 * G.sc, 0, 7); g.fill(); D.text(g, '+', G.X(b.x), G.Y(b.y), {size: .2 * G.sc, weight: 700, color: '#d0533f'});
  if (!ball) D.arrow(g, G.X(START[0]) + 12, G.Y(START[1]), G.X(START[0]) + 50, G.Y(START[1]), 'rgba(255,255,255,.7)', 2);
});
</script>
</body>
</html>
