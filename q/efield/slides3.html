# 정전기 유도와 유전 분극 | 도체와 절연체가 전기장에 반응하는 법 | 고등학교 전자기와 양자 · 01 전기장과 전위 · 3차시 | 2022 개정 교육과정 [12전자01-02]

= 오늘의 학습 목표 | 3차시
^ 도체에서 일어나는 **정전기 유도**를 자유 전자의 이동으로 설명할 수 있다.
^ 절연체(유전체)에서 일어나는 **유전 분극**을 원자·분자 속 전하의 치우침으로 설명할 수 있다.
^ 정전기 유도와 유전 분극이 일상생활에서 **적용되는 예**를 찾을 수 있다.
% 흐름: 생각 열기 5분 → 정전기 유도 12분 → 유전 분극 10분 → 생활 속 적용 13분 → 문항 5분
% 2022 개정 [12전자01-02]: 정전기 유도와 유전분극을 설명하고 일상생활에서 적용되는 예를 찾는다. 장이 상호작용의 매개물이라는 관점을 함께 강조한다.

= 대전된 풍선이 벽에 붙는 까닭 | 생각 열기
* 🎈 풍선 :: 머리에 문지른 풍선이 벽에 달라붙는다
* 💧 물줄기 :: 대전된 빗을 가까이 하면 물줄기가 휜다
* 🧺 랩 :: 비닐 랩이 그릇에 착 달라붙는다
* ⚡ 피뢰침 :: 건물 꼭대기의 뾰족한 금속 막대
? 벽은 전하를 띠지 않았는데 왜 대전된 풍선을 끌어당길까? :: 풍선의 전기장 때문에 벽 속 전하가 살짝 치우쳐 풍선 가까운 쪽에 **반대 전하**가 생기기 때문이다 — 유전 분극

= 지난 시간 복습 | 1·2차시
- 전하 주위에는 [[전기장]]이 생긴다.
- (+)전하는 전기장 방향으로, (−)전하는 [[반대]] 방향으로 힘을 받는다.
- 도체 내부의 정전기적 평형 상태에서 전기장은 [[0]]이다.
? 금속과 플라스틱은 전기장 속에서 똑같이 반응할까? :: 다르다. 금속에는 자유롭게 움직이는 **자유 전자**가 있고, 플라스틱에는 없다.

## 정전기 유도 | 도체 속 자유 전자의 이동

= 정전기 유도
! 대전체를 도체에 가까이 하면 도체 속 **자유 전자가 이동**하여 가까운 쪽에는 대전체와 **반대 전하**, 먼 쪽에는 **같은 전하**가 나타나는 현상
^+ (−)대전체를 가까이 → 자유 전자가 먼 쪽으로 밀려남
^+ 가까운 쪽: (+), 먼 쪽: (−)
^+ 가까운 쪽 반대 전하와의 인력 > 먼 쪽 같은 전하와의 척력 → 도체가 **끌려온다**
>+ 대전체를 치우면 전자가 제자리로 돌아가 중성이 된다 (전하의 총량은 변하지 않음).

= 예제 1 · 검전기와 접지 | 적용
- (+)대전체를 검전기 금속판에 가까이 하면 금속박이 벌어진다.
^+ 금속판으로 전자가 끌려와 금속판은 (−), 금속박은 **(+)**로 대전 → 같은 전하끼리 밀어 벌어진다.
^+ 대전체를 가까이 둔 채 금속판에 손을 대면(접지) 사람 몸에서 **전자가 들어와** 금속박의 (+)가 중화되어 오므라든다.
^+ 손을 먼저 떼고 대전체를 치우면 검전기 전체가 **(−)**로 대전된다.

## 유전 분극 | 절연체 속 전하의 치우침

= 유전 분극
! 절연체(유전체)를 전기장 속에 두면 원자·분자 속의 (+)와 (−) 전하가 약간 **반대쪽으로 치우쳐** 표면에 전하가 나타나는 현상
- 자유 전자가 없어 전자가 멀리 이동하지는 못한다 → 원자·분자마다 **조금씩 치우침**
- 물처럼 원래 전하가 치우친 분자는 전기장 방향으로 **정렬**한다.
>+ 대전체 가까운 표면에 반대 전하가 나타나므로 절연체도 대전체에 **끌린다.**

= 정전기 유도와 유전 분극 비교
| 구분 | 정전기 유도 | 유전 분극 |
|+ 일어나는 물질 | [[도체]] | 절연체(유전체) |
|+ 원인 | 자유 전자의 이동 | 원자·분자 속 전하의 [[치우침]] |
|+ 전하가 나타나는 정도 | 크다 | 작다 |
|+ 대전체를 가까이 하면 | 끌려온다 | 끌려온다 |
|+ 내부 전기장 | 정전기적 평형에서 0 | 약해지지만 0은 아님 |

= 예제 2 · 휘는 물줄기 | 적용
^+ 물 분자는 산소 쪽이 (−), 수소 쪽이 (+)로 전하가 치우친 분자이다.
^+ 대전된 빗을 가까이 하면 물 분자가 빗 쪽에 **반대 전하**가 오도록 정렬한다.
^+ 인력이 척력보다 커서 물줄기가 빗 쪽으로 **휜다.**
>+ (+)로 대전된 막대든 (−)로 대전된 막대든 물줄기는 **끌려온다.**

## 생활 속 적용 | 정전기를 다스리다

= 정전기 유도와 유전 분극의 적용 | 사례
* ⚡ 피뢰침 :: 뇌운이 유도한 전하를 뾰족한 끝으로 모아 안전하게 땅으로 흘려보낸다
* 🏭 전기 집진기 :: 대전시킨 먼지를 반대 전하 판에 붙여 굴뚝 매연을 거른다
* 🖨️ 레이저 프린터·복사기 :: 드럼의 전하 무늬에 토너 가루가 붙어 글자가 찍힌다
* 🎨 정전 도장 :: 대전된 페인트 입자가 자동차 차체에 고르게 붙는다
* 📱 축전기 속 유전체 :: 유전 분극으로 같은 전압에서 더 많은 전하를 저장
* 🚗 주유소 정전기 방지 패드 :: 몸의 전하를 접지로 빼내 불꽃을 막는다

= 확인 문제 1
Q (−)대전체를 중성인 금속 막대의 한쪽 끝에 가까이 했을 때 막대의 반대쪽 끝에 나타나는 전하는?
o (+)전하
o* (−)전하
o 전하가 나타나지 않는다
o 양쪽 모두 (+)전하
:: 자유 전자가 대전체에 밀려 먼 쪽으로 이동하므로 먼 쪽이 (−)가 된다.

= 확인 문제 2
Q 유전 분극에 대한 설명으로 옳은 것은?
o 자유 전자가 물체의 한쪽 끝으로 크게 이동한다
o* 절연체 속 원자·분자의 전하가 조금씩 치우쳐 표면에 전하가 나타난다
o 물체 전체의 전하량이 증가한다
o 도체에서만 일어난다
:: 절연체는 자유 전자가 없어 원자·분자 단위로 전하가 치우친다.

= 확인 문제 3
Q 대전된 풍선이 전하를 띠지 않은 벽에 붙는 까닭은?
o 벽이 원래 (+)전하를 띠어서
o* 유전 분극으로 풍선 가까운 벽면에 반대 전하가 나타나 인력이 작용해서
o 풍선이 벽보다 가벼워서
o 공기 압력 때문에
:: 가까운 쪽 반대 전하와의 인력이 먼 쪽 같은 전하와의 척력보다 크다.

= 서술형 도전 | 생각 넓히기
? 검전기를 정전기 유도와 접지만을 이용하여 (+)전하로 대전시키는 방법을 순서대로 쓰시오. :: (−)대전체를 금속판에 가까이 한다 → 금속판에 손을 대어 접지하면 전자가 몸을 통해 빠져나간다 → 손을 뗀다 → 대전체를 치우면 검전기는 (+)로 대전된다.
? 전기 집진기가 굴뚝의 먼지를 제거하는 원리를 쓰시오. :: 굴뚝을 지나는 먼지 입자를 전하로 대전시키면, 반대 전하를 띤 집진판 쪽으로 전기력을 받아 붙으므로 깨끗한 기체만 배출된다.

= 오늘 배운 내용 정리
- 정전기 유도: 도체 속 [[자유 전자]]가 이동 → 가까운 쪽 반대 전하, 먼 쪽 같은 전하
- 유전 분극: 절연체 속 원자·분자 전하의 [[치우침]] → 표면에 전하
- 둘 다 대전체에 [[끌려온다]] (가까운 쪽 반대 전하)
- 적용: 피뢰침, 전기 집진기, 레이저 프린터, 정전 도장, 축전기의 유전체

= 나가기 전 한 문제 | 형성평가
? (+)대전체와 (−)대전체를 각각 가는 물줄기에 가까이 했을 때 물줄기가 휘는 방향을 쓰고, 그 까닭을 쓰시오. :: 두 경우 모두 대전체 쪽으로 휜다. 물 분자가 대전체 쪽에 반대 전하가 오도록 정렬(유전 분극)하여 인력이 작용하기 때문이다.
