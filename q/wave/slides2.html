# 회절과 분해능 | 두 별을 구별하는 힘 | 고등학교 전자기와 양자 · 04 빛의 파동성 · 2차시 | 2022 개정 교육과정 [전자기와 양자 Ⅱ]

= 오늘의 학습 목표 | 2차시
^ 원형 구멍에 의한 회절로 상이 **에어리 원반**이 됨을 설명할 수 있다.
^ **레일리 기준**으로 최소 분해각 θ = 1.22λ/D를 구할 수 있다.
^ 망원경, 현미경, 반도체 장비 등에서 **분해능을 높이는 방법**을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 에어리 원반 8분 → 레일리 기준 8분 → 두 광원 구별(시뮬레이션, 퀴즈) 14분 → 계산·문항 10분

= 두 별일까, 한 별일까? | 생각 열기
* ✨ 쌍성 :: 맨눈에는 하나, 망원경으로는 둘
* 🔭 거대 망원경 :: 구경이 클수록 더 선명하다
* 🚗 멀리 있는 자동차 :: 전조등 두 개가 하나로 보인다
* 💿 블루레이 :: DVD보다 훨씬 많은 정보를 담는다
? 멀리서 오는 자동차의 두 전조등이 하나로 보이는 까닭은? :: 빛이 눈동자를 지나며 **회절**해 각 전조등의 상이 퍼지고, 두 상이 겹쳐 구별되지 않기 때문이다.

= 지난 시간 복습 | 1차시
- 회절은 틈이 [[좁을수록]], 파장이 [[길수록]] 잘 일어난다.
- 단일 슬릿 첫 어두운 곳: a sinθ = [[λ]]
- 틈을 좁히면 가운데 밝은 무늬가 [[넓어진다]].
? 원형 구멍을 지난 빛은 스크린에 어떤 무늬를 만들까? :: 가운데 밝은 원반과 그 둘레의 **동심원** 고리 — 에어리 원반

## 회절과 분해능 | 점이 점으로 맺히지 않는다

= 에어리 원반
- 빛이 원형 구멍(렌즈, 눈동자)을 지나면 회절 → 점이 아닌 ==에어리 원반==으로 맺힌다.
- 첫 어두운 고리의 각: sinθ ≈ [[1.22λ/D]]
>+ 구멍이 클수록, 파장이 짧을수록 원반이 **작아진다.**

= 분해능과 레일리 기준
- 분해능: 가까운 두 점을 [[구별]]하는 능력
- **레일리 기준**: 한 무늬의 중심이 다른 무늬의 첫 [[어두운 고리]]에 놓일 때 겨우 구별된다.
! 최소 분해각 θ = 1.22λ / D
| 분해능을 높이려면 | 까닭 |
|+ 구경 D를 [[크게]] | θ ∝ 1/D |
|+ 파장 λ를 [[짧게]] | θ ∝ λ |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#resol | 파장 630 nm, 두 광원 간격 150 μrad에서 구멍 지름을 바꾸며 구별 여부를 기록하자. [구별 퀴즈]에도 도전!
% 퀴즈: 화면만 보고 구별/불가 판단 → θ = 1.22λ/D 계산으로 확인

= 두 광원 구별하기 | 시뮬레이션 기록 (630 nm, 간격 150 μrad)
| 구멍 지름 D (mm) | 3 | 4 | 5 | 6 |
|+ 최소 분해각 (μrad) | 256 | [[192]] | [[154]] | [[128]] |
|+ 구별 여부 | ✗ | ✗ | [[✗ (겨우 못 미침)]] | [[○]] |
- 150 μrad 간격을 구별하는 최소 구경: 1.22 × 630 × 10⁻⁹ ÷ (150 × 10⁻⁶) ≈ [[5.1]] mm

= 구경과 최소 분해각 | 그래프
C 구경에 따른 최소 분해각 (630 nm) | 구멍 지름 D (mm) | 각 (μrad) | 최소 분해각:2,384 3,256 4,192 5,154 6,128 8,96
||
- 최소 분해각이 두 광원 간격(150 μrad)보다 [[작아야]] 구별된다 → D ≥ 약 5.1 mm
- 구경 2배 → 최소 분해각 [[1/2]]배
~ 1 μrad = 10⁻⁶ rad

= 예제 1 · 사람 눈의 분해능 | 적용
- 눈동자 지름 3 mm, 빛의 파장 550 nm
^+ θ = 1.22 × 550 × 10⁻⁹ ÷ (3 × 10⁻³) ≈ **2.2 × 10⁻⁴ rad**
^+ 100 m 떨어진 두 점: 간격 = 100 × 2.2 × 10⁻⁴ ≈ **0.022 m**
^+ 두 점 사이가 약 **2.2 cm** 이상이어야 구별된다.

= 예제 2 · 빨간빛과 파란빛 | 적용
- 같은 망원경(D 일정)으로 빨간빛(700 nm)과 파란빛(450 nm)으로 본다.
^+ θ ∝ λ → 파란빛의 최소 분해각이 700 ÷ 450 ≈ **1/1.6배**
^+ 파장이 짧은 **파란빛**의 분해능이 더 좋다.
>+ 블루레이(405 nm)가 DVD(650 nm)보다 더 작은 점을 읽는 까닭

= 예제 3 · 우주 망원경 | 적용
- 구경 2.4 m 우주 망원경, 파장 550 nm
^+ θ = 1.22 × 550 × 10⁻⁹ ÷ 2.4 ≈ **2.8 × 10⁻⁷ rad**
^+ 사람 눈(2.2 × 10⁻⁴ rad)의 약 **800분의 1** → 훨씬 가까운 두 별도 구별

= 확인 문제 1
Q 원형 구멍을 지난 빛이 점이 아닌 원반으로 맺히는 까닭은?
o 굴절
o 반사
o* 회절
o 분산
:: 회절로 빛이 퍼져 에어리 원반이 생긴다.

= 확인 문제 2
Q 망원경의 분해능을 높이는 방법으로 옳은 것은?
o 구경을 작게 한다
o* 구경을 크게 한다
o 파장이 긴 빛을 쓴다
o 배율만 높인다
:: θ = 1.22λ/D → D가 클수록 θ가 작아진다.

= 확인 문제 3
Q 구경을 3배로 하면 최소 분해각은?
o 3배
o* 1/3배
o 9배
o 1/9배
:: θ ∝ 1/D

= 확인 문제 4
Q 레일리 기준에서 두 점이 겨우 구별되는 조건은?
o 두 무늬가 완전히 겹칠 때
o* 한 무늬의 중심이 다른 무늬의 첫 어두운 고리에 놓일 때
o 두 무늬의 밝기가 같을 때
o 두 무늬 사이가 파장과 같을 때
:: 레일리 기준

= 확인 문제 5
Q 전자 현미경의 분해능이 광학 현미경보다 훨씬 좋은 까닭은?
o 전자가 빛보다 밝아서
o* 전자의 물질파 파장이 가시광선보다 매우 짧아서
o 렌즈가 더 커서
o 전자는 회절하지 않아서
:: 파장이 짧을수록 회절에 의한 퍼짐이 작다.

= 생활 속 분해능 | 사례
* 🔭 거대 마젤란 망원경 :: 구경 25 m급으로 외계 행성 관측
* 🕳️ 사건의 지평선 망원경 :: 지구 크기의 구경 → 블랙홀 그림자 촬영
* 💿 블루레이 :: 짧은 파장 레이저로 작은 점 기록
* 💻 반도체 노광 장비 :: 극자외선(13.5 nm)으로 미세 회로
* 🔬 전자 현미경 :: pm 수준 물질파로 원자 관찰
* 👁️ 독수리의 눈 :: 큰 눈동자로 먼 곳의 먹이를 구별

= 서술형 도전 | 생각 넓히기
? 전자 현미경이 광학 현미경보다 분해능이 훨씬 좋은 까닭을 최소 분해각과 연결하여 설명하시오. :: 전자의 물질파 파장(수 pm)은 가시광선(수백 nm)보다 매우 짧아 회절에 의한 퍼짐이 작으므로 최소 분해각 1.22λ/D가 매우 작다.
? 세계 여러 곳의 전파 망원경을 연결한 '사건의 지평선 망원경'이 망원경을 멀리 떨어뜨려 연결하는 까닭을 분해능과 연결하시오. :: 여러 망원경을 연결하면 망원경 사이 거리(지구 크기)를 구경 D로 갖는 하나의 거대한 망원경처럼 작동해 1.22λ/D가 매우 작아지므로 아주 작은 각도의 천체 구조를 구별할 수 있다.

= 오늘 배운 내용 정리
- 원형 구멍에 의한 회절 → [[에어리 원반]]
- 분해능: 가까운 두 점을 [[구별]]하는 능력
- 레일리 기준: 중심이 첫 [[어두운 고리]]에 놓일 때
- 최소 분해각 θ = [[1.22λ/D]]
- 구경이 [[클수록]], 파장이 [[짧을수록]] 분해능이 좋다.

= 나가기 전 한 문제 | 형성평가
? 지름 5 mm인 렌즈로 파장 500 nm 빛을 볼 때 최소 분해각을 구하고, 1 km 떨어진 두 점을 구별하려면 두 점 사이가 최소 얼마여야 하는지 쓰시오. :: θ = 1.22 × 500 × 10⁻⁹ ÷ 0.005 = 1.22 × 10⁻⁴ rad, 간격 = 1000 × 1.22 × 10⁻⁴ ≈ 0.12 m
