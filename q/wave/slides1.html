# 이중 슬릿 간섭과 회절 | 무늬 속에 숨은 두 현상 | 고등학교 전자기와 양자 · 04 빛의 파동성 · 1차시 | 2022 개정 교육과정 [전자기와 양자 Ⅱ]

= 오늘의 학습 목표 | 1차시
^ 이중 슬릿 **간섭** 조건과 무늬 간격을 경로차로 설명할 수 있다.
^ 단일 슬릿 **회절**에서 어두운 무늬의 조건을 구할 수 있다.
^ 실제 이중 슬릿 무늬에서 **간섭과 회절**을 구별할 수 있다.
% 흐름: 생각 열기 5분 → 간섭 복습·심화 8분 → 단일 슬릿 회절 8분 → 무늬 분석(시뮬레이션) 14분 → 계산·문항 10분

= 무늬가 사라진다? | 생각 열기
* 🔦 레이저와 이중 슬릿 :: 밝고 어두운 줄무늬
* 🌫️ 무늬의 밝기 :: 가운데는 밝고 바깥으로 갈수록 어두워진다
* ❓ 사라진 줄 :: 어떤 자리의 밝은 무늬가 통째로 없다
* 💿 CD 표면 :: 무지개색 띠
? 이중 슬릿 무늬에서 밝은 무늬의 밝기가 모두 같지 않은 까닭은? :: 각 슬릿을 지난 빛이 **회절**하며 퍼지는 정도가 방향마다 달라, 간섭무늬의 밝기가 회절 무늬를 따라 달라지기 때문이다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학
| 개념 | 내용 |
| 보강 간섭 | 경로차 = 파장의 정수배 |
| 상쇄 간섭 | 경로차 = 반파장의 홀수배 |
| 무늬 간격 | Δx = Lλ/d |
? 슬릿 간격을 절반으로 줄이면 무늬 간격은? :: Δx ∝ 1/d → **2배**로 넓어진다.

## 이중 슬릿 간섭 | 두 슬릿의 경로차

= 이중 슬릿 간섭
! 경로차 = d sinθ
| 조건 | 무늬 |
|+ d sinθ = mλ | [[밝은]] 무늬 (m = 0, ±1, ±2, …) |
|+ d sinθ = (m + ½)λ | [[어두운]] 무늬 |
! 무늬 간격 Δx = Lλ/d
~ 각이 작으면 sinθ ≈ tanθ = x/L

## 단일 슬릿 회절 | 한 틈 안에서의 간섭

= 회절
- 파동이 좁은 틈을 지나 ==퍼져 나가는== 현상
- 틈이 [[좁을수록]], 파장이 [[길수록]] 잘 일어난다.
! 단일 슬릿(폭 a)의 어두운 곳: a sinθ = mλ (m = ±1, ±2, …)
- 가운데 밝은 무늬의 폭은 양옆 무늬의 [[2]]배
>+ 첫 어두운 곳의 위치 y = Lλ/a → 틈을 좁히면 무늬가 **넓어진다.**

= 실제 이중 슬릿 무늬
- 각 슬릿에서 [[회절]] → 두 슬릿의 빛이 [[간섭]]
- 촘촘한 간섭무늬의 밝기가 넓은 회절 무늬(포락선)를 따라 달라진다.
| 비교 | 결정하는 값 | 무늬 |
|+ 간섭 | 슬릿 간격 [[d]] | 촘촘한 줄무늬 |
|+ 회절 | 슬릿 폭 [[a]] | 넓은 밝기 포락선 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#double | d = 0.20 mm, a = 0.04 mm, L = 1 m에서 파장을 바꾸며 간섭무늬 간격과 회절의 첫 어두운 곳을 기록하자. "슬릿 하나만 열기"와도 비교하자.
% 가운데 회절 무늬 안의 밝은 간섭무늬 개수를 직접 세게 하기

= 무늬 분석 | 시뮬레이션 기록 (d = 0.20 mm, a = 0.04 mm)
| 파장 (nm) | 400 | 500 | 600 | 700 |
|+ 간섭무늬 간격 (mm) | 2.00 | [[2.50]] | [[3.00]] | 3.50 |
|+ 회절 첫 어두운 곳 (mm) | 10.0 | [[12.5]] | 15.0 | [[17.5]] |
||
C 파장에 따른 무늬 크기 (L = 1 m) | 파장 (nm) | 위치 (mm) | 회절 첫 어두운 곳:400,10 500,12.5 600,15 700,17.5 | 간섭무늬 간격:400,2 500,2.5 600,3 700,3.5
- 두 값의 비 = d/a = [[5]] — 파장과 관계없다.

= 사라지는 간섭무늬 | 분석
- d/a = 5 → 5번째 간섭 밝은 무늬 위치 = 회절의 첫 어두운 곳
- 그 자리의 밝은 무늬가 ==사라진다== (결손 무늬)
- 가운데 회절 무늬 안의 밝은 간섭무늬: m = 0, ±1, ±2, ±3, ±4 → [[9]]개
>+ 회절 무늬 안 간섭무늬 수 = 2(d/a) − 1

= 예제 1 · 파장 구하기 | 적용
- 슬릿 간격 0.3 mm, 스크린 거리 1.5 m에서 간섭무늬 간격이 3 mm
^+ λ = Δx · d ÷ L = 3 × 10⁻³ × 0.3 × 10⁻³ ÷ 1.5
^+ = 6 × 10⁻⁷ m = **600 nm**

= 예제 2 · 단일 슬릿의 폭 | 적용
- 폭 0.04 mm 단일 슬릿, 파장 500 nm, 스크린 거리 1 m
^+ 첫 어두운 곳 y = Lλ/a = 1 × 500 × 10⁻⁹ ÷ (0.04 × 10⁻³) = **12.5 mm**
^+ 가운데 밝은 무늬의 폭 = 2y = **25 mm**
^+ 폭을 절반(0.02 mm)으로 → 가운데 무늬 폭 **50 mm** (2배)

= 예제 3 · 결손 무늬 | 적용
- 슬릿 간격 d = 0.3 mm, 슬릿 폭 a = 0.1 mm
^+ d/a = **3** → 3번째 간섭 밝은 무늬가 사라진다.
^+ 가운데 회절 무늬 안의 밝은 간섭무늬: m = 0, ±1, ±2 → **5개**

= 확인 문제 1
Q 이중 슬릿에서 밝은 무늬가 생기는 조건은?
o d sinθ = (m + ½)λ
o* d sinθ = mλ
o a sinθ = mλ
o d = λ
:: 경로차가 파장의 정수배일 때 보강 간섭

= 확인 문제 2
Q 회절이 잘 일어나는 조건은?
o 틈이 넓고 파장이 짧을 때
o* 틈이 좁고 파장이 길 때
o 빛의 세기가 셀 때
o 스크린이 가까울 때
:: 파장이 틈의 크기와 비슷할수록 잘 회절한다.

= 확인 문제 3
Q 단일 슬릿의 폭을 절반으로 줄이면 가운데 밝은 무늬의 폭은?
o 1/2배
o 그대로
o* 2배
o 4배
:: y = Lλ/a → a가 1/2이면 2배

= 확인 문제 4
Q 실제 이중 슬릿 무늬에서 넓은 밝기 포락선을 결정하는 것은?
o 슬릿 간격 d
o* 슬릿 폭 a
o 스크린의 크기
o 광원의 밝기
:: 포락선은 각 슬릿의 회절 무늬로, 폭 a가 결정한다.

= 확인 문제 5
Q 소리는 담 너머로 잘 들리지만 빛은 담 너머로 잘 돌아가지 않는 까닭은?
o 소리가 빛보다 빨라서
o* 빛의 파장이 담에 비해 매우 짧아서
o 빛은 파동이 아니어서
o 소리는 직진하지 않아서
:: 소리의 파장(수 cm~수 m)은 담과 비슷해 잘 회절한다.

= 생활 속 간섭과 회절 | 사례
* 💿 CD·DVD :: 촘촘한 트랙이 회절 격자 역할 → 무지개색
* 🔬 분광기 :: 회절 격자로 빛을 파장별로 분리
* 🧬 X선 회절 :: DNA 이중 나선 구조 발견
* 📏 레이저 간섭계 :: 머리카락 굵기 측정
* 🌈 홀로그램 :: 간섭무늬로 입체 영상 기록
* 🔊 담 너머 소리 :: 파장이 긴 소리의 회절

= 서술형 도전 | 생각 넓히기
? 소리는 담 너머로 잘 들리지만 빛은 잘 돌아가지 않는 까닭을 회절로 설명하시오. :: 회절은 파장이 틈(장애물) 크기와 비슷할수록 잘 일어난다. 소리의 파장(수 cm~수 m)은 담과 비슷해 잘 회절하지만, 빛의 파장(수백 nm)은 매우 짧아 거의 회절하지 않는다.
? CD 표면에 빛을 비추면 무지개색이 보이는 까닭을 '여러 개의 슬릿'으로 설명하시오. :: 촘촘한 트랙들이 회절 격자처럼 작용해 각 트랙에서 반사된 빛이 간섭한다. 보강 간섭이 일어나는 각도가 파장마다 달라서 색이 분리되어 무지개색으로 보인다.

= 오늘 배운 내용 정리
- 이중 슬릿 밝은 무늬: d sinθ = [[mλ]], 간격 Δx = [[Lλ/d]]
- 단일 슬릿 어두운 곳: a sinθ = [[mλ]]
- 회절은 틈이 [[좁을수록]], 파장이 길수록 잘 일어난다.
- 실제 무늬 = 간섭무늬 × 회절 [[포락선]]
- d/a = 5 → 가운데 회절 무늬 안 간섭무늬 [[9]]개

= 나가기 전 한 문제 | 형성평가
? d = 0.2 mm, a = 0.05 mm인 이중 슬릿에서 가운데 회절 무늬 안에 있는 밝은 간섭무늬의 개수를 구하시오. :: d/a = 4 → 4번째 밝은 무늬가 사라짐 → m = 0, ±1, ±2, ±3 → 7개
