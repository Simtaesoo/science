# 이중 슬릿 간섭과 회절 | 무늬 속에 숨은 두 현상 | 고등학교 전자기와 양자 · 04 빛의 간섭·회절·편광 · 1차시 | 2022 개정 교육과정 [12전자02-01]

= 오늘의 학습 목표 | 1차시
^ 이중 슬릿 **간섭** 조건과 무늬 간격을 경로차로 설명할 수 있다.
^ 단일 슬릿 **회절** 무늬가 틈의 폭과 파장에 따라 달라짐을 정성적으로 설명하고, 반사에 의한 **위상 변화**로 비누막의 간섭을 설명할 수 있다.
^ 실제 이중 슬릿 무늬에서 **간섭과 회절**을 구별할 수 있다.
% 흐름: 생각 열기 5분 → 간섭 복습·심화 8분 → 단일 슬릿 회절 8분 → 무늬 분석(시뮬레이션) 14분 → 계산·문항 10분

= 무늬가 사라진다? | 생각 열기
* 🔦 레이저와 이중 슬릿 :: 밝고 어두운 줄무늬
* 🌫️ 무늬의 밝기 :: 가운데는 밝고 바깥으로 갈수록 어두워진다
* ❓ 사라진 줄 :: 어떤 자리의 밝은 무늬가 통째로 없다
* 💿 CD 표면 :: 무지개색 띠
? 이중 슬릿 무늬에서 밝은 무늬의 밝기가 모두 같지 않은 까닭은? :: 각 슬릿을 지난 빛이 **회절**하며 퍼지는 정도가 방향마다 달라, 간섭무늬의 밝기가 회절 무늬를 따라 달라지기 때문이다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학
| 개념 | 내용 |
| 보강 간섭 | 경로차 = 파장의 정수배 |
| 상쇄 간섭 | 경로차 = 반파장의 홀수배 |
| 무늬 간격 | Δx = Lλ/d |
? 슬릿 간격을 절반으로 줄이면 무늬 간격은? :: Δx ∝ 1/d → **2배**로 넓어진다.

## 이중 슬릿 간섭 | 두 슬릿의 경로차

= 이중 슬릿 간섭
! 경로차 = d sinθ
| 조건 | 무늬 |
|+ d sinθ = mλ | [[밝은]] 무늬 (m = 0, ±1, ±2, …) |
|+ d sinθ = (m + ½)λ | [[어두운]] 무늬 |
! 무늬 간격 Δx = Lλ/d
~ 각이 작으면 sinθ ≈ tanθ = x/L

## 단일 슬릿 회절 | 한 틈 안에서의 간섭

= 회절
- 파동이 좁은 틈을 지나 ==퍼져 나가는== 현상
- 틈이 [[좁을수록]], 파장이 [[길수록]] 잘 일어난다.
- 단일 슬릿을 지난 빛은 가운데가 넓고 밝으며 양옆으로 갈수록 어두워지는 무늬를 만든다.
>+ 틈을 **좁히거나** 파장이 **긴** 빛을 쓰면 무늬가 **넓게 퍼진다.**
% 2022 개정 [12전자02-01] 해설: 반사에 의한 위상 변화를 포함하여 간섭을 다루며, 회절과 분해능은 정성적으로만 다룬다. 단일 슬릿 회절의 어두운 무늬 조건(a sinθ = mλ)과 위치 계산은 하지 않는다.

= 실제 이중 슬릿 무늬
- 각 슬릿에서 [[회절]] → 두 슬릿의 빛이 [[간섭]]
- 촘촘한 간섭무늬의 밝기가 넓은 회절 무늬(포락선)를 따라 달라진다.
| 비교 | 결정하는 값 | 무늬 |
|+ 간섭 | 슬릿 간격 [[d]] | 촘촘한 줄무늬 |
|+ 회절 | 슬릿 폭 [[a]] | 넓은 밝기 포락선 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#double | d = 0.20 mm, a = 0.04 mm, L = 1 m에서 파장을 바꾸며 간섭무늬 간격을 기록하고, 회절 무늬가 넓어지는지 좁아지는지 관찰하자. "슬릿 하나만 열기"와도 비교하자.
% 회절은 '넓어진다/좁아진다'만 관찰한다. 회절 무늬 위치의 수치는 기록하지 않는다.

= 무늬 분석 | 시뮬레이션 기록 (d = 0.20 mm, a = 0.04 mm)
| 파장 (nm) | 400 | 500 | 600 | 700 |
|+ 간섭무늬 간격 (mm) | 2.00 | [[2.50]] | [[3.00]] | 3.50 |
|+ 회절 무늬의 퍼짐 | 좁음 | → | → | [[넓음]] |
- 파장이 길수록 간섭무늬 간격이 [[넓어지고]], 회절 무늬도 [[넓게]] 퍼진다.

= 예제 1 · 파장 구하기 | 적용
- 슬릿 간격 0.3 mm, 스크린 거리 1.5 m에서 간섭무늬 간격이 3 mm
^+ λ = Δx · d ÷ L = 3 × 10⁻³ × 0.3 × 10⁻³ ÷ 1.5
^+ = 6 × 10⁻⁷ m = **600 nm**

= 반사에 의한 위상 변화와 비누막 | 간섭
- 빛이 굴절률이 **큰** 매질의 경계에서 반사하면 위상이 **반대로**(반파장만큼) 바뀐다.
- 비누막의 앞면과 뒷면에서 반사한 두 빛이 만나 간섭한다 — 한쪽만 위상이 바뀌므로 막이 아주 얇은 곳은 **어둡게** 보인다.
- 막의 두께에 따라 보강되는 색이 달라 **무지갯빛 띠**가 생긴다.
>+ 세워 둔 비누막은 위가 얇아지며 검게 변한 뒤 터진다.
% 탐구 활동: 세워진 비누막에 의한 빛의 간섭 양상 관찰하고 설명하기.

= 확인 문제 1
Q 이중 슬릿에서 밝은 무늬가 생기는 조건은?
o d sinθ = (m + ½)λ
o* d sinθ = mλ
o a sinθ = mλ
o d = λ
:: 경로차가 파장의 정수배일 때 보강 간섭

= 확인 문제 2
Q 회절이 잘 일어나는 조건은?
o 틈이 넓고 파장이 짧을 때
o* 틈이 좁고 파장이 길 때
o 빛의 세기가 셀 때
o 스크린이 가까울 때
:: 파장이 틈의 크기와 비슷할수록 잘 회절한다.

= 확인 문제 3
Q 단일 슬릿의 폭을 절반으로 줄이면 가운데 밝은 무늬의 폭은?
o 좁아진다
o 그대로
o* 넓어진다
o 사라진다
:: 틈이 좁을수록 빛이 더 넓게 퍼진다(정성적으로 2배 정도).

= 확인 문제 4
Q 실제 이중 슬릿 무늬에서 넓은 밝기 포락선을 결정하는 것은?
o 슬릿 간격 d
o* 슬릿 폭 a
o 스크린의 크기
o 광원의 밝기
:: 포락선은 각 슬릿의 회절 무늬로, 폭 a가 결정한다.

= 확인 문제 5
Q 소리는 담 너머로 잘 들리지만 빛은 담 너머로 잘 돌아가지 않는 까닭은?
o 소리가 빛보다 빨라서
o* 빛의 파장이 담에 비해 매우 짧아서
o 빛은 파동이 아니어서
o 소리는 직진하지 않아서
:: 소리의 파장(수 cm~수 m)은 담과 비슷해 잘 회절한다.

= 생활 속 간섭과 회절 | 사례
* 💿 CD·DVD :: 촘촘한 트랙이 회절 격자 역할 → 무지개색
* 🔬 분광기 :: 회절 격자로 빛을 파장별로 분리
* 🧬 X선 회절 :: DNA 이중 나선 구조 발견
* 📏 레이저 간섭계 :: 머리카락 굵기 측정
* 🌈 홀로그램 :: 간섭무늬로 입체 영상 기록
* 🔊 담 너머 소리 :: 파장이 긴 소리의 회절

= 서술형 도전 | 생각 넓히기
? 소리는 담 너머로 잘 들리지만 빛은 잘 돌아가지 않는 까닭을 회절로 설명하시오. :: 회절은 파장이 틈(장애물) 크기와 비슷할수록 잘 일어난다. 소리의 파장(수 cm~수 m)은 담과 비슷해 잘 회절하지만, 빛의 파장(수백 nm)은 매우 짧아 거의 회절하지 않는다.
? CD 표면에 빛을 비추면 무지개색이 보이는 까닭을 '여러 개의 슬릿'으로 설명하시오. :: 촘촘한 트랙들이 회절 격자처럼 작용해 각 트랙에서 반사된 빛이 간섭한다. 보강 간섭이 일어나는 각도가 파장마다 달라서 색이 분리되어 무지개색으로 보인다.

= 적용 미션 · 무늬 복원 연구소 | 게임
@ app-fringe.html | 기록된 간섭·회절 무늬를 보고 파장과 슬릿 간격을 알아내 재현하고, 망원경으로 쌍성을 구별하자.
% 이중 슬릿 간섭(Δx = Lλ/d) 단계 위주로 활용한다. 회절의 첫 어두운 곳·분해각 계산 단계는 교육과정 밖 심화이다.

= 오늘 배운 내용 정리
- 이중 슬릿 밝은 무늬: d sinθ = [[mλ]], 간격 Δx = [[Lλ/d]]
- 반사할 때 위상이 바뀌는 경우를 고려해 박막(비누막)의 [[간섭]]을 설명한다.
- 회절은 틈이 [[좁을수록]], 파장이 길수록 잘 일어난다.
- 실제 무늬 = 간섭무늬 × 회절 [[포락선]]

= 나가기 전 한 문제 | 형성평가
? 슬릿 간격 0.25 mm, 스크린 거리 1 m인 이중 슬릿에 파장 500 nm 빛을 비출 때 간섭무늬 간격을 구하고, 슬릿 폭을 좁히면 전체 무늬가 어떻게 달라지는지 쓰시오. :: Δx = Lλ/d = 1 × 500 × 10⁻⁹ ÷ (0.25 × 10⁻³) = 2 mm. 슬릿 폭을 좁히면 회절이 더 잘 일어나 밝은 무늬가 나타나는 범위(포락선)가 넓어진다.
