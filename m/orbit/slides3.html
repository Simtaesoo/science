# 등가 원리와 휘어진 시공간 | 블랙홀과 중력 시간 지연 | 고등학교 역학과 에너지 · 02 천체의 운동 · 3차시 | 2022 개정 교육과정 [12역학01-05] [12역학01-06]

= 오늘의 학습 목표 | 3차시
^ 행성마다 **탈출 속도**가 다름을 이해하고, 우주선이 **발사**되는 원리를 운동량 보존으로 설명할 수 있다.
^ 중력 질량과 관성 질량의 **등가 원리**를 설명할 수 있다.
^ 시공간의 휘어짐으로 **블랙홀**과 **중력 시간 지연**을 설명하고 GPS 등 활용 사례를 찾을 수 있다.
% 흐름: 생각 열기 5분 → 탈출 속도와 로켓 10분 → 등가 원리 10분 → 휘어진 시공간·블랙홀 10분 → 중력 시간 지연과 GPS 10분
% 2022 개정 [12역학01-05] 해설: 탈출 속도 차이로 행성별 대기 구성이 다름을 정성적으로 소개하고, 우주선 발사 원리는 정량적으로 다루지 않고 뉴턴 운동 법칙과 운동량 보존으로 정성적으로 설명한다. [12역학01-06] 해설: 등가 원리와 시공간 휘어짐을 기초적으로 설명하고, 탈출 속도로부터 블랙홀의 의미를 설명하며, GPS 시간 보정 등 중력 시간 지연의 활용 사례를 찾는다.

= 빛조차 빠져나오지 못하는 곳 | 생각 열기
* 🚀 로켓 :: 가스를 뒤로 내뿜으며 앞으로 나아간다
* 🌕 달 :: 대기가 거의 없다
* 🕳️ 블랙홀 :: 빛도 빠져나오지 못한다
* 🛰️ GPS 위성 :: 위성의 시계는 지상 시계보다 하루에 약 38 μs 빠르게 간다
? 블랙홀에서 빛조차 빠져나오지 못하는 까닭은? :: 그곳에서 빠져나오는 데 필요한 **탈출 속도가 빛의 속력보다 크기** 때문이다.

= 지난 시간 복습 | 2차시
- 지표 근처 원 궤도 속력(제1 우주 속도) ≈ [[7.9]] km/s
- 중력을 이겨 무한히 멀리 벗어나는 데 필요한 최소 속력 → [[탈출 속도]]
- 탈출 속도는 원 궤도 속력의 [[√2]]배
? 탈출 속도는 행성마다 같을까? :: 다르다. 질량이 크고 반지름이 작을수록 탈출 속도가 크다.

## 탈출 속도와 로켓 | 행성을 떠나려면

= 탈출 속도와 행성의 대기
- 역학적 에너지 보존: 운동 에너지가 중력 퍼텐셜 에너지를 이길 만큼 커야 탈출한다.
- 기체 분자도 빠르게 운동한다 → 탈출 속도가 **작은** 천체에서는 가벼운 기체가 우주로 빠져나간다.
| 천체 | 탈출 속도 (대략) | 대기 |
|+ 달 | 2.4 km/s | 거의 없음 |
|+ 지구 | 11.2 km/s | 질소·산소 대기 (수소·헬륨은 대부분 빠져나감) |
|+ 목성 | 60 km/s | 수소·헬륨이 풍부 |
% 대기 구성과 탈출 속도의 관계는 정성적으로만 다룬다.

= 로켓 발사와 운동량 보존 | 정성적 이해
^+ 처음 로켓과 연료는 함께 정지 → 전체 운동량 **0**
^+ 연소 가스를 아래(뒤)로 빠르게 내뿜는다 → 가스가 아래 방향 운동량을 가진다.
^+ 운동량 보존으로 로켓은 **반대 방향(위)**의 운동량을 얻는다 (작용 반작용).
^+ 연료를 쓸수록 로켓이 가벼워져 같은 힘으로 더 크게 가속되고, 궤도 높이에서 수평으로 방향을 틀어 **궤도 속력**에 이른다.
>+ 로켓은 공기를 미는 것이 아니다 → 공기가 없는 우주에서도 가속할 수 있다.

## 등가 원리 | 중력과 가속은 구별할 수 없다

= 엘리베이터 사고 실험
^+ 창문 없는 우주선이 우주 공간에서 **g로 가속**하면, 안의 사람은 바닥에 눌리고 떨어뜨린 공은 바닥으로 '떨어진다'.
^+ 지구 위에 **정지**한 같은 방 안에서도 똑같은 일이 일어난다.
^+ 방 안의 실험만으로는 둘을 **구별할 수 없다.**
>+ **등가 원리**: 중력의 효과와 가속 운동의 효과는 구별할 수 없다 — 중력 질량과 관성 질량은 같다.

= 빛도 휜다 | 등가 원리의 결과
- 가속하는 우주선 안으로 빛이 수평으로 들어오면, 빛이 건너가는 동안 우주선이 가속되므로 안에서 보면 빛이 **아래로 휘어진다.**
- 등가 원리에 따라 **중력도 빛의 경로를 휘게** 한다.
- 일반 상대성 이론: 질량이 주위 **시공간을 휘게** 하고, 물체와 빛은 휘어진 시공간을 따라 움직인다.
>+ 1919년 일식 때 태양 근처를 지나는 별빛이 휘는 것이 관측되었다 → **중력 렌즈** 현상

## 블랙홀과 중력 시간 지연 | 휘어진 시공간의 극한

= 블랙홀
- 질량이 매우 큰 별이 죽으며 아주 작은 공간에 질량이 모이면 시공간이 극도로 휜다.
- 어떤 경계(사건의 지평선) 안에서는 탈출 속도가 **빛의 속력보다 크다** → 빛도 빠져나오지 못한다.
- 블랙홀 자체는 보이지 않지만, 주위를 도는 별의 운동과 빨려 드는 물질이 내는 빛으로 존재를 확인한다.
>+ 2019년 사건 지평선 망원경이 블랙홀의 '그림자'를 촬영했다.

= 중력 시간 지연과 GPS
- 중력이 강한 곳(질량에 가까운 곳)일수록 시간이 **느리게** 간다 → **중력 시간 지연**
- GPS 위성은 지표보다 중력이 약한 높은 곳에 있어 시계가 **빠르게** 간다.
- 위성이 빠르게 움직여 생기는 특수 상대성 효과(시계가 느려짐)보다 이 효과가 더 커서, 위성 시계는 하루에 약 **38 μs 빠르다.**
>+ 보정하지 않으면 위치 오차가 하루에 수 km씩 쌓인다 → 위성 시계를 미리 보정해 쏘아 올린다.

= 확인 문제 1
Q 달에 대기가 거의 없는 까닭으로 가장 알맞은 것은?
o 달은 태양에서 멀기 때문
o* 달의 탈출 속도가 작아 기체 분자가 쉽게 빠져나가기 때문
o 달은 자전하지 않기 때문
o 달에는 물이 없기 때문
:: 탈출 속도가 작으면 기체 분자가 우주로 빠져나가기 쉽다.

= 확인 문제 2
Q 우주 공간에서 로켓이 앞으로 가속할 수 있는 까닭은?
o 로켓이 공기를 뒤로 밀기 때문
o* 연소 가스를 뒤로 내뿜어 운동량 보존에 따라 반대 방향의 운동량을 얻기 때문
o 우주에는 마찰이 있기 때문
o 태양이 로켓을 당기기 때문
:: 가스와 로켓의 운동량 합은 보존되므로 로켓은 가스와 반대 방향으로 운동량을 얻는다.

= 확인 문제 3
Q 등가 원리에 대한 설명으로 옳은 것은?
o 중력은 빛에 영향을 주지 않는다
o* 밀폐된 방 안에서는 중력의 효과와 가속 운동의 효과를 구별할 수 없다
o 관성 질량은 중력 질량보다 항상 크다
o 가속하는 우주선 안에서는 물체가 떨어지지 않는다
:: 중력과 가속의 효과를 구별할 수 없다는 것이 등가 원리이다.

= 확인 문제 4
Q GPS 위성의 시계가 지표의 시계보다 빠르게 가는 주된 까닭은?
o 위성이 빠르게 움직이기 때문
o* 위성이 있는 곳의 중력이 지표보다 약하기 때문
o 위성이 태양에 가깝기 때문
o 위성의 시계가 부정확하기 때문
:: 중력이 약한 곳일수록 시간이 빠르게 간다(중력 시간 지연).

= 서술형 도전 | 생각 넓히기
? 블랙홀을 탈출 속도를 이용해 설명하시오. :: 블랙홀의 사건의 지평선 안에서는 빠져나오는 데 필요한 탈출 속도가 빛의 속력보다 커서, 빛을 포함한 어떤 것도 빠져나올 수 없다.
? 1층과 높은 산꼭대기에 똑같은 정밀 원자시계를 두면 어느 쪽 시계가 더 빠르게 가는지 까닭과 함께 쓰시오. :: 산꼭대기. 지구 중심에서 더 멀어 중력이 약하므로 중력 시간 지연이 작아 시간이 더 빠르게 간다.

= 오늘 배운 내용 정리
- 탈출 속도가 작은 천체는 대기를 붙잡기 어렵다 (달)
- 로켓: 가스를 뒤로 내뿜어 [[운동량 보존]]으로 가속
- [[등가 원리]]: 중력 효과와 가속 효과는 구별할 수 없다
- 질량은 시공간을 휘게 한다 → 빛의 휨, [[블랙홀]]
- 중력이 강한 곳일수록 시간이 느리게 간다 → GPS [[시간 보정]]

= 나가기 전 한 문제 | 형성평가
? 영화에서 블랙홀 근처 행성에 다녀온 우주인이 지구의 가족보다 훨씬 덜 늙어 있었다. 이 장면을 과학적으로 설명하시오. :: 블랙홀 근처는 중력이 매우 강해 시공간이 크게 휘어 있으므로 그곳의 시간이 지구보다 훨씬 느리게 간다(중력 시간 지연). 따라서 우주인에게 흐른 시간이 지구보다 짧다.
