* 🌍 지구 :: 1월 초에 태양과 가장 가깝다 (근일점)

? 지구의 공전 속력은 1년 내내 같을까? :: 아니다. 태양에 가까운 1월 초에 가장 **빠르고**, 먼 7월 초에 가장 **느리다**.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 등속 원운동 | v = 2πr/T, 구심력 F = mv²/r (1단원) |

? 인공위성에서 구심력 역할을 하는 힘은? :: 지구의 **중력** — 오늘은 행성의 운동 규칙부터 살펴본다.

## 케플러 제1·2법칙 | 궤도의 모양과 속력

= 제1법칙 · 타원 궤도 법칙
! 행성은 태양을 한 초점으로 하는 타원 궤도를 돈다
| 용어 | 뜻 |
|+ 근일점 | 태양에 [[가장 가까운]] 점 |
|+ 원일점 | 태양에서 [[가장 먼]] 점 |
|+ 긴반지름 a | (근일점 거리 + 원일점 거리) ÷ 2 |
|+ 이심률 e | 0이면 [[원]], 1에 가까울수록 납작한 타원 |
~ 근일점 거리 = a(1 − e), 원일점 거리 = a(1 + e)

= 제2법칙 · 면적 속도 일정 법칙
! 같은 시간 동안 쓸고 지나가는 넓이는 일정하다
- 태양에 가까울 때: 선분이 짧다 → 같은 넓이를 쓸려면 ==빨리== 움직인다.
- 태양에서 멀 때: 선분이 길다 → ==느리게== 움직인다.
>+ 궤도가 납작할수록(이심률이 클수록) 근일점과 원일점의 속력 차이가 크다.
% 2022 개정 [12역학01-04] 해설: 인공위성과 천체의 운동은 원운동에만 한정하여 정량적으로 설명하며, 타원 운동에 대한 정량적 설명(근일점·원일점 속력 비, 이심률 계산 등)은 도입하지 않는다. 제1·2법칙은 정성적으로, 제3법칙은 원 궤도 근사로 계산한다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#kepler | 긴반지름 1 AU에서 이심률을 바꾸며 근일점·원일점에서 속력이 어떻게 다른지, 공전 주기가 변하는지 관찰하자.
% 이심률을 바꿔도 공전 주기가 그대로인 것을 꼭 짚기 → 제3법칙 도입

= 이심률과 궤도 | 시뮬레이션 기록
| 궤도 모양 | 원 | 조금 납작 | 납작 | 매우 납작 |
|+ 근일점과 원일점의 속력 | 같다 | 근일점이 조금 빠름 | 근일점이 [[훨씬]] 빠름 | 차이가 [[매우]] 큼 |
|+ 공전 주기 | 1년 | 1년 | 1년 | 1년 |
- 공전 주기는 이심률과 관계없이 모두 [[1년]] — 긴반지름으로만 정해진다.

## 케플러 제3법칙 | 주기와 긴반지름

= 제3법칙 · 조화 법칙
! T² = ka³
- 주기를 **년**, 긴반지름을 **AU**로 나타내면 태양계에서 k = 1
| 행성 | a (AU) | T (년) | T²/a³ |
|+ 수성 | 0.387 | 0.241 | 1.00 |
|+ 지구 | 1 | 1 | 1 |
|+ 화성 | 1.524 | 1.881 | [[1.00]] |
|+ 목성 | 5.203 | 11.86 | [[1.00]] |

= 그래프로 보면
C 태양계 행성의 긴반지름과 공전 주기 | 긴반지름 (AU) | 공전 주기 (년) | 공전 주기:0.387,0.241 0.723,0.615 1,1 1.524,1.881 5.203,11.86 9.537,29.45
||
- 멀리 있는 행성일수록 공전 주기가 ==훨씬== 길다.
- 긴반지름 4배 → 주기 √(4³) = [[8]]배
- 긴반지름 9.5배(토성) → 주기 약 [[29]]배
~ 비례 상수 k는 중심 천체(태양)의 질량으로 정해진다.

= 예제 1 · 소행성의 주기 | 적용
- 긴반지름이 4 AU인 소행성의 공전 주기는?
^+ T² = 1 × 4³ = **64**
^+ T = **8년**

= 예제 2 · 태양에 다가오는 혜성 | 적용
- 매우 납작한 궤도를 도는 혜성이 있다.
^+ 태양에서 멀리 있을 때: 같은 넓이를 쓸려면 조금만 움직여도 된다 → **매우 느리다**
^+ 태양에 가까워질 때: 짧은 선분으로 같은 넓이를 쓸어야 한다 → **매우 빠르다**
^+ 그래서 혜성은 공전 주기의 대부분을 태양에서 먼 곳에서 보내고, 태양 근처는 **잠깐** 지나간다.

= 예제 3 · 핼리 혜성 | 적용
- 긴반지름이 약 17.8 AU인 혜성의 공전 주기는? (원 궤도와 같은 방법으로 근사)
^+ T² = 17.8³ ≈ **5640**
^+ T = √5640 ≈ **75년** → 핼리 혜성(약 76년)과 비슷
>+ 핼리 혜성은 1986년에 왔고, 다음은 **2061년**이다.

= 확인 문제 1
Q 행성이 공전 궤도에서 가장 빠르게 움직이는 곳은?
o 원일점
o* 근일점
o 어디서나 같다
o 궤도의 중간
:: 면적 속도 일정 → 태양에 가까울수록 빠르다.

= 확인 문제 2
Q 긴반지름이 9 AU인 천체의 공전 주기는?
o 3년
o 9년
o* 27년
o 81년
:: T² = 9³ = 729 → T = 27년

= 확인 문제 3
Q 지구가 태양에 가장 가까운 1월 초와 가장 먼 7월 초의 공전 속력을 비교한 것으로 옳은 것은?
o 7월 초가 더 빠르다
o* 1월 초가 더 빠르다
o 항상 같다
o 계절에 따라 무작위로 바뀐다
:: 면적 속도 일정 법칙에 따라 태양에 가까운 근일점(1월 초)에서 더 빠르다.

= 확인 문제 4
Q 긴반지름은 같고 이심률만 다른 두 행성에 대한 설명으로 옳은 것은?
o 이심률이 큰 쪽의 주기가 길다
o* 공전 주기가 같다
o 이심률이 큰 쪽의 주기가 짧다
o 속력 변화가 같다
:: 주기는 긴반지름으로만 정해진다. 속력 변화는 이심률이 큰 쪽이 크다.

= 확인 문제 5
Q 태양계 모든 행성의 T²/a³ 값이 같은 까닭은?
o 행성의 질량이 모두 같아서
o* 모두 같은 중심 천체(태양)의 중력으로 공전해서
o 궤도가 모두 원이라서
o 공전 방향이 같아서
:: k는 중심 천체의 질량에 의해 정해진다(다음 차시 만유인력).

= 생활 속 케플러 법칙 | 사례
* 🌍 계절과 공전 속력 :: 북반구 겨울(근일점 무렵)이 여름보다 며칠 짧다
* ☄️ 혜성 예보 :: 궤도 긴반지름으로 귀환 시기를 예측
* 🪐 외계 행성 탐사 :: 공전 주기로 행성까지 거리를 계산
* 🛰️ 인공위성 궤도 :: 지구 둘레 위성에도 같은 법칙이 성립
* 🌙 달 :: 지구 둘레 타원 궤도 → 슈퍼문
* 🚀 탐사선 경로 :: 타원 궤도(호만 전이)로 다른 행성으로 이동

= 서술형 도전 | 생각 넓히기
? 근일점 거리 0.5 AU, 원일점 거리 35 AU인 혜성의 근일점 속력은 원일점 속력의 몇 배인지 풀이 과정과 함께 쓰시오. :: 면적 속도 일정 법칙에 따라 v근 × 0.5 = v원 × 35이므로 v근 ÷ v원 = 70배이다.
? 케플러 법칙이 성립하는 까닭을 뉴턴은 무엇으로 설명했는지 쓰시오. :: 거리의 제곱에 반비례하는 만유인력과 운동 법칙으로 설명했다. 만유인력이 구심력 역할을 한다고 두면 T² ∝ r³이 유도되고, 힘이 중심 방향으로만 작용하므로 면적 속도가 일정하다.

= 오늘 배운 내용 정리
- 제1법칙: 태양을 한 [[초점]]으로 하는 [[타원]] 궤도
- 제2법칙: 면적 속도 일정 → [[근일점]]에서 가장 빠르다
- 제3법칙: T² = [[ka³]] (년, AU 단위에서 k = 1)
- 공전 주기는 [[긴반지름]]으로만 정해진다.

= 나가기 전 한 문제 | 형성평가
? 공전 주기가 8년인 소행성의 궤도 긴반지름을 구하시오. :: T² = a³ → 64 = a³ → a = 4 AU
