* 🗻 높은 산 위의 대포 :: 세게 쏠수록 더 멀리 떨어진다
* 🌍 둥근 지구 :: 땅도 대포알 아래로 휘어져 내려간다

? 대포알이 땅에 영영 떨어지지 않게 하려면? :: 떨어지는 만큼 지면도 휘어지도록 충분히 빠르게(약 7.9 km/s) 쏘면 지구 둘레를 계속 **떨어지면서** 돈다 — 인공위성!

= 지난 시간 복습 | 1차시
- 제2법칙: 근일점에서 가장 [[빠르다]].
- 제3법칙: T² = [[ka³]]
- 구심력 F = [[mv²/r]] (1단원)
? T²/a³이 모든 행성에서 같은 까닭은? :: 모두 같은 중심 천체(태양)의 **중력**으로 공전하기 때문 — 오늘 만유인력으로 설명한다.

## 만유인력 | 질량을 가진 모든 물체 사이의 힘

= 만유인력 법칙
! F = GMm/r²
- G = 6.67 × 10⁻¹¹ N·m²/kg² (중력 상수)
- 두 물체의 질량의 곱에 **비례**, 거리의 ==제곱에 반비례==
| 거리 (지구 반지름의 몇 배) | 1 | 2 | 3 | 4 |
|+ 중력 (지표의 몇 배) | 1 | [[1/4]] | [[1/9]] | [[1/16]] |

= 인공위성의 원운동
! 만유인력 = 구심력: GMm/r² = mv²/r
| 물리량 | 식 | 궤도가 높아지면 |
|+ 원 궤도 속력 | v = √(GM/r) | [[느려진다]] |
|+ 주기 | T = 2π√(r³/GM) | [[길어진다]] |
|+ 탈출 속력 | v = √(2GM/r) | 작아진다 |
>+ 탈출 속력 = 원 궤도 속력 × **√2**

= 우주 속도
| 이름 | 속력 (지표 근처) | 뜻 |
|+ 제1 우주 속도 | [[7.9 km/s]] | 지표 근처 원 궤도 속력 |
|+ 탈출 속도 | [[11.2 km/s]] | 지구 중력을 벗어나는 최소 속력 |
- 발사 속력 < 원 궤도 속력 → 추락
- 원 궤도 속력 < 발사 속력 < 탈출 속력 → ==타원 궤도==
- 발사 속력 ≥ 탈출 속력 → 탈출

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#sat | 고도 300 km에서 발사 속력을 바꾸며 궤도 모양을 관찰하자. 원 궤도 속력, 탈출 속력, 주기도 기록하자.
% 6.5 → 7.7 → 9.0 → 11.0 km/s 순서로 발사해 궤도를 겹쳐 보기

= 발사 속력과 궤도 | 시뮬레이션 기록 (고도 300 km)
| 발사 속력 (km/s) | 6.5 | 7.7 | 9.0 | 11.0 |
|+ 궤도 모양 | 추락 | [[원 궤도]] | [[타원 궤도]] | [[탈출]] |
- 원 궤도 속력 [[7.73]] km/s, 탈출 속력 [[10.93]] km/s
- 원 궤도 주기 약 [[90]]분
~ 지구 반지름 6371 km, GM = 3.986 × 10¹⁴ m³/s²

= 고도에 따른 원 궤도 속력 | 그래프
C 고도에 따른 원 궤도 속력 | 고도 (천 km) | 속력 (km/s) | 원 궤도 속력:0,7.91 0.3,7.73 1,7.35 5,5.92 10,4.94 20,3.89 35.8,3.07
||
| 고도 | 속력 | 주기 |
| 300 km | 7.73 km/s | 약 90분 |
| 1000 km | 7.35 km/s | 약 105분 |
| 20000 km | 3.89 km/s | 약 11.8시간 |
| 35800 km | 3.07 km/s | 약 [[24시간]] |

= 예제 1 · 고도 300 km 위성 | 적용
- r = 6371 + 300 = 6671 km = 6.671 × 10⁶ m
^+ v = √(3.986 × 10¹⁴ ÷ 6.671 × 10⁶) ≈ **7.73 km/s**
^+ T = 2πr ÷ v = 2π × 6.671 × 10⁶ ÷ 7730 ≈ 5420 s ≈ **90분**
^+ 탈출 속력 = 7.73 × √2 ≈ **10.93 km/s**

= 예제 2 · 궤도 반지름 4배 | 적용
- 위성 A의 궤도 반지름이 위성 B의 4배이다.
^+ 속력 v ∝ 1/√r → 1/√4 = **1/2배**
^+ 주기 T ∝ r^(3/2) → 4^(3/2) = **8배**
^+ 구심 가속도 GM/r² → **1/16배**

= 예제 3 · 거리와 중력 | 적용
- 지표에서 질량 60 kg인 사람의 무게는 60 × 9.8 = 588 N
^+ 지구 중심에서 지구 반지름의 2배 거리 → 중력 **1/4**
^+ 588 ÷ 4 = **147 N**
>+ 우주 정거장(고도 약 400 km)에서도 중력은 지표의 약 **88 %** — 무중력처럼 느끼는 것은 함께 **떨어지고** 있기 때문

= 확인 문제 1
Q 두 물체 사이의 거리가 3배가 되면 만유인력은?
o 3배
o 1/3배
o* 1/9배
o 9배
:: F ∝ 1/r² → 1/9

= 확인 문제 2
Q 인공위성의 궤도가 높아질 때 옳은 것은?
o 속력이 빨라지고 주기가 짧아진다
o* 속력이 느려지고 주기가 길어진다
o 속력과 주기가 모두 그대로이다
o 속력이 빨라지고 주기가 길어진다
:: v = √(GM/r), T ∝ r^(3/2)

= 확인 문제 3
Q 고도 300 km에서 9.0 km/s로 수평 발사한 위성의 궤도는?
o 추락
o 원 궤도
o* 타원 궤도
o 탈출
:: 원 궤도 속력(7.73)보다 크고 탈출 속력(10.93)보다 작다.

= 확인 문제 4
Q 탈출 속력은 같은 위치의 원 궤도 속력의 몇 배인가?
o 2배
o* √2배
o 1/2배
o 4배
:: √(2GM/r) ÷ √(GM/r) = √2

= 확인 문제 5
Q 정지 궤도 위성에 대한 설명으로 옳은 것은?
o 공전 주기가 약 90분이다
o 지구 중력을 받지 않는다
o* 공전 주기가 지구 자전 주기와 같다
o 극 지방 위를 지난다
:: 약 24시간 주기로 적도 위 약 35800 km 높이에서 자전 방향으로 돈다.

= 생활 속 인공위성 | 사례
* 📡 정지 궤도 위성 :: 위성 방송, 기상 관측(천리안)
* 🗺️ GPS 위성 :: 고도 약 20000 km, 주기 약 12시간
* 🛰️ 국제 우주 정거장 :: 고도 약 400 km, 약 92분에 한 바퀴
* 🌐 저궤도 통신 위성 :: 수천 대가 모여 인터넷 제공
* 🚀 누리호 :: 발사체로 위성을 궤도에 올린다
* 🌙 달 탐사선 다누리 :: 지구 중력을 이용한 궤도로 달까지

= 서술형 도전 | 생각 넓히기
? 탈출 속력이 원 궤도 속력의 √2배임을 역학적 에너지로 설명하시오. :: 탈출하려면 ½mv² − GMm/r ≥ 0 → v ≥ √(2GM/r). 원 궤도 속력은 √(GM/r)이므로 탈출 속력은 그 √2배이다.
? 로켓 발사장이 적도에 가까울수록 유리하고 주로 동쪽으로 발사하는 까닭을 쓰시오. :: 지구는 서에서 동으로 자전하며 적도에서 자전 속력이 가장 크다(약 0.46 km/s). 동쪽으로 발사하면 이 속력을 덤으로 얻어 연료를 줄일 수 있다.
