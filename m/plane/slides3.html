# 힘의 합성과 운동 예측 | 여러 힘을 하나로 | 고등학교 역학과 에너지 · 01 평면 운동 · 1차시 | 2022 개정 교육과정 [12역학01-01]

= 오늘의 학습 목표 | 1차시
^ 평면에서 작용하는 여러 힘을 **벡터**로 나타내고 **합력**을 구할 수 있다.
^ 힘을 서로 수직인 두 방향으로 **분해**할 수 있다.
^ 마찰력, 장력, 수직 항력이 작용하는 물체의 **운동을 정량적으로 예측**할 수 있다.
% 흐름: 생각 열기 5분 → 벡터의 합성과 분해 12분 → 빗면 위 물체 12분 → 운동 예측 문제 12분 → 정리 4분
% 2022 개정 [12역학01-01] 해설: 마찰력, 장력, 수직항력 등 여러 가지 힘은 2차원 평면상에서 작용하는 힘으로만 다루고, 벡터의 합성으로 합력을 구하여 운동 예측에 활용한다. 이 차시는 단원의 첫 차시로 운영한다.

= 썰매를 끄는 두 사람 | 생각 열기
* 🛷 썰매 :: 두 사람이 서로 다른 방향으로 줄을 당긴다
* 🚢 예인선 :: 두 척이 비스듬히 큰 배를 끈다
* ⛷️ 스키 :: 비탈을 내려갈수록 빨라진다
* 🧗 줄 매달린 화분 :: 두 줄이 비스듬히 화분을 붙잡고 있다
? 두 사람이 서로 다른 방향으로 당기면 썰매는 어느 쪽으로 움직일까? :: 두 힘을 **벡터로 더한 합력**의 방향으로 가속된다.

= 이전에 배운 내용 떠올리기 | 복습 · 물리학
- 크기와 방향을 함께 가진 물리량 → [[벡터]]
- 뉴턴 운동 제2법칙: 알짜힘 = 질량 × [[가속도]]
- 마찰이 없는 면 위 물체에 작용하는 수직 항력은 중력과 크기가 [[같다]](수평면일 때)
? 일직선이 아닌 두 힘의 합은 단순히 크기를 더하면 될까? :: 아니다. 방향을 고려해 **평행사변형법(삼각형법)**으로 더해야 한다.

## 벡터의 합성과 분해 | 평면 위의 힘

= 힘의 합성
- 두 힘을 이웃한 두 변으로 하는 **평행사변형의 대각선**이 합력이다.
- 서로 수직인 두 힘 F₁, F₂의 합력 크기: F = √(F₁² + F₂²)
- 같은 방향이면 크기를 더하고, 반대 방향이면 뺀다.
>+ 합력이 0이면 물체는 정지해 있거나 등속도 운동을 한다.

= 힘의 분해
- 하나의 힘을 서로 **수직인 두 방향**의 성분으로 나눌 수 있다.
- 크기 F인 힘이 수평면과 θ를 이룰 때: 수평 성분 F cos θ, 연직 성분 F sin θ
>+ 운동을 분석할 때는 **운동 방향**과 **그에 수직인 방향**으로 나누면 편리하다.

= 예제 1 · 두 사람이 끄는 썰매 | 적용
- 두 사람이 썰매를 서로 수직인 방향으로 각각 30 N, 40 N으로 끈다. 썰매의 질량은 10 kg이고 마찰은 무시한다.
^+ 합력 = √(30² + 40²) = **50 N**
^+ 가속도 = 50 ÷ 10 = **5 m/s²**
^+ 방향: 40 N 쪽으로 더 기운 대각선 방향

## 빗면 위의 물체 | 중력의 분해

= 빗면 위 물체에 작용하는 힘
- 중력 mg를 빗면에 **나란한 성분** mg sin θ와 **수직인 성분** mg cos θ로 분해한다.
- 수직 항력 N = mg cos θ (빗면에 수직인 방향의 평형)
- 마찰이 없으면 빗면 아래 방향 알짜힘 = mg sin θ → 가속도 a = g sin θ
- 마찰이 있으면 알짜힘 = mg sin θ − 마찰력

= 예제 2 · 빗면을 미끄러지는 상자 | 적용
- 경사각 30°인 빗면에서 질량 2 kg인 상자가 미끄러진다. (g = 10 m/s², sin 30° = 0.5, cos 30° ≈ 0.87)
^+ 빗면 방향 중력 성분 = 2 × 10 × 0.5 = **10 N**
^+ 수직 항력 = 2 × 10 × 0.87 ≈ **17.4 N**
^+ 마찰력이 4 N이면 알짜힘 = 10 − 4 = **6 N** → 가속도 = 6 ÷ 2 = **3 m/s²**

= 예제 3 · 두 줄에 매달린 화분 | 적용
- 무게 20 N인 화분이 연직선과 각각 60°를 이루는 두 줄에 대칭으로 매달려 정지해 있다.
^+ 두 장력의 연직 성분 합 = 무게 → 2T cos 60° = 20
^+ T × 2 × 0.5 = 20 → **T = 20 N**
^+ 줄이 수평에 가까워질수록(각이 커질수록) 장력은 **커진다.**
>+ 빨랫줄을 팽팽하게 당길수록 끊어지기 쉬운 까닭

= 생활 속 힘의 합성 | 사례
* ⛵ 요트 :: 바람의 힘을 분해해 바람을 거슬러 지그재그로 나아간다
* 🌉 현수교 :: 비스듬한 케이블의 장력이 다리의 무게를 떠받친다
* 🏂 스노보드 :: 경사가 클수록 빗면 방향 중력 성분이 커져 빨라진다
* 🛒 카트 밀기 :: 손잡이를 아래로 비스듬히 밀면 수평 성분만 앞으로 가는 데 쓰인다

= 확인 문제 1
Q 서로 수직인 6 N과 8 N 두 힘의 합력 크기는?
o 2 N
o 7 N
o* 10 N
o 14 N
:: √(6² + 8²) = 10 N

= 확인 문제 2
Q 마찰이 없는 빗면의 경사각을 크게 하면 빗면을 따라 내려가는 물체의 가속도는?
o 작아진다
o 변하지 않는다
o* 커진다
o 0이 된다
:: 가속도 g sin θ는 경사각이 클수록 커진다.

= 확인 문제 3
Q 빗면 위에 정지한 물체에 작용하는 수직 항력의 크기는? (질량 m, 경사각 θ)
o mg
o mg sin θ
o* mg cos θ
o mg tan θ
:: 빗면에 수직인 방향으로 힘의 평형을 이룬다.

= 서술형 도전 | 생각 넓히기
? 빨랫줄을 아주 팽팽하게 당겨 수평에 가깝게 만들면 젖은 빨래를 널었을 때 줄이 끊어지기 쉬운 까닭을 힘의 분해로 설명하시오. :: 장력의 연직 성분 합이 빨래의 무게와 같아야 하는데, 줄이 수평에 가까우면 장력의 연직 성분 비율이 작아 장력 자체가 매우 커져야 하기 때문이다.
? 경사각 37°인 빗면에서 질량 5 kg 물체가 마찰 없이 미끄러질 때 가속도를 구하시오. (sin 37° = 0.6, g = 10 m/s²) :: a = g sin θ = 10 × 0.6 = 6 m/s²

= 오늘 배운 내용 정리
- 여러 힘의 합력: [[평행사변형법]]으로 벡터 합성, 수직인 두 힘은 √(F₁² + F₂²)
- 힘의 분해: 수평 F cos θ, 연직 F sin θ
- 빗면: 빗면 방향 mg sin θ, 수직 항력 mg [[cos θ]]
- 알짜힘을 구하면 F = ma로 운동을 정량적으로 [[예측]]할 수 있다.

= 나가기 전 한 문제 | 형성평가
? 수평면에서 질량 4 kg인 상자를 수평과 60°를 이루는 방향으로 20 N의 힘으로 끈다. 마찰을 무시할 때 상자의 가속도를 구하시오. (cos 60° = 0.5) :: 수평 성분 = 20 × 0.5 = 10 N → a = 10 ÷ 4 = 2.5 m/s²
