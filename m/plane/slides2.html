# 등속 원운동 | 구심 가속도와 구심력 | 고등학교 역학과 에너지 · 01 평면 운동 · 3차시 | 2022 개정 교육과정 [12역학01-03]

= 오늘의 학습 목표 | 3차시
^ 등속 원운동이 **가속도 운동**인 까닭을 설명할 수 있다.
^ 속력, **각속도**, **주기**의 관계를 식으로 나타낼 수 있다.
^ **구심 가속도**와 **구심력**을 구하고 구심력의 역할을 하는 힘을 찾을 수 있다.
% 흐름: 생각 열기 5분 → 원운동의 기술 8분 → 구심 가속도·구심력 8분 → 주기와 구심력(시뮬레이션) 12분 → 계산·문항 12분

= 줄을 끊으면 어디로 날아갈까? | 생각 열기
* 🪀 줄에 매단 공 :: 머리 위로 빙빙 돌리다 손을 놓으면?
* 🚗 커브 길 :: 빙판에서는 바깥으로 미끄러진다
* 🎠 회전 그네 :: 빨리 돌수록 줄이 더 기울어진다
* 🌀 세탁기 탈수 :: 옷은 남고 물만 빠져나간다
? 돌리던 공의 줄을 끊으면 공은 중심 반대쪽(바깥)으로 날아갈까? :: 아니다. 그 순간의 **접선 방향**으로 직진한다. 중심으로 당기던 힘(구심력)이 사라졌기 때문이다.

= 지난 시간 복습 | 1차시 · 물리학
- 포물선 운동: 수평 [[등속]], 연직 [[등가속도]]
- 뉴턴 제2법칙: F = [[ma]]
- 속력이 같아도 방향이 바뀌면 [[가속도]] 운동 (물리학 1차시)
? 등속 원운동에서 속력은 일정하다. 그런데도 힘이 필요할까? :: 필요하다. 속도의 **방향**이 계속 바뀌므로 가속도가 있고, 그만큼 힘이 필요하다.

## 원운동의 기술 | 주기, 각속도, 속력

= 등속 원운동의 기술
! v = 2πr/T = rω, ω = 2π/T
| 물리량 | 뜻 | 단위 |
|+ 주기 T | 한 바퀴 도는 데 걸리는 시간 | s |
|+ 각속도 ω | 1초 동안 회전한 각 | rad/s |
|+ 속력 v | 1초 동안 이동한 호의 길이 | m/s |
>+ 속도의 방향은 원의 **접선** 방향

= 구심 가속도와 구심력
! a = v²/r = rω²
! F = mv²/r
- 가속도와 힘의 방향: 원의 ==중심== 방향 → 구심 가속도, 구심력
- 구심력은 새로운 힘이 아니라 **중심을 향하는 알짜힘**의 이름

= 구심력의 역할을 하는 힘 | 누가 중심으로 당길까?
| 상황 | 구심력 역할을 하는 힘 |
|+ 줄에 매단 공 | 줄의 [[장력]] |
|+ 커브 길의 자동차 | 노면의 [[마찰력]] |
|+ 인공위성 | 지구의 [[중력]] |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#circ | 반지름 1 m, 질량 0.2 kg으로 두고 주기를 바꾸며 속력과 구심력을 기록하자. [줄 끊기]로 날아가는 방향도 확인하자.
% 줄 끊기는 여러 위치에서 반복해 '항상 접선 방향'임을 확인

= 주기와 구심력 | 시뮬레이션 기록
| 주기 (s) | 0.5 | 1 | 1.5 | 2 |
|+ 속력 (m/s) | 12.57 | [[6.28]] | [[4.19]] | [[3.14]] |
|+ 구심력 (N) | 31.58 | [[7.90]] | [[3.51]] | [[1.97]] |
||
C주기에 따른 구심력 (r = 1 m, m = 0.2 kg) | 주기 (s) | 구심력 (N) | 구심력:0.5,31.58 0.75,14.04 1,7.9 1.5,3.51 2,1.97
- 주기 2배 → 속력 1/2배 → 구심력 [[1/4]]배

= 예제 1 · 주기 1초 | 적용
- 반지름 1 m, 질량 0.2 kg, 주기 1 s
^+ v = 2π × 1 ÷ 1 ≈ **6.28 m/s**
^+ a = v²/r = 6.28² ÷ 1 ≈ **39.5 m/s²** (중력 가속도의 약 4배)
^+ F = ma = 0.2 × 39.5 ≈ **7.90 N**

= 예제 2 · 커브 길의 자동차 | 적용
- 질량 1000 kg인 자동차가 반지름 50 m인 커브를 10 m/s로 돈다.
^+ 필요한 구심력 F = 1000 × 10² ÷ 50 = **2000 N** (노면의 마찰력이 공급)
^+ 속력을 2배(20 m/s)로 하면 F = **8000 N** (4배)
^+ 최대 마찰력이 이보다 작으면 → 바깥쪽(접선 방향)으로 **미끄러진다.**

= 예제 3 · 최대 안전 속력 | 적용
- 마찰 계수 0.5인 도로에서 반지름 50 m 커브를 돌 수 있는 최대 속력은? (g = 9.8 m/s²)
^+ 최대 마찰력 = μmg = 구심력 mv²/r
^+ v² = μgr = 0.5 × 9.8 × 50 = **245**
^+ v ≈ **15.7 m/s** (약 56 km/h) — 질량과 관계없다!
>+ 빙판(μ ≈ 0.1)이면 v ≈ 7 m/s로 크게 줄어든다.

= 확인 문제 1
Q 등속 원운동에 대한 설명으로 옳은 것은?
o 가속도가 0이다
o 속도가 일정하다
o* 가속도의 방향은 원의 중심 방향이다
o 힘이 작용하지 않는다
:: 속도의 방향이 계속 변하므로 중심 방향의 가속도가 있다.

= 확인 문제 2
Q 반지름은 그대로 두고 속력을 3배로 하면 구심력은?
o 3배
o* 9배
o 1/3배
o 1/9배
:: F = mv²/r → v² 에 비례 → 9배

= 확인 문제 3
Q 줄에 매달려 원운동하던 공의 줄이 끊어지면 공이 날아가는 방향은?
o 원의 중심 방향
o 중심 반대 방향
o* 그 순간의 접선 방향
o 연직 아래 방향
:: 구심력이 사라져 그 순간의 속도 방향(접선)으로 관성에 따라 움직인다.

= 확인 문제 4
Q 질량 2 kg인 물체가 반지름 4 m인 원을 4 m/s로 돈다. 구심력은?
o 2 N
o* 8 N
o 16 N
o 32 N
:: F = 2 × 16 ÷ 4 = 8 N

= 확인 문제 5
Q 인공위성이 지구 둘레를 원운동할 때 구심력의 역할을 하는 힘은?
o 공기 저항
o 엔진의 추진력
o* 지구의 중력
o 원심력
:: 지구가 위성을 당기는 중력이 구심력이 된다(다음 단원 천체의 운동).

= 생활 속 원운동 | 사례
* 🌀 세탁기 탈수 :: 물방울은 구심력을 못 받아 구멍으로 직진
* 🎢 롤러코스터 루프 :: 꼭대기에서도 떨어지지 않으려면 충분한 속력이 필요
* 🛣️ 경사진 커브 :: 수직 항력의 수평 성분이 구심력을 돕는다
* 🎠 회전 그네 :: 줄 장력의 수평 성분이 구심력
* 🧪 원심 분리기 :: 혈액 성분을 밀도에 따라 분리
* 🛰️ 인공위성 :: 중력이 구심력

= 서술형 도전 | 생각 넓히기
? 놀이 기구의 회전 그네가 빠르게 돌수록 그네 줄이 더 많이 기울어지는 까닭을 쓰시오. :: 빠를수록 더 큰 구심력이 필요한데, 줄의 장력의 수평 성분이 구심력이 되므로 줄이 더 많이 기울어져 수평 성분이 커져야 한다.
? 세탁기 탈수 기능에서 옷의 물이 빠져나가는 원리를 구심력으로 설명하시오. :: 옷은 통의 벽이 밀어 주는 힘을 구심력으로 받아 원운동하지만, 물방울은 구멍을 지날 때 구심력을 받지 못해 접선 방향으로 직진하며 빠져나간다.

= 오늘 배운 내용 정리
- 등속 원운동: 속력 일정, 속도 [[방향]]이 변하는 가속도 운동
- v = 2πr/T = rω, ω = [[2π/T]]
- 구심 가속도 a = [[v²/r]], 구심력 F = [[mv²/r]] (중심 방향)
- 구심력 역할: 장력, [[마찰력]], 중력
- 줄을 끊으면 [[접선]] 방향으로 직진

= 나가기 전 한 문제 | 형성평가
? 반지름 2 m인 원을 주기 2 s로 도는 질량 0.5 kg 물체의 속력과 구심력을 구하시오. (π ≈ 3.14) :: v = 2π × 2 ÷ 2 ≈ 6.28 m/s, F = 0.5 × 6.28² ÷ 2 ≈ 9.86 N
