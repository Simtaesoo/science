# 포물선 운동 | 두 운동의 합성 | 고등학교 역학과 에너지 · 01 평면 운동 · 1차시 | 2022 개정 교육과정 [역학과 에너지 Ⅰ]

= 오늘의 학습 목표 | 1차시
^ 비스듬히 던진 물체의 운동을 **수평·연직 방향으로 분해**할 수 있다.
^ **체공 시간, 최고 높이, 수평 도달 거리**를 식으로 구할 수 있다.
^ 발사 각도에 따른 **도달 거리 변화**를 설명하고 과녁을 맞히는 조건을 찾을 수 있다.
% 흐름: 생각 열기 5분 → 운동의 분해 10분 → 공식 유도 8분 → 과녁 맞히기(시뮬레이션) 12분 → 계산·문항 10분

= 가장 멀리 던지는 각도는? | 생각 열기
* 🏀 농구 슛 :: 높이 띄울까, 낮게 쏠까
* ⚽ 골킥 :: 멀리 차려면 몇 도로?
* 🚒 소방 호스 :: 물줄기를 기울이면 멀리 간다
* 🎯 투석기 :: 각도를 바꾸며 과녁을 맞힌다
? 같은 속력으로 던질 때 가장 멀리 가는 각도는? :: 공기 저항이 없으면 **45°**. 그리고 30°와 60°처럼 서로 **여각**인 두 각도는 같은 거리만큼 간다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 수평으로 던진 물체 | 수평 등속 + 연직 자유 낙하 (통합과학1) |
| 등가속도 운동 | v = v₀ + at, s = v₀t + ½at² (물리학) |
| 벡터의 분해 | 크기 v, 각 θ → 성분 vcosθ, vsinθ |
? 같은 높이에서 공 하나는 떨어뜨리고 하나는 수평으로 던지면 어느 공이 먼저 닿을까? :: **동시에** 닿는다 — 연직 방향 운동이 같기 때문이다.

## 운동의 분해 | 수평은 등속, 연직은 등가속도

= 포물선 운동의 분해
| 방향 | 받는 힘 | 운동 | 속도 |
|+ 수평 | 없음 | [[등속 운동]] | vₓ = v₀cosθ (일정) |
|+ 연직 | 중력 | 가속도 g인 [[등가속도 운동]] | v_y = v₀sinθ − gt |
>+ 최고점: 연직 속도 **0**, 속력 = **v₀cosθ** (0이 아니다!)

= 포물선 운동의 공식
! 체공 시간 T = 2v₀sinθ / g
! 최고 높이 H = v₀²sin²θ / 2g
! 수평 도달 거리 R = v₀²sin2θ / g
~ 같은 높이로 떨어진다고 할 때. sin2θ가 최대(=1)인 θ = 45°에서 R이 최대

= 예제 1 · 30°로 던진 공 | 적용
- 처음 속력 20 m/s, 30°로 던진 공 (g = 9.8 m/s², cos30° ≈ 0.866)
^+ 체공 시간 T = 2 × 20 × 0.5 ÷ 9.8 ≈ **2.04 s**
^+ 최고점 속력 = 20 × 0.866 ≈ **17.3 m/s**
^+ 수평 도달 거리 R = 17.3 × 2.04 ≈ **35.3 m**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#proj | 처음 속력 20 m/s로 각도를 바꾸며 도달 거리와 최고 높이를 기록하자. 과녁 맞히기에도 도전!
% 모둠별로 과녁 거리를 정해 주고 '계산으로 각도 예측 → 발사 → 확인' 순서로

= 발사 각도와 도달 거리 | 시뮬레이션 기록
| 발사 각도 | 15° | 30° | 45° | 60° | 75° |
|+ 도달 거리 (m) | 20.4 | 35.3 | [[40.8]] | [[35.3]] | [[20.4]] |
|+ 최고 높이 (m) | 1.4 | 5.1 | [[10.2]] | [[15.3]] | [[19.0]] |
- 45°에서 도달 거리 [[최대]], 여각(15°와 75°, 30°와 60°)은 도달 거리가 [[같다]].

= 그래프로 보면
C 발사 각도에 따른 도달 거리와 최고 높이 (20 m/s) | 발사 각도 (°) | 거리·높이 (m) | 도달 거리:0,0 15,20.4 30,35.3 45,40.8 60,35.3 75,20.4 90,0 | 최고 높이:0,0 15,1.4 30,5.1 45,10.2 60,15.3 75,19 90,20.4
||
C 30°와 60°의 경로 (20 m/s) | 수평 거리 (m) | 높이 (m) | 30°:0,0 7,3.24 14,4.88 21,4.92 28,3.36 35.3,0 | 60°:0,0 7,9.72 14,14.65 21,14.77 28,10.1 35.3,0
~ 오른쪽: 같은 지점에 떨어지지만 60°는 더 높이, 더 오래 난다.

= 예제 2 · 절벽에서 수평으로 | 적용
- 높이 20 m 절벽에서 공을 수평으로 10 m/s로 던졌다. (g = 10 m/s²로 어림)
^+ 연직: 20 = ½ × 10 × t² → **t = 2 s**
^+ 수평: x = 10 × 2 = **20 m**
^+ 착지 직전 속도: vₓ = 10, v_y = 20 → 속력 = √(10² + 20²) ≈ **22.4 m/s**

= 예제 3 · 과녁 맞히기 | 적용
- 처음 속력 20 m/s로 같은 높이의 30 m 앞 과녁을 맞히려면 발사 각도는? (g = 9.8 m/s²)
^+ R = v₀²sin2θ ÷ g → 30 = 400 × sin2θ ÷ 9.8
^+ sin2θ = 30 × 9.8 ÷ 400 = **0.735** → 2θ ≈ 47.3° 또는 132.7°
^+ θ ≈ **23.7°** 또는 **66.3°** (서로 여각인 두 각도 모두 가능)

= 확인 문제 1
Q 포물선 운동하는 물체의 최고점에서의 속도로 옳은 것은?
o 0이다
o* 수평 성분만 남는다
o 연직 성분만 남는다
o 처음 속도와 같다
:: 연직 속도는 0이 되지만 수평 속도 v₀cosθ는 그대로이다.

= 확인 문제 2
Q 같은 속력으로 던질 때 70°와 같은 수평 도달 거리를 갖는 각도는?
o 35°
o* 20°
o 45°
o 110°
:: 서로 여각(합이 90°)인 각도의 도달 거리가 같다.

= 확인 문제 3
Q 처음 속력을 2배로 하면(각도 같음) 수평 도달 거리는?
o 2배
o* 4배
o √2배
o 그대로
:: R ∝ v₀² → 4배

= 확인 문제 4
Q 처음 속력 10 m/s, 각도 45°로 던진 공의 수평 도달 거리는? (g = 10 m/s²)
o 5 m
o* 10 m
o 14 m
o 20 m
:: R = 100 × sin90° ÷ 10 = 10 m

= 확인 문제 5
Q 포물선 운동에서 수평 방향의 운동은?
o 등가속도 운동
o* 등속 운동
o 정지
o 점점 느려지는 운동
:: 수평 방향으로 작용하는 힘이 없어(공기 저항 무시) 등속 운동한다.

= 생활 속 포물선 운동 | 사례
* 🏀 농구 슛 :: 높은 포물선이 림에 들어갈 확률을 높인다
* ⚽ 축구 골킥 :: 각도와 속력의 조합
* 🏌️ 골프 :: 공의 회전과 공기 저항으로 이상적인 포물선과 다르다
* 🚒 소방 호스 :: 물줄기 각도로 거리를 조절
* 🎆 불꽃놀이 :: 불꽃 조각마다 포물선
* 🦘 멀리뛰기 :: 실제 최적 도약 각도는 45°보다 작다

= 서술형 도전 | 생각 넓히기
? 처음 속력 20 m/s, 30°로 던진 공의 체공 시간과 최고점에서의 속력을 구하시오. (g = 9.8 m/s²) :: T = 2 × 20 × 0.5 ÷ 9.8 ≈ 2.04 s, 최고점 속력 = 20 × cos30° ≈ 17.3 m/s
? 실제 야구공이나 포탄은 45°보다 낮은 각도에서 가장 멀리 날아가는 경우가 많은 까닭을 추론하시오. :: 공기 저항 때문에 높이 오래 날수록 잃는 에너지가 커지므로 체공 시간이 짧은 낮은 각도가 유리하다. 또 발사 높이가 지면보다 높으면 최적 각도가 45°보다 작아진다.

% 4단계는 같은 속력에서 두 각도가 같은 거리를 가는 것을 확인하는 문제

= 오늘 배운 내용 정리
- 수평 방향: [[등속 운동]], vₓ = v₀cosθ
- 연직 방향: 가속도 g인 [[등가속도 운동]], v_y = v₀sinθ − gt
- 체공 시간 T = [[2v₀sinθ/g]], 도달 거리 R = [[v₀²sin2θ/g]]
- 도달 거리는 θ = [[45°]]에서 최대, 여각끼리 [[같다]].
- 최고점 속력 = [[v₀cosθ]]

= 나가기 전 한 문제 | 형성평가
? 처음 속력 30 m/s, 45°로 던진 공의 수평 도달 거리와 최고 높이를 구하시오. (g = 10 m/s²) :: R = 900 × sin90° ÷ 10 = 90 m, H = 900 × (sin45°)² ÷ 20 = 900 × 0.5 ÷ 20 = 22.5 m
