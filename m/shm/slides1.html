# 용수철 진자의 단진동 | 복원력과 주기 | 고등학교 역학과 에너지 · 03 단진동 · 1차시 | 2022 개정 교육과정 [역학과 에너지 Ⅰ]

= 오늘의 학습 목표 | 1차시
^ **복원력** F = −kx를 받는 운동을 **단진동**으로 설명할 수 있다.
^ 용수철 진자의 **주기** T = 2π√(m/k)를 구할 수 있다.
^ 단진동에서 위치에 따른 **속력·가속도·에너지** 변화를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 복원력·단진동 10분 → 질량과 주기(시뮬레이션) 12분 → 에너지 8분 → 계산·문항 10분

= 흔들림은 왜 반복될까? | 생각 열기
* 🚗 자동차 서스펜션 :: 과속 방지턱을 넘으면 위아래로 출렁
* 🏢 초고층 빌딩 :: 꼭대기의 거대한 추가 흔들림을 줄인다
* 🛏️ 스프링 매트리스 :: 눌렀다 놓으면 되돌아온다
* ⌚ 기계식 시계 :: 태엽과 용수철이 일정한 박자를 만든다
? 용수철에 매단 추를 당겼다 놓으면 왜 한 번 지나쳤다가 다시 돌아올까? :: 용수철이 항상 **평형점 쪽으로** 당기거나 밀고(복원력), 평형점에서는 속력이 최대라 **관성**으로 지나치기 때문이다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 탄성력 | 늘어난 길이에 비례 F = kx (훅 법칙) |
| 탄성 퍼텐셜 에너지 | ½kx² |
| 등속 원운동 | ω = 2π/T, a = rω² (1단원) |
? 용수철 상수가 40 N/m인 용수철을 0.2 m 늘이는 데 필요한 힘은? :: F = 40 × 0.2 = **8 N**

## 단진동 | 복원력이 만드는 왕복 운동

= 복원력과 단진동
! F = −kx
- 변위에 **비례**하고 변위와 ==반대 방향==인 힘 → 복원력
- 복원력을 받는 왕복 운동 → **단진동**
- 변위 x = A cos ωt, 가속도 a = [[−ω²x]]
>+ 가속도는 항상 **평형점**을 향한다.

= 위치에 따른 물리량
| 위치 | 변위 | 속력 | 가속도 크기 | 복원력 |
|+ 평형점 | 0 | [[최대 Aω]] | 0 | 0 |
|+ 양 끝 | ±A | 0 | [[최대 Aω²]] | 최대 kA |
! 주기 T = 2π√(m/k)
~ 주기는 진폭과 ==무관==하다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#spring | 용수철 상수 40 N/m에서 질량을 바꾸며 주기를 기록하자. 진폭을 바꿔도 주기가 같은지 확인하자.
% 진폭 변화 → 주기 그대로를 먼저 보여 주고, 질량 변화로 넘어가기

= 질량과 주기 | 시뮬레이션 기록 (k = 40 N/m)
| 질량 (kg) | 0.25 | 0.5 | 1 | 2 |
|+ 주기 (s) | 0.50 | [[0.70]] | [[0.99]] | [[1.40]] |
||
C 질량에 따른 주기 (k = 40 N/m) | 질량 (kg) | 주기 (s) | 주기:0.25,0.5 0.5,0.7 1,0.99 1.5,1.22 2,1.4
- 질량 4배 → 주기 [[2]]배 (T ∝ √m)

= 변위–시간 그래프 | m = 1 kg, A = 0.2 m
C 단진동의 변위 (T ≈ 0.99 s) | 시간 (s) | 변위 (m) | 변위:0,0.2 0.125,0.141 0.25,0 0.375,-0.144 0.5,-0.2 0.625,-0.138 0.75,0.006 0.875,0.147 1,0.2
- 그래프 기울기 = 속도 → 변위 0에서 기울기가 가장 ==가파르다== (속력 최대)

## 단진동의 에너지 | 역학적 에너지 보존

= 역학적 에너지 보존
! ½mv² + ½kx² = ½kA²
- 양 끝: 운동 에너지 [[0]], 탄성 퍼텐셜 에너지 최대
- 평형점: 탄성 퍼텐셜 에너지 0, 운동 에너지 [[최대]]
>+ k = 40 N/m, A = 0.2 m → 역학적 에너지 = ½ × 40 × 0.2² = **0.8 J**

= 위치에 따른 에너지 | 그래프
C 위치에 따른 에너지 (k = 40 N/m, A = 0.2 m) | 변위 (m) | 에너지 (J) | 퍼텐셜:-0.2,0.8 -0.15,0.45 -0.1,0.2 -0.05,0.05 0,0 0.05,0.05 0.1,0.2 0.15,0.45 0.2,0.8 | 운동:-0.2,0 -0.15,0.35 -0.1,0.6 -0.05,0.75 0,0.8 0.05,0.75 0.1,0.6 0.15,0.35 0.2,0
~ 두 에너지의 합은 어디서나 0.8 J

= 예제 1 · 최대 속력과 최대 가속도 | 적용
- k = 100 N/m, m = 1 kg, 진폭 0.1 m
^+ ω = √(k/m) = √100 = **10 rad/s**
^+ 최대 속력 = Aω = 0.1 × 10 = **1 m/s**
^+ 최대 가속도 = Aω² = 0.1 × 100 = **10 m/s²**

= 예제 2 · 중간 위치의 운동 에너지 | 적용
- 예제 1의 물체가 x = 0.06 m를 지날 때
^+ 역학적 에너지 = ½ × 100 × 0.1² = **0.5 J**
^+ 탄성 퍼텐셜 에너지 = ½ × 100 × 0.06² = **0.18 J**
^+ 운동 에너지 = 0.5 − 0.18 = **0.32 J** → 속력 = √(2 × 0.32 ÷ 1) = **0.8 m/s**

= 예제 3 · 주기 구하기 | 적용
- k = 40 N/m 용수철에 0.5 kg 물체를 달았다. (π ≈ 3.14)
^+ T = 2π√(0.5 ÷ 40) = 2π × 0.112 ≈ **0.70 s**
^+ 질량을 2 kg(4배)으로 바꾸면 → T ≈ **1.40 s** (2배)
^+ 같은 용수철을 연직으로 매달아도 주기는 **같다** (평형점만 아래로 이동)

= 확인 문제 1
Q 단진동하는 물체의 가속도가 0인 곳은?
o 양 끝
o* 평형점
o 진폭의 절반인 곳
o 어디에도 없다
:: a = −ω²x → x = 0인 평형점에서 0

= 확인 문제 2
Q 용수철 진자의 진폭을 2배로 하면 주기는?
o 2배
o √2배
o* 변하지 않는다
o 1/2배
:: T = 2π√(m/k) — 진폭과 무관

= 확인 문제 3
Q 용수철 상수를 4배로 하면 주기는?
o 4배
o 2배
o* 1/2배
o 1/4배
:: T ∝ 1/√k

= 확인 문제 4
Q k = 200 N/m, 진폭 0.1 m인 용수철 진자의 역학적 에너지는?
o 0.5 J
o* 1 J
o 2 J
o 10 J
:: ½ × 200 × 0.01 = 1 J

= 확인 문제 5
Q 단진동하는 물체의 속력이 최대인 곳에서 옳은 것은?
o 복원력이 최대이다
o 탄성 퍼텐셜 에너지가 최대이다
o* 가속도가 0이다
o 변위가 최대이다
:: 평형점에서 변위·복원력·가속도·탄성 퍼텐셜 에너지가 모두 0이다.

= 생활 속 단진동 | 사례
* 🚗 서스펜션 :: 용수철과 감쇠기로 진동을 빨리 멈춘다
* 🏢 동조 질량 감쇠기 :: 빌딩 꼭대기의 추가 흔들림을 흡수
* ⌚ 기계식 시계 :: 밸런스 휠의 일정한 진동 주기
* 🎸 기타 줄 :: 줄의 진동이 소리를 만든다
* 🔬 수정 진동자 :: 전자시계의 정확한 박자
* ⚖️ 우주 체중계 :: 진동 주기로 무중력 상태의 질량을 잰다

= 서술형 도전 | 생각 넓히기
? 우주 정거장에서는 저울로 몸무게를 잴 수 없다. 용수철 진자를 이용해 우주인의 질량을 재는 방법을 설명하시오. :: 용수철 상수 k인 용수철에 우주인이 매달려 진동한 주기 T를 재면 T = 2π√(m/k)에서 m = kT²/4π²으로 질량을 구할 수 있다. 주기는 중력과 무관하다.
? 고층 건물의 동조 질량 감쇠기가 흔들림을 줄이는 원리를 추론하시오. :: 추의 고유 진동 주기를 건물의 흔들림 주기에 맞춰 두면, 건물이 흔들릴 때 추가 반대 방향으로 움직이며 건물의 진동 에너지를 흡수해 흔들림을 줄인다.

= 오늘 배운 내용 정리
- 복원력 F = [[−kx]] → 단진동
- 가속도 a = [[−ω²x]], 항상 평형점을 향함
- 주기 T = [[2π√(m/k)]], 진폭과 [[무관]]
- 속력 최대: [[평형점]], 가속도 최대: [[양 끝]]
- 역학적 에너지 [[½kA²]] 일정

= 나가기 전 한 문제 | 형성평가
? k = 40 N/m, m = 1 kg, 진폭 0.2 m인 용수철 진자의 역학적 에너지와 최대 속력을 구하시오. :: E = ½ × 40 × 0.04 = 0.8 J, ½ × 1 × v² = 0.8 → v = √1.6 ≈ 1.26 m/s
