# 단진자의 주기 | 진자의 등시성 | 고등학교 역학과 에너지 · 03 단진동 · 2차시 | 2022 개정 교육과정 [역학과 에너지 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ 단진자의 **복원력**이 중력의 접선 성분임을 설명할 수 있다.
^ 단진자의 주기 T = 2π√(L/g)를 이용해 주기와 줄 길이를 구할 수 있다.
^ 진자의 주기를 측정해 **중력 가속도**를 구하는 방법을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 복원력·주기 10분 → 길이·장소·진폭(시뮬레이션) 12분 → 목표 주기 도전 8분 → 계산·문항 10분

= 그네의 박자는 무엇이 정할까? | 생각 열기
* 🎡 그네 :: 무거운 친구가 타면 더 느리게 흔들릴까?
* 🕰️ 괘종시계 :: 진자가 한 번 왔다 갔다 하는 박자로 시간을 잰다
* ⛪ 갈릴레이 :: 성당 샹들리에의 흔들림을 맥박으로 쟀다
* 🌙 달 기지 :: 지구의 진자시계를 가져가면?
? 그네에 무거운 사람이 타면 주기가 길어질까? :: 아니다. 단진자의 주기는 추의 **질량과 무관**하고, 줄의 **길이**와 **중력 가속도**로만 정해진다.

= 지난 시간 복습 | 1차시
- 단진동의 복원력 F = [[−kx]]
- 용수철 진자 주기 T = [[2π√(m/k)]]
- 주기는 진폭과 [[무관]]
? 용수철 진자의 질량을 4배로 하면 주기는? :: √4 = **2배**

## 단진자 | 중력이 복원력이 된다

= 단진자의 복원력
! 복원력 = mg sinθ
- 중력의 **접선 성분**이 추를 평형점 쪽으로 되돌린다.
- 진폭이 작으면 sinθ ≈ θ ≈ x/L → F ≈ −(mg/L)x
>+ 용수철 진자의 k 대신 **mg/L**인 단진동!

= 단진자의 주기
! T = 2π√(L/g)
| 바꾸는 것 | 주기 |
|+ 줄의 길이 4배 | [[2배]] |
|+ 중력 가속도 1/4배 | [[2배]] |
|+ 추의 질량 2배 | [[변화 없음]] |
|+ 작은 진폭 변화 | [[변화 없음]] (등시성) |
~ 주기를 재면 g = 4π²L/T² 로 중력 가속도를 구할 수 있다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#pend | 줄 길이와 장소를 바꾸며 주기를 기록하자. [목표 주기 도전]으로 원하는 주기의 진자를 만들어 보자.
% 목표 주기 도전: 먼저 L = g(T/2π)²으로 계산 → 맞추고 → 확인

= 줄 길이와 주기 | 시뮬레이션 기록
| 줄 길이 (m) | 0.25 | 0.5 | 1 | 2 |
|+ 지구 (s) | 1.00 | 1.42 | [[2.01]] | [[2.84]] |
|+ 달 (s) | 2.47 | 3.49 | [[4.94]] | [[6.98]] |
||
C 줄 길이에 따른 주기 | 줄 길이 (m) | 주기 (s) | 지구:0.25,1 0.5,1.42 1,2.01 1.5,2.46 2,2.84 | 달:0.25,2.47 0.5,3.49 1,4.94 1.5,6.05 2,6.98
- 달(g = 1.62 m/s²)에서는 주기가 약 [[2.5]]배 길다.

= 진폭과 주기 | 등시성의 한계
| 진폭 (L = 1 m, 지구) | 10° | 30° | 60° |
|+ 측정 주기 (s) | 2.011 | [[2.042]] | [[2.154]] |
- 공식값 2.007 s와 비교: 진폭이 작을 때는 거의 같다.
- 진폭이 커지면 sinθ < θ → 복원력이 공식보다 ==작아== 주기가 길어진다.
>+ 등시성은 **진폭이 작을 때**만 성립한다.

= 예제 1 · 초진자 만들기 | 적용
- 지구에서 주기가 정확히 2 s인 진자의 줄 길이는? (g = 9.8 m/s², π² ≈ 9.87)
^+ L = g(T/2π)² = 9.8 × (2 ÷ 2π)²
^+ = 9.8 × 1 ÷ 9.87 ≈ **0.99 m**

= 예제 2 · 행성의 중력 가속도 | 적용
- 길이 1 m인 진자가 10회 왕복하는 데 25초 걸리는 행성이 있다.
^+ 주기 T = 25 ÷ 10 = **2.5 s**
^+ g = 4π²L ÷ T² = 39.5 × 1 ÷ 6.25 ≈ **6.3 m/s²**
>+ 한 번만 재지 않고 10회를 재서 나누면 측정 오차가 줄어든다.

= 예제 3 · 화성의 진자 | 적용
- 길이 1 m 진자를 화성(g = 3.71 m/s²)으로 가져가면?
^+ T = 2π√(1 ÷ 3.71) = 2π × 0.519 ≈ **3.26 s**
^+ 지구(2.01 s)에서와 같은 주기로 맞추려면 L = 3.71 × (2.01 ÷ 2π)² ≈ **0.38 m**로 짧게

= 확인 문제 1
Q 단진자의 주기에 영향을 주는 것은?
o 추의 질량
o 작은 진폭
o* 줄의 길이
o 추의 색
:: T = 2π√(L/g) — 길이와 중력 가속도만 관계

= 확인 문제 2
Q 줄 길이를 9배로 하면 주기는?
o 9배
o* 3배
o 1/3배
o 81배
:: T ∝ √L → √9 = 3

= 확인 문제 3
Q 지구에서 주기 2 s인 진자를 달로 가져가면 주기는? (달의 g는 지구의 약 1/6)
o 약 1/6배로 짧아진다
o 그대로이다
o* 약 √6배로 길어진다
o 약 6배로 길어진다
:: T ∝ 1/√g → √6 ≈ 2.45배 → 약 4.9 s

= 확인 문제 4
Q 단진자에서 복원력의 역할을 하는 힘은?
o 줄의 장력
o* 중력의 접선 성분
o 공기 저항
o 원심력
:: mg sinθ가 추를 평형점 쪽으로 되돌린다.

= 확인 문제 5
Q 진폭이 60°로 클 때 측정한 주기가 공식값보다 긴 까닭은?
o 추의 질량이 커서
o* sinθ가 θ보다 작아 복원력이 공식보다 작아서
o 줄이 늘어나서
o 중력 가속도가 커져서
:: 큰 각에서는 sinθ ≈ θ 근사가 맞지 않는다.

= 생활 속 단진자 | 사례
* 🕰️ 진자시계 :: 일정한 주기로 시간을 잰다
* 🌍 푸코 진자 :: 진동면이 돌아가는 것으로 지구 자전을 증명
* 🎵 메트로놈 :: 추의 위치로 박자를 조절
* ⛏️ 중력 탐사 :: 정밀한 g 측정으로 지하 자원 탐사
* 🎡 그네·바이킹 :: 주기에 맞춰 밀면 크게 흔들린다 (공명)
* 🏗️ 크레인 :: 매단 짐의 흔들림 주기를 고려해 운전

= 서술형 도전 | 생각 넓히기
? 진자시계를 높은 산 위로 가져가면 시계가 빨라질까, 느려질까? 까닭과 바로잡는 방법을 쓰시오. :: 산 위는 지구 중심에서 멀어 g가 작으므로 주기가 길어져 시계가 느려진다. 진자의 길이를 조금 짧게 조정하면 원래 주기로 맞출 수 있다.
? 진자를 이용해 학교에서 중력 가속도를 측정하는 실험 방법을 설계하시오. :: 줄 길이 L을 재고, 작은 진폭(10° 이하)으로 진동시켜 10회 왕복 시간을 재어 주기 T를 구한다. 길이를 바꿔 여러 번 측정하고 g = 4π²L/T²으로 계산해 평균을 낸다.

= 오늘 배운 내용 정리
- 단진자의 복원력: 중력의 접선 성분 [[mg sinθ]]
- 주기 T = [[2π√(L/g)]]
- 주기는 추의 [[질량]]과 작은 진폭에 무관 → [[등시성]]
- 줄 길이 4배 → 주기 [[2]]배
- 중력 가속도 측정: g = [[4π²L/T²]]

= 나가기 전 한 문제 | 형성평가
? 줄 길이 0.25 m인 진자의 지구에서의 주기를 구하고, 주기를 2배로 하려면 줄 길이를 얼마로 해야 하는지 쓰시오. (g = 9.8 m/s²) :: T = 2π√(0.25 ÷ 9.8) ≈ 1.00 s, 주기 2배 → 길이 4배 = 1 m
