# 탄성파의 진행, 투과와 반사 | 몸속을 들여다보는 소리 | 고등학교 역학과 에너지 · 05 탄성파와 소리 · 1차시 | 2022 개정 교육과정 [12역학03-02]

= 오늘의 학습 목표 | 1차시
^ 탄성파의 진행을 **파장, 진동수, 진행 속력**으로 기술할 수 있다.
^ **종파**와 **횡파**를 매질의 진동 방향으로 구별할 수 있다.
^ 탄성파가 매질의 경계에서 **투과·반사**되고 반사할 때 **위상**이 변할 수 있음을 설명하고, 초음파 영상·비파괴 검사 등 활용 예를 찾을 수 있다.
% 흐름: 생각 열기 5분 → 탄성파와 진행 속력 10분 → 종파·횡파(용수철 탐구) 10분 → 투과·반사와 위상 10분 → 활용 10분
% 2022 개정 [12역학03-02] 해설: 탄성파의 진행을 파장, 진동수, 진행 속력으로 기술한다. 경계면에서 투과·반사할 때 위상 변화를 다루고, 초음파 영상, 비파괴 검사 등을 활용 예로 든다. 적용 시 고려 사항: 파동 방정식은 도입하지 않는다. 단진동(용수철 진자) 다음 차시로 운영한다.

= 엄마 배 속 아기를 어떻게 볼까? | 생각 열기
* 🤰 초음파 검사 :: 배 위에 기기를 대면 화면에 아기 모습이 나타난다
* 🐬 돌고래 :: 소리를 내고 되돌아오는 소리로 먹이를 찾는다
* 🔧 비파괴 검사 :: 철도 바퀴 속 금이 간 곳을 자르지 않고 찾는다
* 🌏 지진파 :: 지구 반대편 관측소에도 도착한다
? 초음파는 어떻게 몸속의 모습을 보여 줄까? :: 초음파가 몸속 조직의 **경계에서 반사**되어 돌아오는 시간과 세기로 경계의 위치를 알아낸다.

= 이전에 배운 내용 떠올리기 | 복습 · 단진동
- 용수철 진자는 복원력 F = −kx로 [[단진동]]한다.
- 파동: 한 곳의 진동이 매질을 따라 [[에너지]]를 전달하는 현상
- 진동수가 클수록 높은 소리, 진폭이 클수록 [[큰]] 소리 (중2)
? 매질의 입자들이 용수철로 이어져 있다고 생각하면 파동은 어떻게 전달될까? :: 한 입자의 진동이 탄성력으로 이웃 입자를 차례로 진동시키며 전달된다 → **탄성파**

## 탄성파의 진행 | 파장, 진동수, 속력

= 탄성파
! 탄성파: 매질의 탄성(복원력)에 의해 진동이 전달되는 파동 — 소리, 지진파, 초음파
- **파장 λ**: 이웃한 마루와 마루 사이 거리
- **진동수 f**: 1초 동안 진동하는 횟수 (Hz), 주기 T = 1/f
- **진행 속력** v = fλ = λ/T
>+ 진행 속력은 **매질**(탄성과 밀도)에 따라 정해진다 — 소리는 공기보다 물, 물보다 고체에서 빠르다.

= 종파와 횡파 | 용수철로 탐구하기
| 구분 | 종파 | 횡파 |
|+ 진동 방향 | 진행 방향과 [[나란함]] | 진행 방향과 [[수직]] |
|+ 모양 | 빽빽한 곳과 성긴 곳(소밀파) | 마루와 골 |
|+ 예 | 소리(음파), 지진의 P파 | 줄의 파동, 지진의 S파 |
|+ 전달 매질 | 고체·액체·기체 | 주로 고체 |
% 탐구 활동: 파동 용수철을 바닥에 늘어놓고 앞뒤로 밀어 종파, 옆으로 흔들어 횡파를 만들고, 일정 거리를 가는 시간을 재어 진행 속력을 구한다. 용수철을 더 팽팽하게 당기면 속력이 어떻게 변하는지도 비교한다.

= 예제 1 · 초음파의 파장 | 적용
- 몸속 조직에서 초음파의 속력이 약 1500 m/s이고 진동수가 3 MHz이다.
^+ λ = v ÷ f = 1500 ÷ (3 × 10⁶) = **5 × 10⁻⁴ m = 0.5 mm**
^+ 파장이 짧을수록 작은 구조를 구별하기 좋다.
>+ 사람이 들을 수 있는 소리(약 20 Hz~20 kHz)보다 진동수가 높은 소리 → **초음파**

## 투과와 반사 | 경계에서 일어나는 일

= 경계에서의 투과와 반사
- 탄성파가 성질이 다른 매질의 경계를 만나면 일부는 **반사**, 일부는 **투과**한다.
- 두 매질의 성질 차이가 클수록 **반사**가 많다 (예: 공기–피부 경계).
- 투과할 때 진동수는 그대로, 속력과 파장이 **변한다.**
>+ 초음파 검사 때 젤을 바르는 까닭: 피부와 기기 사이 공기층을 없애 초음파가 몸속으로 잘 **투과**하게 하려고

= 반사할 때의 위상 변화 | 줄로 확인하기
| 끝의 상태 | 반사파 | 위상 |
|+ 고정된 끝 (벽에 묶음) | 마루가 [[골]]로 뒤집혀 돌아옴 | 반대로 바뀜 (180°) |
|+ 자유로운 끝 (고리가 막대를 따라 움직임) | 마루가 [[마루]]로 돌아옴 | 그대로 |
- 가벼운 줄 → 무거운 줄로 갈 때: 반사파의 위상이 **반대**로 바뀐다 (고정단에 가까움)
- 무거운 줄 → 가벼운 줄로 갈 때: 반사파의 위상이 **그대로** (자유단에 가까움)

= 예제 2 · 초음파로 깊이 재기 | 적용
- 초음파를 보낸 뒤 0.0001 s 만에 몸속 경계에서 반사된 신호가 돌아왔다. (속력 1500 m/s)
^+ 왕복 거리 = 1500 × 0.0001 = **0.15 m**
^+ 경계까지 깊이 = 0.15 ÷ 2 = **7.5 cm**
>+ 여러 방향으로 보내고 받은 신호를 모으면 몸속 **영상**이 된다.

= 탄성파의 활용 | 사례
* 🏥 초음파 영상 :: 조직 경계의 반사로 장기·태아 관찰
* 🔩 비파괴 검사 :: 금속 내부 균열에서 반사되는 신호로 결함 발견
* 🚢 수중 음파 탐지기(소나) :: 바다의 깊이, 어군 탐지
* 🌏 지진파 탐사 :: 땅속 층의 경계에서 반사·굴절된 파로 지하 구조 조사
* 💎 초음파 세척기 :: 진동으로 작은 틈의 때를 떼어 낸다

= 확인 문제 1
Q 진동수 500 Hz인 음파의 파장이 0.68 m일 때 진행 속력은?
o 34 m/s
o* 340 m/s
o 735 m/s
o 3400 m/s
:: v = fλ = 500 × 0.68 = 340 m/s

= 확인 문제 2
Q 끝이 벽에 고정된 줄에 마루 모양의 펄스를 보냈을 때 반사파의 모양은?
o 마루 그대로 돌아온다
o* 골 모양으로 뒤집혀 돌아온다
o 반사되지 않는다
o 진동수가 2배가 된다
:: 고정단에서 반사하면 위상이 반대로 바뀐다.

= 확인 문제 3
Q 초음파 검사 때 피부에 젤을 바르는 까닭은?
o 초음파의 진동수를 높이려고
o* 공기층을 없애 초음파가 몸속으로 잘 투과하게 하려고
o 초음파를 모두 반사시키려고
o 피부를 차갑게 하려고
:: 공기와 피부는 성질 차이가 커서 대부분 반사되므로 공기층을 없앤다.

= 서술형 도전 | 생각 넓히기
? 기차가 오는지 확인하려고 레일에 귀를 대는 것이 공기 중 소리를 듣는 것보다 빨리 알 수 있는 까닭을 쓰시오. :: 탄성파의 진행 속력은 매질에 따라 다르며, 고체인 레일에서 공기보다 훨씬 빠르게 전달되기 때문이다.
? 비파괴 검사로 금속 속 균열을 찾을 수 있는 원리를 투과와 반사로 설명하시오. :: 금속 속을 지나던 초음파가 균열(금속–공기 경계)을 만나면 많이 반사되어 돌아오므로, 돌아온 시간으로 균열의 위치와 크기를 알 수 있다.

= 오늘 배운 내용 정리
- 탄성파: 매질의 탄성으로 전달, v = [[fλ]], 속력은 매질에 따라 다름
- 종파: 진동 방향이 진행 방향과 [[나란함]] / 횡파: 수직
- 경계에서 일부 반사·일부 투과, 성질 차이가 클수록 반사가 많다
- 고정단 반사는 위상이 [[반대]], 자유단 반사는 위상이 그대로
- 활용: 초음파 영상, 비파괴 검사, 소나, 지진파 탐사

= 나가기 전 한 문제 | 형성평가
? 바다에서 소나로 보낸 음파가 2초 뒤에 바닥에서 반사되어 돌아왔다. 물속 음파의 속력이 1500 m/s일 때 바다의 깊이를 구하시오. :: 왕복 거리 1500 × 2 = 3000 m → 깊이 1500 m
