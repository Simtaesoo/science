# 음파의 간섭과 소음 제어 | 소리로 소리를 지운다 | 고등학교 역학과 에너지 · 05 탄성파와 소리 · 3차시 | 2022 개정 교육과정 [12역학03-04]

= 오늘의 학습 목표 | 3차시
^ 둘 이상의 파동이 만나 **중첩**되는 원리를 설명할 수 있다.
^ **보강 간섭**과 **상쇄 간섭**이 일어나는 조건을 경로차로 설명할 수 있다.
^ 음향 장치와 실내외 공간의 **소음 제어**에 간섭이 활용되는 사례를 조사할 수 있다.
% 흐름: 생각 열기 5분 → 중첩 원리 8분 → 보강·상쇄 간섭 12분 → 노이즈 캔슬링·소음 제어 12분 → 조사 활동 안내 8분
% 2022 개정 [12역학03-04] 해설: 둘 이상의 파원에서 만들어지는 파동은 중첩될 수 있으며, 중첩이 일정한 형태로 지속될 때 간섭이 일어남을 알고, 소음 제거·소리의 증폭 등 다양한 활용을 알게 한다. 도플러 효과 다음, 정상파 앞에 운영한다.

= 시끄러운 비행기 안에서도 조용한 헤드폰 | 생각 열기
* 🎧 노이즈 캔슬링 헤드폰 :: 엔진 소리가 거의 들리지 않는다
* 🔊 강당의 두 스피커 :: 자리를 옮기면 소리가 커졌다 작아졌다 한다
* 🚗 자동차 머플러 :: 배기 소음을 줄이는 통로가 있다
* 🛣️ 방음벽 :: 고속 도로 옆에 세워진 벽
? 소리에 소리를 더했는데 어떻게 더 조용해질 수 있을까? :: 반대 위상의 소리를 겹치면 두 파동이 서로 **상쇄**되어 진폭이 작아진다.

= 지난 시간 복습 | 1·2차시
- 파동의 진행 속력 v = [[fλ]]
- 고정단에서 반사하면 위상이 [[반대]]로 바뀐다.
- 음원이 다가오면 관찰자가 듣는 진동수가 [[커진다]] (도플러 효과)
? 두 파동이 만나면 서로 부딪쳐 튕겨 나갈까? :: 아니다. 만나는 동안 변위가 더해지고, 지나간 뒤에는 각자 원래 모양으로 계속 진행한다.

## 중첩과 간섭 | 변위를 더한다

= 파동의 중첩 원리
! 두 파동이 만나는 곳의 변위 = 각 파동의 변위의 합
- 마루 + 마루 → 더 높은 마루 (진폭 증가)
- 마루 + 골 → 서로 줄어들거나 0 (진폭 감소)
- 만난 뒤 두 파동은 **처음 모양 그대로** 진행한다 (독립성)
>+ 두 파원에서 나온 파동이 일정하게 중첩되어 강한 곳과 약한 곳이 생기는 현상 → **간섭**

= 보강 간섭과 상쇄 간섭
| 구분 | 보강 간섭 | 상쇄 간섭 |
|+ 만나는 위상 | 같은 위상 (마루–마루) | 반대 위상 (마루–골) |
|+ 경로차 (같은 위상의 두 음원) | 0, λ, 2λ, … (반파장의 [[짝수]]배) | λ/2, 3λ/2, … (반파장의 [[홀수]]배) |
|+ 결과 | 소리가 크게 들림 | 소리가 작게 들림 |

= 예제 1 · 두 스피커 사이 | 적용
- 같은 위상으로 680 Hz 소리를 내는 두 스피커가 있다. (음속 340 m/s)
^+ 파장 λ = 340 ÷ 680 = **0.5 m**
^+ 두 스피커까지 거리 차가 0.25 m인 곳 → λ/2 → **상쇄 간섭** (작은 소리)
^+ 거리 차가 0.5 m인 곳 → λ → **보강 간섭** (큰 소리)
% 탐구: 두 스피커(같은 신호)를 1 m 떨어뜨려 놓고 앞을 천천히 걸으며 소리 크기가 바뀌는 위치를 찾는다. 스마트폰 소음 측정 앱으로 기록할 수 있다.

## 소음 제어 | 간섭을 이용한 기술

= 능동 소음 제어 | 노이즈 캔슬링
^+ 헤드폰 바깥 **마이크**가 주변 소음을 측정한다.
^+ 칩이 소음과 **반대 위상**의 소리를 실시간으로 만든다.
^+ 스피커가 이 소리를 내면 귀에서 소음과 **상쇄 간섭** → 소음이 줄어든다.
>+ 일정하게 반복되는 낮은 소리(엔진, 에어컨)일수록 잘 지워진다.

= 공간 속 소음 제어 | 사례
* 🚗 머플러 :: 배기가스 통로를 둘로 나누었다가 반파장만큼 길이 차이를 두고 합쳐 소음 상쇄
* 🏢 건물 환기 덕트 :: 반대 위상의 소리를 내는 능동 소음 제어 장치
* 🎵 콘서트홀 :: 벽과 천장 모양을 설계해 소리가 고르게 보강되도록 한다
* 🛣️ 방음벽 :: 반사·흡수와 함께 상단 구조물로 소리의 간섭을 이용해 소음을 줄인다
* 🎙️ 음향 장치 :: 마이크 여러 개의 신호를 합쳐 원하는 방향의 소리만 보강

= 예제 2 · 머플러 설계 | 적용
- 엔진에서 주로 나는 소음의 진동수가 170 Hz이다. (음속 340 m/s)
^+ 파장 = 340 ÷ 170 = **2 m**
^+ 두 통로의 길이 차를 반파장 **1 m**로 하면 다시 만날 때 반대 위상 → **상쇄**
>+ 실제 배기가스는 온도가 높아 음속이 더 빠르므로 설계할 때 이를 고려한다.

= 조사 활동 | 우리 주변의 소음 제어
^ 모둠별로 소음 문제 하나(교실 냉난방기, 도로 소음, 층간 소음 등)를 고른다.
^ 그 소음을 줄이는 방법을 반사·흡수·간섭 중 어떤 원리로 줄이는지 조사한다.
^ 간섭을 이용한 사례를 하나 이상 포함해 발표한다.

= 확인 문제 1
Q 같은 위상의 두 음원에서 거리 차가 반파장의 홀수 배인 지점에서 일어나는 현상은?
o 보강 간섭
o* 상쇄 간섭
o 도플러 효과
o 공명
:: 반대 위상으로 만나 진폭이 작아진다.

= 확인 문제 2
Q 노이즈 캔슬링 헤드폰의 원리로 옳은 것은?
o 두꺼운 소재로 소리를 모두 막는다
o* 소음과 반대 위상의 소리를 만들어 상쇄 간섭시킨다
o 소음과 같은 위상의 소리로 보강한다
o 소음의 진동수를 높인다
:: 능동 소음 제어는 상쇄 간섭을 이용한다.

= 확인 문제 3
Q 두 파동이 만나 중첩된 뒤 서로 지나가면 각 파동은?
o 사라진다
o 하나로 합쳐진다
o* 처음 모양 그대로 진행한다
o 반대 방향으로 튕겨 나간다
:: 파동은 중첩된 뒤에도 독립적으로 진행한다.

= 서술형 도전 | 생각 넓히기
? 노이즈 캔슬링 헤드폰이 갑자기 나는 사람의 말소리보다 비행기 엔진 소리를 더 잘 지우는 까닭을 쓰시오. :: 엔진 소리는 일정하게 반복되어 반대 위상의 소리를 미리 예측해 만들기 쉽지만, 말소리는 진동수와 세기가 빠르게 변해 정확한 반대 위상을 만들기 어렵기 때문이다.
? 강당의 두 스피커에서 같은 소리가 나올 때 자리에 따라 소리 크기가 다른 까닭을 쓰시오. :: 두 스피커까지의 거리 차에 따라 소리가 같은 위상으로 만나 보강 간섭하거나 반대 위상으로 만나 상쇄 간섭하기 때문이다.

= 오늘 배운 내용 정리
- 중첩 원리: 만나는 곳의 변위 = 각 변위의 [[합]], 지나간 뒤 독립적으로 진행
- 보강 간섭: 경로차가 반파장의 [[짝수]]배 / 상쇄 간섭: 반파장의 홀수배
- 능동 소음 제어: 소음과 [[반대 위상]]의 소리로 상쇄
- 활용: 노이즈 캔슬링, 머플러, 덕트 소음 제어, 음향 설계
