# 도플러 효과 | 다가오는 소리는 왜 높을까 | 고등학교 역학과 에너지 · 05 탄성파와 소리 · 1차시 | 2022 개정 교육과정 [역학과 에너지 Ⅲ]

= 오늘의 학습 목표 | 1차시
^ 음원이 움직일 때 **파면 간격**이 달라지는 까닭을 설명할 수 있다.
^ **도플러 효과** 식으로 관찰되는 진동수를 구할 수 있다.
^ 스피드건, 도플러 초음파, 적색 편이 등 **활용 예**를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 파면 간격 8분 → 음원 속력과 진동수(시뮬레이션, 소리 듣기) 12분 → 식·예제 10분 → 활용·문항 10분

= 구급차 소리가 바뀐다? | 생각 열기
* 🚑 구급차 사이렌 :: 다가올 때 높고, 지나가면 낮아진다
* 🏎️ 자동차 경주 :: "이이잉~ 우우웅" 하고 지나간다
* 🚄 KTX 경적 :: 지나가는 순간 음이 뚝 떨어진다
* 🛩️ 전투기 :: 음속을 넘으면 '쾅' 하는 소리
? 사이렌은 같은 소리를 내는데 왜 지나가는 순간 음이 낮아질까? :: 음원이 움직이면 앞쪽 파면은 촘촘해지고 뒤쪽 파면은 성글어져, 관찰자가 듣는 **진동수**가 달라지기 때문이다 — **도플러 효과**

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 파동의 속력 | v = fλ |
| 소리의 높낮이 | 진동수가 클수록 높은 소리 |
| 공기 중 음속 | 약 340 m/s (상온) |
? 음속 340 m/s에서 진동수 440 Hz인 소리의 파장은? :: λ = 340 ÷ 440 ≈ **0.77 m**

## 도플러 효과 | 파면의 간격이 달라진다

= 움직이는 음원과 파면
- 음원이 다가오는 쪽: 파면 간격이 ==좁아진다== → 파장 짧아짐 → 진동수 **높게**
- 음원이 멀어지는 쪽: 파면 간격이 ==넓어진다== → 파장 길어짐 → 진동수 **낮게**
>+ 음원 자체의 진동수는 변하지 **않는다** — 관찰되는 진동수만 달라진다.

= 도플러 효과의 식 | 관찰자 정지
! 다가올 때 f′ = f · v / (v − vₛ)
! 멀어질 때 f′ = f · v / (v + vₛ)
~ v: 음속, vₛ: 음원의 속력
- 음원이 음속보다 빠르면 파면이 겹쳐 [[충격파]](마하 원뿔)가 생긴다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#doppler | 음원 진동수 440 Hz에서 음원 속력을 바꾸며 앞·뒤 관찰자가 듣는 진동수를 기록하자. [지나가는 소리 듣기]도 해 보자.
% 소리 듣기는 스피커 음량을 미리 확인. 0 → 40 → 100 m/s 순서로 들려주기

= 음원 속력과 진동수 | 시뮬레이션 기록 (음속 340 m/s)
| 음원 속력 (m/s) | 0 | 20 | 40 | 100 |
|+ 앞 관찰자 (Hz) | 440 | 468 | [[499]] | [[623]] |
|+ 뒤 관찰자 (Hz) | 440 | 416 | [[394]] | [[340]] |
||
C 음원 속력에 따라 들리는 진동수 (440 Hz) | 음원 속력 (m/s) | 진동수 (Hz) | 앞:0,440 20,468 40,499 60,534 80,575 100,623 | 뒤:0,440 20,416 40,394 60,374 80,356 100,340
- 지나가는 순간 소리가 [[높음 → 낮음]]으로 바뀐다.

= 예제 1 · 다가오는 구급차 | 적용
- 680 Hz 사이렌을 울리는 구급차가 34 m/s로 다가온다. (음속 340 m/s)
^+ f′ = 680 × 340 ÷ (340 − 34)
^+ = 680 × 340 ÷ 306 ≈ **756 Hz**

= 예제 2 · 멀어지는 구급차 | 적용
- 같은 구급차가 34 m/s로 멀어진다.
^+ f′ = 680 × 340 ÷ (340 + 34) = 680 × 340 ÷ 374
^+ ≈ **618 Hz**
^+ 지나가는 순간 756 Hz → 618 Hz로 약 **138 Hz** 떨어진다.

= 예제 3 · 음원 속력 구하기 | 적용
- 440 Hz 음원이 다가올 때 정지한 관찰자에게 550 Hz로 들렸다. (음속 340 m/s)
^+ 550 = 440 × 340 ÷ (340 − vₛ)
^+ 340 − vₛ = 440 × 340 ÷ 550 = **272**
^+ vₛ = **68 m/s**

## 도플러 효과의 활용 | 소리에서 빛까지

= 도플러 효과의 활용
| 활용 | 원리 |
|+ 스피드건 | 움직이는 물체에서 반사된 전파의 [[진동수 변화]]로 속력 측정 |
|+ 도플러 초음파 | 혈류에서 반사된 초음파로 혈액의 흐름 측정 |
|+ 기상 레이더 | 빗방울의 움직임으로 바람의 방향·세기 파악 |
|+ 적색 편이 | 멀어지는 은하의 빛 파장이 [[길어짐]] → 우주 팽창 |

= 확인 문제 1
Q 음원이 관찰자에게 다가올 때 관찰자가 듣는 소리로 옳은 것은?
o 진동수가 낮아진다
o* 진동수가 높아진다
o 음속이 빨라진다
o 음원의 진동수가 커진다
:: 앞쪽 파장이 짧아져 관찰되는 진동수가 높아진다.

= 확인 문제 2
Q 도플러 효과에서 변하지 않는 것은?
o 관찰되는 진동수
o 관찰되는 파장
o* 음원 자체의 진동수
o 파면의 간격
:: 음원은 같은 진동수로 소리를 낸다.

= 확인 문제 3
Q 500 Hz 음원이 68 m/s로 멀어질 때 들리는 진동수는? (음속 340 m/s)
o 400 Hz
o* 약 417 Hz
o 600 Hz
o 625 Hz
:: 500 × 340 ÷ 408 ≈ 417 Hz

= 확인 문제 4
Q 별빛의 스펙트럼선이 긴 파장 쪽으로 치우쳐 관측되면?
o 별이 다가오고 있다
o* 별이 멀어지고 있다
o 별의 온도가 높다
o 별이 정지해 있다
:: 적색 편이 → 멀어지는 천체

= 확인 문제 5
Q 음원이 음속보다 빠르게 움직일 때 나타나는 현상은?
o 소리가 사라진다
o 진동수가 0이 된다
o* 파면이 겹쳐 충격파가 생긴다
o 음속이 빨라진다
:: 마하 원뿔 모양의 충격파 → 소닉 붐

= 생활 속 도플러 효과 | 사례
* 🚑 구급차 사이렌 :: 지나가는 순간 음이 낮아진다
* ⚾ 야구 스피드건 :: 공의 속력 측정
* 🚓 과속 단속 카메라 :: 레이더로 차량 속력 측정
* 🩺 도플러 초음파 :: 태아의 심장 박동, 혈류 측정
* 🌧️ 기상 레이더 :: 태풍의 회전과 비구름 이동
* 🌌 허블의 발견 :: 은하의 적색 편이 → 우주 팽창

= 서술형 도전 | 생각 넓히기
? 야구장 스피드건이 공의 속력을 재는 원리를 도플러 효과로 설명하시오. :: 다가오는 공에서 반사된 전파는 도플러 효과로 진동수가 높아지고, 공이 빠를수록 진동수 차이가 커진다. 이 차이를 측정해 공의 속력을 계산한다.
? 멀리 있는 은하의 스펙트럼선이 원래보다 긴 파장 쪽으로 치우쳐 관측되는 것이 뜻하는 바를 쓰시오. :: 빛에서도 도플러 효과가 일어나므로 은하가 우리에게서 멀어지고 있다는 뜻이며, 우주 팽창의 증거가 된다.

= 오늘 배운 내용 정리
- 음원이 다가오면 파장이 [[짧아져]] 진동수가 높게 들린다.
- 다가올 때 f′ = f · [[v/(v − vₛ)]], 멀어질 때 f′ = f · v/(v + vₛ)
- 음원 자체의 진동수는 [[변하지 않는다]].
- 음원이 음속보다 빠르면 [[충격파]]
- 활용: 스피드건, 도플러 초음파, [[적색 편이]]

= 나가기 전 한 문제 | 형성평가
? 340 Hz 음원이 40 m/s로 다가올 때와 멀어질 때 정지한 관찰자가 듣는 진동수를 각각 구하시오. (음속 340 m/s) :: 다가올 때 340 × 340 ÷ 300 ≈ 385 Hz, 멀어질 때 340 × 340 ÷ 380 ≈ 304 Hz
