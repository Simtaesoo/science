# 정상파와 공명 | 악기는 어떻게 소리를 낼까 | 고등학교 역학과 에너지 · 05 탄성파와 소리 · 2차시 | 2022 개정 교육과정 [역학과 에너지 Ⅲ]

= 오늘의 학습 목표 | 2차시
^ **정상파**가 생기는 원리와 마디·배를 설명할 수 있다.
^ 줄, 열린 관, 닫힌 관에서 생기는 정상파의 **파장과 진동수**를 구할 수 있다.
^ **공명** 현상을 설명하고 악기와 생활 속 예를 들 수 있다.
% 흐름: 생각 열기 5분 → 정상파 8분 → 줄과 관(시뮬레이션, 소리 듣기) 12분 → 식·예제 10분 → 공명·문항 10분

= 짧은 줄은 왜 높은 소리를 낼까? | 생각 열기
* 🎸 기타 :: 프렛을 눌러 줄을 짧게 하면 음이 높아진다
* 🎻 바이올린 :: 줄을 조이면 음이 높아진다
* 🪈 리코더 :: 구멍을 막을수록 음이 낮아진다
* 🍾 빈 병 :: 입으로 불면 '부웅' 소리, 물을 채우면 높아진다
? 기타 줄을 튕기면 줄 위의 파동은 어디로 갈까? :: 양끝에서 반사되어 반대 방향 파동과 겹치며 제자리에서 진동하는 **정상파**가 된다.

= 지난 시간 복습 | 1차시
- 파동의 속력 v = [[fλ]]
- 음원이 다가오면 진동수가 [[높게]] 들린다.
- 두 파동이 만나면 [[중첩]]된다 (물리학)
? 같은 매질에서 파장이 절반이 되면 진동수는? :: v = fλ에서 v가 일정 → **2배**

## 정상파 | 제자리에서 진동하는 파동

= 정상파
- 진폭·진동수가 같은 두 파동이 ==반대 방향==으로 진행하며 중첩
| 용어 | 뜻 |
|+ 마디 | 전혀 [[진동하지 않는]] 곳 |
|+ 배 | 가장 [[크게]] 진동하는 곳 |
|+ 이웃한 마디 사이 거리 | [[λ/2]] |
>+ 정상파는 에너지를 한쪽으로 전달하지 않는다.

= 줄과 관의 정상파
| 구분 | 양끝 | 파장 | 진동수 |
|+ 줄 (양끝 고정) | 마디·마디 | λₙ = 2L/n | fₙ = [[nv/2L]] |
|+ 열린 관 | 배·배 | λₙ = 2L/n | fₙ = nv/2L |
|+ 닫힌 관 | 마디·배 | λ = 4L/(2n − 1) | fₙ = [[(2n − 1)v/4L]] |
~ n = 1, 2, 3, … 닫힌 관은 [[홀수]]배 진동만 생긴다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#stand | 길이 0.65 m에서 줄·열린 관·닫힌 관의 기본 진동수와 다음 정상파의 진동수를 기록하고 소리를 들어 보자.
% 열린 관과 닫힌 관의 기본음을 연달아 들려주어 '한 옥타브 차이'를 귀로 확인

= 줄과 관 | 시뮬레이션 기록 (L = 0.65 m)
| 구분 | 파동 속력 | 기본 진동수 | 다음 정상파 |
|+ 줄 (양끝 고정) | 286 m/s | 220 Hz | [[440 Hz]] (2배) |
|+ 열린 관 | 340 m/s | [[262 Hz]] | 523 Hz (2배) |
|+ 닫힌 관 | 340 m/s | [[131 Hz]] | [[392 Hz]] (3배) |
- 같은 길이에서 닫힌 관의 기본음은 열린 관의 [[1/2]] (한 옥타브 낮다)

= 정상파의 진동수 | 그래프
C 정상파의 진동수 (L = 0.65 m) | 진동 모드 n (fₙ = n × f₁) | 진동수 (Hz) | 열린 관:1,262 2,523 3,785 4,1046 | 닫힌 관:1,131 3,392 5,654 7,915
||
- 열린 관: 기본 진동수의 1, 2, 3, 4배
- 닫힌 관: 기본 진동수의 1, 3, 5, 7배
- 관이 길수록 기본 진동수가 ==낮다== → 큰 악기일수록 낮은 음

= 예제 1 · 기타 줄 | 적용
- 길이 0.5 m인 기타 줄의 파동 속력이 200 m/s이다.
^+ 기본 진동: λ₁ = 2 × 0.5 = **1 m** → f₁ = 200 ÷ 1 = **200 Hz**
^+ 3배 진동: f₃ = 3 × 200 = **600 Hz**
^+ 줄을 절반 길이로 누르면 기본 진동수 **400 Hz** (한 옥타브 위)

= 예제 2 · 열린 관과 닫힌 관 | 적용
- 길이 0.85 m인 관, 음속 340 m/s
^+ 열린 관: f₁ = 340 ÷ (2 × 0.85) = **200 Hz**
^+ 닫힌 관: f₁ = 340 ÷ (4 × 0.85) = **100 Hz**
^+ 닫힌 관의 다음 정상파: 3 × 100 = **300 Hz**

## 공명 | 고유 진동수가 같을 때

= 공명
! 고유 진동수 = 외부 진동수 → 진폭이 커진다
- 모든 물체는 잘 진동하는 **고유 진동수**를 가진다.
- 같은 진동수로 진동을 받으면 에너지가 잘 전달되어 ==진폭이 커진다== → 공명
>+ 악기의 울림통은 공명으로 소리를 **크게** 만든다.

= 예제 3 · 시험관 공명 | 적용
- 425 Hz 소리굽쇠를 물이 담긴 시험관 위에 대고 물 높이를 바꾼다. (음속 340 m/s)
^+ 파장 λ = 340 ÷ 425 = **0.8 m**
^+ 닫힌 관 공명 조건: 공기 기둥 L = λ/4, 3λ/4, …
^+ 공기 기둥 길이 **20 cm**, **60 cm**에서 소리가 크게 울린다.

= 확인 문제 1
Q 정상파에서 이웃한 마디 사이의 거리는?
o λ/4
o* λ/2
o λ
o 2λ
:: 마디와 마디 사이는 반파장

= 확인 문제 2
Q 양끝이 고정된 줄의 길이를 절반으로 하면 기본 진동수는? (파동 속력 같음)
o 1/2배
o* 2배
o 4배
o 그대로
:: f₁ = v/2L → L이 1/2이면 2배

= 확인 문제 3
Q 한쪽 끝이 닫힌 관에서 생길 수 있는 진동수가 아닌 것은? (기본 진동수 100 Hz)
o 100 Hz
o* 200 Hz
o 300 Hz
o 500 Hz
:: 닫힌 관은 홀수배 진동만 생긴다.

= 확인 문제 4
Q 기타 줄을 팽팽하게 조이면 음이 높아지는 까닭은?
o 줄의 길이가 짧아져서
o* 줄의 파동 속력이 빨라져서
o 파장이 길어져서
o 공기의 음속이 빨라져서
:: 파장(2L)은 그대로, v가 커지므로 f = v/λ가 커진다.

= 확인 문제 5
Q 공명이 일어나는 조건은?
o 진폭이 같을 때
o* 외부 진동수가 물체의 고유 진동수와 같을 때
o 파장이 같을 때
o 매질이 같을 때
:: 고유 진동수와 같은 진동을 받으면 진폭이 커진다.

= 생활 속 정상파와 공명 | 사례
* 🎸 현악기 :: 줄의 정상파 + 울림통의 공명
* 🎺 관악기 :: 관 속 공기 기둥의 정상파
* 📻 라디오 :: 회로의 고유 진동수를 방송 주파수에 맞춘다
* 🍷 유리잔 깨기 :: 고유 진동수와 같은 소리로 공명
* 🌉 타코마 다리 :: 바람에 의한 진동으로 무너진 다리 (1940)
* 🩻 MRI :: 원자핵의 공명을 이용한 영상

= 서술형 도전 | 생각 넓히기
? 같은 길이의 열린 관과 닫힌 관의 기본 진동수를 비교하고 그 까닭을 쓰시오. :: 열린 관은 v/2L, 닫힌 관은 v/4L이다. 닫힌 관의 기본 진동 파장이 4L로 2배 길어 기본 진동수가 1/2배(한 옥타브 낮다)이다.
? 물이 담긴 시험관 위에 소리굽쇠를 대고 물의 높이를 바꾸면 특정 높이에서 소리가 크게 울리는 까닭을 쓰시오. :: 시험관 속 공기 기둥(닫힌 관)의 고유 진동수가 소리굽쇠의 진동수와 같아지는 길이에서 공명이 일어나기 때문이다.

= 오늘 배운 내용 정리
- 반대 방향 두 파동의 중첩 → [[정상파]], 마디 사이 [[λ/2]]
- 줄·열린 관: fₙ = [[nv/2L]]
- 닫힌 관: [[홀수]]배 진동만, f₁ = v/4L
- 고유 진동수와 같은 진동을 받아 진폭이 커짐 → [[공명]]

= 나가기 전 한 문제 | 형성평가
? 길이 0.68 m인 열린 관과 닫힌 관의 기본 진동수를 각각 구하시오. (음속 340 m/s) :: 열린 관 340 ÷ 1.36 = 250 Hz, 닫힌 관 340 ÷ 2.72 = 125 Hz
