# 열역학 과정과 순환 | P–V 그래프 읽기 | 고등학교 역학과 에너지 · 03 열과 에너지 · 3차시 | 2022 개정 교육과정 [12역학02-03] [12역학02-04]

= 오늘의 학습 목표 | 3차시
^ 열역학 과정을 **압력–부피(P–V) 그래프**로 나타낼 수 있다.
^ **열역학 제1법칙**으로 각 과정의 열, 내부 에너지 변화, 일을 구할 수 있다.
^ 순환 과정에서 **알짜 일**과 **열효율**을 구할 수 있다.
% 흐름: 생각 열기 5분 → 제1법칙·네 과정 10분 → 사각형 순환(시뮬레이션) 12분 → 열효율 8분 → 계산·문항 10분
% [교육과정 확인] [12역학02-04] 적용 시 고려 사항: 열기관 등에서의 열 현상의 정량적 계산은 지양한다. 순환 과정의 알짜 일·열효율 계산 예제는 이해를 돕는 수준에서만 쓰고, 열효율을 높이려는 노력과 환경 문제 토의에 비중을 둔다.

= 열로 바퀴를 굴리려면? | 생각 열기
* 🚂 증기 기관차 :: 석탄을 태운 열로 바퀴를 굴린다
* 🚗 자동차 엔진 :: 연료가 타며 피스톤을 민다
* ❄️ 냉장고 :: 안은 차갑게, 뒤쪽은 따뜻하게
* 🔥 화력 발전소 :: 연료 에너지의 일부만 전기가 된다
? 엔진은 왜 같은 동작을 계속 반복할까? :: 기체가 처음 상태로 되돌아오는 **순환 과정**을 반복해야 계속 일을 할 수 있기 때문이다.

= 지난 시간 복습 | 1차시
- PV = [[nRT]]
- 분자의 평균 운동 에너지 ∝ [[절대 온도]]
- 단원자 이상 기체의 내부 에너지 U = [[(3/2)nRT]] = (3/2)PV
? 부피가 일정한 기체를 가열하면 압력은? :: 온도가 오르면서 **커진다** (P ∝ T).

## 열역학 제1법칙 | 에너지 보존

= 열역학 제1법칙
! Q = ΔU + W
| 기호 | 뜻 | + 부호 |
|+ Q | 기체가 받은 열 | 열을 [[흡수]] |
|+ ΔU | 내부 에너지 변화 | 온도 [[상승]] |
|+ W | 기체가 외부에 한 일 | [[팽창]] |
>+ 기체가 한 일 W = **P–V 그래프 아래의 넓이**

= 네 가지 열역학 과정
| 과정 | 일정한 것 | 특징 |
|+ 등적 과정 | 부피 | W = [[0]] → Q = ΔU |
|+ 등압 과정 | 압력 | W = PΔV |
|+ 등온 과정 | 온도 | ΔU = [[0]] → Q = W |
|+ 단열 과정 | 열 출입 없음 | Q = 0 → W = [[−ΔU]] |
~ 단열 팽창하면 온도가 내려가고, 단열 압축하면 온도가 올라간다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#cycle | 낮은 압력 100 kPa, 높은 압력 300 kPa, 부피 1 L ↔ 3 L 사각형 순환에서 각 과정의 Q, ΔU, W를 기록하자.
% kPa × L = J임을 먼저 확인 (100 kPa × 1 L = 100 J)

## 순환 과정 | 처음 상태로 돌아온다

= 사각형 순환 | 시뮬레이션 기록
| 과정 | Q (J) | ΔU (J) | W (J) |
|+ A→B 등적 가열 | 300 | 300 | 0 |
|+ B→C 등압 팽창 | [[1500]] | 900 | [[600]] |
|+ C→D 등적 냉각 | −900 | [[−900]] | 0 |
|+ D→A 등압 압축 | [[−500]] | −300 | [[−200]] |
|+ 한 순환 합계 | 400 | [[0]] | 400 |

= P–V 그래프로 보면
C 사각형 순환 (A→B→C→D→A) | 부피 (L) | 압력 (kPa) | 순환:1,100 1,300 3,300 3,100 1,100
||
- 닫힌 사각형의 넓이 = (300 − 100) × (3 − 1) = **400 J** = 알짜 일
- 한 순환 동안 ΔU = [[0]] → 알짜 열 = 알짜 일
- ==시계 방향== 순환 → 열기관, 반대 방향 → 냉장고(열펌프)

= 열효율
! e = W / Q흡수 = 1 − Q방출 / Q흡수
- 사각형 순환: 흡수한 열 300 + 1500 = **1800 J**
- 방출한 열 900 + 500 = **1400 J**
- e = 400 ÷ 1800 ≈ [[22.2 %]]
>+ 열효율은 항상 **100 %보다 작다** (열역학 제2법칙).

= 예제 1 · B→C 등압 팽창 | 적용
- 300 kPa에서 부피 1 L → 3 L
^+ W = PΔV = 300 × 10³ × 2 × 10⁻³ = **600 J**
^+ ΔU = (3/2)Δ(PV) = 1.5 × (900 − 300) = **900 J**
^+ Q = ΔU + W = **1500 J**

= 예제 2 · 높은 압력을 400 kPa로 | 적용
- 같은 순환에서 높은 압력만 400 kPa로 바꾸면 (흡수한 열 2450 J)
^+ W = (400 − 100) × (3 − 1) = **600 J**
^+ e = 600 ÷ 2450 ≈ **24.5 %**
^+ 순환의 넓이가 커지면 알짜 일과 효율이 **커진다.**

= 예제 3 · 열기관 | 적용
- 한 순환 동안 열 1000 J을 흡수하고 700 J을 방출하는 열기관
^+ W = 1000 − 700 = **300 J**
^+ e = 300 ÷ 1000 = **30 %**

= 확인 문제 1
Q 등적 과정에서 기체가 외부에 한 일은?
o 흡수한 열과 같다
o* 0이다
o 내부 에너지 변화와 같다
o 항상 음수이다
:: 부피 변화가 없으므로 W = 0

= 확인 문제 2
Q 등온 팽창 과정에서 기체가 흡수한 열은 어디에 쓰이는가?
o 모두 내부 에너지 증가
o* 모두 외부에 하는 일
o 절반은 일, 절반은 내부 에너지
o 쓰이지 않는다
:: 온도 일정 → ΔU = 0 → Q = W

= 확인 문제 3
Q 순환 과정에서 한 순환 동안의 내부 에너지 변화는?
o 흡수한 열과 같다
o 알짜 일과 같다
o* 0이다
o 방출한 열과 같다
:: 처음 상태로 돌아오므로 온도가 같다.

= 확인 문제 4
Q 열 2000 J을 흡수하고 1500 J을 방출하는 열기관의 열효율은?
o 75 %
o* 25 %
o 50 %
o 33 %
:: W = 500 J, e = 500 ÷ 2000 = 25 %

= 확인 문제 5
Q 단열 압축 과정에서 일어나는 변화로 옳은 것은?
o 온도가 내려간다
o* 온도가 올라간다
o 열을 흡수한다
o 내부 에너지가 변하지 않는다
:: Q = 0, 외부에서 일을 받아 ΔU > 0 → 온도 상승

= 생활 속 열역학 | 사례
* 🚗 4행정 엔진 :: 흡입–압축–폭발–배기의 순환
* 🔥 디젤 엔진 :: 단열 압축으로 온도를 높여 점화
* ❄️ 냉장고·에어컨 :: 일을 받아 열을 저온 → 고온으로
* 🌡️ 히트 펌프 :: 바깥의 열을 실내로 옮겨 난방
* 🚴 자전거 펌프 :: 빠르게 누르면 펌프가 뜨거워진다 (단열 압축)
* ☁️ 구름 생성 :: 상승 공기의 단열 팽창 → 냉각

= 서술형 도전 | 생각 넓히기
? 등온 팽창 과정에서 기체가 흡수한 열이 모두 일로 쓰이는 까닭을 쓰시오. :: 온도가 일정하므로 이상 기체의 내부 에너지 변화가 0이다. 열역학 제1법칙 Q = ΔU + W에서 Q = W가 된다.
? 같은 사각형 순환을 시계 반대 방향(A→D→C→B→A)으로 돌리면 에너지 흐름은 어떻게 달라지는지 설명하시오. :: 각 과정의 Q, W 부호가 모두 반대가 되어 외부에서 기체에 알짜 일 400 J을 해 주고 기체는 그만큼 더 많은 열을 방출한다. 일을 받아 저온의 열을 고온 쪽으로 옮기는 냉장고(열펌프)처럼 작동한다.

= 오늘 배운 내용 정리
- 열역학 제1법칙: Q = [[ΔU + W]]
- 기체가 한 일 = P–V 그래프 아래의 [[넓이]], 등적 과정 W = 0
- 등온 과정 ΔU = [[0]], 단열 과정 Q = [[0]]
- 순환: ΔU = 0, 알짜 일 = 닫힌 곡선의 [[넓이]]
- 열효율 e = [[W / Q흡수]]

= 나가기 전 한 문제 | 형성평가
? 압력 200 kPa에서 부피가 2 L에서 5 L로 등압 팽창한 단원자 이상 기체가 한 일, 내부 에너지 변화, 흡수한 열을 구하시오. :: W = 200 × 3 = 600 J, ΔU = 1.5 × 200 × 3 = 900 J, Q = 1500 J
