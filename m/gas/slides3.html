# 열의 이동과 단열, 비열과 잠열 | 따뜻한 집, 시원한 집의 과학 | 고등학교 역학과 에너지 · 03 열과 에너지 · 1차시 | 2022 개정 교육과정 [12역학02-01] [12역학02-02]

= 오늘의 학습 목표 | 1차시
^ 고체와 유체에서 열이 **전도·대류·복사**로 전달되는 과정을 설명하고, **단열**과 **열팽창**이 기술에 활용된 예를 조사할 수 있다.
^ **비열**과 **잠열**을 이용해 물질의 온도 변화와 상태 변화에 필요한 열을 구할 수 있다.
% 흐름: 생각 열기 5분 → 열전달과 단열 10분 → 열팽창 7분 → 비열 계산 10분 → 잠열과 가열 곡선 10분 → 단열재 비교 탐구 안내 3분
% 2022 개정 [12역학02-01] 해설: 고체뿐 아니라 유체에서 열이 전도·대류·복사로 전달되는 과정을 이해하고, 건축물의 단열재·구조 등 실생활 사례를 조사한다. [12역학02-02] 해설: 비열과 잠열을 정량적으로 이해한다. 이 차시는 '열과 에너지' 영역의 첫 차시로 운영한다.

= 패시브 하우스는 왜 겨울에도 따뜻할까? | 생각 열기
* 🏠 패시브 하우스 :: 난방을 거의 하지 않아도 실내가 따뜻하다
* 🪟 3중 유리창 :: 유리 사이에 공기나 아르곤 기체를 채운다
* 🌉 다리의 이음매 :: 여름과 겨울에 틈의 크기가 다르다
* 🧊 얼음 음료 :: 얼음이 다 녹을 때까지 0 ℃ 근처로 유지된다
? 집에서 열이 빠져나가는 길을 모두 막으려면 무엇을 막아야 할까? :: 벽과 유리를 통한 **전도**, 틈새 공기의 **대류**, 창으로 나가는 **복사**를 모두 줄여야 한다.

= 이전에 배운 내용 떠올리기 | 복습 · 중1 열, 물리학
- 열의 이동 방식: [[전도]], 대류, 복사
- 같은 열을 받아도 온도 변화가 작은 물질 → 비열이 [[크다]]
- 물체의 온도가 오르면 길이와 부피가 늘어나는 현상 → [[열팽창]]
? 중학교에서는 비열을 비교만 했다. 고등학교에서는? :: 필요한 열의 양을 **계산**한다: Q = cmΔT, 상태 변화에는 잠열 Q = mL

## 열전달과 단열 | 열이 빠져나가는 세 갈래

= 유체 속 열전달과 단열
| 방식 | 일어나는 곳 | 단열 방법 |
|+ 전도 | 고체 속, 맞닿은 물질 사이 | 열전도율이 작은 재료(스티로폼, 단열재) 사용 |
|+ 대류 | 액체·기체(유체)가 직접 이동 | 공기층을 작은 칸에 가둔다, 틈새 막기 |
|+ 복사 | 물질 없이도 전달 | 반사 코팅(로이 유리), 은박 단열재 |
>+ 갇힌 공기는 열을 잘 전달하지 못한다 → 다운 패딩, 이중창, 스티로폼의 공통 원리

= 건축 속 단열과 열팽창 | 사례
* 🧱 외단열 :: 벽 바깥을 단열재로 감싸 열이 새는 다리(열교)를 줄인다
* 🪟 로이 유리 :: 얇은 금속막이 적외선을 반사해 복사 열손실을 줄인다
* 🌉 신축 이음 :: 다리·레일의 틈으로 열팽창에 의한 변형을 흡수
* 🌡️ 바이메탈 :: 열팽창 정도가 다른 두 금속으로 온도에 따라 휘어 스위치 작동
* 🔥 내열 유리 :: 열팽창이 작아 급격한 온도 변화에도 잘 깨지지 않는다

## 비열과 잠열 | 열의 양을 계산하다

= 비열
! Q = c m ΔT (c: 비열, m: 질량, ΔT: 온도 변화)
- 비열: 물질 1 kg의 온도를 1 K(1 ℃) 높이는 데 필요한 열 (J/kg·K)
- 물의 비열 ≈ 4200 J/kg·K — 다른 물질보다 매우 크다 → 기후 조절, 냉각수, 찜질 팩
| 물질 | 물 | 식용유 | 알루미늄 | 철 |
| 비열 (J/kg·K, 대략) | 4200 | 2000 | 900 | 450 |

= 예제 1 · 물 데우기 | 적용
- 20 ℃ 물 2 kg을 100 ℃까지 데우는 데 필요한 열은?
^+ Q = cmΔT = 4200 × 2 × 80
^+ = **672 000 J ≈ 6.7 × 10⁵ J**
^+ 같은 질량의 철이라면 비열이 약 1/9 → 필요한 열도 약 1/9

= 잠열
! Q = m L (L: 잠열 — 1 kg이 상태 변화하는 데 필요한 열)
- 상태 변화 동안 받은 열은 입자 사이의 인력을 끊는 데 쓰여 **온도가 일정**하다.
- 물의 융해열 ≈ 3.3 × 10⁵ J/kg, 기화열 ≈ 2.3 × 10⁶ J/kg
>+ 기화열이 매우 크다 → 땀의 증발, 에어컨 냉매, 증기 난방

= 가열 곡선 | 그래프
C 얼음 1 kg을 일정하게 가열할 때 (받은 열은 약 42 kJ를 1로 한 상대값) | 받은 열 (상대값) | 온도 (℃) | 온도:0,-20 1,0 8.9,0 18.9,100 72.7,100 73.7,110
- 수평 구간: 상태 변화 중 → [[잠열]]
- 기울어진 구간: 온도 변화 → 기울기는 비열이 [[작을수록]] 가파르다
- 물이 끓는 구간이 녹는 구간보다 훨씬 길다 → 기화열 > [[융해열]]

= 예제 2 · 얼음을 물로 | 적용
- 0 ℃ 얼음 0.5 kg을 모두 녹여 20 ℃ 물로 만드는 데 필요한 열은?
^+ 녹이기: mL = 0.5 × 3.3 × 10⁵ = **1.65 × 10⁵ J**
^+ 데우기: cmΔT = 4200 × 0.5 × 20 = **0.42 × 10⁵ J**
^+ 합 = **2.07 × 10⁵ J** — 녹이는 데 훨씬 많은 열이 든다

= 단열재 비교 탐구 | 탐구 활동
^ 같은 컵에 같은 온도의 뜨거운 물을 담고, 서로 다른 단열재(스티로폼, 신문지, 은박, 뽁뽁이)로 감싼다.
^ 온도 센서로 10분 동안 온도 변화를 기록한다.
^ 열이 빠져나가는 빠르기를 비교하고, 각 재료가 막는 열전달 방식을 설명한다.
% 2022 개정 탐구 활동: 단열재의 종류에 따른 보온/보냉 효과 비교하기. 변인 통제(물의 양, 처음 온도, 감싼 두께)를 학생이 설계하게 한다.

= 확인 문제 1
Q 다운 패딩과 이중창이 보온에 좋은 공통 원리는?
o 금속이 열을 잘 전달하므로
o* 움직이지 못하게 갇힌 공기가 열을 잘 전달하지 못하므로
o 복사를 모두 흡수하므로
o 비열이 작으므로
:: 갇힌 공기는 전도가 약하고 대류도 억제된다.

= 확인 문제 2
Q 비열이 450 J/kg·K인 철 2 kg의 온도를 10 ℃ 높이는 데 필요한 열은?
o 900 J
o 4500 J
o* 9000 J
o 90 000 J
:: Q = 450 × 2 × 10 = 9000 J

= 확인 문제 3
Q 물이 끓는 동안 계속 가열해도 온도가 일정한 까닭은?
o 열이 공급되지 않기 때문
o* 받은 열이 상태 변화(기화)에 쓰이기 때문
o 물의 비열이 0이 되기 때문
o 열이 모두 복사로 빠져나가기 때문
:: 상태 변화 동안 받은 열(잠열)은 입자 사이 인력을 끊는 데 쓰인다.

= 서술형 도전 | 생각 넓히기
? 해안 지방이 내륙보다 하루 기온 차가 작은 까닭을 비열로 설명하시오. :: 바닷물은 비열이 커서 같은 열을 받거나 잃어도 온도 변화가 작으므로, 주변 공기의 온도 변화도 줄여 준다.
? 100 ℃ 수증기에 데는 것이 100 ℃ 물에 데는 것보다 더 위험한 까닭을 잠열로 설명하시오. :: 수증기는 피부에서 액화하며 큰 기화열(잠열)을 방출한 뒤 다시 뜨거운 물로서 열을 주므로, 같은 질량의 물보다 훨씬 많은 열을 피부에 전달한다.

= 오늘 배운 내용 정리
- 단열: 전도(단열재)·대류(공기 가두기)·복사([[반사]])를 모두 줄인다.
- 열팽창을 고려한 설계: 신축 이음, 바이메탈, 내열 유리
- 온도 변화: Q = [[cmΔT]], 물의 비열 ≈ 4200 J/kg·K
- 상태 변화: Q = [[mL]], 상태 변화 중 온도 일정

= 나가기 전 한 문제 | 형성평가
? 0 ℃ 얼음 1 kg을 0 ℃ 물로 녹이는 데 필요한 열과, 0 ℃ 물 1 kg을 80 ℃로 데우는 데 필요한 열을 비교하시오. (물의 융해열 3.3 × 10⁵ J/kg, 비열 4200 J/kg·K) :: 녹이기 3.3 × 10⁵ J, 데우기 4200 × 1 × 80 = 3.36 × 10⁵ J로 거의 같다. 얼음을 녹이는 데 물을 80 ℃ 가까이 데우는 만큼의 열이 든다.
