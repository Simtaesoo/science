# 기체 분자 운동 | 압력과 온도의 정체 | 고등학교 역학과 에너지 · 03 열과 에너지 · 2차시 | 2022 개정 교육과정 [12역학02-02]

= 오늘의 학습 목표 | 2차시
^ 기체의 **압력**을 분자의 충돌로 설명할 수 있다.
^ **이상 기체 상태 방정식** PV = nRT를 분자 운동과 연결할 수 있다.
^ 분자의 **평균 운동 에너지**가 절대 온도에 비례함을 설명하고 v_rms를 비교할 수 있다.
% 흐름: 생각 열기 5분 → 압력의 정체 8분 → 압력을 바꾸는 방법(시뮬레이션) 12분 → 온도와 운동 에너지 10분 → 계산·문항 10분
% [교육과정 확인] [12역학02-02]는 이상 기체의 온도·압력·부피 관계(이상 기체 법칙)를 다룬다. 분자 운동론(평균 운동 에너지 (3/2)kT, v_rms)은 교육과정에 명시되지 않은 심화 내용이다.

= 과자 봉지는 왜 부풀까? | 생각 열기
* 🏔️ 산 위의 과자 봉지 :: 빵빵하게 부풀어 오른다
* 🚲 여름 자전거 타이어 :: 공기를 꽉 채우면 터질 수 있다
* 🎈 냉동실의 풍선 :: 쭈글쭈글하게 줄어든다
* 🍳 압력솥 :: 뚜껑을 닫으면 압력이 높아진다
? 눈에 보이지도 않는 기체가 봉지 벽을 미는 힘은 어디서 올까? :: 수많은 기체 분자가 쉬지 않고 벽에 **충돌**하며 주는 충격량이 모여 **압력**이 된다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 보일 법칙 | 온도 일정 → PV = 일정 (중학교·통합과학) |
| 샤를 법칙 | 압력 일정 → V ∝ T(절대 온도) |
| 충격량 | 운동량의 변화량 = 힘 × 시간 (물리학) |
? 0 °C는 절대 온도로 몇 K인가? :: 약 **273 K** (T = t + 273)

## 기체 분자 운동론 | 분자의 충돌이 압력을 만든다

= 압력의 정체
- 분자가 벽에 충돌 → 운동량 변화 → 벽에 [[충격량]]
- 충돌이 많을수록, 세게 부딪힐수록 압력이 ==커진다.==
| 압력을 키우는 방법 | 분자 수준의 원인 |
|+ 온도를 높인다 | 분자 [[속력]] 증가 → 더 세게, 더 자주 충돌 |
|+ 부피를 줄인다 | 벽에 부딪히는 [[횟수]] 증가 |
|+ 분자 수를 늘린다 | 충돌 횟수 증가 |

= 이상 기체 상태 방정식
! PV = nRT = NkT
- R = 8.31 J/(mol·K), k = 1.38 × 10⁻²³ J/K (볼츠만 상수)
- 분자 사이 힘과 분자 자체의 부피를 무시한 기체 → **이상 기체**
>+ 상온·보통 압력의 공기는 이상 기체에 가깝다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#kinetic | 온도, 부피, 분자 수를 하나씩 바꾸며 이론 압력과 측정 압력을 비교하자. 분자의 속력 분포도 관찰하자.
% 한 번에 하나의 변인만 바꾸도록 지도 (변인 통제)

= 압력을 바꾸는 방법 | 시뮬레이션 기록
| 조건 | 300 K, V₀, 120개 | 600 K, V₀, 120개 | 300 K, 0.5V₀, 120개 | 300 K, V₀, 60개 |
|+ 이론 압력 | 1.00 | [[2.00]] | [[2.00]] | [[0.50]] |
|+ 분자 속력 | 1배 | [[약 1.41배]] | 1배 | 1배 |
- 온도 2배 → 속력 [[√2]]배 → 충돌이 세지고 잦아져 압력 2배

## 온도와 분자 운동 | 온도는 평균 운동 에너지

= 온도의 정체
! ½mv²(평균) = (3/2)kT
- 분자 1개의 평균 운동 에너지는 ==절대 온도==에 비례
- 같은 온도면 분자의 종류와 관계없이 평균 운동 에너지가 **같다.**
! v_rms = √(3RT/M)
~ M: 몰 질량(kg/mol). 가벼운 분자일수록 빠르다.

= 온도와 분자 속력 | 그래프
C 온도에 따른 질소 분자의 v_rms | 절대 온도 (K) | v_rms (m/s) | 질소:100,299 200,422 300,517 400,597 600,731 900,895 1200,1034
||
| 기체 (300 K) | 몰 질량 | v_rms |
| 수소 H₂ | 2 g/mol | 약 1930 m/s |
| 헬륨 He | 4 g/mol | 약 1370 m/s |
| 질소 N₂ | 28 g/mol | 약 517 m/s |
| 산소 O₂ | 32 g/mol | 약 [[484]] m/s |
- 온도 4배 → v_rms [[2]]배

= 예제 1 · 온도를 높이면 | 적용
- 27 °C에서 질소 분자의 v_rms는 약 517 m/s이다. 927 °C에서는?
^+ 절대 온도: 300 K → 1200 K (**4배**)
^+ v_rms ∝ √T → √4 = **2배**
^+ 약 **1034 m/s**

= 예제 2 · 수소와 산소 | 적용
- 같은 온도에서 수소(H₂)와 산소(O₂) 분자를 비교하자.
^+ 평균 운동 에너지: 온도에만 비례 → **같다**
^+ v_rms ∝ √(1/M) → √(32 ÷ 2) = √16 = **4배** (수소가 빠르다)

= 예제 3 · 분자 1개의 운동 에너지 | 적용
- 27 °C(300 K)에서 기체 분자 1개의 평균 운동 에너지는?
^+ (3/2)kT = 1.5 × 1.38 × 10⁻²³ × 300
^+ ≈ **6.2 × 10⁻²¹ J**
>+ 아주 작지만 1 mol(6 × 10²³개)이면 약 **3700 J**

= 확인 문제 1
Q 기체의 압력이 생기는 원인으로 옳은 것은?
o 분자 사이의 인력
o* 분자가 벽에 충돌하며 주는 충격량
o 분자의 무게
o 분자의 크기
:: 수많은 분자의 충돌로 벽이 받는 평균 힘이 압력이다.

= 확인 문제 2
Q 절대 온도를 2배로 하면 분자의 평균 운동 에너지는?
o √2배
o* 2배
o 4배
o 그대로
:: 평균 운동 에너지 ∝ T

= 확인 문제 3
Q 온도가 일정할 때 부피를 1/2로 줄이면 압력이 2배가 되는 까닭은?
o 분자의 속력이 2배가 되어서
o* 단위 시간당 벽에 충돌하는 횟수가 늘어서
o 분자 수가 늘어서
o 분자의 질량이 커져서
:: 온도가 같으므로 속력은 그대로, 충돌 횟수가 2배

= 확인 문제 4
Q 같은 온도의 헬륨(4 g/mol)과 산소(32 g/mol) 분자의 v_rms 비(헬륨 : 산소)는?
o 1 : 8
o 8 : 1
o* 2√2 : 1
o 1 : 1
:: √(32/4) = √8 = 2√2

= 확인 문제 5
Q 같은 온도에서 기체 분자의 속력에 대한 설명으로 옳은 것은?
o 모든 분자의 속력이 같다
o* 분자마다 속력이 다르고 일정한 분포를 이룬다
o 무거운 분자일수록 빠르다
o 분자는 정지해 있다
:: 평균은 온도로 정해지지만 개별 분자의 속력은 분포를 이룬다.

= 생활 속 기체 분자 운동 | 사례
* 🏔️ 산 위의 과자 봉지 :: 바깥 압력이 작아 팽창
* 🚗 타이어 공기압 :: 겨울에 낮아지고 여름에 높아진다
* 🍳 압력솥 :: 높은 압력에서 물의 끓는점이 높아진다
* 🎈 헬륨 풍선 :: 가벼운 헬륨은 고무막을 잘 빠져나가 금방 쪼그라든다
* 🌍 지구 대기 :: 수소·헬륨은 거의 남아 있지 않다
* 💨 향기 퍼짐 :: 분자가 빠르게 움직이며 확산

= 서술형 도전 | 생각 넓히기
? 밀폐된 과자 봉지를 높은 산에 가져가면 부풀어 오르는 까닭을 분자 운동으로 설명하시오. :: 바깥 공기 분자의 충돌이 줄어 외부 압력이 작아지므로, 봉지 안 기체 분자의 충돌에 의한 압력이 더 커서 봉지가 팽창한다.
? 지구 대기에 수소와 헬륨이 거의 없는 까닭을 분자 속력 분포와 탈출 속력으로 추론하시오. :: 가벼운 기체는 같은 온도에서 평균 속력이 커서 분포의 꼬리에 있는 일부 분자가 탈출 속력(약 11.2 km/s)을 넘을 수 있다. 오랜 시간 조금씩 우주로 빠져나가 대기에 거의 남지 않았다.

= 오늘 배운 내용 정리
- 압력: 분자가 벽에 [[충돌]]하며 주는 충격량
- 이상 기체 상태 방정식: PV = [[nRT]]
- 분자의 평균 운동 에너지 = [[(3/2)kT]] → 절대 온도에 비례
- v_rms = [[√(3RT/M)]] → 가벼울수록 [[빠르다]].
- 온도 4배 → v_rms [[2]]배

= 나가기 전 한 문제 | 형성평가
? 절대 온도 300 K에서 v_rms가 400 m/s인 기체를 1200 K로 가열하면 v_rms와 평균 운동 에너지는 각각 몇 배가 되는지 쓰시오. :: v_rms ∝ √T → 2배(800 m/s), 평균 운동 에너지 ∝ T → 4배
