# 엔트로피와 비가역 현상 | 깨진 컵은 왜 저절로 붙지 않을까 | 고등학교 역학과 에너지 · 03 열과 에너지 · 4차시 | 2022 개정 교육과정 [12역학02-04] [12역학02-05]

= 오늘의 학습 목표 | 4차시
^ 자연 현상 중 저절로 한쪽 방향으로만 일어나는 **비가역 현상**의 예를 들 수 있다.
^ 열의 이동, 기체의 확산을 **엔트로피**(경우의 수)를 이용하여 설명할 수 있다.
^ 열기관의 개발과 활용이 인류 공동체에 미친 영향을 **산업 발전과 환경** 측면에서 평가할 수 있다.
% 흐름: 생각 열기 5분 → 비가역 현상 8분 → 경우의 수와 엔트로피 15분 → 열역학 제2법칙 7분 → 열기관과 인류 토의 10분
% 2022 개정 [12역학02-05]: 열의 이동, 기체의 확산과 같은 비가역 현상을 엔트로피를 이용하여 설명한다. 엔트로피는 '가능한 미시 상태(배열)의 수가 많은 쪽' 수준에서 다루고, ΔS = Q/T 등의 정량 계산은 다루지 않는다. [12역학02-04] 적용 시 고려 사항: 열기관의 정량적 계산은 지양하고, 열효율을 높이려는 노력과 지구 환경 문제의 관계를 인식하게 한다.

= 거꾸로 돌린 영상 | 생각 열기
* 🥛 우유 섞기 :: 커피에 퍼진 우유가 다시 한 방울로 모인다?
* ☕ 커피 :: 식은 커피가 저절로 다시 뜨거워진다?
* 🥚 깨진 달걀 :: 바닥의 달걀이 다시 껍데기 속으로?
* 🌫️ 향수 :: 방 안에 퍼진 향기가 다시 병 속으로?
? 이 영상들이 거꾸로 재생되었다는 것을 어떻게 알까? :: 자연에서는 저절로 그 방향으로 일어나지 않기 때문이다 — 자연 현상에는 **방향**이 있다.

= 지난 시간 복습 | 2·3차시
- 열역학 제1법칙: 계가 받은 열 = 내부 에너지 증가 + 외부에 한 [[일]]
- 열기관은 받은 열을 [[모두]] 일로 바꿀 수 없다.
? 커피가 저절로 뜨거워지는 것은 에너지 보존 법칙에 어긋날까? :: 어긋나지 않는다(주위가 열을 내주면 된다). 그런데도 일어나지 않는다 → 에너지 보존 말고 **다른 법칙**이 있다.

## 비가역 현상 | 한쪽으로만 일어나는 변화

= 가역 현상과 비가역 현상
| 구분 | 뜻 | 예 |
|+ 가역 현상 | 원래 상태로 되돌릴 때 주위에 아무 변화도 남기지 않을 수 있는 이상적인 현상 | 마찰 없는 진자의 운동(근사) |
|+ 비가역 현상 | 저절로 한 방향으로만 일어나고 스스로 되돌아가지 않는 현상 | 열의 이동, 확산, 마찰열 발생, 연소 |
>+ 자연에서 실제로 일어나는 현상은 대부분 **비가역**이다.

## 엔트로피 | 경우의 수가 많은 쪽으로

= 상자 속 분자 4개 | 경우의 수
- 칸막이 없는 상자에 분자 4개가 있다. 각 분자는 왼쪽(L) 또는 오른쪽(R)에 있을 수 있다.
| 배치 | 왼쪽 4 | 왼쪽 3 | 왼쪽 2 | 왼쪽 1 | 왼쪽 0 |
|+ 경우의 수 | 1 | 4 | [[6]] | 4 | 1 |
- 전체 경우의 수 = 2⁴ = 16 → 고르게 퍼진 상태(2 : 2)가 가장 **많다.**
>+ 분자가 많아질수록 고르게 퍼진 상태의 경우의 수가 압도적으로 많아진다.

= 그래프로 보면 | 분자 수가 많아지면
C 왼쪽에 모든 분자가 모여 있을 확률 | 분자 수 | 확률 (%) | 확률:1,50 2,25 4,6.25 6,1.56 8,0.39 10,0.1
~ 분자 10개만 되어도 한쪽에 모두 모일 확률은 0.1 % — 실제 기체(10²³개)에서는 사실상 0
>+ 기체가 퍼지는 것(확산)은 경우의 수가 많은 상태로 가는 자연스러운 변화

= 엔트로피
! 엔트로피: 계가 가질 수 있는 미시 상태(배열)의 수가 얼마나 많은지를 나타내는 양 — 무질서한 정도
- 고립된 계에서 자연 현상은 엔트로피가 **증가**하는 방향으로 일어난다 → **열역학 제2법칙**
- 확산: 분자가 퍼질수록 가능한 배열의 수 증가 → 엔트로피 증가
- 열의 이동: 에너지가 고온에서 저온으로 퍼질수록 에너지 분배 방법의 수 증가 → 엔트로피 증가
>+ 반대 방향의 변화는 에너지 보존에 어긋나지 않아도 경우의 수가 너무 적어 **사실상 일어나지 않는다.**

= 예제 1 · 냉장고는 엔트로피를 줄일까? | 적용
^+ 냉장고 안: 열을 빼내어 내부의 엔트로피는 **줄어든다.**
^+ 그러나 압축기를 돌리는 전기 에너지가 쓰이고, 뒤쪽으로 더 많은 열을 **방출**한다.
^+ 냉장고 + 주위 전체의 엔트로피는 **증가**한다.
>+ 일부의 엔트로피를 줄이려면 다른 곳의 엔트로피가 더 많이 늘어나야 한다.

## 열기관과 인류 | 산업 발전과 환경

= 열기관이 바꾼 세상 | 토의 자료
* 🚂 증기 기관 :: 산업 혁명 — 공장·철도로 생산과 이동이 크게 늘었다
* 🚗 내연 기관 :: 자동차·항공기로 생활권이 넓어졌다
* 🏭 화력 발전 :: 값싼 전기로 현대 문명을 지탱
* 🌡️ 대가 :: 화석 연료 연소로 이산화 탄소 증가 → 지구 온난화, 대기 오염
* ♨️ 버려지는 열 :: 효율의 한계로 많은 열이 환경으로 방출
? 열기관의 효율을 높이고 환경 피해를 줄이는 방법에는 무엇이 있을까? :: 고온 고압 터빈, 복합 화력·열병합으로 폐열 재활용, 전기차·재생 에너지로 전환, 탄소 포집 등

= 확인 문제 1
Q 비가역 현상이 아닌 것에 가장 가까운 것은?
o 잉크가 물에 퍼진다
o 뜨거운 물이 식는다
o 마찰로 물체가 멈춘다
o* 마찰이 거의 없는 진자가 같은 높이로 계속 진동한다
:: 마찰이 없는 이상적인 진동은 가역 현상에 가깝다.

= 확인 문제 2
Q 분자 4개가 상자의 왼쪽과 오른쪽에 나뉘어 있을 때 경우의 수가 가장 많은 배치는?
o 왼쪽 4개, 오른쪽 0개
o 왼쪽 3개, 오른쪽 1개
o* 왼쪽 2개, 오른쪽 2개
o 모든 배치의 경우의 수가 같다
:: 2 : 2 배치의 경우의 수는 6가지로 가장 많다.

= 확인 문제 3
Q 열역학 제2법칙에 대한 설명으로 옳은 것은?
o 에너지는 새로 생기거나 사라지지 않는다
o* 고립된 계에서 자연 현상은 엔트로피가 증가하는 방향으로 일어난다
o 열은 저절로 저온에서 고온으로 이동한다
o 열기관의 효율은 100 %가 될 수 있다
:: 첫째 보기는 제1법칙(에너지 보존)이다.

= 서술형 도전 | 생각 넓히기
? 방에 뿌린 향수 냄새가 다시 병 속으로 모이지 않는 까닭을 엔트로피로 설명하시오. :: 향수 분자가 방 전체에 퍼진 상태가 병 속에 모여 있는 상태보다 가능한 배열의 수가 압도적으로 많아 엔트로피가 크다. 자연 현상은 엔트로피가 증가하는 방향으로 일어나므로 다시 모이는 일은 사실상 일어나지 않는다.
? 증기 기관의 발명이 인류에 준 혜택과 문제를 한 가지씩 쓰고, 문제를 줄이는 방안을 제안하시오. :: 혜택: 공장과 철도로 생산과 교통이 크게 발전했다. 문제: 화석 연료 사용으로 대기 오염과 이산화 탄소 배출이 늘었다. 방안: 열효율 향상, 폐열 재활용, 재생 에너지로 전환 등

= 오늘 배운 내용 정리
- 저절로 한 방향으로만 일어나는 현상 → [[비가역]] 현상
- 엔트로피: 가능한 미시 상태(배열)의 [[수]]가 많을수록 크다
- 고립계의 자연 현상은 엔트로피가 [[증가]]하는 방향 → 열역학 제2법칙
- 열기관: 산업 발전의 원동력이자 환경 문제의 원인 — 효율 향상과 에너지 전환이 과제

= 나가기 전 한 문제 | 형성평가
? 뜨거운 금속과 차가운 물을 접촉시켰을 때 열이 금속에서 물로 이동하는 현상을 엔트로피와 관련지어 한 문장으로 쓰시오. :: 에너지가 고온의 금속에서 저온의 물로 퍼져 나가면 에너지를 나누어 가지는 방법의 수가 늘어 전체 엔트로피가 증가하므로, 열은 고온에서 저온으로 저절로 이동한다.
