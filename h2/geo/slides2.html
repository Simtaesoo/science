## 변이 | 같은 종, 다른 모습

= 변이
! 변이: 같은 종의 개체 사이에서 나타나는 형질의 차이
- 주로 **유전자**의 차이로 생기며 자손에게 ==전달된다.==
- 원인: 생식세포 형성 과정의 유전자 조합, **돌연변이**
- 예: 사람의 얼굴 생김새, 무당벌레의 무늬, 나방의 몸 색깔
>+ 환경 때문에 생긴 차이(햇볕에 탄 피부)는 자손에게 전달되지 **않는다.**

## 자연선택 | 환경이 고른다

= 다윈의 자연선택설
^+ **과잉 생산**: 생물은 살아남을 수 있는 것보다 많은 자손을 낳는다.
^+ **변이**: 자손들 사이에 형질의 차이가 있다.
^+ **생존 경쟁**: 먹이·공간이 부족해 경쟁한다.
^+ **자연선택**: 환경에 유리한 변이를 가진 개체가 더 많이 살아남아 자손을 남긴다.
^+ 여러 세대에 걸쳐 쌓이면 → **진화**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#select | [내가 새가 되어 사냥]으로 깨끗한 숲에서 3세대, 매연 숲으로 바꾸어 5세대를 진행하자.
% 학생이 직접 '새'가 되어 30초씩 사냥 → 눈에 잘 띄는 나방부터 잡게 되는 것을 체감

= 나방 사냥 결과 | 시뮬레이션 기록
| 환경 | 눈에 잘 띄는 나방 | 잘 살아남는 나방 | 세대가 지날수록 |
|+ 깨끗한 숲 (밝은 나무) | 어두운 나방 | 밝은 나방 | [[밝은 나방]] 비율 증가 |
|+ 매연 숲 (어두운 나무) | 밝은 나방 | 어두운 나방 | [[어두운 나방]] 비율 증가 |

= 예제 1 · 자연선택 계산 | 적용
- 매연 숲에 밝은 나방과 어두운 나방이 50 %씩 있다. 한 세대마다 밝은 나방은 40 %, 어두운 나방은 10 %가 잡아먹힌다. (살아남은 나방은 같은 수의 자손을 남긴다고 가정)
^+ 살아남은 비율: 밝은 0.5 × 0.6 = **0.30**, 어두운 0.5 × 0.9 = **0.45**
^+ 다음 세대 어두운 나방 비율 = 0.45 ÷ (0.30 + 0.45) = **60 %**
^+ 같은 방식으로 계속하면 69.2 % → 77.1 % → 83.5 % → **88.4 %** (5세대)

= 그래프로 보면 | 세대에 따른 변화
C 매연 숲에서 어두운 나방의 비율 (모형) | 세대 | 어두운 나방 비율 (%) | 어두운 나방:0,50 1,60 2,69.2 3,77.1 4,83.5 5,88.4
+ 나방 한 마리의 색은 [[변하지 않았다.]]
+ 바뀐 것은 집단 속 변이의 [[비율]]이다.

= 예제 2 · 항생제 내성 세균 | 적용
- 세균 100만 마리 중 항생제에 견디는 돌연변이가 10마리 있다. 항생제를 쓰면?
^+ 내성이 없는 세균 999 990마리는 **죽는다.**
^+ 내성 세균 10마리가 살아남아 **번식**한다.
^+ 세균은 약 20~30분마다 분열 → 하루 만에 집단 대부분이 **내성 세균**
>+ 그래서 항생제는 처방대로 끝까지, 꼭 필요할 때만 사용해야 한다.

= 생물 다양성의 형성
- 서로 다른 환경 → 서로 다른 변이가 선택된다.
- 오랜 시간이 지나면 같은 조상에서 **여러 종**으로 갈라진다.
>+ 예: **갈라파고스 핀치** — 섬마다 먹이가 달라 부리 모양이 다른 종으로 분화
~ 변이가 다양한 집단일수록 환경이 변해도 살아남을 개체가 있을 가능성이 높다.

= 생활 속 자연선택 | 사례
* 💊 항생제 내성 세균 :: 항생제 남용으로 내성균이 선택된다
* 🦟 살충제 내성 해충 :: 같은 살충제를 계속 쓰면 효과가 떨어진다
* 🐦 갈라파고스 핀치 :: 가뭄 뒤 부리가 큰 개체 비율이 늘었다
* 🐟 남획과 물고기 크기 :: 큰 물고기를 잡을수록 작게 성숙하는 개체가 늘었다
* 🌾 잡초의 제초제 내성 :: 살아남은 개체가 퍼진다
* 🦠 바이러스 변이 :: 전파에 유리한 변이가 빠르게 퍼진다

= 확인 문제 1
Q 자연선택설의 과정을 바르게 나열한 것은?
o 진화 → 변이 → 생존 경쟁 → 과잉 생산
o* 과잉 생산 → 변이 → 생존 경쟁 → 자연선택 → 진화
o 자연선택 → 변이 → 과잉 생산 → 진화
o 변이 → 진화 → 과잉 생산 → 생존 경쟁
:: 많이 낳고, 차이가 있고, 경쟁하여, 유리한 변이가 선택되고, 쌓여 진화한다.

= 확인 문제 2
Q 자손에게 전달되는 변이는?
o 운동으로 커진 근육
o 햇볕에 그을린 피부
o* 유전자 차이로 생긴 눈동자 색
o 사고로 생긴 흉터
:: 유전자의 차이로 생긴 변이만 자손에게 전달된다.

= 확인 문제 3
Q 밝은 나방 50 %, 어두운 나방 50 %인 깨끗한 숲에서 어두운 나방이 50 %, 밝은 나방이 0 % 잡아먹힐 때 다음 세대 밝은 나방의 비율은?
o 50 %
o 60 %
o* 약 66.7 %
o 100 %
:: 살아남은 비율: 밝은 0.5 × 1 = 0.5, 어두운 0.5 × 0.5 = 0.25 → 0.5 ÷ 0.75 ≈ 66.7 %

= 확인 문제 4
Q 변이가 전혀 없는 집단에 환경이 크게 바뀌면 어떻게 될 가능성이 큰가?
o 모든 개체가 새 환경에 적응한다
o 변이가 저절로 생겨 모두 살아남는다
o* 적응한 개체가 없어 집단 전체가 멸종할 위험이 크다
o 아무 영향이 없다
:: 모든 개체가 같은 형질이면 새 환경에 유리한 개체가 없을 수 있다.

= 서술형 도전 | 생각 넓히기
? '나방이 어두운 나무에 살기 위해 스스로 색을 바꾸었다'는 설명이 틀린 까닭을 쓰시오. :: 나방 개체가 색을 바꾼 것이 아니라, 원래 있던 변이 중 배경과 비슷한 색의 나방이 더 많이 살아남아 번식하여 집단의 비율이 바뀐 것이다.
? 유전적 다양성이 높은 집단이 환경 변화에 더 잘 견디는 까닭을 자연선택과 연결해 쓰시오. :: 다양한 변이가 있으면 새로운 환경에 유리한 형질을 가진 개체가 있을 가능성이 높아, 그 개체들이 살아남아 집단이 유지될 수 있기 때문이다.

- 같은 종 개체 사이의 형질 차이 → [[변이]] (유전자 차이 → 자손에게 전달)

- 바뀌는 것은 개체가 아니라 집단 속 변이의 [[비율]]
- 변이와 자연선택이 오랜 시간 누적 → [[생물 다양성]]
