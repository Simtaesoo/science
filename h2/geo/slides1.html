# 지질 시대와 대멸종 | 화석이 들려주는 지구의 역사 | 고등학교 통합과학2 · 01 지질 시대와 생물 다양성 · 1차시 | 2022 개정 교육과정 [10통과2-01-01]

= 오늘의 학습 목표 | 1차시
^ **표준 화석**과 **시상 화석**을 구별하고 지층을 해석할 수 있다.
^ **대멸종**을 기준으로 지질 시대를 구분할 수 있다.
^ 대멸종과 **생물 다양성** 변화의 관계를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 화석 10분 → 지질 시대(시뮬레이션) 12분 → 대멸종과 다양성 10분 → 문항 8분

= 지구의 역사를 1년으로 줄이면? | 생각 열기
* 🌍 1월 1일 0시 :: 지구 탄생 (약 46억 년 전)
* 🦐 11월 18일 무렵 :: 고생대 시작, 생물이 폭발적으로 늘어난다
* 🦖 12월 26일 무렵 :: 공룡 멸종
* 🧍 12월 31일 밤 11시 26분 무렵 :: 현생 인류 등장
? 지구 역사의 대부분(약 88 %)은 어느 시대일까? :: 화석이 거의 남지 않은 **선캄브리아 시대**. 우리가 아는 생물 대부분은 마지막 한 달 반 사이에 등장했다.
% 1년 달력 비유는 다음 슬라이드의 예제로 계산 확인

= 중학교에서 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 퇴적암 | 퇴적물이 쌓여 굳은 암석, 층리와 화석 |
| 지층 누중의 법칙 | 아래 지층일수록 먼저 쌓였다 |
| 화석 | 지층 속에 남은 옛 생물의 흔적 |
? 지층 속 화석으로 무엇을 알 수 있을까? :: 지층이 쌓인 **시대**와 당시의 **환경** — 오늘 두 종류의 화석으로 나누어 본다.

## 화석으로 읽는 지층 | 시대와 환경

= 표준 화석과 시상 화석
| 구분 | 표준 화석 | 시상 화석 |
|+ 알려 주는 것 | 지층의 생성 [[시대]] | 지층이 쌓일 당시의 [[환경]] |
|+ 조건 | 생존 기간 짧고, 분포 넓음 | 생존 기간 길고, 환경에 민감 |
|+ 예 | 삼엽충(고생대), 암모나이트(중생대), 화폐석(신생대) | 산호(따뜻하고 얕은 바다), 고사리(따뜻하고 습한 육지) |

= 예제 1 · 지층 해석 | 적용
- 어떤 지층에서 산호 화석과 삼엽충 화석이 함께 나왔다.
^+ 삼엽충 → 표준 화석 → **고생대**에 쌓인 지층
^+ 산호 → 시상 화석 → 당시 **따뜻하고 얕은 바다**
^+ 결론: 고생대의 따뜻하고 얕은 바다에서 쌓인 지층

## 지질 시대 | 대멸종이 나눈 시대

= 지질 시대의 구분
! 지질 시대: 생물계의 큰 변화(대멸종)를 기준으로 선캄브리아 시대, 고생대, 중생대, 신생대로 구분
- 지구 탄생: 약 **46억 년 전**
- 가장 큰 대멸종: **고생대 말(페름기 말)** — 해양 생물의 90 % 이상이 사라짐
>+ 시대의 경계 = 생물계가 크게 바뀐 때

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#era | 시간 막대를 움직이며 각 지질 시대에 번성한 생물과 대멸종 시기를 정리하자.
% 대멸종 지점에서 막대를 멈추고 생물 다양성 그래프가 꺾이는 모습을 함께 관찰

= 지질 시대별 생물 | 시뮬레이션 기록
| 지질 시대 | 시기 (백만 년 전) | 번성한 생물 | 표준 화석 |
|+ 고생대 | 541~252 | 삼엽충, 어류, 양치식물 | 삼엽충, 필석 |
|+ 중생대 | 252~66 | 공룡, 겉씨식물 | [[암모나이트]] |
|+ 신생대 | 66~현재 | 포유류, 속씨식물 | [[화폐석]], 매머드 |

= 예제 2 · 시대의 길이 비교 | 적용
- 지구 역사 4600백만 년 중 각 시대의 비율은?
^+ 선캄브리아: (4600 − 541) ÷ 4600 × 100 ≈ **88.2 %**
^+ 고생대: (541 − 252) ÷ 4600 × 100 ≈ **6.3 %**
^+ 중생대: (252 − 66) ÷ 4600 × 100 ≈ **4.0 %**
^+ 신생대: 66 ÷ 4600 × 100 ≈ **1.4 %**

= 예제 3 · 지구 달력 만들기 | 적용
- 46억 년을 365일로 줄이면 하루 = 4600 ÷ 365 ≈ **12.6백만 년**
^+ 고생대 시작(541백만 년 전): 541 ÷ 12.6 ≈ 43일 전 → **11월 18일 무렵**
^+ 공룡 멸종(66백만 년 전): 66 ÷ 12.6 ≈ 5.2일 전 → **12월 26일 무렵**
^+ 현생 인류(약 0.3백만 년 전): 약 **34분** 전 → 12월 31일 밤 11시 26분 무렵

## 대멸종과 생물 다양성 | 사라짐과 새로운 시작

= 다섯 번의 대멸종 | 개략적 그래프
C 해양 동물 과(科) 수의 변화 (개략적 예시) | 시간 (백만 년 전, 음수 = 과거) | 과의 수 | 과의 수:-540,150 -480,450 -445,330 -420,420 -372,340 -300,420 -252,180 -220,280 -201,230 -100,500 -66,420 0,900
||
- 대멸종: 오르도비스기 말, 데본기 후기, **페름기 말**(가장 큼), 트라이아스기 말, **백악기 말**(공룡)
>+ 대멸종 직후에는 살아남은 생물이 빈 서식지에 적응하며 다양성이 **빠르게 회복·증가**한다.
% 값은 경향을 보여 주는 개략적 예시

= 대멸종의 원인 | 사례
* 🌋 대규모 화산 활동 :: 페름기 말 시베리아 대규모 용암 분출
* ☄️ 소행성 충돌 :: 백악기 말 멕시코 칙술루브 충돌
* 🧊 급격한 기후 변화 :: 빙하기나 급격한 온난화
* 🌊 해양 산소 부족 :: 바다 생물의 대량 죽음
* 🏭 여섯 번째 대멸종? :: 인간 활동으로 멸종 속도가 매우 빨라졌다

= 확인 문제 1
Q 표준 화석의 조건으로 옳은 것은?
o 생존 기간이 길고 분포가 좁다
o* 생존 기간이 짧고 분포가 넓다
o 특정 환경에서만 산다
o 오늘날에도 살아 있다
:: 짧은 기간 넓게 퍼져 살았어야 그 시대를 정확히 알려 줄 수 있다.

= 확인 문제 2
Q 중생대의 표준 화석은?
o 삼엽충
o* 암모나이트
o 화폐석
o 매머드
:: 암모나이트는 중생대, 삼엽충은 고생대, 화폐석·매머드는 신생대이다.

= 확인 문제 3
Q 해양 생물의 90 % 이상이 사라진 가장 큰 대멸종은?
o 오르도비스기 말
o* 고생대 말(페름기 말)
o 중생대 말(백악기 말)
o 신생대 말
:: 고생대 말 대멸종으로 고생대와 중생대가 구분된다.

= 확인 문제 4
Q 대멸종 직후 생물 다양성이 빠르게 증가하는 까닭은?
o 모든 생물이 다시 살아나서
o* 빈 서식지와 생태적 지위에 살아남은 생물이 적응하며 다양한 종으로 분화해서
o 환경이 변하지 않아서
o 화석이 많이 만들어져서
:: 경쟁자가 사라진 환경에서 살아남은 생물이 빠르게 분화한다.

= 서술형 도전 | 생각 넓히기
? 대멸종이 일어난 원인으로 추정되는 것을 두 가지 쓰시오. :: 대규모 화산 활동, 소행성 충돌, 급격한 기후 변화(빙하기·온난화), 해양의 산소 부족 등
? 현재를 '여섯 번째 대멸종'이 진행 중이라고 말하는 근거와 우리가 할 수 있는 일을 쓰시오. :: 서식지 파괴, 기후 변화, 남획, 외래종 등 인간 활동으로 멸종 속도가 자연 상태보다 매우 빠르다. 서식지 보전, 탄소 배출 감축, 생물 다양성 보호 활동이 필요하다.

= 오늘 배운 내용 정리
- 지층의 시대를 알려 주는 화석 → [[표준 화석]], 환경을 알려 주는 화석 → [[시상 화석]]
- 지질 시대는 [[대멸종]]을 기준으로 선캄브리아·고생대·중생대·신생대로 구분
- 고생대 [[삼엽충]], 중생대 [[암모나이트]], 신생대 화폐석
- 가장 큰 대멸종: [[고생대 말]](페름기 말)
- 대멸종 후 생물 다양성은 빠르게 [[회복·증가]]

= 나가기 전 한 문제 | 형성평가
? 어떤 지층에서 암모나이트와 고사리 화석이 함께 발견되었다. 이 지층의 시대와 당시 환경을 쓰시오. :: 암모나이트(표준 화석) → 중생대 / 고사리(시상 화석) → 따뜻하고 습한 육지(또는 그 근처) 환경
