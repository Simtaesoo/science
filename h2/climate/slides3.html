# 지구 온난화와 기후 변화 | 데이터로 보는 기후 위기 | 고등학교 통합과학2 · 04 지구 환경 변화 · 3차시 | 2022 개정 교육과정 [10통과2-02-03]

= 오늘의 학습 목표 | 3차시
^ **온실 효과**와 **지구 온난화**의 관계를 설명할 수 있다.
^ CO₂ 농도와 기온 자료를 **분석**하여 온난화의 근거를 제시할 수 있다.
^ 기후 변화의 **영향**과 **감축·적응** 대응 방안을 제시할 수 있다.
% 흐름: 생각 열기 5분 → 온실 효과 7분 → CO₂와 기온(시뮬레이션) 12분 → 자료 분석·계산 12분 → 영향·대응·문항 9분

= 숫자로 보는 지구의 변화 | 생각 열기
* 🏭 대기 CO₂ :: 산업화 이전 약 280 ppm → 현재 약 420 ppm
* 🌡️ 지구 평균 기온 :: 2020년 무렵 약 +1.0 ℃ 이상 상승
* 🌊 해수면 :: 1993년 이후 매년 약 3 mm씩 상승
* 🧊 북극 바다 얼음 :: 여름철 면적이 크게 줄었다
? 1 ℃ 오른 것이 왜 큰일일까? :: 지구 '평균'이 1 ℃ 오르려면 막대한 에너지가 쌓여야 하며, 그 결과 폭염·가뭄·집중 호우 같은 **극한 기상**이 훨씬 잦아진다.

= 이전에 배운 내용 떠올리기 | 복습
- 대기가 지구 복사를 흡수·재방출해 기온을 높게 유지 → [[온실 효과]] (중3)
- 대표 온실 기체: [[CO₂]], CH₄, H₂O
- 화석 연료 연소: 지권의 탄소 → [[기권]] (통합과학1 지구시스템)
? 온실 효과는 나쁜 것일까? :: 아니다. 온실 효과가 없으면 지구 평균 기온은 약 −18 ℃. 문제는 온실 기체가 늘어 온실 효과가 **강화**되는 것이다.

## 온실 효과와 온난화 | 이불이 두꺼워지면

= 온실 효과와 지구 온난화
! 지구 온난화: 온실 기체가 증가해 온실 효과가 강화되어 지구 평균 기온이 높아지는 현상
- **온실 효과**: 온실 기체가 지구 복사(적외선)를 흡수했다가 지표로 재방출
- 주된 원인: ==화석 연료 사용==, 삼림 파괴
- CO₂: 산업화 이전 약 **280 ppm** → 현재 약 **420 ppm**

= 예제 1 · 얼마나 늘었나 | 적용
- 대기 CO₂가 280 ppm에서 420 ppm으로 늘었다.
^+ 증가량 = 420 − 280 = **140 ppm**
^+ 증가율 = 140 ÷ 280 × 100 = **50 %**
>+ 수십만 년 동안 약 180~300 ppm 사이를 오가던 농도가 약 200년 만에 그 범위를 크게 벗어났다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#warm | CO₂ 농도를 280, 420, 560, 800 ppm으로 바꾸며 평형 기온 상승과 영향을 기록하자.
% 모형의 가정(농도 2배마다 약 3 ℃)을 먼저 알려 주고, '모형의 한계'도 함께 언급

= CO₂ 농도와 기온 상승 | 시뮬레이션 기록
| CO₂ (ppm) | 280 | 420 | 560 | 800 |
|+ 기온 상승 (℃, 모형) | 0 | [[1.8]] | [[3.0]] | [[4.5]] |
||
C CO₂ 농도와 평형 기온 상승 (모형) | CO₂ (ppm) | 기온 상승 (℃) | 기온 상승:280,0 420,1.8 560,3 800,4.5 1120,6
~ 모형: 농도가 2배가 될 때마다 약 3 ℃ 상승 (280 → 560 → 1120). 실제 기후는 더 복잡한 되먹임의 영향을 받는다.

= 예제 2 · 2배마다 3 ℃ | 적용
- 모형: CO₂ 농도가 2배가 될 때마다 기온이 약 3 ℃ 오른다.
^+ 280 → 560 ppm (2배): **+3 ℃**
^+ 560 → 1120 ppm (다시 2배): 또 **+3 ℃** → 합계 **+6 ℃**
^+ 같은 140 ppm이 늘어도 처음(280 → 420)이 나중(980 → 1120)보다 기온을 더 많이 올린다.
>+ 농도가 '얼마나 늘었나'보다 '몇 배가 되었나'가 중요한 모형

= 예제 3 · 해수면 상승 | 적용
- 해수면이 매년 약 3.3 mm씩 오른다면 100년 뒤에는? (같은 속도 가정)
^+ 3.3 mm × 100 = **330 mm = 33 cm**
^+ 원인: 바닷물의 **열팽창** + 육지 빙하·빙상이 녹은 물
^+ 실제로는 상승 속도가 **빨라지고** 있어 더 높아질 수 있다.

## 기후 변화의 영향과 대응 | 감축과 적응

= 기후 변화의 영향 | 사례
* 🌊 해수면 상승 :: 저지대·섬나라 침수 위험
* 🧊 빙하 감소 :: 반사율 감소로 온난화 가속 (되먹임)
* 🔥 기상 이변 :: 폭염, 가뭄, 산불, 집중 호우 증가
* 🐟 생물 분포 변화 :: 어종·작물 재배지가 고위도로 이동
* 🪸 해양 산성화 :: 바다에 녹은 CO₂ 증가 → 산호·조개 피해
* 🦟 감염병 :: 모기 서식지 확대

= 사막화 | 엘니뇨와 함께 보는 지구 환경 변화
! 사막화: 건조 지역의 토지가 기후 변화와 인간 활동으로 점점 메말라 생산력을 잃는 현상
| 원인 | 자연적 원인 | 인위적 원인 |
|+ 내용 | 대기 대순환 변화에 따른 강수량 감소, 가뭄의 장기화 | 과도한 방목·경작, 삼림 벌채, 지하수 과다 사용 |
* 🌾 영향 :: 식량 생산 감소, 물 부족, 생물 다양성 감소
* 🌫️ 황사 :: 사막화된 지역의 흙먼지가 바람을 타고 우리나라까지 온다
* 🌳 대처 :: 나무 심기(방풍림), 물을 아끼는 농업, 방목 조절, 국제 협력(유엔 사막화 방지 협약)
% 2022 개정 [10통과2-02-03]: 엘니뇨, 사막화 등과 같은 현상이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석한다.

= 감축과 적응
| 구분 | 뜻 | 예 |
|+ 감축 | 원인(온실 기체)을 줄이기 | 재생 에너지 확대, 에너지 효율 향상, 탄소 포집 |
|+ 적응 | 피할 수 없는 피해를 줄이기 | 해안 방파제, 폭염 대피소, 가뭄에 강한 작물 |
>+ 파리 협정: 기온 상승을 산업화 이전 대비 **2 ℃ 훨씬 아래**, 가능하면 **1.5 ℃**로 제한

= 확인 문제 1
Q 지구 온난화의 주된 원인으로 가장 알맞은 것은?
o 태양 활동의 급격한 증가
o* 화석 연료 사용 등으로 인한 온실 기체 증가
o 오존층의 회복
o 화산 활동의 감소
:: 화석 연료 연소와 삼림 파괴로 대기 중 온실 기체가 늘어 온실 효과가 강화되었다.

= 확인 문제 2
Q 모형(농도 2배마다 약 3 ℃ 상승)에서 CO₂가 280 ppm에서 1120 ppm이 되면 기온 상승은?
o 3 ℃
o* 6 ℃
o 9 ℃
o 12 ℃
:: 280 → 560 → 1120으로 2배가 두 번 → 3 + 3 = 6 ℃

= 확인 문제 3
Q 다음 중 기후 변화 '적응' 방안은?
o 재생 에너지 확대
o 탄소 포집 기술 개발
o* 폭염 대피소 운영
o 에너지 효율 향상
:: 적응은 이미 일어나는 변화의 피해를 줄이는 방안이다.

= 확인 문제 4
Q 북극 바다 얼음이 녹으면 온난화가 더 빨라지는 까닭은?
o 얼음이 온실 기체이기 때문
o* 반사율이 높은 얼음 대신 바다가 드러나 태양 에너지를 더 흡수하기 때문
o 얼음이 녹으며 열을 방출하기 때문
o 해류가 멈추기 때문
:: 반사율 감소 → 흡수 증가 → 기온 상승 → 얼음이 더 녹는 양의 되먹임

= 확인 문제 5
Q 대기 CO₂ 농도가 300 ppm에서 450 ppm으로 늘었다. 증가율은?
o 15 %
o 33 %
o* 50 %
o 150 %
:: (450 − 300) ÷ 300 × 100 = 50 %

= 서술형 도전 | 생각 넓히기
? 기후 변화에 대응하는 방법을 감축과 적응으로 나누어 하나씩 쓰시오. :: 감축: 재생 에너지 확대, 에너지 효율 향상, 탄소 포집 / 적응: 해안 방파제 건설, 폭염 대피소 운영, 가뭄에 강한 작물 개발
? 파리 협정에서 기온 상승을 1.5 ℃로 제한하려는 까닭과 학생으로서 실천할 수 있는 일을 쓰시오. :: 1.5 ℃를 넘으면 산호초 소멸, 극한 기상, 해수면 상승 피해가 급격히 커지는 등 되돌리기 어려운 변화가 일어날 위험이 크기 때문이다. 실천: 대중교통·자전거 이용, 에너지 절약, 일회용품 줄이기 등

= 오늘 배운 내용 정리
- 온실 기체 증가 → 온실 효과 [[강화]] → [[지구 온난화]]
- CO₂: 산업화 이전 약 [[280]] ppm → 현재 약 420 ppm (약 50 % 증가)
- 영향: 해수면 [[상승]], 빙하 감소, 기상 이변, 해양 [[산성화]]
- 대응: 원인을 줄이는 [[감축]], 피해를 줄이는 [[적응]]

= 나가기 전 한 문제 | 형성평가
? 1960년 이후 대기 CO₂ 농도와 지구 평균 기온 편차가 함께 증가한 자료가 있다. 이 자료가 뜻하는 바와, 자료 해석에서 주의할 점을 한 가지씩 쓰시오. :: 온실 기체 증가와 온난화가 관련되어 있음을 보여 준다. 다만 두 값이 함께 변한다는 것만으로 원인을 단정하지 않고, 온실 효과의 원리와 다른 요인(태양 활동, 화산 등)도 함께 검토해야 한다.
