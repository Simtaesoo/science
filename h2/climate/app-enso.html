<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>태평양 기후 예보관 · 고1 지구 환경 변화</title>
<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/app.js"></script>
<script src="../../assets/hskit.js"></script>
</head>
<body>
<script>
const app = AppKit({
  id: 'h2enso', title: '태평양 기후 예보관', unit: '고1 · 통합과학2 · 34 지구 환경 변화', back: '../../index.html#hi2', sim: 'sim.html#enso',
  lead: '적도 태평양의 <b>무역풍, 따뜻한 해수층, 수온약층</b>을 관측해 지금이 평상시인지, 엘니뇨인지, 라니냐인지 판정하고 주변 지역의 날씨를 예보하세요!',
  howto: ['무대의 단면도에서 <b>무역풍 화살표의 길이</b>, 따뜻한 물(붉은 층)의 위치, 동태평양의 <b>용승</b>을 살펴보세요.', '오른쪽에서 상태와 예보를 하나씩 골라 <b>[예보 발표]</b>를 누르세요.', '마지막에는 관측 자료(수온 편차 그래프)를 읽는 단계도 있어요.'],
  recap: '<b>평상시</b>: 무역풍(동→서)이 따뜻한 표층수를 서태평양으로 밀어 인도네시아 쪽은 따뜻하고 비가 많으며, 페루 연안에서는 차가운 심층수가 <b>용승</b>해 영양염이 풍부하다. <b>엘니뇨</b>: 무역풍이 약해져 따뜻한 해수가 동쪽으로 퍼짐 → 동태평양 수온 상승, 용승 약화(어획량 감소), 페루 쪽 홍수, 인도네시아·호주 쪽 가뭄. <b>라니냐</b>: 무역풍이 강해져 평상시보다 더 서쪽으로 몰림 → 동태평양 수온 하강, 용승 강화, 인도네시아 쪽 강수 증가. 엘니뇨 감시 해역의 수온 편차가 +0.5 ℃ 이상인 상태가 몇 달 이상 지속되면 엘니뇨로 본다. 대기와 해양은 서로 영향을 주고받는다.',
  startLabel: '관측 시작'
});
const {S, sfx, toast} = app, D = Draw;
const ST = {normal: {n: '평상시', wind: 1, shift: 0, up: 1}, nino: {n: '엘니뇨', wind: .35, shift: .45, up: .25}, nina: {n: '라니냐', wind: 1.6, shift: -.15, up: 1.7}};
const Q = [['상태', ['평상시', '엘니뇨', '라니냐']], ['페루 연안 용승', ['강해짐', '평소', '약해짐']], ['인도네시아 강수', ['많아짐', '평소', '적어짐']]];
const ANS = {normal: ['평상시', '평소', '평소'], nino: ['엘니뇨', '약해짐', '적어짐'], nina: ['라니냐', '강해짐', '많아짐']};
const LV = [
  {t: 'enso', s: 'normal', why: '무역풍이 따뜻한 물을 서쪽으로 밀고 있고, 동쪽에서는 찬물이 솟아올라요 — 평상시의 모습.'},
  {t: 'enso', s: 'nino', why: '무역풍이 약해져 따뜻한 물이 동쪽으로 퍼졌어요. 페루 앞바다 용승이 약해지고 수온이 올라 어획량이 줄어요.'},
  {t: 'enso', s: 'nina', why: '무역풍이 평소보다 강해 따뜻한 물이 더 서쪽에 쌓이고, 동쪽의 용승이 강해져 수온이 낮아졌어요.'},
  {t: 'enso', s: 'nino', hard: true, why: '단서가 약해도 동태평양 수온 편차(+)와 약한 무역풍을 보면 엘니뇨를 알아챌 수 있어요.'},
  {t: 'graph', why: '편차가 +0.5 ℃ 이상인 상태가 여러 달 이어진 해가 엘니뇨, −0.5 ℃ 이하로 이어진 해가 라니냐예요.'}];
const IDX = [.1, .2, 0, -.1, .1, .3, .2, .1, 0, -.2, -.1, 0, .2, .4, .7, .9, 1.2, 1.5, 1.8, 2.1, 2.3, 2.2, 1.8, 1.2, .6, .1, -.3, -.6, -.8, -1, -1.2, -1.3, -1.1, -.9, -.7, -.4];
let ui = {}, pick = [], gpick = [];
const k = HS(app, {levels: LV, load(L){ pick = [null, null, null]; gpick = [null, null];
  if (L.t === 'enso') k.mission(ui.g, `적도 태평양 단면을 관측하고 예보하세요.${L.hard ? '<br>⚠ 관측 단서가 희미해요!' : ''}`); else k.mission(ui.g, '엘니뇨 감시 해역의 3년 동안의 <b>수온 편차</b> 자료예요. 엘니뇨와 라니냐가 나타난 해를 고르세요.');
  tools(); }});
function tools(){ const L = k.L(); let h = '';
  if (L.t === 'enso') Q.forEach(([q, ch], i) => { h += `<p style="margin:8px 0 4px"><b>${q}</b></p><div class="tools">` + ch.map(c => `<button class="tool" type="button" data-q="${i}" data-c="${c}" aria-pressed="${pick[i] === c}">${c}</button>`).join('') + '</div>'; });
  else [['엘니뇨', 0], ['라니냐', 1]].forEach(([n, i]) => { h += `<p style="margin:8px 0 4px"><b>${n}가 나타난 해</b></p><div class="tools">` + ['1년 차', '2년 차', '3년 차'].map(c => `<button class="tool" type="button" data-q="${i}" data-c="${c}" aria-pressed="${gpick[i] === c}">${c}</button>`).join('') + '</div>'; });
  ui.t.innerHTML = h; ui.t.querySelectorAll('button').forEach(b => b.onclick = () => { (L.t === 'enso' ? pick : gpick)[+b.dataset.q] = b.dataset.c; sfx.click(); tools(); }); }
app.onStart = () => { ui.g = app.panel('관측 과제'); ui.t = app.panel('예보'); ui.b = app.panel('');
  k.btn(ui.b, '📢 예보 발표', () => { const L = k.L();
    if (L.t === 'graph') { if (gpick.includes(null)) return k.fail('두 가지를 모두 고르세요'); if (gpick[0] !== '2년 차') return k.fail('엘니뇨: +0.5 ℃ 이상이 여러 달 이어진 해를 찾으세요'); if (gpick[1] !== '3년 차') return k.fail('라니냐: −0.5 ℃ 이하가 이어진 해를 찾으세요'); return k.win(ui.g, L.why); }
    if (pick.includes(null)) return k.fail('세 가지를 모두 고르세요');
    const a = ANS[L.s], wrong = pick.filter((p, i) => p !== a[i]).length; if (wrong) return k.fail(`${wrong}개가 틀렸어요 — 무역풍과 따뜻한 물의 위치를 다시 보세요`);
    k.win(ui.g, L.why, ST[L.s].n); });
  k.begin(); };
k.draw((g, W, H) => { const L = k.L(), t = performance.now() / 1000;
  if (L.t === 'graph') { g.fillStyle = '#f7f3ea'; g.fillRect(0, 0, W, H); const A = k.axes(g, {x: 56, y: 24, w: W - 80, h: H - 70}, [0, 36, 6], [-2, 3, 1], '개월', '수온 편차 (℃)');
    g.fillStyle = 'rgba(208,83,63,.1)'; g.fillRect(A.X(0), A.Y(3), A.X(36) - A.X(0), A.Y(.5) - A.Y(3)); g.fillStyle = 'rgba(47,111,208,.1)'; g.fillRect(A.X(0), A.Y(-.5), A.X(36) - A.X(0), A.Y(-2) - A.Y(-.5));
    [12, 24].forEach(m => { g.strokeStyle = '#888'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(A.X(m), A.Y(3)); g.lineTo(A.X(m), A.Y(-2)); g.stroke(); g.setLineDash([]); });
    ['1년 차', '2년 차', '3년 차'].forEach((n, i) => D.text(g, n, A.X(6 + i * 12), A.Y(2.75), {size: 13, weight: 700, color: '#34404e'}));
    k.line(g, IDX.map((v, i) => [A.X(i + .5), A.Y(v)]), '#c0762b', 3); D.text(g, '+0.5', A.X(36) - 4, A.Y(.5) - 8, {size: 11, color: '#d0533f', align: 'right'}); D.text(g, '−0.5', A.X(36) - 4, A.Y(-.5) + 10, {size: 11, color: '#2f6fd0', align: 'right'}); return; }
  const s = ST[L.s], hard = L.hard, top = H * .3, sea = H - 20, x0 = 30, x1 = W - 30, X = f => x0 + f * (x1 - x0);
  const sky = g.createLinearGradient(0, 0, 0, top); sky.addColorStop(0, '#cfe8f7'); sky.addColorStop(1, '#eef7fd'); g.fillStyle = sky; g.fillRect(0, 0, W, top);
  g.fillStyle = '#2f5d8a'; g.fillRect(0, top, W, sea - top);
  // 따뜻한 해수층 (서쪽이 두꺼움)
  const thick = f => Math.max(6, (sea - top) * (.42 * (1 - f) + .06) * (L.s === 'nino' ? .6 + .4 * f * 1.2 : L.s === 'nina' ? 1.15 : 1) + (L.s === 'nino' ? f * (sea - top) * .18 : 0));
  g.fillStyle = '#d65a3a'; g.beginPath(); g.moveTo(X(0), top); for (let f = 0; f <= 1.001; f += .02) g.lineTo(X(f), top + thick(f)); g.lineTo(X(1), top); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.7)'; g.setLineDash([6, 5]); g.lineWidth = 2; g.beginPath(); for (let f = 0; f <= 1.001; f += .02) g.lineTo(X(f), top + thick(f) + 6); g.stroke(); g.setLineDash([]); D.text(g, '수온약층', X(.5), top + thick(.5) + 18, {size: 11, color: '#e8f2ff'});
  // 용승
  const up = s.up * (hard ? .8 : 1); for (let i = 0; i < 4; i++) { const yy = sea - ((t * 30 * up + i * 40) % (sea - top - 10)); g.fillStyle = `rgba(160,210,255,${Math.min(1, .25 * up + .1)})`; g.beginPath(); g.arc(X(.93) + Math.sin(i) * 8, yy, 3 + up * 2, 0, 7); g.fill(); }
  D.text(g, '용승', X(.93), sea - 12, {size: 11, color: '#e8f2ff', weight: 700});
  // 무역풍
  const wl = (x1 - x0) * .13 * s.wind * (hard ? .9 : 1); for (let i = 0; i < 3; i++) { const xs = X(.8 - i * .28), ys = top * .45 + (i % 2) * 18; D.arrow(g, xs, ys, xs - wl, ys, '#2b2a26', 3); }
  D.text(g, '무역풍', X(.5), top * .2, {size: 13, weight: 700});
  // 땅·구름
  g.fillStyle = '#8a7a5a'; g.fillRect(0, top - 18, 26, 18); g.fillRect(W - 26, top - 18, 26, 18); D.text(g, '인도네시아', 30, top - 28, {size: 11, weight: 700, align: 'left'}); D.text(g, '페루', W - 30, top - 28, {size: 11, weight: 700, align: 'right'});
  const cx = X(L.s === 'nino' ? .55 : L.s === 'nina' ? .08 : .15); D.text(g, '☁️', cx, top * .62, {size: 34}); D.text(g, '☁️', cx + 30, top * .58, {size: 28});
  if (!hard) { const an = L.s === 'nino' ? '+2.1 ℃' : L.s === 'nina' ? '−1.3 ℃' : '0.0 ℃'; D.text(g, `동태평양 수온 편차 ${an}`, X(.78), top + 18, {size: 12, weight: 700, color: '#fff'}); }
  else D.text(g, '동태평양 수온 편차 +0.8 ℃', X(.78), top + 18, {size: 12, weight: 700, color: '#fff'});
  D.text(g, '서 ←  적도 태평양 단면  → 동', W / 2, H - 8, {size: 11, color: '#e8f2ff'});
});
</script>
