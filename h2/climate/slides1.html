# 대기 대순환과 해류 | 열을 나르는 지구의 컨베이어 벨트 | 고등학교 통합과학2 · 04 지구 환경 변화 · 1차시 | 2022 개정 교육과정 [10통과2-02-03]

= 오늘의 학습 목표 | 1차시
^ 위도에 따른 **에너지 불균형**과 열 수송의 필요성을 설명할 수 있다.
^ 지구 자전을 고려한 **대기 대순환**(3개의 순환, 지상풍)을 설명할 수 있다.
^ **표층 해류**가 대기 대순환과 어떻게 연결되는지 설명할 수 있다.
% 흐름: 생각 열기 5분 → 에너지 불균형 8분 → 대기 대순환(시뮬레이션) 15분 → 해류 7분 → 문항 10분

= 왜 적도는 계속 더워지지 않을까? | 생각 열기
* ☀️ 적도 :: 1년 내내 햇빛을 거의 수직으로 받는다
* 🧊 극지방 :: 햇빛을 비스듬히, 적게 받는다
* 🏜️ 사하라 사막 :: 위도 30° 부근에 큰 사막이 몰려 있다
* ⛵ 옛 범선 :: 무역풍을 타고 대서양을 건넜다
? 적도는 받는 에너지가 많은데 왜 끝없이 뜨거워지지 않을까? :: 대기와 바다가 남는 열을 **고위도로 운반**하기 때문 — 대기 대순환과 해류가 지구의 컨베이어 벨트!

= 이전에 배운 내용 떠올리기 | 복습
- 바람은 [[고기압]]에서 [[저기압]]으로 분다 (중3 날씨)
- 지구는 흡수한 만큼 방출하여 [[복사 평형]]을 이룬다
- 해류: 저위도 → 고위도 [[난류]], 고위도 → 저위도 [[한류]]
? 지구 전체는 복사 평형인데, 위도별로도 평형일까? :: 아니다. 저위도는 남고 고위도는 모자란다 — 그래서 열이 이동해야 한다.

## 에너지 불균형 | 남는 곳과 모자란 곳

= 위도에 따른 에너지 불균형
- 저위도: 흡수하는 태양 복사 에너지 ==>== 방출하는 지구 복사 에너지 → **에너지 과잉**
- 고위도: 흡수 ==<== 방출 → **에너지 부족**
>+ 대기와 해수가 열을 **저위도에서 고위도로** 운반하여 균형을 이룬다.

= 그래프로 보면 | 위도별 에너지
C 위도에 따른 흡수 에너지와 방출 에너지 (개략적 예시) | 위도 (°) | 에너지 (W/m²) | 흡수 (태양 복사):0,310 15,300 30,270 45,215 60,150 75,100 90,70 | 방출 (지구 복사):0,250 15,248 30,240 45,225 60,200 75,180 90,170
||
+ 두 선이 만나는 위도 약 [[38°]] 부근: 그보다 저위도는 남고 고위도는 모자란다.
% 값은 경향을 보여 주는 개략적 예시

## 대기 대순환 | 자전이 만든 3개의 고리

= 대기 대순환
! 지구 자전 → 반구마다 3개의 순환
| 위도 범위 | 순환 | 지상풍 |
|+ 0°~30° | 해들리 순환 | [[무역풍]] |
|+ 30°~60° | 페렐 순환 | [[편서풍]] |
|+ 60°~90° | 극순환 | [[극동풍]] |
>+ 우리나라(약 33°~38°N)는 **편서풍** 지대 → 날씨가 서쪽에서 동쪽으로 바뀐다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#circ | [지구가 자전하지 않는다면]과 [실제 지구]를 비교하고 위도별 기류·기압·날씨를 정리하자.
% 자전 없음 → 실제 순서로 비교. '하나의 큰 고리'가 '세 개의 고리'로 바뀌는 장면 강조

= 위도별 특징 | 시뮬레이션 기록
| 위도 | 기류 | 기압 | 날씨·지형 |
|+ 적도 (0°) | 상승 | [[저압대]] | 비가 많음 (열대 우림) |
|+ 30° | [[하강]] | 고압대 | 건조 ([[사막]]) |
|+ 60° | 상승 | 저압대 | 한대 전선, 비 |
|+ 극 (90°) | 하강 | 고압대 | 차고 건조 |

= 예제 1 · 사막이 30°에 많은 까닭 | 적용
^+ 적도에서 상승한 공기가 위도 30° 부근에서 **하강**한다 (해들리 순환).
^+ 하강하는 공기는 **단열 압축**으로 기온이 올라 상대 습도가 낮아진다.
^+ 구름이 생기기 어렵고 강수량이 적다 → **고압대, 사막**
>+ 사하라, 아라비아, 오스트레일리아 사막이 모두 위도 20°~30° 부근

= 예제 2 · 자전하지 않는 지구 | 적용
- 지구가 자전하지 않는다면 대기 순환은?
^+ 적도에서 데워진 공기가 **상승** → 고위도로 이동
^+ 극에서 식은 공기가 **하강** → 지표를 따라 적도로
^+ 반구마다 **하나의 커다란 순환**이 생긴다 (지상에서는 북풍만).

## 표층 해류 | 바람이 바다를 민다

= 표층 해류와 대기 대순환
- 표층 해류는 주로 지상의 ==바람==에 의해 생긴다.
| 바람 | 해류 |
|+ 무역풍 | 북적도 해류, 남적도 해류 (동 → 서) |
|+ 편서풍 | 북태평양 해류 (서 → 동) |
- 대륙에 막혀 돌며 **아열대 순환**을 이룬다 (북반구 시계 방향).
>+ 쿠로시오 해류: 저위도의 따뜻한 해수를 고위도로 운반 → 우리나라 기후를 **온화하게**

= 생활 속 대기 대순환 | 사례
* ✈️ 비행 시간 :: 편서풍 때문에 미국 → 한국보다 한국 → 미국이 빠르다
* ⛵ 무역풍 :: 대항해 시대 범선의 항로
* 🏜️ 30° 사막 :: 사하라, 아라비아, 오스트레일리아
* 🌧️ 열대 우림 :: 적도 저압대의 상승 기류와 많은 비
* 🌫️ 황사 :: 편서풍을 타고 중국 내륙에서 우리나라로
* 🧴 해양 쓰레기 섬 :: 아열대 순환 해류가 모은 쓰레기

= 확인 문제 1
Q 위도 30°~60°에서 부는 지상풍은?
o 무역풍
o* 편서풍
o 극동풍
o 계절풍
:: 페렐 순환의 지상풍은 편서풍이다.

= 확인 문제 2
Q 적도 부근의 특징으로 옳은 것은?
o 하강 기류, 고압대, 건조
o* 상승 기류, 저압대, 비가 많음
o 하강 기류, 저압대, 사막
o 상승 기류, 고압대, 맑음
:: 적도에서는 공기가 상승하여 저압대가 되고 구름과 비가 많다.

= 확인 문제 3
Q 표층 해류가 생기는 주된 원인은?
o 달의 인력
o 해저 지진
o* 지속적으로 부는 바람
o 강물의 유입
:: 무역풍·편서풍 같은 지상풍이 표층 해수를 밀어 해류를 만든다.

= 확인 문제 4
Q 위도별 에너지 불균형에 대한 설명으로 옳은 것은?
o 고위도는 에너지가 남는다
o* 대기와 해수가 열을 저위도에서 고위도로 운반한다
o 모든 위도에서 흡수량과 방출량이 같다
o 저위도는 방출이 흡수보다 많다
:: 저위도의 과잉 에너지를 대기와 해수가 고위도로 운반한다.

= 서술형 도전 | 생각 넓히기
? 세계의 큰 사막이 위도 30° 부근에 많은 까닭을 쓰시오. :: 해들리 순환의 하강 기류가 나타나 고압대가 형성되어 구름이 생기기 어렵고 강수량이 적기 때문이다.
? 대기 대순환과 해류가 없다면 지구의 위도별 기온 분포는 어떻게 될지 예상하시오. :: 저위도는 지금보다 훨씬 뜨거워지고 고위도는 훨씬 추워져, 위도에 따른 기온 차가 매우 커질 것이다.

= 오늘 배운 내용 정리
- 저위도 에너지 [[과잉]], 고위도 에너지 [[부족]] → 대기·해수가 열 수송
- 반구마다 3개의 순환: 해들리, [[페렐]], 극순환
- 지상풍: 0°~30° [[무역풍]], 30°~60° [[편서풍]], 60°~90° 극동풍
- 30° 부근 하강 기류 → [[고압대]] → 사막
- 표층 해류는 주로 [[바람]]에 의해 생긴다.

= 나가기 전 한 문제 | 형성평가
? 우리나라가 속한 대기 순환과 지상풍을 쓰고, 그 때문에 나타나는 날씨의 특징을 한 가지 쓰시오. :: 페렐 순환, 편서풍. 날씨가 대체로 서쪽에서 동쪽으로 변하고, 황사가 중국에서 우리나라로 날아온다.
