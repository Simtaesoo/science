= 지난 시간 복습 | 1차시
- 0°~30°의 지상풍 → [[무역풍]] (동 → 서)

## 평상시 적도 태평양 | 무역풍이 만든 균형

= 평상시
^+ **무역풍**이 따뜻한 표층 해수를 서쪽(인도네시아)으로 이동시킨다.
^+ 서태평양: 따뜻한 해수 → 상승 기류 → **비가 많다.**
^+ 동태평양(페루): 빈자리를 채우려 깊은 곳의 찬 해수가 올라온다 → **용승**
^+ 용승한 찬 물은 영양염이 풍부 → 플랑크톤 → **좋은 어장**

## 엘니뇨와 라니냐 | 무역풍의 세기가 바뀌면

= 엘니뇨와 라니냐
| 구분 | 엘니뇨 | 라니냐 |
|+ 무역풍 | [[약해짐]] | [[강해짐]] |
|+ 동태평양 표층 수온 | 평년보다 [[높음]] | 평년보다 [[낮음]] |
|+ 페루 용승 | 약함 | 강함 |
|+ 비가 많은 곳 | 동태평양(페루) | 서태평양(인도네시아) |
>+ 대기(바람)와 해양(수온)이 서로 영향을 주고받는 **상호작용**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#enso | 무역풍 세기를 0.3, 1, 1.7로 바꾸며 따뜻한 해수의 위치와 비가 오는 곳을 기록하자.
% 1 → 0.3 → 1.7 순서. 따뜻한 해수 덩어리와 구름이 함께 움직이는 것에 주목

= 무역풍 세기에 따른 변화 | 시뮬레이션 기록
| 구분 | 엘니뇨 (0.3) | 평상시 (1) | 라니냐 (1.7) |
|+ 따뜻한 해수 위치 | 중앙~동태평양 | 서태평양 | 서태평양 끝 |
|+ 동태평양 수온 | 높음 | 보통 | 낮음 |
|+ 페루 용승 | [[약함]] | 보통 | [[강함]] |
|+ 비가 많이 오는 곳 | [[동태평양]] | 서태평양 | [[서태평양]] |

= 예제 1 · 수온 편차로 판단하기 | 자료 해석
- 동태평양 감시 해역의 월별 표층 수온 편차(평년과의 차이). 편차가 +0.5 ℃ 이상인 상태가 5개월 이상 이어지면 엘니뇨로 본다. (예시 자료)
| 월 | 5 | 6 | 7 | 8 | 9 | 10 | 11 | 12 |
| 편차 (℃) | +0.2 | +0.4 | +0.6 | +0.9 | +1.1 | +1.4 | +1.6 | +1.5 |
^+ +0.5 ℃ 이상이 시작된 달: **7월**
^+ 7월~11월로 **5개월** 이상 지속 → **엘니뇨** 발생
^+ 무역풍이 **약해진** 상태로 해석할 수 있다.

= 그래프로 보면 | 수온 편차
C 동태평양 표층 수온 편차 (예시 자료) | 월 | 편차 (℃) | 수온 편차:5,0.2 6,0.4 7,0.6 8,0.9 9,1.1 10,1.4 11,1.6 12,1.5 | 기준선 +0.5:5,0.5 12,0.5
~ 기준선(+0.5 ℃)을 넘는 구간이 5개월 이상 이어지는지 확인한다.

= 예제 2 · 페루의 어획량 | 적용
- 라니냐 시기에 페루 연안 어획량은 어떻게 변할까?
^+ 무역풍이 **강해진다.**
^+ 동태평양의 용승이 **활발해진다** → 영양염 증가
^+ 플랑크톤 증가 → 물고기 증가 → 어획량 **증가**
>+ 엘니뇨 때는 반대로 용승이 약해져 어획량이 **감소**한다.

= 엘니뇨·라니냐의 영향 | 사례
* 🔥 인도네시아·호주 :: 엘니뇨 때 가뭄과 산불
* 🌧️ 페루·에콰도르 :: 엘니뇨 때 홍수
* 🐟 페루 멸치 어업 :: 엘니뇨 때 어획량 급감
* 🌀 태풍 :: 발생 위치와 경로가 달라진다
* 🌾 세계 곡물 가격 :: 주요 산지의 가뭄·홍수로 출렁인다
* 🇰🇷 우리나라 :: 엘니뇨 해 여름철 강수량 변화 등 간접 영향

= 확인 문제 1
Q 엘니뇨 시기의 특징으로 옳은 것은?
o 무역풍이 강해진다
o* 동태평양 표층 수온이 평년보다 높다
o 페루 연안의 용승이 강해진다
o 서태평양에 비가 더 많이 온다
:: 무역풍이 약해져 따뜻한 해수가 동쪽으로 퍼지고 용승이 약해진다.

= 확인 문제 2
Q 평상시 페루 연안이 좋은 어장인 까닭은?
o 따뜻한 해수가 모여서
o* 용승으로 영양염이 풍부한 찬 해수가 올라와서
o 강물이 많이 흘러들어서
o 비가 많이 와서
:: 용승한 물에 영양염이 풍부해 플랑크톤이 많고 물고기가 모인다.

= 확인 문제 3
Q 라니냐 시기에 비가 많이 오는 곳은?
o 동태평양(페루)
o 중앙 태평양
o* 서태평양(인도네시아)
o 남극 해
:: 무역풍이 강해 따뜻한 해수가 서쪽 끝에 모이고 상승 기류도 서쪽에 강해진다.

= 확인 문제 4
Q 엘니뇨와 라니냐가 '대기와 해양의 상호작용'이라고 하는 까닭은?
o 해양만 변하기 때문
o 대기만 변하기 때문
o* 바람의 변화가 수온을 바꾸고, 수온 변화가 다시 기압과 바람을 바꾸기 때문
o 지진이 원인이기 때문
:: 바람과 바다가 서로의 변화를 키우거나 되돌리며 함께 변한다.

= 확인 문제 5 · 자료 해석
Q 동태평양 표층 수온 편차가 −0.5 ℃ 이하로 5개월 넘게 이어졌다. 이 시기의 상태와 무역풍으로 옳은 것은?
o 엘니뇨 — 무역풍 약화
o* 라니냐 — 무역풍 강화
o 엘니뇨 — 무역풍 강화
o 평상시 — 변화 없음
:: 동태평양 수온이 평년보다 낮은 상태가 이어지면 라니냐이며, 무역풍이 강해진 상태이다.

= 서술형 도전 | 생각 넓히기
? 엘니뇨 시기에 인도네시아와 호주에서 산불 피해가 커지는 까닭을 쓰시오. :: 따뜻한 해수가 동쪽으로 이동하며 상승 기류와 비구름도 동쪽으로 옮겨 가 서태평양 지역에 가뭄이 들기 때문이다.
? 엘니뇨를 미리 예측할 수 있다면 어떤 분야에 도움이 될지 두 가지 쓰시오. :: 농업(작물 선택·물 관리), 수산업(어획 계획), 재해 대비(홍수·가뭄), 에너지 수요 예측, 감염병 예방 등

= 오늘 배운 내용 정리
- 평상시: [[무역풍]]이 따뜻한 해수를 서쪽으로, 동태평양은 [[용승]]
- 무역풍 약화 → 동태평양 수온 상승 → [[엘니뇨]]
- 무역풍 강화 → 동태평양 수온 하강 → [[라니냐]]
- 엘니뇨·라니냐는 대기와 해양의 [[상호작용]]으로 일어나 전 지구 기상 이변의 원인이 된다.
