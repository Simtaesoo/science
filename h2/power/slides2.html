# 발전기와 전자기 유도 | 움직임을 전기로 바꾸다 | 고등학교 통합과학2 · 05 에너지와 발전 · 2차시 | 2022 개정 교육과정 [통과2 Ⅱ]

= 오늘의 학습 목표 | 2차시
^ **전자기 유도**와 **유도 전류**를 설명할 수 있다.
^ **발전기**의 원리와 유도 전압을 크게 하는 조건을 설명할 수 있다.
^ 여러 **발전 방식**의 에너지 전환 과정과 장단점을 비교할 수 있다.
% 흐름: 생각 열기 5분 → 전자기 유도 8분 → 발전기 돌리기(시뮬레이션) 12분 → 계산·교류 10분 → 발전 방식 비교·문항 10분

= 손으로 돌리는 손전등 | 생각 열기
* 🔦 핸들 손전등 :: 손잡이를 돌리면 불이 켜진다
* 🚲 자전거 발전기 :: 바퀴가 돌면 전조등이 켜진다
* 🌬️ 풍력 발전기 :: 날개가 돌며 전기를 만든다
* 🌊 수력 발전소 :: 떨어지는 물이 터빈을 돌린다
? 손잡이를 '돌리는 운동'이 어떻게 '전기'가 될까? :: 코일 근처에서 **자석이 움직이면** 코일에 전류가 흐른다 — 전자기 유도. 거의 모든 발전소가 이 원리를 쓴다.

= 지난 시간 복습 | 1차시 · 중2
- 효율 = 유용한 에너지 ÷ [[공급 에너지]] × 100
- 전류가 흐르는 코일 주위에는 [[자기장]]이 생긴다 (중2 전기와 자기)
- 전동기: 전기 에너지 → [[운동 에너지]]
? 전동기는 전기로 회전을 만든다. 거꾸로 회전으로 전기를 만들 수 있을까? :: 있다 — 그것이 **발전기**다.

## 전자기 유도 | 자기장이 변하면 전류가 흐른다

= 전자기 유도
! 전자기 유도: 코일을 지나는 자기장이 변할 때 코일에 전류가 흐르는 현상
- 이때 흐르는 전류 → **유도 전류**
- 자석을 **움직일 때만** 흐른다 (멈추면 0)
- 자석을 넣을 때와 뺄 때 전류의 **방향이 반대**
>+ 핵심은 '자석이 있다'가 아니라 '자기장이 **변한다**'

= 발전기
! 발전기: 자석이나 코일을 회전시켜 전자기 유도로 전기를 만드는 장치
- 에너지 전환: ==운동 에너지 → 전기 에너지==
- 유도 전압이 커지는 조건: 자석이 **셀수록**, 코일을 **많이** 감을수록, **빠르게** 회전할수록
- 만들어지는 전류: 방향과 세기가 주기적으로 바뀌는 ==교류==

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#gen | 회전 속도, 코일 감은 수, 자석 세기를 하나씩 바꾸며 최대 유도 전압을 기록하자.
% 변인 통제: 한 번에 하나만 바꾸도록 지도

= 유도 전압 | 시뮬레이션 기록
| 회전 속도 | 감은 수 | 자석 | 최대 유도 전압 (상대값) |
|+ 1 회/s | 200 | 약함 | 2.0 |
|+ 2 회/s | 200 | 약함 | [[4.0]] |
|+ 1 회/s | 400 | 약함 | [[4.0]] |
|+ 1 회/s | 200 | 강함 | [[4.0]] |
>+ 회전 속도, 감은 수, 자석 세기가 각각 2배 → 유도 전압 **2배**

= 예제 1 · 모두 2배로 | 적용
- 회전 속도 2 회/s, 감은 수 400, 강한 자석으로 바꾸었다. (기준: 1 회/s, 200, 약함 → 2.0)
^+ 회전 속도 2배 → × 2
^+ 감은 수 2배 → × 2
^+ 자석 세기 2배 → × 2
^+ 최대 유도 전압 = 2.0 × 2 × 2 × 2 = **16.0**

= 교류 | 그래프
C 발전기의 유도 전압 (모형) | 시간 (s) | 전압 (상대값) | 1 회/s:0,0 0.25,2 0.5,0 0.75,-2 1,0 | 2 회/s:0,0 0.125,4 0.25,0 0.375,-4 0.5,0 0.625,4 0.75,0 0.875,-4 1,0
+ 1 회전마다 전압의 방향이 한 번씩 바뀐다 → [[교류]]
+ 빠르게 돌리면 최대 전압이 [[커지고]], 방향도 더 [[자주]] 바뀐다.
% 실제 곡선은 사인 곡선이며, 여기서는 꼭짓점만 이어 단순화

= 확인 문제 1
Q 유도 전류가 흐르지 않는 경우는?
o 자석을 코일 속에 넣을 때
o 자석을 코일에서 뺄 때
o* 자석을 코일 속에 넣고 가만히 둘 때
o 코일을 자석 앞에서 움직일 때
:: 자기장이 변하지 않으면 유도 전류가 흐르지 않는다.

## 발전 방식 | 무엇이 터빈을 돌리나

= 발전 방식과 에너지 전환
| 발전 방식 | 에너지 전환 | 장점 | 단점 |
|+ 화력 | 화학 → 열 → 운동 → 전기 | 안정적 공급 | 온실 기체, 대기 오염 |
|+ 원자력 | 핵 → 열 → 운동 → 전기 | 적은 연료로 많은 전기 | 방사성 폐기물 |
|+ 수력 | 위치 → 운동 → 전기 | 오염 물질 없음 | 지역 한정, 생태계 변화 |
|+ 태양광 | 빛 → 전기 | 고갈 없음 | 날씨·밤에 영향 |
>+ 태양광만 **발전기(터빈)를 쓰지 않고** 태양 전지가 빛을 직접 전기로 바꾼다.

= 예제 2 · 수력 발전 | 적용
- 높이 50 m에서 물 1000 kg이 떨어져 발전기를 돌린다. 효율이 80 %이면 얻는 전기 에너지는?
^+ 물의 위치 에너지 = 9.8 × 1000 × 50 = **490 000 J**
^+ 전기 에너지 = 490 000 × 0.8 = **392 000 J**
^+ 1초마다 이만큼의 물이 떨어지면 전력 약 **392 kW**

= 생활 속 전자기 유도 | 사례
* 🔦 핸들 손전등 :: 돌리는 운동 → 전기
* 💳 교통 카드 :: 단말기의 변하는 자기장으로 카드에 전류 유도
* 📱 무선 충전 :: 코일 사이의 전자기 유도
* 🍳 인덕션 :: 바닥 냄비에 유도 전류가 흘러 열 발생
* 🎸 전기 기타 :: 줄의 진동이 픽업 코일에 전류를 만든다
* 🚗 회생 제동 :: 바퀴의 회전으로 발전해 배터리 충전

= 확인 문제 2
Q 발전기의 유도 전압을 크게 하는 방법이 아닌 것은?
o 더 센 자석을 사용한다
o 코일을 더 많이 감는다
o 더 빠르게 회전시킨다
o* 코일을 가만히 둔다
:: 자기장의 변화가 없으면 유도 전압이 생기지 않는다.

= 확인 문제 3
Q 수력 발전의 에너지 전환 과정으로 옳은 것은?
o 화학 → 열 → 전기
o* 위치 → 운동 → 전기
o 빛 → 전기
o 핵 → 열 → 운동 → 전기
:: 높은 곳 물의 위치 에너지가 운동 에너지로, 발전기에서 전기 에너지로 바뀐다.

= 확인 문제 4
Q 기준 조건에서 최대 유도 전압이 2.0일 때, 회전 속도만 3배로 하면?
o 2.0
o 4.0
o* 6.0
o 18.0
:: 회전 속도에 비례 → 2.0 × 3 = 6.0

= 서술형 도전 | 생각 넓히기
? 태양광 발전이 다른 발전 방식과 다른 점을 발전기와 관련지어 쓰시오. :: 터빈과 발전기를 사용하지 않고 태양 전지가 빛에너지를 직접 전기 에너지로 전환한다.
? 자전거 바퀴의 발전기로 전등을 켜면 페달이 조금 더 무거워지는 까닭을 쓰시오. :: 에너지 보존 법칙에 따라 전등의 전기 에너지는 페달을 밟는 운동 에너지에서 나오므로, 전기를 쓸수록 더 많은 일을 해야 한다(유도 전류가 회전을 방해하는 방향으로 작용).

= 오늘 배운 내용 정리
- 코일을 지나는 자기장이 변할 때 전류가 흐름 → [[전자기 유도]], 그 전류 → [[유도 전류]]
- 발전기: [[운동 에너지]] → 전기 에너지
- 유도 전압 ↑: 자석 [[세게]], 감은 수 [[많이]], 회전 [[빠르게]]
- 발전기가 만드는 전류 → [[교류]]
- 태양광은 발전기 없이 빛 → 전기

= 나가기 전 한 문제 | 형성평가
? 풍력 발전의 에너지 전환 과정을 쓰고, 바람이 약한 날 발전량이 줄어드는 까닭을 전자기 유도로 설명하시오. :: 바람의 운동 에너지 → 날개·발전기의 회전 운동 에너지 → 전기 에너지. 바람이 약하면 회전 속도가 느려 코일을 지나는 자기장의 변화가 느리므로 유도 전압이 작아진다.
