# 전력 수송과 손실 | 높은 전압으로 보내는 까닭 | 고등학교 통합과학2 · 05 에너지와 발전 · 3차시 | 2022 개정 교육과정 [통과2 Ⅱ]

= 오늘의 학습 목표 | 3차시
^ 발전소에서 가정까지 **전력이 수송되는 과정**을 설명할 수 있다.
^ **송전 전압**과 **손실 전력**의 관계를 식으로 설명할 수 있다.
^ **변압기**의 역할과 송전 손실을 줄이는 방법을 제시할 수 있다.
% 흐름: 생각 열기 5분 → 전력과 손실 10분 → 송전 전압(시뮬레이션) 12분 → 계산·변압기 10분 → 문항 8분

= 거대한 철탑의 전선에는 몇 볼트가? | 생각 열기
* 🗼 송전 철탑 :: 산과 들을 가로지르는 거대한 철탑
* ⚡ 765 kV :: 우리나라에서 가장 높은 송전 전압
* 🔌 우리 집 콘센트 :: 220 V
* 🛢️ 전봇대 위 원통 :: 주상 변압기
? 왜 위험하게 수십만 볼트로 전기를 보낼까? :: 전압을 높이면 같은 전력을 **작은 전류**로 보낼 수 있고, 전선에서 **열로 잃는 전력**이 크게 줄어들기 때문이다.

= 지난 시간 복습 | 2차시 · 중2
- 발전기가 만드는 전류 → [[교류]]
- 전력 = 전압 × [[전류]] (중2)
- 전류가 흐르는 전선은 저항 때문에 [[열]]이 난다.
? 같은 전력 100 W를 보내는데 전압이 10 V면 전류는? 100 V면? :: 10 A, 1 A — 전압이 10배면 전류는 1/10

## 전력과 손실 | P = VI, P손실 = I²R

= 송전과 전력 손실
! 전력 P = V × I (단위 W)
- 같은 전력을 보낼 때 전압이 높으면 전류가 ==작다.==
! 송전선에서 열로 손실되는 전력 P손실 = I²R
>+ 전압 2배 → 전류 ½배 → 손실 전력 (½)² = **¼배**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#grid | 100 MW를 보낼 때 송전 전압을 바꾸며 전류와 손실 비율을 기록하자. (송전선 2가닥, 각 저항 10 Ω)
% 전압을 66 → 765 kV로 올리며 손실 비율이 급격히 줄어드는 것을 확인

= 송전 전압과 손실 | 시뮬레이션 기록
| 송전 전압 | 66 kV | 154 kV | 345 kV | 765 kV |
|+ 전류 (A) | 1515 | 649 | [[290]] | [[131]] |
|+ 손실 비율 (%) | 45.9 | 8.43 | [[1.68]] | [[0.34]] |
||
C 송전 전압에 따른 손실 비율 (100 MW, 전선 저항 합 20 Ω) | 송전 전압 (kV) | 손실 비율 (%) | 손실 비율:66,45.9 154,8.43 345,1.68 765,0.34

= 예제 1 · 154 kV로 보낼 때 | 적용
- 100 MW를 154 kV로 보낸다. 송전선 2가닥의 저항 합은 20 Ω이다.
^+ 전류 I = P ÷ V = 100 000 000 ÷ 154 000 ≈ **649 A**
^+ 손실 전력 = I²R = 649² × 20 ≈ **8 420 000 W ≈ 8.4 MW**
^+ 손실 비율 = 8.4 ÷ 100 × 100 ≈ **8.4 %** ✔

= 예제 2 · 전압을 2배로 | 적용
- 송전 전압을 154 kV에서 308 kV로 높이면 손실 전력은?
^+ 전압 2배 → 전류 **½배** (같은 전력)
^+ 손실 전력 ∝ I² → (½)² = **¼배**
^+ 약 8.4 MW → 약 **2.1 MW**

= 확인 문제 1
Q 같은 전력을 송전할 때 송전 전압을 3배로 높이면 손실 전력은 몇 배가 되는가?
o 3배
o 1/3배
o* 1/9배
o 9배
:: 전류가 1/3배 → 손실 전력 ∝ I² → 1/9배

## 변압기와 전력망 | 높였다가 낮추기

= 변압기와 전력 수송 과정
! 변압기: 전자기 유도를 이용해 교류 전압을 바꾸는 장치
^+ 발전소 → 변전소에서 전압 **높임** (154~765 kV)
^+ 송전선으로 먼 거리 수송 (손실 ↓)
^+ 변전소에서 전압 **낮춤** → 배전선 (22.9 kV)
^+ 주상 변압기에서 220 V로 낮춰 **가정**에 공급
>+ 변압기는 **교류**에서만 작동 → 발전소가 교류를 만드는 까닭

= 예제 3 · 주상 변압기 | 적용
- 변압기에서 전압의 비 = 코일 감은 수의 비 (V₁ : V₂ = N₁ : N₂)
- 22 900 V를 220 V로 낮추려면 1차·2차 코일 감은 수의 비는?
^+ N₁ : N₂ = 22 900 : 220
^+ 22 900 ÷ 220 ≈ **104**
^+ 1차 코일을 2차 코일보다 약 **104배** 많이 감는다.

= 생활 속 전력 수송 | 사례
* 🗼 765 kV 송전탑 :: 대규모 발전소의 전력을 멀리 보낸다
* 🛢️ 주상 변압기 :: 전봇대 위에서 220 V로 낮춘다
* 🔌 휴대전화 충전기 :: 220 V를 5~20 V 정도로 낮춘다
* 🏙️ 분산형 전원 :: 소비지 가까이 발전해 송전 거리를 줄인다
* 🌐 스마트 그리드 :: 생산·소비 정보를 실시간으로 주고받는다
* 🧊 초전도 송전 :: 저항이 0인 전선 연구

= 확인 문제 2
Q 송전 손실을 줄이는 방법으로 알맞지 않은 것은?
o 송전 전압을 높인다
o 저항이 작은 굵은 전선을 쓴다
o 발전소를 소비지 가까이에 짓는다
o* 송전 전류를 크게 한다
:: 손실 전력은 전류의 제곱에 비례하므로 전류를 크게 하면 손실이 커진다.

= 확인 문제 3
Q 가정에서 높은 송전 전압을 220 V로 낮추어 쓰는 까닭은?
o 손실을 늘리기 위해
o* 높은 전압은 감전 위험이 크고 가전제품이 견디지 못하므로
o 전류를 줄이기 위해
o 직류로 바꾸기 위해
:: 안전하게 사용할 수 있는 전압으로 낮춘다.

= 확인 문제 4
Q 1차 코일 1000회, 2차 코일 50회인 변압기에 2200 V를 걸면 2차 전압은?
o 44 V
o* 110 V
o 220 V
o 44 000 V
:: V₂ = 2200 × 50 ÷ 1000 = 110 V

= 확인 문제 5
Q 같은 전력을 보낼 때 송전 전압을 그대로 두고 전선의 저항만 절반으로 줄이면 손실 전력은?
o 그대로
o* ½배
o ¼배
o 2배
:: 전류는 그대로이고 P손실 = I²R에서 R이 ½배 → 손실도 ½배

= 서술형 도전 | 생각 넓히기
? 발전소에서 전압을 매우 높여 송전하는 까닭을 '전류'와 '손실 전력'을 넣어 쓰시오. :: 같은 전력을 보낼 때 전압을 높이면 전류가 작아지고, 송전선의 손실 전력은 전류의 제곱에 비례하므로 손실이 크게 줄어들기 때문이다.
? 미래의 전력망(스마트 그리드)이 해결할 수 있는 문제를 쓰시오. :: 전력 생산과 소비 정보를 실시간으로 주고받아 낭비를 줄이고, 날씨에 따라 변하는 재생 에너지를 저장·분배하여 효율적으로 사용할 수 있다.

= 오늘 배운 내용 정리
- 전력 P = [[V × I]], 같은 전력이면 전압 ↑ → 전류 [[↓]]
- 송전선의 손실 전력 = [[I²R]]
- 전압 2배 → 전류 ½배 → 손실 [[¼]]배
- 교류 전압을 바꾸는 장치 → [[변압기]] (V₁ : V₂ = N₁ : N₂)
- 발전소 → 전압 [[높임]] → 송전 → 전압 낮춤 → 가정 220 V

= 나가기 전 한 문제 | 형성평가
? 100 MW를 345 kV로 보낼 때의 전류를 구하고, 같은 전력을 765 kV로 보낼 때 손실 전력이 몇 분의 1쯤 되는지 어림하시오. :: I = 100 000 000 ÷ 345 000 ≈ 290 A. 전압이 약 765 ÷ 345 ≈ 2.2배 → 손실은 약 (1/2.2)² ≈ 1/5 (표: 1.68 % → 0.34 %)
