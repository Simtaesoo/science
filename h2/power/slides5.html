# 발전소와 신재생 에너지 | 지속가능한 전기를 찾아서 | 고등학교 통합과학2 · 05 에너지와 발전 · 4차시 | 2022 개정 교육과정 [10통과2-02-05] [10통과2-02-06]

= 오늘의 학습 목표 | 4차시
^ 화석 연료와 핵에너지를 열원으로 쓰는 **발전소**의 에너지 전환 과정과 인간 생활에 미치는 **영향**을 설명할 수 있다.
^ 태양광, 풍력 등 **신재생 에너지** 기술의 원리와 장단점을 비교할 수 있다.
^ 지속가능한 발전을 위한 **에너지 활용 방안**을 근거를 들어 제안할 수 있다.
% 흐름: 생각 열기 5분 → 화력·원자력 발전소 10분 → 신재생 에너지 12분 → 모둠 조사·발표 준비 13분 → 문항 5분
% 2022 개정 [10통과2-02-05] 화석 연료·핵에너지 발전소가 인간 생활에 미치는 영향을 조사·발표, [10통과2-02-06] 신재생 에너지 기술을 활용하는 방안 탐색. 특정 발전 방식의 찬반을 강요하지 말고 근거(자료)를 들어 비교하게 한다.

= 우리 집 전기는 어디서 왔을까? | 생각 열기
* 🏭 화력 발전소 :: 석탄·천연가스를 태워 물을 끓인다
* ⚛️ 원자력 발전소 :: 우라늄의 핵분열로 물을 끓인다
* ☀️ 지붕 위 태양광 :: 햇빛을 바로 전기로 바꾼다
* 🌬️ 바다 위 풍력 단지 :: 바람으로 날개를 돌린다
? 화력·원자력 발전소와 수력·풍력 발전소의 공통점은? :: 모두 **발전기의 터빈을 돌려** 전기를 만든다. 무엇으로 터빈을 돌리는지(증기, 물, 바람)가 다를 뿐이다. 태양광 발전은 터빈 없이 빛을 바로 전기로 바꾼다.

= 지난 시간 복습 | 2·4차시
- 자석과 코일의 상대 운동으로 전류가 생기는 현상 → [[전자기 유도]]
- 발전기: [[운동]] 에너지 → 전기 에너지
- 지구 에너지원 대부분의 근원 → [[태양]] 에너지
? 발전소에서 버려지는 에너지는 주로 어떤 형태일까? :: 냉각수와 굴뚝으로 빠져나가는 **열에너지**이다.

## 열원을 쓰는 발전소 | 물을 끓여 터빈을 돌린다

= 화력 발전과 원자력 발전
| 구분 | 화력 발전 | 원자력 발전 |
|+ 열원 | 화석 연료의 [[연소]] | 우라늄의 [[핵분열]] |
|+ 에너지 전환 | 화학 → 열 → 운동 → 전기 | 핵 → 열 → 운동 → 전기 |
|+ 장점 | 발전량 조절이 비교적 쉬움 | 온실 기체 배출이 적음, 적은 연료로 많은 전기 |
|+ 문제점 | 온실 기체·미세 먼지 배출, 연료 고갈 | 방사성 폐기물 처리, 사고 시 큰 피해 |
>+ 두 발전소 모두 열의 상당 부분이 냉각수와 대기로 **버려진다** → 효율의 한계

= 발전소가 인간 생활에 미치는 영향 | 자료 해석
* 🌡️ 기후 :: 화석 연료 발전은 대기 중 이산화 탄소를 늘린다
* 😷 건강 :: 미세 먼지·황산화물·질소 산화물 배출
* 🌊 바다 :: 따뜻한 냉각수가 주변 바다의 수온을 올린다(온배수)
* ☢️ 안전 :: 방사성 폐기물을 오랫동안 안전하게 보관해야 한다
* 🏙️ 생활 :: 값싸고 안정적인 전기는 산업·의료·교통을 가능하게 했다
? 발전소의 영향을 평가할 때 고려해야 할 기준을 세 가지 쓰시오. :: (예) 온실 기체 배출량, 안전성, 발전 비용, 안정적인 공급 가능성, 주변 환경과 주민에게 미치는 영향 등

## 신재생 에너지 | 고갈되지 않는 에너지

= 신재생 에너지의 종류
| 에너지 | 원리 | 장점 | 한계 |
|+ 태양광 | 태양 전지가 빛 → 전기 | 연료 불필요, 설치 쉬움 | 밤·흐린 날 발전 불가 |
|+ 풍력 | 바람이 날개를 돌려 발전기 회전 | 온실 기체 거의 없음 | 바람에 따라 들쭉날쭉, 소음 |
|+ 수력 | 높은 곳 물의 위치 에너지 | 발전량 조절 쉬움 | 댐 건설로 생태계 변화 |
|+ 지열 | 땅속 열로 물을 데움 | 날씨와 무관 | 쓸 수 있는 지역이 제한 |
|+ 조력 | 밀물·썰물의 높이 차 | 예측 가능 | 갯벌 생태계에 영향 |
|+ 수소·연료 전지 | 수소와 산소의 반응 → 전기 | 물만 생성 | 수소를 만드는 데 에너지 필요 |
~ 신에너지(수소, 연료 전지 등) + 재생 에너지(태양, 바람, 물, 지열 등) = 신재생 에너지

= 예제 1 · 하루 발전량 그래프 읽기 | 자료 해석
C 맑은 날 태양광 발전량 (상대값, 예시) | 시각 (시) | 발전량 | 태양광:0,0 6,5 8,30 10,70 12,100 14,85 16,45 18,10 20,0
^+ 낮 12시 무렵 가장 많고 **밤에는 0**이다.
^+ 전기는 밤에도 필요하므로 **에너지 저장 장치(ESS)**나 다른 발전과 함께 써야 한다.
>+ 신재생 에너지의 약점(들쭉날쭉함)을 보완하는 기술: 저장 장치, 스마트 그리드, 여러 에너지의 조합

= 예제 2 · 우리 지역에 맞는 발전 | 적용
- 바람이 강한 바닷가, 햇빛이 좋은 넓은 평지, 조수 간만의 차가 큰 서해안이 있다.
^+ 바닷가 → **해상 풍력**
^+ 넓은 평지·건물 지붕 → **태양광**
^+ 서해안 → **조력**
>+ 지역의 자연환경과 주민의 생활을 함께 고려해야 지속가능하다.

= 에너지를 효율적으로 쓰는 노력 | 사례
* 💡 LED 조명 :: 같은 밝기에 전기를 훨씬 적게 쓴다
* 🏠 패시브 하우스 :: 단열을 강화해 냉난방 에너지를 줄인다
* ♨️ 열병합 발전 :: 발전하고 버려지는 열로 지역 난방
* 🚗 전기차·하이브리드차 :: 제동 에너지를 다시 전기로 저장
* 🔌 대기 전력 차단 :: 쓰지 않는 기기의 플러그를 뽑는다

= 확인 문제 1
Q 화력 발전과 원자력 발전의 공통점으로 옳은 것은?
o 온실 기체를 많이 배출한다
o 연료를 연소시킨다
o* 열로 물을 끓여 증기로 터빈을 돌린다
o 방사성 폐기물이 생긴다
:: 열원은 다르지만 모두 증기로 터빈을 돌리고 발전기로 전기를 만든다.

= 확인 문제 2
Q 태양광 발전의 한계를 보완하는 방법으로 가장 알맞은 것은?
o 발전소를 모두 화력 발전으로 바꾼다
o* 에너지 저장 장치에 낮의 전기를 저장해 밤에 쓴다
o 태양 전지를 그늘에 설치한다
o 밤에도 조명을 켜서 발전한다
:: 낮에 남는 전기를 저장해 두었다가 발전량이 없을 때 사용한다.

= 확인 문제 3
Q 재생 에너지가 아닌 것은?
o 풍력
o 지열
o 조력
o* 천연가스
:: 천연가스는 화석 연료로, 고갈되고 연소할 때 이산화 탄소를 배출한다.

= 모둠 조사·발표 | 프로젝트
^ 모둠별로 발전 방식 하나(화력, 원자력, 태양광, 풍력 등)를 맡는다.
^ 에너지 전환 과정, 온실 기체, 안전성, 비용, 생활에 미치는 영향을 **자료(출처 포함)**로 조사한다.
^ 우리 지역에 맞는 에너지 조합을 제안하고 근거를 들어 발표한다.
% 발표 평가 기준: 자료의 출처와 신뢰성, 장단점의 균형 있는 제시, 근거와 주장의 연결

= 서술형 도전 | 생각 넓히기
? 원자력 발전이 지구 온난화 대응에 도움이 된다는 주장과 우려된다는 주장의 근거를 각각 한 가지씩 쓰시오. :: 도움: 발전 과정에서 온실 기체 배출이 매우 적다. 우려: 방사성 폐기물을 오랫동안 안전하게 보관해야 하고 사고가 나면 피해가 크다.
? 신재생 에너지만으로 전기를 공급하기 어려운 까닭과 해결 방안을 쓰시오. :: 날씨와 시간에 따라 발전량이 크게 변해 공급이 불안정하다. 에너지 저장 장치, 여러 신재생 에너지의 조합, 지능형 전력망 등으로 보완할 수 있다.

= 오늘 배운 내용 정리
- 화력·원자력 발전: 열로 물을 끓여 [[터빈]]을 돌린다 — 열의 상당 부분이 버려진다
- 화력: 온실 기체·미세 먼지 / 원자력: [[방사성 폐기물]]·안전 문제
- 신재생 에너지: 태양광, 풍력, 수력, 지열, 조력, 수소 등 — 고갈되지 않고 온실 기체가 적음
- 약점(들쭉날쭉함)은 [[에너지 저장 장치]]와 여러 에너지의 조합으로 보완

= 나가기 전 한 문제 | 형성평가
? 우리 학교에 설치할 발전 시설 하나를 고르고, 그 까닭을 장점과 한계를 모두 들어 쓰시오. :: (예) 옥상 태양광: 넓은 옥상을 활용할 수 있고 온실 기체가 없다. 다만 밤과 흐린 날에는 발전하지 못하므로 전력망의 전기와 함께 쓴다.
