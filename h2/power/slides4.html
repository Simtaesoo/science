# 태양 에너지와 핵융합 | 모든 에너지의 고향 | 고등학교 통합과학2 · 05 에너지와 발전 · 3차시 | 2022 개정 교육과정 [10통과2-02-04]

= 오늘의 학습 목표 | 3차시
^ 태양 중심부의 **수소 핵융합** 과정을 설명할 수 있다.
^ 핵융합에서 **줄어든 질량이 에너지로 바뀜**을 정성적으로 설명할 수 있다.
^ 지구 에너지원 대부분의 **근원이 태양 에너지**임을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 태양의 핵융합 10분 → 질량 비교(시뮬레이션) 10분 → 에너지 흐름과 전환 12분 → 에너지원의 근원·문항 10분
% 2022 개정 [10통과2-02-04] 해설: 수소가 헬륨으로 핵융합하는 과정에서 질량이 줄어 태양 에너지가 생성됨을 정성적으로만 다룬다. E = Δmc²을 이용한 계산은 하지 않는다.

= 석유, 바람, 비의 공통 조상 | 생각 열기
* ⛽ 석유 :: 수억 년 전 생물이 저장한 에너지
* 🌬️ 바람 :: 땅이 고르지 않게 데워져 분다
* 🌧️ 비와 댐의 물 :: 물이 증발해 높이 올라갔다가 내린다
* ☀️ 태양 :: 46억 년째 빛나고 있다
? 이 에너지들은 결국 어디에서 왔을까? :: 대부분 **태양 에너지**에서 왔다. 그리고 태양 에너지는 태양 중심의 **핵융합**에서 나온다.

= 지난 시간 복습 | 1~3차시 · 통합과학1
- 에너지 전환에서 총량은 [[보존]]된다.
- 수소 원자핵 4개 → [[헬륨]] 원자핵 1개 (통합과학1 자연의 구성 원소)
- 반응 후 줄어든 질량이 [[에너지]]로 전환된다.
? 태양은 연료를 태우는(연소) 것일까? :: 아니다. 화학 반응이 아니라 **원자핵이 합쳐지는 핵융합**이다. 연소였다면 몇천 년 만에 다 탔을 것이다.

## 태양의 핵융합 | 질량이 에너지로

= 태양 중심부의 핵융합
! 수소 원자핵 4개 → 헬륨 원자핵 1개 + 에너지
- 태양 중심부: 약 **1500만 K**, 매우 높은 압력
- 반응 후 원자핵들의 질량 합이 ==조금 줄어든다.==
- 줄어든 질량이 막대한 **에너지**로 바뀌어 빛과 열로 나온다.
>+ 아주 적은 질량도 엄청난 에너지에 해당한다 — 그래서 태양은 수십억 년 동안 빛날 수 있다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#sun | [핵융합 일으키기]를 누르고 반응 전후 질량을 비교하자.
% 반응 전과 후의 질량을 비교해 '줄어들었다'는 사실만 확인한다. 질량 결손 비율 계산은 하지 않는다.

= 반응 전후의 질량 | 시뮬레이션 기록
| 구분 | 질량 (u) |
|+ 반응 전 (수소 원자핵 4개) | 4.0313 |
|+ 반응 후 (헬륨 원자핵 1개) | 4.0026 |
|+ 비교 | 반응 후가 [[더 작다]] |
- 줄어든 질량은 어디로 갔을까? → [[에너지]]로 바뀌었다.

= 예제 1 · 태양 에너지가 지구에 오기까지 | 적용
^+ 태양 중심: 핵융합으로 질량 일부가 **에너지**로 바뀐다.
^+ 태양 표면에서 **빛(복사 에너지)**으로 우주 공간에 퍼진다.
^+ 지구에 도착한 빛 → 땅·바다를 데우고(**열**), 바람과 물의 순환을 일으키고(**운동·위치 에너지**), 식물이 광합성으로 저장한다(**화학 에너지**).
>+ 태양에서 온 에너지가 지구에서 여러 형태로 **전환**되며 에너지 흐름을 만든다.

= 확인 문제 1
Q 태양 에너지의 근원으로 옳은 것은?
o 수소의 연소
o 우라늄의 핵분열
o* 수소 원자핵의 핵융합
o 태양 내부 마찰
:: 중심부에서 수소 원자핵 4개가 헬륨 원자핵 1개로 융합하며 줄어든 질량만큼 에너지가 나온다.

## 에너지원의 근원 | 결국 태양으로

= 지구 에너지원의 근원
| 에너지원 | 근원 | 태양 에너지가 전환된 과정 |
|+ 화석 연료 | [[태양]] | 옛 생물의 광합성으로 저장된 화학 에너지 |
|+ 수력 | [[태양]] | 물의 순환으로 높은 곳에 올라간 물의 위치 에너지 |
|+ 풍력 | [[태양]] | 지표의 불균등 가열로 생긴 바람의 운동 에너지 |
|+ 조력 | 달·태양의 인력 | – |
|+ 지열 | 지구 내부 에너지 | – |

= 예제 3 · 석탄 속 햇빛 | 적용
- 화력 발전소에서 석탄을 태워 전기를 만든다. 이 에너지를 거꾸로 따라가 보자.
^+ 전기 ← 발전기의 운동 ← 증기 터빈의 열 ← 석탄의 **화학 에너지**
^+ 석탄 ← 수억 년 전 식물의 몸 ← **광합성**
^+ 광합성 ← **태양 빛에너지** ← 태양 중심의 **핵융합**
>+ 석탄을 태우는 것은 아주 오래전 햇빛을 꺼내 쓰는 것!

= 생활 속 태양 에너지 | 사례
* ☀️ 태양광 발전 :: 빛 → 전기 (태양 전지)
* 🔥 태양열 온수기 :: 빛 → 열
* 🌾 농업 :: 광합성으로 식량 생산
* 🌬️ 풍력·수력 :: 태양이 만든 바람과 물의 순환
* 🔬 핵융합 연구 장치 :: 1억 ℃ 이상의 플라스마를 가두는 실험
* 🛰️ 인공위성 :: 태양 전지판으로 전기를 얻는다

= 확인 문제 2
Q 근원이 태양 에너지가 아닌 것은?
o 화석 연료
o 풍력
o 수력
o* 지열
:: 지열은 지구 내부 에너지가 근원이다.

= 확인 문제 3
Q 태양 에너지가 지구에서 전환되는 예로 옳지 않은 것은?
o 식물이 광합성으로 화학 에너지를 저장한다
o 지표가 고르지 않게 데워져 바람이 분다
o 바닷물이 증발해 구름이 된다
o* 지구 내부의 열로 화산이 분출한다
:: 화산 활동은 지구 내부 에너지가 근원이다.

= 확인 문제 4
Q 태양의 핵융합에서 줄어든 질량에 대한 설명으로 옳은 것은?
o 사라져 없어진다
o* 에너지로 전환된다
o 헬륨으로 모두 바뀐다
o 지구로 날아온다
:: 핵융합으로 줄어든 질량은 에너지로 바뀌어 빛과 열로 방출된다.

= 확인 문제 5
Q 수력 발전의 에너지를 근원까지 거슬러 올라간 순서로 옳은 것은?
o 전기 ← 물의 위치 에너지 ← 지구 내부 에너지
o* 전기 ← 물의 위치 에너지 ← 물의 순환(증발) ← 태양 에너지
o 전기 ← 바람 ← 달의 인력
o 전기 ← 화학 에너지 ← 광합성
:: 태양 에너지가 물을 증발시켜 높은 곳으로 올리고, 그 물의 위치 에너지로 발전한다.

= 서술형 도전 | 생각 넓히기
? 태양이 연소가 아닌 핵융합으로 빛나기 때문에 수십억 년 동안 빛날 수 있는 까닭을 쓰시오. :: 핵융합에서는 아주 적은 질량이 줄어들어도 막대한 에너지가 나오고, 태양에는 연료인 수소가 엄청나게 많기 때문이다.
? 지구에서 핵융합 발전을 실현하기 어려운 까닭과 성공했을 때의 장점을 쓰시오. :: 태양 중심보다 훨씬 높은 1억 ℃ 이상의 플라스마를 오랫동안 가두어야 해 기술적으로 매우 어렵다. 성공하면 바닷물의 중수소 등 풍부한 연료로 온실 기체와 고준위 방사성 폐기물이 거의 없는 에너지를 얻을 수 있다.

= 오늘 배운 내용 정리
- 태양 중심부: 수소 원자핵 [[4]]개 → 헬륨 원자핵 1개 (핵융합)
- 반응 후 줄어든 질량 → [[에너지]]로 전환
- 태양 에너지는 지구에서 열, 바람, 물의 순환, 광합성 등 다양한 에너지로 [[전환]]
- 화석 연료·수력·풍력의 근원 → [[태양 에너지]] / 조력: 달·태양의 인력 / 지열: [[지구 내부 에너지]]

= 나가기 전 한 문제 | 형성평가
? 오늘 아침에 먹은 밥의 에너지를 태양 중심까지 거슬러 올라가 순서대로 쓰시오. :: 밥(쌀)의 화학 에너지 ← 벼의 광합성 ← 태양 빛에너지 ← 태양 중심의 수소 핵융합(줄어든 질량이 에너지로 전환)
