# 태양 에너지와 핵융합 | 모든 에너지의 고향 | 고등학교 통합과학2 · 05 에너지와 발전 · 4차시 | 2022 개정 교육과정 [통과2 Ⅱ]

= 오늘의 학습 목표 | 4차시
^ 태양 중심부의 **수소 핵융합** 과정을 설명할 수 있다.
^ **질량 결손**과 **E = Δmc²**으로 핵융합 에너지를 계산할 수 있다.
^ 지구 에너지원 대부분의 **근원이 태양 에너지**임을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 태양의 핵융합 8분 → 질량 결손(시뮬레이션) 10분 → E = Δmc² 계산 12분 → 에너지원의 근원·문항 10분

= 석유, 바람, 비의 공통 조상 | 생각 열기
* ⛽ 석유 :: 수억 년 전 생물이 저장한 에너지
* 🌬️ 바람 :: 땅이 고르지 않게 데워져 분다
* 🌧️ 비와 댐의 물 :: 물이 증발해 높이 올라갔다가 내린다
* ☀️ 태양 :: 46억 년째 빛나고 있다
? 이 에너지들은 결국 어디에서 왔을까? :: 대부분 **태양 에너지**에서 왔다. 그리고 태양 에너지는 태양 중심의 **핵융합**에서 나온다.

= 지난 시간 복습 | 1~3차시 · 통합과학1
- 에너지 전환에서 총량은 [[보존]]된다.
- 수소 원자핵 4개 → [[헬륨]] 원자핵 1개 (통합과학1 자연의 구성 원소)
- 반응 후 줄어든 질량이 [[에너지]]로 전환된다.
? 태양은 연료를 태우는(연소) 것일까? :: 아니다. 화학 반응이 아니라 **원자핵이 합쳐지는 핵융합**이다. 연소였다면 몇천 년 만에 다 탔을 것이다.

## 태양의 핵융합 | 질량이 에너지로

= 태양 중심부의 핵융합
! 수소 원자핵 4개 → 헬륨 원자핵 1개 + 에너지
- 태양 중심부: 약 **1500만 K**, 매우 높은 압력
- 반응 후 질량이 약 ==0.7 %== 줄어든다 → **질량 결손**
! 질량–에너지 관계: E = Δm c² (c: 빛의 속력 3 × 10⁸ m/s)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#sun | [핵융합 일으키기]를 누르고 반응 전후 질량을 비교하자.
% u(원자 질량 단위)는 아주 작은 질량을 나타내는 단위임을 짧게 소개

= 질량 결손 | 시뮬레이션 기록
| 구분 | 질량 (u) |
|+ 반응 전 (수소 원자핵 4개) | 4.0313 |
|+ 반응 후 (헬륨 원자핵 1개) | 4.0026 |
|+ 질량 결손 | [[0.0287]] |
- 질량 결손 비율 = 0.0287 ÷ 4.0313 × 100 ≈ [[0.7 %]]

= 예제 1 · 수소 1 kg의 에너지 | 적용
- 수소 1 kg이 모두 헬륨으로 융합하면 얼마의 에너지가 나올까? (질량 결손 0.7 %)
^+ Δm = 1 × 0.007 = **0.007 kg**
^+ E = Δmc² = 0.007 × (3 × 10⁸)² = 0.007 × 9 × 10¹⁶
^+ = **6.3 × 10¹⁴ J**
>+ 휘발유 1 kg을 태울 때 약 4.6 × 10⁷ J → 핵융합이 약 **1000만 배 이상**

= 예제 2 · 태양은 1초에 얼마나 가벼워질까? | 적용
- 태양이 1초 동안 내놓는 에너지는 약 3.8 × 10²⁶ J이다.
^+ Δm = E ÷ c² = 3.8 × 10²⁶ ÷ (9 × 10¹⁶)
^+ ≈ **4.2 × 10⁹ kg** (약 420만 톤)
^+ 매초 이만큼 가벼워져도 태양 질량(약 2 × 10³⁰ kg)에 비하면 아주 작다 → 수십억 년 동안 빛날 수 있다.

= 확인 문제 1
Q 태양 에너지의 근원으로 옳은 것은?
o 수소의 연소
o 우라늄의 핵분열
o* 수소 원자핵의 핵융합
o 태양 내부 마찰
:: 중심부에서 수소 원자핵 4개가 헬륨 원자핵 1개로 융합하며 질량 결손만큼 에너지가 나온다.

## 에너지원의 근원 | 결국 태양으로

= 지구 에너지원의 근원
| 에너지원 | 근원 | 태양 에너지가 전환된 과정 |
|+ 화석 연료 | [[태양]] | 옛 생물의 광합성으로 저장된 화학 에너지 |
|+ 수력 | [[태양]] | 물의 순환으로 높은 곳에 올라간 물의 위치 에너지 |
|+ 풍력 | [[태양]] | 지표의 불균등 가열로 생긴 바람의 운동 에너지 |
|+ 조력 | 달·태양의 인력 | – |
|+ 지열 | 지구 내부 에너지 | – |

= 예제 3 · 석탄 속 햇빛 | 적용
- 화력 발전소에서 석탄을 태워 전기를 만든다. 이 에너지를 거꾸로 따라가 보자.
^+ 전기 ← 발전기의 운동 ← 증기 터빈의 열 ← 석탄의 **화학 에너지**
^+ 석탄 ← 수억 년 전 식물의 몸 ← **광합성**
^+ 광합성 ← **태양 빛에너지** ← 태양 중심의 **핵융합**
>+ 석탄을 태우는 것은 아주 오래전 햇빛을 꺼내 쓰는 것!

= 생활 속 태양 에너지 | 사례
* ☀️ 태양광 발전 :: 빛 → 전기 (태양 전지)
* 🔥 태양열 온수기 :: 빛 → 열
* 🌾 농업 :: 광합성으로 식량 생산
* 🌬️ 풍력·수력 :: 태양이 만든 바람과 물의 순환
* 🔬 핵융합 연구 장치 :: 1억 ℃ 이상의 플라스마를 가두는 실험
* 🛰️ 인공위성 :: 태양 전지판으로 전기를 얻는다

= 확인 문제 2
Q 근원이 태양 에너지가 아닌 것은?
o 화석 연료
o 풍력
o 수력
o* 지열
:: 지열은 지구 내부 에너지가 근원이다.

= 확인 문제 3
Q 질량 결손이 0.002 kg일 때 방출되는 에너지는? (c = 3 × 10⁸ m/s)
o 6 × 10⁵ J
o 6 × 10⁸ J
o* 1.8 × 10¹⁴ J
o 1.8 × 10¹⁷ J
:: E = 0.002 × 9 × 10¹⁶ = 1.8 × 10¹⁴ J

= 확인 문제 4
Q 태양의 핵융합에서 줄어든 질량에 대한 설명으로 옳은 것은?
o 사라져 없어진다
o* 에너지로 전환된다
o 헬륨으로 모두 바뀐다
o 지구로 날아온다
:: 질량 결손만큼 E = Δmc²의 에너지가 나온다.

= 확인 문제 5
Q 수력 발전의 에너지를 근원까지 거슬러 올라간 순서로 옳은 것은?
o 전기 ← 물의 위치 에너지 ← 지구 내부 에너지
o* 전기 ← 물의 위치 에너지 ← 물의 순환(증발) ← 태양 에너지
o 전기 ← 바람 ← 달의 인력
o 전기 ← 화학 에너지 ← 광합성
:: 태양 에너지가 물을 증발시켜 높은 곳으로 올리고, 그 물의 위치 에너지로 발전한다.

= 서술형 도전 | 생각 넓히기
? 태양 질량의 대부분이 수소인데 태양이 수십억 년 동안 빛날 수 있는 까닭을 쓰시오. :: 질량 결손이 아주 조금이어도 c²이 매우 커서 막대한 에너지가 나오고, 태양에는 수소가 엄청나게 많기 때문이다.
? 지구에서 핵융합 발전을 실현하기 어려운 까닭과 성공했을 때의 장점을 쓰시오. :: 태양 중심보다 훨씬 높은 1억 ℃ 이상의 플라스마를 오랫동안 가두어야 해 기술적으로 매우 어렵다. 성공하면 바닷물의 중수소 등 풍부한 연료로 온실 기체와 고준위 방사성 폐기물이 거의 없는 에너지를 얻을 수 있다.

= 오늘 배운 내용 정리
- 태양 중심부: 수소 원자핵 [[4]]개 → 헬륨 원자핵 1개 (핵융합)
- 반응 후 줄어든 질량 → [[질량 결손]] (약 0.7 %)
- 질량–에너지 관계: E = [[Δmc²]]
- 화석 연료·수력·풍력의 근원 → [[태양 에너지]] / 조력: 달·태양의 인력 / 지열: [[지구 내부 에너지]]

= 나가기 전 한 문제 | 형성평가
? 수소 2 kg이 모두 헬륨으로 융합할 때 나오는 에너지를 구하시오. (질량 결손 0.7 %, c = 3 × 10⁸ m/s) :: Δm = 2 × 0.007 = 0.014 kg → E = 0.014 × 9 × 10¹⁶ = 1.26 × 10¹⁵ J
