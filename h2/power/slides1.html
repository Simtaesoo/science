# 에너지 전환과 효율 | 에너지는 보존되지만 쓸모는 줄어든다 | 고등학교 통합과학2 · 05 에너지와 발전 · 1차시 | 2022 개정 교육과정 [통과2 Ⅱ]

= 오늘의 학습 목표 | 1차시
^ 에너지 전환 과정에서 **에너지 보존 법칙**이 성립함을 설명할 수 있다.
^ **에너지 효율**을 계산하고 손실 에너지를 구할 수 있다.
^ 버려지는 에너지를 줄여 **효율을 높이는 방안**을 제시할 수 있다.
% 흐름: 생각 열기 5분 → 전환과 보존 8분 → 장치별 효율(시뮬레이션) 12분 → 효율 계산 12분 → 문항 8분

= 전구를 만져 보면? | 생각 열기
* 💡 백열전구 :: 켜 두면 손을 델 만큼 뜨겁다
* 🔆 LED 전구 :: 같은 밝기인데 거의 뜨겁지 않다
* 🚗 자동차 엔진 :: 달리고 나면 보닛이 뜨겁다
* 📱 충전 중인 휴대전화 :: 따뜻해진다
? 에너지는 보존된다는데, 왜 '에너지를 아껴야' 할까? :: 에너지의 총량은 그대로지만 전환될 때마다 일부가 **다시 쓰기 어려운 열**로 흩어져 '쓸모 있는 에너지'가 줄어들기 때문이다.

= 중학교에서 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 에너지 전환 | 한 형태에서 다른 형태로 바뀜 |
| 역학적 에너지 보존 | 마찰이 없으면 위치 + 운동 에너지 일정 |
| 마찰이 있으면 | 일부가 열에너지로 → 전체 에너지는 보존 |
| 전력량 | 전력(W) × 시간(h) = Wh |
? 롤러코스터가 점점 낮은 언덕밖에 못 넘는 까닭은? :: 마찰과 공기 저항으로 역학적 에너지 일부가 **열·소리**로 바뀌기 때문 — 사라진 것이 아니다.

## 에너지 전환과 보존 | 총량은 그대로

= 에너지 전환과 보존 법칙
! 에너지가 전환될 때 에너지의 총량은 변하지 않는다
- **에너지 전환**: 에너지가 한 형태에서 다른 형태로 바뀌는 것
- 전환 과정에서 일부는 다시 사용하기 어려운 ==열에너지==로 흩어진다.
>+ 공급한 에너지 = 유용하게 사용된 에너지 + 손실 에너지

= 에너지 효율
! 에너지 효율 (%) = 유용하게 사용된 에너지 ÷ 공급한 에너지 × 100
- 효율이 높을수록 같은 일을 하는 데 에너지가 **적게** 든다.
- 효율은 항상 **100 %보다 작다** (손실이 0인 장치는 없다).

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#convert | 장치를 하나씩 골라 입력 에너지(100), 유용한 에너지, 손실 에너지와 효율을 기록하자.
% 손실 에너지의 '형태'(열, 소리 등)까지 말하게 하기

= 장치별 에너지 흐름 | 시뮬레이션 기록
| 장치 | 에너지 전환 | 유용한 에너지 (입력 100) | 효율 |
|+ 백열전구 | 전기 → 빛 | 5 | [[5 %]] |
|+ LED 전구 | 전기 → 빛 | 40 | [[40 %]] |
|+ 휘발유 자동차 | 화학 → 운동 | 25 | [[25 %]] |
|+ 전기 자동차 | 전기 → 운동 | 85 | [[85 %]] |
|+ 화력 발전소 | 화학 → 전기 | 38 | [[38 %]] |
~ 시뮬레이션의 대표값을 단순화한 것

= 예제 1 · 효율과 손실 | 적용
- 100 J의 전기 에너지로 15 J의 빛에너지를 내는 전구가 있다.
^+ 효율 = 15 ÷ 100 × 100 = **15 %**
^+ 손실 에너지 = 100 − 15 = **85 J** (주로 열)
>+ 에너지 보존: 100 J = 15 J(빛) + 85 J(열)

= 예제 2 · 필요한 연료 | 적용
- 효율이 40 %인 발전소에서 전기 에너지 400 MJ를 얻으려면 연료 에너지가 얼마나 필요한가?
^+ 공급 에너지 = 유용한 에너지 ÷ 효율
^+ 400 ÷ 0.4 = **1000 MJ**
^+ 버려지는 열 = 1000 − 400 = **600 MJ**

= 예제 3 · LED로 바꾸면 | 적용
- 60 W 백열전구를 비슷한 밝기의 10 W LED 전구로 바꾸었다. 하루 5시간씩 1년(365일) 켠다면?
^+ 줄어든 전력 = 60 − 10 = **50 W**
^+ 1년 절약 전력량 = 50 W × 5 h × 365 = 91 250 Wh ≈ **91 kWh**
>+ 집 안 전구 10개를 바꾸면 1년에 약 910 kWh — 발전소 연료와 온실 기체도 함께 줄어든다.

= 확인 문제 1
Q 에너지 효율이 25 %인 엔진에 연료 에너지 800 J을 공급했을 때 유용한 에너지는?
o 25 J
o* 200 J
o 600 J
o 775 J
:: 800 × 0.25 = 200 J (나머지 600 J은 주로 열로 손실)

## 효율 높이기 | 버려지는 열을 다시 쓰자

= 효율을 높이는 기술 | 사례
* 🏭 열병합 발전 :: 발전하고 남은 열로 지역 난방
* 🚗 회생 제동 :: 전기·하이브리드 자동차가 제동할 때 전기를 되돌려 충전
* ♨️ 폐열 회수 보일러 :: 배기가스의 열을 다시 이용
* 💡 LED 조명 :: 같은 밝기에 전기를 훨씬 적게
* 🏠 단열 건축 :: 열 손실을 줄여 냉난방 에너지 절약
* ❄️ 인버터 에어컨 :: 필요한 만큼만 돌려 낭비를 줄인다

= 확인 문제 2
Q 에너지 보존 법칙에 대한 설명으로 옳은 것은?
o 에너지는 전환될 때마다 줄어든다
o* 에너지가 전환되어도 에너지의 총량은 일정하다
o 효율이 100 %인 장치가 많다
o 열에너지는 에너지가 아니다
:: 손실된 것처럼 보이는 에너지도 열 등의 형태로 남아 총량은 보존된다.

= 확인 문제 3
Q 다음 중 효율이 가장 높은 장치는? (시뮬레이션 대표값)
o 백열전구
o 휘발유 자동차
o 화력 발전소
o* 전기 자동차
:: 전기 자동차(전동기) 약 85 %로 가장 높다.

= 확인 문제 4
Q 효율 30 %인 장치에서 유용한 에너지 90 J을 얻으려면 공급 에너지는?
o 27 J
o 120 J
o* 300 J
o 900 J
:: 90 ÷ 0.3 = 300 J

= 확인 문제 5
Q 휘발유 자동차(효율 25 %)와 전기 자동차(효율 85 %)가 같은 운동 에너지 170 kJ을 얻으려면 각각 공급해야 할 에너지는?
o 170 kJ, 170 kJ
o* 680 kJ, 200 kJ
o 425 kJ, 145 kJ
o 200 kJ, 680 kJ
:: 휘발유: 170 ÷ 0.25 = 680 kJ, 전기: 170 ÷ 0.85 = 200 kJ

= 서술형 도전 | 생각 넓히기
? 에너지는 보존되는데도 에너지를 절약해야 하는 까닭을 쓰시오. :: 에너지가 전환될 때 일부가 다시 쓰기 어려운 열에너지로 흩어져 유용하게 쓸 수 있는 에너지가 줄어들고, 에너지를 얻는 과정에서 자원이 소모되고 환경 오염이 생기기 때문이다.
? 백열전구를 LED 전구로 모두 바꾸면 어떤 이점이 있는지 에너지와 환경 측면에서 쓰시오. :: 같은 밝기를 내는 데 필요한 전기 에너지가 크게 줄어 전기 요금이 줄고, 발전에 필요한 화석 연료 사용과 온실 기체 배출도 줄어든다.

= 오늘 배운 내용 정리
- 에너지가 전환되어도 총량은 일정 → [[에너지 보존 법칙]]
- 공급 에너지 = 유용한 에너지 + [[손실 에너지]] (주로 열)
- 효율 (%) = [[유용한 에너지 ÷ 공급 에너지]] × 100
- 효율을 높이는 기술: 열병합 발전, [[회생 제동]], LED, 단열

= 나가기 전 한 문제 | 형성평가
? 효율이 38 %인 화력 발전소에 석탄 에너지 1000 MJ를 공급했다. 얻는 전기 에너지와 버려지는 에너지를 구하고, 버려지는 에너지를 활용하는 방법을 하나 쓰시오. :: 전기 에너지 = 1000 × 0.38 = 380 MJ, 버려지는 에너지 = 620 MJ. 활용: 열병합 발전으로 남은 열을 지역 난방에 사용한다.
