# 인공지능 로봇과 사물 인터넷 | 생각하는 기계, 연결된 사물 | 고등학교 통합과학2 · 06 과학과 미래 사회 · 3차시 | 2022 개정 교육과정 [10통과2-03-03]

= 오늘의 학습 목표 | 3차시
^ **인공지능**, **로봇**, **사물 인터넷**이 작동하는 기본 흐름(감지 → 판단 → 행동)을 설명할 수 있다.
^ 이 기술들이 인간 삶과 환경 개선에 활용되는 **사례**를 찾을 수 있다.
^ 이 기술들이 미래 사회에 미칠 **유용성과 한계**를 예측할 수 있다.
% 흐름: 생각 열기 5분 → 감지·판단·행동 10분 → 활용 사례 10분 → 로봇 개선안 모둠 활동 15분 → 문항 5분
% 2022 개정 [10통과2-03-03]: 인공지능 로봇, 사물인터넷 등 과학기술을 인간 삶과 환경 개선에 활용하는 사례를 찾고 유용성과 한계를 예측한다. 탐구 활동 '일상생활에 활용되는 로봇의 특징 분석 및 개선 방안 고안하기'

= 로봇 청소기는 어떻게 집을 기억할까? | 생각 열기
* 🧹 로봇 청소기 :: 벽과 계단을 피하고 집 지도를 그린다
* 🌡️ 스마트 화분 :: 흙이 마르면 스스로 물을 준다
* 🚗 자율 주행차 :: 신호등과 보행자를 알아본다
* 🏭 협동 로봇 :: 사람 곁에서 무거운 부품을 든다
? 이 기계들이 공통으로 하는 일 세 가지는? :: 센서로 주변을 **감지**하고, 정보를 처리해 **판단**하고, 모터 등으로 **행동**한다.

= 이전에 배운 내용 떠올리기 | 복습 · 1·2차시, 통합과학1
- 자연의 변화를 측정한 신호를 0과 1로 바꾸는 과정 → [[디지털 변환]]
- 많고 빠르고 다양한 데이터 → [[빅데이터]]
? 센서가 모은 데이터는 어디에 쓰일까? :: 인공지능이 데이터에서 규칙을 학습해 판단하는 데 쓰인다.

## 감지 · 판단 · 행동 | 똑똑한 기계의 세 단계

= 똑똑한 기계의 작동 흐름
^ **감지(센서)**: 카메라, 마이크, 거리·온도·습도 센서가 주변 정보를 측정
^ **판단(인공지능·프로그램)**: 데이터를 처리하고, 학습한 규칙으로 상황을 판단
^ **행동(구동 장치)**: 모터, 스피커, 밸브 등이 실제로 움직이거나 신호를 낸다
>+ **사물 인터넷(IoT)**: 사물에 센서와 통신 기능을 넣어 서로 정보를 주고받게 하는 기술
>+ **인공지능 로봇**: 감지한 정보를 인공지능으로 판단해 스스로 행동하는 로봇

= 예제 1 · 스마트 화분 분석 | 적용
| 단계 | 스마트 화분에서 하는 일 |
|+ 감지 | 흙의 [[습도]] 센서가 수분을 잰다 |
|+ 판단 | 습도가 기준보다 낮은지 비교한다 |
|+ 행동 | [[펌프]]를 켜서 물을 준다 / 스마트폰으로 알림을 보낸다 |
? 이 화분을 더 똑똑하게 만들려면 어떤 센서를 더할까? :: 빛 센서(햇빛이 강한 날 물을 더 줌), 온도 센서, 물통의 수위 센서 등

## 활용 사례 | 삶과 환경을 바꾸는 기술

= 인간 삶과 환경 개선 사례
* 🏥 의료 :: 인공지능이 의료 영상을 분석해 질병을 일찍 찾도록 돕는다
* 🌾 스마트 농업 :: 센서로 온도·습도를 관리해 물과 비료를 아낀다
* 🏙️ 스마트 시티 :: 교통 신호를 조절해 정체와 배기가스를 줄인다
* 🔋 스마트 그리드 :: 전기 사용량을 실시간으로 맞춰 에너지 낭비를 줄인다
* 🌊 재난 감시 :: 하천 수위·산사태 센서가 위험을 미리 알린다
* 🦾 돌봄 로봇 :: 노인·장애인의 이동과 생활을 돕는다

= 유용성과 한계
| 구분 | 내용 |
|+ 유용성 | 위험하고 반복적인 일을 대신함, 자원·에너지 절약, 빠르고 정확한 판단 보조 |
|+ 한계 | 학습 데이터가 치우치면 판단도 치우침, 예상하지 못한 상황에 약함 |
|+ 문제점 | 개인 정보 수집과 해킹, 일자리 변화, 사고가 나면 누구의 책임인가 |
>+ 기술은 **도구** — 어떻게 설계하고 쓰느냐에 따라 결과가 달라진다.

= 예제 2 · 자율 주행차의 판단 | 자료 해석
- 자율 주행차가 맑은 낮 도로 영상으로만 학습했다.
^+ 눈 오는 밤에는 차선과 보행자를 잘못 인식할 수 있다 → **학습 데이터의 한계**
^+ 해결: 다양한 날씨·시간의 데이터 추가, 여러 종류의 센서(레이더 등)를 함께 사용
>+ 인공지능의 판단은 학습한 데이터만큼만 믿을 수 있다.

## 로봇 개선안 | 모둠 활동

= 생활 속 로봇 분석·개선 | 탐구 활동
^ 모둠별로 생활 속 로봇 하나(로봇 청소기, 서빙 로봇, 배달 로봇 등)를 고른다.
^ 감지·판단·행동 단계로 특징을 분석한다.
^ 불편한 점이나 위험 요소를 찾고, 센서·판단 규칙·행동을 바꾸는 **개선 방안**을 그림으로 고안한다.
^ 개선안이 가져올 **유용성과 한계**를 함께 발표한다.
% 마이크로비트·아두이노 등 피지컬 컴퓨팅 도구가 있으면 센서 하나와 모터 하나로 간단한 시제품을 만들어 볼 수 있다.

= 확인 문제 1
Q 사물 인터넷(IoT)에 대한 설명으로 옳은 것은?
o 인터넷에 사람만 연결된다
o* 사물에 센서와 통신 기능을 넣어 정보를 주고받게 한다
o 인터넷 없이 작동하는 로봇이다
o 종이로 정보를 기록하는 기술이다
:: 사물이 스스로 측정한 정보를 네트워크로 주고받는다.

= 확인 문제 2
Q 로봇 청소기가 계단에서 떨어지지 않게 하는 과정에서 '감지'에 해당하는 것은?
o 바퀴가 방향을 바꾼다
o 프로그램이 위험하다고 판단한다
o* 아래쪽 거리 센서가 바닥이 없음을 측정한다
o 스마트폰에 알림을 보낸다
:: 감지는 센서가 주변 정보를 측정하는 단계이다.

= 확인 문제 3
Q 인공지능 기술의 한계로 가장 알맞은 것은?
o 계산을 전혀 하지 못한다
o* 학습 데이터가 치우치면 판단도 치우칠 수 있다
o 데이터 없이도 항상 정확하다
o 센서가 없어야 작동한다
:: 인공지능은 학습한 데이터의 특징을 그대로 따라가므로 데이터의 질이 중요하다.

= 서술형 도전 | 생각 넓히기
? 스마트 농업이 환경 개선에 도움이 되는 까닭을 쓰시오. :: 센서로 흙과 공기의 상태를 측정해 꼭 필요한 만큼만 물과 비료를 주므로 자원 낭비와 비료로 인한 수질 오염을 줄일 수 있다.
? 돌봄 로봇이 널리 쓰일 때 생길 수 있는 문제 한 가지와 대책을 쓰시오. :: (예) 집 안 영상·음성이 수집되어 개인 정보가 유출될 수 있다 → 데이터를 기기 안에서만 처리하고 암호화하며, 수집 범위를 사용자에게 알리고 동의를 받는다.

= 오늘 배운 내용 정리
- 똑똑한 기계: [[감지]](센서) → 판단(인공지능) → [[행동]](구동 장치)
- 사물 인터넷: 사물에 센서와 [[통신]] 기능을 넣어 정보를 주고받는 기술
- 활용: 의료, 스마트 농업, 스마트 시티, 재난 감시, 돌봄
- 한계·문제: 데이터 치우침, [[개인 정보]], 일자리 변화, 책임 문제

= 나가기 전 한 문제 | 형성평가
? 우리 교실에 사물 인터넷을 적용한다면 무엇을 감지하여 어떻게 행동하게 할지 쓰고, 예상되는 문제점을 한 가지 쓰시오. :: (예) 이산화 탄소 센서로 공기 질을 감지해 기준을 넘으면 환기 장치를 켠다. 고장이나 오작동 시 소음과 에너지 낭비가 생길 수 있다.
