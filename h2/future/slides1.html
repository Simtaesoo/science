## 감염병과 R₀ | 한 명이 몇 명에게

= 감염병과 병원체
! 감염병: 병원체가 사람이나 동물에 침입하여 증식하며 전파되는 질병
| 병원체 | 특징 | 치료 |
|+ 세균 | 스스로 증식하는 생물 | [[항생제]] |
|+ 바이러스 | 숙주 세포 안에서만 증식 | [[항바이러스제]], 백신 |
|+ 균류·원생생물 | 무좀, 말라리아 등 | 항진균제, 항원충제 |
>+ 바이러스에는 항생제가 **듣지 않는다** → 감기에 항생제를 함부로 먹지 않는 까닭

= 기초 감염 재생산 수 R₀
! R₀: 면역이 없는 집단에서 감염자 1명이 평균적으로 감염시키는 사람 수
- R₀ > 1 → 감염자가 **늘어난다**
- R₀ < 1 → 감염자가 **줄어든다**
- 예방 수칙·백신으로 실제 재생산 수를 ==1보다 작게== 만드는 것이 목표

= 예제 1 · 세대별 감염자 | 적용
- R₀ = 3인 감염병이 감염자 1명에서 시작한다. (면역·예방 없음)
^+ 1세대 3명 → 2세대 9명 → 3세대 27명 → 4세대 **81명**
^+ R = 0.9로 낮추면: 1 → 0.9 → 0.81 → 0.73 → 0.66명 (점점 **줄어듦**)
>+ 1보다 크냐 작으냐가 '폭발'과 '소멸'을 가른다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#sir | 조건을 바꾸어 [다시 시작]하고 최대 동시 감염자와 누적 감염자를 기록하자.
% R₀ 3 예방 없음 → 마스크·손 씻기 → 백신 70 % 순서로 비교

= 확산 모형 | 시뮬레이션 기록
| 조건 | 최대 동시 감염자 | 누적 감염자 | 확산 |
|+ R₀ 3, 예방 없음 | 많음 (약 70명) | 대부분 | 빠르고 큼 |
|+ R₀ 3, 마스크·손 씻기 | [[줄어듦]] | 줄어듦 | 느려짐 |
|+ R₀ 3, 백신 70 % | [[거의 없음]] | 거의 없음 | [[확산 멈춤]] |

## 백신과 집단 면역 | 연결 고리 끊기

= 백신과 집단 면역
- **백신**: 병원체의 일부나 약하게 만든 병원체를 넣어 ==면역==을 미리 형성
! 집단 면역에 필요한 비율 ≈ 1 − 1/R₀
- 면역을 가진 사람이 충분하면 감염자가 만나는 사람 대부분이 감염되지 않아 **전파가 끊긴다.**

= 예제 2 · 백신 70 %의 효과 | 적용
- R₀ = 3인 감염병에서 인구의 70 %가 백신으로 면역을 얻었다.
^+ 감염자 1명이 만나는 3명 중 면역 없는 사람 = 3 × (1 − 0.7) = **0.9명**
^+ 실제 재생산 수 0.9 < 1 → 확산이 **멈춘다** ✔ (시뮬레이션 결과와 일치)
^+ 필요한 접종률 = 1 − 1/3 ≈ **66.7 %** → 70 %면 충분

= 집단 면역 기준 | 그래프
C R₀에 따른 집단 면역 필요 비율 | R₀ | 필요한 면역 비율 (%) | 필요 비율:1.5,33.3 2,50 3,66.7 4,75 6,83.3 10,90 15,93.3
+ R₀ = 4 → 1 − 1/4 = [[75 %]]
+ 홍역(R₀ 약 12~18)처럼 전파력이 강할수록 [[90 % 이상]]의 높은 접종률이 필요하다.

= 생활 속 감염병 예방 | 사례
* 💉 예방 접종 :: 나와 접종할 수 없는 이웃(아기, 환자)을 함께 지킨다
* 🧼 손 씻기 :: 접촉 전파 차단
* 😷 마스크 :: 비말 전파 차단
* 🏠 아프면 쉬기 :: 접촉 수를 줄여 실제 재생산 수를 낮춘다
* 💊 항생제 바르게 쓰기 :: 내성균을 막는다
* 📈 곡선 평탄화 :: 의료 체계가 감당할 수 있게 환자를 분산

= 확인 문제 1
Q R₀가 4인 감염병에서 집단 면역에 필요한 접종률은?
o 25 %
o 50 %
o* 75 %
o 100 %
:: 1 − 1/4 = 0.75 → 약 75 %

= 확인 문제 2
Q 바이러스 감염에 항생제가 효과가 없는 까닭은?
o 바이러스가 너무 커서
o* 바이러스는 숙주 세포 안에서만 증식하여 항생제의 작용 대상이 아니어서
o 바이러스는 병원체가 아니어서
o 항생제가 너무 비싸서
:: 항생제는 스스로 증식하는 세균을 공격한다.

= 확인 문제 3
Q R₀ = 2인 감염병에서 인구의 30 %가 면역이 있을 때 실제 재생산 수는?
o 0.6
o 1.0
o* 1.4
o 2.0
:: 2 × (1 − 0.3) = 1.4 → 1보다 커서 아직 확산된다.

= 확인 문제 4
Q 감염 곡선의 정점을 낮추는 것(곡선 평탄화)이 중요한 까닭은?
o 누적 감염자를 0으로 만들기 위해
o* 환자가 한꺼번에 몰리지 않게 하여 의료 체계가 감당할 수 있게 하기 위해
o 백신을 만들지 않기 위해
o 감염 기간을 무조건 짧게 하기 위해
:: 병상과 의료 인력이 부족해지지 않도록 환자 발생을 분산시킨다.

= 서술형 도전 | 생각 넓히기
? 세균 감염과 바이러스 감염의 치료 방법이 다른 까닭을 쓰시오. :: 세균은 스스로 증식하는 생물이라 항생제로 치료할 수 있지만, 바이러스는 숙주 세포 안에서만 증식하므로 항생제가 듣지 않고 항바이러스제나 백신으로 대응한다.
? 감염병 대응에 빅데이터(이동 경로, 검색어 등)를 활용할 때의 이점과 우려되는 점을 쓰시오. :: 이점: 감염 경로를 빠르게 추적하고 확산을 예측해 효율적으로 대응할 수 있다. 우려: 개인 정보 침해, 데이터 오남용, 특정 집단에 대한 차별 가능성.

= 오늘 배운 내용 정리
- 병원체가 침입·증식하며 전파되는 질병 → [[감염병]]
- 감염자 1명이 평균적으로 감염시키는 사람 수 → [[R₀]], 1보다 [[작으면]] 감소
- 백신: 면역을 미리 형성 → 충분하면 [[집단 면역]]
- 집단 면역 필요 비율 ≈ [[1 − 1/R₀]]
- 세균 → 항생제, 바이러스 → [[항바이러스제]]·백신

= 나가기 전 한 문제 | 형성평가
? R₀가 5인 감염병에서 집단 면역에 필요한 접종률을 구하고, 접종률이 60 %일 때 확산이 멈추는지 판단하시오. :: 필요 접종률 = 1 − 1/5 = 80 %. 60 %일 때 실제 재생산 수 = 5 × 0.4 = 2 > 1이므로 확산이 멈추지 않는다.
