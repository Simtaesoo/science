## 과학 관련 사회적 쟁점 | SSI란?

= 과학 관련 사회적 쟁점(SSI)
! 과학기술과 관련되어 있으면서 사회적으로 의견이 나뉘는 문제
- 과학적 **증거**가 필요하지만, 증거만으로 결론이 정해지지 않는다.
- 사람마다 중요하게 여기는 **가치**(안전, 자유, 경제, 환경 등)가 다르다.
- 결정의 영향이 **개인과 사회, 미래 세대**에 미친다.
>+ 민주 시민은 과학적 근거를 이해하고, 다양한 관점을 고려해 **합리적으로 의사 결정**에 참여해야 한다.

= 좋은 근거, 약한 근거 | 판별
| 주장의 근거 | 판단 |
|+ 동료 평가를 거친 연구 결과, 공공 기관의 통계 | [[강한]] 근거 |
|+ 출처가 분명한 여러 자료가 일치함 | 강한 근거 |
|+ "누가 그러더라", 출처 없는 누리 소통망 글 | [[약한]] 근거 |
|+ 한 사람의 경험만으로 일반화 | 약한 근거 |
|+ 상관관계를 인과 관계로 단정 | 약한 근거 (2차시) |

## 과학 윤리 | 연구와 이용의 책임

= 연구 윤리와 이용 윤리
| 구분 | 지켜야 할 것 | 어긴 예 |
|+ 연구 윤리 | 정직한 데이터, 표절 금지, 연구 대상의 동의·안전 | 데이터 조작, 동의 없는 인체 실험 |
|+ 이용 윤리 | 사회와 환경에 미칠 영향 고려, 공정한 혜택 | 개인 정보 무단 수집, 위험 물질 무단 배출 |
>+ 과학 지식은 중립적일 수 있어도, **어떻게 연구하고 쓰는지**에는 책임이 따른다.

= 사례 · 프레온 가스 | 과학기술의 양면성
^+ 프레온 가스(CFC): 불에 타지 않고 독성이 없어 냉장고·스프레이에 널리 사용
^+ 과학자들이 프레온 가스가 **성층권의 오존층을 파괴**한다는 증거를 발견
^+ 국제 사회가 **몬트리올 의정서**(1987)로 사용을 단계적으로 금지
^+ 오존층이 서서히 회복되고 있다는 관측 결과
>+ 과학적 증거 → 사회적 합의 → 규제와 대체 기술: 과학과 사회가 함께 문제를 해결한 예

= 근거 기반 토론 | 모둠 활동
^ 쟁점을 하나 고른다. (예: 도심 얼굴 인식 카메라 설치, 유전자 편집 작물 판매, 인공지능 채용 면접)
^ 찬성·반대 각 입장의 **과학적 근거**와 **가치 판단**을 나누어 표로 정리한다.
^ 근거의 출처와 신뢰성을 확인한다.
^ 토론 후 처음 생각이 바뀌었는지, 왜 바뀌었는지 쓴다.
% 평가: 근거의 질, 반대 의견을 정확히 요약하는가, 가치와 사실을 구별하는가. 결론의 방향은 평가하지 않는다.

= 확인 문제 1
Q 과학 관련 사회적 쟁점(SSI)의 특징으로 옳지 않은 것은?
o 과학기술과 관련되어 있다
o 사람마다 중요하게 여기는 가치가 다르다
o* 과학 지식만 알면 정답이 하나로 정해진다
o 결정의 영향이 사회와 미래 세대에 미친다
:: SSI는 과학적 증거와 함께 가치와 윤리를 함께 고려해야 하는 문제이다.

= 확인 문제 2
Q 연구 윤리를 어긴 사례는?
o 실험 결과를 있는 그대로 기록했다
o 다른 연구자의 아이디어를 인용 표시와 함께 사용했다
o* 원하는 결론에 맞지 않는 데이터를 지우고 발표했다
o 사람을 대상으로 한 연구에서 참여자의 동의를 받았다
:: 데이터 조작·삭제는 연구 부정행위이다.

= 확인 문제 3
Q 토론에서 가장 신뢰할 만한 근거는?
o 친구가 들었다는 이야기
o 출처가 없는 동영상
o* 공공 기관의 통계와 동료 평가를 거친 연구 결과
o 한 사람의 경험담
:: 출처가 분명하고 검증을 거친 자료가 강한 근거이다.

= 서술형 도전 | 생각 넓히기
? 프레온 가스 사례에서 과학자와 시민, 국제 사회가 각각 한 역할을 쓰시오. :: 과학자는 오존층 파괴의 증거를 연구해 알렸고, 시민은 관심을 갖고 대체 제품을 선택했으며, 국제 사회는 몬트리올 의정서로 사용을 규제했다.
? 유전자 가위 기술을 사람에게 쓸 때 고려해야 할 윤리적 문제 두 가지를 쓰시오. :: (예) 다음 세대에 전해지는 변화의 안전성을 알 수 없다, 치료가 아닌 능력 향상에 쓰일 수 있다, 비용 때문에 혜택이 불공정하게 나뉠 수 있다.

= 오늘 배운 내용 정리
- 과학기술과 관련되어 사회적으로 의견이 나뉘는 문제 → [[과학 관련 사회적 쟁점]](SSI)
- SSI는 과학적 [[증거]]와 가치·윤리를 함께 고려한다.
- 연구 윤리: 정직한 데이터, 표절 금지, [[동의]]와 안전
- 이용 윤리: 사회·환경에 미칠 영향을 고려하고 혜택을 공정하게

= 나가기 전 한 문제 | 형성평가
? 오늘 토론한 쟁점에 대한 나의 입장을 한 문장으로 쓰고, 그 근거 하나와 반대 입장의 가장 좋은 근거 하나를 함께 쓰시오. :: (예시) 도심 얼굴 인식 카메라는 제한적으로만 설치해야 한다. 근거: 실종자 수색에 도움이 된다는 사례가 있다. 반대 근거: 수집된 얼굴 정보가 유출되면 되돌릴 수 없다.
