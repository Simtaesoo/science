## 빅데이터 | 많고, 빠르고, 다양한

= 빅데이터
! 빅데이터: 양이 매우 많고, 생성 속도가 빠르며, 형태가 다양한 데이터
- 분석하면 사람이 찾기 어려운 ==규칙(패턴)==을 발견하고 미래를 ==예측==할 수 있다.
| 분야 | 활용 예 |
|+ 기상 | 수많은 관측소·위성 자료로 날씨 예보 |
|+ 보건 | 감염병 확산 예측 |
|+ 교통 | 실시간 길 안내, 신호 조절 |
|+ 천문 | 망원경 영상에서 새 천체 자동 탐색 |

## 데이터에서 규칙 찾기 | 직선 맞추기와 상관

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#data | 데이터 세트마다 기울기·절편을 조절해 오차를 줄여 보고, [컴퓨터로 최적 직선 찾기]와 비교하자.
% 손으로 맞춘 직선과 컴퓨터의 최적 직선 오차를 비교하게 하기

= 예제 1 · 직선으로 예측하기 | 적용
- 기온 20, 24, 28, 32 ℃ → 판매량 100, 140, 180, 220개
^+ 기온 4 ℃ 오를 때 판매량 40개 증가 → 기울기 = **10개/℃**
^+ 직선: 판매량 = 10 × 기온 − 100
^+ 기온 30 ℃일 때 예측 = 10 × 30 − 100 = **200개**
||
C 기온과 아이스크림 판매량 (예시 자료) | 기온 (℃) | 판매량 (개) | 판매량:20,100 24,140 28,180 32,220
% 실제 자료는 점들이 직선 주위에 흩어져 있다 — 예시는 계산하기 쉽게 단순화

= 상관관계
! 상관관계: 한 변수가 변할 때 다른 변수도 함께 변하는 관계 (상관 계수 r: −1 ~ +1)
| r 값 | 해석 |
|+ +1에 가까움 | 강한 양의 상관 (함께 증가) |
|+ 0에 가까움 | 직선 관계가 거의 없음 |
|+ −1에 가까움 | 강한 음의 상관 (하나가 늘면 하나는 감소) |
>+ r이 0에 가까워도 **곡선 관계**는 있을 수 있다.

= 데이터 세트 해석 | 시뮬레이션 기록
| 데이터 세트 | 상관 계수 r | 해석 |
|+ 기온 ↔ 아이스크림 판매 | 약 0.93 | 강한 양의 상관 (인과 관계 있음) |
|+ 아이스크림 ↔ 물놀이 사고 | 약 0.82 | 상관 있지만 숨은 변인([[기온]]) 때문 |
|+ 기온 ↔ 전력 수요 | 작음 | [[U자]] 모양 관계라 직선으로 설명 어려움 |

= 예제 2 · 숨은 변인 찾기 | 적용
- "아이스크림 판매를 금지하면 물놀이 사고가 줄어든다"는 주장을 검토하자.
^+ 두 변수 모두 **기온이 높을 때** 증가한다.
^+ 기온 → 아이스크림 판매 ↑, 기온 → 물놀이 ↑ → 사고 ↑
^+ 아이스크림은 사고의 원인이 **아니다** → 판매를 금지해도 사고는 줄지 않는다.
>+ 상관관계 ≠ 인과 관계. **숨은 변인**을 찾아야 한다.

= 예제 3 · U자 모양 관계 | 적용
- 기온과 전력 수요: 추운 겨울(난방)과 더운 여름(냉방)에 모두 전력 수요가 크다.
^+ 기온이 낮을 때 ↑, 중간일 때 ↓, 높을 때 ↑ → **U자 모양**
^+ 직선을 맞추면 상관 계수가 **0에 가깝게** 나온다.
^+ '관계가 없다'가 아니라 '**직선 관계가 아니다**'로 해석해야 한다.
||
C 기온과 전력 수요 (개략적 예시) | 기온 (℃) | 전력 수요 (상대값) | 전력 수요:-10,90 0,75 10,60 20,55 25,65 30,85 35,100

= 생활 속 빅데이터 | 사례
* 🌦️ 일기 예보 :: 슈퍼컴퓨터가 방대한 관측 자료를 계산
* 🚗 내비게이션 :: 수많은 차량의 위치로 정체를 예측
* 🛒 추천 서비스 :: 구매 기록으로 취향을 예측
* 🏥 의료 영상 AI :: 수많은 영상으로 학습해 질병 진단을 돕는다
* 🔭 천문학 :: 하룻밤에 수 테라바이트의 하늘 사진 분석
* 🦠 감염병 감시 :: 검색어·이동량으로 유행을 조기 탐지

= 확인 문제 1
Q 빅데이터의 특징으로 알맞지 않은 것은?
o 양이 매우 많다
o 생성 속도가 빠르다
o 형태가 다양하다
o* 항상 정확하고 편향이 없다
:: 빅데이터도 수집 방법에 따라 편향되거나 오류가 있을 수 있다.

= 확인 문제 2
Q 판매량 = 10 × 기온 − 100인 직선으로 기온 35 ℃의 판매량을 예측하면?
o 200개
o* 250개
o 350개
o 450개
:: 10 × 35 − 100 = 250개

= 확인 문제 3
Q 두 변수 사이의 상관 계수가 0.9일 때 옳은 해석은?
o 반드시 한 변수가 다른 변수의 원인이다
o* 강한 양의 상관관계가 있지만 인과 관계는 따로 확인해야 한다
o 두 변수는 관계가 없다
o 음의 상관관계이다
:: 상관관계가 강해도 숨은 변인이 있을 수 있으므로 인과 관계는 별도로 검증해야 한다.

= 확인 문제 4
Q 인공지능이 빅데이터로 내린 결론을 신뢰하기 위해 확인할 것으로 알맞지 않은 것은?
o 데이터가 편향되지 않았는가
o 결과가 실험이나 다른 자료로 검증되는가
o 결론이 과학적 원리로 설명되는가
o* 결론이 내 생각과 같은가
:: 내 생각과 같은지가 아니라 데이터와 검증 과정이 타당한지를 따져야 한다.

= 확인 문제 5
Q 기온과 전력 수요처럼 U자 모양 관계인 데이터에 직선을 맞추었더니 상관 계수가 0에 가까웠다. 옳은 해석은?
o 두 변수는 아무 관계가 없다
o* 직선 관계는 약하지만 곡선 관계가 있을 수 있다
o 강한 음의 상관관계이다
o 데이터가 모두 틀렸다
:: 상관 계수는 직선 관계의 정도만 나타내므로 그래프 모양을 함께 살펴야 한다.

= 서술형 도전 | 생각 넓히기
? "아이스크림 판매를 금지하면 물놀이 사고가 줄어든다"는 주장의 문제점을 쓰시오. :: 두 변수는 기온이라는 공통 원인 때문에 함께 변할 뿐 인과 관계가 아니므로, 아이스크림 판매를 금지해도 사고는 줄지 않는다.
? 과학기술이 발달한 미래 사회에서 시민으로서 갖추어야 할 과학적 소양을 두 가지 쓰시오. :: 과학적 근거로 정보를 판단하는 능력, 데이터와 통계를 올바르게 해석하는 능력, 과학기술의 윤리적·사회적 영향을 함께 고려하는 태도, 가짜 정보를 가려내는 비판적 사고 등

= 오늘 배운 내용 정리
- 양이 많고, 속도가 빠르며, 형태가 다양한 데이터 → [[빅데이터]]
- 데이터에 직선을 맞추어 규칙을 찾고 [[예측]]한다.
- 함께 변하는 관계 → [[상관관계]] (r: −1 ~ +1)
- 상관관계가 있어도 [[인과 관계]]라고 단정할 수 없다 → [[숨은 변인]] 확인
