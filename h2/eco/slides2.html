^ 생태계에서 **에너지의 흐름**을 생태 피라미드로 설명할 수 있다.

% 흐름: 생각 열기 5분 → 에너지 흐름 8분 → 에너지 피라미드(시뮬레이션) 12분 → 계산 10분 → 평형·문항 10분

* 🌾 초원 :: 풀은 끝없이 펼쳐져 있다
* 🦓 얼룩말 :: 수천 마리가 무리 지어 산다
* 🦁 사자 :: 같은 넓이에 몇십 마리뿐
* 🔥 열 :: 생물은 살아가며 끊임없이 열을 내보낸다
? 먹이 사슬의 위로 갈수록 생물의 수가 줄어드는 까닭은? :: 한 단계 위로 갈 때마다 에너지의 대부분(약 90 %)이 **호흡·열**로 빠져나가 위 단계가 쓸 수 있는 에너지가 적기 때문이다.

- 생물 요소: [[생산자]], 소비자, [[분해자]]
- 여러 먹이 사슬이 얽힌 것 → [[먹이 그물]]
? 생태계 에너지는 처음 어디에서 들어올까? :: **태양 에너지** — 생산자가 광합성으로 유기물 속 화학 에너지로 바꾸어 생태계에 들여온다.

## 에너지 흐름 | 한 방향으로, 줄어들며

= 생태계의 에너지 흐름
! 에너지는 먹이 사슬을 따라 한 방향으로 흐르다가 열로 빠져나간다
- 에너지의 근원: ==태양 에너지==
- 다음 단계로 전달되는 에너지: 약 ==10 %== (나머지는 호흡·열·배설물)
>+ 에너지는 **흐르고**(재사용 불가), 물질은 분해자를 거쳐 **순환**한다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#pyramid | [에너지 피라미드]에서 단계별 에너지와 손실을 기록하자. 이어서 [생태계 평형]에서 [교란]을 누르고 토끼와 여우의 개체 수 변화를 관찰하자.
% 에너지 피라미드 → 평형 순서. 교란 후 개체 수 변화의 '순서'를 말로 정리하게

= 에너지 피라미드 | 시뮬레이션 기록
| 영양 단계 | 생산자 | 1차 소비자 | 2차 소비자 | 3차 소비자 |
|+ 에너지 (kJ) | 10 000 | 1 000 | [[100]] | [[10]] |
|+ 호흡·열로 잃은 에너지 (kJ) | 9 000 | [[900]] | 90 | – |
- 생태 피라미드: 개체 수, 생물량, 에너지양 → 상위 단계로 갈수록 [[줄어든다]]

= 예제 1 · 에너지 전달률 | 적용
- 생산자 10 000 kJ → 1차 소비자 1 000 kJ
^+ 에너지 전달률 = 1 000 ÷ 10 000 × 100 = **10 %**
^+ 3차 소비자까지: 10 000 × 0.1 × 0.1 × 0.1 = **10 kJ**
^+ 생산자 에너지의 **0.1 %**만 3차 소비자에게 도달

= 예제 2 · 매 한 마리를 위해 | 적용
- 3차 소비자인 매가 하루에 50 kJ이 필요하다. 전달률이 10 %일 때 생산자는 하루에 얼마의 에너지를 만들어야 할까?
^+ 2차 소비자: 50 ÷ 0.1 = **500 kJ**
^+ 1차 소비자: 500 ÷ 0.1 = **5 000 kJ**
^+ 생산자: 5 000 ÷ 0.1 = **50 000 kJ**
>+ 최종 소비자가 적은 까닭 — 넓은 생산자 바탕이 필요하다.

= 예제 3 · 곡물과 고기 | 적용
- 곡물 100 kg의 에너지를 사람이 직접 먹는 경우와, 가축이 먹고 사람이 고기를 먹는 경우를 비교하자. (전달률 10 %)
^+ 직접: 곡물 100 kg의 에너지를 그대로 이용 (사람 = 1차 소비자)
^+ 가축을 거치면: 고기로 남는 에너지는 약 **10 kg** 분량
^+ 같은 땅에서 곡물을 직접 먹으면 약 **10배** 많은 사람을 먹일 수 있다.

## 생태계 평형 | 흔들려도 돌아온다

= 생태계 평형
! 생태계 평형: 생물의 종류와 개체 수, 물질의 양이 비교적 일정하게 유지되는 상태
^+ 1차 소비자 **증가**
^+ → 2차 소비자 [[증가]], 생산자 [[감소]]
^+ → 1차 소비자 [[감소]]
^+ → 2차 소비자 감소, 생산자 증가 → [[평형 회복]]

= 토끼와 여우 | 그래프 해석
C 교란 후 토끼와 여우의 개체 수 (모형) | 시간 | 개체 수 | 토끼:0,100 1,140 2,160 3,130 4,90 5,80 6,100 7,130 8,140 | 여우:0,20 1,25 2,35 3,40 4,35 5,25 6,20 7,22 8,30
+ 여우의 최대·최소는 토끼보다 [[조금 늦게]] 나타난다.
+ 먹이 관계로 개체 수가 오르내리며 평형 근처로 [[되돌아온다]].

= 생활 속 생태계 평형 | 사례
* 🦌 사슴 과잉 :: 천적이 사라지면 식물이 줄어 평형이 깨진다
* 🐟 남획 :: 회복 속도보다 빨리 잡으면 어장이 무너진다
* 🌡️ 지구 온난화 :: 산호 백화로 바다 생태계가 바뀐다
* 🌳 산불 후 숲 :: 풀 → 관목 → 숲으로 천천히 회복
* 🦎 외래종 :: 천적이 없어 급격히 늘며 평형을 깨뜨린다
* 🌉 생태 통로 :: 끊긴 서식지를 이어 평형 회복을 돕는다

= 확인 문제 1
Q 생산자의 에너지가 20 000 kJ일 때 2차 소비자에게 전달되는 에너지는? (전달률 10 %)
o 2 000 kJ
o* 200 kJ
o 20 kJ
o 2 kJ
:: 20 000 × 0.1 × 0.1 = 200 kJ

= 확인 문제 2
Q 생태계에서 에너지와 물질의 이동에 대한 설명으로 옳은 것은?
o 에너지와 물질 모두 순환한다
o* 에너지는 한 방향으로 흐르고, 물질은 순환한다
o 에너지는 순환하고, 물질은 한 방향으로 흐른다
o 에너지와 물질 모두 한 방향으로만 흐른다
:: 에너지는 결국 열로 빠져나가고, 물질은 분해자를 거쳐 다시 생산자에게 돌아간다.

= 확인 문제 3
Q 1차 소비자가 갑자기 늘었을 때 곧바로 나타나는 변화로 옳은 것은?
o 생산자 증가, 2차 소비자 감소
o* 생산자 감소, 2차 소비자 증가
o 생산자와 2차 소비자 모두 감소
o 아무 변화 없음
:: 1차 소비자가 생산자를 많이 먹고, 먹이가 늘어난 2차 소비자는 늘어난다.

= 확인 문제 4
Q 큰 교란이 오면 생태계가 원래 평형으로 돌아오지 못할 수 있는 까닭은?
o 생태계의 회복력에는 한계가 없어서
o* 교란이 너무 크면 생물이 멸종하거나 먹이 관계가 무너지기 때문에
o 에너지가 순환하기 때문에
o 분해자가 너무 많아서
:: 생태계 회복력에는 한계가 있어, 큰 교란은 생태계를 새로운 상태로 바꿀 수 있다.

= 서술형 도전 | 생각 넓히기
? 같은 넓이의 땅에서 곡물을 직접 먹을 때가 가축을 길러 고기를 먹을 때보다 더 많은 사람을 먹여 살릴 수 있는 까닭을 쓰시오. :: 영양 단계를 하나 더 거칠 때마다 에너지의 약 90 %가 손실되므로, 낮은 영양 단계에서 먹을수록 이용할 수 있는 에너지가 많기 때문이다.
? 생태계 보전을 위해 개인과 사회가 할 수 있는 일을 하나씩 쓰시오. :: 개인: 일회용품 줄이기, 외래종 함부로 방생하지 않기, 에너지 절약 / 사회: 보호 구역 지정, 생태 통로 설치, 오염 물질 배출 규제, 멸종 위기종 복원 사업

= 나가기 전 한 문제 | 형성평가
? 생산자 → 1차 소비자 → 2차 소비자에서 2차 소비자가 300 kJ의 에너지를 얻었다. 전달률 10 %일 때 생산자의 에너지와 1차 소비자가 호흡·열로 잃은 에너지를 구하시오. :: 1차 소비자 = 300 ÷ 0.1 = 3000 kJ, 생산자 = 3000 ÷ 0.1 = 30 000 kJ, 1차 소비자가 잃은 에너지 = 3000 − 300 = 2700 kJ
