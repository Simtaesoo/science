<!doctype html>
<html lang="ko">
<head>

<title>생태계 복원단 · 고1 생태계와 환경</title>
<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/app.js"></script>
<script src="../../assets/hskit.js"></script>

<body>
<script>
const app = AppKit({
  id: 'h2eco', title: '생태계 복원단', unit: '고1 · 통합과학2 · 33 생태계와 환경', back: '../../index.html#hi2', sim: 'sim.html#web',
  lead: '망가진 생태계를 되살리는 <b>생태계 복원단</b>이 되어 보세요. 먹이 관계를 밝혀 먹이 그물을 완성하고, 에너지 흐름을 계산하고, 늑대를 다시 풀어 숲의 <b>평형</b>을 되찾으세요!',
  howto: ['먹이 그물 단계: 먹히는 생물에서 <b>먹는 생물 쪽으로 끌어서</b> 화살표(에너지 흐름)를 그리세요. 같은 방향으로 다시 끌면 지워져요.', '늑대 단계: 다시 풀어 줄 늑대 수를 정하고 <b>[시뮬레이션]</b>으로 25년 동안의 변화를 확인하세요.', '설명을 잘 읽고 <b>[확인]</b>!'],
  recap: '<b>먹이 사슬·먹이 그물</b>: 생산자 → 1차 소비자 → 2차 소비자 … 로 에너지가 흐르며, 먹이 관계가 그물처럼 복잡할수록 한 종이 사라져도 다른 먹이로 대체할 수 있어 생태계가 안정하다. <b>생태 피라미드</b>: 각 영양 단계에서 에너지의 일부만(대략 10 % 안팎) 다음 단계로 전달되고 나머지는 호흡 등으로 열로 방출되므로 상위 단계로 갈수록 에너지양·개체 수·생물량이 줄어든다. <b>생태계 평형</b>: 포식자와 피식자의 개체 수는 서로 영향을 주며 일정 범위에서 유지된다 — 옐로스톤에 늑대를 다시 들여오자 엘크 수가 조절되어 식물이 회복되었다.',
  startLabel: '복원 시작'
});
const {S, sfx, toast} = app, D = Draw;
const LV = [
  {t: 'web', name: '들판의 먹이 사슬', nodes: [['🌾', '풀', .12, .5], ['🦗', '메뚜기', .32, .5], ['🐸', '개구리', .52, .5], ['🐍', '뱀', .72, .5], ['🦅', '매', .9, .5]],
    clue: '메뚜기는 풀을, 개구리는 메뚜기를, 뱀은 개구리를, 매는 뱀을 먹어요.', edges: [[0, 1], [1, 2], [2, 3], [3, 4]], why: '화살표는 “먹힌다 → 먹는다”, 곧 에너지가 이동하는 방향이에요. 풀이 생산자, 매가 최종 소비자.'},
  {t: 'web', name: '숲의 먹이 그물', nodes: [['🌿', '풀', .14, .72], ['🌰', '도토리', .14, .28], ['🐇', '토끼', .4, .78], ['🐿️', '다람쥐', .4, .22], ['🦗', '메뚜기', .4, .5], ['🦊', '여우', .68, .62], ['🦉', '부엉이', .68, .3], ['🐺', '늑대', .9, .5]],
    clue: '토끼·메뚜기는 풀을, 다람쥐는 도토리를 먹어요. 여우는 토끼와 메뚜기를, 부엉이는 다람쥐와 토끼를 먹어요. 늑대는 여우와 토끼를 먹어요.',
    edges: [[0, 2], [0, 4], [1, 3], [2, 5], [4, 5], [3, 6], [2, 6], [5, 7], [2, 7]], why: '토끼를 먹는 생물이 여럿이라, 한 포식자가 사라져도 다른 포식자가 토끼 수를 조절해요 — 먹이 그물이 복잡할수록 안정!'},
  {t: 'quiz', q: '생산자가 고정한 에너지가 10000 kJ이고 각 단계의 에너지 전달 효율이 10 %일 때, 2차 소비자가 얻는 에너지는?', ch: ['1000 kJ', '100 kJ', '10 kJ', '5000 kJ'], a: 1, why: '10000 → 1차 소비자 1000 → 2차 소비자 100 kJ. 나머지는 호흡으로 열이 되어 빠져나가요 → 생태 피라미드.'},
  {t: 'sim', name: '옐로스톤 늑대 재도입', why: '늑대가 엘크를 적당히 사냥하자 엘크 수가 줄어 식물이 회복되고, 엘크가 줄면 늑대도 줄어 서로 일정 범위에서 유지돼요. 너무 많이 풀면 엘크가 급감해요!'},
  {t: 'quiz', q: '어떤 숲에서 토끼의 천적이 갑자기 모두 사라졌다. 그 직후 일어날 일로 가장 알맞은 것은?', ch: ['토끼가 늘고 풀이 줄어든다', '토끼와 풀이 모두 줄어든다', '아무 변화가 없다', '풀이 늘고 토끼가 줄어든다'], a: 0, why: '천적이 없어 토끼가 늘고 → 풀이 줄어 → 나중엔 먹이 부족으로 토끼도 줄어요. 평형이 깨졌다가 다시 회복되는 데 오랜 시간이 걸려요.'}];
let ui = {}, edges = [], drag = null, W0, run = null, prog = 0;
function sim(w0){ let P = 40, E = 60, Wf = w0; const out = [[0, P, E, Wf]];
  for (let y = 1; y <= 25; y++) { const eat = .006 * P * E, pred = .012 * E * Wf; P = Math.max(1, P + .6 * P * (1 - P / 100) - eat); E = Math.max(0, E + .5 * eat - .1 * E - pred); Wf = Math.max(0, Wf + .3 * pred - .12 * Wf); out.push([y, P, E, Wf]); }
  return out; }
const k = HS(app, {levels: LV, load(L){ edges = []; run = null; ui.w.parentElement.style.display = L.t === 'sim' ? '' : 'none'; ui.b.parentElement.style.display = L.t === 'quiz' ? 'none' : '';
  if (L.t === 'quiz') { k.mission(ui.g, '복원단 퀴즈'); app.quiz(ui.t, L.q, L.ch, L.a, {explain: L.why, onWrong: () => { k.fails++; app.addScore(-10); }, onRight: () => k.win(ui.g, '')}); return; }
  if (L.t === 'web') { k.mission(ui.g, `<b>${L.name}</b>을 완성하세요.`); ui.t.innerHTML = `<p>${L.clue}</p>`; }
  else { k.mission(ui.g, `<b>${L.name}</b><br>엘크가 너무 많아 숲이 망가졌어요. 늑대를 풀어 <b>10년 뒤 식물 60 이상</b>, 25년 동안 <b>엘크 20 이상</b>을 유지하세요.`); ui.t.innerHTML = '<p class="note-c">수치는 상대적인 개체 수(식물은 생물량)예요.</p>'; } }});
app.onStart = () => { ui.g = app.panel('복원 과제'); ui.t = app.panel('단서'); ui.w = app.panel('늑대 재도입');
  W0 = k.slider(ui.w, {label: '풀어 줄 늑대', min: 0, max: 30, step: 1, val: 0, fmt: v => v + '마리', on: () => { run = null; }});
  k.btn(ui.w, '▶ 25년 시뮬레이션', () => { run = sim(W0.v); prog = 0; sfx.whoosh(); }, 'big alt');
  ui.b = app.panel(''); k.btn(ui.b, '✔ 확인', () => { const L = k.L();
    if (L.t === 'web') { const key = e => e.join('-'), want = new Set(L.edges.map(key)), got = new Set(edges.map(key)); const miss = [...want].filter(e => !got.has(e)).length, extra = [...got].filter(e => !want.has(e)).length;
      if (miss || extra) return k.fail(extra ? `잘못된 화살표 ${extra}개${miss ? `, 빠진 화살표 ${miss}개` : ''}` : `빠진 먹이 관계가 ${miss}개 있어요`); return k.win(ui.g, L.why); }
    const r = run || sim(W0.v); if (!run) { run = r; prog = 1; }
    if (r[10][1] < 60) return k.fail(`10년 뒤 식물 ${r[10][1].toFixed(0)} — 아직 숲이 회복되지 않았어요`);
    const mn = Math.min(...r.map(x => x[2])); if (mn < 20) return k.fail(`엘크가 ${mn.toFixed(0)}까지 줄었어요 — 늑대가 너무 많아요`);
    k.win(ui.g, L.why, `늑대 ${W0.v}마리`); });
  k.begin(); };
function nodeAt(x, y){ const L = k.L(); if (L.t !== 'web') return -1; return L.nodes.findIndex(n => Math.hypot(x - n[2] * S.w, y - n[3] * S.h) < 32); }
app.pointer({down(x, y){ const i = nodeAt(x, y); drag = i >= 0 ? {i, x, y} : null; }, move(x, y, d){ if (drag && d) { drag.x = x; drag.y = y; } },
  up(x, y){ if (!drag) return; const j = nodeAt(x, y); if (j >= 0 && j !== drag.i) { const ix = edges.findIndex(e => e[0] === drag.i && e[1] === j); if (ix >= 0) edges.splice(ix, 1); else edges.push([drag.i, j]); sfx.click(); } drag = null; }});
app.step = dt => { if (run && prog < 1) prog = Math.min(1, prog + dt / 2.5); };
k.draw((g, W, H) => { const L = k.L(); g.fillStyle = '#eef3e2'; g.fillRect(0, 0, W, H);
  if (L.t === 'web') { const P = L.nodes.map(n => [n[2] * W, n[3] * H]);
    edges.forEach(([a, b]) => { const [x0, y0] = P[a], [x1, y1] = P[b], d = Math.hypot(x1 - x0, y1 - y0), u = [(x1 - x0) / d, (y1 - y0) / d]; D.arrow(g, x0 + u[0] * 30, y0 + u[1] * 30, x1 - u[0] * 32, y1 - u[1] * 32, '#c0762b', 3); });
    if (drag) D.arrow(g, P[drag.i][0], P[drag.i][1], drag.x, drag.y, 'rgba(47,111,208,.6)', 3);
    L.nodes.forEach(([e, n], i) => { const [x, y] = P[i]; g.fillStyle = '#fff'; g.strokeStyle = '#7a9a5a'; g.lineWidth = 2.5; g.beginPath(); g.arc(x, y, 28, 0, 7); g.fill(); g.stroke(); D.text(g, e, x, y - 2, {size: 26}); D.text(g, n, x, y + 40, {size: 12.5, weight: 700, color: '#34404e'}); });
    D.text(g, '먹히는 생물 → 먹는 생물 방향으로 끌기', W / 2, H - 14, {size: 12, color: '#55606e'}); return; }
  if (L.t === 'quiz') { D.text(g, L.a === 1 ? '🌾 → 🐇 → 🦊' : '🐇🐇🐇 🌾?', W / 2, H / 2, {size: Math.min(W, H) * .1}); return; }
  const A = k.axes(g, {x: 52, y: 22, w: W - 76, h: H - 66}, [0, 25, 5], [0, 100, 20], '시간 (년)', '개체 수 (상대값)');
  if (!run) { D.text(g, '늑대 수를 정하고 [25년 시뮬레이션]을 눌러 보세요', W / 2, H / 2, {size: 14, color: '#55606e'}); return; }
  const r = run, n = Math.max(1, Math.floor(r.length * prog)), ghost = false;
  [[1, '#2f8a55', '식물'], [2, '#c0762b', '엘크'], [3, '#55606e', '늑대']].forEach(([c, col, nm], j) => { k.line(g, r.slice(0, n).map(x => [A.X(x[0]), A.Y(Math.min(100, x[c]))]), ghost ? col + '55' : col, ghost ? 2 : 3); const e = r[n - 1]; D.text(g, nm, A.X(e[0]) - 4, A.Y(Math.min(100, e[c])) - 10, {size: 12, weight: 700, color: col, align: 'right'}); });
  g.strokeStyle = 'rgba(208,83,63,.6)'; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(A.X(0), A.Y(20)); g.lineTo(A.X(25), A.Y(20)); g.stroke(); g.beginPath(); g.moveTo(A.X(10), A.Y(60)); g.lineTo(A.X(10), A.Y(100)); g.stroke(); g.setLineDash([]);
  D.text(g, '엘크 최소선 20', A.X(.5), A.Y(20) + 11, {size: 11, color: '#d0533f', align: 'left'}); D.text(g, '10년: 식물 60↑', A.X(10) + 4, A.Y(96), {size: 11, color: '#d0533f', align: 'left'});
});
</script>
