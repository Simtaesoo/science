# 생태계 구성 요소와 먹이 그물 | 모든 생물은 연결되어 있다 | 고등학교 통합과학2 · 03 생태계와 환경 · 1차시 | 2022 개정 교육과정 [10통과2-02-01]

= 오늘의 학습 목표 | 1차시
^ 생태계의 **생물 요소**와 **비생물 요소**를 구분하고 관계를 설명할 수 있다.
^ **먹이 사슬**과 **먹이 그물**을 구별할 수 있다.
^ 먹이 그물의 복잡성과 **생태계 안정성**의 관계를 추론할 수 있다.
% 흐름: 생각 열기 5분 → 생태계 구성 요소 10분 → 먹이 그물(시뮬레이션) 12분 → 생물 농축·적용 10분 → 문항 8분

= 늑대가 강의 모양을 바꿨다? | 생각 열기
* 🐺 1920년대 옐로스톤 :: 늑대를 모두 없앴다
* 🦌 그 뒤 :: 사슴(엘크)이 크게 늘어 강가의 나무를 다 먹었다
* 🌳 1995년 :: 늑대를 다시 들여왔다
* 🏞️ 몇 년 뒤 :: 나무가 다시 자라고 강둑이 단단해졌다
? 늑대 한 종이 어떻게 숲과 강까지 바꿀 수 있었을까? :: 생물들이 **먹이 그물**로 연결되어 있어, 한 종의 변화가 다른 생물과 비생물 환경까지 이어지기 때문이다.

= 중학교에서 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 광합성 | 빛 에너지로 양분(포도당)을 만든다 |
| 먹이 사슬 | 생물 사이의 먹고 먹히는 관계 |
| 생물 다양성 | 다양한 생물 종이 함께 살아가는 정도 |
? 숲속 생물 중 스스로 양분을 만드는 것은? :: **식물**(생산자) — 다른 생물은 모두 이 양분에 기대어 산다.

## 생태계 | 생물과 환경의 그물

= 생태계의 구성 요소
! 생태계: 생물 요소와 비생물 요소가 서로 영향을 주고받는 체계
| 구분 | 역할 | 예 |
|+ 생산자 | 광합성으로 유기물 생산 | 식물, 식물 플랑크톤 |
|+ 소비자 | 다른 생물을 먹어 양분을 얻음 | 메뚜기, 개구리, 매 |
|+ 분해자 | 사체·배설물을 분해해 무기물로 | 세균, 곰팡이 |
|+ 비생물 요소 | 생물에 영향을 주고받음 | 빛, 온도, 물, 공기, 토양 |

= 생물 ⇄ 비생물 요소
* ☀️ 빛 → 식물 :: 양지 식물은 잎이 두껍고, 음지 식물은 얇고 넓다
* 🌡️ 온도 → 동물 :: 추운 지방 동물은 몸집이 크고 귀가 작다
* 💧 물 → 식물 :: 사막 식물은 잎이 가시로 변했다
* 🍂 식물 → 토양 :: 낙엽이 쌓여 토양이 비옥해진다
* 🌳 숲 → 공기 :: 증산 작용으로 주변 습도를 높인다
* 🪱 지렁이 → 토양 :: 흙을 섞어 공기가 잘 통하게 한다

= 예제 1 · 분해자가 사라지면? | 적용
^+ 사체와 배설물이 분해되지 않고 **쌓인다.**
^+ 유기물 속 원소가 무기물로 돌아가지 못한다 → 물질이 **순환하지 못함**
^+ 생산자가 필요한 영양분(무기 염류)을 얻지 못한다.
^+ 결국 생산자 → 소비자 순으로 생태계 전체가 **유지되기 어렵다.**

## 먹이 그물 | 복잡할수록 튼튼하다

= 먹이 사슬과 먹이 그물
- **먹이 사슬**: 생산자에서 최종 소비자까지 한 줄로 이어진 먹고 먹히는 관계
! 먹이 그물: 여러 먹이 사슬이 복잡하게 얽힌 것
>+ 먹이 그물이 복잡할수록 한 종이 사라져도 **다른 먹이**로 대체할 수 있어 생태계가 **안정**하다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#web | [복잡한 먹이 그물]과 [단순한 먹이 사슬]에서 각각 메뚜기를 없애고 결과를 비교하자.
% 메뚜기를 없애기 전에 '누가 가장 큰 영향을 받을까?'를 먼저 예측하게 하기

= 메뚜기가 사라지면 | 시뮬레이션 기록
| 구분 | 복잡한 먹이 그물 | 단순한 먹이 사슬 |
|+ 개구리 | 감소 | [[사라짐]] (다른 먹이 없음) |
|+ 최종 소비자 (매) | [[다른 먹이로 유지]] | [[사라짐]] |
|+ 생산자 (풀) | 일시 증가 가능 | 일시 증가 |

= 예제 2 · 생물 농축 | 자료 해석
- 분해되지 않고 몸에 쌓이는 물질(DDT)의 농도 (ppm, 미국 롱아일랜드 습지 조사 자료 근삿값)
| 물 | 동물성 플랑크톤 | 작은 물고기 | 큰 물고기 | 물수리 |
| 0.000 05 | 0.04 | 0.5 | 2 | 25 |
^+ 물수리 ÷ 물 = 25 ÷ 0.000 05 = **500 000배**
^+ 먹이 사슬을 따라 올라갈수록 농도가 **높아진다** → 최종 소비자가 가장 큰 피해
% 작은 물고기 값은 조사 범위(약 0.2~0.9 ppm)의 대표값

= 생활 속 먹이 그물 | 사례
* 🐺 옐로스톤 늑대 :: 최종 소비자의 복귀로 숲과 강이 회복
* 🐝 꿀벌 감소 :: 꽃가루받이가 줄어 식물·농작물에 영향
* 🦈 상어 남획 :: 중간 포식자가 늘어 조개·해초에 연쇄 영향
* 🐟 외래종 배스 :: 토종 물고기를 먹어 먹이 그물을 흔든다
* 🐦 DDT와 맹금류 :: 생물 농축으로 알껍데기가 얇아졌다
* 🍄 버섯과 세균 :: 숲 바닥의 분해자가 영양분을 되돌린다

= 확인 문제 1
Q 생태계의 생물 요소 중 사체와 배설물을 분해하는 것은?
o 생산자
o 1차 소비자
o 최종 소비자
o* 분해자
:: 세균, 곰팡이 같은 분해자가 유기물을 무기물로 분해한다.

= 확인 문제 2
Q 먹이 그물이 복잡한 생태계가 더 안정한 까닭은?
o 생물의 수가 적어서
o* 한 종이 사라져도 다른 먹이로 대체할 수 있어서
o 생산자가 없어서
o 비생물 요소가 없어서
:: 먹이 관계가 여러 갈래라 한 연결이 끊겨도 생태계가 유지된다.

= 확인 문제 3
Q 다음 중 생물이 비생물 요소에 영향을 주는 예는?
o 빛의 세기에 따라 잎의 두께가 다르다
o 추운 지방 동물의 몸집이 크다
o* 낙엽이 쌓여 토양이 비옥해진다
o 사막 식물의 잎이 가시로 변했다
:: 생물(식물)이 비생물 요소(토양)를 바꾼 예이다.

= 확인 문제 4
Q 물의 DDT 농도가 0.000 05 ppm이고 최종 소비자의 농도가 25 ppm일 때, 몇 배로 농축되었는가?
o 5 000배
o 50 000배
o* 500 000배
o 5 000 000배
:: 25 ÷ 0.000 05 = 500 000배

= 확인 문제 5
Q 먹이 사슬에서 생물 농축의 피해가 가장 큰 생물은?
o 생산자
o 1차 소비자
o 분해자
o* 최종 소비자
:: 분해·배출되지 않는 물질은 먹이 사슬의 위로 갈수록 농도가 높아진다.

= 서술형 도전 | 생각 넓히기
? 분해자가 모두 사라진다면 생태계에 어떤 일이 생길지 쓰시오. :: 사체와 배설물이 분해되지 않고 쌓여 무기물이 순환하지 못하므로, 생산자가 필요한 영양분을 얻지 못해 생태계 전체가 유지되기 어렵다.
? 옐로스톤에서 늑대를 없앴다가 다시 들여온 뒤 숲과 하천이 회복된 까닭을 먹이 그물로 설명하시오. :: 최종 소비자인 늑대가 사라지자 사슴이 늘어 식물을 지나치게 먹었고, 늑대가 돌아오자 사슴 수가 조절되어 식물이 회복되고 이를 이용하는 다른 생물과 강둑까지 회복되었다.

= 오늘 배운 내용 정리
- 생태계 = [[생물 요소]] + 비생물 요소 (서로 영향을 주고받음)
- 생물 요소: [[생산자]], 소비자, [[분해자]]
- 여러 먹이 사슬이 얽힌 것 → [[먹이 그물]], 복잡할수록 [[안정]]
- 분해되지 않는 물질은 상위 단계로 갈수록 농도 증가 → [[생물 농축]]

= 나가기 전 한 문제 | 형성평가
? 풀 → 메뚜기 → 개구리 → 뱀 → 매로 이어진 단순한 먹이 사슬에서 개구리가 사라지면 뱀과 메뚜기는 어떻게 될지 쓰고, 먹이 그물이 복잡할 때와 비교하시오. :: 단순한 사슬에서는 뱀은 먹이가 없어 줄어들거나 사라지고, 메뚜기는 천적이 없어 일시적으로 늘어난다. 먹이 그물이 복잡하면 뱀은 다른 먹이를 먹고, 메뚜기도 다른 천적에게 먹혀 변화가 작다.
