# 산·염기와 중화 반응 | H⁺ + OH⁻ → H₂O | 고등학교 통합과학2 · 02 화학 변화 · 2차시 | 2022 개정 교육과정 [10통과2-01-04]

= 오늘의 학습 목표 | 2차시
^ **산**과 **염기**의 성질을 이온으로 설명할 수 있다.
^ **중화 반응**의 알짜 이온 반응식을 쓰고 중화점을 찾을 수 있다.
^ 중화 반응에서 **용액의 온도 변화**와 **지시약의 색 변화**를 해석하고, 중화 반응을 생활 속에서 이용할 수 있다.
% 흐름: 생각 열기 5분 → 산과 염기 8분 → 중화 반응(시뮬레이션) 12분 → 온도·지시약 변화 10분 → 문항 10분
% 2022 개정 [10통과2-01-04] 해설: 산·염기 정의는 아레니우스 정의만, 중화 반응 과정에서의 변화는 용액의 온도 변화와 지시약의 색 변화만 다룬다. 이온 수 변화 그래프, 몰 농도 계산은 다루지 않는다.

= 속이 쓰릴 때 먹는 약 | 생각 열기
* 💊 제산제 :: 위산이 너무 많을 때 먹는다
* 🐝 벌레 물린 곳 :: 암모니아수를 바른다
* 🌾 산성 토양 :: 석회 가루를 뿌린다
* 🐟 생선회 :: 레몬즙을 뿌리면 비린내가 줄어든다
? 이 방법들의 공통 원리는? :: 산과 염기가 만나 서로의 성질을 없애는 **중화 반응** — H⁺와 OH⁻가 만나 물이 된다.

= 지난 시간 복습 | 1차시
- 수소보다 반응성이 큰 금속 + 산 → [[수소]] 기체 발생
- 이때 산의 [[H⁺]]가 전자를 얻어 환원된다.
? 산의 공통된 성질은 어떤 이온 때문일까? :: 산은 물에 녹아 공통으로 **H⁺**을 내놓는다. 염기는 공통으로 **OH⁻**을 내놓는다.

## 산과 염기 | 공통 이온이 성질을 정한다

= 산과 염기
| 구분 | 산 | 염기 |
|+ 정의 | 수용액에서 [[H⁺]]을 내놓는 물질 | 수용액에서 [[OH⁻]]을 내놓는 물질 |
|+ 예 | HCl, H₂SO₄, CH₃COOH | NaOH, KOH, Ca(OH)₂ |
|+ 맛·성질 | 신맛, 금속과 반응해 수소 발생 | 쓴맛, 단백질을 녹임 |
|+ 리트머스 | 푸른색 → 붉은색 | 붉은색 → 푸른색 |
|+ BTB 용액 | 노란색 | 파란색 (중성: 초록색) |

## 중화 반응 | H⁺와 OH⁻가 만나 물로

= 중화 반응
! 알짜 이온 반응식: H⁺ + OH⁻ → H₂O
- 산과 염기가 반응하여 ==물==이 생기는 반응
- 열이 발생하는 ==발열== 반응
- 산의 H⁺와 염기의 OH⁻가 모두 반응한 지점 → **중화점**
>+ 반응에 참여하지 않는 이온(Na⁺, Cl⁻) → **구경꾼 이온**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#acid | BTB 용액을 넣은 묽은 염산 10 mL에 NaOH 수용액을 1 mL씩 넣으며 용액의 색과 온도를 기록하자.
% 색이 초록색이 되는 순간(중화점)을 놓치지 않도록 1 mL씩 천천히

= 염산 + 수산화 나트륨 | 시뮬레이션 기록
| NaOH (mL) | 0 | 5 | 10 | 15 |
|+ BTB 색 | 노란색 | 노란색 | [[초록색]] | [[파란색]] |
|+ 용액의 성질 | 산성 | 산성 | [[중성]] | [[염기성]] |
|+ 온도 (℃) | 20 | 23 | [[26]] | 24.5 |

= 온도와 지시약 | 그래프 해석
C 혼합 용액의 온도 (예시) | NaOH (mL) | 온도 (℃) | 온도:0,20 2,21.2 4,22.4 6,23.6 8,24.8 10,26 12,25.4 15,24.5
||
| NaOH (mL) | 0~9 | 10 | 11~ |
|+ BTB 색 | [[노란색]] | [[초록색]] | [[파란색]] |
- 온도는 [[중화점]]에서 가장 높다.
- 지시약의 색이 바뀌는 지점으로 중화점을 찾을 수 있다.

= 예제 1 · 중화점 찾기 | 자료 해석
- 묽은 염산에 BTB 용액을 넣고 NaOH 수용액을 조금씩 넣으며 온도를 쟀다.
| NaOH (mL) | 0 | 4 | 8 | 12 | 16 |
| 온도 (℃) | 20.0 | 22.0 | 24.0 | 23.5 | 22.8 |
^+ 온도가 가장 높은 지점 근처(약 **8 mL**)가 중화점이다.
^+ 이때 BTB 색은 **초록색**이 된다.
^+ 16 mL를 넣은 용액은 **염기성** → BTB **파란색**

= 예제 2 · 지시약으로 판단하기 | 적용
- 세 비커 A, B, C에 BTB 용액을 넣었더니 각각 노란색, 초록색, 파란색이 되었다.
^+ A: 노란색 → **산성** → 염기를 더 넣어야 중화된다.
^+ B: 초록색 → **중성** (중화점)
^+ C: 파란색 → **염기성** → 산을 넣으면 다시 초록색으로 돌아올 수 있다.

= 예제 3 · 온도가 가장 높은 지점 | 적용
- 중화 반응은 발열 반응이다. 온도가 중화점에서 가장 높은 까닭은?
^+ 중화점까지: 생성되는 물이 늘어나 **발생하는 열 증가**
^+ 중화점 이후: 더 이상 중화 반응이 일어나지 않음 + 넣은 용액이 섞이며 **식는다**
^+ 따라서 생성된 물의 양이 최대인 **중화점**에서 온도가 가장 높다.

= 생활 속 중화 반응 | 사례
* 💊 제산제 :: 염기성 물질로 위산을 중화
* 🐝 벌레 물림 :: 산성 독에 암모니아수(염기)
* 🌾 산성 토양 :: 석회(염기)를 뿌려 중화
* 🐟 생선 비린내 :: 염기성 물질을 레몬즙(산)으로 중화
* 🦷 치약 :: 입속 산을 중화해 충치 예방
* 🏞️ 산성화된 호수 :: 석회 가루로 산성도를 낮춘다

= 확인 문제 1
Q 중화 반응의 알짜 이온 반응식으로 옳은 것은?
o Na⁺ + Cl⁻ → NaCl
o* H⁺ + OH⁻ → H₂O
o H⁺ + Cl⁻ → HCl
o Na⁺ + OH⁻ → NaOH
:: 실제로 반응하는 이온은 H⁺와 OH⁻이다.

= 확인 문제 2
Q 묽은 염산에 NaOH 수용액을 조금씩 넣을 때 혼합 용액의 온도 변화로 옳은 것은?
o 계속 낮아진다
o 변하지 않는다
o* 중화점까지 높아지다가 그 뒤로 낮아진다
o 처음부터 계속 높아진다
:: 중화 반응은 발열 반응이라 중화점까지 온도가 오르고, 그 뒤에는 반응 없이 섞이기만 하여 식는다.

= 확인 문제 3
Q 중화점에서 BTB 용액의 색은?
o 노란색
o* 초록색
o 파란색
o 붉은색
:: BTB 용액은 산성 노란색, 중성 초록색, 염기성 파란색이다.

= 확인 문제 4
Q 묽은 염산 10 mL에 같은 농도의 NaOH 수용액 6 mL를 넣은 혼합 용액의 성질은?
o* 산성
o 중성
o 염기성
o 알 수 없다
:: 중화점(10 mL)에 도달하지 않아 H⁺가 남아 있으므로 산성이다.

= 서술형 도전 | 생각 넓히기
? 혼합 용액의 온도가 중화점에서 가장 높은 까닭을 쓰시오. :: 중화 반응은 발열 반응인데, 중화점에서 생성된 물의 양이 가장 많아 발생한 열이 최대이고, 그 이후에는 반응 없이 용액만 섞여 온도가 낮아지기 때문이다.
? 산성비가 내리는 호수에 석회 가루를 뿌리면 어떤 효과가 있고, 어떤 점을 조심해야 하는지 쓰시오. :: 중화 반응으로 호수의 산성도를 낮춰 생물을 보호할 수 있다. 하지만 지나치게 뿌리면 염기성이 되어 생태계에 해가 될 수 있으므로 양을 조절해야 하고, 근본적으로는 산성비 원인 물질의 배출을 줄여야 한다.

= 적용 미션 · 중화 적정 챌린지 | 게임
@ app-titration.html | 뷰렛으로 염기를 떨어뜨려 산을 정확히 중화하자. 지시약 색이 바뀌는 한 방울을 노려라!
% 이 게임의 황산·농도 계산 단계는 교육과정 밖 심화(몰 농도 계산)이다. 수업에서는 지시약 색이 바뀌는 순간을 찾는 데까지만 활용한다.

= 오늘 배운 내용 정리
- 산: 수용액에서 [[H⁺]], 염기: 수용액에서 [[OH⁻]]을 내놓는다.
- 중화 반응: H⁺ + OH⁻ → [[H₂O]], [[발열]] 반응
- H⁺와 OH⁻가 모두 반응한 지점 → [[중화점]] (BTB 초록색, 온도 최고)
- 중화 반응을 이용한 생활: 제산제, 산성 토양에 석회, 벌레 물린 곳에 [[암모니아수]]

= 나가기 전 한 문제 | 형성평가
? BTB 용액을 넣은 묽은 염산에 NaOH 수용액을 넣어 중화점을 찾으려 한다. 중화점을 알아낼 수 있는 방법 두 가지를 쓰시오. :: BTB 용액의 색이 초록색으로 바뀌는 지점을 찾는다. 혼합 용액의 온도가 가장 높은 지점을 찾는다.
