## 산화와 환원 | 산소와 전자의 이동

= 산화와 환원의 정의
| 기준 | 산화 | 환원 |
|+ 산소 | 산소를 [[얻음]] | 산소를 [[잃음]] |
|+ 전자 | 전자를 [[잃음]] | 전자를 [[얻음]] |
! 산화와 환원은 항상 동시에 일어난다
>+ 한 물질이 잃은 전자(산소)를 다른 물질이 얻기 때문

= 금속의 반응성
! K > Ca > Na > Mg > Al > Zn > Fe > … > (H) > Cu > Ag > Au
- 왼쪽일수록 전자를 잃고 ==양이온==이 되기 쉽다 (반응성이 크다).
- 반응성이 큰 금속을 반응성이 작은 금속의 이온 수용액에 넣으면 → 큰 금속이 **산화**, 작은 금속 이온이 **환원**
>+ 수소(H)보다 반응성이 큰 금속은 산과 반응해 **수소 기체**를 낸다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#redox | 금속판과 수용액을 바꾸어 [반응 시작]을 누르고 결과를 기록하자.
% 반응하기 전에 반응성 순서로 '반응할까?'를 먼저 예측하게 하기

= 금속과 금속 이온의 반응 | 시뮬레이션 기록
| 금속판 | 수용액 | 반응 | 관찰 결과 | 산화 | 환원 |
|+ 아연 | 황산 구리(Ⅱ) | O | 붉은 구리 석출, 푸른색 옅어짐 | Zn | [[Cu²⁺]] |
|+ 구리 | 질산 은 | O | 은 결정 석출, 용액이 푸르게 | [[Cu]] | Ag⁺ |
|+ 구리 | 황산 아연 | [[X]] | 변화 없음 | – | – |
|+ 마그네슘 | 묽은 염산 | O | 수소 기체 발생 | Mg | [[H⁺]] |

= 예제 1 · 전자의 개수 맞추기 | 적용
- 구리를 질산 은 수용액에 넣었다: Cu + 2Ag⁺ → Cu²⁺ + 2Ag
^+ 구리 원자 1개가 전자 **2개**를 잃는다 (Cu → Cu²⁺)
^+ 은 이온 1개는 전자 **1개**를 얻는다 (Ag⁺ → Ag)
^+ 잃은 전자 수 = 얻은 전자 수 → 구리 1개당 은 **2개** 석출
>+ 구리 원자 3개가 반응하면 은 원자 6개가 석출된다.

= 예제 2 · 금속판의 질량 변화 | 적용
- 원자 1개의 상대적 질량: Cu 64, Ag 108, Zn 65 (근삿값)
^+ 구리판 + 질산 은: Cu 1개(64)가 녹고 Ag 2개(216)가 붙음 → 판의 질량 **증가**
^+ 아연판 + 황산 구리(Ⅱ): Zn 1개(65)가 녹고 Cu 1개(64)가 붙음 → 판의 질량 **약간 감소**
^+ 전자: Zn → Zn²⁺(2개 잃음), Cu²⁺ → Cu(2개 얻음) → **1 : 1**

= 확인 문제 1
Q 구리판을 황산 아연 수용액에 넣었을 때 반응이 일어나지 않는 까닭은?
o 구리가 아연보다 반응성이 커서
o* 구리가 아연보다 반응성이 작아서
o 황산 아연이 푸른색이라서
o 구리는 전자를 가지지 않아서
:: 반응성이 작은 구리는 아연 이온에게 전자를 주지 못한다.

## 생활 속 산화 환원 | 연소, 제련, 광합성

= 생활 속 산화 환원 반응
| 반응 | 화학 반응식 | 산화되는 물질 | 환원되는 물질 |
|+ 메테인의 연소 | CH₄ + 2O₂ → CO₂ + 2H₂O | CH₄ | [[O₂]] |
|+ 철의 제련 | Fe₂O₃ + 3CO → 2Fe + 3CO₂ | [[CO]] | Fe₂O₃ |
|+ 광합성 | 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ | H₂O | [[CO₂]] |
>+ 철의 제련: 산화 철이 산소를 잃어(**환원**) 순수한 철이 된다.

= 예제 3 · 배 바닥의 아연 | 적용
- 철로 만든 배의 바닥에 아연 덩어리를 붙여 둔다.
^+ 반응성: **Zn > Fe** → 아연이 먼저 전자를 잃는다.
^+ 아연이 대신 **산화**되며 철에 전자를 공급
^+ 철의 부식(산화)이 **늦춰진다** → 아연은 '희생 금속'
% 아연 덩어리는 정기적으로 교체해야 한다는 점도 덧붙이기

= 생활 속 산화 환원 | 사례
* 🔩 철의 녹 :: 철이 산소·물과 반응해 산화
* 🍎 사과 갈변 :: 레몬즙(비타민 C)이 대신 산화되어 늦춘다
* 🔥 연소 :: 연료가 산소와 결합 (산화)
* 🏭 용광로 :: 철광석을 코크스로 환원해 철을 얻는다
* 🔋 전지 :: 산화 환원 반응에서 전자의 흐름을 이용
* 🌿 광합성·세포 호흡 :: 생명체 속의 산화 환원

= 확인 문제 2
Q 산화에 대한 설명으로 옳은 것은?
o 산소를 잃는다
o 전자를 얻는다
o* 전자를 잃는다
o 항상 혼자 일어난다
:: 산화는 산소를 얻거나 전자를 잃는 반응이며, 환원과 동시에 일어난다.

= 확인 문제 3
Q Fe₂O₃ + 3CO → 2Fe + 3CO₂ 반응에서 환원되는 물질은?
o CO
o* Fe₂O₃
o CO₂
o Fe
:: 산화 철(Fe₂O₃)이 산소를 잃고 철이 되므로 환원된다.

= 확인 문제 4
Q 아연판을 황산 구리(Ⅱ) 수용액에 넣었을 때 용액의 푸른색이 옅어지는 까닭은?
o Zn²⁺가 푸른색이라서
o* Cu²⁺가 전자를 얻어 구리로 석출되며 줄어들어서
o 물이 증발해서
o 황산 이온이 사라져서
:: 푸른색을 띠는 Cu²⁺가 환원되어 구리 금속이 되므로 수가 줄어든다.

= 서술형 도전 | 생각 넓히기
? 구리 + 질산 은 반응에서 용액이 점점 푸르게 변하는 까닭을 이온으로 설명하시오. :: 구리가 전자를 잃고 Cu²⁺가 되어 녹아 나오기 때문이다. Cu²⁺는 푸른색을 띤다.
? 사과를 깎아 두면 갈색으로 변하는데 레몬즙을 뿌리면 변색이 늦어지는 까닭을 산화 환원으로 설명하시오. :: 사과 속 물질이 공기 중 산소와 반응해 산화되면 갈색으로 변한다. 레몬즙의 비타민 C가 대신 산화되어(산화 방지제) 사과의 산화를 늦춘다.

= 오늘 배운 내용 정리
- 산소를 얻거나 전자를 [[잃으면]] 산화, 산소를 잃거나 전자를 [[얻으면]] 환원
- 산화와 환원은 항상 [[동시에]] 일어난다.
- 반응성이 큰 금속일수록 전자를 잃고 [[양이온]]이 되기 쉽다.
- 잃은 전자 수 = [[얻은 전자 수]] (Cu 1개 → Ag 2개)

= 나가기 전 한 문제 | 형성평가
? 마그네슘 리본을 묽은 염산에 넣었을 때 산화되는 물질과 환원되는 물질, 발생하는 기체를 쓰시오. :: 산화: Mg(전자를 잃고 Mg²⁺), 환원: H⁺(전자를 얻어 H₂), 발생 기체: 수소
