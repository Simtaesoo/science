# 화학 변화와 에너지 출입 | 데우는 반응, 식히는 반응 | 고등학교 통합과학2 · 02 화학 변화 · 3차시 | 2022 개정 교육과정 [10통과2-01-05]

= 오늘의 학습 목표 | 3차시
^ 화학 변화와 물리 변화에서 에너지를 **방출**하거나 **흡수**하는 현상을 구별할 수 있다.
^ 에너지 출입 현상이 생활과 지구·생명 현상에 어떻게 **이용**되는지 설명할 수 있다.
^ 에너지 출입을 이용한 장치를 **설계**하고 토의할 수 있다.
% 흐름: 생각 열기 5분 → 방출과 흡수 10분 → 생활·지구·생명 속 사례 10분 → 발열 도시락 설계 15분 → 문항 5분
% 2022 개정 [10통과2-01-05] 해설: 화학 반응의 열 출입에서 열화학 반응식, 엔탈피는 다루지 않는다. 초·중학교에서 배운 화학 변화와 물리 변화(상태 변화 포함)에서 예를 찾게 한다.

= 불 없이 데워지는 도시락 | 생각 열기
* 🍱 발열 도시락 :: 끈을 당기면 몇 분 만에 음식이 뜨거워진다
* 🧤 손난로 :: 흔들면 따뜻해진다
* 🧊 냉찜질 팩 :: 두드리면 차가워진다
* 🔥 캠핑 버너 :: 가스가 타며 열을 낸다
? 발열 도시락 속에서는 무슨 일이 일어날까? :: 아래 칸에 든 **산화 칼슘**이 물과 반응하면서 많은 열을 **방출**하여 음식을 데운다.

= 이전에 배운 내용 떠올리기 | 복습 · 중3 화학 반응의 규칙성
- 주위로 열을 내보내는 반응 → [[발열]] 반응
- 주위의 열을 흡수하는 반응 → [[흡열]] 반응
- 1차시: 메테인의 연소, 철이 녹스는 것 → [[산화]] 반응
- 2차시: 산과 염기의 중화 반응 → 온도가 [[올라간다]]
? 에너지는 반응 중에 새로 생기는 것일까? :: 아니다. 물질에 저장되어 있던 에너지가 열 등으로 **바뀌어 나오거나**, 주위의 에너지를 **흡수해 저장**하는 것이다.

## 방출과 흡수 | 주위의 온도가 알려 준다

= 에너지를 방출하는 변화와 흡수하는 변화
| 구분 | 에너지 방출 (주위 온도 ↑) | 에너지 흡수 (주위 온도 ↓) |
|+ 화학 반응 | 연소, 중화 반응, 철의 산화(손난로), 산화 칼슘 + 물 | 광합성, 탄산수소 나트륨의 열분해 |
|+ 용해 | 염화 칼슘이 물에 녹을 때 | 질산 암모늄이 물에 녹을 때(냉찜질 팩) |
|+ 상태 변화 | [[액화]], 응고, 승화(기체 → 고체) | [[기화]], 융해, 승화(고체 → 기체) |
>+ 화학 변화든 물리 변화든 에너지는 **출입**한다 — 에너지의 총량은 보존된다.

= 예제 1 · 온도 변화로 판단하기 | 자료 해석
| 실험 | 처음 온도 (℃) | 나중 온도 (℃) |
| 물 + 산화 칼슘 | 20 | 68 |
| 물 + 질산 암모늄 | 20 | 6 |
| 묽은 염산 + 수산화 나트륨 수용액 | 20 | 27 |
^+ 산화 칼슘: 온도 상승 → 에너지 **방출**
^+ 질산 암모늄: 온도 하강 → 에너지 **흡수**
^+ 중화 반응: 온도 상승 → 에너지 **방출**
% 실제 실험 시 산화 칼슘은 피부·눈에 닿지 않도록 보안경과 장갑을 착용하고, 소량으로 한다.

## 생활과 지구·생명 속 에너지 출입 | 어디에 쓰일까

= 생활 속 이용 | 사례
* 🍱 발열 도시락·컵라면 :: 산화 칼슘과 물의 반응열
* 🧤 손난로 :: 철 가루가 산소와 반응(산화)하며 열 방출
* 🧊 냉찜질 팩 :: 질산 암모늄이 물에 녹으며 열 흡수
* 🥶 에어컨·냉장고 :: 냉매가 기화하며 주위의 열을 흡수
* ❄️ 제설제 :: 염화 칼슘이 물에 녹으며 열을 내고 어는점을 낮춘다

= 지구와 생명 속 에너지 출입
| 현상 | 에너지 | 설명 |
|+ 광합성 | [[흡수]] | 빛에너지를 흡수해 포도당에 화학 에너지로 저장 |
|+ 세포 호흡 | [[방출]] | 포도당을 분해해 생명 활동 에너지를 얻음 |
|+ 구름의 생성 | [[방출]] | 수증기가 응결하며 열 방출 → 태풍의 에너지원 |
|+ 바닷물의 증발 | [[흡수]] | 물이 기화하며 열 흡수 → 지표를 식힘 |
>+ 광합성으로 저장한 에너지를 호흡으로 꺼내 쓴다 — 지구와 생명의 에너지 흐름

= 예제 2 · 땀이 몸을 식히는 까닭 | 적용
^+ 땀(액체)이 피부에서 **기화**한다.
^+ 기화할 때 주위(피부)의 열을 **흡수**한다.
^+ 피부의 온도가 내려가 체온을 조절한다.
>+ 물리 변화에서도 에너지가 출입하며 생명 활동에 이용된다.

## 설계 활동 | 가열 장치 없이 음식 데우기

= 발열 도시락 설계 | 모둠 활동
^ 산화 칼슘과 물의 양을 정하고, 음식과 반응 물질이 **직접 닿지 않는** 구조를 그린다.
^ 열이 빠져나가지 않도록 **단열**할 부분을 정한다.
^ 반응에서 생기는 수증기가 빠져나갈 **안전한 통로**를 둔다.
^ 설계를 발표하고 다른 모둠의 설계에서 좋은 점과 위험 요소를 찾는다.
% 교육과정 탐구 활동: '가열 장치 없이 물과 산화 칼슘을 이용한 음식 조리 방법 설계하고 실험하기'. 실제 실험은 교사 시연 또는 소량으로, 안전 장구 착용 후 실시한다.

= 확인 문제 1
Q 주위로 에너지를 방출하는 변화가 아닌 것은?
o 메테인의 연소
o 손난로 속 철 가루의 산화
o 수증기의 액화
o* 냉찜질 팩 속 질산 암모늄의 용해
:: 질산 암모늄이 물에 녹을 때는 주위의 열을 흡수해 차가워진다.

= 확인 문제 2
Q 광합성과 세포 호흡의 에너지 출입을 바르게 짝지은 것은?
o 광합성 — 방출, 세포 호흡 — 방출
o* 광합성 — 흡수, 세포 호흡 — 방출
o 광합성 — 흡수, 세포 호흡 — 흡수
o 광합성 — 방출, 세포 호흡 — 흡수
:: 광합성은 빛에너지를 흡수해 저장하고, 세포 호흡은 저장된 에너지를 꺼내 쓴다(방출).

= 확인 문제 3
Q 더운 날 마당에 물을 뿌리면 시원해지는 까닭은?
o 물이 응고하며 열을 방출하기 때문
o* 물이 기화하며 주위의 열을 흡수하기 때문
o 물이 액화하며 열을 흡수하기 때문
o 물이 열을 반사하기 때문
:: 기화는 주위의 열을 흡수하는 변화이다.

= 서술형 도전 | 생각 넓히기
? 태풍이 따뜻한 바다 위에서 강해지는 까닭을 에너지 출입과 관련지어 쓰시오. :: 따뜻한 바다에서 많은 물이 증발하고, 이 수증기가 상승하여 응결할 때 많은 열을 방출하므로 태풍이 에너지를 얻어 강해진다.
? 겨울철 손난로와 여름철 냉찜질 팩의 원리를 에너지 출입으로 비교하시오. :: 손난로는 철의 산화 반응으로 열을 방출하여 따뜻해지고, 냉찜질 팩은 질산 암모늄이 물에 녹으며 주위의 열을 흡수하여 차가워진다.

= 오늘 배운 내용 정리
- 에너지 방출: 주위 온도 [[상승]] — 연소, 중화, 산화 칼슘 + 물, 액화, 응고
- 에너지 흡수: 주위 온도 [[하강]] — 질산 암모늄 용해, 광합성, 기화, 융해
- 지구·생명: 광합성(흡수) ↔ 세포 호흡([[방출]]), 응결(방출) → 태풍의 에너지원
- 에너지 출입은 생활 속 장치(발열 도시락, 냉찜질 팩, 냉장고)에 이용된다.

= 나가기 전 한 문제 | 형성평가
? 캠핑장에서 불을 쓰지 않고 음식을 데우는 방법을 하나 쓰고, 그 원리를 에너지 출입으로 설명하시오. :: 산화 칼슘에 물을 부어 반응시키면 많은 열이 방출되므로, 그 열로 용기 속 음식을 데울 수 있다.
