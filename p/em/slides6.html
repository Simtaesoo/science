# 전자기 유도 | 패러데이 법칙과 렌츠 법칙 | 고등학교 물리학 · 03 전기와 자기 · 6차시 | 2022 개정 교육과정 [물리학 Ⅱ]

= 오늘의 학습 목표 | 6차시
^ **자기 선속**의 뜻을 알고 계산할 수 있다.
^ **패러데이 법칙**으로 유도 기전력의 크기를 구할 수 있다.
^ **렌츠 법칙**으로 유도 전류의 방향을 찾을 수 있다.
% 흐름: 생각 열기 5분 → 자기 선속 7분 → 패러데이·렌츠 법칙 10분 → 자석과 코일(시뮬레이션) 10분 → 계산·문항 13분

= 구리관 속으로 떨어진 자석 | 생각 열기
* 🧲 구리관 :: 자석을 떨어뜨리면 이상할 만큼 천천히 떨어진다
* 🪙 동전 :: 같은 구리관에서 동전은 그냥 떨어진다
* 💳 교통카드 :: 배터리가 없는데 칩이 작동한다
* 🍳 인덕션 :: 바닥이 직접 뜨거워지지 않는데 냄비가 데워진다
? 구리는 자석에 붙지도 않는데 왜 자석이 천천히 떨어질까? :: 떨어지는 자석이 구리관에 **유도 전류**를 만들고, 그 전류가 자석의 운동을 **방해**하기 때문이다(렌츠 법칙).

= 지난 시간 복습 | 5차시 · 통합과학2
- 전류가 흐르면 주위에 [[자기장]]이 생긴다.
- 솔레노이드 내부: B = [[μ₀nI]]
- 코일을 지나는 자기장이 변하면 전류가 흐른다 → [[전자기 유도]] (통합과학2)
? 전류가 자기장을 만든다면, 자기장은 전류를 만들 수 있을까? :: 자기장이 '**변할 때**' 전류를 만든다 — 오늘 그 크기와 방향을 식으로 다룬다.

## 자기 선속과 패러데이 법칙 | 변화가 전류를 만든다

= 자기 선속
! Φ = BA (단위 Wb)
- B: 자기장, A: 자기장에 수직인 면적
- 코일을 지나는 자기력선의 '양'이라고 생각할 수 있다.
>+ 자기 선속이 **변하는** 방법: 자기장 세기 변화, 면적 변화, 코일의 회전

= 패러데이 법칙과 렌츠 법칙
! V = −N ΔΦ/Δt
- **패러데이 법칙**: 감은 수가 많을수록, 자기 선속이 **빨리** 변할수록 유도 기전력이 크다.
- **렌츠 법칙**: 유도 전류는 자기 선속의 변화를 ==방해==하는 방향으로 흐른다 (식의 − 부호).
| 자석의 운동 | 코일의 그쪽 면 | 힘 |
|+ N극이 다가옴 | [[N]]극 | 밀어냄 |
|+ N극이 멀어짐 | [[S]]극 | 끌어당김 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#induct | 자석의 극, 속력, 감은 수를 바꾸며 검류계 바늘과 그래프를 관찰하자.
% N극 다가감 → 멀어짐 → S극 다가감 → 속력 2배 순서로

= 자석과 코일 | 시뮬레이션 기록
| 조건 | N극 다가감 | N극 멀어짐 | S극 다가감 | 속력 2배 |
|+ 코일 면의 극 | N | [[S]] | [[S]] | — |
|+ 기전력 | 한쪽 방향 | [[반대 방향]] | N극 다가감과 [[반대]] | 최댓값 [[2배]] |

= 예제 1 · 유도 기전력 | 적용
- 감은 수 200회인 코일을 지나는 자기 선속이 0.1초 동안 2 × 10⁻⁴ Wb만큼 변했다.
^+ ΔΦ/Δt = 2 × 10⁻⁴ ÷ 0.1 = **2 × 10⁻³ Wb/s**
^+ V = N × ΔΦ/Δt = 200 × 2 × 10⁻³ = **0.4 V**

= 예제 2 · 자기 선속 그래프 | 그래프 해석
C 코일을 지나는 자기 선속 (감은 수 50회, 모형) | 시간 (s) | 자기 선속 (×10⁻³ Wb) | 자기 선속:0,0 0.2,10 0.4,10 0.6,0
||
^+ 0~0.2 s: 기울기 = 0.01 ÷ 0.2 = 0.05 → V = 50 × 0.05 = **2.5 V**
^+ 0.2~0.4 s: 기울기 0 → V = **0**
^+ 0.4~0.6 s: 감소 → V = **2.5 V, 반대 방향**
>+ 유도 기전력 ∝ 자기 선속 그래프의 **기울기**

= 예제 3 · 면적이 변하는 경우 | 적용
- 0.5 T의 균일한 자기장에 수직인 정사각형 고리(1회)의 면적이 0.2초 동안 0.04 m²에서 0.02 m²로 줄었다.
^+ ΔΦ = B × ΔA = 0.5 × (0.04 − 0.02) = **0.01 Wb**
^+ V = 1 × 0.01 ÷ 0.2 = **0.05 V**
^+ 렌츠 법칙: 줄어드는 선속을 **보충**하는 방향으로 전류가 흐른다.

= 예제 4 · 렌츠 법칙으로 방향 찾기 | 적용
- 코일 위에서 자석의 S극을 아래로 하여 코일 쪽으로 가까이 가져간다.
^+ 코일을 지나는 자기장: S극 쪽으로 들어가는 방향(위쪽)의 선속이 **증가**
^+ 렌츠 법칙: 증가를 **방해** → 코일 위쪽 면이 **S극**이 되어 자석을 밀어낸다.
^+ 위에서 볼 때 코일 위쪽 면이 S극이 되는 전류 방향 → **시계 방향** (오른손 법칙)
% 오른손 네 손가락을 전류 방향으로 감아쥘 때 엄지가 N극 — 위쪽이 S극이면 엄지가 아래를 향한다.

= 확인 문제 1
Q 유도 기전력을 크게 하는 방법이 아닌 것은?
o 코일의 감은 수를 늘린다
o 자석을 더 빠르게 움직인다
o 더 센 자석을 사용한다
o* 자석을 코일 속에 넣고 가만히 둔다
:: 자기 선속이 변하지 않으면 유도 기전력이 생기지 않는다.

= 확인 문제 2
Q 자석의 N극이 코일에서 멀어질 때 자석에 가까운 코일 면의 극은?
o N극
o* S극
o 극이 생기지 않는다
o 번갈아 바뀐다
:: 멀어지는 것을 방해하려고 끌어당기는 S극이 된다(렌츠 법칙).

= 확인 문제 3
Q 감은 수 100회 코일의 자기 선속이 0.5초 동안 0.02 Wb 감소했다. 유도 기전력의 크기는?
o 0.04 V
o 0.4 V
o* 4 V
o 40 V
:: 100 × 0.02 ÷ 0.5 = 4 V

= 확인 문제 4
Q 자기 선속–시간 그래프에서 유도 기전력이 0인 순간은?
o 자기 선속이 0일 때
o* 그래프의 기울기가 0일 때
o 그래프가 가장 가파를 때
o 항상 0이 아니다
:: 유도 기전력은 자기 선속의 변화율(기울기)에 비례한다.

= 확인 문제 5
Q 구리관 속으로 떨어뜨린 자석이 천천히 떨어지는 까닭은?
o 구리가 자석을 끌어당겨서
o 공기 저항이 커서
o* 유도 전류가 자석의 운동을 방해하는 자기력을 만들어서
o 구리관 속에 자기장이 없어서
:: 맴돌이 전류가 렌츠 법칙에 따라 운동을 방해한다.

= 생활 속 전자기 유도 | 사례
* 💳 교통카드 :: 단말기의 변하는 자기장으로 카드 코일에 전류
* 🍳 인덕션 :: 냄비 바닥에 맴돌이 전류 → 열
* 📱 무선 충전 :: 두 코일 사이의 전자기 유도
* ⚡ 발전기·변압기 :: 전력 생산과 전압 변환
* 🎢 자석 브레이크 :: 놀이기구가 맴돌이 전류로 부드럽게 멈춘다
* 🛂 금속 탐지기 :: 금속 속 유도 전류를 감지

= 서술형 도전 | 생각 넓히기
? 구리관 속으로 자석을 떨어뜨리면 자유 낙하보다 천천히 떨어지는 까닭을 쓰시오. :: 자석이 떨어지며 구리관을 지나는 자기 선속이 변해 맴돌이 전류가 유도되고, 렌츠 법칙에 따라 자석의 운동을 방해하는 자기력이 작용하기 때문이다.
? 교통카드를 단말기에 대면 배터리가 없는데도 칩이 작동하는 원리를 쓰시오. :: 단말기의 코일이 변하는 자기장을 만들고, 카드 속 코일을 지나는 자기 선속이 변해 유도 전류가 생긴다. 이 전류로 칩이 작동하며 정보를 주고받는다.

= 오늘 배운 내용 정리
- 자기 선속 Φ = [[BA]] (Wb)
- 패러데이 법칙: V = [[−N ΔΦ/Δt]]
- 감은 수가 많을수록, 자기 선속이 [[빨리]] 변할수록 유도 기전력 증가
- 렌츠 법칙: 유도 전류는 자기 선속의 변화를 [[방해]]하는 방향
- N극이 다가오면 코일 면은 [[N]]극, 멀어지면 [[S]]극

= 나가기 전 한 문제 | 형성평가
? 감은 수 50회인 코일을 지나는 자기 선속이 0.2초 동안 0에서 4 × 10⁻³ Wb로 증가했다. 유도 기전력의 크기를 구하고, 이때 유도 전류가 만드는 자기장의 방향을 설명하시오. :: V = 50 × 4 × 10⁻³ ÷ 0.2 = 1 V. 증가하는 자기 선속을 방해하도록, 원래 자기장과 반대 방향의 자기장을 만드는 쪽으로 전류가 흐른다.
