# 저항의 연결과 소비 전력 | 멀티탭은 왜 위험할 수 있을까 | 고등학교 물리학 · 03 전기와 자기 · 2차시 | 2022 개정 교육과정 [12물리02-02]

= 오늘의 학습 목표 | 2차시
^ 저항의 **직렬연결**과 **병렬연결**에서 전류, 전압, 합성 저항의 특징을 설명할 수 있다.
^ 연결 방법에 따라 각 저항의 **소비 전력**이 어떻게 달라지는지 설명할 수 있다.
^ 가정의 전기 기구 연결을 분석하고 **안전한 전기 사용** 방안을 제시할 수 있다.
% 흐름: 생각 열기 5분 → 직렬·병렬 연결 12분 → 소비 전력 10분 → 가정의 전기 안전 10분 → 문항 8분
% 2022 개정 [12물리02-02] 해설: 저항의 연결에 따른 차이를 설명하는 사례로 가정에서 여러 전기 제품을 병렬연결하여 사용하는 상황을 제시하고, 전기 안전과 연관지어 안전한 전기 사용 방안을 도출한다. 탐구 활동: 직렬·병렬연결에서 전류와 전압 측정·비교

= 멀티탭에 문어발 연결? | 생각 열기
* 🔌 멀티탭 :: 전기난로, 헤어드라이어, 전기 주전자를 한꺼번에 꽂았다
* 🔥 전선 :: 멀티탭 전선이 뜨거워졌다
* ⚡ 차단기 :: 집 안의 누전 차단기가 '딱' 내려갔다
* 💡 크리스마스 전구 :: 하나가 꺼지면 줄 전체가 꺼지는 것도 있다
? 기구를 많이 꽂을수록 왜 전선이 뜨거워질까? :: 가정의 기구는 **병렬**로 연결되어 기구를 추가할수록 전선에 흐르는 **전체 전류가 커지고**, 전선에서 발생하는 열도 커지기 때문이다.

= 이전에 배운 내용 떠올리기 | 복습 · 중2 전기와 자기
- 전류 = 전압 ÷ [[저항]] (옴의 법칙)
- 직렬연결: 각 저항에 흐르는 [[전류]]가 같다
- 병렬연결: 각 저항에 걸리는 [[전압]]이 같다
- 소비 전력의 단위: [[W]] (1초 동안 쓰는 전기 에너지)
? 중학교에서는 합성 저항을 계산하지 않았다. 고등학교에서는? :: 직렬·병렬연결의 합성 저항을 구하고, 소비 전력과 연결해 분석한다.

## 직렬연결과 병렬연결 | 전류의 길이 하나냐 여럿이냐

= 저항의 직렬연결과 병렬연결
| 구분 | 직렬연결 | 병렬연결 |
|+ 전류 | 모든 저항에 [[같다]] | 저항이 작은 쪽에 많이 흐른다 |
|+ 전압 | 저항에 비례해 나뉜다 | 모든 저항에 [[같다]] |
|+ 합성 저항 | R = R₁ + R₂ (커진다) | 1/R = 1/R₁ + 1/R₂ (작아진다) |
|+ 하나가 끊어지면 | 모두 꺼진다 | 나머지는 그대로 |
>+ 병렬로 저항을 더할수록 합성 저항은 **작아지고** 전체 전류는 **커진다.**

= 예제 1 · 합성 저항과 전류 | 적용
- 6 Ω과 3 Ω 저항을 12 V 전원에 연결한다.
^+ 직렬: R = 6 + 3 = **9 Ω**, 전류 = 12 ÷ 9 ≈ **1.3 A**
^+ 병렬: 1/R = 1/6 + 1/3 = 1/2 → R = **2 Ω**, 전체 전류 = 12 ÷ 2 = **6 A**
^+ 병렬에서 각 저항의 전류: 6 Ω → **2 A**, 3 Ω → **4 A** (합 6 A)

## 소비 전력 | 연결에 따라 달라진다

= 소비 전력
! 소비 전력 P = VI = I²R = V²/R
- 직렬연결: 전류가 같으므로 저항이 **큰** 쪽이 더 많은 전력을 소비 (P = I²R)
- 병렬연결: 전압이 같으므로 저항이 **작은** 쪽이 더 많은 전력을 소비 (P = V²/R)
>+ 같은 전구라도 직렬로 연결하면 어둡고, 병렬로 연결하면 각각 밝다.

= 예제 2 · 어느 전구가 더 밝을까? | 적용
- 저항이 각각 10 Ω(A), 20 Ω(B)인 전구를 연결한다.
^+ 직렬: 전류가 같다 → P = I²R → 저항이 큰 **B가 더 밝다**
^+ 병렬: 전압이 같다 → P = V²/R → 저항이 작은 **A가 더 밝다**
>+ '저항이 크면 어둡다'는 항상 옳지 않다 — 연결 방법을 먼저 보자!

## 가정의 전기와 안전 | 병렬연결의 장점과 주의점

= 가정의 전기 기구는 병렬연결
^+ 모든 기구에 같은 전압(220 V)이 걸린다 → 각 기구가 **정해진 전력**으로 작동
^+ 하나를 끄거나 고장 나도 다른 기구는 **계속 작동**한다
^+ 그러나 기구를 켤수록 전선에 흐르는 **전체 전류가 커진다**
>+ 전선과 멀티탭에는 **허용 전류(용량)**가 있다 → 넘으면 과열·화재 위험

= 예제 3 · 멀티탭 용량 확인 | 적용
- 220 V 멀티탭의 허용 전류가 10 A이다. 전기난로(1500 W)와 헤어드라이어(1200 W)를 함께 쓰려 한다.
^+ 전체 소비 전력 = 1500 + 1200 = **2700 W**
^+ 전체 전류 = 2700 ÷ 220 ≈ **12.3 A** → 허용 전류 **초과!**
^+ 해결: 큰 전력을 쓰는 기구는 **벽 콘센트에 따로** 연결한다.

= 전기 안전 수칙 | 사례
* 🔌 문어발 금지 :: 한 멀티탭에 고전력 기구를 여러 개 꽂지 않는다
* 🏷️ 용량 확인 :: 멀티탭·전선의 허용 전류(W, A)를 확인한다
* 🛑 차단기 :: 과전류가 흐르면 자동으로 회로를 끊는다
* 💧 젖은 손 금지 :: 몸의 저항이 작아져 큰 전류가 흐를 수 있다
* 🧯 전선 상태 :: 피복이 벗겨지거나 눌린 전선은 바로 교체

= 확인 문제 1
Q 4 Ω, 4 Ω 저항을 병렬연결했을 때 합성 저항은?
o 8 Ω
o 4 Ω
o* 2 Ω
o 1 Ω
:: 1/R = 1/4 + 1/4 = 1/2 → R = 2 Ω

= 확인 문제 2
Q 가정의 전기 기구를 병렬로 연결하는 까닭으로 옳지 않은 것은?
o 각 기구에 같은 전압이 걸린다
o 기구를 따로 켜고 끌 수 있다
o* 기구를 많이 켤수록 전체 전류가 줄어든다
o 한 기구가 고장 나도 나머지는 작동한다
:: 병렬로 기구를 더할수록 합성 저항이 작아져 전체 전류는 커진다.

= 확인 문제 3
Q 저항이 다른 두 전구를 직렬로 연결했을 때 더 밝은 전구는?
o 저항이 작은 전구
o* 저항이 큰 전구
o 두 전구의 밝기가 같다
o 알 수 없다
:: 직렬에서는 전류가 같으므로 P = I²R에 따라 저항이 큰 쪽이 전력을 더 많이 소비한다.

= 서술형 도전 | 생각 넓히기
? 겨울철 한 멀티탭에 전기난로와 전기 주전자를 함께 꽂아 쓰면 위험한 까닭을 전류와 열로 설명하시오. :: 병렬로 연결된 고전력 기구가 동시에 작동하면 멀티탭과 전선에 흐르는 전체 전류가 매우 커지고, 전선의 저항에서 발생하는 열(I²R)이 커져 과열·화재가 일어날 수 있다.
? 크리스마스 장식 전구 중 하나가 꺼지면 모두 꺼지는 것과 나머지는 켜져 있는 것이 있다. 각각의 연결 방법을 쓰시오. :: 모두 꺼지는 것은 직렬연결, 나머지가 켜져 있는 것은 병렬연결이다.

= 오늘 배운 내용 정리
- 직렬: 전류 같음, 합성 저항 R = R₁ + R₂ ([[커짐]])
- 병렬: 전압 같음, 1/R = 1/R₁ + 1/R₂ ([[작아짐]])
- 소비 전력 P = VI — 직렬은 저항이 큰 쪽, 병렬은 저항이 [[작은]] 쪽이 더 많이 소비
- 가정은 [[병렬]]연결 — 기구를 늘릴수록 전체 전류 증가 → 허용 전류 확인

= 나가기 전 한 문제 | 형성평가
? 220 V에서 각각 1100 W인 전기 기구 두 개를 병렬로 동시에 쓸 때 전체 전류를 구하고, 허용 전류 8 A인 멀티탭을 써도 되는지 판단하시오. :: 전체 2200 W → 2200 ÷ 220 = 10 A. 허용 전류 8 A를 넘으므로 쓰면 안 된다.
