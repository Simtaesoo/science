# 에너지띠와 반도체 | 도체·반도체·절연체 | 고등학교 물리학 · 03 전기와 자기 · 3차시 | 2022 개정 교육과정 [물리학 Ⅱ]

= 오늘의 학습 목표 | 3차시
^ 고체의 **에너지띠**(원자가 띠, 전도띠, 띠 간격)를 설명할 수 있다.
^ 띠 간격으로 **도체·반도체·절연체**의 전기 전도성 차이를 설명할 수 있다.
^ **도핑**으로 n형·p형 반도체를 만드는 원리를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 에너지띠 10분 → 세 가지 고체(시뮬레이션) 12분 → 도핑 8분 → 계산·문항 10분

= 같은 14족인데 왜 다를까? | 생각 열기
* 💎 다이아몬드(탄소) :: 전기가 거의 통하지 않고 투명하다
* 💻 규소 :: 전기가 조금 통하고 반도체 칩의 재료
* 🔌 구리 :: 전기가 아주 잘 통한다
* 🌡️ 온도 :: 반도체는 뜨거워질수록 전기가 잘 통한다
? 원자 하나의 에너지 준위로는 설명하기 어려운 고체의 성질은 무엇으로 설명할까? :: 수많은 원자가 모이면 준위가 겹쳐 **에너지띠**를 이룬다. 띠 사이의 **간격**이 전기 전도성을 결정한다.

= 지난 시간 복습 | 2차시
- 원자 속 전자의 에너지는 [[양자화]]되어 있다.
- 전이할 때 광자 에너지 ΔE = hc/λ, λ(nm) = [[1240]] ÷ ΔE(eV)
? 원자가 수없이 많이 모이면 에너지 준위는 어떻게 될까? :: 서로 영향을 주어 아주 촘촘하게 갈라져 폭을 가진 **띠**가 된다.

## 에너지띠 | 원자가 띠, 전도띠, 띠 간격

= 고체의 에너지띠
! 고체: 많은 원자의 에너지 준위가 겹쳐 폭을 가진 에너지띠를 이룬다
| 구분 | 뜻 |
|+ 원자가 띠 | 전자가 채워진 띠 |
|+ 전도띠 | 원자가 띠 위의 비어 있는 띠 (전자가 자유롭게 이동) |
|+ 띠 간격 | 두 띠 사이, 전자가 있을 수 없는 에너지 구간 |
>+ 전류가 흐르려면 전자가 **전도띠**에 있어야 한다.

= 도체·반도체·절연체
| 구분 | 띠 간격 | 전기 전도성 |
|+ 도체 | [[없음]] (띠가 겹침) | 자유 전자가 많아 매우 좋음 |
|+ 반도체 | 작음 (규소 약 1.1 eV) | 온도가 높아지면 [[증가]] |
|+ 절연체 | 매우 큼 (다이아몬드 약 5.5 eV) | 거의 없음 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#band | 물질과 온도, 도핑을 바꾸며 전도띠의 전자 수를 관찰하자.
% 300 K → 600 K로 올릴 때 규소만 크게 변하는 것을 강조

= 세 가지 고체 | 시뮬레이션 기록
| 물질 | 띠 간격 | 300 K → 600 K | 전도성 |
|+ 구리 (도체) | 없음 (겹침) | 전도도 약간 [[감소]] | 매우 좋음 |
|+ 규소 (반도체) | 1.1 eV | 전도띠 전자 크게 [[증가]] | 중간 |
|+ 다이아몬드 (절연체) | 5.5 eV | 거의 변화 없음 | 거의 없음 |

= 예제 1 · 온도와 저항 | 적용
- 온도를 높일 때 도체와 반도체의 저항 변화를 비교하자.
^+ 도체: 원자의 진동이 커져 전자의 이동을 **방해** → 저항 **증가**
^+ 반도체: 열에너지를 얻어 띠 간격을 넘는 전자 **증가** → 저항 **감소**
^+ 반도체의 전자가 올라간 자리에는 **양공**이 생겨 함께 전하를 운반

= 예제 2 · 다이아몬드는 왜 투명할까? | 적용
- 띠 간격을 넘기려면 그만큼 에너지를 가진 광자가 필요하다. (λ(nm) = 1240 ÷ E(eV))
^+ 규소(1.1 eV): 1240 ÷ 1.1 ≈ **1130 nm** 이하의 빛을 흡수 → 가시광선 흡수 → 불투명
^+ 다이아몬드(5.5 eV): 1240 ÷ 5.5 ≈ **225 nm** 이하(자외선)만 흡수
^+ 가시광선(약 380~780 nm)은 흡수하지 못해 그대로 통과 → **투명**

## 도핑 | 반도체를 설계하다

= n형과 p형 반도체
| 구분 | n형 반도체 | p형 반도체 |
|+ 첨가 원소 | 15족 (인, 비소) | 13족 (붕소, 갈륨) |
|+ 원자가 전자 | 5개 → 전자 1개 [[남음]] | 3개 → 전자 1개 [[부족]] (양공) |
|+ 주된 전하 운반자 | [[전자]] | [[양공]] |
>+ 불순물을 아주 조금(백만 분의 일 정도) 넣어도 전기 전도도가 크게 늘어난다.

= 예제 3 · 인을 넣으면 | 적용
- 규소(14족)에 인(15족)을 조금 넣었다.
^+ 인의 원자가 전자 **5개** 중 4개는 이웃 규소와 공유 결합
^+ 남은 전자 **1개**는 약하게 묶여 쉽게 전도띠로 올라간다.
^+ 전자가 주된 전하 운반자 → **n형 반도체**

= 확인 문제 1
Q 띠 간격이 없어 자유 전자가 많은 물질은?
o 반도체
o 절연체
o* 도체
o p형 반도체
:: 도체는 원자가 띠와 전도띠가 겹쳐 있다.

= 확인 문제 2
Q 순수한 반도체의 온도를 높이면 전기 전도도가 커지는 까닭은?
o 원자의 진동이 줄어서
o* 띠 간격을 넘어 전도띠로 올라가는 전자와 양공이 늘어서
o 띠 간격이 사라져서
o 원자가 띠의 전자가 늘어서
:: 열에너지로 전하 운반자 수가 늘어난다.

= 확인 문제 3
Q 규소에 붕소(13족)를 첨가하여 만든 반도체와 주된 전하 운반자는?
o n형, 전자
o* p형, 양공
o n형, 양공
o p형, 전자
:: 원자가 전자가 3개라 결합에 전자 1개가 부족 → 양공

= 확인 문제 4
Q 띠 간격이 2.0 eV인 반도체가 흡수할 수 있는 빛의 최대 파장은? (λ(nm) = 1240 ÷ E)
o 248 nm
o* 620 nm
o 1240 nm
o 2480 nm
:: 1240 ÷ 2.0 = 620 nm보다 파장이 짧은(에너지가 큰) 빛을 흡수한다.

= 확인 문제 5
Q 도체의 온도를 높일 때 저항의 변화로 옳은 것은?
o 감소한다
o* 증가한다
o 변화 없다
o 0이 된다
:: 원자의 진동이 커져 전자의 이동을 방해한다.

= 생활 속 반도체 | 사례
* 📱 트랜지스터 :: 전류를 켜고 끄는 스위치 — 칩 하나에 수십억 개
* 💡 LED :: 띠 간격만큼의 에너지로 빛을 낸다
* ☀️ 태양 전지 :: 빛으로 전자–양공 쌍을 만든다
* 🌡️ 서미스터 :: 온도에 따라 저항이 변하는 반도체 온도 센서
* 📷 이미지 센서 :: 빛을 받으면 전하가 생기는 반도체
* 💎 다이아몬드 :: 띠 간격이 커 투명한 절연체

= 서술형 도전 | 생각 넓히기
? n형 반도체를 만들 때 규소(14족)에 인(15족)을 넣는 까닭을 쓰시오. :: 인은 원자가 전자가 5개라 규소와 공유 결합하고 전자 1개가 남는다. 이 여분의 전자가 쉽게 전도띠로 올라가 전류를 운반한다.
? 스마트폰 속 수십억 개의 트랜지스터가 반도체로 만들어지는 까닭을 '전도성을 조절할 수 있다'는 특징과 연결하시오. :: 반도체는 도핑과 전압으로 전류를 흐르게 하거나 막을 수 있어 0과 1을 나타내는 스위치로 쓸 수 있고, 매우 작게 만들 수 있기 때문이다.

= 오늘 배운 내용 정리
- 고체의 에너지 준위가 겹친 것 → [[에너지띠]] (원자가 띠, [[전도띠]], 띠 간격)
- 도체: 띠 간격 [[없음]] / 반도체: 작음 / 절연체: 매우 큼
- 반도체는 온도가 높을수록 전도도 [[증가]], 도체는 감소
- 15족 첨가 → [[n형]] (전자), 13족 첨가 → [[p형]] (양공)

= 나가기 전 한 문제 | 형성평가
? 도체, 반도체, 절연체를 띠 간격의 크기로 비교하고, 온도를 높일 때 반도체의 전기 전도도가 커지는 까닭을 쓰시오. :: 띠 간격: 도체(없음) < 반도체(작음) < 절연체(매우 큼). 반도체는 온도가 높아지면 열에너지를 얻어 띠 간격을 넘는 전자와 양공이 늘어 전하 운반자가 많아지기 때문이다.
