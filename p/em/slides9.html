# 자성체와 그 활용 | 자석에 붙는 것과 붙지 않는 것 | 고등학교 물리학 · 03 전기와 자기 · 4차시 | 2022 개정 교육과정 [12물리02-04]

= 오늘의 학습 목표 | 4차시
^ 물질의 자성을 원자 자석(자기 모멘트)의 배열로 설명할 수 있다.
^ **강자성체**, **상자성체**, **반자성체**의 특징을 비교할 수 있다.
^ 자성체가 일상생활과 산업 기술에 **활용**되는 예를 찾을 수 있다.
% 흐름: 생각 열기 5분 → 자성의 원인 8분 → 자성체의 종류 12분 → 활용 사례 조사 15분 → 문항 5분
% 2022 개정 [12물리02-04]: 자성체의 종류를 알고 일상생활과 산업 기술에서 활용되는 예를 찾는다. 원자 자석의 개념은 전자의 운동이 자기장을 만든다는 수준에서 정성적으로 다룬다.

= 냉장고 자석은 왜 알루미늄 캔에 안 붙을까? | 생각 열기
* 🧲 냉장고 문 :: 자석이 철판에 착 붙는다
* 🥫 알루미늄 캔 :: 자석이 붙지 않는다
* 🐸 공중에 뜬 개구리 :: 아주 센 자기장 속에서 물로 된 몸이 떠오른다
* 💳 교통 카드 옆 자석 :: 마그네틱 띠의 정보가 지워질 수 있다
? 철과 알루미늄은 모두 금속인데 왜 다를까? :: 물질 속 **원자 자석**들이 자기장에 반응하는 방식이 다르기 때문이다.

= 이전에 배운 내용 떠올리기 | 복습 · 5차시 예고
- 전류가 흐르면 주위에 [[자기장]]이 생긴다.
- 원자 속 전자도 움직이는 [[전하]]이다.
? 그렇다면 원자 하나하나도 작은 자석이 될 수 있을까? :: 그렇다. 전자의 운동(과 스핀) 때문에 원자는 작은 자석처럼 행동할 수 있다 — **원자 자석**

## 자성의 원인 | 원자 자석의 배열

= 원자 자석과 자기화
- 물질은 수많은 **원자 자석**으로 이루어져 있다고 볼 수 있다.
- 보통은 원자 자석의 방향이 **제각각** → 서로 상쇄되어 자석의 성질이 나타나지 않는다.
- 외부 자기장을 걸면 원자 자석들이 정렬하여 물질이 자석의 성질을 띤다 → **자기화**
>+ 외부 자기장에 어떻게, 얼마나 정렬하느냐에 따라 자성체의 종류가 나뉜다.

## 자성체의 종류 | 강자성·상자성·반자성

= 자성체의 비교
| 구분 | 강자성체 | 상자성체 | 반자성체 |
|+ 외부 자기장에서 | 같은 방향으로 [[강하게]] 자기화 | 같은 방향으로 약하게 자기화 | [[반대 방향]]으로 약하게 자기화 |
|+ 자석에 가까이 하면 | 강하게 끌림 | 아주 약하게 끌림 | 아주 약하게 밀림 |
|+ 자기장을 없애면 | 자성이 **남아** 있을 수 있음 | 자성이 사라짐 | 자성이 사라짐 |
|+ 예 | 철, 니켈, 코발트 | 알루미늄, 마그네슘, 산소 | 구리, 금, 물, 유리, 흑연 |
>+ 일상에서 '자석에 붙는다'고 느끼는 것은 거의 **강자성체**이다.

= 예제 1 · 물질 분류하기 | 적용
- 센 자석에 여러 물질을 매달아 가까이 했다.
^+ 클립(철): 세게 끌려온다 → **강자성체**
^+ 알루미늄 포일: 아주 약하게 끌린다 → **상자성체**
^+ 물이 든 비닐, 흑연 조각: 아주 약하게 밀려난다 → **반자성체**
% 상자성·반자성 효과는 매우 약해 네오디뮴 자석과 가벼운 시료(실에 매단 흑연 등)로 시연한다. 네오디뮴 자석은 손가락이 끼지 않게 조심한다.

= 예제 2 · 자성이 남는 강자성체 | 적용
^+ 철 못을 강한 자석으로 한 방향으로 문지르면 원자 자석이 정렬한다.
^+ 자석을 떼어도 정렬이 일부 남아 못이 **자석이 된다.**
^+ 못을 세게 두드리거나 가열하면 정렬이 흐트러져 자성이 **약해진다.**
>+ 자성이 잘 남는 물질 → 영구 자석, 정보 저장 / 자성이 쉽게 사라지는 물질 → 전자석의 철심

## 자성체의 활용 | 생활과 산업

= 자성체의 활용 | 사례
* 💾 하드 디스크 :: 강자성 박막의 자기화 방향으로 0과 1 저장
* 💳 마그네틱 카드 :: 띠의 자성 물질에 정보 기록
* 🏗️ 전자석 기중기 :: 철심이 든 전자석으로 고철을 들어 올렸다가 전류를 끊어 내린다
* 🔊 스피커·전동기 :: 강한 영구 자석(네오디뮴 등) 사용
* 🏥 MRI :: 몸속 물질의 자기적 성질 차이로 영상 촬영
* 🚄 자기 부상 열차 :: 강한 자기력으로 열차를 띄운다
* ♻️ 재활용 선별 :: 자석으로 철 캔과 알루미늄 캔을 분리

= 확인 문제 1
Q 외부 자기장과 반대 방향으로 약하게 자기화되는 물질은?
o 강자성체
o 상자성체
o* 반자성체
o 영구 자석
:: 반자성체(구리, 물, 흑연 등)는 자석에 아주 약하게 밀려난다.

= 확인 문제 2
Q 재활용 센터에서 자석으로 철 캔과 알루미늄 캔을 분리할 수 있는 까닭은?
o 알루미늄이 강자성체이므로
o* 철은 강자성체라 강하게 끌리고 알루미늄은 상자성체라 거의 끌리지 않으므로
o 철이 반자성체이므로
o 두 캔의 무게가 다르므로
:: 철은 자석에 강하게 끌리지만 알루미늄은 효과가 매우 약하다.

= 확인 문제 3
Q 하드 디스크가 정보를 저장할 수 있는 까닭으로 가장 알맞은 것은?
o 반자성체는 자성이 오래 남으므로
o* 강자성체는 외부 자기장을 없애도 자기화 상태가 남을 수 있으므로
o 상자성체가 전류를 저장하므로
o 자성체가 빛을 반사하므로
:: 자기화 방향을 0과 1로 기록하고, 그 상태가 남아 정보가 보존된다.

= 서술형 도전 | 생각 넓히기
? 전자석 기중기의 철심으로는 자성이 오래 남는 물질보다 쉽게 사라지는 물질이 알맞은 까닭을 쓰시오. :: 전류를 끊었을 때 자성이 바로 사라져야 들어 올린 고철을 내려놓을 수 있기 때문이다.
? 교통 카드나 마그네틱 카드를 강한 자석 옆에 두면 안 되는 까닭을 쓰시오. :: 강한 외부 자기장이 카드 띠의 자성 물질의 자기화 방향을 바꾸어 기록된 정보가 지워지거나 바뀔 수 있기 때문이다.

= 오늘 배운 내용 정리
- 물질의 자성: 원자 자석의 [[배열]] — 외부 자기장에서 정렬 → 자기화
- 강자성체: 강하게 끌림, 자성이 남을 수 있음 (철, 니켈, 코발트)
- 상자성체: 약하게 끌림 (알루미늄) / 반자성체: 약하게 [[밀림]] (구리, 물, 흑연)
- 활용: 하드 디스크, 전자석, 스피커, MRI, 자기 부상 열차

= 나가기 전 한 문제 | 형성평가
? 철, 알루미늄, 구리를 각각 강자성체, 상자성체, 반자성체로 분류하고, 센 자석을 가까이 할 때의 반응을 쓰시오. :: 철 – 강자성체, 강하게 끌린다. 알루미늄 – 상자성체, 아주 약하게 끌린다. 구리 – 반자성체, 아주 약하게 밀린다.
