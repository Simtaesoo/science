# 원자의 에너지 준위 | 선 스펙트럼의 비밀 | 고등학교 물리학 · 03 전기와 자기 · 2차시 | 2022 개정 교육과정 [물리학 Ⅱ]

= 오늘의 학습 목표 | 2차시
^ 원자 속 전자의 **에너지 준위**가 불연속적(양자화)임을 설명할 수 있다.
^ 전자의 **전이**와 방출·흡수하는 **광자의 에너지·파장**을 계산할 수 있다.
^ 수소 원자의 **선 스펙트럼**을 에너지 준위로 해석할 수 있다.
% 흐름: 생각 열기 5분 → 에너지 준위 10분 → 발머 계열(시뮬레이션) 12분 → 계산 10분 → 문항 8분

= 왜 수소는 네 가지 색만 낼까? | 생각 열기
* 🌈 햇빛 :: 프리즘으로 나누면 연속적인 무지개
* 💡 수소 방전관 :: 빨강, 청록, 파랑, 보라 네 줄만 보인다
* 🔦 나트륨등 :: 노란색 한 줄
* ⭐ 별빛 :: 원소마다 정해진 위치에 검은 선
? 수소가 아무 색이나 내지 않고 정해진 색만 내는 까닭은? :: 전자가 가질 수 있는 에너지가 **정해진 값(에너지 준위)**뿐이라, 준위 사이의 차이에 해당하는 빛만 나오기 때문이다.

= 지난 시간 복습 | 1차시 · 통합과학1
- 원자핵과 전자 사이의 [[전기력]]이 전자를 붙잡아 둔다.
- 같은 원소의 방출선과 흡수선의 위치는 [[같다]] (통합과학1)
? 전자를 원자에서 완전히 떼어 내려면 에너지가 필요할까? :: 필요하다. 전기력을 이기고 떼어 내야 하므로 — 그래서 원자 속 전자의 에너지는 **음(−)의 값**으로 나타낸다.

## 에너지 준위 | 전자의 계단

= 에너지 준위와 양자화
! 수소 원자: Eₙ = −13.6/n² eV (n = 1, 2, 3, …)
- 전자는 특정한 에너지 값만 가질 수 있다 → **에너지 준위**, 에너지가 ==양자화==되어 있다.
| n | 1 | 2 | 3 | 4 | ∞ |
|+ Eₙ (eV) | −13.6 | [[−3.40]] | [[−1.51]] | [[−0.85]] | 0 |
>+ n = 1: 바닥상태, n ≥ 2: 들뜬상태, n = ∞: 전자가 떨어져 나감 (이온화)

= 그래프로 보면 | 준위 사이의 간격
C 수소 원자의 에너지 준위 | 주양자수 n | 에너지 (eV) | 에너지 준위:1,-13.6 2,-3.4 3,-1.51 4,-0.85 5,-0.54 6,-0.38
+ n이 커질수록 준위 사이 간격이 [[좁아진다]] → 0 eV에 가까워진다.
+ n = 1 → 2의 간격(10.2 eV)이 가장 [[크다]].

= 전이와 광자
! ΔE = hf = hc/λ
- 높은 준위 → 낮은 준위: 에너지 차이만큼 ==광자 방출==
- 낮은 준위 → 높은 준위: 에너지 차이만큼 ==광자 흡수==
- 에너지 차이가 클수록 진동수는 **크고**, 파장은 **짧다.**
~ hc ≈ 1240 eV·nm → λ(nm) = 1240 ÷ ΔE(eV)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#level | 나중 준위를 n = 2로 두고 처음 준위를 바꾸며 광자 에너지와 파장을 기록하자.
% 3→2부터 6→2까지 차례로. 준위 간격이 위로 갈수록 좁아지는 것도 관찰

= 발머 계열 | 시뮬레이션 기록
| 전이 | 3 → 2 | 4 → 2 | 5 → 2 | 6 → 2 |
|+ ΔE (eV) | 1.89 | [[2.55]] | [[2.86]] | [[3.02]] |
|+ 파장 (nm) | 656 | [[486]] | [[434]] | [[410]] |
|+ 빛의 색 | 빨강 | 청록 | 파랑 | 보라 |
- n = 2로 전이 → **발머 계열** (가시광선) / n = 1로 전이 → **라이먼 계열** (자외선)

= 예제 1 · 3 → 2 전이 | 적용
^+ E₃ = −13.6 ÷ 9 ≈ **−1.51 eV**, E₂ = −13.6 ÷ 4 = **−3.40 eV**
^+ ΔE = −1.51 − (−3.40) = **1.89 eV**
^+ λ = 1240 ÷ 1.89 ≈ **656 nm** → 빨간빛 ✔

= 예제 2 · 2 → 1 전이 | 적용
^+ ΔE = −3.40 − (−13.6) = **10.2 eV**
^+ λ = 1240 ÷ 10.2 ≈ **122 nm**
^+ 가시광선(약 380~780 nm)보다 짧다 → **자외선** (라이먼 계열)

= 예제 3 · 이온화 에너지 | 적용
- 바닥상태(n = 1)의 수소 원자에서 전자를 완전히 떼어 내는 최소 에너지는?
^+ n = 1 → n = ∞: ΔE = 0 − (−13.6) = **13.6 eV**
^+ 이 에너지를 **이온화 에너지**라 한다.
^+ 13.6 eV보다 작은 광자는 전자를 떼어 내지 못한다.

= 확인 문제 1
Q 수소 원자의 n = 4 준위 에너지는?
o −13.6 eV
o −3.40 eV
o* −0.85 eV
o −0.54 eV
:: −13.6 ÷ 4² = −0.85 eV

= 확인 문제 2
Q n = 4 → 2와 n = 3 → 2 전이 중 파장이 더 긴 빛과 그 까닭은?
o 4 → 2, 에너지 차이가 커서
o* 3 → 2, 에너지 차이가 작아서
o 4 → 2, 에너지 차이가 작아서
o 둘이 같다
:: 3 → 2의 ΔE(1.89 eV)가 4 → 2(2.55 eV)보다 작아 파장이 더 길다(656 nm > 486 nm).

= 확인 문제 3
Q 에너지가 2.0 eV인 광자의 파장은? (hc ≈ 1240 eV·nm)
o 248 nm
o 410 nm
o* 620 nm
o 2480 nm
:: 1240 ÷ 2.0 = 620 nm

= 확인 문제 4
Q 바닥상태의 수소 원자가 흡수할 수 없는 광자 에너지는?
o 10.2 eV
o 12.09 eV
o* 11.0 eV
o 13.6 eV
:: 1 → 2 (10.2 eV), 1 → 3 (12.09 eV), 이온화(13.6 eV)는 가능하지만 11.0 eV에 해당하는 준위 차이는 없다.

= 확인 문제 5
Q 에너지 준위가 양자화되어 있다는 증거로 가장 알맞은 것은?
o 햇빛의 연속 스펙트럼
o* 기체 원자의 선 스펙트럼
o 물체의 열팽창
o 전기 저항
:: 정해진 에너지 차이에 해당하는 빛만 나오므로 선 스펙트럼이 생긴다.

= 생활 속 에너지 준위 | 사례
* 💡 네온사인 :: 기체마다 고유한 방출선의 색
* 🔦 나트륨등 :: 589 nm 노란빛
* ⭐ 천문 분광 :: 별빛의 흡수선으로 구성 원소 확인
* 🎆 불꽃놀이 :: 금속 원소의 들뜬 전자가 내는 색
* 🧪 원자 흡수 분광 :: 물속 중금속 농도 측정
* 🌈 형광등 :: 수은의 자외선을 형광 물질이 가시광선으로 바꾼다

= 서술형 도전 | 생각 넓히기
? 수소 원자에서 전자가 n = 2에서 n = 1로 전이할 때 방출하는 광자의 에너지와 파장을 구하시오. :: ΔE = −3.40 − (−13.6) = 10.2 eV, λ = 1240 ÷ 10.2 ≈ 122 nm (자외선)
? 천문학자가 별빛의 스펙트럼만 보고 별을 이루는 원소를 알아내는 원리를 쓰시오. :: 원소마다 에너지 준위 구조가 달라 고유한 선 스펙트럼을 가지므로, 별빛 스펙트럼의 선 위치를 실험실에서 측정한 원소의 스펙트럼과 비교하면 구성 원소를 알 수 있다.

= 오늘 배운 내용 정리
- 원자 속 전자의 에너지는 불연속적 → [[에너지 준위]], [[양자화]]
- 수소: Eₙ = [[−13.6/n²]] eV
- 전이할 때 ΔE = hf = [[hc/λ]], 에너지 차이가 클수록 파장이 [[짧다]]
- n = 2로 전이 → [[발머]] 계열(가시광선), n = 1로 전이 → 라이먼 계열([[자외선]])
- 바닥상태 수소의 이온화 에너지 = [[13.6 eV]]

= 나가기 전 한 문제 | 형성평가
? 수소 원자에서 n = 5 → 2 전이로 나오는 빛의 에너지와 파장을 구하시오. :: E₅ = −13.6 ÷ 25 ≈ −0.544 eV, ΔE = −0.544 − (−3.40) ≈ 2.86 eV, λ = 1240 ÷ 2.86 ≈ 434 nm (파란빛)
