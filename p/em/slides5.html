# 전류에 의한 자기장 | 오른손 법칙 | 고등학교 물리학 · 03 전기와 자기 · 5차시 | 2022 개정 교육과정 [12물리02-05]

= 오늘의 학습 목표 | 5차시
^ 전류가 흐르는 도선 주위의 **자기장 방향**을 오른손 법칙으로 찾을 수 있다.
^ **직선 도선, 원형 도선, 솔레노이드**의 자기장 세기가 전류·거리·감은 수에 따라 어떻게 달라지는지 설명할 수 있다.
^ **전자석**의 원리와 세기를 키우는 방법을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 오른손 법칙 8분 → 자기장의 세기(시뮬레이션) 12분 → 적용 12분 → 문항 8분
% 2022 개정 물리학은 전류에 의한 자기장을 정성적으로 다룬다. B = 2 × 10⁻⁷ I/r, μ₀nI 같은 정량식과 계산은 진로 선택 '전자기와 양자'의 범위이므로 다루지 않는다.

= 나침반이 도선 옆에서 돌아간다 | 생각 열기
* 🧭 외르스테드의 실험 :: 전류를 흘리자 옆의 나침반이 돌아갔다 (1820년)
* 🏗️ 고철 크레인 :: 전류를 흘리면 쇠를 들어 올리고 끊으면 놓는다
* 🔔 초인종 :: 전자석이 철판을 당겼다 놓으며 소리를 낸다
* 🏥 MRI :: 강한 자기장을 코일 전류로 만든다
? 자석도 없는데 왜 나침반이 돌아갔을까? :: **전류가 흐르는 도선 주위에 자기장**이 생기기 때문 — 전기와 자기는 연결되어 있다.

= 이전에 배운 내용 떠올리기 | 복습
- 자기장의 방향: 나침반 [[N]]극이 가리키는 방향
- 자석 바깥에서 자기력선은 N극에서 나와 [[S]]극으로 들어간다.
- 전류가 흐르는 코일 → [[전자석]] (중2)
? 막대자석 주위 자기력선의 모양을 떠올려 보자. 솔레노이드의 자기장과 비슷할까? :: 매우 비슷하다 — 솔레노이드의 바깥 자기장은 **막대자석**과 닮았다.

## 오른손 법칙 | 자기장의 방향

= 전류의 자기 작용
! 오른손 엄지 = 전류 방향 → 네 손가락이 감아쥐는 방향 = 자기장 방향
| 도선 | 자기장의 모양 |
|+ 직선 도선 | 도선을 중심으로 한 동심원 |
|+ 원형 도선 | 중심에서 도선 면에 수직 |
|+ 솔레노이드 | 내부는 균일, 바깥은 막대자석과 비슷 |
~ 솔레노이드는 네 손가락을 전류 방향으로 감아쥘 때 엄지가 N극

= 자기장의 세기를 정하는 것
| 도선 | 자기장이 세지는 조건 |
|+ 직선 도선 | 전류가 **셀수록**, 도선에 **가까울수록** |
|+ 원형 도선 | 전류가 셀수록, 중심에서 도선 면에 수직 |
|+ 솔레노이드 | 전류가 셀수록, **촘촘히 많이** 감을수록 — 내부는 **균일** |
- 자기장의 단위: T(테슬라)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#field | 도선의 모양, 전류, 거리를 바꾸며 자기장의 세기를 기록하자.
% 직선 → 원형 → 솔레노이드 순서. 나침반 바늘 방향으로 오른손 법칙도 확인

= 자기장의 세기 | 시뮬레이션 기록
| 조건 | 직선 5 A, 5 cm | 직선 5 A, 10 cm | 직선 10 A, 5 cm | 원형 5 A, 5 cm |
|+ B (T) | 2.00×10⁻⁵ | [[1.00×10⁻⁵]] | [[4.00×10⁻⁵]] | [[6.28×10⁻⁵]] |
- 전류를 늘리면 자기장이 [[세지고]], 도선에서 멀어지면 [[약해진다]].

= 그래프로 보면 | 거리와 자기장
C 직선 도선(5 A)에서 거리에 따른 자기장 | 거리 (cm) | 자기장 (×10⁻⁵ T) | 자기장:2.5,4 5,2 7.5,1.33 10,1 15,0.67 20,0.5
~ 지구 자기장(약 5 × 10⁻⁵ T)과 비슷한 크기 — 그래서 나침반이 돌아간다.

= 예제 1 · 시뮬레이션 기록 해석 | 적용
- 직선 도선 5 A, 5 cm에서 2.0 × 10⁻⁵ T였다.
^+ 같은 거리에서 전류를 10 A로 → 자기장이 **세진다** (기록: 4.0 × 10⁻⁵ T)
^+ 같은 전류에서 10 cm로 멀어지면 → **약해진다** (기록: 1.0 × 10⁻⁵ T)
^+ 지구 자기장(약 5 × 10⁻⁵ T)과 비슷한 크기 → 나침반이 돌아갈 만하다

= 예제 2 · 강한 전자석 설계 | 적용
- 같은 전지와 같은 도선으로 가장 강한 전자석을 만들려면?
^+ 직선 도선보다 **솔레노이드**로 감는다 — 각 고리의 자기장이 안쪽에서 같은 방향으로 겹친다
^+ 같은 길이에 **촘촘히 많이** 감는다
^+ 코일 속에 **철심**을 넣는다 → 철심이 자기화되어 자기장이 훨씬 강해진다

= 예제 3 · 나침반의 방향 | 적용
- 남북 방향으로 놓인 도선 바로 위에 나침반을 두고 북쪽으로 전류를 흘렸다.
^+ 오른손 엄지를 북쪽(전류)으로 → 도선 위쪽에서 네 손가락은 **동쪽**을 향한다.
^+ 도선 위의 자기장 방향 = **동쪽**
^+ 나침반 N극이 **동쪽**으로 돌아간다 (지구 자기장과 합쳐져 북동쪽 방향).

## 스피커와 전동기 | 전류의 자기 작용으로 에너지 전환

= 스피커의 원리 | 전기 신호 → 소리
^+ 영구 자석 사이에 **코일**이 진동판과 붙어 있다.
^+ 소리 신호에 따라 세기와 방향이 바뀌는 **전류**가 코일에 흐른다.
^+ 코일이 자석의 자기장 속에서 **힘**을 받아 앞뒤로 움직인다 → 진동판이 공기를 밀어 **소리**가 난다.
>+ 에너지 전환: 전기 에너지 → 역학적 에너지(진동) → 소리 에너지

= 전동기의 원리 | 전기 에너지 → 운동 에너지
^+ 자기장 속 코일에 전류가 흐르면 코일의 양쪽이 **반대 방향의 힘**을 받아 회전한다.
^+ 반 바퀴마다 정류자가 전류의 방향을 바꾸어 계속 **같은 방향**으로 돈다.
>+ 전기 에너지 → 운동 에너지: 선풍기, 전기차, 엘리베이터

= 스피커 설계·제작 | 탐구 활동
^ 종이컵(진동판), 에나멜선 코일, 네오디뮴 자석, 음향 신호선을 준비한다.
^ 코일을 감는 횟수, 자석의 세기, 진동판의 크기를 **하나씩 바꾸며** 소리 크기를 비교한다.
^ 더 큰 소리를 내는 설계 조건을 정리하고, 에너지 전환 과정으로 설명한다.
% 2022 개정 [12물리02-05]: 스피커와 전동기의 원리를 에너지 전환 관점에서 설명하고, 학생들이 스피커를 공학적으로 설계·제작하도록 지도한다. 앰프 출력은 낮게 하고 에나멜선 끝은 사포로 벗겨 연결한다.

= 확인 문제 1
Q 직선 도선 주위의 자기장을 더 세게 측정하는 방법으로 옳은 것은?
o 전류를 줄인다
o* 전류를 늘리고 도선에 더 가까이에서 잰다
o 도선에서 더 멀리 떨어져서 잰다
o 전류의 방향만 바꾼다
:: 자기장은 전류가 셀수록, 도선에 가까울수록 세다. 전류 방향을 바꾸면 자기장의 방향이 바뀐다.

= 확인 문제 2
Q 솔레노이드 내부 자기장에 대한 설명으로 옳은 것은?
o 중심에서 멀수록 강하다
o* 거의 균일하다
o 전류와 관계없다
o 감은 수가 적을수록 강하다
:: 솔레노이드 내부 자기장은 거의 균일하고, 전류가 셀수록·촘촘히 감을수록 세다.

= 확인 문제 3
Q 위에서 볼 때 종이면에서 나오는 방향으로 전류가 흐르는 직선 도선 주위의 자기장 방향은?
o 시계 방향
o* 시계 반대 방향
o 도선에서 바깥쪽으로 퍼지는 방향
o 도선을 향하는 방향
:: 오른손 엄지를 종이면에서 나오는 방향으로 하면 네 손가락은 시계 반대 방향으로 감아쥔다.

= 확인 문제 4
Q 전자석의 세기를 크게 하는 방법이 아닌 것은?
o 전류를 세게 한다
o 코일을 촘촘히 많이 감는다
o 코일 속에 철심을 넣는다
o* 코일의 감은 수를 줄인다
:: 같은 길이에 많이 감을수록 자기장이 세다.

= 확인 문제 5
Q 평행한 두 직선 도선에 같은 방향으로 전류가 흐를 때 두 도선 사이에 작용하는 힘은?
o 척력
o* 인력
o 힘이 작용하지 않는다
o 전류 세기에 따라 바뀐다
:: 한 도선의 자기장 속에서 다른 도선의 전류가 받는 힘이 서로를 향한다.

= 생활 속 전류의 자기장 | 사례
* 🏗️ 고철 크레인 :: 전류를 켜고 끄며 쇠를 들었다 놓는다
* 🔔 초인종·스피커 :: 전자석의 힘으로 진동
* 🏥 MRI :: 초전도 솔레노이드의 강한 자기장
* 🚄 자기 부상 열차 :: 전자석으로 선로 위에 뜬다
* 💾 하드 디스크 :: 코일 전류로 자기 기록
* 🔒 전자석 도어록 :: 전류가 흐르는 동안 문을 잠근다

= 서술형 도전 | 생각 넓히기
? 남북 방향 도선 바로 위에 놓인 나침반에 북쪽으로 전류를 흘리면 N극이 어느 쪽으로 돌아가는지 쓰고 까닭을 설명하시오. :: 오른손 법칙에 따라 도선 위쪽의 자기장은 동쪽을 향하므로 N극이 동쪽으로 돌아간다.
? 평행한 두 도선에 같은 방향으로 전류가 흐르면 서로 끌어당기는 까닭을 자기장으로 설명하시오. :: 한 도선이 만든 자기장 속에서 다른 도선의 전류가 자기력을 받는다. 같은 방향 전류일 때 그 힘의 방향이 상대 도선 쪽을 향해 서로 끌어당긴다.

= 오늘 배운 내용 정리
- 오른손 엄지 = [[전류]] 방향 → 네 손가락 = 자기장 방향
- 직선 도선: 전류가 셀수록, 도선에 [[가까울수록]] 자기장이 세다
- 솔레노이드: 촘촘히 많이 감을수록 세고, 내부 자기장은 [[균일]]
- 전자석 강화: 전류 ↑, 감은 수 ↑, [[철심]]

= 나가기 전 한 문제 | 형성평가
? 솔레노이드 전자석으로 고철을 더 많이 들어 올리려면 어떻게 해야 하는지 세 가지 쓰시오. :: 전류를 세게 한다, 같은 길이에 코일을 더 촘촘히 많이 감는다, 코일 속에 철심을 넣는다.
