# 축전기와 전기 에너지 저장 | 터치스크린 속 작은 저장고 | 고등학교 물리학 · 03 전기와 자기 · 3차시 | 2022 개정 교육과정 [12물리02-03]

= 오늘의 학습 목표 | 3차시
^ **축전기**가 두 도체판에 전하를 나누어 모아 전기 에너지를 저장하는 원리를 설명할 수 있다.
^ 축전기의 **충전**과 **방전** 과정을 에너지 전환으로 설명할 수 있다.
^ 축전기가 **센서**와 **전기 신호 입력 장치**에 활용되는 예를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 축전기의 구조 8분 → 충전과 방전 10분 → 터치스크린·센서 활용 12분 → 문항 10분
% 2022 개정 [12물리02-03] 해설: 축전기에서 전기 에너지가 저장되는 원리와 활용 방안을 다루되, 축전기의 전기 용량, 연결, 유전체는 포함하지 않는다. (Q = CV, C = εA/d 등의 계산은 다루지 않는다.)

= 손가락으로 화면을 누르면? | 생각 열기
* 📱 스마트폰 화면 :: 장갑을 끼면 잘 눌리지 않는다
* 📸 카메라 플래시 :: 충전하는 소리가 난 뒤 '번쩍!'
* ⌨️ 키보드 :: 키를 누르면 신호가 들어간다
* 🫀 심장 충격기 :: 순간적으로 큰 전기 에너지를 보낸다
? 손가락이 닿은 위치를 화면은 어떻게 알까? :: 화면 아래에 작은 **축전기**들이 촘촘히 있어, 손가락이 다가가면 그곳의 전하 분포가 달라지고 이를 전기 신호로 감지한다.

= 지난 시간 복습 | 1차시
- 전하는 주위에 [[전기장]]을 만들고, 다른 전하에 전기력을 작용한다.
- (+)전하와 (−)전하 사이에는 [[인력]]이 작용한다.
- 전하가 떨어져 있으면 두 지점 사이에 [[전위차]](전압)가 생긴다.
? 두 금속판에 (+)전하와 (−)전하를 따로 모아 두면 무엇이 저장될까? :: 서로 끌어당기는 전하를 떼어 놓은 상태이므로 **전기 에너지**가 저장된다.

## 축전기 | 전하를 나누어 담는 장치

= 축전기의 구조와 충전
! 축전기: 가까이 놓인 두 도체판 사이에 전하를 모아 **전기 에너지**를 저장하는 장치
^+ 전지에 연결하면 한 판에서 전자가 빠져나가 **(+)**, 다른 판에는 전자가 모여 **(−)**가 된다.
^+ 두 판에 반대 전하가 쌓일수록 판 사이에 **전기장**이 생기고 두 판 사이의 전압이 커진다.
^+ 판 사이 전압이 전지의 전압과 같아지면 전류가 멈춘다 → **충전 완료**
>+ 저장된 에너지 = 서로 끌어당기는 전하를 떼어 놓는 데 전지가 한 일

= 충전과 방전 | 에너지 전환
| 과정 | 전하의 이동 | 에너지 전환 |
|+ 충전 | 전지가 전하를 두 판으로 나누어 옮김 | 전지의 화학 에너지 → 축전기의 [[전기 에너지]] |
|+ 방전 | 두 판의 전하가 회로를 통해 다시 만남 | 전기 에너지 → [[빛·열·소리]] 등 |
>+ 축전기는 에너지를 **짧은 시간에 한꺼번에** 내보낼 수 있다 → 플래시, 심장 충격기

= 예제 1 · 카메라 플래시 | 적용
^+ 작은 전지가 시간을 들여 축전기를 **충전**한다.
^+ 셔터를 누르면 축전기가 아주 짧은 순간에 **방전**한다.
^+ 같은 에너지를 짧은 시간에 내보내므로 순간적으로 매우 **밝은 빛**이 난다.
>+ 전지는 에너지를 천천히, 축전기는 빠르게 내보내는 데 알맞다.

## 축전기의 활용 | 센서와 입력 장치

= 정전식 터치스크린
^+ 화면 아래에 가로·세로 전극이 격자로 배열 → 교차점마다 작은 **축전기**
^+ 전기가 통하는 손가락이 다가가면 그 지점의 **전하 분포가 달라진다.**
^+ 회로가 이 변화를 감지해 **손가락의 위치**를 알아낸다.
>+ 일반 장갑은 전기가 잘 통하지 않아 변화를 거의 만들지 못한다 → 잘 안 눌림

= 축전기를 이용한 센서와 장치 | 사례
* ⌨️ 정전식 키보드 :: 키를 누르면 판 사이 거리가 변해 신호 발생
* 🎤 콘덴서 마이크 :: 소리에 진동판이 떨리며 판 사이 거리가 변해 전기 신호로
* 💧 습도·수위 센서 :: 판 사이 물질에 따라 저장되는 전하가 달라짐
* 📱 지문 인식 :: 지문의 골과 마루에 따라 축전기 신호가 달라짐
* 🚗 에어백 가속도 센서 :: 미세한 판의 움직임을 전기 신호로
* 🔋 슈퍼 축전기 :: 빠른 충전·방전이 필요한 버스·회생 제동 장치

= 예제 2 · 콘덴서 마이크 | 적용
^+ 마이크 안에 얇은 **진동판**과 고정된 판이 축전기를 이룬다.
^+ 소리가 오면 진동판이 떨려 두 판 사이 **거리가 변한다.**
^+ 거리가 변하면 판에 모이는 전하가 변해 **전류가 흐른다** → 소리가 전기 신호로
>+ 소리(역학적 진동) → 전기 신호: 정보를 전기로 바꾸는 입력 장치

= 확인 문제 1
Q 축전기를 충전할 때의 에너지 전환으로 옳은 것은?
o 전기 에너지 → 화학 에너지
o* 전지의 화학 에너지 → 축전기의 전기 에너지
o 빛에너지 → 전기 에너지
o 열에너지 → 전기 에너지
:: 전지가 일을 하여 두 판에 전하를 나누어 모은다.

= 확인 문제 2
Q 정전식 터치스크린이 손가락의 위치를 감지하는 원리는?
o 손가락의 무게로 화면이 눌린다
o 손가락의 열을 감지한다
o* 손가락이 다가간 곳의 축전기 전하 분포가 달라지는 것을 감지한다
o 손가락이 빛을 가린다
:: 전기가 통하는 손가락이 전기장을 바꾸어 그 지점의 신호가 달라진다.

= 확인 문제 3
Q 카메라 플래시에 전지 대신 축전기를 이용하는 까닭은?
o 축전기가 전지보다 에너지를 더 많이 저장하므로
o* 저장한 에너지를 매우 짧은 시간에 내보낼 수 있으므로
o 축전기는 충전이 필요 없으므로
o 축전기는 빛을 직접 저장하므로
:: 축전기는 방전이 빨라 순간적으로 큰 전력을 낼 수 있다.

= 서술형 도전 | 생각 넓히기
? 축전기를 이용한 장치를 하나 골라 '무엇이 변하면 → 축전기의 무엇이 변하고 → 어떤 신호가 되는지' 순서로 설명하시오. :: (예) 콘덴서 마이크: 소리로 진동판이 떨리면 → 두 판 사이 거리가 변해 판에 모이는 전하가 변하고 → 그 변화가 전류(전기 신호)가 된다.
? 전기 버스의 회생 제동에 슈퍼 축전기를 쓰는 까닭을 쓰시오. :: 제동할 때 생기는 전기 에너지를 짧은 시간에 저장했다가 출발할 때 빠르게 내보낼 수 있기 때문이다.

= 오늘 배운 내용 정리
- 축전기: 두 도체판에 반대 전하를 모아 [[전기 에너지]]를 저장
- 충전: 화학 에너지 → 전기 에너지 / 방전: 전기 에너지 → 빛·열·소리 등
- 축전기는 에너지를 [[짧은 시간]]에 내보내는 데 알맞다.
- 활용: 터치스크린, 콘덴서 마이크, 키보드, 습도 센서 등 [[전기 신호]] 입력 장치

= 나가기 전 한 문제 | 형성평가
? 정전식 터치스크린을 일반 장갑을 끼고 누르면 잘 반응하지 않는 까닭을 축전기와 관련지어 쓰시오. :: 장갑은 전기가 잘 통하지 않아 손가락처럼 그 지점의 전하 분포(전기장)를 바꾸지 못하므로 축전기 신호의 변화가 거의 생기지 않기 때문이다.
