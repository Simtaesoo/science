# 전하와 전기력 | 쿨롱 법칙 | 고등학교 물리학 · 03 전기와 자기 · 1차시 | 2022 개정 교육과정 [12물리02-01]

= 오늘의 학습 목표 | 1차시
^ 전하 사이에 작용하는 **전기력의 방향**(인력·척력)을 설명할 수 있다.
^ **쿨롱 법칙**으로 전기력의 크기를 계산할 수 있다.
^ 전기력이 **원자를 이루는 힘**임을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 전하와 전기력 7분 → 쿨롱 법칙 8분 → 거리와 전기력(시뮬레이션) 10분 → 계산·문항 15분
% [교육과정 확인] [12물리02-01]은 전하가 전기장과 전위차를 형성해 상호작용함을 설명하는 수준이다. 쿨롱 법칙 계산은 교과서에 따라 다룰 수 있으나, 전기장의 정량적 계산은 '전자기와 양자'에서 다루므로 이 차시 뒷부분의 정성적 전기장·전위차 내용을 반드시 함께 지도한다.

= 머리카락이 풍선에 달라붙는다 | 생각 열기
* 🎈 풍선 :: 머리에 문지르면 머리카락이 따라 올라온다
* ⚡ 겨울철 문고리 :: 따끔! 정전기
* 🧲 복사기 :: 토너 가루를 전기력으로 종이에 붙인다
* ⚛️ 원자 :: 전자가 원자핵 주위를 떠나지 않는다
? 원자 속 전자를 원자핵 주위에 붙잡아 두는 힘은 무엇일까? :: 원자핵(+)과 전자(−) 사이의 **전기력** — 정전기와 같은 종류의 힘이다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 원자의 구조 | 원자핵(+)과 전자(−) |
| 대전 | 물체가 전자를 잃거나 얻어 전기를 띠는 현상 |
| 작용 반작용 | 크기 같고 방향 반대, 서로 다른 물체에 작용 |
? 풍선을 머리에 문지르면 무엇이 이동할까? :: **전자**가 이동한다. 전자를 얻은 쪽은 (−), 잃은 쪽은 (+)로 대전된다.

## 전하와 전기력 | 밀고 당기는 힘

= 전기력의 방향
- 같은 종류의 전하 사이 → ==척력== (서로 밀어냄)
- 다른 종류의 전하 사이 → ==인력== (서로 끌어당김)
- 두 전하가 서로에게 작용하는 힘은 크기가 **같고** 방향이 **반대** (작용 반작용)
>+ 전하량의 단위: C(쿨롬), 전자 1개의 전하량 = −1.6 × 10⁻¹⁹ C

= 쿨롱 법칙
! F = k q₁q₂ / r²
- k = 9.0 × 10⁹ N·m²/C²
- 전기력은 두 전하량의 **곱**에 비례하고, 거리의 **제곱**에 반비례한다.
>+ 거리 2배 → 1/4배, 거리 3배 → 1/9배 (역제곱 법칙)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#coulomb | q₁ = +3 μC, q₂ = −2 μC로 두고 거리를 바꾸며 전기력의 크기를 기록하자.
% 거리 0.1 → 0.2 m에서 힘이 1/4이 되는 것을 먼저 예측하게 하기

= 거리와 전기력 | 시뮬레이션 기록
| 거리 r (m) | 0.1 | 0.2 | 0.3 | 0.6 |
|+ 전기력 (N) | 5.40 | [[1.35]] | [[0.60]] | [[0.15]] |
- 힘의 종류: [[인력]] (다른 종류의 전하)
- 0.1 m → 0.2 m: [[1/4]]배, 0.1 m → 0.3 m: [[1/9]]배

= 그래프로 보면 | 역제곱 관계
C 거리에 따른 전기력 (+3 μC, −2 μC) | 거리 (m) | 전기력 (N) | 전기력:0.1,5.4 0.15,2.4 0.2,1.35 0.3,0.6 0.4,0.34 0.6,0.15
~ 거리가 가까울수록 힘이 매우 빠르게 커진다.

= 예제 1 · 전기력 계산 | 적용
- q₁ = +2 μC, q₂ = +2 μC가 0.3 m 떨어져 있다.
^+ F = 9 × 10⁹ × (2 × 10⁻⁶)(2 × 10⁻⁶) ÷ 0.3²
^+ = 9 × 10⁹ × 4 × 10⁻¹² ÷ 0.09 = **0.4 N**
^+ 같은 종류의 전하 → **척력**

= 예제 2 · 모두 2배로 | 적용
- 두 전하의 전하량을 각각 2배로 하고 거리도 2배로 하면?
^+ 분자: 2 × 2 = **4배**
^+ 분모: 2² = **4배**
^+ 전기력 = 4 ÷ 4 = **1배** (변하지 않는다)

= 예제 3 · 알짜 전기력이 0인 곳 | 적용
- +1 μC와 +4 μC가 0.3 m 떨어져 있다. 그 사이에 놓은 전하가 받는 알짜 전기력이 0인 위치는?
^+ +1 μC로부터 거리 x에서 두 힘의 크기가 같아야 한다.
^+ 1 ÷ x² = 4 ÷ (0.3 − x)² → 0.3 − x = 2x
^+ x = **0.1 m** (전하량이 작은 쪽에 더 가깝다)

= 예제 4 · 수소 원자 속 전기력 | 적용
- 수소 원자에서 양성자와 전자 사이 거리는 약 5.3 × 10⁻¹¹ m이다. (전하량 1.6 × 10⁻¹⁹ C)
^+ F = 9 × 10⁹ × (1.6 × 10⁻¹⁹)² ÷ (5.3 × 10⁻¹¹)²
^+ ≈ **8.2 × 10⁻⁸ N** (인력)
>+ 아주 작아 보이지만 전자의 질량(9.1 × 10⁻³¹ kg)에 비하면 엄청난 힘 — 전자를 원자에 붙잡아 둔다.

= 확인 문제 1
Q 두 점전하 사이의 거리를 3배로 하면 전기력은?
o 3배
o 1/3배
o* 1/9배
o 9배
:: 역제곱 법칙 → 1/3² = 1/9

= 확인 문제 2
Q (+) 전하와 (−) 전하 사이에 작용하는 힘에 대한 설명으로 옳은 것은?
o 척력이며, 전하량이 큰 쪽이 더 큰 힘을 받는다
o* 인력이며, 두 전하가 받는 힘의 크기는 같다
o 인력이며, 전하량이 작은 쪽이 더 큰 힘을 받는다
o 힘이 작용하지 않는다
:: 작용 반작용 — 크기가 같고 방향이 반대이다.

= 확인 문제 3
Q 한 전하의 전하량만 2배로 하고 거리를 절반으로 하면 전기력은?
o 1배
o 2배
o 4배
o* 8배
:: 2 ÷ (1/2)² = 2 × 4 = 8배

= 확인 문제 4
Q 일직선 위에 A(+), B(−), C(+)가 같은 간격으로 놓여 있고 A와 C의 전하량이 같다. B가 받는 알짜 전기력은?
o A 쪽
o C 쪽
o* 0
o 위쪽
:: B는 A와 C 쪽으로 같은 크기의 인력을 받아 상쇄된다.

= 확인 문제 5
Q 전하량 +1 μC와 −1 μC가 1 m 떨어져 있을 때 전기력의 크기는?
o 9 × 10⁹ N
o* 9 × 10⁻³ N
o 9 × 10⁻⁶ N
o 1 N
:: 9 × 10⁹ × 10⁻⁶ × 10⁻⁶ ÷ 1 = 9 × 10⁻³ N

## 전기장과 전위차 | 전하가 만드는 공간

= 전기장 | 힘을 전하는 공간
- 전하는 주위 공간에 **전기장**을 만든다.
- 그 공간에 놓인 다른 전하는 전기장으로부터 **전기력**을 받는다.
- (+)전하가 받는 힘의 방향을 전기장의 방향으로 정한다 → (+)전하에서 나오고 (−)전하로 들어간다.
>+ 전하 → 전기장 → 다른 전하: 떨어져 있어도 힘이 작용하는 까닭
% 2022 개정 물리학 [12물리02-01] 적용 시 고려 사항: 전기장은 전하에 의해 생성된다는 점을 정성적으로 다룬다. 전기력선으로 표현하고 전기장을 정량적으로 구하는 것은 '전자기와 양자'에서 다룬다.

= 전위차 | 전기의 높낮이
- 중력이 작용하는 곳에 높낮이가 있듯, 전기장 속에는 **전위**(전기적 높이)가 있다.
- 두 지점의 전위 차이 → **전위차(전압)**, 단위 V
- (+)전하는 전위가 높은 곳에서 낮은 곳으로 힘을 받는다 → 전위차가 있어야 전류가 흐른다.
>+ 전지는 두 극 사이에 **전위차**를 만들어 회로에 전류를 흐르게 한다.
? 번개는 왜 칠까? :: 구름 아래쪽에 쌓인 전하가 구름과 땅 사이에 매우 큰 전위차를 만들고, 공기를 뚫고 전하가 한꺼번에 이동하기 때문이다.

= 생활 속 전기력 | 사례
* 🎈 정전기 :: 마찰로 전자가 이동해 물체가 대전
* 🖨️ 레이저 프린터·복사기 :: 대전된 드럼에 토너가 붙는다
* 🏭 전기 집진기 :: 굴뚝의 미세 먼지를 전기력으로 모은다
* 🎨 정전 도장 :: 페인트 입자를 대전시켜 고르게 칠한다
* ⚛️ 원자와 분자 :: 화학 결합도 결국 전기력
* ⚡ 번개 :: 구름 속에 쌓인 전하의 방전

= 서술형 도전 | 생각 넓히기
? 두 전하의 전하량을 각각 2배로 하고 거리도 2배로 하면 전기력이 몇 배가 되는지 계산 과정과 함께 쓰시오. :: (2 × 2) ÷ 2² = 1배 — 변하지 않는다.
? 원자핵 속 양성자들은 서로 밀어내는 전기력을 받는데도 흩어지지 않는 까닭을 추론하시오. :: 원자핵 안에는 매우 짧은 거리에서 전기력보다 훨씬 강하게 작용하는 강한 핵력(강한 상호 작용)이 있어 양성자와 중성자를 묶어 두기 때문이다.

= 오늘 배운 내용 정리
- 같은 종류의 전하 → [[척력]], 다른 종류 → [[인력]]
- 쿨롱 법칙: F = [[k q₁q₂ / r²]], k = 9.0 × 10⁹ N·m²/C²
- 전하량의 [[곱]]에 비례, 거리의 [[제곱]]에 반비례
- 두 전하가 받는 힘: 크기 같고 방향 반대 ([[작용 반작용]])
- 원자핵과 전자 사이의 [[전기력]]이 원자를 이룬다.

= 나가기 전 한 문제 | 형성평가
? +3 μC와 −3 μC가 0.3 m 떨어져 있을 때 전기력의 크기와 종류를 구하시오. :: F = 9 × 10⁹ × 9 × 10⁻¹² ÷ 0.09 = 0.9 N, 인력
