# p–n 접합 다이오드 | 한 방향으로만 흐르는 전류 | 고등학교 물리학 · 03 전기와 자기 · 4차시 | 2022 개정 교육과정 [물리학 Ⅱ]

= 오늘의 학습 목표 | 4차시
^ p–n 접합과 **공핍층**의 형성을 설명할 수 있다.
^ **순방향·역방향** 연결에서 전류가 흐르는 원리를 설명할 수 있다.
^ **정류 작용**과 LED·태양 전지의 원리를 에너지띠로 설명할 수 있다.
% 흐름: 생각 열기 5분 → p–n 접합 8분 → 전류–전압(시뮬레이션) 12분 → 정류·LED 10분 → 문항 10분

= 충전기 속의 작은 부품 | 생각 열기
* 🔌 콘센트 :: 방향이 계속 바뀌는 교류 220 V
* 🔋 스마트폰 배터리 :: 한 방향으로 흐르는 직류가 필요
* 💡 LED :: 다리를 반대로 꽂으면 켜지지 않는다
* ☀️ 태양 전지 :: 빛을 받으면 전류가 흐른다
? 교류를 직류로 바꾸려면 어떤 부품이 필요할까? :: 전류를 **한 방향으로만** 흐르게 하는 **다이오드** — p형과 n형 반도체를 붙여 만든다.

= 지난 시간 복습 | 3차시
- n형 반도체: 주된 전하 운반자 [[전자]]
- p형 반도체: 주된 전하 운반자 [[양공]]
- 띠 간격이 클수록 흡수·방출하는 빛의 에너지가 [[크다]].
? p형과 n형을 맞붙이면 접합면에서 무슨 일이 일어날까? :: n형의 전자가 p형으로 넘어가 양공과 결합 → 전하 운반자가 거의 없는 **공핍층**이 생긴다.

## p–n 접합 | 공핍층

= p–n 접합 다이오드
! p형과 n형 반도체를 접합한 소자
- 접합면 근처에서 전자와 양공이 결합 → 전하 운반자가 거의 없는 ==공핍층==
| 연결 | 전원 | 공핍층 | 전류 |
|+ 순방향 | p형에 (+)극, n형에 (−)극 | [[얇아짐]] | 흐름 |
|+ 역방향 | p형에 (−)극, n형에 (+)극 | [[두꺼워짐]] | 거의 흐르지 않음 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#diode | 전압을 바꾸며 다이오드에 흐르는 전류와 전구의 밝기를 기록하자.
% 0.6 V 부근에서 전류가 '폭발적으로' 늘어나는 순간을 강조

= 전류–전압 관계 | 시뮬레이션 기록
| 전압 (V) | −2.0 | 0.4 | 0.6 | 0.7 |
|+ 전류 | ≈ 0 | 0.03 mA | [[2.39 mA]] | [[20.50 mA]] |
|+ 전구 | 꺼짐 | 꺼짐 | 희미 | 켜짐 |
||
C 다이오드의 전류–전압 특성 | 전압 (V) | 전류 (mA) | 전류:-2,0 0,0 0.4,0.03 0.5,0.3 0.6,2.39 0.65,7 0.7,20.5

= 그래프 해석 | 문턱 전압
- 역방향: 전압을 걸어도 전류가 거의 **0**
- 순방향: 약 ==0.6~0.7 V==를 넘으면 전류가 급격히 증가
>+ 0.6 V → 0.7 V로 0.1 V만 올려도 전류가 2.39 → 20.5 mA로 약 **8.6배**
~ 저항처럼 전압에 비례하지 않는다 (옴의 법칙을 따르지 않음)

= 예제 1 · 교류를 다이오드에 연결하면 | 적용
C 반파 정류 (모형) | 시간 (주기) | 전압 (상대값) | 입력 교류:0,0 0.125,0.71 0.25,1 0.375,0.71 0.5,0 0.625,-0.71 0.75,-1 0.875,-0.71 1,0 | 출력:0,0 0.125,0.71 0.25,1 0.375,0.71 0.5,0 0.75,0 1,0
||
^+ 순방향인 반 주기: 전류가 **흐른다.**
^+ 역방향인 반 주기: 전류가 **흐르지 않는다.**
^+ 결과: 한 방향으로만 흐르는 **맥류** (반파 정류)

## 다이오드의 활용 | LED와 태양 전지

= LED와 태양 전지
| 구분 | LED (발광 다이오드) | 태양 전지 |
|+ 연결 | 순방향 전압 | 빛을 받음 |
|+ 원리 | 전도띠의 전자가 양공과 결합하며 띠 간격만큼의 에너지를 [[빛]]으로 방출 | 빛을 흡수해 전자–양공 쌍 생성, 접합면 전기장이 분리 → [[전류]] |
|+ 에너지 전환 | 전기 → 빛 | 빛 → 전기 |

= 예제 2 · LED의 색과 띠 간격 | 적용
- λ(nm) = 1240 ÷ E(eV)
^+ 빨간 LED (약 650 nm): 띠 간격 ≈ 1240 ÷ 650 ≈ **1.9 eV**
^+ 파란 LED (약 460 nm): 띠 간격 ≈ 1240 ÷ 460 ≈ **2.7 eV**
^+ 파란 LED가 띠 간격이 **더 커야** 한다 → 만들기 어려웠던 까닭

= 확인 문제 1
Q 다이오드에 순방향 전압을 걸었을 때 공핍층의 변화는?
o 두꺼워진다
o* 얇아진다
o 변화 없다
o 사라졌다 다시 생긴다
:: 순방향에서는 전자와 양공이 접합면 쪽으로 밀려 공핍층이 얇아지고 전류가 흐른다.

= 확인 문제 2
Q 다이오드의 순방향 연결로 옳은 것은?
o p형에 (−)극, n형에 (+)극
o* p형에 (+)극, n형에 (−)극
o p형과 n형 모두 (+)극
o 극과 관계없다
:: p형에 (+)극을 연결해야 공핍층이 얇아진다.

= 확인 문제 3
Q 다이오드로 교류를 직류 방향으로 바꾸는 작용은?
o 증폭 작용
o* 정류 작용
o 발광 작용
o 유도 작용
:: 한 방향으로만 전류를 흐르게 하는 작용을 정류 작용이라 한다.

= 확인 문제 4
Q 띠 간격이 2.48 eV인 LED에서 나오는 빛의 파장은? (λ = 1240 ÷ E)
o 248 nm
o* 500 nm
o 620 nm
o 2480 nm
:: 1240 ÷ 2.48 = 500 nm (초록빛)

= 확인 문제 5
Q 태양 전지에서 일어나는 에너지 전환은?
o 전기 → 빛
o* 빛 → 전기
o 열 → 전기
o 화학 → 전기
:: 빛을 흡수해 생긴 전자–양공 쌍이 분리되어 전류가 흐른다.

= 생활 속 다이오드 | 사례
* 🔌 충전기 어댑터 :: 정류 회로로 교류를 직류로
* 💡 LED 조명·화면 :: 전기를 빛으로 효율적으로
* ☀️ 태양광 패널 :: 빛을 전기로
* 📺 리모컨 :: 적외선 LED가 신호를 보낸다
* 📡 광센서 :: 빛을 받으면 전류가 흐르는 포토다이오드
* 🚦 신호등 :: 오래가고 밝은 LED

= 서술형 도전 | 생각 넓히기
? LED에서 빛이 나오는 원리를 에너지띠로 설명하시오. :: 순방향 전압에서 전도띠의 전자가 접합면에서 원자가 띠의 양공과 결합하며 띠 간격만큼의 에너지를 빛으로 방출한다. 띠 간격에 따라 빛의 색이 달라진다.
? 파란색 LED는 빨간색 LED보다 띠 간격이 커야 하는 까닭을 광자 에너지와 연결해 쓰시오. :: 파란빛은 빨간빛보다 파장이 짧아 광자 에너지(hc/λ)가 크다. 방출되는 광자 에너지는 띠 간격과 같으므로 파란 LED의 띠 간격이 더 커야 한다.

= 오늘 배운 내용 정리
- p–n 접합면의 전하 운반자가 거의 없는 층 → [[공핍층]]
- 순방향: p형에 [[(+)]]극 → 공핍층 얇아짐 → 전류 흐름
- 역방향: 공핍층 [[두꺼워짐]] → 전류 거의 없음
- 한 방향으로만 전류 → [[정류 작용]] (교류 → 직류)
- LED: 전기 → [[빛]], 태양 전지: 빛 → [[전기]]

= 나가기 전 한 문제 | 형성평가
? 다이오드 하나와 전구를 교류 전원에 연결했을 때 전구에 흐르는 전류의 모양을 설명하고, 그 까닭을 쓰시오. :: 교류의 반 주기(순방향일 때)에만 전류가 흐르고 나머지 반 주기에는 흐르지 않는 맥류가 된다. 다이오드는 순방향일 때만 공핍층이 얇아져 전류를 흘리기 때문이다.
