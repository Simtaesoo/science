# 열기관과 영구 기관 | 열을 일로 바꾸는 장치의 한계 | 고등학교 물리학 · 02 에너지와 열 · 3차시 | 2022 개정 교육과정 [12물리01-06]

= 오늘의 학습 목표 | 3차시
^ **열기관**이 열의 일부를 역학적 에너지로 바꾸는 과정을 설명할 수 있다.
^ 열기관의 **효율**이 100 %가 될 수 없음을 정성적으로 설명할 수 있다.
^ **영구 기관**이 불가능함을 사례를 들어 논증할 수 있다.
% 흐름: 생각 열기 5분 → 열기관 8분 → 효율의 한계(시뮬레이션) 12분 → 영구 기관 논증 15분 → 문항 5분
% 2022 개정 [12물리01-06]: 열이 역학적 에너지로 전환되는 과정의 효율을 정성적으로 이해하고, 영구기관이 불가능함을 사례를 통해 논증한다. 열효율 계산식(1 − Q₂/Q₁, 1 − T₂/T₁)과 계산은 '역학과 에너지'에서 다룬다.

= 자동차 연료의 70 %는 어디로? | 생각 열기
* 🚗 자동차 엔진 :: 연료 에너지의 일부만 바퀴를 굴린다
* 🏭 화력 발전소 :: 커다란 냉각탑에서 김이 피어오른다
* ❄️ 냉장고 :: 뒤쪽이 따뜻하다
* ☕ 식는 커피 :: 저절로 다시 뜨거워지지 않는다
? 엔진이 연료의 에너지를 100 % 바퀴를 굴리는 데 쓸 수 있을까? :: 없다. 열기관은 받은 열의 일부를 반드시 **온도가 낮은 곳으로 내보내야** 작동한다.

= 지난 시간 복습 | 2차시
- 마찰로 역학적 에너지는 [[열]]로 전환된다.
- 열까지 포함하면 에너지 [[총량]]은 보존된다.
? 역학적 에너지는 열로 쉽게 모두 바뀌는데, 반대로 열을 역학적 에너지로 모두 바꿀 수 있을까? :: 그렇지 않다 — 오늘의 핵심. 열을 일로 바꾸는 데에는 한계가 있다.

## 열기관 | 열에서 일을 꺼내는 장치

= 열기관
! 열기관: 온도가 높은 곳(고열원)에서 열을 받아 일부를 **일(역학적 에너지)**로 바꾸고, 나머지를 온도가 낮은 곳(저열원)으로 내보내는 장치
^ 고열원에서 열을 받는다 (연료의 연소, 핵분열 등)
^ 일부를 일로 바꾼다 (피스톤, 터빈을 움직임)
^ 나머지 열을 저열원으로 방출한다 (배기가스, 냉각수, 대기)
>+ 에너지 보존: 받은 열 = 한 일 + 내보낸 열
>+ **열효율**: 받은 열 중에서 일로 바뀐 비율

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#engine | 저열원 온도를 그대로 두고 고열원 온도를 바꾸며 효율이 어떻게 달라지는지 관찰하자.
% 수치를 계산하지 않는다. '온도 차가 클수록 효율이 높아지지만 100 %에는 이르지 못한다'는 경향만 관찰한다.

= 효율의 경향 | 시뮬레이션 관찰
C 고열원 온도에 따른 열효율의 경향 (예시) | 고열원 온도 | 효율 | 효율:1,0 2,30 3,45 4,53 5,58 6,62
- 고열원 온도가 높을수록(온도 차가 클수록) 효율이 [[높아진다]].
- 그러나 효율이 높아지는 폭은 점점 줄어들고, [[100 %]]에는 이르지 못한다.
- 실제 열기관은 마찰과 열 손실 때문에 효율이 더 낮다.

= 예제 1 · 발전소의 냉각탑 | 적용
^+ 화력·원자력 발전소는 증기로 터빈을 돌린 뒤 증기를 **식혀야** 다시 쓸 수 있다.
^+ 이때 많은 열이 냉각수와 대기로 **버려진다.**
^+ 버려지는 열이 없다면 터빈을 계속 돌릴 수 없다 → 열기관의 피할 수 없는 한계
>+ 버려지는 열을 난방에 다시 쓰는 **열병합 발전**은 에너지를 더 알뜰하게 쓰는 방법

## 영구 기관 | 왜 불가능할까

= 영구 기관의 꿈
| 영구 기관 | 생각 | 불가능한 까닭 |
|+ 에너지 없이 영원히 일하는 기관 | 에너지를 넣지 않아도 계속 일을 한다 | [[에너지 보존 법칙]]에 어긋난다 |
|+ 열을 모두 일로 바꾸는 기관 | 바닷물의 열만으로 배를 움직인다 | 열을 일로 바꿀 때 일부는 반드시 저온으로 내보내야 한다 |
>+ 열은 스스로 온도가 낮은 곳에서 높은 곳으로 이동하지 않는다 — 자연 현상에는 **방향**이 있다.

= 사례 · 끝없이 도는 바퀴? | 논증
- 바퀴 둘레에 쇠공을 달아, 한쪽에서 공이 바깥으로 굴러가 더 큰 돌림힘을 만들면 영원히 돈다고 주장한 설계가 있었다.
^+ 실제로는 바깥쪽 공은 **개수가 적고**, 안쪽 공은 **개수가 많아** 양쪽 돌림힘이 균형을 이룬다.
^+ 게다가 축의 **마찰**과 공기 저항으로 역학적 에너지가 열로 빠져나간다.
^+ 외부에서 에너지를 공급하지 않으면 바퀴는 결국 **멈춘다.**
>+ 영구 기관 주장을 들으면 '에너지가 어디서 들어오는가?'를 먼저 묻자.

= 확인 문제 1
Q 열기관에 대한 설명으로 옳은 것은?
o 받은 열을 모두 일로 바꾼다
o* 받은 열의 일부를 일로 바꾸고 나머지를 저열원으로 내보낸다
o 저열원에서 열을 받아 고열원으로 내보낸다
o 열을 받지 않고도 일을 한다
:: 열기관은 반드시 일부 열을 저열원으로 방출한다.

= 확인 문제 2
Q 에너지를 공급하지 않아도 영원히 일하는 기관이 불가능한 까닭은?
o 기계가 너무 무겁기 때문
o* 에너지 보존 법칙에 어긋나기 때문
o 기술이 아직 발전하지 않았기 때문
o 열이 저온에서 고온으로 이동하기 때문
:: 에너지는 새로 생기지 않으므로 공급 없이 계속 일을 할 수 없다.

= 확인 문제 3
Q 열기관의 효율을 높이는 방법으로 가장 알맞은 것은?
o 고열원과 저열원의 온도를 같게 한다
o* 고열원과 저열원의 온도 차를 크게 하고 마찰과 열 손실을 줄인다
o 저열원의 온도를 높인다
o 연료를 적게 넣는다
:: 온도 차가 클수록 효율이 높아질 수 있지만 100 %는 불가능하다.

= 서술형 도전 | 생각 넓히기
? "바닷물에 녹아 있는 엄청난 열을 모두 일로 바꾸면 연료 없이 배를 움직일 수 있다"는 주장을 평가하시오. :: 불가능하다. 열을 일로 바꾸려면 더 낮은 온도의 저열원이 필요하고 일부 열을 반드시 내보내야 한다. 같은 온도의 바닷물만으로는 열을 일로 바꿀 수 없다.
? 냉장고가 내부의 열을 바깥으로 옮기는 것이 '열은 스스로 저온에서 고온으로 이동하지 않는다'는 원리에 어긋나지 않는 까닭을 쓰시오. :: 냉장고는 전기 에너지로 압축기를 돌려 외부에서 일을 해 주기 때문이다. 스스로 옮기는 것이 아니다.

= 오늘 배운 내용 정리
- 열기관: 고열원에서 열을 받아 일부를 [[일]]로 바꾸고 나머지를 저열원으로 방출
- 받은 열 = 한 일 + 내보낸 열 (에너지 보존)
- 열기관의 효율은 온도 차가 클수록 높아질 수 있지만 [[100 %]]가 될 수 없다
- 영구 기관은 에너지 보존과 열의 [[방향성]] 때문에 불가능하다

= 나가기 전 한 문제 | 형성평가
? 어떤 회사가 "연료 없이 스스로 전기를 만들어 영원히 작동하는 발전기"를 판매한다고 광고했다. 이 광고가 거짓인 까닭을 과학적으로 쓰시오. :: 에너지는 새로 생기지 않으므로(에너지 보존 법칙), 외부에서 에너지를 공급받지 않고 계속 전기 에너지를 만들어 낼 수 없다. 또 마찰 등으로 에너지가 열로 빠져나가므로 결국 멈춘다.
