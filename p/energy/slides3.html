* 🚗 자동차 엔진 :: 연료 에너지의 약 25~30 %만 바퀴를 굴린다
* 🏭 화력 발전소 :: 커다란 냉각탑에서 김이 피어오른다

? 엔진의 효율을 100 %로 만들 수 있을까? :: 없다. 열기관은 반드시 일부 열을 **저열원으로 버려야** 작동한다 — 열역학 제2법칙

- 열역학 제1법칙: Q = [[ΔU + W]]
- 등온 팽창: 흡수한 열이 모두 [[일]]로

## 열기관 | 고열원에서 저열원으로

= 열기관
! 열기관: 고열원에서 열 Q₁을 흡수하여 일 W를 하고 저열원으로 열 Q₂를 방출하는 장치
- 에너지 보존: W = ==Q₁ − Q₂==
- 열효율: e = W ÷ Q₁ = ==1 − Q₂/Q₁==
>+ Q₂ = 0이면 효율 100 %지만, 그런 열기관은 **만들 수 없다.**

= 예제 1 · 열효율 계산 | 적용
- 열효율 25 %인 기관이 고열원에서 4000 J을 흡수한다.
^+ 일 W = 0.25 × 4000 = **1000 J**
^+ 방출하는 열 Q₂ = 4000 − 1000 = **3000 J**
^+ 검산: 1 − 3000/4000 = 0.25 ✔

= 이상적인 열기관의 최대 효율
! 카르노 기관의 효율 = 1 − T₂/T₁ (T: 절대 온도, K)
- 실제 열기관의 효율은 이보다 **항상 낮다** (마찰, 열 손실)
- 효율을 높이려면 고열원 온도 T₁을 **높이거나**, 저열원 온도 T₂를 **낮춘다.**
~ 절대 온도 T(K) = 섭씨 온도(℃) + 273

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#engine | 저열원 300 K에서 고열원 온도를 바꾸며 이론적 최대 효율과 실제 효율(손실 30 %)을 기록하자.
% 고열원 온도를 2배로 해도 효율이 2배가 되지 않는 점에 주목

= 고열원 온도와 효율 | 시뮬레이션 기록
| 고열원 (K) | 400 | 600 | 800 | 1200 |
|+ 최대 효율 (%) | 25.0 | [[50.0]] | [[62.5]] | [[75.0]] |
|+ 실제 효율 (%) | 17.5 | [[35.0]] | [[43.8]] | [[52.5]] |
- 최대 효율 = 1 − 300/T₁, 실제 효율 = 최대 효율 × 0.7

= 그래프로 보면 | 효율의 한계
C 고열원 온도에 따른 열효율 (저열원 300 K) | 고열원 온도 (K) | 효율 (%) | 최대 효율:300,0 400,25 600,50 800,62.5 1200,75 | 실제 효율:300,0 400,17.5 600,35 800,43.8 1200,52.5
~ 고열원 온도를 아무리 높여도 효율은 100 %에 다가갈 뿐 도달하지 못한다.

= 예제 2 · 발전소의 최대 효율 | 적용
- 증기 온도 527 ℃, 냉각수 온도 27 ℃인 발전소의 이론적 최대 효율은?
^+ T₁ = 527 + 273 = **800 K**, T₂ = 27 + 273 = **300 K**
^+ 최대 효율 = 1 − 300/800 = **62.5 %**
^+ 실제로는 손실이 있어 약 **40 %** 안팎에 그친다.

## 열역학 제2법칙 | 되돌릴 수 없는 방향

= 열역학 제2법칙
! 열은 스스로 저온에서 고온으로 이동하지 않는다
- 열효율이 **100 %**인 열기관은 만들 수 없다.
- 자연 현상은 **무질서도(엔트로피)**가 증가하는 방향으로 일어난다 → 비가역
>+ 냉장고: 전기 에너지로 **일을 해 주어야** 열을 저온 → 고온으로 옮길 수 있다.

= 확인 문제 1
Q 열기관이 고열원에서 5000 J을 흡수하고 저열원으로 3500 J을 방출했다. 열효율은?
o 70 %
o* 30 %
o 35 %
o 50 %
:: W = 1500 J → e = 1500 ÷ 5000 = 30 %

= 확인 문제 2
Q 고열원 600 K, 저열원 300 K인 이상적인 열기관의 최대 효율은?
o 25 %
o* 50 %
o 75 %
o 100 %
:: 1 − 300/600 = 0.5

= 확인 문제 3
Q 열역학 제2법칙에 대한 설명으로 옳지 않은 것은?
o 열은 스스로 저온에서 고온으로 이동하지 않는다
o 열효율이 100 %인 열기관은 만들 수 없다
o 자연 현상은 무질서도가 증가하는 방향으로 일어난다
o* 냉장고는 제2법칙을 어긴다
:: 냉장고는 외부에서 일(전기 에너지)을 해 주므로 제2법칙에 어긋나지 않는다.

= 확인 문제 4
Q 열효율 40 %인 엔진이 1200 J의 일을 하려면 흡수해야 할 열은?
o 480 J
o 1680 J
o* 3000 J
o 4800 J
:: Q₁ = W ÷ e = 1200 ÷ 0.4 = 3000 J

= 확인 문제 5
Q 이상적인 열기관의 효율을 높이는 방법으로 옳은 것은?
o 고열원 온도를 낮춘다
o* 고열원 온도를 높이거나 저열원 온도를 낮춘다
o 저열원 온도를 높인다
o 두 열원의 온도를 같게 한다
:: 최대 효율 = 1 − T₂/T₁ → T₁ ↑ 또는 T₂ ↓

= 생활 속 열기관과 제2법칙 | 사례
* 🚗 자동차 엔진 :: 연료의 화학 에너지 → 열 → 일, 배기·냉각으로 열 방출
* 🏭 복합 화력 발전 :: 가스 터빈의 배기열로 증기 터빈을 한 번 더 돌린다
* ❄️ 냉장고·에어컨 :: 일을 해 주어 열을 거꾸로 옮긴다
* ☕ 식는 커피 :: 저절로 다시 뜨거워지지 않는다
* 💧 잉크 퍼짐 :: 퍼진 잉크는 저절로 다시 모이지 않는다
* 🔥 열병합 발전 :: 버려지는 열로 난방

= 서술형 도전 | 생각 넓히기
? 냉장고가 열을 저온(내부)에서 고온(외부)으로 옮기는 것이 열역학 제2법칙에 어긋나지 않는 까닭을 쓰시오. :: 전기 에너지로 압축기를 돌려 외부에서 일을 해 주기 때문이다. 제2법칙은 열이 '스스로' 저온에서 고온으로 이동하지 않는다는 것이다.
? 발전소의 효율을 높이는 방법을 열역학적으로 두 가지 제안하시오. :: 고열원 온도를 높인다(고온 증기·가스 터빈), 버려지는 열을 다시 활용한다(복합 화력·열병합 발전), 저열원 온도를 낮춘다(냉각 효율 향상) 중 두 가지

= 오늘 배운 내용 정리
- 열기관: 고열원에서 Q₁ 흡수, 일 W, 저열원으로 Q₂ 방출 → W = [[Q₁ − Q₂]]
- 열효율 e = W/Q₁ = [[1 − Q₂/Q₁]]
- 이상적인 열기관의 최대 효율 = [[1 − T₂/T₁]] (절대 온도)
- 열효율이 100 %인 열기관은 불가능 → [[열역학 제2법칙]]
- 자연 현상은 [[무질서도]]가 증가하는 방향으로 일어난다.

= 나가기 전 한 문제 | 형성평가
? 고열원 1000 K, 저열원 400 K인 이상적인 열기관이 고열원에서 2000 J을 흡수할 때 할 수 있는 최대 일과 방출하는 열을 구하시오. :: 최대 효율 = 1 − 400/1000 = 0.6 → W = 0.6 × 2000 = 1200 J, Q₂ = 2000 − 1200 = 800 J
