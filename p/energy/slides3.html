# 열기관과 열효율 | 열을 일로 바꾸는 장치의 한계 | 고등학교 물리학 · 02 에너지와 열 · 3차시 | 2022 개정 교육과정 [물리학 Ⅰ]

= 오늘의 학습 목표 | 3차시
^ **열기관**이 열을 일로 바꾸는 원리를 설명할 수 있다.
^ **열효율**의 뜻을 알고, 열기관의 효율에 **한계**가 있음을 설명할 수 있다.
^ **열역학 제2법칙**과 자연 현상의 비가역성을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 열기관 8분 → 열효율 계산 8분 → 고열원 온도와 효율(시뮬레이션) 12분 → 제2법칙·문항 12분

= 자동차 연료의 70 %는 어디로? | 생각 열기
* 🚗 자동차 엔진 :: 연료 에너지의 약 25~30 %만 바퀴를 굴린다
* 🏭 화력 발전소 :: 커다란 냉각탑에서 김이 피어오른다
* ❄️ 냉장고 :: 뒤쪽이 따뜻하다
* ☕ 식는 커피 :: 저절로 다시 뜨거워지지 않는다
? 엔진의 효율을 100 %로 만들 수 있을까? :: 없다. 열기관은 반드시 일부 열을 **저열원으로 버려야** 작동한다 — 열역학 제2법칙

= 지난 시간 복습 | 2차시
- 열역학 제1법칙: Q = [[ΔU + W]]
- 등온 팽창: 흡수한 열이 모두 [[일]]로
- 단열 팽창: 내부 에너지가 [[감소]]하여 온도 하강
? 기체가 계속 일을 하려면 무엇이 필요할까? :: 팽창만 계속할 수는 없으니 **원래 상태로 되돌아오는 순환**이 필요하다. 이때 일부 열을 내보내야 한다.

## 열기관 | 고열원에서 저열원으로

= 열기관
! 열기관: 고열원에서 열 Q₁을 흡수하여 일 W를 하고 저열원으로 열 Q₂를 방출하는 장치
- 에너지 보존: W = ==Q₁ − Q₂==
- 열효율: e = W ÷ Q₁ = ==1 − Q₂/Q₁==
>+ Q₂ = 0이면 효율 100 %지만, 그런 열기관은 **만들 수 없다.**

= 예제 1 · 열효율 계산 | 적용
- 열효율 25 %인 기관이 고열원에서 4000 J을 흡수한다.
^+ 일 W = 0.25 × 4000 = **1000 J**
^+ 방출하는 열 Q₂ = 4000 − 1000 = **3000 J**
^+ 검산: 1 − 3000/4000 = 0.25 ✔

= 열기관의 효율을 높이려면
- 고열원과 저열원의 온도 차가 **클수록** 열기관이 낼 수 있는 효율이 높아진다.
- 실제 열기관은 마찰과 열 손실이 있어 효율이 **더 낮다**.
- 아무리 좋은 열기관도 저열원으로 열을 내보내야 하므로 효율이 **100 %가 될 수 없다**.
% 2022 개정 물리학은 열효율을 정성적으로 다룬다. 카르노 기관의 효율 식(1 − T₂/T₁)과 이를 이용한 계산은 다루지 않는다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#engine | 저열원 온도를 그대로 두고 고열원 온도를 바꾸며 효율이 어떻게 달라지는지 관찰하자.
% 고열원 온도를 높여도 효율이 100 %에 이르지 못한다는 점에 주목. 식을 유도하거나 계산하지 않는다.

= 고열원 온도와 효율 | 시뮬레이션 기록
| 고열원 (K) | 400 | 600 | 800 | 1200 |
|+ 이론적 효율 (%) | 25.0 | 50.0 | 62.5 | 75.0 |
|+ 실제 효율 (%) | 17.5 | 35.0 | 43.8 | 52.5 |
>+ 고열원 온도가 높을수록 효율이 [[높아지지만]], 늘어나는 폭은 점점 [[작아진다]].

= 그래프로 보면 | 효율의 한계
C 고열원 온도에 따른 열효율 (저열원 300 K) | 고열원 온도 (K) | 효율 (%) | 최대 효율:300,0 400,25 600,50 800,62.5 1200,75 | 실제 효율:300,0 400,17.5 600,35 800,43.8 1200,52.5
~ 고열원 온도를 아무리 높여도 효율은 100 %에 다가갈 뿐 도달하지 못한다.

= 예제 2 · 어느 발전소의 효율이 높을까? | 적용
- 냉각수 온도가 같은 두 화력 발전소 A(증기 약 550 ℃), B(증기 약 350 ℃)가 있다.
^+ 고열원과 저열원의 온도 차 → **A가 더 크다**
^+ 다른 조건이 같다면 → **A의 효율이 더 높을 수 있다**
^+ 실제 화력 발전소의 효율은 약 **40 %** 안팎 — 나머지는 열로 버려진다
>+ 버려지는 열을 난방 등에 다시 쓰는 열병합 발전은 에너지를 더 효율적으로 이용한다.

## 열역학 제2법칙 | 되돌릴 수 없는 방향

= 열역학 제2법칙
! 열은 스스로 저온에서 고온으로 이동하지 않는다
- 열효율이 **100 %**인 열기관은 만들 수 없다.
- 자연 현상은 **무질서도(엔트로피)**가 증가하는 방향으로 일어난다 → 비가역
>+ 냉장고: 전기 에너지로 **일을 해 주어야** 열을 저온 → 고온으로 옮길 수 있다.

= 확인 문제 1
Q 열기관이 고열원에서 5000 J을 흡수하고 저열원으로 3500 J을 방출했다. 열효율은?
o 70 %
o* 30 %
o 35 %
o 50 %
:: W = 1500 J → e = 1500 ÷ 5000 = 30 %

= 확인 문제 2
Q 고열원 600 K, 저열원 300 K인 이상적인 열기관의 최대 효율은?
o 25 %
o* 50 %
o 75 %
o 100 %
:: 1 − 300/600 = 0.5

= 확인 문제 3
Q 열역학 제2법칙에 대한 설명으로 옳지 않은 것은?
o 열은 스스로 저온에서 고온으로 이동하지 않는다
o 열효율이 100 %인 열기관은 만들 수 없다
o 자연 현상은 무질서도가 증가하는 방향으로 일어난다
o* 냉장고는 제2법칙을 어긴다
:: 냉장고는 외부에서 일(전기 에너지)을 해 주므로 제2법칙에 어긋나지 않는다.

= 확인 문제 4
Q 열효율 40 %인 엔진이 1200 J의 일을 하려면 흡수해야 할 열은?
o 480 J
o 1680 J
o* 3000 J
o 4800 J
:: Q₁ = W ÷ e = 1200 ÷ 0.4 = 3000 J

= 확인 문제 5
Q 이상적인 열기관의 효율을 높이는 방법으로 옳은 것은?
o 고열원 온도를 낮춘다
o* 고열원 온도를 높이거나 저열원 온도를 낮춘다
o 저열원 온도를 높인다
o 두 열원의 온도를 같게 한다
:: 고열원과 저열원의 온도 차가 클수록 효율을 높일 수 있다.

= 생활 속 열기관과 제2법칙 | 사례
* 🚗 자동차 엔진 :: 연료의 화학 에너지 → 열 → 일, 배기·냉각으로 열 방출
* 🏭 복합 화력 발전 :: 가스 터빈의 배기열로 증기 터빈을 한 번 더 돌린다
* ❄️ 냉장고·에어컨 :: 일을 해 주어 열을 거꾸로 옮긴다
* ☕ 식는 커피 :: 저절로 다시 뜨거워지지 않는다
* 💧 잉크 퍼짐 :: 퍼진 잉크는 저절로 다시 모이지 않는다
* 🔥 열병합 발전 :: 버려지는 열로 난방

= 서술형 도전 | 생각 넓히기
? 냉장고가 열을 저온(내부)에서 고온(외부)으로 옮기는 것이 열역학 제2법칙에 어긋나지 않는 까닭을 쓰시오. :: 전기 에너지로 압축기를 돌려 외부에서 일을 해 주기 때문이다. 제2법칙은 열이 '스스로' 저온에서 고온으로 이동하지 않는다는 것이다.
? 발전소의 효율을 높이는 방법을 열역학적으로 두 가지 제안하시오. :: 고열원 온도를 높인다(고온 증기·가스 터빈), 버려지는 열을 다시 활용한다(복합 화력·열병합 발전), 저열원 온도를 낮춘다(냉각 효율 향상) 중 두 가지

= 오늘 배운 내용 정리
- 열기관: 고열원에서 Q₁ 흡수, 일 W, 저열원으로 Q₂ 방출 → W = [[Q₁ − Q₂]]
- 열효율 e = W/Q₁ = [[1 − Q₂/Q₁]]
- 두 열원의 온도 차가 클수록 효율이 높아질 수 있지만 [[100 %]]는 불가능
- 열효율이 100 %인 열기관은 불가능 → [[열역학 제2법칙]]
- 자연 현상은 [[무질서도]]가 증가하는 방향으로 일어난다.

= 나가기 전 한 문제 | 형성평가
? 열기관이 고열원에서 2000 J을 흡수하고 저열원으로 1400 J을 방출했다. 이 열기관이 한 일과 열효율을 구하고, 효율을 100 %로 만들 수 없는 까닭을 쓰시오. :: W = 2000 − 1400 = 600 J, e = 600 ÷ 2000 = 30 %. 열기관은 반드시 저열원으로 열을 방출해야 하므로(열역학 제2법칙) 흡수한 열을 모두 일로 바꿀 수 없다.
