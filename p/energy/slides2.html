# 열역학 제1법칙 | 열도 에너지다 | 고등학교 물리학 · 02 에너지와 열 · 2차시 | 2022 개정 교육과정 [물리학 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ 기체의 **내부 에너지**와 기체가 하는 **일**을 설명할 수 있다.
^ **열역학 제1법칙** Q = ΔU + W를 적용할 수 있다.
^ 생활 속 현상(가열, 빠른 압축·팽창)을 열역학 제1법칙으로 **설명**할 수 있다.
% 흐름: 생각 열기 5분 → 내부 에너지·일 8분 → 제1법칙 7분 → 시뮬레이션 10분 → 적용·문항 15분
% 2022 개정 물리학은 열역학 제1법칙을 에너지 보존의 관점에서 다루며, 등압·등적·등온·단열 과정의 체계적 분석과 압력–부피 그래프 계산은 진로 선택 과목 '역학과 에너지'에서 다룬다.

= 스프레이를 오래 뿌리면? | 생각 열기
* 🧴 스프레이 :: 계속 뿌리면 통이 차가워진다
* 🚲 자전거 펌프 :: 빠르게 펌프질하면 펌프가 뜨거워진다
* ⛰️ 산을 넘는 공기 :: 올라가며 식어 구름이 생긴다
* 🍿 팝콘 :: 열을 받은 수증기가 팽창하며 터진다
? 불을 대지도 않았는데 스프레이 통은 왜 차가워질까? :: 기체가 빠르게 **팽창하며 일을 하느라** 자신의 내부 에너지를 써서 온도가 내려간다 — 단열 팽창

= 지난 시간 복습 | 1차시 · 중3
- 마찰이 있으면 역학적 에너지 일부가 [[열에너지]]로 전환
- 공기가 상승하면 [[단열 팽창]]으로 기온이 낮아진다 (중3 날씨)
? 열과 일은 모두 에너지를 옮기는 방법이다. 기체에 열을 주면 그 에너지는 어디로 갈까? :: 기체의 **온도를 올리는 데**(내부 에너지) 쓰이거나, 기체가 **팽창하며 일을 하는 데** 쓰인다.

## 내부 에너지와 일 | 기체의 에너지

= 내부 에너지와 기체가 한 일
- **내부 에너지 U**: 물체를 구성하는 입자의 운동 에너지 + 퍼텐셜 에너지의 총합
-- 이상 기체는 ==절대 온도==에 비례 → 온도가 오르면 ΔU > 0
- **기체가 한 일 W**: 기체가 팽창하며 피스톤을 밀어낼 때 외부에 한 일
>+ 팽창하면 W > 0 (기체가 일을 함), 압축되면 W < 0 (외부가 기체에 일을 함)

= 열역학 제1법칙
! Q = ΔU + W
- Q: 기체가 흡수한 열, ΔU: 내부 에너지 증가량, W: 기체가 외부에 한 일
>+ 열과 일까지 포함한 **에너지 보존 법칙**

= 예제 1 · 열과 일 | 적용
- 기체에 열 800 J을 가했더니 기체가 외부에 300 J의 일을 했다.
^+ ΔU = Q − W = 800 − 300 = **500 J 증가**
^+ 내부 에너지가 늘었으므로 기체의 온도는 **올라간다.**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#thermo | 기체에 열을 주는 경우와 열 출입 없이 빠르게 압축·팽창하는 경우를 실행하고 Q, ΔU, W의 부호와 온도 변화를 기록하자.
% 과정의 이름(등압·등온 등)을 외우게 하지 않는다. Q, ΔU, W의 부호와 에너지 흐름만 해석한다.

= 에너지는 어디로 갔을까? | 시뮬레이션 기록
| 상황 | Q | W | ΔU | 온도 |
|+ 가열하며 피스톤이 밀려남 | + (흡수) | + (기체가 일) | [[+]] | 상승 |
|+ 피스톤을 고정하고 가열 | + | [[0]] | + | 상승 |
|+ 빠르게 압축 (열 출입 거의 없음) | 0 | − (일을 받음) | [[+]] | [[상승]] |
|+ 빠르게 팽창 (열 출입 거의 없음) | 0 | + | [[−]] | [[하강]] |
>+ 받은 에너지(Q, 받은 일) = 내부 에너지 증가 + 내보낸 에너지 — **에너지 보존**

= 예제 2 · 자전거 펌프가 뜨거워지는 까닭 | 적용
- 펌프 손잡이를 빠르게 눌러 공기를 압축했다.
^+ 빠르게 일어나 열이 드나들 시간이 없다 → **Q ≈ 0**
^+ 외부가 기체에 일을 해 준다 → **W < 0**
^+ ΔU = Q − W **> 0** → 내부 에너지 증가 → 온도 **상승**

= 예제 3 · 스프레이가 차가워지는 까닭 | 적용
- 스프레이 통의 기체가 빠르게 팽창하며 외부에 200 J의 일을 했다.
^+ 빠르게 일어나 열을 받을 시간이 없다 → **Q ≈ 0**
^+ ΔU = Q − W = 0 − 200 = **−200 J**
^+ 내부 에너지 감소 → 온도 **하강** → 통이 차가워진다.

= 확인 문제 1
Q 피스톤을 고정한 실린더 속 기체에 열 300 J을 가했을 때 내부 에너지 변화량은?
o 0 J
o 150 J
o* 300 J
o −300 J
:: 부피가 변하지 않아 기체가 한 일 W = 0 → ΔU = Q = 300 J

= 확인 문제 2
Q 기체가 열 600 J을 흡수하고 내부 에너지가 400 J 증가했다. 기체가 외부에 한 일은?
o 1000 J
o* 200 J
o 400 J
o −200 J
:: W = Q − ΔU = 600 − 400 = 200 J

= 확인 문제 3
Q 열 출입 없이 기체를 빠르게 압축할 때 기체의 온도 변화와 까닭으로 옳은 것은?
o 내려간다 — 기체가 일을 해서
o* 올라간다 — 외부가 기체에 일을 해 내부 에너지가 증가해서
o 변하지 않는다 — 열 출입이 없어서
o 내려간다 — 열을 방출해서
:: Q = 0, W < 0 → ΔU = −W > 0

= 생활 속 열역학 제1법칙 | 사례
* 🧴 스프레이 :: 단열 팽창으로 차가워진다
* 🚲 자전거 펌프 :: 단열 압축으로 뜨거워진다
* ☁️ 구름 :: 상승 공기의 단열 팽창 → 이슬점 도달
* 🔥 디젤 엔진 :: 공기를 강하게 단열 압축해 연료를 저절로 점화
* 🍾 샴페인 뚜껑 :: 열 때 병 입구에 하얀 김이 생긴다
* 🌡️ 압력솥 :: 부피가 일정한 채 가열(등적에 가까움)

= 서술형 도전 | 생각 넓히기
? 스프레이를 오래 뿌리면 통이 차가워지는 까닭을 열역학 제1법칙으로 설명하시오. :: 기체가 빠르게 팽창하며 외부에 일을 하는데(W > 0) 열을 받을 시간이 없어(Q ≈ 0), ΔU = −W < 0이 되어 내부 에너지와 온도가 낮아진다.
? 높은 산을 넘는 공기가 상승할 때 구름이 생기는 까닭을 열역학 제1법칙과 연결하시오. :: 상승하는 공기는 기압이 낮아져 단열 팽창하고, 내부 에너지가 줄어 온도가 이슬점 이하로 내려가 수증기가 응결하기 때문이다.

= 오늘 배운 내용 정리
- 이상 기체의 내부 에너지는 [[절대 온도]]에 비례
- 기체가 팽창하면 외부에 일을 하고(W > 0), 압축되면 일을 받는다(W < 0)
- 열역학 제1법칙: Q = [[ΔU + W]]
- 열 출입 없이 빠르게 압축하면 온도 [[상승]], 빠르게 팽창하면 온도 [[하강]]

= 나가기 전 한 문제 | 형성평가
? 단열된 실린더 속 기체를 피스톤으로 압축하며 외부에서 150 J의 일을 해 주었다. Q, W, ΔU를 쓰고 온도 변화를 설명하시오. :: Q = 0, W = −150 J(기체가 일을 받음), ΔU = Q − W = 150 J → 내부 에너지가 증가하여 온도가 올라간다.
