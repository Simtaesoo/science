# 역학적 에너지와 열 | 사라진 에너지는 어디로 갔을까 | 고등학교 물리학 · 02 에너지와 열 · 2차시 | 2022 개정 교육과정 [12물리01-05]

= 오늘의 학습 목표 | 2차시
^ 마찰이나 충돌로 줄어든 역학적 에너지가 **열**의 형태로 전환됨을 설명할 수 있다.
^ 열까지 포함하면 에너지의 **총량이 보존**됨을 설명할 수 있다.
^ 열전달, 상태 변화, 기상 현상을 **에너지 전환과 보존**의 관점으로 설명할 수 있다.
% 흐름: 생각 열기 5분 → 마찰과 열(시뮬레이션) 12분 → 줄의 실험 8분 → 생활·자연 속 에너지 전환 12분 → 문항 8분
% 2022 개정 [12물리01-05] 해설: 열역학 과정을 명시적으로 다루지 않고, 열의 형태로 에너지가 전환되며 나타나는 열전달, 상태 변화, 기상 현상 등 중학교에서 다룬 내용을 정성적으로 설명한다. 열역학 법칙·과정·열기관의 정량적 분석은 '역학과 에너지'에서 다룬다.

= 미끄럼틀을 타면 엉덩이가 따뜻하다? | 생각 열기
* 🛝 미끄럼틀 :: 내려온 뒤 엉덩이와 미끄럼틀이 따뜻하다
* 🚲 자전거 브레이크 :: 내리막에서 오래 잡으면 브레이크가 뜨겁다
* 🔨 망치질 :: 못을 여러 번 치면 못이 따뜻해진다
* 🏀 공 튀기기 :: 튈 때마다 높이가 낮아진다
? 줄어든 역학적 에너지는 사라졌을까? :: 사라지지 않았다. 마찰과 충돌로 물체와 주위의 **열에너지(내부 에너지)**로 전환되었다.

= 지난 시간 복습 | 1차시
- 마찰이 없으면 역학적 에너지는 [[보존]]된다.
- 역학적 에너지 = 운동 에너지 + [[퍼텐셜]] 에너지
- 마찰 구간을 지나면 역학적 에너지가 [[줄어든다]].
? 마찰 구간에서 줄어든 역학적 에너지와 발생한 열은 어떤 관계일까? :: 줄어든 역학적 에너지만큼 열이 발생한다 → 오늘 확인!

## 역학적 에너지와 열 | 줄어든 만큼 열로

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#mech | [수평면 마찰 있음]을 켜고 용수철을 압축해 발사하자. 마찰 구간 전후의 역학적 에너지와 발생한 열을 비교하자.
% 줄어든 역학적 에너지와 발생한 열의 합이 처음 에너지와 같은지 확인하게 한다. 수치 계산보다 '합이 일정하다'는 관계에 주목.

= 에너지 장부 | 시뮬레이션 기록
| 구분 | 처음 | 마찰 구간 뒤 |
|+ 역학적 에너지 | 큼 | [[줄어듦]] |
|+ 열에너지 | 0 | [[늘어남]] |
|+ 역학적 에너지 + 열에너지 | 일정 | [[일정]] |
>+ 열까지 포함하면 에너지의 총량은 **변하지 않는다** → **에너지 보존 법칙**

= 줄의 실험 | 열도 에너지다
^+ 추가 내려가며 물속의 날개바퀴를 돌린다.
^+ 날개가 물을 휘저으면 물의 **온도가 올라간다.**
^+ 추가 잃은 역학적 에너지만큼 물의 열에너지가 늘었다.
>+ 열은 물질이 아니라 **에너지의 한 형태**임을 밝힌 실험 (줄, 1840년대)
? 같은 추를 더 높은 곳에서 떨어뜨리면 물의 온도 변화는? :: 추가 잃는 역학적 에너지가 커지므로 물의 온도가 더 많이 올라간다.

## 생활과 자연 속 에너지 전환 | 열의 형태로

= 열의 형태로 나타나는 에너지 전환 | 중학교 내용과 연결
| 현상 | 에너지 전환 | 관련 내용 |
|+ 마찰·충돌 | 역학적 에너지 → [[열]] | 브레이크, 운석의 대기 진입 |
|+ 열전달 | 온도가 높은 곳 → 낮은 곳 | 전도·대류·복사 (중1) |
|+ 상태 변화 | 열 출입으로 입자 배열 변화 | 융해·기화 시 흡수 (중1) |
|+ 기상 현상 | 수증기 응결 시 열 방출 | 구름·태풍의 에너지원 (중3) |
|+ 공기의 상승 | 팽창하며 온도 하강 | 구름의 생성 (중3) |

= 예제 1 · 운석이 빛나는 까닭 | 적용
^+ 매우 빠르게 대기로 들어온 운석은 큰 **운동 에너지**를 가진다.
^+ 공기와의 마찰·충돌로 운동 에너지가 **열**로 전환된다.
^+ 온도가 매우 높아져 빛을 낸다 → **별똥별**
>+ 우주선이 지구로 돌아올 때 열 차폐판이 필요한 까닭

= 예제 2 · 공이 튈 때마다 낮아지는 까닭 | 적용
^+ 공이 바닥과 충돌할 때 공과 바닥이 **변형**되고 소리가 난다.
^+ 역학적 에너지 일부가 **열에너지와 소리 에너지**로 전환된다.
^+ 다음 최고 높이에서 퍼텐셜 에너지가 처음보다 작다 → 높이가 낮아진다.
>+ 공 + 바닥 + 공기의 에너지를 모두 더하면 총량은 그대로다.

= 확인 문제 1
Q 내리막길에서 자전거 브레이크를 오래 잡으면 브레이크가 뜨거워지는 까닭은?
o 브레이크가 열을 흡수하기 때문
o* 마찰로 역학적 에너지가 열에너지로 전환되기 때문
o 에너지가 새로 생기기 때문
o 공기가 브레이크를 데우기 때문
:: 마찰력이 한 일만큼 역학적 에너지가 열로 바뀐다.

= 확인 문제 2
Q 마찰이 있는 면에서 미끄러지던 물체가 멈췄다. 이 과정에 대한 설명으로 옳은 것은?
o 물체의 에너지는 사라졌다
o 역학적 에너지는 보존되었다
o* 줄어든 역학적 에너지만큼 열에너지가 늘어 에너지 총량은 보존되었다
o 열에너지는 줄어들었다
:: 열까지 포함하면 에너지의 총량은 보존된다.

= 확인 문제 3
Q 줄의 실험이 밝혀낸 사실로 가장 알맞은 것은?
o 열은 눈에 보이지 않는 물질이다
o* 역학적 에너지가 열로 전환되며, 열은 에너지의 한 형태이다
o 물은 저절로 데워진다
o 에너지는 사라질 수 있다
:: 추가 잃은 역학적 에너지만큼 물의 온도가 올라갔다.

= 서술형 도전 | 생각 넓히기
? 손바닥을 비비면 따뜻해지는 현상을 에너지 전환과 보존으로 설명하시오. :: 손을 움직이는 역학적 에너지가 마찰에 의해 손바닥의 열에너지로 전환된다. 줄어든 운동 에너지와 늘어난 열에너지를 합하면 에너지 총량은 보존된다.
? 공기 저항이 있을 때 낙하하는 빗방울의 역학적 에너지는 어떻게 변하며, 줄어든 에너지는 어디로 가는지 쓰시오. :: 공기 저항 때문에 역학적 에너지가 줄어들고, 줄어든 만큼 빗방울과 주위 공기의 열에너지(와 소리 등)로 전환된다.

= 오늘 배운 내용 정리
- 마찰·충돌로 줄어든 역학적 에너지 → [[열에너지]]로 전환
- 역학적 에너지 + 열에너지 = [[일정]] → 에너지 보존 법칙
- 줄의 실험: 열은 [[에너지]]의 한 형태
- 열전달, 상태 변화, 기상 현상도 에너지 전환과 보존으로 설명할 수 있다.

= 나가기 전 한 문제 | 형성평가
? 롤러코스터가 처음 언덕보다 높은 언덕을 넘을 수 없는 까닭을 열과 에너지 보존을 이용해 쓰시오. :: 처음 언덕에서 가진 역학적 에너지보다 더 큰 퍼텐셜 에너지를 가질 수 없고, 마찰과 공기 저항으로 역학적 에너지 일부가 열로 바뀌므로 더 높은 곳까지 올라갈 수 없다.
