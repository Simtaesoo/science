# 열역학 제1법칙 | 열도 에너지다 | 고등학교 물리학 · 02 에너지와 열 · 2차시 | 2022 개정 교육과정 [물리학 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ 기체의 **내부 에너지**와 기체가 하는 **일**을 설명할 수 있다.
^ **열역학 제1법칙** Q = ΔU + W를 적용할 수 있다.
^ **등압·등적·등온·단열** 과정을 압력–부피 그래프로 해석할 수 있다.
% 흐름: 생각 열기 5분 → 내부 에너지·일 8분 → 제1법칙 7분 → 네 가지 과정(시뮬레이션) 13분 → 계산·문항 12분

= 스프레이를 오래 뿌리면? | 생각 열기
* 🧴 스프레이 :: 계속 뿌리면 통이 차가워진다
* 🚲 자전거 펌프 :: 빠르게 펌프질하면 펌프가 뜨거워진다
* ⛰️ 산을 넘는 공기 :: 올라가며 식어 구름이 생긴다
* 🍿 팝콘 :: 열을 받은 수증기가 팽창하며 터진다
? 불을 대지도 않았는데 스프레이 통은 왜 차가워질까? :: 기체가 빠르게 **팽창하며 일을 하느라** 자신의 내부 에너지를 써서 온도가 내려간다 — 단열 팽창

= 지난 시간 복습 | 1차시 · 중3
- 마찰이 있으면 역학적 에너지 일부가 [[열에너지]]로 전환
- 공기가 상승하면 [[단열 팽창]]으로 기온이 낮아진다 (중3 날씨)
? 열과 일은 모두 에너지를 옮기는 방법이다. 기체에 열을 주면 그 에너지는 어디로 갈까? :: 기체의 **온도를 올리는 데**(내부 에너지) 쓰이거나, 기체가 **팽창하며 일을 하는 데** 쓰인다.

## 내부 에너지와 일 | 기체의 에너지

= 내부 에너지와 기체가 한 일
- **내부 에너지 U**: 물체를 구성하는 입자의 운동 에너지 + 퍼텐셜 에너지의 총합
-- 이상 기체는 ==절대 온도==에 비례 → 온도가 오르면 ΔU > 0
- **기체가 한 일 W**: 등압일 때 W = PΔV
-- 압력–부피 그래프 아래 ==넓이== = 기체가 한 일
>+ 팽창하면 W > 0 (기체가 일을 함), 압축되면 W < 0 (외부가 기체에 일을 함)

= 열역학 제1법칙
! Q = ΔU + W
- Q: 기체가 흡수한 열, ΔU: 내부 에너지 증가량, W: 기체가 외부에 한 일
>+ 열과 일까지 포함한 **에너지 보존 법칙**

= 예제 1 · 열과 일 | 적용
- 기체에 열 800 J을 가했더니 기체가 외부에 300 J의 일을 했다.
^+ ΔU = Q − W = 800 − 300 = **500 J 증가**
^+ 내부 에너지가 늘었으므로 기체의 온도는 **올라간다.**

## 네 가지 열역학 과정 | 무엇이 일정한가

= 열역학 과정 정리
| 과정 | 일정한 것 | 제1법칙 |
|+ 등압 | 압력 | Q = ΔU + PΔV |
|+ 등적 | 부피 (W = 0) | Q = [[ΔU]] |
|+ 등온 | 온도 (ΔU = 0) | Q = [[W]] |
|+ 단열 | 열 출입 없음 (Q = 0) | ΔU = [[−W]] |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#thermo | 출입 에너지 500 J로 네 과정을 각각 [실행]하고 Q, ΔU, W, 온도 변화를 기록하자.
% 각 과정의 압력–부피 그래프 모양(수평선, 수직선, 쌍곡선, 가파른 곡선)도 함께 기록

= 네 가지 과정 | 시뮬레이션 기록
| 과정 | Q (J) | ΔU (J) | W (J) | 온도 |
|+ 등압 팽창 | 500 | 300 | 200 | 상승 |
|+ 등적 가열 | 500 | [[500]] | [[0]] | 상승 |
|+ 단열 압축 | [[0]] | 500 | [[−500]] | 상승 |
|+ 등온 팽창 | 500 | [[0]] | [[500]] | 일정 |

= 압력–부피 그래프 | 넓이 = 일
C 등압 팽창과 등온 팽창 (모형) | 부피 (L) | 압력 (kPa) | 등압:10,100 15,100 20,100 | 등온:10,100 12.5,80 15,66.7 17.5,57.1 20,50
+ 등압 팽창: 수평선, 넓이 = PΔV = 100 kPa × 10 L = [[1000 J]]
+ 등온 팽창: 압력이 부피에 반비례하는 곡선 (PV = 일정)
~ 1 kPa × 1 L = 1 J

= 예제 2 · 등압 팽창 | 적용
- 압력 100 kPa로 일정하게 유지하며 기체의 부피가 10 L에서 12 L로 늘어났다. 이때 기체가 흡수한 열이 500 J이다.
^+ W = PΔV = 100 000 Pa × 0.002 m³ = **200 J**
^+ ΔU = Q − W = 500 − 200 = **300 J** (시뮬레이션 등압 팽창과 일치)
>+ 단원자 이상 기체의 등압 과정: 열의 3/5은 내부 에너지, 2/5는 일

= 예제 3 · 단열 팽창 | 적용
- 스프레이 통의 기체가 빠르게 팽창하며 외부에 200 J의 일을 했다.
^+ 빠르게 일어나 열을 받을 시간이 없다 → **Q ≈ 0**
^+ ΔU = Q − W = 0 − 200 = **−200 J**
^+ 내부 에너지 감소 → 온도 **하강** → 통이 차가워진다.

= 확인 문제 1
Q 등적 과정에서 기체에 열 300 J을 가했을 때 내부 에너지 변화량은?
o 0 J
o 150 J
o* 300 J
o −300 J
:: 부피 변화가 없어 W = 0 → ΔU = Q = 300 J

= 확인 문제 2
Q 등온 팽창에 대한 설명으로 옳은 것은?
o 내부 에너지가 증가한다
o 기체가 열을 방출한다
o* 흡수한 열이 모두 외부에 한 일로 쓰인다
o 기체가 한 일은 0이다
:: 온도가 일정하므로 ΔU = 0 → Q = W

= 확인 문제 3
Q 단열 압축할 때 기체의 온도 변화와 까닭으로 옳은 것은?
o 내려간다 — 기체가 일을 해서
o* 올라간다 — 외부가 기체에 일을 해 내부 에너지가 증가해서
o 변하지 않는다 — 열 출입이 없어서
o 내려간다 — 열을 방출해서
:: Q = 0, W < 0 → ΔU = −W > 0

= 확인 문제 4
Q 기체가 열 600 J을 흡수하고 내부 에너지가 400 J 증가했다. 기체가 외부에 한 일은?
o 1000 J
o* 200 J
o 400 J
o −200 J
:: W = Q − ΔU = 600 − 400 = 200 J

= 확인 문제 5
Q 압력 200 kPa로 일정하게 부피가 3 L 늘어났을 때 기체가 한 일은?
o 60 J
o* 600 J
o 6000 J
o 0.6 J
:: W = 200 000 Pa × 0.003 m³ = 600 J

= 생활 속 열역학 제1법칙 | 사례
* 🧴 스프레이 :: 단열 팽창으로 차가워진다
* 🚲 자전거 펌프 :: 단열 압축으로 뜨거워진다
* ☁️ 구름 :: 상승 공기의 단열 팽창 → 이슬점 도달
* 🔥 디젤 엔진 :: 공기를 강하게 단열 압축해 연료를 저절로 점화
* 🍾 샴페인 뚜껑 :: 열 때 병 입구에 하얀 김이 생긴다
* 🌡️ 압력솥 :: 부피가 일정한 채 가열(등적에 가까움)

= 서술형 도전 | 생각 넓히기
? 스프레이를 오래 뿌리면 통이 차가워지는 까닭을 단열 팽창으로 설명하시오. :: 기체가 빠르게 팽창하며 외부에 일을 하는데(W > 0) 열을 받을 시간이 없어(Q ≈ 0), ΔU = −W < 0이 되어 내부 에너지와 온도가 낮아진다.
? 높은 산을 넘는 공기가 상승할 때 구름이 생기는 까닭을 열역학 제1법칙과 연결하시오. :: 상승하는 공기는 기압이 낮아져 단열 팽창하고, 내부 에너지가 줄어 온도가 이슬점 이하로 내려가 수증기가 응결하기 때문이다.

= 오늘 배운 내용 정리
- 이상 기체의 내부 에너지는 [[절대 온도]]에 비례
- 기체가 한 일 = PΔV = 압력–부피 그래프 아래 [[넓이]]
- 열역학 제1법칙: Q = [[ΔU + W]]
- 등적: Q = ΔU / 등온: Q = [[W]] / 단열: ΔU = [[−W]]

= 나가기 전 한 문제 | 형성평가
? 단열된 실린더 속 기체를 피스톤으로 압축하며 외부에서 150 J의 일을 해 주었다. Q, W, ΔU를 쓰고 온도 변화를 설명하시오. :: Q = 0, W = −150 J(기체가 일을 받음), ΔU = Q − W = 150 J → 내부 에너지가 증가하여 온도가 올라간다.
