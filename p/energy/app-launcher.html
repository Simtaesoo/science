<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용수철 발사대 · 고2 물리학 에너지와 열</title>
<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/app.js"></script>
<script src="../../assets/hskit.js"></script>
</head>
<body>
<script>
const app = AppKit({
  id: 'plauncher', title: '용수철 발사대', unit: '고2 · 물리학 · 38 에너지와 열', back: '../../index.html#phys', sim: 'sim.html#mech',
  lead: '용수철을 압축해 나무 도막을 쏘아 올리세요. 경사면의 <b>깃발 높이에서 정확히 멈추게</b> 하는 것이 미션! 탄성 퍼텐셜 에너지가 운동 에너지, 중력 퍼텐셜 에너지, 열로 바뀌는 과정을 계산하세요. 마지막엔 열기관 문제도 있어요.',
  howto: ['<b>압축 길이 x</b>를 정하고 <b>[발사]</b>를 누르세요.', '도막이 멈춘 높이가 깃발과 <b>±5 cm</b> 안이면 성공! (g = 9.8 m/s², 경사면은 마찰 없음)', '갈색 구간은 마찰이 있는 바닥이에요. 마찰로 역학적 에너지 일부가 열에너지로 바뀌어요.'],
  recap: '<b>역학적 에너지 보존</b>: 마찰이 없으면 ½kx² = ½mv² = mgh — 탄성 퍼텐셜 에너지가 운동 에너지를 거쳐 중력 퍼텐셜 에너지로 전환된다. 마찰이 있으면 마찰력이 한 일(μmg × 거리)만큼 역학적 에너지가 <b>열에너지</b>로 바뀐다: ½kx² = mgh + μmgd. <b>열역학 제1법칙</b>: Q = ΔU + W (기체가 받은 열 = 내부 에너지 증가 + 외부에 한 일). <b>열효율</b> e = W / Q흡수 = 1 − Q방출 / Q흡수 — 열기관은 흡수한 열의 일부를 반드시 방출하므로 효율이 100 %가 될 수 없다(열역학 제2법칙).',
  startLabel: '발사 준비'
});
const {S, sfx, toast} = app, D = Draw;
const G = 9.8, RAMP = Math.PI / 6;
const LV = [
  {k: 200, m: 1, h: 1, mu: 0, d: 0, why: '½ × 200 × x² = 1 × 9.8 × 1 → x ≈ 0.31 m. 용수철에 저장된 9.8 J이 모두 중력 퍼텐셜 에너지가 되었어요.'},
  {k: 400, m: 2, h: 1.5, mu: 0, d: 0, why: '½ × 400 × x² = 2 × 9.8 × 1.5 = 29.4 J → x ≈ 0.38 m. 질량이 크면 더 많이 압축해야 해요.'},
  {k: 200, m: 1, h: .8, mu: .2, d: 2, why: '½kx² = mgh + μmgd = 7.84 + 3.92 = 11.76 J → x ≈ 0.34 m. 3.92 J은 마찰로 열이 되었어요.'},
  {k: 300, m: 1.5, h: 1.2, mu: .3, d: 1.5, why: '½ × 300 × x² = 1.5 × 9.8 × 1.2 + 0.3 × 1.5 × 9.8 × 1.5 = 17.64 + 6.62 = 24.26 J → x ≈ 0.40 m.'},
  {t: 'quiz', q: '기체가 열 500 J을 흡수하고 외부에 200 J의 일을 했다. 기체의 내부 에너지 변화는?', ch: ['700 J 증가', '300 J 증가', '300 J 감소', '변화 없음'], a: 1, why: 'Q = ΔU + W → 500 = ΔU + 200 → ΔU = 300 J 증가 (온도 상승).'},
  {t: 'quiz', q: '어떤 열기관이 한 순환에서 1000 J을 흡수하고 750 J을 방출한다. 열효율은?', ch: ['75 %', '25 %', '57 %', '100 %'], a: 1, why: 'W = 1000 − 750 = 250 J, e = 250 ÷ 1000 = 25 %. 방출하는 열이 0이 될 수 없어 효율 100 %는 불가능해요.'}];
let ui = {}, X, b = null;
const k = HS(app, {levels: LV, load(L){ b = null; const q = L.t === 'quiz'; ui.c.parentElement.style.display = q ? 'none' : ''; ui.b.parentElement.style.display = q ? 'none' : ''; ui.q.parentElement.style.display = q ? '' : 'none';
  if (q) { k.mission(ui.g, '열과 일 문제'); app.quiz(ui.q, L.q, L.ch, L.a, {explain: L.why, onWrong: () => { k.fails++; app.addScore(-10); }, onRight: () => k.win(ui.g, '')}); return; }
  k.mission(ui.g, `용수철 상수 <b>${L.k} N/m</b>, 도막 <b>${L.m} kg</b><br>깃발 높이 <b>${L.h} m</b>에서 멈추게 하세요.${L.mu ? `<br>마찰 구간 ${L.d} m (운동 마찰 계수 ${L.mu})` : ''}`); X.set(.2); info(); }});
function info(){ const L = k.L(); if (!L || L.t) return; b = null; ui.e.innerHTML = `저장된 탄성 퍼텐셜 에너지 <b>${(.5 * L.k * X.v * X.v).toFixed(2)} J</b>`; }
app.onStart = () => { ui.g = app.panel('미션'); ui.q = app.panel(''); ui.c = app.panel('용수철');
  X = k.slider(ui.c, {label: '압축 길이 x', min: 0, max: .6, step: .005, val: .2, fmt: v => v.toFixed(3) + ' m', on: info}); ui.e = document.createElement('p'); ui.e.className = 'note-c'; ui.c.appendChild(ui.e);
  ui.b = app.panel(''); k.btn(ui.b, '🚀 발사', () => { const L = k.L(); b = {s: 0, E0: .5 * L.k * X.v * X.v, heat: 0, v: X.v * Math.sqrt(L.k / L.m), stop: false, peak: 0}; sfx.whoosh(); });
  k.begin(); };
// 경로: 바닥 0~4 m (마찰 구간 1 ~ 1+d), 그 뒤 30° 경사면
const FLOOR = 4.5;
function yOf(s){ return s <= FLOOR ? 0 : (s - FLOOR) * Math.sin(RAMP); }
app.step = dt => { const L = k.L(); if (!b || b.stop || !L || L.t) return;
  for (let i = 0; i < 20; i++) { const h = dt / 20; const fr = L.mu && b.s > 1 && b.s < 1 + L.d ? L.mu * L.m * G : 0;
    const ds = b.v * h; b.s += ds; b.heat += fr * Math.abs(ds); const KE = b.E0 - L.m * G * yOf(b.s) - b.heat;
    if (KE <= 0) { b.stop = true; b.peak = yOf(b.s); break; } b.v = Math.sqrt(2 * KE / L.m); }
  if (b.stop) { const err = Math.abs(b.peak - L.h); if (b.s <= FLOOR) k.fail('경사면에 닿기도 전에 멈췄어요! 마찰에 쓰인 에너지를 계산했나요?'); else if (err <= .05) k.win(ui.g, L.why, `${b.peak.toFixed(2)} m`); else k.fail(`${b.peak.toFixed(2)} m에서 멈췄어요 — 목표 ${L.h} m`); } };
k.draw((g, W, H) => { const L = k.L(); g.fillStyle = '#eef1f6'; g.fillRect(0, 0, W, H);
  if (L.t) { D.text(g, L.a === 1 && L.q.includes('효율') ? '🔥 → ⚙️ → ❄️' : '🔥 → 🎈', W / 2, H / 2, {size: Math.min(W, H) * .12}); return; }
  const sc = Math.min((W - 60) / 9, (H * .62) / 2.4), ox = 40, gy = H * .66, P = s => s <= FLOOR ? [ox + s * sc, gy] : [ox + (FLOOR + (s - FLOOR) * Math.cos(RAMP)) * sc, gy - (s - FLOOR) * Math.sin(RAMP) * sc];
  g.fillStyle = '#c9cfd8'; g.beginPath(); g.moveTo(0, gy); g.lineTo(P(FLOOR)[0], gy); const end = P(FLOOR + 2.5 / Math.sin(RAMP)); g.lineTo(end[0], end[1]); g.lineTo(end[0], H); g.lineTo(0, H); g.fill();
  if (L.mu) { g.fillStyle = '#a07850'; g.fillRect(ox + sc, gy - 3, L.d * sc, 6); D.text(g, `마찰 μ = ${L.mu}`, ox + (1 + L.d / 2) * sc, gy + 16, {size: 11, weight: 700, color: '#6b4a2a'}); }
  for (let h = .5; h <= 2.01; h += .5) { const s = FLOOR + h / Math.sin(RAMP), [x, y] = P(s); g.strokeStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.moveTo(P(FLOOR)[0], y); g.lineTo(x + 30, y); g.stroke(); D.text(g, h + ' m', x + 34, y, {size: 10.5, color: '#55606e', align: 'left'}); }
  const [fx, fy] = P(FLOOR + L.h / Math.sin(RAMP)); g.strokeStyle = '#333'; g.lineWidth = 2; g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx, fy - 34); g.stroke(); g.fillStyle = '#d0533f'; g.beginPath(); g.moveTo(fx, fy - 34); g.lineTo(fx + 20, fy - 28); g.lineTo(fx, fy - 22); g.fill(); D.text(g, `${L.h} m`, fx + 6, fy - 44, {size: 12, weight: 700, color: '#d0533f'});
  // 용수철과 도막
  const comp = b ? 0 : X.v, bs = b ? b.s : -comp, [bx, by] = P(Math.max(0, bs)), wall = ox - 26, sx1 = b ? ox : ox - comp * sc;
  g.fillStyle = '#55606e'; g.fillRect(wall - 8, gy - 50, 8, 50); g.strokeStyle = '#2f6fd0'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(wall, gy - 14); const n = 10; for (let i = 1; i <= n; i++) g.lineTo(wall + (sx1 - wall) * i / n, gy - 14 + (i % 2 ? -8 : 8) * (i < n ? 1 : 0)); g.stroke();
  const bxx = b ? bx : ox - comp * sc + 14, byy = b ? by : gy; g.save(); g.translate(bxx, byy); if (b && b.s > FLOOR) g.rotate(-RAMP); g.fillStyle = '#c0762b'; g.fillRect(-14, -26, 28, 26); g.restore();
  // 에너지 막대
  const E0 = b ? b.E0 : .5 * L.k * X.v * X.v, KE = b ? .5 * L.m * b.v * b.v * (b.stop ? 0 : 1) : 0, PE = b ? L.m * G * yOf(b.s) : 0, EL = b ? 0 : E0, HT = b ? b.heat : 0, mx = Math.max(E0, 1), bw = W * .2;
  [['탄성 퍼텐셜', EL, '#2f6fd0'], ['운동', KE, '#f0a500'], ['중력 퍼텐셜', PE, '#2f8a55'], ['열', HT, '#d0533f']].forEach(([n2, v, c], i) => { const y = 22 + i * 18; D.text(g, n2, 20, y, {size: 11.5, align: 'left', weight: 700, color: c}); g.fillStyle = c; g.fillRect(100, y - 6, Math.max(1, v / mx * bw), 12); D.text(g, v.toFixed(2) + ' J', 106 + v / mx * bw, y, {size: 11, align: 'left'}); });
  if (b && b.stop) D.text(g, `멈춘 높이 ${b.peak.toFixed(2)} m`, W * .7, 30, {size: 16, weight: 700, color: '#1d3a58'});
});
</script>
</body>
</html>
