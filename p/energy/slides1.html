# 역학적 에너지 보존 | 탄성·중력 퍼텐셜과 운동 에너지 | 고등학교 물리학 · 02 에너지와 열 · 1차시 | 2022 개정 교육과정 [12물리01-04]

= 오늘의 학습 목표 | 1차시
^ **일–운동 에너지 정리**를 설명하고 적용할 수 있다.
^ **중력 퍼텐셜 에너지**와 **탄성 퍼텐셜 에너지**를 계산할 수 있다.
^ **역학적 에너지 보존**과 마찰에 의한 손실을 이용해 운동을 분석할 수 있다.
% 흐름: 생각 열기 5분 → 일–운동 에너지 정리 8분 → 퍼텐셜 에너지 7분 → 용수철 발사대(시뮬레이션) 12분 → 계산·문항 13분

= 번지 점프의 에너지 장부 | 생각 열기
* 🪂 뛰어내리는 순간 :: 높이가 크다 → 중력 퍼텐셜 에너지 최대
* ⬇️ 떨어지는 동안 :: 점점 빨라진다 → 운동 에너지 증가
* 🪢 줄이 늘어날 때 :: 줄이 팽팽해지며 속력이 줄어든다
* 🔄 가장 낮은 지점 :: 잠깐 멈췄다가 다시 튀어 오른다
? 가장 낮은 지점에서 사람의 에너지는 어디로 갔을까? :: 줄의 **탄성 퍼텐셜 에너지**로 저장되었다. 그 에너지로 다시 튀어 오른다.

= 이전에 배운 내용 떠올리기 | 복습
| 에너지 | 식 | 배운 곳 |
| 위치 에너지 | 9.8 × m × h | 중3 |
| 운동 에너지 | ½mv² | 중3 |
| 일 | 힘 × 이동 거리 | 중3 |
? 높이 5 m에서 미끄러져 내려온 물체의 바닥 속력은? (마찰 무시) :: mgh = ½mv² → v = √(2gh) = √98 ≈ 9.9 m/s

## 일과 에너지 | 일–운동 에너지 정리

= 일–운동 에너지 정리
! 알짜힘이 한 일 = 운동 에너지의 변화량
- W = Fs, 운동 에너지 E_k = ½mv²
- 알짜힘이 운동 방향으로 일을 하면 운동 에너지 **증가**, 반대 방향이면 **감소**
>+ 일은 에너지를 **옮기는** 방법이다.

= 예제 1 · 일과 속력 | 적용
- 마찰 없는 면에서 정지한 2 kg 물체를 10 N으로 5 m 밀었다.
^+ 알짜힘이 한 일 = 10 × 5 = **50 J**
^+ 운동 에너지 변화 = 50 J → ½ × 2 × v² = 50
^+ v² = 50 → v ≈ **7.1 m/s**

= 퍼텐셜 에너지
| 종류 | 식 | 기준 |
|+ 중력 퍼텐셜 에너지 | [[mgh]] | 기준면으로부터의 높이 h |
|+ 탄성 퍼텐셜 에너지 | [[½kx²]] | 용수철이 늘어나거나 줄어든 길이 x |
- k: 용수철 상수 (N/m) — 용수철을 1 m 늘이는 데 필요한 힘
>+ 탄성 퍼텐셜 에너지는 변형 길이의 **제곱**에 비례

## 역학적 에너지 보존 | 바뀌어도 합은 일정

= 역학적 에너지 보존 법칙
! 운동 에너지 + 퍼텐셜 에너지 = 일정 (마찰·공기 저항이 없을 때)
- 마찰이 있으면 역학적 에너지의 일부가 ==열에너지==로 전환
- **감소한 역학적 에너지 = 마찰력이 한 일**의 크기

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#mech | 용수철 상수 400 N/m, 질량 1 kg에서 압축 거리를 바꾸며 최고 높이를 기록하자. 마찰 구간도 켜 보자.
% 압축 거리 2배 → 최고 높이 4배를 예측하게 한 뒤 확인

= 용수철 발사대 | 시뮬레이션 기록
| 압축 거리 (m) | 0.1 | 0.2 | 0.3 | 0.4 |
|+ 탄성 퍼텐셜 에너지 (J) | 2.0 | [[8.0]] | [[18.0]] | [[32.0]] |
|+ 최고 높이 (m) | 0.204 | [[0.816]] | [[1.837]] | [[3.265]] |
- 압축 거리 2배 → 에너지와 최고 높이 [[4]]배

= 그래프로 보면 | 압축 거리와 최고 높이
C 압축 거리에 따른 최고 높이 (k = 400 N/m, 1 kg) | 압축 거리 (m) | 최고 높이 (m) | 최고 높이:0,0 0.1,0.204 0.2,0.816 0.3,1.837 0.4,3.265
~ ½kx² = mgh → h = kx² ÷ 2mg — 압축 거리의 제곱에 비례하는 포물선

= 예제 2 · 수평면에서의 속력 | 적용
- 압축 0.3 m에서 발사했다. 수평면을 지나는 순간의 속력은? (마찰 없음)
^+ 탄성 퍼텐셜 에너지 = ½ × 400 × 0.3² = **18 J**
^+ 모두 운동 에너지로: ½ × 1 × v² = 18
^+ v² = 36 → v = **6 m/s**

= 예제 3 · 마찰 구간을 지나면 | 적용
- 압축 0.3 m로 발사한 물체가 마찰 계수 0.2인 1 m 구간을 지난 뒤 경사면을 오른다.
^+ 마찰로 잃는 에너지 = 0.2 × 1 × 9.8 × 1 = **1.96 J**
^+ 남은 역학적 에너지 = 18 − 1.96 = **16.04 J**
^+ mgh = 16.04 → h = 16.04 ÷ 9.8 ≈ **1.64 m** (마찰 없을 때 1.84 m)

= 확인 문제 1
Q 알짜힘이 물체에 한 일과 같은 것은?
o 퍼텐셜 에너지
o* 운동 에너지의 변화량
o 역학적 에너지
o 열에너지
:: 일–운동 에너지 정리

= 확인 문제 2
Q 용수철 상수 200 N/m인 용수철을 0.2 m 압축했을 때 탄성 퍼텐셜 에너지는?
o 2 J
o* 4 J
o 20 J
o 40 J
:: ½ × 200 × 0.2² = 4 J

= 확인 문제 3
Q 압축 거리를 3배로 하면 최고 높이는 몇 배가 되는가? (마찰 없음)
o 3배
o 6배
o* 9배
o 27배
:: 탄성 퍼텐셜 에너지 ∝ x² → 9배, 최고 높이도 9배

= 확인 문제 4
Q 높이 20 m에서 정지 상태로 미끄러져 내려온 2 kg 물체의 바닥 속력이 18 m/s였다. 마찰로 잃은 에너지는? (g = 9.8 m/s²)
o 0 J
o* 68 J
o 324 J
o 392 J
:: 처음 392 J − 나중 ½ × 2 × 18² = 324 J → 68 J

= 확인 문제 5
Q 마찰이 없는 진자에서 운동 에너지가 최대인 지점은?
o 가장 높은 양 끝
o* 가장 낮은 지점
o 높이의 절반 지점
o 모든 지점에서 같다
:: 퍼텐셜 에너지가 최소인 곳에서 운동 에너지가 최대이다.

= 생활 속 역학적 에너지 | 사례
* 🪂 번지 점프 :: 중력 퍼텐셜 → 운동 → 탄성 퍼텐셜
* 🏹 활 :: 당긴 활의 탄성 퍼텐셜 → 화살의 운동 에너지
* 🎢 롤러코스터 :: 첫 언덕의 높이가 이후 운동의 에너지 예산
* 🤸 장대높이뛰기 :: 달리기의 운동 → 장대의 탄성 → 높이
* 🚗 회생 제동 :: 운동 에너지를 열 대신 전기로 저장
* ⛳ 골프채 :: 헤드의 운동 에너지가 공으로

= 서술형 도전 | 생각 넓히기
? 번지 점프에서 줄이 늘어나는 동안 에너지가 어떻게 전환되는지 단계별로 쓰시오. :: 떨어지는 동안 중력 퍼텐셜 → 운동 에너지, 줄이 늘어나면서 운동 에너지와 중력 퍼텐셜 에너지 → 탄성 퍼텐셜 에너지로 전환되고, 가장 낮은 지점에서 속력 0, 탄성 퍼텐셜 에너지 최대가 된다. 공기 저항과 줄의 마찰로 일부는 열로 바뀐다.
? 마찰이 있을 때도 '에너지 보존 법칙'은 성립하는지 쓰시오. :: 성립한다. 역학적 에너지는 줄어들지만 줄어든 만큼 열에너지 등으로 전환되어 전체 에너지는 보존된다.

- 알짜힘이 한 일 = [[운동 에너지의 변화량]]
- 중력 퍼텐셜 에너지 = [[mgh]], 탄성 퍼텐셜 에너지 = [[½kx²]]

- 마찰이 있으면 감소한 역학적 에너지 = [[마찰력이 한 일]] → 열

= 나가기 전 한 문제 | 형성평가
? 용수철 상수 400 N/m인 용수철을 0.2 m 압축해 1 kg 물체를 발사했다. 마찰이 없을 때 물체가 올라가는 최고 높이와 수평면에서의 속력을 구하시오. :: 탄성 퍼텐셜 에너지 = ½ × 400 × 0.04 = 8 J → h = 8 ÷ 9.8 ≈ 0.816 m, ½ × 1 × v² = 8 → v = 4 m/s
