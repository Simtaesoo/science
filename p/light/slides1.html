# 굴절과 전반사 | 스넬 법칙과 광섬유 | 고등학교 물리학 · 04 빛과 물질 · 1차시 | 2022 개정 교육과정 [물리학 Ⅲ]

= 오늘의 학습 목표 | 1차시
^ **굴절률**의 뜻을 알고 **스넬 법칙**으로 굴절각을 구할 수 있다.
^ **전반사**가 일어나는 조건과 **임계각**을 구할 수 있다.
^ 광섬유, 내시경 등 전반사의 **활용**을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 굴절률·스넬 법칙 10분 → 유리에서 공기로(시뮬레이션) 12분 → 전반사·임계각 10분 → 문항 8분

= 빛이 유리관 속에 갇힌다? | 생각 열기
* 🌐 광섬유 인터넷 :: 머리카락 굵기의 유리 실로 빛 신호가 바다를 건넌다
* 🏥 내시경 :: 휘어진 관으로 몸속을 본다
* 💎 다이아몬드 :: 유난히 반짝인다
* 🐟 물속 물고기 :: 실제보다 얕은 곳에 있는 것처럼 보인다
? 휘어진 광섬유 속에서 빛이 밖으로 새지 않는 까닭은? :: 빛이 경계면에서 **모두 반사(전반사)**되며 갇혀서 진행하기 때문이다.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 빛의 반사 | 입사각 = 반사각 |
| 빛의 굴절 | 다른 매질로 들어갈 때 경계면에서 꺾임 |
| 빛의 속력 | 진공에서 약 3 × 10⁸ m/s |
? 빛이 공기에서 물로 비스듬히 들어가면 법선 쪽으로 꺾일까, 멀어질까? :: 법선 **쪽으로** 꺾인다 — 물속에서 빛이 더 느리기 때문이다.

## 굴절 | 스넬 법칙

= 굴절률과 스넬 법칙
! n = c/v (진공에서의 빛의 속력 ÷ 매질에서의 속력)
- 굴절률이 클수록 빛의 속력은 ==느리다.==
! 스넬 법칙: n₁sinθ₁ = n₂sinθ₂
| 매질 | 공기 | 물 | 유리 | 다이아몬드 |
|+ 굴절률 | 1.00 | 1.33 | 1.5 | 2.42 |

= 예제 1 · 공기에서 물로 | 적용
- 공기에서 물(n = 1.33)로 입사각 53°로 빛이 들어간다. (sin 53° = 0.8)
^+ 1 × 0.8 = 1.33 × sinθ₂
^+ sinθ₂ = 0.8 ÷ 1.33 ≈ **0.6**
^+ θ₂ ≈ **37°** → 입사각보다 작다 (법선 쪽으로 꺾임)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#refract | 처음 매질 유리, 나중 매질 공기로 두고 입사각을 바꾸며 굴절각을 기록하자. 다이아몬드로도 바꾸어 보자.
% 입사각을 1°씩 올리며 굴절광이 사라지는 순간(임계각)을 찾게 하기

= 유리에서 공기로 | 시뮬레이션 기록
| 입사각 | 20° | 30° | 40° | 50° |
|+ 굴절각 | 30.9° | [[48.6°]] | [[74.6°]] | [[전반사]] |
||
C 유리(n = 1.5) → 공기 입사각과 굴절각 | 입사각 (°) | 굴절각 (°) | 굴절각:0,0 10,15.1 20,30.9 30,48.6 40,74.6 41.8,90
- 유리 → 공기 임계각: [[41.8°]], 다이아몬드 → 공기: [[24.4°]]

## 전반사 | 경계면이 거울이 된다

= 전반사
! 전반사: 빛이 모두 반사되는 현상
- 조건 ① 굴절률이 **큰** 매질 → **작은** 매질로 진행
- 조건 ② 입사각이 **임계각**보다 클 때
! 임계각: sinθc = n₂/n₁
>+ 굴절률 차이가 클수록 임계각이 **작아** 전반사가 잘 일어난다.

= 예제 2 · 임계각 구하기 | 적용
- 유리(n = 1.5)에서 공기(n = 1)로 나갈 때:
^+ sinθc = 1 ÷ 1.5 ≈ 0.667 → θc ≈ **41.8°**
- 다이아몬드(n = 2.42)에서 공기로 나갈 때:
^+ sinθc = 1 ÷ 2.42 ≈ 0.413 → θc ≈ **24.4°**
>+ 다이아몬드는 임계각이 작아 안으로 들어온 빛이 여러 번 전반사 → 반짝임

= 예제 3 · 광섬유 | 적용
- 광섬유는 굴절률이 큰 **코어**를 굴절률이 작은 **클래딩**이 감싸고 있다.
^+ 빛이 코어(큰 n) → 클래딩(작은 n)으로 진행 → 전반사 조건 ①
^+ 코어 벽에 임계각보다 큰 각으로 부딪힌다 → 전반사 조건 ②
^+ 빛이 코어 안에 **갇힌 채** 먼 거리를 진행한다.

= 확인 문제 1
Q 굴절률에 대한 설명으로 옳은 것은?
o 굴절률이 클수록 빛이 빠르다
o* 굴절률이 클수록 빛이 느리다
o 진공의 굴절률은 0이다
o 굴절률은 빛의 속력과 관계없다
:: n = c/v → v가 작을수록 n이 크다.

= 확인 문제 2
Q 전반사가 일어나는 경우는?
o 공기 → 물, 입사각 60°
o 공기 → 유리, 입사각 50°
o* 유리 → 공기, 입사각 50°
o 유리 → 공기, 입사각 30°
:: 굴절률이 큰 매질에서 작은 매질로, 입사각(50°)이 임계각(41.8°)보다 커야 한다.

= 확인 문제 3
Q 굴절률 2인 매질에서 공기로 진행할 때 임계각은?
o 15°
o* 30°
o 45°
o 60°
:: sinθc = 1/2 → θc = 30°

= 확인 문제 4
Q 광섬유에서 코어와 클래딩의 굴절률 관계로 옳은 것은?
o* 코어 > 클래딩
o 코어 < 클래딩
o 코어 = 클래딩
o 관계없다
:: 굴절률이 큰 곳에서 작은 곳으로 갈 때만 전반사가 일어난다.

= 확인 문제 5
Q 공기에서 굴절률 √2인 매질로 입사각 45°로 들어갈 때 굴절각은? (sin 45° = √2/2)
o 15°
o* 30°
o 45°
o 60°
:: 1 × √2/2 = √2 × sinθ → sinθ = 1/2 → 30°

= 생활 속 굴절과 전반사 | 사례
* 🌐 광섬유 통신 :: 전반사로 빛 신호를 멀리 보낸다
* 🏥 내시경 :: 광섬유 다발로 몸속 영상을 전달
* 🔭 쌍안경 프리즘 :: 전반사로 빛의 경로를 꺾는다
* 💎 다이아몬드 :: 작은 임계각으로 여러 번 전반사
* 🏜️ 신기루 :: 뜨거운 지면 근처 공기의 굴절률 차이
* 🐟 얕아 보이는 물 :: 굴절된 빛의 연장선에 상이 보인다

= 서술형 도전 | 생각 넓히기
? 물속 깊이 있는 물고기가 실제보다 얕아 보이는 까닭을 굴절로 설명하시오. :: 물고기에서 나온 빛이 물에서 공기로 나올 때 법선에서 멀어지게 굴절되는데, 눈은 빛이 직진한 것으로 인식해 굴절된 빛의 연장선 위(더 얕은 곳)에 상이 보인다.
? 광섬유에서 코어의 굴절률이 클래딩보다 커야 하는 까닭을 쓰시오. :: 굴절률이 큰 곳에서 작은 곳으로 진행할 때만 전반사가 일어나므로, 코어의 굴절률이 커야 빛이 코어 안에 갇혀 진행할 수 있다.

= 오늘 배운 내용 정리
- 굴절률 n = [[c/v]], 클수록 빛이 [[느리다]].
- 스넬 법칙: [[n₁sinθ₁ = n₂sinθ₂]]
- 전반사 조건: 굴절률이 [[큰]] 매질 → 작은 매질, 입사각 > [[임계각]]
- 임계각: sinθc = [[n₂/n₁]] (유리 → 공기 41.8°)
- 활용: [[광섬유]], 내시경, 쌍안경 프리즘

= 나가기 전 한 문제 | 형성평가
? 굴절률 1.5인 코어와 1.2인 클래딩으로 된 광섬유에서 전반사가 일어나는 임계각의 사인값을 구하고, 전반사 조건을 쓰시오. :: sinθc = 1.2 ÷ 1.5 = 0.8 (θc ≈ 53°) → 코어에서 클래딩으로 향하는 빛의 입사각이 약 53°보다 커야 전반사가 일어난다.
