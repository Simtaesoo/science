# 광전 효과 | 빛의 입자성 | 고등학교 물리학 · 04 빛과 물질 · 3차시 | 2022 개정 교육과정 [물리학 Ⅲ]

= 오늘의 학습 목표 | 3차시
^ **광전 효과** 실험 결과를 설명할 수 있다.
^ **광자**와 **일함수**로 광전자의 최대 운동 에너지를 계산할 수 있다.
^ 빛이 **파동성과 입자성**을 함께 가짐을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 광전 효과 8분 → 광자 이론 8분 → 나트륨판(시뮬레이션) 12분 → 계산·문항 12분

= 센 빨간빛 vs 약한 자외선 | 생각 열기
* 🔴 아주 센 빨간빛 :: 금속판에 오래 비추어도 전자가 나오지 않는다
* 🟣 약한 자외선 :: 비추자마자 전자가 튀어나온다
* 📷 디지털카메라 :: 빛을 전기 신호로 바꾼다
* 🚪 자동문 센서 :: 빛이 가려지면 전류가 끊긴다
? 빛이 파동이라면 센 빛일수록 에너지가 크니 전자가 나와야 하지 않을까? :: 실험 결과는 반대 — 빛의 '세기'가 아니라 '**진동수(색)**'가 전자를 떼어 낼지를 결정한다. 빛이 **알갱이(광자)**로 에너지를 전달하기 때문이다.

= 지난 시간 복습 | 2차시 · 전기와 자기
- 이중 슬릿 간섭무늬 → 빛의 [[파동성]]
- 광자 에너지 E = hf = hc/λ, λ(nm) = [[1240]] ÷ E(eV) (전기와 자기 2차시)
? 원자에서 전자를 떼어 내려면 에너지가 필요했다(이온화 에너지). 금속에서도 그럴까? :: 그렇다. 금속에서 전자를 떼어 내는 최소 에너지를 **일함수**라 한다.

## 광전 효과 | 빛이 전자를 떼어 낸다

= 광전 효과
! 광전 효과: 금속에 빛을 비출 때 전자가 튀어나오는 현상 (튀어나온 전자: 광전자)
| 실험 결과 | 파동설로 설명? |
|+ 문턱 진동수보다 작은 빛은 아무리 세도 전자가 안 나온다 | ✘ |
|+ 문턱 진동수보다 큰 빛은 약해도 즉시 나온다 | ✘ |
|+ 빛의 세기 ↑ → 광전자 수 ↑, 최대 운동 에너지는 그대로 | ✘ |
|+ 진동수 ↑ → 최대 운동 에너지 ↑ | ✘ |

= 아인슈타인의 광자 이론
! 광자 하나의 에너지 E = hf
- 빛은 에너지 hf를 가진 알갱이(**광자**)의 흐름
- 광자 1개가 전자 1개에게 에너지를 **한 번에** 준다.
! 광전자의 최대 운동 에너지: Eₖ = hf − W
- W: 일함수, hf < W이면 전자가 나오지 않는다 → **문턱 진동수** f₀ = W/h
>+ 빛의 세기 = 광자의 **수** → 세기를 키우면 광전자 수만 늘어난다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#photo | 나트륨판(일함수 2.3 eV)에 비추는 빛의 파장을 바꾸며 광전자의 최대 운동 에너지를 기록하자. 빛의 세기도 바꾸어 보자.
% 600 nm에서 세기를 최대로 올려도 전자가 나오지 않는 것을 꼭 확인

= 나트륨판 | 시뮬레이션 기록
| 파장 (nm) | 250 | 400 | 500 | 600 |
|+ 광자 에너지 (eV) | 4.96 | [[3.10]] | [[2.48]] | [[2.07]] |
|+ Eₖ 최대 (eV) | 2.66 | [[0.80]] | [[0.18]] | [[방출 없음]] |
- 나트륨에서 광전자가 나오는 최대 파장 = 1240 ÷ 2.3 ≈ [[539 nm]]

= 그래프로 보면 | 직선 관계
C 광자 에너지와 광전자의 최대 운동 에너지 (나트륨, W = 2.3 eV) | 광자 에너지 (eV) | 최대 운동 에너지 (eV) | 최대 운동 에너지:2.07,0 2.3,0 2.48,0.18 3.1,0.8 4.96,2.66
- 기울기 = 1 (진동수로 그리면 기울기 = [[플랑크 상수 h]])
- 가로축 절편 = [[일함수]] (진동수로 그리면 문턱 진동수)

= 예제 1 · 아연판 | 적용
- 일함수 4.3 eV인 아연판에 파장 200 nm의 자외선을 비춘다.
^+ hf = 1240 ÷ 200 = **6.2 eV**
^+ Eₖ = 6.2 − 4.3 = **1.9 eV**
^+ 가시광선(최대 약 3.3 eV)으로는 아연에서 광전자가 **나오지 않는다.**

= 예제 2 · 문턱 파장 | 적용
- 일함수 2.0 eV인 금속의 문턱 파장은?
^+ hf₀ = W → hc/λ₀ = 2.0 eV
^+ λ₀ = 1240 ÷ 2.0 = **620 nm**
^+ 620 nm보다 **짧은** 파장의 빛을 비춰야 광전자가 나온다.

= 예제 3 · 세기를 2배로 | 적용
- 400 nm 빛으로 나트륨판에서 광전자가 나오고 있다. 빛의 세기만 2배로 하면?
^+ 광자 하나의 에너지(3.10 eV)는 **그대로**
^+ 최대 운동 에너지 0.80 eV **그대로**
^+ 광자 수가 2배 → 광전자 수 **2배** → 광전류 **2배**

= 확인 문제 1
Q 광전 효과에서 광전자의 최대 운동 에너지를 크게 하는 방법은?
o 빛의 세기를 키운다
o* 진동수가 큰(파장이 짧은) 빛을 비춘다
o 빛을 오래 비춘다
o 일함수가 큰 금속을 쓴다
:: Eₖ = hf − W → 진동수가 클수록 크다.

= 확인 문제 2
Q 일함수 3.1 eV인 금속에 파장 248 nm의 빛을 비출 때 광전자의 최대 운동 에너지는?
o* 1.9 eV
o 3.1 eV
o 5.0 eV
o 8.1 eV
:: hf = 1240 ÷ 248 = 5.0 eV → Eₖ = 5.0 − 3.1 = 1.9 eV

= 확인 문제 3
Q 문턱 진동수보다 작은 진동수의 빛을 아주 세게 비추면?
o 광전자가 많이 나온다
o 광전자가 천천히 나온다
o* 광전자가 나오지 않는다
o 최대 운동 에너지가 커진다
:: 광자 하나의 에너지가 일함수보다 작아 세기와 관계없이 전자를 떼어 내지 못한다.

= 확인 문제 4
Q 진동수–최대 운동 에너지 그래프의 기울기가 뜻하는 것은?
o 일함수
o 문턱 진동수
o* 플랑크 상수
o 빛의 세기
:: Eₖ = hf − W에서 기울기는 h로 모든 금속에서 같다.

= 확인 문제 5
Q 빛의 입자성을 보여 주는 현상은?
o 이중 슬릿 간섭
o 회절
o* 광전 효과
o 비눗방울의 색
:: 광전 효과는 빛 에너지가 광자 단위로 전달됨을 보여 준다.

= 생활 속 광전 효과 | 사례
* 📷 이미지 센서 :: 화소마다 광자가 만든 전하로 밝기 측정
* 🚪 자동문·엘리베이터 센서 :: 빛이 가려지면 신호
* ☀️ 태양 전지 :: 광자가 전자–양공 쌍을 만든다
* 🌃 가로등 자동 점멸기 :: 어두워지면 켜진다
* 🔬 광전자 증배관 :: 아주 약한 빛도 검출 (중성미자 관측)
* 🧾 바코드 스캐너 :: 반사된 빛의 세기를 전기 신호로

= 서술형 도전 | 생각 넓히기
? 빛이 파동이라면 약한 빛도 오래 비추면 전자가 나와야 한다. 실제 실험 결과와 그 의미를 쓰시오. :: 문턱 진동수보다 작은 빛은 아무리 오래 비춰도 전자가 나오지 않고, 큰 빛은 약해도 즉시 나온다. 빛 에너지가 광자 단위로 전달된다는 입자성의 증거이다.
? 디지털카메라의 이미지 센서가 빛을 전기 신호로 바꾸는 원리를 광전 효과와 연결해 쓰시오. :: 각 화소에 광자가 들어오면 반도체에서 전자–양공 쌍이 생기고, 빛이 셀수록 더 많은 전자가 모인다. 모인 전하량을 측정해 화소의 밝기 정보로 바꾼다.

= 오늘 배운 내용 정리
- 금속에 빛을 비출 때 전자가 튀어나오는 현상 → [[광전 효과]]
- 광자 하나의 에너지 E = [[hf]]
- 광전자의 최대 운동 에너지 Eₖ = [[hf − W]] (W: 일함수)
- 문턱 진동수보다 작으면 세기와 관계없이 방출 [[없음]]
- 빛의 세기 ↑ → 광전자 [[수]] ↑, 최대 운동 에너지 그대로

= 나가기 전 한 문제 | 형성평가
? 일함수 2.3 eV인 나트륨판에 파장 310 nm의 빛을 비출 때 광전자의 최대 운동 에너지를 구하시오. (hc ≈ 1240 eV·nm) :: hf = 1240 ÷ 310 = 4.0 eV → Eₖ = 4.0 − 2.3 = 1.7 eV
