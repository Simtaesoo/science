# 특수 상대성 이론 | 빛의 속력은 누구에게나 같다 | 고등학교 물리학 · 04 빛과 물질 · 9차시 | 2022 개정 교육과정 [12물리03-06]

= 오늘의 학습 목표 | 9차시
^ **모든 관성계에서 빛의 속력이 같다**는 광속 불변 원리를 설명할 수 있다.
^ 광속 불변의 결과로 **시간 팽창**과 **길이 수축**이 일어남을 설명할 수 있다.
^ 상대성 이론이 과학과 사회에 미친 **영향**을 조사할 수 있다.
% 흐름: 생각 열기 5분 → 관성계와 광속 불변 10분 → 빛 시계와 시간 팽창 12분 → 길이 수축 8분 → 사회적 영향 조사 10분
% 2022 개정 [12물리03-06] 해설: 특수 상대성 이론은 광속 불변의 결과로 시간 팽창과 길이 수축이 일어나는 현상 위주로 설명하고, 동시성의 상대성과 정량적 계산(로런츠 인자 등)은 다루지 않는다.

= 빛을 쫓아가면 빛이 멈춰 보일까? | 생각 열기
* 🚂 기차 위의 공 :: 달리는 기차에서 앞으로 던진 공은 땅에서 보면 더 빠르다
* 🚀 빛을 쫓는 우주선 :: 빛의 속력에 가깝게 날며 빛을 보면?
* 🧒 16살의 아인슈타인 :: 빛과 나란히 달리는 상상을 했다
* ⚛️ 우주에서 온 뮤온 :: 금방 붕괴하는 입자가 지표까지 도달한다
? 빛의 속력에 가깝게 달리며 빛을 보면 빛이 느리게 보일까? :: 아니다. 실험 결과 빛의 속력은 관찰자가 어떻게 움직이든 **항상 같게** 측정된다.

= 이전에 배운 내용 떠올리기 | 복습 · 힘과 운동
- 일정한 속도로 움직이거나 정지한 좌표계(관성 법칙이 성립) → [[관성계]]
- 달리는 기차 안에서 공을 위로 던지면 기차 안 사람에게는 [[곧게 위아래로]] 움직인다.
? 기차 안과 땅 위에서 물리 법칙은 서로 다를까? :: 같다. 모든 관성계에서 물리 법칙은 똑같이 성립한다 → **상대성 원리**

## 특수 상대성 이론의 두 원리 | 출발점

= 특수 상대성 이론의 두 원리
^ **상대성 원리**: 모든 관성계에서 물리 법칙은 같다.
^ **광속 불변 원리**: 진공에서 빛의 속력은 광원이나 관찰자의 운동과 관계없이 모든 관성계에서 **c (약 3 × 10⁸ m/s)**로 같다.
>+ 속력이 모두에게 같다면 → 바뀌어야 하는 것은 **시간**과 **길이**다!

## 시간 팽창 | 움직이는 시계는 느리게 간다

= 빛 시계로 생각하기 | 사고 실험
^+ 우주선 안에 위아래 거울 사이를 빛이 왕복하는 **빛 시계**가 있다.
^+ 우주선 안 관찰자: 빛이 **곧게** 위아래로 왕복한다.
^+ 밖에서 본 관찰자: 우주선이 움직이므로 빛이 **비스듬히** 더 긴 경로로 왕복한다.
^+ 빛의 속력은 두 사람에게 **같으므로**, 더 긴 경로를 가는 데 **더 긴 시간**이 걸린다.
>+ 밖에서 보면 움직이는 우주선의 시간이 **느리게** 간다 → **시간 팽창**

= 길이 수축 | 움직이는 물체는 짧아진다
- 관찰자에 대해 빠르게 움직이는 물체는 **운동 방향의 길이**가 짧게 측정된다.
- 운동 방향에 수직인 길이는 변하지 않는다.
- 일상의 속력에서는 효과가 너무 작아 느낄 수 없고, 속력이 **빛의 속력에 가까울수록** 뚜렷해진다.
>+ 시간과 공간은 절대적이지 않고 관찰자의 운동에 따라 **상대적**이다.

= 예제 1 · 뮤온의 수수께끼 | 적용
- 뮤온은 대기 상층에서 만들어져 매우 짧은 시간 안에 붕괴한다. 그런데도 많은 뮤온이 지표에서 검출된다.
^+ **지표에서 보면**: 빛의 속력에 가깝게 움직이는 뮤온의 시간이 **느리게 간다**(시간 팽창) → 더 오래 살아남아 지표까지 온다.
^+ **뮤온이 보면**: 대기층의 두께가 **짧아진다**(길이 수축) → 짧은 시간에도 지표에 닿는다.
>+ 두 관점 모두 같은 결과 — 상대성 이론을 뒷받침하는 실제 관측

= 예제 2 · 누구의 시계가 느릴까? | 적용
- 빛의 속력에 가깝게 날아가는 우주선의 승무원 A와 지구의 B가 서로의 시계를 본다.
^+ B가 보기에 A의 시계가 **느리게** 간다.
^+ A가 보기에도 자신에 대해 움직이는 B의 시계가 **느리게** 간다.
^+ A는 자기 시계가 느리다고 느끼지 않는다 — 자기 관성계에서는 시간이 **정상적으로** 흐른다.

## 상대성 이론과 사회 | 조사 활동

= 상대성 이론이 사회에 미친 영향 | 사례
* 🛰️ GPS :: 위성 시계의 시간 차이를 보정하지 않으면 위치 오차가 날마다 커진다 (특수·일반 상대성 효과)
* ⚛️ 입자 가속기 :: 빛의 속력에 가까운 입자의 수명과 질량–에너지 관계를 고려해 설계
* ☢️ 질량–에너지 관계 :: 핵발전과 별의 에너지를 이해하는 바탕
* 🧠 생각의 전환 :: 절대적인 시간과 공간이라는 상식을 바꾼 과학 혁명
% 모둠별로 하나를 골라 '어떤 문제를 → 상대성 이론으로 어떻게 → 사회에 어떤 변화'로 조사·발표하게 한다.

= 확인 문제 1
Q 광속 불변 원리에 대한 설명으로 옳은 것은?
o 빛의 속력은 광원이 다가오면 빨라진다
o 빛의 속력은 관찰자가 빛을 쫓아가면 느려진다
o* 진공에서 빛의 속력은 모든 관성계에서 같다
o 빛의 속력은 매질과 관계없이 항상 같다
:: 진공에서 빛의 속력은 광원과 관찰자의 운동에 관계없이 일정하다(매질 속에서는 느려진다).

= 확인 문제 2
Q 지구에서 볼 때 빛의 속력에 가깝게 움직이는 우주선에서 일어나는 현상으로 옳은 것은?
o 우주선의 시간이 빠르게 간다
o* 우주선의 시간이 느리게 가고, 운동 방향의 길이가 짧아진다
o 우주선의 질량이 0이 된다
o 우주선의 높이가 짧아진다
:: 시간 팽창과 함께 운동 방향의 길이 수축이 일어난다.

= 확인 문제 3
Q 일상생활에서 시간 팽창과 길이 수축을 느끼지 못하는 까닭은?
o 상대성 이론이 틀렸으므로
o* 일상의 속력이 빛의 속력보다 매우 작아 효과가 아주 작으므로
o 지구가 정지해 있으므로
o 시계가 정확하지 않으므로
:: 효과는 항상 있지만 빛의 속력에 가까워야 뚜렷해진다.

= 서술형 도전 | 생각 넓히기
? 빛 시계 사고 실험에서 밖의 관찰자가 우주선 안의 시간이 느리게 간다고 판단하는 까닭을 광속 불변 원리로 설명하시오. :: 밖에서 보면 빛이 비스듬한 더 긴 경로를 왕복하는데, 빛의 속력은 누구에게나 같으므로 한 번 왕복하는 데 더 긴 시간이 걸린다. 따라서 우주선의 시계가 느리게 간다.
? GPS가 상대성 이론의 시간 보정 없이 작동한다면 어떤 문제가 생길지 쓰시오. :: 위성 시계와 지상 시계의 시간 차이가 계속 쌓여 위성 신호로 계산한 위치에 큰 오차가 생긴다.

= 오늘 배운 내용 정리
- 두 원리: 상대성 원리, [[광속 불변]] 원리
- 움직이는 관찰자의 시간은 느리게 측정 → [[시간 팽창]]
- 움직이는 물체의 운동 방향 길이는 짧게 측정 → [[길이 수축]]
- 빛의 속력에 가까울수록 효과가 뚜렷 — 뮤온 관측, GPS 보정

= 나가기 전 한 문제 | 형성평가
? 지표에서 많은 뮤온이 검출되는 현상을 지표의 관찰자 입장과 뮤온의 입장에서 각각 한 문장으로 설명하시오. :: 지표 관찰자: 빠르게 움직이는 뮤온의 시간이 느리게 가서(시간 팽창) 붕괴하기 전에 지표에 도달한다. 뮤온: 대기층의 두께가 짧아져(길이 수축) 짧은 시간에 지표에 도달한다.
