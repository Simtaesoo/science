# 물질파와 전자 현미경 | 입자도 파동이다 | 고등학교 물리학 · 04 빛과 물질 · 4차시 | 2022 개정 교육과정 [물리학 Ⅲ]

= 오늘의 학습 목표 | 4차시
^ 드브로이 **물질파**의 개념과 파장 식을 설명할 수 있다.
^ 전자의 **회절·간섭** 실험으로 물질파를 확인할 수 있음을 설명할 수 있다.
^ **전자 현미경**의 분해능이 높은 까닭을 물질파로 설명할 수 있다.
% 흐름: 생각 열기 5분 → 물질파 8분 → 실험적 증거 7분 → 전압과 파장(시뮬레이션) 12분 → 계산·문항 13분

= 바이러스를 보려면? | 생각 열기
* 🔬 광학 현미경 :: 세포는 보이지만 바이러스는 흐릿하다
* 🦠 바이러스 :: 크기가 약 20~300 nm
* ⚡ 전자 현미경 :: 바이러스, 원자 배열까지 보인다
* 🌈 가시광선 :: 파장 약 380~780 nm
? 왜 빛으로는 바이러스를 선명하게 볼 수 없을까? :: 파장보다 작은 물체는 구별하기 어렵다. 파장이 훨씬 짧은 **전자의 물질파**를 쓰면 더 작은 것을 볼 수 있다.

= 지난 시간 복습 | 2·3차시
- 이중 슬릿 간섭 → 빛의 [[파동성]]
- 광전 효과 → 빛의 [[입자성]]
- 빛은 파동성과 입자성을 함께 가진다 → [[이중성]]
? 빛이 입자처럼 행동한다면, 전자 같은 입자도 파동처럼 행동할까? :: 그렇다 — 드브로이의 **물질파** (1924년)

## 물질파 | 운동하는 입자의 파동

= 드브로이 물질파
! λ = h/p = h/mv
- 운동하는 입자도 파동성을 가진다 → 이 파동을 **물질파**라 한다.
- h = 6.6 × 10⁻³⁴ J·s (플랑크 상수)
- 운동량이 클수록 파장이 ==짧다.==
>+ 질량이 큰 물체는 물질파 파장이 너무 짧아 파동성이 드러나지 않는다.

= 예제 1 · 야구공의 물질파 | 적용
- 질량 0.15 kg인 야구공이 40 m/s로 날아간다.
^+ p = 0.15 × 40 = **6 kg·m/s**
^+ λ = 6.6 × 10⁻³⁴ ÷ 6 = **1.1 × 10⁻³⁴ m**
^+ 원자 크기(약 10⁻¹⁰ m)보다도 상상할 수 없이 작다 → 간섭·회절을 **관찰할 수 없다.**

= 예제 2 · 전자의 물질파 | 적용
- 질량 9.1 × 10⁻³¹ kg인 전자가 1.0 × 10⁷ m/s로 운동한다.
^+ p = 9.1 × 10⁻³¹ × 1.0 × 10⁷ = **9.1 × 10⁻²⁴ kg·m/s**
^+ λ = 6.6 × 10⁻³⁴ ÷ 9.1 × 10⁻²⁴ ≈ **7.3 × 10⁻¹¹ m** (73 pm)
^+ 원자 사이 간격과 비슷 → 결정에서 **회절**이 일어난다.

## 물질파의 증거 | 전자도 간섭한다

= 물질파의 실험적 증거
- **데이비슨·거머 실험**: 전자선이 니켈 결정에서 ==회절==하는 것을 확인
- **전자의 이중 슬릿 실험**: 전자를 하나씩 쏘면 스크린에 ==점==으로 도착하지만, 많이 모이면 ==간섭무늬==가 나타난다.
>+ 전자는 입자처럼 도착하고, 파동처럼 퍼져 간섭한다 → **입자–파동 이중성**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#matter | 가속 전압을 바꾸며 전자의 물질파 파장과 간섭무늬 간격을 관찰하자. 전자를 하나씩 쏘아 무늬가 쌓이는 모습도 보자.
% 전압 4배 → 파장 1/2을 먼저 예측하게 하기

= 가속 전압과 파장 | 시뮬레이션 기록
| 가속 전압 (V) | 50 | 150 | 400 | 1000 |
|+ 파장 (pm) | 173.4 | [[100.1]] | [[61.3]] | [[38.8]] |
|+ 무늬 간격 | 넓다 | 점점 좁아진다 | | 가장 좁다 |
||
C 가속 전압에 따른 전자의 물질파 파장 | 가속 전압 (V) | 파장 (pm) | 파장:50,173.4 100,122.6 150,100.1 400,61.3 1000,38.8
- 가속 전압 4배 → 파장 [[1/2]]배 (λ ∝ 1/√V)

= 예제 3 · 전압 4배 | 적용
- 전압 V로 가속한 전자: eV = ½mv² → p = mv = √(2meV)
^+ λ = h/p = h/√(2meV) → λ ∝ **1/√V**
^+ 전압 4배 → √4 = 2 → 파장 **1/2배**
^+ 확인: 100 V일 때 약 122.6 pm, 400 V일 때 약 61.3 pm ✔

= 전자 현미경 | 분해능
- **분해능**: 가까이 있는 두 점을 구별하는 능력 — 파장이 짧을수록 높다.
| 구분 | 광학 현미경 | 전자 현미경 |
|+ 사용하는 파동 | 가시광선 (약 400~700 nm) | 전자의 물질파 (pm 수준) |
|+ 분해능 | 약 200 nm | [[원자 수준까지]] |
|+ 관찰 대상 | 세포, 세균 | 바이러스, 단백질, 원자 배열 |
>+ 가속 전압을 높이면 파장이 짧아져 분해능이 **더 높아진다.**

= 확인 문제 1
Q 질량이 같은 두 입자 A, B의 속력이 1 : 2일 때 물질파 파장의 비는?
o 1 : 2
o* 2 : 1
o 1 : 4
o 4 : 1
:: λ = h/mv → 파장은 속력에 반비례

= 확인 문제 2
Q 물질파의 존재를 처음 실험으로 확인한 현상은?
o 광전 효과
o* 전자선의 결정 회절
o 빛의 굴절
o 수소 원자의 선 스펙트럼
:: 데이비슨·거머가 전자의 회절을 관찰했다.

= 확인 문제 3
Q 전자 현미경의 분해능을 높이는 방법은?
o 가속 전압을 낮춘다
o* 가속 전압을 높인다
o 가시광선을 함께 비춘다
o 전자의 속력을 줄인다
:: 운동량이 커지면 물질파 파장이 짧아져 분해능이 높아진다.

= 확인 문제 4
Q 가속 전압을 9배로 하면 전자의 물질파 파장은?
o 9배
o 3배
o* 1/3배
o 1/9배
:: λ ∝ 1/√V → 1/√9 = 1/3

= 확인 문제 5
Q 전자를 하나씩 이중 슬릿에 쏘았을 때의 결과로 옳은 것은?
o 처음부터 연속적인 간섭무늬가 나타난다
o 두 줄의 무늬만 생긴다
o* 하나하나는 점으로 도착하지만 많이 모이면 간섭무늬가 나타난다
o 아무것도 도착하지 않는다
:: 입자로 도착하고 파동처럼 간섭한다 — 이중성

= 생활 속 물질파 | 사례
* 🔬 투과 전자 현미경 :: 바이러스·세포 내부 구조 관찰
* 🧪 주사 전자 현미경 :: 곤충 눈, 반도체 표면의 입체 영상
* 💊 저온 전자 현미경 :: 단백질 구조 분석으로 신약 개발 (2017년 노벨상)
* 💻 반도체 검사 :: 나노미터 회로 패턴 확인
* 🧲 중성자 회절 :: 물질 속 원자 배열 분석
* ⚛️ 양자 컴퓨터 :: 입자의 파동성과 중첩을 이용

= 서술형 도전 | 생각 넓히기
? 야구공(0.15 kg, 40 m/s)의 물질파 파장을 구하고, 야구공에서 파동성이 관찰되지 않는 까닭을 쓰시오. (h = 6.6 × 10⁻³⁴ J·s) :: λ = 6.6 × 10⁻³⁴ ÷ (0.15 × 40) = 1.1 × 10⁻³⁴ m. 파장이 원자보다도 상상할 수 없이 작아 간섭·회절을 관찰할 수 없다.
? 빛과 전자가 각각 파동성과 입자성을 가진다는 증거가 되는 실험을 정리하시오. :: 빛 — 파동성: 이중 슬릿 간섭, 회절 / 입자성: 광전 효과. 전자 — 파동성: 전자 회절(데이비슨·거머), 이중 슬릿 간섭 / 입자성: 스크린에 점으로 도착, 질량·전하를 가짐.

= 오늘 배운 내용 정리
- 운동하는 입자의 파동 → [[물질파]], λ = [[h/mv]]
- 운동량이 클수록 파장이 [[짧다]] → 큰 물체는 파동성이 드러나지 않음
- 전자의 [[회절]]·간섭 → 물질파의 증거
- 가속 전압 4배 → 파장 [[1/2]]배
- 전자 현미경: 파장이 짧은 전자의 물질파 → [[분해능]]이 높다

= 나가기 전 한 문제 | 형성평가
? 전자의 속력을 2배로 하면 물질파 파장은 몇 배가 되는지 쓰고, 이것이 전자 현미경에 어떤 영향을 주는지 쓰시오. :: λ = h/mv → 1/2배. 파장이 짧아지므로 더 작은 구조를 구별할 수 있어 분해능이 높아진다.
