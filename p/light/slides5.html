# 볼록 렌즈의 상과 포토리소그래피 | 빛으로 회로를 새기다 | 고등학교 물리학 · 04 빛과 물질 · 3차시 | 2022 개정 교육과정 [12물리03-02]

= 오늘의 학습 목표 | 3차시
^ 빛의 **굴절**로 볼록 렌즈가 빛을 모으는 원리를 설명할 수 있다.
^ **광선 추적**으로 볼록 렌즈에 의한 상의 위치와 모양을 찾을 수 있다.
^ 렌즈의 결상 원리가 반도체 제작의 **포토리소그래피**에 활용됨을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 렌즈와 굴절 7분 → 광선 추적 15분 → 실상 관찰 탐구 8분 → 포토리소그래피 10분
% 2022 개정 [12물리03-02] 해설: 상이 맺히는 과정을 설명하기 위해 광선 추적법을 도입하며, 결상 공식(1/a + 1/b = 1/f)이나 렌즈 제작자 공식, 복합 렌즈 등 복잡한 상황은 다루지 않는다. 포토리소그래피는 개략적으로 소개한다. 탐구 활동: 볼록 렌즈에 의한 실상을 관찰하여 상의 위치와 초점 거리 찾기

= 돋보기로 종이를 태울 수 있는 까닭 | 생각 열기
* 🔍 돋보기 :: 햇빛을 한 점에 모으면 종이가 탄다
* 📽️ 빔 프로젝터 :: 작은 화면을 커다란 스크린에 거꾸로 확대한다
* 📷 카메라 :: 렌즈가 이미지 센서에 상을 맺는다
* 💻 반도체 칩 :: 머리카락보다 수천 배 가는 회로를 빛으로 새긴다
? 볼록 렌즈는 왜 빛을 한 점으로 모을까? :: 렌즈 표면에서 빛이 **굴절**하는데, 가장자리일수록 더 많이 꺾여 한 점(초점)으로 모인다.

= 지난 시간 복습 | 2차시
- 빛이 매질의 경계에서 진행 방향이 꺾이는 현상 → [[굴절]]
- 공기에서 유리로 들어갈 때 빛은 법선 [[쪽으로]] 꺾인다.
? 볼록 렌즈의 가장자리는 가운데보다 두께가 어떻게 다를까? :: 가장자리로 갈수록 얇다. 그래서 빛이 들어오고 나가는 두 면이 비스듬해져 더 크게 꺾인다.

## 볼록 렌즈와 광선 추적 | 세 개의 약속된 광선

= 볼록 렌즈의 초점
- 광축에 나란히 들어온 빛 → 굴절 후 한 점에 모인다 → **초점(F)**
- 렌즈 중심에서 초점까지의 거리 → **초점 거리**
- 볼록 렌즈의 초점은 렌즈 양쪽에 하나씩 있다.

= 광선 추적의 세 광선
^ 광축에 **나란히** 들어온 빛 → 굴절 후 반대쪽 **초점**을 지난다.
^ 렌즈의 **중심**을 지나는 빛 → 꺾이지 않고 **곧게** 나아간다.
^ 앞쪽 **초점을 지나** 들어온 빛 → 굴절 후 광축에 **나란히** 나아간다.
>+ 물체의 한 점에서 나온 광선들이 다시 만나는 곳에 그 점의 **상**이 맺힌다 (두 광선만 그려도 된다).

= 물체 위치에 따른 상 | 광선 추적 결과
| 물체의 위치 | 상의 위치 | 상의 모습 | 예 |
|+ 초점 거리의 2배보다 멀리 | 반대쪽 F와 2F 사이 | [[거꾸로 선 작은 실상]] | 카메라, 눈 |
|+ 2F와 F 사이 | 반대쪽 2F보다 멀리 | [[거꾸로 선 큰 실상]] | 빔 프로젝터 |
|+ 초점 안쪽 | 물체와 같은 쪽 | [[바로 선 큰 허상]] | 돋보기 |
~ 실상: 빛이 실제로 모여 스크린에 맺히는 상 / 허상: 빛이 모이지 않아 스크린에 맺히지 않는 상

= 탐구 · 실상의 위치와 초점 거리 찾기 | 실험
^ 촛불(또는 LED 광원), 볼록 렌즈, 스크린을 일직선으로 놓는다.
^ 스크린을 움직여 **선명한 상**이 맺히는 곳을 찾고, 렌즈–물체, 렌즈–상 거리를 기록한다.
^ 물체와 상의 크기가 **같아지는** 위치를 찾는다 → 이때 렌즈–물체 거리는 초점 거리의 **2배**
>+ 아주 먼 물체(창밖 풍경)의 상이 맺히는 곳까지의 거리 ≈ 초점 거리
% 결상 공식을 쓰지 않는다. 광선 추적과 측정 자료로 경향을 찾는다.

= 예제 1 · 빔 프로젝터 | 적용
- 빔 프로젝터는 작은 화면을 스크린에 크게 비춘다.
^+ 스크린에 맺히므로 **실상**이다.
^+ 크게 확대되므로 화면은 렌즈의 **F와 2F 사이**에 놓인다.
^+ 실상은 **거꾸로** 맺히므로 화면을 미리 거꾸로 넣는다.

## 포토리소그래피 | 빛으로 회로를 인쇄하다

= 포토리소그래피의 과정 | 개략
^+ 규소 기판에 빛에 반응하는 물질(감광제)을 바른다.
^+ 회로 무늬가 그려진 **마스크**에 빛을 비춘다.
^+ 렌즈가 마스크의 무늬를 **작게 줄인 실상**으로 기판 위에 맺는다.
^+ 빛을 받은 부분만 화학적으로 변해 씻어 내고 깎으면 회로 무늬가 새겨진다.
>+ 물체를 2F보다 멀리 두면 **작은 실상** — 같은 원리로 아주 작은 회로를 그린다.

= 더 작게, 더 정밀하게 | 기술
* 🌈 짧은 파장 :: 파장이 짧은 자외선(극자외선)을 쓸수록 더 가는 선을 새길 수 있다
* 🔭 정밀 렌즈·거울 :: 수많은 렌즈와 거울로 상의 흐림을 줄인다
* 🖥️ 디스플레이 :: 화면의 미세한 화소와 배선도 같은 방식으로 만든다
* 🇰🇷 산업 :: 반도체·디스플레이는 빛의 굴절과 결상 기술의 결정체

= 확인 문제 1
Q 볼록 렌즈의 중심을 지나는 빛의 진행으로 옳은 것은?
o 초점을 지난다
o 광축에 나란히 나아간다
o* 꺾이지 않고 곧게 나아간다
o 반사되어 되돌아온다
:: 렌즈 중심을 지나는 광선은 진행 방향이 바뀌지 않는다.

= 확인 문제 2
Q 돋보기로 글씨를 크게 볼 때 상의 특징은?
o 거꾸로 선 작은 실상
o 거꾸로 선 큰 실상
o* 바로 선 큰 허상
o 바로 선 작은 허상
:: 물체가 초점 안쪽에 있으면 바로 선 큰 허상이 생긴다.

= 확인 문제 3
Q 포토리소그래피에서 렌즈가 하는 역할은?
o 빛을 흩어지게 한다
o* 마스크의 회로 무늬를 기판 위에 작은 실상으로 맺는다
o 기판을 가열한다
o 감광제를 만든다
:: 회로 무늬를 줄여서 정확하게 맺어야 미세한 회로를 새길 수 있다.

= 서술형 도전 | 생각 넓히기
? 카메라로 먼 풍경을 찍을 때 이미지 센서에 맺히는 상의 특징과 그 까닭을 쓰시오. :: 물체가 초점 거리의 2배보다 멀리 있으므로 거꾸로 선 작은 실상이 맺힌다.
? 반도체 회로를 더 미세하게 만들기 위해 짧은 파장의 빛을 쓰는 까닭을 추론하시오. :: 파장이 짧을수록 빛의 퍼짐(회절)이 줄어 더 작은 점과 가는 선을 선명하게 맺을 수 있기 때문이다.

= 오늘 배운 내용 정리
- 볼록 렌즈는 빛을 [[굴절]]시켜 초점에 모은다.
- 광선 추적: 나란한 빛 → 초점, 중심 → 직진, 초점을 지난 빛 → [[나란히]]
- 물체가 멀면 작은 실상, F와 2F 사이면 큰 실상, 초점 안쪽이면 바로 선 큰 [[허상]]
- 포토리소그래피: 마스크 무늬를 작은 [[실상]]으로 맺어 회로를 새긴다.

= 나가기 전 한 문제 | 형성평가
? 볼록 렌즈 앞에 물체를 두고 스크린을 움직였더니 물체와 같은 크기의 거꾸로 선 실상이 맺혔다. 렌즈에서 물체까지 거리가 30 cm라면 초점 거리는 얼마인지 쓰시오. :: 물체와 상의 크기가 같으면 물체가 초점 거리의 2배 위치에 있으므로 초점 거리는 15 cm이다.
