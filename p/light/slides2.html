# 빛의 간섭 | 영의 이중 슬릿 실험 | 고등학교 물리학 · 04 빛과 물질 · 2차시 | 2022 개정 교육과정 [물리학 Ⅲ]

= 오늘의 학습 목표 | 2차시
^ **보강 간섭**과 **상쇄 간섭**을 경로차로 설명할 수 있다.
^ 이중 슬릿 간섭무늬의 **무늬 간격**을 계산할 수 있다.
^ 간섭이 빛의 **파동성**의 증거임을 설명하고 활용 예를 들 수 있다.
% 흐름: 생각 열기 5분 → 간섭의 조건 10분 → 무늬 간격(시뮬레이션) 12분 → 계산 10분 → 활용·문항 8분

= 비눗방울은 왜 무지갯빛일까? | 생각 열기
* 🫧 비눗방울 :: 투명한 비눗물인데 여러 색이 어른거린다
* 🛢️ 물 위의 기름막 :: 무지갯빛 무늬
* 💿 CD 뒷면 :: 보는 각도에 따라 색이 바뀐다
* 📷 카메라 렌즈 :: 보랏빛이 도는 코팅
? 색소도 없는데 색이 보이는 까닭은? :: 얇은 막의 윗면과 아랫면에서 반사된 빛이 **간섭**하여 특정 색만 강해지기 때문 — 빛이 **파동**이라는 증거!

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 파장 | 이웃한 마루 사이의 거리 |
| 가시광선 | 약 380~780 nm, 빨강일수록 파장이 길다 |
| 굴절 | 매질에 따라 빛의 속력이 달라진다 (1차시) |
? 두 물결파의 마루와 마루가 만나면? 마루와 골이 만나면? :: 마루끼리는 더 높아지고(보강), 마루와 골은 서로 지워진다(상쇄).

## 간섭 | 경로차가 결정한다

= 보강 간섭과 상쇄 간섭
| 간섭 | 경로차 | 스크린 |
|+ 보강 간섭 | [[mλ]] (파장의 정수배) | 밝은 무늬 |
|+ 상쇄 간섭 | [[(m + ½)λ]] (반파장의 홀수배) | 어두운 무늬 |
! 이웃한 밝은 무늬 사이 간격: Δx = Lλ/d
~ L: 슬릿과 스크린 사이 거리, d: 두 슬릿 사이 간격

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#interf | 슬릿 간격 0.25 mm, 스크린 거리 1.0 m에서 파장을 바꾸며 무늬 간격을 기록하자. 슬릿 간격과 거리도 바꾸어 보자.
% 파장 → 슬릿 간격 → 스크린 거리 순서로 하나씩 바꾸기

= 파장과 무늬 간격 | 시뮬레이션 기록
| 파장 (nm) | 400 | 500 | 600 | 700 |
|+ Δx (mm) | 1.60 | [[2.00]] | [[2.40]] | [[2.80]] |
||
C 파장에 따른 무늬 간격 (d = 0.25 mm, L = 1.0 m) | 파장 (nm) | 무늬 간격 (mm) | 무늬 간격:400,1.6 500,2 600,2.4 700,2.8
- 슬릿 간격 2배 → 무늬 간격 [[1/2]]배, 스크린 거리 2배 → [[2]]배

= 예제 1 · 무늬 간격 계산 | 적용
- 슬릿 간격 0.5 mm, 스크린 거리 2 m, 파장 600 nm
^+ Δx = Lλ/d = 2 × 600 × 10⁻⁹ ÷ (0.5 × 10⁻³)
^+ = 2.4 × 10⁻³ m = **2.4 mm**

= 예제 2 · 밝을까, 어두울까 | 적용
- 스크린 위 한 점에서 두 슬릿까지의 경로차가 900 nm이다. 600 nm 빛을 비추면?
^+ 900 ÷ 600 = **1.5** → 반파장(300 nm)의 **3배** (홀수배)
^+ **상쇄 간섭** → 어두운 무늬
^+ 450 nm 빛이면? 900 ÷ 450 = **2** → 보강 간섭 → 밝은 무늬

= 예제 3 · 파장 구하기 | 적용
- 슬릿 간격 0.2 mm, 스크린 거리 1.5 m에서 밝은 무늬 간격이 4.5 mm였다. 빛의 파장은?
^+ λ = Δx × d ÷ L = 4.5 × 10⁻³ × 0.2 × 10⁻³ ÷ 1.5
^+ = 6 × 10⁻⁷ m = **600 nm** (주황빛)

## 간섭의 의미와 활용 | 빛은 파동이다

= 간섭은 파동성의 증거
- 입자라면 두 슬릿 뒤에 **두 줄**만 생겨야 한다.
- 실제로는 밝고 어두운 무늬가 **여러 줄** 반복된다 → 빛은 ==파동==
>+ 간섭과 **회절**은 빛의 파동성을 보여 준다 (영, 1801년).

= 확인 문제 1
Q 이중 슬릿 실험에서 밝은 무늬가 생기는 조건은?
o 경로차가 반파장의 홀수배
o* 경로차가 파장의 정수배
o 경로차가 항상 0
o 경로차와 관계없다
:: 두 빛이 같은 위상으로 만나 보강 간섭한다.

= 확인 문제 2
Q 빨간빛 대신 파란빛을 쓰면 무늬 간격은?
o 넓어진다
o* 좁아진다
o 변하지 않는다
o 무늬가 사라진다
:: 파란빛은 파장이 짧아 Δx = Lλ/d가 작아진다.

= 확인 문제 3
Q 슬릿 간격을 절반으로 하고 스크린 거리를 2배로 하면 무늬 간격은?
o 1배
o 2배
o* 4배
o 1/4배
:: Δx ∝ L/d → 2 ÷ (1/2) = 4배

= 확인 문제 4
Q 경로차가 1200 nm인 점에 파장 400 nm 빛을 비추면?
o* 밝은 무늬 (보강)
o 어두운 무늬 (상쇄)
o 중간 밝기
o 빛이 도달하지 않는다
:: 1200 ÷ 400 = 3 → 파장의 정수배 → 보강 간섭

= 확인 문제 5
Q 빛의 파동성을 보여 주는 현상이 아닌 것은?
o 이중 슬릿 간섭
o 회절
o 비눗방울의 무지갯빛
o* 광전 효과
:: 광전 효과는 빛의 입자성을 보여 준다(다음 차시).

= 생활 속 빛의 간섭 | 사례
* 🫧 비눗방울·기름막 :: 얇은 막 간섭으로 색이 보인다
* 📷 무반사 코팅 :: 반사광끼리 상쇄 간섭시켜 반사를 줄인다
* 💵 지폐 위조 방지 :: 보는 각도에 따라 색이 바뀌는 간섭 무늬
* 💿 CD·DVD :: 촘촘한 홈에서의 회절·간섭
* 🦋 모르포나비 :: 색소 없이 구조로 만든 푸른빛 (구조색)
* 🔬 간섭계 :: 아주 작은 길이 변화를 측정 (중력파 검출)

= 서술형 도전 | 생각 넓히기
? 경로차 900 nm인 점에 600 nm 빛을 비추었을 때 밝은지 어두운지와 그 까닭을 쓰시오. :: 900 = 1.5 × 600 → 반파장의 홀수배(3 × λ/2)이므로 상쇄 간섭이 일어나 어두운 무늬가 된다.
? 카메라 렌즈의 무반사 코팅이 반사광을 줄이는 원리를 간섭으로 설명하시오. :: 코팅 막 윗면과 아랫면에서 반사된 빛의 경로차가 반파장의 홀수배가 되도록 막 두께를 정해 상쇄 간섭을 일으킨다. 반사광이 줄어든 만큼 더 많은 빛이 렌즈를 통과한다.

= 오늘 배운 내용 정리
- 경로차 = 파장의 정수배 → [[보강 간섭]] (밝은 무늬)
- 경로차 = 반파장의 홀수배 → [[상쇄 간섭]] (어두운 무늬)
- 무늬 간격 Δx = [[Lλ/d]]
- 파장이 길수록, 스크린이 멀수록 간격 [[넓어짐]], 슬릿 간격이 클수록 [[좁아짐]]
- 간섭·회절은 빛의 [[파동성]]의 증거

= 나가기 전 한 문제 | 형성평가
? 슬릿 간격 0.3 mm, 스크린 거리 1.2 m에서 파장 500 nm 빛의 밝은 무늬 간격을 구하시오. :: Δx = 1.2 × 500 × 10⁻⁹ ÷ (0.3 × 10⁻³) = 2.0 × 10⁻³ m = 2.0 mm
