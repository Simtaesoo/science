# 운동량 보존과 충돌 | 주고받아도 합은 그대로 | 고등학교 물리학 · 01 힘과 운동 · 3차시 | 2022 개정 교육과정 [물리학 Ⅰ]

= 오늘의 학습 목표 | 3차시
^ **운동량 보존 법칙**을 작용 반작용 법칙으로 설명할 수 있다.
^ 충돌 전후 운동량 보존을 이용해 **나중 속도**를 구할 수 있다.
^ **반발 계수**와 운동 에너지 변화로 충돌의 종류를 구별할 수 있다.
% 흐름: 생각 열기 5분 → 운동량 보존 10분 → 수레 충돌(시뮬레이션) 12분 → 계산 10분 → 문항 8분

= 당구공은 왜 멈출까? | 생각 열기
* 🎱 당구 :: 정면으로 맞히면 흰 공은 멈추고 맞은 공이 그 속도로 굴러간다
* ⛸️ 스케이트 :: 서로 밀면 두 사람 모두 반대 방향으로 미끄러진다
* 🚀 로켓 :: 밀어낼 공기가 없는 우주에서도 가속한다
* 🚗 접촉 사고 :: 엉겨 붙은 두 차가 함께 밀려간다
? 서로 밀어낸 두 스케이터 중 누가 더 빠르게 미끄러질까? :: **가벼운 사람**. 두 사람이 받는 충격량(운동량 변화)의 크기는 같으므로 질량이 작을수록 속도가 크다.

= 지난 시간 복습 | 2차시 · 통합과학1
- 작용 반작용: 크기 [[같고]], 방향 반대, 서로 다른 물체에 작용
- 운동량 p = [[mv]], 충격량 = Ft = 운동량의 [[변화량]]
? 두 물체가 충돌하는 동안 주고받는 힘의 크기와 시간이 같다면 충격량은? :: 크기는 같고 방향이 반대 → 두 충격량의 합 = **0** → 운동량의 총합은 변하지 않는다!

## 운동량 보존 법칙 | 합은 일정하다

= 운동량 보존 법칙
! m_A v_A + m_B v_B = m_A v_A′ + m_B v_B′
- 외력이 없으면 충돌 전후 운동량의 ==총합==이 일정하다.
- 충돌하는 동안 두 물체가 주고받는 힘은 ==작용 반작용== → 충격량의 합 = 0
>+ 운동량은 **방향**이 있으므로 (+), (−) 부호를 꼭 정하고 계산한다.

= 반발 계수와 충돌의 종류
! e = (충돌 후 멀어지는 상대 속력) ÷ (충돌 전 가까워지는 상대 속력)
| 충돌 | 반발 계수 | 운동 에너지 |
|+ 탄성 충돌 | e = [[1]] | 보존 |
|+ 비탄성 충돌 | 0 < e < 1 | 일부 손실 |
|+ 완전 비탄성 충돌 | e = [[0]] | 가장 많이 손실 (한 덩어리로 운동) |
>+ 어떤 충돌이든 외력이 없으면 **운동량은 항상 보존**된다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#momentum | A 2 kg·4 m/s, B 1 kg·정지 상태에서 반발 계수를 1, 0.5, 0으로 바꾸며 충돌시키자.
% 운동량 합은 항상 8, 운동 에너지 합은 반발 계수에 따라 달라지는 것을 표로 대비

= 수레 충돌 | 시뮬레이션 기록
| 반발 계수 | A 나중 속도 | B 나중 속도 | 운동량 합 | 운동 에너지 합 |
|+ 1 (탄성) | 1.33 m/s | 5.33 m/s | 8.00 | 16.0 J (보존) |
|+ 0.5 | 2.00 m/s | 4.00 m/s | [[8.00]] | [[12.0 J]] |
|+ 0 (완전 비탄성) | 2.67 m/s | 2.67 m/s | [[8.00]] | [[10.7 J]] |

= 그래프로 보면 | 운동량과 운동 에너지
C 반발 계수에 따른 충돌 후 운동량 합과 운동 에너지 합 | 반발 계수 | 값 (kg·m/s, J) | 운동량 합:0,8 0.5,8 1,8 | 운동 에너지 합:0,10.7 0.5,12 1,16
+ 운동량 합은 반발 계수와 관계없이 [[8 kg·m/s]]로 일정
+ 운동 에너지 합은 반발 계수가 [[작을수록]] 많이 줄어든다.

= 예제 1 · 반발 계수 0.5 | 적용
- A(2 kg, 4 m/s)가 정지한 B(1 kg)와 충돌, e = 0.5
^+ 운동량 보존: 2 × 4 = 2v_A′ + 1 × v_B′ → 2v_A′ + v_B′ = **8**
^+ 반발 계수: v_B′ − v_A′ = 0.5 × 4 = **2**
^+ 두 식을 풀면 3v_A′ = 6 → v_A′ = **2 m/s**, v_B′ = **4 m/s**
^+ 운동 에너지: ½·2·2² + ½·1·4² = 4 + 8 = **12 J** (처음 16 J → 4 J 손실)

= 예제 2 · 한 덩어리가 되면 | 적용
- 질량 1 kg인 공 A가 6 m/s로 정지한 2 kg 공 B와 충돌한 뒤 한 덩어리가 되었다.
^+ 운동량 보존: 1 × 6 = (1 + 2) × v → v = **2 m/s**
^+ 충돌 전 운동 에너지 = ½ × 1 × 6² = **18 J**
^+ 충돌 후 = ½ × 3 × 2² = **6 J** → 손실 **12 J** (열·소리·변형)

= 예제 3 · 대포의 반동 | 적용
- 정지한 대포(500 kg)가 질량 5 kg인 포탄을 200 m/s로 발사했다.
^+ 발사 전 운동량 합 = **0**
^+ 0 = 5 × 200 + 500 × v → v = **−2 m/s**
^+ 대포는 포탄과 **반대 방향**으로 2 m/s로 밀린다.

= 확인 문제 1
Q 외력이 없는 두 물체의 충돌에서 항상 보존되는 양은?
o 각 물체의 속도
o 운동 에너지의 합
o* 운동량의 합
o 각 물체의 운동량
:: 운동량의 총합은 모든 충돌에서 보존되고, 운동 에너지는 탄성 충돌에서만 보존된다.

= 확인 문제 2
Q 3 kg 물체가 4 m/s로 정지한 1 kg 물체와 충돌해 한 덩어리가 되었다. 충돌 후 속도는?
o 1 m/s
o* 3 m/s
o 4 m/s
o 12 m/s
:: 3 × 4 = 4 × v → v = 3 m/s

= 확인 문제 3
Q 완전 비탄성 충돌의 특징으로 옳은 것은?
o 반발 계수가 1이다
o 운동 에너지가 보존된다
o* 충돌 후 두 물체가 한 덩어리로 운동한다
o 운동량이 보존되지 않는다
:: 반발 계수 0, 운동 에너지 손실이 가장 크지만 운동량은 보존된다.

= 확인 문제 4
Q 정지해 있던 60 kg 스케이터와 40 kg 스케이터가 서로 밀었더니 40 kg 스케이터가 3 m/s로 미끄러졌다. 60 kg 스케이터의 속력은?
o 1 m/s
o* 2 m/s
o 3 m/s
o 4.5 m/s
:: 0 = 40 × 3 + 60 × v → v = −2 m/s → 반대 방향으로 2 m/s

= 확인 문제 5
Q 정지한 60 kg 스케이터에게 2 kg 공이 10 m/s로 날아와 스케이터가 공을 잡았다. 함께 미끄러지는 속력은?
o 0.2 m/s
o* 약 0.32 m/s
o 2 m/s
o 10 m/s
:: 2 × 10 = (60 + 2) × v → v = 20 ÷ 62 ≈ 0.32 m/s

= 생활 속 운동량 보존 | 사례
* 🎱 당구 :: 같은 질량의 정면 탄성 충돌 — 속도를 그대로 넘겨준다
* 🚀 로켓 :: 가스를 뒤로 분사해 앞쪽 운동량을 얻는다
* 🔫 총의 반동 :: 총알의 운동량만큼 총이 뒤로
* ⛸️ 피겨 페어 :: 서로 밀면 반대 방향으로 미끄러진다
* 🧲 뉴턴의 요람 :: 한쪽 끝 공의 운동량이 반대쪽 끝 공으로
* 🚗 교통사고 분석 :: 충돌 후 미끄러진 거리로 충돌 전 속도를 추정

= 서술형 도전 | 생각 넓히기
? 정지한 대포가 포탄을 발사하면 대포가 뒤로 밀리는 까닭을 운동량 보존으로 설명하시오. :: 발사 전 운동량 합이 0이므로, 발사 후 포탄의 운동량과 크기가 같고 방향이 반대인 운동량을 대포가 가져야 하기 때문이다.
? 로켓이 우주 공간에서 공기를 밀지 않고도 가속할 수 있는 까닭을 쓰시오. :: 로켓이 연료를 태워 가스를 뒤로 빠르게 분사하면, 운동량 보존(작용 반작용)에 따라 로켓은 앞쪽 방향의 운동량을 얻는다. 밀어낼 공기가 필요 없다.

= 오늘 배운 내용 정리
- 외력이 없으면 충돌 전후 운동량의 [[총합]]이 일정 → 운동량 보존 법칙
- 근거: 충돌 중 주고받는 힘은 [[작용 반작용]] → 충격량의 합 0
- 반발 계수 1 → [[탄성]] 충돌 (운동 에너지 보존)
- 반발 계수 0 → [[완전 비탄성]] 충돌 (한 덩어리, 손실 최대)
- 운동량은 항상 보존, 운동 에너지는 [[탄성 충돌]]에서만 보존

= 나가기 전 한 문제 | 형성평가
? 질량이 같은 두 공 A, B 중 A가 5 m/s로 정지한 B에 정면으로 탄성 충돌했다. 충돌 후 두 공의 속도를 구하시오. :: 운동량: 5 = v_A′ + v_B′, 반발 계수 1: v_B′ − v_A′ = 5 → v_A′ = 0, v_B′ = 5 m/s (속도를 그대로 넘겨준다)
