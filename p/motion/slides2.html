# 뉴턴 운동 법칙 | 힘이 운동을 바꾼다 | 고등학교 물리학 · 01 힘과 운동 · 2차시 | 2022 개정 교육과정 [물리학 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ **관성 법칙**, **가속도 법칙**, **작용 반작용 법칙**을 설명할 수 있다.
^ 물체에 작용하는 **알짜힘**을 구해 가속도를 계산할 수 있다.
^ 실로 **연결된 물체**의 가속도와 장력을 구할 수 있다.
% 흐름: 생각 열기 5분 → 세 법칙 10분 → 수레와 추(시뮬레이션) 12분 → 연결된 물체·마찰 10분 → 문항 8분

= 버스가 출발하면 몸이 뒤로? | 생각 열기
* 🚌 버스 출발 :: 몸이 뒤로 쏠린다
* 🛑 버스 급정거 :: 몸이 앞으로 쏠린다
* 🛒 빈 카트와 꽉 찬 카트 :: 같은 힘으로 밀면 빈 카트가 더 빨리 빨라진다
* 🚀 로켓 :: 가스를 뒤로 뿜어 앞으로 나아간다
? 버스가 출발할 때 누가 내 몸을 뒤로 민 것일까? :: 아무도 밀지 않았다. 몸은 원래 상태(정지)를 **유지하려 하고**(관성), 버스만 앞으로 움직인 것이다.

= 지난 시간 복습 | 1차시
- 가속도 = 속도 변화량 ÷ [[걸린 시간]]
- v = v₀ + at, s = v₀t + ½at², v² − v₀² = [[2as]]
? 물체의 가속도를 만드는 것은 무엇일까? :: **힘**. 물체에 작용하는 알짜힘이 가속도를 만든다 — 오늘의 F = ma

## 뉴턴 운동 법칙 | 세 가지 법칙

= 뉴턴 운동 법칙
| 법칙 | 내용 |
|+ 제1법칙 (관성) | 알짜힘이 0이면 정지한 물체는 계속 정지, 운동하는 물체는 [[등속 직선 운동]] |
|+ 제2법칙 (가속도) | F = [[ma]] — 가속도는 알짜힘에 비례, 질량에 반비례 |
|+ 제3법칙 (작용 반작용) | 두 물체가 주고받는 힘은 크기가 [[같고]] 방향이 [[반대]], 서로 [[다른]] 물체에 작용 |
>+ 1 N: 질량 1 kg인 물체에 1 m/s²의 가속도를 만드는 힘

= 평형과 작용 반작용 구별하기
- 책상 위에 놓인 책: 중력(지구 → 책)
| 구분 | 힘 | 작용하는 물체 |
|+ 중력과 평형을 이루는 힘 | 책상이 책을 떠받치는 힘 (수직 항력) | [[책]] (같은 물체) |
|+ 중력의 반작용 | 책이 지구를 당기는 힘 | [[지구]] (다른 물체) |
>+ 평형인 두 힘은 **한 물체**에, 작용 반작용은 **두 물체**에 각각 작용한다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#newton | 수레 2 kg, 마찰 0에서 추 질량을 바꾸며 가속도와 장력을 기록하자.
% 추 질량을 바꾸기 전에 '가속도가 추 질량에 비례할까?'를 예측하게 하기

= 수레와 추 | 시뮬레이션 기록
| 추 질량 (kg) | 0.5 | 1.0 | 2.0 |
|+ 가속도 (m/s²) | 1.96 | [[3.27]] | [[4.90]] |
|+ 장력 (N) | 3.92 | [[6.53]] | [[9.80]] |
||
C 추 질량에 따른 가속도 (수레 2 kg) | 추 질량 (kg) | 가속도 (m/s²) | 가속도:0,0 0.5,1.96 1,3.27 2,4.9
~ 추 질량이 늘어도 가속도가 비례하여 늘지 않는다 — 전체 질량도 함께 늘기 때문

## 연결된 물체 | 한 덩어리로 보기

= 예제 1 · 수레와 추의 가속도 | 적용
- 마찰 없는 수평면의 수레(2 kg)와 도르래에 걸린 추(0.5 kg)가 실로 연결되어 있다.
^+ 한 덩어리로 보면 알짜힘 = 추의 무게 = 0.5 × 9.8 = **4.9 N**
^+ a = 4.9 ÷ (2 + 0.5) = **1.96 m/s²**
^+ 수레만 보면 장력 T = 2 × 1.96 = **3.92 N**
>+ 장력(3.92 N)은 추의 무게(4.9 N)보다 **작다** — 추도 가속되므로

= 예제 2 · 마찰이 있으면 | 적용
- 같은 실험을 마찰 계수 0.1인 면에서 한다.
^+ 마찰력 = 0.1 × 2 × 9.8 = **1.96 N**
^+ 알짜힘 = 4.9 − 1.96 = **2.94 N**
^+ a = 2.94 ÷ 2.5 ≈ **1.18 m/s²**

= 예제 3 · 엘리베이터 속 체중계 | 적용
- 질량 50 kg인 학생이 위로 2 m/s²로 가속하는 엘리베이터 안 체중계에 서 있다.
^+ 학생에게 작용하는 힘: 체중계가 미는 힘 N(위), 중력 50 × 9.8 = 490 N(아래)
^+ N − 490 = 50 × 2 → N = **590 N**
^+ 체중계 눈금은 590 N ÷ 9.8 ≈ **60 kg**으로 '더 무겁게' 나온다.

= 확인 문제 1
Q 질량 4 kg인 물체에 알짜힘 12 N이 작용할 때 가속도는?
o 0.33 m/s²
o* 3 m/s²
o 8 m/s²
o 48 m/s²
:: a = F ÷ m = 12 ÷ 4 = 3 m/s²

= 확인 문제 2
Q 작용 반작용 법칙에 대한 설명으로 옳은 것은?
o 두 힘은 같은 물체에 작용한다
o 두 힘의 크기는 질량에 비례한다
o* 두 힘은 크기가 같고 방향이 반대이며 서로 다른 물체에 작용한다
o 두 힘은 서로 상쇄되어 물체가 움직이지 않는다
:: 서로 다른 물체에 작용하므로 상쇄되지 않는다.

= 확인 문제 3
Q 마찰 없는 수평면의 3 kg 물체 A와 1 kg 물체 B가 붙어 있고, A를 수평으로 8 N으로 밀 때 A가 B를 미는 힘은?
o 8 N
o 6 N
o* 2 N
o 1 N
:: 전체 a = 8 ÷ 4 = 2 m/s², B에 작용하는 힘 = 1 × 2 = 2 N

= 확인 문제 4
Q 등속 직선 운동을 하는 물체에 작용하는 알짜힘은?
o 운동 방향으로 일정하다
o 점점 커진다
o* 0이다
o 운동 반대 방향이다
:: 관성 법칙 — 알짜힘이 0이면 등속 직선 운동을 계속한다.

= 확인 문제 5
Q 질량 60 kg인 사람이 아래로 2 m/s²로 가속하는 엘리베이터 안 체중계 위에 있다. 체중계가 사람을 미는 힘은? (g = 9.8 m/s²)
o 708 N
o 588 N
o* 468 N
o 120 N
:: 588 − N = 60 × 2 → N = 468 N (가볍게 느껴진다)

= 생활 속 운동 법칙 | 사례
* 🪢 안전띠 :: 급정거 때 관성으로 튀어 나가는 몸을 붙잡는다
* 🧺 식탁보 빼기 :: 빠르게 당기면 그릇은 관성으로 제자리에
* 🚀 로켓 :: 가스를 뒤로 밀고(작용) 가스가 로켓을 민다(반작용)
* 🏊 수영 :: 물을 뒤로 밀어 앞으로 나아간다
* 🛗 엘리베이터 :: 출발할 때 몸이 무겁게, 멈출 때 가볍게 느껴진다
* 🔫 반동 :: 총알을 쏘면 총이 뒤로 밀린다

= 서술형 도전 | 생각 넓히기
? 책상 위에 놓인 책에 작용하는 중력과 평형을 이루는 힘, 중력의 반작용을 각각 쓰시오. :: 평형: 책상이 책을 떠받치는 힘(수직 항력). 반작용: 책이 지구를 당기는 힘.
? 우주 공간에서 우주인이 공구를 던지면 우주인은 어떻게 되는지 운동 법칙으로 설명하시오. :: 작용 반작용 법칙에 따라 공구를 던진 반대 방향으로 우주인이 밀려나며, 외부 힘이 없으므로 관성에 의해 등속 직선 운동을 계속한다.

= 오늘 배운 내용 정리
- 알짜힘이 0 → 정지 또는 [[등속 직선 운동]] (관성 법칙)
- F = [[ma]] → 가속도는 알짜힘에 비례, 질량에 [[반비례]]
- 작용 반작용: 크기 같고, 방향 반대, 서로 [[다른]] 물체에 작용
- 연결된 물체: a = 알짜힘 ÷ [[전체 질량]]
- 마찰력이 있으면 알짜힘 = 끄는 힘 − [[마찰력]]

= 나가기 전 한 문제 | 형성평가
? 마찰 없는 수평면 위 수레(3 kg)와 추(1 kg)가 도르래로 연결되어 있을 때 가속도와 장력을 구하시오. (g = 9.8 m/s²) :: a = 1 × 9.8 ÷ (3 + 1) = 2.45 m/s², T = 3 × 2.45 = 7.35 N
