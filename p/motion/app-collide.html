<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>충돌 실험 트랙 · 고2 물리학 힘과 운동</title>
<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/app.js"></script>
<script src="../../assets/hskit.js"></script>
</head>
<body>
<script>
const app = AppKit({
  id: 'pcollide', title: '충돌 실험 트랙', unit: '고2 · 물리학 · 37 힘과 운동', back: '../../index.html#phys', sim: 'sim.html#momentum',
  lead: '마찰 없는 트랙 위의 수레로 <b>뉴턴 운동 법칙</b>과 <b>운동량 보존</b>을 시험해 보세요. 미션에 맞는 힘, 속도, 질량을 계산해서 한 번에 성공시키면 점수가 높아요!',
  howto: ['슬라이더로 힘·속도·질량을 정하고 <b>[실행]</b>을 누르세요.', '충돌 전후의 <b>운동량 막대</b>를 비교해 보세요. 합은 항상 같아요!', '목표 속도와 ±0.05 m/s 안으로 맞으면 성공.'],
  recap: '<b>뉴턴 제2법칙</b> F = ma, 등가속도 운동 v = v₀ + at. <b>운동량</b> p = mv, 외력이 없으면 충돌 전후 운동량의 합은 보존된다: m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′. 두 물체가 한 덩어리가 되는 충돌(완전 비탄성)에서는 운동 에너지가 일부 열·소리로 바뀌어 줄어들고, 탄성 충돌에서는 운동 에너지도 보존된다(같은 질량이면 속도를 맞바꾼다). 정지해 있던 두 물체가 서로 밀어 떨어지면 운동량 합이 0이므로 m₁v₁ = −m₂v₂ — 가벼운 쪽이 더 빠르게 반대로 움직인다.',
  startLabel: '실험 시작'
});
const {S, sfx, toast} = app, D = Draw;
const LV = [
  {t: 'push', m: 2, T: 2, goal: 3, why: '2초 동안 3 m/s가 되려면 a = 1.5 m/s² → F = ma = 2 × 1.5 = 3 N.'},
  {t: 'stick', mA: 1, mB: 1, goal: 2, why: '붙는 충돌: 1 × v = (1 + 1) × 2 → v = 4 m/s. 운동량 4는 보존되지만 운동 에너지는 8 J → 4 J로 절반이 사라졌어요.'},
  {t: 'elastic', mA: 1, mB: 1, goal: 3, why: '질량이 같은 탄성 충돌에서는 A가 멈추고 B가 A의 속도를 그대로 받아요 → 3 m/s.'},
  {t: 'elastic', mA: 2, mB: 1, goal: 4, why: '탄성 충돌: vB′ = 2mA·vA ÷ (mA + mB) = 4vA ÷ 3 → vA = 3 m/s. 무거운 A도 1 m/s로 계속 앞으로 가요.'},
  {t: 'stick', mA: 1, mB: 3, goal: 1, why: '1 × v = 4 × 1 → v = 4 m/s. 운동 에너지 8 J 중 6 J가 열과 소리로 바뀌었어요.'},
  {t: 'recoil', mA: 2, vA: 1.5, goal: -3, why: '처음 운동량 0 = 2 × 1.5 + mB × (−3) → mB = 1 kg. 가벼운 쪽이 2배 빠르게 반대로!'}];
let ui = {}, X, run = null, tt = 0;
const k = HS(app, {levels: LV, load(L){ run = null; tt = 0;
  const txt = {push: `질량 <b>${L.m} kg</b> 수레를 <b>${L.T}초</b> 동안 일정한 힘으로 밀어 <b>${L.goal} m/s</b>로 만드세요.`, stick: `A(<b>${L.mA} kg</b>)가 정지한 B(<b>${L.mB} kg</b>)에 부딪혀 <b>붙어서</b> 함께 <b>${L.goal} m/s</b>로 움직이게 하세요.`,
    elastic: `A(<b>${L.mA} kg</b>)가 정지한 B(<b>${L.mB} kg</b>)와 <b>탄성 충돌</b>해 B가 <b>${L.goal} m/s</b>가 되게 하세요.`, recoil: `정지한 A(<b>${L.mA} kg</b>)와 B 사이의 용수철을 풀었더니 A가 <b>+${L.vA} m/s</b>로 움직였어요. B가 <b>${L.goal} m/s</b>가 되도록 B의 질량을 정하세요.`}[L.t];
  k.mission(ui.g, txt); ui.lb.textContent = {push: '힘 F', stick: 'A의 속도', elastic: 'A의 속도', recoil: 'B의 질량'}[L.t]; X.el.max = L.t === 'recoil' ? 4 : 8; X.set(L.t === 'recoil' ? .5 : 1); upd(); }});
const unit = () => ({push: ' N', recoil: ' kg'})[k.L().t] || ' m/s';
function result(L, x){ if (L.t === 'push') return {vf: x / L.m * L.T}; if (L.t === 'stick') { const v = L.mA * x / (L.mA + L.mB); return {vA: v, vB: v, out: v}; }
  if (L.t === 'elastic') { const vA = (L.mA - L.mB) / (L.mA + L.mB) * x, vB = 2 * L.mA / (L.mA + L.mB) * x; return {vA, vB, out: vB}; } return {vA: L.vA, vB: -L.mA * L.vA / x, out: -L.mA * L.vA / x}; }
function upd(){ ui.out.textContent = X.v.toFixed(1) + unit(); run = null; tt = 0; }
app.onStart = () => { ui.g = app.panel('미션'); ui.c = app.panel('조건');
  X = k.slider(ui.c, {label: '값', min: .5, max: 8, step: .1, val: 1, fmt: v => v.toFixed(1), on: upd}); ui.lb = X.wrap.querySelector('span'); ui.out = X.wrap.querySelector('output');
  ui.b = app.panel(''); k.btn(ui.b, '▶ 실행', () => { run = {x: X.v}; tt = 0; sfx.whoosh(); }); k.begin(); };
function judge(){ const L = k.L(), r = result(L, run.x), v = L.t === 'push' ? r.vf : r.out;
  if (Math.abs(v - L.goal) <= .05) k.win(ui.g, L.why, `${v.toFixed(2)} m/s`); else k.fail(`결과 ${v.toFixed(2)} m/s — 목표 ${L.goal} m/s`); }
app.step = dt => { if (!run) return; const L = k.L(), end = L.t === 'push' ? L.T + .6 : 3.2; const was = tt; tt = Math.min(end, tt + dt); if (was < end && tt >= end) judge(); };
k.draw((g, W, H) => { const L = k.L(), ty = H * .48, sc = (W - 60) / 14, X0 = 30, PX = x => X0 + x * sc;
  g.fillStyle = '#eef1f6'; g.fillRect(0, 0, W, H); g.fillStyle = '#9aa6b8'; g.fillRect(20, ty, W - 40, 8); for (let x = 0; x <= 14; x++) { g.fillStyle = '#55606e'; g.fillRect(PX(x), ty + 8, 1, 6); D.text(g, x + ' m', PX(x), ty + 22, {size: 10, color: '#55606e'}); }
  const cart = (x, m, lab, col) => { const w = 26 + m * 10, h = 22 + m * 4; g.fillStyle = col; D.rr(g, PX(x) - w / 2, ty - h - 8, w, h, 6); g.fill(); g.fillStyle = '#222'; g.beginPath(); g.arc(PX(x) - w / 3, ty - 4, 5, 0, 7); g.arc(PX(x) + w / 3, ty - 4, 5, 0, 7); g.fill(); D.text(g, `${lab} ${m}kg`, PX(x), ty - h / 2 - 8, {size: 11.5, weight: 700, color: '#fff'}); };
  const r = run ? result(L, run.x) : null;
  if (L.t === 'push') { const a = run ? run.x / L.m : 0, t = Math.min(tt, L.T), x = 1 + .5 * a * t * t + (tt > L.T ? a * L.T * (tt - L.T) : 0), v = a * Math.min(tt, L.T); cart(Math.min(13.5, x), L.m, 'A', '#2f6fd0');
    if (run && tt < L.T) D.arrow(g, PX(x) - 70, ty - 26, PX(x) - 36, ty - 26, '#d0533f', 4);
    D.text(g, `t = ${Math.min(tt, L.T).toFixed(2)} s   v = ${v.toFixed(2)} m/s`, W / 2, H * .2, {size: 18, weight: 700, color: '#1d3a58'}); return; }
  const tc = 1.2; let xa, xb; const v0 = L.t === 'recoil' ? 0 : run ? run.x : 0, mB = L.t === 'recoil' ? (run ? run.x : X.v) : L.mB, gm = ((26 + L.mA * 10) + (26 + mB * 10)) / 2 / sc;
  if (L.t === 'recoil') { xa = 6.6 + gm / 2 + (r ? r.vA * tt * .6 : 0); xb = 6.6 - gm / 2 + (r ? r.vB * tt * .6 : 0); }
  else { const xc = 6.2; if (!run || tt < tc) { xa = xc - v0 * (tc - tt) * .6 * (run ? 1 : 0) - (run ? 0 : 3); xb = xc + gm; if (!run) xa = 2.5; else xa = Math.max(.5, xc - v0 * .6 * (tc - tt)); }
    else { xa = xc + r.vA * (tt - tc) * .6; xb = xc + gm + r.vB * (tt - tc) * .6; } if (L.t === 'stick' && run && tt >= tc) xb = xa + gm; }
  if (L.t === 'recoil' && !run) { g.strokeStyle = '#555'; g.lineWidth = 2; g.beginPath(); for (let i = 0; i <= 8; i++) g.lineTo(PX(6.3 + i * .07), ty - 22 + (i % 2 ? 6 : -6)); g.stroke(); }
  cart(Math.min(13.6, Math.max(.4, xa)), L.mA, 'A', '#2f6fd0'); cart(Math.min(13.6, Math.max(.4, xb)), mB, 'B', '#d0533f');
  // 운동량 막대
  const after = run && tt >= (L.t === 'recoil' ? 0 : tc), pA = after ? L.mA * r.vA : (L.t === 'recoil' ? 0 : L.mA * v0), pB = after ? mB * r.vB : 0, by = H * .78, s2 = (W - 160) / 2 / 16;
  D.text(g, after ? '충돌 후 운동량' : '충돌 전 운동량', 30, by - 30, {size: 13, weight: 700, align: 'left'});
  [[pA, '#2f6fd0', 'A'], [pB, '#d0533f', 'B'], [pA + pB, '#2b2a26', '합']].forEach(([p, col, n], i) => { const y = by - 10 + i * 18, cx = W / 2; g.fillStyle = col; g.fillRect(Math.min(cx, cx + p * s2), y - 6, Math.abs(p * s2), 12); D.text(g, `${n} ${p.toFixed(1)} kg·m/s`, 30, y, {size: 11.5, align: 'left', color: col, weight: 700}); });
  g.strokeStyle = '#888'; g.beginPath(); g.moveTo(W / 2, by - 20); g.lineTo(W / 2, by + 36); g.stroke();
});
</script>
</body>
</html>
