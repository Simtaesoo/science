# 등가속도 직선 운동 | 가속도가 일정한 운동의 분석 | 고등학교 물리학 · 01 힘과 운동 · 2차시 | 2022 개정 교육과정 [12물리01-02]

= 오늘의 학습 목표 | 2차시
^ 물체의 운동을 **변위, 속도, 가속도**로 나타낼 수 있다.
^ **등가속도 직선 운동**의 세 가지 식을 이용해 운동을 분석할 수 있다.
^ **속도–시간**, **위치–시간** 그래프의 기울기와 넓이를 해석할 수 있다.
% 흐름: 생각 열기 5분 → 변위·속도·가속도 8분 → 수레의 운동(시뮬레이션) 12분 → 식과 그래프 10분 → 예제·문항 10분

= 고속도로의 '안전거리 확인' 표지판 | 생각 열기
* 🚗 100 km/h :: 안전거리 100 m를 지키라고 한다
* 🛑 급제동 :: 속력이 2배면 멈추는 거리는 몇 배?
* 🛫 비행기 이륙 :: 활주로를 달리며 일정하게 빨라진다
* 🎢 자이로드롭 :: 떨어지는 동안 점점 빨라진다
? 속력이 2배가 되면 제동 거리도 2배일까? :: 아니다. 일정하게 감속할 때 제동 거리는 처음 속력의 **제곱**에 비례 — **4배**가 된다. 오늘 식으로 확인하자.

= 이전에 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 등속 운동 | 속력 일정, 거리–시간 그래프 직선 |
| 자유 낙하 | v = gt, s = ½gt² (통합과학1) |
| 운동량·충격량 | p = mv, 충격량 = Ft |
? 자유 낙하는 가속도가 얼마인 운동일까? :: 가속도가 **g = 9.8 m/s²**로 일정한 운동 — 오늘 배울 등가속도 운동의 한 예이다.

## 운동의 표현 | 변위, 속도, 가속도

= 운동을 나타내는 양
| 물리량 | 뜻 | 단위 |
|+ 변위 | 위치의 변화량 (방향 포함) | m |
|+ 속도 | 변위 ÷ 걸린 시간 | m/s |
|+ 가속도 | 속도 변화량 ÷ 걸린 시간 | m/s² |
>+ 이동 거리·속력은 크기만, 변위·속도·가속도는 **크기와 방향**을 가진다 (벡터).

= 등가속도 직선 운동의 식
! v = v₀ + at
! s = v₀t + ½at²
! v² − v₀² = 2as
~ v₀: 처음 속도, v: 나중 속도, a: 가속도, s: 변위, t: 시간 — 세 식 중 모르는 양이 없는 식을 고른다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#accel | 처음 속도 4 m/s, 가속도 2 m/s²로 [시작]하고 시간별 속도와 위치를 기록한 뒤 식으로 확인하자.
% 표를 채운 뒤 v = 4 + 2t, s = 4t + t²에 대입해 일치하는지 확인

= 수레의 운동 | 시뮬레이션 기록
| 시간 (s) | 0 | 1 | 2 | 3 | 4 |
|+ 속도 (m/s) | 4 | 6 | 8 | [[10]] | [[12]] |
|+ 위치 (m) | 0 | 5 | 12 | [[21]] | [[32]] |
- 확인: t = 3 s → v = 4 + 2 × 3 = 10 m/s, s = 4 × 3 + ½ × 2 × 3² = 21 m ✔

= 그래프로 보면
C 속도–시간 그래프 | 시간 (s) | 속도 (m/s) | 속도:0,4 1,6 2,8 3,10 4,12
||
C 위치–시간 그래프 | 시간 (s) | 위치 (m) | 위치:0,0 1,5 2,12 3,21 4,32
- 속도–시간: 기울기 = (12 − 4) ÷ 4 = [[2 m/s²]] = 가속도, 넓이 = (4 + 12) × 4 ÷ 2 = [[32 m]] = 변위
- 위치–시간: 포물선, 접선의 기울기 = [[속도]]

= 예제 1 · 제동 거리 | 적용
- 30 m/s로 달리던 자동차가 일정하게 감속하여 5초 만에 멈추었다.
^+ a = (0 − 30) ÷ 5 = **−6 m/s²**
^+ s = (30 + 0) × 5 ÷ 2 = **75 m** (속도–시간 그래프 넓이)
^+ 검산: v² − v₀² = 2as → 0 − 900 = 2 × (−6) × s → s = **75 m** ✔

= 예제 2 · 속력이 2배면 | 적용
- 같은 가속도(−6 m/s²)로 60 m/s에서 멈추면 제동 거리는?
^+ s = (0 − v₀²) ÷ 2a = −3600 ÷ (−12) = **300 m**
^+ 30 m/s일 때 75 m의 **4배**
>+ 제동 거리 s = v₀² ÷ 2|a| → 처음 속력의 **제곱**에 비례

= 예제 3 · 되돌아오는 물체 | 적용
- 처음 속도 10 m/s, 가속도 −2 m/s²인 물체가 다시 처음 위치로 돌아오는 시각은?
^+ s = 10t + ½ × (−2) × t² = 10t − t²
^+ s = 0 → t(10 − t) = 0 → **t = 10 s**
^+ 가장 멀리 간 때: v = 0 → 10 − 2t = 0 → t = 5 s, 그때 s = **25 m**

= 확인 문제 1
Q 속도–시간 그래프에서 그래프 아래의 넓이가 뜻하는 것은?
o 가속도
o 속도
o* 변위
o 힘
:: 넓이 = 속도 × 시간 = 변위, 기울기 = 가속도

= 확인 문제 2
Q 정지 상태에서 가속도 3 m/s²로 4초 동안 운동한 물체의 변위는?
o 12 m
o* 24 m
o 36 m
o 48 m
:: s = ½ × 3 × 4² = 24 m

= 확인 문제 3
Q 20 m/s로 달리던 차가 가속도 −4 m/s²로 멈출 때까지 이동한 거리는?
o 25 m
o* 50 m
o 80 m
o 100 m
:: 0 − 400 = 2 × (−4) × s → s = 50 m

= 확인 문제 4
Q 속력은 일정한데 가속도 운동인 경우는?
o 정지한 물체
o 직선 위를 등속으로 달리는 차
o* 등속 원운동하는 물체
o 일정하게 빨라지는 수레
:: 속력이 같아도 운동 방향이 계속 바뀌면 속도가 변하므로 가속도 운동이다.

= 확인 문제 5 · 그래프 해석
Q 속도–시간 그래프가 (0 s, 10 m/s)에서 (4 s, 2 m/s)까지 직선이다. 이 동안의 가속도와 변위는?
o −2 m/s², 48 m
o* −2 m/s², 24 m
o 2 m/s², 24 m
o −8 m/s², 12 m
:: a = (2 − 10) ÷ 4 = −2 m/s², 변위 = (10 + 2) × 4 ÷ 2 = 24 m (사다리꼴 넓이)

= 생활 속 등가속도 운동 | 사례
* 🚗 제동 거리 :: 속력 2배 → 제동 거리 4배
* 🛫 이륙 활주 :: 일정한 가속도로 이륙 속도에 도달
* 🏀 위로 던진 공 :: 가속도 −g로 올라갔다 내려온다
* 🚇 지하철 :: 출발·정차할 때 거의 일정한 가속도
* 🛷 썰매 :: 경사면에서 일정하게 빨라진다
* 🚀 로켓 발사 :: 초기에는 가속도가 커진다(등가속도가 아님)

= 서술형 도전 | 생각 넓히기
? 제동 거리가 처음 속력의 제곱에 비례한다는 것이 교통 안전과 어떤 관련이 있는지 쓰시오. :: s = v₀²/2a이므로 속력이 2배가 되면 제동 거리는 4배가 된다. 과속하면 멈추는 데 훨씬 긴 거리가 필요해 사고 위험이 크게 늘어난다.
? 공을 20 m/s로 똑바로 위로 던졌다. 최고점까지의 시간과 높이를 구하시오. (g = 9.8 m/s²) :: 최고점에서 v = 0 → 0 = 20 − 9.8t → t ≈ 2.04 s, 높이 = v₀² ÷ 2g = 400 ÷ 19.6 ≈ 20.4 m

= 오늘 배운 내용 정리
- 가속도 = [[속도 변화량 ÷ 걸린 시간]] (m/s²)
- v = [[v₀ + at]], s = [[v₀t + ½at²]], v² − v₀² = [[2as]]
- 속도–시간 그래프: 기울기 = [[가속도]], 넓이 = [[변위]]
- 위치–시간 그래프: 접선의 기울기 = [[속도]]
- 제동 거리는 처음 속력의 [[제곱]]에 비례

= 나가기 전 한 문제 | 형성평가
? 정지 상태에서 출발한 수레가 일정한 가속도로 10 s 동안 50 m를 이동했다. 가속도와 10 s일 때의 속도를 구하시오. :: 50 = ½ × a × 10² → a = 1 m/s², v = 0 + 1 × 10 = 10 m/s
