# 힘의 평형과 돌림힘 | 쓰러지지 않는 구조물의 비밀 | 고등학교 물리학 · 01 힘과 운동 · 1차시 | 2022 개정 교육과정 [12물리01-01]

= 오늘의 학습 목표 | 1차시
^ 물체를 회전시키는 효과인 **돌림힘**을 힘과 회전축까지의 거리로 설명할 수 있다.
^ 물체가 **평형**을 이루려면 알짜힘과 알짜 돌림힘이 모두 0이어야 함을 설명할 수 있다.
^ **무게 중심**과 받침면을 이용해 구조물의 **안정성**을 분석할 수 있다.
% 흐름: 생각 열기 5분 → 돌림힘 10분 → 평형 조건 10분 → 안정성 10분 → 문항 10분
% 2022 개정 [12물리01-01] 해설: 일상생활의 다양한 상황에서 돌림힘을 적용하되, 동역학적 상황이나 돌림힘의 기준점이 2개 이상이 되는 등 복잡한 상황은 다루지 않는다. 이 차시는 단원의 첫 차시로 운영한다.

= 문손잡이는 왜 경첩 반대쪽에 있을까? | 생각 열기
* 🚪 문 :: 경첩 가까이를 밀면 잘 열리지 않는다
* 🔧 렌치 :: 손잡이가 길수록 볼트가 쉽게 풀린다
* ⚖️ 시소 :: 무거운 사람이 앞으로 당겨 앉으면 균형이 맞는다
* 🏗️ 타워 크레인 :: 반대쪽에 무거운 추를 매단다
? 같은 크기의 힘인데도 회전시키는 효과가 다른 까닭은? :: 회전축에서 힘이 작용하는 곳까지의 **거리**가 다르기 때문이다. 멀수록 회전 효과(돌림힘)가 크다.

= 이전에 배운 내용 떠올리기 | 복습 · 중1 힘의 작용
- 한 물체에 작용하는 힘들의 합 → [[알짜힘]]
- 알짜힘이 0이면 → 운동 상태가 [[변하지 않는다]]
- 크기가 같고 방향이 반대이며 같은 작용선 위의 두 힘 → 힘의 [[평형]]
? 알짜힘이 0이면 물체는 항상 가만히 있을까? :: 그렇지 않다. 크기가 같고 방향이 반대인 두 힘이 **서로 다른 작용선**에 작용하면 물체가 **회전**할 수 있다.

## 돌림힘 | 회전시키는 효과

= 돌림힘
! 돌림힘 = 힘 × 회전축에서 힘의 작용선까지의 수직 거리 (τ = rF)
- 단위: N·m
- 힘의 크기가 **클수록**, 회전축에서 **멀수록** 돌림힘이 크다.
- 힘의 방향이 회전축을 향하면(거리 0) 회전시키지 못한다.
>+ 시계 방향과 시계 반대 방향의 돌림힘을 구별한다.

= 예제 1 · 렌치로 볼트 풀기 | 적용
- 볼트를 푸는 데 30 N·m의 돌림힘이 필요하다.
^+ 길이 0.2 m 렌치 끝을 수직으로 밀 때: F = 30 ÷ 0.2 = **150 N**
^+ 길이 0.5 m 렌치를 쓰면: F = 30 ÷ 0.5 = **60 N**
>+ 손잡이가 긴 공구일수록 작은 힘으로 큰 돌림힘을 낼 수 있다.

## 평형 조건 | 움직이지도, 돌지도 않는다

= 물체의 평형 조건
^ 알짜힘 = 0 → 물체의 중심이 움직이지 않는다 (병진 평형)
^ 알짜 돌림힘 = 0 → 물체가 회전하지 않는다 (회전 평형)
>+ 회전축을 기준으로 **시계 방향 돌림힘의 합 = 시계 반대 방향 돌림힘의 합**

= 예제 2 · 시소의 균형 | 적용
- 회전축에서 1.5 m 떨어진 곳에 무게 400 N인 학생 A가 앉아 있다. 무게 600 N인 학생 B는 반대쪽 어디에 앉아야 할까?
^+ A의 돌림힘 = 400 × 1.5 = **600 N·m**
^+ B의 돌림힘 = 600 × x = 600 → x = **1.0 m**
^+ 받침점이 시소를 떠받치는 힘 = 400 + 600 = **1000 N** (알짜힘 = 0)

= 예제 3 · 모빌 만들기 | 적용
- 가벼운 막대의 왼쪽 끝에 2 N, 오른쪽 끝에 6 N 장식을 달았다. 막대 길이는 40 cm이다.
^+ 실을 매달 위치를 왼쪽 끝에서 x라 하면: 2 × x = 6 × (40 − x)
^+ 8x = 240 → x = **30 cm** (무거운 쪽에 가깝게)
>+ 무게가 3배인 쪽까지의 거리는 1/3배

## 무게 중심과 안정성 | 쓰러지지 않으려면

= 무게 중심과 안정성
- **무게 중심**: 물체의 모든 부분에 작용하는 중력이 한 점에 작용하는 것처럼 볼 수 있는 점
- 무게 중심에서 내린 연직선이 **받침면 안**에 있으면 넘어지지 않는다.
- 무게 중심이 **낮을수록**, 받침면이 **넓을수록** 안정하다.
>+ 기울어져도 무게 중심의 연직선이 받침면 안에 있으면 중력의 돌림힘이 물체를 **되돌린다.**

= 구조물의 안정성 | 사례
* 🗼 송전탑·에펠탑 :: 아래가 넓고 위로 갈수록 좁아 무게 중심이 낮다
* 🏗️ 타워 크레인 :: 반대쪽 평형추로 돌림힘의 균형을 맞춘다
* 🌉 다리 :: 교각이 받치는 힘과 다리 무게의 돌림힘이 평형
* 🚌 2층 버스 :: 무거운 엔진·연료 탱크를 아래쪽에 둔다
* 🤸 줄타기 :: 긴 장대로 무게 중심을 낮추고 균형을 조절

= 확인 문제 1
Q 문을 가장 쉽게 열 수 있는 방법은?
o 경첩 가까이를 문면에 수직으로 민다
o* 경첩에서 가장 먼 곳을 문면에 수직으로 민다
o 경첩에서 먼 곳을 경첩 쪽으로 민다
o 경첩 바로 위를 민다
:: 돌림힘은 거리가 멀고 힘이 문면에 수직일 때 가장 크다.

= 확인 문제 2
Q 물체가 회전하지도, 움직이지도 않는 평형 상태의 조건은?
o 알짜힘만 0이다
o 알짜 돌림힘만 0이다
o* 알짜힘과 알짜 돌림힘이 모두 0이다
o 모든 힘의 크기가 같다
:: 병진 평형과 회전 평형을 모두 만족해야 한다.

= 확인 문제 3
Q 회전축에서 2 m 떨어진 곳에 300 N이 작용한다. 반대쪽 1.5 m 지점에 얼마의 힘을 주어야 평형인가?
o 225 N
o 300 N
o* 400 N
o 450 N
:: 300 × 2 = F × 1.5 → F = 400 N

= 서술형 도전 | 생각 넓히기
? 짐을 많이 실은 트럭이 짐을 위쪽에 높이 쌓으면 커브 길에서 위험한 까닭을 무게 중심으로 쓰시오. :: 무게 중심이 높아져 조금만 기울어도 무게 중심의 연직선이 받침면(바퀴 사이) 밖으로 나가 넘어지기 쉽기 때문이다.
? 타워 크레인이 무거운 짐을 멀리 옮길 때 넘어지지 않는 원리를 돌림힘으로 쓰시오. :: 반대쪽 평형추가 만드는 돌림힘이 짐이 만드는 돌림힘과 균형을 이루어 알짜 돌림힘이 0에 가깝게 유지되기 때문이다.

= 오늘 배운 내용 정리
- 돌림힘 = 힘 × 회전축까지의 수직 [[거리]] (단위 N·m)
- 평형 조건: 알짜힘 = 0, 알짜 [[돌림힘]] = 0
- 시계 방향 돌림힘의 합 = 시계 반대 방향 돌림힘의 합
- 무게 중심이 [[낮고]] 받침면이 넓을수록 안정하다.

= 나가기 전 한 문제 | 형성평가
? 회전축에서 왼쪽 0.6 m에 무게 500 N인 사람이 앉아 있을 때, 오른쪽 1.0 m 지점에 앉아 시소의 균형을 맞출 사람의 무게를 구하시오. :: 500 × 0.6 = W × 1.0 → W = 300 N
