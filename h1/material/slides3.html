# 반도체·초전도체·그래핀 | 물질의 구조를 설계하다 | 고등학교 통합과학1 · 04 지각·생명체 구성 물질과 신소재 · 3차시 | 2022 개정 교육과정 [통과1 Ⅱ]

= 오늘의 학습 목표 | 3차시
^ **반도체**의 특성과 도핑의 효과를 설명할 수 있다.
^ **초전도체**의 성질(저항 0, 마이스너 효과)과 활용을 설명할 수 있다.
^ **그래핀·탄소 나노튜브** 등 신소재의 특성을 구조와 관련지어 설명할 수 있다.
% 흐름: 생각 열기 5분 → 반도체 10분 → 온도와 저항(시뮬레이션) 12분 → 초전도체·그래핀 10분 → 문항·토의 8분

= 스마트폰 한 대 속의 신소재 | 생각 열기
* 📱 반도체 칩 :: 손톱만 한 칩에 수십억 개의 트랜지스터
* 💡 LED 화면 :: 반도체가 전기를 빛으로 바꾼다
* 🏥 MRI :: 초전도 자석으로 몸속을 찍는다
* 📲 휘어지는 화면 :: 얇고 강한 신소재가 필요하다
? 같은 원소로 이루어져도 구조를 바꾸면 성질이 달라질까? :: 그렇다. 탄소만으로 무른 흑연, 단단한 다이아몬드, 강하고 전기가 통하는 **그래핀**이 만들어진다 — 구조를 설계하는 것이 신소재의 핵심!

= 지난 시간 복습 | 1·2차시
- 지각에 두 번째로 많은 원소 → [[규소]]
- 탄소는 원자가 전자 [[4]]개 → 다양한 구조
- 같은 단위체도 **배열과 구조**에 따라 성질이 달라진다.
? 규소와 탄소는 신소재에서 어떻게 쓰일까? :: 규소는 **반도체**의 주재료, 탄소는 **그래핀·탄소 나노튜브**의 재료이다.

## 반도체 | 전기 전도성을 조절하다

= 반도체
! 반도체: 전기 전도성이 도체와 부도체의 중간인 물질
- 순수한 규소에 불순물을 조금 넣으면(==도핑==) 전기 전도성이 커진다.
- 금속과 달리 온도가 높을수록 저항이 ==작아진다.==
- 활용: 컴퓨터·스마트폰 칩, **LED**, **태양 전지**, 센서

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#new | [반도체]와 [초전도체]에서 온도를 낮추며 전기 저항의 변화를 관찰하자. 금속(점선)과 비교하자.
% 세 물질이 온도를 낮출 때 서로 다르게 반응하는 것을 표로 정리하게 하기

= 온도와 전기 저항 | 시뮬레이션 기록
| 물질 | 온도가 낮아질 때 저항 | 까닭·특징 |
|+ 금속 | 작아짐 | 원자 진동이 줄어 전자가 덜 방해받음 |
|+ 반도체 | [[커짐]] | 자유롭게 움직이는 전자 수가 줄어듦 |
|+ 초전도체 | 임계 온도 아래에서 [[0]] | 자석이 떠오름 (마이스너 효과) |

= 그래프로 보면 | 온도에 따른 저항 (개념도)
C 온도에 따른 전기 저항 (예시) | 온도 (K) | 상대적 저항 | 금속:50,10 150,30 300,60 | 반도체:50,95 100,70 200,40 300,25 | 초전도체:0,0 80,0 92,0 95,14 200,18 300,22
~ 초전도체는 임계 온도(이 예에서는 약 92 K) 아래에서 저항이 갑자기 0이 된다.
% 그래프 값은 경향을 보여 주기 위한 예시

## 초전도체와 그래핀 | 미래를 바꿀 소재

= 초전도체
! 초전도체: 임계 온도 이하에서 전기 저항이 0이 되는 물질
- **마이스너 효과**: 외부 자기장을 밀어내어 자석 위에 ==떠오른다.==
- 활용: **MRI**, **자기 부상 열차**, 손실 없는 송전선(연구 중)
>+ 과제: 대부분 매우 **낮은 온도**에서만 초전도 → 냉각 비용이 크다 (상온 초전도체 연구)

= 그래핀과 탄소 나노튜브
| 신소재 | 구조 | 특성 | 활용 |
|+ 그래핀 | 탄소가 육각형 벌집 모양으로 연결된 원자 한 층 | 얇고 강하며 잘 휘고 전기가 잘 통함 | 휘어지는 디스플레이 |
|+ 탄소 나노튜브 | 그래핀을 원통으로 만 구조 | 가볍고 강함 | 자전거 프레임, 전극 |

= 예제 1 · 그래핀은 얼마나 얇을까? | 적용
- 그래핀 한 층의 두께는 약 0.34 nm(1 nm = 10⁻⁹ m)이다. 두께 1 mm인 흑연에는 대략 몇 층이 쌓여 있을까?
^+ 1 mm = 10⁻³ m = **1 000 000 nm**
^+ 1 000 000 ÷ 0.34 ≈ **2 900 000층** (약 300만 층)
>+ 연필 선 한 줄에도 그래핀이 수많은 층으로 쌓여 있다.

= 예제 2 · 저항이 0이면? | 적용
- 송전선에서 열로 잃는 전력은 저항에 비례한다(전류가 같을 때). 저항이 0.5 Ω에서 0 Ω이 되면?
^+ 손실 전력 ∝ 저항 → 0.5 × (전류)² → **0**
^+ 송전 과정의 열 손실이 **없어진다.**
^+ 하지만 임계 온도 이하로 유지하는 **냉각 장치**에 에너지가 든다 → 실제 이득을 따져 봐야 한다.

= 예제 3 · 구조와 성질 연결하기 | 적용
| 물질 | 구조의 특징 | 나타나는 성질 |
|+ 다이아몬드 | 탄소가 3차원으로 모두 공유 결합 | [[매우 단단함]] |
|+ 흑연 | 탄소 층이 약하게 쌓임 | [[무르고 층이 벗겨짐]] |
|+ 그래핀 | 흑연의 한 층 | [[얇고 강하며 잘 휨]] |
|+ 탄소 나노튜브 | 그래핀을 원통으로 | [[가볍고 강함]] |

= 생활 속 신소재 | 사례
* ☀️ 태양 전지 :: 반도체가 빛 에너지를 전기 에너지로
* 🚄 자기 부상 열차 :: 초전도 자석으로 선로 위에 뜬다
* 🏥 MRI :: 초전도 코일로 강한 자기장을 만든다
* 🚲 탄소 프레임 :: 가볍고 강한 자전거·골프채
* 🧥 연잎 효과 섬유 :: 생체 모방 — 물이 스며들지 않는다
* 🦎 벨크로 :: 도꼬마리 열매를 본뜬 찍찍이

= 확인 문제 1
Q 반도체에 대한 설명으로 옳은 것은?
o 전기 전도성이 금속보다 항상 크다
o* 불순물을 첨가하면 전기 전도성이 커진다
o 온도가 높을수록 저항이 커진다
o 전기가 전혀 통하지 않는다
:: 도핑으로 전기 전도성을 조절할 수 있고, 온도가 높을수록 저항이 작아진다.

= 확인 문제 2
Q 초전도체가 외부 자기장을 밀어내어 자석 위에 뜨는 현상은?
o 도핑
o 변성
o* 마이스너 효과
o 상보적 결합
:: 초전도 상태에서 자기장을 밀어내는 현상을 마이스너 효과라 한다.

= 확인 문제 3
Q 그래핀에 대한 설명으로 옳지 않은 것은?
o 탄소 원자가 육각형으로 연결되어 있다
o 원자 한 층 두께이다
o 전기가 잘 통한다
o* 규소 원자로만 이루어져 있다
:: 그래핀은 탄소로 이루어진 신소재이다.

= 확인 문제 4
Q 초전도 송전선이 아직 널리 쓰이지 않는 가장 큰 까닭은?
o 저항이 너무 커서
o* 매우 낮은 온도로 냉각해야 해서
o 자기장을 만들 수 없어서
o 무게가 너무 가벼워서
:: 대부분의 초전도체는 매우 낮은 온도에서만 초전도 상태가 되어 냉각 비용이 크다.

= 서술형 도전 | 생각 넓히기
? 초전도체로 송전선을 만들었을 때의 장점과 해결해야 할 과제를 쓰시오. :: 장점: 저항이 0이라 전력 손실이 없다. 과제: 대부분 매우 낮은 온도에서만 초전도 상태가 되므로 냉각 비용이 크다(상온 초전도체 개발 필요).
? 새로운 신소재가 개발될 때 고려해야 할 환경적·윤리적 문제를 쓰시오. :: 나노 물질이 생물체에 미치는 영향, 생산·폐기 과정의 환경 오염, 희귀 원료 채굴로 인한 자원 고갈과 지역 갈등 등을 함께 고려해야 한다.
% 서술형 2는 모둠 토의 후 발표로 운영 가능

= 오늘 배운 내용 정리
- 전기 전도성이 도체와 부도체의 중간 → [[반도체]], 불순물 첨가 → [[도핑]]
- 반도체는 온도가 높을수록 저항이 [[작아진다]].
- 임계 온도 이하에서 저항 0 → [[초전도체]], 자기장을 밀어냄 → [[마이스너 효과]]
- 탄소가 육각형 벌집 모양으로 연결된 원자 한 층 → [[그래핀]]
- 신소재의 성질은 물질의 [[구조]]가 결정한다.

= 나가기 전 한 문제 | 형성평가
? 온도를 낮출 때 금속, 반도체, 초전도체의 전기 저항이 각각 어떻게 변하는지 쓰시오. :: 금속: 작아진다 / 반도체: 커진다 / 초전도체: 임계 온도 아래에서 0이 된다.
