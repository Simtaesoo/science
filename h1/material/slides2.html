= 오늘의 학습 목표 | 2차시
^ 생명체 구성 물질이 **탄소 화합물**인 까닭을 탄소의 결합 특성으로 설명할 수 있다.
^ **단백질**이 아미노산으로부터 만들어지는 과정과 입체 구조의 중요성을 설명할 수 있다.
^ **핵산(DNA)**의 구조와 염기의 **상보적 결합**을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 탄소 화합물 7분 → 단백질 10분 → DNA(시뮬레이션) 13분 → 계산·문항 10분

= 지각은 규소, 생명체는? | 생각 열기
* 🪨 지각 :: 산소 + 규소가 대부분
* 🧍 사람의 몸 :: 질량의 약 65 % 산소, 18 % 탄소, 10 % 수소, 3 % 질소
* 🍳 달걀 프라이 :: 투명한 흰자가 열을 받으면 하얗게 굳는다
* 🧬 DNA :: 한 세포 속 DNA를 펴면 약 2 m
? 물을 빼고 보면 생명체에 가장 많은 원소는 무엇일까? :: **탄소**. 단백질, 핵산, 탄수화물, 지질 모두 탄소를 뼈대로 하는 **탄소 화합물**이다.

= 지난 시간 복습 | 1차시
- 지각의 원소: [[산소]] > [[규소]] > 알루미늄
- 규소 1 + 산소 4 → [[규산염 사면체]], 산소를 공유하며 다양한 구조
? 규소와 탄소는 같은 14족이다. 둘 다 어떤 결합 특징을 가질까? :: 원자가 전자가 **4개**라 최대 4개의 원자와 공유 결합할 수 있다. 탄소는 특히 탄소끼리 길게 이어져 다양한 구조를 만든다.

## 탄소 화합물 | 생명의 뼈대

= 생명체를 구성하는 물질
- 주요 원소: ==탄소, 수소, 산소, 질소== (인, 황)
- 탄소는 원자가 전자 **4개** → 최대 4개의 원자와 공유 결합
- 탄소끼리 **사슬, 가지, 고리** 등 다양한 구조를 만든다.
>+ 작은 **단위체**가 반복 결합하여 큰 분자(**중합체**)를 만든다 — 단백질, 핵산

## 단백질 | 아미노산 사슬의 입체 접기

= 단백질
! 단백질: 단위체인 아미노산(20종류)이 펩타이드 결합으로 연결된 뒤 접혀 고유한 입체 구조를 이룬 물질
- 아미노산의 **종류, 수, 배열 순서** → 단백질의 종류 결정
- 입체 구조가 **기능**을 결정한다 (효소, 호르몬, 항체, 근육, 머리카락)
>+ 높은 온도·강한 산 → 입체 구조가 변형(**변성**) → 기능 상실

= 예제 1 · 아미노산 배열의 가짓수 | 적용
- 아미노산 20종류로 아미노산 3개짜리 사슬을 만들 때 가능한 배열은?
^+ 첫째 자리 20가지 × 둘째 20가지 × 셋째 20가지
^+ 20³ = **8000가지**
^+ 아미노산 100개짜리라면 20¹⁰⁰가지 → 상상할 수 없을 만큼 다양
>+ 단 20종류의 단위체로 수많은 단백질이 만들어지는 까닭

## 핵산 | 유전 정보의 저장소

= 핵산과 DNA
! 핵산: 단위체인 뉴클레오타이드(인산 + 당 + 염기)가 연결된 물질
- DNA의 염기: **A**(아데닌), **T**(타이민), **G**(구아닌), **C**(사이토신)
- DNA는 두 가닥이 꼬인 ==이중 나선== 구조
- 염기는 항상 ==A–T, G–C==로 짝을 이룬다 (**상보적 결합**)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#bio | [DNA]를 고르고 위 가닥의 염기와 짝을 이루는 염기를 차례로 골라 아래 가닥을 완성하자.
% 짝이 틀리면 어떻게 표시되는지 보여 주고, 규칙을 학생이 말하게 하기

= 상보적 결합 | 시뮬레이션 기록
| 위 가닥 | A | T | G | C | G | A |
|+ 아래 가닥 | T | A | [[C]] | [[G]] | [[C]] | [[T]] |
>+ 한 가닥의 염기 서열을 알면 다른 가닥의 서열을 **알 수 있다** → DNA 복제의 원리

= 예제 2 · 염기 비율 구하기 | 적용
- DNA 이중 가닥 전체에서 A가 30 %이다. G의 비율은?
^+ A와 T는 짝 → **A = T = 30 %**
^+ G + C = 100 − 60 = **40 %**
^+ G와 C도 짝 → **G = C = 20 %**

= 예제 3 · 4종류로 얼마나 많은 정보를? | 적용
- 염기 4종류가 n개 이어지면 가능한 서열은 4ⁿ가지이다.
^+ 3개: 4³ = **64가지**
^+ 10개: 4¹⁰ = **1 048 576가지** (약 100만)
^+ 사람의 DNA는 약 30억 쌍 → 사실상 **무한한 정보**
>+ 정보는 염기의 '종류'가 아니라 '**배열 순서**'에 담긴다.

= 단백질과 핵산 비교 | 정리
| 구분 | 단백질 | 핵산 (DNA) |
|+ 단위체 | 아미노산 | 뉴클레오타이드 |
|+ 단위체 종류 | 20가지 | 4가지 (염기 A, T, G, C) |
|+ 결합 | 펩타이드 결합 | 뉴클레오타이드 사이 결합, 염기 짝(A–T, G–C) |
|+ 주요 기능 | 몸의 구성, 효소·호르몬·항체 | 유전 정보 저장·전달 |

= 생활 속 단백질과 핵산 | 사례
* 🍳 달걀 프라이 :: 열에 의한 단백질 변성 — 다시 투명해지지 않는다
* 💇 파마 :: 머리카락 단백질의 결합을 끊고 다시 이어 모양을 바꾼다
* 🧪 효소 세제 :: 단백질 효소가 얼룩을 분해한다
* 🔍 DNA 감식 :: 염기 서열로 범인과 친자를 확인
* 💉 mRNA 백신 :: 핵산을 이용해 몸이 항원 단백질을 만들게 한다
* 🥩 고기 숙성 :: 효소가 단백질을 분해해 부드러워진다

= 확인 문제 1
Q 탄소가 생명체 구성 물질의 뼈대가 될 수 있는 까닭은?
o 원자가 전자가 1개라서
o* 원자가 전자가 4개라 다양한 구조로 공유 결합할 수 있어서
o 금속 원소라서
o 지각에 가장 많아서
:: 탄소는 최대 4개의 원자와 공유 결합하며 사슬·고리 등 다양한 구조를 만든다.

= 확인 문제 2
Q DNA의 한 가닥 염기 서열이 ATGC일 때 상보적인 가닥의 서열은?
o ATGC
o* TACG
o GCAT
o CGTA
:: A–T, T–A, G–C, C–G로 짝을 이룬다.

= 확인 문제 3
Q DNA 이중 가닥에서 C가 15 %일 때 A의 비율은?
o 15 %
o 30 %
o* 35 %
o 70 %
:: C = G = 15 % → A + T = 70 % → A = 35 %

= 확인 문제 4
Q 단백질이 높은 온도에서 기능을 잃는 까닭은?
o 아미노산의 종류가 바뀌어서
o* 입체 구조가 변형되어서
o 핵산으로 바뀌어서
o 탄소가 사라져서
:: 열에 의해 입체 구조가 변형(변성)되어 고유한 기능을 할 수 없다.

= 서술형 도전 | 생각 넓히기
? 단위체 4종류(염기)만으로 엄청나게 다양한 유전 정보를 저장할 수 있는 까닭을 쓰시오. :: 염기의 배열 순서가 정보가 되며, 염기가 n개 이어지면 4ⁿ가지 서열이 가능하므로 수억 개의 염기로 이루어진 DNA는 거의 무한한 정보를 담을 수 있다.
? 단백질과 핵산의 공통점과 차이점을 단위체를 중심으로 쓰시오. :: 공통점: 작은 단위체가 반복 결합한 탄소 화합물이다. 차이점: 단백질의 단위체는 아미노산(20종류), 핵산의 단위체는 뉴클레오타이드(염기 4종류)이다.
