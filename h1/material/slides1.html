# 규산염 광물의 구조 | 지각을 이루는 기본 벽돌 | 고등학교 통합과학1 · 04 지각·생명체 구성 물질과 신소재 · 1차시 | 2022 개정 교육과정 [10통과1-02-05]

= 오늘의 학습 목표 | 1차시
^ 지각을 구성하는 **주요 원소**를 질량비 순으로 말할 수 있다.
^ **규산염 사면체**의 구조와 결합 방식을 설명할 수 있다.
^ 사면체의 결합 방식에 따른 **광물의 성질 차이**를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 지각의 원소 7분 → 규산염 사면체 8분 → 결합 방식(시뮬레이션) 15분 → 성질·문항 10분
% 2022 개정 [10통과1-02-05] 해설: Si–O 사면체를 기본 골격으로 다양한 광물이 만들어짐을 다루되, 구체적인 구조식이나 화학식(Si : O 비 계산 포함)은 다루지 않는다.

= 모래, 유리, 운모의 공통점은? | 생각 열기
* 🏖️ 해변의 모래 :: 대부분 석영 알갱이
* 🪟 유리창 :: 모래(석영)를 녹여 만든다
* ✨ 운모 :: 얇은 판처럼 한 장씩 벗겨진다
* 🪨 화강암 :: 석영, 장석, 운모가 섞인 암석
? 이들은 모두 어떤 두 원소를 공통으로 가지고 있을까? :: **규소(Si)와 산소(O)**. 지각 광물의 90 % 이상이 규소와 산소로 된 **규산염 광물**이다.

= 이전에 배운 내용 떠올리기 | 복습
- 03단원: 비금속 원자끼리 전자쌍을 공유 → [[공유 결합]]
- 규소(Si)는 14족 → 원자가 전자 [[4]]개
- 산소(O)는 16족 → 원자가 전자 [[6]]개
? 규소 1개가 산소 4개와 결합한다면 어떤 입체 모양이 될까? :: 규소를 가운데 두고 산소 4개가 꼭짓점에 있는 **정사면체** — 오늘의 기본 벽돌!

## 지각의 구성 물질 | 산소와 규소의 세계

= 지각을 이루는 원소 | 질량비
| 원소 | O | Si | Al | Fe | Ca | Na | K | Mg |
| 질량비 (%) | 46.6 | 27.7 | 8.1 | 5.0 | 3.6 | 2.8 | 2.6 | 2.1 |
+ 산소 + 규소 = 46.6 + 27.7 = [[74.3 %]] → 지각의 약 4분의 3
+ 상위 8개 원소의 합 = [[98.5 %]]
% 수치는 지각 원소의 대표적인 추정값

= 규산염 사면체
! 규산염 사면체(Si–O 사면체): 규소 1개를 중심으로 산소 4개가 정사면체 꼭짓점에 결합
- 규산염 광물: 규산염 사면체가 기본 단위인 광물 → 지각의 ==90 % 이상==
- 사면체끼리 ==산소를 공유==하는 방식에 따라 독립형·단사슬·복사슬·판상·망상 구조가 된다.
>+ 레고 블록 하나(사면체)로 여러 모양의 구조물을 만드는 것과 같다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#silicate | 구조를 하나씩 눌러 사면체가 어떤 모양으로 연결되는지와 공유하는 산소 수를 기록하자.
% 독립형 → 망상형 순서로 공유 산소가 늘수록 사면체들이 점점 더 넓게 연결되는 규칙을 찾게 하기. 시뮬레이션 화면의 Si : O 비는 참고용이며 계산·평가하지 않는다.

= 결합 방식과 광물 | 시뮬레이션 기록
| 구조 | 독립형 | 단사슬 | 복사슬 | 판상 | 망상 |
|+ 대표 광물 | 감람석 | 휘석 | 각섬석 | 흑운모 | 석영 |
|+ 공유 산소 수 | 0 | 2 | 2~3 | 3 | 4 |
|+ 연결 모양 | 따로따로 | [[한 줄 사슬]] | 두 줄 사슬 | [[평면(판)]] | [[3차원 그물]] |

## 단위체와 구조 | 같은 벽돌, 다른 건물

= 예제 1 · 같은 벽돌로 다른 광물 | 적용
- 감람석, 흑운모, 석영은 모두 같은 기본 단위체(Si–O 사면체)로 이루어져 있다.
^+ 감람석: 사면체가 **따로따로** 있고 양이온이 사이를 잇는다.
^+ 흑운모: 사면체가 산소 3개를 공유해 **판**을 이룬다.
^+ 석영: 사면체가 산소 4개를 모두 공유해 **3차원 그물**을 이룬다.
>+ 기본 단위체는 같아도 **연결 방식**이 달라 서로 다른 광물이 된다 → 단백질·핵산도 같은 원리(다음 시간)

= 확인 문제 1
Q 규산염 사면체가 산소 4개를 모두 공유하는 3차원 망상 구조 광물은?
o 감람석
o 휘석
o 흑운모
o* 석영
:: 석영은 사면체가 산소 4개를 모두 공유하여 3차원 그물(망상) 구조를 이룬다.

## 구조와 성질 | 왜 그렇게 쪼개질까

= 구조에 따른 광물의 성질
| 광물 | 구조 | 성질 |
|+ 감람석 | 독립형 | 사면체를 Mg²⁺, Fe²⁺ 같은 [[양이온]]이 연결 |
|+ 흑운모 | 판상 | 판 사이 결합이 약해 [[얇은 판]]으로 쪼개짐 |
|+ 석영 | 망상 | 결합이 매우 단단 → 풍화에 강해 [[모래]]의 주성분 |
|+ 휘석·각섬석 | 사슬 | 사슬 방향으로 길쭉하게 쪼개짐 |

= 예제 3 · 흑운모가 판으로 쪼개지는 까닭 | 적용
^+ 사면체가 산소 3개를 공유 → **평면(판)**으로 연결된다.
^+ 판 안의 Si−O 결합은 **강하다.**
^+ 판과 판 사이는 양이온에 의해 **약하게** 결합되어 있다.
^+ → 약한 판 사이가 쉽게 갈라져 **얇은 판**으로 벗겨진다.

= 생활 속 규산염 광물 | 사례
* 🏖️ 모래 :: 풍화에 강한 석영이 끝까지 남은 것
* 🪟 유리 :: 석영을 녹여 굳힌 비결정 물질
* 💻 반도체 :: 석영에서 규소를 뽑아 만든다
* 🔥 운모 :: 얇고 열에 강해 전기 기구 절연판에 사용
* 💎 페리도트 :: 보석이 된 감람석
* 🏺 도자기 :: 점토 광물(판상 구조)을 구워 만든다

= 확인 문제 2
Q 지각을 구성하는 원소를 질량비가 큰 순서대로 나열한 것은?
o 규소 > 산소 > 알루미늄
o* 산소 > 규소 > 알루미늄
o 철 > 산소 > 규소
o 산소 > 철 > 규소
:: 산소(약 46.6 %) > 규소(약 27.7 %) > 알루미늄(약 8.1 %) 순이다.

= 확인 문제 3
Q 독립형 구조인 감람석에서 사면체끼리 연결해 주는 것은?
o 공유된 산소
o* Mg²⁺, Fe²⁺ 같은 양이온
o 물 분자
o 탄소 원자
:: 독립형은 산소를 공유하지 않으므로 양이온이 사면체를 이어 준다.

= 확인 문제 4
Q 사면체가 산소 3개를 공유하여 평면으로 연결된 판상 구조의 대표 광물은?
o 감람석
o 휘석
o* 흑운모
o 석영
:: 흑운모는 판상 구조라 판 사이가 약해 얇은 판으로 벗겨진다.

= 서술형 도전 | 생각 넓히기
? 석영이 풍화에 강해 모래의 주성분이 되는 까닭을 구조와 관련지어 쓰시오. :: 사면체가 산소 4개를 모두 공유하는 3차원 망상 구조로 결합이 매우 단단하기 때문이다.
? 감람석, 흑운모, 석영이 모두 같은 단위체로 이루어져 있는데도 성질이 다른 까닭을 쓰시오. :: 기본 단위체인 Si–O 사면체가 산소를 공유하여 연결되는 방식(독립형, 판상, 망상)이 서로 다르기 때문이다.

= 오늘 배운 내용 정리
- 지각의 원소: [[산소]] > [[규소]] > 알루미늄 > 철 > 칼슘
- 규소 1개 + 산소 4개 → [[규산염 사면체]], 지각의 90 % 이상이 규산염 광물
- 공유 산소 0 독립형([[감람석]]) → 2 단사슬 → 2.5 복사슬 → 3 판상([[흑운모]]) → 4 망상([[석영]])
- 같은 단위체라도 [[연결 방식]]이 달라 다양한 광물이 만들어진다.

= 나가기 전 한 문제 | 형성평가
? 휘석(단사슬 구조)에서 사면체 하나가 공유하는 산소 수와 사면체들이 연결된 모양을 쓰시오. :: 산소 2개를 공유하여 사면체들이 한 줄의 사슬 모양으로 연결된다.
