* 🏖️ 해변의 모래 :: 대부분 석영 알갱이
* 🪟 유리창 :: 모래(석영)를 녹여 만든다

? 이들은 모두 어떤 두 원소를 공통으로 가지고 있을까? :: **규소(Si)와 산소(O)**. 지각 광물의 90 % 이상이 규소와 산소로 된 **규산염 광물**이다.

? 규소 1개가 산소 4개와 결합한다면 어떤 입체 모양이 될까? :: 규소를 가운데 두고 산소 4개가 꼭짓점에 있는 **정사면체** — 오늘의 기본 벽돌!

## 지각의 구성 물질 | 산소와 규소의 세계

= 지각을 이루는 원소 | 질량비
| 원소 | O | Si | Al | Fe | Ca | Na | K | Mg |
| 질량비 (%) | 46.6 | 27.7 | 8.1 | 5.0 | 3.6 | 2.8 | 2.6 | 2.1 |
+ 산소 + 규소 = 46.6 + 27.7 = [[74.3 %]] → 지각의 약 4분의 3
+ 상위 8개 원소의 합 = [[98.5 %]]
% 수치는 지각 원소의 대표적인 추정값

= 규산염 사면체
! 규산염 사면체(SiO₄): 규소 1개를 중심으로 산소 4개가 정사면체 꼭짓점에 결합
- 규산염 광물: 규산염 사면체가 기본 단위인 광물 → 지각의 ==90 % 이상==
- 사면체끼리 ==산소를 공유==하는 방식에 따라 독립형·단사슬·복사슬·판상·망상 구조가 된다.
>+ 레고 블록 하나(사면체)로 여러 모양의 구조물을 만드는 것과 같다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#silicate | 구조를 하나씩 눌러 공유하는 산소 수와 Si : O 비를 기록하자.
% 독립형 → 망상형 순서로 공유 산소가 늘수록 Si : O의 O가 줄어드는 규칙을 찾게 하기

= 결합 방식과 광물 | 시뮬레이션 기록
| 구조 | 독립형 | 단사슬 | 복사슬 | 판상 | 망상 |
|+ 대표 광물 | 감람석 | 휘석 | 각섬석 | 흑운모 | 석영 |
|+ 공유 산소 수 | 0 | 2 | 2.5 | 3 | 4 |
|+ Si : O | 1 : 4 | [[1 : 3]] | 4 : 11 | [[2 : 5]] | [[1 : 2]] |

## Si : O 비 계산 | 공유하면 절반씩

= 예제 1 · 공유 산소는 절반씩 | 적용
- 공유된 산소 1개는 두 사면체에 **절반씩** 속한다.
^+ 단사슬: 공유 안 한 산소 2개 + 공유 산소 2개 × ½ = 2 + 1 = **3** → Si : O = **1 : 3**
^+ 판상: 1 + 3 × ½ = **2.5** → 1 : 2.5 = **2 : 5**
^+ 망상: 4 × ½ = **2** → **1 : 2 (SiO₂, 석영)**

= 예제 2 · 복사슬 구조 | 적용
- 복사슬 구조에서는 사면체의 절반은 산소 2개, 절반은 산소 3개를 공유한다.
^+ 사면체 2개를 한 묶음으로: 공유 산소 2 + 3 = 5개, 비공유 산소 2 + 1 = 3개
^+ 산소 수 = 3 + 5 × ½ = **5.5** (사면체 2개당)
^+ Si : O = 2 : 5.5 = **4 : 11**

= 확인 문제 1
Q 규산염 사면체가 산소 4개를 모두 공유하는 3차원 망상 구조 광물은?
o 감람석
o 휘석
o 흑운모
o* 석영
:: 석영(SiO₂)은 모든 산소를 공유하는 망상 구조로 Si : O = 1 : 2이다.

## 구조와 성질 | 왜 그렇게 쪼개질까

= 구조에 따른 광물의 성질
| 광물 | 구조 | 성질 |
|+ 감람석 | 독립형 | 사면체를 Mg²⁺, Fe²⁺ 같은 [[양이온]]이 연결 |
|+ 흑운모 | 판상 | 판 사이 결합이 약해 [[얇은 판]]으로 쪼개짐 |
|+ 석영 | 망상 | 결합이 매우 단단 → 풍화에 강해 [[모래]]의 주성분 |
|+ 휘석·각섬석 | 사슬 | 사슬 방향으로 길쭉하게 쪼개짐 |

= 예제 3 · 흑운모가 판으로 쪼개지는 까닭 | 적용
^+ 사면체가 산소 3개를 공유 → **평면(판)**으로 연결된다.
^+ 판 안의 Si−O 결합은 **강하다.**
^+ 판과 판 사이는 양이온에 의해 **약하게** 결합되어 있다.
^+ → 약한 판 사이가 쉽게 갈라져 **얇은 판**으로 벗겨진다.

= 생활 속 규산염 광물 | 사례
* 🏖️ 모래 :: 풍화에 강한 석영이 끝까지 남은 것
* 🪟 유리 :: 석영을 녹여 굳힌 비결정 물질
* 💻 반도체 :: 석영에서 규소를 뽑아 만든다
* 🔥 운모 :: 얇고 열에 강해 전기 기구 절연판에 사용
* 💎 페리도트 :: 보석이 된 감람석
* 🏺 도자기 :: 점토 광물(판상 구조)을 구워 만든다

= 확인 문제 2
Q 지각을 구성하는 원소를 질량비가 큰 순서대로 나열한 것은?
o 규소 > 산소 > 알루미늄
o* 산소 > 규소 > 알루미늄
o 철 > 산소 > 규소
o 산소 > 철 > 규소
:: 산소(약 46.6 %) > 규소(약 27.7 %) > 알루미늄(약 8.1 %) 순이다.

= 확인 문제 3
Q 독립형 구조인 감람석에서 사면체끼리 연결해 주는 것은?
o 공유된 산소
o* Mg²⁺, Fe²⁺ 같은 양이온
o 물 분자
o 탄소 원자
:: 독립형은 산소를 공유하지 않으므로 양이온이 사면체를 이어 준다.

= 확인 문제 4
Q 판상 구조(산소 3개 공유)의 Si : O 비는?
o 1 : 4
o 1 : 3
o* 2 : 5
o 1 : 2
:: 1 + 3 × ½ = 2.5 → 1 : 2.5 = 2 : 5

= 서술형 도전 | 생각 넓히기
? 석영이 풍화에 강해 모래의 주성분이 되는 까닭을 구조와 관련지어 쓰시오. :: 사면체가 산소 4개를 모두 공유하는 3차원 망상 구조로 결합이 매우 단단하기 때문이다.
? 사면체가 공유하는 산소 수가 많아질수록 Si : O에서 산소의 비율이 줄어드는 까닭을 쓰시오. :: 공유된 산소 1개는 두 사면체에 절반씩 속하므로, 공유가 많을수록 사면체 하나당 산소 수가 4에서 점점 줄어든다(망상형은 4 × ½ = 2 → SiO₂).

= 오늘 배운 내용 정리
- 지각의 원소: [[산소]] > [[규소]] > 알루미늄 > 철 > 칼슘
- 규소 1개 + 산소 4개 → [[규산염 사면체]], 지각의 90 % 이상이 규산염 광물
- 공유 산소 0 독립형([[감람석]]) → 2 단사슬 → 2.5 복사슬 → 3 판상([[흑운모]]) → 4 망상([[석영]])
- 공유가 많을수록 Si : O의 산소 비율 [[감소]] (1 : 4 → 1 : 2)

= 나가기 전 한 문제 | 형성평가
? 휘석(단사슬 구조)에서 사면체 하나가 공유하는 산소 수와 Si : O 비를 계산 과정과 함께 쓰시오. :: 산소 2개 공유 → 비공유 2 + 공유 2 × ½ = 3 → Si : O = 1 : 3
