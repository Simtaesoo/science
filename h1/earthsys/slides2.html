# 물과 탄소의 순환 | 지구를 도는 물질 | 고등학교 통합과학1 · 05 지구시스템 · 2차시 | 2022 개정 교육과정 [통과1 Ⅲ]

= 오늘의 학습 목표 | 2차시
^ **물의 순환**을 권역 사이의 이동으로 설명하고 물 수지를 계산할 수 있다.
^ **탄소의 순환**에서 권역별 탄소의 저장 형태를 말할 수 있다.
^ **인간 활동**이 탄소 순환의 균형에 미치는 영향을 분석할 수 있다.
% 흐름: 생각 열기 5분 → 물의 순환·수지(시뮬레이션) 15분 → 탄소의 순환 10분 → 인간 활동·문항 15분

= 오늘 마신 물은 공룡도 마셨다? | 생각 열기
* 💧 컵 속의 물 :: 수억 년 동안 바다·구름·빙하·생물을 오갔다
* 🌧️ 비 :: 바다에서 증발한 물이 육지에 내린다
* 🌳 나무 :: 공기 중 탄소로 몸을 만든다
* ⛽ 석유 :: 수억 년 전 생물의 탄소가 땅속에 갇힌 것
? 지구의 물과 탄소의 총량은 늘거나 줄까? :: 거의 **일정**하다. 다만 권역 사이를 끊임없이 **순환**하며 머무는 곳만 바뀐다.

= 지난 시간 복습 | 1차시
- 지구시스템: 지권, 수권, 기권, [[생물권]], 외권
- 가장 큰 에너지원: [[태양 에너지]]
- 상호작용으로 물질은 [[순환]]하고 에너지는 흐른다.
? 물의 순환을 움직이는 에너지원은? :: **태양 에너지** — 물을 증발시켜 대기로 올린다.

## 물의 순환 | 들어온 만큼 나간다

= 물의 순환
- 주된 에너지원: ==태양 에너지==
- 바다: 증발량 425 > 강수량 385 → 남는 **40**은 수증기로 육지로 이동
- 육지: 강수량 111 > 증발산량 71 → 남는 **40**은 하천과 지하수로 바다에 돌아간다
>+ 각 권역에서 들어오는 양 = 나가는 양 → 물의 총량 **일정** (단위: 천 km³/년)

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#cycle | [물의 순환]에서 각 흐름의 양을 읽고 바다와 육지의 물 수지를 확인하자. 이어서 [탄소의 순환]에서 화석 연료 사용과 삼림 파괴를 바꾸어 100년 뒤 대기 CO₂를 비교하자.
% 물 수지 → 탄소 순환 순서. 탄소에서는 세 가지 조건을 모둠별로 나누어 기록

= 물의 수지 | 시뮬레이션 기록
| 권역 | 들어오는 양 | 나가는 양 |
|+ 바다 | 강수 385 + 유출 40 = 425 | 증발 425 |
|+ 육지 | 강수 111 | 증발산 71 + 유출 40 = [[111]] |
|+ 대기 | 증발 425 + 71 = [[496]] | 강수 385 + 111 = 496 |
~ 단위: 천 km³/년

= 예제 1 · 대기 속 물은 며칠 머물까? | 적용
- 대기 중의 물(수증기) 양은 약 13천 km³이고, 1년에 496천 km³가 들어오고 나간다.
^+ 1년 동안 대기의 물이 바뀌는 횟수 = 496 ÷ 13 ≈ **38번**
^+ 평균 머무는 시간 = 365일 ÷ 38 ≈ **약 10일**
>+ 대기는 물이 아주 빨리 드나드는 곳 — 그래서 날씨가 빨리 바뀐다.
% 대기 수증기량 13천 km³는 대표적인 추정값

= 확인 문제 1
Q 바다의 증발량이 425, 강수량이 385일 때 육지에서 바다로 흘러드는 물의 양은? (단위: 천 km³/년)
o 385
o 425
o* 40
o 810
:: 바다의 물 수지가 맞으려면 425 − 385 = 40만큼 육지에서 하천·지하수로 들어와야 한다.

## 탄소의 순환 | 네 권역을 도는 탄소

= 권역별 탄소의 저장 형태
| 권역 | 탄소의 형태 |
|+ 기권 | [[이산화 탄소(CO₂)]] |
|+ 수권 | [[탄산 이온]] (물에 녹은 CO₂) |
|+ 생물권 | [[유기물]] (생물의 몸) |
|+ 지권 | [[석회암, 화석 연료]] |
>+ 광합성·호흡·용해·퇴적·화산 활동을 통해 탄소가 권역 사이를 이동한다.

= 탄소의 이동 경로
* 🌿 광합성 :: 기권 → 생물권 (CO₂ 흡수)
* 🫁 호흡·분해 :: 생물권 → 기권 (CO₂ 방출)
* 🌊 해수 용해 :: 기권 → 수권 (탄산 이온)
* 🐚 퇴적 :: 수권 → 지권 (조개껍데기·석회암)
* 🌋 화산 활동 :: 지권 → 기권
* ⛽ 화석 연료 연소 :: 지권 → 기권 (인간 활동)

= 인간 활동과 탄소 | 시뮬레이션 기록
| 화석 연료 | 삼림 파괴 | 100년 뒤 대기 CO₂ (ppm, 모형) |
|+ 0 | 0 | 약 408 (변화 없음) |
|+ 10 | 1.5 | 약 [[573]] |
|+ 20 | 5 | 약 [[784]] |
||
C 인간 활동 조건에 따른 100년 뒤 대기 CO₂ (모형) | 조건 (0: 없음, 1: 보통, 2: 많음) | CO₂ (ppm) | CO₂:0,408 1,573 2,784

= 예제 2 · 얼마나 늘어날까? | 자료 해석
- 화석 연료 10, 삼림 파괴 1.5 조건에서 대기 CO₂가 408 → 573 ppm이 되었다.
^+ 증가량 = 573 − 408 = **165 ppm**
^+ 증가율 = 165 ÷ 408 × 100 ≈ **40 %**
^+ 화석 연료 20, 삼림 파괴 5 조건이면 784 − 408 = 376 ppm, 약 **92 %** 증가
>+ 화석 연료: 수억 년 동안 지권에 저장된 탄소를 **짧은 시간에** 기권으로 방출

= 생활 속 물과 탄소의 순환 | 사례
* 🏭 탄소 포집·저장(CCS) :: 굴뚝의 CO₂를 모아 땅속 지층에 저장
* 🌳 숲 가꾸기 :: 생물권에 탄소를 저장
* 🌊 블루 카본 :: 갯벌·해초 숲이 탄소를 흡수
* 🚿 물 절약 :: 수자원 순환 속도보다 빨리 쓰지 않기
* 🧊 빙하 감소 :: 지구 온난화로 수권의 저장 형태가 바뀐다
* 🔋 전기 자동차 :: 화석 연료 연소를 줄여 지권 → 기권 이동 감소

= 확인 문제 2
Q 지권에서 탄소가 저장된 형태로 옳은 것은?
o 이산화 탄소 기체
o 탄산 이온
o* 석회암, 화석 연료
o 단백질
:: 지권의 탄소는 석회암(탄산 칼슘)과 화석 연료 형태로 저장된다.

= 확인 문제 3
Q 화석 연료 사용이 탄소 순환의 균형을 깨뜨리는 까닭으로 가장 알맞은 것은?
o 탄소의 총량이 늘어나서
o* 지권에 오래 저장된 탄소를 짧은 시간에 기권으로 대량 방출해서
o 광합성이 멈추어서
o 바다가 탄소를 전혀 흡수하지 못해서
:: 다른 권역이 흡수하는 속도보다 빠르게 대기 CO₂가 늘어난다.

= 확인 문제 4
Q 육지의 강수량이 111, 증발산량이 71일 때 육지의 물 수지에 대한 설명으로 옳은 것은?
o 육지의 물이 매년 40씩 늘어난다
o* 남는 40은 하천과 지하수로 바다에 돌아간다
o 바다에서 육지로 물이 흘러든다
o 물 수지가 맞지 않는다
:: 들어오는 111 = 증발산 71 + 유출 40으로 수지가 맞는다.

= 서술형 도전 | 생각 넓히기
? 화석 연료 사용이 탄소 순환의 균형을 깨뜨리는 까닭을 쓰시오. :: 오랜 시간 지권에 저장되어 있던 탄소를 짧은 시간에 기권으로 대량 방출해, 다른 권역이 흡수하는 속도보다 빠르게 대기 CO₂가 늘어나기 때문이다.
? 탄소 중립을 위해 탄소를 지권에 저장하는 방법과 생물권을 이용하는 방법을 각각 제안하시오. :: 지권: 발전소 굴뚝의 CO₂를 모아 땅속 깊은 지층에 저장(CCS). 생물권: 숲 가꾸기, 갯벌·습지 보전(블루 카본) 등.

= 오늘 배운 내용 정리
- 물의 순환 에너지원: [[태양 에너지]], 총량은 [[일정]]
- 바다 증발 425 − 강수 385 = [[40]] → 육지로 이동 → 하천·지하수로 귀환
- 탄소: 기권 [[CO₂]], 수권 탄산 이온, 생물권 [[유기물]], 지권 석회암·화석 연료
- 화석 연료 연소 → 지권의 탄소를 [[기권]]으로 빠르게 방출

= 나가기 전 한 문제 | 형성평가
? 대기의 물 수지에서 들어오는 양과 나가는 양을 각각 계산하고, 두 값이 같다는 것의 의미를 쓰시오. :: 들어오는 양: 증발 425 + 증발산 71 = 496, 나가는 양: 강수 385 + 111 = 496 → 같으므로 대기 중 물의 양이 일정하게 유지된다.
