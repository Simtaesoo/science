# 판 구조론과 지권의 변화 | 움직이는 지구의 표면 | 고등학교 통합과학1 · 05 지구시스템 · 3차시 | 2022 개정 교육과정 [10통과1-03-02]

= 오늘의 학습 목표 | 3차시
^ **판 구조론**의 핵심 내용과 판을 움직이는 원동력을 설명할 수 있다.
^ **판의 경계**에 따라 나타나는 지형과 지각 변동을 비교할 수 있다.
^ 판의 운동을 **지구시스템의 상호작용**으로 설명할 수 있다.
% 흐름: 생각 열기 5분 → 판과 맨틀 대류 8분 → 판 경계 4가지(시뮬레이션) 15분 → 계산·상호작용 10분 → 문항 7분

= 대서양은 해마다 넓어진다? | 생각 열기
* 🗺️ 대륙의 해안선 :: 남아메리카와 아프리카가 퍼즐처럼 맞는다
* 🌊 대서양 :: 1년에 수 cm씩 넓어진다
* 🏔️ 히말라야 :: 산꼭대기에서 바다 생물 화석이 나온다
* 🗾 일본 :: 지진과 화산이 매우 잦다
? 바다 생물 화석이 세계에서 가장 높은 산에서 발견되는 까닭은? :: 옛 바다 밑의 지층이 **판의 충돌**로 밀려 올라가 산맥이 되었기 때문이다.

= 지난 시간 복습 | 1·2차시
- 판을 움직이는 에너지원 → [[지구 내부 에너지]]
- 화산 활동: [[지권 → 기권]]으로 탄소·화산재 방출
? 지구 내부 에너지는 어떤 방식으로 판을 움직일까? :: 뜨거운 맨틀이 천천히 올라가고 식으면 내려가는 **맨틀 대류**가 그 위의 판을 움직인다.

## 판 구조론 | 지구 표면은 조각나 있다

= 판 구조론
! 판: 지각과 상부 맨틀을 포함하는 두께 약 100 km의 단단한 암석층(암석권)
- 지구 표면은 여러 개의 판으로 나뉘어 ==서로 다른 방향==으로 움직인다.
- 원동력: ==맨틀 대류== (지구 내부 에너지)
- 판의 경계에서 **지진**과 **화산 활동**이 활발하다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#plate | 네 가지 판 경계를 차례로 보고 지형, 지진, 화산을 정리하자.
% 발산 → 섭입 → 충돌 → 보존 순서. '판이 멀어지나, 가까워지나, 어긋나나'를 먼저 말하게

= 판 경계의 종류 | 시뮬레이션 기록
| 경계 | 발산형 | 수렴형(섭입) | 수렴형(충돌) | 보존형 |
|+ 판의 움직임 | 멀어짐 | 가까워짐 | 가까워짐 | 어긋남 |
|+ 지형 | [[해령]], 열곡대 | [[해구]], 화산호 | [[습곡 산맥]] | [[변환 단층]] |
|+ 화산 | 있음 | 있음 | 거의 없음 | 없음 |
|+ 지진 깊이 | 얕음 | 얕음~깊음 | 얕음~중간 | 얕음 |
|+ 예 | 대서양 중앙 해령 | 일본 해구 | 히말라야산맥 | 산안드레아스 단층 |

= 예제 1 · 해양 지각의 나이 | 적용
- 해령의 양쪽으로 해양판이 1년에 2.5 cm씩 멀어진다. 해령에서 500 km 떨어진 해양 지각의 나이는?
^+ 500 km = 500 000 m = **50 000 000 cm**
^+ 나이 = 50 000 000 ÷ 2.5 = **20 000 000년** (2000만 년)
>+ 해령에서 멀어질수록 해양 지각의 나이가 **많아진다** → 해령에서 새 지각이 생성되는 증거

= 섭입대의 진원 깊이 | 그래프
C 섭입대에서 해구로부터의 거리와 진원 깊이 (모형, 섭입 각도 45°) | 해구에서 대륙 쪽 거리 (km) | 진원 깊이 (km) | 진원 깊이:0,10 100,100 200,200 300,300 400,400 500,500
- 해양판이 대륙판 아래로 **비스듬히** 섭입 → 대륙 쪽으로 갈수록 진원이 [[깊어진다]]

= 예제 2 · 진원 깊이 추정 | 적용
- 해양판이 45° 각도로 섭입한다. 해구에서 대륙 쪽으로 300 km 떨어진 곳 아래의 진원 깊이는?
^+ 45°이면 수평 거리 = 깊이
^+ 진원 깊이 ≈ **300 km**
>+ 실제 섭입 각도는 곳마다 달라 진원의 분포 기울기도 다르다.

= 확인 문제 1
Q 두 판이 멀어지는 경계에서 만들어지는 지형은?
o 해구
o* 해령
o 습곡 산맥
o 변환 단층
:: 발산형 경계에서는 맨틀 물질이 올라와 새 지각이 생기며 해령이 만들어진다.

## 판의 운동과 지구시스템 | 지권에서 시작된 변화

= 판의 운동이 일으키는 상호작용
^+ 화산 폭발 → 화산재·가스가 **기권**으로 → 기후 변화
^+ 기후 변화 → **생물권**의 멸종·분포 변화
^+ 대륙 이동 → 해류와 기후가 바뀜 → **수권·생물권** 변화
^+ 해저 지진 → 지진 해일 → **수권** → 해안 **생물권** 피해
>+ 판의 운동은 지권에서 시작해 지구시스템 전체를 바꾼다.

= 예제 3 · 우리나라의 지진 | 적용
- 우리나라는 판의 경계에서 떨어져 있는데도 지진이 일어난다. 까닭은?
^+ 판 내부에도 판을 미는 **힘이 전달**된다.
^+ 오래된 **단층**이 그 힘을 견디지 못하고 다시 움직인다.
^+ 예: 경주(2016, 규모 5.8), 포항(2017, 규모 5.4) 지진
>+ 대비: 내진 설계, 지진 대피 훈련 (중3 재해·재난과 안전)

= 생활 속 판 구조론 | 사례
* 🏔️ 히말라야 :: 인도판과 유라시아판의 충돌로 지금도 높아진다
* 🗾 일본 열도 :: 섭입대의 화산호
* ♨️ 아이슬란드 :: 해령 위에 있어 지열 발전이 활발
* 🌉 샌프란시스코 :: 산안드레아스 변환 단층 위의 도시
* 🌋 불의 고리 :: 태평양 둘레를 따라 화산·지진이 집중
* 🦕 화석 분포 :: 떨어진 대륙에서 같은 화석 — 대륙 이동의 증거

= 확인 문제 2
Q 섭입대에서 진원의 깊이가 대륙 쪽으로 갈수록 깊어지는 까닭은?
o 대륙판이 해양판 아래로 들어가서
o* 해양판이 대륙판 아래로 비스듬히 섭입해서
o 맨틀 대류가 멈춰서
o 해령이 대륙 쪽에 있어서
:: 섭입하는 해양판을 따라 지진이 발생하므로 대륙 쪽으로 갈수록 깊어진다.

= 확인 문제 3
Q 화산 활동이 거의 없고 거대한 습곡 산맥이 만들어지는 경계는?
o 발산형 경계
o 섭입형 수렴 경계
o* 충돌형 수렴 경계
o 보존형 경계
:: 두 대륙판이 충돌하면 지층이 밀려 올라가 습곡 산맥(예: 히말라야)이 생긴다.

= 확인 문제 4
Q 해령에서 양쪽으로 판이 1년에 2 cm씩 멀어질 때, 해령에서 200 km 떨어진 해양 지각의 나이는?
o 100만 년
o* 1000만 년
o 1억 년
o 10억 년
:: 200 km = 20 000 000 cm → 20 000 000 ÷ 2 = 10 000 000년

= 서술형 도전 | 생각 넓히기
? 해령에서 멀어질수록 해양 지각의 나이가 어떻게 되는지 쓰고 그 까닭을 설명하시오. :: 많아진다(오래되었다). 해령에서 새로운 지각이 생성되어 양쪽으로 이동하기 때문이다.
? 판의 운동이 기권과 생물권에 영향을 준 예를 하나 쓰시오. :: 화산 폭발로 화산재가 기권으로 방출되어 기후가 변하고 생물이 멸종하거나, 대륙 이동으로 해류·기후가 바뀌어 생물 분포가 달라졌다.

= 오늘 배운 내용 정리
- 지각 + 상부 맨틀, 두께 약 100 km → [[판]], 원동력 → [[맨틀 대류]]
- 발산형 → [[해령]], 섭입형 → [[해구]]·화산호, 충돌형 → [[습곡 산맥]], 보존형 → [[변환 단층]]
- 해령에서 멀수록 해양 지각의 나이가 [[많다]].
- 섭입대: 대륙 쪽으로 갈수록 진원이 [[깊다]].

= 나가기 전 한 문제 | 형성평가
? 히말라야산맥 꼭대기에서 바다 생물 화석이 발견되는 까닭을 판의 경계와 관련지어 쓰시오. :: 인도판과 유라시아판이 충돌하는 수렴형(충돌) 경계에서 옛 바다 밑에 쌓인 지층이 밀려 올라가 습곡 산맥이 되었기 때문이다.
