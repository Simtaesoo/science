= 화산 하나가 지구 전체를 식혔다? | 생각 열기
* 🌋 1991년 피나투보 화산 :: 다음 해 지구 평균 기온이 약 0.5 ℃ 내려갔다
* 🌀 태풍 :: 따뜻한 바다에서 힘을 얻는다
* 🌿 숲 :: 대기의 이산화 탄소를 흡수한다
* 🌌 오로라 :: 우주에서 온 입자가 대기와 만나 빛난다
? 화산(땅)이 기온(대기)을 바꾸는 것처럼, 지구의 각 부분은 서로 어떻게 연결될까? :: 땅·바다·대기·생물·우주는 따로 움직이지 않고 물질과 에너지를 주고받는 **하나의 시스템**이다.

? 수권에서 가장 많은 물은? :: **해수**(약 97 %) — 오늘은 이 권역들을 한데 묶어 '시스템'으로 본다.

## 지구시스템 | 다섯 권역

= 지구시스템의 구성
! 지구시스템: 지권, 수권, 기권, 생물권, 외권이 서로 영향을 주고받는 하나의 시스템
| 권역 | 특징 |
|+ 지권 | 지각·맨틀·핵으로 구성 |
|+ 수권 | 해수가 약 [[97]] %, 빙하·지하수·호수와 하천 |
|+ 기권 | 높이에 따른 기온 변화로 4개 층 |
|+ 생물권 | 지구의 모든 생물 (사람 포함) |
|+ 외권 | 기권 바깥의 우주 공간 (태양, 운석 등) |

= 지구시스템의 에너지원
| 에너지원 | 비율 (대략) | 일으키는 현상 |
|+ 태양 에너지 | 약 99.985 % | 대기·해수의 순환, 광합성, 물의 순환 |
|+ 지구 내부 에너지 | 약 0.013 % | 맨틀 대류, 판의 운동, 지진, 화산 |
|+ 조력 에너지 | 약 0.002 % | 밀물과 썰물 |
>+ 상호작용으로 **물질은 순환**하고 **에너지는 흐르며** 형태가 바뀐다.
% 비율은 대표적인 추정값

= 예제 1 · 에너지원 크기 비교 | 적용
- 태양 에너지는 지구 내부 에너지의 몇 배쯤 될까?
^+ 99.985 ÷ 0.013 ≈ **7700배**
^+ 그런데도 판을 움직이는 것은 **지구 내부 에너지**
>+ 양이 적어도 '어디서 어떻게 작용하는가'에 따라 일으키는 현상이 다르다.

= 확인 문제 1
Q 판을 움직이는 지구시스템의 에너지원은?
o 태양 에너지
o* 지구 내부 에너지
o 조력 에너지
o 풍력 에너지
:: 지구 내부 에너지가 맨틀 대류를 일으켜 판을 움직인다.

## 권역 사이의 상호작용 | 사건 읽기

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#sphere | 사건을 하나씩 골라 상호작용하는 권역과 그 내용을 정리하자.
% '○○권 → ○○권' 형식으로 화살표를 그리게 하고, 화살표가 여러 개 이어지는 사건을 찾아보게

= 사건 속 상호작용 | 시뮬레이션 기록
| 사건 | 상호작용 | 내용 |
|+ 화산 폭발 | 지권 → 기권 | 화산재가 햇빛을 가려 기온 하강 |
|+ 태풍 | [[수권 → 기권]] | 따뜻한 바다의 수증기가 태풍의 에너지원 |
|+ 광합성 | [[기권 → 생물권]] | 대기의 CO₂ 흡수 |
|+ 운석 충돌 | [[외권 → 지권]] | 운석 구덩이 형성 |

= 예제 2 · 상호작용 찾기 | 적용
| 현상 | 상호작용 |
|+ 석회 동굴의 형성 | [[수권 → 지권]] |
|+ 오로라 | [[외권 → 기권]] |
|+ 해저 화산 폭발로 물고기 떼죽음 | [[지권 → 수권 → 생물권]] |
|+ 바람에 의한 파도 | [[기권 → 수권]] |
|+ 식물 뿌리가 암석을 부숨 | [[생물권 → 지권]] |

= 예제 3 · 연쇄 상호작용 | 적용
- 큰 화산이 폭발했다. 이후 일어날 수 있는 일을 권역 순서대로 이어 보자.
^+ 지권 → **기권**: 화산재·이산화 황이 성층권까지 퍼진다.
^+ 기권 → **기권**: 햇빛을 가려 지구 평균 기온이 낮아진다.
^+ 기권 → **생물권**: 농작물 생육 부진, 생물 분포 변화
^+ 기권 → **수권**: 산성비가 호수와 바다로 흘러든다.

= 기권이 없다면? | 사고 실험
+ 온실 효과가 없다 → 지구 평균 기온 약 **−18 ℃**
+ 대류로 열을 나누지 못한다 → 낮과 밤의 기온 차가 **매우 커진다** (예: 달)
+ 자외선과 운석이 그대로 지표에 도달한다.
>+ 권역 하나가 바뀌면 시스템 전체가 바뀐다.

= 생활 속 지구시스템 | 사례
* 🏭 화석 연료 사용 :: 생물권(사람)이 지권의 탄소를 기권으로 옮긴다
* 🏞️ 댐 건설 :: 수권의 흐름을 바꾸고 하류 생태계에 영향
* 🌳 삼림 파괴 :: 생물권 변화가 기권의 CO₂를 늘린다
* 🏜️ 황사 :: 지권의 흙먼지가 기권을 타고 이동
* 🌊 지진 해일 :: 지권의 변동이 수권을 거쳐 해안 생물권에 피해
* ☄️ 공룡 멸종 :: 외권(소행성)이 모든 권역을 바꾼 사건

= 확인 문제 2
Q 다음 중 '수권 → 기권'의 상호작용은?
o 화산재가 하늘을 덮었다
o* 바다에서 증발한 수증기가 구름이 되었다
o 식물이 이산화 탄소를 흡수했다
o 운석이 떨어져 구덩이가 생겼다
:: 바다(수권)의 물이 증발해 대기(기권)로 이동한 것이다.

= 확인 문제 3
Q 지구시스템에서 가장 큰 에너지원은?
o 지구 내부 에너지
o 조력 에너지
o* 태양 에너지
o 화석 연료
:: 태양 에너지가 지구시스템 에너지의 대부분(약 99.98 %)을 차지한다.

= 확인 문제 4
Q 오로라가 나타나는 상호작용으로 옳은 것은?
o 지권 → 기권
o 수권 → 기권
o* 외권 → 기권
o 생물권 → 외권
:: 태양에서 온 입자(태양풍, 외권)가 대기(기권)와 충돌해 빛을 낸다.

= 서술형 도전 | 생각 넓히기
? 기권이 없다면 지구 표면의 낮과 밤 기온 차는 어떻게 될지 쓰고 그 까닭을 설명하시오. :: 매우 커진다. 대기가 온실 효과로 열을 붙잡고 대류로 열을 고르게 나누는 역할을 하지 못하기 때문이다(예: 달).
? 사람의 활동은 어느 권역에 속하며 다른 권역에 어떤 영향을 주는지 예를 들어 쓰시오. :: 생물권. 화석 연료 사용(지권 → 기권 탄소 이동), 댐 건설(수권 변화), 도시화·삼림 파괴(지권·생물권 변화) 등으로 다른 권역에 큰 영향을 준다.

= 오늘 배운 내용 정리
- 지구시스템: 지권, [[수권]], [[기권]], 생물권, [[외권]]
- 에너지원: [[태양 에너지]](가장 큼), 지구 내부 에너지, 조력 에너지
- 판의 운동·지진·화산의 에너지원 → [[지구 내부 에너지]]
- 상호작용으로 [[물질]]은 순환하고 [[에너지]]는 흐른다.

= 나가기 전 한 문제 | 형성평가
? 태풍이 해안에 상륙해 큰 파도가 일고 농작물이 쓰러졌다. 이 과정에서 일어난 상호작용을 권역 화살표로 나타내시오. :: 수권 → 기권(수증기가 태풍의 에너지원) → 수권(강풍이 큰 파도를 만듦), 기권 → 생물권(강풍·호우로 농작물 피해)
