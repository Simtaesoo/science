# 주기율표와 원소의 주기성 | 원소들의 규칙을 한눈에 | 고등학교 통합과학1 · 03 물질의 규칙성과 결합 · 1차시 | 2022 개정 교육과정 [10통과1-02-03]

= 오늘의 학습 목표 | 1차시
^ 주기율표의 **족**과 **주기**의 뜻을 알고 원소의 위치를 전자 배치로 찾을 수 있다.
^ 같은 족 원소의 성질이 비슷한 까닭을 **원자가 전자**로 설명할 수 있다.
^ **알칼리 금속**과 **할로젠**의 성질을 비교할 수 있다.
% 흐름: 생각 열기 5분 → 주기율표 10분 → 전자 배치(시뮬레이션) 12분 → 족별 성질·주기성 10분 → 문항 8분

= 118개의 원소, 어떻게 정리할까? | 생각 열기
* 🧂 나트륨 :: 물에 넣으면 격렬하게 반응하는 무른 금속
* 🫧 칼륨 :: 나트륨보다 더 격렬하게 반응한다
* 🟢 염소 :: 황록색의 독성 기체, 수돗물 소독에 쓴다
* 🎈 헬륨·네온 :: 거의 반응하지 않는 기체
? 나트륨과 칼륨은 왜 성질이 비슷할까? :: 가장 바깥 전자 껍질의 전자(**원자가 전자**) 수가 1개로 같기 때문 — 그래서 주기율표의 같은 세로줄(**족**)에 있다.

= 중학교에서 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 원자 | 원자핵(+)과 전자(−) |
| 원자 번호 | 원자핵의 양성자 수 = 중성 원자의 전자 수 |
| 이온 | 원자가 전자를 잃거나 얻어 전하를 띤 입자 |
? 원자 번호 11인 나트륨 원자에는 전자가 몇 개 있을까? :: 11개 — 전자 껍질에 2, 8, 1개씩 배치된다.

## 주기율표 | 족과 주기

= 주기율표의 구성
! 주기율표: 원소를 원자 번호 순으로 배열하되 성질이 비슷한 원소가 같은 세로줄에 오도록 한 표
| 구분 | 뜻 | 같은 것 |
|+ 족 (세로줄, 1~18족) | 화학적 성질이 비슷한 원소 묶음 | [[원자가 전자 수]] |
|+ 주기 (가로줄, 1~7주기) | 전자 껍질 수가 같은 원소 묶음 | [[전자 껍질 수]] |
>+ 금속은 주기율표의 **왼쪽과 가운데**, 비금속은 **오른쪽**에 주로 있다.

= 원자가 전자
- 가장 바깥 전자 껍질에 있는 전자 → ==화학 결합에 참여==
- 1·2족: 원자가 전자 = 족 번호 / 13~17족: 족 번호 − 10
- 18족: 매우 안정하여 원자가 전자를 ==0==으로 본다.
>+ 원자가 전자 수가 같으면 → 화학적 성질이 비슷

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#period | [원자가 전자 수]를 고르고 Li, Na, K와 F, Cl을 차례로 눌러 전자 배치를 비교하자.
% 같은 족은 바깥 전자 수가 같고, 아래로 갈수록 껍질이 하나씩 늘어나는 것을 확인

= 전자 배치 비교 | 시뮬레이션 기록
| 원소 | 족 | 주기 | 전자 배치 | 원자가 전자 |
|+ Li | 1 | 2 | 2, 1 | 1 |
|+ Na | 1 | 3 | 2, 8, 1 | 1 |
|+ K | 1 | 4 | 2, 8, 8, 1 | [[1]] |
|+ F | 17 | 2 | 2, 7 | 7 |
|+ Cl | 17 | 3 | 2, 8, 7 | [[7]] |

= 예제 1 · 위치 찾기 | 적용
- 원자 번호 16인 원소의 위치는?
^+ 전자 16개 → 전자 배치 **2, 8, 6**
^+ 전자 껍질 3개 → **3주기**
^+ 원자가 전자 6개 → **16족** (황, S)

= 예제 2 · 거꾸로 찾기 | 적용
- 4주기 2족 원소의 원자 번호는?
^+ 4주기 → 전자 껍질 4개, 2족 → 원자가 전자 2개
^+ 전자 배치 **2, 8, 8, 2**
^+ 전자 수 = 2 + 8 + 8 + 2 = **20** → 원자 번호 20 (칼슘, Ca)

= 확인 문제 1
Q 같은 족 원소의 화학적 성질이 비슷한 까닭은?
o 원자 번호가 같아서
o 전자 껍질 수가 같아서
o* 원자가 전자 수가 같아서
o 질량이 같아서
:: 화학 결합에 참여하는 원자가 전자 수가 같기 때문이다.

## 족별 성질과 주기성 | 알칼리 금속과 할로젠

= 알칼리 금속과 할로젠 | 비교
| 구분 | 알칼리 금속 (1족) | 할로젠 (17족) |
|+ 예 | Li, Na, K | F, Cl, Br, I |
|+ 원자가 전자 | 1 | 7 |
|+ 주요 성질 | 은백색, 무름, 물과 반응해 수소 발생, 수용액 염기성 | 이원자 분자, 반응성 큼, 금속과 반응해 염 생성 |
|+ 이온 | +1가 양이온 | −1가 음이온 |

= 원자 반지름의 주기성 | 그래프
C 원자 반지름 (근삿값) | 주기 안에서의 순서 (1, 2, 13~17족) | 원자 반지름 (pm) | 2주기:1,152 2,112 3,85 4,77 5,75 6,73 7,72 | 3주기:1,186 2,160 3,143 4,118 5,110 6,103 7,99
+ 같은 족: 아래로 갈수록 [[커진다]] → 전자 껍질 수 증가
+ 같은 주기: 오른쪽으로 갈수록 [[작아진다]] → 원자핵의 양전하 증가로 전자를 강하게 당김

= 예제 3 · 반응성 비교 | 적용
- Li, Na, K를 각각 물에 넣었을 때 가장 격렬하게 반응하는 것은?
^+ 세 원소 모두 원자가 전자 1개를 잃고 양이온이 되려 한다.
^+ 아래로 갈수록 원자 반지름 증가 → 원자가 전자가 원자핵에서 **멀다.**
^+ 전자를 잃기 가장 쉬운 **K**가 가장 격렬하게 반응한다.

= 생활 속 주기율표 | 사례
* 🛢️ 나트륨 보관 :: 반응성이 커서 석유 속에 넣어 공기·수분 차단
* 🦷 플루오린 치약 :: 할로젠 원소가 이를 단단하게
* 🏊 수영장 소독 :: 염소 화합물로 세균 제거
* 🔋 리튬 전지 :: 가볍고 전자를 잘 내놓는 1족 금속
* 💡 네온사인 :: 반응하지 않는 18족 기체
* 🧪 멘델레예프 :: 빈칸을 남기고 갈륨·저마늄의 성질을 예측

= 확인 문제 2
Q 원자 번호 9인 원소의 족과 주기를 바르게 짝지은 것은?
o 1족, 2주기
o 7족, 2주기
o* 17족, 2주기
o 17족, 3주기
:: 전자 배치 2, 7 → 껍질 2개(2주기), 원자가 전자 7개(17족) — 플루오린

= 확인 문제 3
Q 알칼리 금속에 대한 설명으로 옳지 않은 것은?
o 원자가 전자가 1개이다
o 물과 반응하여 수소 기체가 발생한다
o* −1가 음이온이 되기 쉽다
o 칼로 쉽게 잘릴 만큼 무르다
:: 알칼리 금속은 전자 1개를 잃고 +1가 양이온이 된다.

= 확인 문제 4
Q 같은 주기에서 원자 번호가 커질수록 원자 반지름이 작아지는 까닭은?
o 전자 껍질 수가 늘어나서
o* 원자핵의 양전하가 커져 전자를 더 강하게 당겨서
o 원자가 전자가 줄어들어서
o 중성자 수가 줄어들어서
:: 전자 껍질 수는 같은데 원자핵의 전하가 커져 전자를 안쪽으로 끌어당긴다.

= 서술형 도전 | 생각 넓히기
? 나트륨을 석유 속에 보관하는 까닭을 쓰시오. :: 반응성이 커서 공기 중의 산소·수분과 쉽게 반응하기 때문에 석유 속에 넣어 차단한다.
? 멘델레예프가 주기율표에 빈칸을 남기고 원소의 성질을 예측한 것이 과학에서 어떤 의미가 있는지 쓰시오. :: 주기율표가 단순한 정리를 넘어 아직 발견되지 않은 원소(갈륨, 저마늄 등)를 예측할 수 있는 규칙성을 담고 있음을 보여 주었고, 예측이 맞아떨어지며 이론의 신뢰성이 높아졌다.

= 오늘 배운 내용 정리
- 세로줄 [[족]]: 원자가 전자 수가 같음 → 화학적 성질 비슷
- 가로줄 [[주기]]: 전자 껍질 수가 같음
- 가장 바깥 껍질의 전자 → [[원자가 전자]] (18족은 0)
- 1족 [[알칼리 금속]]: +1가 양이온 / 17족 [[할로젠]]: −1가 음이온
- 같은 족은 아래로 원자 반지름 [[증가]], 같은 주기는 오른쪽으로 [[감소]]

= 나가기 전 한 문제 | 형성평가
? 원자 번호 12인 원소의 전자 배치, 족, 주기, 이온이 될 때의 전하를 쓰시오. :: 2, 8, 2 → 2족, 3주기 (마그네슘, Mg), 전자 2개를 잃고 Mg²⁺(+2가 양이온)가 된다.
