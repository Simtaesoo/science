# 이온 결합 | 전자를 주고받는 결합 | 고등학교 통합과학1 · 03 물질의 규칙성과 결합 · 2차시 | 2022 개정 교육과정 [통과1 Ⅱ]

= 오늘의 학습 목표 | 2차시
^ 원자가 **옥텟 규칙**에 따라 전자를 잃거나 얻어 이온이 되는 과정을 설명할 수 있다.
^ 전하의 합이 0이 되도록 **이온 결합 물질의 화학식**을 쓸 수 있다.
^ 이온 결합 물질의 **성질**을 결합과 관련지어 설명할 수 있다.
% 흐름: 생각 열기 5분 → 옥텟 규칙 8분 → 이온 결합 만들기(시뮬레이션) 12분 → 화학식 계산 10분 → 성질·문항 10분

= 소금은 왜 그렇게 단단하고 잘 안 녹을까? | 생각 열기
* 🧂 소금 :: 801 ℃가 되어야 녹는다
* 🧱 산화 마그네슘 :: 2800 ℃ 넘게 견뎌 용광로 내벽에 쓴다
* 💧 소금물 :: 전기가 통한다
* 🔨 소금 결정 :: 망치로 치면 깨진다 (금속처럼 펴지지 않음)
? 금속 나트륨과 독성 기체 염소가 만나 어떻게 안전한 소금이 될까? :: 나트륨은 전자를 **잃고** Na⁺, 염소는 전자를 **얻어** Cl⁻가 되고, 두 이온이 강하게 끌어당겨 결합한다.

= 지난 시간 복습 | 1차시
- 1족 알칼리 금속: 원자가 전자 [[1]]개 → +1가 양이온
- 17족 할로젠: 원자가 전자 [[7]]개 → −1가 음이온
- 18족: 매우 [[안정]]하여 거의 반응하지 않음
? 18족 원소는 왜 안정할까? :: 가장 바깥 전자 껍질에 전자가 **8개**(He는 2개)로 가득 차 있기 때문 — 다른 원자들도 이 상태를 닮으려 한다.

## 이온의 형성 | 옥텟 규칙

= 옥텟 규칙
> 원자들은 18족처럼 가장 바깥 껍질에 전자 8개(He는 2개)를 채워 안정해지려 한다.
| 원자 | 전자 배치 | 변화 | 이온 |
|+ Na | 2, 8, 1 | 전자 1개를 잃음 | [[Na⁺]] (2, 8) |
|+ Mg | 2, 8, 2 | 전자 2개를 잃음 | [[Mg²⁺]] (2, 8) |
|+ Cl | 2, 8, 7 | 전자 1개를 얻음 | [[Cl⁻]] (2, 8, 8) |
|+ O | 2, 6 | 전자 2개를 얻음 | [[O²⁻]] (2, 8) |
~ 금속은 전자를 잃어 양이온, 비금속은 전자를 얻어 음이온이 된다.

= 이온 결합
! 이온 결합: 양이온과 음이온 사이의 정전기적 인력으로 이루어진 결합
- 금속 원소 + 비금속 원소 사이에서 주로 형성
- 화학식: 양이온의 총 전하 + 음이온의 총 전하 = ==0==
>+ 이온 결합 물질은 분자가 아니라 양이온과 음이온이 **규칙적으로 쌓인 결정**이다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#ionic | 금속과 비금속을 골라 [결합시키기]를 누르고 이온과 화학식을 기록하자.
% 표의 5가지 조합을 모둠별로 나누어 기록 → 전하 합 0 규칙을 스스로 발견하게

= 이온과 화학식 | 시뮬레이션 기록
| 금속 | 비금속 | 양이온 | 음이온 | 화학식 |
|+ Na | Cl | Na⁺ | Cl⁻ | NaCl |
|+ Mg | O | Mg²⁺ | O²⁻ | MgO |
|+ Mg | Cl | Mg²⁺ | Cl⁻ | [[MgCl₂]] |
|+ K | S | K⁺ | S²⁻ | [[K₂S]] |
|+ Ca | F | Ca²⁺ | F⁻ | [[CaF₂]] |

= 예제 1 · 산화 알루미늄의 화학식 | 적용
- 알루미늄(13족)과 산소(16족)가 이온 결합한다.
^+ Al: 원자가 전자 3개를 잃음 → **Al³⁺**
^+ O: 전자 2개를 얻음 → **O²⁻**
^+ 전하 합 0: (+3) × 2 + (−2) × 3 = 6 − 6 = 0 → 개수비 **2 : 3**
^+ 화학식 **Al₂O₃**

= 예제 2 · 산화 나트륨과 염화 칼슘 | 적용
- 나트륨과 산소, 칼슘과 염소의 화학식은?
^+ Na⁺ + O²⁻ → (+1) × 2 + (−2) = 0 → **Na₂O**
^+ Ca²⁺ + Cl⁻ → (+2) + (−1) × 2 = 0 → **CaCl₂**
>+ 요령: 전하의 크기를 엇갈려 아래 숫자로 (가장 간단한 정수비로 줄이기)

= 확인 문제 1
Q 마그네슘(2족)과 질소(15족)가 이온 결합한 물질의 화학식은?
o MgN
o Mg₂N₃
o* Mg₃N₂
o MgN₂
:: Mg²⁺와 N³⁻ → (+2) × 3 + (−3) × 2 = 0 → Mg₃N₂

## 이온 결합 물질의 성질 | 왜 그럴까

= 이온 결합 물질의 성질
| 성질 | 특징 | 까닭 |
|+ 녹는점 | 높다 | 이온 사이 인력이 강함 |
|+ 고체의 전기 전도성 | 없다 | 이온이 이동하지 못함 |
|+ 액체·수용액의 전기 전도성 | 있다 | 이온이 자유롭게 이동 |
|+ 외부 힘 | 쉽게 부서짐 | 층이 밀리면 같은 전하끼리 반발 |

= 예제 3 · 녹는점 비교 | 자료 해석
| 물질 | 이온의 전하 | 녹는점 (℃) |
| NaCl | +1, −1 | 801 |
| MgO | +2, −2 | 2852 |
^+ MgO의 이온 전하가 NaCl보다 **2배씩** 크다.
^+ 이온 사이의 정전기적 인력이 훨씬 **강하다.**
^+ 그래서 MgO의 녹는점이 약 **3.6배** 높다 (2852 ÷ 801 ≈ 3.6).
>+ 이온의 전하가 클수록, 이온 사이 거리가 짧을수록 인력이 강하다.

= 생활 속 이온 결합 물질 | 사례
* 🧂 염화 나트륨 :: 소금, 음식의 간과 식품 보존
* 🥚 탄산 칼슘 :: 달걀 껍데기, 조개껍데기, 석회석
* 🦷 플루오린화 나트륨 :: 치약 속 충치 예방 성분
* ❄️ 염화 칼슘 :: 겨울철 도로의 제설제
* 🔥 산화 마그네슘 :: 녹는점이 높아 내화 벽돌로 사용
* 🥤 이온 음료 :: 땀으로 잃은 Na⁺, K⁺ 보충

= 확인 문제 2
Q 이온 결합 물질의 성질로 옳지 않은 것은?
o 녹는점이 높다
o 수용액은 전기가 통한다
o* 고체 상태에서도 전기가 잘 통한다
o 힘을 주면 쉽게 부서진다
:: 고체 상태에서는 이온이 제자리에 묶여 있어 전기가 통하지 않는다.

= 확인 문제 3
Q 이온 결합 물질이 외부 힘을 받으면 쉽게 부서지는 까닭은?
o 이온 사이에 인력이 없어서
o* 층이 밀리면 같은 전하의 이온끼리 마주쳐 반발해서
o 전자가 자유롭게 움직여서
o 녹는점이 낮아서
:: 층이 어긋나면 양이온-양이온, 음이온-음이온이 마주 보게 되어 반발력으로 쪼개진다.

= 확인 문제 4
Q 칼륨(1족)과 산소(16족)가 결합할 때 화학식은?
o KO
o* K₂O
o KO₂
o K₂O₃
:: K⁺ 2개와 O²⁻ 1개 → (+1) × 2 + (−2) = 0

= 서술형 도전 | 생각 넓히기
? 염화 나트륨이 고체일 때는 전기가 통하지 않지만 물에 녹이면 전기가 통하는 까닭을 쓰시오. :: 고체에서는 이온이 결정 속에 고정되어 움직이지 못하지만, 물에 녹으면 Na⁺와 Cl⁻가 자유롭게 이동하며 전하를 운반하기 때문이다.
? 땀을 많이 흘린 뒤 이온 음료를 마시는 까닭을 이온과 연결해 쓰시오. :: 땀으로 Na⁺, K⁺ 같은 이온이 빠져나가므로 이를 보충해 신경 전달과 근육 수축, 체액 균형을 유지하기 위해서이다.

= 오늘 배운 내용 정리
- 가장 바깥 껍질에 전자 8개를 채워 안정 → [[옥텟 규칙]]
- 금속은 전자를 [[잃어]] 양이온, 비금속은 전자를 [[얻어]] 음이온
- 양이온과 음이온의 [[정전기적 인력]] → 이온 결합
- 화학식: 전하의 합 = [[0]] (예: Al₂O₃)
- 녹는점 높음, 고체 전기 전도성 [[없음]], 수용액 전기 전도성 [[있음]]

= 나가기 전 한 문제 | 형성평가
? 칼슘(2족)과 산소(16족)가 이온 결합할 때 만들어지는 이온과 화학식을 쓰고, 이 물질의 녹는점이 NaCl보다 높을지 예상하시오. :: Ca²⁺와 O²⁻ → CaO. 이온의 전하가 NaCl보다 크므로 정전기적 인력이 강해 녹는점이 더 높을 것이다(실제 약 2600 ℃).
