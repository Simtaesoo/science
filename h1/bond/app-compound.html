<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화합물 공방 · 고1 물질의 규칙성과 결합</title>
<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/app.js"></script>
<script src="../../assets/hskit.js"></script>
</head>
<body>
<script>
const app = AppKit({
  id: 'h1bond', title: '화합물 공방', unit: '고1 · 통합과학1 · 26 물질의 규칙성과 결합', back: '../../index.html#hi1', sim: 'sim.html#ionic',
  lead: '주문서에 적힌 화합물을 만들어 납품하세요! <b>이온 결합</b> 주문은 양이온과 음이온을 골라 전하의 합을 0으로, <b>공유 결합</b> 주문은 원자 사이의 결합 수를 맞춰 모든 원자가 안정한 전자 배치가 되게 해야 해요.',
  howto: ['이온 주문: 오른쪽에서 이온의 개수를 <b>＋/－</b>로 정하세요. 전하의 합이 0이고 <b>가장 간단한 정수비</b>여야 해요.', '공유 결합 주문: 무대에서 <b>결합선을 눌러</b> 단일 → 2중 → 3중 결합으로 바꾸세요.', '<b>[납품]</b>을 눌러 검사를 받으세요.'],
  recap: '<b>이온 결합</b>: 금속 원소는 전자를 잃어 양이온, 비금속 원소는 전자를 얻어 음이온이 되고, 두 이온이 정전기적 인력으로 결합한다. 화합물 전체는 전기적으로 중성이므로 (양이온 전하 × 개수) + (음이온 전하 × 개수) = 0 — 예: Mg²⁺ + 2Cl⁻ → MgCl₂, 2Al³⁺ + 3O²⁻ → Al₂O₃. <b>공유 결합</b>: 비금속 원자끼리 전자쌍을 공유해 18족 원소와 같은 전자 배치(옥텟, 수소는 2개)를 이룬다. 원자가 만드는 결합 수는 H 1, O 2, N 3, C 4 — 예: O=C=O, N≡N, H–C≡N.',
  startLabel: '공방 열기'
});
const {S, sfx, toast} = app, D = Draw;
const ION = {Na: ['Na', 1], K: ['K', 1], Mg: ['Mg', 2], Ca: ['Ca', 2], Al: ['Al', 3], Cl: ['Cl', -1], F: ['F', -1], O: ['O', -2], S: ['S', -2]};
const SUP = {1: '⁺', 2: '²⁺', 3: '³⁺', '-1': '⁻', '-2': '²⁻'}, SUB = n => n > 1 ? String(n).split('').map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : '';
const NEED = {H: 1, O: 2, N: 3, C: 4};
const LV = [
  {t: 'ion', name: '염화 나트륨', pal: ['Na', 'Mg', 'Cl', 'O'], want: {Na: 1, Cl: 1}, why: 'Na⁺ 1개(+1)와 Cl⁻ 1개(−1)로 전하 합 0 → NaCl. 소금의 주성분이에요.'},
  {t: 'ion', name: '염화 마그네슘', pal: ['Na', 'Mg', 'Cl', 'O'], want: {Mg: 1, Cl: 2}, why: 'Mg²⁺(+2) 1개에 Cl⁻(−1) 2개가 필요해요 → MgCl₂. 두부를 굳히는 간수의 성분!'},
  {t: 'ion', name: '플루오린화 칼슘', pal: ['K', 'Ca', 'F', 'S'], want: {Ca: 1, F: 2}, why: 'Ca²⁺ + 2F⁻ → CaF₂. 형석이라는 광물로 존재해요.'},
  {t: 'ion', name: '황화 칼륨', pal: ['K', 'Ca', 'F', 'S'], want: {K: 2, S: 1}, why: '2K⁺(+2) + S²⁻(−2) → K₂S. 이번에는 양이온이 2개 필요했어요.'},
  {t: 'ion', name: '산화 알루미늄', pal: ['Mg', 'Al', 'Cl', 'O'], want: {Al: 2, O: 3}, why: '전하의 최소공배수 6: 2Al³⁺(+6) + 3O²⁻(−6) → Al₂O₃. 루비와 사파이어의 주성분이에요.'},
  {t: 'cov', name: '이산화 탄소', at: [['O', -1, 0], ['C', 0, 0], ['O', 1, 0]], bd: [[0, 1], [1, 2]], want: [2, 2], why: 'C는 결합 4개, O는 2개가 필요 → O=C=O (2중 결합 2개).'},
  {t: 'cov', name: '질소 분자', at: [['N', -.5, 0], ['N', .5, 0]], bd: [[0, 1]], want: [3], why: 'N은 결합 3개가 필요 → N≡N 3중 결합. 그래서 질소 기체는 매우 안정해요.'},
  {t: 'cov', name: '사이안화 수소', at: [['H', -1.2, 0], ['C', 0, 0], ['N', 1.2, 0]], bd: [[0, 1], [1, 2]], want: [1, 3], why: 'H는 1개, C는 4개, N은 3개 → H–C≡N.'},
  {t: 'cov', name: '물과 에텐', at: [['H', -2.4, .7], ['O', -1.8, 0], ['H', -1.2, .7], ['H', .2, -.8], ['C', .6, 0], ['C', 1.6, 0], ['H', 2, -.8], ['H', .2, .8], ['H', 2, .8]], bd: [[0, 1], [1, 2], [3, 4], [4, 5], [5, 6], [4, 7], [5, 8]], want: [1, 1, 1, 2, 1, 1, 1], why: '물 H–O–H는 단일 결합 2개, 에텐은 C=C 2중 결합 하나에 C–H 단일 결합 4개.'}];
let ui = {}, cnt = {}, ord = [];
const k = HS(app, {levels: LV, load(L){
  k.mission(ui.g, L.t === 'ion' ? `주문: <b>${L.name}</b><br>알맞은 이온을 골라 전하의 합이 0이 되게 하세요.` : `주문: <b>${L.name}</b><br>결합선을 눌러 모든 원자의 결합 수를 맞추세요. (H 1, O 2, N 3, C 4)`);
  cnt = {}; ord = L.t === 'cov' ? L.bd.map(() => 1) : []; tools(); }});
function charge(){ return Object.keys(cnt).reduce((s, e) => s + ION[e][1] * cnt[e], 0); }
function formula(){ const c = Object.keys(cnt).filter(e => cnt[e] > 0).sort((a, b) => ION[b][1] - ION[a][1]); return c.length ? c.map(e => e + SUB(cnt[e])).join('') : '—'; }
function tools(){ const L = k.L();
  if (L.t === 'cov') { ui.t.innerHTML = `<p class="note-c">무대의 결합선을 눌러 결합 수를 바꾸세요.</p>`; return; }
  ui.t.innerHTML = L.pal.map(e => `<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="min-width:62px;font-weight:700">${e}${SUP[ION[e][1]]}</span><button class="tool" type="button" data-e="${e}" data-d="-1">－</button><b style="min-width:20px;text-align:center">${cnt[e] || 0}</b><button class="tool" type="button" data-e="${e}" data-d="1">＋</button></div>`).join('') + `<p class="note-c">화학식 <b>${formula()}</b> · 전하 합 <b style="color:${charge() ? 'var(--coral)' : 'var(--mint)'}">${charge() > 0 ? '+' : ''}${charge()}</b></p>`;
  ui.t.querySelectorAll('button').forEach(b => b.onclick = () => { const e = b.dataset.e; cnt[e] = D.clamp((cnt[e] || 0) + +b.dataset.d, 0, 6); sfx.pop(); tools(); }); }
function bonds(i){ const L = k.L(); return L.bd.reduce((s, [a, b], j) => s + (a === i || b === i ? ord[j] : 0), 0); }
function geo(){ const L = k.L(), W = S.w, H = S.h, sc = Math.min(W / 6.2, H / 3.2), cx = W / 2, cy = H / 2; return {P: L.at.map(a => [cx + a[1] * sc, cy + a[2] * sc]), sc}; }
app.onStart = () => { ui.g = app.panel('주문서'); ui.t = app.panel('재료'); ui.b = app.panel('');
  k.btn(ui.b, '📦 납품', () => { const L = k.L();
    if (L.t === 'ion') { const used = Object.keys(cnt).filter(e => cnt[e] > 0);
      if (!used.length) return k.fail('재료를 골라 주세요');
      if (used.some(e => !(e in L.want)) || used.length !== Object.keys(L.want).length) return k.fail('주문한 화합물과 다른 이온이 들어 있어요 (이름을 확인!)');
      if (charge()) return k.fail(`전하의 합이 ${charge() > 0 ? '+' : ''}${charge()} — 중성이 아니에요`);
      if (Object.keys(L.want).some(e => cnt[e] !== L.want[e])) return k.fail('중성이지만 가장 간단한 정수비가 아니에요');
      return k.win(ui.g, L.why, formula()); }
    const bad = L.at.filter((a, i) => bonds(i) !== NEED[a[0]]).length;
    if (bad) return k.fail(`결합 수가 맞지 않는 원자가 ${bad}개 있어요`);
    k.win(ui.g, L.why); });
  k.begin(); };
app.pointer({tap(x, y){ const L = k.L(); if (!L || L.t !== 'cov' || k.done) return; const G = geo();
  L.bd.forEach(([a, b], j) => { const mx = (G.P[a][0] + G.P[b][0]) / 2, my = (G.P[a][1] + G.P[b][1]) / 2; if (Math.hypot(x - mx, y - my) < G.sc * .35) { ord[j] = ord[j] % 3 + 1; sfx.click(); } }); }});
k.draw((g, W, H) => { const L = k.L(); g.fillStyle = '#f7f3ea'; g.fillRect(0, 0, W, H);
  if (L.t === 'ion') { const list = []; Object.keys(cnt).forEach(e => { for (let i = 0; i < cnt[e]; i++) list.push(e); });
    const n = list.length; D.text(g, formula(), W / 2, 34, {size: 26, weight: 700, color: '#2b2a26', display: true});
    if (!n) D.text(g, '오른쪽에서 이온을 골라 보세요', W / 2, H / 2, {size: 15, color: '#8a8478'});
    const cols = Math.ceil(Math.sqrt(n * 1.6)) || 1, rows = Math.ceil(n / cols), cw = Math.min(90, (W - 60) / cols), ox = W / 2 - cw * cols / 2 + cw / 2, oy = H / 2 - cw * rows / 2 + cw / 2 + 10, t = performance.now() / 1000;
    list.forEach((e, i) => { const q = ION[e][1], x = ox + (i % cols) * cw, y = oy + Math.floor(i / cols) * cw + Math.sin(t * 2 + i) * 2, r = q > 0 ? cw * .26 : cw * .36;
      g.fillStyle = q > 0 ? '#8ecdf2' : '#9be3b5'; g.strokeStyle = '#2b2a26'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke();
      D.text(g, e, x, y - 2, {size: Math.max(11, r * .55), weight: 700}); D.text(g, SUP[q], x + r * .55, y - r * .6, {size: 13, weight: 700, color: q > 0 ? '#1d5fa0' : '#2f7a4a'}); });
    const c = charge(); D.text(g, `전하의 합: ${c > 0 ? '+' : ''}${c}`, W / 2, H - 22, {size: 16, weight: 700, color: c ? '#d0533f' : '#2f8a55'}); return; }
  const G = geo(); D.text(g, L.name, W / 2, 30, {size: 20, weight: 700, display: true});
  L.bd.forEach(([a, b], j) => { const [x0, y0] = G.P[a], [x1, y1] = G.P[b], dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy), nx = -dy / l, ny = dx / l, o = ord[j];
    for (let m = 0; m < o; m++) { const off = (m - (o - 1) / 2) * 8; g.strokeStyle = '#2b2a26'; g.lineWidth = 3.5; g.beginPath(); g.moveTo(x0 + nx * off, y0 + ny * off); g.lineTo(x1 + nx * off, y1 + ny * off); g.stroke(); }
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2; g.strokeStyle = 'rgba(47,111,208,.35)'; g.setLineDash([3, 4]); g.lineWidth = 1.5; g.beginPath(); g.arc(mx, my, G.sc * .3, 0, 7); g.stroke(); g.setLineDash([]); });
  L.at.forEach((a, i) => { const [x, y] = G.P[i], ok = bonds(i) === NEED[a[0]], r = a[0] === 'H' ? G.sc * .2 : G.sc * .28;
    g.fillStyle = {H: '#ffffff', C: '#555b66', N: '#6f8fe0', O: '#e66a5a'}[a[0]]; g.strokeStyle = ok ? '#2f8a55' : '#d0533f'; g.lineWidth = 4; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke();
    D.text(g, a[0], x, y, {size: r * .8, weight: 700, color: a[0] === 'H' ? '#2b2a26' : '#fff'}); D.text(g, `${bonds(i)}/${NEED[a[0]]}`, x, y + r + 13, {size: 12, weight: 700, color: ok ? '#2f8a55' : '#d0533f'}); });
});
</script>
</body>
</html>
