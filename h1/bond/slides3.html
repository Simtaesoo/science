# 공유 결합과 물질의 성질 | 전자를 함께 나누는 결합 | 고등학교 통합과학1 · 03 물질의 규칙성과 결합 · 3차시 | 2022 개정 교육과정 [통과1 Ⅱ]

= 오늘의 학습 목표 | 3차시
^ 비금속 원자들이 **전자쌍을 공유**하여 결합하는 과정을 설명할 수 있다.
^ 분자의 **공유 전자쌍**과 **비공유 전자쌍**을 셀 수 있다.
^ **이온 결합 물질**과 **공유 결합 물질**의 성질을 비교할 수 있다.
% 흐름: 생각 열기 5분 → 공유 결합 10분 → 분자 모형(시뮬레이션) 12분 → 성질 비교 10분 → 문항 8분

= 설탕물에는 왜 전기가 안 통할까? | 생각 열기
* 🍬 설탕물 :: 물에 잘 녹지만 전구가 켜지지 않는다
* 🧂 소금물 :: 전구가 밝게 켜진다
* 🧊 드라이아이스 :: −78 ℃에서 바로 기체가 된다
* 💎 다이아몬드 :: 탄소로만 되어 있는데 가장 단단하다
? 소금과 설탕은 둘 다 흰 결정인데 성질이 왜 이렇게 다를까? :: 결합 방식이 다르다. 소금은 이온 결합, 설탕은 원자들이 전자를 나누어 가진 **공유 결합** 물질(분자)이다.

= 지난 시간 복습 | 2차시
- 금속 + 비금속 → 전자를 주고받아 [[이온 결합]]
- 이온 결합 물질: 녹는점 [[높음]], 수용액 전기 전도성 [[있음]]
? 비금속끼리 만나면? 둘 다 전자를 얻고 싶어 하는데 어떻게 결합할까? :: 서로 전자를 내놓아 **전자쌍을 만들고 함께 공유**한다 — 둘 다 옥텟을 채우는 방법!

## 공유 결합 | 전자쌍을 나누어 갖기

= 공유 결합
! 공유 결합: 비금속 원자들이 전자를 내놓아 전자쌍을 만들고 이를 공유하는 결합
- **공유 전자쌍**: 두 원자가 함께 가진 전자쌍
- **비공유 전자쌍**: 결합에 참여하지 않은 전자쌍
| 공유 전자쌍 수 | 1개 | 2개 | 3개 |
|+ 결합 | 단일 결합 | [[2중 결합]] | [[3중 결합]] |
|+ 예 | H₂, H₂O | O₂, CO₂ | N₂ |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#covalent | 분자를 바꾸어 가며 [결합시키기]를 누르고 공유 전자쌍과 비공유 전자쌍을 세어 보자.
% H₂ → O₂ → N₂ 순서로 결합 수가 늘어나는 것을 먼저 보고, H₂O·NH₃·CH₄로 비공유 전자쌍 비교

= 분자의 전자쌍 | 시뮬레이션 기록
| 분자 | H₂ | O₂ | N₂ | H₂O | NH₃ | CH₄ | CO₂ |
|+ 공유 전자쌍 | 1 | 2 | 3 | 2 | 3 | 4 | 4 |
|+ 중심 원자의 비공유 전자쌍 | – | – | – | [[2]] | [[1]] | [[0]] | [[0]] |

= 예제 1 · 물 분자 그려 보기 | 적용
- 산소(원자가 전자 6)와 수소 2개(원자가 전자 1)로 물 분자를 만든다.
^+ 산소는 전자 2개가 더 필요 → 수소 2개와 전자쌍을 하나씩 공유
^+ 공유 전자쌍 **2개** (O−H 단일 결합 2개)
^+ 산소에 남은 전자 6 − 2 = 4개 → 비공유 전자쌍 **2개**
^+ 산소 주위 전자 = 공유 4 + 비공유 4 = **8개** (옥텟 ✔)

= 예제 2 · 이산화 탄소 | 적용
- 탄소(원자가 전자 4)와 산소 2개(원자가 전자 6)
^+ 탄소는 전자 4개가 더 필요 → 산소 하나와 전자쌍 2개씩 공유
^+ O=C=O → 2중 결합 2개, 공유 전자쌍 **4개**
^+ 각 산소의 비공유 전자쌍 **2개**, 탄소는 **0개**

= 확인 문제 1
Q 질소 분자(N₂)의 공유 전자쌍 수와 결합의 종류는?
o 1개, 단일 결합
o 2개, 2중 결합
o* 3개, 3중 결합
o 4개, 2중 결합
:: 질소 원자는 각각 전자 3개가 더 필요하여 전자쌍 3개를 공유한다.

## 결합의 종류와 성질 | 이온 결합 vs 공유 결합

= 결합의 종류에 따른 성질 | 비교
| 구분 | 이온 결합 물질 | 공유 결합 물질 (분자) |
|+ 예 | NaCl, MgO | H₂O, CO₂, 설탕 |
|+ 녹는점 | 높다 | [[낮다]] |
|+ 고체의 전기 전도성 | 없음 | 없음 |
|+ 액체·수용액의 전기 전도성 | 있음 | [[대부분 없음]] |
>+ 분자 사이의 힘이 약해 녹는점·끓는점이 대부분 **낮다.**

= 예제 3 · 녹는점 자료 해석 | 자료 해석
| 물질 | 결합 | 녹는점 (℃) |
| 염화 나트륨 | 이온 | 801 |
| 설탕 | 공유 (분자) | 약 186 |
| 물 | 공유 (분자) | 0 |
| 다이아몬드 | 공유 (그물 구조) | 약 3550 |
^+ 분자인 설탕·물은 녹을 때 **분자 사이의 약한 힘**만 끊으면 된다.
^+ 다이아몬드는 분자가 따로 없고 모든 원자가 **공유 결합으로 연결** → 녹이려면 강한 공유 결합을 끊어야 한다.

= 예제 4 · 전기 전도성 실험 | 적용
- 설탕물과 소금물에 각각 전극을 넣었다.
^+ 소금물: NaCl → Na⁺ + Cl⁻ 로 나뉘어 이온이 전하를 운반 → 전구 **켜짐**
^+ 설탕물: 설탕은 **분자 상태** 그대로 녹아 이온이 없음 → 전구 **꺼짐**
>+ 물에 '녹는다'고 모두 전기가 통하는 것은 아니다!

= 생활 속 공유 결합 물질 | 사례
* 💧 물 :: 생명체의 대부분을 이루는 분자
* 🌬️ 질소 :: 3중 결합으로 매우 안정 — 과자 봉지 충전 기체
* 🧊 드라이아이스 :: 이산화 탄소 분자, 분자 사이 힘이 약해 승화
* 💎 다이아몬드 :: 탄소의 그물 구조 공유 결정 — 가장 단단한 천연 물질
* ✏️ 흑연 :: 같은 탄소지만 층 구조라 무르고 전기가 통한다
* 🍬 설탕 :: 물에 녹아도 이온이 생기지 않는 분자

= 확인 문제 2
Q 공유 결합 물질(분자)의 일반적인 성질로 옳은 것은?
o 녹는점이 매우 높다
o 수용액이 모두 전기를 잘 통한다
o* 녹는점과 끓는점이 대부분 낮다
o 고체 상태에서 전기가 잘 통한다
:: 분자 사이의 힘이 약해 녹는점·끓는점이 낮다.

= 확인 문제 3
Q 암모니아(NH₃) 분자에서 중심 원자인 질소의 비공유 전자쌍 수는?
o 0개
o* 1개
o 2개
o 3개
:: 질소의 원자가 전자 5개 중 3개는 수소와 공유, 남은 2개가 비공유 전자쌍 1개를 이룬다.

= 확인 문제 4
Q 질소 분자(N₂)가 매우 안정하여 반응성이 작은 까닭은?
o 원자가 전자가 없어서
o 이온 결합을 하고 있어서
o* 3중 결합으로 강하게 결합하고 있어서
o 분자량이 작아서
:: 공유 전자쌍 3개로 강하게 결합하여 끊기 어렵다.

= 서술형 도전 | 생각 넓히기
? 설탕물과 소금물에 각각 전극을 넣었을 때 전구의 불이 켜지는 쪽과 그 까닭을 쓰시오. :: 소금물. 소금은 물에 녹아 이온으로 나뉘어 전하를 운반하지만, 설탕은 분자 상태로 녹아 전하를 운반할 이온이 없다.
? 다이아몬드는 공유 결합으로만 이루어져 있는데도 녹는점이 매우 높은 까닭을 쓰시오. :: 분자가 따로 없고 모든 탄소 원자가 그물처럼 공유 결합으로 연결된 공유 결정이라, 녹이려면 강한 공유 결합을 끊어야 하기 때문이다.

= 오늘 배운 내용 정리
- 비금속 원자들이 전자쌍을 공유 → [[공유 결합]]
- 공유 전자쌍 1개 단일, 2개 [[2중]], 3개 [[3중]] 결합 (N₂)
- 물 분자: 공유 전자쌍 2개, 산소의 비공유 전자쌍 [[2]]개
- 분자: 녹는점 [[낮음]], 수용액 전기 전도성 대부분 없음
- 이온 결합 물질: 녹는점 높음, 수용액 전기 전도성 [[있음]]

= 나가기 전 한 문제 | 형성평가
? 메테인(CH₄)의 공유 전자쌍 수와 탄소의 비공유 전자쌍 수를 쓰고, 메테인의 녹는점이 높을지 낮을지 까닭과 함께 쓰시오. :: 공유 전자쌍 4개, 비공유 전자쌍 0개. 분자 사이의 힘이 약한 분자 물질이므로 녹는점이 낮다(실제 약 −182 ℃).
