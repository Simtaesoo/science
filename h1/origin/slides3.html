# 별의 진화와 무거운 원소의 생성 | 우리는 별의 먼지 | 고등학교 통합과학1 · 02 자연의 구성 원소 · 3차시 | 2022 개정 교육과정 [10통과1-02-02]

= 오늘의 학습 목표 | 3차시
^ 별 내부의 **핵융합**으로 에너지와 원소가 만들어지는 과정을 설명할 수 있다.
^ **질량에 따라** 별의 진화 경로와 만들어지는 원소가 다름을 비교할 수 있다.
^ 지구와 생명체를 이루는 **원소의 기원**을 우주 역사 순서로 설명할 수 있다.
% 흐름: 생각 열기 5분 → 핵융합 10분 → 별의 일생(시뮬레이션) 12분 → 철에서 멈추는 까닭 8분 → 원소의 기원·문항 10분

= 내 몸의 원소는 어디서 왔을까? | 생각 열기
* 🫁 산소 :: 우리 몸 질량의 약 65 %
* 🧬 탄소 :: 모든 생명체의 뼈대 원소
* 🩸 철 :: 혈액 속 헤모글로빈이 산소를 나른다
* 💍 금 :: 지구에서 매우 희귀한 원소
? 빅뱅 때는 주로 수소와 헬륨만 만들어졌다. 그렇다면 탄소, 산소, 철은 어디서 왔을까? :: **별의 내부**에서 핵융합으로 만들어졌고, 별이 죽을 때 우주로 흩어졌다. 우리 몸의 원소는 오래전 별에서 왔다 — "우리는 별의 먼지"

= 지난 시간 복습 | 2차시
- 빅뱅 후 약 3분: [[헬륨 원자핵]], 약 38만 년: [[원자]]
- 빅뱅 때 만들어진 원소: 주로 [[수소]]와 [[헬륨]]
? 수소와 헬륨이 모여 큰 덩어리가 되면 무슨 일이 일어날까? :: 중력으로 수축하며 중심부의 온도가 높아지고, 약 1000만 K 이상이 되면 **핵융합**이 시작되어 별이 빛난다.

## 핵융합 | 별이 빛나는 까닭

= 별 내부의 핵융합
! 핵융합: 가벼운 원자핵이 합쳐져 무거운 원자핵이 되는 반응
- **주계열성**: 수소 원자핵 4개 → ==헬륨== 원자핵 1개
- 반응 후 줄어든 질량이 **에너지**로 전환된다.
- **적색 거성**: 헬륨 → ==탄소==, 산소
- **질량이 매우 큰 별**: 탄소 → 네온, 산소 → … → ==철==까지 (양파 껍질 구조)

= 예제 1 · 별은 왜 빛날까? | 적용
- 태양 중심부에서는 수소 원자핵 4개가 합쳐져 헬륨 원자핵 1개가 된다.
^+ 반응 뒤 원자핵들의 질량 합이 반응 전보다 **조금 줄어든다.**
^+ 줄어든 질량이 **에너지**로 바뀌어 빛과 열로 나온다.
>+ 별은 핵융합으로 에너지를 내는 동시에 **새로운 원소를 만드는 공장**이다.
% 2022 개정 [10통과1-02-02] 해설: 별 내부 핵융합으로 탄소·질소·산소가 생성되는 것을 정성적으로 다룬다. 질량 결손의 계산(0.7 % 등)은 하지 않는다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#star | 두 질량의 별(태양 정도, 태양의 20배)을 각각 [재생]하여 진화 단계와 만들어지는 원소를 비교하자.
% 두 별을 나란히 놓고 '어느 단계에서 갈라지는가'를 찾게 하기

= 질량에 따른 별의 일생 | 시뮬레이션 기록
| 구분 | 태양 정도 질량 | 태양 질량의 20배 |
|+ 진화 경로 | 원시별 → 주계열성 → 적색 거성 → 행성상 성운 → 백색 왜성 | 원시별 → 주계열성 → 초거성 → 초신성 → 중성자별·블랙홀 |
|+ 가장 무거운 원소 | [[탄소, 산소]] | [[철]] (초신성에서는 더 무거운 원소) |
>+ 별이 무거울수록 중심 온도가 높아 더 무거운 원소까지 만들 수 있다.

= 양파 껍질 구조 | 무거운 별의 내부
^+ 바깥: 수소 → 헬륨
^+ 그 안: 헬륨 → 탄소, 산소
^+ 더 안쪽: 탄소 → 네온, 마그네슘 / 산소 → 규소, 황
^+ 중심: 규소 → **철** (여기서 멈춤)
>+ 안쪽으로 갈수록 온도가 높아 더 무거운 원소가 만들어진다.

## 왜 철에서 멈출까? | 참고 · 평가하지 않음

= 핵자당 결합 에너지 | 그래프
C 질량수에 따른 핵자당 결합 에너지 (근삿값) | 질량수 | 핵자당 결합 에너지 (MeV) | 결합 에너지:1,0 2,1.1 4,7.1 12,7.7 16,8 56,8.8 120,8.5 238,7.6
+ 철(질량수 56)의 핵자당 결합 에너지가 [[가장 크다]] → 가장 안정
+ 철보다 가벼운 원소: 융합하면 에너지 [[방출]] / 철을 융합하면 에너지 [[흡수]]
% 핵자당 결합 에너지는 통합과학 성취기준 밖의 참고 자료다. '철까지는 별 속 핵융합, 철보다 무거운 원소는 초신성 폭발'이라는 결론만 평가한다.

= 예제 2 · 철 이후의 원소는? | 적용
- 금(Au), 우라늄(U)처럼 철보다 무거운 원소는 어떻게 만들어질까?
^+ 철을 융합하면 에너지가 흡수 → 별의 일반적인 핵융합으로는 만들 수 **없다.**
^+ **초신성 폭발**이나 **중성자별 충돌**처럼 막대한 에너지가 순간적으로 공급될 때 만들어진다.
^+ 이런 사건은 드물어 금·우라늄은 우주에서 **희귀**하다.

= 예제 3 · 원소의 출생지 | 적용
| 원소 | 만들어진 곳 |
|+ 수소 | [[빅뱅]] |
|+ 헬륨 | [[빅뱅]], 주계열성 |
|+ 탄소, 산소 | [[적색 거성]] 등 별 내부 |
|+ 철 | [[무거운 별]]의 중심부 |
|+ 금, 우라늄 | [[초신성 폭발]], 중성자별 충돌 |

= 지구와 생명체 원소의 기원
^+ 빅뱅 → **수소·헬륨** 생성
^+ 이전 세대 별 내부 핵융합 → **탄소·산소·철** 생성
^+ 별의 죽음(행성상 성운, 초신성) → 원소가 우주로 **방출**
^+ 성운이 수축 → **태양계·지구** 형성 → 생명체의 재료
>+ 태양은 이전 별들이 남긴 재료로 만들어진 '다음 세대' 별이다.

= 생활 속 별의 원소 | 사례
* 🩸 헤모글로빈의 철 :: 무거운 별의 중심부에서 만들어졌다
* 💍 금반지 :: 초신성이나 중성자별 충돌의 흔적
* ☢️ 원자력 발전의 우라늄 :: 철보다 무거운 원소 — 폭발적 사건에서 생성
* 🌞 태양 :: 지금도 매초 약 6억 톤의 수소를 헬륨으로 바꾼다
* 🎈 헬륨 풍선 :: 일부는 빅뱅, 일부는 별에서 만들어진 헬륨
* 🧂 소금의 나트륨·염소 :: 무거운 별 내부의 핵융합 산물

= 확인 문제 1
Q 주계열성의 중심부에서 일어나는 핵융합은?
o 헬륨 → 탄소
o* 수소 → 헬륨
o 탄소 → 철
o 철 → 금
:: 주계열성은 수소 원자핵 4개가 헬륨 원자핵 1개로 융합하며 에너지를 낸다.

= 확인 문제 2
Q 태양 정도 질량의 별에서 만들어질 수 있는 가장 무거운 원소 수준은?
o 철
o 금
o* 탄소, 산소
o 우라늄
:: 태양 정도 질량의 별은 적색 거성 단계에서 탄소·산소까지 만들고 백색 왜성이 된다.

= 확인 문제 3
Q 철보다 무거운 금, 우라늄 같은 원소가 주로 만들어지는 곳은?
o 주계열성의 중심부
o 적색 거성의 바깥층
o* 초신성 폭발
o 지구의 내부
:: 철보다 무거운 원소는 별 속의 일반적인 핵융합으로는 만들어지지 않고, 초신성 폭발 같은 사건에서 만들어진다.

= 확인 문제 4
Q 태양 정도 질량의 별 속에서 핵융합으로 만들어지는 원소를 순서대로 바르게 나타낸 것은?
o 철 → 탄소 → 헬륨
o* 수소 → 헬륨 → 탄소·산소
o 헬륨 → 수소 → 철
o 탄소 → 수소 → 우라늄
:: 주계열성 단계에서 수소가 헬륨으로, 적색 거성 단계에서 헬륨이 탄소·산소로 융합한다.

= 서술형 도전 | 생각 넓히기
? 지구 생명체의 몸을 이루는 탄소·산소·철의 기원을 우주 역사 순서로 설명하시오. :: 빅뱅으로 수소·헬륨 생성 → 이전 세대 별 내부 핵융합으로 탄소·산소·철 생성 → 별의 죽음(행성상 성운, 초신성)으로 우주에 방출 → 성운이 수축해 태양계·지구 형성 → 생명체의 재료가 되었다.
? 금(Au)이 지구에서 희귀한 까닭을 원소가 만들어지는 과정과 연결하여 쓰시오. :: 금은 철보다 무거워 별 내부의 일반적인 핵융합으로 만들어지지 않고, 초신성 폭발이나 중성자별 충돌 같은 드문 사건에서만 만들어지므로 우주 전체에서 양이 매우 적다.

= 오늘 배운 내용 정리
- 가벼운 원자핵이 합쳐져 무거운 원자핵 → [[핵융합]], 줄어든 질량은 에너지로
- 주계열성: 수소 → [[헬륨]], 적색 거성: 헬륨 → [[탄소]]·산소
- 무거운 별의 중심부: … → [[철]]까지 (양파 껍질 구조)
- 별 속 핵융합은 [[철]]까지 — 그보다 무거운 원소는 별 속에서 만들어지지 않는다
- 철보다 무거운 원소 → [[초신성]] 폭발, 중성자별 충돌

= 나가기 전 한 문제 | 형성평가
? 태양 질량의 20배인 별과 태양 정도 질량인 별의 일생에서 마지막 단계를 각각 쓰고, 무거운 원소를 더 많이 만드는 별을 고르시오. :: 20배인 별: 초신성 폭발 후 중성자별 또는 블랙홀 / 태양 정도 별: 행성상 성운 후 백색 왜성 → 무거운 원소는 20배인 별이 더 많이 만든다(철까지, 초신성에서 더 무거운 원소).
