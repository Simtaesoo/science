# 스펙트럼과 우주의 구성 원소 | 빛으로 읽는 원소의 지문 | 고등학교 통합과학1 · 02 자연의 구성 원소 · 1차시 | 2022 개정 교육과정 [10통과1-02-01]

= 오늘의 학습 목표 | 1차시
^ **연속·방출·흡수 스펙트럼**을 구별하고 생기는 조건을 설명할 수 있다.
^ 선 스펙트럼이 **원소의 지문** 역할을 하는 까닭을 설명할 수 있다.
^ 별빛의 스펙트럼으로 **우주를 구성하는 원소**를 알아낼 수 있음을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 스펙트럼 3종 10분 → 수소 스펙트럼(시뮬레이션) 10분 → 별빛 분석 12분 → 문항 8분

= 가 보지 않은 별의 성분을 어떻게 알까? | 생각 열기
* ⭐ 별 :: 가장 가까운 별도 빛으로 4년 넘게 가야 한다
* 🌈 무지개 :: 햇빛을 나누면 여러 색이 나타난다
* 🎆 불꽃놀이 :: 금속마다 다른 색의 불꽃을 낸다
* 🔦 가로등 :: 나트륨등은 유난히 노란빛을 낸다
? 별에 직접 가지 않고도 별을 이루는 원소를 알 수 있는 방법은? :: 별이 보낸 **빛을 파장별로 나누어**(스펙트럼) 보면, 원소마다 정해진 위치에 선이 나타나 어떤 원소가 있는지 알 수 있다.

= 중학교에서 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 빛의 분산 | 프리즘을 지나며 색(파장)에 따라 나뉨 |
| 불꽃 반응 | 금속 원소마다 고유한 불꽃색 (Na 노란색, Cu 청록색) |
| 원자 | 원자핵과 전자로 이루어짐 |
? 리튬과 스트론튬은 불꽃색이 모두 빨간색이다. 어떻게 구별할까? :: 불꽃의 빛을 분광기로 보면 **선의 위치**가 달라 구별할 수 있다 — 오늘의 선 스펙트럼!

## 스펙트럼 | 빛을 파장별로 나누다

= 스펙트럼의 종류
| 종류 | 생기는 조건 | 모습 |
|+ 연속 스펙트럼 | 고온의 고체, 밀도가 큰 기체 | 끊김 없는 [[무지개색 띠]] |
|+ 방출 스펙트럼 | 고온의 [[기체]]가 방출하는 빛 | 검은 바탕에 [[밝은 선]] |
|+ 흡수 스펙트럼 | 연속 스펙트럼이 저온 기체를 통과 | 연속 스펙트럼에 [[검은 선]] |
>+ 같은 원소는 방출선과 흡수선의 위치가 **같다** → 원소의 **지문**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#spec | [방출 스펙트럼]과 [흡수 스펙트럼]에서 수소를 골라 선의 위치를 비교하자. 이어서 [별빛 분석]에서 별의 흡수선과 일치하는 원소를 모두 찾자.
% 수소 방출 ↔ 흡수 전환을 반복해 선 위치가 겹치는 장면을 강조

= 수소의 선 스펙트럼 | 시뮬레이션 기록
| 구분 | 수소 방출 스펙트럼 | 수소 흡수 스펙트럼 |
|+ 바탕 | 검은색 | 연속 스펙트럼(무지개색) |
|+ 선의 모양 | 밝은 선 | 검은 선 |
|+ 선의 위치 (nm) | 410, 434, 486, 656 | [[410, 434, 486, 656]] (같음) |
>+ 원자는 자신이 **내보낼 수 있는 파장의 빛만 흡수**한다.

= 선 스펙트럼은 왜 생길까?
- 원자 속 전자는 정해진 **에너지 준위**에만 있을 수 있다.
- 전자가 높은 준위 → 낮은 준위로 내려오면 그 **차이만큼의 빛**을 방출 (밝은 선)
- 같은 차이만큼의 빛을 흡수하면 낮은 → 높은 준위로 올라감 (검은 선)
>+ 원소마다 에너지 준위가 달라 선의 위치가 다르다.
% 에너지 준위는 '계단'에 비유하여 직관적으로만 소개 (자세한 내용은 물리학·화학)

= 예제 1 · 어떤 원소일까? | 적용
- 가로등의 노란빛을 분광기로 보았더니 589 nm 부근에 밝은 선이 나타났다.
^+ 검은 바탕에 밝은 선 → **방출 스펙트럼** (가로등 속 고온 기체)
^+ 589 nm는 나트륨의 선 위치와 일치
^+ 가로등에 들어 있는 원소는 **나트륨** (나트륨등)

= 확인 문제 1
Q 연속 스펙트럼의 빛이 저온의 기체를 통과할 때 나타나는 스펙트럼은?
o 연속 스펙트럼
o 방출 스펙트럼
o* 흡수 스펙트럼
o 아무 선도 나타나지 않는다
:: 기체가 특정 파장의 빛을 흡수하여 연속 스펙트럼에 검은 선이 생긴다.

## 별빛 분석 | 우주를 이루는 원소

= 예제 2 · 별의 흡수선 맞추기 | 자료 해석
| 원소 | 선의 위치 (nm) |
| 수소 | 410, 434, 486, 656 |
| 헬륨 | 447, 502, 588, 668 |
| 나트륨 | 589 |
- 어떤 별의 흡수선: 410, 434, 486, 589, 656 nm
^+ 410, 434, 486, 656 → **수소**의 선 4개가 모두 일치
^+ 589 → **나트륨**과 일치
^+ 헬륨의 447, 502, 668 nm가 없으므로 헬륨은 이 범위에서 확인되지 않음
% 헬륨 선 위치는 비교를 위한 대표값(근삿값)

= 우주를 구성하는 원소
- 별빛 스펙트럼에서 가장 강하게 나타나는 원소: ==수소와 헬륨==
! 우주 원소의 질량비: 수소 약 74 %, 헬륨 약 24 %, 나머지 약 2 %
>+ 우주는 대부분 **수소와 헬륨**으로 되어 있다 — 왜 그럴까? (2차시: 빅뱅)

= 예제 3 · 질량비 해석하기 | 적용
- 수소 : 헬륨의 질량비가 약 3 : 1이다. 수소 원자 1개의 질량을 1, 헬륨 원자 1개의 질량을 4라고 하면 원자 수의 비는?
^+ 수소 원자 수 ∝ 3 ÷ 1 = 3
^+ 헬륨 원자 수 ∝ 1 ÷ 4 = 0.25
^+ 원자 수의 비 = 3 : 0.25 = **12 : 1**
>+ 원자 수로 보면 우주의 원자 13개 중 12개가 수소!

= 생활 속 스펙트럼 | 사례
* 🔦 나트륨등 :: 589 nm 노란빛 — 안개 속에서도 잘 보인다
* 🎆 불꽃놀이 :: 금속 원소마다 다른 색 (Sr 빨강, Ba 초록, Cu 청록)
* 🔬 성분 분석 :: 공장 폐수·토양 속 중금속을 스펙트럼으로 검출
* 🌞 헬륨의 발견 :: 지구보다 태양 스펙트럼에서 먼저 발견된 원소
* 🌌 우주 망원경 :: 외계 행성 대기의 성분을 흡수선으로 알아낸다
* 💡 네온사인 :: 기체마다 다른 색의 방출선

= 확인 문제 2
Q 같은 원소의 방출 스펙트럼과 흡수 스펙트럼에 대한 설명으로 옳은 것은?
o 선의 위치가 서로 다르다
o* 선의 위치가 같다
o 흡수 스펙트럼에는 선이 없다
o 방출 스펙트럼은 연속적인 띠이다
:: 원자는 방출할 수 있는 파장의 빛을 흡수하므로 선의 위치가 같다.

= 확인 문제 3
Q 별빛 스펙트럼 분석으로 알 수 있는 우주의 구성 원소 중 가장 많은 두 원소는?
o 산소, 탄소
o 철, 니켈
o* 수소, 헬륨
o 질소, 산소
:: 우주 원소 질량의 약 98 %가 수소와 헬륨이다.

= 확인 문제 4
Q 고온의 기체가 내는 빛을 분광기로 볼 때의 모습은?
o 끊김 없는 무지개색 띠
o* 검은 바탕에 몇 개의 밝은 선
o 무지개색 띠에 검은 선
o 아무것도 보이지 않는다
:: 고온 기체의 방출 스펙트럼은 특정 파장의 밝은 선으로 나타난다.

= 서술형 도전 | 생각 넓히기
? 선 스펙트럼이 '원소의 지문'이라고 불리는 까닭을 쓰시오. :: 원소마다 선이 나타나는 위치(파장)가 서로 달라, 선의 위치를 비교하면 어떤 원소인지 알아낼 수 있기 때문이다.
? 헬륨은 지구보다 태양에서 먼저 발견되었다. 어떻게 가능했는지 쓰시오. :: 태양 스펙트럼에서 지구에서 알려진 어떤 원소와도 일치하지 않는 선이 발견되어 새 원소로 보고 태양(helios)의 이름을 따 헬륨이라 했다.

= 적용 미션 · 스펙트럼 탐정 | 게임
@ app-spectrum.html | 별과 은하의 흡수 스펙트럼에 원소 기준선을 겹쳐 구성 원소를 찾자. 은하는 적색 편이부터!
% 헬륨 587.6 nm와 나트륨 589 nm처럼 가까운 선을 구별하는 것이 핵심

= 오늘 배운 내용 정리
- 고온의 고체·밀도가 큰 기체 → [[연속]] 스펙트럼
- 고온의 기체 → 검은 바탕에 밝은 선 → [[방출]] 스펙트럼
- 연속 스펙트럼이 저온 기체 통과 → 검은 선 → [[흡수]] 스펙트럼
- 같은 원소의 방출선과 흡수선 위치는 [[같다]] → 원소의 지문
- 우주 원소의 약 98 %는 [[수소]]와 [[헬륨]]

= 나가기 전 한 문제 | 형성평가
? 어떤 별의 흡수선이 410, 434, 486, 656 nm에 나타났다. 이 별에 있는 원소와 판단 근거를 쓰시오. :: 수소. 별의 흡수선 위치가 수소의 선 스펙트럼 위치(410, 434, 486, 656 nm)와 모두 일치하기 때문이다.
