# 빅뱅과 원소의 생성 | 우주의 처음 몇 분 | 고등학교 통합과학1 · 02 자연의 구성 원소 · 2차시 | 2022 개정 교육과정 [통과1 Ⅱ]

= 오늘의 학습 목표 | 2차시
^ **빅뱅 우주론**의 핵심 내용을 설명할 수 있다.
^ 우주 초기에 **기본 입자 → 원자핵 → 원자**가 만들어지는 과정을 설명할 수 있다.
^ 수소와 헬륨의 **질량비 3 : 1**을 계산하고 빅뱅 우주론의 증거를 말할 수 있다.
% 흐름: 생각 열기 5분 → 빅뱅 우주론 7분 → 우주 연대표(시뮬레이션) 12분 → 질량비 계산 12분 → 증거·문항 9분

= 우주는 처음부터 지금 모습이었을까? | 생각 열기
* 🌌 은하 :: 멀리 있는 은하일수록 더 빨리 멀어진다
* 📺 옛날 TV 잡음 :: 화면 잡음의 일부는 우주가 시작될 때의 빛이다
* 🎈 풍선 :: 부풀릴수록 표면의 점들이 서로 멀어진다
* ⭐ 별빛 :: 우주의 원소는 대부분 수소와 헬륨 (1차시)
? 은하들이 서로 멀어지고 있다면, 시간을 거꾸로 돌리면 어떻게 될까? :: 우주의 모든 것이 한 점에 모여 있었을 것이다 — 매우 뜨겁고 밀도가 큰 상태에서 시작된 **빅뱅**

= 지난 시간 복습 | 1차시
- 같은 원소의 방출선과 흡수선 위치는 [[같다]].
- 우주 원소의 약 98 %는 [[수소]]와 [[헬륨]]
- 수소 : 헬륨 질량비 약 [[3 : 1]]
? 우주에 왜 수소와 헬륨이 이렇게 많을까? :: 우주가 탄생한 직후 처음 만들어진 원소가 바로 수소와 헬륨이기 때문 — 오늘의 주제!

## 빅뱅 우주론 | 뜨거운 한 점에서 시작

= 빅뱅 우주론
! 약 138억 년 전 매우 뜨겁고 밀도가 큰 한 점에서 대폭발로 우주가 시작되어 팽창하며 식어 왔다
- 우주가 **팽창** → 온도가 **낮아짐** → 입자들이 결합할 수 있게 됨
- 빅뱅 때 만들어진 원소: 주로 ==수소와 헬륨==
>+ 우주가 식어 가는 순서대로 점점 **큰 구조**가 만들어졌다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#bigbang | [재생]을 눌러 시간에 따라 우주의 온도와 만들어지는 입자를 관찰하자.
% 각 시기에서 멈추고 '온도가 왜 이만큼 낮아져야 이 입자가 생길까'를 묻기

= 우주의 연대표 | 시뮬레이션 기록
| 시기 | 온도 | 만들어진 것 |
|+ 10⁻⁶초 무렵 | 약 1조 ℃ | 양성자, 중성자 (쿼크 결합) |
|+ 약 3분 | 약 10억 ℃ | [[헬륨 원자핵]] |
|+ 약 38만 년 | 약 3000 ℃ | [[수소·헬륨 원자]] |
^+ 기본 입자(쿼크, 전자) → 양성자·중성자 → 원자핵 → 원자

= 원자의 생성과 우주 배경 복사
- 원자가 생기기 전: 자유로운 전자가 빛과 계속 충돌 → 우주가 ==불투명==
- 약 38만 년: 전자가 원자핵에 붙잡혀 원자 형성 → 빛이 ==직진==
>+ 이때 퍼져 나간 빛이 오늘날 **우주 배경 복사**로 관측된다.
~ 우주 배경 복사는 처음 약 3000 K의 빛이었지만 지금은 약 2.7 K의 마이크로파로 관측된다.

= 확인 문제 1
Q 빅뱅 후 약 38만 년 무렵에 일어난 일로 옳은 것은?
o 쿼크가 결합하여 양성자가 생겼다
o 헬륨 원자핵이 처음 생겼다
o* 원자핵과 전자가 결합하여 원자가 생겼다
o 별에서 철이 만들어졌다
:: 온도가 약 3000 ℃로 낮아져 전자가 원자핵에 붙잡혀 원자가 만들어졌다.

## 수소와 헬륨의 질량비 | 빅뱅의 계산서

= 질량비 3 : 1은 어떻게 나올까?
- 빅뱅 후 약 3분, 양성자 : 중성자의 개수비 ≈ ==7 : 1==
- 중성자는 거의 모두 양성자와 함께 **헬륨 원자핵**(양성자 2 + 중성자 2)이 된다.
- 남은 양성자 = **수소 원자핵**
% 양성자·중성자 질량은 1로 보고 계산함을 먼저 약속

= 예제 1 · 16개로 계산하기 | 적용
- 양성자 14개, 중성자 2개가 있다.
^+ 헬륨 원자핵 = 중성자 2 + 양성자 2 → **1개** (질량 4)
^+ 남은 양성자 = 14 − 2 = **12개** → 수소 원자핵 (질량 12)
^+ 수소 : 헬륨 질량비 = 12 : 4 = **3 : 1**
>+ 관측값(약 3 : 1)과 **일치** → 빅뱅 우주론의 강력한 증거!

= 예제 2 · 80개로 계산하기 | 적용
- 양성자 70개, 중성자 10개 (개수비 7 : 1)
^+ 헬륨 원자핵: 중성자 10개 ÷ 2 = **5개** → 양성자 10개 사용, 질량 5 × 4 = 20
^+ 남은 양성자 = 70 − 10 = **60개** → 질량 60
^+ 질량비 60 : 20 = **3 : 1** → 개수가 달라도 비는 같다!

= 예제 3 · 식어 버린 빛 | 적용
- 우주 배경 복사의 온도가 약 3000 K에서 약 2.7 K로 낮아졌다.
^+ 3000 ÷ 2.7 ≈ **1100배** 낮아짐
^+ 우주가 팽창하며 빛의 **파장도 늘어나** 에너지가 낮아졌다.
^+ 그 사이 우주의 크기도 약 **1100배** 커졌다고 해석한다.

= 빅뱅 우주론의 증거
* 📡 우주 배경 복사 :: 하늘의 모든 방향에서 오는 약 2.7 K의 마이크로파
* ⚖️ 수소 : 헬륨 = 3 : 1 :: 빅뱅 이론의 계산과 관측이 일치
* 🌌 우주 팽창 :: 멀리 있는 은하일수록 빨리 멀어진다
>+ 세 가지 독립적인 증거가 같은 결론을 가리킨다.

= 생활 속 빅뱅 이야기 | 사례
* 📺 TV 잡음 :: 아날로그 TV 잡음의 약 1 %는 우주 배경 복사
* 🎈 풍선 모형 :: 풍선을 불면 점들 사이가 모두 멀어진다 — 중심이 없는 팽창
* 🍞 건포도 빵 :: 부푸는 빵 속 건포도처럼 은하가 서로 멀어진다
* 🛰️ 우주 망원경 :: 배경 복사의 아주 작은 온도 차이로 우주 구조를 연구
* 🎈 헬륨 풍선 :: 그 안의 헬륨 원자 일부는 빅뱅 3분 무렵에 만들어졌다

= 확인 문제 2
Q 빅뱅 후 약 3분 무렵 양성자 : 중성자 = 7 : 1일 때, 예상되는 수소 : 헬륨 질량비는?
o 7 : 1
o* 3 : 1
o 1 : 1
o 12 : 1
:: 양성자 14, 중성자 2 → 헬륨 1개(질량 4), 수소 12개(질량 12) → 12 : 4 = 3 : 1

= 확인 문제 3
Q 빅뱅 우주론의 증거로 알맞지 않은 것은?
o 우주 배경 복사
o 수소와 헬륨의 질량비
o 멀리 있는 은하일수록 빨리 멀어진다
o* 지구의 핵이 철로 되어 있다
:: 지구 핵의 철은 별 내부의 핵융합과 관련 있으며 빅뱅 우주론의 직접적인 증거가 아니다.

= 확인 문제 4
Q 원자가 만들어지기 전 우주가 불투명했던 까닭은?
o 우주가 너무 어두웠기 때문에
o* 자유로운 전자가 빛과 계속 충돌했기 때문에
o 수소가 빛을 모두 흡수했기 때문에
o 별이 아직 없었기 때문에
:: 전자가 빛을 계속 산란시켜 빛이 직진하지 못했다.

= 서술형 도전 | 생각 넓히기
? 빅뱅 우주론을 뒷받침하는 증거 세 가지를 쓰시오. :: 우주 배경 복사, 수소와 헬륨의 질량비(약 3 : 1), 멀리 있는 은하일수록 빨리 멀어진다(우주 팽창).
? 우주 배경 복사가 처음 약 3000 K의 빛이었는데 지금은 약 2.7 K의 마이크로파로 관측되는 까닭을 쓰시오. :: 우주가 팽창하면서 빛의 파장도 함께 늘어나 에너지가 낮아졌기 때문이다(온도가 낮은 복사처럼 보인다).

= 오늘 배운 내용 정리
- 약 [[138억]] 년 전 뜨겁고 밀도가 큰 한 점에서 우주가 시작되어 팽창 → [[빅뱅]] 우주론
- 기본 입자 → 양성자·중성자 → [[원자핵]](약 3분) → [[원자]](약 38만 년)
- 원자 형성 후 직진한 빛 → [[우주 배경 복사]]
- 양성자 : 중성자 = 7 : 1 → 수소 : 헬륨 질량비 [[3 : 1]]

= 나가기 전 한 문제 | 형성평가
? 양성자 28개, 중성자 4개가 있을 때 만들어지는 헬륨 원자핵 수와 남는 수소 원자핵 수, 질량비를 구하시오. :: 헬륨 원자핵 2개(질량 8), 남은 양성자 28 − 4 = 24개(질량 24) → 수소 : 헬륨 = 24 : 8 = 3 : 1
