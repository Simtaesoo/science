## 물질대사와 효소 | 생명체 속 화학 반응

= 물질대사
! 물질대사: 생명체 안에서 일어나는 모든 화학 반응
| 구분 | 동화 작용 | 이화 작용 |
|+ 반응 | 작은 분자 → 큰 분자 (합성) | 큰 분자 → 작은 분자 (분해) |
|+ 에너지 | 흡수 | 방출 |
|+ 예 | 광합성, 단백질 합성 | 세포 호흡, 소화 |
>+ 체온(약 37 ℃)처럼 낮은 온도에서도 반응이 빠르게 일어나는 비밀 → **효소**

= 효소
! 효소: 화학 반응의 활성화 에너지를 낮추어 반응을 빠르게 하는 생체 촉매 (주성분: 단백질)
- **기질 특이성**: 활성 부위에 꼭 맞는 특정 ==기질==하고만 결합 (자물쇠와 열쇠)
- 반응 전후에 변하지 않아 ==재사용==된다.
>+ 효소는 반응물과 생성물의 에너지 차이(반응열)는 **바꾸지 못한다.**

= 예제 1 · 활성화 에너지 | 적용
- 어떤 반응의 활성화 에너지가 효소가 없을 때 75 kJ, 효소가 있을 때 30 kJ이다. 반응물과 생성물의 에너지 차이는 20 kJ(방출)이다.
^+ 효소가 낮춘 활성화 에너지 = 75 − 30 = **45 kJ**
^+ 반응열: 효소가 있어도 없어도 **20 kJ 방출 (같다)**
>+ 효소는 '산을 깎는' 것이 아니라 '더 낮은 고갯길'을 내는 것!

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#enzyme | 온도와 기질 농도를 바꾸며 반응 속도를 기록하고, [효소 넣기]를 껐다 켜며 비교하자.
% 온도 → 기질 농도 순서. 60 ℃에서 다시 37 ℃로 내려도 회복되지 않는 점을 확인

= 온도와 기질 농도 | 시뮬레이션 기록
| 온도 (℃) | 10 | 37 | 60 |
|+ 반응 속도 | 낮음 | [[가장 빠름]] (최적 온도) | 거의 0 ([[변성]]) |
| 기질 농도 | 4 | 12 | 40 |
|+ 반응 속도 | 증가 | 증가 폭이 줄어듦 | 거의 일정 ([[포화]]) |

= 그래프로 보면 | 예시 자료
C 온도와 반응 속도 | 온도 (℃) | 상대적 반응 속도 | 반응 속도:10,20 20,45 30,75 37,100 45,70 60,0
||
C 기질 농도와 반응 속도 | 기질 농도 | 상대적 반응 속도 | 반응 속도:0,0 4,40 8,62 12,75 20,88 40,98
~ 왼쪽: 최적 온도 이후 급격히 감소(변성) / 오른쪽: 효소가 모두 일하면 더 빨라지지 않음(포화)

= 예제 2 · 포화 해석 | 적용
- 기질 농도를 20에서 40으로 2배 늘렸는데 반응 속도는 88에서 98로 약간만 늘었다.
^+ 거의 모든 효소의 활성 부위가 기질과 **결합해 일하는 중**
^+ 반응 속도를 결정하는 것은 이제 **효소의 수**
^+ 더 빠르게 하려면 기질이 아니라 **효소를 더 넣어야** 한다.

= 예제 3 · 간 실험 설계 | 적용
| 시험관 | 넣은 것 | 거품 |
|+ A | 과산화 수소수 + 생간 | [[많이 생김]] |
|+ B | 과산화 수소수 + 삶은 간 | [[거의 없음]] |
|+ C | 과산화 수소수만 | [[거의 없음]] |
- C는 **대조군**: 효소가 없으면 반응이 매우 느리다는 것을 보여 준다.
- A와 B 비교 → 열에 의한 효소의 **변성** 확인

= 생활 속 효소 | 사례
* 🧺 효소 세제 :: 단백질·지방 분해 효소가 얼룩 제거
* 💊 소화제 :: 소화 효소로 음식물 분해를 돕는다
* 🍍 연육제 :: 파인애플·키위의 단백질 분해 효소가 고기를 연하게
* 🥢 김치·된장 :: 미생물의 효소로 발효
* 🍚 밥 씹기 :: 침 속 아밀레이스가 녹말을 엿당으로
* 🧪 진단 키트 :: 효소 반응으로 혈당 등을 측정

= 확인 문제 1
Q 효소에 대한 설명으로 옳지 않은 것은?
o 주성분은 단백질이다
o 활성화 에너지를 낮춘다
o 특정 기질하고만 결합한다
o* 반응열을 줄여 반응을 빠르게 한다
:: 효소는 반응열(반응물과 생성물의 에너지 차이)을 바꾸지 못한다.

= 확인 문제 2
Q 사람 몸속 효소가 60 ℃에서 거의 작용하지 못하는 까닭은?
o 기질이 없어져서
o* 열에 의해 효소의 입체 구조가 변형되어서
o 활성화 에너지가 너무 낮아져서
o 효소가 너무 많아져서
:: 단백질인 효소가 높은 온도에서 변성되어 기질과 결합하지 못한다.

= 확인 문제 3
Q 기질 농도가 충분히 높아진 뒤 반응 속도를 더 높이는 방법은?
o 기질을 더 넣는다
o* 효소의 양을 늘린다
o 온도를 80 ℃로 높인다
o 반응 시간을 줄인다
:: 포화 상태에서는 효소의 수가 반응 속도를 제한한다.

= 확인 문제 4
Q 큰 분자를 작은 분자로 분해하며 에너지를 방출하는 물질대사는?
o 동화 작용
o* 이화 작용
o 광합성
o 단백질 합성
:: 세포 호흡·소화처럼 분해하며 에너지를 방출하는 반응은 이화 작용이다.

= 확인 문제 5 · 그래프 해석
Q 효소의 반응 속도가 37 ℃에서 100, 60 ℃에서 0이었다. 60 ℃에 두었던 효소를 다시 37 ℃로 옮기면?
o 반응 속도가 다시 100이 된다
o 반응 속도가 50이 된다
o* 반응 속도가 거의 0으로 회복되지 않는다
o 반응 속도가 100보다 커진다
:: 열에 의해 변성된 효소는 입체 구조가 망가져 온도를 낮추어도 대부분 기능을 회복하지 못한다.

= 서술형 도전 | 생각 넓히기
? 간을 과산화 수소수에 넣으면 거품이 생기지만 삶은 간을 넣으면 거의 생기지 않는 까닭을 쓰시오. :: 간 속 효소(카탈레이스)가 과산화 수소를 분해하는데, 삶으면 효소가 열에 의해 변성되어 작용하지 못하기 때문이다.
? 기질 농도가 충분히 높아지면 반응 속도가 더 이상 증가하지 않는 까닭을 쓰시오. :: 모든 효소가 기질과 결합하여 일하고 있어(포화), 효소의 수가 반응 속도를 제한하기 때문이다.

= 오늘 배운 내용 정리
- 생명체 안의 모든 화학 반응 → [[물질대사]] (동화 작용 / [[이화 작용]])
- 효소는 [[활성화 에너지]]를 낮추는 생체 촉매, 주성분 [[단백질]]
- 특정 기질하고만 결합 → [[기질 특이성]], 반응 후 재사용
- 최적 온도를 넘으면 [[변성]] → 반응 속도 급감
- 기질 농도가 높아지면 [[포화]] → 반응 속도 일정

= 나가기 전 한 문제 | 형성평가
? 효소가 없을 때 활성화 에너지가 60 kJ, 효소가 있을 때 25 kJ이고 반응열이 15 kJ(방출)일 때, 효소가 낮춘 에너지와 효소가 있을 때의 반응열을 쓰시오. :: 낮춘 활성화 에너지 = 60 − 25 = 35 kJ, 반응열은 효소와 관계없이 15 kJ 방출로 같다.
