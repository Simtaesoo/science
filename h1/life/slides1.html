= 배추를 소금에 절이면? | 생각 열기
* 🥬 배추 절이기 :: 소금을 뿌리면 숨이 죽고 물이 빠져나온다
* 💉 링거액 :: 그냥 물이 아니라 0.9 % 소금물을 쓴다
* 🌊 바닷물 :: 목이 말라도 마시면 더 탈수된다
* 🌹 시든 꽃 :: 물에 꽂아 두면 다시 싱싱해진다
? 소금을 뿌렸는데 왜 배추에서 물이 빠져나올까? :: 세포막을 경계로 **물이 농도가 낮은 쪽(세포 안)에서 높은 쪽(소금물)으로** 이동하기 때문 — **삼투**

| 개념 | 내용 |

? 방 한구석에서 향수를 뿌리면 방 전체에서 냄새가 나는 까닭은? :: 향수 분자가 스스로 운동하여 농도가 높은 곳에서 낮은 곳으로 퍼지는 **확산** 때문이다.

## 세포막 | 구조와 선택적 투과성

= 세포막의 구조
! 세포막: 인지질 2중층에 막단백질이 파묻혀 있거나 걸쳐 있는 구조
- 인지질: 물을 좋아하는 **머리**는 바깥쪽, 물을 싫어하는 **꼬리**는 안쪽으로 배열
- **선택적 투과성**: 물질의 종류에 따라 통과를 ==선택==하는 성질
>+ 작고 전하가 없는 분자(O₂, CO₂)는 쉽게, 크거나 전하를 띤 물질(포도당, 이온)은 **막단백질**을 통해

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#membrane | [확산]에서 30초 동안 세포 안으로 들어온 산소와 포도당 수를 비교하자. 이어서 [삼투(적혈구)], [삼투(식물 세포)]에서 바깥 소금물 농도를 0 %, 0.9 %, 2 %로 바꾸어 보자.
% 확산 → 적혈구 삼투 → 식물 세포 삼투 순서

## 확산 | 높은 곳에서 낮은 곳으로

= 확산 | 시뮬레이션 기록
! 확산: 분자가 스스로 운동하여 농도가 높은 쪽에서 낮은 쪽으로 이동
| 물질 | 통과 경로 | 30초 뒤 세포 안 분자 수 |
|+ 산소 | 인지질층 직접 통과 | [[빠르게 증가]] |
|+ 포도당 | 막단백질(통로)을 통해 통과 | [[느리게 증가]] |
>+ 확산은 에너지를 쓰지 않고 농도 차이만으로 일어난다.

= 예제 1 · 폐포와 혈액 | 적용
- 폐포 속 공기와 모세 혈관 혈액 사이에서 기체가 이동한다.
^+ 산소: 폐포(높음) → 혈액(낮음)으로 **확산**
^+ 이산화 탄소: 혈액(높음) → 폐포(낮음)으로 **확산**
^+ 둘 다 작은 분자라 **인지질층을 직접** 통과한다.

## 삼투 | 물의 이동

= 삼투
! 삼투: 세포막을 경계로 물이 용질 농도가 낮은 쪽에서 높은 쪽으로 이동
| 바깥 용액 | 물의 이동 | 적혈구 | 식물 세포 |
|+ 0 % (저장액) | 세포 안으로 | [[부풀다 터짐]] | [[팽팽해짐]] |
|+ 0.9 % (등장액) | 변화 없음 | 변화 없음 | 변화 없음 |
|+ 2 % (고장액) | 세포 밖으로 | [[쭈그러듦]] | [[원형질 분리]] |
>+ 식물 세포는 단단한 **세포벽** 덕분에 저장액에서도 터지지 않는다.

= 예제 2 · 감자 조각 실험 | 자료 해석
C 소금물 농도에 따른 감자 조각의 질량 변화율 (예시 자료) | 소금물 농도 (%) | 질량 변화율 (%) | 질량 변화:0,10 0.5,3 1,-2 2,-8
+ 질량이 늘어난 용액: 감자 세포보다 [[저장액]] → 물이 세포 안으로
+ 0.5 %(+3 %)와 1 %(−2 %) 사이에서 0이 되는 농도 ≈ 0.5 + 0.5 × 3/5 = [[0.8 %]] → 감자 세포와 등장액

= 예제 3 · 링거액 만들기 | 적용
- 0.9 % 생리 식염수 1 L(약 1000 g)를 만들려면 소금이 몇 g 필요할까?
^+ 1000 g × 0.009 = **9 g**
^+ 이 농도는 혈액과 **등장액** → 혈구가 부풀거나 쭈그러들지 않는다.
>+ 증류수를 혈관에 넣으면 적혈구가 물을 흡수해 **터질** 수 있다.

= 확인 문제 1
Q 산소가 세포막을 통과하는 방식으로 옳은 것은?
o 막단백질을 통해 농도가 낮은 쪽에서 높은 쪽으로
o* 인지질층을 직접 통과하여 농도가 높은 쪽에서 낮은 쪽으로
o 세포벽을 통해서만
o 이동하지 못한다
:: 산소는 작고 전하가 없어 인지질층을 직접 통과하여 확산한다.

= 생활 속 확산과 삼투 | 사례
* 🥬 김치 절임 :: 고장액(소금)에 배추 세포의 물이 빠져나온다
* 🍓 딸기잼 :: 설탕이 많아 세균이 삼투로 물을 잃어 썩지 않는다
* 💉 링거액 :: 혈액과 등장액인 0.9 % 식염수
* 🐌 민달팽이와 소금 :: 몸의 물이 빠져나가 쪼그라든다
* 🌹 시든 꽃 :: 물에 꽂으면 세포가 팽팽해져 다시 선다
* 🌊 바닷물 :: 체액보다 진해 마시면 세포의 물이 빠져나간다

= 확인 문제 2
Q 적혈구를 2 % 소금물에 넣었을 때의 변화는?
o 부풀다 터진다
o 변화 없다
o* 물이 빠져나가 쭈그러든다
o 원형질 분리가 일어난다
:: 고장액에서는 물이 세포 밖으로 이동한다. 원형질 분리는 세포벽이 있는 식물 세포의 현상이다.

= 확인 문제 3
Q 식물 세포가 저장액에서 터지지 않는 까닭은?
o 세포막이 없어서
o* 단단한 세포벽이 세포를 지탱해서
o 물이 이동하지 않아서
o 엽록체가 물을 흡수해서
:: 세포벽이 있어 물이 들어와도 팽팽해질 뿐 터지지 않는다.

= 확인 문제 4
Q 0.9 % 식염수 500 g을 만드는 데 필요한 소금의 양은?
o 0.9 g
o* 4.5 g
o 9 g
o 45 g
:: 500 × 0.009 = 4.5 g

= 서술형 도전 | 생각 넓히기
? 병원에서 쓰는 링거액(생리 식염수)의 농도를 혈액과 같게 만드는 까닭을 쓰시오. :: 등장액이어야 적혈구 등 혈구 세포가 삼투로 물을 얻거나 잃지 않아 부풀거나 쭈그러들지 않기 때문이다.
? 바다에서 조난된 사람이 바닷물을 마시면 오히려 탈수가 심해지는 까닭을 삼투로 설명하시오. :: 바닷물은 체액보다 농도가 높은 고장액이라 몸속 세포의 물이 삼투로 빠져나가고, 콩팥이 많은 염분을 배설하는 데 더 많은 물이 필요하기 때문이다.

= 오늘 배운 내용 정리
- 세포막: [[인지질 2중층]] + 막단백질, [[선택적 투과성]]
- 확산: 농도가 [[높은]] 쪽 → [[낮은]] 쪽 (O₂·CO₂는 인지질층 직접, 포도당·이온은 막단백질)
- 삼투: [[물]]이 용질 농도가 낮은 쪽 → 높은 쪽으로 이동
- 저장액: 적혈구 [[터짐]], 고장액: 적혈구 쭈그러듦·식물 세포 [[원형질 분리]]

= 나가기 전 한 문제 | 형성평가
? 배추를 소금에 절이면 숨이 죽는 까닭을 '고장액', '삼투'를 넣어 한 문장으로 쓰시오. :: 소금이 배추 세포 바깥을 고장액으로 만들어 세포 안의 물이 삼투에 의해 밖으로 빠져나가므로 세포가 쭈그러들어 숨이 죽는다.
