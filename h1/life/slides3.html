# 유전자 발현 | DNA에서 단백질까지 | 고등학교 통합과학1 · 07 생명 시스템 · 3차시 | 2022 개정 교육과정 [통과1 Ⅲ]

= 오늘의 학습 목표 | 3차시
^ 유전 정보가 **DNA → RNA → 단백질**로 전달되는 흐름을 설명할 수 있다.
^ **전사**와 **번역**이 일어나는 장소와 과정을 설명할 수 있다.
^ **코돈**을 이용해 유전 암호를 해독할 수 있다.
% 흐름: 생각 열기 5분 → 유전 정보의 흐름 8분 → 전사·번역(시뮬레이션) 12분 → 해독 계산 12분 → 문항 8분

= DNA는 어떻게 '나'를 만들까? | 생각 열기
* 🧬 DNA :: 핵 속에 있는 염기 서열 — 설계도
* 🏭 리보솜 :: 세포질의 단백질 공장
* 💪 단백질 :: 근육, 효소, 호르몬, 항체 — 실제로 일하는 분자
* 📋 복사본 :: 설계도 원본은 금고(핵)에서 꺼내지 않는다
? 핵 속의 DNA 정보는 어떻게 핵 밖의 리보솜까지 전달될까? :: DNA의 정보를 **mRNA로 복사(전사)**해 핵 밖으로 보내고, 리보솜이 그 정보를 읽어 **단백질을 만든다(번역)**.

= 지난 시간 복습 | 04단원 · 2차시
- DNA 염기: A, T, G, C / 짝: A–[[T]], G–[[C]]
- 단백질의 단위체: [[아미노산]] (20종류)
- 효소의 주성분: [[단백질]]
? 염기는 4종류, 아미노산은 20종류. 염기 몇 개가 아미노산 1개를 지정해야 할까? :: 1개 → 4가지, 2개 → 16가지(부족), **3개 → 64가지**(충분) → 염기 3개 = **코돈**

## 유전 정보의 흐름 | 전사와 번역

= 유전 정보의 흐름
! DNA →(전사) RNA →(번역) 단백질 → 형질
| 과정 | 장소 | 내용 |
|+ 전사 | [[핵]] | DNA의 염기 서열 정보가 [[mRNA]]로 옮겨짐 |
|+ 번역 | 세포질의 [[리보솜]] | mRNA의 코돈에 따라 아미노산이 연결되어 단백질 합성 |
>+ RNA는 T(타이민) 대신 **U(유라실)**을 가진다 → DNA의 A에는 U가 짝

= 코돈
! 코돈: mRNA에서 아미노산 1개를 지정하는 연속된 염기 3개
- 4³ = ==64가지== 코돈으로 20가지 아미노산을 지정
- **AUG**: 메싸이오닌 + 번역 **시작** / **UAA, UAG, UGA**: 번역 **종결**
>+ 거의 모든 생물이 **같은 유전 암호**를 사용한다.

= 코돈표 일부 | 자료
| 코돈 | 아미노산 | 코돈 | 아미노산 |
|+ AUG | 메싸이오닌 (시작) | CCC | 프롤린 |
|+ UUU, UUC | 페닐알라닌 | GGC, GGG | 글라이신 |
|+ UUA | 류신 | GAA | 글루탐산 |
|+ UAA, UAG, UGA | 종결 | AAG | 라이신 |
~ 여러 코돈이 같은 아미노산을 지정하기도 한다 (64가지 코돈 → 20가지 아미노산).

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#gene | [다음 단계]를 눌러 전사와 번역을 차례로 관찰하고, 주형 가닥에서 mRNA와 아미노산을 완성하자.
% 주형 가닥 → mRNA 변환 규칙(A→U, T→A, G→C, C→G)을 먼저 정리

= 유전 암호 해독 | 시뮬레이션 기록
| DNA 주형 가닥 | TAC | CTT | AAA | CCG | ATT |
|+ mRNA 코돈 | AUG | [[GAA]] | [[UUU]] | [[GGC]] | [[UAA]] |
|+ 아미노산 | 메싸이오닌 | 글루탐산 | 페닐알라닌 | 글라이신 | 종결 |
- 주형 가닥의 T → mRNA의 [[A]], A → [[U]] (DNA의 T 자리는 RNA에서 U)

= 예제 1 · 전사하기 | 적용
- DNA 주형 가닥이 TACGGGCCC이다.
^+ 짝 맞추기: T→A, A→U, C→G, G→C
^+ mRNA: **AUGCCCGGG**
^+ 3개씩 끊으면 AUG / CCC / GGG → 코돈 **3개**

= 예제 2 · 염기는 몇 개 필요할까? | 적용
- 아미노산 100개로 이루어진 단백질을 만드는 데 필요한 mRNA 염기는 최소 몇 개인가? (종결 코돈 포함)
^+ 아미노산 1개 = 코돈 1개 = 염기 3개
^+ 100 × 3 = 300개
^+ 종결 코돈 3개를 더해 **303개**

= 예제 3 · 염기 하나가 바뀌면 | 적용
- 주형 가닥 TAC AAA CCC ATT → mRNA AUG UUU GGG UAA → 메싸이오닌–페닐알라닌–글라이신 (종결)
^+ 둘째 묶음 AAA가 AAT로 바뀌면 → 코돈 UUU가 **UUA**로
^+ UUA는 **류신**을 지정 → 둘째 아미노산이 페닐알라닌 → 류신
^+ 아미노산 서열이 달라지면 단백질의 **입체 구조와 기능**이 달라질 수 있다 (돌연변이)

= 확인 문제 1
Q 전사가 일어나는 장소와 그 결과로 만들어지는 것을 바르게 짝지은 것은?
o 리보솜 — 단백질
o* 핵 — mRNA
o 세포막 — DNA
o 세포질 — 아미노산
:: 핵 속에서 DNA의 정보가 mRNA로 전사된다.

= 생활 속 유전자 발현 | 사례
* 💉 mRNA 백신 :: mRNA를 넣어 우리 세포가 항원 단백질을 번역하게 한다
* 💊 인슐린 생산 :: 사람 인슐린 유전자를 대장균에 넣어 생산 (같은 유전 암호)
* 🧪 유전자 검사 :: 염기 서열의 변화(돌연변이)를 찾는다
* 🩸 낫 모양 적혈구 :: 염기 하나의 변화로 헤모글로빈이 달라진 예
* 🐟 형광 물고기 :: 해파리의 형광 단백질 유전자를 넣어 빛나게 한다
* 🌾 유전자 변형 작물 :: 다른 생물의 유전자로 새 단백질을 만든다

= 확인 문제 2
Q DNA 주형 가닥이 TACAAG일 때 mRNA의 염기 서열은?
o TACAAG
o ATGTTC
o* AUGUUC
o UACAAG
:: T→A, A→U, C→G, G→C → AUGUUC

= 확인 문제 3
Q 아미노산 50개로 이루어진 단백질을 지정하는 mRNA 염기는 최소 몇 개인가? (종결 코돈 포함)
o 50개
o 150개
o* 153개
o 200개
:: 50 × 3 + 3 = 153개

= 확인 문제 4
Q 거의 모든 생물이 같은 유전 암호를 사용한다는 사실의 의미로 가장 알맞은 것은?
o 모든 생물의 단백질은 같다
o* 생물이 공통 조상에서 유래했다는 증거가 된다
o DNA가 없는 생물이 있다
o 코돈은 생물마다 다르다
:: 같은 암호 체계는 공통 조상의 증거이며, 유전자 재조합 기술의 바탕이 된다.

= 확인 문제 5
Q mRNA 서열 AUG UUC AAG UGA가 지정하는 아미노산의 수는?
o 1개
o 2개
o* 3개
o 4개
:: AUG(메싸이오닌) – UUC(페닐알라닌) – AAG(라이신) – UGA(종결) → 아미노산 3개

= 서술형 도전 | 생각 넓히기
? DNA 염기 하나가 바뀌면 단백질이 달라질 수 있는 까닭을 쓰시오. :: 코돈이 바뀌어 다른 아미노산이 지정되거나 종결 코돈이 생기면 단백질의 아미노산 서열과 구조가 달라지기 때문이다.
? 대장균에 사람 인슐린 유전자를 넣으면 사람 인슐린이 만들어지는 까닭을 유전 암호와 관련지어 쓰시오. :: 대장균과 사람이 같은 유전 암호를 사용하므로, 대장균의 리보솜이 사람 유전자에서 전사된 mRNA를 같은 방식으로 번역하여 같은 아미노산 서열의 인슐린을 만든다.

= 오늘 배운 내용 정리
- 유전 정보의 흐름: DNA →([[전사]]) RNA →([[번역]]) 단백질
- 전사: [[핵]]에서 mRNA 합성, RNA는 T 대신 [[U]]
- 번역: 세포질의 [[리보솜]]에서 아미노산 연결
- 아미노산 1개를 지정하는 염기 3개 → [[코돈]] (64가지)
- AUG는 시작, UAA·UAG·UGA는 [[종결]]

= 나가기 전 한 문제 | 형성평가
? DNA 주형 가닥 TACCTTATT를 전사한 mRNA를 쓰고, 이 mRNA가 지정하는 아미노산 수를 쓰시오. :: mRNA: AUGGAAUAA → AUG(메싸이오닌) / GAA(글루탐산) / UAA(종결) → 아미노산 2개
