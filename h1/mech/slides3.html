# 충돌과 안전장치 | 충돌 시간을 늘려라 | 고등학교 통합과학1 · 06 역학 시스템 · 3차시 | 2022 개정 교육과정 [통과1 Ⅲ]

= 오늘의 학습 목표 | 3차시
^ 충돌할 때 탑승자의 **운동량 변화**와 받는 **평균 힘**을 계산할 수 있다.
^ **안전띠·에어백·크럼플 존**의 원리를 충격량으로 설명할 수 있다.
^ 충격량 원리를 이용해 **안전장치를 설계**할 수 있다.
% 흐름: 생각 열기 5분 → 안전장치의 원리 8분 → 충돌 실험(시뮬레이션) 12분 → 계산 10분 → 설계·문항 10분

= 단단한 차가 더 안전할까? | 생각 열기
* 🚗 옛날 자동차 :: 철판이 두껍고 단단해 잘 찌그러지지 않았다
* 🚙 요즘 자동차 :: 앞부분이 일부러 잘 찌그러지게 만든다
* 🎈 에어백 :: 0.03초 만에 부풀어 오른다
* 🪢 안전띠 :: 몸을 붙잡지만 살짝 늘어난다
? 왜 요즘 자동차는 일부러 잘 찌그러지게 만들까? :: 차체가 찌그러지는 동안 탑승자가 멈추는 **시간이 길어져** 받는 **힘이 작아지기** 때문이다.

= 지난 시간 복습 | 2차시
- 충격량 = 힘 × 시간 = 운동량의 [[변화량]]
- 운동량 변화가 같으면 충돌 시간이 [[길수록]] 평균 힘이 작다.
? 50 km/h로 달리다 멈추는 탑승자의 운동량 변화량은 무엇이 결정할까? :: 탑승자의 **질량**과 충돌 전 **속력** — 안전장치는 이것을 바꾸지 못하고, **멈추는 시간**을 늘린다.

## 안전장치의 원리 | 시간과 면적

= 안전장치의 원리
! 운동량 변화량은 충돌 전 속력이 정한다 → 안전장치는 멈추는 시간을 늘려 평균 힘을 줄인다
| 안전장치 | 원리 |
|+ 안전띠 | 몸이 앞으로 튀어 나가지 않게 붙잡고, 조금 늘어나며 시간을 늘림 |
|+ 에어백 | 충돌 시간을 늘리고 힘을 넓은 [[면적]]에 분산 |
|+ 크럼플 존 | 차체가 찌그러지며 시간을 늘리고 [[에너지]]를 흡수 |

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#safety | 속력 50 km/h에서 안전장치를 하나씩 끄고 켜며 [실행]하자. 멈추는 시간과 평균 감속도를 비교하자.
% 안전띠를 끈 경우(12 ms)에서 감속도가 폭발적으로 커지는 장면을 강조

= 안전장치에 따른 충돌 | 시뮬레이션 기록
| 안전띠 | 에어백 | 크럼플 존 | 멈추는 시간 | 평균 감속도 |
|+ ○ | ○ | ○ | 210 ms | 약 7 g |
|+ ○ | × | ○ | 150 ms | 약 9 g |
|+ × | × | ○ | 12 ms | 약 [[118 g]] |
|+ ○ | ○ | × | 150 ms | 약 9 g |
~ g: 중력 가속도(9.8 m/s²)의 몇 배인지 나타낸 값

= 예제 1 · 감속도 확인 | 적용
- 50 km/h ≈ 13.9 m/s에서 210 ms(0.21 s) 동안 멈췄다.
^+ 평균 감속도 = 13.9 ÷ 0.21 ≈ **66 m/s²**
^+ 66 ÷ 9.8 ≈ **6.7 g** (약 7 g ✔)
^+ 12 ms이면 13.9 ÷ 0.012 ≈ 1160 m/s² ≈ **118 g**

= 예제 2 · 탑승자가 받는 힘 | 적용
- 질량 60 kg인 탑승자가 50 km/h(13.9 m/s)에서 멈춘다.
^+ 운동량 변화량 = 60 × 13.9 ≈ **834 N·s**
^+ 210 ms에 멈추면 834 ÷ 0.21 ≈ **4000 N**
^+ 12 ms에 멈추면 834 ÷ 0.012 ≈ **69 500 N** (약 17배)
>+ 69 500 N은 약 7톤짜리 물체의 무게 — 안전띠가 생명을 지키는 까닭

= 예제 3 · 속력이 2배라면 | 적용
- 속력을 50 km/h에서 100 km/h로 높였다 (다른 조건 같음).
^+ 운동량 변화량 **2배**
^+ 멈추는 시간이 같으면 평균 힘도 **2배**
^+ 운동 에너지(½mv²)는 **4배** → 차체가 흡수해야 할 에너지도 4배
>+ 과속은 안전장치의 능력을 넘어서게 만든다.

= 확인 문제 1
Q 에어백이 탑승자를 보호하는 원리로 옳지 않은 것은?
o 충돌 시간을 늘린다
o 힘을 넓은 면적에 분산한다
o* 탑승자의 운동량 변화량을 0으로 만든다
o 탑승자가 받는 평균 힘을 줄인다
:: 운동량 변화량은 충돌 전 속력이 정하며 안전장치가 바꿀 수 없다. 시간을 늘려 힘을 줄일 뿐이다.

## 안전장치 설계 | 충격량으로 생각하기

= 예제 4 · 달걀 보호 장치 설계 | 적용
- 질량 60 g인 달걀을 3 m 높이에서 떨어뜨린다. 달걀이 25 N 이상의 힘을 받으면 깨진다고 하자. (가정)
^+ 착지 속력 v = √(2 × 9.8 × 3) = √58.8 ≈ **7.7 m/s**
^+ 운동량 변화량 = 0.06 × 7.7 ≈ **0.46 N·s**
^+ 필요한 충돌 시간 ≥ 0.46 ÷ 25 ≈ **0.018 s (18 ms)**
>+ 설계 목표: 달걀이 **18 ms 이상**에 걸쳐 멈추도록 — 스펀지, 낙하산, 빨대 완충 구조 등
% 모둠별 설계 도전 과제로 확장 가능 (재료 제한: 종이, 빨대, 테이프)

= 생활 속 안전장치 | 사례
* 🎈 에어백 :: 충돌 시간 증가 + 면적 분산
* 🚗 크럼플 존 :: 차체 앞뒤가 찌그러지며 에너지 흡수
* ⛑️ 헬멧 :: 스타이로폼이 찌그러지며 충격 흡수
* 🛝 놀이터 바닥 :: 모래·고무 매트로 넘어질 때 충격 감소
* 🧗 높이뛰기 매트 :: 몸이 천천히 멈추게 한다
* 🚧 도로 충격 흡수대 :: 물통·쿠션으로 충돌 차량을 천천히 멈춤

= 확인 문제 2
Q 자전거 헬멧 안쪽에 스타이로폼을 넣는 까닭은?
o 헬멧을 무겁게 하려고
o* 찌그러지며 충돌 시간을 늘리고 충격을 흡수하려고
o 운동량을 늘리려고
o 충돌 시간을 줄이려고
:: 스타이로폼이 변형되며 머리가 멈추는 시간을 늘려 받는 힘을 줄인다.

= 확인 문제 3
Q 같은 탑승자가 같은 속력에서 멈출 때, 멈추는 시간이 0.15 s에서 0.3 s로 늘면 평균 힘은?
o 2배
o 그대로
o* 1/2배
o 1/4배
:: 운동량 변화량이 같으므로 평균 힘은 시간에 반비례한다.

= 확인 문제 4
Q 다음 중 충돌 시간을 늘려 충격을 줄이는 예가 아닌 것은?
o 높이뛰기 매트
o 놀이터 고무 바닥
o* 망치로 못 박기
o 무릎 굽혀 착지하기
:: 망치는 충돌 시간을 짧게 하여 큰 힘을 얻는 예이다.

= 확인 문제 5
Q 질량 50 kg인 사람이 10 m/s에서 0.5초 만에 멈추었다. 사람이 받은 평균 힘의 크기는?
o 250 N
o 500 N
o* 1000 N
o 2500 N
:: 운동량 변화량 = 50 × 10 = 500 N·s → 평균 힘 = 500 ÷ 0.5 = 1000 N

= 서술형 도전 | 생각 넓히기
? 속력을 50 km/h에서 100 km/h로 높이면 탑승자의 운동량과 받는 평균 힘이 어떻게 되는지 쓰시오. (다른 조건 같음) :: 운동량이 2배가 되므로, 멈추는 시간이 같으면 평균 힘도 2배가 된다.
? 놀이터 바닥을 모래나 고무 매트로 만드는 까닭과 같은 원리가 적용된 다른 예를 쓰시오. :: 넘어질 때 충돌 시간을 늘려 몸이 받는 힘을 줄인다. 예: 체조 매트, 높이뛰기 매트, 소방 구조용 에어 매트, 운동화 쿠션 등.

= 오늘 배운 내용 정리
- 탑승자의 운동량 변화량은 충돌 전 [[속력]]이 정한다.
- 안전장치는 멈추는 [[시간]]을 늘려 [[평균 힘]]을 줄인다.
- 에어백: 시간 증가 + 힘을 넓은 [[면적]]에 분산
- 크럼플 존: 찌그러지며 시간 증가 + [[에너지]] 흡수
- 속력 2배 → 운동량 2배, 운동 에너지 [[4배]]

= 나가기 전 한 문제 | 형성평가
? 안전띠를 맨 경우(멈추는 시간 210 ms)와 매지 않은 경우(12 ms)에 탑승자가 받는 평균 힘의 비를 구하고, 안전띠의 원리를 한 문장으로 쓰시오. :: 힘의 비 = 1/0.21 : 1/0.012 = 12 : 210 ≈ 1 : 17.5 → 안전띠를 매지 않으면 약 17.5배 큰 힘을 받는다. 안전띠는 탑승자가 멈추는 시간을 늘려 평균 힘을 줄인다.
