# 운동량과 충격량 | 같은 변화, 다른 충격 | 고등학교 통합과학1 · 06 역학 시스템 · 2차시 | 2022 개정 교육과정 [통과1 Ⅲ]

= 오늘의 학습 목표 | 2차시
^ **운동량**과 **충격량**의 뜻과 단위를 말할 수 있다.
^ **충격량 = 운동량의 변화량**임을 이용해 힘과 시간을 계산할 수 있다.
^ **충돌 시간**을 늘려 충격을 줄이는 원리를 설명할 수 있다.
% 흐름: 생각 열기 5분 → 운동량 7분 → 충격량 10분 → 달걀 떨어뜨리기(시뮬레이션) 12분 → 계산·문항 11분

= 달걀을 방석에 떨어뜨리면? | 생각 열기
* 🥚 콘크리트 바닥 :: 같은 높이에서 떨어뜨리면 깨진다
* 🛋️ 방석 :: 같은 높이인데 깨지지 않는다
* ⚾ 포수 :: 공을 받을 때 손을 뒤로 뺀다
* 🔨 망치 :: 못을 박을 때는 세게, 짧게 친다
? 같은 달걀, 같은 높이인데 바닥에 따라 결과가 다른 까닭은? :: 달걀이 멈추기까지 걸리는 **시간**이 다르다. 시간이 길수록 달걀이 받는 **평균 힘**이 작아진다.

= 지난 시간 복습 | 1차시
- 자유 낙하: v = [[gt]], s = [[½gt²]]
- 수평으로 던진 물체: 수평 [[등속]], 연직 [[자유 낙하]]
? 높이 1.8 m에서 떨어진 달걀이 바닥에 닿기 직전의 속력은? (g = 10 m/s²로 어림) :: 1.8 = ½ × 10 × t² → t = 0.6 s, v = 10 × 0.6 = 6 m/s — 오늘 시뮬레이션의 속력!

## 운동량 | 운동의 '양'

= 운동량
! 운동량 p = 질량 × 속도 (단위: kg·m/s)
- 같은 속도라면 **질량이 클수록**, 같은 질량이라면 **빠를수록** 운동량이 크다.
- 운동량은 **방향**을 가진다 (속도의 방향).
| 물체 | 질량 | 속력 | 운동량 |
|+ 야구공 | 0.15 kg | 40 m/s | [[6 kg·m/s]] |
|+ 볼링공 | 6 kg | 5 m/s | [[30 kg·m/s]] |
|+ 자동차 | 1000 kg | 20 m/s | [[20 000 kg·m/s]] |

## 충격량 | 힘 × 시간

= 충격량과 운동량의 관계
! 충격량 = 힘 × 힘이 작용한 시간 = 운동량의 변화량
- 단위: N·s (= kg·m/s)
- **힘–시간 그래프 아래의 넓이** = 충격량
>+ 운동량 변화량이 같으면 충돌 시간이 **길수록** 평균 힘이 **작다.**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#impulse | 질량 0.1 kg, 속력 6 m/s로 바닥을 바꾸어 가며 [실행]하자. 충격량, 충돌 시간, 평균 힘을 비교하자.
% 세 바닥의 충격량이 모두 같다는 점을 먼저 확인시키고, 그다음 힘의 차이에 주목

= 바닥에 따른 충돌 | 시뮬레이션 기록
| 바닥 | 충격량 (N·s) | 충돌 시간 | 평균 힘 | 결과 |
|+ 콘크리트 | 0.6 | 4 ms | [[150 N]] | 깨짐 |
|+ 나무판 | 0.6 | 15 ms | [[40 N]] | 깨짐 |
|+ 방석 | 0.6 | 80 ms | [[7.5 N]] | 무사 |
- 충격량 = 0.1 × 6 = 0.6 N·s (모두 같다) / 평균 힘 = 0.6 ÷ 충돌 시간

= 힘–시간 그래프 | 넓이가 같다
C 바닥에 따른 힘–시간 그래프 (넓이 = 0.6 N·s, 모형) | 시간 (ms) | 힘 (N) | 콘크리트:0,0 1,150 2,300 4,0 | 나무판:0,0 3.75,40 7.5,80 15,0 | 방석:0,0 20,7.5 40,15 80,0
+ 콘크리트: 짧고 [[높은]] 뾰족한 모양 / 방석: 길고 [[낮은]] 완만한 모양
+ 두 삼각형의 넓이: ½ × 0.004 × 300 = ½ × 0.08 × 15 = [[0.6 N·s]]

= 예제 1 · 포수의 글러브 | 적용
- 질량 0.15 kg인 야구공이 40 m/s로 날아와 글러브에 0.02초 만에 멈추었다.
^+ 충격량 = 운동량 변화량 = 0.15 × 40 = **6 N·s**
^+ 평균 힘 = 6 ÷ 0.02 = **300 N**
^+ 손을 뒤로 빼서 0.06초로 늘리면 6 ÷ 0.06 = **100 N** (3분의 1)

= 예제 2 · 튕겨 나오는 공 | 적용
- 질량 0.5 kg인 공이 벽에 10 m/s로 부딪쳐 반대 방향으로 8 m/s로 튕겨 나왔다.
^+ 처음 운동량 = 0.5 × 10 = 5 (벽 쪽 +), 나중 = 0.5 × (−8) = −4
^+ 운동량 변화량의 크기 = 5 − (−4) = **9 N·s**
^+ 접촉 시간이 0.03 s이면 평균 힘 = 9 ÷ 0.03 = **300 N**
>+ 튕겨 나오면 그냥 멈출 때(5 N·s)보다 충격량이 **더 크다** — 방향이 중요!

= 확인 문제 1
Q 충격량의 단위로 옳은 것은?
o N
o J
o* N·s
o m/s²
:: 충격량 = 힘(N) × 시간(s) → N·s (= kg·m/s)

## 충돌 시간 조절하기 | 늘리거나 줄이거나

= 충돌 시간을 늘리거나 줄이는 예
| 목적 | 방법 | 예 |
|+ 힘을 줄이기 | 충돌 시간을 늘린다 | 무릎 굽혀 착지, 포수 손 빼기, 에어백, 매트 |
|+ 힘을 키우기 | 충돌 시간을 줄인다 | 망치로 못 박기, 태권도 격파, 단단한 골프채 |
|+ 멀리 보내기 | 힘을 오래 작용(충격량 ↑) | 골프·야구의 끝까지 휘두르기(팔로스루) |

= 생활 속 충격량 | 사례
* 🦵 착지 :: 무릎을 굽혀 멈추는 시간을 늘린다
* 🥋 낙법 :: 몸을 굴려 충돌 시간과 면적을 늘린다
* 📦 포장재 :: 뽁뽁이·스티로폼이 충돌 시간을 늘린다
* 🏏 팔로스루 :: 공에 힘을 오래 작용해 충격량을 키운다
* 🔨 망치 :: 단단한 머리로 짧게 쳐서 큰 힘
* 👟 운동화 쿠션 :: 발이 받는 충격을 줄인다

= 확인 문제 2
Q 운동량의 변화량이 같을 때 물체가 받는 평균 힘을 줄이는 방법은?
o 충돌 시간을 줄인다
o* 충돌 시간을 늘린다
o 질량을 늘린다
o 속력을 늘린다
:: 평균 힘 = 운동량 변화량 ÷ 충돌 시간 → 시간이 길수록 힘이 작다.

= 확인 문제 3
Q 질량 2 kg인 물체의 속력이 3 m/s에서 7 m/s로 같은 방향으로 증가했다. 물체가 받은 충격량은?
o 6 N·s
o* 8 N·s
o 14 N·s
o 20 N·s
:: 2 × 7 − 2 × 3 = 14 − 6 = 8 N·s

= 확인 문제 4
Q 힘–시간 그래프에서 그래프 아래의 넓이가 뜻하는 것은?
o 속력
o 일
o* 충격량
o 가속도
:: 넓이 = 힘 × 시간 = 충격량

= 서술형 도전 | 생각 넓히기
? 높은 곳에서 뛰어내릴 때 무릎을 굽히며 착지하는 까닭을 충격량으로 설명하시오. :: 무릎을 굽히면 몸이 멈추는 데 걸리는 시간이 길어져, 같은 운동량 변화(충격량)에서도 다리가 받는 평균 힘이 작아지기 때문이다.
? 충돌 시간을 짧게 하여 큰 힘을 얻는 예를 한 가지 쓰고 원리를 설명하시오. :: 망치로 못 박기 — 단단한 망치가 짧은 시간에 멈추므로 같은 운동량 변화에서도 못에 큰 힘이 작용한다. (태권도 격파, 골프공 치기 등)

= 오늘 배운 내용 정리
- 운동량 = [[질량 × 속도]] (kg·m/s)
- 충격량 = [[힘 × 시간]] = 운동량의 [[변화량]] (N·s)
- 힘–시간 그래프 아래 [[넓이]] = 충격량
- 운동량 변화가 같으면 충돌 시간이 [[길수록]] 평균 힘이 작다.
- 튕겨 나오면 멈출 때보다 운동량 변화량이 [[크다]].

= 나가기 전 한 문제 | 형성평가
? 질량 0.2 kg인 공이 10 m/s로 날아와 0.05초 만에 멈추었다. 충격량과 평균 힘을 구하고, 0.2초 만에 멈추게 하면 평균 힘이 어떻게 되는지 쓰시오. :: 충격량 = 0.2 × 10 = 2 N·s, 평균 힘 = 2 ÷ 0.05 = 40 N → 0.2초면 2 ÷ 0.2 = 10 N (4분의 1)
