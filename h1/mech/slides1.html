# 자유 낙하와 수평 방향 운동 | 중력이 만드는 운동 | 고등학교 통합과학1 · 06 역학 시스템 · 1차시 | 2022 개정 교육과정 [10통과1-03-03] [10통과1-03-04]

= 오늘의 학습 목표 | 1차시
^ 지표 근처에서 물체가 받는 **중력**과 **중력 가속도**를 설명할 수 있다.
^ **자유 낙하 운동**의 속도와 낙하 거리를 시간으로 나타낼 수 있다.
^ **수평으로 던진 물체**의 운동을 수평·연직 방향으로 나누어 분석할 수 있다.
^ 낙하 운동과 지구 주위를 도는 **원운동**이 모두 중력에 의한 운동임을 설명하고, **관성**을 말할 수 있다.
% 흐름: 생각 열기 5분 → 중력과 자유 낙하 10분 → 두 공 비교(시뮬레이션) 12분 → 수평 운동 계산 10분 → 문항 8분

= 어느 공이 먼저 떨어질까? | 생각 열기
* 🏀 공 A :: 책상 끝에서 그냥 떨어뜨린다
* ⚾ 공 B :: 같은 높이에서 수평으로 세게 던진다
* 🏹 화살 :: 수평으로 쏘아도 조금씩 아래로 휜다
* 🌙 달 :: 지구가 끌어당기는데도 떨어지지 않는다?
? 공 A와 공 B는 어느 쪽이 먼저 바닥에 닿을까? :: **동시에** 닿는다. 수평으로 던져도 연직 방향으로는 똑같이 자유 낙하하기 때문이다 — 오늘 확인해 보자.
% 실제로 두 동전을 자로 동시에 쳐서(하나는 떨어지고 하나는 날아가게) 소리를 들려주면 효과적

= 중학교에서 배운 내용 떠올리기 | 복습
| 개념 | 내용 |
| 속력 | 이동 거리 ÷ 걸린 시간 |
| 등속 운동 | 속력이 일정, 거리–시간 그래프 직선 |
| 자유 낙하 | 속력이 1초에 9.8 m/s씩 증가 |
| 중력의 크기 | 9.8 × 질량 (N) |
? 2초 동안 자유 낙하한 물체의 속력과 떨어진 거리는? :: 속력 9.8 × 2 = 19.6 m/s, 거리는 속도–시간 그래프 넓이 ½ × 2 × 19.6 = 19.6 m

## 중력과 자유 낙하 | 1초마다 9.8 m/s씩

= 중력과 중력 가속도
! 지표 근처에서 물체가 받는 중력 = 질량 × 9.8 m/s²
- **중력**: 질량을 가진 물체 사이에 작용하는 끌어당기는 힘
- **중력 가속도** g = 9.8 m/s²: 속도가 1초마다 9.8 m/s씩 변한다는 뜻
>+ 공기 저항이 없으면 질량과 관계없이 **같은 가속도**로 떨어진다.

= 자유 낙하 운동의 식
! 속도 v = gt, 낙하 거리 s = ½gt²
| 시간 t (s) | 0 | 0.5 | 1.0 | 1.5 | 2.0 |
|+ 속도 (m/s) | 0 | 4.9 | 9.8 | 14.7 | 19.6 |
|+ 낙하 거리 (m) | 0 | 1.2 | 4.9 | 11.0 | 19.6 |
>+ 시간이 2배 → 속도 2배, 낙하 거리 **4배** (시간의 제곱에 비례)

= 예제 1 · 바닥까지의 시간 | 적용
- 높이 45 m에서 공을 떨어뜨렸다. 바닥에 닿을 때까지의 시간과 속력은? (g = 10 m/s²로 어림)
^+ 45 = ½ × 10 × t² → t² = 9 → **t = 3 s**
^+ v = gt = 10 × 3 = **30 m/s**
>+ g = 9.8로 계산하면 t ≈ 3.03 s, v ≈ 29.7 m/s — 어림값과 거의 같다.

= 확인 문제 1
Q 공기 저항을 무시할 때 자유 낙하하는 물체의 낙하 거리가 4배가 되려면 시간은 몇 배가 되어야 하는가?
o 4배
o* 2배
o 16배
o 1/2배
:: s = ½gt²에서 거리는 시간의 제곱에 비례 → 시간 2배면 거리 4배

## 수평으로 던진 물체 | 두 방향으로 나누어 보기

= 수평으로 던진 물체의 운동
| 방향 | 받는 힘 | 운동 |
|+ 수평 방향 | 없음 | [[등속 운동]] (x = v₀t) |
|+ 연직 방향 | 중력 | [[자유 낙하]] (y = ½gt²) |
>+ 같은 높이에서 떨어뜨린 물체와 수평으로 던진 물체는 **동시에** 바닥에 떨어진다.

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#fall | 높이 20 m, 수평 속력 6 m/s로 [실행]하고, 0.5초마다 두 공의 위치를 기록하자.
% 두 공의 높이가 매 순간 같다는 것을 멈춤 화면으로 확인

= 두 공의 운동 | 시뮬레이션 기록
C 수평으로 던진 공의 경로 (높이 20 m, 6 m/s) | 수평 거리 (m) | 높이 (m) | 경로:0,20 3,18.8 6,15.1 9,9 12,0.4
||
+ 수평 거리: 0.5초마다 [[3.0 m]]씩 일정하게 증가 → 등속
+ 낙하 거리: 0 → 1.2 → 4.9 → 11.0 → 19.6 m → 떨어뜨린 공과 [[같다]]
+ 연직 속력: 0.5초마다 [[4.9 m/s]]씩 증가 → 자유 낙하

= 예제 2 · 얼마나 멀리 날아갈까? | 적용
- 높이 19.6 m인 건물 옥상에서 공을 수평으로 5 m/s로 던졌다.
^+ 연직: 19.6 = ½ × 9.8 × t² → t² = 4 → **t = 2 s**
^+ 수평: x = 5 × 2 = **10 m**
^+ 착지 직전 연직 속력 = 9.8 × 2 = **19.6 m/s** (수평 속력 5 m/s는 그대로)

= 예제 3 · 수평 속력을 2배로 | 적용
- 같은 높이에서 수평 속력만 10 m/s로 2배로 하여 던졌다.
^+ 연직 운동은 그대로 → 착지 시간 **2 s (같다)**
^+ 수평 거리 = 10 × 2 = **20 m (2배)**
>+ 수평 속력은 '얼마나 멀리'만 바꾸고 '얼마나 오래'는 바꾸지 못한다.

= 예제 4 · 달에서 던진다면 | 적용
- 달의 중력 가속도는 지구의 약 1/6이다. 같은 높이에서 떨어뜨리면 착지 시간은?
^+ t = √(2h/g) → g가 1/6이면 t는 √6배
^+ √6 ≈ **2.4배** 길어진다.
^+ 수평으로 던지면 수평 거리도 약 **2.4배**

## 지구 주위의 운동 | 계속 떨어지며 도는 달과 인공위성

= 뉴턴의 대포 | 사고 실험
^+ 높은 산 위에서 대포알을 수평으로 쏘면 포물선을 그리며 땅에 떨어진다.
^+ 더 빠르게 쏘면 더 멀리 떨어진다.
^+ 아주 빠르게 쏘면 떨어지는 만큼 지표면도 둥글게 휘어져 나가 **땅에 닿지 않고 지구를 돈다.**
>+ 낙하하는 물체와 지구 주위를 도는 인공위성·달은 모두 **중력에 의해 지구 중심 방향으로 가속**되는 운동이다.
% 2022 개정 [10통과1-03-03] 해설: 지구 표면을 향해 낙하하거나 지구 주위를 공전하는 원운동이 모두 중력에 의한 지구 중심 방향의 가속도 운동임을 설명한다. 원운동의 정량적 계산은 하지 않는다.

= 중력이 만드는 여러 운동 | 비교
| 운동 | 처음 속도 | 중력의 방향 | 운동 모습 |
|+ 자유 낙하 | 0 | 연직 아래 (지구 중심) | [[직선]]으로 점점 빨라짐 |
|+ 수평으로 던진 물체 | 수평 방향 | 연직 아래 (지구 중심) | [[포물선]] |
|+ 인공위성·달 | 매우 빠른 수평 방향 | 항상 [[지구 중심]] | 지구 둘레를 도는 [[원운동]] |
? 인공위성은 중력을 받는데도 왜 지구로 떨어지지 않을까? :: 떨어지고는 있지만, 옆으로 매우 빠르게 움직여 떨어지는 만큼 지구 표면이 휘어져 나가므로 지구 둘레를 계속 돈다.

= 상호작용이 없다면? | 관성
- 물체에 작용하는 힘(상호작용)이 없으면 물체는 **가속되지 않는다** → 정지한 물체는 계속 정지, 움직이던 물체는 같은 속도로 계속 운동
- 이 성질을 **관성**이라고 한다.
>+ 중력이 갑자기 사라진다면 달은 그 순간의 운동 방향(원의 [[접선]] 방향)으로 곧게 날아간다.
* 🚌 버스 급정거 :: 몸은 계속 앞으로 가려 해서 앞으로 쏠린다
* 🧺 이불 털기 :: 이불만 멈추고 먼지는 계속 움직여 떨어진다

= 생활 속 포물선 운동 | 사례
* 🏀 농구 슛 :: 공은 포물선을 그리며 날아간다
* 🚒 소방 호스 :: 물줄기가 수평으로 나가 휘어 떨어진다
* 🛩️ 구호 물자 투하 :: 비행기는 목표 지점보다 앞에서 떨어뜨린다
* 🏹 양궁 :: 먼 과녁은 조금 위를 겨눈다
* ⛲ 분수 :: 물방울 하나하나가 포물선 경로
* 🌙 달의 공전 :: 계속 '떨어지면서' 지구를 돈다 (뉴턴의 대포)

= 확인 문제 2
Q 수평으로 던진 물체의 수평 방향 운동은?
o 자유 낙하 운동
o* 등속 운동
o 속력이 점점 줄어드는 운동
o 정지
:: 수평 방향으로는 힘이 작용하지 않으므로 등속 운동을 한다.

= 확인 문제 3
Q 높이 4.9 m에서 수평으로 3 m/s로 던진 공의 수평 도달 거리는? (g = 9.8 m/s²)
o 1.5 m
o* 3 m
o 4.9 m
o 9.8 m
:: 4.9 = ½ × 9.8 × t² → t = 1 s, x = 3 × 1 = 3 m

= 확인 문제 4
Q 같은 높이에서 공 A는 떨어뜨리고 공 B는 수평으로 던졌다. 옳은 설명은?
o A가 먼저 떨어진다
o B가 먼저 떨어진다
o* 동시에 떨어진다
o 질량이 큰 공이 먼저 떨어진다
:: 두 공 모두 연직 방향으로 같은 자유 낙하를 한다.

= 서술형 도전 | 생각 넓히기
? 같은 높이에서 수평 속력을 2배로 하여 던지면 착지 시간과 수평 도달 거리는 각각 어떻게 되는지 까닭과 함께 쓰시오. :: 착지 시간은 같고(연직 방향 운동이 같으므로), 수평 도달 거리는 2배가 된다(수평 거리 = 수평 속력 × 시간).
? 지구가 달을 끌어당기는데도 달이 지구로 떨어지지 않는 까닭을 수평 방향 운동과 연결해 쓰시오. :: 달은 지구를 향해 계속 떨어지고 있지만 수평 방향으로 매우 빠르게 움직여, 떨어지는 만큼 지구 표면이 휘어져 멀어지므로 지구 둘레를 계속 돈다(뉴턴의 대포 사고 실험).

= 오늘 배운 내용 정리
- 지표 근처 중력 가속도 g = [[9.8 m/s²]]
- 자유 낙하: v = [[gt]], s = [[½gt²]]
- 수평으로 던진 물체: 수평 방향 [[등속 운동]], 연직 방향 [[자유 낙하]]
- 같은 높이라면 떨어뜨린 물체와 던진 물체는 [[동시에]] 떨어진다.
- 수평 거리 = 수평 속력 × [[낙하 시간]]

= 나가기 전 한 문제 | 형성평가
? 높이 44.1 m인 절벽에서 돌을 수평으로 4 m/s로 던졌다. 착지 시간과 수평 도달 거리를 구하시오. (g = 9.8 m/s²) :: 44.1 = ½ × 9.8 × t² → t² = 9 → t = 3 s, 수평 거리 = 4 × 3 = 12 m
