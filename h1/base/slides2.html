# 아날로그 신호의 디지털 변환 | 세상의 정보를 0과 1로 | 고등학교 통합과학1 · 01 과학의 기초 · 2차시 | 2022 개정 교육과정 [통과1 Ⅰ]

= 오늘의 학습 목표 | 2차시
^ **아날로그 신호**와 **디지털 신호**를 구별할 수 있다.
^ **표본화 → 양자화 → 부호화** 과정으로 디지털 변환을 설명할 수 있다.
^ 데이터 양을 계산하고 디지털 정보의 **장점과 활용**을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 아날로그·디지털 7분 → 변환 3단계(시뮬레이션) 15분 → 데이터 양 계산 10분 → 문항 8분

= 목소리는 어떻게 파일이 될까? | 생각 열기
* 🎤 녹음 앱 :: 내 목소리가 몇 MB짜리 파일로 저장된다
* 📸 사진 :: 풍경이 수백만 개의 점(픽셀)으로 바뀐다
* 🌡️ 디지털 온도계 :: 연속적인 온도를 숫자로 보여 준다
* 📞 영상 통화 :: 소리와 영상이 0과 1로 지구 반대편까지 간다
? 공기의 떨림(소리)은 끊김 없이 이어지는데, 컴퓨터는 0과 1만 다룬다. 어떻게 바꿀까? :: 일정한 간격으로 값을 뽑고(**표본화**), 정해진 단계로 어림하고(**양자화**), 2진수로 적는다(**부호화**).

= 지난 시간 복습 | 1차시
- 측정값은 최소 눈금의 [[1/10]]까지 어림한다.
- 측정값의 의미 있는 숫자 → [[유효 숫자]]
? 눈금을 어림해 숫자로 적는 일과 디지털 변환은 무엇이 닮았을까? :: 둘 다 연속적인 양을 **정해진 단계의 숫자**로 나타낸다. 단계가 촘촘할수록 원래 값에 가깝다.

## 아날로그와 디지털 | 연속과 불연속

= 아날로그 신호와 디지털 신호
| 구분 | 아날로그 신호 | 디지털 신호 |
|+ 값 | 시간에 따라 [[연속적]]으로 변함 | [[불연속적]]인 값 (0과 1) |
|+ 예 | 소리, 기온, 빛의 세기 | 컴퓨터 파일, 음원, 디지털 사진 |
|+ 복제·전송 | 잡음이 쌓여 정보가 손상되기 쉬움 | 잡음에 강해 거의 손상되지 않음 |

= 그래프로 보면 | 같은 신호, 두 가지 표현
C 아날로그 신호 | 시간 | 값 | 아날로그:0,3.5 0.5,4.84 1,5.97 1.5,6.73 2,7 2.5,6.73 3,5.97 3.5,4.84 4,3.5 4.5,2.16 5,1.03 5.5,0.27 6,0 6.5,0.27 7,1.03 7.5,2.16 8,3.5
||
C 3비트 디지털 신호 (0~7의 8단계) | 시간 | 값 | 디지털:0,4 1,4 1,6 2,6 2,7 3,7 3,6 4,6 4,4 5,4 5,1 6,1 6,0 7,0 7,1 8,1 8,4
~ 1 간격으로 표본화하고 가장 가까운 정수 단계로 양자화했다 → 계단 모양

## 디지털 변환 3단계 | 표본화 · 양자화 · 부호화

= 변환 과정
^+ **표본화**: 일정한 시간 간격으로 값을 추출
^+ **양자화**: 추출한 값을 정해진 단계로 어림
^+ **부호화**: 단계 값을 2진수(0과 1)로 나타냄
! n비트로 나타낼 수 있는 값의 가짓수 = 2ⁿ
>+ 3비트 → 2³ = **8단계**, 8비트 → 2⁸ = **256단계**, 16비트 → **65 536단계**

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#digital | [사인파]에서 표본화 간격 수와 양자화 비트를 바꾸며 복원 신호와 평균 오차를 비교하자.
% 간격 수만 바꾸기 → 비트만 바꾸기 → 둘 다 바꾸기 순서로 '데이터 양'과 '복원 정도'를 기록

= 표본화·양자화와 데이터 양 | 시뮬레이션 기록
| 표본화 간격 수 | 비트 | 데이터 양 (비트) | 복원 정도 |
|+ 12 | 3 | 39 | 거침 |
|+ 48 | 3 | 147 | 계단이 촘촘해짐 |
|+ 48 | 8 | 392 | 원래 신호와 거의 같음 |
- 데이터 양 = 표본 수(간격 수 + 1) × 비트 수 → (12 + 1) × 3 = [[39]]
>+ 표본화를 **촘촘히**, 비트를 **크게** 할수록 원래 신호에 가깝지만 데이터 양이 **늘어난다.**

= 예제 1 · 부호화해 보기 | 적용
- 0~7 V를 3비트(8단계, 1 V 간격)로 양자화한다. 측정값이 5.3 V이다.
^+ 양자화: 가장 가까운 단계 → **5**
^+ 부호화: 5 = 4 + 1 = 1×2² + 0×2¹ + 1×2⁰ → **101**
^+ 양자화 오차 = 5.3 − 5 = **0.3 V**
>+ 비트 수를 늘리면 단계 간격이 좁아져 양자화 오차가 줄어든다.

= 예제 2 · 음원 1초의 데이터 양 | 적용
- 1초에 44 100번 표본화하고 16비트로 양자화한다 (한 채널).
^+ 44 100 × 16 = **705 600 비트**
^+ 8비트 = 1바이트 → 705 600 ÷ 8 = 88 200 바이트 ≈ **88 kB**
^+ 스테레오(2채널)라면 × 2 = **1 411 200 비트/초**

= 예제 3 · 3분짜리 노래 | 적용
- 스테레오 1 411 200 비트/초로 3분(180초) 동안 녹음했다. (압축하지 않음)
^+ 1 411 200 × 180 = **254 016 000 비트**
^+ ÷ 8 = 31 752 000 바이트 ≈ **31.8 MB**
>+ 실제 음원 파일이 몇 MB로 작은 까닭: 사람이 잘 듣지 못하는 부분을 덜어 내는 **압축** 기술

= 확인 문제 1
Q 8비트로 양자화하면 나타낼 수 있는 값은 몇 가지인가?
o 8가지
o 16가지
o 64가지
o* 256가지
:: 2⁸ = 256가지

## 디지털 정보의 활용 | 센서와 과학 탐구

= 디지털 정보의 장점
+ 복제·전송 과정에서 **잡음에 강해** 정보가 거의 손상되지 않는다.
+ 저장·검색·가공(압축, 편집)이 **쉽다.**
+ 컴퓨터로 많은 데이터를 빠르게 **분석**할 수 있다.
>+ 센서 + 디지털 변환 → 사람이 직접 재기 어려운 아주 빠른·느린 변화도 자동 기록

= 생활 속 디지털 변환 | 사례
* 📱 스마트폰 센서 :: 마이크(소리), 조도 센서(빛), 가속도 센서(기울기), GPS(위치)
* 📷 디지털카메라 :: 빛의 세기를 픽셀마다 숫자로 저장
* 🌋 지진계 :: 땅의 흔들림을 디지털로 기록해 실시간 분석
* 🌦️ 자동 기상 관측 장비 :: 기온·기압·바람을 1분마다 기록
* 🏥 디지털 엑스선 :: 필름 없이 영상을 바로 확대·전송
* 🎵 음원 스트리밍 :: 압축된 디지털 음원을 전송

= 확인 문제 2
Q 디지털 변환 과정을 바르게 나열한 것은?
o 양자화 → 표본화 → 부호화
o* 표본화 → 양자화 → 부호화
o 부호화 → 표본화 → 양자화
o 표본화 → 부호화 → 양자화
:: 시간 간격으로 값을 뽑고(표본화), 단계로 어림한 뒤(양자화), 2진수로 적는다(부호화).

= 확인 문제 3
Q 원래 아날로그 신호에 더 가깝게 복원하는 방법으로 옳은 것은?
o 표본화 간격을 넓히고 비트 수를 줄인다
o* 표본화 간격을 좁히고 비트 수를 늘린다
o 표본화 간격만 넓힌다
o 데이터 양을 줄인다
:: 촘촘히 표본화하고 단계를 세밀하게 할수록 원래 신호에 가깝다(대신 데이터 양이 늘어난다).

= 확인 문제 4
Q 1초에 1000번 표본화하고 10비트로 양자화한 센서 신호 1분 분량의 데이터 양은?
o 10 000 비트
o 60 000 비트
o* 600 000 비트
o 6 000 000 비트
:: 1000 × 10 × 60 = 600 000 비트

= 서술형 도전 | 생각 넓히기
? 디지털 정보가 아날로그 정보보다 유리한 점을 두 가지 쓰시오. :: 복제·전송 과정에서 잡음에 강해 정보가 거의 손상되지 않는다. 저장·검색·가공(압축, 편집)이 쉽다.
? 센서와 디지털 변환 기술이 과학 탐구 방식을 어떻게 바꾸었는지 예를 들어 쓰시오. :: 사람이 직접 측정하기 어려운 아주 짧은 시간·긴 시간의 변화를 자동으로 기록하고, 많은 데이터를 컴퓨터로 분석해 규칙을 찾을 수 있게 되었다(기상 관측, 지진파 관측 등).

= 오늘 배운 내용 정리
- 연속적으로 변하는 신호 → [[아날로그]], 0과 1의 불연속 값 → [[디지털]]
- 변환: [[표본화]] → [[양자화]] → [[부호화]]
- n비트로 나타낼 수 있는 값 = [[2ⁿ]]가지
- 데이터 양 = 표본 수 × [[비트 수]]
- 촘촘한 표본화·큰 비트 → 원래 신호에 가깝지만 데이터 양 [[증가]]
