= 오늘의 학습 목표 | 1차시
^ 국제단위계(SI)의 **기본량**과 **유도량**을 구별하고 단위를 쓸 수 있다.
^ 측정 도구의 최소 눈금에 맞게 측정값을 **어림**하고 **유효 숫자**로 나타낼 수 있다.
^ 측정의 **정확도**와 **정밀도**를 구별하고 오차를 줄이는 방법을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 기본량·단위 10분 → 눈금 읽기·유효 숫자(시뮬레이션) 12분 → 정확도·정밀도 10분 → 문항 8분

= 1 kg은 누가 정했을까? | 생각 열기
* ⚖️ 국제 킬로그램 원기 :: 130년 동안 프랑스 금고 속 금속 덩어리가 1 kg의 기준이었다
* 📏 1 m :: 한때는 '지구 둘레의 4천만 분의 1'이었다
* ⏱️ 1초 :: 지금은 세슘 원자가 내는 빛의 진동으로 정한다
* 🌍 2019년 :: 모든 기본 단위를 자연 상수로 다시 정의했다
? 금속 덩어리를 기준으로 쓰면 어떤 문제가 생길까? :: 세월이 지나며 질량이 아주 조금씩 변할 수 있고, 손상될 위험이 있다. **변하지 않는 자연 상수**로 정의하면 언제 어디서나 같은 기준을 재현할 수 있다.

= 중학교에서 배운 내용 떠올리기 | 복습
| 물리량 | 단위 | 배운 곳 |
| 속력 | m/s | 중3 운동과 에너지 |
| 밀도 | g/cm³ | 중1·중2 물질의 특성 |
| 전류 | A | 중2 전기와 자기 |
| 온도 | ℃ | 중1 열 |
? 속력 단위 m/s는 어떤 단위들을 조합한 것일까? :: 길이(m) ÷ 시간(s). 이처럼 다른 양을 조합해 만든 양을 **유도량**이라 한다.

## 기본량과 단위 | 국제단위계(SI)

= 기본량과 유도량
! 기본량: 다른 물리량으로부터 유도되지 않는 기본적인 양 — SI는 7가지
| 기본량 | 길이 | 질량 | 시간 | 전류 | 온도 | 물질량 | 광도 |
|+ 단위 | m | kg | s | A | K | mol | cd |
- **유도량**: 기본량을 조합한 양 — 속력 m/s, 밀도 kg/m³, 힘 kg·m/s²(= N)
>+ 기본 단위는 **변하지 않는 자연 상수**를 기준으로 정의한다.

= 자연 상수로 정의한 단위
- **1 m**: 빛이 진공에서 ==1/299 792 458초== 동안 이동한 거리
- **1 s**: 세슘-133 원자가 내는 특정한 빛이 9 192 631 770번 진동하는 시간
- **1 kg**: 플랑크 상수를 기준으로 정의 (2019년부터)
>+ 빛의 속력 = 299 792 458 m/s로 **정해 놓고** 길이를 정의한 것!

= 예제 1 · 단위 바꾸기 | 적용
- 알루미늄의 밀도 2.7 g/cm³를 SI 단위(kg/m³)로 나타내시오.
^+ 1 g = 0.001 kg, 1 cm³ = 0.000 001 m³
^+ 2.7 g/cm³ = 2.7 × 0.001 kg ÷ 0.000 001 m³
^+ = **2700 kg/m³**
>+ g/cm³ → kg/m³는 **1000배**. 물 1 g/cm³ = 1000 kg/m³

= 확인 문제 1
Q 다음 중 SI 기본량이 아닌 것은?
o 전류
o 물질량
o* 속력
o 온도
:: 속력은 길이 ÷ 시간으로 나타내는 유도량이다.

= 원자에서 우주까지 | 자연의 규모
| 길이 | 대략의 크기 | 시간 | 대략의 크기 |
|+ 원자 | 10⁻¹⁰ m | 빛이 1 m를 가는 시간 | 약 3 × 10⁻⁹ s |
|+ 세포 | 10⁻⁵ m | 심장이 한 번 뛰는 시간 | 약 1 s |
|+ 사람 | 1 m | 사람의 일생 | 약 3 × 10⁹ s |
|+ 지구 지름 | 약 1.3 × 10⁷ m | 지구의 나이 (약 46억 년) | 약 1.4 × 10¹⁷ s |
|+ 우리은하 지름 | 약 10²¹ m | 우주의 나이 (약 138억 년) | 약 4.4 × 10¹⁷ s |
>+ 자연은 사람의 감각으로 직접 느낄 수 없는 아주 작고 큰 **규모**에 걸쳐 있다 → 이를 재기 위해 측정 기술이 발전해 왔다.
? 가장 짧은 시간과 가장 긴 거리는 어떻게 재었을까? :: 원자시계, 레이저, 망원경, 우주 탐사선 등 새로운 측정 기술로 사람의 경험 범위를 넓혀 왔다.
% 2022 개정 [10통과1-01-01] 해설: 원자와 우주를 시간·공간 차원에서 비교하며 규모의 의미와 필요성을 소개한다. 탐구 활동 '미시세계와 거시세계의 물체 크기에 따른 차이점 분석하기'와 연결할 수 있다.

## 측정과 어림 | 눈금을 읽는 법

= 시뮬레이션으로 확인하기 | 실험실
@ sim.html#measure | [눈금 읽기]에서 같은 물체를 1 cm 눈금 자와 1 mm 눈금 자로 각각 재어 보자. [정확도·정밀도]에서는 계통 오차와 우연 오차를 바꾸며 [10번 측정]을 해 보자.
% 눈금 읽기 → 정확도·정밀도 순서. 두 자로 잰 값의 자릿수 차이에 주목

= 최소 눈금의 1/10까지 어림
| 물체 | 1 cm 눈금 자 | 1 mm 눈금 자 |
|+ 연필 | 14.4 cm | 14.37 cm |
|+ 유효 숫자 개수 | [[3개]] | [[4개]] |
- 측정값은 최소 눈금의 ==1/10==까지 어림하여 읽는다.
>+ **유효 숫자**: 측정값에서 의미 있는 숫자 = 확실한 숫자 + 어림한 숫자 1자리

= 유효 숫자 세기 | 규칙
| 측정값 | 유효 숫자 | 까닭 |
|+ 14.37 cm | 4개 | 0이 아닌 숫자는 모두 유효 |
|+ 0.0250 kg | [[3개]] | 앞의 0은 자리 표시, 끝의 0은 어림한 값 |
|+ 12.30 cm | [[4개]] | 끝의 0도 측정한 값 |
|+ 1.20 × 10³ m | [[3개]] | 과학적 표기의 앞부분만 센다 |

= 예제 2 · 기록을 고쳐 보자 | 적용
- 최소 눈금이 1 mm인 자로 잰 길이를 "12.3 cm"로 기록했다.
^+ 최소 눈금 1 mm = 0.1 cm
^+ 그 1/10인 **0.01 cm** 자리까지 어림해야 한다.
^+ 바른 기록: **12.30 cm** (유효 숫자 4개)
>+ 끝의 0을 빼면 '1 cm 눈금 자로 잰 것'처럼 정보가 줄어든다.

## 정확도와 정밀도 | 참값과 흩어짐

= 정확도와 정밀도
- **정확도**: 측정값이 ==참값==에 가까운 정도
- **정밀도**: 여러 번 측정한 값들이 서로 ==가깝게 모인== 정도
| | 계통 오차 작음 | 계통 오차 큼 |
|+ 우연 오차 작음 | 정확 O, 정밀 O | 정확 X, 정밀 O |
|+ 우연 오차 큼 | 정확 O(평균), 정밀 X | 정확 X, 정밀 X |
>+ 우연 오차 → 여러 번 측정해 **평균**, 계통 오차 → **기기 보정**(영점 조절)

= 예제 3 · 두 저울 비교 | 자료 해석
- 참값 10.00 g인 추를 두 저울로 4번씩 쟀다.
| 저울 | 1회 | 2회 | 3회 | 4회 |
| A | 10.21 | 10.20 | 10.22 | 10.21 |
| B | 9.8 | 10.3 | 9.9 | 10.0 |
^+ A 평균 = 40.84 ÷ 4 = **10.21 g** → 값이 모여 있지만 참값과 차이 → 정밀 O, 정확 X (계통 오차)
^+ B 평균 = 40.0 ÷ 4 = **10.0 g** → 평균은 참값에 가깝지만 흩어짐 → 정확 O, 정밀 X (우연 오차)
^+ A는 **영점 조절**, B는 **측정 횟수 늘리기**로 개선

= 예제 4 · 어림으로 규모 짐작하기 | 적용
- 우리 학교 학생 모두가 1년 동안 마시는 물의 양은? (학생 약 600명, 1인당 하루 약 1 L, 등교일 약 190일)
^+ 하루: 600 × 1 L = **600 L**
^+ 1년: 600 × 190 = **114 000 L ≈ 1 × 10⁵ L**
>+ 어림의 핵심은 정확한 값이 아니라 **근거 있는 가정**과 **자릿수(규모)** 판단

= 생활 속 측정과 단위 | 사례
* 🛰️ GPS :: 위성 시계의 아주 작은 시간 오차도 수 m의 위치 오차가 된다
* 💊 약 조제 :: mg 단위의 정밀한 측정이 필요하다
* 🏃 100 m 기록 :: 0.01초까지 재어 유효 숫자를 맞춘다
* 🍳 요리 저울 :: 영점(0) 조절을 하지 않으면 계통 오차가 생긴다
* 🌡️ 체온계 :: 여러 번 재어 평균을 내면 더 믿을 만하다
* 🚀 화성 탐사선 :: 단위(파운드·뉴턴) 혼동으로 실패한 사례가 있다

= 확인 문제 2
Q 0.0250 kg의 유효 숫자 개수는?
o 2개
o* 3개
o 4개
o 5개
:: 앞의 0 두 개는 자리를 나타낼 뿐이고, 2·5·끝의 0이 유효 숫자이다.

= 확인 문제 3
Q 측정값들이 서로 가깝게 모여 있지만 모두 참값보다 크게 나왔다. 이에 대한 설명으로 옳은 것은?
o 정확도와 정밀도가 모두 높다
o* 정밀도는 높지만 계통 오차가 있다
o 우연 오차가 크다
o 측정 횟수를 늘리면 해결된다
:: 값이 모여 있으니 정밀도는 높고, 한쪽으로 치우친 것은 계통 오차 — 기기 보정이 필요하다.

= 확인 문제 4
Q 최소 눈금이 1 mL인 눈금실린더로 측정한 값의 기록으로 가장 알맞은 것은?
o 35 mL
o* 35.0 mL
o 35.00 mL
o 35.000 mL
:: 최소 눈금 1 mL의 1/10인 0.1 mL 자리까지 어림하여 기록한다.

= 서술형 도전 | 생각 넓히기
? 과학자들이 질량의 기준을 금속 원기에서 플랑크 상수로 바꾼 까닭을 쓰시오. :: 금속 원기는 시간이 지나며 질량이 조금씩 변하거나 손상될 위험이 있다. 자연 상수로 정의하면 언제 어디서나 같은 기준을 재현할 수 있다.
? 우연 오차와 계통 오차를 줄이는 방법을 각각 쓰시오. :: 우연 오차는 여러 번 측정하여 평균을 내어 줄이고, 계통 오차는 측정 기기를 보정(영점 조절 등)하거나 측정 방법을 바로잡아 줄인다.

= 오늘 배운 내용 정리
- SI 기본량 [[7]]가지: 길이 m, 질량 kg, 시간 s, 전류 [[A]], 온도 [[K]], 물질량 mol, 광도 cd
- 기본량을 조합한 양 → [[유도량]] (속력 m/s, 밀도 kg/m³)
- 측정값은 최소 눈금의 [[1/10]]까지 어림 → [[유효 숫자]]
- 참값에 가까운 정도 [[정확도]], 서로 모인 정도 [[정밀도]]
- 우연 오차 → 평균, 계통 오차 → [[기기 보정]]

= 나가기 전 한 문제 | 형성평가
? 최소 눈금이 0.1 g인 전자저울이 아니라 1 g 눈금 저울로 잰 값을 '23.47 g'으로 기록했다. 잘못된 점을 고치시오. :: 1 g 눈금의 1/10인 0.1 g 자리까지만 어림할 수 있으므로 '23.5 g'처럼 소수 첫째 자리까지 기록해야 한다.
